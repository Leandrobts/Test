<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
input {
    width: 300px;
    height: 50px;
    font-size: 18px;
}
</style>
</head>
<body>
<input id="input" type="text" list="list">
<datalist id="list">
    <option value="a">
    <option value="b">
</datalist>

<script>
(function() {
    const input = document.getElementById('input');

    // Tenta forçar GC da forma mais agressiva possível no browser
function gc() {
    function gcRec(n) {
          if (n < 1)
              return {};
          var temp = {i: "ab" + i + (i / 100000)};
          temp += "foo";
          gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
    gcRec(10);
}

    input.addEventListener('click', function handler(e) {
        // Remove o listener para rodar só uma vez (equivalente ao {once: true})
        input.removeEventListener('click', handler);

        // Muda o tipo enquanto a interação ainda está acontecendo
        input.type = 'button';

        // Força GC
        gc();

        // Pequeno delay para dar tempo do GC / destruição de objetos
        setTimeout(() => {
            document.body.insertAdjacentHTML('beforeend',
                '<p style="color:green;font-weight:bold">PASS if no crash</p>');
        }, 50);
    });

    // Dispara o clique programaticamente (mais confiável no PS4 do que esperar clique do usuário)
    // Se preferir clique manual, comente as duas linhas abaixo.
    setTimeout(() => {
        input.focus();
        input.click();
    }, 100);
})();
</script>
</body>
</html>
