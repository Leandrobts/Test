<!DOCTYPE html>
<html>
<body>
<script>

function gc() {
    function gcRec(n) {
          if (n < 1)
              return {};
          var temp = {i: "ab" + i + (i / 100000)};
          temp += "foo";
          gcRec(n-1);
    }
    for (var i = 0; i < 1000; i++)
    gcRec(10);
}


// Estressa a race condition entre o GC thread e a thread principal
function triggerRace() {
    for (let i = 0; i < 2000; i++) {
        let xhr = new XMLHttpRequest();
        xhr.open("GET", "data:text/xml,<root><child/></root>", true);
        
        // Acessa o getter de upload e força parsing do document
        let upload = xhr.upload;
        xhr.responseType = "document";
        xhr.send();

        // Força limpeza dos buffers / reset do estado na main thread
        xhr.abort();

        // Aloca objetos para forçar o GC thread a disparar visitAdditionalChildren
        if (i % 20 === 0 && window.GCController) {
           gc();
        }
    }
}

try {
    triggerRace();
    document.body.innerText = "PASS: Sem crash por UAF durante GC concorrente.";
} catch (e) {
    document.body.innerText = "FAIL: " + e;
}

</script>
</body>
</html>
