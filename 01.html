<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4/PS5 Offset Scanner - SlopKit Port</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0a;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            padding: 20px;
            border-bottom: 2px solid #00ff41;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            text-shadow: 0 0 10px #00ff41;
        }
        
        .header .subtitle {
            color: #00cc33;
            font-size: 0.9em;
            margin-top: 10px;
        }
        
        .platform-info {
            background: #111;
            border: 1px solid #00ff41;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        
        .platform-info .label {
            color: #888;
        }
        
        .platform-info .value {
            color: #00ff41;
            font-weight: bold;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        button {
            background: #111;
            color: #00ff41;
            border: 1px solid #00ff41;
            padding: 10px 20px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 3px;
        }
        
        button:hover {
            background: #00ff41;
            color: #0a0a0a;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .progress-container {
            background: #111;
            border: 1px solid #333;
            padding: 10px;
            margin: 10px 0;
            border-radius: 3px;
        }
        
        .progress-bar {
            background: #00ff41;
            height: 20px;
            transition: width 0.3s;
            border-radius: 2px;
        }
        
        .progress-text {
            float: right;
            margin-top: -18px;
            color: #0a0a0a;
            font-weight: bold;
            padding-right: 5px;
        }
        
        .log-container {
            background: #111;
            border: 1px solid #333;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            margin: 10px 0;
            border-radius: 3px;
            font-size: 0.85em;
        }
        
        .log-entry {
            padding: 2px 0;
            border-bottom: 1px solid #1a1a1a;
        }
        
        .log-entry .timestamp {
            color: #666;
            margin-right: 10px;
        }
        
        .log-entry.success {
            color: #00ff41;
        }
        
        .log-entry.error {
            color: #ff4444;
        }
        
        .log-entry.warning {
            color: #ffaa00;
        }
        
        .log-entry.info {
            color: #44aaff;
        }
        
        .results-container {
            margin-top: 20px;
            background: #111;
            border: 1px solid #00ff41;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }
        
        .results-container.active {
            display: block;
        }
        
        .result-section {
            margin: 10px 0;
            padding: 10px;
            border-left: 3px solid #00ff41;
        }
        
        .result-section .title {
            color: #00ff41;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            font-size: 0.9em;
        }
        
        .result-item .offset {
            color: #ffaa00;
        }
        
        .result-item .value {
            color: #44aaff;
        }
        
        .copy-btn {
            background: #222;
            border: 1px solid #444;
            color: #00ff41;
            padding: 5px 10px;
            font-size: 0.8em;
            margin-top: 10px;
        }
        
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }
        
        .status-indicator.running {
            background: #ffaa00;
            animation: blink 1s infinite;
        }
        
        .status-indicator.success {
            background: #00ff41;
        }
        
        .status-indicator.error {
            background: #ff4444;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .firmware-select {
            background: #111;
            color: #00ff41;
            border: 1px solid #00ff41;
            padding: 10px;
            font-family: 'Courier New', monospace;
            min-width: 120px;
        }
        
        .firmware-select option {
            background: #111;
        }
        
        .memory-usage {
            font-size: 0.8em;
            color: #666;
            margin-top: 5px;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5em;
            }
            
            .controls {
                flex-direction: column;
            }
            
            .result-item {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 PS4/PS5 Offset Scanner</h1>
            <div class="subtitle">SlopKit Port - WebKit Memory Offset Discovery</div>
        </div>

        <!-- Platform Info -->
        <div class="platform-info">
            <div><span class="label">Plataforma:</span> <span class="value" id="platform">Detectando...</span></div>
            <div><span class="label">Firmware:</span> <span class="value" id="firmware">Detectando...</span></div>
            <div><span class="label">User Agent:</span> <span class="value" id="userAgent" style="font-size:0.8em;word-break:break-all;"></span></div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <select id="scanMode" class="firmware-select">
                <option value="auto">Auto-detect</option>
                <option value="ps4">PS4</option>
                <option value="ps5">PS5</option>
            </select>
            
            <button id="startScanBtn" onclick="startScan()">▶ Iniciar Scan</button>
            <button id="stopScanBtn" onclick="stopScan()" disabled>⏹ Parar</button>
            <button onclick="exportResults()">📤 Exportar Offsets</button>
            <button onclick="clearLogs()">🗑 Limpar Log</button>
        </div>

        <!-- Progress -->
        <div class="progress-container" id="progressContainer" style="display:none;">
            <div class="progress-bar" id="progressBar" style="width:0%"></div>
            <div class="progress-text" id="progressText">0%</div>
        </div>

        <!-- Status -->
        <div style="margin: 10px 0;">
            <span id="statusIndicator" class="status-indicator"></span>
            <span id="statusText">Pronto</span>
            <span style="margin-left:20px;font-size:0.8em;color:#666;" id="attemptCount">Tentativas: 0</span>
        </div>

        <!-- Log -->
        <div class="log-container" id="logContainer">
            <div class="log-entry info">
                <span class="timestamp">[SISTEMA]</span>
                Scanner de offsets inicializado. Aguardando início...
            </div>
        </div>

        <!-- Results -->
        <div class="results-container" id="resultsContainer">
            <h3 style="color:#00ff41;margin-bottom:15px;">📊 Offsets Encontrados</h3>
            
            <div id="resultsContent">
                <!-- Resultados serão inseridos aqui dinamicamente -->
            </div>
            
            <button class="copy-btn" onclick="copyResults()">📋 Copiar Offsets</button>
            <button class="copy-btn" onclick="generateMainJS()">⚙ Gerar main.js adaptado</button>
        </div>
    </div>

    <script>
        // ================================================================
        // CORE SCANNER
        // ================================================================

        let scanning = false;
        let shouldStop = false;
        let scanResults = {};
        let logEntries = [];
        let attemptCounter = 0;
        let platform = 'unknown';
        let firmware = 'unknown';

        // Configurações de scan
        const SCAN_CONFIG = {
            // PS4: offset da VTable do textarea (tentar vários valores)
            textareaVTableOffsets: [0x00, 0x08, 0x10, 0x18, 0x20, 0x28, 0x30],
            
            // PS5: valores conhecidos
            ps5TextareaVTableOffset: 0x18,
            
            // Ranges de busca para imports
            importSearchRange: { start: 0x0, end: 0x10000, step: 0x8 },
            
            // Padrões conhecidos para identificar funções
            functionPatterns: {
                memset: [0x48, 0x89, 0xF8, 0x48, 0x89, 0xD1], // Exemplo
                memcpy: [0x48, 0x89, 0xF8, 0x48, 0x89, 0xD1],
                strcmp: [0x48, 0x89, 0xF8, 0x48, 0x89, 0xD1],
                pthread_create: [0x48, 0x89, 0xF8, 0x48, 0x89, 0xD1]
            }
        };

        // ================================================================
        // UTILITY FUNCTIONS
        // ================================================================

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const entry = { timestamp, message, type };
            logEntries.push(entry);
            
            const logContainer = document.getElementById('logContainer');
            const div = document.createElement('div');
            div.className = `log-entry ${type}`;
            div.innerHTML = `<span class="timestamp">[${timestamp}]</span> ${message}`;
            logContainer.appendChild(div);
            logContainer.scrollTop = logContainer.scrollHeight;
            
            // Atualiza status
            document.getElementById('statusText').textContent = message;
            const indicator = document.getElementById('statusIndicator');
            indicator.className = `status-indicator ${type === 'error' ? 'error' : type === 'success' ? 'success' : 'running'}`;
        }

        function updateProgress(percent, text) {
            const container = document.getElementById('progressContainer');
            const bar = document.getElementById('progressBar');
            const textEl = document.getElementById('progressText');
            
            if (percent > 0) {
                container.style.display = 'block';
            }
            
            bar.style.width = `${Math.min(percent, 100)}%`;
            textEl.textContent = text || `${Math.round(percent)}%`;
        }

        function setStatus(text, type = 'info') {
            document.getElementById('statusText').textContent = text;
            const indicator = document.getElementById('statusIndicator');
            indicator.className = `status-indicator ${type}`;
        }

        function updateAttemptCount() {
            document.getElementById('attemptCount').textContent = `Tentativas: ${attemptCounter}`;
        }

        function hex(value) {
            if (value === undefined || value === null) return 'N/A';
            if (typeof value === 'number') {
                return '0x' + value.toString(16).padStart(8, '0');
            }
            return String(value);
        }

        function isPS4() {
            return navigator.userAgent.includes('PlayStation 4');
        }

        function isPS5() {
            return navigator.userAgent.includes('PlayStation 5');
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // ================================================================
        // CORE SCAN FUNCTIONS
        // ================================================================

        async function initializeCore() {
            log('Inicializando core do scanner...', 'info');
            
            try {
                // Carrega core.js e mem.js dinamicamente
                await loadScript('/resources/core.js');
                await loadScript('/resources/mem.js');
                await loadScript('/resources/int64.js');
                
                log('Core carregado com sucesso!', 'success');
                return true;
            } catch (e) {
                log(`Erro ao carregar core: ${e.message}`, 'error');
                return false;
            }
        }

        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                script.onerror = () => reject(new Error(`Falha ao carregar ${src}`));
                document.body.appendChild(script);
            });
        }

        async function detectPlatform() {
            const ua = navigator.userAgent;
            document.getElementById('userAgent').textContent = ua;
            
            if (isPS5()) {
                platform = 'ps5';
                log('Plataforma detectada: PS5', 'info');
            } else if (isPS4()) {
                platform = 'ps4';
                log('Plataforma detectada: PS4', 'info');
            } else {
                platform = 'unknown';
                log('⚠️ Plataforma não reconhecida. Tentando modo compatibilidade.', 'warning');
            }
            
            document.getElementById('platform').textContent = platform.toUpperCase();
            
            // Detecta firmware
            const fwMatch = /PlayStation [45]\/(\d+\.\d+)/.exec(ua);
            if (fwMatch) {
                firmware = fwMatch[1];
                document.getElementById('firmware').textContent = firmware;
                log(`Firmware detectado: ${firmware}`, 'info');
            } else {
                document.getElementById('firmware').textContent = 'Desconhecido';
                log('⚠️ Não foi possível detectar o firmware', 'warning');
            }
            
            return { platform, firmware };
        }

        // ================================================================
        // OFFSET SCANNING
        // ================================================================

        async function scanTextareaVTableOffset(p) {
            log('🔍 Procurando offset da VTable do textarea...', 'info');
            
            const offsets = platform === 'ps5' 
                ? [0x18] // PS5 conhecido
                : SCAN_CONFIG.textareaVTableOffsets; // PS4: tenta vários
            
            let found = null;
            let foundVTable = null;
            
            for (const offset of offsets) {
                if (shouldStop) break;
                
                attemptCounter++;
                updateAttemptCount();
                updateProgress((attemptCounter / 20) * 100, `Testando offset 0x${offset.toString(16)}`);
                
                try {
                    const textArea = document.createElement('textarea');
                    const leakVal = p.leakval ? p.leakval(textArea) : null;
                    
                    if (!leakVal) {
                        log(`❌ Falha ao vazar endereço do textarea (offset 0x${offset.toString(16)})`, 'error');
                        continue;
                    }
                    
                    // PS4: tenta ler usando o offset atual
                    let vtPtr = p.read8(leakVal.add32(offset));
                    let vtable = p.read8(vtPtr);
                    
                    // Verifica se a VTable parece válida
                    if (vtable && vtable > 0x100000000 && vtable < 0x500000000) {
                        // Verifica se o primeiro elemento da VTable é um endereço válido
                        let firstElement = p.read8(vtable);
                        if (firstElement > 0x100000000 && firstElement < 0x500000000) {
                            found = offset;
                            foundVTable = vtable;
                            log(`✅ Encontrado offset da VTable: 0x${offset.toString(16)} (VTable em ${hex(vtable)})`, 'success');
                            break;
                        }
                    }
                } catch (e) {
                    // Silenciosamente continua
                }
                
                await sleep(50);
            }
            
            if (!found) {
                log('❌ Não foi possível encontrar o offset da VTable do textarea', 'error');
                return null;
            }
            
            return { offset: found, vtable: foundVTable };
        }

        async function scanImports(p, baseAddress) {
            log('🔍 Procurando imports do WebKit...', 'info');
            
            const imports = {
                memset: null,
                memcpy: null,
                strcmp: null,
                __stack_chk_guard: null
            };
            
            // Tenta encontrar imports de forma inteligente
            // 1. Primeiro, tenta encontrar a seção de imports pela VTable
            if (baseAddress) {
                log(`Base WebKit: ${hex(baseAddress)}`, 'info');
                
                // Procura por padrões conhecidos
                const searchStart = baseAddress;
                const searchEnd = baseAddress + 0x100000; // 1MB
                
                // Padrões de busca (simplificados)
                const patterns = {
                    memset: [0x48, 0x89, 0xF8, 0x48, 0x89, 0xD1],
                    memcpy: [0x48, 0x89, 0xF8, 0x48, 0x89, 0xD1],
                    strcmp: [0x48, 0x89, 0xF8, 0x48, 0x89, 0xD1]
                };
                
                for (const [name, pattern] of Object.entries(patterns)) {
                    if (shouldStop) break;
                    
                    const offset = await scanForPattern(p, searchStart, searchEnd, pattern);
                    if (offset !== null) {
                        imports[name] = offset;
                        log(`✅ Encontrado ${name} em ${hex(offset)}`, 'success');
                    }
                }
            }
            
            return imports;
        }

        async function scanForPattern(p, start, end, pattern) {
            // Busca um padrão de bytes na memória
            // Nota: Esta é uma implementação simplificada
            // Na prática, você precisaria de um scanner mais sofisticado
            
            const patternBytes = new Uint8Array(pattern);
            const buffer = new Uint8Array(0x1000);
            
            for (let addr = start; addr < end; addr += 0x8) {
                if (shouldStop) break;
                
                try {
                    // Lê um bloco de memória
                    // Nota: Isso precisa ser adaptado para usar a primitiva de leitura
                    // let success = p.readInto(buffer, addr, buffer.length);
                    // if (success) {
                    //     // Compara padrão
                    // }
                } catch (e) {
                    continue;
                }
            }
            
            return null;
        }

        async function scanKernelOffsets(p, libKernelBase) {
            log('🔍 Procurando offsets do kernel...', 'info');
            
            const offsets = {
                thread_list: null,
                worker_wait_return: null,
                pthread_create_name_np: null,
                security_flags: null,
                targetid: null,
                qa_flags: null,
                utoken_flags: null,
                rootvnode: null
            };
            
            // Tenta encontrar os offsets através de padrões conhecidos
            // Isso é específico para cada firmware
            
            if (libKernelBase) {
                log(`Base do Kernel: ${hex(libKernelBase)}`, 'info');
                
                // Procura por strings conhecidas
                const knownStrings = {
                    thread_list: 'thread_list',
                    worker_wait_return: 'worker_wait_return'
                };
                
                // Para cada string conhecida, tenta encontrar na memória do kernel
                for (const [name, str] of Object.entries(knownStrings)) {
                    if (shouldStop) break;
                    
                    // Busca a string
                    const offset = await scanForString(p, libKernelBase, libKernelBase + 0x100000, str);
                    if (offset !== null) {
                        offsets[name] = offset;
                        log(`✅ Encontrado ${name} em ${hex(offset)}`, 'success');
                    }
                }
            }
            
            return offsets;
        }

        async function scanForString(p, start, end, str) {
            // Busca uma string na memória
            // Implementação simplificada
            return null;
        }

        // ================================================================
        // MAIN SCAN FUNCTION
        // ================================================================

        async function startScan() {
            if (scanning) return;
            
            scanning = true;
            shouldStop = false;
            scanResults = {};
            attemptCounter = 0;
            
            const startBtn = document.getElementById('startScanBtn');
            const stopBtn = document.getElementById('stopScanBtn');
            startBtn.disabled = true;
            stopBtn.disabled = false;
            
            document.getElementById('resultsContainer').classList.remove('active');
            document.getElementById('progressContainer').style.display = 'block';
            setStatus('Iniciando scan...', 'running');
            
            try {
                // 1. Detecta plataforma
                await detectPlatform();
                
                // 2. Inicializa core
                const coreReady = await initializeCore();
                if (!coreReady) {
                    throw new Error('Falha ao inicializar o core');
                }
                
                // 3. Verifica se as primitivas estão disponíveis
                if (typeof window.p === 'undefined') {
                    log('⚠️ Primitivas de memória não disponíveis. Tentando estabelecer...', 'warning');
                    // Tenta estabelecer primitiva
                    try {
                        if (typeof establishPrimitive === 'function') {
                            const carrier = await establishPrimitive({ 
                                maxAttempts: 10,
                                onEvent: (tag, detail) => log(`[core] ${tag}: ${detail}`, 'info')
                            });
                            
                            if (typeof installWindowP === 'function') {
                                installWindowP(carrier, { promote: true, onEvent: (tag, detail) => log(`[mem] ${tag}: ${detail}`, 'info') });
                                log('✅ Primitivas de memória estabelecidas!', 'success');
                            }
                        }
                    } catch (e) {
                        log(`❌ Falha ao estabelecer primitivas: ${e.message}`, 'error');
                    }
                }
                
                // 4. Se temos p, faz o scan
                if (typeof window.p !== 'undefined') {
                    const p = window.p;
                    
                    // 4.1 Scan VTable do textarea
                    const vtableResult = await scanTextareaVTableOffset(p);
                    if (vtableResult) {
                        scanResults.textarea_vtable_offset = vtableResult.offset;
                        scanResults.textarea_vtable = vtableResult.vtable;
                    }
                    
                    // 4.2 Tenta encontrar base do WebKit
                    if (scanResults.textarea_vtable) {
                        // Usa a VTable para encontrar a base
                        // PS5: base = vtable - wk_vtable_first_element
                        // PS4: Similar, mas com offset diferente
                        const wkBase = scanResults.textarea_vtable - 0x0; // Ajustar
                        if (wkBase > 0x100000000 && wkBase < 0x500000000) {
                            scanResults.webkit_base = wkBase;
                            log(`✅ Base do WebKit: ${hex(wkBase)}`, 'success');
                            
                            // 4.3 Scan imports
                            const imports = await scanImports(p, wkBase);
                            Object.assign(scanResults, imports);
                        }
                    }
                    
                    // 4.4 Tenta encontrar base do Kernel
                    if (scanResults.webkit_base && scanResults.__stack_chk_guard) {
                        // Calcula base do kernel
                        const kernelBase = scanResults.__stack_chk_guard - 0x0; // Ajustar
                        if (kernelBase > 0x100000000 && kernelBase < 0x400000000) {
                            scanResults.kernel_base = kernelBase;
                            log(`✅ Base do Kernel: ${hex(kernelBase)}`, 'success');
                            
                            // 4.5 Scan kernel offsets
                            const kernelOffsets = await scanKernelOffsets(p, kernelBase);
                            Object.assign(scanResults, kernelOffsets);
                        }
                    }
                    
                    updateProgress(100, 'Scan completo!');
                    setStatus('Scan completo!', 'success');
                    
                    // Mostra resultados
                    displayResults(scanResults);
                    
                } else {
                    log('❌ Primitivas de memória não disponíveis. Scan abortado.', 'error');
                    setStatus('Falha - sem primitivas', 'error');
                }
                
            } catch (error) {
                log(`❌ Erro durante o scan: ${error.message}`, 'error');
                setStatus(`Erro: ${error.message}`, 'error');
            } finally {
                scanning = false;
                startBtn.disabled = false;
                stopBtn.disabled = true;
            }
        }

        function stopScan() {
            shouldStop = true;
            log('⏹ Scan interrompido pelo usuário', 'warning');
            setStatus('Interrompido', 'warning');
        }

        // ================================================================
        // RESULTS DISPLAY
        // ================================================================

        function displayResults(results) {
            const container = document.getElementById('resultsContainer');
            const content = document.getElementById('resultsContent');
            
            container.classList.add('active');
            
            let html = '';
            
            // Organiza resultados por categoria
            const categories = {
                'WebKit': ['webkit_base', 'textarea_vtable_offset', 'textarea_vtable'],
                'Imports': ['memset', 'memcpy', 'strcmp', '__stack_chk_guard'],
                'Kernel': ['kernel_base', 'thread_list', 'worker_wait_return', 'pthread_create_name_np'],
                'Segurança': ['security_flags', 'targetid', 'qa_flags', 'utoken_flags', 'rootvnode']
            };
            
            for (const [category, keys] of Object.entries(categories)) {
                const items = keys.filter(k => results[k] !== undefined && results[k] !== null);
                if (items.length === 0) continue;
                
                html += `<div class="result-section">`;
                html += `<div class="title">📁 ${category}</div>`;
                
                for (const key of items) {
                    const value = results[key];
                    const displayValue = typeof value === 'number' ? hex(value) : String(value);
                    html += `
                        <div class="result-item">
                            <span>${key}</span>
                            <span class="value">${displayValue}</span>
                        </div>
                    `;
                }
                
                html += `</div>`;
            }
            
            // Adiciona informações gerais
            html += `
                <div class="result-section" style="border-color:#666;">
                    <div class="title">ℹ️ Informações</div>
                    <div class="result-item"><span>Plataforma</span><span class="value">${platform.toUpperCase()}</span></div>
                    <div class="result-item"><span>Firmware</span><span class="value">${firmware}</span></div>
                    <div class="result-item"><span>Tentativas</span><span class="value">${attemptCounter}</span></div>
                </div>
            `;
            
            content.innerHTML = html;
        }

        // ================================================================
        // EXPORT FUNCTIONS
        // ================================================================

        function exportResults() {
            if (Object.keys(scanResults).length === 0) {
                log('❌ Nenhum resultado para exportar', 'error');
                return;
            }
            
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            const filename = `offsets_${platform}_${firmware}_${timestamp}.js`;
            
            let js = `// Offsets encontrados para ${platform.toUpperCase()} (${firmware})\n`;
            js += `// Gerado em: ${new Date().toLocaleString()}\n\n`;
            js += `const OFFSETS = {\n`;
            
            for (const [key, value] of Object.entries(scanResults)) {
                if (typeof value === 'number') {
                    js += `    ${key}: 0x${value.toString(16).padStart(8, '0')},\n`;
                } else if (typeof value === 'string') {
                    js += `    ${key}: '${value}',\n`;
                }
            }
            
            js += `};\n\n`;
            js += `export default OFFSETS;\n`;
            js += `// Pode ser usado com: import OFFSETS from './offsets_${platform}_${firmware}.js';\n`;
            
            // Download
            const blob = new Blob([js], { type: 'application/javascript' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            log(`📤 Offsets exportados como ${filename}`, 'success');
        }

        function copyResults() {
            let text = `// Offsets para ${platform.toUpperCase()} (${firmware})\n\n`;
            
            for (const [key, value] of Object.entries(scanResults)) {
                if (typeof value === 'number') {
                    text += `${key}: 0x${value.toString(16).padStart(8, '0')},\n`;
                } else {
                    text += `${key}: '${value}',\n`;
                }
            }
            
            navigator.clipboard.writeText(text).then(() => {
                log('📋 Offsets copiados para a área de transferência!', 'success');
            }).catch(() => {
                log('❌ Falha ao copiar offsets', 'error');
            });
        }

        function generateMainJS() {
            log('⚙ Gerando main.js adaptado...', 'info');
            
            if (Object.keys(scanResults).length === 0) {
                log('❌ Nenhum offset encontrado para gerar o main.js', 'error');
                return;
            }
            
            // Aqui você pode gerar um main.js adaptado com os offsets encontrados
            // Esta é uma funcionalidade avançada que pode ser implementada
            
            log('ℹ️ Função em desenvolvimento. Use os offsets exportados para atualizar manualmente o main.js', 'info');
        }

        function clearLogs() {
            const container = document.getElementById('logContainer');
            container.innerHTML = `
                <div class="log-entry info">
                    <span class="timestamp">[SISTEMA]</span>
                    Logs limpos. Pronto para novo scan.
                </div>
            `;
            logEntries = [];
        }

        // ================================================================
        // INIT
        // ================================================================

        // Detecta plataforma automaticamente na carga
        detectPlatform();

        log('✅ Scanner de offsets pronto! Clique em "Iniciar Scan" para começar.', 'success');
        setStatus('Pronto para scan', 'info');

        // ================================================================
        // AUTO-START (opcional)
        // ================================================================

        // Descomente para iniciar automaticamente
        // setTimeout(startScan, 2000);

    </script>
</body>
