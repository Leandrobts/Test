<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<title>Lifecycle Test</title><style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

#root {
    width: 100%;
    height: 100%;
    contain: layout;
}

.container {
    width: 95%;
    height: 45%;
    margin: 1%;
    overflow: auto;
    border: 1px solid transparent;
}

.frame {
    width: 90%;
    height: 80px;
    border: 0;
}

.stress {
    display: block;
    width: 1px;
    height: 1px;
}
</style></head><body><div id="root"><div id="containerA" class="container">

    <iframe
        id="frameA"
        class="frame"
        src="about:blank">
    </iframe>

    <div id="innerA">
        <div id="a1">
            <div id="a2">
                <div id="a3">
                    <span id="a4">A</span>
                </div>
            </div>
        </div>
    </div>

</div>


<div id="containerB" class="container">

    <iframe
        id="frameB"
        class="frame"
        src="about:blank">
    </iframe>

    <div id="innerB">
        <div id="b1">
            <div id="b2">
                <div id="b3">
                    <span id="b4">B</span>
                </div>
            </div>
        </div>
    </div>

</div>

</div><script>

(function () {

    var root = document.getElementById("root");
    var containerA = document.getElementById("containerA");
    var containerB = document.getElementById("containerB");

    var frameA = document.getElementById("frameA");
    var frameB = document.getElementById("frameB");

    var innerA = document.getElementById("innerA");
    var innerB = document.getElementById("innerB");

    var phase = 0;


    function mark(value) {
        try {
            localStorage.setItem(
                "webkit_lifecycle_last_phase",
                value
            );
        } catch (e) {
        }
    }


    function forceLayout() {
        try {
            void document.body.offsetHeight;
            void root.offsetHeight;
            void containerA.offsetHeight;
            void containerB.offsetHeight;
        } catch (e) {
        }
    }


    function buildFrameA() {

        try {

            var d = frameA.contentDocument;

            d.open();

            d.write(
                '<!DOCTYPE html>' +
                '<html>' +
                '<head>' +
                '<meta charset="UTF-8">' +
                '<style>' +
                'html,body{margin:0;padding:0;height:100%;}' +
                '#box{height:200px;width:200px;overflow:auto;}' +
                '#inner{height:1000px;width:1000px;}' +
                '</style>' +            '</head>' +
            '<body>' +
            '<div id="box">' +
            '<div id="inner">' +
            '<a id="navigation" href="about:blank">NAVIGATE</a>' +
            '</div>' +
            '</div>' +
            '</body>' +
            '</html>'
        );

        d.close();

    } catch (e) {
    }
}


function buildFrameB() {

    try {

        var d = frameB.contentDocument;

        d.open();

        d.write(
            '<!DOCTYPE html>' +
            '<html>' +
            '<head>' +
            '<meta charset="UTF-8">' +
            '<style>' +
            'html,body{margin:0;padding:0;}' +
            '#outer{height:500px;width:500px;}' +
            '#x{height:300px;width:300px;}' +
            '</style>' +
            '</head>' +
            '<body>' +
            '<div id="outer">' +
            '<div id="x">' +
            '<div id="y">' +
            '<span id="z">B</span>' +
            '</div>' +
            '</div>' +
            '</div>' +
            '</body>' +
            '</html>'
        );

        d.close();

    } catch (e) {
    }
}


function navigateFrameA() {

    mark("03-navigation-start");

    try {

        var d = frameA.contentDocument;
        var link = d.getElementById("navigation");

        if (link)
            link.click();
        else
            frameA.src = "about:blank";

    } catch (e) {

        try {
            frameA.src = "about:blank";
        } catch (ignore) {
        }
    }
}


function mutateParentBeforeDetach() {

    mark("04-parent-mutation");

    try {

        var replacement = document.createElement("div");

        replacement.id = "replacement";

        replacement.style.width = "50%";
        replacement.style.height = "50px";
        replacement.style.overflow = "hidden";

        for (var i = 0; i < 16; i++) {

            var n = document.createElement("div");

            n.style.width = (100 + i) + "px";
            n.style.height = (10 + i) + "px";

            replacement.appendChild(n);
        }

        containerA.appendChild(replacement);

    } catch (e) {
    }

    forceLayout();
}


function detachFrameA() {

    mark("05-detach-frameA");

    try {

        var oldFrame = frameA;

        containerA.removeChild(oldFrame);

        /*
         * Keep references alive while the renderer/document
         * hierarchy is being detached.
         */
        window.__oldFrame = oldFrame;
        window.__oldFrameDocument = oldFrame.contentDocument;

    } catch (e) {
    }
}


function mutateFrameB() {

    mark("06-frameB-mutation");

    try {

        var d = frameB.contentDocument;

        var x = d.getElementById("x");
        var y = d.getElementById("y");

        if (x) {
            x.style.width = "1px";
            x.style.height = "1px";
            x.style.overflow = "scroll";
        }

        if (y) {
            y.textContent = "";
            y.appendChild(d.createElement("div"));
        }

        void d.body.offsetHeight;

    } catch (e) {
    }
}


function detachContainerB() {

    mark("07-detach-containerB");

    try {

        var oldContainer = containerB;

        root.removeChild(oldContainer);

        window.__oldContainer = oldContainer;
        window.__oldFrameB = frameB;
        window.__oldFrameBDocument = frameB.contentDocument;

    } catch (e) {
    }
}


function reinsertAndDestroy() {

    mark("08-reinsert-destroy");

    try {

        root.appendChild(containerB);

        void root.offsetHeight;

        root.removeChild(containerB);

    } catch (e) {
    }
}


function postDetachAccess() {

    mark("09-post-detach");

    try {

        var oldFrame = window.__oldFrame;
        var oldDocument = window.__oldFrameDocument;

        if (oldFrame) {
            oldFrame.src = "about:blank";
        }

        if (oldDocument && oldDocument.body) {
            oldDocument.body.innerHTML = "";
        }

    } catch (e) {
    }
}


function finalMutation() {

    mark("10-final-mutation");

    try {

        root.innerHTML = "";

        var d1 = document.createElement("div");
        var d2 = document.createElement("div");

        d1.style.display = "contents";
        d2.style.display = "block";

        d1.appendChild(d2);
        root.appendChild(d1);

        void root.offsetHeight;

        d1.remove();

    } catch (e) {
    }
}


function run() {

    mark("01-start");

    buildFrameA();
    buildFrameB();

    forceLayout();

    mark("02-frames-ready");


    setTimeout(function () {

        navigateFrameA();

        setTimeout(function () {

            mutateParentBeforeDetach();

            requestAnimationFrame(function () {

                detachFrameA();

                requestAnimationFrame(function () {

                    mutateFrameB();

                    requestAnimationFrame(function () {

                        detachContainerB();

                        requestAnimationFrame(function () {

                            reinsertAndDestroy();

                            requestAnimationFrame(function () {

                                postDetachAccess();

                                requestAnimationFrame(function () {

                                    finalMutation();

                                    mark("11-complete");

                                });

                            });

                        });

                    });

                });

            });

        }, 20);

    }, 20);

}


window.addEventListener("load", run);

})();

</script></body>
</html>
