




<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>WebKit 9063c1c65799 - DeleteButtonController UAF candidate</title>
<style>
  body { font: 16px sans-serif; }
  #editor { width: 520px; min-height: 120px; border: 1px solid #888; padding: 10px; }
  #log { white-space: pre-wrap; font-family: monospace; margin-top: 12px; }
</style>
</head>
<body>
<h3>WebKit 9063c1c65799 — UAF test candidate</h3>
<p>
  This is a standalone browser test derived from the commit's lifetime pattern:
  editing + DOM mutation during undo/reapply. It uses no WebKit test-runner APIs.
</p>

<div id="editor" contenteditable="true">
  <p id="p1">alpha <span id="victim">bravo</span> charlie</p>
  <p id="p2">second line</p>
</div>

<button id="start">Run test</button>
<div id="log"></div>

<script>
(function () {
  "use strict";

  const editor = document.getElementById("editor");
  const log = document.getElementById("log");
  let iteration = 0;
  let inTest = false;

  function note(s) {
    log.textContent += s + "\n";
  }

  /*
   * The original WebKit bug says the Frame could be deleted because of
   * mutation events fired during AppendNodeCommand::doUnapply().
   *
   * We cannot directly destroy the browser's Frame from page JavaScript.
   * Instead, we create the closest web-exposed reentrancy pattern:
   * DOM mutation during an editing undo/redo operation.
   */

  function mutateDOM() {
    const old = document.getElementById("victim");

    if (old && old.parentNode) {
      const replacement = document.createElement("span");
      replacement.id = "victim2";
      replacement.textContent = "MUTATED";
      old.parentNode.replaceChild(replacement, old);
    } else {
      const p = document.getElementById("p1");
      if (p) {
        const span = document.createElement("span");
        span.id = "victim";
        span.textContent = "RECREATED";
        p.appendChild(span);
      }
    }

    // Force layout/style work after the mutation.
    void editor.offsetHeight;
    void editor.getBoundingClientRect();
  }

  // Legacy mutation event exists in some old WebKit builds and is relevant
  // to the original bug's description. MutationObserver is the fallback.
  let mutationScheduled = false;

  function scheduleMutation() {
    if (mutationScheduled) return;
    mutationScheduled = true;

    setTimeout(function () {
      mutationScheduled = false;
      try {
        mutateDOM();
      } catch (e) {
        note("mutation: " + e);
      }
    }, 0);
  }

  try {
    document.addEventListener("DOMNodeRemovedFromDocument", function () {
      if (inTest)
        scheduleMutation();
    });
  } catch (_) {
    // Ignore unsupported legacy mutation events.
  }

  const observer = new MutationObserver(function (records) {
    if (!inTest) return;

    for (const record of records) {
      if (record.type === "childList") {
        scheduleMutation();
        break;
      }
    }
  });

  observer.observe(editor, {
    subtree: true,
    childList: true,
    characterData: true
  });

  function makeEditingState() {
    editor.focus();

    const range = document.createRange();
    const text = document.createTextNode(" X");
    const p = document.getElementById("p2");

    if (p) {
      p.appendChild(text);
      range.selectNodeContents(p);
      range.collapse(false);
    }

    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);

    try {
      document.execCommand("insertText", false, "EDIT");
    } catch (_) {
      // Older builds may reject execCommand; the test continues.
    }
  }

  function runOnce() {
    iteration++;
    inTest = true;

    note("Iteration " + iteration);

    try {
      // Create an editing command in the editor.
      makeEditingState();

      // Reentrant DOM mutation while the editing machinery is active.
      mutateDOM();

      // Try undo/reapply paths. Older WebKit exposes these through
      // execCommand(), which is exactly the public editing entry point.
      try {
        document.execCommand("undo", false, null);
      } catch (e) {
        note("undo: " + e);
      }

      try {
        document.execCommand("redo", false, null);
      } catch (e) {
        note("redo: " + e);
      }

      // Additional mutation after undo/redo to keep the DOM lifecycle active.
      mutateDOM();

    } catch (e) {
      note("run: " + e);
    } finally {
      inTest = false;
    }
  }

  document.getElementById("start").addEventListener("click", function () {
    // Multiple executions are useful because the original bug involved
    // recursive mutation/re-entry.
    for (let i = 0; i < 20; i++) {
      setTimeout(runOnce, i * 25);
    }
  });
})();
</script>
</body>
</html>
