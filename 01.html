<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 ImageLoader Test</title>
</head>

<body>

<div id="status">Starting...</div>

<div id="host"></div>

<script>
(function () {

    var status = document.getElementById("status");
    var host = document.getElementById("host");

    function setStatus(text) {
        status.textContent = text;
    }

    setStatus("1. Creating ShadowRoot...");

    var sr = host.attachShadow({
        mode: "open"
    });

    sr.innerHTML =
        '<picture id="pic">' +
            '<source srcset="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">' +
            '<img id="targetImg">' +
        '</picture>';

    var pic = sr.getElementById("pic");
    var img = sr.getElementById("targetImg");

    setStatus("2. Waiting for image load...");

    img.addEventListener("load", function () {

        setStatus("3. IMG LOAD fired");

        /*
         * Preserve the important mutation:
         * remove the <img> from the <picture>.
         */
        pic.textContent = "";

        setStatus("4. Image removed. Loading modal.html...");

        var frame = document.createElement("iframe");

        frame.id = "modalFrame";
        frame.style.width = "300px";
        frame.style.height = "150px";
        frame.style.border = "2px solid black";

        frame.onload = function () {
            setStatus("5. modal.html LOADED");
        };

        frame.onerror = function () {
            setStatus("ERROR loading modal.html");
        };

        frame.src = "./02.html";

        document.body.appendChild(frame);

    }, false);

    img.addEventListener("error", function () {
        setStatus("ERROR: image failed to load");
    }, false);

})();
</script>

</body>
</html>
