
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS4 FW 13.52 — Exploit + Offset Scanner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#06080f;color:#c8cfd8;font:13px/1.5 'Courier New',monospace;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px}
h1{color:#00c8ff;font-size:14px;letter-spacing:3px;text-transform:uppercase;
  margin-bottom:10px;text-align:center}
#sb{width:100%;max-width:800px;background:#0c0e18;border:1px solid #1a1d2e;
  border-radius:5px;padding:8px 12px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
#dot{width:8px;height:8px;border-radius:50%;background:#333;flex-shrink:0}
#dot.r{background:#f0a500;animation:p 1s infinite}
#dot.ok{background:#00c853}
#dot.e{background:#ff4444}
@keyframes p{0%,100%{opacity:1}50%{opacity:.2}}
#st{font-size:12px;color:#bbb;flex:1}
#pb-w{width:100%;max-width:800px;height:4px;background:#111;border-radius:2px;
  display:none;margin-bottom:6px;overflow:hidden}
#pb{height:100%;width:0%;background:linear-gradient(90deg,#3b82f6,#8b5cf6)}
#con{width:100%;max-width:800px;height:260px;background:#040609;
  border:1px solid #0f1120;border-radius:5px;overflow-y:auto;
  padding:8px 10px;font-size:11px;line-height:1.6;margin-bottom:8px}
.ok{color:#00c853}.w{color:#f0a500}.e{color:#ff5252;font-weight:bold}
.d{color:#2a2d3e}.a{color:#bd93f9}.s{color:#00c8ff;font-weight:bold}
.i{color:#5b9bd5}
/* Output box */
#out-box{width:100%;max-width:800px;background:#030806;border:2px solid #00c853;
  border-radius:5px;padding:12px;display:none;margin-bottom:8px}
#out-box .ot{color:#fff;font-weight:bold;margin-bottom:6px;font-size:12px}
#out-pre{font-size:11px;color:#4ade80;line-height:1.7;white-space:pre;
  overflow-x:auto;max-height:400px;overflow-y:auto}
#btn-copy{background:#1e3a5f;border:none;color:#60a5fa;padding:6px 14px;
  font:12px monospace;border-radius:3px;cursor:pointer;margin-top:6px}
</style>
</head>
<body>
<h1>PS4 FW 13.52 — Exploit + Offset Scanner</h1>
<div id="sb"><div id="dot"></div><div id="st">Aguardando exploit...</div></div>
<div id="pb-w"><div id="pb"></div></div>
<div id="con"></div>
<div id="out-box">
  <div class="ot">// 13_52.js — gerado automaticamente</div>
  <pre id="out-pre"></pre>
  <button id="btn-copy" onclick="copyOutput()">📋 Copiar</button>
</div>

<!-- === CARREGAMENTO DOS MÓDULOS DO EXPLOIT === -->
<script type="module">
import { int64 }              from './resources/int64.js';
import { establishPrimitive } from './resources/core.js?v=10';
import { installWindowP }     from './resources/mem.js';
import offsets13_52           from './13.52.js';

globalThis.int64 = int64;

const $  = id => document.getElementById(id);
const log = (m, c='i') => {
  const d = document.createElement('div');
  d.className = c;
  d.textContent = m;
  $('con').appendChild(d);
  $('con').scrollTop = 9e9;
};
const setStatus = (m, s='r') => {
  $('st').textContent = m;
  $('dot').className = s;
};
const setProg = (p, show=true) => {
  $('pb-w').style.display = show ? 'block' : 'none';
  $('pb').style.width = Math.min(100, p) + '%';
};

window.copyOutput = function() {
  const txt = $('out-pre').textContent;
  navigator.clipboard?.writeText(txt).then(() => log('Copiado!', 'ok'));
};

/* ────────────────────────────────────────────────
   FASE 1: Executar o exploit (slopkit core)
   ──────────────────────────────────────────────── */
(async () => {
  setStatus('Executando exploit slopkit...', 'r');
  log('[*] Iniciando establishPrimitive...', 'i');

  let carrier;
  try {
    carrier = await establishPrimitive({
      onEvent(tag, det) {
        if (['SSV-STORED','SSV-GROOM-ENTER','PAIR-CELLS','READ-PRIMITIVE-PASS'].includes(tag)) {
          log('  [' + tag + '] ' + det, 'd');
        }
      },
      maxAttempts: 0
    });
  } catch (e) {
    setStatus('Exploit falhou: ' + e.message, 'e');
    log('ERRO: ' + e.message, 'e');
    return;
  }

  log('[+] establishPrimitive OK — promovendo para window.p', 'ok');

  let p;
  try {
    p = installWindowP(carrier, {
      promote: true,
      onEvent(tag, det) {
        log('  [mem] ' + tag + ' ' + det, 'd');
      }
    });
  } catch (e) {
    setStatus('installWindowP falhou: ' + e.message, 'e');
    log('ERRO: ' + e.message, 'e');
    return;
  }

  window.p = p;
  setStatus('window.p ativo! Carregando scanner...', 'ok');
  log('[+] window.p instalado com sucesso!', 'ok');
  log('[+] __ps5NativeCtor = 0x' + (globalThis.__ps5NativeCtor?.toString(16) || '???'), 'ok');

  /* ────────────────────────────────────────────────
     FASE 2: Carregar o scanner em runtime
     ──────────────────────────────────────────────── */
  log('', 'i');
  log('=== CARREGANDO RUNTIME SCANNER ===', 's');

  const scannerScript = document.createElement('script');
  scannerScript.src = './ps4_runtime_scanner.js';
  scannerScript.onload = () => {
    log('[+] Scanner carregado. Executando...', 'ok');
    // O scanner.js define window.runScanner() ou executa main() automaticamente
    if (typeof window.runScanner === 'function') {
      window.runScanner();
    }
  };
  scannerScript.onerror = () => {
    setStatus('Falha ao carregar ps4_runtime_scanner.js', 'e');
    log('ERRO: Não foi possível carregar ./ps4_runtime_scanner.js', 'e');
    log('Verifique se o arquivo está na mesma pasta do index.html', 'w');
  };
  document.body.appendChild(scannerScript);

})();
</script>
</body>
</html>
