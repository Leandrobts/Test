<!doctype html>
<html>
<head>
<meta charset="utf-8">

<style>
html, body {
    margin: 0;
    padding: 0;
}

#container {
    width: 800px;
    height: 1200px;
}

.widget {
    width: 400px;
    height: 200px;
    border: 1px solid black;
    margin: 20px;
}

iframe {
    width: 350px;
    height: 150px;
    border: 1px solid red;
}
</style>
</head>

<body>

<div id="container">

    <div class="widget">
        <iframe id="frame"></iframe>
    </div>

    <div class="widget">
        <div id="content">
            RenderTree test
        </div>
    </div>

</div>

<script>

(function () {

    var frame = document.getElementById("frame");
    var content = document.getElementById("content");

    /*
     * Give the iframe a real document.
     */
    try {
        frame.srcdoc =
            "<!doctype html>" +
            "<html><body>" +
            "<div style='width:200px;height:100px'>" +
            "iframe content" +
            "</div>" +
            "</body></html>";
    } catch (e) {
        /*
         * Older WebKit fallback.
         */
        frame.src = "about:blank";
    }

    /*
     * Force creation/update of render objects.
     */
    function forceLayout() {
        document.body.offsetHeight;
        document.documentElement.offsetHeight;

        if (frame) {
            frame.getBoundingClientRect();
        }

        if (content) {
            content.getBoundingClientRect();
        }
    }

    /*
     * Mutate the render tree shortly before printing.
     */
    function preparePrint() {

        forceLayout();

        content.innerHTML =
            "<div style='width:600px;height:300px'>" +
            "<iframe id='innerFrame' " +
            "style='width:300px;height:150px'></iframe>" +
            "</div>";

        forceLayout();

        /*
         * Ask the browser to enter its print path.
         */
        setTimeout(function () {
            window.print();
        }, 100);
    }

    /*
     * Wait until the initial frame exists.
     */
    setTimeout(function () {
        forceLayout();

        /*
         * Give the renderer time to construct the
         * corresponding RenderWidget.
         */
        setTimeout(preparePrint, 200);

    }, 500);

})();

</script>

</body>
</html>
