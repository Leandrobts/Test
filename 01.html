<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<title>Fullscreen iframe popup lifecycle test</title>
</head>
<body><button id="run">Run Test</button>

<div id="status">Waiting...</div><script>
document.getElementById("run").onclick = function() {

    var status = document.getElementById("status");

    var iframe = document.createElement("iframe");
    iframe.style.width = "300px";
    iframe.style.height = "200px";
    iframe.style.border = "1px solid black";

    document.body.appendChild(iframe);

    var iframeDocument = iframe.contentDocument;

    iframeDocument.open();
    iframeDocument.write(
        '<!DOCTYPE html>' +
        '<html>' +
        '<body>' +
        '<div style="width:200px;height:150px;background:red"></div>' +
        '</body>' +
        '</html>'
    );
    iframeDocument.close();

    status.innerHTML = "Iframe created";

    var popup = window.open("", "_blank", "width=300,height=200");

    if (!popup) {
        status.innerHTML = "Popup blocked";
        iframe.remove();
        return;
    }

    popup.document.open();
    popup.document.write(
        '<!DOCTYPE html>' +
        '<html>' +
        '<body>' +
        '<p>Fullscreen lifecycle test</p>' +
        '<script>' +
        'setTimeout(function(){ window.close(); }, 100);' +
        '<\/script>' +
        '</body>' +
        '</html>'
    );
    popup.document.close();

    status.innerHTML = "Iframe created and popup opened";

    var fullscreenElement = iframeDocument.documentElement;

    if (fullscreenElement.webkitRequestFullscreen) {
        fullscreenElement.webkitRequestFullscreen();
    }

    var checkClosed = setInterval(function() {

        if (popup.closed) {

            clearInterval(checkClosed);

            status.innerHTML = "Popup closed - removing iframe";

            iframe.remove();

            status.innerHTML = "Test sequence completed";
        }

    }, 10);
};
</script></body>
</html>
