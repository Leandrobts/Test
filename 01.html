<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Teste de Regressão: @container style() em pseudo-elementos após mutação</title>
<style>
    .host {
        --theme: red;
    }

    .host.updated {
        --theme: green;
    }

    /* Pseudo-elemento avalia o container style query do host */
    @container style(--theme: green) {
        .host::before {
            content: "MATCHED";
            color: rgb(0, 128, 0);
        }
    }

    @container style(--theme: red) {
        .host::before {
            content: "INITIAL";
            color: rgb(255, 0, 0);
        }
    }
</style>
</head>
<body>
<div id="target" class="host">Texto Host</div>
<div id="status">Executando teste...</div>

<script>
function runContainerQueryTest() {
    const target = document.getElementById("target");

    // 1. Força a resolução e commit do estilo inicial (--theme: red)
    let initialColor = getComputedStyle(target, "::before").color;
    if (initialColor !== "rgb(255, 0, 0)") {
        throw new Error("Estado inicial falhou ou @container style() não é suportado.");
    }

    // 2. Altera a classe para atualizar a variável para (--theme: green)
    target.classList.add("updated");

    // 3. Força a resolução imediata do estilo do pseudo-elemento
    // Sem o commit bd7ffaf, o avaliador lia o estilo stale (red) em vez do novo (green)
    const updatedColor = getComputedStyle(target, "::before").color;

    if (updatedColor === "rgb(0, 128, 0)") {
        document.getElementById("status").innerText = "PASS: @container style() no pseudo-elemento avaliou o novo estilo com sucesso.";
    } else {
        document.getElementById("status").innerText = `FAIL: Esperado rgb(0, 128, 0), mas obteve ${updatedColor}`;
    }
}

try {
    runContainerQueryTest();
} catch (e) {
    document.getElementById("status").innerText = "FAIL: " + e.message;
}
</script>
</body>
</html>
