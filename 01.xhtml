<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<title>PS4 WebKit XML Parser Test</title>
</head>
<body>
<h2>PS4 WebKit XML Parser</h2>
<pre id="result">Iniciando...</pre>

<script type="text/javascript">
//<![CDATA[
var output = document.getElementById("result");

function log(message) {
    output.appendChild(
        document.createTextNode("\n" + message)
    );
}

output.textContent = "WebKit XML Test";

log("Content-Type: " + document.contentType);

log("customElements: " +
    (typeof window.customElements));

log("HTMLElement: " +
    (typeof window.HTMLElement));

log("XML document: " +
    (document.xmlVersion ? "Sim" : "Indeterminado"));

if (window.customElements &&
    typeof window.customElements.define === "function") {
    log("Custom Elements suportado");
} else {
    log("Custom Elements indisponivel");
}

var element = document.createElementNS(
    "http://www.w3.org/1999/xhtml",
    "x-a"
);

log("Elemento criado: " + element.localName);
log("Parent inicial: " + element.parentNode);
//]]>
</script>
</body>
</html>
