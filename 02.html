<!DOCTYPE html>
<html>
<body>
<input id="outer">
<iframe id="frame" tabindex="0" srcdoc="<input tabindex='0'><script>parent.innerInput = document.querySelector('input');</script>"></iframe>

<script>
// Fallback de GC (baseado no gc.js que você mandou)
if (!window.gc) {
    window.gc = function() {
        if (window.GCController)
            return GCController.collect();

        // Fallback lento para browsers sem GC manual
        function gcRec(n) {
            if (n < 1)
                return {};
            var temp = {i: "ab" + i + (i / 100000)};
            temp += "foo";
            gcRec(n - 1);
        }
        for (var i = 0; i < 10000; i++)
            gcRec(10);
    };
}

var iframe = document.getElementById('frame');
var outerInput = document.getElementById('outer');
var innerInput = null;

function runTest() {
    // Pega a referência que o iframe colocou no parent
    innerInput = window.innerInput;
    window.innerInput = null;

    outerInput.addEventListener('blur', function onBlur() {
        // Remove o listener (equivalente ao { once: true })
        outerInput.removeEventListener('blur', onBlur);

        // Mesma sequência crítica do teste original
        document.adoptNode(innerInput);
        innerInput = null;
        iframe.remove();
        iframe = null;

        // Força GC
        gc();

        // Feedback visual
        document.body.innerHTML = '<p style="color:green;font-weight:bold">This test passes if PASS (no crash)</p>';
    });

    // Foca o input externo
    outerInput.focus();

    // Dispara o mesmo KeyboardEvent sintético (Tab + Alt)
    // que o teste original usava para forçar a mudança de foco / blur
    outerInput.dispatchEvent(new KeyboardEvent('keydown', {
        bubbles: true,
        cancelable: true,
        view: window,
        detail: 0,
        key: 'Tab',
        code: 'Tab',
        keyIdentifier: 'U+0009',
        location: 222,
        ctrlKey: false,
        altKey: true,
        shiftKey: false,
        metaKey: false
    }));
}

// Espera o iframe carregar (mesmo padrão do original)
if (iframe.contentDocument && iframe.contentDocument.readyState === 'complete') {
    setTimeout(runTest, 0);
} else {
    iframe.onload = function() {
        setTimeout(runTest, 0);
    };
}
</script>
</body>
</html>
