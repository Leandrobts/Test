
<!doctype html>
<html>
<head>
<meta charset="utf-8">

<style>

body {
    margin: 0;
}

#root {
    width: 900px;
}

.box {
    width: 700px;
    height: 180px;
    margin: 10px;
    border: 1px solid #000;
}

iframe {
    width: 500px;
    height: 120px;
}

@media print {

    #root {
        width: 100%;
    }

    .box {
        width: 95%;
    }

}

</style>
</head>

<body>

<div id="root">

    <div class="box">
        <iframe id="target"></iframe>
    </div>

    <div class="box">
        <div id="mutationTarget">
            content
        </div>
    </div>

</div>

<script>

var target = document.getElementById("target");
var mutationTarget = document.getElementById("mutationTarget");

try {

    target.srcdoc =
        "<html><body>" +
        "<div style='width:300px;height:100px'>" +
        "Frame" +
        "</div>" +
        "</body></html>";

} catch (e) {

    target.src = "about:blank";

}


/*
 * Force synchronous layout.
 */
function layout() {

    document.documentElement.offsetHeight;

    if (target) {
        target.getBoundingClientRect();
    }

    mutationTarget.getBoundingClientRect();
}


/*
 * Mutate the document when print media
 * becomes active.
 */
var printMedia = window.matchMedia ?
    window.matchMedia("print") :
    null;

if (printMedia) {

    var listener = function (event) {

        if (!event.matches)
            return;

        /*
         * Force layout before mutation.
         */
        layout();

        /*
         * Remove the iframe's renderer.
         */
        if (target && target.parentNode) {
            target.parentNode.removeChild(target);
        }

        /*
         * Replace the area with another widget.
         */
        var replacement =
            document.createElement("iframe");

        replacement.style.width = "450px";
        replacement.style.height = "100px";

        mutationTarget.appendChild(replacement);

        /*
         * Force another layout.
         */
        layout();
    };

    if (printMedia.addEventListener) {
        printMedia.addEventListener("change", listener);
    } else if (printMedia.addListener) {
        printMedia.addListener(listener);
    }
}


/*
 * Start.
 */
setTimeout(function () {

    layout();

    setTimeout(function () {

        window.print();

    }, 500);

}, 1000);

</script>

</body>
</html>
