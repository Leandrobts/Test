<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GC StyleSheet test</title>
</head>

<body>

<script>
function gc() {
    if (typeof GCController !== "undefined") {
        GCController.collect();
        return;
    }

    function gcRec(n) {
        if (n < 1)
            return {};

        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";

        gcRec(n - 1);
    }

    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

function pass(message) {
    console.log("PASS: " + message);
}

function fail(message) {
    console.log("FAIL: " + message);
}

function check(condition, message) {
    if (condition)
        pass(message);
    else
        fail(message);
}

var style = document.createElement("style");

style.textContent =
    '@import url("resources/detached-style.css");';

document.head.appendChild(style);

var parentSheet = style.sheet;

check(
    parentSheet instanceof CSSStyleSheet,
    "parentSheet is CSSStyleSheet"
);

check(
    parentSheet.cssRules[0].type === CSSRule.IMPORT_RULE,
    "cssRules[0] is CSSImportRule"
);

parentSheet.foo = "bar";

window.onload = function() {

    window.childSheet =
        parentSheet.cssRules[0].styleSheet;

    parentSheet = null;

    style.remove();
    style = null;

    gc();

    setTimeout(function() {

        gc();

        try {
            check(
                childSheet.parentStyleSheet.foo === "bar",
                "childSheet.parentStyleSheet.foo == bar"
            );
        } catch (e) {
            fail("exception: " + e);
        }

    }, 0);
};
</script>

</body>
</html>
