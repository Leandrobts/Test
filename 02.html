
<!doctype html>
<div id=e></div>
<script>
const e=document.getElementById("e");
const a=document.createAttribute("x");
e.setAttributeNode(a);
e.remove();
e.removeAttribute("x");
for(let i=0;i<10000;i++){
  const x=document.createElement("div");
  x.setAttributeNode(document.createAttribute("x"));
}
void a.ownerElement;
</script>
