<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Teste de Regressão: Race Condition entre ReadableStreamDefaultReader e GC</title>
</head>
<body>
<script>
// Função utilitária de GC via alocação recursiva de memória
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 1000; i++)
        gcRec(10);
}

function runTest() {
    for (let i = 0; i < 500; i++) {
        // 1. Cria um ReadableStream e obtém seu reader
        let stream = new ReadableStream({
            start(controller) {
                controller.enqueue(new Uint8Array([1, 2, 3]));
            }
        });
        let reader = stream.getReader();

        // 2. Dispara leituras e liberações rápidas para alterar m_stream constantemente
        reader.read().catch(() => {});
        
        // releaseLock() e cancel() zeram internamente o m_stream
        if (i % 2 === 0) {
            try {
                reader.releaseLock();
            } catch (e) {}
        } else {
            reader.cancel().catch(() => {});
        }

        // 3. Descarta referências locais
        stream = null;
        reader = null;

        // 4. Força pressão no GC a cada poucas iterações para cruzar o ciclo de vida com a GCThread
        if (i % 25 === 0) {
            gc();
        }
    }
}

try {
    runTest();
    document.body.innerText = "PASS: Executado sem travamento por race condition no coletor de lixo.";
} catch (e) {
    document.body.innerText = "FAIL: " + e.message;
}
</script>
</body>
</html>
