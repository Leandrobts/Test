




<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>WebKit aac9a1c72c1f - LiveNodeList Shadow DOM lifetime test</title>
<style>
  body { font: 16px sans-serif; }
  #host { border: 1px solid #888; padding: 8px; min-height: 80px; }
  #log { white-space: pre-wrap; font-family: monospace; margin-top: 12px; }
</style>
</head>
<body>
<h3>WebKit aac9a1c72c1f — LiveNodeList / TreeScope lifetime test</h3>
<p>
  Standalone test derived from the commit's WebCore lifetime pattern.
  No testRunner, internals, or GCController is used.
</p>

<div id="host"></div>
<div id="log"></div>

<script>
(function () {
  "use strict";

  const host = document.getElementById("host");
  const log = document.getElementById("log");

  function note(s) {
    log.textContent += s + "\n";
  }

  let shadow = null;
  let liveList = null;
  let iteration = 0;

  function buildTree() {
    host.innerHTML = "";

    const container = document.createElement("div");
    container.id = "container";
    container.innerHTML =
      '<span class="item">A</span>' +
      '<span class="item">B</span>' +
      '<span class="item">C</span>';

    host.appendChild(container);

    if (host.attachShadow) {
      try {
        shadow = host.attachShadow({ mode: "open" });

        const section = document.createElement("section");
        section.id = "shadowSection";
        section.innerHTML =
          '<span class="item">S1</span>' +
          '<span class="item">S2</span>' +
          '<div><span class="item">S3</span></div>';

        shadow.appendChild(section);

        // HTMLCollection is a live Node list backed by tree-scope data.
        liveList = shadow.getElementsByClassName("item");
        note("LiveList length after build: " + liveList.length);
      } catch (e) {
        note("Shadow DOM setup failed: " + e);
      }
    } else {
      note("attachShadow() unavailable on this browser.");
    }
  }

  function moveNodesAcrossScopes() {
    if (!shadow || !liveList)
      return;

    const section = shadow.getElementById ?
      shadow.getElementById("shadowSection") :
      shadow.querySelector("#shadowSection");

    if (!section)
      return;

    // Create a second host / shadow tree to force TreeScope changes.
    const host2 = document.createElement("div");
    host2.id = "host2";
    document.body.appendChild(host2);

    let shadow2 = null;
    try {
      shadow2 = host2.attachShadow({ mode: "open" });
    } catch (e) {
      host2.remove();
      return;
    }

    const moved = section.cloneNode(true);
    shadow2.appendChild(moved);

    // Keep the old live list alive while the original tree is mutated.
    // This is the key lifetime pressure.
    section.innerHTML = "";
    shadow.appendChild(document.createElement("div"));

    // Force repeated cache/list queries while scopes are changing.
    for (let i = 0; i < 8; i++) {
      void liveList.length;
      if (liveList.item)
        void liveList.item(0);

      const first = liveList[0];
      if (first)
        first.textContent = "touch-" + i;

      const extra = document.createElement("span");
      extra.className = "item";
      extra.textContent = "E" + i;

      if (shadow2)
        shadow2.appendChild(extra);

      void liveList.length;
    }

    // Remove the second tree and the original content in alternating order.
    if (host2.parentNode)
      host2.parentNode.removeChild(host2);

    if (section.parentNode)
      section.parentNode.removeChild(section);

    // The list object is intentionally retained and queried after teardown.
    for (let i = 0; i < 16; i++) {
      try {
        void liveList.length;
        if (liveList.item)
          void liveList.item(i % 4);
      } catch (e) {
        note("LiveList access exception: " + e);
      }
    }
  }

  function crossDocumentMove() {
    if (!liveList)
      return;

    // iframe gives us a real second Document/TreeScope.
    const frame = document.createElement("iframe");
    frame.style.display = "none";
    document.body.appendChild(frame);

    let doc;
    try {
      doc = frame.contentDocument;
    } catch (e) {
      if (frame.parentNode)
        frame.parentNode.removeChild(frame);
      return;
    }

    const target = doc.createElement("div");
    target.innerHTML =
      '<span class="item">D1</span>' +
      '<span class="item">D2</span>';
    doc.body.appendChild(target);

    // A second live list rooted in another document.
    const docList = doc.getElementsByClassName("item");

    // Force mutations while both live lists remain referenced.
    for (let i = 0; i < 12; i++) {
      target.appendChild(doc.createElement("span"));
      target.lastChild.className = "item";
      target.lastChild.textContent = "D" + i;

      void liveList.length;
      void docList.length;

      // Alternate destructive document operations.
      if (i % 3 === 0) {
        while (target.firstChild)
          target.removeChild(target.firstChild);

        target.innerHTML =
          '<span class="item">R1</span>' +
          '<span class="item">R2</span>';
      }
    }

    // Tear down the document while retaining list objects.
    if (frame.parentNode)
      frame.parentNode.removeChild(frame);

    for (let i = 0; i < 20; i++) {
      try {
        void docList.length;
        void liveList.length;
      } catch (e) {
        note("Cross-document exception: " + e);
      }
    }
  }

  function runIteration() {
    iteration++;
    note("Iteration " + iteration);

    buildTree();
    moveNodesAcrossScopes();
    crossDocumentMove();

    // Rebuild and repeat so the same live-list object lifetime patterns
    // are exercised across multiple tree scopes/documents.
    buildTree();
    moveNodesAcrossScopes();

    // Force synchronous style/layout work as a final re-entry trigger.
    void host.offsetHeight;
    void document.body.getBoundingClientRect();
  }

  // Use a few batches rather than an unbounded loop so the PS4 browser stays responsive.
  let count = 0;
  function runBatch() {
    if (count++ >= 12) {
      note("Finished.");
      return;
    }

    try {
      runIteration();
    } catch (e) {
      note("Iteration exception: " + e);
    }

    setTimeout(runBatch, 40);
  }

  // Small control so the test can also be started manually.
  const button = document.createElement("button");
  button.textContent = "Run LiveNodeList Test";
  button.onclick = function () {
    count = 0;
    runBatch();
  };

  document.body.insertBefore(button, host);

  // Do not auto-start. Click the button to begin.
})();
</script>
</body>
</html>
