
<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<title>PS4 WebKit Lifecycle V2</title>
<style>
html, body {
    margin: 0;
    padding: 0;
}#root {
width: 100%;
}

.container {
width: 100%;
height: 180px;
overflow: auto;
margin-bottom: 10px;
}

iframe {
width: 96%;
height: 150px;
border: 1px solid #000;
}

.box {
height: 30px;
margin: 2px;
}
</style>

</head><body><div id="root"><div id="containerA" class="container">
    <iframe id="frameA"></iframe>
</div>

<div id="containerB" class="container">
    <iframe id="frameB"></iframe>
</div>

</div><script>
(function () {

    var root = document.getElementById("root");
    var containerA = document.getElementById("containerA");
    var containerB = document.getElementById("containerB");

    var frameA = document.getElementById("frameA");
    var frameB = document.getElementById("frameB");

    var oldDocumentA = null;
    var oldDocumentB = null;

    var oldBodyA = null;
    var oldBodyB = null;

    var destinationA = null;
    var destinationB = null;

    var state = {
        phase: 0,
        cycle: 0,
        timestamp: Date.now()
    };

    function saveState(phase) {
        state.phase = phase;
        state.cycle++;
        state.timestamp = Date.now();

        try {
            localStorage.setItem(
                "webkit_lifecycle_v2_last",
                JSON.stringify(state)
            );
        } catch (e) {
        }
    }

    function safeLayout(node) {
        try {
            if (!node)
                return;

            node.offsetHeight;
            node.offsetWidth;

            if (node.scrollTop !== undefined)
                node.scrollTop = node.scrollTop + 1;

        } catch (e) {
        }
    }

    function buildPageA() {

        var doc = frameA.contentDocument;

        if (!doc)
            return;

        oldDocumentA = doc;
        oldBodyA = doc.body;

        doc.open();

        doc.write(
            '<!DOCTYPE html>' +
            '<html>' +
            '<head>' +
            '<meta charset="UTF-8">' +
            '<style>' +
            'body{margin:0;height:1000px;}' +
            '#area{height:500px;overflow:auto;border:2px solid black;}' +
            '.item{height:25px;margin:2px;}' +
            '</style>' +        '</head>' +
        '<body>' +

        '<div id="area">' +

        '<div class="item">A1</div>' +
        '<div class="item">A2</div>' +
        '<div class="item">A3</div>' +
        '<div class="item">A4</div>' +

        '<a id="nav" href="about:blank">NAVIGATE</a>' +

        '</div>' +

        '</body>' +
        '</html>'
    );

    doc.close();

    try {
        destinationA = doc.getElementById("nav");
    } catch (e) {
    }
}

function buildPageB() {

    var doc = frameB.contentDocument;

    if (!doc)
        return;

    oldDocumentB = doc;
    oldBodyB = doc.body;

    doc.open();

    var html =
        '<!DOCTYPE html>' +
        '<html>' +
        '<head>' +
        '<meta charset="UTF-8">' +
        '<style>' +
        'body{margin:0;}' +
        '#outer{height:1000px;}' +
        '.box{height:25px;margin:2px;}' +
        '</style>' +
        '</head>' +
        '<body>' +
        '<div id="outer">';

    for (var i = 0; i < 32; i++) {
        html += '<div class="box">B' + i + '</div>';
    }

    html +=
        '</div>' +
        '</body>' +
        '</html>';

    doc.write(html);
    doc.close();
}

function mutateA() {

    try {
        if (!oldDocumentA)
            return;

        var body = oldDocumentA.body;

        if (!body)
            return;

        var first = body.firstChild;

        if (first) {
            body.appendChild(first);
            body.insertBefore(first, body.firstChild);
        }

        safeLayout(body);

    } catch (e) {
    }
}

function mutateB() {

    try {
        if (!oldDocumentB)
            return;

        var body = oldDocumentB.body;

        if (!body)
            return;

        var nodes = body.getElementsByTagName("div");

        if (nodes.length) {

            var n = nodes[nodes.length - 1];

            if (n.parentNode)
                n.parentNode.removeChild(n);

            body.appendChild(n);
        }

        safeLayout(body);

    } catch (e) {
    }
}

function navigateA() {

    try {

        if (!destinationA)
            return;

        destinationA.click();

    } catch (e) {
    }
}

function detachA() {

    try {

        if (frameA.parentNode)
            frameA.parentNode.removeChild(frameA);

    } catch (e) {
    }
}

function detachB() {

    try {

        if (frameB.parentNode)
            frameB.parentNode.removeChild(frameB);

    } catch (e) {
    }
}

function reinsertA() {

    try {

        containerA.appendChild(frameA);

    } catch (e) {
    }
}

function reinsertB() {

    try {

        containerB.appendChild(frameB);

    } catch (e) {
    }
}

function destroyContainerA() {

    try {

        if (containerA.parentNode)
            containerA.parentNode.removeChild(containerA);

    } catch (e) {
    }
}

function destroyContainerB() {

    try {

        if (containerB.parentNode)
            containerB.parentNode.removeChild(containerB);

    } catch (e) {
    }
}

function restoreContainers() {

    try {

        if (!containerA.parentNode)
            root.appendChild(containerA);

        if (!containerB.parentNode)
            root.appendChild(containerB);

    } catch (e) {
    }
}

function restoreFrames() {

    try {

        if (!frameA.parentNode)
            containerA.appendChild(frameA);

        if (!frameB.parentNode)
            containerB.appendChild(frameB);

    } catch (e) {
    }
}

function accessDetachedObjects() {

    try {

        if (oldDocumentA) {

            var aBody = oldDocumentA.body;

            if (aBody) {
                safeLayout(aBody);

                var aChildren = aBody.childNodes;

                if (aChildren.length)
                    aBody.appendChild(aChildren[0]);
            }
        }

    } catch (e) {
    }

    try {

        if (oldDocumentB) {

            var bBody = oldDocumentB.body;

            if (bBody) {
                safeLayout(bBody);

                var bChildren = bBody.childNodes;

                if (bChildren.length)
                    bBody.appendChild(bChildren[0]);
            }
        }

    } catch (e) {
    }
}

function cycle1() {

    saveState(1);

    buildPageA();
    buildPageB();

    setTimeout(cycle2, 80);
}

function cycle2() {

    saveState(2);

    mutateA();
    mutateB();

    setTimeout(cycle3, 80);
}

function cycle3() {

    saveState(3);

    navigateA();

    setTimeout(cycle4, 120);
}

function cycle4() {

    saveState(4);

    mutateA();
    safeLayout(frameA);

    setTimeout(cycle5, 80);
}

function cycle5() {

    saveState(5);

    detachA();

    setTimeout(cycle6, 80);
}

function cycle6() {

    saveState(6);

    mutateA();
    accessDetachedObjects();

    setTimeout(cycle7, 80);
}

function cycle7() {

    saveState(7);

    detachB();

    setTimeout(cycle8, 80);
}

function cycle8() {

    saveState(8);

    mutateB();
    accessDetachedObjects();

    setTimeout(cycle9, 80);
}

function cycle9() {

    saveState(9);

    reinsertA();
    reinsertB();

    setTimeout(cycle10, 100);
}

function cycle10() {

    saveState(10);

    mutateA();
    mutateB();

    safeLayout(containerA);
    safeLayout(containerB);

    setTimeout(cycle11, 100);
}

function cycle11() {

    saveState(11);

    destroyContainerA();

    setTimeout(cycle12, 80);
}

function cycle12() {

    saveState(12);

    accessDetachedObjects();

    setTimeout(cycle13, 80);
}

function cycle13() {

    saveState(13);

    destroyContainerB();

    setTimeout(cycle14, 80);
}

function cycle14() {

    saveState(14);

    accessDetachedObjects();

    setTimeout(cycle15, 80);
}

function cycle15() {

    saveState(15);

    restoreContainers();
    restoreFrames();

    setTimeout(cycle16, 100);
}

function cycle16() {

    saveState(16);

    /*
     * Rebuild both iframe documents after the
     * previous documents have gone through:
     *
     * navigation
     * detach
     * mutation
     * reinsert
     * container destruction
     */

    buildPageA();
    buildPageB();

    setTimeout(cycle17, 120);
}

function cycle17() {

    saveState(17);

    mutateA();
    mutateB();

    setTimeout(cycle18, 100);
}

function cycle18() {

    saveState(18);

    /*
     * Final lifecycle transition.
     */

    detachA();
    detachB();

    accessDetachedObjects();

    setTimeout(cycle19, 100);
}

function cycle19() {

    saveState(19);

    /*
     * Keep the final references alive while
     * the browser completes the event queue.
     */

    safeLayout(oldBodyA);
    safeLayout(oldBodyB);

    setTimeout(function () {

        saveState(20);

        /*
         * One clean restoration. No navigation loop.
         */

        restoreContainers();
        restoreFrames();

    }, 150);

}

/*
 * Iframes are created immediately by the HTML
 * parser. We only populate their documents here.
 */

saveState(0);

setTimeout(cycle1, 100);

})();
</script>

</body>
</html>
