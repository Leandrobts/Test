<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Teste de Regressão: MarketplaceKit Navigation Completion Off-Main-Thread</title>
</head>
<body>
<div id="status">Executando teste...</div>

<script>
function triggerMarketplaceNavigation() {
    // Tenta disparar uma navegação que ative a interceptação do MarketplaceKit
    // Uma URL inválida força o framework a invocar o completion handler com erro em background
    const link = document.createElement("a");
    link.href = "marketplace-app-installation://invalid-app-id?url=https://example.com";
    link.target = "_blank";
    document.body.appendChild(link);

    // Dispara o clique programático
    link.click();

    setTimeout(() => {
        document.getElementById("status").innerText = "PASS: Navegação tratada sem crash de concorrência na thread principal.";
    }, 200);
}

try {
    triggerMarketplaceNavigation();
} catch (e) {
    document.getElementById("status").innerText = "FAIL: " + e.message;
}
</script>
</body>
</html>
