<!doctype html>
<input id="a">
<iframe id="f" tabindex="0" srcdoc="<input tabindex='0'>"></iframe>
<script>
var a=document.getElementById("a");
var f=document.getElementById("f");

f.onload=function(){
    setTimeout(function(){
        f.focus();
        setTimeout(function(){
            a.focus();
            a.dispatchEvent(new KeyboardEvent("keydown",{
                bubbles:true,
                cancelable:true,
                key:"Tab",
                code:"Tab"
            }));
        },50);
    },50);
};
</script>
