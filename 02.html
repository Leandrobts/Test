<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Modal Test</title>
</head>

<body>

<h2>modal.html loaded</h2>

<script>
document.body.appendChild(
    document.createTextNode(" JavaScript executed.")
);

setTimeout(function () {

    document.body.appendChild(
        document.createTextNode(" Timeout executed.")
    );

    try {
        window.parent.postMessage("modal-finished", "*");
    } catch (e) {
    }

}, 10);
</script>

</body>
</html>
