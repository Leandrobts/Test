<!DOCTYPE html>
<body>
<script>
// Configuração do test runner para testes sem layout
if (window.testRunner)
    testRunner.dumpAsText();

// Função de coleta de lixo
function gc() {
    if (window.GCController)
        GCController.collect();
    else {
        // Fallback para ambientes sem GCController
        for (var i = 0; i < 1000; i++) {
            var temp = {};
            temp.data = new Array(1000);
            temp.data.fill(i);
        }
    }
}

// Configura cada caso de teste
function setup(ghosts, pumps) {
    const host = document.body.appendChild(document.createElement('div'));
    const shadowRoot = host.attachShadow({ mode: 'open', slotAssignment: 'manual' });
    const targetSlot = shadowRoot.appendChild(document.createElement('slot'));
    const otherSlot = shadowRoot.appendChild(document.createElement('slot'));
    const childA = host.appendChild(document.createElement('span'));
    const childB = host.appendChild(document.createElement('span'));
    
    targetSlot.assign(childA);
    otherSlot.assign(childB);
    
    // Insere e remove slots fantasmas para acumular entradas com WeakPtrs que ficam nulos após GC
    for (let i = 0; i < ghosts; ++i) {
        const ghostSlot = shadowRoot.appendChild(document.createElement('slot'));
        ghostSlot.remove();
    }
    
    return { host, targetSlot, pumps };
}

// Dispara o cenário que causava o crash
function trigger({ host, targetSlot, pumps }) {
    // Avança o contador de operações do WeakHashMap em direção ao limite de limpeza
    for (let i = 0; i < pumps; ++i) {
        targetSlot.assignedNodes();
    }
    
    // Reatribuir targetSlot derruba renderizadores; o iterador da árvore composta visita otherSlot,
    // reentra assignedNodesForSlot, e pode disparar um rehash que libera o array de buckets
    const newChild = host.appendChild(document.createElement('span'));
    targetSlot.assign(newChild);
    
    host.remove();
}

// Gera vários casos de teste
const cases = [];
for (let ghosts = 20; ghosts <= 100; ghosts += 10) {
    for (let pumps = ghosts; pumps <= ghosts * 3; ++pumps) {
        cases.push(setup(ghosts, pumps));
    }
}

// Coleta lixo para invalidar WeakPtrs dos slots fantasmas
gc();

// Uma passagem de layout dá a cada host um renderizador para que tearDownRenderersAfterSlotChange
// traverse a árvore composta
document.body.offsetHeight;

// Executa todos os casos de teste
try {
    for (const testCase of cases) {
        trigger(testCase);
    }
    document.body.textContent = 'PASS: This test passes if it does not crash.';
} catch (e) {
    document.body.textContent = 'FAIL: Test crashed or threw exception: ' + e;
}
</script>
</body>
</html>
