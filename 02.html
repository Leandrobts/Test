<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>RenderWidget Layout / Lifecycle Test</title>

<style>
    iframe {
        content: url();
        zoom: 0.01;
        width: 300px;
        height: 200px;
        border: 1px solid black;
    }

    #container {
        width: 100%;
        min-height: 100px;
    }
</style>
</head>

<body>

<h3>RenderWidget lifecycle test</h3>
<button onclick="start()">Start</button>

<div id="container">
    <iframe id="i0"></iframe>
</div>

<script>
(function () {

    var iteration = 0;
    var running = false;

    function forceLayout(element) {
        if (!element)
            return;

        /*
         * Essas operações exigem informações atualizadas de geometria
         * e podem provocar atualização síncrona de layout.
         */

        try {
            element.offsetWidth;
            element.offsetHeight;
            element.clientWidth;
            element.clientHeight;
            element.scrollWidth;
            element.scrollHeight;

            element.getBoundingClientRect();
            element.getClientRects();

            window.getComputedStyle(element).width;
            window.getComputedStyle(element).height;
            window.getComputedStyle(element).display;
        } catch (e) {
        }
    }

    function mutateDocument() {
        /*
         * Equivalente aproximado à parte do teste original que adiciona
         * um frameset durante a preparação do estado.
         */

        try {
            var frameset = document.createElement("frameset");
            document.documentElement.appendChild(frameset);

            forceLayout(document.documentElement);

            frameset.parentNode.removeChild(frameset);
        } catch (e) {
        }
    }

    function createFrame() {
        var oldFrame = document.getElementById("i0");

        if (oldFrame && oldFrame.parentNode)
            oldFrame.parentNode.removeChild(oldFrame);

        forceLayout(document.documentElement);

        var frame = document.createElement("iframe");
        frame.id = "i0";

        frame.onload = function () {

            /*
             * Força consultas de layout enquanto o RenderWidget
             * associado ao iframe está ativo.
             */

            forceLayout(frame);
            forceLayout(document.documentElement);

            /*
             * Navegação semelhante ao LayoutTest original.
             */

            try {
                location.hash = "x" + iteration;
            } catch (e) {
            }

            forceLayout(frame);

            /*
             * Foco no iframe.
             */

            try {
                frame.focus();
            } catch (e) {
            }

            forceLayout(frame);

            /*
             * Outra mudança de fragmento após focus/layout.
             */

            Promise.resolve().then(function () {

                try {
                    location.hash = "y" + iteration;
                } catch (e) {
                }

                forceLayout(frame);
                forceLayout(document.documentElement);
            });
        };

        frame.onfocus = function () {

            /*
             * Durante o evento de focus, realizamos nova navegação
             * e forçamos novamente o layout.
             */

            try {
                location.hash = "focus" + iteration;
            } catch (e) {
            }

            forceLayout(frame);
            forceLayout(document.documentElement);
        };

        document.getElementById("container").appendChild(frame);

        return frame;
    }

    function runDataScript(frame) {

        /*
         * Mantém a ideia do teste original:
         * um script data: é carregado assincronamente.
         */

        var script = document.createElement("script");

        script.src =
            "data:text/javascript," +
            "Promise.resolve().then(function(){" +
            "var f=document.getElementById('i0');" +
            "if(f){try{f.focus();}catch(e){}}" +
            "});";

        script.onload = function () {

            forceLayout(frame);
            forceLayout(document.documentElement);
        };

        script.onerror = function () {
            forceLayout(frame);
        };

        document.head.appendChild(script);
    }

    function oneIteration() {

        if (!running)
            return;

        iteration++;

        mutateDocument();

        var frame = createFrame();

        /*
         * Primeiro flush de layout após criação do iframe.
         */

        forceLayout(frame);
        forceLayout(document.documentElement);

        /*
         * Carrega o script assíncrono que posteriormente tenta focar
         * o mesmo iframe.
         */

        runDataScript(frame);

        /*
         * Cria várias fronteiras assíncronas para aumentar as
         * possibilidades de interleaving entre layout, focus e
         * lifecycle do iframe.
         */

        Promise.resolve().then(function () {

            forceLayout(frame);

            try {
                frame.focus();
            } catch (e) {
            }

            forceLayout(document.documentElement);

        }).then(function () {

            try {
                location.hash = "async" + iteration;
            } catch (e) {
            }

            forceLayout(frame);

        }).then(function () {

            /*
             * Em algumas iterações, remove o iframe enquanto existem
             * callbacks assíncronos pendentes que podem ainda tentar
             * operar sobre ele.
             */

            if ((iteration % 3) === 0) {

                try {
                    if (frame.parentNode)
                        frame.parentNode.removeChild(frame);
                } catch (e) {
                }

                forceLayout(document.documentElement);
            }

        });

        /*
         * Próxima iteração.
         */

        setTimeout(oneIteration, 50);
    }

    window.start = function () {

        if (running)
            return;

        running = true;
        iteration = 0;

        oneIteration();
    };

})();
</script>

</body>
</html>
