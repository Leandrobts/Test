<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 Web Audio API Detection</title>
</head>
<body>
<pre id="out"></pre>

<script>
(function () {

    var out = document.getElementById("out");

    function typeOfPath(object, property) {
        try {
            return typeof object[property];
        } catch (e) {
            return "ERROR";
        }
    }

    var result = [];

    result.push(
        "AudioContext: " +
        typeOfPath(window, "AudioContext")
    );

    result.push(
        "webkitAudioContext: " +
        typeOfPath(window, "webkitAudioContext")
    );

    result.push(
        "OfflineAudioContext: " +
        typeOfPath(window, "OfflineAudioContext")
    );

    result.push(
        "webkitOfflineAudioContext: " +
        typeOfPath(window, "webkitOfflineAudioContext")
    );

    result.push("");
    result.push("--- constructors ---");

    try {
        var AC =
            window.AudioContext ||
            window.webkitAudioContext;

        if (AC) {
            var context = new AC();

            result.push(
                "AudioContext creation: SUCCESS"
            );

            result.push(
                "createBiquadFilter: " +
                typeof context.createBiquadFilter
            );

            result.push(
                "createGain: " +
                typeof context.createGain
            );

            result.push(
                "sampleRate: " +
                context.sampleRate
            );

        } else {

            result.push(
                "No realtime AudioContext constructor"
            );
        }

    } catch (e) {

        result.push(
            "AudioContext ERROR: " +
            e.name + " - " + e.message
        );
    }

    result.push("");
    result.push("--- OfflineAudioContext ---");

    try {

        var OAC =
            window.OfflineAudioContext ||
            window.webkitOfflineAudioContext;

        if (OAC) {

            result.push(
                "OfflineAudioContext constructor: FOUND"
            );

            try {

                var offline = new OAC(
                    1,
                    1024,
                    44100
                );

                result.push(
                    "OfflineAudioContext creation: SUCCESS"
                );

                result.push(
                    "createBiquadFilter: " +
                    typeof offline.createBiquadFilter
                );

            } catch (e) {

                result.push(
                    "OfflineAudioContext creation ERROR: " +
                    e.name + " - " + e.message
                );
            }

        } else {

            result.push(
                "No OfflineAudioContext constructor"
            );
        }

    } catch (e) {

        result.push(
            "OfflineAudioContext ERROR: " +
            e.name + " - " + e.message
        );
    }

    out.textContent = result.join("\n");

})();
</script>

</body>
</html>
