<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<title>PS4 XML Parser - Diagnostico</title>
<style type="text/css">
body { background:#151923; color:#e6e9f0; font:16px monospace; padding:20px; }
pre { white-space:pre-wrap; overflow-wrap:break-word; }
</style>
</head>
<body>
<h2>PS4 WebKit - Diagnostico XML</h2>
<pre id="log">Iniciando...</pre>
<script type="text/javascript">
//<![CDATA[
(function () {
    var logNode = document.getElementById("log");
    logNode.textContent = "";
    function log(s) { logNode.appendChild(document.createTextNode(s + "\n")); }
    function run(name, fn) {
        try { log(name + ": " + fn()); }
        catch (e) { log(name + ": ERRO " + e.name + " - " + e.message); }
    }
    log("Diagnostico nao destrutivo; sem tentativa de corromper memoria.");
    run("Content-Type", function () { return document.contentType || "indisponivel"; });
    run("XML version", function () { return document.xmlVersion || "indisponivel"; });
    run("customElements", function () { return typeof window.customElements; });
    run("customElements.define", function () {
        return window.customElements ? typeof window.customElements.define : "indisponivel";
    });
    run("MutationObserver", function () { return typeof window.MutationObserver; });
    run("DOMParser", function () { return typeof window.DOMParser; });
    run("createElementNS", function () {
        var e = document.createElementNS("http://www.w3.org/1999/xhtml", "x-probe");
        return "localName=" + e.localName + ", parent=" + (e.parentNode ? "sim" : "null");
    });
    run("appendChild e removeChild", function () {
        var parent = document.createElementNS("http://www.w3.org/1999/xhtml", "div");
        var child = document.createElementNS("http://www.w3.org/1999/xhtml", "x-probe");
        parent.appendChild(child);
        var inserted = child.parentNode === parent;
        parent.removeChild(child);
        return "inserido=" + inserted + ", removido=" + (child.parentNode === null);
    });
    run("importNode", function () {
        var other = document.implementation.createDocument("urn:probe", "probe", null);
        var node = other.createElementNS("urn:probe", "item");
        var copy = document.importNode(node, true);
        return "documento destino correto=" + (copy.ownerDocument === document);
    });
    run("adoptNode", function () {
        var other = document.implementation.createDocument("urn:probe", "probe", null);
        var node = other.createElementNS("urn:probe", "item");
        var adopted = document.adoptNode(node);
        return "documento destino correto=" + (adopted.ownerDocument === document);
    });
    run("DOMParser XML", function () {
        if (!window.DOMParser) return "indisponivel";
        var doc = new DOMParser().parseFromString(
            '<root xmlns="urn:probe"><item>ok</item></root>', "application/xml");
        return "raiz=" + doc.documentElement.localName;
    });
    log("Fim. Este teste nao confirma nem descarta UAF.");
}());
//]]>
</script>
</body>
</html>
