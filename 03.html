<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 Popup Animation Lifecycle Test</title>
</head>

<body>
<script>
(function () {
    var cycle = 0;
    var maxCycles = 30;

    function finish() {
        document.body.textContent =
            "PASS if no crash. Completed " + cycle + " cycles.";
    }

    function runCycle() {
        if (cycle >= maxCycles) {
            finish();
            return;
        }

        cycle++;

        /*
         * Open a small same-origin/about:blank popup.
         */
        var popup = window.open(
            "about:blank",
            "",
            "width=200,height=200"
        );

        /*
         * Popup blocked or unsupported.
         */
        if (!popup) {
            document.body.textContent =
                "Popup could not be opened. Stopped at cycle " + cycle + ".";
            return;
        }

        /*
         * Create the animated content.
         */
        try {
            popup.document.open();
            popup.document.write(
                '<!DOCTYPE html>' +
                '<html>' +
                '<head>' +
                '<meta charset="utf-8">' +
                '<style>' +
                '@keyframes spin {' +
                'from { transform: rotate(0deg); }' +
                'to { transform: rotate(360deg); }' +
                '}' +
                'body { margin: 0; overflow: hidden; }' +
                '#box {' +
                'width: 50px;' +
                'height: 50px;' +
                'animation: spin 10s linear infinite;' +
                'will-change: transform;' +
                '}' +
                '</style>' +
                '</head>' +
                '<body>' +
                '<div id="box"></div>' +
                '</body>' +
                '</html>'
            );
            popup.document.close();
        } catch (e) {
            try {
                popup.close();
            } catch (closeError) {
            }

            setTimeout(runCycle, 0);
            return;
        }

        /*
         * Same structure as the original LayoutTest:
         * wait two animation frames before closing.
         */
        function afterFirstFrame() {
            function afterSecondFrame() {

                /*
                 * Close the popup after it has had an opportunity
                 * to initialize and animate.
                 */
                try {
                    popup.close();
                } catch (e) {
                }

                /*
                 * Start the next lifecycle cycle asynchronously.
                 */
                setTimeout(runCycle, 0);
            }

            if (typeof window.requestAnimationFrame === "function")
                window.requestAnimationFrame(afterSecondFrame);
            else
                setTimeout(afterSecondFrame, 16);
        }

        if (typeof window.requestAnimationFrame === "function")
            window.requestAnimationFrame(afterFirstFrame);
        else
            setTimeout(afterFirstFrame, 16);
    }

    /*
     * Start from a user-visible page context.
     */
    setTimeout(runCycle, 0);

})();
</script>
</body>
</html>
