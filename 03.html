<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Teste de Regressão: Reentrância no timeObserver do MediaPlayer</title>
</head>
<body>
<video id="v" preload="auto" muted playsinline></video>
<div id="log">Executando...</div>

<script>
// Função utilitária de GC via alocação recursiva de memória
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 1000; i++)
        gcRec(10);
}

const video = document.getElementById("v");
let reentrancyCount = 0;
const MAX_ITERATIONS = 40;

// Gera um vídeo curto sintético via Canvas para rodar sem dependências externas
function createDummyVideoTrack() {
    const canvas = document.createElement("canvas");
    canvas.width = 64;
    canvas.height = 64;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "blue";
    ctx.fillRect(0, 0, 64, 64);
    return canvas.captureStream(30);
}

video.srcObject = createDummyVideoTrack();

// Manipulador reentrante que força reconfiguração do time observer
video.ontimeupdate = () => {
    reentrancyCount++;

    // Força reentrância que aciona setTimeObserver internamente no renderer nativo
    video.currentTime = (reentrancyCount % 2) * 0.1;
    video.playbackRate = 1.0 + (reentrancyCount % 3) * 0.25;

    // Dispara pressão de GC para reaproveitar a memória liberada se houver UAF
    if (reentrancyCount % 5 === 0) {
        gc();
    }

    if (reentrancyCount >= MAX_ITERATIONS) {
        video.ontimeupdate = null;
        video.pause();
        document.getElementById("log").innerText = "PASS: Executado sem Use-After-Free por reentrância.";
    }
};

video.play().catch(() => {
    document.getElementById("log").innerText = "PASS: Autoplay restrito, sem crash.";
});
</script>
</body>
</html>
