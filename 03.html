<!DOCTYPE html>
<meta charset="utf-8">
<div id="target"></div>
<script>
  const target = document.getElementById('target');
  const detachedAttr = document.createAttribute('data-test');

  document.evaluate(
    '(id("target") | .)',
    detachedAttr,
    null,
    XPathResult.ORDERED_NODE_SNAPSHOT_TYPE,
    null
  );

  document.evaluate(
    '(id("target") | .)',
    detachedAttr,
    null,
    XPathResult.ORDERED_NODE_ITERATOR_TYPE,
    null
  );

  document.evaluate(
    '(id("target") | .)',
    detachedAttr,
    null,
    XPathResult.FIRST_ORDERED_NODE_TYPE,
    null
  );

  document.evaluate(
    '(id("target") | .)',
    detachedAttr,
    null,
    XPathResult.ANY_UNORDERED_NODE_TYPE,
    null
  );

  document.evaluate(
    '(id("target") | .)',
    detachedAttr,
    null,
    XPathResult.UNORDERED_NODE_SNAPSHOT_TYPE,
    null
  );

  document.evaluate(
    '(id("target") | .)',
    detachedAttr,
    null,
    XPathResult.UNORDERED_NODE_ITERATOR_TYPE,
    null
  );

  detachedAttr.value = 'hello';

  document.evaluate(
    'string((id("target") | .))',
    detachedAttr,
    null,
    XPathResult.STRING_TYPE,
    null
  );

  document.evaluate(
    'string((. | .))',
    detachedAttr,
    null,
    XPathResult.STRING_TYPE,
    null
  );

  const detachedAttr1 = document.createAttribute('data-first');
  document.evaluate(
    '(. | .)',
    detachedAttr1,
    null,
    XPathResult.ORDERED_NODE_SNAPSHOT_TYPE,
    null
  );

  const detachedElement = document.createElement('div');
  document.evaluate(
    '(id("target") | .)',
    detachedElement,
    null,
    XPathResult.ORDERED_NODE_SNAPSHOT_TYPE,
    null
  );

  const disconnectedParent = document.createElement('div');
  const child1 = document.createElement('span');
  const child2 = document.createElement('p');
  disconnectedParent.append(child1, child2);

  document.evaluate(
    '(id("target") | ./p | ./span)',
    disconnectedParent,
    null,
    XPathResult.ORDERED_NODE_SNAPSHOT_TYPE,
    null
  );

  disconnectedParent.setAttribute('data-test', 'val');
  disconnectedParent.getAttributeNode('data-test');
  const child = document.createElement('span');
  disconnectedParent.append(child);

  document.evaluate(
    '(id("target") | . | @* | ./*)',
    disconnectedParent,
    null,
    XPathResult.ORDERED_NODE_SNAPSHOT_TYPE,
    null
  );

  document.evaluate(
    '(id("target") | .)[1]',
    detachedAttr,
    null,
    XPathResult.FIRST_ORDERED_NODE_TYPE,
    null
  );

  document.evaluate(
    '(id("target") | .)[last()]',
    detachedAttr,
    null,
    XPathResult.FIRST_ORDERED_NODE_TYPE,
    null
  );

  document.evaluate(
    '(id("target") | .) = (id("target") | .)',
    detachedAttr,
    null,
    XPathResult.BOOLEAN_TYPE,
    null
  );

  for (const expr of ['parent::*', 'ancestor::*', 'ancestor-or-self::*', 'following::*', 'preceding::*']) {
    document.evaluate(
      expr,
      detachedAttr,
      null,
      XPathResult.ORDERED_NODE_SNAPSHOT_TYPE,
      null
    );
  }

  const container = document.createElement('div');
  document.body.appendChild(container);
  const N = 10005;
  const frag = document.createDocumentFragment();
  const ids = [];
  for (let i = 0; i < N; ++i) {
    const span = document.createElement('span');
    span.id = 'ts' + i;
    ids.push(span.id);
    frag.appendChild(span);
  }
  container.appendChild(frag);

  document.evaluate(
    '(id("' + ids.join(' ') + '") | .)',
    detachedAttr,
    null,
    XPathResult.ORDERED_NODE_SNAPSHOT_TYPE,
    null
  );
  container.remove();

  const disconnectedTree = document.createElement('div');
  disconnectedTree.setAttribute('data-foo', 'bar');
  const frag2 = document.createDocumentFragment();
  for (let i = 0; i < N; ++i) {
    frag2.appendChild(document.createElement('span'));
  }
  disconnectedTree.appendChild(frag2);

  document.evaluate(
    '(id("target") | . | @* | ./*)',
    disconnectedTree,
    null,
    XPathResult.ORDERED_NODE_SNAPSHOT_TYPE,
    null
  );

  const host = document.body.appendChild(document.createElement('div'));
  const containerShadow = host.attachShadow({ mode: 'open' }).appendChild(document.createElement('div'));
  for (let i = 0; i < N; ++i) {
    containerShadow.appendChild(document.createElement('span'));
  }

  document.evaluate(
    '(./span | .)',
    containerShadow,
    null,
    XPathResult.ORDERED_NODE_SNAPSHOT_TYPE,
    null
  );
  host.remove();

  const host2 = document.body.appendChild(document.createElement('div'));
  const containerShadow2 = host2.attachShadow({ mode: 'open' }).appendChild(document.createElement('div'));
  containerShadow2.appendChild(document.createElement('a'));
  containerShadow2.appendChild(document.createElement('b'));

  document.evaluate(
    '(./b | ./a | .)',
    containerShadow2,
    null,
    XPathResult.ORDERED_NODE_SNAPSHOT_TYPE,
    null
  );
  host2.remove();
</script>
