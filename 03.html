<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>blur-window-with-focus-in-shadow-tree - PS4 Phase A</title>
</head>
<body>
<p>This test passes if it does not crash.</p>
<div id="host"></div>
<div id="result"></div>
<button id="run">Run test</button>
<script src="gc.js"></script>
<script>
var shadowRoot;
var victim;
var blurTriggered = false;
var focusTriggered = false;

function runTest() {
    if (!host.attachShadow) {
        result.textContent = 'Shadow DOM not supported';
        return;
    }

    shadowRoot = host.attachShadow({ mode: 'open' });

    victim = document.createElement('div');
    victim.tabIndex = 0;
    victim.textContent = 'Focusable';

    shadowRoot.appendChild(victim);
    victim.focus();

    document.addEventListener('blur', function() {
        blurTriggered = true;

        if (victim) {
            victim.parentNode.removeChild(victim);
            victim = null;
            gc();
        }
    }, true);

    document.addEventListener('focus', function() {
        focusTriggered = true;
    }, true);

    setTimeout(function() {
        window.blur();

        setTimeout(function() {
            if (blurTriggered)
                result.textContent = 'PASS: window blur triggered';
            else
                result.textContent = 'Window blur was not triggered';
        }, 1000);
    }, 500);
}

document.getElementById('run').onclick = runTest;
</script>
</body>
</html>
