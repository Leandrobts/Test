<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Teste de Regressão: Nested Layout UAF em SVGGeometryElement::getPointAtLength</title>
<style>
    .dynamic-style {
        content-visibility: auto;
    }
    .hide {
        display: none;
    }
</style>
</head>
<body>
<div id="container"></div>
<div id="status">Executando teste...</div>

<script>
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 1000; i++)
        gcRec(10);
}

function runSVGPointRaceTest() {
    const container = document.getElementById("container");

    for (let cycle = 0; cycle < 80; cycle++) {
        // 1. Cria a árvore SVG com um elemento de geometria (<path>)
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("width", "300");
        svg.setAttribute("height", "300");

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", "M 10 80 C 40 10, 65 10, 95 80 S 150 150, 180 80");
        path.className.baseVal = "dynamic-style";

        svg.appendChild(path);
        container.appendChild(svg);

        // 2. Força layout inicial para instanciar o RenderSVGShape
        svg.getBoundingClientRect();

        // 3. Modifica estilos/atributos que deixam o layout pendente de invalidação
        path.setAttribute("d", "M 0 0 L 200 200");
        path.style.contentVisibility = (cycle % 2 === 0) ? "hidden" : "visible";

        // 4. Invoca getPointAtLength()
        // Sem o patch, a chamada aninhada interna de getTotalLength() destruía o renderer salvo na pilha
        try {
            const pt = path.getPointAtLength(50);
            if (!pt || typeof pt.x !== "number") {
                throw new Error("Ponto retornado inválido.");
            }
        } catch (e) {
            // InvalidStateError pode ocorrer se o renderizador for desanexado, mas não deve causar crash/UAF
        }

        // 5. Limpa a árvore e aciona GC
        container.innerHTML = "";

        if (cycle % 10 === 0) {
            gc();
        }
    }
}

try {
    runSVGPointRaceTest();
    document.getElementById("status").innerText = "PASS: SVGGeometryElement::getPointAtLength executado sem Use-After-Free.";
} catch (e) {
    document.getElementById("status").innerText = "FAIL: " + e.message;
}
</script>
</body>
</html>
