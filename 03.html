<!DOCTYPE html>
<html>  
<body>  
<script>  
function gc() {
    // Alocações grandes forçam major GC (coleta old generation)
    const MB = 1024 * 1024;
    try {
        for (let i = 0; i < 50; i++) {
            new Uint8Array(2 * MB);
        }
    } catch(e) {}
   // Pressão adicional em objetos para triggerar mark phase
    let arr = [];
    for (let i = 0; i < 50000; i++) {
        arr.push({ x: i, y: i * 2, z: new Array(10) });
    }
    arr = null;
}
const style = document.createElement("style");
document.head.appendChild(style);
const sheet = style.sheet;
sheet.insertRule(".outer { color: red; & .nested { color: blue; } }", 0);
let nestedRules = sheet.cssRules[0].cssRules;
sheet.deleteRule(0);
gc();

const nested = nestedRules[0];
nestedRules = null;
gc();

document.write(nested.parentRule === null ? "PASS" : "FAIL: parentRule is " + nested.parentRule);
</script>
</body>  
</html>
