<!DOCTYPE html>
<html>
<body>
<pre id="resultado"></pre>

<script>
const log = msg => {
    document.getElementById('resultado')
        .textContent += msg + '\n';
};

try {
    const canvas = document.createElement('canvas');
    canvas.width = 10;
    canvas.height = 10;

    const ctx = canvas.getContext('2d');

    log('Canvas 2D: ' + !!ctx);
    log('FontFace: ' + typeof FontFace);
    log('document.fonts: ' + typeof document.fonts);

    if (ctx) {
        ctx.font = '10px Times, testFace';

        const result = ctx.measureText(
            String.fromCharCode(0x13A0)
        );

        log('measureText: ' + result.width);
        log('Font aplicada: ' + ctx.font);
    }

} catch (e) {
    log('Erro: ' + e.name + ': ' + e.message);
}
</script>
</body>
</html>
