<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8">
<title>Fullscreen cancel after request</title>
</head>
<body>

<p>This test passes if it does not crash.</p>

<button id="start">START TEST</button>

<script src="resources/gc.js"></script>

<script>
(function() {
    var iframe = document.body.appendChild(document.createElement("iframe"));
    var div = iframe.contentDocument.body.appendChild(
        document.createElement("div")
    );

    div.style.width = "200px";
    div.style.height = "200px";
    div.style.background = "red";

    document.getElementById("start").addEventListener("click", function() {

        div.webkitRequestFullscreen().catch(function(error) {
            document.body.innerHTML +=
                "<p>requestFullscreen rejected: " + error + "</p>";
        });

        var contentDocument = iframe.contentDocument;

        document.body.removeChild(iframe);

        setTimeout(function() {
            contentDocument.webkitCancelFullScreen();

            if (typeof gc == "function")
                gc();

            document.body.innerHTML +=
                "<p>END OF TEST</p>";

        }, 0);
    }, { once: true });
})();
</script>

</body>
</html>
