<script>
(function () {
    var result = [];

    var host = document.createElement("div");

    result.push(
        "attachShadow: " +
        (typeof host.attachShadow)
    );

    if (typeof host.attachShadow === "function") {
        try {
            var root = host.attachShadow({
                mode: "open",
                slotAssignment: "manual"
            });

            result.push(
                "slotAssignment: " +
                root.slotAssignment
            );

            var slot = document.createElement("slot");

            result.push(
                "slot.assign: " +
                (typeof slot.assign)
            );

            result.push(
                "slot.assignedNodes: " +
                (typeof slot.assignedNodes)
            );

        } catch (e) {
            result.push("Erro: " + e.message);
        }
    }

    document.body.textContent = result.join("\n");
})();
</script>
