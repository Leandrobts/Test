
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Style Scope Destruction Crash Test</title>
<script>
function gc() {
    if (window.GCController) {
        GCController.collect();
        return;
    }
    // Fallback de estresse de memória para forçar o coletor de lixo no motor legado
    for (var i = 0; i < 200; i++) {
        new Uint8Array(1024 * 1024);
    }
}

function main() {
    try {
        // x5, x18 e x11 são resolvidos automaticamente pelos IDs no escopo global do WebKit
        var v63 = x5.attachShadow({mode: "open", delegatesFocus: false});
        
        // Força o cálculo de layout do elemento SVG animado
        var dummyScroll = x18.scrollTop;
        
        // Move o elemento para o Shadow DOM
        v63.appendChild(x11);
        
        // Dispara a coleta de lixo
        gc();
        
        document.body.innerHTML = '<h3 style="color: green;">PASS if it doesn\'t crash.</h3>';
    } catch (e) {
        document.body.innerHTML = '<h3 style="color: red;">Erro: ' + e.message + '</h3>';
    }
}
</script>
</head>
<body onload="main()">
    <!-- Elementos estruturados para mapeamento automático por ID no WebKit legado -->
    <svg id="x11" tabindex="-1">
        <animateTransform id="x18" attributeName="transform" type="translate" from="0 0" to="10 10" dur="0.5s">
        </animateTransform>
    </svg>
    <div id="x5"></div>
</body>
</html>
