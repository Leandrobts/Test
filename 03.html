<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>fullscreen-cancel-after-request-crash</title>
<style>
  body { font-family: sans-serif; padding: 20px; }
  #runBtn { font-size: 18px; padding: 10px 20px; cursor: pointer; }
  #log { margin-top: 20px; white-space: pre-wrap; font-family: monospace; }
  .ok { color: green; }
  .fail { color: red; }
</style>
</head>
<body>
<p><strong>This test passes if it does not crash.</strong></p>
<p>Click the button below to run the test (user gesture required for fullscreen):</p>
<button id="runBtn">Run Test</button>
<div id="log"></div>

<script>
// ---------- Minimal test infrastructure ----------
var testEnded = false;
function consoleWrite(text) {
    if (testEnded) return;
    var span = document.createElement("span");
    document.getElementById("log").appendChild(span);
    span.innerHTML = text + "<br>";
}
function logResult(success, text) {
    if (success)
        consoleWrite(text + " <span class='ok'>OK</span>");
    else
        consoleWrite(text + " <span class='fail'>FAIL</span>");
}
function endTest() {
    if (testEnded) return;
    consoleWrite("END OF TEST");
    testEnded = true;
}

// ---------- GC fallback (from gc.js) ----------
if (!window.gc) {
    window.gc = function() {
        if (window.GCController)
            return GCController.collect();
        function gcRec(n) {
            if (n < 1) return {};
            var temp = {i: "ab" + Math.random()};
            temp += "foo";
            gcRec(n - 1);
        }
        for (var i = 0; i < 10000; i++)
            gcRec(10);
    };
}

// ---------- Test logic (adapted from WebKit commit 633fbf1) ----------
document.getElementById("runBtn").addEventListener("click", function() {
    consoleWrite("Starting test...");

    const iframe = document.body.appendChild(document.createElement("iframe"));
    const div = iframe.contentDocument.body.appendChild(document.createElement("div"));

    // User gesture is now satisfied by the real button click
    div.requestFullscreen().catch(function(error) {
        consoleWrite("Fullscreen rejected (expected): " + error.name);
        endTest();
    });

    const contentDocument = iframe.contentDocument;
    document.body.removeChild(iframe);

    setTimeout(function() {
        contentDocument.webkitCancelFullScreen();
        gc();
        // If we reach here without crash, the UAF is fixed
        if (!testEnded) {
            logResult(true, "No crash occurred after cancel + GC");
            endTest();
        }
    }, 0);
});
</script>
</body>
</html>
