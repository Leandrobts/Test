<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<pre id="log"></pre>
<script>
function log(s) {
    document.getElementById('log').textContent += s + '\n';
}

document.fonts;

var host = document.createElement('div');
document.body.appendChild(host);
var shadow = host.attachShadow({ mode: 'open' });

var pendingUrl = 'data:font/woff;base64,' + 'A'.repeat(150000);
var style = document.createElement('style');
style.textContent =
    '@font-face { font-family: reentryFont; src: url("' + pendingUrl + '"); }' +
    '.probe { font: 24px reentryFont; }';
shadow.appendChild(style);

var probe = document.createElement('span');
probe.className = 'probe';
probe.textContent = 'A';
shadow.appendChild(probe);

document.body.offsetHeight;
document.fonts.load('24px reentryFont', 'A');
log('status: ' + document.fonts.status);

document.fonts.ready;

var prependedStyle = document.createElement('style');
prependedStyle.textContent = '.unused { color: red; }';
shadow.prepend(prependedStyle);
log('apos prepend. status=' + document.fonts.status);

var getterCount = 0;
Object.defineProperty(FontFaceSet.prototype, 'then', {
    configurable: true,
    get: function() {
        delete FontFaceSet.prototype.then;
        getterCount++;
        log('>>> GETTER DISPAROU! count=' + getterCount);
        log('    status no momento: ' + document.fonts.status);
        host.remove();
        log('    apos host.remove() — sem crash ate aqui');
        return undefined;
    }
});

log('getter instalado. status=' + document.fonts.status);
log('aguardando completedLoading() async...');

Promise.resolve().then(function() {
    log('microtask: status=' + document.fonts.status + ' getter=' + getterCount);
});
</script>
</body>
</html>
