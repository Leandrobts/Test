
<!doctype html>
<input id="a">
<script>
var a=document.getElementById("a");

setTimeout(function(){
    window.blur();

    setTimeout(function(){
        window.focus();
        a.focus();

        a.dispatchEvent(new KeyboardEvent("keydown",{
            bubbles:true,
            cancelable:true,
            key:"Tab",
            code:"Tab"
        }));
    },100);
},100);
</script>
