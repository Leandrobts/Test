<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 Focus / Blur Shadow DOM Diagnostic</title>

<style>


#host {
    margin: 20px 0;
    padding: 20px;
    border: 2px solid black;
}

#result {
    white-space: pre-wrap;
    border: 1px solid black;
    padding: 10px;
    margin-top: 20px;
    min-height: 300px;
}
</style>

</head>

<body>

<div id="host"></div>

<button id="other">Other Focusable Element</button>

<div id="result"></div>

<script>

var result = document.getElementById('result');
var host = document.getElementById('host');
var other = document.getElementById('other');

function log(text) {
    console.log(text);
    result.textContent += text + '\n';
}

function nameOf(node) {
    if (!node)
        return 'null';

    if (node === window)
        return 'WINDOW';

    if (node === document)
        return 'DOCUMENT';

    if (node === host)
        return 'HOST';

    if (node === victim)
        return 'VICTIM';

    if (node.id)
        return node.tagName + '#' + node.id;

    return node.tagName || String(node);
}

var shadowRoot = host.attachShadow({ mode: 'open' });

var victim = document.createElement('div');

victim.tabIndex = 0;
victim.textContent = 'Focusable Victim';

victim.style.display = 'block';
victim.style.padding = '20px';
victim.style.border = '2px solid blue';
victim.style.margin = '10px';

shadowRoot.appendChild(victim);


/*
 * Mostra o estado atual do foco.
 */

function dumpFocusState(prefix) {

    var documentActive = document.activeElement;
    var shadowActive = shadowRoot.activeElement;

    log('');
    log('===== ' + prefix + ' =====');

    log(
        'document.activeElement = ' +
        nameOf(documentActive)
    );

    log(
        'shadowRoot.activeElement = ' +
        nameOf(shadowActive)
    );

    log(
        'victim.isConnected = ' +
        victim.isConnected
    );

    log('==========================');
    log('');
}


/*
 * WINDOW
 */

window.addEventListener('focus', function(event) {

    log(
        '[WINDOW CAPTURE] FOCUS target = ' +
        nameOf(event.target)
    );

    dumpFocusState('WINDOW FOCUS');

}, true);


window.addEventListener('blur', function(event) {

    log(
        '[WINDOW CAPTURE] BLUR target = ' +
        nameOf(event.target)
    );

    dumpFocusState('WINDOW BLUR');

}, true);


/*
 * DOCUMENT
 */

document.addEventListener('focus', function(event) {

    log(
        '[DOCUMENT CAPTURE] FOCUS target = ' +
        nameOf(event.target)
    );

    dumpFocusState('DOCUMENT FOCUS');

}, true);


document.addEventListener('blur', function(event) {

    log(
        '[DOCUMENT CAPTURE] BLUR target = ' +
        nameOf(event.target)
    );

    dumpFocusState('DOCUMENT BLUR');

}, true);


/*
 * HOST
 */

host.addEventListener('focus', function(event) {

    log(
        '[HOST CAPTURE] FOCUS target = ' +
        nameOf(event.target)
    );

}, true);


host.addEventListener('blur', function(event) {

    log(
        '[HOST CAPTURE] BLUR target = ' +
        nameOf(event.target)
    );

}, true);


/*
 * VICTIM
 */

victim.addEventListener('focus', function(event) {

    log(
        '[VICTIM] FOCUS target = ' +
        nameOf(event.target)
    );

    dumpFocusState('VICTIM FOCUS');

});


victim.addEventListener('blur', function(event) {

    log(
        '[VICTIM] BLUR target = ' +
        nameOf(event.target)
    );

    dumpFocusState('VICTIM BLUR');

});


/*
 * OTHER BUTTON
 */

other.addEventListener('focus', function(event) {

    log('[OTHER] FOCUS');

    dumpFocusState('OTHER FOCUS');

});


other.addEventListener('blur', function(event) {

    log('[OTHER] BLUR');

    dumpFocusState('OTHER BLUR');

});


/*
 * CLICK DIAGNOSTICS
 */

document.addEventListener('click', function(event) {

    log(
        '[DOCUMENT] CLICK target = ' +
        nameOf(event.target)
    );

    dumpFocusState('AFTER CLICK');

}, true);


/*
 * INITIAL STATE
 */

log('======================================');
log('PS4 FOCUS / BLUR DIAGNOSTIC STARTED');
log('======================================');

dumpFocusState('BEFORE victim.focus()');


/*
 * Focus the element inside Shadow DOM.
 */

log('Calling victim.focus()');

victim.focus();


dumpFocusState('AFTER victim.focus()');


/*
 * Wait one complete async cycle and inspect focus again.
 */

requestAnimationFrame(function() {

    setTimeout(function() {

        dumpFocusState('AFTER rAF + setTimeout');

        log('');
        log('TEST READY');
        log('');
        log('Now test the following:');
        log('1. Do nothing.');
        log('2. Click on the Focusable Victim.');
        log('3. Click on Other Focusable Element.');
        log('4. Click elsewhere on the page.');
        log('5. If applicable, leave and return to the browser.');
        log('');

    }, 0);

});

</script>

</body>
</html>
