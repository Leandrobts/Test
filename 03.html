
<!doctype html>
<body>
<iframe id=f srcdoc="<div id=d>TEST</div>"></iframe>
<script>
setTimeout(()=>{
  d=f.contentDocument.getElementById('d');
  d.requestFullscreen().catch(()=>{});
  let x=f.contentDocument;
  f.remove();
  setTimeout(()=>x.webkitCancelFullScreen(),0);
},0);
</script>
