<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<pre id="log">Testando...</pre>
<script>
function log(msg) { document.getElementById('log').textContent = msg; }

var results = [];

// 1. transferControlToOffscreen disponivel?
var tcoSupport = typeof HTMLCanvasElement !== 'undefined' &&
                 typeof HTMLCanvasElement.prototype.transferControlToOffscreen === 'function';
results.push('transferControlToOffscreen: ' + (tcoSupport ? 'DISPONIVEL' : 'AUSENTE'));

// 2. OffscreenCanvas disponivel no main thread?
var ocMainSupport = typeof OffscreenCanvas !== 'undefined';
results.push('OffscreenCanvas (main thread): ' + (ocMainSupport ? 'DISPONIVEL' : 'AUSENTE'));

// 3. Blob Worker funciona?
var blobWorkerBody = 'postMessage(typeof OffscreenCanvas !== "undefined" ? "OC:SIM" : "OC:NAO");';
try {
    var blob = new Blob([blobWorkerBody], { type: 'application/javascript' });
    var blobURL = URL.createObjectURL(blob);
    var w = new Worker(blobURL);
    w.onmessage = function(e) {
        results.push('Blob Worker: DISPONIVEL');
        results.push('OffscreenCanvas (dentro de Worker): ' + e.data);
        URL.revokeObjectURL(blobURL);
        finish();
    };
    w.onerror = function(e) {
        results.push('Blob Worker: ERRO — ' + e.message);
        finish();
    };
} catch(e) {
    results.push('Blob Worker: EXCECAO — ' + e.message);
    finish();
}

// 4. Se transferControlToOffscreen disponivel, testar transferencia real
if (tcoSupport) {
    try {
        var testCanvas = document.createElement('canvas');
        testCanvas.width = 4; testCanvas.height = 4;
        var offscreen = testCanvas.transferControlToOffscreen();
        results.push('transferControlToOffscreen() — execucao: OK');
        results.push('offscreen instanceof OffscreenCanvas: ' + (offscreen instanceof OffscreenCanvas));
    } catch(e) {
        results.push('transferControlToOffscreen() — execucao: ERRO — ' + e.message);
    }
}

function finish() {
    log(results.join('\n') + '\n\n' +
        '---\n' +
        'Para o UAF do commit 5ccd64b funcionar no PS4, precisa:\n' +
        '  [1] Blob Worker: DISPONIVEL\n' +
        '  [2] OffscreenCanvas dentro de Worker: OC:SIM\n' +
        '       OU\n' +
        '  [2] transferControlToOffscreen: DISPONIVEL\n' +
        '       + Blob Worker: DISPONIVEL');
}

// Timeout caso o worker nao responda
setTimeout(function() {
    if (results.length < 4) {
        results.push('Worker: sem resposta em 3s');
        finish();
    }
}, 3000);
</script>
</body>
</html>
