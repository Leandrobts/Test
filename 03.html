
<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<title>Fullscreen Popup Blur Test</title>
</head>
<body><button id="run">Run Test</button>

<div id="status">Preparing iframe...</div><iframe
    id="testFrame"
    src="about:blank"
    style="width:300px;height:150px;border:1px solid black;">
</iframe><script>
var iframe = document.getElementById("testFrame");
var popup = null;

iframe.onload = function() {

    var doc = iframe.contentDocument;

    doc.open();

    doc.write(
        '<!DOCTYPE html>' +
        '<html>' +
        '<body>' +
        '<p>Iframe ready</p>' +
        '<div style="width:200px;height:100px;background:blue"></div>' +
        '</body>' +
        '</html>'
    );

    doc.close();

    document.getElementById("status").textContent =
        "Iframe ready";
};

document.getElementById("run").onclick = function() {

    var status = document.getElementById("status");

    popup = window.open(
        "./blur-test-popup.html",
        "_blank",
        "width=500,height=400"
    );

    if (!popup) {
        status.textContent = "Popup blocked";
        return;
    }

    status.textContent =
        "Popup opened";

    setTimeout(function() {

        if (!popup || popup.closed)
            return;

        popup.focus();

        status.textContent =
            "Popup focused";

        setTimeout(function() {

            window.focus();

            status.textContent =
                "Focus returned to main page";

            setTimeout(function() {

                if (!popup || popup.closed)
                    return;

                status.textContent =
                    "Closing popup";

                popup.close();

                setTimeout(function() {

                    if (iframe) {
                        iframe.remove();
                    }

                    status.textContent =
                        "Popup closed and iframe removed";

                }, 100);

            }, 500);

        }, 700);

    }, 700);
};

window.addEventListener("blur", function() {
    document.getElementById("status").textContent =
        "MAIN PAGE BLUR";
});

window.addEventListener("focus", function() {
    document.getElementById("status").textContent =
        "MAIN PAGE FOCUS";
});
</script></body>
</html>
