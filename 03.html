
<!DOCTYPE html>
<html>
<body>
<h2>Teste de Regressão - Node rootNode UAF</h2>
<p>Este teste valida se a manipulação de árvore de nós destacados e GC não gera crash.</p>
<div id="result">Executando...</div>

<script>
function runTest() {
    try {
        // Cria elementos básicos suportados em qualquer versão do WebKit antigo
        var root = document.createElement('div');
        var input = document.createElement('input');
        input.type = 'radio';
        input.name = 'g';
        root.appendChild(input);

        // Cria o treeWalker com o input isolado
        var treeWalker = document.createTreeWalker(input);

        // Força a coleta de lixo para testar o ponteiro estático corrigido no commit
        if (typeof GCController !== 'undefined') {
            GCController.collect();
        } else {
            // Fallback de estresse de memória caso GCController não esteja exposto
            for (let i = 0; i < 5000; i++) {
                new ArrayBuffer(0x1000);
            }
        }

        // Altera a propriedade checked do nó para disparar a árvore de nós sombra
        treeWalker.currentNode.checked = true;

        document.getElementById('result').innerHTML = '<span style="color: green; font-weight: bold;">PASS</span>';
    } catch (e) {
        document.getElementById('result').innerHTML = '<span style="color: red; font-weight: bold;">ERRO: ' + e.message + '</span>';
    }
}

// Dispara o teste logo após o carregamento
window.onload = runTest;
</script>
</body>
</html>
