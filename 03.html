
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Shadow Host Lifetime - PS4</title>
</head>
<body>
<h2>Teste Shadow Host - PS4</h2>
<pre id="log"></pre>

<script>
(function () {
    var output = document.getElementById("log");

    function log(message) {
        output.appendChild(
            document.createTextNode(message + "\n")
        );
    }

    var container = document.createElement("div");
    var host = document.createElement("div");

    document.body.appendChild(container);
    container.appendChild(host);

    var shadow = host.attachShadow({ mode: "open" });
    var child = document.createElement("span");
    shadow.appendChild(child);

    log("ANTES DA REMOCAO");
    log("shadow.host === host: " + (shadow.host === host));
    log("child root === shadow: " +
        (child.getRootNode() === shadow));
    log("composed root === document: " +
        (child.getRootNode({ composed: true }) === document));

    container.removeChild(host);

    log("");
    log("DEPOIS DA REMOCAO");
    log("shadow.host === host: " + (shadow.host === host));
    log("shadow.host === null: " + (shadow.host === null));
    log("child root === shadow: " +
        (child.getRootNode() === shadow));
    log("composed root === host: " +
        (child.getRootNode({ composed: true }) === host));

    log("");
    log("TEST COMPLETE");
})();
</script>
</body>
</html>
