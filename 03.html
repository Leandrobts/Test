<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<title>PS4 WebKit Focus Lifecycle V3</title><style>
html, body {
    margin: 0;
    padding: 0;
}

#root {
    width: 100%;
}

.container {
    width: 100%;
    height: 190px;
    overflow: auto;
    margin-bottom: 12px;
}

.panel {
    width: 96%;
    height: 130px;
    margin: 5px;
    overflow: auto;
}

.target {
    display: block;
    width: 180px;
    height: 28px;
    margin: 6px;
}

.block {
    height: 24px;
    margin: 2px;
}

#focusA,
#focusB {
    width: 220px;
    height: 30px;
}
</style></head><body><div id="root"><div id="containerA" class="container">

    <div id="mainA" class="panel">

        <input id="focusA"
               class="target"
               type="text"
               value="MAIN-A">

        <button id="buttonA"
                class="target"
                type="button">
            BUTTON-A
        </button>

        <div id="blocksA"></div>

        <iframe id="frameA"></iframe>

    </div>

</div>

<div id="containerB" class="container">

    <div id="mainB" class="panel">

        <input id="focusB"
               class="target"
               type="text"
               value="MAIN-B">

        <button id="buttonB"
                class="target"
                type="button">
            BUTTON-B
        </button>

        <div id="blocksB"></div>

        <iframe id="frameB"></iframe>

    </div>

</div>

</div><script>
(function () {

    var root = document.getElementById("root");

    var containerA = document.getElementById("containerA");
    var containerB = document.getElementById("containerB");

    var mainA = document.getElementById("mainA");
    var mainB = document.getElementById("mainB");

    var frameA = document.getElementById("frameA");
    var frameB = document.getElementById("frameB");

    var focusA = document.getElementById("focusA");
    var focusB = document.getElementById("focusB");

    var buttonA = document.getElementById("buttonA");
    var buttonB = document.getElementById("buttonB");

    var oldDocumentA = null;
    var oldDocumentB = null;

    var oldBodyA = null;
    var oldBodyB = null;

    var oldInputA = null;
    var oldInputB = null;

    var oldButtonA = null;
    var oldButtonB = null;

    var oldFrameBodyA = null;
    var oldFrameBodyB = null;

    var navA = null;
    var navB = null;

    var phase = 0;

    function savePhase(value) {

        phase = value;

        try {
            localStorage.setItem(
                "webkit_focus_lifecycle_v3",
                JSON.stringify({
                    phase: value,
                    time: Date.now()
                })
            );
        } catch (e) {
        }
    }

    function layout(node) {

        try {

            if (!node)
                return;

            node.offsetHeight;
            node.offsetWidth;

            if (node.scrollTop !== undefined)
                node.scrollTop = node.scrollTop + 1;

        } catch (e) {
        }
    }

    function populateMain() {

        try {

            var fragmentA = document.createDocumentFragment();
            var fragmentB = document.createDocumentFragment();

            var i;

            for (i = 0; i < 24; i++) {

                var a = document.createElement("div");
                a.className = "block";
                a.appendChild(
                    document.createTextNode("A-" + i)
                );

                fragmentA.appendChild(a);

                var b = document.createElement("div");
                b.className = "block";
                b.appendChild(
                    document.createTextNode("B-" + i)
                );

                fragmentB.appendChild(b);
            }

            document.getElementById("blocksA")
                .appendChild(fragmentA);

            document.getElementById("blocksB")
                .appendChild(fragmentB);

        } catch (e) {
        }
    }

    function buildFrameA() {

        try {

            var doc = frameA.contentDocument;

            if (!doc)
                return;

            oldDocumentA = doc;

            doc.open();

            doc.write(
                '<!DOCTYPE html>' +
                '<html>' +
                '<head>' +
                '<meta charset="UTF-8">' +
                '<style>' +
                'body{margin:0;height:1200px;}' +
                '#panel{height:600px;overflow:auto;}' +
                '.x{height:28px;margin:3px;}' +
                '</style>' +            '</head>' +
            '<body>' +

            '<div id="panel">' +

            '<input id="inputA" ' +
            'class="x" ' +
            'type="text" value="FRAME-A">' +

            '<button id="buttonA" ' +
            'class="x" type="button">' +
            'FRAME-A-BUTTON' +
            '</button>' +

            '<a id="navA" href="data:text/html,' +
            encodeURIComponent(
                '<!DOCTYPE html>' +
                '<html><body>' +
                '<input id="destination" value="DEST-A">' +
                '<div id="destinationBox">' +
                'DESTINATION-A' +
                '</div>' +
                '</body></html>'
            ) +
            '">' +
            'NAV-A' +
            '</a>' +

            '<div class="x">A1</div>' +
            '<div class="x">A2</div>' +
            '<div class="x">A3</div>' +
            '<div class="x">A4</div>' +
            '<div class="x">A5</div>' +
            '<div class="x">A6</div>' +

            '</div>' +

            '</body>' +
            '</html>'
        );

        doc.close();

        oldBodyA = doc.body;

        oldInputA = doc.getElementById("inputA");
        oldButtonA = doc.getElementById("buttonA");

        navA = doc.getElementById("navA");

        oldFrameBodyA = oldBodyA;

    } catch (e) {
    }
}

function buildFrameB() {

    try {

        var doc = frameB.contentDocument;

        if (!doc)
            return;

        oldDocumentB = doc;

        doc.open();

        doc.write(
            '<!DOCTYPE html>' +
            '<html>' +
            '<head>' +
            '<meta charset="UTF-8">' +
            '<style>' +
            'body{margin:0;height:1200px;}' +
            '#panel{height:600px;overflow:auto;}' +
            '.x{height:28px;margin:3px;}' +
            '</style>' +
            '</head>' +
            '<body>' +

            '<div id="panel">' +

            '<input id="inputB" ' +
            'class="x" ' +
            'type="text" value="FRAME-B">' +

            '<button id="buttonB" ' +
            'class="x" type="button">' +
            'FRAME-B-BUTTON' +
            '</button>' +

            '<a id="navB" href="data:text/html,' +
            encodeURIComponent(
                '<!DOCTYPE html>' +
                '<html><body>' +
                '<input id="destination" value="DEST-B">' +
                '<div id="destinationBox">' +
                'DESTINATION-B' +
                '</div>' +
                '</body></html>'
            ) +
            '">' +
            'NAV-B' +
            '</a>' +

            '<div class="x">B1</div>' +
            '<div class="x">B2</div>' +
            '<div class="x">B3</div>' +
            '<div class="x">B4</div>' +
            '<div class="x">B5</div>' +
            '<div class="x">B6</div>' +

            '</div>' +

            '</body>' +
            '</html>'
        );

        doc.close();

        oldBodyB = doc.body;

        oldInputB = doc.getElementById("inputB");
        oldButtonB = doc.getElementById("buttonB");

        navB = doc.getElementById("navB");

        oldFrameBodyB = oldBodyB;

    } catch (e) {
    }
}

function focusMainA() {

    try {

        if (focusA)
            focusA.focus();

        layout(mainA);

    } catch (e) {
    }
}

function focusMainB() {

    try {

        if (focusB)
            focusB.focus();

        layout(mainB);

    } catch (e) {
    }
}

function focusFrameAInput() {

    try {

        if (oldInputA)
            oldInputA.focus();

        layout(oldBodyA);

    } catch (e) {
    }
}

function focusFrameBInput() {

    try {

        if (oldInputB)
            oldInputB.focus();

        layout(oldBodyB);

    } catch (e) {
    }
}

function focusFrameAButton() {

    try {

        if (oldButtonA)
            oldButtonA.focus();

        layout(oldBodyA);

    } catch (e) {
    }
}

function focusFrameBButton() {

    try {

        if (oldButtonB)
            oldButtonB.focus();

        layout(oldBodyB);

    } catch (e) {
    }
}

function mutateFocusedMainA() {

    try {

        var n = document.createElement("div");

        n.className = "block";
        n.appendChild(
            document.createTextNode("MUTATE-A")
        );

        mainA.insertBefore(
            n,
            mainA.firstChild
        );

        layout(mainA);

    } catch (e) {
    }
}

function mutateFocusedMainB() {

    try {

        var n = document.createElement("div");

        n.className = "block";
        n.appendChild(
            document.createTextNode("MUTATE-B")
        );

        mainB.insertBefore(
            n,
            mainB.firstChild
        );

        layout(mainB);

    } catch (e) {
    }
}

function mutateFrameA() {

    try {

        if (!oldBodyA)
            return;

        var n = oldDocumentA.createElement("div");

        n.className = "x";
        n.appendChild(
            oldDocumentA.createTextNode("MUTATE-A")
        );

        oldBodyA.appendChild(n);

        layout(oldBodyA);

    } catch (e) {
    }
}

function mutateFrameB() {

    try {

        if (!oldBodyB)
            return;

        var n = oldDocumentB.createElement("div");

        n.className = "x";
        n.appendChild(
            oldDocumentB.createTextNode("MUTATE-B")
        );

        oldBodyB.appendChild(n);

        layout(oldBodyB);

    } catch (e) {
    }
}

function navigateFrameA() {

    try {

        if (navA)
            navA.click();

    } catch (e) {
    }
}

function navigateFrameB() {

    try {

        if (navB)
            navB.click();

    } catch (e) {
    }
}

function removeFrameA() {

    try {

        if (frameA.parentNode)
            frameA.parentNode.removeChild(frameA);

    } catch (e) {
    }
}

function removeFrameB() {

    try {

        if (frameB.parentNode)
            frameB.parentNode.removeChild(frameB);

    } catch (e) {
    }
}

function removeContainerA() {

    try {

        if (containerA.parentNode)
            containerA.parentNode.removeChild(containerA);

    } catch (e) {
    }
}

function removeContainerB() {

    try {

        if (containerB.parentNode)
            containerB.parentNode.removeChild(containerB);

    } catch (e) {
    }
}

function restoreA() {

    try {

        if (!containerA.parentNode)
            root.appendChild(containerA);

        if (!frameA.parentNode)
            mainA.appendChild(frameA);

    } catch (e) {
    }
}

function restoreB() {

    try {

        if (!containerB.parentNode)
            root.appendChild(containerB);

        if (!frameB.parentNode)
            mainB.appendChild(frameB);

    } catch (e) {
    }
}

function accessOldA() {

    try {

        if (!oldDocumentA)
            return;

        if (oldDocumentA.body) {

            layout(oldDocumentA.body);

            if (oldDocumentA.body.firstChild)
                oldDocumentA.body.appendChild(
                    oldDocumentA.body.firstChild
                );
        }

        if (oldInputA)
            oldInputA.focus();

        if (oldButtonA)
            oldButtonA.focus();

    } catch (e) {
    }
}

function accessOldB() {

    try {

        if (!oldDocumentB)
            return;

        if (oldDocumentB.body) {

            layout(oldDocumentB.body);

            if (oldDocumentB.body.firstChild)
                oldDocumentB.body.appendChild(
                    oldDocumentB.body.firstChild
                );
        }

        if (oldInputB)
            oldInputB.focus();

        if (oldButtonB)
            oldButtonB.focus();

    } catch (e) {
    }
}

function phase1() {

    savePhase(1);

    populateMain();

    buildFrameA();
    buildFrameB();

    setTimeout(phase2, 100);
}

function phase2() {

    savePhase(2);

    focusMainA();

    setTimeout(phase3, 70);
}

function phase3() {

    savePhase(3);

    focusFrameAInput();

    setTimeout(phase4, 70);
}

function phase4() {

    savePhase(4);

    mutateFrameA();

    focusFrameAButton();

    setTimeout(phase5, 70);
}

function phase5() {

    savePhase(5);

    focusMainB();

    mutateFocusedMainA();

    setTimeout(phase6, 70);
}

function phase6() {

    savePhase(6);

    focusFrameBInput();

    setTimeout(phase7, 70);
}

function phase7() {

    savePhase(7);

    mutateFrameB();

    focusFrameBButton();

    setTimeout(phase8, 70);
}

function phase8() {

    savePhase(8);

    /*
     * Frame A is focused and is now navigated.
     */

    focusFrameAInput();

    navigateFrameA();

    setTimeout(phase9, 120);
}

function phase9() {

    savePhase(9);

    /*
     * Transfer focus away from the navigating frame.
     */

    focusMainB();

    setTimeout(phase10, 70);
}

function phase10() {

    savePhase(10);

    /*
     * Detach the navigating iframe.
     */

    removeFrameA();

    setTimeout(phase11, 80);
}

function phase11() {

    savePhase(11);

    /*
     * Operate on references retained from
     * the previous document.
     */

    accessOldA();

    focusMainA();

    setTimeout(phase12, 80);
}

function phase12() {

    savePhase(12);

    /*
     * Independent B sequence:
     * focus -> mutation -> detach.
     */

    focusFrameBInput();

    mutateFrameB();

    setTimeout(phase13, 70);
}

function phase13() {

    savePhase(13);

    removeFrameB();

    setTimeout(phase14, 80);
}

function phase14() {

    savePhase(14);

    accessOldB();

    focusMainB();

    setTimeout(phase15, 80);
}

function phase15() {

    savePhase(15);

    /*
     * Now remove the containers rather than
     * the iframe elements individually.
     */

    restoreA();
    restoreB();

    focusMainA();

    removeContainerA();

    setTimeout(phase16, 80);
}

function phase16() {

    savePhase(16);

    accessOldA();

    focusMainB();

    removeContainerB();

    setTimeout(phase17, 80);
}

function phase17() {

    savePhase(17);

    accessOldA();
    accessOldB();

    setTimeout(phase18, 100);
}

function phase18() {

    savePhase(18);

    /*
     * Restore both branches.
     */

    restoreA();
    restoreB();

    setTimeout(phase19, 100);
}

function phase19() {

    savePhase(19);

    /*
     * Second lifecycle transition using the
     * already-created iframe objects.
     */

    buildFrameA();
    buildFrameB();

    focusFrameAInput();

    setTimeout(phase20, 100);
}

function phase20() {

    savePhase(20);

    navigateFrameA();

    focusFrameBInput();

    setTimeout(phase21, 120);
}

function phase21() {

    savePhase(21);

    removeFrameA();

    focusMainB();

    mutateFrameB();

    setTimeout(phase22, 80);
}

function phase22() {

    savePhase(22);

    removeFrameB();

    focusMainA();

    setTimeout(phase23, 80);
}

function phase23() {

    savePhase(23);

    accessOldA();
    accessOldB();

    setTimeout(phase24, 100);
}

function phase24() {

    savePhase(24);

    /*
     * Final cleanup.
     */

    restoreA();
    restoreB();

    focusMainB();

    layout(root);

    savePhase(25);
}

/*
 * The two iframe elements are already present
 * in the initial DOM before this sequence starts.
 */

savePhase(0);

setTimeout(phase1, 100);

})();
</script>

</body>
</html>
