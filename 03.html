<!DOCTYPE html>
<html>
<body>
<script>
function f(s, n) {
    return s.substr(2, n);
}

const s = "x".repeat(64);

for (let i = 0; i < 10000; i++) {
    const r = f(s, -2147483648);

    if (r.length !== 0 || r !== "") {
        document.body.innerHTML +=
            "Unexpected result: length=" + r.length + "<br>";
        break;
    }
}

const bad = f(s, -2147483648);
const copied = bad.substr(0, 80);

document.body.innerHTML +=
    "bad.length = " + bad.length + "<br>" +
    "copied.length = " + copied.length + "<br>" +
    "copied = [" + copied + "]";
</script>
</body>
</html>
