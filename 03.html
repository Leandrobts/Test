
<!DOCTYPE html>
<p>This test passes if it does not crash.</p>
<div id="status">Running...</div>
<script>
  let face = new FontFace('MyTestFam', 'local(Helvetica)');
  document.fonts.add(face);

  let context = document.createElement('canvas').getContext('2d');
  context.save();
  context.lineWidth = 0.5;
  context.font = '10px MyTestFam';

  // O TRUQUE: Forçar um reflow síncrono no DOM imediatamente após configurar a fonte.
  // Isso obriga o WebKit a processar estilos pendentes e fontes na marra no call stack atual.
  document.body.offsetTop; // Lê uma propriedade de layout para forçar o flush síncrono

  let reentered = false;
  Object.defineProperty(FontFace.prototype, 'then', {
    configurable: true,
    get() {
      if (reentered)
        return undefined;
      reentered = true;
      for (let i = 0; i < 18; i++) {
        context.save();
        context.lineWidth = 1 + i;
      }
      reentered = false;
      return undefined;
    }
  });

  // Tenta medir o texto logo após o reflow forçado
  context.measureText('a');
  document.getElementById('status').innerText = "PASS if no crash";
</script>
