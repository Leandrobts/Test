<!DOCTYPE html>
<html>
<body>
    <p>Teste de perda de foco no WebKit PS4</p>
    <button id="start">Iniciar teste</button>
    <pre id="result"></pre>

    <div id="host"></div>

    <script>
        var result = document.getElementById('result');
        var host = document.getElementById('host');

        var shadowRoot = host.attachShadow({ mode: 'open' });

        var victim = document.createElement('div');
        victim.tabIndex = 0;
        victim.textContent = 'Focusable';

        shadowRoot.appendChild(victim);

        function log(message) {
            result.textContent += message + '\n';
        }

        document.addEventListener('blur', function(event) {
            log('BLUR detectado: ' + event.target.nodeName);

            if (victim) {
                victim.remove();
                victim = null;
                log('Elemento removido');
            }
        }, true);

        document.getElementById('start').onclick = function() {
            victim.focus();

            log('Elemento focado');
            log('Tentando perder foco da janela...');

            var popup = window.open('about:blank', '_blank');

            if (popup) {
                popup.focus();
                log('Tentativa de transferência de foco');
            } else {
                log('Popup bloqueado');
            }
        };
    </script>
</body>
</html>
