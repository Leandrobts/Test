
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
input {
    width: 300px;
    height: 50px;
    font-size: 18px;
}
</style>
</head>
<body>
<h2>Teste de Regressão - DataListButton UAF</h2>
<p>Toque na caixa de texto abaixo para disparar a troca de tipo e testar a estabilidade:</p>

<input id="input" type="text" list="list">
<datalist id="list">
    <option value="Opção A">
    <option value="Opção B">
</datalist>

<div id="result" style="margin-top: 20px; font-family: monospace;"></div>

<script>
function gc() {
    if (typeof GCController !== "undefined") {
        GCController.collect();
    } else {
        var gcRec = function (n) {
            if (n < 1) return {};
            var temp = {i: "ab" + i + (i / 100000)};
            temp += "foo";
            gcRec(n-1);
        };
        for (var i = 0; i < 1000; i++)
            gcRec(10);
    }
}

window.addEventListener('load', () => {
    const input = document.getElementById('input');
    const result = document.getElementById('result');

    input.addEventListener('click', (e) => {
        // Altera o tipo no meio do evento de clique, destruindo o TextFieldInputType antigo
        input.type = 'button';
        gc();
        result.innerHTML = '<span style="color: green; font-weight: bold;">PASS if no crash.</span>';
    }, { once: true });

    // Foco inicial para garantir que o elemento esteja ativo
    input.focus();
});
</script>
</body>
</html>
