
<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<title>Blur UAF Launcher</title>
</head>
<body><button id="run">Run Test</button>

<div id="status">Ready</div><iframe
    id="testFrame"
    src="about:blank"
    style="width:300px;height:150px;border:1px solid black;">
</iframe><script>
var iframe = document.getElementById("testFrame");
var popup = null;

iframe.onload = function() {

    var doc = iframe.contentDocument;

    doc.open();
    doc.write(
        '<!DOCTYPE html>' +
        '<html><body>' +
        '<p>Iframe ready</p>' +
        '</body></html>'
    );
    doc.close();

    document.getElementById("status").textContent =
        "Iframe ready";
};

document.getElementById("run").onclick = function() {

    var status = document.getElementById("status");

    popup = window.open(
        "./blur-test-popup.html",
        "_blank",
        "width=500,height=400"
    );

    if (!popup) {
        status.textContent = "Popup blocked";
        return;
    }

    status.textContent = "Popup opened";

    setTimeout(function() {

        if (!popup || popup.closed)
            return;

        popup.focus();

        status.textContent =
            "Popup focused";

        setTimeout(function() {

            window.focus();

            status.textContent =
                "Focus returned to main page";

        }, 500);

    }, 700);
};
</script></body>
</html>
