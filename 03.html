<!DOCTYPE html>
<html>
<body>
<div id="result"></div>
<script>
function log(msg) {
    var d = document.createElement('div');
    d.textContent = msg;
    result.appendChild(d);
}

// Scan completo de APIs internas do JSC
var candidates = [
    'gc', '$vm', '$jsc', 'GCController',
    'gcAndSweep', 'fullGC', 'edenGC',
    'collectGarbage', 'jscTest', 'webkit',
    'internals', 'testRunner', 'debug',
    'jscOptions', 'jscStack'
];

candidates.forEach(function(k) {
    try {
        var t = typeof window[k];
        if (t !== 'undefined') {
            log('[FOUND] ' + k + ' → ' + t);
            if (t === 'function') {
                log('  .toString: ' + window[k].toString().slice(0, 120));
            }
        }
    } catch(e) {
        log('[ERR] ' + k + ': ' + e.message);
    }
});

// Testa gc() diretamente (às vezes disponível sem aparecer no typeof window)
try {
    gc();
    log('[gc()] EXISTE e executou sem erro');
} catch(e) {
    log('[gc()] nao disponivel: ' + e.message);
}

// Testa $vm (JSC internal - exposto em alguns WebKit internos)
try {
    var res = $vm.gc();
    log('[$vm.gc()] EXECUTOU: ' + JSON.stringify(res));
} catch(e) {
    log('[$vm] nao disponivel: ' + e.message);
}

log('[Done] scan concluido');
</script>
</body>
</html>
