<!doctype html>
<html><head><meta charset="utf-8"><title>PS4 WebKit - Diagnostico de compatibilidade</title><style>body{font:16px sans-serif;background:#171b25;color:#eee;padding:16px}button{font-size:17px;padding:10px;margin:5px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#262d3b;padding:12px} .ok{color:#8ee2a0}</style></head><body><h2>Diagnóstico WebKit PS4 — foco e Shadow DOM</h2><p>Este teste não executa GC forçado nem tenta causar falhas de memória.</p><button onclick="run()">Executar diagnóstico</button><button onclick="window.print()">Imprimir resultados</button><pre id="output">Aguardando...</pre><div id="sandbox"></div><script>
(function(){
var out=document.getElementById('output'), box=document.getElementById('sandbox');
function log(s){out.appendChild(document.createTextNode(s+'\n'));}
function check(name,fn){try{var r=fn();log((r?'SIM':'NAO')+' | '+name);return !!r;}catch(e){log('ERRO | '+name+' | '+e.name+': '+e.message);return false;}}
window.run=function(){out.textContent='';box.innerHTML='';
log('User agent: '+navigator.userAgent);log('Data: '+new Date().toString());
check('document.createElement',function(){return !!document.createElement;});
check('document.createTreeWalker',function(){return typeof document.createTreeWalker==='function';});
check('Element.prototype.attachShadow (Shadow DOM v1)',function(){return typeof Element.prototype.attachShadow==='function';});
check('Element.prototype.createShadowRoot (Shadow DOM antigo)',function(){return typeof Element.prototype.createShadowRoot==='function';});
check('Element.prototype.remove',function(){return typeof Element.prototype.remove==='function';});
check('Element.prototype.focus',function(){return typeof HTMLElement.prototype.focus==='function';});
check('Element.prototype.blur',function(){return typeof HTMLElement.prototype.blur==='function';});
check('addEventListener com captura',function(){return typeof document.addEventListener==='function';});
check('requestAnimationFrame',function(){return typeof window.requestAnimationFrame==='function';});
check('Promise',function(){return typeof window.Promise==='function';});
check('GCController.collect (apenas ambiente de testes)',function(){return !!(window.GCController&&typeof GCController.collect==='function');});
check('testRunner (apenas ambiente de testes)',function(){return !!window.testRunner;});
check('UIHelper (biblioteca de testes)',function(){return !!window.UIHelper;});
var host=document.createElement('div');host.id='compat-host';box.appendChild(host);var root=null;
try{if(host.attachShadow)root=host.attachShadow({mode:'open'});else if(host.createShadowRoot)root=host.createShadowRoot();}catch(e){log('ERRO | Criar ShadowRoot: '+e.message);}
log((root?'SIM':'NAO')+' | Criacao real de ShadowRoot');
var victim=document.createElement('div');victim.tabIndex=0;victim.appendChild(document.createTextNode('Elemento de foco de teste'));
(root||host).appendChild(victim);
check('tabIndex em div',function(){return victim.tabIndex===0;});
try{victim.focus();log((document.activeElement===victim?'SIM':'INDETERMINADO')+' | document.activeElement aponta para elemento interno (Shadow DOM pode apontar para host)');}catch(e){log('ERRO | focus(): '+e.message);}
log('activeElement: '+(document.activeElement&&document.activeElement.tagName));
log('shadowRoot.activeElement: '+(root&&root.activeElement&&root.activeElement.tagName));
var gotBlur=false;function listener(){gotBlur=true;}
victim.addEventListener('blur',listener,true);try{victim.blur();}catch(e){log('ERRO | blur(): '+e.message);}
log((gotBlur?'SIM':'NAO')+' | blur capturado no proprio elemento');
try{if(victim.remove)victim.remove();else if(victim.parentNode)victim.parentNode.removeChild(victim);log('SIM | Remocao de elemento DOM');}catch(e){log('ERRO | remocao: '+e.message);}
log('OBS: perda de foco da janela por UIHelper.setWindowIsKey(false) nao pode ser reproduzida automaticamente em pagina comum.');
log('OBS: estes resultados verificam compatibilidade, NAO confirmam vulnerabilidade.');
};
})();
</script></body></html>
