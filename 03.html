<!DOCTYPE html>
<html>
<body>
<iframe id="target_frame" width="100" height="100"></iframe>
<script>
  function gc() {
    if (typeof GCController !== "undefined")
        GCController.collect();
    else {
        var gcRec = function (n) {
            if (n < 1)
                return {};
            var temp = {i: "ab" + i + (i / 100000)};
            temp += "foo";
            gcRec(n-1);
        };
        for (var i = 0; i < 1000; i++)
            gcRec(10);
    }
  }

  onload = async () => {
    var frame = document.getElementById("target_frame");
    if (!frame) return;

    // Obtém o documento de dentro do iframe
    var frameDoc = frame.contentDocument || frame.contentWindow.document;
    if (!frameDoc) return;

    // Cria os elementos SVG DENTRO do contexto do iframe
    let svg0 = frameDoc.createElementNS('http://www.w3.org/2000/svg', 'svg');
    let svgAnimatedLength = svg0.width;
    let baseVal = svgAnimatedLength.baseVal;
    
    let clipPath0 = frameDoc.createElementNS('http://www.w3.org/2000/svg', 'clipPath');
    svg0.append(clipPath0);
    clipPath0.append('');
    
    // Adiciona o svg temporariamente no body do iframe para forçar o layout interno
    frameDoc.body.appendChild(svg0);

    await undefined;
    frame.remove();        
    gc();
    baseVal.value = 0;
    document.body.innerHTML = 'PASS if no crash';
  };
</script>
</body>
</html>
