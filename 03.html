
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS4 13.52 - SVG 777fe150</title>
<style>
body {
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
  padding: 15px;
}
button {
  padding: 12px;
  font-size: 16px;
  margin: 5px;
}
pre {
  background: #243247;
  border: 1px solid #65758a;
  padding: 12px;
  white-space: pre-wrap;
  word-wrap: break-word;
}
#visual {
  background: white;
  color: black;
  padding: 12px;
  min-height: 70px;
}
</style>
</head>
<body>

<h2>PS4 13.52 - SVG 777fe150</h2>
<p>Diagnostico funcional de propriedades SVG.</p>

<button onclick="executar()">EXECUTAR TESTES</button>
<button onclick="selecionar()">SELECIONAR LOG</button>

<h3>Visualizacao SVG</h3>
<div id="visual">Aguardando...</div>

<h3>Relatorio</h3>
<pre id="log">Aguardando...</pre>

<script>
var linhas = [];

function log(s) {
  linhas.push(s);
  document.getElementById("log").textContent =
    linhas.join("\n");
}

function executar() {
  linhas = [];
  document.getElementById("log").textContent = "";

  var visual = document.getElementById("visual");
  visual.innerHTML = "";

  log("=== COMMIT 777fe150 ===");
  log("PS4 13.52");
  log("User-Agent: " + navigator.userAgent);
  log("");

  var ns = "http://www.w3.org/2000/svg";
  var svg;

  log("1. CRIACAO DE SVG");

  try {
    svg = document.createElementNS(ns, "svg");

    log("SVG criado: " + svg.nodeName);
    log("SVGSVGElement: " +
      typeof window.SVGSVGElement);

    log("SVGAnimatedLength: " +
      typeof window.SVGAnimatedLength);

    log("svg.width: " + typeof svg.width);
    log("svg.height: " + typeof svg.height);

  } catch (e) {
    log("ERRO: " + e);
    return;
  }

  log("");
  log("2. PROPRIEDADE ANIMADA WIDTH");

  try {
    var animatedWidth = svg.width;

    log("width.baseVal: " +
      typeof animatedWidth.baseVal);

    log("width.animVal: " +
      typeof animatedWidth.animVal);

    log("Valor inicial: " +
      animatedWidth.baseVal.value);

    animatedWidth.baseVal.value = 180;

    log("Valor alterado: " +
      animatedWidth.baseVal.value);

    log("Atributo width: " +
      svg.getAttribute("width"));

  } catch (e) {
    log("ERRO WIDTH: " + e);
  }

  log("");
  log("3. ELEMENTOS SVG FILHOS");

  try {
    var clip = document.createElementNS(
      ns, "clipPath"
    );

    clip.setAttribute("id", "clipTeste");

    svg.appendChild(clip);

    log("clipPath criado: " + clip.nodeName);
    log("Filhos SVG: " + svg.childNodes.length);

    var rect = document.createElementNS(
      ns, "rect"
    );

    rect.setAttribute("x", "10");
    rect.setAttribute("y", "10");
    rect.setAttribute("width", "120");
    rect.setAttribute("height", "40");
    rect.setAttribute("fill", "green");

    svg.setAttribute("height", "65");
    svg.appendChild(rect);

    visual.appendChild(svg);

    log("SVG inserido no documento");
    log("Retangulo verde deve aparecer");

  } catch (e) {
    log("ERRO FILHOS: " + e);
  }

  log("");
  log("4. ALTERACAO COM SVG CONECTADO");

  try {
    var ref = svg.width.baseVal;

    log("Valor antes: " + ref.value);

    ref.value = 200;

    log("Valor depois: " + ref.value);

    log("Atributo atualizado: " +
      svg.getAttribute("width"));

    log("Elemento conectado: " +
      document.documentElement.contains(svg));

    log("PASS: operacao concluida");

  } catch (e) {
    log("ERRO ALTERACAO: " + e);
  }

  log("");
  log("5. FERRAMENTAS INTERNAS");

  log("window.internals: " +
    typeof window.internals);

  log("window.GCController: " +
    typeof window.GCController);

  log("window.gc: " +
    typeof window.gc);

  log("");
  log("6. RESULTADO");

  log("Teste funcional finalizado.");
  log("Nao confirma presenca ou ausencia");
  log("da vulnerabilidade use-after-free.");
  log("");
  log("=== FIM ===");
}

function selecionar() {
  try {
    var el = document.getElementById("log");
    var range = document.createRange();
    var sel = window.getSelection();

    range.selectNodeContents(el);
    sel.removeAllRanges();
    sel.addRange(range);
  } catch (e) {
    alert("Erro: " + e);
  }
}

window.onload = executar;
</script>

</body>
</html>
