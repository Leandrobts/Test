<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>WebKit Custom Elements Vector Test</title>
</head>
<body>
<h2>Teste de Vetor: Custom Elements</h2>
<pre id="log"></pre>
<script>
function log(message)
{
    document.getElementById('log').textContent += message + '\n';
    console.log(message);
}

log("Iniciando teste de Custom Elements...");

const host = document.createElement("div");
document.body.appendChild(host);
const shadowRoot = host.attachShadow({ mode: "open" });

// Adicionamos elementos dentro do shadow root para interagir com o registo
const innerChild = document.createElement("div");
shadowRoot.appendChild(innerChild);

let getterDisparadoSincrono = false;

// Como não estamos a usar fontes, vamos tentar monitorizar a travessia 
// através de um getter ou interceptor nos protótipos de ShadowRoot / Element se necessário,
// ou testar a mutação direta durante o registo.

log("A definir elemento personalizado...");

try {
    // Definir um custom element força o motor a invocar 
    // LocalDOMWindow::ensureCustomElementRegistry() que caminha por inDocumentShadowRoots() sincronamente.
    class TestElement extends HTMLElement {
        constructor() {
            super();
            log(">>> CONSTRUTOR DO CUSTOM ELEMENT EXECUTADO SINCRONAMENTE!");
            // Tentamos remover o host aqui dentro para ver se rebenta o iterador do C++
            try {
                host.remove();
                log("    host.remove() executado dentro do construtor.");
            } catch (e) {
                log("    erro: " + e);
            }
        }
    }

    customElements.define('test-custom-element', TestElement);

    // Instanciar o elemento para forçar a criação síncrona do registo e travessia
    const customEl = document.createElement('test-custom-element');
    shadowRoot.appendChild(customEl);

} catch (err) {
    log("Erro no teste: " + err);
}

log("Fim do script principal.");
</script>
</body>
</html>
