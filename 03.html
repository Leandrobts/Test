<!DOCTYPE html>
<html>
<body>
<p>Destroys a frame owner's renderer while Document::implicitClose() holds a pointer to it.
PASS if this does not crash.</p>
<iframe id="frame" src="resources/subframe-smil-animation-forces-owner-layout.html"></iframe>
<p id="result"></p>
<script>

document.getElementById("frame").addEventListener("load", event => {
    event.target.style.display = "none";
});

window.addEventListener("load", () => {
    requestAnimationFrame(() => {
        document.getElementById("result").textContent = "PASS: did not crash.";        
    });
});
</script>
</body>
</html>
