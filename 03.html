<!DOCTYPE html>
<html>
<body>
<p>This test passes if it does not crash.</p>
<div id="host"></div>
<div id="result"></div>
<input type="text" id="externalInput" placeholder="Elemento auxiliar para tirar o foco">
<script>
// --- Função GC baseada no arquivo 08.html ---
function gc() {
    function gcRec(n) {
          if (n < 1)
              return {};
          var temp = {i: "ab" + i + (i / 100000)};
          temp += "foo";
          gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable';
shadowRoot.appendChild(victim);
victim.focus();

async function runTest() {
    document.addEventListener('blur', () => {
        if (victim) {
            victim.remove();
            victim = null;
            gc();
        }
    }, true);

    // Simula a perda de foco da janela/elemento focando em um campo externo de forma assíncrona
    await new Promise((resolve) => {
        requestAnimationFrame(() => {
            document.getElementById('externalInput').focus();
            setTimeout(resolve, 0);
        });
    });

    result.textContent = 'PASS';
}

// Executa diretamente no carregamento, sem depender de botões
runTest();
</script>
</body>
</html>
