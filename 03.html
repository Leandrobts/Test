<!DOCTYPE html>
<html>
<head>
    <script>
        function runTest() {
            const context = new AudioContext({ sampleRate: 44100 });
            const frame = document.createElement("iframe");
            frame.src = "resources/mediaelementsource-clear-detached-frame-iframe.html";
            
            frame.onload = async function() {
                const audio = frame.contentDocument.querySelector("audio");
                const source = context.createMediaElementSource(audio);
                source.connect(context.destination);
                
                audio.play().catch(() => { });

                // Aguarda o áudio começar a processar na thread de renderização
                await new Promise(resolve => setTimeout(resolve, 200));

                // Detacha o iframe provocando a condição de corrida/UAF no clearMediaPlayer()
                frame.remove();
            };
            
            document.body.appendChild(frame);
        }
    </script>
</head>
<body onload="runTest()">
    Test logic: Remove iframe during WebAudio rendering. Passes if no crash occurs.
</body>
</html>
