
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 WebKit RenderTree / Print Probe B1</title>
<style>
  html, body { margin: 0; padding: 0; }
  body { font-family: sans-serif; }
  #status {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding: 8px;
    background: white;
    border-bottom: 1px solid #888;
    z-index: 99999;
  }
  #stage {
    margin-top: 45px;
    width: 900px;
    min-height: 1400px;
    border: 2px solid #222;
  }
  .box {
    width: 760px;
    height: 260px;
    margin: 20px;
    border: 2px solid #777;
    overflow: hidden;
  }
  iframe {
    width: 620px;
    height: 180px;
    border: 2px solid red;
  }
  #replacement {
    width: 620px;
    height: 180px;
    border: 2px solid blue;
  }
  @media print {
    #status { position: static; }
    #stage { width: 95%; }
    .box { width: 90%; }
  }
</style>
</head>

<body>
<div id="status">BOOT</div>

<div id="stage">
  <div class="box" id="box1">
    <iframe id="target" title="target"></iframe>
  </div>

  <div class="box" id="box2">
    <div id="content">RenderTree baseline</div>
  </div>
</div>

<script>
(function () {
  var status = document.getElementById("status");
  var stage = document.getElementById("stage");
  var target = document.getElementById("target");
  var box1 = document.getElementById("box1");
  var content = document.getElementById("content");

  var events = [];
  var phase = 0;

  function log(s) {
    events.push(s);
    status.textContent = events.join(" | ");
  }

  function forceLayout() {
    document.documentElement.offsetHeight;
    document.body.offsetHeight;
    stage.getBoundingClientRect();

    if (target)
      target.getBoundingClientRect();

    content.getBoundingClientRect();
  }

  function frameDocument(text) {
    return "<!doctype html><html><body>" +
      "<div style='width:500px;height:120px;border:1px solid #555'>" +
      text +
      "</div></body></html>";
  }

  log("BOOT");

  /*
   * Use about:blank first because it is broadly supported by old WebKit.
   * Then write content into the frame when possible.
   */
  try {
    target.src = "about:blank";
  } catch (e) {
    log("FRAME_SRC_ERROR");
  }

  setTimeout(function () {
    try {
      var d = target.contentDocument;
      if (d) {
        d.open();
        d.write(frameDocument("RenderTree test"));
        d.close();
        log("FRAME_READY");
      } else {
        log("FRAME_DOC_UNAVAILABLE");
      }
    } catch (e) {
      log("FRAME_WRITE_ERROR");
    }

    forceLayout();
    log("LAYOUT_BASELINE");

    /*
     * beforeprint is the most useful page-visible hook here.
     * If the PS4 fires it, mutate the RenderWidget-containing
     * subtree while the browser is entering print mode.
     */
    window.onbeforeprint = function () {
      phase++;
      log("BEFOREPRINT");

      forceLayout();

      /*
       * Remove the original iframe.
       */
      if (target && target.parentNode) {
        target.parentNode.removeChild(target);
        target = null;
        log("IFRAME_REMOVED");
      }

      /*
       * Replace it with another iframe, forcing a new widget.
       */
      var replacement = document.createElement("iframe");
      replacement.id = "replacement";
      replacement.title = "replacement";
      replacement.src = "about:blank";

      box1.appendChild(replacement);
      log("IFRAME_REPLACED");

      /*
       * Change the neighboring content as well.
       */
      content.innerHTML =
        "<div style='width:680px;height:220px;border:2px solid #000'>" +
        "Print mutation " + phase +
        "</div>";

      forceLayout();
      log("LAYOUT_AFTER_MUTATION");
    };

    window.onafterprint = function () {
      log("AFTERPRINT");
    };

    /*
     * Some WebKit versions do not expose beforeprint/afterprint.
     * matchMedia('print') gives us a second observation point.
     */
    var printMedia = null;

    try {
      printMedia = window.matchMedia("print");
    } catch (e) {
      log("MATCHMEDIA_ERROR");
    }

    if (printMedia) {
      var mediaHandler = function (ev) {
        if (!ev.matches)
          return;

        log("MEDIA_PRINT_ENTER");

        /*
         * This is intentionally smaller than the beforeprint
         * mutation so we do not create competing mutations.
         */
        forceLayout();
        content.setAttribute("data-print-phase", "active");

        log("MEDIA_LAYOUT");
      };

      if (printMedia.addEventListener)
        printMedia.addEventListener("change", mediaHandler);
      else if (printMedia.addListener)
        printMedia.addListener(mediaHandler);
    }

    /*
     * Give the renderer time to settle before entering print.
     */
    setTimeout(function () {
      forceLayout();
      log("READY_FOR_PRINT");

      setTimeout(function () {
        log("CALL_PRINT");

        try {
          window.print();
          log("PRINT_RETURNED");
        } catch (e) {
          log("PRINT_EXCEPTION");
        }

        /*
         * Keep the final state visible after print returns.
         */
        setTimeout(function () {
          forceLayout();
          log("FINAL_LAYOUT");
        }, 1000);

      }, 500);

    }, 1000);

  }, 700);

})();
</script>
</body>
</html>
