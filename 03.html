
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS4 SVG Width Diagnostico</title>
<style>
body {
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
  padding: 15px;
}
button {
  padding: 12px;
  font-size: 16px;
  margin: 5px;
}
pre {
  background: #22334a;
  border: 1px solid #718096;
  padding: 12px;
  white-space: pre-wrap;
  word-wrap: break-word;
  font-size: 14px;
}
#visual {
  background: white;
  padding: 12px;
  min-height: 80px;
}
</style>
</head>
<body>

<h2>PS4 13.52 - SVG Width</h2>
<p>Investigacao de NaN e Infinity%</p>

<button onclick="executar()">EXECUTAR</button>
<button onclick="selecionar()">SELECIONAR LOG</button>

<h3>SVG</h3>
<div id="visual"></div>

<h3>Relatorio</h3>
<pre id="log">Aguardando...</pre>

<script>
var linhas = [];
var ns = "http://www.w3.org/2000/svg";

function log(s) {
  linhas.push(s);
  document.getElementById("log").textContent =
    linhas.join("\n");
}

function estado(nome, svg) {
  try {
    var w = svg.width.baseVal;

    log(nome);
    log("  atributo: " + svg.getAttribute("width"));
    log("  unitType: " + w.unitType);
    log("  value: " + w.value);
    log("  specified: " + w.valueInSpecifiedUnits);
    log("  string: " + w.valueAsString);
    log("  conectado: " +
      document.documentElement.contains(svg));
  } catch (e) {
    log(nome + " ERRO: " + e);
  }
}

function criarSVG(largura) {
  var svg = document.createElementNS(ns, "svg");

  svg.setAttribute("height", "45");

  if (largura !== null) {
    svg.setAttribute("width", largura);
  }

  var rect = document.createElementNS(ns, "rect");
  rect.setAttribute("x", "0");
  rect.setAttribute("y", "0");
  rect.setAttribute("width", "60");
  rect.setAttribute("height", "30");
  rect.setAttribute("fill", "green");

  svg.appendChild(rect);
  return svg;
}

function executar() {
  linhas = [];
  document.getElementById("log").textContent = "";

  var visual = document.getElementById("visual");
  visual.innerHTML = "";

  log("=== SVG WIDTH PS4 13.52 ===");
  log("UA: " + navigator.userAgent);
  log("");

  log("TESTE A - WIDTH NUMERICO");

  var a = criarSVG("100");
  estado("A1 - antes de conectar", a);

  visual.appendChild(a);
  estado("A2 - depois de conectar", a);

  try {
    a.width.baseVal.value = 180;
    estado("A3 - depois de value=180", a);
  } catch (e) {
    log("A3 ERRO: " + e);
  }

  log("");
  log("TESTE B - WIDTH PERCENTUAL");

  var b = criarSVG("50%");
  estado("B1 - antes de conectar", b);

  visual.appendChild(b);
  estado("B2 - depois de conectar", b);

  try {
    b.width.baseVal.valueInSpecifiedUnits = 60;
    estado("B3 - specified=60", b);
  } catch (e) {
    log("B3 ERRO: " + e);
  }

  log("");
  log("TESTE C - SEM WIDTH INICIAL");

  var c = criarSVG(null);
  estado("C1 - antes de conectar", c);

  visual.appendChild(c);
  estado("C2 - depois de conectar", c);

  try {
    c.setAttribute("width", "100");
    estado("C3 - setAttribute 100", c);

    c.width.baseVal.value = 150;
    estado("C4 - value=150", c);
  } catch (e) {
    log("C ERRO: " + e);
  }

  log("");
  log("TESTE D - UNIDADES EXPLICITAS");

  var d = criarSVG("100");
  visual.appendChild(d);
  estado("D1 - inicial", d);

  try {
    var w = d.width.baseVal;

    log("newValueSpecifiedUnits: " +
      typeof w.newValueSpecifiedUnits);

    if (typeof w.newValueSpecifiedUnits === "function") {
      w.newValueSpecifiedUnits(1, 120);
      estado("D2 - NUMBER 120", d);

      w.newValueSpecifiedUnits(5, 140);
      estado("D3 - PX 140", d);
    }
  } catch (e) {
    log("D ERRO: " + e);
  }

  log("");
  log("=== FIM ===");
  log("Teste funcional; nao reproduz UAF.");
}

function selecionar() {
  try {
    var el = document.getElementById("log");
    var r = document.createRange();
    var s = window.getSelection();

    r.selectNodeContents(el);
    s.removeAllRanges();
    s.addRange(r);
  } catch (e) {
    alert("Erro: " + e);
  }
}

window.onload = executar;
</script>
</body>
</html>
