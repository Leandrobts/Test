
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PS4 13.52 - Diagnostico XSLT</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
  padding: 15px;
  font-size: 16px;
}
h1 { font-size: 23px; }
button {
  padding: 13px;
  font-size: 16px;
  margin: 5px 0;
}
pre {
  background: #202d40;
  border: 1px solid #607080;
  padding: 12px;
  white-space: pre-wrap;
  word-wrap: break-word;
  font-size: 14px;
}
#resultado {
  background: #263b30;
  padding: 12px;
  min-height: 40px;
}
</style>
</head>
<body>

<h1>PS4 13.52 - Diagnostico XSLT</h1>

<p>Teste de APIs XML, XSLT e processamento DOM.</p>

<button onclick="executar()">EXECUTAR TESTES</button>
<button onclick="selecionar()">SELECIONAR LOG</button>

<h3>Resultado da transformacao:</h3>
<div id="resultado">Aguardando teste...</div>

<h3>Relatorio:</h3>
<pre id="log">Pressione EXECUTAR TESTES.</pre>

<script>
var linhas = [];

function registrar(s) {
  linhas.push(s);
  document.getElementById("log").textContent =
    linhas.join("\n");
}

function executar() {
  linhas = [];
  document.getElementById("log").textContent = "";
  document.getElementById("resultado").textContent =
    "Executando...";

  registrar("=== PS4 XSLT DIAGNOSTICO ===");
  registrar("Data: " + new Date().toString());
  registrar("User-Agent: " + navigator.userAgent);
  registrar("");

  registrar("1. APIs DISPONIVEIS");

  registrar("DOMParser: " +
    typeof window.DOMParser);

  registrar("XMLSerializer: " +
    typeof window.XMLSerializer);

  registrar("XSLTProcessor: " +
    typeof window.XSLTProcessor);

  registrar("document.implementation: " +
    typeof document.implementation);

  registrar("");

  registrar("2. DOMParser XML");

  var xml = null;
  var parser = null;

  try {
    if (typeof DOMParser === "undefined") {
      registrar("DOMParser indisponivel");
    } else {
      parser = new DOMParser();
      xml = parser.parseFromString(
        '<teste><mensagem>PS4 13.52</mensagem></teste>',
        "application/xml"
      );

      registrar("Documento XML criado");

      registrar("Raiz: " +
        xml.documentElement.nodeName);

      registrar("Texto: " +
        xml.documentElement.textContent);

      var erro = xml.getElementsByTagName(
        "parsererror"
      );

      registrar("parsererror: " + erro.length);
    }
  } catch (e) {
    registrar("ERRO DOMParser: " + e);
  }

  registrar("");

  registrar("3. XMLSerializer");

  try {
    if (xml && typeof XMLSerializer !== "undefined") {
      var serial = new XMLSerializer();
      registrar("XML serializado: " +
        serial.serializeToString(xml));
    } else {
      registrar("XMLSerializer nao testado");
    }
  } catch (e) {
    registrar("ERRO XMLSerializer: " + e);
  }

  registrar("");

  registrar("4. XML-STYLESHEET NO DOM");

  try {
    if (parser) {
      var docPI = parser.parseFromString(
        '<?xml-stylesheet type="text/xsl" href="teste.xsl"?>' +
        '<teste>PS4</teste>',
        "application/xml"
      );

      var primeiro = docPI.firstChild;

      registrar("Primeiro no: " +
        primeiro.nodeName);

      registrar("Tipo do no: " +
        primeiro.nodeType);

      registrar("Conteudo PI: " +
        primeiro.nodeValue);

      registrar("PIs encontradas: " +
        docPI.childNodes.length);
    } else {
      registrar("Teste PI indisponivel");
    }
  } catch (e) {
    registrar("ERRO xml-stylesheet: " + e);
  }

  registrar("");

  registrar("5. TRANSFORMACAO XSLT");

  try {
    if (typeof XSLTProcessor === "undefined") {
      registrar("XSLTProcessor INDISPONIVEL");
      registrar("Transformacao JS nao executada");
    } else if (!parser || !xml) {
      registrar("XML de entrada indisponivel");
    } else {
      var xslTexto =
        '<xsl:stylesheet version="1.0" ' +
        'xmlns:xsl="http://www.w3.org/1999/XSL/Transform">' +
        '<xsl:output method="html"/>' +
        '<xsl:template match="/">' +
        '<div style="background:green;color:white;padding:20px">' +
        '<h2>XSLT EXECUTADO NO PS4</h2>' +
        '<p><xsl:value-of select="/teste/mensagem"/></p>' +
        '</div>' +
        '</xsl:template>' +
        '</xsl:stylesheet>';

      var xsl = parser.parseFromString(
        xslTexto, "application/xml"
      );

      var xslErro = xsl.getElementsByTagName(
        "parsererror"
      );

      registrar("Erros no XSL: " + xslErro.length);

      var processador = new XSLTProcessor();

      processador.importStylesheet(xsl);

      registrar("importStylesheet: OK");

      var fragmento =
        processador.transformToFragment(xml, document);

      if (fragmento) {
        registrar("transformToFragment: OK");

        var destino =
          document.getElementById("resultado");

        destino.innerHTML = "";
        destino.appendChild(fragmento);

        registrar("Transformacao concluida");
      } else {
        registrar("Transformacao retornou null");
      }
    }
  } catch (e) {
    registrar("ERRO XSLT: " + e);
  }

  registrar("");
  registrar("=== FIM DOS TESTES ===");
}

function selecionar() {
  var elemento = document.getElementById("log");

  try {
    var selecao = window.getSelection();
    var intervalo = document.createRange();

    intervalo.selectNodeContents(elemento);
    selecao.removeAllRanges();
    selecao.addRange(intervalo);
  } catch (e) {
    alert("Selecao indisponivel: " + e);
  }
}

window.onload = executar;
</script>

</body>
</html>
