<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

    <script src="resources/media-file.js"></script>
    <script src="resources/media-controls.js"></script>
    <script src="resources/video-test.js"></script>

    <script>
    function emptyVideoTextContent()
    {
        consoleWrite("");
        consoleWrite("** Empty the contents of the video element when it is ready to play **");

        video.textContent = "";

        consoleWrite("");
        consoleWrite("** Text track should not be rendered anymore **");

        /*
         * O teste original usa textTrackDisplayElement(), que depende
         * de internals.shadowRoot() e internals.shadowPseudoId().
         * Essas APIs sao internas do ambiente de LayoutTests do WebKit
         * e nao existem em uma pagina normal no desktop.
         *
         * Aqui verificamos apenas a API publica e o estado do DOM.
         */

        var trackElement = document.querySelector("track");
        var trackObject = trackElement ? trackElement.track : null;

        if (!trackObject) {
            consoleWrite("FAIL: TextTrack object is not available.");
            endTest();
            return;
        }

        consoleWrite("TextTrack mode: " + trackObject.mode);

        if (trackObject.mode != "showing") {
            consoleWrite("FAIL: TextTrack mode is not 'showing'.");
            endTest();
            return;
        }

        if (video.querySelector("track")) {
            consoleWrite("FAIL: <track> is still present inside the video element.");
            endTest();
            return;
        }

        consoleWrite("<track> was removed from the video element.");
        consoleWrite("TextTrack object remains accessible.");
        consoleWrite("");
        consoleWrite("No crash. PASS.");
        consoleWrite("");

        endTest();
    }

    function initElements()
    {
        consoleWrite("** Set the mode of the text track to showing **");

        testTrack = document.querySelector("track");

        if (!testTrack) {
            consoleWrite("FAIL: <track> element was not found.");
            endTest();
            return;
        }

        testTrack.track.mode = "showing";

        consoleWrite("");
        consoleWrite("** Initialize the video element **");

        findMediaElement();

        if (!video) {
            consoleWrite("FAIL: video element was not found.");
            endTest();
            return;
        }

        video.src = findMediaFile("video", "resources/test");

        consoleWrite("Video source: " + video.src);

        /* Registrar o evento antes de play(). */
        waitForEvent("canplaythrough", emptyVideoTextContent);

        var playPromise = video.play();

        if (playPromise && playPromise.catch) {
            playPromise.catch(function(error) {
                consoleWrite("play() failed: " + error);
                endTest();
            });
        }
    }
    </script>
</head>

<body>
    <p>
        Tests that removing the contents of the video element after the
        text track is showing does not crash.
    </p>

    <video controls>
        <track src="resources/captions.vtt" kind="captions">
    </video>

    <br><br>

    <button type="button" onclick="initElements()">Iniciar teste</button>
</body>
</html>
