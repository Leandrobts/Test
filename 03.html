<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            onload = () => {
                // Gatilho de mídia presente no teste original
                document.createElement('audio').src = 'data:application/vnd.apple.mpegURL;base64,xx';
                
                for (let i = 0; i <= 10; i++) {
                    // Carrega o arquivo .js externo exatamente como no commit
                    let w = new Worker('resources/empty-post-message-service-workers-crash.js');
                    w.onmessage = () => {
                        w.postMessage(undefined);
                    };
                    w.postMessage(undefined);
                }
            };
        </script>
    </body>
</html>
