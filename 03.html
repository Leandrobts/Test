
<!DOCTYPE html>
<html>
<body>

<p>This test passes if it does not crash.</p>

<div id="host"></div>

<button id="other">Other Focusable Element</button>

<div id="result"></div>

<script>

function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};

        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }

    for (var i = 0; i < 10000; i++)
        gcRec(10);
}


var result = document.getElementById('result');
var host = document.getElementById('host');
var other = document.getElementById('other');


function log(text) {
    console.log(text);
    result.textContent += text + '\n';
}


function nameOf(node) {

    if (!node)
        return 'null';

    if (node === window)
        return 'WINDOW';

    if (node === document)
        return 'DOCUMENT';

    if (node === host)
        return 'HOST';

    if (node === victim)
        return 'VICTIM';

    if (node.id)
        return node.tagName + '#' + node.id;

    return node.tagName || String(node);
}


var shadowRoot = host.attachShadow({ mode: 'open' });

var victim = document.createElement('div');

victim.tabIndex = 0;
victim.textContent = 'Focusable Victim';

victim.style.display = 'block';
victim.style.padding = '20px';
victim.style.border = '2px solid blue';
victim.style.margin = '10px';

shadowRoot.appendChild(victim);


/*
 * Focus diagnostics.
 */

function dumpFocusState(prefix) {

    var documentActive = document.activeElement;
    var shadowActive = shadowRoot.activeElement;

    log('');
    log('===== ' + prefix + ' =====');

    log(
        'document.activeElement = ' +
        nameOf(documentActive)
    );

    log(
        'shadowRoot.activeElement = ' +
        nameOf(shadowActive)
    );

    log(
        'victim.isConnected = ' +
        (victim ? victim.isConnected : 'victim=null')
    );

    log('==========================');
    log('');
}


/*
 * WINDOW BLUR
 */

window.addEventListener('blur', function(event) {

    log(
        '[WINDOW CAPTURE] BLUR target = ' +
        nameOf(event.target)
    );

    dumpFocusState('WINDOW BLUR');

}, true);


/*
 * DOCUMENT BLUR
 *
 * This is the important part.
 *
 * The real focus transition is produced by
 * clicking the "Other" button.
 *
 * During the blur handler we remove the
 * currently focused Shadow DOM element.
 */

document.addEventListener('blur', function(event) {

    log(
        '[DOCUMENT CAPTURE] BLUR target = ' +
        nameOf(event.target)
    );

    dumpFocusState('DOCUMENT BLUR - BEFORE REMOVAL');


    log('[DOCUMENT] BLUR HANDLER - BEGIN');


    if (victim) {

        log('victim.remove()');

        victim.remove();


        log(
            'victim.isConnected after remove = ' +
            victim.isConnected
        );


        victim = null;

        log('victim = null');


        log('starting gc()');

        gc();

        log('gc() completed');

    } else {

        log('victim already null');

    }


    log('[DOCUMENT] BLUR HANDLER - END');


}, true);


/*
 * HOST BLUR
 */

host.addEventListener('blur', function(event) {

    log(
        '[HOST CAPTURE] BLUR target = ' +
        nameOf(event.target)
    );

}, true);


/*
 * VICTIM BLUR
 */

victim.addEventListener('blur', function(event) {

    log(
        '[VICTIM] BLUR target = ' +
        nameOf(event.target)
    );

    dumpFocusState('VICTIM BLUR');

});


/*
 * OTHER BUTTON
 */

other.addEventListener('focus', function() {

    log('[OTHER] FOCUS');

    dumpFocusState('OTHER FOCUS');

});


other.addEventListener('click', function() {

    log('[OTHER] CLICK');

    dumpFocusState('OTHER CLICK');

});


/*
 * DOCUMENT CLICK
 */

document.addEventListener('click', function(event) {

    log(
        '[DOCUMENT] CLICK target = ' +
        nameOf(event.target)
    );

}, true);


/*
 * INITIAL STATE
 */

log('======================================');
log('PS4 FOCUS / BLUR REMOVAL TEST');
log('======================================');

dumpFocusState('BEFORE victim.focus()');


log('Calling victim.focus()');

victim.focus();


dumpFocusState('AFTER victim.focus()');


/*
 * Give the browser an opportunity to
 * stabilize the focus state.
 */

requestAnimationFrame(function() {

    setTimeout(function() {

        dumpFocusState('AFTER rAF + setTimeout');

        log('');
        log('======================================');
        log('TEST READY');
        log('======================================');

        log('');
        log('CLICK "Other Focusable Element" ONCE');
        log('');

    }, 0);

});

</script>

</body>
</html>
