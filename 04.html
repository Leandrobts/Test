<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Teste de fontes e Canvas 2D</title></head>
<body>
<pre id="resultado">Iniciando teste...</pre>
<script>
(function () {
    var output = document.getElementById('resultado');
    function finish(message) {
        output.appendChild(document.createTextNode('\n' + message));
    }

    var worker = new Worker('resources/opportunistic-load-reentrancy-worker.js');
    worker.onmessage = function (event) {
        var data = event.data;
        if (data && data.type === 'measure-text') {
            try {
                var canvas = document.createElement('canvas');
                canvas.width = 10;
                canvas.height = 10;
                var context = canvas.getContext('2d');
                if (!context)
                    throw new Error('Canvas 2D indisponível');
                context.font = data.font;
                var result = context.measureText(String.fromCharCode(data.character));
                finish('measureText: ' + result.width);
                finish('PASS: medição executada (não comprova ausência de UAF)');
                worker.postMessage({ type: 'measurement-complete', width: result.width });
            } catch (error) {
                finish('FAIL: ' + error);
                worker.postMessage({ type: 'measurement-error', message: String(error) });
            }
        } else if (data && data.type === 'error') {
            finish('FAIL: worker error: ' + data.message);
        } else if (data && data.type === 'done') {
            finish('Worker concluído');
        }
    };
    worker.onerror = function (event) {
        finish('FAIL: worker error: ' + event.message);
    };
}());
</script>
</body>
</html>
