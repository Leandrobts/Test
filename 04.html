<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste Blur PS4</title><style>body{font:16px Arial;background:#171b27;color:white;padding:18px}button{display:block;margin:12px 0;padding:14px;font-size:16px}pre{background:#080a10;padding:14px;white-space:pre-wrap}</style></head><body><h2>Teste de foco — PS4 WebKit</h2><p>Alternativas sem testRunner. Execute uma por vez.</p><button onclick="run('window')">1. window.blur()</button><button onclick="run('popup')">2. Popup + focus()</button><button onclick="run('element')">3. Element.blur()</button><button onclick="run('manual')">4. Troca manual de janela/app</button><button onclick="run('synthetic')">5. Evento sintético (controle)</button><button onclick="reset()">Recriar elemento</button><pre id="log"></pre><div id="host"></div><script>var root=document.getElementById('host').attachShadow({mode:'open'}),victim=null,output=document.getElementById('log');function log(s){output.textContent+=new Date().toLocaleTimeString()+' | '+s+'\n'}function reset(){if(victim&&victim.parentNode)victim.parentNode.removeChild(victim);victim=document.createElement('div');victim.tabIndex=0;victim.textContent='Elemento focável';root.appendChild(victim);log('Elemento recriado')}document.addEventListener('blur',function(e){log('blur capturado: '+(e.target&&e.target.nodeName));if(victim){var old=victim;victim=null;if(old.parentNode)old.parentNode.removeChild(old);log('Elemento removido no blur')}},true);window.addEventListener('blur',function(e){log('window blur; isTrusted='+e.isTrusted)});window.addEventListener('focus',function(){log('window focus')});document.addEventListener('visibilitychange',function(){log('visibilitychange: '+document.visibilityState)});function focusVictim(){if(!victim)reset();victim.focus();log('focus solicitado')}function run(mode){focusVictim();if(mode==='window'){window.blur();log('window.blur solicitado; pode ser ignorado')}else if(mode==='popup'){var p=window.open('about:blank','_blank');if(p){p.focus();log('Popup aberto, foco solicitado')}else log('Popup bloqueado')}else if(mode==='element'){if(victim)victim.blur();log('element.blur solicitado')}else if(mode==='manual'){log('Troque de aplicativo/tela pelo controle e retorne')}else if(mode==='synthetic'){window.dispatchEvent(new Event('blur'));log('Evento artificial: nao altera foco real')}}reset();</script></body></html>
