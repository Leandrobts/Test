<!DOCTYPE html>
<html>
<head>
<style>
  iframe {
    content: url();
    zoom: 0.01;
  }
</style>
</head>
<body>
<iframe id="i0"></iframe>

<script>
// Fallback simples caso o browser não tenha Cache API
function triggerFocus() {
    try {
        // Tenta usar Cache API (pode não existir no PS4)
        if (window.caches && caches.has) {
            caches.has('a').then(function() {
                i0.focus();
            }).catch(function() {
                // Se der erro, foca mesmo assim
                i0.focus();
            });
        } else {
            // Fallback direto
            setTimeout(function() {
                i0.focus();
            }, 0);
        }
    } catch (e) {
        setTimeout(function() {
            i0.focus();
        }, 0);
    }
}

window.onload = function() {
    // Cria e adiciona o <frameset> (mesma ação do original)
    document.documentElement.appendChild(document.createElement('frameset'));

    // Handler de focus (mesma lógica)
    i0.onfocus = function() {
        location.hash = 'y';
    };

    // Muda o hash (mesma ação)
    location.hash = 'x';

    // Cria o script que no original usava data: URL + caches.has
    // Aqui tentamos manter o caminho assíncrono o máximo possível
    var s0 = document.createElement('script');
    s0.textContent = '(' + triggerFocus.toString() + ')();';
    document.head.appendChild(s0);

    // Feedback visual (já que não temos testRunner)
    setTimeout(function() {
        if (!document.getElementById('result')) {
            var p = document.createElement('p');
            p.id = 'result';
            p.style.color = 'green';
            p.style.fontWeight = 'bold';
            p.textContent = 'PASS if no crash';
            document.body.appendChild(p);
        }
    }, 300);
};
</script>
</body>
</html>
