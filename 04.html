<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
    font: 20px/1 monospace;
}
</style>
</head>
<body>

<marquee id="marquee" scrollamount="0">
    <div id="multiLineContainer">first<br>second</div>
    <div id="singleLineContainer">first</div>
</marquee>

<span id="reference">first</span>
<pre id="log">Iniciando...</pre>

<script>
function contentWidth(element) {
    const range = document.createRange();
    range.selectNodeContents(element);
    return range.getBoundingClientRect().width;
}

function test() {
    const multi = document.getElementById("multiLineContainer");
    const single = document.getElementById("singleLineContainer");
    const marquee = document.getElementById("marquee");
    const reference = document.getElementById("reference");

    multi.append(" appended");
    single.append(" appended");

    marquee.setAttribute("scrollamount", "6");
    getComputedStyle(marquee).color;
    marquee.start();

    multi.lastChild.remove();
    single.lastChild.remove();

    const passed =
        multi.offsetHeight == 40 &&
        contentWidth(single) == contentWidth(reference);

    document.getElementById("log").textContent =
        passed ? "PASS" : "FAIL";
}

try {
    document.body.offsetHeight;
    test();
} catch (e) {
    document.getElementById("log").textContent =
        "ERROR: " + e.message;
}
</script>
</body>
</html>
