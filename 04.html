
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<pre id="log"></pre>
<script>
function log(s) {
    document.getElementById('log').textContent += s + '\n';
}

// Touch document.fonts antes do load event
document.fonts;

const host = document.createElement("div");
document.body.appendChild(host);
const shadowRoot = host.attachShadow({ mode: "open" });

const fontFaceStyle = document.createElement("style");
fontFaceStyle.textContent = `@font-face { font-family: reentryFont; src: url("resources/no-such-font-for-reentry.otf"); }`
    + `.probe { font: 24px reentryFont; }`;
shadowRoot.appendChild(fontFaceStyle);

const probe = document.createElement("span");
probe.className = "probe";
probe.textContent = "A";
shadowRoot.appendChild(probe);

document.body.offsetHeight; // Força layout para iniciar o carregamento
document.fonts.load("24px reentryFont", "A");
log("document.fonts.status: " + document.fonts.status);

// Materializa a promessa ready
document.fonts.ready;

// Prepend para criar o estado pendente UpdateType::ActiveSet
const prependedStyle = document.createElement("style");
prependedStyle.textContent = ".unused { color: red; }";
shadowRoot.prepend(prependedStyle);
log('apos prepend. status=' + document.fonts.status);

let getterCallCount = 0;
Object.defineProperty(FontFaceSet.prototype, "then", {
    configurable: true,
    get() {
        delete FontFaceSet.prototype.then;
        ++getterCallCount;
        log('>>> GETTER DISPAROU! count=' + getterCallCount);
        log('    status no momento: ' + document.fonts.status);
        host.remove(); // Remove o host do shadow root
        log('    apos host.remove() — sem crash ate aqui');
        return undefined;
    }
});

log('getter instalado. status=' + document.fonts.status);
log('aguardando resolução...');

Promise.resolve().then(function() {
    log('microtask: status=' + document.fonts.status + ' getter=' + getterCallCount);
});
</script>
</body>
</html>
