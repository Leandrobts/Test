<!DOCTYPE HTML>
<html>
<body>

<svg xmlns:xlink="http://www.w3.org/1999/xlink">
    <text id="a">Text</text>
    <use xlink:href="#a"></use>
</svg>

<script>

function runTest()
{
    /*
     * accessibilityController.accessibleElementById("foo");
     *
     * REMOVIDO:
     * É uma API interna do WebKit LayoutTest.
     *
     * Não existe equivalente JavaScript padrão que
     * force a criação do AccessibilityObject.
     */

    var useElement =
        document.getElementsByTagName("use")[0];

    /*
     * Mesmo mutation do teste original.
     */

    useElement.setAttribute("xlink:href", "");

    document.body.innerHTML +=
        "<p>DOM/SVG mutation completed.</p>";
}

runTest();

</script>

</body>
</html>
