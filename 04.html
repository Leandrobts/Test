
<!doctype html>
<button id=b>Run</button>
<iframe id=f></iframe>
<script>
b.onclick=()=>{
  f.src="data:application/xml,"+
    encodeURIComponent("<?xml version=\"1.0\"?><r><style>r{display:block}</style><x>1</x></r>");
  f.onload=()=>{
    const d=f.contentDocument;
    f.remove();
    try{d.close()}catch(_){}
  };
};
</script>
