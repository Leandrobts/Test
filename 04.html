<!DOCTYPE html>
<html>
<body>

<p>This test passes if it does not crash.</p>

<div id="host"></div>

<button id="other">Other Focusable Element</button>

<div id="result"></div>

<script>

function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};

        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }

    for (var i = 0; i < 10000; i++)
        gcRec(10);
}


var result = document.getElementById('result');
var host = document.getElementById('host');
var other = document.getElementById('other');


function log(text) {
    console.log(text);
    result.textContent += text + '\n';
}


function nameOf(node) {

    if (!node)
        return 'null';

    if (node === window)
        return 'WINDOW';

    if (node === document)
        return 'DOCUMENT';

    if (node === host)
        return 'HOST';

    if (node === other)
        return 'OTHER';

    if (node === victim)
        return 'VICTIM';

    if (node.id)
        return node.tagName + '#' + node.id;

    return node.tagName || String(node);
}


function eventInfo(label, event) {

    log(
        label +
        ' target=' + nameOf(event.target) +
        ' currentTarget=' + nameOf(event.currentTarget) +
        ' phase=' + event.eventPhase +
        ' bubbles=' + event.bubbles +
        ' composed=' + event.composed +
        ' relatedTarget=' + nameOf(event.relatedTarget)
    );
}


function dumpFocusState(prefix) {

    var documentActive = document.activeElement;
    var shadowActive = shadowRoot.activeElement;

    log('');
    log('===== ' + prefix + ' =====');

    log(
        'document.activeElement = ' +
        nameOf(documentActive)
    );

    log(
        'shadowRoot.activeElement = ' +
        nameOf(shadowActive)
    );

    if (victim) {
        log(
            'victim.isConnected = ' +
            victim.isConnected
        );
    } else {
        log('victim = null');
    }

    log('==========================');
    log('');
}


var shadowRoot = host.attachShadow({ mode: 'open' });

var victim = document.createElement('div');

victim.tabIndex = 0;
victim.textContent = 'Focusable Victim';

victim.style.display = 'block';
victim.style.padding = '20px';
victim.style.border = '2px solid blue';
victim.style.margin = '10px';

shadowRoot.appendChild(victim);


/*
 * WINDOW FOCUS
 */

window.addEventListener('focus', function(event) {

    eventInfo('[WINDOW CAPTURE] FOCUS', event);

    dumpFocusState('WINDOW FOCUS');

}, true);


/*
 * WINDOW BLUR
 */

window.addEventListener('blur', function(event) {

    eventInfo('[WINDOW CAPTURE] BLUR', event);

    dumpFocusState('WINDOW BLUR');

}, true);


/*
 * DOCUMENT FOCUS
 */

document.addEventListener('focus', function(event) {

    eventInfo('[DOCUMENT CAPTURE] FOCUS', event);

    dumpFocusState('DOCUMENT FOCUS');

}, true);


/*
 * DOCUMENT BLUR
 *
 * This is the critical reentrant operation.
 */

document.addEventListener('blur', function(event) {

    eventInfo('[DOCUMENT CAPTURE] BLUR', event);

    dumpFocusState('DOCUMENT BLUR - BEFORE REMOVAL');


    log('[DOCUMENT] BLUR HANDLER - BEGIN');


    if (victim) {

        log(
            'victim before remove: connected=' +
            victim.isConnected
        );

        log('calling victim.remove()');

        victim.remove();

        log(
            'victim after remove: connected=' +
            victim.isConnected
        );

        log(
            'document.activeElement after remove = ' +
            nameOf(document.activeElement)
        );

        log(
            'shadowRoot.activeElement after remove = ' +
            nameOf(shadowRoot.activeElement)
        );


        victim = null;

        log('victim = null');


        log('starting gc()');

        gc();

        log('gc() completed');

    } else {

        log('victim already null');

    }


    log('[DOCUMENT] BLUR HANDLER - END');

}, true);


/*
 * HOST BLUR
 */

host.addEventListener('blur', function(event) {

    eventInfo('[HOST CAPTURE] BLUR', event);

    dumpFocusState('HOST BLUR');

}, true);


/*
 * VICTIM BLUR
 */

victim.addEventListener('blur', function(event) {

    eventInfo('[VICTIM] BLUR', event);

    dumpFocusState('VICTIM BLUR');

});


/*
 * VICTIM FOCUS
 */

victim.addEventListener('focus', function(event) {

    eventInfo('[VICTIM] FOCUS', event);

    dumpFocusState('VICTIM FOCUS');

});


/*
 * OTHER FOCUS
 */

other.addEventListener('focus', function(event) {

    eventInfo('[OTHER] FOCUS', event);

    dumpFocusState('OTHER FOCUS');

});


/*
 * OTHER BLUR
 */

other.addEventListener('blur', function(event) {

    eventInfo('[OTHER] BLUR', event);

    dumpFocusState('OTHER BLUR');

});


/*
 * DOCUMENT CLICK
 */

document.addEventListener('click', function(event) {

    eventInfo('[DOCUMENT] CLICK', event);

    dumpFocusState('AFTER CLICK');

}, true);


/*
 * INITIAL STATE
 */

log('======================================');
log('PS4 FOCUS / BLUR REMOVAL TEST V2');
log('======================================');

dumpFocusState('BEFORE victim.focus()');


log('Calling victim.focus()');

victim.focus();


dumpFocusState('AFTER victim.focus()');


/*
 * Allow focus processing to settle.
 */

requestAnimationFrame(function() {

    setTimeout(function() {

        dumpFocusState('AFTER rAF + setTimeout');

        log('');
        log('======================================');
        log('TEST READY');
        log('======================================');

        log('');
        log('CLICK "Other Focusable Element" ONCE');
        log('');

    }, 0);

});

</script>

</body>
</html>
