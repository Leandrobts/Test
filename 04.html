
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PS4 SVG - Ciclo de Vida</title>
</head>
<body>
<h2>PS4 13.52 - SVG Lifecycle</h2>
<pre id="log">Executando...</pre>

<script>
window.onload = function () {
  var linhas = [];

  function log(s) {
    linhas.push(s);
    document.getElementById("log").textContent =
      linhas.join("\n");
  }

  try {
    var ns = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(ns, "svg");

    svg.setAttribute("width", "100");
    svg.setAttribute("height", "50");

    document.body.appendChild(svg);

    var animated = svg.width;
    var baseVal = animated.baseVal;

    log("SVG conectado: " +
      document.documentElement.contains(svg));

    log("Valor inicial: " + baseVal.value);

    svg.remove();

    log("SVG conectado apos remover: " +
      document.documentElement.contains(svg));

    baseVal.value = 150;

    log("Valor apos remover: " + baseVal.value);
    log("Atributo width: " +
      svg.getAttribute("width"));

    log("TESTE CONCLUIDO");
  } catch (e) {
    log("ERRO: " + e);
  }
};
</script>
</body>
</html>
