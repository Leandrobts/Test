<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Teste de Regressão: Vector Reallocation UAF em shrinkWrapInteractionRegions</title>
<style>
    .layer-container {
        position: relative;
        width: 600px;
        height: 600px;
        overflow: hidden;
        transform: translateZ(0); /* Força criação de camada gráfica com EventRegion */
    }

    .interactive-item {
        position: absolute;
        width: 60px;
        height: 60px;
        cursor: pointer;
    }
</style>
</head>
<body>
<div id="container" class="layer-container"></div>
<div id="status">Executando teste...</div>

<script>
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 1000; i++)
        gcRec(10);
}

function runInteractionRegionsTest() {
    const container = document.getElementById("container");

    for (let cycle = 0; cycle < 50; cycle++) {
        // 1. Cria dezenas de elementos interativos com sobreposição parcial
        // Isso força dezenas de inserções em m_interactionRegions, excedendo a capacidade inicial do vetor
        for (let i = 0; i < 80; i++) {
            const el = document.createElement("button");
            el.className = "interactive-item";
            el.style.left = `${(i % 10) * 40}px`;
            el.style.top = `${Math.floor(i / 10) * 40}px`;
            el.onclick = () => {};
            container.appendChild(el);
        }

        // 2. Força o cálculo de layout e a geração das regiões de eventos/interação
        container.getBoundingClientRect();

        // 3. Modifica propriedades geométricas e adiciona novos elementos no mesmo tick
        // para disparar EventRegionContext::shrinkWrapInteractionRegions com fusão de retângulos
        for (let i = 0; i < 20; i++) {
            const overlay = document.createElement("a");
            overlay.href = "#";
            overlay.className = "interactive-item";
            overlay.style.left = `${i * 20}px`;
            overlay.style.top = `${i * 20}px`;
            container.appendChild(overlay);
        }

        // Força recálculo das regiões
        container.getBoundingClientRect();

        // 4. Limpeza da árvore
        container.innerHTML = "";

        if (cycle % 5 === 0) {
            gc();
        }
    }
}

try {
    runInteractionRegionsTest();
    document.getElementById("status").innerText = "PASS: Regiões de interação processadas sem Heap Use-After-Free.";
} catch (e) {
    document.getElementById("status").innerText = "FAIL: " + e.message;
}
</script>
</body>
</html>
