<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>WebKit Viewport Resize + Font Vector Test</title>
<style>
  body { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<h2>Teste: Viewport Resize + Fontes (Shadow Root Style)</h2>
<pre id="log"></pre>
<script>
function log(message) {
    document.getElementById('log').textContent += message + '\n';
    console.log(message);
}

log("Iniciando teste Viewport Resize com Fontes...");

document.fonts;

const host = document.createElement("div");
document.body.appendChild(host);
const shadowRoot = host.attachShadow({ mode: "open" });

const fontFaceStyle = document.createElement("style");
fontFaceStyle.textContent = `@font-face { font-family: reentryFont; src: url("resources/Ahem.woff"); }`
    + `.probe { font: 24px reentryFont; width: 50vw; }`;
shadowRoot.appendChild(fontFaceStyle);

const probe = document.createElement("span");
probe.className = "probe";
probe.textContent = "A";
shadowRoot.appendChild(probe);

document.body.offsetHeight;
document.fonts.load("24px reentryFont", "A");
log("document.fonts.status: " + document.fonts.status);

document.fonts.ready;

const prependedStyle = document.createElement("style");
prependedStyle.textContent = ".unused { color: red; }";
shadowRoot.prepend(prependedStyle);
log('após prepend. status=' + document.fonts.status);

let getterCallCount = 0;
Object.defineProperty(FontFaceSet.prototype, "then", {
    configurable: true,
    get() {
        delete FontFaceSet.prototype.then;
        ++getterCallCount;
        log('>>> GETTER DISPAROU! count=' + getterCallCount);
        log('    status no momento: ' + document.fonts.status);
        try {
            host.remove();
            log('    host.remove() executado com sucesso.');
        } catch(e) {
            log('    erro: ' + e);
        }
        return undefined;
    }
});

log('Disparando redimensionamento de viewport e layout síncrono...');

try {
    host.style.width = "90vw";
    
    const rect = probe.getBoundingClientRect();
    const computedFont = window.getComputedStyle(probe).fontFamily;

    if (window.resizeTo) {
        window.resizeTo(window.outerWidth + 5, window.outerHeight + 5);
        window.resizeTo(window.outerWidth - 5, window.outerHeight - 5);
    }

    const resizeEvt = new Event('resize');
    window.dispatchEvent(resizeEvt);

    log("Gatilhos de viewport executados. Rect width: " + rect.width + ", Font: " + computedFont);
} catch (err) {
    log("Erro no viewport resize: " + err);
}

log("Fim do script principal. getterCallCount = " + getterCallCount);
</script>
</body>
</html>
