<!DOCTYPE html>
<html>
<body>
<pre id="out"></pre>
<script>
var names=[
"fetch",
"Response",
"Request",
"Headers",
"Blob",
"File",
"FormData",
"URL",
"AbortSignal",
"ReadableStream",
"WritableStream",
"TransformStream",
"TextEncoder",
"TextDecoder",
"DOMException",
"HTMLCanvasElement",
"MediaSource",
"URLSearchParams"
];

var out=[];
for(var i=0;i<names.length;i++){
    out.push(names[i]+": "+typeof window[names[i]]);
}

out.push("captureStream: "+typeof HTMLCanvasElement.prototype.captureStream);
document.getElementById("out").textContent=out.join("\n");
</script>
</body>
</html>
