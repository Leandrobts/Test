<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>WebKit Viewport Resize Vector Test</title>
<style>
  /* Estilo global usando unidades de viewport */
  body { width: 100vw; }
</style>
</head>
<body>
<h2>Teste de Vetor: Redimensionamento de Viewport</h2>
<pre id="log"></pre>
<script>
function log(message)
{
    document.getElementById('log').textContent += message + '\n';
    console.log(message);
}

log("Iniciando teste de redimensionamento de viewport...");

const host = document.createElement("div");
document.body.appendChild(host);
const shadowRoot = host.attachShadow({ mode: "open" });

// Estilo dentro do shadow root dependente de unidades de viewport
const viewportStyle = document.createElement("style");
viewportStyle.textContent = 
    `.probe { width: 50vw; height: 50vh; background: blue; }`;
shadowRoot.appendChild(viewportStyle);

const probe = document.createElement("span");
probe.className = "probe";
probe.textContent = "A";
shadowRoot.appendChild(probe);

document.body.offsetHeight; // Força layout inicial

log("Modificando geometria / viewport para forçar didChangeViewportSize...");

try {
    // Tentativa 1: Redimensionamento síncrono via redimensionamento de janela (se permitido pelo ambiente)
    if (window.resizeTo) {
        window.resizeTo(window.outerWidth + 10, window.outerHeight + 10);
        window.resizeTo(window.outerWidth - 10, window.outerHeight - 10);
    }

    // Tentativa 2: Modificação síncrona de propriedades do host que afetam o layout da viewport
    host.style.width = "80vw";
    
    // Força um reflow síncrono imediato após a alteração de largura baseada em viewport
    const currentWidth = probe.getBoundingClientRect().width;
    log("Largura computada da probe: " + currentWidth);

    // Tentativa 3: Disparar um evento de resize de forma programática
    const resizeEvent = new Event('resize');
    window.dispatchEvent(resizeEvent);

    log("Gatilhos de viewport executados com sucesso.");
} catch (err) {
    log("Erro ao executar gatilhos de viewport: " + err);
}

log("Fim do script principal.");
</script>
</body>
</html>
