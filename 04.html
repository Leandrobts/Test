<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WebKit DOM Test - PS4 Version</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: monospace;
            font-size: 18px;
            padding: 20px;
        }
        .pass { color: #4caf50; font-weight: bold; }
        .fail { color: #f44336; font-weight: bold; }
        #console { margin-top: 20px; white-space: pre-wrap; }
    </style>
</head>
<body>

    <h2>WebKit DOM Mutation & Error Event Test</h2>
    <p>Testando manipulação do DOM durante o evento de erro de uma tag img (Prevenção de Crash).</p>
    
    <div id="console"></div>
    <iframe id="fr" style="display:none;"></iframe>

<script>
// --- Funções de suporte (Substitutas do js-test.js) ---
function log(msg, className) {
    var consoleDiv = document.getElementById('console');
    var span = document.createElement('span');
    if (className) span.className = className;
    span.innerHTML = msg + '<br />';
    consoleDiv.appendChild(span);
}

function testPassed(msg) {
    log('PASS: ' + msg, 'pass');
}

function testFailed(msg) {
    log('FAIL: ' + msg, 'fail');
}

function shouldBe(a, b) {
    try {
        var av = eval(a);
        var bv = eval(b);
        if (av === bv) {
            testPassed(a + ' is ' + b);
        } else {
            testFailed(a + ' should be ' + b + '. Was ' + av);
        }
    } catch (e) {
        testFailed(a + ' threw exception ' + e);
    }
}

function shouldBeTrue(a) {
    shouldBe(a, 'true');
}

function finishJSTest() {
    log('<br /><strong>TEST COMPLETE</strong>', 'pass');
}

// --- Lógica Principal do Teste ---
window.leak = null;
window.onLeak = null;

window.onload = function () {
    var iframe = document.getElementById('fr');
    var cd = iframe.contentDocument || iframe.contentWindow.document;

    cd.body.innerHTML = '<div id="P"><i id="victim"></i><i id="S"></i></div>';
    var P = cd.getElementById('P');
    var victim = cd.getElementById('victim');
    var S = cd.getElementById('S');

    P.addEventListener('DOMNodeRemoved', function(e) {
        if (e.target === victim)
            S.remove();
    });

    window.onLeak = function () {
      setTimeout(function () {
          shouldBeTrue('!!window.leak');

          document.getElementById('fr').remove();

          // Nota: Versões muito antigas do WebKit no PS4 podem não suportar getRootNode nativamente.
          try {
              if (window.leak.getRootNode) {
                  var r = window.leak.getRootNode({composed: true});
                  var r2 = window.leak.getRootNode();
                  testPassed('getRootNode executed successfully.');
              } else {
                  testPassed('getRootNode not supported in this WebKit version, skipping call.');
              }
          } catch (err) {
              testFailed('getRootNode threw exception: ' + err);
          }

          finishJSTest();
      }, 0);
    };

    victim.outerHTML = '<b>b</b><img src="missing-404-image.png" onerror="top.leak = this; if (top.onLeak) top.onLeak();"><table></table>';

    shouldBe('victim.parentNode', 'null');
    shouldBe('S.parentNode', 'null');
};
</script>

</body>
</html>
