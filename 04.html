<!DOCTYPE html>
<html>
<body>
<script src="resources/gc.js"></script>  <!-- mesmo gc.js que serve o teste 1 -->
<script>
function detachedShadowRootOf() {
    const outer = document.createElement('div');
    document.body.appendChild(outer);
    const outerShadow = outer.attachShadow({ mode: 'open' });

    const slotHost = document.createElement('div');
    outerShadow.appendChild(slotHost);
    const innerShadow = slotHost.attachShadow({ mode: 'open' });

    const slot = document.createElement('slot');
    innerShadow.appendChild(slot);

    const lightChild = document.createElement('span');
    slotHost.appendChild(lightChild);

    // Captura a innerShadow (referência que mantém a shadow tree viva)
    const shadowRoot = innerShadow;

    lightChild.remove();
    shadowRoot.replaceChildren();
    outerShadow.replaceChildren(); // remove slotHost → slotHost fica orphaned

    gc();  // força coleta — slotHost.hasChildNodes()==false → sem wrapper → freed
    return shadowRoot;
}

const removedShadowRoot = detachedShadowRootOf();

// Se m_host for zerado pelo destrutor → null (sem crash, bug observable)
// Se m_host for dangling → crash potencial
console.log('host:', removedShadowRoot.host);
console.log('getRootNode:', removedShadowRoot.getRootNode({ composed: true }));

setTimeout(() => {
    gc(); // segundo pass
    console.log('host após 2º GC:', removedShadowRoot.host);
}, 0);
</script>
</body>
</html>
