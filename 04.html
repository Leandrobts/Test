<!DOCTYPE html>
<html>
<body>
<p>This test passes if it does not crash.</p>
<canvas id="c" width="200" height="200"></canvas>
<script>
const ctx = document.getElementById('c').getContext('2d');

// Excede o limite máximo de save() para atingir o MaxSaveCount
for (let i = 0; i < 20000; i++)
    ctx.save();

// Verifica se o navegador suporta beginLayer antes de chamá-lo
if (typeof ctx.beginLayer === 'function') {
    try {
        ctx.beginLayer();
        ctx.beginLayer();
        ctx.beginLayer();
        console.log("beginLayer executado com sucesso.");
    } catch (e) {
        console.log("Erro ao executar beginLayer:", e);
    }
} else {
    console.log("Aviso: ctx.beginLayer não é suportado neste ambiente/navegador.");
}
</script>
</body>
</html>
