
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>PS4 - WebKit 777fe150</title>

<style>
body {
    margin: 0;
    padding: 18px;
    background: #101827;
    color: #ffffff;
    font-family: Arial, sans-serif;
}

h2 {
    color: #66d9ff;
}

button {
    background: #1764a5;
    color: white;
    border: 1px solid #8acfff;
    padding: 14px;
    margin: 5px;
    font-size: 16px;
}

pre {
    background: #172b45;
    border: 1px solid #6085a8;
    padding: 12px;
    font-size: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
}

#resultado {
    font-size: 20px;
    font-weight: bold;
    padding: 12px;
    background: #253650;
}
</style>
</head>

<body>

<h2>PS4 13.52 - WebKit 777fe150</h2>

<p>
Teste adaptado da regressao original do WebKit.
</p>

<button onclick="executarTeste()">
EXECUTAR TESTE
</button>

<button onclick="selecionarLog()">
SELECIONAR LOG
</button>

<div id="resultado">
Aguardando...
</div>

<h3>Relatorio</h3>

<pre id="log"></pre>

<script>
var executando = false;
var linhas = [];

function registrar(texto) {
    linhas.push(texto);

    document.getElementById("log").textContent =
        linhas.join("\n");
}

/*
 * Funcao gc() adaptada de gc.js do WebKit.
 * Sem GCController, cria pressao de memoria.
 * Isso NAO garante uma coleta de lixo.
 */
function gc() {
    if (typeof GCController !== "undefined") {
        GCController.collect();
    } else {
        var gcRec = function(n) {
            if (n < 1)
                return {};

            var temp = {
                i: "ab" + i + (i / 100000)
            };

            temp += "foo";
            gcRec(n - 1);
        };

        for (var i = 0; i < 1000; i++)
            gcRec(10);
    }
}

async function executarTeste() {
    if (executando)
        return;

    executando = true;
    linhas = [];

    var resultado =
        document.getElementById("resultado");

    resultado.textContent = "EXECUTANDO...";

    registrar("=== WEBKIT COMMIT 777fe150 ===");
    registrar("Firmware: PS4 13.52");
    registrar("UA: " + navigator.userAgent);
    registrar("");

    registrar("GCController: " +
        typeof GCController);

    registrar("internals: " +
        typeof window.internals);

    registrar("gc: " + typeof gc);
    registrar("");

    var inicio = Date.now();

    try {
        registrar("1. Criando svg0");

        let svg0 = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "svg"
        );

        registrar("2. Obtendo svgAnimatedLength");

        let svgAnimatedLength = svg0.width;

        /*
         * Linha original:
         *
         * let observation =
         *     internals.observeGC(svgAnimatedLength);
         *
         * Indisponivel no navegador comercial.
         */

        registrar(
            "3. observeGC indisponivel: nao executado"
        );

        registrar("4. Obtendo baseVal");

        let baseVal = svgAnimatedLength.baseVal;

        registrar("5. Criando clipPath0");

        let clipPath0 = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "clipPath"
        );

        registrar("6. svg0.append(clipPath0)");

        svg0.append(clipPath0);

        registrar("7. clipPath0.append('')");

        clipPath0.append('');

        registrar("8. await undefined");

        await undefined;

        registrar("9. Executando gc()");

        gc();

        registrar("10. baseVal.value = 0");

        baseVal.value = 0;

        registrar("11. Operacao concluida");

        resultado.textContent =
            "PASS - SEM CRASH OBSERVADO";

        registrar("");
        registrar("PASS if no crash");

    } catch (erro) {
        resultado.textContent =
            "ERRO DURANTE O TESTE";

        registrar("");
        registrar("ERRO: " + erro);

        if (erro && erro.stack)
            registrar(erro.stack);
    }

    registrar("");
    registrar(
        "Tempo: " + (Date.now() - inicio) + " ms"
    );

    registrar("");
    registrar("IMPORTANTE:");
    registrar(
        "Sem GCController nao ha coleta garantida."
    );
    registrar(
        "Sem observeGC nao ha observacao de coleta."
    );
    registrar(
        "PASS nao confirma vulnerabilidade nem patch."
    );

    registrar("");
    registrar("=== FIM ===");

    executando = false;
}

function selecionarLog() {
    var el = document.getElementById("log");
    var range = document.createRange();
    var selection = window.getSelection();

    range.selectNodeContents(el);
    selection.removeAllRanges();
    selection.addRange(range);
}

window.onload = executarTeste;
</script>

</body>
</html>
