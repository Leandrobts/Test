
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste de Compatibilidade WebGL - PS4</title>
    <style>
        body { font-family: monospace; background: #121212; color: #00ffcc; padding: 20px; }
        .log { background: #1e1e1e; padding: 10px; margin-bottom: 8px; border-left: 4px solid #00ffcc; }
        .error { border-color: #ff5555; color: #ff5555; }
        .success { border-color: #55ff55; color: #55ff55; }
    </style>
</head>
<body>
    <h2>Diagnóstico de API WebGL no Browser</h2>
    <div id="results"></div>

    <script>
        function log(message, type = 'log') {
            const container = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.innerText = message;
            container.appendChild(div);
        }

        // 1. Verificar se o elemento Canvas é suportado
        const canvas = document.createElement('canvas');
        if (!canvas) {
            log('ERRO: O navegador não suporta o elemento <canvas>.', 'error');
        } else {
            log('SUCESSO: Elemento <canvas> disponível.', 'success');
        }

        // 2. Testar nomes de contexto (Padrão vs Antigos/Prefixados)
        const contextNames = [
            'webgl',
            'experimental-webgl',
            'webgl2',
            'experimental-webgl2',
            'webkit-3d', // Variações históricas legadas de WebKit antigo
            'moz-webgl'
        ];

        let activeContextName = null;
        let gl = null;

        for (let name of contextNames) {
            try {
                gl = canvas.getContext(name);
                if (gl) {
                    activeContextName = name;
                    log(`API Encontrada com o nome de contexto: "${name}"`, 'success');
                    break;
                }
            } catch (e) {
                log(`Falha ao tentar o contexto "${name}": ${e.message}`, 'error');
            }
        }

        if (!gl) {
            log('AVISO: Nenhum contexto WebGL/Experimental pôde ser obtido neste navegador.', 'error');
        } else {
            // 3. Extrair informações da implementação da GPU se o contexto abrir
            try {
                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                if (debugInfo) {
                    const vendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
                    const renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                    log(`GPU Vendor: ${vendor}`);
                    log(`GPU Renderer: ${renderer}`);
                } else {
                    log('Extensão WEBGL_debug_renderer_info indisponível (omitida por privacidade/sandbox).');
                }

                log(`Versão WebGL suportada pelo contexto: ${gl.getParameter(gl.VERSION)}`);
                log(`Shading Language Version: ${gl.getParameter(gl.SHADING_LANGUAGE_VERSION)}`);
            } catch (err) {
                log(`Erro ao coletar parâmetros do contexto WebGL: ${err.message}`, 'error');
            }
        }
    </script>
</body>
</html>
