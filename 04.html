<!DOCTYPE html>
<body>
<script>
// Precondição: tocar document.fonts antes do load event
document.fonts;

window.addEventListener("load", () => setTimeout(() => {
    const host = document.createElement("div");
    document.body.appendChild(host);
    const shadow = host.attachShadow({ mode: "open" });

    // @font-face numa shadow root — dispara o pipeline de loading
    const style = document.createElement("style");
    style.textContent = `
        @font-face { font-family: f; src: url("x.otf"); }
        .p { font: 24px f; }`;
    shadow.appendChild(style);

    const span = document.createElement("span");
    span.className = "p";
    span.textContent = "A";
    shadow.appendChild(span);

    // Força layout ? inicia font load
    document.body.offsetHeight;
    document.fonts.load("24px f", "A");

    // Materializa a promise ready para que settling passe por JSPromise::resolve
    document.fonts.ready;

    // Prepend (não append) ? força analyzeStyleSheetChange a escolher Reset
    // Reset re-processa @font-face ? pode zerar o contador de loading fonts
    const extra = document.createElement("style");
    extra.textContent = ".x { color: red; }";
    shadow.prepend(extra);

    // Intercepta o .then do FontFaceSet para remover o host durante a iteração
    Object.defineProperty(FontFaceSet.prototype, "then", {
        configurable: true,
        get() {
            delete FontFaceSet.prototype.then;
            host.remove(); // ? libera o nó que o iterator aponta
            return undefined;
        }
    });

    // Trigger: acesso a document.styleSheets chama flushPendingDescendantUpdates
    document.styleSheets.length;

    document.body.append("alive — sem crash");
}, 0));
</script>
</body>
