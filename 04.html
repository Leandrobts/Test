
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Canvas Reentrancy Test</title>
</head>
<body>
<script>
function gc() {
    for (let i = 0; i < 10000; i++)
        new String("abc");
}

function name(ctx) {
    return ctx ? ctx.constructor.name : "null";
}

function reenter(outer, inner) {
    let canvas = document.createElement("canvas");
    let innerCtx;

    let outerCtx = canvas.getContext(outer, {
        get colorSpace() {
            innerCtx = canvas.getContext(inner);
            return "srgb";
        },
        get alpha() {
            innerCtx = canvas.getContext(inner);
            return true;
        }
    });

    console.log({
        outerCtx: name(outerCtx),
        innerCtx: name(innerCtx)
    });
}

function reenterOffscreen(outer, inner) {
    let canvas = document.createElement("canvas");
    canvas.width = 10;
    canvas.height = 10;

    let innerCtx;

    let outerCtx = canvas.getContext(outer, {
        get colorSpace() {
            innerCtx = canvas.getContext(inner);
            return "srgb";
        },
        get alpha() {
            innerCtx = canvas.getContext(inner);
            return true;
        }
    });

    console.log({
        outerCtx: name(outerCtx),
        innerCtx: name(innerCtx)
    });
}

for (let outer of ["2d", "bitmaprenderer"]) {
    for (let inner of ["2d", "bitmaprenderer"]) {
        reenter(outer, inner);
    }
}

for (let outer of ["2d", "bitmaprenderer"]) {
    for (let inner of ["2d", "bitmaprenderer"]) {
        reenterOffscreen(outer, inner);
    }
}

gc();
</script>
</body>
</html>
