<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    
</head>
<body>
<script>

function loadFontAsDataURL(path) {
    return fetch(path)
        .then(function(r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.arrayBuffer();
        })
        .then(function(buffer) {
            return new Promise(function(resolve, reject) {
                var reader = new FileReader();
                reader.onload  = function(e) { resolve(e.target.result); };
                reader.onerror = reject;
                reader.readAsDataURL(new Blob([buffer], { type: 'font/woff' }));
            });
        });
}

loadFontAsDataURL('Ahem.woff')
    .then(function(dataUrl) {
        var face1 = new FontFace('testFace', 'url("' + dataUrl + '")');
        var face2 = new FontFace('testFace', 'url("' + dataUrl + '")');
        document.fonts.add(face1);
        document.fonts.add(face2);

        void face1.loaded;
        void face2.loaded;

        var trapFired = false;
        var reenterFontFaceSet = function() {
            trapFired = true;
            document.fonts.add(new FontFace('unrelated', 'local("nonexistent")'));
        };
        Object.defineProperty(face1, 'then', { get: reenterFontFaceSet });
        Object.defineProperty(face2, 'then', { get: reenterFontFaceSet });

        var canvas = document.createElement('canvas');
        canvas.width  = 10;
        canvas.height = 10;
        canvas.style.position = 'absolute';
        canvas.style.left = '-9999px';
        document.body.appendChild(canvas);
        var context = canvas.getContext('2d');

        context.font = '10px Times, testFace';
        context.measureText(String.fromCharCode(0x13A0)); 
    })
    
</script>
</body>
</html>
