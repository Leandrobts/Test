<!DOCTYPE html>
<html>
<body>
<pre id="out"></pre>
<script>
var ns = 'http://www.w3.org/2000/svg';
var svg = document.createElementNS(ns, 'svg');

function test(name, animated) {
    var b = animated.baseVal;
    out.innerHTML += name + ' initial: ' + b.value + '\n';
    b.value = 10;
    out.innerHTML += name + ' after: ' + b.value + '\n\n';
}

test('width', svg.width);
test('height', svg.height);
test('x', svg.x);
test('y', svg.y);
</script>
</body>
</html>
