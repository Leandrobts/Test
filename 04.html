<!DOCTYPE html>
<html>
<body>
<button id="run">Run Async GC Pressure Test</button>
<pre id="log"></pre>

<script>
const logEl = document.getElementById("log");
function log(msg) {
    logEl.textContent += msg + "\n";
}

function churnHeap(batches, itemsPerBatch) {
    for (let b = 0; b < batches; b++) {
        const chunk = new Array(itemsPerBatch);
        for (let i = 0; i < itemsPerBatch; i++) {
            chunk[i] = {
                id: b + "_" + i,
                buf: new Array(32).fill(i ^ b),
                str: "gc_probe_" + b + "_" + i + "_0123456789abcdef0123456789abcdef"
            };
        }
    }
}

function createAndDeleteOuter() {
    const style = document.createElement("style");
    document.head.appendChild(style);
    const sheet = style.sheet;

    sheet.insertRule(".outer { color: red; & .nested { color: blue; } }", 0);
    const outer = sheet.cssRules[0];
    if (!outer) {
        log("No outer rule");
        return null;
    }

    let list = outer.cssRules;
    if (!list || list.length === 0) {
        log("No nested rules");
        return null;
    }

    const nested = list[0];
    list = null;

    log("Inserted outer & nested; deleting rule 0...");
    sheet.deleteRule(0);
    log("After delete: sheet.cssRules.length=" + sheet.cssRules.length);

    return nested;
}

function runAsyncWaves(nested, wave, maxWaves) {
    churnHeap(120, 256);
    log("Wave " + wave + "/" + maxWaves + " completed");

    if (wave < maxWaves) {
        setTimeout(() => runAsyncWaves(nested, wave + 1, maxWaves), 40);
        return;
    }

    setTimeout(() => {
        try {
            const pr = nested.parentRule;
            log("Final nested.parentRule=" + pr);
            if (pr) {
                try {
                    log("Final parent.selectorText=" + pr.selectorText);
                } catch (eSel) {
                    log("Error reading parent.selectorText: " + eSel);
                }
            }
        } catch (ePr) {
            log("Error reading nested.parentRule: " + ePr);
        }
    }, 60);
}

document.getElementById("run").addEventListener("click", () => {
    logEl.textContent = "";
    try {
        const nested = createAndDeleteOuter();
        if (!nested)
            return;

        setTimeout(() => runAsyncWaves(nested, 1, 8), 30);
    } catch (e) {
        log("Top-level error: " + e);
    }
});
</script>
</body>
</html>
