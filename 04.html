<body>
<button id="runBtn" type="button">Executar teste</button>
<div id="container"></div>
<script>
function statusLog(msg, color) {
    if (window.PS4Debug && typeof window.PS4Debug.log === "function") {
        window.PS4Debug.log(msg);
    }
    try {
        console.log(msg);
    } catch (e) {}
}

function runSelectTextTransformTest() {
    var container = document.getElementById("container");
    container.innerHTML = "";

    var transforms = ["uppercase", "full-width"];
    for (var t = 0; t < transforms.length; t++) {
        var sel = document.createElement("select");
        sel.multiple = true;
        sel.size = 1;
        sel.style.textTransform = transforms[t];

        var letters = ["a", "b", "c", "d"];
        for (var i = 0; i < letters.length; i++) {
            var opt = document.createElement("option");
            opt.textContent = letters[i];
            sel.appendChild(opt);
        }
        container.appendChild(sel);
    }

    var top = document.body.offsetTop;
    statusLog("Layout forçado (offsetTop=" + top + ") sem crash.", "#00ff88");
}

document.getElementById("runBtn").addEventListener("click", function() {
    try {
        statusLog("Executando teste select + text-transform...", "#00ffff");
        runSelectTextTransformTest();
        statusLog("PASS", "#00ff88");
    } catch (err) {
        statusLog("FAIL: " + err, "#ff5555");
    }
});
</script>
</body>
</html>
