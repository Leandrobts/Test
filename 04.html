
<!DOCTYPE html>
<html>
<body>

<script>

const iterations = 25;
let n = 0;

function round() {
    const frame = document.createElement("iframe");
    document.body.appendChild(frame);
    const ctx = new frame.contentWindow.AudioContext();
    ctx.audioWorklet.addModule("data:text/javascript, ").catch(() => { });
    frame.remove();

    if (++n < iterations) {
        setTimeout(round, 0);
        return;
    }
    setTimeout(() => {
     
    }, 50);
}

onload = round;
</script>
