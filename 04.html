
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Fallback OffscreenCanvas - Abordagem 1 (Pixel Buffer)</title>
    <style>
        body { background: #111; color: #fff; text-align: center; font-family: sans-serif; margin-top: 40px; }
        canvas { border: 2px solid #444; background: #000; }
    </style>
</head>
<body>
    <h1>Abordagem 1: Pixel Buffer via ArrayBuffer</h1>
    <canvas id="meuCanvas" width="640" height="360"></canvas>

    <script>
        const canvas = document.getElementById('meuCanvas');
        const ctx = canvas.getContext('2d');
        
        // Inicializa o Web Worker
        const worker = new Worker('worker1.js');

        // Recebe os dados de pixels processados no worker
        worker.onmessage = function(e) {
            const { buffer, width, height } = e.data;
            const data = new Uint8ClampedArray(buffer);
            
            // Desenha os pixels diretamente no canvas da thread principal
            const imageData = new ImageData(data, width, height);
            ctx.putImageData(imageData, 0, 0);

            // Devolve o buffer vazio/utilizado de volta ao worker (Pooling / Reutilização)
            worker.postMessage({ buffer }, [buffer]);
        };
    </script>
</body>
</html>
