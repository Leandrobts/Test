<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
    // Cria o painel de log na tela dinamicamente
    const logElement = document.createElement('pre');
    logElement.id = 'log';
    logElement.style.background = '#ffffff';
    logElement.style.color = '#ff0000';
    logElement.style.padding = '10px';
    logElement.style.fontFamily = 'monospace';
    document.body.appendChild(logElement);

    function log(msg) { 
        if (logElement) logElement.textContent += msg + '\n';
    }

    let ctx = null;
    let inGetter = false;

    Object.defineProperty(FontFace.prototype, 'then', {
        configurable: true,
        get() {
            if (inGetter || !ctx)
                return undefined;
            inGetter = true;
            for (let i = 0; i < 16; i++) {
                try { ctx.measureText('q' + String.fromCharCode(65 + i) + 'z'); } catch (e) { }
                try { ctx.measureText('x'); } catch (e) { }
            }
            inGetter = false;
            return undefined;
        }
    });

    function attempt(n) {
        for (let d = 0; d < 3; d++)
            new FontFace('Dummy' + n + '_' + d, 'local(Helvetica)');

        const family = 'VarFam' + n;
        const face = new FontFace(family, 'local(Helvetica)');
        void face.loaded;
        document.fonts.add(face);

        // Substituição do OffscreenCanvas por um canvas normal do DOM
        const canvas = document.createElement('canvas');
        canvas.width = 10;
        canvas.height = 10;
        ctx = canvas.getContext('2d');

        ctx.font = '20px Helvetica, ' + family;

        for (let i = 0; i < 50; i++)
            ctx.measureText('x');

        // U+E005 é ausente no Helvetica, acionando a lista de fallback
        ctx.measureText('?AB');
    }

    window.onload = function () {
        setTimeout(function () {
            for (let n = 0; n < 3; n++) {
                try { 
                    attempt(n); 
                } catch (e) { 
                    log(`Exceção capturada: ${e.message}`); 
                }
            }
            log("PASS if no crash");
        }, 0);
    };
</script>
</body>
</html>
