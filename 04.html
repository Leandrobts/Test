<!DOCTYPE html>
<html>
<body>
<pre id="out"></pre>
<script>
var ns = 'http://www.w3.org/2000/svg';
var svg = document.createElementNS(ns, 'svg');
var rect = document.createElementNS(ns, 'rect');

function test(name, animated) {
    var b = animated.baseVal;

    out.innerHTML += name +
        ' initial: ' + b.value + '\n';

    b.value = 10;

    out.innerHTML += name +
        ' after: ' + b.value + '\n\n';
}

test('SVG width', svg.width);
test('SVG height', svg.height);
test('RECT width', rect.width);
test('RECT height', rect.height);
</script>
</body>
</html>
