<!DOCTYPE html>
<html>
<body>
<script>
// Adaptado do teste do commit 86074ba.
// Gatilho original (re-arm de document.fonts.ready + FontFaceSet.prototype.then)
// não existe neste snapshot → substituído por FontFace.prototype.then
// (reentrância em CSSFontFace::setStatus / resolução de .loaded).

function log(message) {
    document.body.appendChild(document.createTextNode(message));
    document.body.appendChild(document.createElement("br"));
}

function run() {
    const host = document.createElement("div");
    document.body.appendChild(host);
    const shadowRoot = host.attachShadow({ mode: "open" });

    // Mesmo @font-face do teste original (URL inválida para forçar falha rápida)
    const fontFaceStyle = document.createElement("style");
    fontFaceStyle.textContent = `@font-face { font-family: reentryFont; src: url("resources/no-such-font-for-reentry.otf"); }`
        + `.probe { font: 24px reentryFont; }`;
    shadowRoot.appendChild(fontFaceStyle);

    const probe = document.createElement("span");
    probe.className = "probe";
    probe.textContent = "A";
    shadowRoot.appendChild(probe);

    // Force layout para o font load começar (igual ao original)
    document.body.offsetHeight;

    // Materializa um FontFace e força o load (caminho que chama setStatus)
    const face = new FontFace("reentryFont", "url(resources/no-such-font-for-reentry.otf)");
    document.fonts.add(face);

    // Também chama o load da FontFaceSet (ajuda a empurrar o pipeline)
    document.fonts.load("24px reentryFont", "A");

    log("document.fonts.status: " + document.fonts.status);

    // Prepend de stylesheet no shadow (força caminho Reset / reprocessamento,
    // igual ao original)
    const prependedStyle = document.createElement("style");
    prependedStyle.textContent = ".unused { color: red; }";
    shadowRoot.prepend(prependedStyle);

    let getterCallCount = 0;

    // Gatilho adaptado: thenable em FontFace.prototype
    // Dispara durante a resolução de face.loaded / setStatus
    Object.defineProperty(FontFace.prototype, "then", {
        configurable: true,
        get() {
            delete FontFace.prototype.then;
            ++getterCallCount;
            // Remove o host enquanto a iteração de shadow roots
            // (ou o update de estilos) ainda está ativa
            host.remove();
            return undefined;
        }
    });

    // Força a resolução da promise (e portanto o getter)
    // + acesso que pode empurrar flushPendingDescendantUpdates
    face.loaded.catch(() => {});
    document.styleSheets.length;   // mesmo trigger do original

    log("FontFace.prototype.then getter calls: " + getterCallCount);
    log("PASS if no crash.");
}

window.addEventListener("load", () => setTimeout(run, 0));
</script>
</body>
</html>
