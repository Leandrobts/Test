<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 Diag v3</title>
<style>
body{background:#111;color:#ddd;font-family:monospace;font-size:13px;padding:6px;margin:0}
h2{color:#8cf;font-size:13px;margin:8px 0 2px;padding:2px 6px;background:#1a2030}
.r{display:flex;justify-content:space-between;padding:2px 6px;border-bottom:1px solid #1c1c1c}
.l{color:#bbb;flex:1;padding-right:8px}
.ok{color:#4e4}
.no{color:#e44}
.wn{color:#ea4}
.in{color:#48e}
.cr{color:#f0f;background:#300;padding:1px 4px;font-weight:bold}
#err{color:#f44;background:#200;padding:4px;margin-bottom:4px;display:none;font-size:12px}
#st{padding:2px 8px;background:#222;border:1px solid #444;display:inline-block;margin-bottom:4px}
button{margin:2px;padding:3px 10px;background:#333;color:#ddd;border:1px solid #555;cursor:pointer}
</style>
</head>
<body>
<div id="err"></div>
<div id="st">Pronto</div><br>
<button onclick="runAll()">Executar</button>
<button onclick="clearLS()">Limpar LS</button>
<button onclick="location.reload()">Reload</button>
<div id="out"></div>

<script>
// ES5 puro — sem strict mode, sem Unicode literal em JS, sem ES6
window.onerror = function(msg, url, line) {
    var e = document.getElementById('err');
    e.style.display = 'block';
    e.innerHTML = 'ERRO JS linha ' + line + ': ' + msg;
    return true;
};

var OUT = null;
var CUR = null;
var LS = 'ps4d3_';

function setStatus(s) { document.getElementById('st').innerHTML = s; }

function newSection(title) {
    OUT = OUT || document.getElementById('out');
    var h = document.createElement('h2');
    h.innerHTML = title;
    OUT.appendChild(h);
    CUR = document.createElement('div');
    OUT.appendChild(CUR);
}

function addRow(label, val, cls) {
    var c = cls || (val === true ? 'ok' : val === false ? 'no' : 'in');
    var d = val === true ? 'SIM' : val === false ? 'NAO' : String(val);
    var r = document.createElement('div');
    r.className = 'r';
    r.innerHTML = '<span class="l">' + label + '</span><span class="' + c + '">' + d + '</span>';
    CUR.appendChild(r);
}

function lsSet(k, v) { try { localStorage.setItem(LS+k, v); } catch(e) {} }
function lsGet(k)    { try { return localStorage.getItem(LS+k); } catch(e) { return null; } }
function lsDel(k)    { try { localStorage.removeItem(LS+k); } catch(e) {} }

function clearLS() {
    try {
        var keys = [];
        for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.indexOf(LS) === 0) keys.push(k);
        }
        for (var j = 0; j < keys.length; j++) localStorage.removeItem(keys[j]);
    } catch(e) {}
    setStatus('LS limpo');
}

function cleanGetter() {
    try {
        Object.defineProperty(FontFace.prototype, 'then', {
            configurable: true, writable: true, value: undefined
        });
    } catch(e) {}
}

// Cria canvas e face frescos para cada teste
function makeCtxAndFace(familyName, src) {
    var c = document.createElement('canvas');
    c.width = 64; c.height = 64;
    var ctx = c.getContext('2d');
    var face = new FontFace(familyName, src || 'local(Helvetica)');
    document.fonts.add(face);
    void face.loaded;
    ctx.font = '10px ' + familyName;
    return { ctx: ctx, face: face, canvas: c };
}

// ============================================================
// A: face.load() como trigger — acoes de reentrancia
// ============================================================
function sA() {
    newSection('A. face.load() como TRIGGER + acoes de reentrancia');

    if (typeof FontFace === 'undefined') { addRow('FontFace ausente','skip','wn'); return; }

    // Verifica crash anterior
    var prev = lsGet('A_crash');
    if (prev) { addRow('!! CRASH SESSAO ANTERIOR em', prev, 'cr'); lsDel('A_crash'); }

    var actions = [
        {
            name: 'ctx.save() x1',
            fn: function(ctx) { ctx.save(); }
        },
        {
            name: 'ctx.save() x8',
            fn: function(ctx) { for(var i=0;i<8;i++) ctx.save(); }
        },
        {
            name: 'ctx.save() x32',
            fn: function(ctx) { for(var i=0;i<32;i++) ctx.save(); }
        },
        {
            name: 'ctx.save() x128',
            fn: function(ctx) { for(var i=0;i<128;i++) ctx.save(); }
        },
        {
            name: 'ctx.restore()',
            fn: function(ctx) { ctx.restore(); }
        },
        {
            name: 'ctx.font = tamanho diferente',
            fn: function(ctx) { ctx.font = '20px sans-serif'; }
        },
        {
            name: 'ctx.measureText("a") — canvas op no getter',
            fn: function(ctx) { ctx.measureText('a'); }
        },
        {
            name: 'document.fonts.add(new FontFace)',
            fn: function(ctx) {
                document.fonts.add(new FontFace('GA_'+Date.now(), 'local(Helvetica)'));
            }
        },
        {
            name: 'document.createElement("span")',
            fn: function(ctx) { document.createElement('span'); }
        },
        {
            name: 'document.body.offsetTop (layout)',
            fn: function(ctx) { void document.body.offsetTop; }
        },
        {
            name: 'style.remove() + offsetTop (como UAF#1)',
            fn: function(ctx) {
                var st = document.getElementById('_tmpstyle_');
                if (st) { st.parentNode.removeChild(st); }
                void document.body.offsetTop;
            }
        },
        {
            name: 'deleteRule(@font-face) + offsetTop (como UAF#3)',
            fn: function(ctx) {
                var st = document.getElementById('_rulestyle_');
                if (st && st.sheet && st.sheet.cssRules.length > 0) {
                    st.sheet.deleteRule(0);
                }
                void document.body.offsetTop;
            }
        },
        {
            name: 'face.load() de outra face no getter (cadeamento)',
            fn: function(ctx) {
                var f2 = new FontFace('GA_inner_'+Date.now(), 'local(Helvetica)');
                document.fonts.add(f2);
                void f2.loaded;
                f2.load();
            }
        }
    ];

    // Monta estilo removivel para teste de style.remove()
    var tmpStyle = document.createElement('style');
    tmpStyle.id = '_tmpstyle_';
    tmpStyle.textContent = 'x{}';
    document.head.appendChild(tmpStyle);

    // Monta @font-face removivel para deleteRule
    var ruleStyle = document.createElement('style');
    ruleStyle.id = '_rulestyle_';
    ruleStyle.textContent = '@font-face{font-family:_df_;src:local(Helvetica);}';
    document.head.appendChild(ruleStyle);

    for (var i = 0; i < actions.length; i++) {
        var a = actions[i];
        var fired = false, done = false, errMsg = null;

        lsSet('A_crash', a.name);

        var env = makeCtxAndFace('FA' + i);

        try {
            Object.defineProperty(FontFace.prototype, 'then', {
                configurable: true,
                get: function() {
                    if (fired) return undefined;
                    fired = true;
                    try { a.fn(env.ctx); done = true; }
                    catch(e) { errMsg = e.message; }
                    return undefined;
                }
            });
            env.face.load();
        } catch(e) {
            addRow(a.name, 'excecao externa: ' + e.message, 'no');
            cleanGetter(); continue;
        }
        cleanGetter();

        if (!fired)       addRow(a.name, 'getter NAO disparou', 'wn');
        else if (errMsg)  addRow(a.name, 'getter OK / acao ERRO: ' + errMsg, 'no');
        else if (!done)   addRow(a.name, 'getter OK / acao incompleta', 'wn');
        else              addRow(a.name, 'getter + acao OK', 'ok');
    }

    lsDel('A_crash');

    // Restaura estilos removidos
    if (!document.getElementById('_rulestyle_')) {
        var rs2 = document.createElement('style');
        rs2.id = '_rulestyle_';
        rs2.textContent = '@font-face{font-family:_df_;src:local(Helvetica);}';
        document.head.appendChild(rs2);
    }
}

// ============================================================
// B: face.load() trigger — ctx.save() incremental (crash detection)
// ============================================================
function sB() {
    newSection('B. face.load() trigger + ctx.save() incremental (crash detection)');

    if (typeof FontFace === 'undefined') { addRow('FontFace ausente','skip','wn'); return; }

    var prev = lsGet('B_crash');
    if (prev) { addRow('!! CRASH SESSAO ANTERIOR com N saves', prev, 'cr'); lsDel('B_crash'); }

    var counts = [1, 2, 4, 8, 16, 32, 64, 128, 256, 512];
    for (var i = 0; i < counts.length; i++) {
        var n = counts[i];
        var fired = false, ok = false;

        lsSet('B_crash', String(n));

        var env = makeCtxAndFace('FB' + n);

        try {
            Object.defineProperty(FontFace.prototype, 'then', {
                configurable: true,
                get: function() {
                    if (fired) return undefined;
                    fired = true;
                    for (var j = 0; j < n; j++) env.ctx.save();
                    ok = true;
                    return undefined;
                }
            });
            env.face.load();
        } catch(e) {
            addRow('N=' + n, 'excecao: ' + e.message, 'no');
            cleanGetter(); continue;
        }
        cleanGetter();

        if (!fired) addRow('N=' + n + ' saves', 'getter nao disparou', 'wn');
        else        addRow('N=' + n + ' saves', ok ? 'OK sem crash' : 'save() falhou', ok ? 'ok' : 'no');
    }
    lsDel('B_crash');
    addRow('Resultado', 'nenhum N causou crash detectavel', 'in');
}

// ============================================================
// C: ctx.font = setter como trigger (caminho alternativo novo)
// ============================================================
function sC() {
    newSection('C. ctx.font = setter como TRIGGER (novo caminho)');

    if (typeof FontFace === 'undefined') { addRow('FontFace ausente','skip','wn'); return; }

    var prev = lsGet('C_crash');
    if (prev) { addRow('!! CRASH SESSAO ANTERIOR', prev, 'cr'); lsDel('C_crash'); }

    // Instala getter
    // Testa se "ctx.font = ..." dispara o getter ao tentar resolver a fonte
    var tests = [
        { name: 'ctx.font = fonte local nao carregada', fn: function(ctx, f) { ctx.font = '10px FC0'; } },
        { name: 'ctx.font = tamanho diferente da face', fn: function(ctx, f) { ctx.font = '20px FC0'; } },
        { name: 'ctx.font = CSS generic serif', fn: function(ctx, f) { ctx.font = '10px serif'; } },
    ];

    for (var i = 0; i < tests.length; i++) {
        var t = tests[i];
        var fired = false;
        lsSet('C_crash', t.name);

        try {
            var face = new FontFace('FC0', 'local(Helvetica)');
            document.fonts.add(face);
            void face.loaded;

            Object.defineProperty(FontFace.prototype, 'then', {
                configurable: true,
                get: function() { fired = true; return undefined; }
            });

            var c = document.createElement('canvas');
            c.width = 64; c.height = 64;
            var ctx = c.getContext('2d');
            t.fn(ctx, face);
        } catch(e) {
            addRow(t.name, 'excecao: ' + e.message, 'no');
            cleanGetter(); continue;
        }
        cleanGetter();
        addRow(t.name, fired ? 'GETTER DISPAROU' : 'nao disparou', fired ? 'ok' : 'wn');
    }
    lsDel('C_crash');
}

// ============================================================
// D: document.fonts.load() como trigger + acoes de reentrancia
// ============================================================
function sD() {
    newSection('D. document.fonts.load() como TRIGGER + reentrancia');

    if (typeof FontFace === 'undefined' || !('fonts' in document)) {
        addRow('APIs ausentes','skip','wn'); return;
    }

    var prev = lsGet('D_crash');
    if (prev) { addRow('!! CRASH SESSAO ANTERIOR em', prev, 'cr'); lsDel('D_crash'); }

    var actions = [
        {
            name: 'ctx.save() x128',
            fn: function(ctx) { for(var i=0;i<128;i++) ctx.save(); }
        },
        {
            name: 'document.fonts.add(new FontFace)',
            fn: function(ctx) {
                document.fonts.add(new FontFace('GD_'+Date.now(), 'local(Helvetica)'));
            }
        },
        {
            name: 'document.body.offsetTop',
            fn: function(ctx) { void document.body.offsetTop; }
        },
        {
            name: 'ctx.measureText("a") no getter',
            fn: function(ctx) { ctx.measureText('a'); }
        },
    ];

    for (var i = 0; i < actions.length; i++) {
        var a = actions[i];
        var fired = false, done = false, errMsg = null;
        lsSet('D_crash', a.name);

        var env = makeCtxAndFace('FD' + i);

        try {
            Object.defineProperty(FontFace.prototype, 'then', {
                configurable: true,
                get: function() {
                    if (fired) return undefined;
                    fired = true;
                    try { a.fn(env.ctx); done = true; }
                    catch(e) { errMsg = e.message; }
                    return undefined;
                }
            });
            document.fonts.load('10px FD' + i, 'a');
        } catch(e) {
            addRow(a.name, 'excecao: ' + e.message, 'no');
            cleanGetter(); continue;
        }
        cleanGetter();

        if (!fired)       addRow(a.name, 'getter NAO disparou', 'wn');
        else if (errMsg)  addRow(a.name, 'getter OK / acao ERRO: ' + errMsg, 'no');
        else if (!done)   addRow(a.name, 'getter OK / acao incompleta', 'wn');
        else              addRow(a.name, 'getter + acao OK', 'ok');
    }
    lsDel('D_crash');
}

// ============================================================
// E: CSS @font-face como alternativa ao JS FontFace
// ============================================================
function sE() {
    newSection('E. CSS @font-face — measurText via CSS consegue disparar getter?');

    if (typeof FontFace === 'undefined') { addRow('FontFace ausente','skip','wn'); return; }

    var prev = lsGet('E_crash');
    if (prev) { addRow('!! CRASH SESSAO ANTERIOR', prev, 'cr'); lsDel('E_crash'); }

    // Injeta CSS @font-face
    var cssStyle = document.createElement('style');
    cssStyle.id = '_cssff_';
    cssStyle.textContent = '@font-face{font-family:CSSFont;src:local(Helvetica);}';
    document.head.appendChild(cssStyle);
    void document.body.offsetTop; // forca layout para registrar o @font-face

    var tests = [
        {
            name: 'CSS @font-face + measureText("a")',
            fn: function() {
                var c = document.createElement('canvas');
                c.width=64;c.height=64;
                var ctx = c.getContext('2d');
                ctx.font = '10px CSSFont';
                ctx.measureText('a');
            }
        },
        {
            name: 'CSS @font-face + document.fonts.load()',
            fn: function() {
                document.fonts.load('10px CSSFont', 'a');
            }
        },
        {
            name: 'CSS @font-face + document.fonts.check()',
            fn: function() {
                document.fonts.check('10px CSSFont', 'a');
            }
        },
        {
            name: 'CSS @font-face — face existe em document.fonts?',
            fn: function() {
                var found = false;
                document.fonts.forEach(function(f) {
                    if (f.family === 'CSSFont') found = true;
                });
                return found;
            },
            check: true
        },
    ];

    for (var i = 0; i < tests.length; i++) {
        var t = tests[i];
        if (t.check) {
            try { addRow(t.name, t.fn(), t.fn() ? 'ok' : 'wn'); } catch(e) { addRow(t.name,'erro: '+e,'no'); }
            continue;
        }

        var fired = false;
        lsSet('E_crash', t.name);
        try {
            Object.defineProperty(FontFace.prototype, 'then', {
                configurable: true,
                get: function() { fired = true; return undefined; }
            });
            t.fn();
        } catch(e) {
            addRow(t.name, 'excecao: ' + e.message, 'no');
            cleanGetter(); continue;
        }
        cleanGetter();
        addRow(t.name, fired ? 'GETTER DISPAROU' : 'nao disparou', fired ? 'ok' : 'wn');
    }
    lsDel('E_crash');
}

// ============================================================
// F: face.load() — largura do canvas muda depois de load()?
// ============================================================
function sF() {
    newSection('F. face.load() — canvas usa a fonte depois de carregada?');

    if (typeof FontFace === 'undefined') { addRow('FontFace ausente','skip','wn'); return; }

    var c = document.createElement('canvas');
    c.width=64;c.height=64;
    var ctx = c.getContext('2d');

    // Mede com serif como baseline
    ctx.font = '20px serif';
    var base = 0;
    try { base = ctx.measureText('a').width; } catch(e) {}
    addRow('baseline serif 20px', base, 'in');

    // Cria face, mede ANTES de load()
    try {
        var f = new FontFace('FF_test', 'local(Helvetica)');
        document.fonts.add(f);
        ctx.font = '20px FF_test';
        var w1 = ctx.measureText('a').width;
        addRow('FF_test width ANTES de load()', w1, 'in');

        // Chama face.load() (dispara getter - mas aqui sem getter instalado)
        f.load();

        // Mede DEPOIS de load()
        var w2 = ctx.measureText('a').width;
        addRow('FF_test width DEPOIS de load()', w2, 'in');
        addRow('Width mudou apos load()?', w1 !== w2, w1 !== w2 ? 'ok' : 'wn');
    } catch(e) {
        addRow('Erro', e.message, 'no');
    }

    // Mede com CSS @font-face apos layout
    try {
        var cs = document.createElement('style');
        cs.textContent = '@font-face{font-family:FF_css;src:local(Helvetica);}';
        document.head.appendChild(cs);
        void document.body.offsetTop;
        document.fonts.load('20px FF_css','a');
        ctx.font = '20px FF_css';
        var wCss = ctx.measureText('a').width;
        addRow('FF_css (CSS @font-face) width', wCss, 'in');
        addRow('FF_css diferente do baseline?', wCss !== base, wCss !== base ? 'ok' : 'wn');
    } catch(e) {
        addRow('CSS @font-face erro', e.message, 'no');
    }
}
