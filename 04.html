<!DOCTYPE html>
<html>
<body>
<script src="resources/js-test.js"></script>
<script>
description('Removing a shadow host must not leave the surviving shadow tree '
    + 'pointing at the freed host. The test passes if it does not crash.');

// Constructor roda durante o parser (innerHTML)
// 'this' sai de scope ao final do constructor → wrapper elegível para GC
customElements.define('x-slot-host', class extends HTMLElement {
    constructor() {
        super();
        this.attachShadow({ mode: 'open' }).innerHTML = '<slot></slot>';
        window.__sr = this.shadowRoot;
        // 'this' não é armazenado em nenhuma variável persistente
    }
});

function detachedShadowRootOf() {
    const outer = document.createElement('div');
    document.body.appendChild(outer);
    const outerShadow = outer.attachShadow({ mode: 'open' });

    // Parser cria x-slot-host → constructor roda → 'this' vai a GC
    // lightChild está no light DOM de x-slot-host (que é filho de outerShadow)
    outerShadow.innerHTML =
        '<x-slot-host><span id="lightChild"></span></x-slot-host>';

    const shadowRoot = window.__sr;
    window.__sr = null;

    // getElementById busca no scope de outerShadow → encontra lightChild
    // SEM criar wrapper para x-slot-host
    const lightChild = outerShadow.getElementById('lightChild');

    lightChild.remove();         // x-slot-host.hasChildNodes() == false agora
    shadowRoot.replaceChildren(); // limpa o slot do shadow root

    // GC ANTES do replaceChildren para coletar o wrapper do constructor
    // (diferença do original: original nunca criou wrapper, aqui precisamos limpar)
    gc();

    // Agora: x-slot-host.wrapper() == null + hasChildNodes() == false
    // → willCreatePossiblyOrphanedTreeByRemoval NÃO cria wrapper → host elegível
    outerShadow.replaceChildren();
    gc();
    return shadowRoot;
}

const removedShadowRoot = detachedShadowRootOf();
shouldNotBe('removedShadowRoot.host', 'null');
shouldBe('removedShadowRoot.getRootNode({composed: true})', 'removedShadowRoot.host');

const shadowRootWithChild = detachedShadowRootOf();
const child = document.createElement('b');
shadowRootWithChild.appendChild(child);
shouldBe('child.getRootNode({composed: true})', 'shadowRootWithChild.host');

gc();

shouldBe('child.getRootNode({composed: true})', 'shadowRootWithChild.host');
</script>
</body>
</html>
