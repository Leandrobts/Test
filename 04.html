
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PS4 API Test</title>
</head>
<body>
<h2>PS4 - Teste de APIs</h2>
<pre id="resultado"></pre>

<script>
var APIs = [
  "VideoEncoder",
  "MediaRecorder",
  "RTCPeerConnection",
  "webkitRTCPeerConnection",
  "MediaStream",
  "WebGLRenderingContext",
  "HTMLCanvasElement"
];

var texto = "";

for (var i = 0; i < APIs.length; i++) {
  var nome = APIs[i];
  texto += nome + ": " +
    typeof window[nome] + "\n";
}

document.getElementById("resultado")
  .textContent = texto;
</script>
</body>
</html>
