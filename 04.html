<!DOCTYPE html>
<html>
<body>
<p>Teste de Mudança de Foco e Contexto (Adaptado)</p>
<input id="outerInput">
<iframe tabindex="0" srcdoc="<input tabindex='0'><script>parent.innerInput = document.querySelector('input');</script>"></iframe>

<script>
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);  
}
    
let iframe = document.querySelector('iframe');
let outerInput = document.querySelector('input');
let innerInput = null;
    
iframe.onload = () => setTimeout(runTest, 0);

function runTest() {
    // Captura o input interno gerado no iframe
    let innerInput = window.innerInput;
    window.innerInput = null;

    // Mecanismo de mudança de foco: disparado no evento de blur do input externo
    outerInput.addEventListener('blur', () => {
        if (innerInput) {
            // Adota o nó do contexto do iframe para o documento principal durante a perda de foco
            document.adoptNode(innerInput);
            innerInput = null;
        }
        if (iframe) {
            iframe.remove();
            iframe = null;
        }
        gc();
    }, { once: true });

    // Foca o input e simula o evento de Tab para forçar a transição de foco na controladora da engine
    outerInput.focus();
    outerInput.dispatchEvent(new KeyboardEvent('keydown', { 
        bubbles: true, 
        cancelable: true, 
        view: window, 
        detail: 0, 
        key: 'Tab', 
        code: 'Tab', 
        keyIdentifier: 'U+0009' 
    }));
    
    document.body.innerHTML += '<p>Fluxo de mudança de foco executado.</p>';
}
</script>
</body>
</html>
