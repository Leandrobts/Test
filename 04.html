<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>RVFC iframe removal test</title>

<style>
body {
    background: #111;
    color: #eee;
    font-family: monospace;
}

#log {
    white-space: pre-wrap;
    border: 1px solid #555;
    padding: 10px;
    margin-top: 20px;
}

iframe {
    width: 320px;
    height: 240px;
    border: 1px solid #888;
}
</style>
</head>

<body>

<h2>RVFC iframe removal test</h2>

<div id="status">Initializing...</div>
<div id="log"></div>

<script>

(function () {

    var status = document.getElementById("status");
    var logElement = document.getElementById("log");

    function log(message) {
        console.log(message);
        logElement.textContent += message + "\n";
    }

    var testCount = 0;
    var maxTests = 10;
    var currentFrame = null;
    var waitingResolve = null;

    /*
     * Verifica se o navegador possui requestVideoFrameCallback.
     *
     * Sem essa API, o caminho específico corrigido pelo
     * commit fe980da não pode ser alcançado por JavaScript.
     */

    var testVideo = document.createElement("video");

    if (typeof testVideo.requestVideoFrameCallback !== "function") {
        status.textContent = "RVFC NOT SUPPORTED";
        log("ERROR: requestVideoFrameCallback is not available.");
        log("This browser cannot directly execute the target path.");
        return;
    }

    log("requestVideoFrameCallback: SUPPORTED");

    /*
     * Cria um iframe.
     *
     * O iframe contém o HTMLVideoElement e os callbacks RVFC.
     */

    function createFrame() {

        return new Promise(function(resolve) {

            var frame = document.createElement("iframe");

            frame.onload = function() {
                resolve(frame);
            };

            frame.src = "05.html";

            document.body.appendChild(frame);

        });
    }

    /*
     * Chamado pelo iframe durante um VideoFrameCallback.
     *
     * Este é o equivalente ao:
     *
     *     frame.remove();
     *
     * do teste original.
     */

    window.removeTargetFrame = function() {

        log(">>> removeTargetFrame() called from RVFC");

        if (currentFrame) {

            var frameToRemove = currentFrame;

            /*
             * Remove imediatamente o iframe.
             *
             * Isto força a destruição/navegação do documento
             * que contém o HTMLVideoElement.
             */

            frameToRemove.remove();

            currentFrame = null;

            log(">>> iframe removed");

        }

        if (waitingResolve) {

            var resolve = waitingResolve;
            waitingResolve = null;

            resolve();
        }
    };

    function waitForRemoval() {

        return new Promise(function(resolve) {
            waitingResolve = resolve;
        });

    }

    async function runTest() {

        for (testCount = 1; testCount <= maxTests; testCount++) {

            status.textContent =
                "Running iteration " +
                testCount +
                " / " +
                maxTests;

            log("");
            log("=================================");
            log("Iteration " + testCount);
            log("Creating iframe...");

            currentFrame = await createFrame();

            log("Iframe loaded.");
            log("Waiting for RVFC-triggered removal...");

            await waitForRemoval();

            log("Iteration " + testCount + " completed.");

            /*
             * Pequena pausa entre iterações.
             */

            await new Promise(function(resolve) {
                setTimeout(resolve, 100);
            });

        }

        status.textContent = "TEST COMPLETED";

        log("");
        log("=================================");
        log("All iterations completed.");
        log("If the browser did not crash, the test finished.");

    }

    /*
     * Inicia automaticamente.
     */

    setTimeout(function() {
        runTest();
    }, 500);

})();

</script>

</body>
</html>
