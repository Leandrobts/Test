

<script>

  function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);  
  }
  onload = async () => {
    
  let svg0 = document.createElementNS(
    'http://www.w3.org/2000/svg', 'svg'
);

let animated = svg0.width;
let baseVal = animated.baseVal;

document.body.innerHTML =
    'Initial value: ' + baseVal.value +
    '<br>Unit type: ' + baseVal.unitType +
    '<br>Animated length: ' + typeof animated +
    '<br>BaseVal: ' + typeof baseVal;

baseVal.value = 0;

document.body.innerHTML +=
    '<br>After assignment: ' + baseVal.value;
  };
</script>
