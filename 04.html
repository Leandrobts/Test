
<!doctype html>
<button id="go">Run fullscreen test 2</button>
<iframe id="f" srcdoc="<div id=d>TEST</div>"></iframe>

<script>
go.onclick = () => {
  const d = f.contentDocument.getElementById("d");
  const oldDoc = f.contentDocument;
d.webkitRequestFullscreen().catch(() => {});
  
  f.remove();

  setTimeout(() => {
    try { oldDoc.webkitCancelFullScreen(); } catch (_) {}
  }, 15);
};
</script>
