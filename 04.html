<!DOCTYPE html>
<pre id="log" style="background: #222; color: #0f0; padding: 10px; font-size: 12px;"></pre>
<script>
    function log(msg) {
        const logElement = document.getElementById('log');
        if (logElement) logElement.textContent += msg + '\n';
        console.log(msg);
    }

    // Captura erros globais de JavaScript
    window.onerror = function(message, source, lineno, colno, error) {
        log(`[Erro] ${message} (${source}:${lineno}:${colno})`);
    };

    // Captura erros em Promises não tratadas
    window.addEventListener('unhandledrejection', function(event) {
        log(`[Promise Rejection] ${event.reason}`);
    });
</script>

<script>
fetch('resources/teste/pokemon/Ahem.woff')
    .then(function(r) { return r.arrayBuffer(); })
    .then(function(b) {
        return new Promise(function(res, rej) {
            var fr = new FileReader();
            fr.onload  = function(e) { res(e.target.result); };
            fr.onerror = rej;
            fr.readAsDataURL(new Blob([b], { type: 'font/woff' }));
        });
    })
    .then(function(dataUrl) {

        var dummies = [];
        for (var i = 0; i < 500; i++) {
            var d = document.createElement('canvas');
            d.width = 1; d.height = 1;
            d.getContext('2d').font = '10px "Z' + i + '"';
            dummies.push(d);
        }

        var face = new FontFace('FallbackFam', 'url("' + dataUrl + '")');
        document.fonts.add(face);
        void face.loaded;

        var canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        document.body.appendChild(canvas);
        var ctx = canvas.getContext('2d');
        
        ctx.font = '10px Times, FallbackFam';

        var reen = false;
        Object.defineProperty(face, 'then', {
            configurable: true,
            get: function() {
                if (reen) return undefined;
                reen = true;
                document.fonts.add(new FontFace('Unrelated', 'local("x")'));
                reen = false;
                return undefined;
            }
        });
    ctx.measureText('\u13A0\u13A2\u13A4');
    });
</script>
