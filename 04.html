<!DOCTYPE html>
<html>
<body>
<p>This test passes if it does not crash.</p>
<div id="host"></div>
<div id="result"></div>
<script>
function gc() {
    function gcRec(n) {
        if (n < 1) return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

function log(msg) {
    var d = document.createElement('div');
    d.textContent = msg;
    result.appendChild(d);
}

let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('input');
victim.type = 'text';
victim.tabIndex = 0;
shadowRoot.appendChild(victim);
victim.focus();

log('[Setup] focused: ' + (host.shadowRoot.activeElement === victim));
log('[Setup] doc.activeElement: ' + document.activeElement?.tagName);
log('[Ready] 1) Clique no input e DIGITE algo  2) Botão PS → XMB → volte');

document.addEventListener('blur', function onBlur(e) {
    log('[Blur] target: ' + e.target.tagName + ', type: ' + e.target.type);
    log('[Before remove] doc.activeElement: ' + document.activeElement?.tagName);
    log('[Before remove] shadow.activeElement: ' + (host.shadowRoot.activeElement?.tagName || 'null'));
    victim.remove();
    log('[After remove] doc.activeElement: ' + (document.activeElement?.tagName || 'null'));
    log('[After remove] shadow.activeElement: ' + (host.shadowRoot.activeElement?.tagName || 'null'));
    victim = null;
    gc();
    log('[After gc]');
    document.removeEventListener('blur', onBlur, true);
}, true);

window.addEventListener('blur', () => log('[Window] blur'));
document.addEventListener('visibilitychange', () => log('[Visibility] ' + document.visibilityState));
</script>
</body>
</html>
