<!DOCTYPE html>
<html>
<body>
<button id="run">Run Short Cycle Test</button>
<pre id="log"></pre>

<script>
const logEl = document.getElementById("log");
function log(msg) {
    logEl.textContent += msg + "\n";
}

function allocCycle(n) {
    for (let i = 0; i < n; i++) {
        const tmp = { idx: i, tag: "cycle_" + i + "_abcdef0123456789" };
        if (i % 64 === 0)
            new Array(32).fill(tmp.tag);
    }
}

function makeDetachedChild() {
    const style = document.createElement("style");
    document.head.appendChild(style);
    const sheet = style.sheet;

    sheet.insertRule(".outer { color: red; & .nested { color: blue; } }", 0);
    const child = sheet.cssRules[0].cssRules[0];
    sheet.deleteRule(0);
    style.remove();
    return child;
}

function probeChild(child) {
    try {
        const pr = child.parentRule;
        if (!pr)
            return "parentRule=null";
        return "parentRule=" + pr + " | sel=" + pr.selectorText;
    } catch (e) {
        return "ERR: " + e;
    }
}

document.getElementById("run").addEventListener("click", () => {
    logEl.textContent = "";
    try {
        let child = makeDetachedChild();
        log("Init: " + probeChild(child));

        let step = 1;
        const maxSteps = 12;

        function tick() {
            allocCycle(3000);
            log("Step " + step + "/" + maxSteps + ": " + probeChild(child));

            if (step < maxSteps) {
                step++;
                setTimeout(tick, 25);
            } else {
                child = null;
                allocCycle(3000);
                log("Done (child cleared)");
            }
        }

        setTimeout(tick, 25);
    } catch (e) {
        log("Top error: " + e);
    }
});
</script>
</body>
</html>
