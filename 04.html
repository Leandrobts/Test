
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 WebKit - XMLHttpRequest Lifecycle Test</title>
<style>
body{background:#111;color:#eee;font:16px Arial;padding:15px}
#log{background:#222;border:1px solid #555;padding:12px;white-space:pre-wrap;word-wrap:break-word}
</style>
</head>
<body>
<h3>XMLHttpRequest - Document Lifecycle Test</h3>
<div id="log">Initializing...</div>

<script>
var iterations=25;
var n=0;
var started=0;
var cancelled=0;
var rejected=0;
var completed=0;
var apiAvailable=typeof XMLHttpRequest!=="undefined";
var output=document.getElementById("log");

function log(message){
    output.innerHTML+= "\n"+message;
}

function round(){
    var frame=document.createElement("iframe");
    document.body.appendChild(frame);

    try{
        var win=frame.contentWindow;

        if(!win||typeof win.XMLHttpRequest==="undefined"){
            log("API inexistente: XMLHttpRequest");
            frame.remove();
            finishIteration();
            return;
        }

        var xhr=new win.XMLHttpRequest();

        xhr.onreadystatechange=function(){
            if(xhr.readyState===1){
                log("Operação iniciada: "+(n+1));
            }

            if(xhr.readyState===4){
                completed++;
                log("Operação finalizada: "+(n+1)+" status="+xhr.status);
            }
        };

        xhr.onerror=function(){
            rejected++;
            log("Operação rejeitada: "+(n+1));
        };

        xhr.onabort=function(){
            cancelled++;
            log("Operação cancelada: "+(n+1));
        };

        xhr.open("GET","/lifecycle-test-"+n+".txt",true);
        xhr.send();
        started++;

        frame.remove();

    }catch(e){
        rejected++;
        log("Erro: "+e.message);
        if(frame.parentNode)frame.parentNode.removeChild(frame);
    }

    finishIteration();
}

function finishIteration(){
    n++;

    if(n<iterations){
        setTimeout(round,0);
        return;
    }

    setTimeout(function(){
        log("\n========== RESULTADO ==========");
        log("API: "+(apiAvailable?"Disponível":"Inexistente"));
        log("Operações iniciadas: "+started);
        log("Operações canceladas: "+cancelled);
        log("Operações rejeitadas: "+rejected);
        log("Operações concluídas: "+completed);
        log("Iterações: "+n);
        log("Teste concluído sem crash.");
    },50);
}

window.onload=round;
</script>
</body>
</html>
