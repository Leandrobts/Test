<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Diagnostico de Etapas - Fluxo UAF ebc83b8</title>
</head>
<body>
  <h1>Diagnostico de Etapas - Fluxo UAF (Commit ebc83b8)</h1>
  <p>Sem CSS / sem style. Execucao passo a passo para isolar onde o estado do teste nao se forma.</p>
  <pre id="out">Iniciando...</pre>

  <script>
    (function () {
      var out = document.getElementById("out");
      var logLines = [];

      function log(msg) {
        logLines.push(msg);
        if (out) {
          out.textContent = logLines.join("\n");
        }
      }

      // Funcao de pressao de memoria em ES5 puro (ajuste iteracoes se precisar)
      function gcStep(loops, depth) {
        function rec(n) {
          if (n < 1) {
            return {};
          }
          var s = "k" + n + "_" + Math.random();
          var obj = { a: s, b: [1, 2, 3, s] };
          return rec(n - 1) ? obj : null;
        }
        for (var i = 0; i < loops; i++) {
          rec(depth);
        }
      }

      var survivor = null;
      var child = null;
      var list = null;
      var setupOk = false;

      function setupScenario() {
        logLines = [];
        survivor = null;
        child = null;
        list = null;
        setupOk = false;

        log("=== ETAPA 0: SETUP DO DOCUMENTO SECUNDARIO ===");
        try {
          var secDoc = document.implementation.createHTMLDocument();
          secDoc.body.innerHTML = '<input id="i"><label for="i"></label>';

          var inp = secDoc.getElementById("i");
          if (!inp) {
            log("[FALHA] input#i nao encontrado.");
            return;
          }

          list = inp.labels;
          log("[INFO] list obtido: " + (list !== null && typeof list === "object"));
          log("[INFO] list.length inicial: " + (list ? list.length : "N/A"));
          log("[INFO] list[0] tag inicial: " + (list && list[0] ? list[0].tagName : "null/undef"));

          if (!list || !list[0]) {
            log("[FALHA] list[0] nao retornou o <label> esperado.");
            return;
          }

          survivor = secDoc.createElement("div");
          child = secDoc.createElement("span");
          setupOk = true;
          log("[OK] Setup concluido. Referencias locais ao secDoc/input/label removidas do escopo.");
        } catch (e) {
          log("[ERRO] Excecao no setup: " + e);
        }
      }

      function runStage1GcLabel() {
        log("");
        log("=== ETAPA 1: GC PARA TENTAR COLETAR <label> (COM list AINDA VIVO) ===");
        if (!setupOk || !list) {
          log("[AVISO] Rode o setup primeiro.");
          return;
        }
        log("[ANTES] list.length = " + list.length + " | list[0] = " + (list[0] ? list[0].tagName : String(list[0])));

        for (var round = 1; round <= 3; round++) {
          gcStep(4000, 6);
          var item0 = null;
          var lenNow = -1;
          try {
            lenNow = list.length;
            item0 = list[0];
          } catch (e) {
            log("[ERRO] Ao inspecionar list na rodada " + round + ": " + e);
            return;
          }
          log("[RODADA " + round + "] list.length = " + lenNow + " | list[0] = " + (item0 ? item0.tagName : String(item0)));
        }

        if (list[0]) {
          log("[DIAGNOSTICO ETAPA 1] <label> AINDA ESTÁ VIVO (list[0] nao virou null/undefined).");
          log("  -> Motivo provavel: GC nao coletou o <label> ainda ou <label> segue retido.");
        } else {
          log("[DIAGNOSTICO ETAPA 1] list[0] ficou null/undefined enquanto list ainda existe.");
        }
      }

      function runStage2DropListAndGc() {
        log("");
        log("=== ETAPA 2: SOLTAR list (list = null) + GC ===");
        if (!list) {
          log("[AVISO] list ja e null ou setup nao foi executado.");
          return;
        }
        list = null;
        log("[OK] list = null atribuido.");

        for (var round = 1; round <= 3; round++) {
          gcStep(4000, 6);
          log("[RODADA " + round + "] GC executado apos list = null.");
        }
        log("[DIAGNOSTICO ETAPA 2] Se a lista estava registrada e foi coletada aqui, o destrutor rodou.");
      }

      function runStage3MutateAndInvalidate() {
        log("");
        log("=== ETAPA 3: INVALIDACAO VIA survivor.appendChild(child) ===");
        if (!survivor || !child) {
          log("[AVISO] survivor ou child ausentes; rode o setup primeiro.");
          return;
        }
        try {
          survivor.appendChild(child);
          log("[SOBREVIVEU] survivor.appendChild(child) concluiu sem crash/excecao.");
          log("[INFO] survivor.childNodes.length = " + survivor.childNodes.length);
          log("[DIAGNOSTICO ETAPA 3] Nao houve crash ao percorrer/invalidar no appendChild.");
          log("  -> Possiveis causas: WeakPtr nao usado em LabelsNodeList nessa versao,");
          log("     desregistro incondicional no destrutor, ou invalidação nao disparada nesse caminho.");
        } catch (e) {
          log("[EXCECAO] Erro capturado em appendChild: " + e);
        }
      }

      function runAllSequential() {
        setupScenario();
        runStage1GcLabel();
        runStage2DropListAndGc();
        runStage3MutateAndInvalidate();
      }

      window.diagActions = {
        setupScenario: setupScenario,
        runStage1GcLabel: runStage1GcLabel,
        runStage2DropListAndGc: runStage2DropListAndGc,
        runStage3MutateAndInvalidate: runStage3MutateAndInvalidate,
        runAllSequential: runAllSequential
      };

      // Cria botoes simples sem CSS/style para executar etapa por etapa ou tudo de uma vez
      var controlsDiv = document.createElement("div");

      function addBtn(label, fn) {
        var b = document.createElement("button");
        b.type = "button";
        b.textContent = label;
        b.onclick = fn;
        controlsDiv.appendChild(b);
      }

      addBtn("0. Setup", setupScenario);
      addBtn("1. GC (<label>)", runStage1GcLabel);
      addBtn("2. list=null + GC", runStage2DropListAndGc);
      addBtn("3. appendChild (Invalida)", runStage3MutateAndInvalidate);
      addBtn("Rodar Tudo em Sequencia", runAllSequential);

      if (document.body && out) {
        document.body.insertBefore(controlsDiv, out);
      }

      runAllSequential();
    })();
  </script>
</body>
</html>
