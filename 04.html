<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
/* Estilos simplificados e compatíveis com seletores legados */
*:read-only {
    -webkit-user-modify: read-write-plaintext-only;
    caret-color: auto;
    position: fixed;
}
</style>
<script>
function f1() {
    var x6 = document.getElementById("x9");
    var x29 = document.getElementById("x29");
    try {
        if (x29 && x6) x29.before(x6);
    } catch (e) { }
    
    try { 
        document.execCommand("undo", false, null); 
    } catch (e) { }
}

function f4() {
    try { document.onreadystatechange = null; } catch (e) { }
    try { document.execCommand("forwardDelete", false, null); } catch (e) { }
    try { document.execCommand("selectAll", false, null); } catch (e) { }
    
    // Fallback síncrono para garantir o encadeamento caso o toBlob falhe no motor antigo
    try {
        var canvas = document.getElementById("x20");
        if (canvas && typeof canvas.toBlob === "function") {
            canvas.toBlob(f1);
        } else {
            f1();
        }
    } catch (e) {
        f1();
    }
    
    try { document.execCommand("insertText", false, " "); } catch (e) { }
}

function main() {
    try { 
        document.execCommand("redo", false, null); 
    } catch (e) { }
    
    // Dispara o fluxo de teste após o carregamento inicial da árvore
    setTimeout(f4, 100);
}
</script>
</head>
<body onload="main()">
    <img id="x6" align="left" src="x">
    <link id="x29" href="">
    <template id="x9"></template>
    
    <cite id="x5" dir="rtl"></cite>
    
    <h3 id="x10">
        <!-- Removidos atributos modernos como loading="lazy" e importance -->
        <iframe id="x27" align="left" src="about:blank" marginwidth="0"></iframe>
        <canvas id="x20" width="50" height="50"></canvas>
    </h3>
    
    <pre id="x1">
        <details open></details>
    </pre>
</body>
</html>
