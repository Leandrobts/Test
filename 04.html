<!DOCTYPE html>
<html>
<body>
  <input id="outerInput">
  <!-- Passo 3: O script interno do iframe executa e armazena a referência do input interno em parent.innerInput -->
  <iframe tabindex="0" srcdoc="<input tabindex='0'><script>parent.innerInput = document.querySelector('input');</script>"></iframe>
</body>
</html>
