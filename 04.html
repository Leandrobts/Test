<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 Input Type Lifecycle Test</title>
</head>

<body>

<input id="input"
       type="text"
       autocomplete="username"
       value="test">

<script>
(function () {
    var input = document.getElementById("input");

    /*
     * ORIGINAL:
     *
     * internals.setAutofillButtonType(input, 'Credentials');
     * const shadowRoot = internals.shadowRoot(input);
     * const autoFillButton =
     *     shadowRoot.querySelector(
     *         '-webkit-credentials-auto-fill-button'
     *     );
     *
     * PS4 REPLACEMENT:
     *
     * JavaScript cannot create or access the internal
     * AutoFillButtonElement, so create a normal associated
     * button as the closest externally controllable substitute.
     */

    var container = document.createElement("span");
    container.id = "replacement-container";

    var replacementButton = document.createElement("button");
    replacementButton.id = "replacement-autofill-button";
    replacementButton.type = "button";
    replacementButton.textContent = "Activate";

    input.parentNode.insertBefore(container, input.nextSibling);
    container.appendChild(replacementButton);

    /*
     * ORIGINAL TEST:
     *
     * input.addEventListener('click', () => {
     *     input.type = 'button';
     *
     *     if (window.GCController)
     *         GCController.collect();
     * }, { once: true });
     *
     * Keep the important state transition:
     * text/password-like input -> button.
     */

    input.addEventListener("click", function () {
        input.type = "button";
    }, false);

    /*
     * In the original test, UIHelper.activateElement()
     * activates the internal AutoFillButtonElement and
     * causes the relevant click path.
     *
     * For the PS4 replacement, the associated button
     * explicitly dispatches the corresponding event
     * toward the input.
     */

    replacementButton.addEventListener("click", function () {

        /*
         * Dispatch a real click through the input's
         * normal DOM event machinery.
         */
        var event;

        try {
            event = new MouseEvent("click", {
                bubbles: true,
                cancelable: true,
                view: window
            });
        } catch (e) {
            event = document.createEvent("MouseEvents");
            event.initMouseEvent(
                "click",
                true,
                true,
                window,
                1,
                0, 0,
                0, 0,
                false,
                false,
                false,
                false,
                0,
                null
            );
        }

        input.dispatchEvent(event);

        /*
         * Continue after the input type transition.
         *
         * This is intentionally after dispatchEvent(),
         * so the event lifecycle has completed.
         */
        if (container.parentNode)
            container.parentNode.removeChild(container);

    }, false);

    /*
     * Automatically execute the equivalent activation
     * once the document is ready.
     *
     * A user click can also be used if the PS4 browser
     * behaves differently with synthetic events.
     */

    setTimeout(function () {
        replacementButton.click();
    }, 100);

})();
</script>

</body>
</html>
