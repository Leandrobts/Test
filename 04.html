<!DOCTYPE html>
<html>
<body>
<pre id="out"></pre>
<script>
(async function(){
var out=[];
function log(s){out.push(s);}

try{
var blob=new Blob(["WebKit PS4 test"],{type:"text/plain"});
log("Blob: "+blob.size);
var form=new FormData();
form.append("file",blob,"test.txt");
log("FormData append: "+form.has("file"));

var response=new Response(blob);
log("Response: "+response.status);

var text=await response.text();
log("Response.text(): "+text);

var response2=new Response(blob);
var stream=response2.body;
log("Response.body: "+typeof stream);
log("ReadableStream.getReader: "+typeof stream.getReader);

var reader=stream.getReader();
var result=await reader.read();
log("Stream read: "+result.value.length+" bytes");
log("Stream done: "+result.done);

}catch(e){
log("ERROR: "+e.name+": "+e.message);
}

document.getElementById("out").textContent=out.join("\n");
})();
</script>
</body>
</html>
