<!DOCTYPE html>
<p>This test passes if it does not crash.</p>
<script>
 
  let face = new FontFace('MyTestFam', 'local(Helvetica)');  
  face.loaded.catch(() => {});
  document.fonts.add(face);

  let context = document.createElement('canvas').getContext('2d');

  context.save();
  context.lineWidth = 0.5;

  context.font = '10px MyTestFam';

  let reentered = false;
  Object.defineProperty(FontFace.prototype, 'then', {
    configurable: true,
    get() {
      if (reentered)
        return undefined;      
      reentered = true; 
      for (let i = 0; i < 25; i++) {
        context.save();
        context.lineWidth = 1 + i;
      }
      reentered = false;     
      return function(resolve) {
        if (typeof resolve === 'function') resolve();
      };
    }
  });

  context.measureText('a');
  
  setTimeout(() => {
  }, 200);
</script>
