<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>blur-window-with-focus-in-shadow-tree-crash - PS4</title>
</head>
<body>
<p>This test passes if it does not crash.</p>
<div id="host"></div>
<div id="result"></div>
<button id="run">Run test</button>

<script src="resources/gc.js"></script>
<script>
var shadowRoot = host.attachShadow({ mode: 'open' });
var victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable';
shadowRoot.appendChild(victim);
victim.focus();

document.addEventListener('blur', function() {
    victim.remove();
    victim = null;
    gc();
}, true);

function runTest() {
    result.textContent = 'Waiting for window blur...';
}

document.getElementById('run').onclick = runTest;
</script>
</body>
</html>
