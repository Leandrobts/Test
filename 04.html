<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
var ctx = null;
var inGetter = false;

Object.defineProperty(FontFace.prototype, "then", {
  configurable: true,
  get: function () {
    if (inGetter || !ctx) return undefined;
    inGetter = true;
    for (var i = 0; i < 16; i++) {
      try { ctx.measureText("q" + String.fromCharCode(65 + i) + "z"); } catch (e) {}
      try { ctx.measureText("x"); } catch (e) {}
    }
    inGetter = false;
    return undefined;
  }
});

function attempt(n) {
  for (var d = 0; d < 3; d++)
    new FontFace("Dummy" + n + "_" + d, "local(Helvetica), local(Helvetica)");

  var family = "VarFam" + n;
  var face = new FontFace(family, "local(Helvetica), local(Helvetica)");
  void face.loaded;
  document.fonts.add(face);

  var canvas = document.createElement("canvas");
  canvas.width = 10;
  canvas.height = 10;
  ctx = canvas.getContext("2d");
  ctx.font = "20px Helvetica, Arial, " + family;

  for (var i = 0; i < 50; i++)
    ctx.measureText("x");

  ctx.measureText("\uE005");
}

window.onload = function () {
  setTimeout(function () {
    for (var n = 0; n < 3; n++) {
      try { attempt(n); } catch (e) {}
    }
  }, 0);
};
</script>
</body>
</html>
