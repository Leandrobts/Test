<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Compatibilidade PS4 - APIs WebKit</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f0f0f0; }
        .result { margin-bottom: 15px; padding: 10px; border-radius: 5px; font-weight: bold; }
        .pass { background-color: #d4edda; color: #155724; }
        .fail { background-color: #f8d7da; color: #721c24; }
        .info { background-color: #e2e3e5; color: #383d41; }
        h1 { color: #333; }
        pre { background: #fff; padding: 10px; border: 1px solid #ccc; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Verificação de Compatibilidade de APIs WebKit</h1>
    <p>Esta página verifica se o navegador suporta as APIs envolvidas no commit <code>eaafed0</code>.</p>
    <div id="output"></div>
    <h2>Informações do User Agent</h2>
    <pre id="ua"></pre>

    <script>
        const output = document.getElementById('output');
        const uaPre = document.getElementById('ua');
        uaPre.textContent = navigator.userAgent;

        function logResult(name, passed, detail = '') {
            const div = document.createElement('div');
            div.className = `result ${passed ? 'pass' : 'fail'}`;
            div.textContent = `${name}: ${passed ? 'SUPORTADO' : 'NÃO SUPORTADO'} ${detail}`;
            output.appendChild(div);
        }

        // 1. Verificar suporte a CSSStyleSheet (construtor)
        let cssStyleSheetSupported = false;
        try {
            new CSSStyleSheet();
            cssStyleSheetSupported = true;
        } catch (e) {}
        logResult('Construtor CSSStyleSheet', cssStyleSheetSupported);

        // 2. Verificar suporte a ShadowRoot.adoptedStyleSheets
        let adoptedStyleSheetsSupported = false;
        if (cssStyleSheetSupported && Element.prototype.attachShadow) {
            try {
                const div = document.createElement('div');
                const shadow = div.attachShadow({ mode: 'open' });
                // Verificar se a propriedade existe no protótipo ou na instância
                if ('adoptedStyleSheets' in shadow) {
                    adoptedStyleSheetsSupported = true;
                }
            } catch (e) {}
        }
        logResult('ShadowRoot.adoptedStyleSheets', adoptedStyleSheetsSupported);

        // 3. Verificar suporte a document.fonts (FontFaceSet)
        const fontsSupported = !!(document.fonts && document.fonts.ready && typeof document.fonts.load === 'function');
        logResult('Document.fonts (FontFaceSet)', fontsSupported);

        // 4. Verificar suporte a attachShadow (necessário para o cenário de teste)
        const shadowDomSupported = !!Element.prototype.attachShadow;
        logResult('Element.attachShadow (Shadow DOM)', shadowDomSupported);

        // Resumo
        const summary = document.createElement('div');
        summary.className = 'info';
        if (cssStyleSheetSupported && adoptedStyleSheetsSupported && fontsSupported && shadowDomSupported) {
            summary.textContent = 'RESUMO: O navegador possui as APIs básicas necessárias. No entanto, a vulnerabilidade de UAF corrigida por este commit é um problema de memória interna do motor e não pode ser detectada por JavaScript no lado da página.';
        } else {
            summary.textContent = 'RESUMO: Faltam APIs essenciais, indicando que a versão do motor WebKit do navegador é muito antiga. Este commit (e a correção de segurança) provavelmente não está incluído.';
        }
        output.appendChild(summary);
    </script>
</body>
</html>
