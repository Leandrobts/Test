<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 WebKit Offset Scanner</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
        }
        h1 {
            color: #00ffcc;
            border-bottom: 1px solid #00ffcc;
            padding-bottom: 10px;
        }
        #log {
            background-color: #1a1a1a;
            padding: 15px;
            border: 1px solid #333;
            border-radius: 5px;
            min-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .highlight { color: #ffeb3b; font-weight: bold; }
        .success { color: #00ff00; font-weight: bold; }
        .error { color: #ff0000; font-weight: bold; }
    </style>
</head>
<body>

    <h1>PS4 WebKit Offset Scanner</h1>
    <p>Scanner de memória para localizar a base do WebKit e calcular o OFFSET_wk_vtable_first_element no PS4.</p>
    
    <div id="log"></div>

    <script type="module">
        import int64 from "./resources/int64.js";
        import { establishPrimitive, currentCarrier } from "./resources/core.js";
        import { installWindowP } from "./resources/mem.js";

        const logElem = document.getElementById("log");
        function log(msg) {
            logElem.innerHTML += msg + "\n";
            logElem.scrollTop = logElem.scrollHeight;
        }

        async function runScanner() {
            try {
                log("Iniciando o exploit core...");
                await establishPrimitive();
                
                let carrier = currentCarrier();
                if (!carrier) {
                    throw new Error("Falha ao obter o carrier do core.js.");
                }

                // Usando { promote: false } como em testes iniciais para evitar crash antes do scan
                let p = installWindowP(carrier, { promote: false });
                log("<span class='success'>Primitivas de leitura/escrita estabelecidas com sucesso.</span>");

                // Criação do elemento textarea para o leak
                let ta = document.createElement("textarea");
                let ta_leak = p.leakval(ta);
                log("Endereço do textarea vazado: 0x" + ta_leak.toString());

                // Lendo o ponteiro da VTable usando o offset 0x10 (PS4)
                let vt_ptr = p.read8(ta_leak.add32(0x10));
                log("Ponteiro da VTable (offset 0x10): 0x" + vt_ptr.toString());

                let vt_addr = p.read8(vt_ptr);
                log("Endereço real da VTable: 0x" + vt_addr.toString());

                // Alinhamento de página (0x4000 é comum para PS4/PS5 userland)
                let search_addr = new int64(vt_addr.low & 0xFFFFC000, vt_addr.hi);
                log("Iniciando scan reverso na memória a partir de: 0x" + search_addr.toString());

                let wk_base = null;
                const PAGE_SIZE = 0x4000;
                const MAX_PAGES = 4000; // Limite de segurança para evitar kernel panic

                for (let i = 0; i < MAX_PAGES; i++) {
                    let header = p.read4(search_addr);
                    // Checa assinatura do ELF:  E L F -> 0x464C457F
                    if (header === 0x464c457f) {
                        wk_base = new int64(search_addr.low, search_addr.hi);
                        break;
                    }
                    search_addr.sub32inplace(PAGE_SIZE);
                }

                if (wk_base) {
                    log("\n<span class='success'>=== BASE DO WEBKIT ENCONTRADA ===</span>");
                    log("libSceNKWebKitBase: <span class='highlight'>0x" + wk_base.toString() + "</span>");
                    
                    // Calcula a diferença entre a base do WebKit e o endereço da VTable
                    let offset_low = (vt_addr.low >>> 0) - (wk_base.low >>> 0);
                    let vt_offset = offset_low >>> 0; 
                    
                    log("\n<span class='highlight'>OFFSET CALCULADO PARA O ARQUIVO DE OFFSETS:</span>");
                    log("OFFSET_wk_vtable_first_element = <span class='highlight'>0x" + vt_offset.toString(16) + "</span>");
                    
                    log("\nAgora você pode substituir as leituras no seu main.js usando este offset e o offset 0x10 do textarea.");
                } else {
                    log("\n<span class='error'>Falha ao encontrar o cabeçalho ELF. A base do WebKit não foi localizada.</span>");
                }

            } catch (e) {
                log("\n<span class='error'>Erro durante a execução: " + e.message + "</span>");
            }
        }

        window.onload = runScanner;
    </script>
</body>
</html>
