<!DOCTYPE html>
<style>
.subject:has(& + :nth-last-child(even)) { background-color: green }
</style>
<div class="subject"><div id="middle"><div id="victim"><span></span></div></div></div>
<p>This test passes if it does not crash.</p>
<script>
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);  
}
document.body.innerHTML =
    "CSS :has(): " +
    (CSS.supports("selector(:has(*))") ? "SUPPORTED" : "NOT SUPPORTED");
let subject = document.querySelector('.subject');
let victim = document.getElementById('victim');

// Populate the match-result cache for `subject`. Matching :has() walks descendants and
// records an AffectedByHasWithBackwardSiblingRelationship style relation targeting `victim`
// (the parent in the :nth-last-child check on <span>).
subject.style.backgroundSize = 'cover';
subject.offsetTop;

// Remove and free the relation target while the cache entry persists.
victim.remove();
victim = null;
gc();

// Mutating the same inline property takes the FullWithMatchResultCache path,
// which previously committed the cached relation pointing to freed memory.
subject.style.backgroundSize = 'contain';
subject.offsetTop;
</script>
