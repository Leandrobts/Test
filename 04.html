<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<title>PS4 WebKit CSS RenderTree Lifecycle V4</title><style>

/* =========================================================
   BASE TREE
   ========================================================= */

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

#root {
    width: 100%;
    min-height: 100%;
    position: relative;
    overflow: visible;
}

.shell {
    position: relative;
    width: 98%;
    margin: 4px auto;
    overflow: hidden;
    contain: layout;
}

.container {
    position: relative;
    width: 96%;
    margin: 6px auto;
    padding: 6px;
    overflow: auto;
    transform: translateZ(0);
}

.wrapper {
    position: relative;
    width: 94%;
    margin: 5px;
    padding: 5px;
    overflow: visible;
}

.layer {
    position: relative;
    width: 92%;
    margin: 4px;
    padding: 4px;
}

.branch {
    position: relative;
    display: block;
    width: 90%;
    margin: 3px;
    padding: 3px;
}

.leaf {
    position: relative;
    display: block;
    width: 85%;
    height: 22px;
    margin: 2px;
    padding: 2px;
}

/* =========================================================
   STRUCTURAL VARIANTS
   ========================================================= */

.scrollNode {
    overflow: auto;
    max-height: 90px;
}

.clipNode {
    overflow: hidden;
}

.transformNode {
    transform: translateX(0) scale(1);
    transform-origin: 0 0;
}

.relativeNode {
    position: relative;
}

.absoluteNode {
    position: absolute;
    left: 1px;
    top: 1px;
}

.floatNode {
    float: left;
    width: 80px;
    height: 20px;
}

.clearNode {
    clear: both;
}

.contentsNode {
    display: block;
}

.columnsNode {
    column-count: 1;
    column-gap: 4px;
}

.verticalNode {
    writing-mode: horizontal-tb;
}

.rtlNode {
    direction: ltr;
}

.flexNode {
    display: block;
}

.gridNode {
    display: block;
}

.hiddenNode {
    visibility: visible;
}

/* =========================================================
   FOCUS STATE
   ========================================================= */

input,
button,
select,
textarea {
    position: relative;
    margin: 4px;
}

input:focus,
button:focus,
select:focus,
textarea:focus {
    outline: auto;
}

.wrapper:focus-within,
.layer:focus-within,
.branch:focus-within {
    position: relative;
}

.container:focus-within {
    overflow: auto;
}

/* =========================================================
   MUTATION STATES
   ========================================================= */

.stateA {
    overflow: visible;
    transform: none;
    writing-mode: horizontal-tb;
    direction: ltr;
    column-count: 1;
}

.stateB {
    overflow: hidden;
    transform: translateX(1px);
    writing-mode: horizontal-tb;
    direction: rtl;
    column-count: 2;
}

.stateC {
    overflow: auto;
    transform: scale(1);
    writing-mode: vertical-lr;
    direction: ltr;
    column-count: 1;
}

/* =========================================================
   FRAME AREAS
   ========================================================= */

.frameHolder {
    position: relative;
    width: 94%;
    height: 190px;
    margin: 8px;
    overflow: auto;
    transform: translateZ(0);
}

iframe {
    display: block;
    width: 92%;
    height: 160px;
    margin: 5px;
    border: 1px solid black;
}

        }
