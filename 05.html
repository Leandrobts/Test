<!DOCTYPE html>
<html>
<body>
<pre id="log"></pre>
<script>
function log(s) {
    document.getElementById("log").textContent += s + "\n";
}

function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { data: new Array(100).join("x") };
        return gcRec(n - 1);
    }

    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

var style = document.createElement("style");
document.head.appendChild(style);

var sheet = style.sheet;

try {
    sheet.insertRule(
        ".outer { color: red; & .nested { color: blue; } }",
        0
    );

    log("1. sheet.cssRules.length = " + sheet.cssRules.length);

    var outer = sheet.cssRules[0];

    log("2. outer.type = " + outer.type);
    log("3. outer.cssText = " + outer.cssText);
    log("4. outer.cssRules = " + (outer.cssRules ? outer.cssRules.length : "undefined"));

    if (!outer.cssRules || !outer.cssRules.length) {
        log("CSS Nesting nao disponivel neste teste.");
    } else {
        var nestedRules = outer.cssRules;
        var nested = nestedRules[0];

        log("5. nested.cssText = " + nested.cssText);
        log("6. parentRule antes = " + nested.parentRule);

        sheet.deleteRule(0);

        log("7. sheet.cssRules.length depois = " + sheet.cssRules.length);
        log("8. parentRule apos delete = " + nested.parentRule);

        outer = null;
        nestedRules = null;

        gc();

        log("9. parentRule apos GC = " + nested.parentRule);
        log("10. parentStyleSheet = " + nested.parentStyleSheet);
    }
} catch (e) {
    log("ERRO: " + e);
}
</script>
</body>
</html>
