<div id="result"></div>
<script>
function gc() {
    function gcRec(n) {
        if (n < 1) return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 40000; i++) gcRec(15);
    var junk = [];
    for (var i = 0; i < 200; i++) junk.push(new ArrayBuffer(2 * 1024 * 1024));
}

let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable - aperte Home';
document.body.appendChild(victim);
victim.focus();

victim.addEventListener('blur', function() {
    this.remove();
    victim = null;
    gc();
}, true);

document.addEventListener('blur', function() {
    if (victim) {
        victim.remove();
        victim = null;

    }

result.textContent = 'Aperte Home agora';
