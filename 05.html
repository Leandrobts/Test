<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<pre id="log"></pre>
        <!-- Carrega e inicializa o painel de desenvolvedor Eruda -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
<script>
function runOffscreenCanvasTransferRace() {
            log("[C++] Iniciando OffscreenCanvas TransferControl + Proxy GC Race...");
            const workerCode = `
                onmessage = (e) => {
                    if (e.data && e.data.canvas) {
                        postMessage({ack: true}, [e.data.canvas]);
                    }
                };
            `;
            const url = URL.createObjectURL(new Blob([workerCode], {type: "text/javascript"}));
            
            let count = 0;
            const interval = setInterval(() => {
                const w = new Worker(url);
                const canvas = new OffscreenCanvas(128, 128);
                const transferred = canvas.transferToImageBitmap ? canvas.transferToImageBitmap() : canvas;
                
                try {
                    w.postMessage({canvas: transferred}, [transferred]);
                } catch(e) {}
                
                setTimeout(() => {
                    w.terminate();
                }, 7 + Math.random() * 13);
                
                count++;
                if (count % 65 === 0) log(`OffscreenCanvas races: ${count}`);
                if (count > 800) {
                    clearInterval(interval);
                    log("Teste 4 finalizado.");
                }
            }, 13);
}
</script>
</body>
</html>
