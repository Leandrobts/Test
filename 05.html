<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>RVFC target</title>
</head>

<body>

<video
    id="video"
    autoplay
    muted
    playsinline
    loop
    width="320"
    height="240">

    <source src="video.mp4" type="video/mp4">

</video>

<script>

(function () {

    var video = document.getElementById("video");

    function log(message) {

        try {
            console.log(message);
        } catch (e) {
        }

    }

    /*
     * Verificação da API.
     */

    if (typeof video.requestVideoFrameCallback !== "function") {

        log("RVFC unavailable inside iframe");

        try {
            parent.removeTargetFrame();
        } catch (e) {
        }

        return;
    }

    log("RVFC available.");

    /*
     * Registramos vários callbacks.
     *
     * A sequência é propositalmente:
     *
     * callback #1
     * callback #2 -> remove iframe
     * callback #3
     * callback #4
     * callback #5
     * callback #6
     * callback #7
     *
     * Isto segue a lógica estrutural do commit.
     */

    video.requestVideoFrameCallback(function(now, metadata) {

        log("RVFC callback #1");

    });


    video.requestVideoFrameCallback(function(now, metadata) {

        log("RVFC callback #2");

        /*
         * Gatilho principal.
         *
         * Remove o iframe durante a execução de
         * serviceRequestVideoFrameCallbacks().
         */

        try {

            parent.removeTargetFrame();

        } catch (e) {

            log("Error removing frame: " + e);

        }

    });


    video.requestVideoFrameCallback(function(now, metadata) {

        log("RVFC callback #3");

    });


    video.requestVideoFrameCallback(function(now, metadata) {

        log("RVFC callback #4");

    });


    video.requestVideoFrameCallback(function(now, metadata) {

        log("RVFC callback #5");

    });


    video.requestVideoFrameCallback(function(now, metadata) {

        log("RVFC callback #6");

    });


    video.requestVideoFrameCallback(function(now, metadata) {

        log("RVFC callback #7");

    });


    /*
     * Inicia a reprodução.
     *
     * O vídeo deve efetivamente gerar frames para que os
     * VideoFrameCallbacks sejam atendidos.
     */

    var playResult;

    try {

        playResult = video.play();

    } catch (e) {

        log("video.play() threw: " + e);

    }

    if (playResult && typeof playResult.catch === "function") {

        playResult.catch(function(error) {

            log("video.play() failed: " + error);

            /*
             * Sem reprodução não haverá frames/RVFC.
             *
             * Removemos o iframe para evitar que o
             * controlador fique esperando indefinidamente.
             */

            try {
                parent.removeTargetFrame();
            } catch (e) {
            }

        });

    }

})();

</script>

</body>
</html>
