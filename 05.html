<!DOCTYPE html>
<html>
<body>
<p>This test passes if it does not crash.</p>
<div id="host"></div>
<div id="result"></div>
<script>
function gc()
{
    // Force GC.
    if (window.GCController)
        GCController.collect();
    else {
        for (var i = 0; i < 10000; ++i) {
            ({ });
        }
    }
}
function log(msg) {
    var d = document.createElement('div');
    d.textContent = msg;
    result.appendChild(d);
}

let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('input');
victim.type = 'text';
victim.tabIndex = 0;
shadowRoot.appendChild(victim);
victim.focus();

log('[Setup] shadow.activeElement: ' + host.shadowRoot.activeElement?.tagName);

// FinalizationRegistry detecta quando o JS wrapper é realmente coletado
let collected = false;
let registry = new FinalizationRegistry(() => {
    collected = true;
    log('[GC] JSElement wrapper coletado!');
});
registry.register(victim, 'victim-token');

document.addEventListener('blur', function onBlur(e) {
    log('[Blur] target: ' + e.target.tagName);
    log('[Before remove] shadow: ' + (host.shadowRoot.activeElement?.tagName || 'null'));
    victim.remove();
    log('[After remove] shadow: ' + (host.shadowRoot.activeElement?.tagName || 'null'));

    // Pressão máxima de GC: múltiplas rodadas
    victim = null;
    registry = null; // libera o próprio registry
    for (var round = 0; round < 5; round++) {
        gc();
    }
    log('[After gc rounds] collected so far: ' + collected);

    document.removeEventListener('blur', onBlur, true);
}, true);

window.addEventListener('blur', () => log('[Window] blur'));

// Checa após yield do event loop
setTimeout(() => {
    log('[setTimeout] collected: ' + collected);
    log(collected ? 'WRAPPER COLETADO — UAF possivel' : 'WRAPPER VIVO — refcount > 0');
    log('result: PASS (sem crash)');
}, 1000);

document.addEventListener('visibilitychange', () => {
    log('[Visibility] ' + document.visibilityState);
});
</script>
</body>
</html>
