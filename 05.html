<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Teste: Ciclo de vida e descarte de OutOfLine Color Components</title>
</head>
<body>
<canvas id="c" width="100" height="100"></canvas>
<div id="status">Executando teste...</div>

<script>
// Função utilitária de GC via alocação recursiva de memória
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 1000; i++)
        gcRec(10);
}

function runColorDestructionTest() {
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");

    // Cores que forçam a criação de OutOfLineComponents no WebCore
    const extendedColors = [
        "color(display-p3 0.8 0.2 0.5 / 0.9)",
        "lab(50% 40 59.5)",
        "lch(50% 70 300)",
        "color(srgb-linear 0.2 0.7 0.1)"
    ];

    for (let i = 0; i < 2000; i++) {
        const colorStr = extendedColors[i % extendedColors.length];

        // 1. Força o parser do WebCore a instanciar WebCore::Color com OutOfLineComponents
        ctx.fillStyle = colorStr;
        ctx.fillRect(0, 0, 10, 10);

        // 2. Cria elementos temporários para gerar e descartar instâncias de Color
        let el = document.createElement("div");
        el.style.color = colorStr;
        el.style.backgroundColor = `color(display-p3 ${Math.random()} ${Math.random()} 0.5)`;
        
        // 3. Força descarte das instâncias acionando ~Color()
        el = null;

        // 4. Dispara pressão periódica no Garbage Collector
        if (i % 100 === 0) {
            gc();
        }
    }
}

try {
    runColorDestructionTest();
    document.getElementById("status").innerText = "PASS: Cores OutOfLine alocadas, destruídas e coletadas sem falhas.";
} catch (e) {
    document.getElementById("status").innerText = "FAIL: " + e.message;
}
</script>
</body>
</html>
