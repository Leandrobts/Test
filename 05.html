<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 Diag v4 (Fixed Triggers)</title>
<style>
body{background:#111;color:#ddd;font-family:monospace;font-size:13px;padding:6px;margin:0}
h2{color:#8cf;font-size:13px;margin:8px 0 2px;padding:2px 6px;background:#1a2030}
.r{display:flex;justify-content:space-between;padding:2px 6px;border-bottom:1px solid #1c1c1c}
.l{color:#bbb;flex:1;padding-right:8px}
.ok{color:#4e4}
.no{color:#e44}
.wn{color:#ea4}
.in{color:#48e}
.cr{color:#f0f;background:#300;padding:1px 4px;font-weight:bold}
#err{color:#f44;background:#200;padding:4px;margin-bottom:4px;display:none;font-size:12px}
#st{padding:2px 8px;background:#222;border:1px solid #444;display:inline-block;margin-bottom:4px}
button{margin:2px;padding:3px 10px;background:#333;color:#ddd;border:1px solid #555;cursor:pointer}
</style>
</head>

  </script>
<body>
<div id="err"></div>
<div id="st">Pronto</div><br>
<button onclick="runAll()">Executar Testes</button>
<button onclick="clearLS()">Limpar LS (Reset Crash)</button>
<button onclick="location.reload()">Reload</button>
<div id="out"></div>

<script>
// ES5 puro — máxima compatibilidade com PS4 WebKit 605.1.15
window.onerror = function(msg, url, line) {
    var e = document.getElementById('err');
    e.style.display = 'block';
    e.innerHTML = 'ERRO JS linha ' + line + ': ' + msg;
    return true;
};

var OUT = null;
var CUR = null;
var LS = 'ps4d4_';

function setStatus(s) { document.getElementById('st').innerHTML = s; }

function newSection(title) {
    OUT = OUT || document.getElementById('out');
    var h = document.createElement('h2');
    h.innerHTML = title;
    OUT.appendChild(h);
    CUR = document.createElement('div');
    OUT.appendChild(CUR);
}

function addRow(label, val, cls) {
    var c = cls || (val === true ? 'ok' : val === false ? 'no' : 'in');
    var d = val === true ? 'SIM' : val === false ? 'NAO' : String(val);
    var r = document.createElement('div');
    r.className = 'r';
    r.innerHTML = '<span class="l">' + label + '</span><span class="' + c + '">' + d + '</span>';
    CUR.appendChild(r);
}

function lsSet(k, v) { try { localStorage.setItem(LS+k, v); } catch(e) {} }
function lsGet(k)    { try { return localStorage.getItem(LS+k); } catch(e) { return null; } }
function lsDel(k)    { try { localStorage.removeItem(LS+k); } catch(e) {} }

function clearLS() {
    try {
        var keys = [];
        for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.indexOf(LS) === 0) keys.push(k);
        }
        for (var j = 0; j < keys.length; j++) localStorage.removeItem(keys[j]);
    } catch(e) {}
    setStatus('LS limpo');
}

function cleanGetter() {
    try {
        Object.defineProperty(FontFace.prototype, 'then', {
            configurable: true, writable: true, value: undefined
        });
    } catch(e) {}
}

// Cria canvas e face frescos, MAS NÃO dispara o carregamento ainda
function makeCtxAndFace(familyName, src) {
    var c = document.createElement('canvas');
    c.width = 64; c.height = 64;
    var ctx = c.getContext('2d');
    var face = new FontFace(familyName, src || 'local(Helvetica)');
    document.fonts.add(face);
    // O SEGREDO: Não setar ctx.font aqui e não chamar face.loaded.
    // Apenas retornar.
    return { ctx: ctx, face: face, canvas: c, family: familyName };
}

// ============================================================
// A: Gatilho via ctx.font (O Gatilho Real do PS4)
// ============================================================
function sA() {
    newSection('A. Gatilho via ctx.font = ... (O Gatilho Real)');

    if (typeof FontFace === 'undefined') { addRow('FontFace ausente','skip','wn'); return; }

    var prev = lsGet('A_crash');
    if (prev) { addRow('!! CRASH SESSAO ANTERIOR em', prev, 'cr'); lsDel('A_crash'); }

    var actions = [
        { name: 'ctx.save() x8', fn: function(ctx) { for(var i=0;i<8;i++) ctx.save(); } },
        { name: 'ctx.save() x128', fn: function(ctx) { for(var i=0;i<128;i++) ctx.save(); } },
        { name: 'ctx.restore()', fn: function(ctx) { ctx.restore(); } },
        { name: 'document.fonts.add(new FontFace)', fn: function(ctx) { document.fonts.add(new FontFace('GA_'+Date.now(), 'local(Helvetica)')); } },
        { name: 'document.createElement("span")', fn: function(ctx) { document.createElement('span'); } },
        { name: 'document.body.offsetTop (layout)', fn: function(ctx) { void document.body.offsetTop; } },
        { name: 'style.remove() + offsetTop', fn: function(ctx) {
            var st = document.getElementById('_tmpstyle_');
            if (st) { st.parentNode.removeChild(st); }
            void document.body.offsetTop;
        }},
        { name: 'deleteRule(@font-face) + offsetTop', fn: function(ctx) {
            var st = document.getElementById('_rulestyle_');
            if (st && st.sheet && st.sheet.cssRules.length > 0) { st.sheet.deleteRule(0); }
            void document.body.offsetTop;
        }},
        { name: 'measureText() dentro do getter (cria rehash)', fn: function(ctx) {
            for (var i = 0; i < 50; i++) {
                var c = document.createElement('canvas');
                c.getContext('2d').font = '12px sans-serif';
                c.getContext('2d').measureText('a');
            }
        }}
    ];

    var tmpStyle = document.createElement('style');
    tmpStyle.id = '_tmpstyle_';
    tmpStyle.textContent = 'x{}';
    document.head.appendChild(tmpStyle);

    var ruleStyle = document.createElement('style');
    ruleStyle.id = '_rulestyle_';
    ruleStyle.textContent = '@font-face{font-family:_df_;src:local(Helvetica);}';
    document.head.appendChild(ruleStyle);

    for (var i = 0; i < actions.length; i++) {
        var a = actions[i];
        var fired = false, done = false, errMsg = null;

        lsSet('A_crash', a.name); // Salva antes do gatilho

        var env = makeCtxAndFace('FA' + i);

        try {
            Object.defineProperty(FontFace.prototype, 'then', {
                configurable: true,
                get: function() {
                    if (fired) return undefined;
                    fired = true;
                    try { a.fn(env.ctx); done = true; }
                    catch(e) { errMsg = e.message; }
                    return undefined;
                }
            });
            
            // GATILHO: Setar o font e medir
            env.ctx.font = '10px ' + env.family;
            env.ctx.measureText('a');

        } catch(e) {
            addRow(a.name, 'excecao externa: ' + e.message, 'no');
            cleanGetter(); continue;
        }
        cleanGetter();

        if (!fired)       addRow(a.name, 'getter NAO disparou', 'wn');
        else if (errMsg)  addRow(a.name, 'getter OK / acao ERRO: ' + errMsg, 'no');
        else if (!done)   addRow(a.name, 'getter OK / acao incompleta', 'wn');
        else              addRow(a.name, 'getter + acao OK', 'ok');
    }
    lsDel('A_crash');
}

// ============================================================
// B: Gatilho via face.load() explicito
// ============================================================
function sB() {
    newSection('B. Gatilho via face.load() explicito');

    if (typeof FontFace === 'undefined') { addRow('FontFace ausente','skip','wn'); return; }

    var prev = lsGet('B_crash');
    if (prev) { addRow('!! CRASH SESSAO ANTERIOR com N saves', prev, 'cr'); lsDel('B_crash'); }

    var counts = [1, 8, 32, 128, 512];
    for (var i = 0; i < counts.length; i++) {
        var n = counts[i];
        var fired = false, ok = false;

        lsSet('B_crash', 'N=' + n); // Salva antes do gatilho

        var env = makeCtxAndFace('FB' + n);

        try {
            Object.defineProperty(FontFace.prototype, 'then', {
                configurable: true,
                get: function() {
                    if (fired) return undefined;
                    fired = true;
                    for (var j = 0; j < n; j++) env.ctx.save();
                    ok = true;
                    return undefined;
                }
            });
            // GATILHO:
            env.face.load();
        } catch(e) {
            addRow('N=' + n, 'excecao: ' + e.message, 'no');
            cleanGetter(); continue;
        }
        cleanGetter();

        if (!fired) addRow('N=' + n + ' saves', 'getter nao disparou', 'wn');
        else        addRow('N=' + n + ' saves', ok ? 'OK sem crash imediato' : 'save() falhou', ok ? 'ok' : 'no');
    }
    lsDel('B_crash');
    addRow('Resultado', 'se crashou, o LS vai guardar', 'in');
}

// ============================================================
// C: Gatilho via document.fonts.load()
// ============================================================
function sC() {
    newSection('C. Gatilho via document.fonts.load()');

    if (typeof FontFace === 'undefined' || !('fonts' in document)) {
        addRow('APIs ausentes','skip','wn'); return;
    }

    var prev = lsGet('C_crash');
    if (prev) { addRow('!! CRASH SESSAO ANTERIOR em', prev, 'cr'); lsDel('C_crash'); }

    var env = makeCtxAndFace('FC0');
    var fired = false;
    
    lsSet('C_crash', 'document.fonts.load FC0');

    try {
        Object.defineProperty(FontFace.prototype, 'then', {
            configurable: true,
            get: function() {
                if (fired) return undefined;
                fired = true;
                // Ação agressiva
                for(var i=0; i<128; i++) env.ctx.save();
                return undefined;
            }
        });
        
        // GATILHO:
        document.fonts.load('10px FC0', 'a');
        
    } catch(e) {
        addRow('document.fonts.load', 'excecao: ' + e.message, 'no');
        cleanGetter(); return;
    }
    cleanGetter();
    addRow('document.fonts.load FC0', fired ? 'GETTER DISPAROU' : 'nao disparou', fired ? 'ok' : 'wn');
    lsDel('C_crash');
}

// ============================================================
// D: CSS @font-face (sem JS FontFace)
// ============================================================
function sD() {
    newSection('D. CSS @font-face — gatilho via canvas');

    if (typeof FontFace === 'undefined') { addRow('FontFace ausente','skip','wn'); return; }

    var prev = lsGet('D_crash');
    if (prev) { addRow('!! CRASH SESSAO ANTERIOR', prev, 'cr'); lsDel('D_crash'); }

    // Injeta CSS @font-face
    var cssStyle = document.createElement('style');
    cssStyle.id = '_cssff_';
    cssStyle.textContent = '@font-face{font-family:CSSFont;src:local(Helvetica);}';
    document.head.appendChild(cssStyle);

    var c = document.createElement('canvas');
    var ctx = c.getContext('2d');
    var fired = false;

    lsSet('D_crash', 'CSS @font-face + ctx.font');

    try {
        Object.defineProperty(FontFace.prototype, 'then', {
            configurable: true,
            get: function() {
                if (fired) return undefined;
                fired = true;
                for(var i=0; i<128; i++) ctx.save();
                return undefined;
            }
        });

        // GATILHO: setar o font da CSS e medir
        ctx.font = '10px CSSFont';
        ctx.measureText('a');

    } catch(e) {
        addRow('CSS @font-face', 'excecao: ' + e.message, 'no');
        cleanGetter(); return;
    }
    cleanGetter();
    addRow('CSS @font-face + ctx.font', fired ? 'GETTER DISPAROU' : 'nao disparou', fired ? 'ok' : 'wn');
    lsDel('D_crash');
}

// ============================================================
// MAIN
// ============================================================
function runAll() {
    OUT = document.getElementById('out');
    OUT.innerHTML = '';
    setStatus('Rodando...');

    var prevCrash = lsGet('A_crash') || lsGet('B_crash') || lsGet('C_crash') || lsGet('D_crash');
    if (prevCrash) {
        newSection('!! CRASH DETECTADO NA SESSAO ANTERIOR !!');
        addRow('Teste que travou o browser', prevCrash, 'cr');
        clearLS(); // Limpa para o usuário poder rodar de novo
    }

    try { sA(); } catch(e) { if(CUR) addRow('SA ERRO FATAL',''+e,'no'); }
    try { sB(); } catch(e) { if(CUR) addRow('SB ERRO FATAL',''+e,'no'); }
    try { sC(); } catch(e) { if(CUR) addRow('SC ERRO FATAL',''+e,'no'); }
    try { sD(); } catch(e) { if(CUR) addRow('SD ERRO FATAL',''+e,'no'); }

    setStatus('Concluido');
}

setTimeout(function() { runAll(); }, 300);
</script>
</body>
</html>
