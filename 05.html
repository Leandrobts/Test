<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
</head>
<body>
<pre id="log"></pre>
<script>
function log(message)
{
    document.getElementById('log').textContent += message + '\n';
    console.log(message);
}

// Touch document.fonts antes do load event para marcar FontFaceSet como document-loaded
document.fonts;

function run()
{
    const host = document.createElement("div");
    document.body.appendChild(host);
    const shadowRoot = host.attachShadow({ mode: "open" });

    const fontFaceStyle = document.createElement("style");
    fontFaceStyle.textContent = `@font-face { font-family: reentryFont; src: url("resources/no-such-font-for-reentry.otf"); }`
        + `.probe { font: 24px reentryFont; }`;
    shadowRoot.appendChild(fontFaceStyle);

    const probe = document.createElement("span");
    probe.className = "probe";
    probe.textContent = "A";
    shadowRoot.appendChild(probe);

    document.body.offsetHeight; // Força layout para iniciar o carregamento[span_5](start_span)[span_5](end_span)
    document.fonts.load("24px reentryFont", "A");
    log("document.fonts.status: " + document.fonts.status);

    // Materializa a promessa ready[span_6](start_span)[span_6](end_span)
    document.fonts.ready;

    // Prepend cria o estado pendente UpdateType::ActiveSet que força o caminho Reset[span_7](start_span)[span_7](end_span)
    const prependedStyle = document.createElement("style");
    prependedStyle.textContent = ".unused { color: red; }";
    shadowRoot.prepend(prependedStyle);

    let getterCallCount = 0;
    Object.defineProperty(FontFaceSet.prototype, "then", {
        configurable: true,
        get() {
            delete FontFaceSet.prototype.then;
            ++getterCallCount;
            log('>>> GETTER DISPAROU! count=' + getterCallCount);
            log('    status no momento: ' + document.fonts.status);
            host.remove(); // Libera o nó iterado em m_inDocumentShadowRoots[span_8](start_span)[span_8](end_span)
            log('    apos host.remove()');
            return undefined;
        }
    });

    log('Iniciando flush síncrono...');
    
    // O GATILHO CRÍTICO DO COMMIT ORIGINAL:
    // Acessar styleSheets.length força Scope::flushPendingDescendantUpdates() de forma síncrona[span_9](start_span)[span_9](end_span)
    document.styleSheets.length; 

    log("FontFaceSet.prototype.then getter calls: " + getterCallCount);
    log("PASS if no crash.");
}

window.addEventListener("load", () => setTimeout(run, 0));
</script>
</body>
</html>
