<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>PS4 WebKit SVG Compatibility</title>
<style>body{background:#151923;color:#eee;font:15px monospace;padding:16px}pre{white-space:pre-wrap;word-wrap:break-word}button{padding:10px}</style></head>
<body><h2>PS4 WebKit SVG - Compatibilidade commit 777fe150</h2>
<p>Diagnostico nao destrutivo. Nao tenta provocar falhas de memoria.</p>
<button onclick="runTests()">Executar novamente</button>
<pre id="out">Aguardando...</pre>
<script>
function runTests(){
var out=document.getElementById('out');out.textContent='';
function log(k,v){out.appendChild(document.createTextNode(k+': '+v+'\n'));}
function test(k,fn){try{log(k,fn());}catch(e){log(k,'ERRO '+e.name+': '+e.message);}}
var ns='http://www.w3.org/2000/svg',svg,animated,base,clip;
test('User agent',function(){return navigator.userAgent;});
test('createElementNS svg',function(){svg=document.createElementNS(ns,'svg');return svg.namespaceURI+' / '+svg.nodeName;});
test('svg.width / SVGAnimatedLength',function(){animated=svg.width;return animated?'presente, tipo='+typeof animated:'ausente';});
test('SVGAnimatedLength.baseVal',function(){base=animated&&animated.baseVal;return base?'presente, value='+base.value:'ausente';});
test('SVGLength.value setter',function(){if(!base)return 'indisponivel';var old=base.value;base.value=old;return 'suportado, valor='+base.value;});
test('SVGLength.valueAsString',function(){return base&&typeof base.valueAsString!=='undefined'?base.valueAsString:'indisponivel';});
test('SVGLength.newValueSpecifiedUnits',function(){return base?typeof base.newValueSpecifiedUnits:'indisponivel';});
test('SVGAnimatedLength.animVal',function(){return animated&&animated.animVal?'presente':'indisponivel';});
test('clipPath via createElementNS',function(){clip=document.createElementNS(ns,'clipPath');return clip.localName;});
test('Node.append (moderno)',function(){return typeof svg.append;});
test('Node.appendChild (antigo)',function(){return typeof svg.appendChild;});
test('clipPath.append (moderno)',function(){return typeof clip.append;});
test('clipPath.appendChild (antigo)',function(){return typeof clip.appendChild;});
test('appendChild de clipPath',function(){svg.appendChild(clip);return clip.parentNode===svg?'OK':'falhou';});
test('append de texto equivalente antigo',function(){var t=document.createTextNode('');clip.appendChild(t);return t.parentNode===clip?'OK':'falhou';});
test('Promise',function(){return typeof window.Promise;});
test('queueMicrotask',function(){return typeof window.queueMicrotask;});
test('MutationObserver',function(){return typeof window.MutationObserver;});
test('internals.observeGC',function(){return window.internals?typeof window.internals.observeGC:'internals indisponivel';});
test('GCController.collect',function(){return window.GCController?typeof window.GCController.collect:'GCController indisponivel';});
test('window.gc',function(){return typeof window.gc;});
test('document.body.innerHTML',function(){return typeof document.body.innerHTML;});
test('SVGElement constructor',function(){return typeof window.SVGElement;});
test('SVGAnimatedLength constructor',function(){return typeof window.SVGAnimatedLength;});
test('SVGLength constructor',function(){return typeof window.SVGLength;});
test('SVGClipPathElement constructor',function(){return typeof window.SVGClipPathElement;});
test('SVG tear-off identity',function(){return svg.width===svg.width?'mesmo wrapper':'wrappers diferentes';});
test('SVG baseVal identity',function(){return svg.width.baseVal===svg.width.baseVal?'mesmo objeto':'objetos diferentes';});
test('SVG attribute synchronization',function(){svg.setAttribute('width','123');return 'attribute='+svg.getAttribute('width')+', baseVal='+svg.width.baseVal.value;});
test('SVG baseVal to attribute synchronization',function(){svg.width.baseVal.value=124;return 'attribute='+svg.getAttribute('width')+', baseVal='+svg.width.baseVal.value;});
test('Detached SVG baseVal (sem GC forçado)',function(){var detached=document.createElementNS(ns,'svg');var length=detached.width.baseVal;length.value=42;return length.value;});
log('Observacao','commitPropertyChange e commitChange sao funcoes C++ internas; nao sao APIs JavaScript.');
log('Resultado','Compatibilidade nao comprova nem descarta Use-After-Free.');
}
if(window.addEventListener)window.addEventListener('load',runTests,false);
else window.onload=runTests;
</script></body></html>
