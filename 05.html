<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script>
function runTest()
{   

    var context = new webkitAudioContext();
    var frame = document.createElement("iframe");
    frame.src = "resources/mediaelementsource-clear-detached-frame-iframe.html";
    frame.onload = function() {
        var audio = frame.contentDocument.querySelector("audio");
        var source = context.createMediaElementSource(audio);
        source.connect(context.destination);       

        try {
            var promise = audio.play();

            if (promise && promise.catch)
                promise.catch(function() { });

        } catch (e) {
        }

        setTimeout(function() {
 
            if (frame.parentNode)
                frame.parentNode.removeChild(frame);            
            setTimeout(function() {

                document.body.innerHTML +=
                    "<p>PASS: Did not crash after detaching iframe whose audio element was connected to a MediaElementAudioSourceNode.</p>";

            }, 100);

        }, 200);
    };

    document.body.appendChild(frame);
}

</script>

</head>

<body onload="runTest()">

<p>
Test that removing an iframe whose audio element is connected as a
MediaElementAudioSourceNode does not crash.
</p>

</body>
</html>
