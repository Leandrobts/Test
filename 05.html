<!DOCTYPE html>
<html>
<body>

<p>This test passes if it does not crash.</p>

<div id="host"></div>
<div id="result"></div>

<div id="trigger"
     style="display:inline-block;
            padding:15px;
            border:2px solid black;
            margin-top:10px;">
    CLICK HERE TO TRIGGER
</div>

<script>

function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};

        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";

        gcRec(n - 1);
    }

    for (var i = 0; i < 10000; i++)
        gcRec(10);
}


let shadowRoot = host.attachShadow({ mode: 'open' });

let victim = document.createElement('div');

victim.tabIndex = 0;
victim.textContent = 'Focusable';

shadowRoot.appendChild(victim);

victim.focus();


async function runTest() {

    document.addEventListener('blur', () => {

        victim.remove();

        victim = null;

        gc();

    }, true);


    /*
     * Original:
     *
     * await UIHelper.setWindowIsKey(false);
     *
     * PS4 replacement:
     *
     * Wait for the real focus transition produced
     * by clicking the trigger.
     */

    await new Promise((resolve) => {

        trigger.addEventListener('click', resolve, {
            once: true
        });

    });


    await new Promise((resolve) => {

        requestAnimationFrame(() => {
            setTimeout(resolve, 0);
        });

    });


    result.textContent = 'PASS';
}


runTest();

</script>

</body>
</html>
