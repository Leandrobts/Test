<!DOCTYPE html>
<html>
<body>
<pre id="out"></pre>
<script>
var names=[
"indexedDB",
"webkitIndexedDB",
"IDBFactory",
"IDBDatabase",
"IDBObjectStore",
"IDBTransaction"
];

var out=[];
for(var i=0;i<names.length;i++){
    out.push(names[i]+": "+typeof window[names[i]]);
}
document.getElementById("out").textContent=out.join("\n");
</script>
</body>
</html>
