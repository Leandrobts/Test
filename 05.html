
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FetchBodyConsumer UAF Test</title>
</head>
<body>
<pre id="log">Running test...</pre>
<script>
var output=[];

function log(message){
    output.push(message);
    document.getElementById("log").textContent=output.join("\n");
}

function promise_test(callback,description){
    log("TEST: "+description);

    Promise.resolve().then(callback).then(function(){
        log("PASS: "+description);
    }).catch(function(error){
        log("FAIL: "+error);
        if(error && error.stack)
            log(error.stack);
    });
}

promise_test(async () => {
    function createReadStream() {
        const response = new Response(new Blob(['aaaaa']));
        return response.body;
    }

    const f = document.body.appendChild(document.createElement('iframe'));
    const response = new f.contentWindow.Response(createReadStream());

    f.contentWindow.Object.prototype.__defineGetter__('then', () => {
        delete f.contentWindow.Object.prototype.then;

        f.remove();
    });

    response.blob();

    await new Promise(resolve => setTimeout(resolve, 50));
}, "Ensure redefining then does not alter blob promise");
</script>
</body>
</html>
