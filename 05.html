<!DOCTYPE html>
<html>
<body>
<canvas id="primerCanvas" style="display:none" width="1" height="1"></canvas>
<canvas id="testCanvas" style="display:none" width="400" height="400"></canvas>
<script>
function finish(message)
{
    document.body.appendChild(document.createTextNode(message));
}

const primerOffscreen = document.getElementById('primerCanvas').transferControlToOffscreen();
const testOffscreen   = document.getElementById('testCanvas').transferControlToOffscreen();

const worker = new Worker('resources/fallback-walk-prune-worker.js');
worker.onmessage = function (event) { finish("PASS if no crash, faces " + event.data); };
worker.onerror   = function (event) { finish("FAIL: worker error: " + event.message); };

worker.postMessage(
    { primerCanvas: primerOffscreen, testCanvas: testOffscreen },
    [ primerOffscreen, testOffscreen ]   // transferables — ownership passa pro worker
);
</script>
</body>
</html>
