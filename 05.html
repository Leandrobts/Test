<html>
<body><button id="run">Run Test</button>
<div id="status">Iframe ready</div>
<iframe id="testFrame" width="100" height="100"></iframe>
<script>
var iframe = document.getElementById("testFrame");
var popup = null;
var focusTimer = null;

iframe.onload = function() {
    var doc = iframe.contentDocument;
    doc.open();
    doc.write(
        '<!DOCTYPE html>' +
        '<html>' +
        '<body>' +
        '<h3>Iframe</h3>' +
        '<div id="target" style="width:200px;height:150px;background:red"></div>' +
        '</body>' +
        '</html>'
    );
    doc.close();
};

document.getElementById("run").onclick = function() {
    var status = document.getElementById("status");

    popup = window.open(
        "",
        "_blank",
        "width=400,height=300"
    );

    popup.document.open();
    popup.document.write(
        '<!DOCTYPE html>' +
        '<html>' +
        '<body>' +
        '<h3>Popup</h3>' +
        '<p>Focus target</p>' +
        '</body>' +
        '</html>'
    );
    popup.focus();
    popup.document.close();

    setTimeout(function() {
        if (!popup || popup.closed)
            return;        
        window.focus();            
        iframe.contentWindow.focus();            

        setTimeout(function() {
              if (popup && !popup.closed) {
                  popup.close();
              }
              focusTimer = setInterval(function() {
                  if (!popup || popup.closed) {
                     clearInterval(focusTimer);
                     iframe.remove();                          
                  }
               }, 20);
         }, 300);
    }, 300);
};

window.onblur = function() {
    document.getElementById("status").innerHTML = "MAIN PAGE BLUR";
};

window.onfocus = function() {
    document.getElementById("status").innerHTML = "MAIN PAGE FOCUS";
};
</script></body>
</html>
