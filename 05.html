<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 Filter Chain Test (05)</title>
</head>
<body>
<p>This test passes if WebKit does not crash.</p>
<button id="runTest" type="button">Executar teste Filter Chain (05)</button>
<div id="status">Aguardando clique...</div>

<svg id="svgStage" width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="chainFilter" x="-0.5" y="-0.5" width="2" height="2">
      <!-- FEComposite 1 (arithmetic) -->
      <feComposite id="comp1" in="SourceGraphic" in2="SourceAlpha" operator="arithmetic"
                   k1="-86242.08364529378" k2="-0.0000015329670121806829"
                   k3="8.407790785948902e-44" k4="-8.633401098587574e-14"
                   result="comp1Out" />

      <!-- FEFlood -->
      <feFlood id="flood1" flood-color="#0080ff" flood-opacity="0.5" result="floodOut" />

      <!-- FEComposite 2 (arithmetic) -->
      <feComposite id="comp2" in="floodOut" in2="comp1Out" operator="arithmetic"
                   k1="-66822039598.69408" k2="-1.175494351e-38"
                   k3="1.0369608636003646e-43" k4="4.344025239406933e-44"
                   result="comp2Out" />

      <!-- FEMerge -->
      <feMerge id="merge1" result="mergeOut">
        <feMergeNode in="SourceGraphic" />
        <feMergeNode in="comp2Out" />
      </feMerge>

      <!-- FEConvolveMatrix -->
      <feConvolveMatrix id="conv1" in="mergeOut" order="3 3"
                        kernelMatrix="0 -1 0 -1 5 -1 0 -1 0"
                        divisor="653.8013334138727"
                        bias="-1.17549421e-38"
                        targetX="1" targetY="1"
                        edgeMode="none"
                        kernelUnitLength="1.789584885814042e-10 1.7656360650492695e-43"
                        preserveAlpha="false" />
    </filter>
  </defs>

  <rect id="targetRect" x="10" y="10" width="100" height="100" fill="#22aa66" filter="url(#chainFilter)" />
</svg>

<canvas id="outCanvas" width="120" height="120"></canvas>

<script>
(function(){'use strict';if(window.__PS4_DEBUG_ACTIVE__)return;window.__PS4_DEBUG_ACTIVE__=true;var MAX_LOGS=150,count=0,errors=0,panel,output,header,queue=[],busy=false;function stringify(v){if(v===null)return'null';if(typeof v==='undefined')return'undefined';if(v instanceof Error)return v.message+(v.stack?'\n'+v.stack:'');if(typeof v==='object'){try{return JSON.stringify(v)}catch(e){return'[Objeto nao serializavel]'}}return String(v)}function log(t,m,c){if(busy)return;var e={type:t,message:stringify(m),color:c||'#ff6666'};if(!output){queue.push(e);return}busy=true;try{var l=document.createElement('div');l.style.cssText='padding:3px 0;border-bottom:1px solid #333;white-space:pre-wrap;word-break:break-all;color:'+e.color;l.textContent='['+(++count)+'] ['+t+'] '+e.message;output.appendChild(l);while(output.childNodes.length>MAX_LOGS)output.removeChild(output.firstChild);output.scrollTop=output.scrollHeight;if(/ERROR|FAIL|HTTP|PROMISE|MEDIA/.test(t)){errors++;if(header)header.textContent='PS4 DEBUG | Erros: '+errors+' | Logs: '+count}}catch(x){}busy=false}function init(){if(panel||!document.body)return;panel=document.createElement('div');panel.style.cssText='position:fixed;bottom:0;left:0;width:100%;height:230px;background:rgba(0,0,0,.94);color:white;z-index:2147483647;font:11px monospace;border-top:2px solid red;box-sizing:border-box;';header=document.createElement('div');header.textContent='PS4 DEBUG';header.style.cssText='background:#222;color:#00ff88;padding:7px;font-weight:bold;';var b=document.createElement('button');b.textContent='OCULTAR';b.style.cssText='float:right;background:#444;color:white;border:0;padding:5px;margin:2px;';output=document.createElement('div');output.style.cssText='height:195px;overflow:auto;padding:5px;box-sizing:border-box;';var h=false;b.onclick=function(){h=!h;output.style.display=h?'none':'block';panel.style.height=h?'32px':'230px';b.textContent=h?'ABRIR':'OCULTAR'};panel.appendChild(b);panel.appendChild(header);panel.appendChild(output);document.body.appendChild(panel);while(queue.length){var q=queue.shift();log(q.type,q.message,q.color)}log('SYSTEM','Debug PS4 iniciado','#00ff88')}if(document.body)init();else document.addEventListener('DOMContentLoaded',init);var oldOnError=window.onerror;window.onerror=function(m,s,l,c,e){var d=m+'\n'+(s||'desconhecido')+':'+l+':'+c;if(e&&e.stack)d+='\nSTACK:\n'+e.stack;log('JS ERROR',d);if(typeof oldOnError==='function')return oldOnError.apply(this,arguments);return false};window.addEventListener('error',function(e){var t=e.target;if(!t||t===window)return;var n=t.tagName||'UNKNOWN',u=t.currentSrc||t.src||t.href||'URL desconhecida',m=n+': '+u;if(t.error){m+='\nCodigo: '+t.error.code;m+='\nMensagem: '+(t.error.message||'indisponivel')}log(n==='VIDEO'||n==='AUDIO'?'MEDIA ERROR':'RESOURCE FAIL',m,'#ffaa00')},true);window.addEventListener('unhandledrejection',function(e){log('PROMISE',stringify(e.reason))});var methods=['log','warn','error','info','debug'];for(var i=0;i<methods.length;i++)(function(m){if(!window.console)return;var o=console[m];if(typeof o!=='function')return;console[m]=function(){var p=[];for(var j=0;j<arguments.length;j++)p.push(stringify(arguments[j]));log('CONSOLE '+m.toUpperCase(),p.join(' '),m==='error'?'#ff5555':m==='warn'?'#ffaa00':'#dddddd');try{return o.apply(console,arguments)}catch(e){}}})(methods[i]);window.PS4Debug={log:function(m){log('MANUAL',m,'#00ffff')},clear:function(){if(output)output.innerHTML='';count=0;errors=0;if(header)header.textContent='PS4 DEBUG'},show:function(){if(panel)panel.style.display='block'},hide:function(){if(panel)panel.style.display='none'}}})();

(function() {
  var btn = document.getElementById('runTest');
  var statusEl = document.getElementById('status');

  btn.addEventListener('click', function() {
    try {
      statusEl.textContent = 'Executando...';
      window.PS4Debug.log('Iniciando teste 05 (SVG Filter Chain)');

      var rect = document.getElementById('targetRect');
      var comp1 = document.getElementById('comp1');
      var flood1 = document.getElementById('flood1');
      var comp2 = document.getElementById('comp2');
      var conv1 = document.getElementById('conv1');

      if (!rect || !comp1 || !flood1 || !comp2 || !conv1) {
        throw new Error('Elementos do filtro nao encontrados');
      }

      // Variacao controlada de atributos apos o clique
      flood1.setAttribute('flood-opacity', '-2.4559581509165345e-24');
      comp1.setAttribute('k2', '-0.000005');
      comp2.setAttribute('k1', '-123456.789');
      conv1.setAttribute('kernelMatrix', '1 0 -1 2 0 -2 1 0 -1');

      var bbox = rect.getBBox();
      var crect = rect.getBoundingClientRect();

      var canvas = document.getElementById('outCanvas');
      if (canvas && typeof canvas.getContext === 'function') {
        var ctx = canvas.getContext('2d');
        if (ctx) {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#1b1b1b';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
      }

      window.PS4Debug.log('Concluido 05. bbox=' + JSON.stringify(bbox) + ' w=' + crect.width);
      statusEl.textContent = 'Concluido sem excecoes no JS.';
    } catch (err) {
      statusEl.textContent = 'Erro: ' + err.message;
      window.PS4Debug.log('Falha no teste 05: ' + (err && err.stack ? err.stack : err));
    }
  });
})();
</script>
</body>
</html>
