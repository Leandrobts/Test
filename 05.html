<!DOCTYPE html>
<html>
<body>
<h2>Teste de Estresse Síncrono - Event Dispatcher UAF</h2>
<div id="container">
    <input id="targetInput" type="text" value="Clique ou foque aqui">
</div>
<div id="result">Aguardando interação...</div>

<script>
window.onload = function() {
    const container = document.getElementById('container');
    const input = document.getElementById('targetInput');

    // Ouvinte agressivo que remove o próprio elemento pai no meio do despacho do evento
    input.addEventListener('focus', function(e) {
        try {
            // Destrói a árvore pai imediatamente de forma síncrona durante o evento
            container.innerHTML = '';
            
            // Força acesso a propriedades do objeto que acabou de ser desalocado
            let dummy = e.target.value;
        } catch (err) {
            console.log("Exceção capturada:", err);
        }
    }, true); // Capturing phase para agir antes de qualquer outra coisa

    // Dispara o foco programaticamente ou aguarda o usuário tocar/clicar
    setTimeout(() => {
        try {
            input.focus();
            document.getElementById('result').innerHTML = '<span style="color: green;">Teste executado. Se não travou, a build é resiliente a esta rota.</span>';
        } catch (e) {
            document.getElementById('result').innerHTML = 'Erro ao focar: ' + e.message;
        }
    }, 500);
};
</script>
</body>
</html>
