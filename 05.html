<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 FocusController Blur Lifecycle Test</title>
</head>

<body>

<p id="status">This test passes if it does not crash.</p>

<div id="host"></div>

<!-- Segundo alvo focável usado para provocar a transição de foco -->
<div id="focusTarget" tabindex="0" style="
    width: 1px;
    height: 1px;
    overflow: hidden;
    position: absolute;
    left: -10000px;
    top: -10000px;
"></div>

<div id="result"></div>

<script>
(function () {

    /*
     * GC helper adapted from WebKit's old gc.js helper.
     *
     * This creates allocation pressure but is not equivalent
     * to GCController.collect().
     */
    function gc() {
        function gcRec(n) {
            if (n < 1)
                return {};

            var temp = { i: "ab" + i + (i / 100000) };
            temp += "foo";

            gcRec(n - 1);
        }

        for (var i = 0; i < 10000; i++)
            gcRec(10);
    }

    var host = document.getElementById("host");
    var result = document.getElementById("result");
    var status = document.getElementById("status");
    var focusTarget = document.getElementById("focusTarget");

    /*
     * ORIGINAL:
     *
     * let shadowRoot = host.attachShadow({ mode: 'open' });
     * let victim = document.createElement('div');
     * victim.tabIndex = 0;
     * victim.textContent = 'Focusable';
     * shadowRoot.appendChild(victim);
     * victim.focus();
     */

    var shadowRoot = host.attachShadow({ mode: "open" });

    var victim = document.createElement("div");

    victim.tabIndex = 0;
    victim.textContent = "Focusable";

    shadowRoot.appendChild(victim);

    /*
     * The original listener is installed on document in
     * capture mode before the window loses focus.
     */
    document.addEventListener("blur", function onBlur(event) {

        /*
         * Only act while the victim still exists.
         */
        if (!victim)
            return;

        /*
         * Preserve the important original sequence:
         *
         * victim.remove();
         * victim = null;
         * GCController.collect();
         */

        try {
            victim.remove();
        } catch (e) {
            if (victim.parentNode)
                victim.parentNode.removeChild(victim);
        }

        victim = null;

        /*
         * Allocation pressure after removal.
         */
        gc();

    }, true);

    function finish() {
        result.textContent = "PASS";
    }

    function triggerFocusTransition() {

        /*
         * The original:
         *
         * await UIHelper.setWindowIsKey(false);
         *
         * cannot be reproduced directly in normal JavaScript.
         *
         * The closest controllable replacement is a genuine
         * focus transition away from the focused Shadow DOM
         * element.
         */

        try {
            focusTarget.focus();
        } catch (e) {
        }

        /*
         * Keep the original completion timing structure:
         *
         * requestAnimationFrame(() => setTimeout(resolve, 0));
         */

        if (typeof requestAnimationFrame === "function") {
            requestAnimationFrame(function () {
                setTimeout(finish, 0);
            });
        } else {
            setTimeout(finish, 16);
        }
    }

    /*
     * Start only after the current task, allowing the
     * Shadow DOM element to become the active focused element.
     */
    setTimeout(function () {

        try {
            victim.focus();
        } catch (e) {
            status.textContent = "Unable to focus victim";
            return;
        }

        /*
         * Allow the focus state to settle before moving
         * focus away.
         */
        if (typeof requestAnimationFrame === "function") {

            requestAnimationFrame(function () {
                setTimeout(triggerFocusTransition, 0);
            });

        } else {

            setTimeout(triggerFocusTransition, 20);

        }

    }, 0);

})();
</script>

</body>
</html>
