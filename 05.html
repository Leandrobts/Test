<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
.subject:has(& + :nth-last-child(even)) {
    background-color: green;
}
</style>

</head>
<body>

<div class="subject">
    <div id="middle">
        <div id="victim">
            <span></span>
        </div>
    </div>
</div>

<p id="result">Running...</p>

<script src="resources/gc.js"></script>

<script>
var subject = document.querySelector(".subject");
var victim = document.getElementById("victim");

subject.style.backgroundSize = "cover";
subject.offsetTop;

victim.remove();
victim = null;

if (typeof gc == "function")
    gc();

subject.style.backgroundSize = "contain";
subject.offsetTop;

document.getElementById("result").textContent =
    "PASS if it does not crash.";
</script>

</body>
</html>
