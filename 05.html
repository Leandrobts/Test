<!DOCTYPE html>
<html>
<body>

<select id="select1" multiple size="4">
    <option>one</option>
    <option selected>two</option>
</select>

<select id="select2" multiple size="4">
    <option>one</option>
    <option selected>two</option>
</select>

<select id="select3" multiple size="4">
    <option>one</option>
    <option selected>two</option>
</select>

<script>

function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

var select1 = document.getElementById("select1");
var select2 = document.getElementById("select2");
var select3 = document.getElementById("select3");

select1.addEventListener("change", function() {
    select1.style.display = "none";
    document.body.offsetHeight;
    gc();
});

select2.addEventListener("change", function() {
    select2.parentNode.removeChild(select2);
    document.body.offsetHeight;
    gc();
});

select3.addEventListener("change", function() {
    select3.parentNode.innerHTML = "";
    document.body.offsetHeight;
    gc();
});

document.body.offsetHeight;

function trigger(select) {
    var event = document.createEvent("KeyboardEvents");

    event.initKeyboardEvent(
        "keydown",
        true,
        true,
        window,
        "Up",
        0,
        false,
        false,
        false,
        false
    );

    select.dispatchEvent(event);
}

trigger(select1);

setTimeout(function() {
    trigger(select2);
}, 1000);

setTimeout(function() {
    trigger(select3);
}, 2000);

document.title = "TEST COMPLETE";

</script>

</body>
</html>
