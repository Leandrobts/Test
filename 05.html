<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
body {
    font-family: sans-serif;
    padding: 20px;
}
input {
    width: 300px;
    height: 50px;
    font-size: 20px;
}
</style>
</head>
<body>
<h2>Teste DataListButton UAF (PS4 Compatible)</h2>
<p>Toque no botão da lista ao lado do input:</p>

<input id="input" type="text" list="list">
<datalist id="list">
    <option value="a">
    <option value="b">
</datalist>

<div id="result" style="margin-top: 20px; font-weight: bold;"></div>

<script>
function gc() {
    if (typeof GCController !== "undefined") {
        GCController.collect();
    } else {
        var gcRec = function (n) {
            if (n < 1) return {};
            var temp = {i: "ab" + i + (i / 100000)};
            temp += "foo";
            gcRec(n-1);
        };
        for (var i = 0; i < 1000; i++)
            gcRec(10);
    }
}

window.addEventListener('load', () => {
    const input = document.getElementById('input');
    const result = document.getElementById('result');

    // O listener idêntico ao commit: muda o tipo para 'button' e executa o gc() no clique
    input.addEventListener('click', (e) => {
        input.type = 'button';
        gc();
        result.innerHTML = '<span style="color: green;">PASS if no crash.</span>';
    }, { once: true });

    // Foco obrigatório para o WebKit montar o shadow subtree do datalist
    input.focus();

    // Aguarda o layout renderizar e dispara o clique na área exata do botão da datalist
    setTimeout(() => {
        const rect = input.getBoundingClientRect();
        // O botão da datalist (-webkit-list-button) fica na extremidade direita do input
        const clientX = rect.right - 25; 
        const clientY = rect.top + (rect.height / 2);

        // Dispara uma sequência de eventos compatíveis com o motor antigo do PS4
        const downEvent = new MouseEvent('mousedown', {
            bubbles: true, cancelable: true, view: window,
            clientX: clientX, clientY: clientY
        });
        const upEvent = new MouseEvent('mouseup', {
            bubbles: true, cancelable: true, view: window,
            clientX: clientX, clientY: clientY
        });
        const clickEvent = new MouseEvent('click', {
            bubbles: true, cancelable: true, view: window,
            clientX: clientX, clientY: clientY
        });

        // Envia os eventos para o elemento de input nas coordenadas do botão de sombra
        input.dispatchEvent(downEvent);
        input.dispatchEvent(upEvent);
        input.dispatchEvent(clickEvent);
    }, 600);
});
</script>
</body>
</html>
