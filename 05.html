<!DOCTYPE html>
<p>This test passes if it does not crash.</p>
<div id="status">Running test...</div>
<script>


  function finish(msg) {
      document.getElementById('status').innerText = msg;
    
  }

  // Carrega o binário local de forma síncrona para garantir o comportamento de reentrância
  const xhr = new XMLHttpRequest();
  xhr.open('GET', 'resources/Ahem.woff', false);
  xhr.overrideMimeType('text/plain; charset=x-user-defined');

  try {
      xhr.send();
      if (xhr.status === 200 || xhr.status === 0) {
          const text = xhr.responseText;
          const bytes = new Uint8Array(text.length);
          for (let i = 0; i < text.length; i++) {
              bytes[i] = text.charCodeAt(i) & 0xff;
          }
          const blob = new Blob([bytes], { type: 'font/woff' });
          const dataUrl = URL.createObjectURL(blob);

          // Usa o Blob URL em vez de local(Helvetica)
          let face = new FontFace('MyTestFam', 'url("' + dataUrl + '")');
          face.loaded;
          document.fonts.add(face);

          let context = document.createElement('canvas').getContext('2d');

          context.save();
          context.lineWidth = 0.5;

          context.font = '10px MyTestFam';

          let reentered = false;
          Object.defineProperty(FontFace.prototype, 'then', {
            configurable: true,
            get() {
              if (reentered)
                return undefined;
              reentered = true;
              for (let i = 0; i < 18; i++) {
                context.save();
                context.lineWidth = 1 + i;
              }
              reentered = false;
              return undefined;
            }
          });

          context.measureText('a');
          finish("PASS if no crash");
      } else {
          finish("FAIL: Ahem.woff not found");
      }
  } catch (e) {
      finish("FAIL: " + e.message);
  }
</script>
