<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Diagnostico de Liberacao do Label - Fluxo UAF ebc83b8</title>
</head>
<body>
  <h1>Diagnostico de Liberacao do Label - Fluxo UAF (Commit ebc83b8)</h1>
  <p>Sem CSS / sem style. Testa remocao do label + pressao de nos DOM antes de inspecionar list.</p>
  <pre id="out">Iniciando...</pre>

  <script>
    (function () {
      var out = document.getElementById("out");
      var logLines = [];

      function log(msg) {
        logLines.push(msg);
        if (out) {
          out.textContent = logLines.join("\n");
        }
      }

      // Pressao em JS + criacao/descarte de nos DOM temporarios em escopo isolado
      function domAndJsPressure(rounds) {
        for (var r = 0; r < rounds; r++) {
          (function () {
            var tmpDoc = document.implementation.createHTMLDocument();
            var container = tmpDoc.createElement("div");
            for (var k = 0; k < 250; k++) {
              var el = tmpDoc.createElement("label");
              el.textContent = "x" + r + "_" + k;
              container.appendChild(el);
            }
            container.innerHTML = "";
          })();

          for (var j = 0; j < 2000; j++) {
            var s = "gc_" + r + "_" + j + "_" + Math.random();
            var o = { a: s, b: [j, s] };
            if (o.a.length < 0) {
              log(o.b);
            }
          }
        }
      }

      var survivor = null;
      var child = null;
      var list = null;
      var setupOk = false;

      function setupScenario() {
        logLines = [];
        survivor = null;
        child = null;
        list = null;
        setupOk = false;

        log("=== ETAPA 0: SETUP DO DOCUMENTO SECUNDARIO ===");
        try {
          var secDoc = document.implementation.createHTMLDocument();
          secDoc.body.innerHTML = '<input id="i"><label for="i"></label>';

          var inp = secDoc.getElementById("i");
          if (!inp) {
            log("[FALHA] input#i nao encontrado.");
            return;
          }

          list = inp.labels;
          log("[INFO] list obtido: " + (list !== null && typeof list === "object"));
          log("[INFO] list.length inicial: " + (list ? list.length : "N/A"));
          log("[INFO] list[0] tag inicial: " + (list && list[0] ? list[0].tagName : "null/undef"));

          if (!list || !list[0]) {
            log("[FALHA] list[0] nao retornou o <label> esperado.");
            return;
          }

          survivor = secDoc.createElement("div");
          child = secDoc.createElement("span");
          setupOk = true;
          log("[OK] Setup concluido.");
        } catch (e) {
          log("[ERRO] Excecao no setup: " + e);
        }
      }

      function removeLabelFromDoc() {
        log("");
        log("=== ETAPA 1A: REMOVER <label> DA ARVORE DO DOCUMENTO SECUNDARIO ===");
        if (!setupOk || !list) {
          log("[AVISO] Rode o setup primeiro.");
          return;
        }
        try {
          var lbl = list[0];
          if (lbl && lbl.parentNode) {
            lbl.parentNode.removeChild(lbl);
            log("[OK] removeChild(label) executado.");
          } else {
            log("[INFO] label sem parentNode ou ja removido.");
          }
          lbl = null;
        } catch (e) {
          log("[ERRO] Ao remover label: " + e);
        }
      }

      function runGcPressureOnly() {
        log("");
        log("=== ETAPA 1B: PRESSAO DOM + JS (SEM LER list DURANTE O LOOP) ===");
        if (!setupOk) {
          log("[AVISO] Rode o setup primeiro.");
          return;
        }
        domAndJsPressure(4);
        log("[OK] Pressao de nos DOM + JS executada.");

        if (list) {
          try {
            log("[POS-GC] list.length = " + list.length + " | list[0] = " + (list[0] ? list[0].tagName : String(list[0])));
          } catch (e) {
            log("[ERRO] Ao inspecionar list pos-GC: " + e);
          }
        } else {
          log("[INFO] list ja e null.");
        }
      }

      function dropListAndGc() {
        log("");
        log("=== ETAPA 2: list = null + PRESSAO DOM/JS ===");
        if (!list) {
          log("[AVISO] list ja e null ou setup nao foi executado.");
          return;
        }
        list = null;
        log("[OK] list = null atribuido.");
        domAndJsPressure(4);
        log("[OK] Pressao pos-list = null executada.");
      }

      function mutateInvalidate() {
        log("");
        log("=== ETAPA 3: survivor.appendChild(child) ===");
        if (!survivor || !child) {
          log("[AVISO] survivor ou child ausentes.");
          return;
        }
        try {
          survivor.appendChild(child);
          log("[SOBREVIVEU] survivor.appendChild(child) concluiu sem crash.");
          log("[INFO] survivor.childNodes.length = " + survivor.childNodes.length);
        } catch (e) {
          log("[EXCECAO] Erro em appendChild: " + e);
        }
      }

      function runFullTest() {
        setupScenario();
        removeLabelFromDoc();
        runGcPressureOnly();
        dropListAndGc();
        mutateInvalidate();
      }

      var controlsDiv = document.createElement("div");
      function addBtn(label, fn) {
        var b = document.createElement("button");
        b.type = "button";
        b.textContent = label;
        b.onclick = fn;
        controlsDiv.appendChild(b);
      }

      addBtn("0. Setup", setupScenario);
      addBtn("1A. Remover label", removeLabelFromDoc);
      addBtn("1B. GC DOM+JS", runGcPressureOnly);
      addBtn("2. list=null + GC", dropListAndGc);
      addBtn("3. appendChild", mutateInvalidate);
      addBtn("Rodar Tudo", runFullTest);

      if (document.body && out) {
        document.body.insertBefore(controlsDiv, out);
      }

      runFullTest();
    })();
  </script>
</body>
</html>
