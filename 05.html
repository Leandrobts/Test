<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Style Scope Destruction Test - PS4 Compatible</title>
<script>
// Declaração da função que faltava no original para evitar ReferenceError
function f3() {
    // Função de callback do onfocusout
}

function gc() {
    if (window.GCController) {
        GCController.collect();
        return;
    }
    // Fallback de estresse de memória para forçar a coleta no motor legado
    for (var i = 0; i < 100; i++) {
        new Uint8Array(1024 * 1024);
    }
}

function main() {
    try {
        var x5 = document.getElementById('x5');
        var x11 = document.getElementById('x11');
        var x18 = document.getElementById('x18');

        // Verifica o suporte a Shadow Shadow no firmware legado
        if (!x5 || typeof x5.attachShadow !== 'function') {
            document.getElementById('status').innerText = 'Shadow DOM não suportado nesta versão do WebKit.';
            return;
        }

        // Cria o escopo de Shadow DOM
        var v63 = x5.attachShadow({mode: "open"});
        
        // Força o cálculo de layout do elemento SVG animado
        var dummyScroll = x18.scrollTop;
        
        // Move o elemento para dentro do Shadow Root
        v63.appendChild(x11);
        
        // Executa o coletor de lixo para estressar o ciclo de ponteiros
        gc();
        
        document.getElementById('status').innerHTML = '<span style="color: green; font-weight: bold;">PASS if it doesn\'t crash.</span>';
    } catch (e) {
        document.getElementById('status').innerHTML = '<span style="color: red; font-weight: bold;">Erro tratado: ' + e.message + '</span>';
    }
}
</script>
</head>
<body onload="main()">
    <h2>Teste de Regressão - Style Scope</h2>
    <div id="status">Executando...</div>

    <!-- Elementos estruturados de forma válida para o parser legado não descartar nós -->
    <svg id="x11" tabindex="-1" style="display:none;">
        <animateTransform id="x18" attributeName="transform" type="translate" from="0 0" to="10 10" dur="0.5s">
        </animateTransform>
    </svg>
    
    <div id="x5" tabindex="0" onfocusout="f3()"></div>
</body>
</html>
