
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PS4 AudioContext Gesture Test</title>
<style>
body {
  background:#101c32;
  color:#fff;
  font:16px Arial;
  padding:20px;
}
button {
  font-size:18px;
  padding:16px;
  background:#0078d4;
  color:white;
  border:0;
  border-radius:8px;
}
pre {
  background:#203653;
  padding:15px;
  white-space:pre-wrap;
}
</style>
</head>
<body>

<h2>PS4 AudioContext Test</h2>

<p>Pressione o botao para testar com user gesture.</p>

<button onclick="testAudio()">
  TESTAR AUDIOCONTEXT
</button>

<pre id="log"></pre>

<script>
var output = document.getElementById("log");
var ctx = null;

function log(s) {
  output.textContent += s + "\n";
}

function testAudio() {
  output.textContent = "";

  log("=== USER GESTURE ===");
  log("Clique detectado: SIM");

  var AC = window.AudioContext ||
           window.webkitAudioContext;

  log("AudioContext: " +
      typeof window.AudioContext);

  log("webkitAudioContext: " +
      typeof window.webkitAudioContext);

  if (!AC) {
    log("RESULTADO: API NAO DISPONIVEL");
    log("User gesture nao altera a exposicao da API.");
    return;
  }

  try {
    ctx = new AC();

    log("Contexto criado: SIM");
    log("Estado: " + ctx.state);

    log("decodeAudioData: " +
        typeof ctx.decodeAudioData);

    log("resume: " +
        typeof ctx.resume);

    if (ctx.state === "suspended" &&
        typeof ctx.resume === "function") {

      var p = ctx.resume();

      if (p && typeof p.then === "function") {
        p.then(function() {
          log("Resume: OK");
          log("Estado final: " + ctx.state);
        }, function(e) {
          log("Resume erro: " + e);
        });
      }
    } else {
      log("Estado atual: " + ctx.state);
    }

  } catch(e) {
    log("ERRO: " + e.name);
    log(e.message);
  }
}
</script>
</body>
</html>
