<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FocusController UAF - PS4</title>
</head>

<body>

<p id="status">Loading...</p>

<script>

/*
 * ============================================================
 * GC FALLBACK
 *
 * Baseado no gc.js do WebKit.
 * ============================================================
 */

if (!window.gc) {
    window.gc = function() {

        function gcRec(n) {
            if (n < 1)
                return {};

            var temp = {
                i: "ab" + i + (i / 100000)
            };

            temp += "foo";

            gcRec(n - 1);
        }

        for (var i = 0; i < 10000; i++)
            gcRec(10);
    };
}


/*
 * ============================================================
 * ORIGINAL TEST STRUCTURE
 * ============================================================
 */

var iframe = document.createElement("iframe");

iframe.tabIndex = 0;

iframe.srcdoc =
    "<input tabindex='0'>" +
    "<script>" +
    "parent.innerInput = document.querySelector('input');" +
    "<\/script>";

var outerInput = document.createElement("input");

document.body.appendChild(outerInput);
document.body.appendChild(iframe);


/*
 * ============================================================
 * IFRAME LOAD
 * ============================================================
 */

iframe.onload = function() {

    setTimeout(runTest, 0);

};


/*
 * ============================================================
 * TEST
 * ============================================================
 */

function runTest() {

    var innerInput = window.innerInput;

    window.innerInput = null;

    if (!innerInput)
        return;


    /*
     * ========================================================
     * BLUR HANDLER
     *
     * Mantida a mesma ordem do regression test.
     * ========================================================
     */

    outerInput.addEventListener("blur", function() {

        document.adoptNode(innerInput);

        innerInput = null;

        iframe.remove();

        iframe = null;

        gc();

    }, {
        once: true
    });


    /*
     * ========================================================
     * ORIGINAL FOCUS TRIGGER
     * ========================================================
     *
     * Não existe body.focus().
     * Não existe button.focus().
     * Não existe qualquer foco artificial anterior.
     */

    outerInput.focus();


    /*
     * ========================================================
     * ORIGINAL SYNTHETIC TAB
     * ========================================================
     */

    outerInput.dispatchEvent(
        new KeyboardEvent("keydown", {
            bubbles: true,
            cancelable: true,
            view: window,
            detail: 0,

            key: "Tab",
            code: "Tab",
            keyIdentifier: "U+0009",

            location: 222,

            ctrlKey: false,
            altKey: true,
            shiftKey: false,
            metaKey: false
        })
    );


    /*
     * ========================================================
     * ORIGINAL FINAL DOM MUTATION
     * ========================================================
     */

    document.body.innerHTML =
        "<p>This test passes if PASS (no crash)</p>";
}

</script>

</body>
</html>
