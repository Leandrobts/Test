<!DOCTYPE html>
<p>Teste main-thread canvas.</p>
<script>
const canvas = document.createElement('canvas');
canvas.width = 64;
canvas.height = 64;
const ctx = canvas.getContext('2d');

if (ctx) {
    // 1. Pressiona o cache criando entradas variadas
    const heldContexts = [];
    for (let i = 0; i < 600; i++) {
        const c = document.createElement('canvas');
        c.width = 4;
        c.height = 4;
        const g = c.getContext('2d');
        if (!g) break;
        g.font = (10 + (i % 20)) + 'px "f' + i + '", sans-serif';
        g.measureText('\u13A0\u13A2\u13A4');
        if (i % 3 !== 0) heldContexts.push(g);
    }

    // 2. Registra FontFaces e dispara medições intercalando mudanças em document.fonts
    const url = 'url("data:font/ttf;base64,' + 'A'.repeat(1100000) + '")';
    const faces = [];
    for (let i = 0; i < 8; i++) {
        const f1 = new FontFace('mDonor' + i, url);
        const f2 = new FontFace('mTarget' + i, url, { unicodeRange: 'U+13A0-13FF' });
        if (document.fonts && document.fonts.add) {
            document.fonts.add(f1);
            document.fonts.add(f2);
        }
        faces.push(f1, f2);
        ctx.font = '12px mDonor' + i + ', mTarget' + i + ', sans-serif';
        for (let k = 0; k < 50; k++) {
            ctx.measureText('\u13A0\u13A2\u13A4');
        }
    }
}
</script>
