<!DOCTYPE html>
<html>
<body>
<div id="host" style="display:none"></div>

<!-- Adicionamos um elemento dialog real no DOM -->
<dialog id="myDialog">
    <iframe src="resources/self-closing-modal-dialog.html" style="border:none; width:100px; height:100px;"></iframe>
</dialog>

<script>
var host = document.getElementById('host');
var sr = host.attachShadow({mode: 'open'});
sr.innerHTML = '<picture id="pic"><source srcset="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"><img></picture>';
var pic = sr.getElementById('pic');

pic.addEventListener('load', function listener() {
    pic.removeEventListener('load', listener, true);   
    pic.textContent =   '';   
    
    // Abre o dialog nativo corretamente usando a instância
    var dialog = document.getElementById('myDialog');
    if (dialog && typeof dialog.showModal === 'function') {
        dialog.showModal();
    }

    setTimeout(function() {
        document.write('PASS if no crash.');
    }, 0);
}, /*capture*/ true);
</script>
</body>
</html>
