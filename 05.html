<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Fallback OffscreenCanvas - Abordagem 2 (Canvas Proxy)</title>
    <style>
        body { background: #111; color: #fff; text-align: center; font-family: sans-serif; margin-top: 40px; }
        canvas { border: 2px solid #444; background: #000; }
    </style>
</head>
<body>
    <h1>Abordagem 2: Canvas Proxy (Comandos)</h1>
    <canvas id="meuCanvas" width="640" height="360"></canvas>

    <script>
        const canvas = document.getElementById('meuCanvas');
        const ctx = canvas.getContext('2d');
        
        const worker = new Worker('worker2.js');

        // Escuta os comandos enviados pelo Worker e executa no canvas real da DOM
        worker.onmessage = function(e) {
            const msg = e.data;
            if (msg.type === 'setProperty') {
                ctx[msg.property] = msg.value;
            } else if (msg.type === 'call') {
                if (typeof ctx[msg.method] === 'function') {
                    ctx[msg.method](...msg.args);
                }
            }
        };
    </script>
</body>
</html>
