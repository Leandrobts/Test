<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PS4 Canvas 2D Reentrancy Check</title>
</head>
<body>
  <button id="runBtn" type="button">Executar teste getContext("2d")</button>
  <pre id="out"></pre>

  <script>
    (function () {
      const out = document.getElementById("out");
      const btn = document.getElementById("runBtn");

      function log(msg) {
        out.textContent += msg + "\n";
      }

      function runTest() {
        out.textContent = "";
        log("Iniciando teste de canvas.getContext('2d')...");

        try {
          const canvas = document.createElement("canvas");
          canvas.width = 128;
          canvas.height = 128;

          const ctx1 = canvas.getContext("2d");
          log("ctx1 criado: " + (ctx1 ? ctx1.constructor.name : "null"));

          const ctx2 = canvas.getContext("2d");
          log("ctx2 === ctx1: " + (ctx2 === ctx1));

          const glAttempt = canvas.getContext("webgl");
          log("getContext('webgl') apos 2d: " + (glAttempt === null ? "null (esperado)" : typeof glAttempt));

          // Teste de reentrancia via getter/setter ou evento durante mutacao de tamanho
          let reentrantCtx = null;
          const observerCanvas = document.createElement("canvas");
          observerCanvas.width = 64;
          observerCanvas.height = 64;

          Object.defineProperty(observerCanvas, "width", {
            configurable: true,
            get: function () {
              return 64;
            },
            set: function (val) {
              if (!reentrantCtx) {
                reentrantCtx = observerCanvas.getContext("2d");
              }
              observerCanvas.setAttribute("width", String(val));
            }
          });

          observerCanvas.width = 100;
          const afterCtx = observerCanvas.getContext("2d");
          log("reentrantCtx === afterCtx: " + (reentrantCtx === afterCtx));

          // Operacao basica no buffer para verificar estabilidade
          ctx1.fillStyle = "#00ff00";
          ctx1.fillRect(0, 0, 32, 32);
          canvas.width = 256;
          ctx1.fillRect(0, 0, 16, 16);
          log("Resize + draw concluido sem excecao.");
        } catch (err) {
          log("Excecao capturada: " + (err && err.message ? err.message : String(err)));
        }
      }

      btn.addEventListener("click", runTest);
    })();
  </script>
</body>
</html>
