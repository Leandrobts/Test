<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>WebKit Forced Flush Test</title>
</head>
<body>
<h2>Teste de Flush Forçado no WebKit</h2>
<pre id="log"></pre>
<script>
function log(message)
{
    document.getElementById('log').textContent += message + '\n';
    console.log(message);
}

log("Iniciando teste de flush forçado síncrono...");

// Touch document.fonts
document.fonts;

const host = document.createElement("div");
document.body.appendChild(host);
const shadowRoot = host.attachShadow({ mode: "open" });

const pendingUrl = 'data:font/woff;base64,' + 'A'.repeat(150000);
const fontFaceStyle = document.createElement("style");
fontFaceStyle.textContent = `@font-face { font-family: reentryFont; src: url("${pendingUrl}"); }`
    + `.probe { font: 24px reentryFont; }`;
shadowRoot.appendChild(fontFaceStyle);

const probe = document.createElement("span");
probe.className = "probe";
probe.textContent = "A";
shadowRoot.appendChild(probe);

// Força layout inicial
document.body.offsetHeight;
document.fonts.load("24px reentryFont", "A");
log("document.fonts.status: " + document.fonts.status);

// Materializa ready
document.fonts.ready;

// Prepend para criar pendência UpdateType::ActiveSet
const prependedStyle = document.createElement("style");
prependedStyle.textContent = ".unused { color: red; }";
shadowRoot.prepend(prependedStyle);
log('após prepend. status=' + document.fonts.status);

let getterCallCount = 0;
Object.defineProperty(FontFaceSet.prototype, "then", {
    configurable: true,
    get() {
        delete FontFaceSet.prototype.then;
        ++getterCallCount;
        log('>>> GETTER DISPAROU! count=' + getterCallCount);
        log('    status no momento: ' + document.fonts.status);
        try {
            host.remove();
            log('    host.remove() executado com sucesso.');
        } catch(e) {
            log('    erro no host.remove(): ' + e);
        }
        return undefined;
    }
});

log('Aplicando gatilhos agressivos de flush síncrono...');

try {
    // 1. Leituras geométricas múltiplas
    const rect = document.body.getBoundingClientRect();
    const probeRect = probe.getBoundingClientRect();
    
    // 2. Leitura de estilo computado
    const computed = window.getComputedStyle(probe).fontFamily;
    
    // 3. Modificação via CSSOM
    if (shadowRoot.styleSheets.length > 0) {
        shadowRoot.styleSheets[0].insertRule('.forced { display: block; }', 0);
    }
    
    // 4. Acesso a folhas globais
    const len = document.styleSheets.length;
    
    log('Gatilhos executados. Rect height: ' + rect.height + ', Computed font: ' + computed);
} catch (err) {
    log('Erro ao executar gatilhos: ' + err);
}

log("Fim do script principal. getterCallCount = " + getterCallCount);
</script>
</body>
</html>
