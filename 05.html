<!DOCTYPE html>
<html>
<body>
<p>Clique no botão abaixo para testar o compartilhamento e cancelamento seguro.</p>
<button id="shareButton">Iniciar Teste</button>
<div id="result"></div>

<script>
function gc() {
    function gcRec(n) {
          if (n < 1)
              return {};
          var temp = {i: "ab" + i + (i / 100000)};
          temp += "foo";
          gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
    gcRec(10);
}

document.getElementById('shareButton').addEventListener('click', async () => {
    try {
        // Cria um arquivo grande via Blob para simular o comportamento
        let chunk = new Blob([new ArrayBuffer(1024 * 1024)]); // 1 MB para teste prático no browser
        let hugeFile = new File([chunk], "huge.bin", {type: "application/octet-stream"});

        if (!navigator.canShare || !navigator.canShare({ files: [hugeFile] })) {
            document.getElementById('result').textContent = "O compartilhamento de arquivos não é suportado neste navegador.";
            return;
        }

        // Cria um iframe auxiliar semelhante ao teste original
        let f = document.createElement('iframe');
        document.body.appendChild(f);
        let childNav = f.contentWindow.navigator;

        // Aciona o share
        let sharePromise = childNav.share({ files: [hugeFile] }).catch(err => {
            console.log("Compartilhamento cancelado ou interrompido:", err);
        });

        // Remove o iframe após um curto período para simular o ciclo do teste
        setTimeout(() => {
            f.remove();
            f = null;
            gc();
            // Interrompe o carregamento/processamento global via window.stop()
            window.stop();
            document.getElementById('result').textContent = "PASS: Executado sem crash!";
        }, 100);

    } catch (e) {
        document.getElementById('result').textContent = "Erro capturado: " + e.message;
    }
});
</script>
</body>
</html>
