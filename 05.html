
<!DOCTYPE html>
<html>
<body>
<script>
const iterations = 25;
let n = 0;

function runTest(win) {
    const img = new win.Image();
    img.src = "data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=";
}
function round() {
    const frame = document.createElement("iframe");
    document.body.appendChild(frame);

    try {
        runTest(frame.contentWindow);
    } catch(e) {
        console.log("ERROR:", e.message);
    }

    frame.remove();

    if (++n < iterations) {
        setTimeout(round, 0);
    } else {
        document.body.innerHTML += "<p>TEST FINISHED</p>";
    }
}

onload = round;
</script>
</body>
</html>
