<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Teste UAF — FontFace / FontFaceSet</title>
<style>
  body { font-family: system-ui, Arial, sans-serif; background:#0e1117; color:#e6e6e6; padding:24px; }
  h1 { font-size:20px; margin-bottom:16px; }
  .section { background:#171b22; border:1px solid #2a2f3a; border-radius:8px; padding:16px; margin-bottom:20px; }
  .section h2 { font-size:15px; margin:0 0 12px; color:#8ab4f8; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid #23283a; vertical-align:top; }
  th { color:#9aa4b2; font-weight:600; }
  .ok    { color:#5dd39e; }
  .warn  { color:#f5c542; }
  .crash { color:#ff6b6b; font-weight:bold; }
  .err   { color:#ff8c66; }
  .info  { color:#8ab4f8; }
  code { background:#0b0e13; padding:2px 5px; border-radius:4px; }
  #run { background:#1f6feb; color:#fff; border:none; padding:10px 18px; border-radius:6px; cursor:pointer; font-size:14px; }
  #run:hover { background:#388bfd; }
</style>
</head>
<body>
<script>
(function(){const logElement=document.createElement('pre');logElement.id='debug-log';logElement.style.cssText='position: fixed; bottom: 0; left: 0; width: 100%; max-height: 220px; overflow-y: auto; background: rgba(0, 0, 0, 0.85); color: #ff5555; font-family: monospace; font-size: 11px; z-index: 999999; padding: 8px; box-sizing: border-box; margin: 0; border-top: 2px solid #ff0000; text-align: left; white-space: pre-wrap; word-break: break-all;';if(document.body){document.body.appendChild(logElement);}else{document.addEventListener('DOMContentLoaded',()=>document.body.appendChild(logElement));}function log(msg,color='#ff5555'){if(!logElement)return;const line=document.createElement('div');line.style.color=color;line.textContent=msg;logElement.appendChild(line);logElement.scrollTop=logElement.scrollHeight;}window.onerror=function(message,source,lineno,colno,error){log(`[ERRO JS] ${message}\n  -> ${source}:${lineno}:${colno}`);};window.addEventListener('error',function(event){const target=event.target;if(target&&(target.tagName||target===window)){const tagName=target.tagName?target.tagName.toLowerCase():'recurso';const sourceUrl=target.src||target.href||'desconhecido';log(`[FALHA RECURSO/${tagName}] Não foi possível carregar: ${sourceUrl}`,'#ffaa00');}},true);window.addEventListener('unhandledrejection',function(event){log(`[PROMISE REJECTION] ${event.reason}`);});['log','error','warn','info'].forEach(method=>{const original=console[method];console[method]=function(...args){original.apply(console,args);const text=args.map(arg=>{if(typeof arg==='object'){try{return JSON.stringify(arg);}catch(e){return '[Objeto Circular]';}}return arg;}).join(' ');let color='#ffffff';if(method==='error')color='#ff5555';if(method==='warn')color='#ffaa00';log(`[Console.${method}] ${text}`,color);};});log('[Debug Ativo]','#00ff00');})();
</script>
<h1>Verificação completa do mecanismo UAF — FontFace / CSSFontFaceRule</h1>
<button id="run">Executar testes</button>
<div id="out"></div>

<script>
/* ---------- Helpers de UI ---------- */
const out = document.getElementById('out');
const sections = {};

function section(id, title) {
  let s = document.getElementById(id);
  if (!s) {
    s = document.createElement('div');
    s.className = 'section';
    s.id = id;
    const h = document.createElement('h2');
    h.textContent = title;
    s.appendChild(h);
    const t = document.createElement('table');
    t.innerHTML = '<thead><tr><th>Teste</th><th>Resultado</th><th>Detalhe</th></tr></thead><tbody></tbody>';
    s.appendChild(t);
    out.appendChild(s);
  }
  return s;
}

function row(s, name, result, detail) {
  const tbody = s.querySelector('tbody');
  const tr = document.createElement('tr');
  const cls = String(result).toLowerCase().includes('crash') ? 'crash'
            : String(result).toLowerCase().includes('warn')  ? 'warn'
            : String(result).toLowerCase().includes('skip')  ? 'warn'
            : String(result).toLowerCase().includes('err')   ? 'err'
            : 'ok';
  tr.innerHTML = `<td>${name}</td>
                  <td class="${cls}">${result}</td>
                  <td><code>${detail ?? '-'}</code></td>`;
  tbody.appendChild(tr);
  return tr;
}

/* ---------- Helpers de persistência (sobrevivem a crash) ---------- */
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} }

/* ---------- Helpers de criação de fontes ---------- */
function makeFontFace(src, descriptors) {
  const d = descriptors || {};
  return new FontFace('UAFTest-' + Math.random().toString(36).slice(2), src, d);
}

async function measureWith(text, fontSpec) {
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  ctx.font = fontSpec || '16px sans-serif';
  return ctx.measureText(text || 'a').width;
}

/* ---------- Teste principal ---------- */
async function testUAFMechanism() {
  const s = section('uaf', '10 · Verificação completa do mecanismo UAF');

  if (typeof FontFace === 'undefined' || !('fonts' in document)) {
    row(s, 'APIs ausentes — skip', 'skip', 'FontFace/FontFaceSet indisponível');
    return;
  }

  // Verifica crash anterior (marcador persistido)
  const lastStep = lsGet('uaf_step');
  if (lastStep) {
    row(s, '? Crash na etapa anterior', 'crash', lastStep);
    lsDel('uaf_step');
  }

  // Definição dos passos
  const steps = [
    {
      name: 'UAF_CSSSegmentedFontFace style (local + measureText a)',
      font: 'local(Helvetica)', char: 'a', op: 'measure',
      action(ctx) { for (let i = 0; i < 8; i++) ctx.save(); }
    },
    {
      name: 'UAF_FontFaceSet add (local + measureText a)',
      font: 'local(Helvetica)', char: 'a', op: 'measure',
      action(ctx) { for (let i = 0; i < 8; i++) ctx.restore(); }
    },
    {
      name: 'UAF_FontFace load (local + measureText b)',
      font: 'local(Arial)', char: 'b', op: 'measure',
      action(ctx) { for (let i = 0; i < 8; i++) ctx.save(); ctx.restore(); }
    },
    {
      name: 'UAF_FontFaceSet delete + add (local + measureText c)',
      font: 'local(Arial)', char: 'c', op: 'measure',
      action(ctx) { for (let i = 0; i < 4; i++) { ctx.save(); } }
    },
    {
      name: 'UAF_CSS @font-face dinâmico (local + measureText d)',
      font: 'local(Helvetica)', char: 'd', op: 'measure',
      action(ctx) { for (let i = 0; i < 4; i++) { ctx.restore(); } }
    }
  ];

  for (let i = 0; i < steps.length; i++) {
    const step = steps[i];
    lsSet('uaf_step', `${i + 1}/${steps.length} — ${step.name}`);

    try {
      const ff = makeFontFace(step.font);

      // Carrega a fonte (pode falhar se "local" não existir)
      let loaded = false;
      try {
        await ff.load();
        document.fonts.add(ff);
        loaded = true;
      } catch (e) {
        row(s, step.name, 'warn', 'fonte não carregou: ' + e.message);
        continue;
      }

      // Executa ação sobre contexto de canvas
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      try {
        step.action(ctx);
      } catch (e) {
        row(s, step.name, 'err', 'action: ' + e.message);
        continue;
      }

      // Medição
      let width = -1;
      try {
        width = await measureWith(step.char, `16px "${ff.family}"`);
      } catch (e) {
        row(s, step.name, 'err', 'measure: ' + e.message);
        continue;
      }

      row(s, step.name, 'ok', `family=${ff.family} width=${width.toFixed(2)}`);

      // Cleanup
      try { document.fonts.delete(ff); } catch (e) {}

    } catch (e) {
      row(s, step.name, 'crash', e.message);
    }

    // yield para o browser respirar (aumenta chance de detectar crash real)
    await new Promise(r => setTimeout(r, 0));
  }

  lsDel('uaf_step');
  row(s, 'Conclusão', 'ok', 'nenhum crash detectado nas etapas executadas');
}

/* ---------- Botão ---------- */
document.getElementById('run').addEventListener('click', () => {
  out.innerHTML = '';
  testUAFMechanism().catch(e => {
    row(section('uaf', '10 · Verificação completa do mecanismo UAF'),
        'Erro global', 'crash', e.message);
  });
});
</script>
</body>
</html>
