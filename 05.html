<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste Constant Folding - PS4</title>
    <style>
        body { background-color: #121212; color: #00ff66; font-family: monospace; padding: 20px; }
        h1 { color: #ffffff; font-size: 20px; border-bottom: 2px solid #00ff66; padding-bottom: 10px; }
        #console { background-color: #000; border: 1px solid #333; padding: 15px; height: 70vh; overflow-y: auto; white-space: pre-wrap; font-size: 14px; }
        .log { color: #cccccc; }
        .success { color: #00ff66; font-weight: bold; }
        .error { color: #ff3333; font-weight: bold; }
        .info { color: #33ccff; }
    </style>
</head>
<body>
    <h1>Simulador WebKit (Commit 13bfbf9 - Constant Folding) - PS4</h1>
    <div id="console">Iniciando teste de otimizacao e redimensionamento...</div>

    <script>
        var consoleEl = document.getElementById('console');

        function log(message, type) {
            var span = document.createElement('div');
            span.className = type || 'log';
            span.textContent = message;
            consoleEl.appendChild(span);
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        var assert = {
            eq: function(lhs, rhs, msg) {
                if (lhs !== rhs) {
                    throw new Error('Falha na assercao: Esperado "' + rhs + '", mas obteve "' + lhs + '". ' + (msg || ''));
                }
            }
        };

        var pageSize = 65536;
        var buffer = null;
        var view = null;

        function trigger(val) {
            view[0] = val;
        }

        function simulateMemoryGrow(oldBuffer, additionalPages) {
            var newSize = oldBuffer.byteLength + (additionalPages * pageSize);
            var newBuffer = new ArrayBuffer(newSize);
            var oldBytes = new Uint8Array(oldBuffer);
            var newBytes = new Uint8Array(newBuffer);
            newBytes.set(oldBytes);
            return newBuffer;
        }

        try {
            log("[1/6] Esgotando memoria disponivel...", "info");
            var memories = [];
            for (var i = 0; i < 200; i++) {
                try {
                    memories.push(new ArrayBuffer(1024 * 1024));
                } catch (e) {
                    log("Limite atingido na iteracao " + i + ": " + e.message, "info");
                    break;
                }
            }

            log("[2/6] Configurando buffer inicial e Float64Array...", "info");
            buffer = new ArrayBuffer(pageSize);
            view = new Float64Array(buffer);

            log("[3/6] Aquecendo o motor com loop de alta frequencia (JIT)...", "info");
            for (var j = 0; j < 10000; j++) {
                trigger(13.37);
            }
            log("Valor atual em view[0] apos aquecimento: " + view[0]);
            assert.eq(view[0], 13.37);

            log("[4/6] Simulando memory.grow(1)...", "info");
            buffer = simulateMemoryGrow(buffer, 1);
            view = new Float64Array(buffer);

            log("[5/6] Acionando trigger com novo valor apos redimensionamento...", "info");
            trigger(1.1);

            log("[6/6] Executando validacao final...", "info");
            assert.eq(view[0], 1.1);

            log("\nSUCESSO: O teste passou! Valor atualizado para 1.1.", "success");
        } catch (error) {
            log("\nERRO NO TESTE: " + error.message, "error");
            if (error.stack) log(error.stack, "error");
        }
    </script>
</body>
</html>
