<!DOCTYPE html>
<html>
<body>
  <input id="outerInput">
  <iframe tabindex="0" srcdoc="<input tabindex='0'><script>parent.innerInput = document.querySelector('input');</script>"></iframe>
  <script>
    // Passo 4: O engine registra e compila a função gc() no escopo global
    function gc() {
        function gcRec(n) {
            if (n < 1) return {};
            var temp = { i: "ab" + i + (i / 100000) };
            temp += "foo";
            gcRec(n - 1);
        }
        for (var i = 0; i < 10000; i++) gcRec(10);  
    }
  </script>
</body>
</html>
