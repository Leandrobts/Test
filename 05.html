<!DOCTYPE html>
<p>This test passes if it does not crash.</p>
<script>
const WORKER_BODY = `
const dummies = [];
for (let i = 0; i < 3500; i++) {
    const dummy = new OffscreenCanvas(1, 1).getContext('2d');
    dummy.font = '10px "dummy' + i + '"';
    dummies.push(dummy);
}

const pendingFontURL = 'url("data:font/ttf;base64,' + 'A'.repeat(1100000) + '")';

const keepAlive = [];
for (let attempt = 0; attempt < 2; attempt++) {    
    const metricsDonor = new FontFace('metricsDonor' + attempt, pendingFontURL);   
    const measured = new FontFace('measured' + attempt, pendingFontURL, { unicodeRange: 'U+13A0-13FF' });
    self.fonts.add(metricsDonor);
    self.fonts.add(measured);

    const context = new OffscreenCanvas(64, 64).getContext('2d');
    context.font = '10px metricsDonor' + attempt + ', measured' + attempt;
    keepAlive.push(metricsDonor, measured, context);
  
    context.measureText('\\u13A0\\u13A2\\u13A4');
}
postMessage('done');
`;

const worker = new Worker(URL.createObjectURL(new Blob([WORKER_BODY], { type: 'application/javascript' })));
worker.onmessage = () => {
};
</script>
