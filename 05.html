

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PS4 - Canvas Dimensions</title>
</head>
<body>
<h2>PS4 - Teste de dimensoes Canvas</h2>
<pre id="resultado">Executando...</pre>

<script>
(function () {
  var output = document.getElementById("resultado");
  var texto = "";

  function log(msg) {
    texto += msg + "\n";
    output.textContent = texto;
  }

  var tamanhos = [
    [32767, 1],
    [32768, 1],
    [1, 32767],
    [1, 32768]
  ];

  log("Canvas: " + typeof HTMLCanvasElement);
  log("Iniciando verificacoes...\n");

  for (var i = 0; i < tamanhos.length; i++) {
    var w = tamanhos[i][0];
    var h = tamanhos[i][1];

    try {
      var canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;

      var ctx = canvas.getContext("2d");

      log("Dimensoes: " + w + " x " + h);
      log("Width: " + canvas.width);
      log("Height: " + canvas.height);
      log("Contexto 2D: " + (ctx ? "SIM" : "NAO"));
      log("-----------------------");

      canvas.width = 0;
      canvas.height = 0;
      canvas = null;

    } catch (e) {
      log("ERRO: " + e.name + ": " + e.message);
    }
  }

  log("\nTeste concluido.");
})();
</script>
</body>
</html>
