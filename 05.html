<!DOCTYPE html>
<html>
<body>
<p>This test passes if it does not crash.</p>
<div id="host"></div>
<div id="result"></div>
<input type="text" id="externalInput" style="position: absolute; opacity: 0; pointer-events: none;" tabindex="-1">

<script>
// --- Função GC integrada ---
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);  
}

let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable';
shadowRoot.appendChild(victim);
victim.focus();

async function runTest() {
    document.addEventListener('blur', () => {
        if (victim) {
            victim.remove();
            victim = null;
            gc();
        }
    }, true);

    // Mecanismo de mudança de foco utilizando um elemento externo para forçar o blur na shadow tree
    await new Promise((resolve) => {
        requestAnimationFrame(() => {
            document.getElementById('externalInput').focus();
            setTimeout(resolve, 0);
        });
    });

    result.textContent = 'PASS';
}

runTest();
</script>
</body>
</html>
