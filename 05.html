<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
</head>
<body>
<pre id="log"></pre>
<script>
function log(message)
{
    document.getElementById('log').textContent += message + '\n';
}

log("Iniciando teste híbrido...");

// Touch document.fonts imediatamente
document.fonts;

const host = document.createElement("div");
document.body.appendChild(host);
const shadowRoot = host.attachShadow({ mode: "open" });

const fontFaceStyle = document.createElement("style");
// Usando a base64 pesada que mantinha o estado de loading ativo no seu teste anterior
const pendingUrl = 'data:font/woff;base64,' + 'A'.repeat(150000);
fontFaceStyle.textContent = `@font-face { font-family: reentryFont; src: url("${pendingUrl}"); }`
    + `.probe { font: 24px reentryFont; }`;
shadowRoot.appendChild(fontFaceStyle);

const probe = document.createElement("span");
probe.className = "probe";
probe.textContent = "A";
shadowRoot.appendChild(probe);

document.body.offsetHeight; // Força layout
document.fonts.load("24px reentryFont", "A");
log("document.fonts.status: " + document.fonts.status);

// Materializa a promessa ready
document.fonts.ready;

// Prepend para criar o estado pendente UpdateType::ActiveSet
const prependedStyle = document.createElement("style");
prependedStyle.textContent = ".unused { color: red; }";
shadowRoot.prepend(prependedStyle);
log('apos prepend. status=' + document.fonts.status);

let getterCallCount = 0;
Object.defineProperty(FontFaceSet.prototype, "then", {
    configurable: true,
    get() {
        delete FontFaceSet.prototype.then;
        ++getterCallCount;
        log('>>> GETTER DISPAROU! count=' + getterCallCount);
        log('    status no momento: ' + document.fonts.status);
        host.remove(); // Remove o host
        log('    apos host.remove()');
        return undefined;
    }
});

log('Tentando gatilho de estilo...');

// Testando o flush síncrono com a execução inline
document.styleSheets.length;

log("FontFaceSet.prototype.then getter calls: " + getterCallCount);
log("Fim do script.");
</script>
</body>
</html>
