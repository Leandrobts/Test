<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'TestFont';
    src: url('data:font/woff;base64,d09GRgABAAAAAA==');
  }
  iframe {
    content: url();
    zoom: 0.01;
    font-family: 'TestFont';
  }
</style>
</head>
<body>

<iframe id="i0"></iframe>

<script>
  window.addEventListener('load', () => {
    const i0 = document.getElementById('i0');

    // Injeta frameset
    document.documentElement.append(document.createElement('frameset'));

    // Força resolução de fontes assíncronas para disparar relayout em cascata
    if (document.fonts) {
      document.fonts.load('12px "TestFont"').then(() => {
        i0.focus();
        i0.style.zoom = '1.0';
        void i0.offsetHeight;
        i0.remove();
      });
    }
  });
</script>
</body>
</html>
