<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 XSLT Delayed Import - Static Variant</title>

<style>
body {
    background: #111;
    color: #ddd;
    font-family: Arial, sans-serif;
    margin: 20px;
}

#log {
    background: #000;
    border: 1px solid #555;
    padding: 12px;
    white-space: pre-wrap;
    font-family: monospace;
    min-height: 260px;
}

iframe {
    width: 100%;
    height: 120px;
    margin-top: 15px;
    border: 1px solid #555;
}
</style>
</head>

<body>

<h2>XSLT Delayed Import - GitHub Pages Variant</h2>

<div id="log"></div>

<iframe id="f" src="resources/target.xml"></iframe>

<script>
(function () {
    var output = document.getElementById("log");
    var frame = document.getElementById("f");

    function log(message) {
        output.textContent += message + "\n";
    }

    function triggerEmbeddedPI() {
        try {
            var doc = frame.contentDocument;

            if (!doc) {
                log("[500ms] ERROR: contentDocument unavailable");
                return;
            }

            log("[500ms] XML document acquired");
            log("[500ms] Creating embedded xml-stylesheet PI");

            var pi = doc.createProcessingInstruction(
                "xml-stylesheet",
                'type="text/xsl" href="#x"'
            );

            doc.insertBefore(pi, doc.firstChild);

            log("[500ms] PI inserted");

            pi.parentNode.removeChild(pi);

            log("[500ms] PI removed");

        } catch (e) {
            log("[500ms] Exception: " + e);
        }
    }

    function loadGrandchildVariant() {
        try {
            var doc = frame.contentDocument;

            if (!doc) {
                log("[1000ms] ERROR: contentDocument unavailable");
                return;
            }

            log("[1000ms] Introducing grandchild stage");

            /*
             * Remove the current xml-stylesheet PI if present.
             * Then install a new one pointing to root-delayed.xml.
             *
             * This causes a new stylesheet parsing/loading path
             * without requiring a dynamic HTTP endpoint.
             */

            var oldPI = null;
            var node = doc.firstChild;

            while (node) {
                if (node.nodeType === 7 &&
                    node.target === "xml-stylesheet") {
                    oldPI = node;
                    break;
                }

                node = node.nextSibling;
            }

            if (oldPI)
                oldPI.parentNode.removeChild(oldPI);

            var newPI = doc.createProcessingInstruction(
                "xml-stylesheet",
                'type="text/xsl" href="root.xsl?grandchild=1"'
            );

            doc.insertBefore(newPI, doc.firstChild);

            log("[1000ms] New stylesheet PI inserted");

        } catch (e) {
            log("[1000ms] Exception: " + e);
        }
    }

    log("[0ms] Test started");
    log("[0ms] Loading target.xml");
    log("[0ms] Initial chain:");
    log("       target.xml -> root.xsl -> child.xsl");

    setTimeout(function () {
        triggerEmbeddedPI();
    }, 500);

    setTimeout(function () {
        loadGrandchildVariant();
    }, 1000);

    setTimeout(function () {
        log("[3500ms] Test completed");
        log("[3500ms] Browser still alive");
    }, 3500);

})();
</script>

</body>
</html>
