<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Real IntersectionObserver GC - PS4</title>
    <style>
        body {
            background-color: #121212;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #ffffff;
            font-size: 18px;
            border-bottom: 2px solid #00ff66;
            padding-bottom: 10px;
        }
        #console {
            background-color: #000000;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 5px;
            height: 70vh;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 13px;
            line-height: 1.4;
        }
        .log { color: #cccccc; }
        .success { color: #00ff66; font-weight: bold; }
        .error { color: #ff3333; font-weight: bold; }
        .info { color: #33ccff; }
    </style>
</head>
<body>

    <h1>Teste Real WebKit (Commit 9d19688 - IntersectionObserver) - PS4</h1>
    <div id="console">Iniciando teste de estresse de observadores e GC...</div>
    <div id="tails" style="display:none;"></div>

    <script>
        const consoleEl = document.getElementById('console');

        function log(message, type = 'log') {
            const span = document.createElement('div');
            span.className = type;
            span.textContent = message;
            consoleEl.appendChild(span);
            consoleEl.scrollTop = consoleEl.scrollHeight;
            console.log(message);
        }

        try {
            log("[Info] Inicializando parâmetros idênticos ao teste do WebKit...", "info");

            const NFDIV = 512;     // Reduzido de 1024 para segurança de memória no PS4, mantendo a proporção
            const NWALK = 4;       
            const NSLICE = 2;      
            const NWAVES = 4;      // Reduzido de 6 para estabilidade em console
            const RIPE_MS = 400;   
            const STEP_MS = 250;   
            const WAVE_MS = 700;   

            const tailsBox = document.getElementById("tails");
            const keep = [];

            function makeWave() {
                // Equivalente fiel: cria um documento HTML isolado via document.implementation
                const frameless = document.implementation.createHTMLDocument("");
                const divs = new Array(NFDIV);
                for (let i = 0; i < NFDIV; ++i)
                    divs[i] = frameless.body.appendChild(frameless.createElement("div"));

                for (let w = 0; w < NWALK; ++w) {
                    const tail = tailsBox.appendChild(document.createElement("div"));
                    keep.push(tail);
                    const walker = new IntersectionObserver(() => { });
                    for (let i = NFDIV - 1; i >= 0; --i)
                        walker.observe(divs[i]);
                    walker.observe(tail);
                }

                const sliceSize = NFDIV / NSLICE;
                const pins = [];
                for (let j = 0; j < NSLICE; ++j) {
                    const pin = new IntersectionObserver(() => { });
                    for (let i = j * sliceSize; i < (j + 1) * sliceSize; ++i)
                        pin.observe(divs[i]);
                    pins.push(pin);
                }
                return { pins, born: performance.now(), fired: 0 };
            }

            let waves = [makeWave()];
            let wavesMade = 1;
            let lastWave = performance.now();

            // Lastreamento de memória igual ao teste original para forçar o GC
            const ballast = [];
            for (let i = 0; i < 15000; ++i)
                ballast.push({ i, s: "b" + (i & 1023) });

            function step() {
                const now = performance.now();

                for (const wave of waves) {
                    while (wave.fired < NSLICE && (now - wave.born) >= RIPE_MS + wave.fired * STEP_MS) {
                        const pin = wave.pins[wave.fired++];
                        const burst = [];
                        for (let i = 0; i < 100000; ++i)
                            burst.push({ x: i, y: [i] });
                        const tail = tailsBox.appendChild(document.createElement("div"));
                        keep.push(tail);
                        pin.observe(tail);
                    }
                }

                waves = waves.filter(wave => wave.fired < NSLICE);
                if (now - lastWave >= WAVE_MS && wavesMade < NWAVES) {
                    lastWave = now;
                    ++wavesMade;
                    log(`Progresso: Onda ${wavesMade} de ${NWAVES} gerada.`, "info");
                    waves.push(makeWave());
                }

                if (!waves.length && wavesMade >= NWAVES) {
                    log("\nPASS did not crash", "success");
                    log("SUCESSO: O teste completou o ciclo de ondas e desalocações sem falhas na tela do PS4!", "success");
                    return;
                }

                // Lixo gerado iterativamente para forçar limpezas de heap
                const garbage = [];
                for (let i = 0; i < 10000; ++i)
                    garbage.push({ a: i, b: [i, now] });

                setTimeout(step, 50);
            }

            log("[Info] Executando ondas de IntersectionObserver e pressão de GC...", "info");
            step();

        } catch (error) {
            log(`\nERRO NO TESTE: ${error.message}`, "error");
            if (error.stack) log(error.stack, "error");
        }
    </script>
</body>
</html>
