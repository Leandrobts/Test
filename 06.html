
<!doctype html>
<input id="a">
<iframe id="f" tabindex="0" srcdoc="<input tabindex='0'><script>parent.x=document.querySelector('input')<\/script>"></iframe>
<script>
var a=document.getElementById("a");
var f=document.getElementById("f");

f.onload=function(){
    setTimeout(function(){
        var x=window.x;
        window.x=null;

        a.onblur=function(){
            document.adoptNode(x);
            x=null;
            f.remove();
            f=null;
        };

        a.focus();

        a.dispatchEvent(new KeyboardEvent("keydown",{
            bubbles:true,
            cancelable:true,
            key:"Tab",
            code:"Tab"
        }));
    },100);
};
</script>
