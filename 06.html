<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Consuming form data with empty blob (PS4)</title>
</head>
<body>
<button id="run">Rodar teste</button>
<pre id="log"></pre>
<script>
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

function log(msg) {
    document.getElementById('log').textContent += msg + '\n';
}

function sleep(ms) {
    return new Promise(function(resolve) {
        setTimeout(resolve, ms);
    });
}

function createBlobWithoutIDB() {
    return new Promise(function(resolve) {
        if (typeof fetch === 'function' && typeof URL !== 'undefined' && typeof URL.createObjectURL === 'function') {
            var url = URL.createObjectURL(new Blob(['aa']));
            fetch(url).then(function(resp) {
                URL.revokeObjectURL(url);
                gc();
                return resp.blob();
            }).then(function(blob) {
                gc();
                resolve(blob);
            }).catch(function() {
                gc();
                resolve(new Blob(['aa']));
            });
        } else {
            gc();
            resolve(new Blob(['aa']));
        }
    });
}

function runOnce() {
    return createBlobWithoutIDB().then(function(blob) {
        return sleep(100).then(function() {
            var formData = new FormData();
            formData.append('a', blob);

            var response = new Response(formData);
            Object.prototype.__defineGetter__('then', function() {
                response = null;
                gc();
            });

            return response.arrayBuffer();
        });
    });
}

document.getElementById('run').onclick = function() {
    log('Iniciando...');
    var chain = Promise.resolve();
    for (var i = 0; i < 20; i++) {
        (function(idx) {
            chain = chain.then(function() {
                return runOnce().then(function() {
                    log('Iteracao ' + idx + ': concluida');
                }, function(err) {
                    log('Iteracao ' + idx + ': rejeitada (' + (err && err.message ? err.message : err) + ')');
                });
            });
        })(i);
    }
    chain.catch(function(err) {
        log('Erro geral: ' + (err && err.message ? err.message : err));
    });
};
</script>
</body>
</html>
