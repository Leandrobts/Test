<!DOCTYPE html>
<html>
<body>
<div id="status">Executando teste de fechamento de camadas...</div>
<script>
let cycle = 0;
const maxCycles = 30;

function finish() {
    document.getElementById("status").textContent = "PASS if no crash in the UI process during page close.";
    console.log("Teste concluído com sucesso!");
}

function runCycle() {
    if (cycle++ >= maxCycles)
        return finish();

    // Abre um popup para simular o ciclo de criação e destruição do RemoteLayerTreeEventDispatcher
    let popup = window.open("about:blank", "", "width=200,height=200");
    if (!popup) {
        console.warn("Pop-up bloqueado pelo navegador. Permitir pop-ups para executar o teste completo.");
        return finish();
    }

    // Injeta o conteúdo com animações aceleradas e will-change para engajar a thread de rolagem/renderização
    popup.document.body.innerHTML =
        '<div style="width:50px;height:50px;background:green;animation:s 10s linear infinite;will-change:transform"></div>' +
        '<style>@keyframes s{from{transform:rotate(0)}to{transform:rotate(360deg)}}</style>';

    // Aguarda dois rAFs para registrar os observadores de display link e agendar o timer na thread de scrolling
    popup.requestAnimationFrame(() => {
        popup.requestAnimationFrame(() => {
            try {
                popup.close();
            } catch (e) {
                // Ignora erros caso o popup já tenha sido fechado
            }
            // Repete o ciclo rapidamente para forçar a condição de corrida
            setTimeout(runCycle, 0);
        });
    });
}

// Inicia o primeiro ciclo
runCycle();
</script>
</body>
</html>
