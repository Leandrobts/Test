<!DOCTYPE html>
<html>
<body>
<button id="run">run</button>
<script>
function runTest() {
    const dummies = [];
    for (let i = 0; i < 600; i++) {
        const c = document.createElement('canvas');
        c.width = 1;
        c.height = 1;
        const ctx = c.getContext('2d');
        ctx.font = '10px "dummy' + i + '"';
        dummies.push(c, ctx);
    }

    const pendingFontURL = 'url("data:font/ttf;base64,' + 'A'.repeat(1100000) + '")';
    const keepAlive = [];

    for (let attempt = 0; attempt < 8; attempt++) {
        const metricsDonor = new FontFace('metricsDonor' + attempt, pendingFontURL);
        const measured = new FontFace('measured' + attempt, pendingFontURL, { unicodeRange: 'U+13A0-13FF' });
        document.fonts.add(metricsDonor);
        document.fonts.add(measured);

        const c = document.createElement('canvas');
        c.width = 64;
        c.height = 64;
        const ctx = c.getContext('2d');
        ctx.font = '10px metricsDonor' + attempt + ', measured' + attempt;
        keepAlive.push(metricsDonor, measured, c, ctx);

        const tm = ctx.measureText('\u13A0\u13A2\u13A4');
        void tm.fontBoundingBoxAscent;
        void tm.fontBoundingBoxDescent;
        void tm.emHeightAscent;
        void tm.emHeightDescent;
        void tm.hangingBaseline;
        void tm.ideographicBaseline;
    }
}

document.getElementById('run').addEventListener('click', runTest);
</script>
</body>
</html>
