<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<pre id="log"></pre>
<script>
var output = document.getElementById("log");

function log(s) {
    output.textContent += s + "\n";
}

function test(name, object) {
    if (!object) {
        log(name + ": indisponivel");
        return;
    }

    var proto = Object.getPrototypeOf(object);
    var count = 0;

    try {
        Object.defineProperty(proto, "then", {
            configurable: true,
            get: function() {
                count++;
                log(name + ": getter executado " + count);
                return undefined;
            }
        });

        Promise.resolve(object).then(function() {
            log(name + ": Promise concluida");
        });

    } catch (e) {
        log(name + ": ERRO " + e);
    }
}

log("FontFace: " + typeof FontFace);
log("FontFaceSet: " + typeof FontFaceSet);
log("FontLoader: " + typeof FontLoader);
log("document.fonts: " + typeof document.fonts);

test("document.fonts", document.fonts);

if (typeof FontFace === "function") {
    try {
        test("FontFace", new FontFace(
            "TesteFonte", "local(Helvetica)"
        ));
    } catch (e) {
        log("Criacao FontFace: " + e);
    }
}
</script>
</body>
</html>
