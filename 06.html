<!DOCTYPE html>
<html>
<body>
<script>
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }

    for (var i = 0; i < 10000; i++)
        gcRec(10);
}



const style = document.createElement("style");
document.head.appendChild(style);
const sheet = style.sheet;
sheet.insertRule(".outer { color: red; & .nested { color: blue; } }", 0);

let nestedRules = sheet.cssRules[0].cssRules;
sheet.deleteRule(0);
gc();

const nested = nestedRules[0];
nestedRules = null;


document.write(nested.parentRule === null ? "PASS" : "FFAIL: parentRule is " + nested.parentRule);
</script>
</body>
</html>
