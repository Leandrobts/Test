<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LazyLoadVideoObserver UAF</title>
</head>
<body>

<p id="result">FAIL</p>

<script>
function gc() {
    function gcRec(n) {
          if (n < 1)
              return {};
          var temp = {i: "ab" + i + (i / 100000)};
          temp += "foo";
          gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
    gcRec(10);
}

function createVideoInDetachedDocument() {
    const detachedDocument = document.implementation.createHTMLDocument("");
    return detachedDocument.createElementNS("http://www.w3.org/1999/xhtml", "video");
}

(async function () {
    const video = createVideoInDetachedDocument();

    await new Promise(resolve => setTimeout(resolve, 0));

    gc();

    video.cloneNode(false);

    document.getElementById("result").textContent = "PASS";
})();
</script>

</body>
</html>
