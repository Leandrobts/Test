

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PS4 - Canvas Boundary Test</title>
<script src="resources/testharness.js"></script>
<script src="resources/testharnessreport.js"></script>
</head>
<body>
<h2>PS4 - Canvas Boundary Test</h2>

<script>
function configureCanvas(width, height)
{
    return new Promise(function(resolve) {
        var canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;

        var result = false;

        try {
            var ctx = canvas.getContext("2d");

            if (ctx) {
                ctx.fillStyle = "rgb(255,0,0)";
                ctx.fillRect(0, 0, 1, 1);

                ctx.fillStyle = "rgb(0,255,0)";
                ctx.fillRect(width - 1, height - 1, 1, 1);

                var first = ctx.getImageData(0, 0, 1, 1).data;
                var last = ctx.getImageData(
                    width - 1, height - 1, 1, 1
                ).data;

                result =
                    first[0] === 255 &&
                    first[1] === 0 &&
                    first[2] === 0 &&
                    first[3] === 255 &&
                    last[0] === 0 &&
                    last[1] === 255 &&
                    last[2] === 0 &&
                    last[3] === 255;
            }
        } catch (e) {
            result = false;
        }

        canvas.width = 0;
        canvas.height = 0;

        resolve(result);
    });
}

promise_test(async function(t) {
    assert_true(await configureCanvas(32767, 1));
    assert_false(await configureCanvas(32768, 1));
    assert_true(await configureCanvas(1, 32767));
    assert_false(await configureCanvas(1, 32768));
}, "Test big canvas dimensions.");

</script>
</body>
</html>
