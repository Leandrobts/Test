<script>
if (window.testRunner)
    testRunner.dumpAsText();

function main() {
    try { document.execCommand("redo", false, null); } catch (e) { }
    
    // Evita o bug visual do "null" causados pelo document.write tardio
    try {
        var msg = document.createElement('div');
        msg.textContent = 'Test passes if it does not crash.';
        document.body.appendChild(msg);
    } catch (e) {
        document.write('Test passes if it does not crash.');
    }

    // Dispara o fluxo de edição de forma garantida após o carregamento da árvore
    setTimeout(f4, 50);
}

function f1() {
    var x6 = document.getElementById("x9");
    var x29 = document.getElementById("x29");
    try { 
        if (x29 && x6) x29.before(x6); 
    } catch (e) { }
    
    try { document.execCommand("undo", false, null); } catch (e) { }
}

function f4() {
    try { document.onreadystatechange = f4; } catch (e) { }
    try { document.execCommand("forwardDelete", false, null); } catch (e) { }
    try { document.execCommand("selectAll", false, null); } catch (e) { }
    
    try { 
        var x20 = document.getElementById("x20");
        if (x20 && typeof x20.toBlob === "function") {
            x20.toBlob(f1); 
        } else {
            f1();
        }
    } catch (e) { 
        f1();
    }
    
    try { document.execCommand("insertText", false, " "); } catch (e) { }
}
</script>

</cite>

</iframe>
<canvas id="x20" onfocusin="f1()" onfocus="f4()"></canvas>
</h3>

</details>
