<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 XSLT Static Delayed Chain Test</title>

<style>
body {
    background: #111;
    color: #ddd;
    font-family: Arial, sans-serif;
    margin: 20px;
}

#log {
    background: #000;
    border: 1px solid #555;
    padding: 12px;
    white-space: pre-wrap;
    font-family: monospace;
    min-height: 280px;
}

iframe {
    width: 100%;
    height: 150px;
    margin-top: 15px;
    border: 1px solid #555;
}
</style>
</head>

<body>

<h2>XSLT Delayed Import - Static GitHub Pages Variant</h2>

<div id="log"></div>

<iframe id="f" src="resources/target.xml"></iframe>

<script>
(function () {

    var output = document.getElementById("log");
    var frame = document.getElementById("f");

    function log(message) {
        output.textContent += message + "\n";
    }

    function getXMLDocument() {
        try {
            return frame.contentDocument;
        } catch (e) {
            log("ERROR accessing contentDocument: " + e);
            return null;
        }
    }

    /*
     * 500 ms
     *
     * Same basic operation used by the original LayoutTest:
     * create an embedded xml-stylesheet ProcessingInstruction,
     * insert it, then immediately remove it.
     */
    function triggerEmbeddedPI() {

        var doc = getXMLDocument();

        if (!doc) {
            log("[500ms] contentDocument unavailable");
            return;
        }

        try {
            log("[500ms] Creating embedded xml-stylesheet PI");

            var pi = doc.createProcessingInstruction(
                "xml-stylesheet",
                'type="text/xsl" href="#x"'
            );

            doc.insertBefore(pi, doc.firstChild);

            log("[500ms] PI inserted");

            pi.parentNode.removeChild(pi);

            log("[500ms] PI removed");

        } catch (e) {
            log("[500ms] Exception: " + e);
        }
    }

    /*
     * Finds the current external xml-stylesheet PI.
     */
    function findExternalStyleSheetPI(doc) {

        var node = doc.firstChild;

        while (node) {

            if (node.nodeType === 7 &&
                node.target === "xml-stylesheet") {

                var data = node.data || "";

                if (data.indexOf("href=") !== -1)
                    return node;
            }

            node = node.nextSibling;
        }

        return null;
    }

    /*
     * 1000 ms
     *
     * Replace the initial stylesheet chain:
     *
     * root-initial.xsl
     *      ?
     * child-initial.xsl
     *
     * with:
     *
     * root-with-grandchild.xsl
     *      ?
     * child-with-grandchild.xsl
     *      ?
     * grandchild.xsl
     */
    function installGrandchildChain() {

        var doc = getXMLDocument();

        if (!doc) {
            log("[1000ms] contentDocument unavailable");
            return;
        }

        try {

            log("[1000ms] Switching to grandchild chain");

            var oldPI = findExternalStyleSheetPI(doc);

            if (oldPI) {
                oldPI.parentNode.removeChild(oldPI);
                log("[1000ms] Initial stylesheet PI removed");
            } else {
                log("[1000ms] Initial stylesheet PI not found");
            }

            var newPI = doc.createProcessingInstruction(
                "xml-stylesheet",
                'type="text/xsl" href="root-with-grandchild.xsl"'
            );

            doc.insertBefore(newPI, doc.firstChild);

            log("[1000ms] New stylesheet PI inserted");
            log("[1000ms] New chain:");
            log("          root-with-grandchild.xsl");
            log("              -> child-with-grandchild.xsl");
            log("                  -> grandchild.xsl");

        } catch (e) {
            log("[1000ms] Exception: " + e);
        }
    }

    log("[0ms] Test started");
    log("[0ms] Loading initial XSL chain:");
    log("      target.xml");
    log("          -> root-initial.xsl");
    log("              -> child-initial.xsl");

    setTimeout(function () {
        triggerEmbeddedPI();
    }, 500);

    setTimeout(function () {
        installGrandchildChain();
    }, 1000);

    setTimeout(function () {
        log("[3500ms] Test completed");
        log("[3500ms] Browser still running");
    }, 3500);

})();
</script>

</body>
</html>
