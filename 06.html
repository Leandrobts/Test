<!DOCTYPE html>
<body>
<script>
function gc() {
    function gcRec(n) {
          if (n < 1)
              return {};
          var temp = {i: "ab" + i + (i / 100000)};
          temp += "foo";
          gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
    gcRec(10);
}

const canvas = document.createElement("canvas");

let contextFromListener;
canvas.addEventListener("webglcontextcreationerror", () => {
    contextFromListener = canvas.getContext("2d");
});

const ctx = canvas.getContext("2d");

gc();

const log = [
    `ctx = ${ctx}`,
    `context from listener = ${contextFromListener ? contextFromListener.constructor.name : undefined}`,
    `its canvas is the same element = ${ctx ? ctx.canvas === canvas : false}`,
    `it still owns the slot = ${ctx === canvas.getContext("2d")}`,
    "PASS if no crash.",
];
document.body.appendChild(document.createElement("pre")).textContent = log.join("\n");
</script>
