<!DOCTYPE html>
<html>
<body>
<p>This test passes if it does not crash.</p>
<div id="host"></div>
<div id="result"></div>
<script>

function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
         temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);
}


let shadowRoot = host.attachShadow({ mode: 'open' });

let victim = document.createElement('div');

victim.tabIndex = 0;
victim.textContent = 'Focusable';

shadowRoot.appendChild(victim);

victim.focus();


async function runTest() {

    document.addEventListener('blur', () => {

        victim.remove();

        victim = null;

        gc();

    }, true);


    /*
     * Original:
     *
     * await UIHelper.setWindowIsKey(false);
     *
     * PS4 replacement:
     *
     * Press the physical PS button and return
     * to the PS4 Home screen.
     *
     * The PS4 Web Content Guidelines state that
     * this produces window.onblur.
     */


    result.textContent =
        'READY - PRESS PS BUTTON TO LEAVE BROWSER';


    /*
     * Keep the document alive and give the focus
     * state time to settle before the external
     * window deactivation.
     */

    await new Promise((resolve) => {

        requestAnimationFrame(() => {
            setTimeout(resolve, 0);
        });

    });


    /*
     * We cannot wait for the PS button from JavaScript.
     *
     * The test now waits for the real window deactivation.
     */

    result.textContent =
        'READY - PRESS PS BUTTON NOW';


    /*
     * After returning to the browser, allow any
     * pending event-loop work to execute.
     */

    await new Promise((resolve) => {

        requestAnimationFrame(() => {
            setTimeout(resolve, 0);
        });

    });


    result.textContent = 'PASS';
}


runTest();

</script>
</body>
</html>
