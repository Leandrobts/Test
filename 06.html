
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PS4 Canvas Boundary Test</title>
</head>
<body>
<h2>PS4 - Canvas Boundary Test</h2>
<pre id="resultado">Iniciando...</pre>

<script>
(function () {
  var out = document.getElementById("resultado");
  var texto = "";

  function log(s) {
    texto += s + "\n";
    out.textContent = texto;
  }

  var casos = [
    [32767, 1],
    [32768, 1],
    [1, 32767],
    [1, 32768]
  ];

  function testar(w, h) {
    log("\nTESTE: " + w + " x " + h);

    var canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;

    var ctx = canvas.getContext("2d");

    if (!ctx) {
      log("RESULTADO: CONTEXTO INDISPONIVEL");
      return;
    }

    try {
      ctx.fillStyle = "rgb(255,0,0)";
      ctx.fillRect(0, 0, 1, 1);

      ctx.fillStyle = "rgb(0,255,0)";
      ctx.fillRect(w - 1, h - 1, 1, 1);

      var inicio = ctx.getImageData(0, 0, 1, 1).data;
      var fim = ctx.getImageData(w - 1, h - 1, 1, 1).data;

      var inicioOK =
        inicio[0] === 255 &&
        inicio[1] === 0 &&
        inicio[2] === 0 &&
        inicio[3] === 255;

      var fimOK =
        fim[0] === 0 &&
        fim[1] === 255 &&
        fim[2] === 0 &&
        fim[3] === 255;

      log("Pixel inicial: " +
        (inicioOK ? "OK" : "FALHOU"));

      log("Pixel final: " +
        (fimOK ? "OK" : "FALHOU"));

      log("RESULTADO: " +
        (inicioOK && fimOK ? "PASS" : "FAIL"));

    } catch (e) {
      log("ERRO: " + e.name);
      log(e.message);
    }

    canvas.width = 0;
    canvas.height = 0;
  }

  for (var i = 0; i < casos.length; i++) {
    testar(casos[i][0], casos[i][1]);
  }

  log("\nTESTE FINALIZADO");
})();
</script>
</body>
</html>
