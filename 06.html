<!DOCTYPE html>
<html>
<body>
<div id="host" style="display:none"></div>
<script>

var host = document.getElementById('host');
var sr = host.attachShadow({mode: 'open'});
sr.innerHTML = '<picture id="pic"><source srcset="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"><img></picture>';
var pic = sr.getElementById('pic');

pic.addEventListener('load', function listener() {
    pic.removeEventListener('load', listener, true);   
    pic.textContent = '';   

    // Criação do elemento <dialog> dinamicamente para usar a API moderna
    var dialog = document.createElement('dialog');
    dialog.innerHTML = '<iframe src="resources/self-closing-modal-dialog2.html" style="border:none; width:100px; height:100px;"></iframe>';
    document.body.appendChild(dialog);

    // .showModal() é chamado na instância do elemento criado
    if (typeof dialog.showModal === 'function') {
        dialog.showModal();
    }

    setTimeout(function() {
        document.write('PASS if no crash.');
    }, 0);
}, /*capture*/ true);
</script>
</body>
</html>
