<!DOCTYPE html>
<html>
<body>
This test passes if it doesn't crash.
    <button onclick="popupReloaded()">Trigger UAF</button><br><br>
    
    <iframe id="target_frame" width="100" height="100"></iframe>
<script>

function popupReloaded(){
    var frame = document.getElementById("target_frame");
            if (!frame) return;
            frame.webkitRequestFullscreen();
            setTimeout(() => {
                frame.remove();        
            }, 15);
}

open("resources/pending-requestAnimationFrame-upon-destruction-popup.html");
</script>
</body>
</html>
