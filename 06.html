<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>PS4 WebKit Autofill Compatibility</title>
<style>body{font:15px monospace;background:#171b24;color:#e9eef7;padding:15px}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{padding:10px;margin:4px}input{padding:7px} .ok{color:#9fdcae}</style></head><body>
<h2>PS4 WebKit - Compatibilidade Autofill / Eventos</h2>
<p>Diagnostico seguro para WebKit antigo. Nao executa o teste de UAF.</p>
<button type="button" onclick="runTests()">Executar verificacoes</button>
<button type="button" onclick="downloadReport()">Salvar relatorio TXT</button>
<p>Campo de teste (clique e digite normalmente): <input id="probe" type="text" autocomplete="on" placeholder="Campo de teste" /></p>
<pre id="report">Aguardando...</pre>
<script type="text/javascript">
var reportText='';
function log(s){reportText+=s+'\n';document.getElementById('report').textContent=reportText;}
function check(name,fn){try{log(name+': '+fn());}catch(e){log(name+': ERRO '+(e.name||'Exception')+' - '+(e.message||e));}}
function runTests(){
reportText='';
log('PS4 WebKit - commit fac72c77 - diagnostico de APIs');
check('User agent',function(){return navigator.userAgent;});
check('document.documentMode',function(){return typeof document.documentMode;});
check('HTMLInputElement',function(){return typeof window.HTMLInputElement;});
check('createElement input',function(){return document.createElement('input').tagName;});
check('input.type password',function(){var x=document.createElement('input');x.type='password';return x.type;});
check('input.type button (fora de evento)',function(){var x=document.createElement('input');x.type='password';x.type='button';return x.type;});
check('setAttribute type (fora de evento)',function(){var x=document.createElement('input');x.setAttribute('type','password');x.setAttribute('type','text');return x.type;});
check('input.autocomplete',function(){var x=document.createElement('input');return typeof x.autocomplete;});
check('input.webkitAutoFillButtonType',function(){return typeof document.getElementById('probe').webkitAutoFillButtonType;});
check('input.webkitMatchesSelector',function(){return typeof document.getElementById('probe').webkitMatchesSelector;});
check('CSS :-webkit-autofill',function(){var x=document.getElementById('probe');try{if(x.webkitMatchesSelector)return x.webkitMatchesSelector(':-webkit-autofill');if(x.matches)return x.matches(':-webkit-autofill');return 'sem metodo matches';}catch(e){return 'seletor indisponivel: '+e.name;}});
check('addEventListener',function(){return typeof document.getElementById('probe').addEventListener;});
check('attachEvent (legado)',function(){return typeof document.getElementById('probe').attachEvent;});
check('dispatchEvent',function(){return typeof document.getElementById('probe').dispatchEvent;});
check('document.createEvent',function(){return typeof document.createEvent;});
check('MouseEvent constructor',function(){return typeof window.MouseEvent;});
check('Event constructor',function(){return typeof window.Event;});
check('Event.composedPath',function(){return window.Event&&Event.prototype?typeof Event.prototype.composedPath:'indisponivel';});
check('Event.path (nao padrao)',function(){return window.Event&&Event.prototype?typeof Event.prototype.path:'indisponivel';});
check('Element.click',function(){return typeof document.getElementById('probe').click;});
check('Element.attachShadow',function(){return typeof document.getElementById('probe').attachShadow;});
check('Element.createShadowRoot (antigo)',function(){return typeof document.getElementById('probe').createShadowRoot;});
check('Element.webkitCreateShadowRoot (legado)',function(){return typeof document.getElementById('probe').webkitCreateShadowRoot;});
check('Element.shadowRoot',function(){return typeof document.getElementById('probe').shadowRoot;});
check('document.querySelector',function(){return typeof document.querySelector;});
check('Element.querySelectorAll',function(){return typeof document.getElementById('probe').querySelectorAll;});
check('Array.from',function(){return typeof Array.from;});
check('Array.prototype.find',function(){return typeof Array.prototype.find;});
check('Promise',function(){return typeof window.Promise;});
check('MutationObserver',function(){return typeof window.MutationObserver;});
check('WebKitMutationObserver (antigo)',function(){return typeof window.WebKitMutationObserver;});
check('internals',function(){return typeof window.internals;});
check('internals.setAutofillButtonType',function(){return window.internals?typeof internals.setAutofillButtonType:'indisponivel';});
check('internals.shadowRoot',function(){return window.internals?typeof internals.shadowRoot:'indisponivel';});
check('internals.userAgentPart',function(){return window.internals?typeof internals.userAgentPart:'indisponivel';});
check('testRunner',function(){return typeof window.testRunner;});
check('eventSender',function(){return typeof window.eventSender;});
check('GCController',function(){return typeof window.GCController;});
check('UIHelper',function(){return typeof window.UIHelper;});
check('navigator.credentials',function(){return typeof navigator.credentials;});
check('input webkit pseudo style (indicativo)',function(){var x=document.getElementById('probe');return typeof window.getComputedStyle;});
log('NOTA: metodos C++ internos nao sao detectaveis por JavaScript.');
log('NOTA: Shadow DOM do agente de usuario normalmente nao e exposto ao site.');
log('FIM: nao confirma nem descarta a vulnerabilidade.');
}
function downloadReport(){if(!reportText){runTests();}var a=document.createElement('a');if(window.Blob&&window.URL&&URL.createObjectURL){var b=new Blob([reportText],{type:'text/plain'});a.href=URL.createObjectURL(b);a.download='ps4_autofill_relatorio.txt';document.body.appendChild(a);a.click();document.body.removeChild(a);}else{window.prompt('Copie o relatorio:',reportText);}}
if(window.addEventListener)window.addEventListener('load',runTests,false);else window.onload=runTests;
</script></body></html>
