<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Worker + Canvas Font Probe</title>
</head>
<body>
  <button id="runBtn" type="button">Executar teste</button>
  <pre id="log"></pre>

  <script>
    const logEl = document.getElementById('log');
    function log(msg) {
      logEl.textContent += msg + '\n';
    }

    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');

    const workerCode = `
      self.onmessage = function(ev) {
        const hasFonts = typeof self.fonts !== 'undefined';
        const hasFontFace = typeof self.FontFace !== 'undefined';
        const hasOffscreen = typeof self.OffscreenCanvas !== 'undefined';
        let added = 0;

        if (hasFonts && hasFontFace) {
          const tinyFontUrl = 'url("data:font/ttf;base64,AAEAAAASAQAABAAgR0RFRr==")';
          for (let i = 0; i < 16; i++) {
            try {
              const ff = new FontFace('wFont' + i, tinyFontUrl);
              self.fonts.add(ff);
              added++;
            } catch (e) {
              break;
            }
          }
        }

        self.postMessage({
          step: ev.data.step,
          hasFonts: hasFonts,
          hasFontFace: hasFontFace,
          hasOffscreen: hasOffscreen,
          added: added
        });
      };
    `;

    const blob = new Blob([workerCode], { type: 'application/javascript' });
    const workerUrl = URL.createObjectURL(blob);
    const worker = new Worker(workerUrl);

    worker.onmessage = function(ev) {
      log('Worker msg: ' + JSON.stringify(ev.data));
      if (ctx) {
        for (let i = 0; i < 60; i++) {
          ctx.font = (10 + (i % 15)) + 'px "wFont' + (i % 16) + '", sans-serif';
          ctx.measureText('\u13A0\u13A2\u13A4');
        }
        log('Main-thread measureText concluido no passo ' + ev.data.step);
      }
    };

    worker.onerror = function(err) {
      log('Worker error: ' + (err.message || 'erro'));
    };

    document.getElementById('runBtn').addEventListener('click', function() {
      log('Disparando passos...');
      for (let s = 0; s < 5; s++) {
        worker.postMessage({ step: s });
      }
    });
  </script>
</body>
</html>
