<!DOCTYPE html>
<html>
<body>
<script>
function gc() {
    
    var junk = [];

    for (var i = 0; i < 5000; i++)
        junk.push(new Array(100).join("TEST" + i));
}


const style = document.createElement("style");
document.head.appendChild(style);
const sheet = style.sheet;
sheet.insertRule(".outer { color: red; & .nested { color: blue; } }", 0);

let nestedRules = sheet.cssRules[0].cssRules;
sheet.deleteRule(0);
gc();

const nested = nestedRules[0];
nestedRules = null;
gc();

document.write(nested.parentRule === null ? "PASS" : "FAIL: parentRule is " + nested.parentRule);
</script>
</body>
</html>
