
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<pre id="log"></pre>
    <!-- Carrega e inicializa o painel de desenvolvedor Eruda -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
<script>
function runCanvasMainThreadTest() {
            log("[C++] Iniciando teste com Canvas normal na Main Thread...");
            
            let count = 0;
            const interval = setInterval(() => {
                // Cria um canvas normal na memória/DOM
                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                
                // Simula uma operação de desenho para testar o contexto
                if (ctx) {
                    ctx.fillStyle = "rgb(200, 0, 0)";
                    ctx.fillRect(10, 10, 50, 50);
                }
                
                setTimeout(() => {
                    // Remove referências para simular o ciclo de vida/limpeza
                    canvas.width = 0;
                    canvas.height = 0;
                }, 7 + Math.random() * 13);
                
                count++;
                if (count % 65 === 0) log(`Canvas normal iterações: ${count}`);
                if (count > 800) {
                    clearInterval(interval);
                    log("Teste finalizado.");
                }
            }, 13);
}

// Executa a função de teste
runCanvasMainThreadTest();
</script>
</body>
</html>
