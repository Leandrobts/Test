<!DOCTYPE html>

<html>
<body>

<p>This test passes if it does not crash.</p>

<div id="host"></div>
<div id="result"></div>

<script>

let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('div');

victim.tabIndex = 0;
victim.textContent = 'Focusable';

shadowRoot.appendChild(victim);
victim.focus();

function log(message) {
    result.textContent += message + '\n';
}

log('[1] ShadowRoot created');
log('[2] Victim appended');
log('[3] victim.focus() called');
log('[4] document.activeElement: ' +
    (document.activeElement ? document.activeElement.tagName : 'null'));
log('[5] shadowRoot.activeElement: ' +
    (shadowRoot.activeElement ? shadowRoot.activeElement.tagName : 'null'));

async function runTest() {

    document.addEventListener('blur', () => {

        log('[6] document blur captured');
        log('[7] victim exists before remove: ' + !!victim);

        victim.remove();

        log('[8] victim.remove() completed');

        victim = null;

        log('[9] victim reference cleared');

        gc();

        log('[10] gc() completed');

    }, true);

    window.addEventListener('blur', () => {
        log('[11] window blur event observed');
    });

    log('[12] Calling window.blur()');

    window.blur();

    log('[13] window.blur() returned');

    await new Promise((resolve) => {
        requestAnimationFrame(() => setTimeout(resolve, 0));
    });

    log('[14] Post-blur synchronization completed');
    log('[15] document.hasFocus(): ' + document.hasFocus());
    log('[16] Test completed');
}

function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

runTest();

</script>

</body>
</html>
