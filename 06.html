<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fullscreen Focus Lifecycle Test</title>
</head>
<body>

<button id="run">Run Test</button>

<div id="status">Iframe ready</div>

<iframe
    id="testFrame"
    style="width:300px;height:200px;border:1px solid black;">
</iframe>

<script src="resources/gc.js"></script>

<script>
var iframe = document.getElementById("testFrame");
var popup = null;
var focusTimer = null;

iframe.onload = function() {

    var doc = iframe.contentDocument;

    doc.open();
    doc.write(
        '<!DOCTYPE html>' +
        '<html>' +
        '<body>' +
        '<h3>Iframe</h3>' +
        '<div id="target" style="width:200px;height:150px;background:red"></div>' +
        '</body>' +
        '</html>'
    );
    doc.close();

    document.getElementById("status").innerHTML =
        "Iframe created and ready";
};

document.getElementById("run").onclick = function() {

    var status = document.getElementById("status");

    popup = window.open(
        "",
        "_blank",
        "width=400,height=300"
    );

    if (!popup) {
        status.innerHTML = "Popup blocked";
        return;
    }

    popup.document.open();

    popup.document.write(
        '<!DOCTYPE html>' +
        '<html>' +
        '<body>' +
        '<h3>Popup</h3>' +
        '<p>Focus target</p>' +
        '<div id="host"></div>' +
        '<div id="result"></div>' +

        '<script>' +

        'var host = document.getElementById("host");' +

        'var shadowRoot = host.attachShadow({ mode: "open" });' +

        'var victim = document.createElement("div");' +
        'victim.tabIndex = 0;' +
        'victim.textContent = "Focusable";' +
        'victim.style.width = "200px";' +
        'victim.style.height = "100px";' +
        'victim.style.background = "yellow";' +

        'shadowRoot.appendChild(victim);' +

        'victim.focus();' +

        'document.addEventListener("blur", function() {' +
        '    if (victim) {' +
        '        victim.remove();' +
        '        victim = null;' +
        '        if (typeof gc == "function") {' +
        '            gc();' +
        '        }' +
        '    }' +
        '}, true);' +

        'window.addEventListener("blur", function() {' +
        '    document.getElementById("result").textContent = "POPUP BLUR";' +
        '});' +

        'window.addEventListener("focus", function() {' +
        '    document.getElementById("result").textContent = "POPUP FOCUS";' +
        '});' +

        '<\/script>' +

        '</body>' +
        '</html>'
    );

    popup.document.close();

    status.innerHTML = "Popup opened";

    var frameDocument = iframe.contentDocument;
    var fullscreenElement = frameDocument.documentElement;

    if (fullscreenElement.webkitRequestFullscreen) {
        fullscreenElement.webkitRequestFullscreen();
    }

    setTimeout(function() {

        if (!popup || popup.closed)
            return;

        popup.focus();

        status.innerHTML =
            "Focus moved to popup";

        setTimeout(function() {

            window.focus();

            status.innerHTML =
                "Focus returned to main page";

            setTimeout(function() {

                try {
                    iframe.contentWindow.focus();
                } catch (e) {
                }

                status.innerHTML =
                    "Focus moved to iframe";

                setTimeout(function() {

                    if (popup && !popup.closed) {
                        popup.close();
                    }

                    status.innerHTML =
                        "Popup closed - waiting";

                    focusTimer = setInterval(function() {

                        if (!popup || popup.closed) {

                            clearInterval(focusTimer);

                            iframe.remove();

                            status.innerHTML =
                                "Iframe removed after popup close";
                        }

                    }, 20);

                }, 50);

            }, 50);

        }, 50);

    }, 50);
};

window.onblur = function() {
    document.getElementById("status").innerHTML =
        "MAIN PAGE BLUR";
};

window.onfocus = function() {
    document.getElementById("status").innerHTML =
        "MAIN PAGE FOCUS";
};
</script>

</body>
</html>
