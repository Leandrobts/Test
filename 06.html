<!DOCTYPE html>
<body>
<button onclick="go()">START</button>
<script>
function go() {
    var f = document.createElement("iframe");
    document.body.appendChild(f);

    var d = f.contentDocument;
    d.open();
    d.write("<body style='margin:0'><div style='height:1px'></div>");
    d.close();

    setTimeout(function () {
        d.body.firstChild.style.height = "100000px";
        f.remove();
    }, 0);

    setTimeout(function () {
        document.body.innerHTML = "PASS - no crash";
    }, 1000);
}
</script>
