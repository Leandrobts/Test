<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Teste de Regressão: Descarte de WebHeapAgent e console.takeHeapSnapshot()</title>
</head>
<body>
<div id="log">Executando teste...</div>

<script>
// Função utilitária de GC via alocação recursiva de memória
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 1000; i++)
        gcRec(10);
}

function runTest() {
    for (let i = 0; i < 50; i++) {
        // 1. Cria um iframe efêmero para instanciar e destruir novos contextos do Inspetor
        const iframe = document.createElement("iframe");
        document.body.appendChild(iframe);

        const iframeWindow = iframe.contentWindow;

        // 2. Invoca a API de Heap Snapshot via console
        if (iframeWindow.console && iframeWindow.console.takeHeapSnapshot) {
            iframeWindow.console.takeHeapSnapshot("Snapshot " + i);
        }

        // 3. Remove o iframe imediatamente sem um ciclo formal de disable() nos agentes
        document.body.removeChild(iframe);

        // 4. Força pressão no coletor para desalocar os agentes destruídos
        if (i % 5 === 0) {
            gc();
        }
    }
}

try {
    runTest();
    document.getElementById("log").innerText = "PASS: Descarte de contextos com takeHeapSnapshot sem Use-After-Free.";
} catch (e) {
    document.getElementById("log").innerText = "FAIL: " + e.message;
}
</script>
</body>
</html>
