<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Teste de Regressão: Race Condition em JSAttr::visitAdditionalChildren</title>
</head>
<body>
<div id="container"></div>
<div id="status">Executando teste...</div>

<script>
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 1000; i++)
        gcRec(10);
}

function runAttrGCRaceTest() {
    const container = document.getElementById("container");
    const heldAttrWrappers = [];

    for (let cycle = 0; cycle < 120; cycle++) {
        // 1. Cria elementos com atributos DOM
        const el = document.createElement("div");
        el.setAttribute("data-test", "val_" + cycle);
        el.setAttribute("id", "target_" + cycle);
        container.appendChild(el);

        // 2. Obtém os nós Attr diretamente para criar wrappers JSAttr
        const attr1 = el.getAttributeNode("data-test");
        const attr2 = el.getAttributeNode("id");

        // Retém os nós Attr vivos na heap JS
        heldAttrWrappers.push(attr1, attr2);

        // 3. Desanexa os atributos e destrói o elemento pai imediatamente
        el.removeAttributeNode(attr1);
        container.removeChild(el);

        // 4. Dispara pressão no GC concorrente enquanto mutações adicionais ocorrem
        if (cycle % 4 === 0) {
            // Força novas alocações e ativação da thread de marcação concorrente
            gc();
        }

        // Limpa parte das referências acumuladas periodicamente
        if (heldAttrWrappers.length > 50) {
            heldAttrWrappers.splice(0, 20);
        }
    }
}

try {
    runAttrGCRaceTest();
    setTimeout(() => {
        gc();
        document.getElementById("status").innerText = "PASS: Ciclos concorrentes de nós Attr e GC executados sem Use-After-Free.";
    }, 200);
} catch (e) {
    document.getElementById("status").innerText = "FAIL: " + e.message;
}
</script>
</body>
</html>
