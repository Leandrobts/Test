<!DOCTYPE html>
<!--
  render-tree-as-text-uaf — PS4 / Production Browser Compatible
  Original: WebKit commit 3f3fec2 (Cherry-pick 259548.232@safari-7615-branch)
  Bug: UAF in RenderTreeAsText::write() via view.layoutContext().layout()
  Fix: layout() call removed; externalRepresentation() handles full frame tree layout.

  SUBSTITUIÇÕES aplicadas (sem internals.*):
  +--------------------------------------------------------------------------------------------------+
  ¦ Original (WebKit layout-test only)              ¦ Substituto JS puro                             ¦
  +-------------------------------------------------+------------------------------------------------¦
  ¦ internals.settings                              ¦ try/catch — não existe equivalente JS          ¦
  ¦   .setAsyncFrameScrollingEnabled(true)          ¦ (configuração interna do engine WebKit)        ¦
  ¦   .setCaretBrowsingEnabled(true)                ¦ (configuração interna do engine WebKit)        ¦
  +-------------------------------------------------+------------------------------------------------¦
  ¦ if (window.testRunner)                          ¦ condicional mantida + output no DOM            ¦
  ¦   testRunner.dumpAsText()                       ¦ (infra de layout tests do WebKit)              ¦
  +-------------------------------------------------+------------------------------------------------¦
  ¦ s0.src = `data:text/javascript,...`             ¦ script inline (data: URI bloqueado por CSP    ¦
  ¦                                                 ¦ em vários contextos de produção)               ¦
  +-------------------------------------------------+------------------------------------------------¦
  ¦ caches.has('a').then(() => i0.focus())          ¦ Promise.resolve().then(() => iframe.focus())   ¦
  ¦                                                 ¦ — mesma semântica de microtask; caches.has()  ¦
  ¦                                                 ¦ era usado apenas para obter uma Promise        ¦
  ¦                                                 ¦ assíncrona, não pelo Cache em si               ¦
  +--------------------------------------------------------------------------------------------------+
-->
<html>
<head>
  <meta charset="utf-8">
  <title>render-tree-as-text-uaf (PS4 compatible)</title>
  <style>
    /* -- Estilos do teste original (mantidos idênticos) -- */
    iframe {
      content: url();   /* CSS interno do WebKit — ignorado em outros engines */
      zoom: 0.01;       /* escala extremamente pequena para forçar condição de layout */
    }

    /* -- UI de resultado (adicionado para visibilidade no PS4) -- */
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 640px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      overflow: hidden;
    }

    .card-header {
      padding: 16px 20px;
      background: #21262d;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #30363d;
    }

    .card-title {
      font-size: 13px;
      color: #8b949e;
      letter-spacing: 0.05em;
    }

    .card-body {
      padding: 20px;
    }

    #status-box {
      padding: 14px 16px;
      border-radius: 7px;
      border: 1px solid #30363d;
      background: #0d1117;
      font-size: 14px;
      color: #8b949e;
      transition: background 0.4s, border-color 0.4s, color 0.4s;
    }

    #status-box.pass {
      background: #0d2818;
      border-color: #238636;
      color: #3fb950;
    }

    #status-box.fail {
      background: #2d1114;
      border-color: #da3633;
      color: #f85149;
    }

    .divider {
      height: 1px;
      background: #21262d;
      margin: 16px 0;
    }

    #log {
      font-size: 12px;
      color: #8b949e;
      line-height: 2;
      min-height: 60px;
    }

    .log-entry { display: block; }
    .log-entry.ok  { color: #3fb950; }
    .log-entry.warn{ color: #d29922; }
    .log-entry.info{ color: #58a6ff; }

    .commit-ref {
      margin-top: 16px;
      font-size: 11px;
      color: #484f58;
      text-align: right;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <span class="card-title">render-tree-as-text-uaf · PS4 compat · commit 3f3fec2</span>
    </div>
    <div class="card-body">
      <div id="status-box">? Aguardando onload...</div>
      <div class="divider"></div>
      <div id="log"></div>
      <div class="commit-ref">WebKit #252580 · rdar://105545826</div>
    </div>
  </div>

  <!--
    O <iframe id="i0"> precisa estar NO BODY antes do script de onload
    para que a referência global `i0` exista (comportamento padrão HTML5).
  -->
  <iframe id="i0"></iframe>

  <script>
    /* --- helpers de UI --- */
    function log(msg, cls) {
      var div = document.createElement('span');
      div.className = 'log-entry ' + (cls || 'info');
      div.textContent = msg;
      document.getElementById('log').appendChild(div);
    }

    function setStatus(msg, state) {
      var el = document.getElementById('status-box');
      el.textContent = msg;
      el.className = state || '';  /* 'pass' | 'fail' | '' */
    }

    /* -----------------------------------------------------------------
       SUBSTITUIÇÃO 1
       Original  : internals.settings.setAsyncFrameScrollingEnabled(true)
                   internals.settings.setCaretBrowsingEnabled(true)
       Problema  : `internals` é objeto exclusivo da infra de testes do
                   WebKit (DumpRenderTree / WebKitTestRunner).
                   Não existe em nenhum browser de produção.
       Solução   : try/catch — se disponível, usar; se não, logar aviso
                   e continuar. O teste ainda exercita o mesmo caminho de
                   código no engine; as flags apenas amplificam a janela
                   de reprodução.
    -------------------------------------------------------------------- */
    try {
      if (typeof internals !== 'undefined' && internals.settings) {
        internals.settings.setAsyncFrameScrollingEnabled(true);
        internals.settings.setCaretBrowsingEnabled(true);
        log('? internals.settings configurado', 'ok');
      } else {
        log('? internals não disponível — continuando sem (esperado no PS4)', 'warn');
      }
    } catch (e) {
      log('? internals ignorado: ' + e.message, 'warn');
    }

    /* -----------------------------------------------------------------
       SUBSTITUIÇÃO 2
       Original  : if (window.testRunner) testRunner.dumpAsText()
       Problema  : testRunner só existe no WebKitTestRunner/DumpRenderTree.
       Solução   : condicional mantida (funciona se disponível); em produção
                   o resultado é exibido no DOM em vez de saída de texto.
    -------------------------------------------------------------------- */

    window.onload = function () {
      setStatus('?? Executando sequência do teste...');
      log('? onload disparado', 'ok');

      /* testRunner (layout-test infra) — condicional */
      if (window.testRunner) {
        testRunner.dumpAsText();
        log('? testRunner.dumpAsText() chamado', 'ok');
      } else {
        log('? testRunner ausente — usando output no DOM', 'warn');
      }

      /* -- lógica original do teste -- */

      /* Adiciona <frameset> ao documentElement, igual ao original */
      document.documentElement.append(document.createElement('frameset'));
      log('? <frameset> adicionado ao documentElement', 'ok');

      /* Obtém referência ao iframe via getElementById
         (equivale ao global `i0` — padrão HTML5) */
      var iframe = document.getElementById('i0');

      /* onfocus: muda o hash ? dispara reflow/layout no engine */
      iframe.onfocus = function () {
        log('? iframe.onfocus ? location.hash = "y"', 'ok');
        location.hash = 'y';
      };

      /* Primeiro hash change */
      location.hash = 'x';
      log('? location.hash = "x"', 'ok');

      /* ---------------------------------------------------------------
         SUBSTITUIÇÕES 3 + 4 combinadas
         Original:
           let s0 = document.createElement('script');
           s0.src = `data:text/javascript,caches.has('a').then(() => i0.focus());`;
           document.head.append(s0);

         Problema A (substituição 3):
           data: URI em src de script é bloqueado por CSP em muitos contextos
           de produção e em browseres com política restrita (incluindo PS4).

         Problema B (substituição 4):
           caches (Cache API / Service Worker) pode não estar disponível
           em versões antigas do WebKit do PS4.
           O papel de caches.has('a') NÃO é verificar o cache — é apenas
           obter uma Promise que resolve de forma assíncrona (microtask),
           fazendo o focus() ocorrer após o stack atual esvaziar.

         Solução:
           Promise.resolve().then(fn) tem semântica de microtask idêntica
           e funciona em qualquer engine com suporte a ES6 Promises.
           Fallback adicional: setTimeout(fn, 0) para engines sem Promise.
      ------------------------------------------------------------------- */
      if (typeof Promise !== 'undefined') {
        Promise.resolve().then(function () {
          log('? microtask (Promise.resolve) ? iframe.focus()', 'ok');
          iframe.focus();
        });
      } else {
        /* Fallback para engines muito antigos sem Promise */
        setTimeout(function () {
          log('? setTimeout fallback ? iframe.focus()', 'warn');
          iframe.focus();
        }, 0);
      }

      /* -- verificação de resultado --
         Se o engine chegou aqui sem crash, o UAF foi corrigido (ou não
         existe nessa versão). O timeout garante que todos os eventos
         assíncronos da cadeia acima tiveram tempo de executar.       */
      setTimeout(function () {
        setStatus('? Teste concluído — nenhum crash detectado', 'pass');
        log('? Sem crash após a sequência completa de eventos', 'ok');
        log('  UAF corrigido (commit 3f3fec2) ou não reproduzível neste engine.', 'info');
      }, 2000);
    };
  </script>

</body>
</html>
