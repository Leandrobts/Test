<!DOCTYPE html>
<html>
<body>
<p>Teste de UAF - Foco e Blur no Shadow DOM</p>
<button id="startButton">Iniciar Teste</button>
<div id="host"></div>

<script>
// Função de GC adaptada dos ficheiros de suporte[cite: 3]
function gc() {
    function gcRec(n) {
          if (n < 1)
              return {};
          var temp = {i: "ab" + i + (i / 100000)};
          temp += "foo";
          gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
    gcRec(10);
}


document.getElementById('startButton').addEventListener('click', () => {
    let host = document.getElementById('host');
    let shadowRoot = host.attachShadow({ mode: 'open' });
    let victim = document.createElement('div');
    victim.tabIndex = 0;
    victim.textContent = 'Focusable Shadow Victim';
    shadowRoot.appendChild(victim);
    victim.focus();

    // Registo do listener de blur na fase de captura
    document.addEventListener('blur', (e) => {
        if (victim) {
            victim.remove();
            victim = null;
        }
        gc();
    }, { capture: true, once: true });

    // Força o desfoque programático de forma síncrona após o clique do utilizador
    setTimeout(() => {
        if (victim) {
            victim.blur();
        }
    }, 10);
});
</script>
</body>
</html>
