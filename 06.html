<html>
<body>
<button id="run">Run V3</button>
<div id="status">Ready</div>
<iframe id="testFrame" width="100" height="100"></iframe>
<script>
/*
  DIFERENÇA DO ORIGINAL: dois popups com foco alternado
  FocusController processa mais transições cross-window
  enquanto fullscreen está ativo no iframe.
*/

var iframe = document.getElementById("testFrame");
var popup1 = null;
var popup2 = null;
var focusTimer = null;

iframe.onload = function() {
    var doc = iframe.contentDocument;
    doc.open();
    doc.write(
        '<!DOCTYPE html><html><body>' +
        '<div style="width:200px;height:150px;background:green"></div>' +
        '</body></html>'
    );
    doc.close();
};

document.getElementById("run").onclick = function() {
    popup1 = window.open("", "_blank", "width=400,height=300");
    popup1.document.open();
    popup1.document.write('<!DOCTYPE html><html><body><h3>Popup 1</h3></body></html>');
    popup1.document.close();

    popup2 = window.open("", "_blank", "width=400,height=300");
    popup2.document.open();
    popup2.document.write('<!DOCTYPE html><html><body><h3>Popup 2</h3></body></html>');
    popup2.document.close();

    iframe.contentDocument.documentElement.webkitRequestFullscreen();

    setTimeout(function() {
        // Foco alternado entre 3 janelas + iframe
        popup1.focus();
        popup2.focus();
        window.focus();
        iframe.contentWindow.focus();
        popup1.focus();
        window.focus();

        setTimeout(function() {
            if (popup1 && !popup1.closed) popup1.close();

            // Intervalo maior entre fechar popup1 e popup2
            // para pegar diferentes estados do FocusController
            setTimeout(function() {
                if (popup2 && !popup2.closed) popup2.close();

                focusTimer = setInterval(function() {
                    if ((!popup1 || popup1.closed) &&
                        (!popup2 || popup2.closed)) {
                        clearInterval(focusTimer);
                        iframe.remove();
                        document.getElementById("status").innerHTML =
                            "iframe removed após ambos popups fechados";
                    }
                }, 20);
            }, 150);
        }, 300);
    }, 300);
};
</script>
</body>
</html>
