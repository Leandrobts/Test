<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS4 WebKit - Canvas Text Path Validation</title>
<style>
body{font-family:Arial,sans-serif;background:#151923;color:#eee;margin:16px;line-height:1.45}h1{font-size:22px}button{padding:10px;margin:4px;background:#3478c0;color:white;border:0;border-radius:4px}button:disabled{opacity:.5}#panel{background:#232a38;padding:12px;border-radius:6px}canvas{background:white;border:1px solid #aaa;max-width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#080b11;padding:12px;max-height:340px;overflow:auto}.hint{color:#cbd4e4;font-size:14px}
</style>
</head>
<body>
<h1>PS4 WebKit — validação do caminho Canvas 2D</h1>
<p class="hint">Verifica APIs e executa desenho de texto na thread principal. Não prova execução de funções C++ específicas nem existência de UAF.</p>
<div id="panel">
<button id="run">Executar testes</button><button id="clear">Limpar log</button><button id="save">Exportar log</button>
<p id="status">Aguardando execução.</p>
<canvas id="canvas" width="600" height="240"></canvas>
</div>
<h2>Diagnóstico</h2><pre id="log"></pre>
<script>
(function(){
'use strict';
var logElement=document.getElementById('log');
var statusElement=document.getElementById('status');
var canvas=document.getElementById('canvas');
var lines=[];
function log(msg){var s=(new Date()).toISOString()+' '+msg;lines.push(s);logElement.textContent=lines.join('\n');if(window.console&&console.log)console.log(s);}
function report(name,fn){try{var result=fn();log('[OK] '+name+': '+String(result));return true;}catch(e){log('[ERRO] '+name+': '+String(e&&e.message||e));return false;}}
function run(){
 lines=[];logElement.textContent='';statusElement.textContent='Executando...';
 log('User agent: '+navigator.userAgent);
 log('FontFace: '+typeof window.FontFace);
 log('document.fonts: '+String(!!document.fonts));
 log('OffscreenCanvas: '+typeof window.OffscreenCanvas);
 log('requestAnimationFrame: '+typeof window.requestAnimationFrame);
 var ctx=canvas.getContext('2d');
 if(!ctx){log('[ERRO] Contexto 2D indisponível');statusElement.textContent='Falha';return;}
 report('clearRect',function(){ctx.clearRect(0,0,canvas.width,canvas.height);return 'executado';});
 report('fillText ASCII',function(){ctx.font='24px sans-serif';ctx.fillStyle='#1c3050';ctx.textBaseline='alphabetic';ctx.fillText('Canvas fillText ASCII',12,40);return 'chamada concluída';});
 report('fillText Cherokee',function(){ctx.font='24px serif';ctx.fillStyle='#146b50';ctx.fillText('\u13A0\u13A2\u13A4',12,85);return 'chamada concluída (glifos podem faltar)';});
 report('strokeText',function(){ctx.font='26px sans-serif';ctx.strokeStyle='#a83232';ctx.lineWidth=1;ctx.strokeText('Canvas strokeText',12,130);return 'chamada concluída';});
 report('fillText com maxWidth',function(){ctx.font='28px sans-serif';ctx.fillStyle='#46348d';ctx.fillText('Texto com largura limitada',12,178,230);return 'chamada concluída';});
 report('measureText (comparação)',function(){ctx.font='20px sans-serif';var m=ctx.measureText('Canvas');return 'width='+m.width;});
 report('pixel readback',function(){var pixels=ctx.getImageData(0,0,canvas.width,canvas.height).data;var nonwhite=0;for(var i=3;i<pixels.length;i+=4){if(pixels[i]>0)nonwhite++;}return 'pixels com alpha > 0: '+nonwhite;});
 log('Observação: chamadas JS bem-sucedidas não confirmam o ponto de execução C++ nem a invalidação de FontMetrics.');
 statusElement.textContent='Testes concluídos. Confira o log e o canvas.';
}
document.getElementById('run').onclick=run;
document.getElementById('clear').onclick=function(){lines=[];logElement.textContent='';statusElement.textContent='Log limpo.';};
document.getElementById('save').onclick=function(){var content=lines.join('\n')+'\n';try{var blob=new Blob([content],{type:'text/plain;charset=utf-8'});var url=(window.URL||window.webkitURL).createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='ps4_canvas_diagnostic.txt';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){(window.URL||window.webkitURL).revokeObjectURL(url);},1000);}catch(e){log('Exportação indisponível: '+String(e));}};
run();
})();
</script>
</body>
</html>
