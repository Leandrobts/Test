<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>WebKit Focus Blur UAF Test</title>
</head>
<body>

<p>This test passes if it does not crash.</p>

<button id="arm">ARM TEST</button>
<div id="host"></div>
<div id="result">WAITING</div>

<script src="resources/gc.js"></script>
<script>
var shadowRoot;
var victim;
var armed = false;
var blurCount = 0;

function prepareTest() {
    host.innerHTML = '';

    shadowRoot = host.attachShadow({ mode: 'open' });

    victim = document.createElement('div');
    victim.tabIndex = 0;
    victim.textContent = 'Focusable';

    shadowRoot.appendChild(victim);

    victim.focus();

    armed = true;
    result.textContent = 'ARMED - move focus away from the browser';
}

document.addEventListener('blur', function() {
    if (!armed || !victim)
        return;

    blurCount++;

    var target = victim;

    victim = null;

    target.remove();

    shadowRoot.innerHTML = '';

    gc();

    result.textContent = 'BLUR TRIGGERED: ' + blurCount;
}, true);

window.addEventListener('blur', function() {
    if (armed)
        result.textContent = 'WINDOW BLUR';
}, true);

window.addEventListener('focus', function() {
    if (armed)
        result.textContent = 'FOCUS RETURNED';
}, false);

document.getElementById('arm').addEventListener('click', function() {
    prepareTest();
});
</script>

</body>
</html>
