<!DOCTYPE html>
<html>
<body>
<script>
// POC 4: Reentrância via MutationObserver + Custom Element
// durante o update de estilos / font processing

function log(message) {
    document.body.appendChild(document.createTextNode(message));
    document.body.appendChild(document.createElement("br"));
}

function run() {
    const host = document.createElement("div");
    document.body.appendChild(host);
    const shadowRoot = host.attachShadow({ mode: "open" });

    const fontFaceStyle = document.createElement("style");
    fontFaceStyle.textContent = `@font-face { font-family: reentryFont; src: url("resources/no-such-font-for-reentry.otf"); }`
        + `.probe { font: 24px reentryFont; }`;
    shadowRoot.appendChild(fontFaceStyle);

    const probe = document.createElement("span");
    probe.className = "probe";
    probe.textContent = "A";
    shadowRoot.appendChild(probe);

    document.body.offsetHeight; // force layout

    // Prepend de stylesheet
    const prependedStyle = document.createElement("style");
    prependedStyle.textContent = ".unused { color: red; }";
    shadowRoot.prepend(prependedStyle);

    let observerFired = 0;
    let customElementFired = 0;

    // 1. MutationObserver que remove o host quando algo muda no shadow
    const observer = new MutationObserver(() => {
        ++observerFired;
        host.remove();
    });
    observer.observe(shadowRoot, { childList: true, subtree: true, attributes: true });

    // 2. Custom Element cujo connectedCallback / attributeChangedCallback
    // pode rodar durante o recalc de estilo
    class ReentryElement extends HTMLElement {
        static get observedAttributes() { return ["data-reentry"]; }
        connectedCallback() {
            ++customElementFired;
            // Também tenta remover o host
            if (host.isConnected)
                host.remove();
        }
        attributeChangedCallback() {
            ++customElementFired;
            if (host.isConnected)
                host.remove();
        }
    }
    customElements.define("reentry-el", ReentryElement);

    const reentryEl = document.createElement("reentry-el");
    shadowRoot.appendChild(reentryEl);

    // Força mais atividade de fonte + estilo
    document.fonts.load("24px reentryFont", "A").catch(() => {});
    reentryEl.setAttribute("data-reentry", "1"); // dispara attributeChangedCallback

    // Mutação que o observer vai ver
    const extra = document.createElement("div");
    shadowRoot.appendChild(extra);

    document.styleSheets.length; // trigger de flush

    log("MutationObserver fired: " + observerFired);
    log("Custom Element callbacks: " + customElementFired);
    log("PASS if no crash.");
}

window.addEventListener("load", () => setTimeout(run, 0));
</script>
</body>
</html>
