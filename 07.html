
<!DOCTYPE html>
<html>
<body>
<pre id="out"></pre>
<script>
(function(){
var tests={
"ArrayBuffer":typeof ArrayBuffer,
"Uint8Array":typeof Uint8Array,
"Uint16Array":typeof Uint16Array,
"Float32Array":typeof Float32Array,
"BigInt":typeof BigInt,
"DataView":typeof DataView,
"setBigUint64":typeof DataView!=="undefined"?typeof DataView.prototype.setBigUint64:"absent",
"SharedArrayBuffer":typeof SharedArrayBuffer,
"WebAssembly":typeof WebAssembly,
"Worker":typeof Worker,
"SharedWorker":typeof SharedWorker,
"MessageChannel":typeof MessageChannel,
"MutationObserver":typeof MutationObserver,
"ResizeObserver":typeof ResizeObserver,
"IntersectionObserver":typeof IntersectionObserver,
"OffscreenCanvas":typeof OffscreenCanvas,
"HTMLCanvasElement":typeof HTMLCanvasElement,
"Canvas2D":typeof CanvasRenderingContext2D,
"ImageBitmap":typeof ImageBitmap,
"VideoEncoder":typeof VideoEncoder,
"VideoDecoder":typeof VideoDecoder,
"VideoFrame":typeof VideoFrame,
"AudioContext":typeof AudioContext,
"webkitAudioContext":typeof webkitAudioContext,
"HTMLAudioElement":typeof HTMLAudioElement,
"HTMLVideoElement":typeof HTMLVideoElement,
"FontFace":typeof FontFace,
"FontFaceSet":typeof FontFaceSet,
"DOMParser":typeof DOMParser,
"XMLSerializer":typeof XMLSerializer,
"ShadowRoot":typeof ShadowRoot,
"attachShadow":typeof Element.prototype.attachShadow,
"createShadowRoot":typeof Element.prototype.createShadowRoot,
"getRootNode":typeof Node.prototype.getRootNode,
"setHTMLUnsafe":typeof Element.prototype.setHTMLUnsafe,
"replaceChildren":typeof Element.prototype.replaceChildren,
"createImageBitmap":typeof createImageBitmap,
"Path2D":typeof Path2D,
"WebGL":typeof WebGLRenderingContext,
"WebGL2":typeof WebGL2RenderingContext,
"TextEncoder":typeof TextEncoder,
"TextDecoder":typeof TextDecoder,
"ReadableStream":typeof ReadableStream,
"structuredClone":typeof structuredClone,
"AbortController":typeof AbortController,
"WeakRef":typeof WeakRef,
"FinalizationRegistry":typeof FinalizationRegistry,
"requestIdleCallback":typeof requestIdleCallback,
"queueMicrotask":typeof queueMicrotask,
"requestAnimationFrame":typeof requestAnimationFrame
};
var result=[];
for(var key in tests)
result.push(key+": "+tests[key]);
document.getElementById("out").textContent=result.join("\n");
})();
</script>
</body>
</html>
