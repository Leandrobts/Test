<!DOCTYPE html>
<html>
<body>
  <button id="runBtn" type="button">Executar diagnóstico</button>
  <div id="log"></div>

  <script>
    document.fonts;

    function log(msg) {
      const out = document.getElementById("log");
      const line = document.createElement("div");
      line.textContent = msg;
      out.appendChild(line);
    }

    function runDiagnostic() {
      document.getElementById("log").textContent = "";

      const host = document.createElement("div");
      document.body.appendChild(host);
      const shadowRoot = host.attachShadow({ mode: "open" });

      const fontStyle = document.createElement("style");
      fontStyle.textContent =
        `@font-face { font-family: testFont; src: url("resources/missing-font.otf"); }` +
        `.sample { font: 20px testFont; }`;
      shadowRoot.appendChild(fontStyle);

      const span = document.createElement("span");
      span.className = "sample";
      span.textContent = "A";
      shadowRoot.appendChild(span);

      void document.body.offsetHeight;
      document.fonts.load("20px testFont", "A").catch(() => {});
      log("status inicial: " + document.fonts.status);

      const extraStyle = document.createElement("style");
      extraStyle.textContent = ".note { opacity: 1; }";
      shadowRoot.prepend(extraStyle);

      const sheetCount = document.styleSheets.length;
      log("stylesheets: " + sheetCount);
      log("status após flush: " + document.fonts.status);
    }

    document.getElementById("runBtn").addEventListener("click", runDiagnostic);
  </script>
</body>
</html>
