<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Worker self.fonts + Canvas Probe</title>
</head>
<body>
  <button id="runBtn" type="button">Executar teste</button>
  <pre id="log"></pre>

  <script>
    const logEl = document.getElementById('log');
    function log(msg) {
      logEl.textContent += msg + '\n';
    }

    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');

    const workerCode = `
      self.onmessage = async function(ev) {
        const batch = ev.data.batch || 0;
        const count = ev.data.count || 20;
        const url = 'url("data:font/ttf;base64,' + 'A'.repeat(65536) + '")';
        let created = 0;
        let loaded = 0;

        for (let i = 0; i < count; i++) {
          const fam = 'wf_' + batch + '_' + i;
          try {
            const ff = new self.FontFace(fam, url, { unicodeRange: 'U+13A0-13FF' });
            self.fonts.add(ff);
            created++;
            await ff.load().then(function() {
              loaded++;
            }, function() {});
          } catch (e) {
            break;
          }
        }

        self.postMessage({
          batch: batch,
          created: created,
          loaded: loaded,
          size: self.fonts.size
        });
      };
    `;

    const blob = new Blob([workerCode], { type: 'application/javascript' });
    const workerUrl = URL.createObjectURL(blob);
    const worker = new Worker(workerUrl);

    worker.onmessage = function(ev) {
      log('Batch ' + ev.data.batch + ': created=' + ev.data.created +
          ' loaded=' + ev.data.loaded + ' self.fonts.size=' + ev.data.size);

      if (ctx) {
        const b = ev.data.batch;
        for (let i = 0; i < 60; i++) {
          const fam = 'wf_' + b + '_' + (i % 20);
          ctx.font = (10 + (i % 16)) + 'px "' + fam + '", sans-serif';
          ctx.measureText('\u13A0\u13A2\u13A4');
        }
        log('Canvas measureText executado para batch ' + b);
      }
    };

    worker.onerror = function(err) {
      log('Worker error: ' + (err.message || 'erro'));
    };

    document.getElementById('runBtn').addEventListener('click', function() {
      log('Iniciando lotes no Worker...');
      for (let b = 0; b < 6; b++) {
        worker.postMessage({ batch: b, count: 20 });
      }
    });
  </script>
</body>
</html>
