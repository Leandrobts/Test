<!DOCTYPE html>
<html>
<body>
<script>

function finish(message) {
    document.body.appendChild(document.createTextNode(message));
    
}

const worker = new Worker('resources/opportunistic-load-reentrancy-worker.js');

worker.onmessage = function (event) {
    const data = event.data;
    
    // Como o PS4 não tem OffscreenCanvas no Worker, a thread principal executa a pedido do worker
    if (data && data.action === 'MEASURE') {
        try {
            const canvas = document.createElement('canvas');
            canvas.width = 10;
            canvas.height = 10;
            const context = canvas.getContext('2d');
            context.font = data.font;
            context.measureText(data.text);
            
            // Responde de volta para o worker que concluiu
            worker.postMessage({ status: 'success' });
        } catch (e) {
            worker.postMessage({ status: 'error', message: e.message });
        }
    } else if (data === 'done' || data.status === 'done') {
        finish("PASS if no crash");
    }
};

worker.onerror = function (event) { 
    finish("FAIL: worker error: " + event.message); 
};
</script>
</body>
</html>
