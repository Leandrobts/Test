<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Consuming form data with empty blob - Opcoes A B C D</title>
</head>
<body>
<button id="runA">Rodar Opcao A (structuredClone)</button>
<button id="runB">Rodar Opcao B (Worker postMessage)</button>
<button id="runC">Rodar Opcao C (fetch + revoke + blob)</button>
<button id="runD">Rodar Opcao D (FormData chave vazia)</button>
<pre id="log"></pre>
<script>
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

function log(msg) {
    document.getElementById('log').textContent += msg + '\n';
}

function sleep(ms) {
    return new Promise(function(resolve) {
        setTimeout(resolve, ms);
    });
}

function createBlobA() {
    return new Promise(function(resolve, reject) {
        if (typeof structuredClone !== 'function') {
            reject(new Error('structuredClone indisponivel'));
            return;
        }
        var original = new Blob(['aa']);
        var cloned = structuredClone(original);
        original = null;
        gc();
        resolve(cloned);
    });
}

function createBlobB() {
    return new Promise(function(resolve, reject) {
        if (typeof Worker === 'undefined' || typeof URL === 'undefined' || typeof URL.createObjectURL !== 'function') {
            reject(new Error('Worker ou URL.createObjectURL indisponivel'));
            return;
        }
        var src = [
            'self.onmessage = function(e) {',
            '    self.postMessage(e.data);',
            '};'
        ].join('\n');
        var url = URL.createObjectURL(new Blob([src], { type: 'application/javascript' }));
        var w = new Worker(url);

        w.onmessage = function(e) {
            URL.revokeObjectURL(url);
            w.terminate();
            gc();
            resolve(e.data);
        };

        w.onerror = function(err) {
            URL.revokeObjectURL(url);
            w.terminate();
            reject(new Error(err && err.message ? err.message : 'Worker error'));
        };

        w.postMessage(new Blob(['aa']));
    });
}

function createBlobC() {
    return new Promise(function(resolve, reject) {
        if (typeof fetch !== 'function' || typeof URL === 'undefined' || typeof URL.createObjectURL !== 'function') {
            reject(new Error('fetch ou URL.createObjectURL indisponivel'));
            return;
        }
        var url = URL.createObjectURL(new Blob(['aa']));
        fetch(url).then(function(resp) {
            URL.revokeObjectURL(url);
            gc();
            return resp.blob();
        }).then(function(blob) {
            gc();
            resolve(blob);
        }).catch(function(err) {
            URL.revokeObjectURL(url);
            reject(err);
        });
    });
}

function runCommitStyleWithOption(option) {
    var payloadPromise;

    if (option === 'A') {
        payloadPromise = createBlobA().then(function(blob) {
            var fd = new FormData();
            fd.append('a', blob);
            return fd;
        });
    } else if (option === 'B') {
        payloadPromise = createBlobB().then(function(blob) {
            var fd = new FormData();
            fd.append('a', blob);
            return fd;
        });
    } else if (option === 'C') {
        payloadPromise = createBlobC().then(function(blob) {
            var fd = new FormData();
            fd.append('a', blob);
            return fd;
        });
    } else if (option === 'D') {
        payloadPromise = new Promise(function(resolve) {
            gc();
            var fd = new FormData();
            fd.append('key', '');
            resolve(fd);
        });
    }

    return payloadPromise.then(function(formData) {
        return sleep(100).then(function() {
            var response = new Response(formData);
            Object.prototype.__defineGetter__('then', function() {
                response = null;
                gc();
            });

            return response.arrayBuffer();
        });
    });
}

function runLoop(option, count) {
    log('[' + option + '] iniciando...');
    var chain = Promise.resolve();
    for (var i = 0; i < count; i++) {
        (function(idx) {
            chain = chain.then(function() {
                return runCommitStyleWithOption(option).then(function() {
                    log('[' + option + '] iteracao ' + idx + ': ok');
                }, function(err) {
                    log('[' + option + '] iteracao ' + idx + ': erro (' + (err && err.message ? err.message : err) + ')');
                });
            });
        })(i);
    }
}

document.getElementById('runA').onclick = function() { runLoop('A', 10); };
document.getElementById('runB').onclick = function() { runLoop('B', 10); };
document.getElementById('runC').onclick = function() { runLoop('C', 10); };
document.getElementById('runD').onclick = function() { runLoop('D', 10); };
</script>
</body>
</html>
