<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Teste no navegador — Pos-offsetWidth</title>
</head>
<body>
<button id="runBtn" type="button">Rodar teste</button>
<pre id="log"></pre>
<script>
(function () {
  "use strict";

  var logEl = document.getElementById("log");
  var runBtn = document.getElementById("runBtn");
  var ran = false;

  function out(msg) {
    logEl.textContent += msg + "\n";
  }

  function cssFor(url) {
    return (
      "@font-face{font-family:'pf';src:url('" + url + "')}" +
      ":host>span{font-family:'pf';font-size:20px;display:block}"
    );
  }

  function start() {
    if (ran) {
      out("Ja executado. Recarregue a pagina para testar novamente.");
      return;
    }
    ran = true;

    var pre = document.createElement("div");
    document.body.appendChild(pre);
    pre.attachShadow({ mode: "open" });

    var shadowHost = document.createElement("div");
    document.body.appendChild(shadowHost);
    var sr = shadowHost.attachShadow({ mode: "open" });

    var style1 = document.createElement("style");
    style1.textContent = cssFor("resources/Ahem.woff?v=1");
    sr.appendChild(style1);

    var span = document.createElement("span");
    span.textContent = "X";
    sr.appendChild(span);

    var suf = document.createElement("div");
    document.body.appendChild(suf);
    var sufSr = suf.attachShadow({ mode: "open" });
    var sufSpan = document.createElement("span");
    sufSpan.textContent = "Y";
    sufSr.appendChild(sufSpan);

    void shadowHost.getBoundingClientRect();
    out("[1] Rect forçado | status=" + document.fonts.status);

    var fs = document.fonts;
    void fs.ready;
    out("[2] fs.ready lido | status=" + fs.status);

    var trapCount = 0;
    Object.defineProperty(FontFaceSet.prototype, "then", {
      configurable: true,
      get: function () {
        trapCount += 1;
        out("[TRAP #" + trapCount + "] host.isConnected(antes)=" + shadowHost.isConnected);
        shadowHost.remove();
        out("[TRAP #" + trapCount + "] host.isConnected(depois)=" + shadowHost.isConnected + " | sr.host=" + (sr.host ? sr.host.tagName : "null"));
        return undefined;
      }
    });

    var style2 = document.createElement("style");
    style2.textContent = cssFor("resources/Ahem.woff?v=2");
    sr.prepend(style2);
    out("[3] style2 prepended");

    out("[4] Executando document.body.offsetWidth...");
    void document.body.offsetWidth;

    try { delete FontFaceSet.prototype.then; } catch (e) {}

    out("[5] Pos-offsetWidth | trapCount=" + trapCount + " | status=" + fs.status);
    out("    pre.isConnected=" + pre.isConnected + " | suf.isConnected=" + suf.isConnected + " | shadowHost.isConnected=" + shadowHost.isConnected);

    void suf.getBoundingClientRect();
    out("[6] Pos-suf.getBoundingClientRect() concluido");
  }

  runBtn.addEventListener("click", start);
})();
</script>
</body>
</html>
