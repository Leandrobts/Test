<!DOCTYPE html>
<html>
<body>
<script src="resources/js-test.js"></script>
<script>
(function(){const logElement=document.createElement('pre');logElement.id='debug-log';logElement.style.cssText='position: fixed; bottom: 0; left: 0; width: 100%; max-height: 220px; overflow-y: auto; background: rgba(0, 0, 0, 0.85); color: #ff5555; font-family: monospace; font-size: 11px; z-index: 999999; padding: 8px; box-sizing: border-box; margin: 0; border-top: 2px solid #ff0000; text-align: left; white-space: pre-wrap; word-break: break-all;';if(document.body){document.body.appendChild(logElement);}else{document.addEventListener('DOMContentLoaded',()=>document.body.appendChild(logElement));}function log(msg,color='#ff5555'){if(!logElement)return;const line=document.createElement('div');line.style.color=color;line.textContent=msg;logElement.appendChild(line);logElement.scrollTop=logElement.scrollHeight;}window.onerror=function(message,source,lineno,colno,error){log(`[ERRO JS] ${message}\n  -> ${source}:${lineno}:${colno}`);};window.addEventListener('error',function(event){const target=event.target;if(target&&(target.tagName||target===window)){const tagName=target.tagName?target.tagName.toLowerCase():'recurso';const sourceUrl=target.src||target.href||'desconhecido';log(`[FALHA RECURSO/${tagName}] Não foi possível carregar: ${sourceUrl}`,'#ffaa00');}},true);window.addEventListener('unhandledrejection',function(event){log(`[PROMISE REJECTION] ${event.reason}`);});['log','error','warn','info'].forEach(method=>{const original=console[method];console[method]=function(...args){original.apply(console,args);const text=args.map(arg=>{if(typeof arg==='object'){try{return JSON.stringify(arg);}catch(e){return '[Objeto Circular]';}}return arg;}).join(' ');let color='#ffffff';if(method==='error')color='#ff5555';if(method==='warn')color='#ffaa00';log(`[Console.${method}] ${text}`,color);};});log('[Debug Ativo]','#00ff00');})();
</script>
<script>
description("replaceSync() on a detached constructed stylesheet must not mutate contents shared with another sheet or published to the stylesheet contents cache.");

// A second replaceSync() replaces rather than appends.
const sheet = new CSSStyleSheet();
sheet.replaceSync(".x { color: red; }");
sheet.replaceSync(".y { color: blue; }");
shouldBe("sheet.cssRules.length", "1");
shouldBeEqualToString("sheet.cssRules[0].cssText", ".y { color: blue; }");

// Same, with contents that are not cacheable and so stay in place across both calls.
const nested = new CSSStyleSheet();
nested.replaceSync(".p { & .q { color: red; } }");
nested.replaceSync(".r { & .s { color: blue; } }");
shouldBe("nested.cssRules.length", "1");
shouldBeEqualToString("nested.cssRules[0].selectorText", ".r");

// Replacing after the sheet has been adopted takes the general path.
const adopted = new CSSStyleSheet();
adopted.replaceSync(".t { color: red; }");
document.adoptedStyleSheets = [adopted];
adopted.replaceSync(".u { color: blue; }");
shouldBe("adopted.cssRules.length", "1");
shouldBeEqualToString("adopted.cssRules[0].selectorText", ".u");

// A fresh sheet parsing the first text does not see rules left behind by the sheet above.
const other = new CSSStyleSheet();
other.replaceSync(".x { color: red; }");
shouldBe("other.cssRules.length", "1");
shouldBeEqualToString("other.cssRules[0].cssText", ".x { color: red; }");

// Two sheets sharing cached contents: replacing one does not grow the other, which would
// desync its CSSOM wrapper vector from the rule count and make insertRule() write out of bounds.
const first = new CSSStyleSheet();
const second = new CSSStyleSheet();
first.replaceSync(".p { color: red; }");
second.replaceSync(".p { color: red; }");
second.cssRules[0];
first.replaceSync(".q { color: blue; }");
shouldBe("second.cssRules.length", "1");
shouldThrowErrorName("second.insertRule('.r { color: green; }', 2)", "IndexSizeError");
shouldBe("second.cssRules.length", "1");
</script>
</body>
</html>
