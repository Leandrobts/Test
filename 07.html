<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 WebKit Date Input Diagnostic</title>
</head>
<body>
<h1>PS4 WebKit Date Input &amp; Test Harness Diagnostic</h1>

<p>
<label for="dateInput">Date input:</label>
<input id="dateInput" type="date">
</p>

<p>
<label for="textInput">Text input:</label>
<input id="textInput" type="text">
</p>

<div id="log"></div>

<script>
function logLine(msg) {
    var div = document.getElementById("log");
    var p = document.createElement("p");
    p.textContent = msg;
    div.appendChild(p);
}

function checkDateTypeSupport() {
    var el = document.createElement("input");
    try {
        el.type = "date";
    } catch (e) {
        logLine("input.type = 'date' threw: " + e);
        return false;
    }
    var supported = (el.type === "date");
    logLine("input.type after assigning 'date': " + el.type + " (supported=" + supported + ")");
    return supported;
}

function checkTestHarnessGlobals() {
    var names = [
        "testRunner",
        "eventSender",
        "uiController",
        "internals",
        "GCController",
        "UIHelper",
        "jsTestIsAsync",
        "shouldBe",
        "shouldBeEqualToString",
        "testPassed",
        "testFailed",
        "finishJSTest"
    ];
    for (var i = 0; i < names.length; i++) {
        var name = names[i];
        var exists = false;
        var typeOfVal = "undefined";
        try {
            var val = (new Function("return typeof " + name + " !== 'undefined' ? " + name + " : undefined;"))();
            typeOfVal = typeof val;
            exists = (typeOfVal !== "undefined");
        } catch (e) {
            typeOfVal = "error: " + e;
        }
        logLine("Global '" + name + "': exists=" + exists + ", typeof=" + typeOfVal);
    }
}

function checkInputEventsAndTypeChange() {
    var input = document.getElementById("dateInput");
    var eventCounts = {
        focus: 0,
        blur: 0,
        keydown: 0,
        keypress: 0,
        keyup: 0,
        input: 0,
        change: 0
    };

    Object.keys(eventCounts).forEach(function(evName) {
        input.addEventListener(evName, function(e) {
            eventCounts[evName] += 1;
            logLine("Event '" + evName + "' fired on #dateInput (current type=" + input.type + ", value=" + input.value + ")");
        });
    });

    logLine("Navigator userAgent: " + navigator.userAgent);
    logLine("Window innerWidth x innerHeight: " + window.innerWidth + "x" + window.innerHeight);
    logLine("Initial #dateInput.type: " + input.type);

    try {
        input.focus();
        logLine("After input.focus(), document.activeElement id/tag: " + (document.activeElement ? (document.activeElement.tagName + "#" + document.activeElement.id) : "null"));
    } catch (e) {
        logLine("input.focus() threw: " + e);
    }

    try {
        input.value = "2012-09-02";
        input.dispatchEvent(new Event("input", { bubbles: true }));
        input.dispatchEvent(new Event("change", { bubbles: true }));
        logLine("Synthetic input/change dispatched; #dateInput.value=" + input.value);
    } catch (e) {
        logLine("Synthetic event dispatch threw: " + e);
    }
}

window.addEventListener("load", function() {
    logLine("Diagnostic started.");
    checkDateTypeSupport();
    checkTestHarnessGlobals();
    checkInputEventsAndTypeChange();
    logLine("Diagnostic finished.");
});
</script>
</body>
</html>
