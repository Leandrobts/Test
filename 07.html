<!doctype html>
<input id="a">
<iframe id="f" tabindex="0" srcdoc="<input tabindex='0'>"></iframe>
<script>
var a=document.getElementById("a");
var f=document.getElementById("f");

f.onload=function(){
    setTimeout(function(){
        a.focus();
        f.focus();
        a.focus();

        a.onblur=function(){
            f.remove();
            f=null;
        };

        a.focus();

        a.dispatchEvent(new KeyboardEvent("keydown",{
            bubbles:true,
            cancelable:true,
            key:"Tab",
            code:"Tab"
        }));
    },100);
};
</script>
