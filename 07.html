<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 633fbf1 Test</title>
</head>
<body>
<button id="go">Run</button>
<pre id="out"></pre>
<script>
(function () {
  var out = document.getElementById("out");
  function log(msg) {
    out.textContent += msg + "\n";
  }

  function gc() {
    function gcRec(n, k) {
      if (n < 1)
        return {};
      var temp = { i: "ab" + k + (k / 100000) };
      temp += "foo";
      gcRec(n - 1, k);
    }
    for (var i = 0; i < 10000; i++)
      gcRec(10, i);
  }

  function trigger() {
    out.textContent = "";
    var iframe = document.createElement("iframe");
    document.body.appendChild(iframe);
    var doc = iframe.contentDocument;
    var div = doc && doc.body ? doc.createElement("div") : null;
    if (div && doc.body) {
      doc.body.appendChild(div);
    }

    try {
      var p = div && div.requestFullscreen ? div.requestFullscreen() : null;
      if (p && p.catch) {
        p.catch(function (err) {
          log("catch: " + (err && err.name ? err.name : err));
        });
      }
    } catch (e) {
      log("throw: " + e);
    }

    if (iframe && iframe.parentNode) {
      iframe.parentNode.removeChild(iframe);
    }

    // Solta referencias antes do GC para permitir coleta do Document
    div = null;
    doc = null;
    iframe = null;

    gc();
    log("gc finished");

    setTimeout(function () {
      log("timeout 0 tick");
    }, 0);
  }

  document.getElementById("go").addEventListener("click", trigger);
})();
</script>
</body>
</html>
