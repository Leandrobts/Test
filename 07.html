<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8">
<title>SVG element attribute changed crash</title>
</head>
<body>

<script src="resources/gc.js"></script>

<script>
onload = async function() {

    var svg0 = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "svg"
    );

    var svgAnimatedLength = svg0.width;

    var baseVal = svgAnimatedLength.baseVal;

    var clipPath0 = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "clipPath"
    );

    svg0.appendChild(clipPath0);

    clipPath0.appendChild(
        document.createTextNode("")
    );

    document.body.appendChild(svg0);

    await undefined;

    if (typeof gc == "function")
        gc();

    baseVal.value = 0;

    document.body.innerHTML = "PASS if no crash";
};
</script>

</body>
</html>
