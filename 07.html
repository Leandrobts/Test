<!DOCTYPE html>
<html>
<body>
<script>
function gc() {
    function gcRec(n) {
          if (n < 1)
              return {};
          var temp = {i: "ab" + i + (i / 100000)};
          temp += "foo";
          gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
    gcRec(10);
}

let childNodes;
(function () {
    let host = document.createElement('div');
    let shadowRoot = host.attachShadow({ mode: 'open' });
    shadowRoot.innerHTML = '<span></span>';
    childNodes = shadowRoot.childNodes;
})();

setTimeout(function () {
   gc();
    setTimeout(function () {
        gc();
        let child = childNodes.item(0);
        let composedRoot = child.getRootNode({ composed: true });
        document.write(composedRoot.nodeType == Node.DOCUMENT_FRAGMENT_NODE ? 'PASS' : 'FAIL');
    }, 0);
}, 0);
</script>
</body>
</html>
