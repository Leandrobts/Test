<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>blur-window-with-focus-in-shadow-tree-crash - PS4</title>
</head>
<body>
<p>This test passes if it does not crash.</p>
<div id="host"></div>
<div id="result"></div>
<button id="run">Run test</button>

<script src="gc.js"></script>
<script>
var shadowRoot;
var victim;
var popup = null;
var blurTriggered = false;

function runTest() {
    if (!host.attachShadow) {
        result.textContent = 'Shadow DOM not supported';
        return;
    }

    shadowRoot = host.attachShadow({ mode: 'open' });
    victim = document.createElement('div');
    victim.tabIndex = 0;
    victim.textContent = 'Focusable';
    shadowRoot.appendChild(victim);
    victim.focus();

    document.addEventListener('blur', function() {
        if (!victim)
            return;

        blurTriggered = true;
        victim.parentNode.removeChild(victim);
        victim = null;
        gc();
    }, true);

    try {
        popup = window.open('about:blank', '_blank', 'width=300,height=200');
    } catch (e) {
        popup = null;
    }

    setTimeout(function() {
        if (popup && !popup.closed) {
            try {
                popup.close();
            } catch (e) {
            }
        }

        setTimeout(function() {
            if (blurTriggered)
                result.textContent = 'PASS';
            else
                result.textContent = 'Window blur was not triggered';
        }, 1000);
    }, 1000);
}

document.getElementById('run').onclick = runTest;
</script>
</body>
</html>
