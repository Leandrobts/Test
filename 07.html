<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>

<script>
(function(){
    var logElement = document.createElement('pre');
    logElement.id = 'debug-log';
    logElement.style.cssText = 'position: fixed; bottom: 0; left: 0; width: 100%; max-height: 220px; overflow-y: auto; background: rgba(0, 0, 0, 0.85); color: #ff5555; font-family: monospace; font-size: 11px; z-index: 999999; padding: 8px; box-sizing: border-box; margin: 0; border-top: 2px solid #ff0000; text-align: left; white-space: pre-wrap; word-break: break-all;';
    
    if (document.body) {
        document.body.appendChild(logElement);
    } else {
        document.addEventListener('DOMContentLoaded', function() {
            document.body.appendChild(logElement);
        });
    }
    
    function log(msg, color) {
        if (!color) color = '#ff5555';
        if (!logElement) return;
        var line = document.createElement('div');
        line.style.color = color;
        line.textContent = msg;
        logElement.appendChild(line);
        logElement.scrollTop = logElement.scrollHeight;
    }
    
    window.log = log;

    window.onerror = function(message, source, lineno, colno, error) {
        log('[ERRO JS] ' + message + '\n  -> ' + source + ':' + lineno + ':' + colno);
    };
    
    window.addEventListener('error', function(event) {
        var target = event.target;
        if (target && (target.tagName || target === window)) {
            var tagName = target.tagName ? target.tagName.toLowerCase() : 'recurso';
            var sourceUrl = target.src || target.href || 'desconhecido';
            log('[FALHA RECURSO/' + tagName + '] Não foi possível carregar: ' + sourceUrl, '#ffaa00');
        }
    }, true);
    
    window.addEventListener('unhandledrejection', function(event) {
        log('[PROMISE REJECTION] ' + event.reason);
    });
    
    var methods = ['log', 'error', 'warn', 'info'];
    for (var i = 0; i < methods.length; i++) {
        (function(method) {
            var original = console[method];
            console[method] = function() {
                var args = Array.prototype.slice.call(arguments);
                if (original) {
                    original.apply(console, args);
                }
                var text = args.map(function(arg) {
                    if (typeof arg === 'object') {
                        try { return JSON.stringify(arg); } catch (e) { return '[Objeto Circular]'; }
                    }
                    return arg;
                }).join(' ');
                var color = '#ffffff';
                if (method === 'error') color = '#ff5555';
                if (method === 'warn') color = '#ffaa00';
                log('[Console.' + method + '] ' + text, color);
            };
        })(methods[i]);
    }
    
    log('[Debug Ativo]', '#00ff00');
})();
</script>

<script>
var ctx = null;
var inGetter = false;

if (typeof FontFace !== 'undefined' && FontFace.prototype) {
    try {
        Object.defineProperty(FontFace.prototype, 'then', {
            configurable: true,
            get: function() {
                if (inGetter || !ctx)
                    return undefined;
                inGetter = true;
                for (var i = 0; i < 16; i++) {
                    try { ctx.measureText('q' + String.fromCharCode(65 + i) + 'z'); } catch (e) { }
                    try { ctx.measureText('x'); } catch (e) { }
                }
                inGetter = false;
                return undefined;
            }
        });
    } catch (e) {}
}

function attempt(n) {
    if (typeof FontFace === 'undefined' || !document.fonts) {
        throw new Error("FontFace não suportado");
    }

    for (var d = 0; d < 3; d++) {
        new FontFace('Dummy' + n + '_' + d, 'local(Helvetica)');
    }

    var family = 'VarFam' + n;
    var face = new FontFace(family, 'local(Helvetica)');
    var dummyLoaded = face.loaded;
    document.fonts.add(face);

    var canvas = document.createElement('canvas');
    canvas.width = 10;
    canvas.height = 10;
    ctx = canvas.getContext('2d');
    
    ctx.font = '20px Helvetica, ' + family;

    for (var i = 0; i < 50; i++) {
        ctx.measureText('x');
    }

    ctx.measureText('\uE005\u4E00\u9FA5\u2200\u05D0\u0E01\u10A0\uD83D\uDE00\uD83D\uDE80AB');
}

window.onload = function () {
    setTimeout(function () {
        for (var n = 0; n < 10; n++) {
            try { attempt(n); } catch (e) {}
        }
        if (document.body) {
            document.body.appendChild(document.createTextNode("PASS if no crash "));
        }
    }, 0);
};
</script>
</body>
</html>
