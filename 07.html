
<!DOCTYPE html>
<html>
<body>
<pre id="result"></pre>
<script>
function log(name, value) {
    document.getElementById("result").textContent +=
        name + ": " + value + "\n";
}

log("Worker", typeof Worker !== "undefined");
log("MessageChannel", typeof MessageChannel !== "undefined");
log("structuredClone", typeof structuredClone !== "undefined");

log("ArrayBuffer.transfer",
    typeof ArrayBuffer.prototype.transfer === "function");

log("ArrayBuffer.resize",
    typeof ArrayBuffer.prototype.resize === "function");

log("SharedArrayBuffer",
    typeof SharedArrayBuffer !== "undefined");

log("OfflineAudioContext",
    typeof OfflineAudioContext !== "undefined");

log("webkitOfflineAudioContext",
    typeof webkitOfflineAudioContext !== "undefined");

log("AudioDecoder",
    typeof AudioDecoder !== "undefined");

log("Blob",
    typeof Blob !== "undefined");

log("URL.createObjectURL",
    typeof URL.createObjectURL === "function");
</script>
</body>
</html>
