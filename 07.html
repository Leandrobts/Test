<!DOCTYPE html>
<script>
const dummies = [];
for (let i = 0; i < 200; i++) {
    const c = document.createElement('canvas');
    c.width = 1;
    c.height = 1;
    const dctx = c.getContext('2d');
    dctx.font = '10px "d' + i + '_' + performance.now() + '"';
    dummies.push(c, dctx);
}

const keepAlive = [];
for (let i = 0; i < 64; i++) {
    const fam = 'ahem_' + i + '_' + performance.now();
    const face = new FontFace(fam, 'url("resources/Ahem.woff")');
    document.fonts.add(face);
    face.load();

    const canvas = document.createElement('canvas');
    canvas.width = 32;
    canvas.height = 32;
    const ctx = canvas.getContext('2d');
    keepAlive.push(face, canvas, ctx);

    for (let k = 0; k < 200; k++) {
        ctx.font = '16px ' + fam + ', sans-serif';

        const tm = ctx.measureText('ABCD');
        void tm.width;
        void tm.fontBoundingBoxAscent;
        void tm.fontBoundingBoxDescent;
        void tm.emHeightAscent;
        void tm.emHeightDescent;
        void tm.hangingBaseline;
        void tm.ideographicBaseline;

        ctx.fillText('ABCD', 2, 20);
        ctx.strokeText('ABCD', 2, 20);
    }
}
</script>
