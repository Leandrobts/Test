<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>PS4 - Scroll Driven Animation Registry Test</title>

<style>
html, body {
    margin: 0;
    padding: 0;
}

body {
    height: 2000000px;
    overflow-y: scroll;
}

#t {
    position: fixed;
    top: 10px;
    left: 10px;

    width: 100px;
    height: 100px;

    background: red;

    will-change: transform;

    animation: spin linear;
    animation-duration: 1000ms;
    animation-timeline: scroll(root);
}

#t.noanim {
    animation: none;
}

#info {
    position: fixed;
    top: 120px;
    left: 10px;

    width: 420px;
    max-height: 70vh;

    overflow: auto;

    padding: 8px;

    background: rgba(0, 0, 0, 0.85);
    color: white;

    font-family: monospace;
    font-size: 12px;

    z-index: 999999;
}

@keyframes spin {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}
</style>

</head>

<body>

<div id="t"></div>

<pre id="info">PS4 Scroll Timeline Test
Starting...
</pre>

<script>

(function () {

    "use strict";

    var t = document.getElementById("t");
    var info = document.getElementById("info");

    var toggle = 0;
    var iterations = 0;

    var started = Date.now();

    function log(message) {
        var elapsed = Date.now() - started;

        info.textContent +=
            "[" + elapsed + "ms] " + message + "\n";

        /*
         * Mantém o log limitado para evitar crescimento
         * excessivo do DOM durante o teste.
         */
        if (info.textContent.length > 16000) {
            info.textContent =
                info.textContent.substring(6000);
        }

        /*
         * Não usar console.log como mecanismo principal.
         * O navegador do PS4 pode ter comportamento diferente
         * com o console remoto.
         */
    }


    function testFeatures() {

        log("");
        log("================================");
        log("FEATURE DETECTION");
        log("================================");

        log(
            "User Agent: " +
            navigator.userAgent
        );

        /*
         * animation-timeline
         */
        var animationTimelineSupported = false;

        try {
            animationTimelineSupported =
                CSS.supports(
                    "animation-timeline",
                    "scroll(root)"
                );
        } catch (e) {
            animationTimelineSupported = false;
        }

        log(
            "CSS animation-timeline: " +
            animationTimelineSupported
        );


        /*
         * ScrollTimeline constructor.
         */
        var scrollTimelineConstructor =
            typeof window.ScrollTimeline !== "undefined";

        log(
            "window.ScrollTimeline: " +
            scrollTimelineConstructor
        );


        /*
         * scrollTo behavior.
         */
        var smoothSupported = false;

        try {
            smoothSupported =
                CSS.supports(
                    "scroll-behavior",
                    "smooth"
                );
        } catch (e) {
            smoothSupported = false;
        }

        log(
            "CSS smooth scrolling: " +
            smoothSupported
        );


        /*
         * requestAnimationFrame.
         */
        log(
            "requestAnimationFrame: " +
            (typeof window.requestAnimationFrame === "function")
        );


        /*
         * computed style.
         */
        var computedTimeline = "";

        try {
            computedTimeline =
                window.getComputedStyle(t)
                    .getPropertyValue("animation-timeline");
        } catch (e) {
            computedTimeline = "ERROR";
        }

        log(
            "Computed animation-timeline: " +
            computedTimeline
        );


        /*
         * CSS animation name.
         */
        var animationName = "";

        try {
            animationName =
                window.getComputedStyle(t)
                    .getPropertyValue("animation-name");
        } catch (e) {
            animationName = "ERROR";
        }

        log(
            "Computed animation-name: " +
            animationName
        );


        /*
         * document.scrollingElement
         */
        log(
            "Scrolling element: " +
            (
                document.scrollingElement ?
                document.scrollingElement.tagName :
                "NONE"
            )
        );


        log("");
        log("Feature detection complete.");
        log("");
    }


    function doScroll() {

        var currentY =
            window.pageYOffset ||
            document.documentElement.scrollTop ||
            document.body.scrollTop ||
            0;

        var target;

        if (currentY < 1000000)
            target = 1900000;
        else
            target = 100;

        log(
            "SCROLL -> " +
            target +
            " current=" +
            currentY
        );

        try {

            window.scrollTo({
                top: target,
                behavior: "smooth"
            });

        } catch (e) {

            /*
             * Fallback apenas para navegadores que não aceitem
             * o objeto usado por scrollTo().
             *
             * O caminho preferencial continua sendo smooth.
             */

            log(
                "scrollTo(object) failed: " +
                e
            );

            try {
                window.scrollTo(0, target);
            } catch (e2) {
                log(
                    "scrollTo fallback failed: " +
                    e2
                );
            }
        }
    }


    function forceLayout() {

        /*
         * Mantém a mesma ideia do teste original:
         * acessar offsetHeight para obrigar o WebKit a
         * resolver qualquer trabalho de layout pendente.
         */

        var h = document.body.offsetHeight;

        /*
         * Evita que o compilador/JIT hipotético trate o acesso
         * como completamente irrelevante.
         */
        return h;
    }


    function loop() {

        /*
         * Mesma alternância do teste original.
         */

        if (toggle++ & 1) {

            t.classList.remove("noanim");

            log(
                "ITER " +
                iterations +
                " -> animation ON"
            );

        } else {

            t.classList.add("noanim");

            log(
                "ITER " +
                iterations +
                " -> animation OFF"
            );
        }


        /*
         * Mesmo flush de layout.
         */

        forceLayout();


        /*
         * Mesmo padrão do original:
         * a cada 16 toggles fazemos novo scroll.
         */

        if ((toggle & 0xf) === 0) {

            log(
                "ITER " +
                iterations +
                " -> periodic scroll"
            );

            doScroll();
        }


        ++iterations;


        /*
         * 120 iterações, igual ao LayoutTest original.
         */

        if (iterations < 120) {

            setTimeout(
                loop,
                8
            );

        } else {

            finish();
        }
    }


    function finish() {

        var finalY =
            window.pageYOffset ||
            document.documentElement.scrollTop ||
            document.body.scrollTop ||
            0;

        log("");
        log("================================");
        log("TEST FINISHED");
        log("================================");

        log(
            "Iterations: " +
            iterations
        );

        log(
            "Final scrollY: " +
            finalY
        );

        log(
            "Elapsed: " +
            (Date.now() - started) +
            " ms"
        );

        log("");
        log("PASS if no crash.");
    }


    /*
     * Equivalente ao load do teste original.
     */

    window.addEventListener(
        "load",
        function () {

            log("window.load");

            testFeatures();


            /*
             * Mesmo acesso utilizado pelo teste original.
             */

            forceLayout();

            log(
                "Initial layout flush complete."
            );


            /*
             * Mesmo requestAnimationFrame.
             */

            requestAnimationFrame(
                function () {

                    log(
                        "Initial requestAnimationFrame."
                    );

                    /*
                     * Primeiro scroll.
                     */

                    doScroll();


                    /*
                     * Inicia o loop original.
                     */

                    setTimeout(
                        loop,
                        8
                    );
                }
            );

        },
        false
    );

})();

</script>

</body>
</html>
