<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>UAF PoC — Opção 1 (transferControlToOffscreen)</title>
</head>
<body>
<pre id="log">Iniciando...</pre>
<script>
function log(msg) {
    document.getElementById('log').textContent = msg;
}

// Verificar suporte a transferControlToOffscreen antes de prosseguir
if (typeof HTMLCanvasElement === 'undefined' ||
    typeof HTMLCanvasElement.prototype.transferControlToOffscreen !== 'function') {
    log('ERRO: transferControlToOffscreen nao suportado.\nUse a Opcao 2 (index.html em opcao2/).');
} else {
    // Criar canvas aqui (main thread tem DOM) e transferir ownership ao worker
    // O Worker nao pode criar canvas diretamente porque nao tem acesso ao DOM
    var canvas = document.createElement('canvas');
    canvas.width  = 10;
    canvas.height = 10;

    // transferControlToOffscreen() transfere o controle do canvas ao worker
    // Apos isso, o main thread NAO pode mais usar este canvas
    var offscreen = canvas.transferControlToOffscreen();

    var worker = new Worker('worker.js');

    worker.onmessage = function(e) {
        log(e.data);
    };

    worker.onerror = function(e) {
        log('ERRO no worker: ' + e.message + ' (linha ' + e.lineno + ')');
        e.preventDefault();
    };

    // Envia o canvas como transferible — ownership passa inteiramente ao worker
    worker.postMessage({ canvas: offscreen }, [offscreen]);
    log('Canvas transferido ao worker. Aguardando resultado...');
}
</script>
</body>
</html>
