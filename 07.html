<!DOCTYPE html>
<html>
<body>
<p>This test passes if it does not crash.</p>
<div id="host"></div>
<div id="result"></div>
<script>

function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);  
}

let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable';
shadowRoot.appendChild(victim);
victim.focus();

async function runTest() {

    document.addEventListener('blur', () => {
        victim.remove();
        victim = null;
        gc();

        result.textContent = 'BLUR TRIGGERED';
    }, true);

    // Substituição Variante E:
    // Nenhuma simulação. Aguarda uma perda real de foco.
    result.textContent = 'READY - trigger real window blur';

    await new Promise((resolve) => {
        requestAnimationFrame(() => setTimeout(resolve, 0));
    });

}  
runTest();

</script>
</body>
</html>
