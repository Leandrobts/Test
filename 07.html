<!doctype html>
<html>
<head>
<title>CSS Container Queries Test: Style container for pseudo elements</title>
<style>
  #c1 {
    --theme: green;
  }
  @container style(--theme: green) {
    #c1::before {
      content: "";
      color: green;
      display: block;
      height: 100px;
    }
  }

  #c2 {
    --theme: red;
  }
  #c2::before { color: red }
  #c2.green {
    --theme: green;
  }
  @container style(--theme: green) {
    #c2::before {
      content: "";
      color: green;
    }
  }
</style>
</head>
<body>

<div id="c1"></div>
<div id="c2"></div>

<script>
// Função auxiliar simples para simular o assert do harness
function assert(condition, message) {
    if (!condition) {
        throw new Error("Assertion failed: " + message);
    }
}

try {
    // Teste 1
    let style1 = getComputedStyle(c1, "::before");
    assert(style1.color === "rgb(0, 128, 0)", "Cor do c1::before deve ser verde");
    assert(style1.height === "100px", "Altura do c1::before deve ser 100px");
    console.log("TESTE 1 PASSOU: ::before pseudo element querying style() of originating element");

    // Teste 2
    let style2 = getComputedStyle(c2, "::before");
    assert(style2.color === "rgb(255, 0, 0)", "Cor inicial do c2::before deve ser vermelha");
    console.log("TESTE 2 PASSOU: ::before pseudo element not matching style()");

    // Teste 3
    c2.className = "green";
    let style3 = getComputedStyle(c2, "::before");
    assert(style3.color === "rgb(0, 128, 0)", "Cor do c2::before após classe green deve ser verde");
    console.log("TESTE 3 PASSOU: ::before pseudo element matching style() query after class change");

} catch (error) {
    console.error("FALHA NO TESTE:", error.message);
}
</script>

</body>
</html>
