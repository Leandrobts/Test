<!DOCTYPE html>
<body>
<button onclick="go()">START</button>
<script>
function go() {
    var f = document.createElement("iframe");
    document.body.appendChild(f);

    var d = f.contentDocument;
    d.open();
    d.write("<body><div id=x></div>");
    d.close();

    var x = d.getElementById("x");
    x.style.height = "1px";

    setTimeout(function () {
        x.style.height = "50000px";
        f.src = "about:blank";
        f.remove();
    }, 0);

    setTimeout(function () {
        document.body.textContent = "PASS - no crash";
    }, 1000);
}
</script>
