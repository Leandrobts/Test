<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Teste de Regressão: Descarte de Lazy Agents no InspectorController</title>
</head>
<body>
<div id="status">Executando teste...</div>

<script>
// Função utilitária de GC via alocação recursiva de memória
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 1000; i++)
        gcRec(10);
}

function runTest() {
    for (let i = 0; i < 100; i++) {
        // 1. Cria contexto aninhado para instanciar PageInspectorController e lazy agents
        const iframe = document.createElement("iframe");
        document.body.appendChild(iframe);

        const win = iframe.contentWindow;

        // 2. Aciona APIs que exercitam os lazy agents (m_inspectorAgent, m_pageAgent)
        if (win.console && win.console.profile) {
            win.console.profile("Profile " + i);
            win.console.profileEnd("Profile " + i);
        }

        // 3. Destrói o iframe abruptamente para forçar discardValues()
        document.body.removeChild(iframe);

        // 4. Força pressão no coletor
        if (i % 10 === 0) {
            gc();
        }
    }
}

try {
    runTest();
    document.getElementById("status").innerText = "PASS: Lazy agents descartados sem travamento.";
} catch (e) {
    document.getElementById("status").innerText = "FAIL: " + e.message;
}
</script>
</body>
</html>
