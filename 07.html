<!DOCTYPE html>
<html>
<body>
<p>This test passes if it does not crash.</p>
<div id="host"></div>
<div id="result"></div>

<script>

let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable';
shadowRoot.appendChild(victim);
victim.focus();

function log(message) {
    result.textContent += message + '\n';
}

function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

async function runTest() {

    log('[START] victim focused');

    document.addEventListener('blur', () => {
        log('[BLUR] captured');
        victim.remove();
        log('[UAF] victim removed');
        victim = null;
        log('[UAF] victim reference cleared');
        gc();
        log('[GC] completed');
    }, true);

    log('[TRIGGER] window.blur()');

    window.blur();
    await new Promise((resolve) => {
        requestAnimationFrame(() => setTimeout(resolve, 0));
    });

    log('[DONE] test completed');
}

runTest();

</script>

</body>
</html>
