<!DOCTYPE html>
<p>This test passes if it does not crash.</p>
<script>
const dummies = [];
for (let i = 0; i < 3500; i++) {
    const canvas = document.createElement('canvas');
    canvas.width = 1;
    canvas.height = 1;
    const dummy = canvas.getContext('2d');
    dummy.font = '10px "dummy' + i + '"';
    dummies.push(dummy);
}

const keepAlive = [];
for (let attempt = 0; attempt < 2; attempt++) {
    const missingFontURL = 'url("missing-font-' + attempt + '.otf")';

    const metricsDonor = new FontFace('metricsDonor' + attempt, missingFontURL);
    const measured = new FontFace('measured' + attempt, missingFontURL, { unicodeRange: 'U+13A0-13FF' });
    document.fonts.add(metricsDonor);
    document.fonts.add(measured);

    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    const context = canvas.getContext('2d');
    context.font = '10px metricsDonor' + attempt + ', measured' + attempt;
    keepAlive.push(metricsDonor, measured, canvas, context);

    context.measureText('\u13A0\u13A2\u13A4');
}
</script>
