<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Diagnostico de Elementos e APIs - Teste Commit ebc83b8</title>
</head>
<body>
  <h1>Diagnostico de Elementos e APIs do Teste (Commit ebc83b8)</h1>
  <p>User-Agent: <span id="ua"></span></p>
  <pre id="report">Executando diagnostico...</pre>

  <script>
    (function () {
      var uaEl = document.getElementById("ua");
      var reportEl = document.getElementById("report");
      var lines = [];

      function log(msg) {
        lines.push(msg);
      }

      var uaText = (typeof navigator !== "undefined" && navigator.userAgent) ? navigator.userAgent : "N/A";
      if (uaEl) {
        uaEl.textContent = uaText;
      }

      log("=== DIAGNOSTICO DO NAVEGADOR (FOCO: PS4 / WEBKIT) ===");
      log("UserAgent: " + uaText);
      log("");

      // 1. Verificacao de APIs / Globais usadas no teste do commit
      log("--- 1. APIs e Globais ---");
      var hasDocument = typeof document !== "undefined";
      log("[API] document: " + hasDocument);

      var hasImplementation = hasDocument && typeof document.implementation !== "undefined";
      log("[API] document.implementation: " + hasImplementation);

      var hasCreateHTMLDocument = hasImplementation && typeof document.implementation.createHTMLDocument === "function";
      log("[API] document.implementation.createHTMLDocument(): " + hasCreateHTMLDocument);

      var hasBody = hasDocument && document.body !== null && typeof document.body !== "undefined";
      log("[API] document.body: " + hasBody);

      var hasTextContent = hasBody && ("textContent" in document.body);
      log("[API] Element.prototype.textContent: " + hasTextContent);

      var hasCreateElement = hasDocument && typeof document.createElement === "function";
      log("[API] document.createElement(): " + hasCreateElement);

      var hasGetElementById = false;
      var hasAppendChild = false;
      var hasInnerHTML = false;
      var hasLabelsProperty = false;

      // 2. Criacao e verificacao do documento secundario e elementos do teste
      log("");
      log("--- 2. Documento Secundario e Elementos (<input>, <label>, <div>, <span>) ---");
      var secDoc = null;
      if (hasCreateHTMLDocument) {
        try {
          secDoc = document.implementation.createHTMLDocument();
          log("[OK] createHTMLDocument() retornou objeto: " + (secDoc !== null && typeof secDoc === "object"));
        } catch (e) {
          log("[ERRO] Falha ao chamar createHTMLDocument(): " + e);
        }
      } else {
        log("[FALTA] createHTMLDocument indisponivel; pulando criacao do documento secundario.");
      }

      if (secDoc) {
        hasGetElementById = typeof secDoc.getElementById === "function";
        log("[API] secondaryDocument.getElementById(): " + hasGetElementById);

        hasInnerHTML = secDoc.body !== null && ("innerHTML" in secDoc.body);
        log("[API] secondaryDocument.body.innerHTML: " + hasInnerHTML);

        if (hasInnerHTML) {
          try {
            secDoc.body.innerHTML = "<input id=\"i\"><label for=\"i\"></label>";
            log("[OK] Atribuido innerHTML com input#i e label[for=i]");
          } catch (e) {
            log("[ERRO] Falha ao atribuir innerHTML: " + e);
          }
        }

        var inputEl = null;
        if (hasGetElementById) {
          try {
            inputEl = secDoc.getElementById("i");
            log("[ELEM] getElementById('i'): " + (inputEl ? inputEl.tagName : "null"));
          } catch (e) {
            log("[ERRO] Falha em getElementById('i'): " + e);
          }
        }

        var labelsList = null;
        if (inputEl) {
          hasLabelsProperty = ("labels" in inputEl);
          log("[API] HTMLInputElement.labels presente: " + hasLabelsProperty);
          try {
            labelsList = inputEl.labels;
            log("[OBJ] input.labels tipo: " + (labelsList === null ? "null" : typeof labelsList));
            if (labelsList && typeof labelsList.length !== "undefined") {
              log("[INFO] input.labels.length: " + labelsList.length);
              log("[ELEM] input.labels[0]: " + (labelsList[0] ? labelsList[0].tagName : "undefined/null"));
            }
          } catch (e) {
            log("[ERRO] Falha ao acessar input.labels: " + e);
          }
        }

        var labelEl = null;
        if (typeof secDoc.querySelector === "function") {
          labelEl = secDoc.querySelector("label[for=\"i\"]");
          log("[ELEM] label[for='i'] presente: " + (labelEl ? labelEl.tagName : "null"));
          if (labelEl) {
            log("[ATTR] label.htmlFor: '" + labelEl.htmlFor + "'");
          }
        }

        var survivor = null;
        var child = null;
        try {
          survivor = secDoc.createElement("div");
          child = secDoc.createElement("span");
          log("[ELEM] createElement('div') e createElement('span'): " +
              (survivor && survivor.tagName === "DIV") + " / " +
              (child && child.tagName === "SPAN"));
        } catch (e) {
          log("[ERRO] Falha ao criar elementos div/span: " + e);
        }

        if (survivor && child) {
          hasAppendChild = typeof survivor.appendChild === "function";
          log("[API] Node.prototype.appendChild(): " + hasAppendChild);
          if (hasAppendChild) {
            try {
              survivor.appendChild(child);
              log("[OK] survivor.appendChild(child) executado; childCount=" + survivor.childNodes.length);
            } catch (e) {
              log("[ERRO] Falha em survivor.appendChild(child): " + e);
            }
          }
        }
      }

      // 3. Verificacao de funcoes/APIs auxiliares do harness de teste do WebKit
      log("");
      log("--- 3. APIs Auxiliares do Harness de Teste (WebKit LayoutTests) ---");
      log("[HARNESS] window.testRunner: " + (typeof window.testRunner !== "undefined"));
      log("[HARNESS] window.testRunner.dumpAsText: " +
          (typeof window.testRunner !== "undefined" && typeof window.testRunner.dumpAsText === "function"));
      log("[HARNESS] window.GCController: " + (typeof window.GCController !== "undefined"));
      log("[HARNESS] window.GCController.collect: " +
          (typeof window.GCController !== "undefined" && typeof window.GCController.collect === "function"));

      // 4. Resumo final
      log("");
      log("--- 4. Resumo ---");
      var coreChecks = [
        hasDocument,
        hasImplementation,
        hasCreateHTMLDocument,
        hasBody,
        hasTextContent,
        hasCreateElement,
        hasGetElementById,
        hasInnerHTML,
        hasLabelsProperty,
        hasAppendChild
      ];
      var passed = 0;
      for (var i = 0; i < coreChecks.length; i++) {
        if (coreChecks[i]) {
          passed++;
        }
      }
      log("APIs essenciais do fluxo do teste presentes: " + passed + " / " + coreChecks.length);

      if (reportEl) {
        reportEl.textContent = lines.join("\n");
      }
    })();
  </script>
</body>
</html>
