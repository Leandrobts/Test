<!DOCTYPE html>
<html>
<body>
<script>

let cycle = 0;
const maxCycles = 30;

function finish() {
    document.body.textContent = "PASS if no crash in the UI process during page close.";
    
}

function runCycle() {
    if (cycle++ >= maxCycles)
        return finish();

    let popup = window.open("about:blank", "", "width=200,height=200");
    if (!popup)
        return finish();

    popup.document.body.innerHTML =
        '<iframe id="target_frame" loading="lazy"></iframe>' +
'<div id="container" tabindex="0" autofocus></div>' +
'<script>' +
'const frameB = document.createElement("iframe");' +
'frameB.id = "frame_b";' +
'frameB.src = "b";' +
'document.body.appendChild(frameB);' +
'let frame = document.getElementById("target_frame");' +
'addEventListener("load", () => {' +
'frame.srcdoc = "a";' +
'frame.contentWindow?.addEventListener("blur", () => { });' +
'frame.focus();' +
'});' +
'container.onfocusin = () => {' +
'document.body.innerHTML = "";' +
'};' +






        '<\/script>';

    // Wait two main-thread rAFs so the popup gets a layer-tree commit and the
    // scrolling-thread display link observer registers, scheduling the 1ms timer.
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            popup.close();
            // Closing the popup destroys its RemoteLayerTreeEventDispatcher on the
            // main thread. Race against the scrolling-thread timer callback.
            setTimeout(runCycle, 0);
        });
    });
}

runCycle();
</script>
</body>
</html>
