<!DOCTYPE html>
<p>This test passes if it does not crash.</p>
<script>
const dummies = [];
for (let i = 0; i < 500; i++) {
  const d = document.createElement('canvas');
  d.width = 1; d.height = 1;
  d.getContext('2d').font = `10px "Z${i}"`;
  dummies.push(d);
}

const face = new FontFace('FF', 'local("Helvetica")');
document.fonts.add(face);
void face.loaded;

const c = document.createElement('canvas');
c.width = 64; c.height = 64;
const ctx = c.getContext('2d');
ctx.font = '10px Times, FF';

let r = false;
Object.defineProperty(face, 'then', {
  configurable: true,
  get() {
    if (r) return undefined;
    r = true;
    document.fonts.add(new FontFace('U', 'local("x")'));
    r = false;
    return undefined;
  }
});

ctx.fillText('\u13A0\u13A2\u13A4', 0, 32);
</script>
