
<!DOCTYPE html>
<html>
<body>
<script>
const iterations = 25;
let n = 0;

function runTest(win) {
    if (!win.FontFace) return;
    const font = new win.FontFace("TestFont", "url(data:font/woff2;base64,AA==)");
    win.document.fonts.add(font);
    font.load().catch(function() {});
}
function round() {
    const frame = document.createElement("iframe");
    document.body.appendChild(frame);

    try {
        runTest(frame.contentWindow);
    } catch(e) {
        console.log("ERROR:", e.message);
    }

    frame.remove();

    if (++n < iterations) {
        setTimeout(round, 0);
    } else {
        document.body.innerHTML += "<p>TEST FINISHED</p>";
    }
}

onload = round;
</script>
</body>
</html>
