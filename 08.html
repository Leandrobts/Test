<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>PS4 FullScreen - T8</title></head>
<body>
<pre id="ua"></pre>
<pre id="out"></pre>

<div id="d1" style="width:100px;height:100px;background:blue"></div>

<br>
<button onclick="runT()">T8: reqFS - handler calls exitFS immediately</button><br><br>

<script>
document.getElementById('ua').textContent = navigator.userAgent;
function log(s){ document.getElementById('out').textContent += s + '\n'; }
function safe(fn, tag){ try { return fn(); } catch(e) { log('[EXC@' + tag + '] ' + e); return null; } }
function runT(){
    document.getElementById('out').textContent = '';
    log('=== T8 ===');
    var d1 = document.getElementById('d1');
    var h8 = function(){
        document.removeEventListener('webkitfullscreenchange', h8);
        log('[handler] fired - calling exitFS only');
        safe(function(){ document.webkitExitFullscreen(); log('[handler] exitFS called'); }, 'exitFS');
    };
    document.addEventListener('webkitfullscreenchange', h8);
    safe(function(){ d1.webkitRequestFullscreen(); }, 'reqFS');
    setTimeout(function(){ document.removeEventListener('webkitfullscreenchange', h8); }, 3000);
}
</script>
</body>
</html>
