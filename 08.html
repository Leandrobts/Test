
<!DOCTYPE html>
<html>
<body>
<pre id="out"></pre>
<script>
(function(){
var p=Element.prototype;
var c=HTMLCanvasElement.prototype;
var r=Range.prototype;
var n=navigator;
var tests={
SVGPointAtLength:typeof SVGGeometryElement!=="undefined"?typeof SVGGeometryElement.prototype.getPointAtLength:"absent",
SVGTotalLength:typeof SVGGeometryElement!=="undefined"?typeof SVGGeometryElement.prototype.getTotalLength:"absent",
SVGFEImage:typeof SVGFEImageElement,
CanvasCaptureStream:typeof c.captureStream,
MediaStream:typeof MediaStream,
MediaRecorder:typeof MediaRecorder,
RTCPeerConnection:typeof RTCPeerConnection,
SharedWorker:typeof SharedWorker,
ServiceWorker:typeof n.serviceWorker,
BackgroundFetch:typeof BackgroundFetchManager,
TrustedTypes:typeof trustedTypes,
RangeFragment:typeof r.createContextualFragment,
Response:typeof Response,
ReadableStream:typeof ReadableStream,
IndexedDB:typeof indexedDB,
MediaStreamTrackProcessor:typeof MediaStreamTrackProcessor,
ResizableArrayBuffer:typeof ArrayBuffer.prototype.resize,
ArrayBufferMaxByteLength:typeof ArrayBuffer.prototype.maxByteLength,
WebAssembly:typeof WebAssembly
};
var out=[];
for(var k in tests)out.push(k+": "+tests[k]);
document.body.innerHTML="<pre>"+out.join("\n")+"</pre>";
})();
</script>
</body>
</html>
