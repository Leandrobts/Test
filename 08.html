<!DOCTYPE html>
<html>
<body>
<div id="result">Running</div>
<script>

function gc() {
    function gcRec(n) {
          if (n < 1)
              return {};
          var temp = {i: "ab" + i + (i / 100000)};
          temp += "foo";
          gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
    gcRec(10);
}


const frameCount = 15;
const batchCount = 3;
let remainingBatches = batchCount;

function runNextBatch() {
    Array.from(document.querySelectorAll('iframe')).forEach((iframe) => iframe.remove());
   
        gc();

    let remainingFrames = frameCount;
    window.onmessage = () => {
        --remainingFrames;
        result.textContent = `${remainingFrames} frames / ${remainingBatches} batches`;
        if (remainingFrames)
            return;

        if (!--remainingBatches) {
            result.textContent = 'PASS';            
        }

        runNextBatch();
    }

    for (let i = 0; i < frameCount; ++i) {
        const iframe = document.createElement('iframe');
        iframe.src = 'resources/resize-observer-target-refcount-crash-child.html';
        iframe.style.width = '80px';
        iframe.style.height = '80px';
        document.body.appendChild(iframe);
    }
}

runNextBatch();

</script>
</body>
</html>
