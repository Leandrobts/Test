<!DOCTYPE html>

<head><meta charset="utf-8"></head>
<body>
<script>
function gc() {
    function gcRec(n) {
        if (n < 1) return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 10000; i++) gcRec(10);
}
for (var k = 0; k < 4; k++) {
    var original = new Blob(['aa']);
    var cloned = structuredClone(original);
    original = null;
    gc();
    var fd = new FormData();
    fd.append('a', cloned);
    var response = new Response(fd);
    Object.prototype.__defineGetter__('then', function() {
        response = null;
        gc();
    });
  //  gc();
    response.arrayBuffer();
}
</script>
</body>
</html>
