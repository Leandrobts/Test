<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 Diag v2</title>
<style>
body{background:#111;color:#ddd;font-family:monospace;font-size:13px;padding:6px;margin:0}
h2{color:#8cf;font-size:13px;margin:8px 0 2px;padding:2px 4px;background:#1a2030}
.r{display:flex;justify-content:space-between;padding:1px 4px;border-bottom:1px solid #1a1a1a}
.l{color:#bbb;flex:1}
.v{margin-left:6px;white-space:nowrap}
.ok{color:#4e4}
.no{color:#e44}
.wn{color:#ea4}
.in{color:#48e}
.cr{color:#f0f;background:#300;padding:1px 4px;font-weight:bold}
#err{color:#f44;background:#200;padding:4px;margin:4px 0;display:none}
#st{padding:2px 6px;background:#222;border:1px solid #444;display:inline-block;margin-bottom:4px}
button{margin:2px;padding:3px 8px;background:#333;color:#ddd;border:1px solid #555;cursor:pointer;font-size:12px}
</style>
</head>
<body>
<script>
(function(){const logElement=document.createElement('pre');logElement.id='debug-log';logElement.style.cssText='position: fixed; bottom: 0; left: 0; width: 100%; max-height: 220px; overflow-y: auto; background: rgba(0, 0, 0, 0.85); color: #ff5555; font-family: monospace; font-size: 11px; z-index: 999999; padding: 8px; box-sizing: border-box; margin: 0; border-top: 2px solid #ff0000; text-align: left; white-space: pre-wrap; word-break: break-all;';if(document.body){document.body.appendChild(logElement);}else{document.addEventListener('DOMContentLoaded',()=>document.body.appendChild(logElement));}function log(msg,color='#ff5555'){if(!logElement)return;const line=document.createElement('div');line.style.color=color;line.textContent=msg;logElement.appendChild(line);logElement.scrollTop=logElement.scrollHeight;}window.onerror=function(message,source,lineno,colno,error){log(`[ERRO JS] ${message}\n  -> ${source}:${lineno}:${colno}`);};window.addEventListener('error',function(event){const target=event.target;if(target&&(target.tagName||target===window)){const tagName=target.tagName?target.tagName.toLowerCase():'recurso';const sourceUrl=target.src||target.href||'desconhecido';log(`[FALHA RECURSO/${tagName}] Não foi possível carregar: ${sourceUrl}`,'#ffaa00');}},true);window.addEventListener('unhandledrejection',function(event){log(`[PROMISE REJECTION] ${event.reason}`);});['log','error','warn','info'].forEach(method=>{const original=console[method];console[method]=function(...args){original.apply(console,args);const text=args.map(arg=>{if(typeof arg==='object'){try{return JSON.stringify(arg);}catch(e){return '[Objeto Circular]';}}return arg;}).join(' ');let color='#ffffff';if(method==='error')color='#ff5555';if(method==='warn')color='#ffaa00';log(`[Console.${method}] ${text}`,color);};});log('[Debug Ativo]','#00ff00');})();
 </script>
<div id="err"></div>
<div id="st">Pronto</div><br>
<button onclick="runAll()">Executar Todos</button>
<button onclick="clearState()">Limpar LS</button>
<button onclick="location.reload()">Reload</button>
<div id="out"></div>

<script>
// IMPORTANTE: sem 'use strict', sem Unicode literal em strings JS,
// sem ES6, puro ES5 — maximo compat PS4 WebKit 605.1.15

// --- captura erros globais antes de qualquer coisa ---
window.onerror = function(msg, url, line, col) {
    var e = document.getElementById('err');
    e.style.display = 'block';
    e.innerHTML = 'ERRO JS linha ' + line + ': ' + msg;
    document.getElementById('st').innerHTML = 'ERRO';
    return true;
};

// --- helpers ---
var OUT = null;
var CUR_SEC = null;

function setStatus(s) {
    document.getElementById('st').innerHTML = s;
}

function newSection(title) {
    OUT = OUT || document.getElementById('out');
    var h = document.createElement('h2');
    h.innerHTML = title;
    OUT.appendChild(h);
    CUR_SEC = document.createElement('div');
    OUT.appendChild(CUR_SEC);
}

function addRow(label, val, cls) {
    var r = document.createElement('div');
    r.className = 'r';
    var c = cls || (val === true ? 'ok' : val === false ? 'no' : 'in');
    var disp = val === true ? 'SIM' : val === false ? 'NAO' : String(val);
    r.innerHTML = '<span class="l">' + label + '</span>'
                + '<span class="v ' + c + '">' + disp + '</span>';
    CUR_SEC.appendChild(r);
}

// --- localStorage helpers ---
var LS = 'ps4d2_';
function lsSet(k, v) { try { localStorage.setItem(LS+k, v); } catch(e) {} }
function lsGet(k)    { try { return localStorage.getItem(LS+k); } catch(e) { return null; } }
function lsDel(k)    { try { localStorage.removeItem(LS+k); } catch(e) {} }

function clearState() {
    try {
        var keys = [];
        for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.indexOf(LS) === 0) keys.push(k);
        }
        for (var j = 0; j < keys.length; j++) localStorage.removeItem(keys[j]);
    } catch(e) {}
    setStatus('LS limpo');
}

// ===========================================================================
// S1 — Ambiente
// ===========================================================================
function s1_env() {
    newSection('1. Ambiente');
    addRow('userAgent', navigator.userAgent, 'in');
    addRow('platform',  navigator.platform || '?', 'in');
    addRow('vendor',    navigator.vendor || '?', 'in');
    addRow('language',  navigator.language || '?', 'in');

    var lsOk = false;
    try { localStorage.setItem('_t','1'); localStorage.removeItem('_t'); lsOk=true; } catch(e) {}
    addRow('localStorage', lsOk);

    addRow('Promise',         typeof Promise !== 'undefined');
    addRow('Symbol',          typeof Symbol !== 'undefined');
    addRow('fetch',           typeof fetch !== 'undefined');
    addRow('Object.defineProperty', typeof Object.defineProperty === 'function');
    addRow('Proxy',           typeof Proxy !== 'undefined');
    addRow('ArrayBuffer',     typeof ArrayBuffer !== 'undefined');
    addRow('WeakRef',         typeof WeakRef !== 'undefined');
}

// ===========================================================================
// S2 — FontFace API
// ===========================================================================
function s2_fontface() {
    newSection('2. FontFace API');
    addRow('typeof FontFace',    typeof FontFace !== 'undefined');
    addRow('typeof FontFaceSet', typeof FontFaceSet !== 'undefined');
    addRow('document.fonts',     'fonts' in document);

    if ('fonts' in document) {
        var df = document.fonts;
        addRow('  .add()',   typeof df.add === 'function');
        addRow('  .check()', typeof df.check === 'function');
        addRow('  .load()',  typeof df.load === 'function');
        addRow('  .ready',  'ready' in df);
        addRow('  .forEach()',typeof df.forEach === 'function');
        var cnt = 0;
        try { df.forEach(function() { cnt++; }); } catch(e) {}
        addRow('  count inicial', cnt, 'in');
    }

    if (typeof FontFace !== 'undefined') {
        var proto = FontFace.prototype;
        addRow('FontFace.prototype', !!proto);
        addRow('  .loaded',  proto && 'loaded' in proto);
        addRow('  .load()',  proto && 'load'   in proto);
        addRow('  .status',  proto && 'status' in proto);
        addRow('  .family',  proto && 'family' in proto);
        addRow('  .then (pre-existe?)', proto && 'then' in proto, 'wn');

        // Testa instanciacao
        try {
            var tf = new FontFace('_t_', 'local(Helvetica)');
            addRow('new FontFace() OK', true);
            addRow('  .status inicial', tf.status, 'in');
            addRow('  .loaded eh Promise', tf.loaded instanceof Promise);
        } catch(e) {
            addRow('new FontFace() ERRO', e.message, 'no');
        }
    }
}

// ===========================================================================
// S3 — defineProperty no prototype
// ===========================================================================
function s3_defineProperty() {
    newSection('3. defineProperty em FontFace.prototype');
    if (typeof FontFace === 'undefined') { addRow('FontFace ausente','skip','wn'); return; }

    // Testa se consegue definir getter
    var defOk = false;
    try {
        Object.defineProperty(FontFace.prototype, 'then', {
            configurable: true,
            get: function() { return undefined; }
        });
        defOk = true;
    } catch(e) {
        addRow('defineProperty ERRO', e.message, 'no');
        return;
    }
    addRow('defineProperty funciona', defOk);

    // Testa se getter eh invocado via acesso direto
    var calledDirect = false;
    try {
        Object.defineProperty(FontFace.prototype, 'then', {
            configurable: true,
            get: function() { calledDirect = true; return undefined; }
        });
        var tmp = new FontFace('_dp_', 'local(Helvetica)');
        void tmp.then; // acessa .then diretamente
        addRow('getter invocado (acesso direto)', calledDirect);
    } catch(e) {
        addRow('getter acesso direto ERRO', e.message, 'no');
    }

    // Limpa
    try {
        Object.defineProperty(FontFace.prototype, 'then', {
            configurable: true, writable: true, value: undefined
        });
    } catch(e) {}
}

// ===========================================================================
// S4 — Fontes locais
// ===========================================================================
function s4_localFonts() {
    newSection('4. Fontes locais (local())');
    if (typeof FontFace === 'undefined') { addRow('FontFace ausente','skip','wn'); return; }

    var list = [
        'Helvetica', 'Helvetica Neue', 'Arial', 'Arial Narrow',
        'Times', 'Times New Roman', 'Courier', 'Courier New',
        'Verdana', 'Georgia', 'Tahoma', 'Impact',
        'SCE-PS3 Rodin LATIN', 'SCE-PS3 Rodin', 'SCE Gothic',
        'Hiragino Kaku Gothic ProN', 'Meiryo', 'Yu Gothic',
        'sans-serif', 'serif', 'monospace'
    ];

    for (var i = 0; i < list.length; i++) {
        var name = list[i];
        try {
            var f = new FontFace('_lf_', 'local("' + name + '")');
            var st = f.status;
            addRow(name, st === 'loaded' ? 'EXISTE (loaded)' : st, st === 'loaded' ? 'ok' : 'wn');
        } catch(e) {
            addRow(name, 'erro: ' + e.message, 'no');
        }
    }
}

// ===========================================================================
// S5 — Getter dispara durante operacoes canvas
// ===========================================================================
function s5_getterFires() {
    newSection('5. Getter dispara durante canvas ops?');
    if (typeof FontFace === 'undefined' || !('fonts' in document)) {
        addRow('APIs ausentes', 'skip', 'wn'); return;
    }

    // Setup: adiciona fonte de teste
    var setupOk = false;
    try {
        var ff = new FontFace('TF', 'local(Helvetica)');
        document.fonts.add(ff);
        void ff.loaded;
        setupOk = true;
    } catch(e) {
        addRow('Setup ERRO', e.message, 'no'); return;
    }
    addRow('Setup FontFace adicionado', setupOk);

    var canvas = document.createElement('canvas');
    canvas.width = 64; canvas.height = 64;
    var ctx = canvas.getContext('2d');

    // Lista: [descricao, fontStr, char, operacao]
    var tests = [
        ['measureText a  — fonte unica',  '10px TF', 'a',       'measure'],
        ['measureText A  — fonte unica',  '10px TF', 'A',       'measure'],
        ['measureText 0  — fonte unica',  '10px TF', '0',       'measure'],
        ['measureText a  — c/ fallback',  '10px Times,TF', 'a', 'measure'],
        ['fillText a     — fonte unica',  '10px TF', 'a',       'fill'],
        ['face.load()    — via JS',       '10px TF', 'a',       'faceload'],
    ];

    for (var i = 0; i < tests.length; i++) {
        var t = tests[i];
        var desc = t[0], fontS = t[1], ch = t[2], op = t[3];
        var fired = false;
        lsSet('s5_last', desc);
        try {
            Object.defineProperty(FontFace.prototype, 'then', {
                configurable: true,
                get: function() { fired = true; return undefined; }
            });
            ctx.font = fontS;
            if (op === 'measure') {
                ctx.measureText(ch);
            } else if (op === 'fill') {
                ctx.fillText(ch, 0, 32);
            } else if (op === 'faceload') {
                var fl = new FontFace('TF2', 'local(Helvetica)');
                document.fonts.add(fl);
                void fl.loaded;
                fl.load();
            }
        } catch(e) {
            addRow(desc, 'excecao: ' + e.message, 'no');
            continue;
        } finally {
            try {
                Object.defineProperty(FontFace.prototype, 'then', {
                    configurable: true, writable: true, value: undefined
                });
            } catch(e2) {}
        }
        addRow(desc, fired ? 'GETTER DISPAROU' : 'nao disparou', fired ? 'ok' : 'wn');
    }
    lsDel('s5_last');
}

// ===========================================================================
// S6 — Acoes dentro do getter
// ===========================================================================
function s6_reentrance() {
    newSection('6. Acoes validas dentro do getter');
    if (typeof FontFace === 'undefined' || !('fonts' in document)) {
        addRow('APIs ausentes', 'skip', 'wn'); return;
    }

    var canvas = document.createElement('canvas');
    canvas.width = 64; canvas.height = 64;
    var ctx = canvas.getContext('2d');
    try {
        var rf = new FontFace('RF', 'local(Helvetica)');
        document.fonts.add(rf);
        void rf.loaded;
        ctx.font = '10px RF';
    } catch(e) { addRow('Setup ERRO', e.message, 'no'); return; }

    // Cada acao testada isoladamente
    var actions = [
        { name: 'ctx.save()', fn: function() { ctx.save(); } },
        { name: 'ctx.save() x8', fn: function() { for(var i=0;i<8;i++) ctx.save(); } },
        { name: 'ctx.restore()', fn: function() { ctx.restore(); } },
        { name: 'ctx.font = novo', fn: function() { ctx.font = '12px RF'; } },
        { name: 'document.fonts.add()', fn: function() {
            document.fonts.add(new FontFace('RF3','local(Helvetica)'));
        }},
        { name: 'document.createElement()', fn: function() {
            document.createElement('span');
        }},
        { name: 'new FontFace() sem add', fn: function() {
            new FontFace('RF4','local(Helvetica)');
        }},
        { name: 'document.body.offsetTop', fn: function() {
            void document.body.offsetTop;
        }},
    ];

    for (var i = 0; i < actions.length; i++) {
        var a = actions[i];
        var fired = false, done = false, errMsg = null;
        lsSet('s6_last', a.name);

        // Canvas novo para cada teste (evita estado acumulado de saves)
        var c2 = document.createElement('canvas');
        c2.width = 64; c2.height = 64;
        var ctx2 = c2.getContext('2d');
        try {
            ctx2.font = '10px RF';
        } catch(e) {}

        try {
            Object.defineProperty(FontFace.prototype, 'then', {
                configurable: true,
                get: function() {
                    fired = true;
                    try { a.fn(); done = true; } catch(e) { errMsg = e.message; }
                    return undefined;
                }
            });
            ctx2.measureText('a');
        } catch(e) {
            addRow(a.name, 'excecao externa: ' + e.message, 'no');
            continue;
        } finally {
            try {
                Object.defineProperty(FontFace.prototype, 'then', {
                    configurable: true, writable: true, value: undefined
                });
            } catch(e2) {}
        }

        if (!fired)      addRow(a.name, 'getter nao disparou', 'wn');
        else if (errMsg) addRow(a.name, 'getter OK / acao ERRO: ' + errMsg, 'no');
        else if (!done)  addRow(a.name, 'getter OK / acao incompleta', 'wn');
        else             addRow(a.name, 'getter + acao OK', 'ok');
    }
    lsDel('s6_last');
}

// ===========================================================================
// S7 — ctx.save() incremental (com crash recovery)
// ===========================================================================
function s7_saveCount() {
    newSection('7. ctx.save() incremental no getter');
    if (typeof FontFace === 'undefined' || !('fonts' in document)) {
        addRow('APIs ausentes', 'skip', 'wn'); return;
    }

    var prev = lsGet('s7_crash');
    if (prev) {
        addRow('CRASH na sessao anterior com N saves', prev, 'cr');
        lsDel('s7_crash');
    }

    var counts = [1, 2, 4, 8, 16, 32, 64, 128, 256, 512];
    for (var i = 0; i < counts.length; i++) {
        var n = counts[i];
        var fired = false, ok = false;

        // Salva N ANTES do teste — se crashar, proxima sessao mostra qual N
        lsSet('s7_crash', String(n));

        var c = document.createElement('canvas');
        c.width = 64; c.height = 64;
        var ctx = c.getContext('2d');
        try {
            var f = new FontFace('SC'+n, 'local(Helvetica)');
            document.fonts.add(f);
            void f.loaded;
            ctx.font = '10px SC' + n;
        } catch(e) { addRow('Setup N='+n+' ERRO', e.message, 'no'); continue; }

        try {
            Object.defineProperty(FontFace.prototype, 'then', {
                configurable: true,
                get: function() {
                    fired = true;
                    for (var j = 0; j < n; j++) ctx.save();
                    ok = true;
                    return undefined;
                }
            });
            ctx.measureText('a');
        } catch(e) {
            addRow('N=' + n + ' saves', 'excecao: ' + e.message, 'no');
            continue;
        } finally {
            try {
                Object.defineProperty(FontFace.prototype, 'then', {
                    configurable: true, writable: true, value: undefined
                });
            } catch(e2) {}
        }

        if (!fired) addRow('N=' + n + ' saves', 'getter nao disparou', 'wn');
        else        addRow('N=' + n + ' saves', ok ? 'OK sem crash' : 'save() falhou', ok ? 'ok' : 'no');
    }
    // Se chegou aqui, nenhum save causou crash
    lsDel('s7_crash');
    addRow('Resultado', 'nenhum N causou crash detectavel', 'in');
}

// ===========================================================================
// S8 — Canvas API presence
// ===========================================================================
function s8_canvasAPI() {
    newSection('8. Canvas 2D API');
    var c = document.createElement('canvas');
    var ctx = c.getContext('2d');
    if (!ctx) { addRow('getContext falhou', false); return; }

    var props = ['save','restore','font','measureText','fillText',
                 'strokeText','drawImage','filter','globalCompositeOperation',
                 'resetTransform','setTransform','getImageData'];
    for (var i = 0; i < props.length; i++) {
        addRow('ctx.' + props[i], props[i] in ctx);
    }

    // TextMetrics
    try {
        var tm = ctx.measureText('a');
        addRow('TextMetrics.width', typeof tm.width === 'number');
        addRow('TextMetrics.actualBBLeft', 'actualBoundingBoxLeft' in tm);
        addRow('TextMetrics.fontBBoxAscent', 'fontBoundingBoxAscent' in tm);
        addRow('width de "a" (px)', tm.width, 'in');
    } catch(e) {
        addRow('measureText ERRO', e.message, 'no');
    }
}

// ===========================================================================
// S9 — Largura de "a" por fonte (detecta fontes distintas)
// ===========================================================================
function s9_fontWidths() {
    newSection('9. Largura de "a" por fonte');
    var c = document.createElement('canvas');
    var ctx = c.getContext('2d');
    if (!ctx) { addRow('Canvas indisponivel', '-', 'wn'); return; }

    ctx.font = '20px serif';
    var base = 0;
    try { base = ctx.measureText('a').width; } catch(e) {}
    addRow('baseline serif 20px', base, 'in');

    var fonts = [
        '20px Helvetica', '20px Arial', '20px "Times New Roman"',
        '20px "SCE-PS3 Rodin LATIN"', '20px "SCE Gothic"',
        '20px sans-serif', '20px monospace',
        '20px TF',  // nossa fonte de teste
        '20px NaoExiste999'
    ];

    for (var i = 0; i < fonts.length; i++) {
        var f = fonts[i];
        try {
            ctx.font = f;
            var w = ctx.measureText('a').width;
            var diff = w !== base;
            addRow(f, 'w=' + w + (diff ? ' (diferente)' : ' (= baseline)'), diff ? 'wn' : 'in');
        } catch(e) {
            addRow(f, 'erro: ' + e.message, 'no');
        }
    }
}

// ===========================================================================
// S10 — Checagem de crash anterior
// ===========================================================================
function s10_prevCrash() {
    var prev = lsGet('s5_last') || lsGet('s6_last') || lsGet('s7_crash');
    if (!prev) return;
    newSection('!! CRASH SESSAO ANTERIOR !!');
    addRow('Teste que crashou', prev, 'cr');
}

// ===========================================================================
// MAIN
// ===========================================================================
function runAll() {
    OUT = document.getElementById('out');
    OUT.innerHTML = '';
    setStatus('Rodando...');

    // Checa crash de sessao anterior primeiro
    try { s10_prevCrash(); } catch(e) {}

    try { s1_env(); }            catch(e) { addRow('S1 ERRO',''+e,'no'); }
    try { s2_fontface(); }       catch(e) { addRow('S2 ERRO',''+e,'no'); }
    try { s3_defineProperty(); } catch(e) { addRow('S3 ERRO',''+e,'no'); }
    try { s4_localFonts(); }     catch(e) { addRow('S4 ERRO',''+e,'no'); }
    try { s5_getterFires(); }    catch(e) { addRow('S5 ERRO',''+e,'no'); }
    try { s6_reentrance(); }     catch(e) { add
