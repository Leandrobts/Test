<!DOCTYPE html>
<body>
<script>
(async () => {
  // O AsyncClipboardAPI já é suportado nativamente na maioria dos navegadores modernos.
  try {
    const item = new ClipboardItem({
      "text/plain": new Promise(() => {}),
      "text/html":  Promise.resolve("x"),
      "text/uri-list": Promise.resolve("http://a/")
    });

    // Primeira tentativa de escrita assíncrona
    navigator.clipboard.write([item]).catch(() => {});

    // Drena as microtarefas (equivalente ao await 0)
    await 0; 

    // Segunda tentativa consecutiva para acionar a limpeza dos carregadores
    navigator.clipboard.write([item]).catch(() => {});
  } catch (e) {
    console.log("Clipboard API não suportada ou restrita neste contexto:", e);
  }
  
  document.body.innerHTML = '<p>This test passes if WebKit does not hit assertions or crash under ASAN.</p><p>PASS</p>';
})();
</script>
</body>
</html>
