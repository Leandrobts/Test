<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PS4 WebKit RenderMenuList Lifetime Variant</title>
<style id="baseStyle">
select { width:260px; font-size:16px; }
option { font-size:16px; padding:2px; }
.a { font-size:17px; font-weight:normal; }
.b { font-size:19px; font-weight:bold; }
.c { font-size:13px; font-style:italic; }
.d { letter-spacing:2px; }
.wrap { contain:layout; }
</style>
</head>
<body>
<select id="s">
<option id="o0">Alpha</option>
<option id="o1" selected>Bravo</option>
<option id="o2">Charlie</option>
<option id="o3">Delta</option>
</select>

<script>
(function () {
"use strict";

var select = document.getElementById("s");
var options = [
    document.getElementById("o0"),
    document.getElementById("o1"),
    document.getElementById("o2"),
    document.getElementById("o3")
];

function frame() {
    return new Promise(function (resolve) {
        requestAnimationFrame(resolve);
    });
}

function tick() {
    return new Promise(function (resolve) {
        setTimeout(resolve, 0);
    });
}

function forceLayout() {
    void select.offsetWidth;
    void select.offsetHeight;
    void options[1].offsetWidth;
    void document.body.offsetHeight;
}

function rebuildRule() {
    var style = document.getElementById("baseStyle");
    if (!style || !style.sheet)
        return;
    try {
        if (style.sheet.cssRules.length)
            style.sheet.deleteRule(0);
        style.sheet.insertRule(
            "select { width:260px; font-size:16px; }", 0);
    } catch (e) {
    }
}

function mutateOptionStyles(seed) {
    options[0].className = seed ? "a" : "b";
    options[1].className = seed ? "c" : "d";
    options[2].className = seed ? "d" : "a";
    options[3].className = seed ? "b" : "c";

    options[1].setAttribute(
        "style",
        seed
            ? "font-size:18px;font-weight:bold;"
            : "font-size:14px;font-style:italic;"
    );
}

async function caseA() {
    select.selectedIndex = 1;
    forceLayout();

    select.multiple = true;
    select.selectedIndex = 1;

    forceLayout();
    await frame();
}

async function caseB() {
    select.multiple = false;
    select.className = "a";

    mutateOptionStyles(false);
    rebuildRule();

    select.multiple = true;
    select.selectedIndex = 2;

    forceLayout();
    await frame();
}

async function caseC() {
    select.multiple = false;
    select.selectedIndex = 0;
    mutateOptionStyles(true);
    forceLayout();

    select.multiple = true;
    select.selectedIndex = 3;
    mutateOptionStyles(false);

    forceLayout();
    await frame();

    select.multiple = false;
    select.selectedIndex = 1;

    forceLayout();
    await frame();
}

async function caseD() {
    rebuildRule();
    select.multiple = false;
    select.selectedIndex = 1;

    mutateOptionStyles(true);
    forceLayout();

    select.multiple = true;
    rebuildRule();

    select.selectedIndex = 0;
    forceLayout();

    await frame();
    await tick();

    select.selectedIndex = 2;
    forceLayout();
}

async function caseE() {
    var parent = select.parentNode;
    var wrapper = document.createElement("div");
    wrapper.className = "wrap";

    parent.insertBefore(wrapper, select);
    wrapper.appendChild(select);

    select.multiple = false;
    select.selectedIndex = 1;
    mutateOptionStyles(false);
    forceLayout();

    select.multiple = true;
    select.selectedIndex = 3;

    forceLayout();
    await frame();

    wrapper.className = "";
    select.multiple = false;
    select.selectedIndex = 0;

    forceLayout();
    await frame();
}

async function caseF() {
    for (var i = 0; i < 8; ++i) {
        select.multiple = false;
        select.selectedIndex = i % options.length;

        mutateOptionStyles(i & 1);
        forceLayout();

        select.multiple = true;
        select.selectedIndex = (i + 1) % options.length;

        forceLayout();
        await frame();
    }
}

async function run() {
    await caseA();
    await tick();
    await caseB();
    await tick();
    await caseC();
    await tick();
    await caseD();
    await tick();
    await caseE();
    await tick();
    await caseF();
}

window.addEventListener("load", run);
})();
</script>
</body>
</html>
