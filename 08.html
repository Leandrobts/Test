<!DOCTYPE html>
<html>
<head>
  <style>
    iframe {
      content: url();
      zoom: 0.01;
    }
  </style>
</head>
<body>
  <iframe id="i0"></iframe>

  <script>
    (function() {
      // Simula o comportamento do teste original sem internals/testRunner

      // 1. Adiciona um frameset (como no original)
      document.documentElement.append(document.createElement('frameset'));

      // 2. Define o evento de foco no iframe
      const iframe = document.getElementById('i0');
      iframe.onfocus = () => {
        location.hash = 'y';
      };

      // 3. Dispara hashchange para 'x'
      location.hash = 'x';

      // 4. Cria e carrega um script que simula o comportamento do cache e foco
      const script = document.createElement('script');
      script.textContent = `
        // Simula caches.has('a') com Promise resolvida
        Promise.resolve().then(() => {
          document.getElementById('i0').focus();
        });
      `;
      document.head.append(script);

      // (Opcional) Exibe mensagem de sucesso para depuração
      console.log('Teste adaptado executado com sucesso.');
    })();
  </script>
</body>
</html>
