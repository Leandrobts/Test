<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto Drag-and-Drop Crash Test</title>
<style>
body {
    font-family: system-ui, -apple-system, sans-serif;
    -webkit-user-modify: read-write;
    margin: 20px;
    background: #111;
    color: #eee;
}
#drag {
    -webkit-user-select: all;
    border: 2px solid #0f0;
    font-size: 50px;
    line-height: 100px;
    text-align: center;
    width: 300px;
    height: 100px;
    background: #1a1a1a;
    margin-bottom: 20px;
    cursor: grab;
}
#drop {
    border: 2px solid #f44;
    width: 300px;
    height: 100px;
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
}
#log {
    margin-top: 20px;
    padding: 15px;
    background: #222;
    border: 1px solid #444;
    font-family: monospace;
    white-space: pre-wrap;
    min-height: 100px;
}
#log .ok { color: #0f0; }
#log .err { color: #f44; }
#log .info { color: #88f; }
</style>
</head>
<body>
<h2>WebKit Drag Caret Crash — Auto Test</h2>
<div id="drag" draggable="true">Drag me</div>
<div id="drop"><br></div>
<div id="log"></div>

<script>
const log = document.getElementById('log');
function write(msg, cls='info') {
    const span = document.createElement('span');
    span.className = cls;
    span.textContent = msg + '
';
    log.appendChild(span);
}

// Seleciona o texto do drag source
document.addEventListener('DOMContentLoaded', () => {
    const dragEl = document.getElementById('drag');
    const dropEl = document.getElementById('drop');

    write('[*] Selecionando texto do drag source...', 'info');
    const range = document.createRange();
    range.selectNodeContents(dragEl);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    write('[+] Texto selecionado', 'ok');

    // Dispara dragstart
    write('[*] Disparando dragstart...', 'info');
    const dt = new DataTransfer();
    dt.setData('text/plain', dragEl.textContent);
    dt.effectAllowed = 'all';

    const dragStartEvent = new DragEvent('dragstart', {
        bubbles: true,
        cancelable: true,
        dataTransfer: dt,
        clientX: 150,
        clientY: 50
    });
    dragEl.dispatchEvent(dragStartEvent);
    write('[+] dragstart disparado', 'ok');

    // Dispara dragover no drop target
    write('[*] Disparando dragover no drop target...', 'info');
    const dragOverEvent = new DragEvent('dragover', {
        bubbles: true,
        cancelable: true,
        dataTransfer: dt,
        clientX: 150,
        clientY: 150
    });
    dropEl.dispatchEvent(dragOverEvent);
    write('[+] dragover disparado', 'ok');

    // O handler do drop do teste original:
    // document.body.style.webkitUserModify = "read-write-plaintext-only";
    // document.querySelector("br").remove();
    // Precisamos garantir que o drop handler esteja registrado ANTES do drop
    dropEl.addEventListener('drop', event => {
        write('[*] Handler drop executando...', 'info');
        write('    -> Alterando body.style.webkitUserModify', 'info');
        document.body.style.webkitUserModify = 'read-write-plaintext-only';
        write('    -> Removendo <br> do drop target...', 'info');
        const br = dropEl.querySelector('br');
        if (br) {
            br.remove();
            write('    -> <br> removido', 'ok');
        } else {
            write('    -> <br> já não existia', 'err');
        }
        write('[+] Drop handler concluído', 'ok');
    });

    // Dispara drop
    write('[*] Disparando drop...', 'info');
    const dropEvent = new DragEvent('drop', {
        bubbles: true,
        cancelable: true,
        dataTransfer: dt,
        clientX: 150,
        clientY: 150
    });
    dropEl.dispatchEvent(dropEvent);
    write('[+] drop disparado', 'ok');

    // Dispara dragend
    write('[*] Disparando dragend...', 'info');
    const dragEndEvent = new DragEvent('dragend', {
        bubbles: true,
        cancelable: true,
        dataTransfer: dt
    });
    dragEl.dispatchEvent(dragEndEvent);
    write('[+] dragend disparado', 'ok');

    write('\n[=== TESTE CONCLUÍDO ===]', 'ok');
    write('Se o navegador travou/crashou, o bug está presente.', 'info');
    write('Se esta mensagem apareceu, o crash não foi reproduzido (ou já foi corrigido).', 'info');
});
</script>
</body>
</html>
