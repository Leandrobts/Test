<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>WebKit FontMetrics Test com Ahem.woff</title>
</head>
<body>
    <h1>Teste de FontMetrics com Ahem.woff</h1>
    <p id="status">Carregando recurso Ahem.woff...</p>

<script>
async function runTest() {
    const statusEl = document.getElementById('status');
    try {
        statusEl.innerText = 'Buscando recursos/Ahem.woff...';
        
        // Carrega o arquivo Ahem.woff do diretório local
        const response = await fetch('resources/Ahem.woff');
        if (!response.ok) {
            throw new Error('Não foi possível carregar resources/Ahem.woff (status: ' + response.status + ')');
        }
        const fontBuffer = await response.arrayBuffer();

        statusEl.innerText = 'Inicializando contexto e esgotamento de cache...';
        const dummies = [];
        for (let i = 0; i < 3500; i++) {
            const canvas = document.createElement('canvas');
            canvas.width = 1;
            canvas.height = 1;
            const ctx = canvas.getContext('2d');
            ctx.font = '10px "dummy' + i + '"';
            dummies.push({ canvas, ctx });
        }

        statusEl.innerText = 'Executando testes com a fonte Ahem...';
        for (let attempt = 0; attempt < 2; attempt++) {
            // Cria o FontFace utilizando o buffer real da Ahem.woff carregada
            const metricsDonor = new FontFace('metricsDonor' + attempt, fontBuffer);
            const measured = new FontFace('measured' + attempt, fontBuffer, { unicodeRange: 'U+13A0-13FF' });
            
            document.fonts.add(metricsDonor);
            document.fonts.add(measured);

            // Dispara o carregamento formal da fonte
            await metricsDonor.load();
            await measured.load();

            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const context = canvas.getContext('2d');
            context.font = '10px metricsDonor' + attempt + ', measured' + attempt;

            // Medição de texto acionando o fluxo de renderização
            context.measureText('\u13A0\u13A2\u13A4');
        }

        statusEl.innerText = 'Teste com Ahem.woff concluído com sucesso!';
        statusEl.style.color = 'green';
    } catch (e) {
        statusEl.innerText = 'Erro durante a execução: ' + e.message;
        statusEl.style.color = 'red';
    }
}

window.addEventListener('DOMContentLoaded', runTest);
</script>
</body>
</html>
