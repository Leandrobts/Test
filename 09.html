<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Commit 633fbf1 - PS4 Test</title>
</head>
<body>
<p>This test passes if it does not crash.</p>
<button id="btnWebkit">webkitRequestFullscreen</button>
<button id="btnStandard">requestFullscreen</button>
<pre id="out"></pre>
<script>
(function () {
  var out = document.getElementById("out");
  function log(msg) {
    out.textContent += msg + "\n";
  }

  function gc() {
    function gcRec(n, k) {
      if (n < 1)
        return {};
      var temp = { i: "ab" + k + (k / 100000) };
      temp += "foo";
      gcRec(n - 1, k);
    }
    for (var i = 0; i < 10000; i++)
      gcRec(10, i);
  }

  function runCase(mode) {
    out.textContent = "";
    var iframe = document.createElement("iframe");
    document.body.appendChild(iframe);
    var div = iframe.contentDocument.body.appendChild(document.createElement("div"));

    if (mode === "webkit") {
      try {
        div.webkitRequestFullscreen();
        log("webkitRequestFullscreen called");
      } catch (e) {
        log("webkitRequestFullscreen threw: " + e);
      }
    } else {
      try {
        var p = div.requestFullscreen();
        log("requestFullscreen called");
        if (p && typeof p.catch === "function") {
          p.catch(function (error) {
            log("requestFullscreen rejected: " + (error && error.name ? error.name : error));
          });
        }
      } catch (e) {
        log("requestFullscreen threw: " + e);
      }
    }

    var contentDocument = iframe.contentDocument;
    document.body.removeChild(iframe);

    setTimeout(function () {
      try {
        contentDocument.webkitCancelFullScreen();
        log("webkitCancelFullScreen called");
      } catch (e) {
        log("webkitCancelFullScreen threw: " + e);
      }
      gc();
      log("gc done");
    }, 0);
  }

  document.getElementById("btnWebkit").addEventListener("click", function () {
    runCase("webkit");
  });

  document.getElementById("btnStandard").addEventListener("click", function () {
    runCase("standard");
  });
})();
</script>
</body>
</html>
