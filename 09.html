<!DOCTYPE html>
<html>
<body>
<script>

let cycle = 0;
const maxCycles = 30;

function finish() {
    document.body.textContent = "PASS if no crash during test cycles.";
}

function runCycle() {
    if (cycle++ >= maxCycles)
        return finish();

    let popup = window.open("about:blank", "", "width=400,height=400");
    if (!popup)
        return finish();

    // Conteúdo de original.html injetado no popup[cite: 2]
    popup.document.body.innerHTML = `
        <p>This test passes if it does not crash.</p>
        <div id="host"></div>
        <div id="result"></div>
        <script>
        // --- Função GC integrada ---
        function gc() {
            function gcRec(n) {
                if (n < 1)
                    return {};
                var temp = { i: "ab" + i + (i / 100000) };
                temp += "foo";
                gcRec(n - 1);
            }
            for (var i = 0; i < 10000; i++)
                gcRec(10);  
        }

        let shadowRoot = host.attachShadow({ mode: 'open' });
        let victim = document.createElement('div');
        victim.tabIndex = 0;
        victim.textContent = 'Focusable';
        shadowRoot.appendChild(victim);
        victim.focus();

        async function runTest() {   
            document.addEventListener('blur', () => {
                victim.remove();
                victim = null;
                gc();
            }, true);

            window.blur();
            await new Promise((resolve) => {
                requestAnimationFrame(() => setTimeout(resolve, 0));
            });

            result.textContent = 'PASS';    
        }    

        runTest();
        <\/script>
    `;

    // Aguarda dois rAFs e fecha o popup abruptamente para testar condições de corrida
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            popup.close();
            setTimeout(runCycle, 0);
        });
    });
}

runCycle();
</script>
</body>
</html>
