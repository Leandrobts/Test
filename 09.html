<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8">
<title>WaveShaperNode PS4 Test</title>
</head>

<body>

<div id="result">Running test...</div>

<script>
(function () {

    var result = document.getElementById("result");

    try {
     
        var context =
            new webkitOfflineAudioContext(
                2,
                44100,
                48000
            );

        var node = context.createWaveShaper();

        node.curve = new Float32Array(2);

        node.connect(context.destination);

       
        var rendering = context.startRendering();

        if (rendering && typeof rendering.then === "function") {

            rendering.then(function () {

                result.innerHTML =
                    "PASS: Test completed without crashing.";

            }, function (error) {

                result.innerHTML =
                    "Rendering error: " +
                    (error && error.name ?
                        error.name :
                        String(error));
            });

        } else {


            result.innerHTML =
                "Rendering started.";

        }

       

        for (var i = 0; i < 1000; i++)
            void node.curve;

    } catch (e) {

        result.innerHTML =
            "ERROR: " +
            e.name +
            " - " +
            e.message;
    }

})();
</script>

</body>
</html>
