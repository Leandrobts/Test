<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Range BoundaryPoint GC Race Test</title>
<style>
    body {
        font-family: sans-serif;
        word-break: break-all;
    }
    #status {
        white-space: pre-wrap;
    }
</style>
</head>

<body>

<button onclick="start()">START</button>
<button onclick="stop()">STOP</button>

<div id="status">Ready.</div>
<div id="arena"></div>

<script>
(function () {
    "use strict";

    var running = false;
    var iteration = 0;
    var ranges = [];

    var arena = document.getElementById("arena");
    var status = document.getElementById("status");

    function log(message) {
        status.textContent =
            "Iteration: " + iteration + "\n" +
            "Ranges: " + ranges.length + "\n" +
            message;
    }

    /*
     * Cria uma árvore DOM relativamente profunda.
     * O Range mantém boundary points em nós internos.
     */
    function createTree() {
        var root = document.createElement("div");
        var current = root;

        for (var i = 0; i < 20; i++) {
            var child = document.createElement("div");
            var text = document.createTextNode(
                "NODE-" + iteration + "-" + i
            );

            child.appendChild(text);
            current.appendChild(child);

            current = child;
        }

        return root;
    }

    /*
     * Cria vários Range objects apontando para nós
     * que serão posteriormente modificados/removidos.
     */
    function createRanges(root) {
        var created = [];
        var node = root;

        while (node && node.firstChild) {

            var range = document.createRange();

            try {
                range.setStart(node, 0);

                if (node.childNodes.length > 0)
                    range.setEnd(node, node.childNodes.length);
                else
                    range.setEnd(node, 0);

                created.push(range);

            } catch (e) {
            }

            node = node.firstChild;
        }

        return created;
    }

    /*
     * Pressão de alocação.
     *
     * A intenção é incentivar atividade do coletor de lixo
     * enquanto os RangeBoundaryPoints existem.
     */
    function gcPressure() {
        var junk = [];

        for (var i = 0; i < 400; i++) {
            junk.push({
                a: new Array(200),
                b: "GC-" + iteration + "-" + i,
                c: {
                    x: i,
                    y: i + 1,
                    z: new Array(20)
                }
            });
        }

        return junk;
    }

    /*
     * Modifica a estrutura dos nós que estão sendo
     * referenciados pelos Range objects.
     */
    function mutateTree(root) {
        var current = root;

        while (current) {

            var next = current.firstChild;

            /*
             * Alterna o conteúdo e força mutações
             * que fazem Range atualizar seus boundary points.
             */
            try {
                if (current.firstChild &&
                    current.firstChild.nodeType === 3) {

                    var text = current.firstChild;

                    if (text.length > 2) {
                        text.splitText(
                            Math.floor(text.length / 2)
                        );
                    }
                }
            } catch (e) {
            }

            current = next;
        }
    }

    /*
     * Remove completamente a árvore.
     *
     * Os Range objects continuam existindo em ranges[],
     * enquanto seus boundary points precisam ser atualizados
     * pela infraestrutura interna do DOM.
     */
    function destroyTree(root) {
        try {
            if (root.parentNode)
                root.parentNode.removeChild(root);
        } catch (e) {
        }
    }

    /*
     * Reutiliza Range objects com novos containers.
     *
     * Isso força setStart/setEnd repetidamente,
     * exercitando o trecho alterado pelo commit.
     */
    function reuseRanges() {
        var temporary = document.createElement("div");

        for (var i = 0; i < 10; i++) {
            temporary.appendChild(
                document.createTextNode(
                    "TEMP-" + iteration + "-" + i
                )
            );
        }

        arena.appendChild(temporary);

        for (var j = 0; j < ranges.length; j++) {

            var range = ranges[j];

            try {
                range.setStart(
                    temporary,
                    Math.min(j % 10, temporary.childNodes.length)
                );

                range.setEnd(
                    temporary,
                    temporary.childNodes.length
                );

            } catch (e) {
            }
        }

        temporary.parentNode.removeChild(temporary);
    }

    function cycle() {

        if (!running)
            return;

        iteration++;

        /*
         * 1. Criar árvore.
         */
        var root = createTree();
        arena.appendChild(root);

        /*
         * 2. Criar Ranges apontando para a árvore.
         */
        var newRanges = createRanges(root);

        for (var i = 0; i < newRanges.length; i++)
            ranges.push(newRanges[i]);

        /*
         * Evita crescimento ilimitado do array,
         * mas mantém uma quantidade significativa
         * de Range objects vivos.
         */
        if (ranges.length > 500)
            ranges.splice(0, 250);

        /*
         * 3. Criar pressão de GC.
         */
        var pressure1 = gcPressure();

        /*
         * 4. Modificar os nodes.
         */
        mutateTree(root);

        /*
         * 5. Executar mais operações de boundary.
         */
        reuseRanges();

        /*
         * 6. Mais pressão de GC.
         */
        var pressure2 = gcPressure();

        /*
         * 7. Destruir a árvore original.
         */
        destroyTree(root);

        /*
         * 8. Tornar as alocações anteriores descartáveis.
         */
        pressure1 = null;
        pressure2 = null;

        log("Running Range / DOM / GC stress...");

        setTimeout(cycle, 0);
    }

    window.start = function () {

        if (running)
            return;

        running = true;
        iteration = 0;
        ranges = [];

        log("Started.");

        cycle();
    };

    window.stop = function () {
        running = false;
        log("Stopped.");
    };

})();
</script>

</body>
</html>
