<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>WebKit Style Update Timer Test - Variant 2</title>

<style>
*:last-child,
*:placeholder-shown {
    -webkit-clip-path: url(#fontFaceID);
}

*:empty {
    -webkit-border-after: #D1C78D;
}
</style>

<script>

function gc()
{
    function gcRec(n)
    {
        if (n < 1)
            return {};

        var temp = {
            i: "ab" + i + (i / 100000)
        };

        temp += "foo";

        gcRec(n - 1);
    }

    for (var i = 0; i < 10000; i++)
        gcRec(10);
}


function log(message)
{
    console.log(message);

    var output = document.getElementById("log");

    if (output)
        output.textContent += message + "\n";
}


function domNodeRemovedCallback(event)
{
    try {
        log(">>> DOMNodeRemoved FIRED");
        log("event.target = " + event.target.nodeName);

        var svg =
            document.getElementById("svgID");

        var animateMotion =
            document.getElementById("animateMotionID");

        var iframe =
            document.getElementById("iframeID");

        var animateTransform =
            document.getElementById("animateTransformID");


        log("Callback: moving animateMotion");

        svg.appendChild(animateMotion);

        log("Callback: animateMotion moved");


        log("Callback: creating Range");

        var range =
            iframe.contentDocument.createRange();


        log("Callback: selecting animateTransform contents");

        range.selectNodeContents(animateTransform);


        log("Callback: before surroundContents");

        range.surroundContents(
            document.createElement("meter")
        );


        log("Callback: surroundContents completed");
        log(">>> CALLBACK END");
    }
    catch (e) {
        log("!!! CALLBACK EXCEPTION");
        log(e.name + ": " + e.message);

        console.error(e);
    }
}


function test()
{
    try {

        log("================================");
        log("TEST START");
        log("================================");


        var meter =
            document.getElementById("meterID");

        var marquee =
            document.getElementById("marqueeID");

        var animateTransform =
            document.getElementById("animateTransformID");

        var animateMotion =
            document.getElementById("animateMotionID");

        var symbol =
            document.getElementById("symbolID");

        var svg =
            document.getElementById("svgID");


        log("");
        log("--- DOM STRUCTURE ---");

        log(
            "meter parent: " +
            (meter.parentNode ?
                meter.parentNode.nodeName :
                "null")
        );

        log(
            "marquee parent: " +
            (marquee.parentNode ?
                marquee.parentNode.nodeName :
                "null")
        );

        log(
            "animateTransform parent: " +
            (animateTransform.parentNode ?
                animateTransform.parentNode.nodeName :
                "null")
        );

        log(
            "animateMotion parent: " +
            (animateMotion.parentNode ?
                animateMotion.parentNode.nodeName :
                "null")
        );

        log(
            "animateMotion is child of animateTransform: " +
            (animateMotion.parentNode === animateTransform)
        );

        log(
            "symbol namespace: " +
            symbol.namespaceURI
        );

        log(
            "svg namespace: " +
            svg.namespaceURI
        );


        log("");
        log("--- ADD EVENT LISTENER ---");

        meter.addEventListener(
            "DOMNodeRemoved",
            domNodeRemovedCallback
        );

        log("DOMNodeRemoved listener added");


        log("");
        log("--- BEFORE appendChild ---");

        log(
            "marquee current parent: " +
            marquee.parentNode.nodeName
        );

        log(
            "target animateTransform: " +
            animateTransform.nodeName
        );


        animateTransform.appendChild(marquee);


        log("--- AFTER appendChild ---");

        log(
            "marquee new parent: " +
            marquee.parentNode.nodeName
        );


        log("");
        log("--- BEFORE getScreenCTM ---");


        var screenCTM = null;

        if (typeof symbol.getScreenCTM === "function") {

            log("Using symbol.getScreenCTM()");

            screenCTM =
                symbol.getScreenCTM();

        } else if (
            typeof svg.getScreenCTM === "function"
        ) {

            log(
                "symbol.getScreenCTM unavailable"
            );

            log("Using svg.getScreenCTM()");

            screenCTM =
                svg.getScreenCTM();

        } else {

            log(
                "getScreenCTM unavailable on both elements"
            );

        }


        log("--- AFTER getScreenCTM ---");

        log(
            "screenCTM: " +
            (screenCTM ? "OK" : "null")
        );


        /*
         * Força uma consulta de layout adicional.
         */

        try {

            var rect =
                svg.getBoundingClientRect();

            log(
                "getBoundingClientRect: " +
                rect.width + "x" + rect.height
            );

        } catch (e) {

            log(
                "getBoundingClientRect exception: " +
                e.message
            );

        }


        log("");
        log("--- BEFORE SVG REMOVAL ---");

        svg.outerHTML = "A";

        log("--- AFTER SVG REMOVAL ---");


        /*
         * Removemos referências locais antes do GC.
         */

        svg = null;
        symbol = null;
        animateTransform = null;
        animateMotion = null;
        marquee = null;
        meter = null;


        log("");
        log("--- BEFORE GC ---");

        gc();

        log("--- AFTER GC ---");


        log("");
        log("--- WAITING FOR EVENT LOOP ---");


        setTimeout(function() {

            log("setTimeout #1 fired");

            requestAnimationFrame(function() {

                log("requestAnimationFrame #1 fired");

                requestAnimationFrame(function() {

                    log(
                        "requestAnimationFrame #2 fired"
                    );

                    setTimeout(function() {

                        log("");
                        log(
                            "================================"
                        );

                        log("PASS IF NO CRASH");

                        log(
                            "================================"
                        );

                    }, 0);

                });

            });

        }, 0);

    }
    catch (e) {

        log("");

        log(
            "================================"
        );

        log("!!! MAIN TEST EXCEPTION");

        log(
            e.name + ": " + e.message
        );

        log(
            "================================"
        );

        console.error(e);
    }
}

</script>
</head>

<body onload="test()">

<pre id="log" style="
white-space: pre-wrap;
font-family: monospace;
font-size: 14px;
padding: 10px;
border: 1px solid black;
"></pre>


<meter id="meterID">

    <marquee id="marqueeID">
    </marquee>

</meter>


<svg id="svgID">

    <symbol id="symbolID">

        <font-face id="fontFaceID">

            <animateTransform id="animateTransformID">

                <animateMotion id="animateMotionID">
                </animateMotion>

            </animateTransform>

        </font-face>

    </symbol>

</svg>


<iframe id="iframeID">
</iframe>

</body>
</html>
