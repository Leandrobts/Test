<body>
<script>
function gc() {
    function gcRec(n) {
          if (n < 1)
              return {};
          var temp = {i: "ab" + i + (i / 100000)};
          temp += "foo";
          gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
    gcRec(10);
}


const canvas = document.createElement("canvas");

const ctx = canvas.getContext("2d");

gc();

const log = [
    `ctx = ${ctx}`,
    `its canvas is the same element = ${ctx ? ctx.canvas === canvas : false}`,
    `it still owns the slot = ${ctx === canvas.getContext("2d")}`,
    "PASS if no crash.",
];
document.body.appendChild(document.createElement("pre")).textContent = log.join("\n");
</script>
