<!DOCTYPE html>

<html>
<body>

<p>This test passes if it does not crash.</p>
<div id="host"></div>
<div id="result"></div>

<script>

let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable';
shadowRoot.appendChild(victim);
victim.focus();

function log(message) {
    result.textContent += message + '\n';
}

function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

async function runTest() {

    const focusedBefore = document.hasFocus();

    log('[Focus] before: ' + focusedBefore);

    document.addEventListener('blur', () => {

        log('[Blur] received');

        victim.remove();
        victim = null;
        gc();

    }, true);

    window.blur();

    await new Promise((resolve) => {
        requestAnimationFrame(() => setTimeout(resolve, 0));
    });

    const focusedAfter = document.hasFocus();

    log('[Focus] after: ' + focusedAfter);

    if (focusedBefore && !focusedAfter)
        log('[Focus] TRUE -> FALSE');
    else
        log('[Focus] transition not observed');

}

runTest();

</script>

</body>
</html>
