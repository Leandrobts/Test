<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
// FontCascade::width holds a raw pointer into FontCascadeFonts::m_glyphGeometryCache's bucket
// array across the measurement call it makes right after. That call can realize a pending
// FontFace with a local() source, which loads synchronously and resolves the FontFace loaded
// promise inline, running an author `then` getter mid-width(). The getter re-enters measureText
// on the same context, inserting into the same cache until it rehashes and frees the bucket
// array the outer frame's pointer still points into.



let ctx = null;
let inGetter = false;

Object.defineProperty(FontFace.prototype, 'then', {
    configurable: true,
    get() {
        if (inGetter || !ctx)
            return undefined;
        inGetter = true;
        for (let i = 0; i < 16; i++) {
            try { ctx.measureText('q' + String.fromCharCode(65 + i) + 'z'); } catch (e) { }
            try { ctx.measureText('x'); } catch (e) { }
        }
        inGetter = false;
        return undefined;
    }
});

function attempt(n)
{
    for (let d = 0; d < 3; d++)
        new FontFace('Dummy' + n + '_' + d, 'local(Helvetica)');

    const family = 'VarFam' + n;
    const face = new FontFace(family, 'local(Helvetica)');
    void face.loaded;
    document.fonts.add(face);

    const canvas = document.createElement('canvas');

    canvas.width = 10;

    canvas.height = 10;

    const ctx = canvas.getContext('2d');

    ctx.font = '20px Helvetica, ' + family;

    for (let i = 0; i < 50; i++)
        ctx.measureText('x');

    // U+E005 is absent from Helvetica, so this walks the fallback list into the pending face.
    ctx.measureText('?AB');
}

window.onload = function () {
    setTimeout(function () {
        for (let n = 0; n < 3; n++) {
            try { attempt(n); } catch (e) { }
        }
        document.body.appendChild(document.createTextNode("PASS if no crash"));

    }, 0);
};
</script>
</body>
</html>
