<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8">
<title>FetchBodyConsumer resolve UAF</title>
</head>

<body>

<div id="result">Running...</div>

<script>
async function runTest() {

    function createReadStream() {
        const response = new Response(new Blob(["aaaaa"]));
        return response.body;
    }

    const iframe = document.body.appendChild(
        document.createElement("iframe")
    );

    const response = new iframe.contentWindow.Response(
        createReadStream()
    );

    iframe.contentWindow.Object.prototype.__defineGetter__(
        "then",
        function() {
            delete iframe.contentWindow.Object.prototype.then;
            iframe.remove();
        }
    );

    response.blob();

    await new Promise(function(resolve) {
        setTimeout(resolve, 50);
    });

    document.getElementById("result").textContent =
        "PASS if no crash.";
}

runTest();
</script>

</body>
</html>
