<!DOCTYPE html>
<html>
<body>
<button id="btn-run" type="button">Run Font+Shadow Probe</button>
<button id="btn-clear" type="button">Clear</button>
<div id="out"></div>

<script>
document.fonts;

const out = document.getElementById("out");
function log(msg) {
    const line = document.createElement("div");
    line.textContent = msg;
    out.appendChild(line);
}

function runProbe() {
    const hostA = document.createElement("div");
    const hostB = document.createElement("div");
    document.body.appendChild(hostA);
    document.body.appendChild(hostB);

    const srA = hostA.attachShadow({ mode: "open" });
    hostB.attachShadow({ mode: "open" });

    const fontStyle = document.createElement("style");
    fontStyle.textContent =
        '@font-face { font-family: probeFont; src: url("missing-probe-font.otf"); }' +
        '.probe { font: 24px probeFont; }';
    srA.appendChild(fontStyle);

    const span = document.createElement("span");
    span.className = "probe";
    span.textContent = "A";
    srA.appendChild(span);

    document.body.offsetHeight;

    document.fonts.load("24px probeFont", "A").catch(() => {});
    log("status before ready: " + document.fonts.status);

    document.fonts.ready.then(() => {
        log("fonts.ready resolved");
    }).catch(() => {});

    const prepended = document.createElement("style");
    prepended.textContent = ".prep { color: blue; }";
    srA.prepend(prepended);

    let thenCalls = 0;
    try {
        Object.defineProperty(FontFaceSet.prototype, "then", {
            configurable: true,
            get() {
                ++thenCalls;
                delete FontFaceSet.prototype.then;
                if (hostB.isConnected) hostB.remove();
                return undefined;
            }
        });
    } catch (e) {
        log("defineProperty error: " + e);
    }

    const sheetsLen = document.styleSheets.length;
    log("styleSheets.length=" + sheetsLen + " | thenCalls=" + thenCalls + " | hostB.connected=" + hostB.isConnected);
}

document.getElementById("btn-run").addEventListener("click", runProbe);
document.getElementById("btn-clear").addEventListener("click", () => { out.textContent = ""; });
</script>
</body>
</html>
