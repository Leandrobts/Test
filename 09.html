<!DOCTYPE html>
<html>
<body>
<div id="host"></div>
<pre id="out"></pre>
<script>
function log(msg) {
  document.getElementById('out').textContent += msg + '\n';
}

function check(label, fn) {
  try {
    var res = fn();
    log('[OK] ' + label + (res !== undefined ? ': ' + String(res) : ''));
  } catch (e) {
    log('[ERR] ' + label + ': ' + e.name + ' - ' + e.message);
  }
}

check('document.createElement(div)', function () {
  return typeof document.createElement('div');
});

check('Element.prototype.attachShadow', function () {
  return typeof Element.prototype.attachShadow;
});

var sr = null;
var victim = null;

check('attachShadow({mode: open})', function () {
  var host = document.getElementById('host');
  sr = host.attachShadow({ mode: 'open' });
  return sr && sr.constructor ? sr.constructor.name : typeof sr;
});

check('createElement + tabIndex + appendChild', function () {
  victim = document.createElement('div');
  victim.tabIndex = 0;
  victim.textContent = 'Focusable';
  sr.appendChild(victim);
  return victim.tabIndex;
});

check('victim.focus()', function () {
  victim.focus();
  return 'doc.active=' + (document.activeElement ? document.activeElement.id || document.activeElement.tagName : null) +
         ', sr.active=' + (sr && sr.activeElement ? sr.activeElement.tagName : null);
});

check('document.addEventListener(blur, fn, true)', function () {
  var fired = false;
  function onBlur() {
    fired = true;
  }
  document.addEventListener('blur', onBlur, true);
  document.removeEventListener('blur', onBlur, true);
  return typeof fired;
});

check('ChildNode.prototype.remove', function () {
  return typeof Element.prototype.remove;
});

check('requestAnimationFrame & setTimeout', function () {
  return typeof requestAnimationFrame + '/' + typeof setTimeout;
});

check('Harness globals (testRunner / GCController / UIHelper)', function () {
  return 'testRunner=' + typeof window.testRunner +
         ', GCController=' + typeof window.GCController +
         ', UIHelper=' + typeof window.UIHelper;
});
</script>
</body>
</html>
