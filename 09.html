<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
function gc() {
    function gcRec(n) {
        if (n < 1) return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 10000; i++) gcRec(10);
}
var src = 'self.onmessage = function(e) { self.postMessage(e.data); };';
var blobUrl = URL.createObjectURL(new Blob([src], { type: 'application/javascript' }));
for (var k = 0; k < 3; k++) {
    var w = new Worker(blobUrl);
    w.onmessage = function(e) {
        gc();
        var fd = new FormData();
        fd.append('a', e.data);
        var response = new Response(fd);
        Object.prototype.__defineGetter__('then', function() {
            response = null;
            gc();
        });
        gc();
        response.arrayBuffer();
        w.terminate();
    };
    w.postMessage(new Blob(['aa']));
}
</script>
</body>
</html>
