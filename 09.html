<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 Shadow Test - Variant A</title>
</head>

<body>

<script>
(function () {

    function boom()
    {
        var host = document.createElement("div");

        /*
         * Equivalente estrutural aproximado do:
         *
         * var older = new WebKitShadowRoot(div);
         * older.appendChild(document.createElement("div"));
         */
        var older = host.attachShadow({
            mode: "open"
        });

        older.appendChild(
            document.createElement("div")
        );

        /*
         * Mantém a mesma ordem importante:
         * primeiro construir o ShadowRoot,
         * depois inserir o host no documento.
         */
        document.documentElement.appendChild(host);

        /*
         * Shadow DOM moderno não permite criar um
         * segundo ShadowRoot diretamente no mesmo host.
         *
         * Portanto esta variante mantém o mesmo host/root
         * e continua a construção após a inserção.
         */

        var select = document.createElement("select");

        /*
         * O <shadow> original era um insertion point
         * do Shadow DOM v0.
         *
         * Aqui usamos um nó DOM comum como marcador
         * estrutural, sem depender da API antiga.
         */
        var insertionPoint = document.createElement("div");

        select.appendChild(insertionPoint);

        older.appendChild(select);

        /*
         * Força observação do estado de layout.
         */
        void select.offsetWidth;
    }

    window.onload = boom;

})();
</script>

</body>
</html>
