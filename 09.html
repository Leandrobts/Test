<div id="status">Executando teste...</div>
<script>
function finish(message) {
    document.getElementById('status').innerText = message;
    document.write('<br>' + message);
}

try {
    let phase = 'face';
    
    // Na main thread, usamos document.fonts
    document.fonts.add(new FontFace('PendingFam',
        'url("data:font/ttf;base64,' + 'A'.repeat(1100000) + '")',
        { unicodeRange: 'U+13A0' }));

    phase = 'churn';
    // Substituindo OffscreenCanvas por canvas padrão da main thread
    let canvasChurn = document.createElement('canvas');
    canvasChurn.width = 8;
    canvasChurn.height = 8;
    let churn = canvasChurn.getContext('2d');
    
    let families = ['Helvetica', 'Courier', 'Georgia', 'Verdana', 'Monaco',
                    'Menlo', 'Optima', 'Futura', 'Baskerville', 'Palatino'];
    for (let size = 5; size <= 127; size++) {
        for (let family of families) {
            churn.font = size + 'px "' + family + '"';
            churn.measureText('x');
        }
    }

    phase = 'victim';
    let canvasVictim = document.createElement('canvas');
    canvasVictim.width = 64;
    canvasVictim.height = 64;
    let context = canvasVictim.getContext('2d');
    context.font = '10px Times, PendingFam';

    phase = 'prime';
    context.measureText('\u4E01\u4F01\u5001\u5101\u5201\u5301\u5401\u5501\u5601\u5701\u5801\u5901');

    phase = 'gc-prime';
    let garbage = [];
    for (let i = 0; i < 200000; i++)
        garbage.push({ i: i, s: 'g' + i });
    garbage = null;

    phase = 'hold';
    // Simula o bloqueio da main thread (substitui o postMessage('hold') do worker)
    let start = performance.now();
    while (performance.now() - start < 1800) { }

    phase = 'trigger';
    context.measureText('\u13A0');

    finish('PASS if no crash');
} catch (error) {
    finish('setup failed in phase ' + error);
}
</script>
