<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>PS4 FullScreen - T9</title></head>
<body>
<pre id="ua"></pre>
<pre id="out"></pre>

<div id="d2" style="width:100px;height:100px;background:red"></div>

<br>
<button onclick="runT()">T9: reqFS on RED div (remove + readd)</button><br><br>

<script>
document.getElementById('ua').textContent = navigator.userAgent;
function log(s){ document.getElementById('out').textContent += s + '\n'; }
function safe(fn, tag){ try { return fn(); } catch(e) { log('[EXC@' + tag + '] ' + e); return null; } }
function runT(){
    document.getElementById('out').textContent = '';
    log('=== T9 ===');
    var d2 = document.getElementById('d2');
    var h9 = function(){
        document.removeEventListener('webkitfullscreenchange', h9);
        log('[handler] RED div FS fired');
        safe(function(){ if(d2.parentNode){ d2.parentNode.removeChild(d2); log('d2 removed'); } }, 'remove');
        safe(function(){ if(!d2.parentNode) document.body.appendChild(d2); }, 'readd');
    };
    document.addEventListener('webkitfullscreenchange', h9);
    safe(function(){ d2.webkitRequestFullscreen(); }, 'reqFS');
    setTimeout(function(){ document.removeEventListener('webkitfullscreenchange', h9); }, 3000);
}
</script>
</body>
</html>
