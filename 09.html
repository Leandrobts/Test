
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PS4 WebKit Compatibility</title>
</head>
<body>
<h2>PS4 WebKit Compatibility</h2>
<pre id="results"></pre>
<script>
(function () {
    var output = document.getElementById("results");

    function log(name, value) {
        output.textContent += name + ": " + value + "\n";
    }

    log("User Agent", navigator.userAgent);

    // Commit ebc83b8
    var input = document.createElement("input");
    log("input.labels", "labels" in input);

    log("createHTMLDocument",
        typeof document.implementation.createHTMLDocument);

    // Commit e055837
    var canvas = document.createElement("canvas");
    var ctx = canvas.getContext("2d");

    log("Canvas 2D", !!ctx);
    log("Canvas save", ctx ? typeof ctx.save : "N/A");
    log("Canvas beginLayer",
        ctx ? typeof ctx.beginLayer : "N/A");

    // Commit 34f6384
    var style = document.createElement("style");
    document.head.appendChild(style);

    try {
        style.sheet.insertRule(
            ".outer { color: red; & .nested { color: blue; } }",
            0
        );

        var rule = style.sheet.cssRules[0];
        log("Nested CSS accepted", true);
        log("Nested CSS rule count",
            rule.cssRules ? rule.cssRules.length : "unsupported");
    } catch (e) {
        log("Nested CSS", e.name);
    }

    log("GCController", typeof window.GCController);
    log("testRunner", typeof window.testRunner);
})();
</script>
</body>
</html>
