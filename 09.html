<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
input {
    width: 300px;
    height: 50px;
}
</style>
</head>
<body>
<input id="input" type="text" list="list">
<datalist id="list"><option value="a"><option value="b"></datalist>
<p>PASS if no crash.</p>
<script>
// Função de GC extraída do repositório do WebKit (js-test.js) para navegadores comuns
function gc() {
    if (typeof GCController !== "undefined")
        GCController.collect();
    else {
        var gcRec = function (n) {
            if (n < 1)
                return {};
            var temp = {i: "ab" + i + (i / 100000)};
            temp += "foo";
            gcRec(n-1);
        };
        for (var i = 0; i < 1000; i++)
            gcRec(10);
    }
}

addEventListener("load", () => {
    let input = document.getElementById('input');

    // Listener idêntico ao teste original para alterar o tipo e forçar o GC
    input.addEventListener('click', (e) => {
        input.type = 'button';
        gc();
    }, { once: true });

    // Como a árvore de sombra do datalist não é acessível externamente em browsers padrão,
    // disparamos o gatilho de clique programaticamente para exercitar o listener.
    setTimeout(() => {
        input.click();
        console.log("PASS if no crash.");
    }, 500);
});
</script>
</body>
</html>
