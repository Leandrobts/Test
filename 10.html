<!DOCTYPE html>
<html>
<body>
<p>This test passes if it does not crash.</p>
<div id="host"></div>
<div id="result"></div>
<script>
// --- Função GC integrada ---
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);  
}

let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable';
shadowRoot.appendChild(victim);
victim.focus();

async function runTest() {   
    document.addEventListener('blur', () => {
        victim.remove();
        victim = null;
        gc();
    }, true);

    // Força o documento a perder o foco ativo
if (document.activeElement) {
    document.activeElement.blur();
}

// Dispara eventos que emulam a perda de foco da janela de forma sintética
window.dispatchEvent(new Event('blur'));
document.dispatchEvent(new Event('visibilitychange'));
    await new Promise((resolve) => {
        requestAnimationFrame(() => setTimeout(resolve, 0));
    });

    result.textContent = 'PASS';    
}    

    runTest();

</script>
</body>
</html>
