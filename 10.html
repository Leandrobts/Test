<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Commit 633fbf1 - Variants</title>
</head>
<body>
<p>Fullscreen timing variants test (no style)</p>
<div>
  <button id="b1">1: GC before timeout (std)</button>
  <button id="b2">2: GC in .catch() (std)</button>
  <button id="b3">3: GC in 2nd timeout + null ref</button>
  <button id="b4">4: Burst 25x (std + webkit)</button>
  <button id="b5">5: Cancel + exit + GC</button>
</div>
<pre id="out"></pre>
<script>
(function () {
  var out = document.getElementById("out");
  function log(msg) {
    out.textContent += msg + "\n";
  }

  function gc(iters, depth) {
    var count = iters || 10000;
    var maxDepth = depth || 10;
    function gcRec(n, k) {
      if (n < 1)
        return {};
      var temp = { i: "ab" + k + (k / 100000) };
      temp += "foo";
      gcRec(n - 1, k);
    }
    for (var i = 0; i < count; i++)
      gcRec(maxDepth, i);
  }

  function makeFrameDiv() {
    var iframe = document.createElement("iframe");
    document.body.appendChild(iframe);
    var doc = iframe.contentDocument;
    var div = doc && doc.body ? doc.createElement("div") : null;
    if (div && doc.body)
      doc.body.appendChild(div);
    return { iframe: iframe, doc: doc, div: div };
  }

  function removeFrame(ctx) {
    if (ctx.iframe && ctx.iframe.parentNode)
      ctx.iframe.parentNode.removeChild(ctx.iframe);
  }

  // Variante 1: requestFullscreen() + removeChild + gc() antes do setTimeout
  function v1() {
    out.textContent = "";
    var ctx = makeFrameDiv();
    var doc = ctx.doc;
    try {
      var p = ctx.div.requestFullscreen();
      if (p && p.catch) {
        p.catch(function (e) {
          log("v1 catch: " + (e && e.name ? e.name : e));
        });
      }
    } catch (err) {
      log("v1 throw: " + err);
    }
    removeFrame(ctx);
    ctx.div = null;
    ctx.iframe = null;
    gc(10000, 10);
    log("v1 gc before timeout done");
    setTimeout(function () {
      try {
        if (doc && doc.webkitCancelFullScreen)
          doc.webkitCancelFullScreen();
      } catch (e2) {
        log("v1 cancel err: " + e2);
      }
      doc = null;
      log("v1 timeout done");
    }, 0);
  }

  // Variante 2: gc() disparado dentro do .catch() da Promise rejeitada
  function v2() {
    out.textContent = "";
    var ctx = makeFrameDiv();
    var doc = ctx.doc;
    try {
      var p = ctx.div.requestFullscreen();
      if (p && p.catch) {
        p.catch(function (e) {
          log("v2 catch: " + (e && e.name ? e.name : e));
          gc(10000, 10);
          log("v2 gc inside catch done");
        });
      }
    } catch (err) {
      log("v2 throw: " + err);
    }
    removeFrame(ctx);
    ctx.div = null;
    ctx.iframe = null;
    setTimeout(function () {
      try {
        if (doc && doc.webkitCancelFullScreen)
          doc.webkitCancelFullScreen();
      } catch (e2) {
        log("v2 cancel err: " + e2);
      }
      doc = null;
      log("v2 timeout done");
    }, 0);
  }

  // Variante 3: cancela no 1o timeout, zera referencia ao doc, roda gc() no 2o timeout
  function v3() {
    out.textContent = "";
    var ctx = makeFrameDiv();
    var doc = ctx.doc;
    try {
      var p = ctx.div.requestFullscreen();
      if (p && p.catch) {
        p.catch(function (e) {
          log("v3 catch: " + (e && e.name ? e.name : e));
        });
      }
    } catch (err) {
      log("v3 throw: " + err);
    }
    removeFrame(ctx);
    ctx.div = null;
    ctx.iframe = null;

    setTimeout(function () {
      try {
        if (doc && doc.webkitCancelFullScreen)
          doc.webkitCancelFullScreen();
      } catch (e2) {
        log("v3 cancel err: " + e2);
      }
      doc = null;
      log("v3 t1 done (doc nulled)");

      setTimeout(function () {
        gc(10000, 10);
        log("v3 t2 gc done");
      }, 0);
    }, 0);
  }

  // Variante 4: sequencia curta de 25 iteracoes misturando requestFullscreen e webkitRequestFullscreen
  function v4() {
    out.textContent = "";
    for (var n = 0; n < 25; n++) {
      var ctx = makeFrameDiv();
      var doc = ctx.doc;
      try {
        if (n % 2 === 0 && ctx.div.requestFullscreen) {
          var p = ctx.div.requestFullscreen();
          if (p && p.catch)
            p.catch(function () {});
        } else if (ctx.div.webkitRequestFullscreen) {
          ctx.div.webkitRequestFullscreen();
        }
      } catch (err) {}
      removeFrame(ctx);
      (function (d) {
        setTimeout(function () {
          try {
            if (d && d.webkitCancelFullScreen)
              d.webkitCancelFullScreen();
          } catch (e2) {}
        }, 0);
      })(doc);
    }
    gc(6000, 10);
    log("v4 burst 25 + gc done");
  }

  // Variante 5: chama webkitCancelFullScreen e exitFullscreen apos remover iframe e roda gc()
  function v5() {
    out.textContent = "";
    var ctx = makeFrameDiv();
    var doc = ctx.doc;
    try {
      if (ctx.div.webkitRequestFullscreen)
        ctx.div.webkitRequestFullscreen();
      if (ctx.div.requestFullscreen) {
        var p = ctx.div.requestFullscreen();
        if (p && p.catch) {
          p.catch(function (e) {
            log("v5 catch: " + (e && e.name ? e.name : e));
          });
        }
      }
    } catch (err) {
      log("v5 throw: " + err);
    }
    removeFrame(ctx);
    ctx.div = null;
    ctx.iframe = null;

    setTimeout(function () {
      try {
        if (doc && doc.webkitCancelFullScreen)
          doc.webkitCancelFullScreen();
      } catch (e2) {
        log("v5 cancel err: " + e2);
      }
      try {
        if (doc && doc.exitFullscreen)
          doc.exitFullscreen();
      } catch (e3) {
        log("v5 exit err: " + e3);
      }
      doc = null;
      gc(10000, 10);
      log("v5 done");
    }, 0);
  }

  document.getElementById("b1").addEventListener("click", v1);
  document.getElementById("b2").addEventListener("click", v2);
  document.getElementById("b3").addEventListener("click", v3);
  document.getElementById("b4").addEventListener("click", v4);
  document.getElementById("b5").addEventListener("click", v5);
})();
</script>
</body>
</html>
