<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script>
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

function f3() {
    gc();
}

function createTriggerTree(hostTag, idx) {
    var host = document.createElement(hostTag);
    host.id = "x5_" + idx;
    host.setAttribute("onfocusout", "f3()");
    host.tabIndex = -1;

    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.id = "x11_" + idx;
    svg.setAttribute("tabindex", "-1");

    var anim = document.createElementNS("http://www.w3.org/2000/svg", "animateTransform");
    anim.id = "x18_" + idx;
    anim.setAttribute("min", "0.5s");

    var clipId = "x20_" + idx;
    var clip = document.createElementNS("http://www.w3.org/2000/svg", "clipPath");
    clip.setAttribute("id", clipId);
    clip.setAttribute("vector-effect", "non-scaling-size");
    clip.setAttribute("clip-path", "url(#" + clipId + ")");
    clip.setAttribute("markerUnits", "strokeWidth");
    clip.setAttribute("clip", "rect(1em,auto,auto,546px)");
    clip.setAttribute("patternUnits", "userSpaceOnUse");

    var svgStyle = document.createElementNS("http://www.w3.org/2000/svg", "style");
    svgStyle.setAttribute("width", "0.20em");
    svgStyle.setAttribute("translate", "no");
    svgStyle.setAttribute("draggable", "true");
    svgStyle.setAttribute("itemref", "x50");
    svgStyle.setAttribute("itemgroup", "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA");
    svgStyle.textContent = "svg { clip-path: url(#" + clipId + "); }";

    clip.appendChild(svgStyle);
    svg.appendChild(anim);
    svg.appendChild(clip);

    var container = document.createElement("div");
    container.appendChild(host);
    container.appendChild(svg);
    document.body.appendChild(container);

    return { container: container, host: host, svg: svg, anim: anim };
}

function runCycle(idx) {
    var t = createTriggerTree("div", idx);
    var sr = t.host.attachShadow({ mode: "open", delegatesFocus: false });
    var dummy = t.anim.scrollTop;
    void dummy;

    if (typeof t.host.focus === "function")
        t.host.focus();
    if (typeof t.host.blur === "function")
        t.host.blur();

    sr.appendChild(t.svg);
    gc();

    if (t.container && t.container.parentNode)
        t.container.parentNode.removeChild(t.container);
    gc();
}

function main() {
    var status = document.getElementById("status");
    try {
        for (var i = 0; i < 5; i++) {
            runCycle(i);
        }
        if (status)
            status.textContent = "Executed variations without crash.";
    } catch (e) {
        if (status)
            status.textContent = "Error: " + e.name + ": " + e.message;
    }
}
</script>
</head>
<body onload="main()">
<pre id="status">Ready</pre>
</body>
</html>
