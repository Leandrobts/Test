<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>WebKit Style Update Timer - Reentrant Variant</title>

<style>
*:last-child,
*:placeholder-shown {
    -webkit-clip-path: url(#fontFaceID);
}

*:empty {
    -webkit-border-after: #D1C78D;
}
</style>

<script>

/*
 * Substituto experimental para GCController.collect().
 */

function gc()
{
    function gcRec(n)
    {
        if (n < 1)
            return {};

        var temp = {
            i: "ab" + i + (i / 100000)
        };

        temp += "foo";

        gcRec(n - 1);
    }

    for (var i = 0; i < 10000; i++)
        gcRec(10);
}


/*
 * Log visual + console.
 */

function log(message)
{
    console.log(message);

    var output = document.getElementById("log");

    if (output)
        output.textContent += message + "\n";
}


/*
 * Retorna uma descrição simples da relação entre dois nós.
 */

function describeParent(node)
{
    if (!node)
        return "null";

    if (!node.parentNode)
        return "null";

    return node.parentNode.nodeName;
}


/*
 * Callback disparado durante a remoção do marquee.
 *
 * A parte importante é que este callback modifica
 * animateTransform enquanto a operação principal ainda
 * está em andamento.
 */

function domNodeRemovedCallback(event)
{
    try {
        var svg =
            document.getElementById("svgID");

        var animateMotion =
            document.getElementById("animateMotionID");

        var animateTransform =
            document.getElementById("animateTransformID");

        var iframe =
            document.getElementById("iframeID");


        log("");
        log(">>> DOMNodeRemoved FIRED");

        log(
            "event.target = " +
            event.target.nodeName
        );

        log(
            "animateMotion parent BEFORE callback move = " +
            describeParent(animateMotion)
        );

        log(
            "animateTransform children BEFORE callback move = " +
            animateTransform.childNodes.length
        );


        /*
         * Esta é a mutação reentrante importante.
         */

        log("");
        log("Callback: moving animateMotion to SVG");

        svg.appendChild(animateMotion);

        log(
            "animateMotion parent AFTER callback move = " +
            describeParent(animateMotion)
        );

        log(
            "animateMotion still child of animateTransform = " +
            (animateMotion.parentNode === animateTransform)
        );


        /*
         * Cria Range no documento do iframe.
         */

        log("");
        log("Callback: creating Range");

        var range =
            iframe.contentDocument.createRange();


        log(
            "Callback: selecting animateTransform contents"
        );

        range.selectNodeContents(
            animateTransform
        );


        log(
            "Callback: before surroundContents"
        );

        range.surroundContents(
            document.createElement("meter")
        );


        log(
            "Callback: surroundContents completed"
        );

        log(
            "animateTransform children AFTER surroundContents = " +
            animateTransform.childNodes.length
        );


        log(">>> CALLBACK END");

    } catch (e) {

        log("");
        log("!!! CALLBACK EXCEPTION");

        log(
            e.name + ": " + e.message
        );

        console.error(e);
    }
}


/*
 * Executa a parte posterior mesmo se a inserção
 * original falhar devido à reentrância.
 */

function continueAfterMutation()
{
    try {

        log("");
        log("================================");
        log("CONTINUING AFTER MUTATION");
        log("================================");


        var svg =
            document.getElementById("svgID");

        var symbol =
            document.getElementById("symbolID");


        /*
         * Consulta de geometria/layout SVG.
         */

        log("");
        log("--- BEFORE getScreenCTM ---");

        var screenCTM = null;


        if (
            symbol &&
            typeof symbol.getScreenCTM === "function"
        ) {

            log(
                "Using symbol.getScreenCTM()"
            );

            screenCTM =
                symbol.getScreenCTM();

        } else if (
            svg &&
            typeof svg.getScreenCTM === "function"
        ) {

            log(
                "symbol.getScreenCTM unavailable"
            );

            log(
                "Using svg.getScreenCTM()"
            );

            screenCTM =
                svg.getScreenCTM();

        } else {

            log(
                "getScreenCTM unavailable"
            );
        }


        log("--- AFTER getScreenCTM ---");

        log(
            "screenCTM = " +
            (screenCTM ? "OK" : "null")
        );


        /*
         * Força consulta adicional de layout.
         */

        try {

            var rect =
                svg.getBoundingClientRect();

            log(
                "SVG rect = " +
                rect.width +
                "x" +
                rect.height
            );

        } catch (e) {

            log(
                "getBoundingClientRect exception: " +
                e.name +
                ": " +
                e.message
            );
        }


        /*
         * Agora destruímos o SVG inteiro.
         */

        log("");
        log("--- BEFORE SVG REMOVAL ---");

        svg.outerHTML = "A";

        log("--- AFTER SVG REMOVAL ---");


        /*
         * Eliminamos referências locais.
         */

        svg = null;
        symbol = null;
        screenCTM = null;


        /*
         * Pressão de GC.
         */

        log("");
        log("--- BEFORE GC ---");

        gc();

        log("--- AFTER GC ---");


        /*
         * Permite processamento do event loop e rendering.
         */

        log("");
        log("--- WAITING FOR INTERNAL TIMERS ---");


        setTimeout(function() {

            log("setTimeout #1 fired");


            requestAnimationFrame(function() {

                log(
                    "requestAnimationFrame #1 fired"
                );


                requestAnimationFrame(function() {

                    log(
                        "requestAnimationFrame #2 fired"
                    );


                    setTimeout(function() {

                        log(
                            "setTimeout #2 fired"
                        );

                        log("");
                        log(
                            "================================"
                        );

                        log(
                            "PASS IF NO CRASH"
                        );

                        log(
                            "================================"
                        );

                    }, 0);

                });

            });

        }, 0);

    } catch (e) {

        log("");

        log(
            "================================"
        );

        log(
            "!!! POST-MUTATION EXCEPTION"
        );

        log(
            e.name + ": " + e.message
        );

        log(
            "================================"
        );

        console.error(e);
    }
}


/*
 * Teste principal.
 */

function test()
{
    try {

        log("================================");
        log("TEST START");
        log("================================");


        var meter =
            document.getElementById("meterID");

        var marquee =
            document.getElementById("marqueeID");

        var animateTransform =
            document.getElementById(
                "animateTransformID"
            );

        var animateMotion =
            document.getElementById(
                "animateMotionID"
            );


        /*
         * Estado inicial.
         */

        log("");
        log("--- INITIAL DOM STATE ---");

        log(
            "meter parent = " +
            describeParent(meter)
        );

        log(
            "marquee parent = " +
            describeParent(marquee)
        );

        log(
            "animateTransform parent = " +
            describeParent(animateTransform)
        );

        log(
            "animateMotion parent = " +
            describeParent(animateMotion)
        );

        log(
            "animateMotion is child of animateTransform = " +
            (animateMotion.parentNode === animateTransform)
        );


        /*
         * Listener legado usado pelo testcase original.
         */

        log("");
        log("--- ADD EVENT LISTENER ---");

        meter.addEventListener(
            "DOMNodeRemoved",
            domNodeRemovedCallback
        );

        log(
            "DOMNodeRemoved listener added"
        );


        /*
         * Tentativa de reproduzir a intenção original:
         *
         * inserir marquee ANTES de animateMotion.
         *
         * O ponto importante é que a remoção de marquee
         * do meter dispara DOMNodeRemoved, cujo callback
         * move animateMotion durante esta operação.
         */

        log("");
        log("================================");
        log("REENTRANT INSERTION TEST");
        log("================================");

        log(
            "marquee parent BEFORE = " +
            describeParent(marquee)
        );

        log(
            "animateMotion parent BEFORE = " +
            describeParent(animateMotion)
        );

        log(
            "Reference valid BEFORE insertion = " +
            (animateMotion.parentNode === animateTransform)
        );


        try {

            log("");
            log(
                "--- BEFORE insertBefore(marquee, animateMotion) ---"
            );

            animateTransform.insertBefore(
                marquee,
                animateMotion
            );

            log(
                "--- AFTER insertBefore ---"
            );

            log(
                "Insertion completed successfully"
            );

        } catch (e) {

            log("");

            log(
                "!!! REENTRANT INSERTION EXCEPTION"
            );

            log(
                e.name + ": " + e.message
            );

            log(
                "This exception is expected to be useful for comparison."
            );

            console.error(e);
        }


        /*
         * Estado da árvore após a tentativa.
         */

        log("");
        log("--- DOM STATE AFTER INSERTION ATTEMPT ---");

        log(
            "marquee parent AFTER = " +
            describeParent(marquee)
        );

        log(
            "animateMotion parent AFTER = " +
            describeParent(animateMotion)
        );

        log(
            "animateMotion is child of animateTransform AFTER = " +
            (animateMotion.parentNode === animateTransform)
        );

        log(
            "animateTransform childNodes AFTER = " +
            animateTransform.childNodes.length
        );


        for (
            var i = 0;
            i < animateTransform.childNodes.length;
            i++
        ) {

            log(
                "child[" +
                i +
                "] = " +
                animateTransform.childNodes[i].nodeName
            );
        }


        /*
         * Continuamos independentemente de a inserção
         * ter completado ou lançado exceção.
         */

        continueAfterMutation();

    } catch (e) {

        log("");

        log(
            "================================"
        );

        log(
            "!!! MAIN TEST EXCEPTION"
        );

        log(
            e.name + ": " + e.message
        );

        log(
            "================================"
        );

        console.error(e);
    }
}

</script>
</head>

<body onload="test()">

<pre id="log" style="
white-space: pre-wrap;
font-family: monospace;
font-size: 14px;
padding: 10px;
border: 1px solid black;
margin-bottom: 20px;
"></pre>


<meter id="meterID">

    <marquee id="marqueeID">
    </marquee>

</meter>


<svg id="svgID">

    <symbol id="symbolID">

        <font-face id="fontFaceID">

            <animateTransform id="animateTransformID">

                <animateMotion id="animateMotionID">
                </animateMotion>

            </animateTransform>

        </font-face>

    </symbol>

</svg>


<iframe id="iframeID">
</iframe>

</body>
</html>
