<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
    /* Estilos do framework de log visual simulado (js-test.js embutido) */
    .pass { font-weight: bold; color: green; }
    .fail { font-weight: bold; color: red; }
    #console { white-space: pre-wrap; font-family: monospace; font-size: 16px; padding: 10px; }
</style>
</head>
<body>

<div id="description"></div>
<div id="console"></div>

<script>
// --- Núcleo simplificado e integrado do js-test para rodar em arquivo único ---
var didFailSomeTests = false;

function description(msg) {
    document.getElementById("description").innerHTML = '<p>' + msg + '</p>';
}

function debug(msg) {
    var span = document.createElement("span");
    span.innerHTML = msg + '<br />';
    document.getElementById("console").appendChild(span);
}

function testPassed(msg) {
    debug('<span><span class="pass">PASS</span> ' + msg + '</span>');
}

function testFailed(msg) {
    didFailSomeTests = true;
    debug('<span><span class="fail">FAIL</span> ' + msg + '</span>');
}

function shouldBeTrue(expr) {
    try {
        if (eval(expr)) {
            testPassed(expr + " is true");
        } else {
            testFailed(expr + " should be true");
        }
    } catch (e) {
        testFailed(expr + " threw exception " + e);
    }
}

function shouldBeEqualToString(expr, expected) {
    try {
        let val = eval(expr);
        if (val === expected) {
            testPassed(expr + " is \"" + expected + "\"");
        } else {
            testFailed(expr + " should be \"" + expected + "\". Was \"" + val + "\"");
        }
    } catch (e) {
        testFailed(expr + " threw exception " + e);
    }
}

function finishJSTest() {
    if (didFailSomeTests) {
        debug('<br /><span class="fail">Some tests failed.</span>');
    } else {
        debug('<br /><span class="pass">TEST COMPLETE</span>');
    }
}

function gc() {
    function gcRec(n) {
          if (n < 1)
              return {};
          var temp = {i: "ab" + i + (i / 100000)};
          temp += "foo";
          gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
    gcRec(10);
}


// --- Lógica principal do Teste ---
window.jsTestIsAsync = true;
description("Test that a parent stylesheet wrapper is not collected when only the @import child stylesheet is alive.");

// Cria o elemento de estilo importando o arquivo externo na pasta resources
var style = document.createElement("style");
style.textContent = '@import url("resources/detached-style.css");';
document.head.appendChild(style);

var parentSheet = style.sheet;
shouldBeTrue("parentSheet instanceof CSSStyleSheet");
shouldBeTrue("parentSheet.cssRules[0].type === CSSRule.IMPORT_RULE");

// Define uma propriedade personalizada no wrapper da folha de estilo pai
parentSheet.foo = "bar";

// Executa após o carregamento completo da página
window.onload = () => {
    // Retém apenas a folha de estilo importada (filha)
    window.childSheet = parentSheet.cssRules[0].styleSheet;

    // Libera todas as referências diretas ao pai
    parentSheet = null;
    style.remove();
    style = null;

    gc();
    setTimeout(function() {
        gc();

        // O wrapper pai deve sobreviver porque a raiz opaca do filho o agrupa.
        shouldBeEqualToString('childSheet.parentStyleSheet.foo', 'bar');
        finishJSTest();
    }, 100);
};
</script>

</body>
</html>
