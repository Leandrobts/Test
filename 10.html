<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<style>
    html, body {
        margin: 0;
        padding: 0;
    }

    iframe {
        content: url();
        zoom: 0.01;
        width: 300px;
        height: 200px;
    }

    #status {
        font-family: monospace;
        white-space: pre;
    }
</style>
</head>

<body>

<div id="status">starting...</div>

<iframe id="i0"></iframe>

<script>

(function () {

    var status = document.getElementById("status");
    var frame = document.getElementById("i0");

    function log(s) {
        status.textContent += "\n" + s;
    }

    log("iframe created");

    /*
     * Equivalent to the original test's focus handler.
     */
    frame.onfocus = function () {
        log("iframe focus");

        /*
         * Same state transition used by the original testcase.
         */
        location.hash = "y";
    };

    /*
     * Original testcase starts at #x.
     */
    location.hash = "x";

    /*
     * Force the document/render tree through several
     * synchronous layout opportunities.
     */
    document.documentElement.appendChild(
        document.createElement("frameset")
    );

    /*
     * Create a script dynamically, similar to the original
     * asynchronous trigger.
     */
    var script = document.createElement("script");

    script.onload = function () {
        log("dynamic script loaded");

        /*
         * Delay slightly so that style/layout/frame state
         * has an opportunity to settle.
         */
        setTimeout(function () {

            log("attempting iframe.focus()");

            try {
                frame.focus();
                log("focus() returned");
            } catch (e) {
                log("focus exception: " + e);
            }

        }, 0);
    };

    script.onerror = function () {
        log("dynamic script error");
    };

    /*
     * Use a data URL so no network request is required.
     */
    script.src =
        "data:text/javascript," +
        encodeURIComponent(
            "void 0;"
        );

    document.head.appendChild(script);

})();

</script>

</body>
</html>
