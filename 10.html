<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>PS4 FullScreen - T10</title></head>
<body>
<pre id="ua"></pre>
<pre id="out"></pre>

<video id="v1" width="100" height="100"></video>

<br>
<button onclick="runT()">T10: reqFS on VIDEO element (remove + readd)</button><br><br>

<script>
document.getElementById('ua').textContent = navigator.userAgent;
function log(s){ document.getElementById('out').textContent += s + '\n'; }
function safe(fn, tag){ try { return fn(); } catch(e) { log('[EXC@' + tag + '] ' + e); return null; } }
function runT(){
    document.getElementById('out').textContent = '';
    log('=== T10 ===');
    var v1 = document.getElementById('v1');
    var h10 = function(){
        document.removeEventListener('webkitfullscreenchange', h10);
        log('[handler] VIDEO FS fired');
        safe(function(){ if(v1.parentNode){ v1.parentNode.removeChild(v1); log('v1 removed'); } }, 'remove');
        safe(function(){ if(!v1.parentNode) document.body.appendChild(v1); }, 'readd');
    };
    document.addEventListener('webkitfullscreenchange', h10);
    safe(function(){ v1.webkitRequestFullscreen(); }, 'reqFS');
    setTimeout(function(){ document.removeEventListener('webkitfullscreenchange', h10); }, 3000);
}
</script>
</body>
</html>
