<!DOCTYPE html>
<body>
<script>
const canvas = document.createElement("canvas");
canvas.width = 64;
canvas.height = 64;

let contextFromListener = null;
let reentrantTriggered = false;

// Gancho de reentrância durante a obtenção/uso inicial do contexto 2d:
// intercepta CanvasRenderingContext2D.prototype.save (chamado quando m_contextStateSaver é criado no buffer)
// ou chama getContext("2d") reentrantemente a partir de um hook no ambiente.
const origGetContext = HTMLCanvasElement.prototype.getContext;
HTMLCanvasElement.prototype.getContext = function(type, attrs) {
    const ctx = origGetContext.call(this, type, attrs);
    if (!reentrantTriggered && type === "2d" && ctx) {
        reentrantTriggered = true;
        contextFromListener = origGetContext.call(this, "2d");
    }
    return ctx;
};

const ctx = canvas.getContext("2d");

const log = [
    `ctx = ${ctx}`,
    `context from listener = ${contextFromListener ? contextFromListener.constructor.name : undefined}`,
    `its canvas is the same element = ${ctx ? ctx.canvas === canvas : false}`,
    `it still owns the slot = ${ctx === canvas.getContext("2d")}`,
    "PASS if no crash.",
];
document.body.appendChild(document.createElement("pre")).textContent = log.join("\n");
</script>
</body>
