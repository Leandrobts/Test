<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Diagnóstico Shadow DOM - PS4</title>
</head>
<body>
<h2>Diagnóstico Shadow DOM - PS4</h2>
<pre id="resultado"></pre>

<script>
(function () {
    var output = document.getElementById("resultado");

    function log(text) {
        output.appendChild(
            document.createTextNode(text + "\n")
        );
    }

    function check(name, value) {
        log(name + ": " + value);
    }

    check("attachShadow",
        typeof Element.prototype.attachShadow);

    check("createShadowRoot",
        typeof Element.prototype.createShadowRoot);

    check("getRootNode",
        typeof Node.prototype.getRootNode);

    check("assignedSlot",
        "assignedSlot" in Element.prototype);

    var host = document.createElement("div");
    document.body.appendChild(host);

    try {
        var shadow = null;

        if (typeof host.attachShadow === "function") {
            shadow = host.attachShadow({ mode: "open" });
            log("Criacao Shadow DOM: attachShadow OK");
        } else if (typeof host.createShadowRoot === "function") {
            shadow = host.createShadowRoot();
            log("Criacao Shadow DOM: createShadowRoot OK");
        } else {
            log("Criacao Shadow DOM: API indisponivel");
        }

        if (shadow) {
            var child = document.createElement("span");
            shadow.appendChild(child);

            log("ShadowRoot criada: SIM");
            log("Host associado: " + (shadow.host === host));
            log("Filho inserido: " + (child.parentNode === shadow));
        }
    } catch (e) {
        log("ERRO: " + e.name + ": " + e.message);
    }

    log("TEST COMPLETE");
})();
</script>
</body>
</html>
