<!DOCTYPE html>
<html>
<body>
  <h1>Diagnostico - Teste Commit 34f6384</h1>
  <div id="results"></div>

  <script>
    (function () {
      var out = document.getElementById("results");
      var lines = [];

      function log(label, ok, detail) {
        lines.push(
          "<p><b>" + label + ":</b> " +
          (ok ? "OK" : "NAO") +
          (detail ? " (" + detail + ")" : "") +
          "</p>"
        );
      }

      var hasStyleEl = typeof document.createElement === "function";
      var style = hasStyleEl ? document.createElement("style") : null;
      var appended = false;

      if (style && document.head && typeof document.head.appendChild === "function") {
        document.head.appendChild(style);
        appended = true;
      }
      log("createElement('style') + appendChild", appended);

      var sheet = style ? style.sheet : null;
      log("style.sheet", !!sheet, sheet ? typeof sheet : "null");

      var hasInsert = !!(sheet && typeof sheet.insertRule === "function");
      var hasDelete = !!(sheet && typeof sheet.deleteRule === "function");
      log("sheet.insertRule", hasInsert);
      log("sheet.deleteRule", hasDelete);

      var hasGCController = typeof window.GCController !== "undefined";
      log("window.GCController (harness WebKit)", hasGCController, typeof window.GCController);

      var insertedIdx = -1;
      var insertErr = "";
      if (hasInsert) {
        try {
          insertedIdx = sheet.insertRule(".outer { color: red; & .nested { color: blue; } }", 0);
        } catch (e) {
          insertErr = e && e.message ? e.message : String(e);
        }
      }
      log("insertRule com CSS nesting (& .nested)", insertedIdx === 0, insertErr || ("index=" + insertedIdx));

      var outerRule = (sheet && sheet.cssRules && sheet.cssRules.length > 0) ? sheet.cssRules[0] : null;
      log("sheet.cssRules[0]", !!outerRule);

      var nestedList = outerRule ? outerRule.cssRules : null;
      var hasNestedRules = !!(nestedList && nestedList.length > 0);
      log("outerRule.cssRules (regras aninhadas)", hasNestedRules, nestedList ? ("length=" + nestedList.length) : "null");

      var nestedRule = hasNestedRules ? nestedList[0] : null;
      var hasParentRuleProp = !!(nestedRule && ("parentRule" in nestedRule));
      log("nestedRule.parentRule", hasParentRuleProp, nestedRule ? String(nestedRule.parentRule) : "n/a");

      var deleteOk = false;
      var deleteErr = "";
      if (hasDelete && insertedIdx === 0) {
        try {
          sheet.deleteRule(0);
          deleteOk = true;
        } catch (e) {
          deleteErr = e && e.message ? e.message : String(e);
        }
      }
      log("sheet.deleteRule(0)", deleteOk, deleteErr);

      out.innerHTML = lines.join("\n");
    })();
  </script>
</body>
</html>
