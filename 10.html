<!DOCTYPE html>
<html>
<body>
<p>This test passes if it does not crash.</p>

<div id="host" style="width:100px;height:100px;background:red">
    <template id="victimTemplate">
        <div id="victim" tabindex="0">Focusable</div>
    </template>
</div>

<div id="result"></div>

<script>

function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

let host = document.getElementById('host');
let template = document.getElementById('victimTemplate');
let shadowRoot = host.attachShadow({ mode: 'open' });
shadowRoot.appendChild(template.content);
let victim = shadowRoot.getElementById('victim');
victim.focus();

async function runTest() {
    document.addEventListener('blur', () => {
        if (!victim) return;
        victim.remove();
        victim = null;
        gc();
    }, true);




// 1. Foca na vítima do Shadow DOM primeiro
    victim.focus();

    // 2. Substituição lógica do UIHelper: 
    // Em vez de desligar a janela via API interna, forçamos o FocusController 
    // a reavaliar o foco global movendo-o para o outerInput e para o iframe 
    // na mesma árvore de ticks, forçando a transição de documentos.
    const outerInput = document.getElementById('outerInput');
    const frame1 = document.getElementById('frame1');

    outerInput.focus();
    
    if (frame1 && frame1.contentDocument) {
        let innerInput = frame1.contentDocument.getElementById('innerInput');
        if (innerInput) {
            innerInput.focus();
        }
    }




    await new Promise((resolve) => {
        requestAnimationFrame(() => setTimeout(resolve, 0));
    });

    document.getElementById('result').textContent = 'PASS';
}

runTest();
</script>
</body>
</html>
