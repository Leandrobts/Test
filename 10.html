<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 Shadow Test - Variant B</title>
</head>

<body>

<script>
(function () {

    function boom()
    {
        /*
         * Host principal.
         */
        var host = document.createElement("div");

        /*
         * "older"
         */
        var older = host.attachShadow({
            mode: "open"
        });

        /*
         * Mesmo primeiro conteúdo simples do teste original.
         */
        var olderChild = document.createElement("div");

        older.appendChild(olderChild);

        /*
         * O host entra no documento antes da próxima
         * estrutura ser criada.
         */
        document.documentElement.appendChild(host);

        /*
         * Como não podemos ter:
         *
         * new WebKitShadowRoot(host)
         *
         * uma segunda vez no mesmo host,
         * criamos um segundo host dentro da árvore anterior.
         */
        var youngerHost = document.createElement("div");

        older.appendChild(youngerHost);

        /*
         * "younger"
         */
        var younger = youngerHost.attachShadow({
            mode: "open"
        });

        /*
         * Reproduz o elemento central do commit.
         */
        var select = document.createElement("select");

        /*
         * Substituto estrutural do antigo <shadow>.
         */
        var insertionContainer = document.createElement("div");

        select.appendChild(insertionContainer);

        /*
         * select dentro da segunda árvore encapsulada.
         */
        younger.appendChild(select);

        /*
         * Força resolução de layout.
         */
        void host.offsetWidth;
        void youngerHost.offsetWidth;
        void select.offsetWidth;
    }

    window.onload = boom;

})();
</script>

</body>
</html>
