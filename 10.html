<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Scroll-Driven Animation Race Test</title>
    <style>
        body { 
            margin: 0; 
            height: 2000000px; 
        }
        @keyframes spin { 
            from { transform: rotate(0deg); } 
            to { transform: rotate(360deg); } 
        }
        #t {
            position: fixed;
            top: 10px; 
            left: 10px;
            width: 100px; 
            height: 100px;
            background: red;
            will-change: transform;
            animation: spin linear;
            animation-timeline: scroll(root);
        }
        #t.noanim { 
            animation: none; 
        }
    </style>
</head>
<body>
    <div id="t"></div>
    <div id="status" style="position: fixed; top: 120px; left: 10px; font-family: monospace;">Executando...</div>

    <script>
    const t = document.getElementById('t');
    const status = document.getElementById('status');

    // Verifica se o navegador suporta Scroll Timelines
    if (!CSS.supports('animation-timeline', 'scroll(root)')) {
        status.innerText = 'Scroll-driven animations não suportadas neste navegador.';
    } else {
        let toggle = 0;
        let iterations = 0;

        function doScroll() {
            let target = (window.scrollY < 1000000) ? 1900000 : 100;
            window.scrollTo({ top: target, behavior: 'smooth' });
        }

        window.addEventListener('load', () => {
            document.body.offsetHeight;
            requestAnimationFrame(() => {
                doScroll();
                
                (function loop() {
                    // Alterna rapidamente entre ativar e desativar a timeline na Main Thread
                    if (toggle++ & 1) {
                        t.classList.remove('noanim');
                    } else {
                        t.classList.add('noanim');
                    }
                    
                    document.body.offsetHeight; // Força recomputação de layout
                    
                    if ((toggle & 0xf) === 0) {
                        doScroll();
                    }

                    if (++iterations < 200) {
                        setTimeout(loop, 8);
                    } else {
                        status.innerText = 'Teste finalizado: Sobreviveu (sem crash).';
                    }
                })();
            });
        });
    }
    </script>
</body>
</html>
