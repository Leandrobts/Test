<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>UAF BaseDateAndTimeInputType::didChangeValueFromControl</title>
</head>
<body>

<input id="input" type="date">

<script>

var input = document.getElementById("input");

/*
 * Original WebKit LayoutTest:
 *
 * input.addEventListener("input", () => {
 *     input.type = "text";
 * });
 *
 * The important operation is intentionally preserved exactly.
 */
input.addEventListener("input", function () {
    input.type = "text";
});


/*
 * Equivalent of the original load handler.
 *
 * The original test used UIHelper.keyDown() to inject:
 *
 *     9
 *     rightArrow
 *     2
 *     rightArrow
 *     2
 *     0
 *     1
 *     2
 *
 * UIHelper.keyDown() requires WebKit's internal testRunner/
 * eventSender infrastructure and therefore cannot be executed
 * by a normal standalone page.
 *
 * The real date input is focused here so the same editing path
 * can be exercised with physical/user input.
 */
window.addEventListener("load", function () {
    input.focus();
});

</script>

</body>
</html>
