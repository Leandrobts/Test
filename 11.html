<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>UAF Document - BaseDateAndTimeInputType::didChangeValueFromControl</title>

<style>
#console {
    white-space: pre-wrap;
    font-family: monospace;
}
.pass {
    font-weight: bold;
}
.fail {
    font-weight: bold;
}
</style>

</head>

<body>

<div id="description"></div>
<div id="console"></div>

<input id="input" type="date">

<script>

/* ============================================================
 * Minimal standalone adaptation of js-test.js
 * ============================================================ */

var jsTestIsAsync = false;
var successfullyParsed = true;
var unexpectedErrorMessage;
var didFailSomeTests = false;
var wasFinishJSTestCalled = false;
var wasPostTestScriptParsed = true;

function description(message)
{
    var element = document.getElementById("description");
    element.textContent = message;
}

function debug(message)
{
    var consoleElement = document.getElementById("console");
    var span = document.createElement("span");
    span.innerHTML = message + "<br>";
    consoleElement.appendChild(span);
}

function testPassed(message)
{
    var span = document.createElement("span");
    span.className = "pass";
    span.textContent = "PASS " + message;
    document.getElementById("console").appendChild(span);
    document.getElementById("console").appendChild(document.createElement("br"));
}

function testFailed(message)
{
    didFailSomeTests = true;

    var span = document.createElement("span");
    span.className = "fail";
    span.textContent = "FAIL " + message;
    document.getElementById("console").appendChild(span);
    document.getElementById("console").appendChild(document.createElement("br"));
}

function shouldBeEqualToString(expression, expected)
{
    var actual;

    try {
        actual = eval(expression);
    } catch (e) {
        testFailed(
            expression +
            " threw " +
            e.name +
            " instead of producing \"" +
            expected +
            "\""
        );
        return;
    }

    if (String(actual) === String(expected))
        testPassed(expression + " is \"" + expected + "\"");
    else
        testFailed(
            expression +
            " should be \"" +
            expected +
            "\". Was \"" +
            actual +
            "\""
        );
}

function shouldBeTrue(expression)
{
    var actual;

    try {
        actual = eval(expression);
    } catch (e) {
        testFailed(expression + " threw " + e.name);
        return;
    }

    if (actual === true)
        testPassed(expression + " is true");
    else
        testFailed(expression + " should be true. Was " + actual);
}

function isSuccessfullyParsed()
{
    successfullyParsed = !unexpectedErrorMessage;

    if (successfullyParsed)
        shouldBeTrue("successfullyParsed");

    if (didFailSomeTests)
        debug("Some tests failed.");

    debug('<br><span class="pass">TEST COMPLETE</span>');
}

function finishJSTest()
{
    wasFinishJSTestCalled = true;

    if (!wasPostTestScriptParsed)
        return;

    isSuccessfullyParsed();
}


/* ============================================================
 * Minimal standalone adaptation of UIHelper
 *
 * The original UIHelper ultimately calls:
 *
 *     testRunner
 *     eventSender
 *     uiController
 *
 * Those objects only exist inside WebKit LayoutTests.
 *
 * This standalone implementation preserves the same API and
 * key sequence. When eventSender is unavailable, it falls back
 * to DOM KeyboardEvent dispatch.
 * ============================================================ */

var UIHelper = {

    keyDown: function(key, modifiers)
    {
        modifiers = modifiers || [];

        /*
         * Original LayoutTest infrastructure.
         * If it exists, use it exactly.
         */
        if (typeof eventSender !== "undefined") {
            eventSender.keyDown(key, modifiers);
            return Promise.resolve();
        }

        /*
         * Standalone fallback.
         */
        return new Promise(function(resolve) {

            var target = document.activeElement || document.body;

            var keyInfo = UIHelper._keyInfo(key);

            var event = new KeyboardEvent(
                "keydown",
                {
                    key: keyInfo.key,
                    code: keyInfo.code,
                    keyCode: keyInfo.keyCode,
                    which: keyInfo.keyCode,
                    bubbles: true,
                    cancelable: true,
                    composed: true,
                    ctrlKey: modifiers.indexOf("ctrl") !== -1,
                    shiftKey: modifiers.indexOf("shift") !== -1,
                    altKey: modifiers.indexOf("alt") !== -1,
                    metaKey: modifiers.indexOf("meta") !== -1
                }
            );

            target.dispatchEvent(event);

            /*
             * Keep the asynchronous behavior of the original
             * UIHelper operation.
             */
            setTimeout(resolve, 0);
        });
    },

    _keyInfo: function(key)
    {
        var table = {
            "0": {
                key: "0",
                code: "Digit0",
                keyCode: 48
            },
            "1": {
                key: "1",
                code: "Digit1",
                keyCode: 49
            },
            "2": {
                key: "2",
                code: "Digit2",
                keyCode: 50
            },
            "3": {
                key: "3",
                code: "Digit3",
                keyCode: 51
            },
            "4": {
                key: "4",
                code: "Digit4",
                keyCode: 52
            },
            "5": {
                key: "5",
                code: "Digit5",
                keyCode: 53
            },
            "6": {
                key: "6",
                code: "Digit6",
                keyCode: 54
            },
            "7": {
                key: "7",
                code: "Digit7",
                keyCode: 55
            },
            "8": {
                key: "8",
                code: "Digit8",
                keyCode: 56
            },
            "9": {
                key: "9",
                code: "Digit9",
                keyCode: 57
            },

            "rightArrow": {
                key: "ArrowRight",
                code: "ArrowRight",
                keyCode: 39
            }
        };

        return table[key] || {
            key: key,
            code: key,
            keyCode: 0
        };
    }
};


/* ============================================================
 * Original test logic
 * ============================================================ */

jsTestIsAsync = true;

description(
    "Test that changing the input type during an input event does not crash."
);

var input = document.getElementById("input");


/*
 * THIS IS THE CRITICAL PART OF THE ORIGINAL TEST.
 *
 * The input event is dispatched while the date input is still
 * using BaseDateAndTimeInputType.
 *
 * Changing the type replaces the input type object.
 */
input.addEventListener("input", function () {
    input.type = "text";
});


/*
 * Preserve the original load-driven execution.
 */
window.addEventListener("load", async function () {

    input.focus();

    /*
     * Original sequence from the WebKit LayoutTest:
     *
     * UIHelper.keyDown("9");
     * UIHelper.keyDown("rightArrow");
     * UIHelper.keyDown("2");
     * UIHelper.keyDown("rightArrow");
     * UIHelper.keyDown("2");
     * UIHelper.keyDown("0");
     * UIHelper.keyDown("1");
     * UIHelper.keyDown("2");
     */

    await UIHelper.keyDown("9");

    await UIHelper.keyDown("rightArrow");

    await UIHelper.keyDown("2");

    await UIHelper.keyDown("rightArrow");

    await UIHelper.keyDown("2");

    await UIHelper.keyDown("0");

    await UIHelper.keyDown("1");

    await UIHelper.keyDown("2");


    /*
     * Preserve the original verification.
     */
    shouldBeEqualToString(
        "input.type",
        "text"
    );


    testPassed("Did not crash.");

    finishJSTest();

});

</script>

</body>
</html>
