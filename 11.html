<!DOCTYPE html><html>
<body>
<p>This test passes if it does not crash.</p><iframe id="frame"></iframe><button id="start">Start test</button>

<script>
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n - 1);
    }

    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

var iframe = document.getElementById("frame");
var div = iframe.contentDocument.body.appendChild(
    document.createElement("div")
);

document.getElementById("start").onclick = function() {
    var contentDocument = iframe.contentDocument;

    try {
        div.webkitRequestFullscreen();
    } catch (error) {
    }

    document.body.removeChild(iframe);

    setTimeout(function() {
        try {
            contentDocument.webkitCancelFullScreen();
        } catch (error) {
        }

        gc();
    }, 10);
};
</script></body>
</html>
