<!DOCTYPE html>
<html>
<body>
<p>PASS if no crash</p>
<script>
let count = 0;
function churn() {
    let f = document.createElement("iframe");
    // Em um ambiente web comum, use uma URL válida (pode ser relativa ou externa permitida)
    f.src = "about:blank"; 
    document.body.appendChild(f);
    
    // Remove no próximo microtask para simular o ciclo rápido
    Promise.resolve().then(() => f.remove());

    if (++count < 5) {
        setTimeout(churn, 0);
    } else {
        setTimeout(() => {
            document.body.textContent = "PASS if no crash";
        }, 100);
    }
}

onload = churn;
</script>
</body>
</html>
