<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<style>
html, body {
    margin: 0;
    padding: 0;
}

iframe {
    content: url();
    zoom: 0.01;
    width: 300px;
    height: 200px;
}
</style>
</head>

<body>

<iframe id="i0"></iframe>

<script>

var i0 = document.getElementById("i0");

i0.onfocus = function() {
    location.hash = "y";
};

location.hash = "x";

/*
 * Same DOM mutation as the WebKit testcase.
 */
document.documentElement.appendChild(
    document.createElement("frameset")
);

/*
 * Dynamically create a script element,
 * as in the original testcase.
 */
var s0 = document.createElement("script");

s0.src =
    "data:text/javascript," +
    encodeURIComponent(
        "Promise.resolve().then(function(){"
        + "document.getElementById('i0').focus();"
        + "});"
    );

document.head.appendChild(s0);

</script>

</body>
</html>
