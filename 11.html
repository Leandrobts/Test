<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script>
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

function f3() {
    gc();
}

function main() {
    var status = document.getElementById("status");
    try {
        var host = document.getElementById("x5");
        var svg = document.getElementById("x11");
        var anim = document.getElementById("x18");
        var clip = document.getElementById("x20");

        if (typeof anim.getBBox === "function")
            anim.getBBox();
        if (typeof svg.getBoundingClientRect === "function")
            svg.getBoundingClientRect();
        getComputedStyle(svg).clipPath;

        var sr = host.attachShadow({ mode: "open", delegatesFocus: false });
        sr.appendChild(svg);

        getComputedStyle(svg).clipPath;
        if (typeof svg.getBoundingClientRect === "function")
            svg.getBoundingClientRect();

        if (typeof host.focus === "function")
            host.focus();
        if (typeof host.blur === "function")
            host.blur();

        gc();

        if (host.parentNode)
            host.parentNode.removeChild(host);
        gc();

        if (status)
            status.textContent = "Finished minimal layout/teardown test without crash.";
    } catch (e) {
        if (status)
            status.textContent = "Error: " + e.name + ": " + e.message;
    }
}
</script>
</head>
<body onload="main()">
<pre id="status">Ready</pre>
<div id="x5" tabindex="-1" onfocusout="f3()"></div>
<svg id="x11" tabindex="-1">
  <animateTransform id="x18" attributeName="transform" type="translate" from="0 0" to="10 10" dur="1s"></animateTransform>
  <clipPath id="x20">
    <style id="x21">svg { clip-path: url(#x20); }</style>
  </clipPath>
</svg>
</body>
</html>
