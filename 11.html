<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MediaStreamAudioDestinationNode silence after disconnect</title>
</head>
<body>
<pre id="log"></pre>
<script>
const logEl = document.getElementById("log");
function log(msg) {
    logEl.textContent += msg + "\n";
}

function testPassed(msg) {
    log("PASS " + msg);
}

function testFailed(msg) {
    log("FAIL " + msg);
}

function finishJSTest() {
    log("TEST COMPLETE");
}

log("A MediaStreamAudioDestinationNode delivers samples with no input and after its input disconnects.\n");

const AudioCtx = window.AudioContext || window.webkitAudioContext;

if (!AudioCtx) {
    testFailed("AudioContext / webkitAudioContext is not supported in this browser.");
    finishJSTest();
} else {
    const context = new AudioCtx();
    const clock = context.createOscillator();
    clock.connect(context.destination);
    clock.start();

    // Substitui internals.observeMediaStreamTrack e internals.trackAudioSampleCount
    function createStreamObserver(stream) {
        const source = context.createMediaStreamSource(stream);
        const processor = context.createScriptProcessor(256, 1, 1);
        let sampleCount = 0;
        let lastNonZeroCount = 0;

        processor.onaudioprocess = function(event) {
            const input = event.inputBuffer.getChannelData(0);
            sampleCount += input.length;
            let nonZero = 0;
            for (let i = 0; i < input.length; i++) {
                if (input[i] !== 0) nonZero++;
            }
            lastNonZeroCount = nonZero;
        };

        source.connect(processor);
        processor.connect(context.destination);

        return {
            getCount: () => sampleCount,
            getLastNonZero: () => lastNonZeroCount,
            cleanup: () => {
                source.disconnect();
                processor.disconnect();
            }
        };
    }

    function waitForMoreSamples(observer, previous, timeoutMs) {
        return new Promise((resolve, reject) => {
            const start = performance.now();
            const timer = setInterval(() => {
                const count = observer.getCount();
                if (count > previous) {
                    clearInterval(timer);
                    resolve(count);
                } else if (performance.now() - start > timeoutMs) {
                    clearInterval(timer);
                    reject(new Error("timed out, count " + count));
                }
            }, 10);
        });
    }

    const idle = context.createMediaStreamDestination();
    const idleObserver = createStreamObserver(idle.stream);

    waitForMoreSamples(idleObserver, 0, 3000).then(() => {
        testPassed("samples with no input");
        idleObserver.cleanup();

        const destination = context.createMediaStreamDestination();
        const oscillator = context.createOscillator();
        oscillator.connect(destination);
        oscillator.start();

        const destObserver = createStreamObserver(destination.stream);

        return waitForMoreSamples(destObserver, 0, 3000).then(count => {
            oscillator.disconnect(destination);
            return waitForMoreSamples(destObserver, count, 3000).then(() => {
                destObserver.cleanup();
            });
        });
    }).then(() => {
        testPassed("samples continued after disconnect");
        finishJSTest();
    }).catch(error => {
        testFailed(String(error));
        finishJSTest();
    });
}
</script>
</body>
</html>
