<!DOCTYPE html>
<html>
<head>
<script src="resources/gc.js"></script>
</head>
<body>

<script>

var style = document.createElement("style");
style.textContent = '@import url("resources/detached-style.css");';
document.head.appendChild(style);

var parentSheet = style.sheet;

var result = document.createElement("div");
document.body.appendChild(result);

if (!(parentSheet instanceof CSSStyleSheet)) {
    result.textContent = "FAIL: parentSheet is not CSSStyleSheet";
} else if (parentSheet.cssRules[0].type !== CSSRule.IMPORT_RULE) {
    result.textContent = "FAIL: cssRules[0] is not IMPORT_RULE";
} else {
    parentSheet.foo = "bar";

    window.onload = function() {
        window.childSheet = parentSheet.cssRules[0].styleSheet;

        parentSheet = null;
        style.remove();
        style = null;

        gc();

        setTimeout(function() {
            gc();

            if (childSheet.parentStyleSheet.foo === "bar")
                result.textContent = "PASS";
            else
                result.textContent = "FAIL: parent stylesheet wrapper was collected";
        }, 0);
    };
}

</script>

</body>
</html>
