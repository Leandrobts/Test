
<!DOCTYPE html><html>
<body>
<p>This test passes if it does not crash 2.</p><button id="start">Start test</button>

<script>
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n - 1);
    }

    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

document.getElementById("start").onclick = function() {
    var iframe = document.body.appendChild(document.createElement("iframe"));
    var div = iframe.contentDocument.body.appendChild(document.createElement("div"));
    var contentDocument = iframe.contentDocument;

    try {
        div.webkitRequestFullscreen();
    } catch (error) {
    }

    document.body.removeChild(iframe);

    setTimeout(function() {
        try {
            contentDocument.webkitCancelFullScreen();
        } catch (error) {
        }
        gc();
    }, 10);
};
</script></body>
</html>
