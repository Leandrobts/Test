<!DOCTYPE html><html>
<style>
#target {
    width:100px;
    height:100px;
    background:red;
}.scroller {
overflow:scroll;
width:50px;
height:50px;
}

.scroller > div {
height:400px;
}
</style>

<div id="target">PASS if this does not crash.</div><script>

(async function() {

    // (A) Seed m_timelines with extra entries so DocumentTimeline
    // is not the last-iterated bucket.
    let extraTimelines = [];

    for (let i = 0; i < 32; i++) {
        const source = document.createElement('div');
        source.className = 'scroller';
        source.appendChild(document.createElement('div'));
        document.body.appendChild(source);

        extraTimelines.push(
            new ScrollTimeline({ source })
        );
    }

    // (B) Elements whose scroll-timeline-name will be dirtied later.
    let pending = [];

    for (let i = 0; i < 200; i++) {
        const scroller = document.createElement('div');
        scroller.className = 'scroller';
        scroller.appendChild(document.createElement('div'));
        document.body.appendChild(scroller);
        pending.push(scroller);
    }

    // (C) Accelerated, width-dependent transform animation.
    let animation = target.animate(
        { transform: 'translateX(50%)' },
        1e6
    );

    // Wait two frames so the animation ticks.
    await new Promise(requestAnimationFrame);
    await new Promise(requestAnimationFrame);

    // (D) Re-arm the forced-layout condition.
    animation.effect.setKeyframes({
        transform: 'translateX(100%)'
    });

    getComputedStyle(target).transform;
    target.offsetWidth;

    // (E) Dirty style with new scroll-timeline-name on many elements
    // WITHOUT flushing.
    for (let i = 0; i < pending.length; i++)
        pending[i].style.scrollTimelineName = '--st' + i;

    // (F) Public-JavaScript approximation of suspending the animation.
    //
    // NOTE:
    // animation.pause() is NOT equivalent to
    // window.internals.suspendAnimations().
    //
    // It is used only as a public API approximation for testing whether
    // this sequence produces any observable failure on the target browser.
    animation.pause();

})();

</script></html>
