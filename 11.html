<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Diagnostico APIs - fetch-empty-blob-crash</title>
</head>
<body>
<button id="run">Rodar diagnostico</button>
<pre id="out"></pre>
<script>
function log(line) {
    document.getElementById('out').textContent += line + '\n';
}

function checkApi(name, fn) {
    try {
        var ok = !!fn();
        log(name + ': ' + (ok ? 'OK' : 'NAO'));
    } catch (e) {
        log(name + ': ERRO (' + e.name + ': ' + e.message + ')');
    }
}

document.getElementById('run').onclick = function() {
    document.getElementById('out').textContent = '';
    log('navigator.userAgent: ' + navigator.userAgent);

    checkApi('typeof gc', function() {
        return typeof gc === 'function';
    });

    checkApi('typeof indexedDB', function() {
        return typeof indexedDB !== 'undefined' && typeof indexedDB.open === 'function';
    });

    checkApi('typeof Blob', function() {
        return typeof Blob === 'function' && new Blob(['aa']).size === 2;
    });

    checkApi('typeof FormData', function() {
        var fd = new FormData();
        fd.append('a', new Blob(['aa']));
        return typeof FormData === 'function' && typeof fd.append === 'function';
    });

    checkApi('typeof Response', function() {
        var r = new Response(new FormData());
        return typeof Response === 'function' && typeof r.arrayBuffer === 'function';
    });

    checkApi('Object.prototype.__defineGetter__', function() {
        var obj = {};
        Object.prototype.__defineGetter__.call(obj, '__diag_prop__', function() {
            return 123;
        });
        var val = obj.__diag_prop__;
        delete Object.prototype.__diag_prop__;
        return val === 123;
    });

    checkApi('typeof Promise', function() {
        return typeof Promise === 'function';
    });

    if (typeof indexedDB !== 'undefined' && typeof indexedDB.open === 'function') {
        try {
            var dbName = 'diag_idb_' + Date.now();
            var req = indexedDB.open(dbName, 1);
            req.onupgradeneeded = function(e) {
                var db = e.target.result;
                var store = db.createObjectStore('storage', { keyPath: 'id' });
                log('IDB onupgradeneeded + createObjectStore: OK (' + (typeof store.put === 'function') + ')');
            };
            req.onsuccess = function(e) {
                var db = e.target.result;
                log('IDB onsuccess: OK');
                try {
                    var tx = db.transaction(['storage'], 'readwrite');
                    var store = tx.objectStore('storage');
                    var putReq = store.put({ id: 1, data: new Blob(['aa']) });
                    putReq.onsuccess = function() {
                        log('IDB put(Blob): OK');
                        var getReq = store.get(1);
                        getReq.onsuccess = function(ev) {
                            var res = ev.target.result;
                            var isBlob = !!(res && res.data instanceof Blob);
                            log('IDB get(Blob): ' + (isBlob ? 'OK (size=' + res.data.size + ')' : 'FALHOU'));
                            db.close();
                            indexedDB.deleteDatabase(dbName);
                        };
                        getReq.onerror = function(ev) {
                            log('IDB get error: ' + (ev.target.error ? ev.target.error.name : 'erro'));
                        };
                    };
                    putReq.onerror = function(ev) {
                        log('IDB put error: ' + (ev.target.error ? ev.target.error.name : 'erro'));
                    };
                } catch (err) {
                    log('IDB transaction/put/get exception: ' + err.name + ': ' + err.message);
                }
            };
            req.onerror = function(e) {
                log('IDB open error: ' + (e.target.error ? e.target.error.name : 'erro'));
            };
        } catch (err) {
            log('IDB fluxo exception: ' + err.name + ': ' + err.message);
        }
    }
};
</script>
</body>
</html>
