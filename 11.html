<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
fetch('Ahem.woff')
    .then(function(r) { return r.arrayBuffer(); })
    .then(function(b) {
        return new Promise(function(res, rej) {
            var fr = new FileReader();
            fr.onload  = function(e) { res(e.target.result); };
            fr.onerror = rej;
            fr.readAsDataURL(new Blob([b], { type: 'font/woff' }));
        });
    })
    .then(function(dataUrl) {
        var f1 = new FontFace('FA', 'url("' + dataUrl + '")');
        var f2 = new FontFace('FB', 'url("' + dataUrl + '")', { unicodeRange: 'U+13A0-13FF' });

        document.fonts.add(f1);
        document.fonts.add(f2);

        void f1.loaded;
        void f2.loaded;

        var trap = function() {
            document.fonts.add(new FontFace('FC', 'local("x")'));
        };
        Object.defineProperty(f1, 'then', { get: trap });
        Object.defineProperty(f2, 'then', { get: trap });

        var canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        document.body.appendChild(canvas);
        var ctx = canvas.getContext('2d');
        ctx.font = '10px FA, FB';
        ctx.measureText('\u13A0\u13A2\u13A4');
    });
</script>
</body>
</html>
