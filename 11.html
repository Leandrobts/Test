<!DOCTYPE html>
<p>This test passes if it does not crash.</p>
<script>
// 1. Esgotamento do cache de fontes para forçar o prune inline
const dummies = [];
for (let i = 0; i < 3500; i++) {
    const canvas = document.createElement('canvas');
    canvas.width = 1;
    canvas.height = 1;
    const dummy = canvas.getContext('2d');
    dummy.font = '10px "dummy' + i + '"';
    dummies.push({ canvas, dummy }); // Mantém referências vivas se necessário
}

// 2. URL de dados pesada para manter a fonte pendente
const pendingFontURL = 'url("data:font/ttf;base64,' + 'A'.repeat(1100000) + '")';

const keepAlive = [];
for (let attempt = 0; attempt < 2; attempt++) {
    // Usando a API de fontes global do documento (document.fonts) em vez de self.fonts
    const metricsDonor = new FontFace('metricsDonor' + attempt, pendingFontURL);
    const measured = new FontFace('measured' + attempt, pendingFontURL, { unicodeRange: 'U+13A0-13FF' });
    
    document.fonts.add(metricsDonor);
    document.fonts.add(measured);

    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    const context = canvas.getContext('2d');
    
    context.font = '10px metricsDonor' + attempt + ', measured' + attempt;
    keepAlive.push(metricsDonor, measured, context, canvas);

    // Dispara a medição que aciona o percurso de glifos
    context.measureText('\u13A0\u13A2\u13A4');
}

console.log('Execução concluída');
</script>
