<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>XPathResult GC Race Test - e8db86e</title>

<style>
body {
    font-family: monospace;
    background: #111;
    color: #0f0;
}

#status {
    white-space: pre-wrap;
    border: 1px solid #444;
    padding: 10px;
}

#container {
    display: none;
}
</style>
</head>

<body>

<h2>XPathResult GC Race Test</h2>

<button onclick="start()">START</button>
<button onclick="stop()">STOP</button>

<div id="status">Ready</div>
<div id="container"></div>

<script>
"use strict";

var running = false;
var iteration = 0;
var results = [];
var garbage = [];

var container = document.getElementById("container");
var status = document.getElementById("status");

function log(message) {
    status.textContent =
        "Iteration: " + iteration + "\n" +
        "Live XPathResults: " + results.length + "\n" +
        "Garbage objects: " + garbage.length + "\n\n" +
        message;
}

function buildDOM() {
    container.innerHTML = "";

    var fragment = document.createDocumentFragment();

    for (var i = 0; i < 2000; i++) {
        var div = document.createElement("div");

        div.setAttribute("data-index", i);
        div.className = (i % 2) ? "odd" : "even";

        var span = document.createElement("span");
        span.textContent = "NODE_" + i;

        div.appendChild(span);
        fragment.appendChild(div);
    }

    container.appendChild(fragment);
}

function createXPathResults() {
    for (var i = 0; i < 40; i++) {

        try {
            var result = document.evaluate(
                ".//div | .//span",
                container,
                null,
                XPathResult.UNORDERED_NODE_ITERATOR_TYPE,
                null
            );

            results.push(result);

        } catch (e) {
        }
    }
}

function accessXPathResults() {

    for (var i = 0; i < results.length; i++) {

        var result = results[i];

        if (!result)
            continue;

        try {
            result.iterateNext();
        } catch (e) {
        }

        try {
            result.iterateNext();
        } catch (e) {
        }
    }
}

function mutateDOM() {

    var nodes = container.getElementsByTagName("div");

    for (var i = nodes.length - 1; i >= 0; i -= 3) {

        try {
            nodes[i].parentNode.removeChild(nodes[i]);
        } catch (e) {
        }
    }

    for (var j = 0; j < 500; j++) {

        var node = document.createElement("div");

        node.className = "replacement";

        node.textContent =
            "REPLACEMENT_" +
            iteration +
            "_" +
            j;

        container.appendChild(node);
    }
}

function createMemoryPressure() {

    for (var i = 0; i < 200; i++) {

        garbage.push({
            a: new Array(1000).join("AAAAAAAA"),
            b: new Array(1000).join("BBBBBBBB"),
            c: iteration,
            d: i
        });
    }

    if (garbage.length > 1000)
        garbage.splice(0, 700);
}

function createAdditionalXPathPressure() {

    for (var i = 0; i < 20; i++) {

        try {

            var result = document.evaluate(
                "//*[contains(@class, 'replacement') or contains(@class, 'odd')]",
                document,
                null,
                XPathResult.ORDERED_NODE_ITERATOR_TYPE,
                null
            );

            results.push(result);

            result.iterateNext();

        } catch (e) {
        }
    }
}

function releaseSomeResults() {

    if (results.length > 100) {

        results.splice(
            0,
            Math.floor(results.length / 2)
        );
    }
}

function cycle() {

    if (!running)
        return;

    iteration++;

    try {

        buildDOM();

        createXPathResults();

        accessXPathResults();

        mutateDOM();

        createAdditionalXPathPressure();

        createMemoryPressure();

        accessXPathResults();

        releaseSomeResults();

        log("Running XPath / DOM / GC pressure cycle");

    } catch (e) {

        log(
            "JavaScript exception:\n" +
            e.name + ": " + e.message
        );
    }

    setTimeout(cycle, 0);
}

function start() {

    if (running)
        return;

    running = true;

    iteration = 0;

    results = [];
    garbage = [];

    log("Started");

    cycle();
}

function stop() {

    running = false;

    log("Stopped");
}

</script>

</body>
</html>
