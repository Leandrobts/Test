<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 Shadow Test - Variant C</title>

<style>
    #host {
        display: block;
    }

    select {
        display: block;
    }
</style>

</head>

<body>

<script>
(function () {

    function forceLayout(element)
    {
        void element.offsetWidth;
        void element.offsetHeight;
    }

    function boom()
    {
        /*
         * ETAPA 1
         *
         * Criação do host principal.
         */
        var host = document.createElement("div");

        host.id = "host";

        /*
         * Primeira árvore encapsulada.
         */
        var older = host.attachShadow({
            mode: "open"
        });

        var firstChild = document.createElement("div");

        firstChild.textContent = "";

        older.appendChild(firstChild);

        /*
         * ETAPA 2
         *
         * Attachment do host ao documento.
         */
        document.documentElement.appendChild(host);

        /*
         * ETAPA 3
         *
         * Faz o browser observar a árvore já anexada.
         */
        forceLayout(host);

        /*
         * ETAPA 4
         *
         * Segundo nível de encapsulamento.
         */
        var youngerHost = document.createElement("div");

        older.appendChild(youngerHost);

        var younger = youngerHost.attachShadow({
            mode: "open"
        });

        /*
         * ETAPA 5
         *
         * Construção do select.
         */
        var select = document.createElement("select");

        /*
         * Mantém um filho interno estruturalmente incomum.
         *
         * Não é equivalente ao antigo <shadow>,
         * mas cria uma relação de árvore interna
         * durante o attachment.
         */
        var internalNode = document.createElement("div");

        select.appendChild(internalNode);

        /*
         * Inserção do select na árvore encapsulada.
         */
        younger.appendChild(select);

        /*
         * ETAPA 6
         *
         * Primeiro layout após inserção.
         */
        forceLayout(select);

        /*
         * ETAPA 7
         *
         * Mutação após a árvore já estar anexada.
         */
        var replacement = document.createElement("div");

        select.removeChild(internalNode);

        select.appendChild(replacement);

        /*
         * ETAPA 8
         *
         * Novo ciclo de resolução.
         */
        forceLayout(host);
        forceLayout(youngerHost);
        forceLayout(select);

        /*
         * Mutação final da árvore encapsulada.
         */
        younger.removeChild(select);
        younger.appendChild(select);

        forceLayout(select);
    }

    window.onload = boom;

})();
</script>

</body>
</html>
