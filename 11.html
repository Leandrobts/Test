<!DOCTYPE html><html>
<head>
</head>
<body>
<p>This test passes if it does not crash.</p><button id="start">Start test</button>

<script>
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n - 1);
    }

    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

document.getElementById("start").onclick = function() {
    var iframe = document.body.appendChild(document.createElement("iframe"));
    var div = iframe.contentDocument.body.appendChild(document.createElement("div"));

    div.webkitRequestFullscreen().catch(function(error) {
        return;
    });

    var contentDocument = iframe.contentDocument;
    document.body.removeChild(iframe);

    setTimeout(function() {
        contentDocument.webkitCancelFullScreen();
        gc();
    }, 10);
};
</script></body>
</html>
