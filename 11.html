<!DOCTYPE html>
<html>
<body>
<p>This test passes if it does not crash.</p>

<div id="host" style="width:100px;height:100px;background:red">
    <template id="victimTemplate">
        <div id="victim" tabindex="0">Focusable</div>
    </template>
</div>

<div id="result"></div>
<div id="wrapper">
    <input id="triggerInput" type="text" tabindex="0">
</div>

<script>

function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

let host = document.getElementById('host');
let template = document.getElementById('victimTemplate');
let shadowRoot = host.attachShadow({ mode: 'open' });
shadowRoot.appendChild(template.content);
let victim = shadowRoot.getElementById('victim');
victim.focus();

async function runTest() {
    document.addEventListener('blur', () => {
        if (!victim) return;
        victim.remove();
        victim = null;
        gc();
    }, true);




const triggerInput = document.getElementById('triggerInput');
    
const wrapper = document.getElementById('wrapper');

    
// Listener de mudança e eventos de teclado inspirados no commit de FocusController
    
triggerInput.addEventListener('change', () => {
        
wrapper.innerHTML = ""; 
// Mutação estrutural durante o fluxo de foco
    
});

    
triggerInput.addEventListener('keyup', () => {
        
var e = document.createEvent("KeyboardEvent");
        

e.initKeyboardEvent('keydown', true, true, document.defaultView, 'U+0009', 0, false, false, false, false, false);
        

triggerInput.dispatchEvent(e);
    
});

    
// Força a alteração de foco global para desbancar a victim e disparar o blur
    
triggerInput.focus();
    
    
var event = document.createEvent("KeyboardEvent");
    
event.initKeyboardEvent('keydown', true, true, document.defaultView, 'U+0009', 0, false, false, false, false, false);
    
triggerInput.dispatchEvent(event);




    await new Promise((resolve) => {
        requestAnimationFrame(() => setTimeout(resolve, 0));
    });

    document.getElementById('result').textContent = 'PASS';
}

runTest();
</script>
</body>
</html>
