<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>WebKit 03ee49b - Literal Variant</title>

<style>
*:last-child,*:placeholder-shown {
    -webkit-clip-path: url(#fontFaceID);
}

*:empty {
    -webkit-border-after: #D1C78D;
}
</style>

<script>

/*
 * Logger simples.
 *
 * Não é chamado dentro das linhas críticas do testcase,
 * apenas antes do início e através do tratamento global
 * de erros.
 */

function log(message)
{
    console.log(message);

    var output = document.getElementById("log");

    if (output)
        output.textContent += message + "\n";
}


/*
 * Captura exceções não tratadas.
 *
 * Retornamos false para não suprimir o erro natural
 * do navegador.
 */

window.onerror = function(message, source, lineno, colno, error)
{
    log("");
    log("================================");
    log("UNCAUGHT EXCEPTION");
    log("================================");
    log("message: " + message);
    log("line: " + lineno);
    log("column: " + colno);

    if (error) {
        log("name: " + error.name);
        log("detail: " + error.message);
    }

    log("================================");

    return false;
};


/*
 * Substituto para GCController.collect().
 *
 * Baseado na função gc.js usada nos testes anteriores.
 */

function gc()
{
    function gcRec(n)
    {
        if (n < 1)
            return {};

        var temp = {
            i: "ab" + i + (i / 100000)
        };

        temp += "foo";

        gcRec(n - 1);
    }

    for (var i = 0; i < 10000; i++)
        gcRec(10);
}


/*
 * ==================================================
 * TESTCASE ORIGINAL
 * ==================================================
 *
 * A sequência abaixo foi mantida deliberadamente
 * próxima do commit 03ee49b.
 */

function test()
{
    var divElement = document.createElement("div");

    meterID.addEventListener(
        "DOMNodeRemoved",
        domNodeRemovedCallback
    );

    var insertedElement =
        animateTransformID.insertAdjacentElement(
            "afterbegin",
            marqueeID
        );

    var screenCTM =
        symbolID.getScreenCTM();

    svgID.outerHTML = "A";

    gc();

    document.body.innerHTML =
        'PASS if no crash.';
}


function domNodeRemovedCallback()
{
    svgID.prepend(animateMotionID);

    range =
        iframeID.contentDocument.createRange();

    range.selectNodeContents(
        animateTransformID
    );

    range.surroundContents(
        document.createElement("meter")
    );
}


/*
 * Observação assíncrona.
 *
 * Se a sequência principal completar normalmente,
 * estes callbacks demonstram que o event loop continuou.
 *
 * Se uma exceção não tratada interromper test(),
 * o navegador ainda poderá executar este timer.
 */

setTimeout(function()
{
    log("");
    log("================================");
    log("ASYNC OBSERVATION");
    log("================================");

    log(
        "typeof svgID = " +
        typeof svgID
    );

    log(
        "typeof animateMotionID = " +
        typeof animateMotionID
    );

    log(
        "document.readyState = " +
        document.readyState
    );

    log("event loop still running");

    log("================================");

}, 1000);

</script>
</head>

<body onload="test()">

<pre id="log" style="
white-space: pre-wrap;
font-family: monospace;
font-size: 14px;
padding: 10px;
border: 1px solid black;
margin-bottom: 20px;
">
LITERAL TEST READY
Waiting for body onload...
</pre>


<meter id="meterID">
    <marquee id="marqueeID">
    </marquee>
</meter>


<svg id="svgID">
    <symbol id="symbolID">
        <font-face id="fontFaceID">
            <animateTransform id="animateTransformID">
                <animateMotion id="animateMotionID">
                </animateMotion>
            </animateTransform>
        </font-face>
    </symbol>
</svg>


<iframe id="iframeID">
</iframe>

</body>
</html>
