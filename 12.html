<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 WebKit Structured Test Harness V2</title>

<style>
body {
    font-family: sans-serif;
    margin: 10px;
}

#controls {
    margin-bottom: 10px;
}

#status {
    margin: 10px 0;
    padding: 6px;
    border: 1px solid #999;
}

#testRoot {
    position: relative;
    min-height: 180px;
    padding: 8px;
    border: 1px solid #444;
    overflow: hidden;
}

.mutationA {
    position: relative;
    padding: 8px;
    margin: 3px;
    border-top: 1px solid green;
}

.mutationB {
    position: relative;
    padding: 5px;
    margin-left: 10px;
    outline: 1px dotted black;
}

.layoutNode {
    display: inline-block;
    width: 30px;
    height: 20px;
    margin: 2px;
    border: 1px solid #999;
}

#log {
    font-family: monospace;
    white-space: pre-wrap;
    border: 1px solid #444;
    padding: 8px;
    margin-top: 10px;
    max-height: 400px;
    overflow: auto;
}
</style>
</head>

<body>

<h2>PS4 WebKit Structured Test Harness V2</h2>

<div id="controls">
    <button id="runButton">Run Selected Scenario</button>
    <button id="runAllButton">Run All Scenarios</button>
    <button id="clearButton">Clear Log</button>

    <select id="scenarioSelect">
        <option value="0">Scenario 1 - DOM ? Events ? Layout</option>
        <option value="1">Scenario 2 - Canvas ? DOM ? Events</option>
        <option value="2">Scenario 3 - Events ? DOM ? Canvas</option>
        <option value="3">Scenario 4 - Layout ? DOM ? Editing</option>
        <option value="4">Scenario 5 - Canvas ? Layout ? DOM</option>
        <option value="5">Scenario 6 - Events ? Canvas ? Layout</option>
    </select>
</div>

<div id="status">Ready</div>

<div id="testRoot">
    <template id="templateNode">
        <div class="layoutNode">template</div>
    </template>

    <details id="detailsNode" open>
        <summary>Details</summary>
        Test content
    </details>

    <canvas id="mainCanvas" width="32" height="32"></canvas>
</div>

<div id="log"></div>

<script>

/* ============================================================
   CORE
   ============================================================ */

var TestState = {
    running: false,
    step: 0,
    errors: 0,

    currentModule: "",
    currentOperation: "",

    currentScenario: -1,

    sequence: [],
    sequenceIndex: 0,

    runAll: false,
    allScenarioIndex: 0
};


function log(message)
{
    TestState.step++;

    var text =
        "[" +
        ("0000" + TestState.step).slice(-4) +
        "] " +
        message;

    var element = document.getElementById("log");

    if (element)
        element.textContent += text + "\n";

    console.log(text);
}


function setStatus(text)
{
    var element = document.getElementById("status");

    if (element)
        element.textContent = text;
}


function safeCall(name, callback)
{
    TestState.currentOperation = name;

    log(
        "BEGIN | " +
        TestState.currentModule +
        " | " +
        name
    );

    try
    {
        callback();

        log(
            "OK    | " +
            TestState.currentModule +
            " | " +
            name
        );
    }
    catch (e)
    {
        TestState.errors++;

        log(
            "ERROR | " +
            TestState.currentModule +
            " | " +
            name +
            " | " +
            e.name
        );
    }
}


function beginModule(name)
{
    TestState.currentModule = name;

    log("");
    log("========================================");
    log("MODULE: " + name);
    log("========================================");
}


function delay(callback)
{
    setTimeout(callback, 100);
}


/* ============================================================
   CLEANUP
   ============================================================ */

function cleanupRoot()
{
    var root = document.getElementById("testRoot");

    var children = [];

    var i;

    for (i = 0; i < root.childNodes.length; i++)
        children.push(root.childNodes[i]);

    for (i = 0; i < children.length; i++)
    {
        var node = children[i];

        if (
            node.id !== "templateNode" &&
            node.id !== "detailsNode" &&
            node.id !== "mainCanvas"
        )
        {
            try
            {
                root.removeChild(node);
            }
            catch (e)
            {
            }
        }
    }

    var details = document.getElementById("detailsNode");

    if (details)
        details.open = true;

    var canvas = document.getElementById("mainCanvas");

    if (
        canvas &&
        !canvas.parentNode
    )
    {
        root.appendChild(canvas);
    }
}


/* ============================================================
   MODULE: DOM
   ============================================================ */

function moduleDOM(done)
{
    beginModule("DOM");

    var root = document.getElementById("testRoot");

    var container = null;

    safeCall("create-container", function()
    {
        container = document.createElement("div");

        container.className = "mutationA";
        container.id = "dynamicContainer";

        container.textContent =
            "dynamic container";

        root.appendChild(container);
    });


    safeCall("create-child", function()
    {
        var child = document.createElement("span");

        child.id = "dynamicChild";

        child.textContent =
            " child ";

        container.appendChild(child);
    });


    safeCall("insert-before", function()
    {
        var node = document.createElement("em");

        node.textContent = "before ";

        if (container.firstChild)
            container.insertBefore(
                node,
                container.firstChild
            );
    });


    safeCall("replace-child", function()
    {
        var child =
            document.getElementById(
                "dynamicChild"
            );

        if (child && child.parentNode)
        {
            var replacement =
                document.createElement("strong");

            replacement.id =
                "dynamicReplacement";

            replacement.textContent =
                "replacement";

            child.parentNode.replaceChild(
                replacement,
                child
            );
        }
    });


    safeCall("move-node", function()
    {
        var node =
            document.getElementById(
                "dynamicReplacement"
            );

        if (node)
            root.appendChild(node);
    });


    delay(done);
}


/* ============================================================
   MODULE: EVENTS
   ============================================================ */

function moduleEvents(done)
{
    beginModule("EVENTS");

    var root =
        document.getElementById(
            "testRoot"
        );

    var input = null;


    safeCall("create-input", function()
    {
        input =
            document.createElement("input");

        input.type = "text";

        input.id =
            "eventInput";

        input.value =
            "event test";

        root.appendChild(input);
    });


    safeCall("install-focus", function()
    {
        input.addEventListener(
            "focus",
            function()
            {
                log("EVENT | focus");
            },
            false
        );
    });


    safeCall("install-blur", function()
    {
        input.addEventListener(
            "blur",
            function()
            {
                log("EVENT | blur");
            },
            false
        );
    });


    safeCall("focus", function()
    {
        input.focus();
    });


    safeCall("blur", function()
    {
        input.blur();
    });


    safeCall("custom-event", function()
    {
        var event =
            document.createEvent("Event");

        event.initEvent(
            "structuredtest",
            true,
            true
        );

        input.dispatchEvent(event);
    });


    safeCall("remove-input", function()
    {
        if (
            input &&
            input.parentNode
        )
        {
            input.parentNode.removeChild(
                input
            );
        }
    });


    delay(done);
}


/* ============================================================
   MODULE: LAYOUT
   ============================================================ */

function moduleLayout(done)
{
    beginModule("LAYOUT");

    var root =
        document.getElementById(
            "testRoot"
        );

    var container = null;


    safeCall("create-layout", function()
    {
        container =
            document.createElement("div");

        container.id =
            "layoutContainer";

        root.appendChild(container);
    });


    safeCall("create-nodes", function()
    {
        var i;

        for (i = 0; i < 6; i++)
        {
            var node =
                document.createElement("div");

            node.className =
                "layoutNode";

            node.textContent =
                "N" + i;

            container.appendChild(node);
        }
    });


    safeCall("style-a", function()
    {
        container.className =
            "mutationA";

        container.style.width =
            "180px";
    });


    safeCall("layout-read-a", function()
    {
        log(
            "LAYOUT | width=" +
            container.offsetWidth +
            " height=" +
            container.offsetHeight
        );
    });


    safeCall("style-b", function()
    {
        container.className =
            "mutationB";

        container.style.padding =
            "12px";
    });


    safeCall("layout-read-b", function()
    {
        var rect =
            container.getBoundingClientRect();

        log(
            "RECT | " +
            rect.width +
            "x" +
            rect.height
        );
    });


    delay(done);
}


/* ============================================================
   MODULE: CANVAS
   ============================================================ */

function moduleCanvas(done)
{
    beginModule("CANVAS");

    var canvas =
        document.getElementById(
            "mainCanvas"
        );

    var context = null;


    safeCall("get-context", function()
    {
        context =
            canvas.getContext("2d");
    });


    safeCall("draw-a", function()
    {
        if (context)
            context.fillRect(
                0,
                0,
                16,
                16
            );
    });


    safeCall("resize", function()
    {
        canvas.width = 64;
        canvas.height = 64;
    });


    safeCall("draw-b", function()
    {
        context =
            canvas.getContext("2d");

        if (context)
            context.fillRect(
                4,
                4,
                32,
                32
            );
    });


    safeCall("toBlob", function()
    {
        if (!canvas.toBlob)
        {
            log("INFO | toBlob unavailable");
            return;
        }

        canvas.toBlob(
            function(blob)
            {
                log(
                    "CALLBACK | toBlob | " +
                    (
                        blob
                        ? "blob"
                        : "null"
                    )
                );
            }
        );
    });


    safeCall("detach", function()
    {
        if (canvas.parentNode)
            canvas.parentNode.removeChild(
                canvas
            );
    });


    safeCall("reattach", function()
    {
        document
            .getElementById("testRoot")
            .appendChild(canvas);
    });


    delay(done);
}


/* ============================================================
   MODULE: EDITING
   ============================================================ */

function moduleEditing(done)
{
    beginModule("EDITING");

    safeCall("selectAll", function()
    {
        if (document.execCommand)
        {
            document.execCommand(
                "selectAll",
                false,
                null
            );
        }
    });


    safeCall("insertText", function()
    {
        if (document.execCommand)
        {
            document.execCommand(
                "insertText",
                false,
                " "
            );
        }
    });


    safeCall("undo", function()
    {
        if (document.execCommand)
        {
            document.execCommand(
                "undo",
                false,
                null
            );
        }
    });


    safeCall("redo", function()
    {
        if (document.execCommand)
        {
            document.execCommand(
                "redo",
                false,
                null
            );
        }
    });


    delay(done);
}


/* ============================================================
   MODULE: MISC EVENTS
   ============================================================ */

function moduleMisc(done)
{
    beginModule("MISC");

    var details =
        document.getElementById(
            "detailsNode"
        );


    safeCall("install-toggle", function()
    {
        details.addEventListener(
            "toggle",
            function()
            {
                log("EVENT | toggle");
            },
            false
        );
    });


    safeCall("close-details", function()
    {
        details.open = false;
    });


    safeCall("open-details", function()
    {
        details.open = true;
    });


    safeCall("clone-template", function()
    {
        var template =
            document.getElementById(
                "templateNode"
            );

        var clone =
            template.content.cloneNode(true);

        document
            .getElementById("testRoot")
            .appendChild(clone);
    });


    delay(done);
}


/* ============================================================
   SCENARIOS
   ============================================================ */

var Scenarios = [

    {
        name:
            "DOM -> EVENTS -> LAYOUT",

        modules: [
            moduleDOM,
            moduleEvents,
            moduleLayout
        ]
    },

    {
        name:
            "CANVAS -> DOM -> EVENTS",

        modules: [
            moduleCanvas,
            moduleDOM,
            moduleEvents
        ]
    },

    {
        name:
            "EVENTS -> DOM -> CANVAS",

        modules: [
            moduleEvents,
            moduleDOM,
            moduleCanvas
        ]
    },

    {
        name:
            "LAYOUT -> DOM -> EDITING",

        modules: [
            moduleLayout,
            moduleDOM,
            moduleEditing
        ]
    },

    {
        name:
            "CANVAS -> LAYOUT -> DOM",

        modules: [
            moduleCanvas,
            moduleLayout,
            moduleDOM
        ]
    },

    {
        name:
            "EVENTS -> CANVAS -> LAYOUT",

        modules: [
            moduleEvents,
            moduleCanvas,
            moduleLayout
        ]
    }
];


/* ============================================================
   SEQUENCER
   ============================================================ */

function executeNextModule()
{
    if (
        TestState.sequenceIndex >=
        TestState.sequence.length
    )
    {
        finishScenario();
        return;
    }


    var module =
        TestState.sequence[
            TestState.sequenceIndex
        ];

    TestState.sequenceIndex++;


    module(
        function()
        {
            executeNextModule();
        }
    );
}


function startScenario(index)
{
    if (TestState.running)
    {
        log(
            "INFO | Test already running"
        );

        return;
    }


    if (
        index < 0 ||
        index >= Scenarios.length
    )
        return;


    cleanupRoot();


    TestState.running = true;

    TestState.step = 0;

    TestState.errors = 0;

    TestState.currentScenario =
        index;

    TestState.sequence =
        Scenarios[index].modules;

    TestState.sequenceIndex = 0;


    document
        .getElementById("log")
        .textContent = "";


    setStatus(
        "Running Scenario " +
        (index + 1)
    );


    log(
        "PS4 WEBKIT STRUCTURED TEST HARNESS V2"
    );

    log(
        "SCENARIO " +
        (index + 1) +
        ": " +
        Scenarios[index].name
    );

    log(
        "MODULE COUNT: " +
        TestState.sequence.length
    );


    setTimeout(
        executeNextModule,
        100
    );
}


function finishScenario()
{
    log("");

    log("========================================");

    log(
        "SCENARIO FINISHED"
    );

    log(
        "SCENARIO: " +
        (TestState.currentScenario + 1)
    );

    log(
        "LAST MODULE: " +
        TestState.currentModule
    );

    log(
        "LAST OPERATION: " +
        TestState.currentOperation
    );

    log(
        "ERROR COUNT: " +
        TestState.errors
    );

    log("========================================");


    cleanupRoot();

    TestState.running = false;


    setStatus(
        "Finished Scenario " +
        (TestState.currentScenario + 1) +
        " | Errors: " +
        TestState.errors
    );


    if (TestState.runAll)
    {
        TestState.allScenarioIndex++;

        if (
            TestState.allScenarioIndex <
            Scenarios.length
        )
        {
            setTimeout(
                function()
                {
                    startScenario(
                        TestState.allScenarioIndex
                    );
                },
                500
            );
        }
        else
        {
            TestState.runAll = false;

            log(
                "ALL SCENARIOS FINISHED"
            );

            setStatus(
                "All scenarios finished"
            );
        }
    }
}


/* ============================================================
   BUTTONS
   ============================================================ */

document
    .getElementById("runButton")
    .addEventListener(
        "click",
        function()
        {
            var select =
                document.getElementById(
                    "scenarioSelect"
                );

            TestState.runAll = false;

            startScenario(
                parseInt(
                    select.value,
                    10
                )
            );
        },
        false
    );


document
    .getElementById("runAllButton")
    .addEventListener(
        "click",
        function()
        {
            if (TestState.running)
                return;

            TestState.runAll = true;

            TestState.allScenarioIndex = 0;

            startScenario(0);
        },
        false
    );


document
    .getElementById("clearButton")
    .addEventListener(
        "click",
        function()
        {
            document
                .getElementById("log")
                .textContent = "";
        },
        false
    );


/* ============================================================
   INITIALIZATION
   ============================================================ */

log(
    "Harness V2 initialized"
);

</script>

</body>
</html>
