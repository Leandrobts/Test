<!DOCTYPE html>
<html>
<body>
<p>This test passes if it does not crash.</p>

<div id="host" style="width:100px;height:100px;background:red">
    <template id="victimTemplate">
        <div id="victim" tabindex="0">Focusable</div>
    </template>
</div>

<div id="result"></div>

<script>

function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

let host = document.getElementById('host');
let template = document.getElementById('victimTemplate');
let shadowRoot = host.attachShadow({ mode: 'open' });
shadowRoot.appendChild(template.content);
let victim = shadowRoot.getElementById('victim');
victim.focus();

async function runTest() {
    document.addEventListener('blur', () => {
        if (!victim) return;
        victim.remove();
        victim = null;
        gc();
    }, true);




// Substituição do UIHelper: 
    // Criamos um input auxiliar invisível e o focamos. 
    // Isso força o FocusController a retirar o foco da victim de forma legítima,
    // disparando o 'blur' e executando a remoção/GC com segurança.
    let dummyInput = document.createElement('input');
    dummyInput.tabIndex = 0;
    dummyInput.style.position = 'absolute';
    dummyInput.style.opacity = '0';
    document.body.appendChild(dummyInput);
    
    dummyInput.focus();



    await new Promise((resolve) => {
        requestAnimationFrame(() => setTimeout(resolve, 0));
    });

    document.getElementById('result').textContent = 'PASS';
}

runTest();
</script>
</body>
</html>
