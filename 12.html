<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Commit 633fbf1 - Opt 1 & Opt 2</title>
</head>
<body>
<p>Testes do commit 633fbf1 (sem estilo)</p>
<div>
  <button id="opt1">Opt 1: No doc in timeout</button>
  <button id="opt2">Opt 2: Multi-doc burst</button>
</div>
<pre id="out"></pre>
<script>
(function () {
  var out = document.getElementById("out");
  function log(msg) {
    out.textContent += msg + "\n";
  }

  function gc(iters, depth) {
    var count = iters || 10000;
    var maxDepth = depth || 10;
    function gcRec(n, k) {
      if (n < 1)
        return {};
      var temp = { i: "ab" + k + (k / 100000) };
      temp += "foo";
      gcRec(n - 1, k);
    }
    for (var i = 0; i < count; i++)
      gcRec(maxDepth, i);
  }

  // Opcao 1: sem usar doc dentro do setTimeout e soltando referencias apos remocao
  function runOpt1() {
    out.textContent = "";
    var iframe = document.createElement("iframe");
    document.body.appendChild(iframe);
    var doc = iframe.contentDocument;
    var div = doc && doc.body ? doc.createElement("div") : null;
    if (div && doc.body)
      doc.body.appendChild(div);

    try {
      var p = div && div.requestFullscreen ? div.requestFullscreen() : null;
      if (p && typeof p.catch === "function") {
        p.catch(function (err) {
          log("opt1 catch: " + (err && err.name ? err.name : err));
          gc(8000, 10);
          log("opt1 gc in catch done");
        });
      }
    } catch (e) {
      log("opt1 throw: " + e);
    }

    if (iframe && iframe.parentNode)
      iframe.parentNode.removeChild(iframe);

    div = null;
    doc = null;
    iframe = null;

    setTimeout(function () {
      gc(8000, 10);
      log("opt1 timeout (no doc ref) done");
    }, 0);
  }

  // Opcao 2: multiplos documentos/iframes em sequencia curta com rejeicao TypeError
  function runOpt2() {
    out.textContent = "";
    var catches = 0;

    for (var n = 0; n < 40; n++) {
      (function () {
        var iframe = document.createElement("iframe");
        document.body.appendChild(iframe);
        var doc = iframe.contentDocument;
        var div = doc && doc.body ? doc.createElement("div") : null;
        if (div && doc.body)
          doc.body.appendChild(div);

        try {
          var p = div && div.requestFullscreen ? div.requestFullscreen() : null;
          if (p && typeof p.catch === "function") {
            p.catch(function () {
              catches++;
            });
          }
        } catch (e) {}

        if (iframe && iframe.parentNode)
          iframe.parentNode.removeChild(iframe);

        div = null;
        doc = null;
        iframe = null;
      })();
    }

    gc(6000, 10);
    setTimeout(function () {
      log("opt2 done | catches: " + catches);
    }, 0);
  }

  document.getElementById("opt1").addEventListener("click", runOpt1);
  document.getElementById("opt2").addEventListener("click", runOpt2);
})();
</script>
</body>
</html>
