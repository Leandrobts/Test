<html>
<head>
<script>
function forceGC() {
    function gcRec(n) {
          if (n < 1)
              return {};
          var temp = {i: "ab" + i + (i / 100000)};
          temp += "foo";
          gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
    gcRec(10);
}
async function magic() {
  frame.remove();
  document.body.innerHTML = '<p>Select e iframe removidos sem crash.</p>';
  forceGC();
}
</script>
</head>
<body>
<p>Pressione <strong>Alt + A</strong> para acionar o access key.</p>
<p>Se o browser não crashar e aparecer mensagem verde, o bug foi corrigido.</p>
<script>
  frame = document.body.appendChild(document.createElement('iframe'));
  frame.style = 'width:100%; height:200px; border:0';

  outerContainer = frame.contentDocument.body.attachShadow({ mode: 'open' });
  outerContainer.innerHTML = `<select accesskey="a"><option>SouthSea</option></select>
<p>Made in the body</p>
<input>`;

  var input = outerContainer.querySelector('input');
  input.addEventListener('blur', magic);
  input.focus();
</script>
</body>
</html>
