    ["SVGStyleElement (svg:style)", function () {

      return typeof SVGStyleElement !== "undefined" && (el instanceof SVGStyleElement);
    }],

      var parsed = rect.getAttribute("clip-path");
      var ok = parsed === "url(#diagClipId)";
      document.body.removeChild(svg);
      return ok;
    }],
    ["window.testRunner (LayoutTest harness)", function () { return typeof window.testRunner !== "undefined"; }],
    ["window.GCController (LayoutTest harness)", function () { return typeof window.GCController !== "undefined"; }],
