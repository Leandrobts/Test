<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
window.onload = function() {
  setTimeout(function() {
    var dummies = [];
    for (var i = 0; i < 3500; i++) {
      var c = document.createElement("canvas");
      c.width = 1; c.height = 1;
      var d = c.getContext("2d");
      d.font = '10px "dummy' + i + '"';
      dummies.push(d);
    }

    for (var attempt = 0; attempt < 2; attempt++) {
      var metricsDonor = new FontFace(
        "metricsDonor" + attempt,
        "local(Helvetica), local(Arial)"
      );

      var measured = new FontFace(
        "measured" + attempt,
        'local("nonexistent")',
        { unicodeRange: "U+13A0-13FF" }
      );

      document.fonts.add(metricsDonor);
      document.fonts.add(measured);

      var canvas = document.createElement("canvas");
      canvas.width = 64;
      canvas.height = 64;
      var ctx = canvas.getContext("2d");

      ctx.font = "10px metricsDonor" + attempt + ", measured" + attempt;

      ctx.measureText("\u13A0\u13A2\u13A4");
    }
  }, 0);
};
</script>
</body>
</html>
