
<!DOCTYPE html>
<html>
<body>
<pre id="out"></pre>
<script>(function(){
var names=[
"AudioContext",
"webkitAudioContext",
"MediaStream",
"MediaStreamTrack",
"MediaStreamAudioDestinationNode",
"MediaStreamTrackProcessor",
"MediaRecorder",
"RTCPeerConnection"
];
var out=[];
for(var i=0;i<names.length;i++)
out.push(names[i]+": "+typeof window[names[i]]);
document.body.innerHTML="<pre>"+out.join("\n")+"</pre>";
})();
</script>
</body>
</html>
