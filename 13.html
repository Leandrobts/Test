<!DOCTYPE html>
<html>
<body>
<p>Este teste passa se não travar.</p>
<script>


// Adaptação para criar contextos de canvas na thread principal em vez de OffscreenCanvas dentro de um Worker
const dummies = [];
for (let i = 0; i < 3500; i++) {
    const canvas = document.createElement('canvas');
    canvas.width = 1;
    canvas.height = 1;
    const dummy = canvas.getContext('2d');
    dummy.font = '10px "dummy' + i + '"';
    dummies.push(dummy);
}

// URL de dados grande para simular o comportamento de carregamento pendente de fonte
const pendingFontURL = 'url("data:font/ttf;base64,' + 'A'.repeat(1100000) + '")';

const keepAlive = [];
for (let attempt = 0; attempt < 2; attempt++) {
    // Sem unicode-range para cobrir U+0020 (usado pela sonda da fonte primária)
    const metricsDonor = new FontFace('metricsDonor' + attempt, pendingFontURL);
    // Exclui U+0020 mas cobre o texto medido
    const measured = new FontFace('measured' + attempt, pendingFontURL, { unicodeRange: 'U+13A0-13FF' });
    
    document.fonts.add(metricsDonor);
    document.fonts.add(measured);

    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    const context = canvas.getContext('2d');
    
    context.font = '10px metricsDonor' + attempt + ', measured' + attempt;
    keepAlive.push(metricsDonor, measured, context, canvas);

    // Medição de texto que dispara o caminho de varredura de glifos no Simple Path
    context.measureText('\u13A0\u13A2\u13A4');
}

console.log('done');
</script>
</body>
</html>
