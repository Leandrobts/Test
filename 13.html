<!DOCTYPE html>
<html>
<body>
<script>
function gc() {
    function gcRec(n) {
          if (n < 1)
              return {};
          var temp = {i: "ab" + i + (i / 100000)};
          temp += "foo";
          gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
    gcRec(10);
}

function detachedShadowRootOf(markup)
{
    const outer = document.createElement('div');
    document.body.appendChild(outer);
    const outerShadow = outer.attachShadow({mode: 'open'});

    const host = document.createElement('div');
const shadow = host.attachShadow({ mode: 'open' });

const slot = document.createElement('slot');
shadow.appendChild(slot);

const lightChild = document.createElement('span');
lightChild.id = 'lightChild';

host.appendChild(lightChild);
outerShadow.appendChild(host);

// Obtém o ShadowRoot através do slot
const shadowRoot = lightChild.assignedSlot.getRootNode();

lightChild.remove();
shadowRoot.replaceChildren();

outerShadow.replaceChildren();

gc();

return shadowRoot;
}

const markup = '<div><template shadowrootmode="open"><slot></slot></template><span id="lightChild"></span></div>';

// Primeiro cenário
const removedShadowRoot = detachedShadowRootOf(markup);

const removedHost = removedShadowRoot.host;
const root = removedShadowRoot.getRootNode({ composed: true });

console.log(
    removedHost !== null
        ? "PASS: ShadowRoot.host não é null"
        : "FAIL: ShadowRoot.host é null"
);

console.log(
    root === removedHost
        ? "PASS: getRootNode corresponde ao host"
        : "FAIL: getRootNode não corresponde ao host"
);

// Segundo cenário
const shadowRootWithChild = detachedShadowRootOf(markup);

const child = document.createElement('b');
shadowRootWithChild.appendChild(child);

console.log(
    child.getRootNode({ composed: true }) === shadowRootWithChild.host
        ? "PASS: child.getRootNode corresponde ao host"
        : "FAIL: child.getRootNode não corresponde ao host"
);

gc();

console.log(
    child.getRootNode({ composed: true }) === shadowRootWithChild.host
        ? "PASS: child.getRootNode após GC"
        : "FAIL: child.getRootNode após GC"
);


</script>
</body>
</html>
