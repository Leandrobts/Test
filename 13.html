<!doctype html>
<button id="go">START</button>
<pre id="s"></pre>

<script>
go.onclick = function () {
    var x = new XMLHttpRequest();

    x.open("GET", "data:text/xml,<r><x>TEST</x></r>", true);
    x.responseType = "document";

    x.onload = function () {
        var d = x.responseXML;

        x.abort();

        d = null;

        setTimeout(function () {
            x.open("GET", "data:text/xml,<r><y>RELOAD</y></r>", true);
            x.responseType = "document";
            x.send();

            setTimeout(function () {
                s.textContent = "PASS - no crash observed";
            }, 50);
        }, 0);
    };

    x.send();
};
</script>
