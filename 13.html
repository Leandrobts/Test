<!DOCTYPE html>
<html>
<head>
<script>
// Função auxiliar de verificação para substituir o js-test.js
function shouldBeEqualToString(actualEval, expected) {
    let actual = eval(actualEval);
    if (actual === expected) {
        console.log("PASS: " + actualEval + " is " + expected);
    } else {
        console.error("FAIL: " + actualEval + " should be " + expected + " but was " + actual);
    }
}

function testPassed(msg) {
    console.log("PASS: " + msg);
}
</script>
</head>
<body>

<input id="input" type="date">

<script>
console.log("Test that changing the input type during an input event does not crash.");

let input = document.getElementById('input');

// O evento de input dispara a mudança de tipo, o que antes causava o use-after-free
input.addEventListener("input", () => {
    input.type = "text";
});

window.addEventListener("load", async () => {
    input.focus();

    // Como simular digitação exata de teclas de data em Shadow DOM depende do motor interno,
    // disparamos o fluxo alterando o valor e gerando o evento de input que aciona a troca de tipo.
    input.value = "2012-09-02";
    input.dispatchEvent(new Event('input', { bubbles: true }));

    shouldBeEqualToString("input.type", "text");

    testPassed("Did not crash.");
});
</script>
</body>
</html>
