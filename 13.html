<!DOCTYPE html>
<html>
<body>
<p>This test passes if it does not crash.</p>
<button id="startButton">Iniciar Teste</button>
<div id="host"></div>
<div id="result"></div>
<script>
// --- Função GC integrada ---
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);  
}

let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable';
shadowRoot.appendChild(victim);
victim.focus();

async function runTest() {    
    document.addEventListener('blur', () => {
        victim.remove();
        victim = null;
        gc();
    }, true);

    if (victim) {
        victim.focus();
        
        setTimeout(() => {
            if (victim) {
                victim.dispatchEvent(new KeyboardEvent('keydown', {
                    bubbles: true,
                    cancelable: true,
                    view: window,
                    key: 'Tab',
                    code: 'Tab',
                    keyCode: 9
                }));
            }
        }, 50);
    }

    result.textContent = 'PASS';    
}    

// Vincula a execução ao clique do botão para fornecer o gesto do usuário
document.getElementById('startButton').addEventListener('click', () => {
    runTest();
});

</script>
</body>
</html>
