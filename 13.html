<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 Fullscreen Diag</title>
</head>
<body>
<button id="btn">Run Diag</button>
<pre id="out"></pre>
<script>
(function () {
  var out = document.getElementById("out");
  function log(msg) {
    out.textContent += msg + "\n";
  }

  function probe() {
    out.textContent = "";
    var iframe = document.createElement("iframe");
    document.body.appendChild(iframe);
    var doc = iframe.contentDocument;
    var div = doc && doc.body ? doc.createElement("div") : null;
    if (div && doc.body) {
      doc.body.appendChild(div);
    }

    log("document.createElement: " + (typeof document.createElement === "function"));
    log("iframe.contentDocument: " + (!!doc));
    log("div.requestFullscreen: " + (div ? typeof div.requestFullscreen : "n/a"));
    log("div.webkitRequestFullscreen: " + (div ? typeof div.webkitRequestFullscreen : "n/a"));
    log("doc.exitFullscreen: " + (doc ? typeof doc.exitFullscreen : "n/a"));
    log("doc.webkitExitFullscreen: " + (doc ? typeof doc.webkitExitFullscreen : "n/a"));
    log("doc.webkitCancelFullScreen: " + (doc ? typeof doc.webkitCancelFullScreen : "n/a"));
    log("doc.fullscreenEnabled: " + (doc ? doc.fullscreenEnabled : "n/a"));
    log("doc.webkitFullscreenEnabled: " + (doc ? doc.webkitFullscreenEnabled : "n/a"));
    log("Promise: " + (typeof Promise === "function"));
    log("setTimeout: " + (typeof setTimeout === "function"));
    log("onfullscreenchange in doc: " + (doc ? ("onfullscreenchange" in doc) : "n/a"));
    log("onwebkitfullscreenchange in doc: " + (doc ? ("onwebkitfullscreenchange" in doc) : "n/a"));
    log("onfullscreenerror in doc: " + (doc ? ("onfullscreenerror" in doc) : "n/a"));
    log("onwebkitfullscreenerror in doc: " + (doc ? ("onwebkitfullscreenerror" in doc) : "n/a"));

    if (div && typeof div.requestFullscreen === "function") {
      try {
        var ret = div.requestFullscreen();
        log("requestFullscreen() return: " + (ret && typeof ret.then === "function" ? "Thenable/Promise" : typeof ret));
        if (ret && typeof ret.catch === "function") {
          ret.catch(function (err) {
            log("requestFullscreen().catch fired: " + (err && err.name ? err.name : String(err)));
          });
        }
      } catch (e) {
        log("requestFullscreen() threw: " + e);
      }
    } else if (div && typeof div.webkitRequestFullscreen === "function") {
      try {
        var wret = div.webkitRequestFullscreen();
        log("webkitRequestFullscreen() return: " + (wret && typeof wret.then === "function" ? "Thenable/Promise" : typeof wret));
      } catch (e2) {
        log("webkitRequestFullscreen() threw: " + e2);
      }
    }

    if (iframe && iframe.parentNode) {
      iframe.parentNode.removeChild(iframe);
      log("removed iframe; doc still truthy: " + (!!doc));
    }

    if (doc && typeof doc.webkitCancelFullScreen === "function") {
      setTimeout(function () {
        try {
          doc.webkitCancelFullScreen();
          log("webkitCancelFullScreen() called after removal");
        } catch (e3) {
          log("webkitCancelFullScreen() threw: " + e3);
        }
      }, 0);
    }
  }

  document.getElementById("btn").addEventListener("click", probe);
})();
</script>
</body>
</html>
