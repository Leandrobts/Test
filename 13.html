<!DOCTYPE html>
<html>
<body>

<script>

(async () => {
    if (typeof ClipboardItem === "undefined") {
        document.body.innerHTML = "<p>ClipboardItem is not supported.</p>";
        return;
    }

    if (!navigator.clipboard || !navigator.clipboard.write) {
        document.body.innerHTML = "<p>Async Clipboard API is not supported.</p>";
        return;
    }

    const item = new ClipboardItem({
        "text/plain": new Promise(() => {}),
        "text/html": Promise.resolve("x"),
        "text/uri-list": Promise.resolve("http://a/")
    });

    navigator.clipboard.write([item]).catch(() => {});

    await 0;

    navigator.clipboard.write([item]).catch(() => {});

    document.body.innerHTML = '<p>This test passes if WebKit does not hit assertions or crash.</p><p>PASS</p>';
})();

</script>

</body>
</html>
