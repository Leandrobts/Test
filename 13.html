<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PS4 WebKit — Surface Diagnostic</title>
<style>
:root {
  --bg:       #0a0c10;
  --bg2:      #111520;
  --bg3:      #181d2a;
  --border:   #1e2535;
  --txt:      #c8d0e0;
  --dim:      #5a647a;
  --ok:       #3ecf6a;
  --warn:     #e8b84b;
  --err:      #e05555;
  --info:     #4fa3e8;
  --purple:   #9b78e8;
  --mono:     'Courier New', Courier, monospace;
  font-size:  16px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--txt);
  font-family: var(--mono);
  min-height: 100vh;
  padding: 24px;
}
header {
  border-bottom: 1px solid var(--border);
  padding-bottom: 16px;
  margin-bottom: 24px;
}
header h1 {
  font-size: 1.1rem;
  letter-spacing: .15em;
  color: var(--info);
}
header p  { color: var(--dim); font-size: .8rem; margin-top: 4px; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(560px, 1fr));
  gap: 16px;
}
.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
}
.card-title {
  background: var(--bg3);
  border-bottom: 1px solid var(--border);
  padding: 8px 14px;
  font-size: .75rem;
  letter-spacing: .12em;
  color: var(--dim);
}
.card-title span { color: var(--info); }
.rows { padding: 10px 14px; }
.row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 5px 0;
  border-bottom: 1px solid #12161f;
  font-size: .78rem;
  line-height: 1.4;
}
.row:last-child { border-bottom: none; }
.badge {
  flex-shrink: 0;
  width: 56px;
  text-align: center;
  padding: 1px 4px;
  border-radius: 2px;
  font-size: .68rem;
  font-weight: bold;
  letter-spacing: .06em;
}
.badge.ok   { background: #0d2e1a; color: var(--ok);   border: 1px solid #1a5030; }
.badge.err  { background: #2a0d0d; color: var(--err);  border: 1px solid #5a1515; }
.badge.warn { background: #2a1f06; color: var(--warn); border: 1px solid #5a3f10; }
.badge.info { background: #0d1e2e; color: var(--info); border: 1px solid #1a3f60; }
.label { color: var(--txt); flex: 1; word-break: break-all; }
.value { color: var(--dim); font-size: .72rem; word-break: break-all; }

/* deep inspection */
.proto-list {
  padding: 10px 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.proto-item {
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--purple);
  font-size: .68rem;
  padding: 2px 7px;
  border-radius: 2px;
}

/* log */
#log-card { grid-column: 1 / -1; }
#log-box {
  font-size: .72rem;
  color: var(--dim);
  padding: 10px 14px;
  max-height: 260px;
  overflow-y: auto;
  line-height: 1.6;
}
#log-box .l-ok   { color: var(--ok); }
#log-box .l-err  { color: var(--err); }
#log-box .l-warn { color: var(--warn); }
#log-box .l-info { color: var(--info); }

/* export */
#export-card { grid-column: 1 / -1; }
#json-out {
  font-size: .68rem;
  padding: 12px 14px;
  white-space: pre;
  overflow-x: auto;
  color: var(--dim);
  max-height: 320px;
  overflow-y: auto;
}
button {
  margin: 10px 14px;
  padding: 8px 18px;
  background: var(--bg3);
  color: var(--info);
  border: 1px solid var(--info);
  font-family: var(--mono);
  font-size: .78rem;
  cursor: pointer;
  border-radius: 2px;
}
button:focus { outline: 2px solid var(--info); }

#status-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--bg3);
  border-top: 1px solid var(--border);
  padding: 6px 24px;
  font-size: .72rem;
  color: var(--dim);
  display: flex;
  justify-content: space-between;
}
#status-bar span { color: var(--ok); }
</style>
</head>
<body>

<header>
  <h1>PS4 WebKit — Attack Surface Diagnostic</h1>
  <p id="run-ts">Running…</p>
</header>

<div class="grid" id="grid"></div>

<div id="status-bar">
  <div>PS4 WebKit Surface Probe v1.0</div>
  <div id="summary-bar">—</div>
</div>

<script>
(function() {
"use strict";

/* ───── utility ─────────────────────────────────────────────────── */
var report = { env:{}, apis:{}, rtc_deep:{}, ps4:{}, internals:{}, observers:{} };
var logLines = [];
var ok=0, missing=0, partial=0;

function exists(obj, path) {
  try {
    var parts = path.split('.');
    var cur = obj;
    for (var i=0; i<parts.length; i++) {
      if (cur == null || typeof cur[parts[i]] === 'undefined') return false;
      cur = cur[parts[i]];
    }
    return true;
  } catch(e) { return false; }
}

function tryGet(fn) {
  try { return fn(); } catch(e) { return '[ERR: '+e.message+']'; }
}

function log(cls, msg) {
  logLines.push('<span class="l-'+cls+'">'+msg+'</span>');
}

/* ───── card builder ─────────────────────────────────────────────── */
function card(title, rows) {
  var d = document.createElement('div');
  d.className = 'card';
  var t = document.createElement('div');
  t.className = 'card-title';
  t.innerHTML = title;
  d.appendChild(t);
  var r = document.createElement('div');
  r.className = 'rows';
  rows.forEach(function(row) {
    var el = document.createElement('div');
    el.className = 'row';
    el.innerHTML =
      '<span class="badge '+row.cls+'">'+row.badge+'</span>' +
      '<span class="label">'+row.label+'</span>' +
      (row.value ? '<span class="value">'+row.value+'</span>' : '');
    r.appendChild(el);
  });
  d.appendChild(r);
  return d;
}

function protoCard(title, items) {
  var d = document.createElement('div');
  d.className = 'card';
  var t = document.createElement('div');
  t.className = 'card-title';
  t.innerHTML = title;
  d.appendChild(t);
  var list = document.createElement('div');
  list.className = 'proto-list';
  items.forEach(function(m) {
    var s = document.createElement('span');
    s.className = 'proto-item';
    s.textContent = m;
    list.appendChild(s);
  });
  d.appendChild(list);
  return d;
}

function logCard() {
  var d = document.createElement('div');
  d.className = 'card'; d.id = 'log-card';
  var t = document.createElement('div');
  t.className = 'card-title';
  t.innerHTML = '<span>RUNTIME LOG</span>';
  d.appendChild(t);
  var b = document.createElement('div');
  b.id = 'log-box';
  b.innerHTML = logLines.join('<br>');
  d.appendChild(b);
  return d;
}

function exportCard(json) {
  var d = document.createElement('div');
  d.className = 'card'; d.id = 'export-card';
  var t = document.createElement('div');
  t.className = 'card-title';
  t.innerHTML = '<span>EXPORT</span> — full JSON report';
  d.appendChild(t);
  var btn = document.createElement('button');
  btn.textContent = 'Select All (then Ctrl+C)';
  btn.onclick = function() { pre.select && pre.select(); };
  d.appendChild(btn);
  var pre = document.createElement('pre');
  pre.id = 'json-out';
  try { pre.textContent = JSON.stringify(json, null, 2); }
  catch(e) { pre.textContent = '[serialization error]'; }
  d.appendChild(pre);
  return d;
}

/* ───── 1 · ENVIRONMENT ─────────────────────────────────────────── */
function probeEnv() {
  var rows = [];
  function envRow(label, fn) {
    var v = tryGet(fn);
    rows.push({ cls:'info', badge:'INFO', label: label, value: v });
    report.env[label] = v;
  }
  envRow('userAgent',    function(){ return navigator.userAgent; });
  envRow('platform',     function(){ return navigator.platform; });
  envRow('vendor',       function(){ return navigator.vendor; });
  envRow('language',     function(){ return navigator.language; });
  envRow('cookieEnabled',function(){ return String(navigator.cookieEnabled); });
  envRow('screen',       function(){ return screen.width+'×'+screen.height+' depth:'+screen.colorDepth; });
  envRow('window',       function(){ return window.innerWidth+'×'+window.innerHeight; });
  envRow('WebKit ver',   function(){
    var m = navigator.userAgent.match(/AppleWebKit\/([\d.]+)/);
    return m ? m[1] : '?';
  });
  return card('<span>ENVIRONMENT</span>', rows);
}

/* ───── 2 · MEDIA APIS ──────────────────────────────────────────── */
var MEDIA_APIS = [
  'MediaStream', 'webkitMediaStream',
  'AudioContext', 'webkitAudioContext',
  'MediaStreamTrack', 'MediaStreamEvent',
  'MediaStreamAudioDestinationNode',
  'MediaStreamAudioSourceNode',
  'AudioDestinationNode',
  'navigator.getUserMedia',
  'navigator.webkitGetUserMedia',
  'navigator.mozGetUserMedia',
  'navigator.mediaDevices',
  'navigator.mediaDevices.getUserMedia',
  'MediaRecorder', 'webkitMediaRecorder',
  'MediaSource', 'webkitMediaSource',
];

function probeMedia() {
  var rows = [];
  MEDIA_APIS.forEach(function(api) {
    var base = api.startsWith('navigator.') ? navigator : window;
    var path = api.startsWith('navigator.') ? api.slice(10) : api;
    var found = exists(base, path);
    if (found) ok++; else missing++;
    rows.push({
      cls: found ? 'ok' : 'err',
      badge: found ? '✓ YES' : '✗ NO',
      label: api
    });
    report.apis[api] = found;
    log(found ? 'ok' : 'err', api + ' → ' + (found ? 'PRESENT' : 'absent'));
  });
  return card('<span>MEDIA APIS</span>', rows);
}

/* ───── 3 · WEBRTC STACK ────────────────────────────────────────── */
var RTC_APIS = [
  'RTCPeerConnection', 'webkitRTCPeerConnection', 'mozRTCPeerConnection',
  'RTCSessionDescription', 'webkitRTCSessionDescription',
  'RTCIceCandidate', 'webkitRTCIceCandidate',
  'RTCDataChannel',
  'RTCDataChannelEvent',
  'RTCIceCandidateEvent',
  'RTCDTMFSender',
  'RTCStatsResponse',
  'MediaStreamEvent',
];

function probeRTC() {
  var rows = [];
  RTC_APIS.forEach(function(api) {
    var found = exists(window, api);
    if (found) ok++; else missing++;
    rows.push({
      cls: found ? 'ok' : 'err',
      badge: found ? '✓ YES' : '✗ NO',
      label: api
    });
    report.apis[api] = found;
    log(found ? 'ok' : 'err', api + ' → ' + (found ? 'PRESENT' : 'absent'));
  });
  return card('<span>WEBRTC STACK</span>', rows);
}

/* ───── 4 · RTCPeerConnection DEEP INSPECTION ───────────────────── */
var RTC_METHODS = [
  'createOffer','createAnswer',
  'setLocalDescription','setRemoteDescription',
  'addIceCandidate','addStream','removeStream',
  'getLocalStreams','getRemoteStreams',
  'getStats','createDataChannel',
  'close','getConfiguration',
  'createDTMFSender',
  'addTrack','removeTrack','getSenders','getReceivers', // newer API
];

var RTC_EVENTS = [
  'onnegotiationneeded','onicecandidate','oniceconnectionstatechange',
  'onsignalingstatechange','onaddstream','onremovestream',
  'ondatachannel','onidentityresult',
];

function probeRTCDeep() {
  var cards = [];
  var Ctor = window.RTCPeerConnection || window.webkitRTCPeerConnection;
  if (!Ctor) {
    cards.push(card('<span>RTC DEEP INSPECTION</span> — not available', [{
      cls:'err', badge:'SKIP', label:'No RTCPeerConnection constructor found'
    }]));
    return cards;
  }

  /* prototype methods */
  var proto = Ctor.prototype;
  var presentMethods = [], missingMethods = [];
  RTC_METHODS.forEach(function(m) {
    if (typeof proto[m] === 'function') presentMethods.push(m);
    else missingMethods.push('('+m+')');
  });
  report.rtc_deep.proto_methods = presentMethods;
  report.rtc_deep.missing_methods = missingMethods;
  cards.push(protoCard('<span>RTC PROTOTYPE</span> — available methods', presentMethods));
  if (missingMethods.length)
    cards.push(protoCard('<span>RTC PROTOTYPE</span> — absent methods', missingMethods));

  /* try to instantiate */
  var rows = [];
  var instance = null;
  try {
    instance = new Ctor({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    rows.push({ cls:'ok', badge:'✓ OK', label:'new RTCPeerConnection({iceServers}) — succeeded' });
    report.rtc_deep.instantiation = 'success';
    log('ok', 'RTCPeerConnection instantiated successfully');
  } catch(e) {
    rows.push({ cls:'err', badge:'✗ ERR', label:'new RTCPeerConnection failed', value: e.message });
    report.rtc_deep.instantiation = 'failed: '+e.message;
    log('err', 'RTCPeerConnection instantiation failed: '+e.message);
  }

  if (instance) {
    /* signalingState */
    var ss = tryGet(function(){ return instance.signalingState; });
    rows.push({ cls:'info', badge:'INFO', label:'signalingState', value: ss });
    report.rtc_deep.signalingState = ss;

    /* iceConnectionState */
    var ics = tryGet(function(){ return instance.iceConnectionState; });
    rows.push({ cls:'info', badge:'INFO', label:'iceConnectionState', value: ics });

    /* check event handler properties */
    RTC_EVENTS.forEach(function(ev) {
      var has = (ev in instance);
      rows.push({
        cls: has ? 'ok' : 'warn',
        badge: has ? '✓ YES' : '~ NO',
        label: 'instance.'+ev
      });
      report.rtc_deep['event_'+ev] = has;
    });

    /* check addStream API */
    if (typeof instance.addStream === 'function') {
      rows.push({ cls:'ok', badge:'KEY', label:'addStream() — legacy WebRTC path confirmed' });
      log('ok', 'RTCPeerConnection.addStream() is present — legacy path CONFIRMED');
    }

    /* check createDataChannel */
    if (typeof instance.createDataChannel === 'function') {
      try {
        var dc = instance.createDataChannel('test', {ordered: true});
        rows.push({ cls:'ok', badge:'✓ OK', label:'createDataChannel() — succeeded', value: 'label:'+dc.label+' state:'+dc.readyState });
        report.rtc_deep.dataChannel = 'created: '+dc.label;
        log('ok', 'RTCDataChannel created: label='+dc.label+' state='+dc.readyState);
        dc.close();
      } catch(e) {
        rows.push({ cls:'warn', badge:'~ERR', label:'createDataChannel() — threw', value: e.message });
        log('warn', 'createDataChannel threw: '+e.message);
      }
    }

    try { instance.close(); } catch(e) {}
  }

  cards.push(card('<span>RTC INSTANTIATION</span>', rows));
  return cards;
}

/* ───── 5 · OBSERVER / SOURCE PATH ─────────────────────────────── */
function probeObserverPath() {
  var rows = [];
  /* Can we build the MediaStreamTrack → RealtimeMediaSource path? */
  var checks = [
    ['MediaStreamTrack constructor',  function(){ return typeof window.MediaStreamTrack; }],
    ['MediaStreamTrack.prototype',    function(){ return typeof MediaStreamTrack.prototype; }],
    ['MediaStreamTrack stop()',       function(){ return typeof MediaStreamTrack.prototype.stop; }],
    ['MediaStreamTrack getCapabilities()', function(){ return typeof MediaStreamTrack.prototype.getCapabilities; }],
    ['MediaStreamTrack getSources()', function(){ return typeof MediaStreamTrack.getSources; }],
    ['MediaStream constructor',       function(){ var C=window.MediaStream||window.webkitMediaStream; return C?typeof C:'undefined'; }],
    ['MediaStream.prototype.addTrack',function(){ var C=window.MediaStream||window.webkitMediaStream; return C&&C.prototype?typeof C.prototype.addTrack:'n/a'; }],
  ];
  checks.forEach(function(c) {
    var v = tryGet(c[1]);
    var present = (v !== 'undefined' && v !== 'n/a' && !v.startsWith('[ERR'));
    rows.push({ cls: present?'ok':'err', badge: present?'✓ YES':'✗ NO', label: c[0], value: v });
    report.observers[c[0]] = v;
  });
  return card('<span>OBSERVER / SOURCE PATH</span>', rows);
}

/* ───── 6 · PLAYSTATION-SPECIFIC APIS ──────────────────────────── */
var SCE_PREFIXES = [
  'sce','sceNp','sceSystemService','SceSystemService',
  'sceNpProfiles','SceNpProfiles','PlayStation','playStation',
  'SceCloudStorage','sceCommonDialog','SceCommonDialog',
  'SceInAppPurchase','SceMsgDialog','SceErrorDialog',
  'SceWebBrowserContext','SceNpTrophy','SceTrophy',
  'SceKernelSystemInfo','SceKernelMemInfo','SceDbg',
  'SceNet','ScePad','sceAudioOut','SceAudioOut',
];

function probePS4() {
  var rows = [];
  SCE_PREFIXES.forEach(function(k) {
    var found = exists(window, k);
    if (found) {
      ok++;
      var t = tryGet(function(){ return typeof window[k]; });
      rows.push({ cls:'ok', badge:'SCE', label: 'window.'+k, value: t });
      report.ps4[k] = t;
      log('warn', 'PS4-specific global found: window.'+k+' ('+t+')');
    }
  });
  /* enumerate any sce/ps prefixed window props */
  var custom = [];
  try {
    for (var key in window) {
      var kl = key.toLowerCase();
      if ((kl.startsWith('sce') || kl.startsWith('ps4') || kl.startsWith('playstation') || kl.startsWith('orbis')) &&
          !report.ps4[key]) {
        custom.push(key);
        report.ps4['_enum_'+key] = typeof window[key];
      }
    }
  } catch(e) {}
  if (custom.length) {
    rows.push({ cls:'warn', badge:'ENUM', label:'Additional SCE/PS globals found:', value: custom.join(', ') });
  }
  if (rows.length === 0) {
    rows.push({ cls:'err', badge:'NONE', label:'No PlayStation-specific globals detected' });
    report.ps4._found = false;
  }
  return card('<span>PLAYSTATION APIS</span>', rows);
}

/* ───── 7 · WEBKIT INTERNALS ────────────────────────────────────── */
var INTERNAL_APIS = [
  'internals', 'testRunner', 'GCController', 'eventSender',
  'layoutTestController', 'UIHelper', 'TextInputController',
  'window.crypto.subtle', 'crypto',
  'indexedDB', 'webkitIndexedDB',
  'Worker', 'SharedWorker',
  'WebSocket',
  'XSLTProcessor',
  'openDatabase',
];

function probeInternals() {
  var rows = [];
  INTERNAL_APIS.forEach(function(api) {
    var found = exists(window, api.startsWith('window.') ? api.slice(7) : api);
    if (found) {
      rows.push({ cls: api.startsWith('internals')||api==='testRunner'||api==='GCController'?'warn':'ok',
                  badge: api==='internals'?'‼ INT':'✓ YES',
                  label: api });
      report.internals[api] = true;
      if (api==='internals') log('warn','window.internals FOUND — test harness active!');
    } else {
      rows.push({ cls:'err', badge:'✗ NO', label: api });
      report.internals[api] = false;
    }
  });
  return card('<span>WEBKIT INTERNALS / MISC</span>', rows);
}

/* ───── 8 · STORAGE & IPC PATHS ────────────────────────────────── */
function probeStorage() {
  var rows = [];
  var checks = [
    ['localStorage',      function(){ localStorage.setItem('_t','1'); localStorage.removeItem('_t'); return 'rw OK'; }],
    ['sessionStorage',    function(){ sessionStorage.setItem('_t','1'); sessionStorage.removeItem('_t'); return 'rw OK'; }],
    ['IndexedDB',         function(){ return typeof (window.indexedDB||window.webkitIndexedDB); }],
    ['Blob',              function(){ var b=new Blob(['x'],{type:'text/plain'}); return 'size:'+b.size; }],
    ['URL.createObjectURL', function(){ return typeof URL.createObjectURL; }],
    ['File',              function(){ return typeof window.File; }],
    ['FileReader',        function(){ return typeof window.FileReader; }],
    ['XHR async',         function(){ return typeof XMLHttpRequest; }],
    ['fetch',             function(){ return typeof window.fetch; }],
    ['WebSocket',         function(){ return typeof window.WebSocket; }],
    ['SharedWorker',      function(){ return typeof window.SharedWorker; }],
    ['Worker',            function(){ return typeof window.Worker; }],
  ];
  checks.forEach(function(c) {
    var v = tryGet(c[1]);
    var bad = (v.startsWith('[ERR') || v==='undefined');
    rows.push({ cls: bad?'err':'ok', badge: bad?'✗ NO':'✓ YES', label: c[0], value: v });
    report.env['storage_'+c[0]] = v;
  });
  return card('<span>STORAGE / IPC PATHS</span>', rows);
}

/* ───── 9 · COMPILE FLAGS INFERENCE ─────────────────────────────── */
function inferFlags() {
  var rows = [];
  var flags = {
    'ENABLE(MEDIA_STREAM)':  !!(window.RTCPeerConnection||window.webkitRTCPeerConnection||window.MediaStream||window.webkitMediaStream),
    'ENABLE(WEB_AUDIO)':     !!(window.AudioContext||window.webkitAudioContext),
    'ENABLE(WEB_RTC)':       !!(window.RTCPeerConnection||window.webkitRTCPeerConnection),
    'ENABLE(MEDIA_RECORDER)':!!(window.MediaRecorder||window.webkitMediaRecorder),
    'ENABLE(INDEXED_DATABASE)': !!(window.indexedDB||window.webkitIndexedDB),
    'ENABLE(WORKERS)':       !!(window.Worker),
    'ENABLE(SHARED_WORKERS)':!!(window.SharedWorker),
    'ENABLE(WEB_SOCKETS)':   !!(window.WebSocket),
    'ENABLE(FILE_API)':      !!(window.File&&window.FileReader&&window.Blob),
    'ENABLE(XSLT)':          !!(window.XSLTProcessor),
    'ENABLE(SUBTLE_CRYPTO)': !!(window.crypto&&window.crypto.subtle),
  };
  Object.keys(flags).forEach(function(f) {
    var v = flags[f];
    rows.push({ cls: v?'ok':'warn', badge: v?'ON':'OFF', label: f });
    report.env[f] = v;
  });
  return card('<span>COMPILE FLAG INFERENCE</span>', rows);
}

/* ───── ASSEMBLE ─────────────────────────────────────────────────── */
var grid = document.getElementById('grid');
grid.appendChild(probeEnv());
grid.appendChild(probeMedia());
grid.appendChild(probeRTC());
probeRTCDeep().forEach(function(c){ grid.appendChild(c); });
grid.appendChild(probeObserverPath());
grid.appendChild(probePS4());
grid.appendChild(probeInternals());
grid.appendChild(probeStorage());
grid.appendChild(inferFlags());
grid.appendChild(logCard());
grid.appendChild(exportCard(report));

/* footer */
document.getElementById('run-ts').textContent =
  'Completed at ' + new Date().toISOString();
document.getElementById('summary-bar').innerHTML =
  'Present: <span>'+ok+'</span>  Missing: '+missing+'  Partial: '+partial;

})();
</script>
</body>
</html>
