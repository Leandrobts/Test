<!DOCTYPE html>
<html>
<body>
<p>This test passes if it does not crash.</p>
<button id="start">START TEST</button>

<div id="log">Waiting for user gesture...</div>

<script>

function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = {
            i: "ab" + i + (i / 100000)
        };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

var logElement = document.getElementById("log");

function log(message) {
    logElement.textContent += "\n" + message;

    if (window.console && console.log)
        console.log(message);
}

document.getElementById("start").addEventListener("click", function() {

    log("STEP 1: User gesture received");

    const iframe = document.body.appendChild(
        document.createElement("iframe")
    );

    log("STEP 2: iframe created");

    const div = iframe.contentDocument.body.appendChild(
        document.createElement("div")
    );

    log("STEP 3: div created inside iframe");


    log("STEP 4: Calling div.webkitRequestFullscreen()");

    try {

        div.webkitRequestFullscreen();

        log("STEP 5: webkitRequestFullscreen() returned");

    } catch (error) {

        log("EXCEPTION: " + error);

    }


    const contentDocument = iframe.contentDocument;

    log("STEP 6: Saved iframe.contentDocument");



    document.body.removeChild(iframe);

    log("STEP 7: iframe removed from document");



    setTimeout(function() {

        log("STEP 8: setTimeout entered");

        try {

            log("STEP 9: Calling contentDocument.webkitCancelFullScreen()");

            contentDocument.webkitCancelFullScreen();

            log("STEP 10: webkitCancelFullScreen() returned");

        } catch (error) {

            log("Cancel exception: " + error);

        }


        log("STEP 11: Starting GC pressure");

        gc();

        log("STEP 12: GC pressure completed");

        log("END OF TEST");

    }, 0);

});

</script>

</body>
</html>
