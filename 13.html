```html
<!DOCTYPE html>
<html>
<body>

<p>This test passes if it does not crash.</p>
<div id="host"></div>
<div id="result"></div>

<script>

let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable';
shadowRoot.appendChild(victim);
victim.focus();

function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

async function runTest() {

    /*
     * Confirm that the intended element is actually focused
     * inside the ShadowRoot.
     */
    if (document.activeElement !== host ||
        host.shadowRoot.activeElement !== victim) {
        result.textContent = 'FAIL: victim is not focused';
        return;
    }

    /*
     * This Promise represents the external focus transition.
     * On the PS4, press the physical PS button to leave the
     * browser. The Promise is resolved by the blur handler.
     */
    let resolveBlur;

    const blurPromise = new Promise((resolve) => {
        resolveBlur = resolve;
    });

    /*
     * Same capturing blur listener as the original test.
     *
     * The critical mutation remains inside the blur event:
     * remove the currently focused victim, clear the JS
     * reference, then force garbage collection.
     */
    document.addEventListener('blur', () => {
        victim.remove();
        victim = null;
        gc();
        resolveBlur();
    }, true);

    result.textContent =
        '[Ready] victim focused — press PS to leave browser';

    /*
     * Equivalent synchronization point for the external
     * focus transition. Unlike the LayoutTest, there is no
     * UIHelper.setWindowIsKey(false) available here.
     */
    await blurPromise;

    /*
     * Preserve the asynchronous tail of the original test.
     */
    await new Promise((resolve) => {
        requestAnimationFrame(() => setTimeout(resolve, 0));
    });

    result.textContent = 'PASS';
}

runTest();

</script>
</body>
</html>
