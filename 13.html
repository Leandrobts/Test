<!DOCTYPE html>
<html>
<body>
<p>This test passes if it does not crash.</p>
<div id="host"></div>
<div id="result"></div>

<!-- Elementos necessários para o teste baseado no commit -->
<div id="initial" tabindex="0">initial</div>
<div id="target" tabindex="0">target</div>
<iframe id="iframe"></iframe>

<script>
// --- Função GC integrada ---
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);  
}

// Configuração do Shadow DOM e da vítima original
let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable';
shadowRoot.appendChild(victim);
victim.focus();

async function runTest() {   
    const initial = document.getElementById('initial');
    const target = document.getElementById('target');
    const iframe = document.getElementById('iframe');

    // Listener principal da vítima do Shadow DOM (onde ocorre a remoção e o GC)
    victim.addEventListener('blur', () => {
        victim.remove();
        victim = null;
        gc();
    }, true);

    // Listener complementar simulando a movimentação de documento durante o blur
    initial.addEventListener("blur", () => {
        if (iframe && iframe.contentDocument) {
            iframe.contentDocument.body.appendChild(target);
        }
    });

    // Sequência de foco para forçar a alternância e disparar os eventos
    initial.focus();
    target.focus();
    
    // Remove o iframe abruptamente para simular a quebra de contexto
    iframe.remove();

    await new Promise((resolve) => {
        requestAnimationFrame(() => setTimeout(resolve, 0));
    });

    result.textContent = 'PASS';    
}    

runTest();
</script>
</body>
</html>
