<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Teste de Regressão: Descarte de Frame durante DisplayLink/Scroll Timer</title>
</head>
<body>
<div id="status">Executando teste...</div>

<script>
// Função utilitária de GC via alocação recursiva de memória
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 1000; i++)
        gcRec(10);
}

function runRaceTest() {
    let iteration = 0;
    const maxIterations = 80;

    function step() {
        if (iteration >= maxIterations) {
            document.getElementById("status").innerText = "PASS: Ciclo de frames e timers de scroll concluídos sem Use-After-Free.";
            return;
        }

        iteration++;

        // 1. Cria um iframe com conteúdo rolável e aceleração por hardware (compositing)
        const iframe = document.createElement("iframe");
        iframe.style.width = "300px";
        iframe.style.height = "300px";
        document.body.appendChild(iframe);

        const doc = iframe.contentDocument;
        if (doc) {
            const scroller = doc.createElement("div");
            scroller.style.height = "2000px";
            scroller.style.transform = "translateZ(0)"; // Força criação de RemoteLayerTree
            doc.body.appendChild(scroller);

            // 2. Dispara eventos repetidos de scroll para ativar o RemoteLayerTreeEventDispatcher
            iframe.contentWindow.scrollTo({ top: 1000, behavior: "smooth" });

            // 3. Sincroniza com o próximo frame do DisplayLink
            iframe.contentWindow.requestAnimationFrame(() => {
                // Remove o iframe abruptamente enquanto a Scrolling Thread processa o timer
                if (iframe.parentNode) {
                    document.body.removeChild(iframe);
                }

                if (iteration % 8 === 0) {
                    gc();
                }

                // Agenda a próxima iteração
                setTimeout(step, 10);
            });
        } else {
            document.body.removeChild(iframe);
            setTimeout(step, 10);
        }
    }

    step();
}

try {
    runRaceTest();
} catch (e) {
    document.getElementById("status").innerText = "FAIL: " + e.message;
}
</script>
</body>
</html>
