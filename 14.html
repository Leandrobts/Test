<!doctype html>
<button id="go">START</button>
<div id="out"></div>

<script>
go.onclick = function () {
    var f = document.createElement("iframe");
    f.src = location.href;
    document.body.appendChild(f);

    setTimeout(function () {
        f.src = "about:blank";
        f.remove();

        setTimeout(function () {
            out.textContent = "PASS - no crash observed";
        }, 100);
    }, 0);
};
</script>
