<!DOCTYPE html>
<html>
<body>
<script type="module">
function gc() {
    function gcRec(n) {
          if (n < 1)
              return {};
          var temp = {i: "ab" + i + (i / 100000)};
          temp += "foo";
          gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
    gcRec(10);
}

function main() {
    // Removido noDFG(main) pois é uma função interna de harness de teste

    const object = {
        opt: new Function('value', `
            function inlinee(value) {
                return [-value, -value, -value];
            }

            return inlinee(value);`)
    };

    for (let i = 0; i < 10000; i++) {
        object.opt(BigInt(i));
    }

    setTimeout(() => {
        object.opt = null;
        gc();

        setTimeout(() => {
            console.log('Should\'ve crashed.');
        }, 1000);
    }, 300);
}

main();
</script>
</body>
</html>
