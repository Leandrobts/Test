<!DOCTYPE html>
<html>
<body>
<p>This test passes if it does not crash.</p>
<div id="host"></div>
<div id="result"></div>

<!-- Elementos para simular a disputa de foco do FocusController -->
<input id="outerInput" type="text" tabindex="1">
<iframe id="frame1" srcdoc="<input id='innerInput' tabindex='1'>"></iframe>

<script>
// --- Função GC integrada ---
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);  
}

let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable';
shadowRoot.appendChild(victim);

async function runTest() {   
    // O gatilho do UAF original: remove a vítima e roda GC no blur[cite: 1]
    victim.addEventListener('blur', () => {
        victim.remove();
        victim = null;
        gc();
    }, true);

    // 1. Foca na vítima do Shadow DOM primeiro
    victim.focus();

    // 2. Substituição lógica do UIHelper: 
    // Em vez de desligar a janela via API interna, forçamos o FocusController 
    // a reavaliar o foco global movendo-o para o outerInput e para o iframe 
    // na mesma árvore de ticks, forçando a transição de documentos.
    const outerInput = document.getElementById('outerInput');
    const frame1 = document.getElementById('frame1');

    outerInput.focus();
    
    if (frame1 && frame1.contentDocument) {
        let innerInput = frame1.contentDocument.getElementById('innerInput');
        if (innerInput) {
            innerInput.focus();
        }
    }

    await new Promise((resolve) => {
        requestAnimationFrame(() => setTimeout(resolve, 0));
    });

    result.textContent = 'PASS';    
}    

runTest();
</script>
</body>
</html>
