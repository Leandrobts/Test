
<!DOCTYPE html>
<html>
<body>
<script>
const iterations = 25;
let n = 0;

function runTest(win) {
    const element = win.document.createElement("div");
    const animation = element.animate(
        [{ opacity: 0 }, { opacity: 1 }],
        { duration: 1000 }
    );
    animation.finished.catch(function() {});
}
    
function round() {
    const frame = document.createElement("iframe");
    document.body.appendChild(frame);

    try {
        runTest(frame.contentWindow);
    } catch(e) {
        console.log("ERROR:", e.message);
    }

    frame.remove();

    if (++n < iterations) {
        setTimeout(round, 0);
    } else {
        document.body.innerHTML += "<p>TEST FINISHED</p>";
    }
}

onload = round;
</script>
</body>
</html>
