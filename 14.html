<!DOCTYPE html>
<html>
<body>
<div id="container">
    <video id="vid" controls></video>
</div>
<p>Test for shadow root desynchronization and destructor cascade.</p>
<script>
async function runTest() {
    let container = document.getElementById('container');
    let video = document.getElementById('vid');

    // Cria uma árvore de sombra (shadow root) associada ao elemento ou container
    let shadow = video.attachShadow({ mode: 'open' });
    let subDiv = document.createElement('div');
    subDiv.textContent = "Shadow content";
    shadow.appendChild(subDiv);

    // Aguarda um ciclo e remove o container pai da árvore principal,
    // simulando a remoção em cascata descrita no bug.
    await new Promise(resolve => requestAnimationFrame(resolve));
    
    // Remove o container do DOM, disparando a limpeza dos filhos e das sombras
    container.remove();

    // Mantém o elemento de mídia referenciado via código para testar sobrevivência C++ / ActiveDOMObject
    window.leakedVideo = video;

    // Força tarefas no loop de eventos para tentar acessar ponteiros órfãos (m_shadowIncludingRoot)
    setTimeout(() => {
        if (window.leakedVideo) {
            // Tenta interagir ou disparar atualização de árvore de exibição (ex: propriedades de layout/shadow)
            window.leakedVideo.load();
        }
        document.body.insertAdjacentHTML('beforeend', '<p>PASS if no crash.</p>');
    }, 100);
}

runTest();
</script>
</body>
</html>
