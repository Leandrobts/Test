<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PS4 PoC - Hybrid Worker</title>
</head>
<body>
<h2>Teste PoC: Arquitetura Híbrida (Worker + DOM)</h2>
<p id="status">Iniciando Worker...</p>
<script>
// Código do Worker gerado dinamicamente via Blob URL
const workerScript = `
self.onmessage = function(e) {
    // 1. O Worker faz o trabalho pesado de lógica e preparação
    const dummiesCount = 3500;
    
    // Pede para a Main Thread criar os canvas em lote
    self.postMessage({ type: 'CREATE_DUMMIES', count: dummiesCount });
};
`;

const blob = new Blob([workerScript], { type: 'application/javascript' });
const worker = new Worker(URL.createObjectURL(blob));

worker.onmessage = function(event) {
    const data = event.data;
    if (data.type === 'CREATE_DUMMIES') {
        const statusEl = document.getElementById("status");
        statusEl.textContent = "Worker solicitou criação de canvas na Main Thread...";

        // Executa a criação de canvas na Main Thread onde o DOM existe
        const dummies = [];
        for (let i = 0; i < data.count; i++) {
            const canvas = document.createElement('canvas');
            canvas.width = 1;
            canvas.height = 1;
            const dummy = canvas.getContext('2d');
            dummy.font = '10px "dummy' + i + '"';
            dummies.push(dummy);
        }

        // Continuação do teste de fontes na Main Thread
        const pendingFontURL = 'url("data:font/ttf;base64,' + 'A'.repeat(1100000) + '")';
        const metricsDonor = new FontFace('metricsDonor0', pendingFontURL);
        const measured = new FontFace('measured0', pendingFontURL, { unicodeRange: 'U+13A0-13FF' });
        
        document.fonts.add(metricsDonor);
        document.fonts.add(measured);

        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        const context = canvas.getContext('2d');
        context.font = '10px metricsDonor0, measured0';
        context.measureText('\u13A0\u13A2\u13A4');

        statusEl.textContent = "Teste híbrido finalizado com sucesso!";
    }
};

// Inicia o worker
worker.postMessage('start');
</script>
</body>
</html>
