<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 WebKit Structured Test Harness V5</title>

<style>
body {
    font-family: sans-serif;
    margin: 10px;
}

button,
input,
textarea {
    margin: 3px;
    padding: 5px;
}

#status,
#sequenceInfo,
#log {
    padding: 8px;
    margin-top: 10px;
    border: 1px solid #777;
}

#sequenceInfo,
#log,
textarea {
    font-family: monospace;
    white-space: pre-wrap;
}

#log {
    max-height: 400px;
    overflow: auto;
}

textarea {
    width: 95%;
    height: 110px;
}

#testRoot {
    position: relative;
    min-height: 180px;
    padding: 10px;
    margin-top: 10px;
    border: 1px solid #444;
    overflow: hidden;
}

.layoutNode {
    display: inline-block;
    width: 35px;
    height: 22px;
    margin: 2px;
    border: 1px solid #777;
}

.mutationA {
    position: relative;
    padding: 6px;
    margin: 3px;
    border: 1px solid #777;
}

.mutationB {
    position: relative;
    padding: 10px;
    margin-left: 8px;
    outline: 1px dotted black;
}

.mutationC {
    display: inline-block;
    padding: 4px;
}
</style>
</head>

<body>

<h2>PS4 WebKit Structured Test Harness V5</h2>

<div>

    <button id="runGeneratedButton">
        Generate + Run
    </button>

    <button id="replayButton">
        Replay Descriptor
    </button>

    <button id="reduceButton">
        Run Selected Subset
    </button>

    <button id="newSeedButton">
        New Seed
    </button>

    <button id="clearButton">
        Clear Log
    </button>

    <br><br>

    Seed:

    <input
        id="seedInput"
        type="text"
        value="123456"
        size="12"
    >

    Steps:

    <input
        id="stepCountInput"
        type="text"
        value="5"
        size="4"
    >

</div>

<div id="status">
Ready
</div>

<div id="testRoot">

    <template id="templateNode">
        <div class="layoutNode">
            template
        </div>
    </template>

    <details id="detailsNode" open>
        <summary>Details</summary>
        Structured test node
    </details>

    <canvas
        id="mainCanvas"
        width="32"
        height="32">
    </canvas>

</div>

<h3>Current Sequence</h3>

<div id="sequenceInfo">
No sequence generated.
</div>

<h3>Replay / Reduction Descriptor</h3>

<textarea id="descriptorInput"></textarea>

<div id="log"></div>

<script>

/* ============================================================
   STATE
   ============================================================ */

var TestState = {

    running: false,

    step: 0,

    errors: 0,

    seed: 0,

    randomState: 0,

    currentModule: "",

    currentVariant: "",

    currentOperation: "",

    lastDescriptor: "",

    generatedSequence: [],

    sequenceIndex: 0
};


/* ============================================================
   LOGGING
   ============================================================ */

function log(message)
{
    TestState.step++;

    var text =
        "[" +
        ("0000" + TestState.step).slice(-4) +
        "] " +
        message;

    var output =
        document.getElementById("log");

    output.textContent +=
        text + "\n";

    output.scrollTop =
        output.scrollHeight;

    console.log(text);
}


function setStatus(message)
{
    document
        .getElementById("status")
        .textContent =
        message;
}


function delay(callback, ms)
{
    setTimeout(
        callback,
        ms || 100
    );
}


function beginModule(moduleName, variantName)
{
    TestState.currentModule =
        moduleName;

    TestState.currentVariant =
        variantName;

    log("");

    log(
        "MODULE | " +
        moduleName +
        "." +
        variantName
    );
}


function safeCall(name, callback)
{
    TestState.currentOperation =
        name;

    TestState.lastDescriptor =
        TestState.currentModule +
        "." +
        TestState.currentVariant +
        "." +
        name;

    log(
        "BEGIN | " +
        TestState.lastDescriptor
    );

    try
    {
        callback();

        log(
            "OK    | " +
            TestState.lastDescriptor
        );
    }
    catch (e)
    {
        TestState.errors++;

        log(
            "ERROR | " +
            TestState.lastDescriptor +
            " | " +
            e.name
        );
    }
}


/* ============================================================
   DETERMINISTIC PRNG
   ============================================================ */

function setSeed(seed)
{
    seed =
        parseInt(seed, 10);

    if (isNaN(seed))
        seed = 1;

    TestState.seed =
        seed;

    TestState.randomState =
        seed >>> 0;
}


function seededRandom()
{
    TestState.randomState =
        (
            TestState.randomState *
            1664525 +
            1013904223
        ) >>> 0;

    return (
        TestState.randomState /
        4294967296
    );
}


function randomIndex(length)
{
    return Math.floor(
        seededRandom() *
        length
    );
}


/* ============================================================
   CLEANUP
   ============================================================ */

function cleanupRoot()
{
    var root =
        document.getElementById(
            "testRoot"
        );

    var children = [];

    var i;

    for (
        i = 0;
        i < root.childNodes.length;
        i++
    )
    {
        children.push(
            root.childNodes[i]
        );
    }

    for (
        i = 0;
        i < children.length;
        i++
    )
    {
        var node =
            children[i];

        if (
            node.id !== "templateNode" &&
            node.id !== "detailsNode" &&
            node.id !== "mainCanvas"
        )
        {
            try
            {
                root.removeChild(node);
            }
            catch (e)
            {
            }
        }
    }

    var details =
        document.getElementById(
            "detailsNode"
        );

    if (details)
        details.open = true;

    var canvas =
        document.getElementById(
            "mainCanvas"
        );

    if (
        canvas &&
        !canvas.parentNode
    )
    {
        root.appendChild(canvas);
    }
}


/* ============================================================
   DOM.v1
   ============================================================ */

function DOM_v1(done)
{
    beginModule("DOM", "v1");

    var root =
        document.getElementById("testRoot");

    var container;

    safeCall(
        "create-container",
        function()
        {
            container =
                document.createElement("div");

            container.className =
                "mutationA";

            container.textContent =
                "DOM V1";

            root.appendChild(container);
        }
    );

    safeCall(
        "append-child",
        function()
        {
            var child =
                document.createElement("span");

            child.textContent =
                " child";

            container.appendChild(child);
        }
    );

    safeCall(
        "replace-child",
        function()
        {
            if (container.firstChild)
            {
                var replacement =
                    document.createElement("strong");

                replacement.textContent =
                    " replacement";

                container.replaceChild(
                    replacement,
                    container.firstChild
                );
            }
        }
    );

    delay(done);
}


/* ============================================================
   DOM.v2
   ============================================================ */

function DOM_v2(done)
{
    beginModule("DOM", "v2");

    var root =
        document.getElementById("testRoot");

    var a;
    var b;
    var child;

    safeCall(
        "create-a",
        function()
        {
            a =
                document.createElement("div");

            a.className =
                "mutationA";

            root.appendChild(a);
        }
    );

    safeCall(
        "create-b",
        function()
        {
            b =
                document.createElement("div");

            b.className =
                "mutationB";

            root.appendChild(b);
        }
    );

    safeCall(
        "create-child",
        function()
        {
            child =
                document.createElement("span");

            child.textContent =
                "movable";

            a.appendChild(child);
        }
    );

    safeCall(
        "move-child",
        function()
        {
            b.appendChild(child);
        }
    );

    safeCall(
        "move-to-root",
        function()
        {
            root.appendChild(child);
        }
    );

    delay(done);
}


/* ============================================================
   DOM.v3
   ============================================================ */

function DOM_v3(done)
{
    beginModule("DOM", "v3");

    var root =
        document.getElementById("testRoot");

    var base;

    safeCall(
        "create-base",
        function()
        {
            base =
                document.createElement("div");

            base.className =
                "mutationC";

            base.textContent =
                "base";

            root.appendChild(base);
        }
    );

    safeCall(
        "clone",
        function()
        {
            root.appendChild(
                base.cloneNode(true)
            );
        }
    );

    safeCall(
        "remove-base",
        function()
        {
            if (base.parentNode)
                base.parentNode.removeChild(base);
        }
    );

    delay(done);
}


/* ============================================================
   EVENTS.v1
   ============================================================ */

function EVENTS_v1(done)
{
    beginModule("EVENTS", "v1");

    var root =
        document.getElementById("testRoot");

    var input;

    safeCall(
        "create-input",
        function()
        {
            input =
                document.createElement("input");

            input.type = "text";

            root.appendChild(input);
        }
    );

    safeCall(
        "install-listeners",
        function()
        {
            input.addEventListener(
                "focus",
                function()
                {
                    log("EVENT | focus");
                },
                false
            );

            input.addEventListener(
                "blur",
                function()
                {
                    log("EVENT | blur");
                },
                false
            );
        }
    );

    safeCall(
        "focus",
        function()
        {
            input.focus();
        }
    );

    safeCall(
        "blur",
        function()
        {
            input.blur();
        }
    );

    delay(done);
}


/* ============================================================
   EVENTS.v2
   ============================================================ */

function EVENTS_v2(done)
{
    beginModule("EVENTS", "v2");

    var root =
        document.getElementById("testRoot");

    var target;

    safeCall(
        "create-target",
        function()
        {
            target =
                document.createElement("div");

            root.appendChild(target);
        }
    );

    safeCall(
        "listener",
        function()
        {
            target.addEventListener(
                "structuredtest",
                function()
                {
                    log(
                        "EVENT | structuredtest"
                    );
                },
                false
            );
        }
    );

    safeCall(
        "dispatch",
        function()
        {
            var event =
                document.createEvent("Event");

            event.initEvent(
                "structuredtest",
                true,
                true
            );

            target.dispatchEvent(event);
        }
    );

    delay(done);
}


/* ============================================================
   EVENTS.v3
   ============================================================ */

function EVENTS_v3(done)
{
    beginModule("EVENTS", "v3");

    var details =
        document.getElementById(
            "detailsNode"
        );

    safeCall(
        "listener",
        function()
        {
            details.addEventListener(
                "toggle",
                function()
                {
                    log("EVENT | toggle");
                },
                false
            );
        }
    );

    safeCall(
        "close",
        function()
        {
            details.open = false;
        }
    );

    safeCall(
        "open",
        function()
        {
            details.open = true;
        }
    );

    delay(done);
}


/* ============================================================
   LAYOUT.v1
   ============================================================ */

function LAYOUT_v1(done)
{
    beginModule("LAYOUT", "v1");

    var root =
        document.getElementById("testRoot");

    var container;

    safeCall(
        "create",
        function()
        {
            container =
                document.createElement("div");

            root.appendChild(container);
        }
    );

    safeCall(
        "populate",
        function()
        {
            var i;

            for (i = 0; i < 5; i++)
            {
                var node =
                    document.createElement("div");

                node.className =
                    "layoutNode";

                node.textContent =
                    "L" + i;

                container.appendChild(node);
            }
        }
    );

    safeCall(
        "layout-read",
        function()
        {
            log(
                "WIDTH | " +
                container.offsetWidth
            );
        }
    );

    delay(done);
}


/* ============================================================
   LAYOUT.v2
   ============================================================ */

function LAYOUT_v2(done)
{
    beginModule("LAYOUT", "v2");

    var root =
        document.getElementById("testRoot");

    var node;

    safeCall(
        "create",
        function()
        {
            node =
                document.createElement("div");

            node.className =
                "mutationA";

            root.appendChild(node);
        }
    );

    safeCall(
        "style-change",
        function()
        {
            node.className =
                "mutationB";

            node.style.width =
                "120px";
        }
    );

    safeCall(
        "rect-read",
        function()
        {
            var rect =
                node.getBoundingClientRect();

            log(
                "RECT | " +
                rect.width
            );
        }
    );

    delay(done);
}


/* ============================================================
   LAYOUT.v3
   ============================================================ */

function LAYOUT_v3(done)
{
    beginModule("LAYOUT", "v3");

    safeCall(
        "clone-template",
        function()
        {
            var template =
                document.getElementById(
                    "templateNode"
                );

            var clone =
                template.content.cloneNode(true);

            document
                .getElementById("testRoot")
                .appendChild(clone);
        }
    );

    safeCall(
        "layout-read",
        function()
        {
            var root =
                document.getElementById("testRoot");

            log(
                "ROOT WIDTH | " +
                root.offsetWidth
            );
        }
    );

    delay(done);
}


/* ============================================================
   CANVAS.v1
   ============================================================ */

function CANVAS_v1(done)
{
    beginModule("CANVAS", "v1");

    safeCall(
        "draw",
        function()
        {
            var canvas =
                document.getElementById(
                    "mainCanvas"
                );

            var context =
                canvas.getContext("2d");

            if (context)
                context.fillRect(
                    0,
                    0,
                    16,
                    16
                );
        }
    );

    delay(done);
}


/* ============================================================
   CANVAS.v2
   ============================================================ */

function CANVAS_v2(done)
{
    beginModule("CANVAS", "v2");

    safeCall(
        "resize-draw",
        function()
        {
            var canvas =
                document.getElementById(
                    "mainCanvas"
                );

            canvas.width = 64;
            canvas.height = 64;

            var context =
                canvas.getContext("2d");

            if (context)
                context.fillRect(
                    5,
                    5,
                    32,
                    32
                );
        }
    );

    delay(done);
}


/* ============================================================
   CANVAS.v3
   ============================================================ */

function CANVAS_v3(done)
{
    beginModule("CANVAS", "v3");

    safeCall(
        "toBlob",
        function()
        {
            var canvas =
                document.getElementById(
                    "mainCanvas"
                );

            if (!canvas.toBlob)
            {
                log("INFO | toBlob unavailable");
                return;
            }

            canvas.toBlob(
                function(blob)
                {
                    log(
                        "CALLBACK | " +
                        (blob ? "blob" : "null")
                    );
                }
            );
        }
    );

    delay(done, 150);
}


/* ============================================================
   EDITING.v1
   ============================================================ */

function EDITING_v1(done)
{
    beginModule("EDITING", "v1");

    safeCall(
        "selectAll",
        function()
        {
            if (document.execCommand)
            {
                document.execCommand(
                    "selectAll",
                    false,
                    null
                );
            }
        }
    );

    delay(done);
}


/* ============================================================
   EDITING.v2
   ============================================================ */

function EDITING_v2(done)
{
    beginModule("EDITING", "v2");

    safeCall(
        "undo-redo",
        function()
        {
            if (document.execCommand)
            {
                document.execCommand(
                    "undo",
                    false,
                    null
                );

                document.execCommand(
                    "redo",
                    false,
                    null
                );
            }
        }
    );

    delay(done);
}


/* ============================================================
   STEP REGISTRY
   ============================================================ */

var AvailableSteps = [

    { name: "DOM.v1", fn: DOM_v1 },
    { name: "DOM.v2", fn: DOM_v2 },
    { name: "DOM.v3", fn: DOM_v3 },

    { name: "EVENTS.v1", fn: EVENTS_v1 },
    { name: "EVENTS.v2", fn: EVENTS_v2 },
    { name: "EVENTS.v3", fn: EVENTS_v3 },

    { name: "LAYOUT.v1", fn: LAYOUT_v1 },
    { name: "LAYOUT.v2", fn: LAYOUT_v2 },
    { name: "LAYOUT.v3", fn: LAYOUT_v3 },

    { name: "CANVAS.v1", fn: CANVAS_v1 },
    { name: "CANVAS.v2", fn: CANVAS_v2 },
    { name: "CANVAS.v3", fn: CANVAS_v3 },

    { name: "EDITING.v1", fn: EDITING_v1 },
    { name: "EDITING.v2", fn: EDITING_v2 }

];


/* ============================================================
   LOOKUP
   ============================================================ */

function getStepByName(name)
{
    var i;

    for (
        i = 0;
        i < AvailableSteps.length;
        i++
    )
    {
        if (
            AvailableSteps[i].name === name
        )
        {
            return AvailableSteps[i];
        }
    }

    return null;
}


/* ============================================================
   GENERATION
   ============================================================ */

function generateSequence(seed, count)
{
    setSeed(seed);

    var sequence = [];

    var i;

    for (
        i = 0;
        i < count;
        i++
    )
    {
        sequence.push(
            AvailableSteps[
                randomIndex(
                    AvailableSteps.length
                )
            ]
        );
    }

    return sequence;
}


/* ============================================================
   SERIALIZATION
   ============================================================ */

function serializeSequence(sequence)
{
    var result = [];

    var i;

    for (
        i = 0;
        i < sequence.length;
        i++
    )
    {
        result.push(
            sequence[i].name
        );
    }

    return result.join(" -> ");
}


function parseDescriptor(text)
{
    var parts =
        text.split("->");

    var result = [];

    var i;

    for (
        i = 0;
        i < parts.length;
        i++
    )
    {
        var name =
            parts[i]
            .replace(/^\s+|\s+$/g, "");

        if (!name)
            continue;

        var step =
            getStepByName(name);

        if (step)
            result.push(step);
    }

    return result;
}


/* ============================================================
   DISPLAY
   ============================================================ */

function showSequence()
{
    var text =
        "SEED: " +
        TestState.seed +
        "\n\n";

    text +=
        "STEPS:\n";

    var i;

    for (
        i = 0;
        i < TestState.generatedSequence.length;
        i++
    )
    {
        text +=
            (i + 1) +
            ". " +
            TestState.generatedSequence[i].name +
            "\n";
    }

    text +=
        "\nDESCRIPTOR:\n";

    text +=
        serializeSequence(
            TestState.generatedSequence
        );

    document
        .getElementById("sequenceInfo")
        .textContent =
        text;

    document
        .getElementById("descriptorInput")
        .value =
        serializeSequence(
            TestState.generatedSequence
        );
}


/* ============================================================
   EXECUTION ENGINE
   ============================================================ */

function executeNextStep()
{
    if (
        TestState.sequenceIndex >=
        TestState.generatedSequence.length
    )
    {
        finishSequence();
        return;
    }

    var step =
        TestState.generatedSequence[
            TestState.sequenceIndex
        ];

    log(
        "STEP " +
        (TestState.sequenceIndex + 1) +
        "/" +
        TestState.generatedSequence.length +
        " | " +
        step.name
    );

    TestState.sequenceIndex++;

    step.fn(
        function()
        {
            executeNextStep();
        }
    );
}


function startSequence(sequence)
{
    if (TestState.running)
        return;

    if (
        !sequence ||
        !sequence.length
    )
    {
        setStatus(
            "No valid steps"
        );

        return;
    }

    cleanupRoot();

    TestState.running = true;
    TestState.step = 0;
    TestState.errors = 0;
    TestState.sequenceIndex = 0;
    TestState.lastDescriptor = "";

    TestState.generatedSequence =
        sequence;

    document
        .getElementById("log")
        .textContent =
        "";

    showSequence();

    setStatus(
        "Running " +
        sequence.length +
        " steps"
    );

    log(
        "PS4 WEBKIT STRUCTURED TEST HARNESS V5"
    );

    log(
        "SEED | " +
        TestState.seed
    );

    log(
        "DESCRIPTOR | " +
        serializeSequence(sequence)
    );

    delay(
        executeNextStep,
        100
    );
}


function finishSequence()
{
    log("");

    log(
        "SEQUENCE FINISHED"
    );

    log(
        "LAST OPERATION | " +
        TestState.lastDescriptor
    );

    log(
        "ERROR COUNT | " +
        TestState.errors
    );

    cleanupRoot();

    TestState.running = false;

    setStatus(
        "Finished | Errors: " +
        TestState.errors
    );
}


/* ============================================================
   CONTROLS
   ============================================================ */

document
    .getElementById("runGeneratedButton")
    .addEventListener(
        "click",
        function()
        {
            var seed =
                parseInt(
                    document
                    .getElementById("seedInput")
                    .value,
                    10
                );

            var count =
                parseInt(
                    document
                    .getElementById("stepCountInput")
                    .value,
                    10
                );

            if (isNaN(seed))
                seed = 1;

            if (
                isNaN(count) ||
                count < 1
            )
                count = 1;

            if (count > 12)
                count = 12;

            var sequence =
                generateSequence(
                    seed,
                    count
                );

            startSequence(sequence);
        },
        false
    );


document
    .getElementById("replayButton")
    .addEventListener(
        "click",
        function()
        {
            var text =
                document
                .getElementById(
                    "descriptorInput"
                )
                .value;

            var sequence =
                parseDescriptor(text);

            startSequence(sequence);
        },
        false
    );


document
    .getElementById("reduceButton")
    .addEventListener(
        "click",
        function()
        {
            var text =
                document
                .getElementById(
                    "descriptorInput"
                )
                .value;

            var sequence =
                parseDescriptor(text);

            /*
             * The descriptor itself acts as
             * the selected reduced subset.
             */

            startSequence(sequence);
        },
        false
    );


document
    .getElementById("newSeedButton")
    .addEventListener(
        "click",
        function()
        {
            var seed =
                Math.floor(
                    Math.random() *
                    2147483647
                ) + 1;

            document
                .getElementById(
                    "seedInput"
                )
                .value =
                seed;
        },
        false
    );


document
    .getElementById("clearButton")
    .addEventListener(
        "click",
        function()
        {
            document
                .getElementById("log")
                .textContent =
                "";
        },
        false
    );


/* ============================================================
   INITIALIZATION
   ============================================================ */

log(
    "Harness V5 initialized"
);

</script>

</body>
</html>
