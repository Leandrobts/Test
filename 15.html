<!DOCTYPE html>
<html>
<body>
<div id="result"></div>
<div id="container">
    <input id="input" type="password" autocomplete="current-password">
</div>

<script>
function gc() {
    function gcRec(n) {
          if (n < 1)
              return {};
          var temp = {i: "ab" + i + (i / 100000)};
          temp += "foo";
          gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
    gcRec(10);
}

(function() {
    var input = document.getElementById("input");
    var container = document.getElementById("container");
    var result = document.getElementById("result");
    input.addEventListener("click", function() {
    input.type = "button";
    gc();
    }, { once: true });

    input.focus();    
    setTimeout(function() {
        try {
            input.click();
        } catch (e) {
           
        }
        setTimeout(function() {
            input.focus();
            input.blur();
           gc();

            result.textContent = "PASS - public lifetime sequence completed";

        }, 50);

    }, 100);

})();
</script>
</body>
</html>
