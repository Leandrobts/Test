<!doctype html>
<meta charset="utf-8">

<button id="go">START FULLSCREEN TEST</button>
<div id="status"></div>

<script>
go.onclick = function () {
    var iframe = document.createElement("iframe");
    document.body.appendChild(iframe);

    var div = iframe.contentDocument.createElement("div");
    div.textContent = "TEST";
    iframe.contentDocument.body.appendChild(div);

    var contentDocument = iframe.contentDocument;

    try {
        div.webkitRequestFullscreen().catch(function () {});
    } catch (e) {
    }

    document.body.removeChild(iframe);

    setTimeout(function () {
        try {
            if (contentDocument.webkitCancelFullScreen)
                contentDocument.webkitCancelFullScreen();
        } catch (e) {
        }

        status.textContent = "PASS - no crash observed";
    }, 0);
};
</script>
