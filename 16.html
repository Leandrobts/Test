<!DOCTYPE html>
<html>
<head>
</head>
<body>
<p>This test passes if it does not crash.</p>

<!-- Iframe simulando o alvo XML com folha de estilo XSL -->
<iframe id="f" srcdoc='
<?xml-stylesheet type="text/xsl" href="#x"?>
<root/>
'></iframe>

<script>
// Aguarda o carregamento inicial do iframe
setTimeout(() => {
    try {
        const doc = document.getElementById('f').contentDocument;
        if (doc) {
            // Cria uma instrução de processamento (PI) de XSL para acionar a compilação
            const pi = doc.createProcessingInstruction("xml-stylesheet", 'type="text/xsl" href="#x"');
            doc.insertBefore(pi, doc.firstChild);
            pi.remove();
        }
    } catch (e) {
        console.log("Aviso de acesso cruzado ou restrição do iframe:", e);
    }

    // Aguarda o intervalo correspondente ao atraso do sub-recurso para validar a estabilidade
    setTimeout(() => {
        console.log("PASS: O teste executou sem travamentos ou falhas de memória.");
    }, 3000);
}, 500);
</script>
</body>
</html>
