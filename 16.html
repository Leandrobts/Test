
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PS4 Iframe GC Diagnostic</title>
</head>
<body>
<pre id="log">PS4 Iframe GC Test
</pre>

<script>
var output = document.getElementById("log");

function log(s) {
    output.textContent += s + "\n";
}

var weakFrame;
var weakParent;
var weakChild;

var registry = new FinalizationRegistry(function(name) {
    log("FINALIZED: " + name);
});

function setup() {
    var frame = document.createElement("iframe");
    document.body.appendChild(frame);

    var doc = frame.contentDocument;
    var style = doc.createElement("style");
    doc.head.appendChild(style);

    var sheet = style.sheet;

    sheet.insertRule(
        ".outer { color:red; & .nested { color:blue; } }",
        0
    );

    var parent = sheet.cssRules[0];
    var child = parent.cssRules[0];

    weakFrame = new WeakRef(frame);
    weakParent = new WeakRef(parent);
    weakChild = new WeakRef(child);

    registry.register(frame, "iframe element");
    registry.register(parent, "CSSStyleRule parent");
    registry.register(child, "CSSStyleRule child");

    log("Parent: " + parent.constructor.name);
    log("Child: " + child.constructor.name);

    sheet.deleteRule(0);
    log("Sheet length: " + sheet.cssRules.length);

    frame.remove();
    log("Iframe removed");

    // Referencias locais deixam o escopo.
}

function pressure() {
    var junk = [];

    for (var i = 0; i < 5000; i++) {
        junk.push(new Array(100).join("GC_" + i));
    }
}

var attempt = 0;

function check() {
    attempt++;
    pressure();

    setTimeout(function() {
        var frameAlive =
            weakFrame.deref() !== undefined;

        var parentAlive =
            weakParent.deref() !== undefined;

        var childAlive =
            weakChild.deref() !== undefined;

        log(
            "Attempt " + attempt +
            " frame=" + frameAlive +
            " parent=" + parentAlive +
            " child=" + childAlive
        );

        if (attempt < 10) {
            setTimeout(check, 500);
        } else {
            log("TEST FINISHED");
        }
    }, 100);
}

try {
    setup();
    setTimeout(check, 500);
} catch (e) {
    log("ERROR: " + e.name + ": " + e.message);
}
</script>
</body>
</html>
