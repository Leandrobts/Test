<!DOCTYPE html>
<html>
<head>
</head>
<body>

<script>

const WIDTH = 320, HEIGHT = 240;
const MAX_ITERATIONS = 3000;

async function getVP8Keyframe(w, h) {
    return new Promise((resolve, reject) => {
        const chunks = [];

        const enc = new VideoEncoder({
            output: (chunk) => chunks.push(chunk),
            error: reject
        });

        enc.configure({
            codec: 'vp8',
            width: w,
            height: h,
            bitrate: 500000,
            framerate: 30
        });

        const canvas = new OffscreenCanvas(w, h);
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#336699';
        ctx.fillRect(0, 0, w, h);

        ctx.fillStyle = '#FF0000';
        ctx.fillRect(10, 10, 50, 50);

        const bitmap = canvas.transferToImageBitmap();
        const vf = new VideoFrame(bitmap, { timestamp: 0 });

        enc.encode(vf, { keyFrame: true });

        vf.close();
        bitmap.close();

        enc.flush().then(() => {
            enc.close();

            if (!chunks.length) {
                reject(new Error('No encoded chunks'));
                return;
            }

            const buf = new ArrayBuffer(chunks[0].byteLength);
            chunks[0].copyTo(buf);
            resolve(buf);
        }).catch(reject);
    });
}

async function getVideoFrame() {
    const vp8Data = await getVP8Keyframe(WIDTH, HEIGHT);

    let resolveCallback;

    const promise = new Promise((resolve, reject) => {
        resolveCallback = resolve;

        setTimeout(() => {
            reject("decoding timed out");
        }, 5000);
    });

    const raceDecoder = new VideoDecoder({
        output: frame => resolveCallback(frame),
        error: () => {}
    });

    raceDecoder.configure({
        codec: 'vp8'
    });

    raceDecoder.decode(new EncodedVideoChunk({
        type: 'key',
        timestamp: 0,
        data: vp8Data
    }));

    return promise;
}

(async () => {
    let shouldDelay = false;

    for (let i = 0; i < 10; ++i) {
        const frame = await getVideoFrame();

        const raceEncoder = new VideoEncoder({
            output: () => {},
            error: () => {}
        });

        raceEncoder.configure({
            codec: 'vp8',
            width: WIDTH,
            height: HEIGHT,
            bitrate: 500000,
            framerate: 30
        });

        const encodeCloneEncoder = new VideoEncoder({
            output: () => {},
            error: () => {}
        });

        encodeCloneEncoder.configure({
            codec: 'vp8',
            width: WIDTH,
            height: HEIGHT,
            bitrate: 500000,
            framerate: 30
        });

        raceEncoder.encode(frame, { keyFrame: true });

        if (shouldDelay)
            await new Promise(resolve => setTimeout(resolve, 1));

        shouldDelay = !shouldDelay;

        const frameClone = new VideoFrame(frame, {
            timestamp: 1000
        });

        encodeCloneEncoder.encode(frameClone, {
            keyFrame: true
        });

        setTimeout(() => {
            frame.close();
            frameClone.close();
            raceEncoder.close();
            encodeCloneEncoder.close();
        }, 0);
    }

    document.body.textContent = 'PASS frame-clone-and-convert';
})();

</script>

</body>
</html>
