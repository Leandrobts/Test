<!DOCTYPE html>
<html>
<body>
<p>This test passes if it does not crash.</p>
<button onclick="triggerUAF()">Trigger UAF</button><br><br>
<script>
const iframe = document.createElement('iframe');
document.body.appendChild(iframe);
const div = iframe.contentDocument.createElement('div');
iframe.contentDocument.body.appendChild(div);

function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

function triggerUAF() {
    const contentDocument = iframe.contentDocument;

    Promise.resolve(div.webkitRequestFullscreen && div.webkitRequestFullscreen()).catch(() => {});

    setTimeout(() => {
        document.body.removeChild(iframe);
        setTimeout(() => {
            if (contentDocument && contentDocument.webkitCancelFullScreen) {
                contentDocument.webkitCancelFullScreen();
            }
            gc();
        }, 0);
    }, 15);
}
</script>
</body>
</html>
