<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<button id="start">Iniciar teste</button>
<pre id="log" style="background:#111;color:#eee;padding:8px;font:12px monospace;white-space:pre-wrap;"></pre>
<script>
const logEl = document.getElementById('log');
function log(msg, color = '#fff') {
  const d = document.createElement('div');
  d.style.color = color;
  d.textContent = msg;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}

async function runTest() {
  log('--- iniciando ---');

  if (!('serviceWorker' in navigator)) {
    log('❌ Service Worker indisponível', '#f80');
    return;
  }
  log('✅ Service Worker API presente');

  // Registra o SW a partir de um arquivo real (não Blob)
  let swr;
  try {
    swr = await navigator.serviceWorker.register('sw.js', { scope: './' });
    log('✅ Service Worker registrado');
  } catch (e) {
    log('❌ Falha ao registrar SW: ' + e.message, '#f55');
    return;
  }

  await navigator.serviceWorker.ready;
  log('✅ Service Worker pronto');

  // Background Fetch fica em swr, não em registration
  if (typeof swr.backgroundFetch === 'undefined') {
    log('❌ Background Fetch API indisponível — skip', '#f80');
    return;
  }
  log('✅ Background Fetch API presente');

  // Pre-populate allDocumentsMap
  for (let i = 0; i < 8; i++)
    document.implementation.createHTMLDocument();
  log('✅ 8 documentos pré-criados');

  // Inicia o fetch
  let request;
  try {
    request = await swr.backgroundFetch.fetch(
      'repro-' + Date.now(),
      [location.href] // mesma origem
    );
  } catch (e) {
    log('❌ backgroundFetch.fetch falhou: ' + e.message, '#f55');
    return;
  }
  log('✅ backgroundFetch iniciado: ' + request.id);

  // Dispara progress
  await new Promise((resolve) => {
    let fired = false;
    request.onprogress = () => {
      if (fired) return;
      fired = true;
      log('⚡ progress disparado — criando 512 documentos…', '#0f0');
      for (let i = 0; i < 512; i++)
        document.implementation.createHTMLDocument();
      resolve();
    };
    setTimeout(() => {
      if (!fired) {
        log('⚠ onprogress não disparou em 5s', '#f80');
        resolve();
      }
    }, 5000);
  });

  log('✅ PASS — sem crash JS detectável', '#0f0');
}

document.getElementById('start').addEventListener('click', () => {
  logEl.innerHTML = '';
  log('clicou', '#0f0');
  runTest().catch(e => log('❌ ERRO: ' + (e.stack || e.message), '#f55'));
});
</script>
</body>
</html>
