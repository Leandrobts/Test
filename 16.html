<!DOCTYPE html>
<html>
<body>
<p>1. Clique no campo abaixo<br>
   2. Digite: 9 2 2 0 1 2</p>

<input id="input" type="date">
<pre id="log"></pre>

<script>
const input = document.getElementById("input");
const log   = document.getElementById("log");

input.addEventListener("input", () => {
    log.textContent += "input event fired — type antes: " + input.type + "\n";
    input.type = "text";
    log.textContent += "type depois: " + input.type + "\n";
});

input.addEventListener("change", () => {
    log.textContent += "change event fired\n";
});
</script>
</body>
</html>
