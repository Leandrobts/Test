<script>
function gc() {
    function gcRec(n) {
        if (n < 1) return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 10000; i++) gcRec(10);
}
for (var k = 0; k < 2; k++) {
    (function() {
        var url = URL.createObjectURL(new Blob(['aa']));
        fetch(url).then(function(resp) {
            URL.revokeObjectURL(url);
          //  gc();
            return resp.blob();
        }).then(function(blob) {
            //gc();
            var fd = new FormData();
            fd.append('a', blob);
            var response = new Response(fd);
            Object.prototype.__defineGetter__('then', function() {
                response = null;
             //   gc();
            });
        //    gc();
            response.arrayBuffer();
        });
    })();
}
</script>
