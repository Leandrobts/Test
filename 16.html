
<!DOCTYPE html>
<html>
<body>
<script>
const iterations = 25;
let n = 0;

function runTest(win) {
    if (!win.Worker) return;
    const blob = new win.Blob(
        ["onmessage=function(){}"],
        { type: "application/javascript" }
    );
    const url = win.URL.createObjectURL(blob);
    const worker = new win.Worker(url);
    worker.postMessage("TEST");
}
  
function round() {
    const frame = document.createElement("iframe");
    document.body.appendChild(frame);

    try {
        runTest(frame.contentWindow);
    } catch(e) {
        console.log("ERROR:", e.message);
    }

    frame.remove();

    if (++n < iterations) {
        setTimeout(round, 0);
    } else {
        document.body.innerHTML += "<p>TEST FINISHED</p>";
    }
}

onload = round;
</script>
</body>
</html>
