<!DOCTYPE html>
<html>
<body>
  <input id="outerInput">
  <iframe tabindex="0" srcdoc="<input tabindex='0'><script>parent.innerInput = document.querySelector('input');</script>"></iframe>
  <script>
    function gc() {
    function gcRec(n) {
          if (n < 1)
              return {};
          var temp = {i: "ab" + i + (i / 100000)};
          temp += "foo";
          gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
    gcRec(10);
}

    let iframe = document.querySelector('iframe');
    let outerInput = document.querySelector('input');
    let innerInput = null;

    iframe.onload = () => setTimeout(runTest, 0);

    function runTest() {
        let innerInput = window.innerInput;
        window.innerInput = null;

        outerInput.addEventListener('blur', () => {}, { once: true });
        outerInput.focus();

        // Passo 15: Cria e dispara o evento sintético de teclado (Tab), forçando a perda de foco (blur)
        outerInput.dispatchEvent(new KeyboardEvent('keydown', {
            bubbles: true,
            cancelable: true,
            view: window,
            detail: 0,
            key: 'Tab',
            code: 'Tab',
            keyIdentifier: 'U+0009'
        }));
        console.log("Passo 15: Evento keydown (Tab) disparado.");
    }
  </script>
</body>
</html>
