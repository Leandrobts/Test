<!DOCTYPE html>
<html>
<body>
<p>This test passes if it does not crash.</p>
<div id="host"></div>
<div id="result"></div>
<input tabindex="0" style="position: absolute; opacity: 0; pointer-events: none;">
<script>
// --- Função GC integrada ---
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);  
}

let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable';
shadowRoot.appendChild(victim);
victim.focus();

async function runTest() {
    document.addEventListener('blur', () => { 
              
            victim.remove();
            victim = null;
            gc();  
             
    }, true);

    // Mecanismo de mudança de foco utilizando simulação de evento de teclado (Tab) e focar no elemento auxiliar
    await new Promise((resolve) => {
        requestAnimationFrame(() => {
            let auxInput = document.querySelector('input');
            auxInput.focus();
            auxInput.dispatchEvent(new KeyboardEvent('keydown', { bubbles: true, cancelable: true, view: window, detail: 0,
            key: 'Tab', code: 'Tab', keyIdentifier: 'U+0009', location: 222, ctrlKey: false, altKey: true, shiftKey: false, metaKey: false }));
            setTimeout(resolve, 0);
        });
    });

    result.textContent = 'PASS';
}

runTest();
</script>
</body>
</html>
