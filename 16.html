<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Teste de Regressão: Condição de corrida em AudioWorkletGlobalScope</title>
</head>
<body>
<div id="status">Executando teste...</div>

<script>
// Função utilitária de GC via alocação recursiva de memória
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 1000; i++)
        gcRec(10);
}

// Módulo de processamento mínimo para o AudioWorklet
const workletCode = `
    class TestProcessor extends AudioWorkletProcessor {
        process(inputs, outputs, parameters) {
            return true;
        }
    }
    registerProcessor('test-processor', TestProcessor);
`;

const workletBlobUrl = URL.createObjectURL(new Blob([workletCode], { type: "application/javascript" }));

async function runAudioWorkletTest() {
    if (!window.AudioContext || !window.AudioWorkletNode) {
        document.getElementById("status").innerText = "PASS: AudioWorklet não suportado neste ambiente.";
        return;
    }

    for (let cycle = 0; cycle < 30; cycle++) {
        // 1. Cria um AudioContext
        const ctx = new AudioContext();

        // 2. Inicia o carregamento do módulo na worklet thread
        const modulePromise = ctx.audioWorklet.addModule(workletBlobUrl);

        // 3. Força a Audio Rendering Thread a rodar renderQuantum antes da conclusão do worklet
        const osc = ctx.createOscillator();
        osc.connect(ctx.destination);
        osc.start();

        await modulePromise.catch(() => {});

        try {
            // 4. Cria o nó que acopla o worklet ao pipeline de renderização
            const node = new AudioWorkletNode(ctx, "test-processor");
            node.connect(ctx.destination);
        } catch (e) {}

        // 5. Fecha e descarta o contexto imediatamente durante a inicialização
        ctx.close();

        // 6. Dispara pressão no coletor para forçar a desalocação do escopo
        if (cycle % 5 === 0) {
            gc();
        }
    }

    document.getElementById("status").innerText = "PASS: AudioWorklet inicializado e finalizado sem UAF / race condition.";
}

runAudioWorkletTest().catch((err) => {
    document.getElementById("status").innerText = "FAIL: " + err.message;
});
</script>
</body>
</html>
