<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<style>

html, body {
    margin: 0;
    padding: 0;
}

iframe {
    content: url();
    zoom: 0.01;
    width: 300px;
    height: 200px;
}

</style>
</head>

<body>

<iframe id="i0"></iframe>

<script>

var i0 = document.getElementById("i0");
var iteration = 0;

function runTest() {

    iteration++;

    location.hash = "x" + iteration;

    /*
     * Recreate the mutation from the original test.
     */
    document.documentElement.appendChild(
        document.createElement("frameset")
    );

    i0.onfocus = function() {

        location.hash = "y" + iteration;

    };

    setTimeout(function() {

        try {
            i0.focus();
        } catch (e) {
        }

    }, 0);

}

/*
 * Give the initial document time to construct.
 */
setTimeout(function() {

    runTest();

    setTimeout(function() {
        runTest();
    }, 100);

    setTimeout(function() {
        runTest();
    }, 200);

}, 0);

</script>

</body>
</html>
