
<!DOCTYPE html>
<html>
<body>
<pre id="log">Iniciando...</pre>

<script>
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }

    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

function log(s) {
    document.getElementById("log").textContent += "\n" + s;
}

// Criar apenas UM iframe
const iframe = document.createElement("iframe");
document.body.appendChild(iframe);

// Criar o CSS dentro do iframe
const doc = iframe.contentDocument;
const style = doc.createElement("style");
doc.head.appendChild(style);

const sheet = style.sheet;

sheet.insertRule(
    ".outer { color: red; & .nested { color: blue; } }",
    0
);

let nestedRules = sheet.cssRules[0].cssRules;

// Remover a regra original
sheet.deleteRule(0);

// Remover o iframe
iframe.remove();

log("Iframe removed");

// Primeira chamada de GC
gc();

const nested = nestedRules[0];
nestedRules = null;

// Segunda chamada de GC
gc();

// Resultado original
try {
    log(
        nested.parentRule === null
        ? "PASS"
        : "FAIL: parentRule is " + nested.parentRule
    );
} catch (e) {
    log("EXCEPTION: " + e.name + ": " + e.message);
}

log("TEST FINISHED");
</script>
</body>
</html>
