<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>C8 - offsetWidth then deleteRule</title></head>
<body>
<button id="go">Run C8</button>
<div id="o"></div>
<script>
var o = document.getElementById("o");
function L(s) { o.textContent += s + "\n"; }

function run() {
  var host = document.createElement("div");
  document.body.appendChild(host);
  var sr = host.attachShadow({ mode: "open" });

  var s1 = document.createElement("style");
  s1.textContent =
    "@font-face{font-family:'pf';src:url('nosource.otf')}" +
    ":host>span{font-family:'pf';font-size:20px;display:block}";
  sr.appendChild(s1);

  var span = document.createElement("span");
  span.textContent = "X";
  sr.appendChild(span);

  void host.getBoundingClientRect();
  var s1Sheet = s1.sheet;
  L("rules before=" + (s1Sheet ? s1Sheet.cssRules.length : -1));

  var fs = document.fonts;
  L("status=" + fs.status);
  if (fs.status !== "loading") {
    L("ABORT: status not loading");
    return;
  }

  void fs.ready;

  Object.defineProperty(FontFaceSet.prototype, "then", {
    configurable: true,
    get: function () {
      L("STEP 1: getter entered");
      L("STEP 2: inner offsetWidth first");
      void document.body.offsetWidth;
      L("STEP 3: inner offsetWidth ok");

      try {
        if (s1Sheet && s1Sheet.cssRules.length > 0) {
          L("STEP 4: deleteRule(0) after offsetWidth");
          s1Sheet.deleteRule(0);
          L("STEP 5: deleteRule(0) ok");
        }
      } catch (e) {
        L("ERR deleteRule: " + e);
      }

      delete FontFaceSet.prototype.then;
      L("STEP 6: getter returning");
      return undefined;
    }
  });

  var s2 = document.createElement("style");
  s2.textContent =
    "@font-face{font-family:'pf';src:url('nosource.otf')}" +
    ":host>span{font-family:'pf';font-size:20px;display:block}";
  sr.prepend(s2);

  L("STEP 0: triggering outer flush");
  void document.body.offsetWidth;
  L("DONE C8 (no crash)");
}

document.getElementById("go").addEventListener("click", function () {
  setTimeout(run, 0);
});
</script>
</body>
</html>
