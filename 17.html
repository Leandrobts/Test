<!DOCTYPE html>
<html>
<body>
<select id="a" style="display: table-column">
    <option>One</option>
</select>

<select id="b" style="display: table-column-group">
    <option>Two</option>
</select>

<pre id="result"></pre>

<script>
const a = document.getElementById("a");
const b = document.getElementById("b");

document.getElementById("result").textContent =
    "A: " + getComputedStyle(a).display + "\n" +
    "B: " + getComputedStyle(b).display + "\n" +
    "base-select suportado: " +
    CSS.supports("appearance", "base-select");
</script>
</body>
</html>
