<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>GraphicsLayerCA UAF - unapplying mask border</title>

<style>
:root {
    mask-border-source:
        repeating-radial-gradient(
            closest-side at 9px,
            blue 0% 68%
        );
}

*:read-write {
    column-width: 0;
    margin-bottom: 1000em;
    backdrop-filter: opacity(0%);
}
</style>

</head>

<body>

<video hidden controls>
</video>

<pre contenteditable>
This test passes if it does not crash
</pre>

<script>

/* ============================================================
 * Standalone adaptation of UIHelper.renderingUpdate()
 *
 * The original LayoutTest relies on WebKit's internal
 * rendering-update synchronization. A normal page has no
 * testRunner/UIController, so wait for multiple animation-frame
 * boundaries instead.
 * ============================================================ */

var UIHelper = {

    renderingUpdate: function () {

        return new Promise(function (resolve) {

            requestAnimationFrame(function () {

                requestAnimationFrame(function () {

                    /*
                     * Give style/layout/compositing work another
                     * opportunity to settle before continuing.
                     */
                    setTimeout(function () {
                        resolve();
                    }, 0);

                });

            });

        });

    }

};


/* ============================================================
 * Original test logic
 * ============================================================ */

function main()
{
    /*
     * Original:
     *
     * document.designMode = "on";
     */
    document.designMode = "on";


    /*
     * Preserve the asynchronous delay from the original test.
     */
    setTimeout(async function () {

        /*
         * Original:
         *
         * document.styleSheets[0].deleteRule(0);
         *
         * This removes the :root mask-border-source rule.
         */
        document.styleSheets[0].deleteRule(0);


        /*
         * Original:
         *
         * await UIHelper.renderingUpdate();
         *
         * Adapted only because the real UIHelper depends on
         * LayoutTest infrastructure.
         */
        await UIHelper.renderingUpdate();


        /*
         * No explicit success action is necessary.
         *
         * The original expected result is simply that the
         * browser reaches this point without crashing.
         */

    }, 0);
}


/*
 * Preserve the original body-onload trigger.
 */
window.addEventListener("load", main);

</script>

</body>
</html>
