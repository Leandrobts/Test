<!DOCTYPE html>
<html>
<body>
<p>PoC 12 - open + blur + close agressivo</p>
<div id="host"></div>
<div id="result"></div>
<script>
function gc() {
    function gcRec(n) {
        if (n < 1) return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable';
shadowRoot.appendChild(victim);
victim.focus();

document.addEventListener('blur', () => {
    victim.remove();
    victim = null;
    gc();
}, true);

setTimeout(() => {
    let wins = [];
    for (let i = 0; i < 3; i++) {
        try {
            let w = window.open('about:blank', '_blank', 'width=50,height=50,left='+(i*60));
            if (w) {
                wins.push(w);
                w.focus();
            }
        } catch(e) {}
    }
    setTimeout(() => {
        window.blur();
        wins.forEach(w => { try { w.close(); } catch(e) {} });
        setTimeout(() => {
            result.textContent = 'PASS (não crashou)';
        }, 100);
    }, 100);
}, 50);
</script>
</body>
</html>
