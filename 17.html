<!DOCTYPE html>
<html>
<head>
</head>
<body>
<p>This test passes if it does not crash.</p>
<iframe id="f" src="resources/xslt-import-delayed-subresource-target.xml"></iframe>
<script>
// Aguarda o carregamento inicial da árvore root e child
setTimeout(() => {
    try {
        const doc = document.getElementById('f').contentDocument;
        // Injeta e remove uma instrução de processamento XSL para forçar a compilação
        const pi = doc.createProcessingInstruction("xml-stylesheet", 'type="text/xsl" href="#x"');
        doc.insertBefore(pi, doc.firstChild);
        pi.remove();
    } catch (e) {
        console.log("Aviso de acesso cruzado:", e);
    }

    // Tempo de espera para o sub-recurso/neto atrasado
    setTimeout(() => {
        console.log("PASS if no crash.");
    }, 3000);
}, 500);
</script>
</body>
</html>
