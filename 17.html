<!DOCTYPE html>
<html>
<body>
    <button onclick="triggerUAF()">Trigger UAF</button><br><br>
    <iframe id="target_frame" width="100" height="100"></iframe>
    <div id="status"></div>
    <script>
      function triggerUAF() {
            var iframe = document.createElement("target_frame");
    document.body.appendChild(target_frame);

    var div = iframe.contentDocument.createElement("div");
    div.textContent = "TEST";
    iframe.contentDocument.body.appendChild(div);

    var contentDocument = iframe.contentDocument;

    try {
        div.webkitRequestFullscreen().catch(function () {});
    } catch (e) {
    }

    document.body.removeChild(iframe);

    setTimeout(function () {
        try {
            if (contentDocument.webkitCancelFullScreen)
                contentDocument.webkitCancelFullScreen();
        } catch (e) {
        }

        status.textContent = "PASS - no crash observed";
    }, 0);
};
</script>
</html>
