<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Teste de Regressão: Descarte Concorrente de Worker e runCleanupTasks</title>
</head>
<body>
<div id="status">Executando teste...</div>

<script>
// Função utilitária de GC via alocação recursiva de memória
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 1000; i++)
        gcRec(10);
}

function runWorkerRaceTest() {
    // Código do worker que enfileira microtarefas, timers e tarefas de limpeza contínuas
    const workerScript = `
        self.onmessage = function(e) {
            // Agenda tarefas pendentes no event loop
            setTimeout(() => {
                Promise.resolve().then(() => {
                    postMessage("ack");
                });
            }, 0);

            // Aloca objetos para estressar o escopo
            let buffer = new Uint8Array(1024 * 64);
        };
    `;

    const blobUrl = URL.createObjectURL(new Blob([workerScript], { type: "application/javascript" }));

    for (let cycle = 0; cycle < 150; cycle++) {
        // 1. Cria o worker
        const worker = new Worker(blobUrl);

        // 2. Despacha mensagem para iniciar o loop e enfileirar tarefas
        worker.postMessage("start");

        // 3. Força interrupção abrupta no mesmo tick ou em ticks imediatamente seguintes
        // Isso aciona WorkerDedicatedRunLoop::runCleanupTasks() concorrente com destroyWorkerGlobalScope()
        if (cycle % 2 === 0) {
            worker.terminate();
        } else {
            setTimeout(() => {
                worker.terminate();
            }, 0);
        }

        // 4. Dispara pressão no coletor para liberar a memória na heap
        if (cycle % 15 === 0) {
            gc();
        }
    }
}

try {
    runWorkerRaceTest();
    setTimeout(() => {
        gc();
        document.getElementById("status").innerText = "PASS: Workers criados e terminados abruptamente sem UAF em runCleanupTasks.";
    }, 100);
} catch (e) {
    document.getElementById("status").innerText = "FAIL: " + e.message;
}
</script>
</body>
</html>
