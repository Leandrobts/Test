<!DOCTYPE html>
<html>
<body>
<pre id="log"></pre>
<script>
function log(s) {
    document.getElementById("log").textContent += s + "\n";
}

var style = document.createElement("style");
document.head.appendChild(style);

var sheet = style.sheet;

try {
    sheet.insertRule(
        ".outer { color: red; & .nested { color: blue; } }",
        0
    );

    var parent = sheet.cssRules[0];

    log("Parent type: " + parent.constructor.name);
    log("Child count: " + parent.cssRules.length);

    var nested = parent.cssRules[0];

    log("Before delete: " +
        (nested.parentRule === parent));

    sheet.deleteRule(0);

    log("Sheet length: " + sheet.cssRules.length);

    log("After delete: " +
        (nested.parentRule === parent));

    log("Parent selector: " +
        nested.parentRule.selectorText);

} catch (e) {
    log("Exception: " + e.name + ": " + e.message);
}
</script>
</body>
</html>
