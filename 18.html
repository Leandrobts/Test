<!DOCTYPE html>
<html>
<body>
<p>PoC 13 - native pickers (date/color)</p>
<div id="host"></div>
<input type="date" id="date">
<input type="color" id="color">
<input type="time" id="time">
<div id="result"></div>
<script>
function gc() {
    function gcRec(n) {
        if (n < 1) return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable';
shadowRoot.appendChild(victim);
victim.focus();

document.addEventListener('blur', () => {
    victim.remove();
    victim = null;
    gc();
}, true);

setTimeout(() => {
    // tenta os três
    try { date.focus(); date.click(); } catch(e) {}
    try { color.focus(); color.click(); } catch(e) {}
    try { time.focus(); time.click(); } catch(e) {}

    setTimeout(() => {
        result.textContent = 'PASS (não crashou)';
    }, 400);
}, 100);
</script>
</body>
</html>
