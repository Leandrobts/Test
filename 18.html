<!DOCTYPE html>
<html>
<body>
<div id="host" style="display:none"></div>
<script>
var host = document.getElementById('host');
var sr = host.attachShadow({mode: 'open'});
sr.innerHTML = '<picture id="pic"><source srcset="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"><img></picture>';
var pic = sr.getElementById('pic');

pic.addEventListener('load', function listener() {
    pic.removeEventListener('load', listener, true);
    
    // Removendo a tag img de dentro do picture dispara o recálculo do ImageLoader
    pic.textContent = '';
    
    // Como o navegador antigo do PS4 suporta showModalDialog, ele vai abrir a janela
    // e disparar o loop aninhado que aciona o temporizador de liberação da imagem.
    try {
        showModalDialog('resources/self-closing-modal-dialog.html');
    } catch (e) {
        console.log("Erro ao abrir modal:", e);
    }

    setTimeout(function() {
        document.body.insertAdjacentHTML('beforeend', '<p>PASS if no crash.</p>');
    }, 0);
}, /*capture*/ true);
</script>
</body>
</html>
