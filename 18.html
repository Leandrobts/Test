<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Fullscreen Cancel Test</title>
</head>

<body>

<button id="start">START TEST</button>

<div id="status">Ready</div>

<iframe id="targetFrame" style="width:100px;height:100px;"></iframe>

<script>
(function () {
    var iframe = document.getElementById("targetFrame");
    var button = document.getElementById("start");
    var status = document.getElementById("status");

    // Prepara o conteúdo ANTES do teste.
    var iframeDocument = iframe.contentDocument;
    var target = iframeDocument.createElement("div");

    target.style.width = "100%";
    target.style.height = "100%";
    target.style.background = "lightgray";
    target.textContent = "Fullscreen target";

    iframeDocument.body.appendChild(target);

    status.textContent = "Ready - click START";

    button.onclick = function () {

        status.textContent = "Requesting fullscreen...";

        // Mantém a referência antes de remover o iframe.
        var detachedDocument = iframe.contentDocument;

        try {
            var promise = target.webkitRequestFullscreen();

            if (promise && promise.catch) {
                promise.catch(function () {
                    // A rejeição é esperada dependendo do estado do iframe.
                });
            }
        } catch (e) {
            status.textContent = "requestFullscreen exception: " + e;
        }

        // Remove imediatamente o dono do documento.
        iframe.parentNode.removeChild(iframe);

        status.textContent = "Iframe removed";

        // Executa posteriormente sobre o documento destacado.
        setTimeout(function () {

            status.textContent = "Calling webkitCancelFullScreen...";

            try {
                if (detachedDocument.webkitCancelFullScreen) {
                    detachedDocument.webkitCancelFullScreen();
                } else if (detachedDocument.cancelFullScreen) {
                    detachedDocument.cancelFullScreen();
                } else {
                    status.textContent = "Cancel fullscreen API unavailable";
                    return;
                }

                status.textContent = "Completed without visible crash";

            } catch (e) {
                status.textContent = "Exception: " + e;
            }

        }, 0);
    };

})();
</script>

</body>
</html>
