
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 WebKit FontFace Diagnostics</title>
</head>
<body>
<pre id="log"></pre>
<script>
(function () {
    var output = document.getElementById('log');

    function log(msg) {
        output.appendChild(
            document.createTextNode(msg + '\n')
        );
    }

    window.onerror = function (msg, url, line) {
        log('ERROR: ' + msg + ' line ' + line);
    };

    log('User Agent: ' + navigator.userAgent);
    log('FontFace: ' + typeof window.FontFace);
    log('document.fonts: ' + typeof document.fonts);
    log('Promise: ' + typeof window.Promise);

    var canvas = document.createElement('canvas');
    var ctx = canvas.getContext('2d');

    log('Canvas 2D: ' + !!ctx);

    if (!ctx || typeof window.FontFace !== 'function')
        return;

    var face;

    try {
        face = new FontFace(
            'PS4DiagnosticFont',
            'local(Helvetica)'
        );
        log('FontFace constructor: OK');
        log('Initial status: ' + face.status);
    } catch (e) {
        log('FontFace constructor ERROR: ' + e);
        return;
    }

    try {
        log('loaded property: ' + typeof face.loaded);
        log('load method: ' + typeof face.load);
    } catch (e) {
        log('FontFace properties ERROR: ' + e);
    }

    try {
        if (document.fonts) {
            document.fonts.add(face);
            log('document.fonts.add: OK');
        }
    } catch (e) {
        log('document.fonts.add ERROR: ' + e);
    }

    try {
        ctx.font = '20px PS4DiagnosticFont, Helvetica';
        log('ctx.font: ' + ctx.font);

        var a = ctx.measureText('x');
        var b = ctx.measureText('\uE005AB');

        log('measureText x: ' + a.width);
        log('measureText fallback: ' + b.width);
        log('Status after measureText: ' + face.status);
    } catch (e) {
        log('measureText ERROR: ' + e);
    }

    try {
        if (typeof face.load === 'function') {
            var p = face.load();
            log('face.load returned: ' + typeof p);

            if (p && typeof p.then === 'function') {
                p.then(function () {
                    log('Font loaded successfully');
                    log('Final status: ' + face.status);
                }, function (e) {
                    log('Font load rejected: ' + e);
                });
            }
        }
    } catch (e) {
        log('face.load ERROR: ' + e);
    }
})();
</script>
</body>
</html>
