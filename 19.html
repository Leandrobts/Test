<!DOCTYPE html>
<html>
<body>
<pre id="log"></pre>
<script>
var log = document.getElementById("log");

function print(s) {
    log.textContent += s + "\n";
}

function gcPressure() {
    var junk = [];

    for (var i = 0; i < 10000; i++) {
        junk.push({
            data: new Array(100).join("GC_TEST_" + i)
        });
    }

    junk = null;
}

print("WeakRef: " + typeof WeakRef);
print("FinalizationRegistry: " + typeof FinalizationRegistry);

if (typeof WeakRef === "function") {
    var obj = { test: 123 };
    var ref = new WeakRef(obj);

    obj = null;

    for (var i = 0; i < 5; i++)
        gcPressure();

    setTimeout(function() {
        print("Object alive: " + (ref.deref() !== undefined));
    }, 1000);
} else {
    print("WeakRef indisponivel");
}
</script>
</body>
</html>
