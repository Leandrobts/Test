<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>Stateful Lifetime Harness V9</title>

<style>
body {
    font-family: sans-serif;
    margin: 10px;
}

button {
    padding: 8px 18px;
    margin-right: 6px;
}

#status,
#campaign,
#recovery,
#objects,
#currentCase,
#log {
    margin-top: 10px;
    padding: 8px;
    border: 1px solid #777;
    font-family: monospace;
    white-space: pre-wrap;
}

#log {
    max-height: 400px;
    overflow: auto;
}

#testRoot {
    min-height: 180px;
    margin-top: 10px;
    padding: 10px;
    border: 1px solid #444;
}

.boxA {
    padding: 8px;
    margin: 3px;
    border: 1px solid #777;
}

.boxB {
    padding: 10px;
    margin: 5px;
    outline: 1px dotted black;
}

.boxC {
    display: inline-block;
    width: 40px;
    height: 25px;
    margin: 2px;
    border: 1px solid #555;
}
</style>
</head>

<body>

<h2>Stateful Lifetime Harness V9</h2>

<button id="startButton">START</button>
<button id="stopButton">STOP</button>

<div id="status">Idle</div>

<div id="campaign">
Campaign not started.
</div>

<div id="recovery">
Checking previous state...
</div>

<div id="currentCase">
No active case.
</div>

<div id="objects">
Object pool empty.
</div>

<div id="testRoot"></div>

<h3>Log</h3>
<div id="log"></div>

<script>

/* ============================================================
   CONFIGURATION
   ============================================================ */

var CONFIG = {

    storagePrefix:
        "StatefulLifetimeV9.",

    minOperations:
        8,

    maxOperations:
        18,

    maxObjects:
        5,

    operationDelay:
        40,

    caseDelay:
        250,

    asyncDelay:
        80,

    maxHistory:
        40
};


/* ============================================================
   GLOBAL STATE
   ============================================================ */

var State = {

    running:
        false,

    stopRequested:
        false,

    runId:
        0,

    caseId:
        0,

    seed:
        0,

    randomState:
        0,

    operationIndex:
        0,

    operations:
        [],

    objects:
        {},

    errors:
        0,

    events:
        0,

    invalidOperations:
        0,

    logStep:
        0,

    currentOperation:
        "",

    lastCompletedOperation:
        "",

    caseStarted:
        false,

    caseCompleted:
        false
};


/* ============================================================
   LOGGING
   ============================================================ */

function log(message)
{
    State.logStep++;

    var line =
        "[" +
        ("000000" + State.logStep).slice(-6) +
        "] " +
        message;

    var box =
        document.getElementById("log");

    box.textContent +=
        line + "\n";

    box.scrollTop =
        box.scrollHeight;

    console.log(line);
}


function setStatus(text)
{
    document
        .getElementById("status")
        .textContent =
        text;
}


function delay(callback, ms)
{
    setTimeout(
        callback,
        ms || CONFIG.operationDelay
    );
}


/* ============================================================
   STORAGE
   ============================================================ */

function storageSet(key, value)
{
    try
    {
        localStorage.setItem(
            CONFIG.storagePrefix + key,
            String(value)
        );
    }
    catch (e)
    {
    }
}


function storageGet(key)
{
    try
    {
        return localStorage.getItem(
            CONFIG.storagePrefix + key
        );
    }
    catch (e)
    {
        return null;
    }
}


/* ============================================================
   SERIALIZATION
   ============================================================ */

function serializeOperations()
{
    var result = [];

    var i;

    for (
        i = 0;
        i < State.operations.length;
        i++
    )
    {
        var op =
            State.operations[i];

        result.push(
            JSON.stringify(op)
        );
    }

    return result.join("\n");
}


function describeOperation(op)
{
    var text =
        op.type;

    if (op.id)
    {
        text +=
            " " +
            op.id;
    }

    if (op.target)
    {
        text +=
            " -> " +
            op.target;
    }

    if (op.elementType)
    {
        text +=
            " [" +
            op.elementType +
            "]";
    }

    return text;
}


/* ============================================================
   CHECKPOINT
   ============================================================ */

function saveCheckpoint()
{
    storageSet(
        "runId",
        State.runId
    );

    storageSet(
        "caseId",
        State.caseId
    );

    storageSet(
        "seed",
        State.seed
    );

    storageSet(
        "running",
        State.running ? "1" : "0"
    );

    storageSet(
        "caseStarted",
        State.caseStarted ? "1" : "0"
    );

    storageSet(
        "caseCompleted",
        State.caseCompleted ? "1" : "0"
    );

    storageSet(
        "operationIndex",
        State.operationIndex
    );

    storageSet(
        "operations",
        serializeOperations()
    );

    storageSet(
        "currentOperation",
        State.currentOperation
    );

    storageSet(
        "lastCompletedOperation",
        State.lastCompletedOperation
    );

    storageSet(
        "timestamp",
        new Date().getTime()
    );
}


/* ============================================================
   RECOVERY
   ============================================================ */

function recoverPreviousCase()
{
    var box =
        document.getElementById(
            "recovery"
        );

    var started =
        storageGet("caseStarted");

    var completed =
        storageGet("caseCompleted");

    if (
        started !== "1" ||
        completed === "1"
    )
    {
        box.textContent =
            "No incomplete case detected.";

        return;
    }

    var runId =
        storageGet("runId");

    var caseId =
        storageGet("caseId");

    var seed =
        storageGet("seed");

    var index =
        storageGet("operationIndex");

    var current =
        storageGet("currentOperation");

    var last =
        storageGet("lastCompletedOperation");

    var operations =
        storageGet("operations");

    box.textContent =
        "PREVIOUS CASE INCOMPLETE\n\n" +
        "Run: " + runId + "\n" +
        "Case: " + caseId + "\n" +
        "Seed: " + seed + "\n" +
        "Operation: " + index + "\n\n" +
        "Current:\n" +
        current +
        "\n\nLast completed:\n" +
        last +
        "\n\nSequence:\n" +
        operations;
}


/* ============================================================
   PRNG
   ============================================================ */

function setSeed(seed)
{
    State.seed =
        seed >>> 0;

    State.randomState =
        State.seed;
}


function seededRandom()
{
    State.randomState =
        (
            State.randomState *
            1664525 +
            1013904223
        ) >>> 0;

    return (
        State.randomState /
        4294967296
    );
}


function randomIndex(length)
{
    return Math.floor(
        seededRandom() *
        length
    );
}


function generateSeed()
{
    var previous =
        parseInt(
            storageGet("seed") || "1",
            10
        );

    var value =
        (
            new Date().getTime() ^
            previous ^
            Math.floor(
                Math.random() *
                0x7fffffff
            )
        ) >>> 0;

    if (!value)
        value = 1;

    return value;
}


/* ============================================================
   OBJECT POOL
   ============================================================ */

function resetObjectPool()
{
    State.objects = {};
}


function getObject(id)
{
    return State.objects[id] || null;
}


function objectExists(id)
{
    return !!getObject(id);
}


function objectIsAttached(id)
{
    var object =
        getObject(id);

    return (
        object &&
        object.state === "ATTACHED"
    );
}


function objectIsDetached(id)
{
    var object =
        getObject(id);

    return (
        object &&
        object.state === "DETACHED"
    );
}


function availableObjectIds()
{
    var ids = [];

    var id;

    for (id in State.objects)
    {
        if (
            State.objects.hasOwnProperty(id)
        )
        {
            ids.push(id);
        }
    }

    return ids;
}


function attachedObjectIds()
{
    var ids = [];
    var id;

    for (id in State.objects)
    {
        if (
            State.objects.hasOwnProperty(id) &&
            State.objects[id].state ===
            "ATTACHED"
        )
        {
            ids.push(id);
        }
    }

    return ids;
}


function detachedObjectIds()
{
    var ids = [];
    var id;

    for (id in State.objects)
    {
        if (
            State.objects.hasOwnProperty(id) &&
            State.objects[id].state ===
            "DETACHED"
        )
        {
            ids.push(id);
        }
    }

    return ids;
}


/* ============================================================
   OBJECT DISPLAY
   ============================================================ */

function updateObjectDisplay()
{
    var lines = [];

    var id;

    for (id in State.objects)
    {
        if (
            State.objects.hasOwnProperty(id)
        )
        {
            var object =
                State.objects[id];

            lines.push(
                id +
                " | " +
                object.type +
                " | " +
                object.state +
                " | listeners=" +
                object.listeners +
                " | async=" +
                object.asyncPending
            );
        }
    }

    if (!lines.length)
    {
        lines.push(
            "Object pool empty."
        );
    }

    document
        .getElementById(
            "objects"
        )
        .textContent =
        lines.join("\n");
}


/* ============================================================
   CLEANUP
   ============================================================ */

function cleanup()
{
    var root =
        document.getElementById(
            "testRoot"
        );

    while (root.firstChild)
    {
        root.removeChild(
            root.firstChild
        );
    }
}


/* ============================================================
   OPERATION GENERATION
   ============================================================ */

var ELEMENT_TYPES = [
    "div",
    "input",
    "span",
    "button"
];


var OBJECT_NAMES = [
    "A",
    "B",
    "C",
    "D",
    "E"
];


var OPERATION_TYPES = [

    "CREATE",

    "ATTACH",

    "DETACH",

    "REPLACE",

    "MUTATE",

    "LISTEN",

    "DISPATCH",

    "FOCUS",

    "BLUR",

    "LAYOUT",

    "SCHEDULE",

    "ACCESS"
];


function randomObjectName()
{
    return OBJECT_NAMES[
        randomIndex(
            OBJECT_NAMES.length
        )
    ];
}


function randomElementType()
{
    return ELEMENT_TYPES[
        randomIndex(
            ELEMENT_TYPES.length
        )
    ];
}


/*
 * O gerador trabalha sobre um modelo lógico separado.
 * Isso permite gerar operações coerentes sem executar
 * a operação real durante a geração.
 */

function createGeneratorModel()
{
    return {};
}


function modelIds(model)
{
    var ids = [];
    var id;

    for (id in model)
    {
        if (
            model.hasOwnProperty(id)
        )
        {
            ids.push(id);
        }
    }

    return ids;
}


function modelAttachedIds(model)
{
    var ids = [];
    var id;

    for (id in model)
    {
        if (
            model.hasOwnProperty(id) &&
            model[id].state === "ATTACHED"
        )
        {
            ids.push(id);
        }
    }

    return ids;
}


function modelDetachedIds(model)
{
    var ids = [];
    var id;

    for (id in model)
    {
        if (
            model.hasOwnProperty(id) &&
            model[id].state === "DETACHED"
        )
        {
            ids.push(id);
        }
    }

    return ids;
}


function chooseFrom(list)
{
    if (!list.length)
        return null;

    return list[
        randomIndex(
            list.length
        )
    ];
}


function generateOperation(model)
{
    var ids =
        modelIds(model);

    var attached =
        modelAttachedIds(model);

    var detached =
        modelDetachedIds(model);

    var candidates = [];

    if (
        ids.length <
        CONFIG.maxObjects
    )
    {
        candidates.push("CREATE");
    }

    if (detached.length)
    {
        candidates.push("ATTACH");
    }

    if (attached.length)
    {
        candidates.push(
            "DETACH"
        );

        candidates.push(
            "MUTATE"
        );

        candidates.push(
            "LISTEN"
        );

        candidates.push(
            "DISPATCH"
        );

        candidates.push(
            "FOCUS"
        );

        candidates.push(
            "BLUR"
        );

        candidates.push(
            "LAYOUT"
        );

        candidates.push(
            "SCHEDULE"
        );
    }

    if (ids.length)
    {
        candidates.push(
            "ACCESS"
        );
    }

    if (
        attached.length >= 2
    )
    {
        candidates.push(
            "REPLACE"
        );
    }

    if (!candidates.length)
    {
        return {
            type: "CREATE",
            id: randomObjectName(),
            elementType:
                randomElementType()
        };
    }

    var type =
        chooseFrom(candidates);

    var id;
    var target;

    if (type === "CREATE")
    {
        var available = [];

        var i;

        for (
            i = 0;
            i < OBJECT_NAMES.length;
            i++
        )
        {
            if (
                !model[
                    OBJECT_NAMES[i]
                ]
            )
            {
                available.push(
                    OBJECT_NAMES[i]
                );
            }
        }

        if (!available.length)
        {
            type = "MUTATE";
        }
        else
        {
            id =
                chooseFrom(available);

            model[id] = {
                state: "DETACHED"
            };

            return {
                type: "CREATE",
                id: id,
                elementType:
                    randomElementType()
            };
        }
    }

    if (type === "ATTACH")
    {
        id =
            chooseFrom(detached);

        model[id].state =
            "ATTACHED";

        return {
            type: "ATTACH",
            id: id
        };
    }

    if (type === "DETACH")
    {
        id =
            chooseFrom(attached);

        model[id].state =
            "DETACHED";

        return {
            type: "DETACH",
            id: id
        };
    }

    if (type === "REPLACE")
    {
        id =
            chooseFrom(attached);

        var alternatives =
            attached.filter(
                function(value)
                {
                    return value !== id;
                }
            );

        target =
            chooseFrom(
                alternatives
            );

        model[id].state =
            "DETACHED";

        return {
            type: "REPLACE",
            id: id,
            target: target
        };
    }

    if (type === "MUTATE")
    {
        id =
            chooseFrom(attached);

        return {
            type: "MUTATE",
            id: id
        };
    }

    if (type === "LISTEN")
    {
        id =
            chooseFrom(attached);

        return {
            type: "LISTEN",
            id: id
        };
    }

    if (type === "DISPATCH")
    {
        id =
            chooseFrom(attached);

        return {
            type: "DISPATCH",
            id: id
        };
    }

    if (type === "FOCUS")
    {
        id =
            chooseFrom(attached);

        return {
            type: "FOCUS",
            id: id
        };
    }

    if (type === "BLUR")
    {
        id =
            chooseFrom(attached);

        return {
            type: "BLUR",
            id: id
        };
    }

    if (type === "LAYOUT")
    {
        id =
            chooseFrom(attached);

        return {
            type: "LAYOUT",
            id: id
        };
    }

    if (type === "SCHEDULE")
    {
        id =
            chooseFrom(attached);

        return {
            type: "SCHEDULE",
            id: id
        };
    }

    if (type === "ACCESS")
    {
        id =
            chooseFrom(ids);

        return {
            type: "ACCESS",
            id: id
        };
    }

    return {
        type: "CREATE",
        id: randomObjectName(),
        elementType:
            randomElementType()
    };
}


function generateSequence()
{
    var model =
        createGeneratorModel();

    var count =
        CONFIG.minOperations +
        randomIndex(
            CONFIG.maxOperations -
            CONFIG.minOperations +
            1
        );

    var sequence = [];

    var i;

    for (
        i = 0;
        i < count;
        i++
    )
    {
        sequence.push(
            generateOperation(
                model
            )
        );
    }

    return sequence;
}


/* ============================================================
   OPERATION EXECUTION
   ============================================================ */

function executeOperation(op)
{
    State.currentOperation =
        describeOperation(op);

    saveCheckpoint();

    log(
        "BEGIN | " +
        State.currentOperation
    );

    try
    {
        if (
            op.type === "CREATE"
        )
        {
            executeCreate(op);
        }

        else if (
            op.type === "ATTACH"
        )
        {
            executeAttach(op);
        }

        else if (
            op.type === "DETACH"
        )
        {
            executeDetach(op);
        }

        else if (
            op.type === "REPLACE"
        )
        {
            executeReplace(op);
        }

        else if (
            op.type === "MUTATE"
        )
        {
            executeMutate(op);
        }

        else if (
            op.type === "LISTEN"
        )
        {
            executeListen(op);
        }

        else if (
            op.type === "DISPATCH"
        )
        {
            executeDispatch(op);
        }

        else if (
            op.type === "FOCUS"
        )
        {
            executeFocus(op);
        }

        else if (
            op.type === "BLUR"
        )
        {
            executeBlur(op);
        }

        else if (
            op.type === "LAYOUT"
        )
        {
            executeLayout(op);
        }

        else if (
            op.type === "SCHEDULE"
        )
        {
            executeSchedule(op);
        }

        else if (
            op.type === "ACCESS"
        )
        {
            executeAccess(op);
        }

        State.lastCompletedOperation =
            State.currentOperation;

        saveCheckpoint();

        log(
            "OK    | " +
            State.currentOperation
        );
    }
    catch (e)
    {
        State.errors++;

        log(
            "ERROR | " +
            State.currentOperation +
            " | " +
            e.name
        );

        saveCheckpoint();
    }

    updateObjectDisplay();
}


/* ============================================================
   CREATE
   ============================================================ */

function executeCreate(op)
{
    if (objectExists(op.id))
    {
        State.invalidOperations++;
        return;
    }

    var element =
        document.createElement(
            op.elementType
        );

    element.className =
        "boxA";

    element.textContent =
        op.id;

    State.objects[op.id] = {

        id:
            op.id,

        type:
            op.elementType,

        element:
            element,

        state:
            "DETACHED",

        listeners:
            0,

        asyncPending:
            0,

        mutationCount:
            0
    };
}


/* ============================================================
   ATTACH
   ============================================================ */

function executeAttach(op)
{
    var object =
        getObject(op.id);

    if (!object)
    {
        State.invalidOperations++;
        return;
    }

    var root =
        document.getElementById(
            "testRoot"
        );

    if (
        object.element.parentNode
    )
    {
        object.element.parentNode.removeChild(
            object.element
        );
    }

    root.appendChild(
        object.element
    );

    object.state =
        "ATTACHED";
}


/* ============================================================
   DETACH
   ============================================================ */

function executeDetach(op)
{
    var object =
        getObject(op.id);

    if (!object)
    {
        State.invalidOperations++;
        return;
    }

    if (
        object.element.parentNode
    )
    {
        object.element.parentNode.removeChild(
            object.element
        );
    }

    object.state =
        "DETACHED";
}


/* ============================================================
   REPLACE
   ============================================================ */

function executeReplace(op)
{
    var source =
        getObject(op.id);

    var target =
        getObject(op.target);

    if (
        !source ||
        !target
    )
    {
        State.invalidOperations++;
        return;
    }

    if (
        !source.element.parentNode
    )
    {
        State.invalidOperations++;
        return;
    }

    source.element.parentNode.replaceChild(
        target.element,
        source.element
    );

    source.state =
        "DETACHED";

    target.state =
        "ATTACHED";
}


/* ============================================================
   MUTATE
   ============================================================ */

function executeMutate(op)
{
    var object =
        getObject(op.id);

    if (!object)
    {
        State.invalidOperations++;
        return;
    }

    object.mutationCount++;

    object.element.className =
        object.mutationCount % 2 ?
        "boxB" :
        "boxA";

    object.element.setAttribute(
        "data-v9-mutation",
        String(
            object.mutationCount
        )
    );

    object.element.textContent =
        op.id +
        " mutation " +
        object.mutationCount;
}


/* ============================================================
   LISTEN
   ============================================================ */

function executeListen(op)
{
    var object =
        getObject(op.id);

    if (!object)
    {
        State.invalidOperations++;
        return;
    }

    var element =
        object.element;

    element.addEventListener(
        "v9-event",
        function()
        {
            State.events++;

            log(
                "EVENT | " +
                op.id
            );
        },
        false
    );

    object.listeners++;
}


/* ============================================================
   DISPATCH
   ============================================================ */

function executeDispatch(op)
{
    var object =
        getObject(op.id);

    if (!object)
    {
        State.invalidOperations++;
        return;
    }

    var event =
        document.createEvent(
            "Event"
        );

    event.initEvent(
        "v9-event",
        true,
        true
    );

    object.element.dispatchEvent(
        event
    );
}


/* ============================================================
   FOCUS
   ============================================================ */

function executeFocus(op)
{
    var object =
        getObject(op.id);

    if (!object)
    {
        State.invalidOperations++;
        return;
    }

    if (
        typeof object.element.focus ===
        "function"
    )
    {
        object.element.focus();
    }
}


/* ============================================================
   BLUR
   ============================================================ */

function executeBlur(op)
{
    var object =
        getObject(op.id);

    if (!object)
    {
        State.invalidOperations++;
        return;
    }

    if (
        typeof object.element.blur ===
        "function"
    )
    {
        object.element.blur();
    }
}


/* ============================================================
   LAYOUT
   ============================================================ */

function executeLayout(op)
{
    var object =
        getObject(op.id);

    if (!object)
    {
        State.invalidOperations++;
        return;
    }

    var width =
        object.element.offsetWidth;

    var rect =
        object.element.getBoundingClientRect();

    log(
        "LAYOUT | " +
        op.id +
        " | " +
        width +
        " | " +
        rect.width
    );
}


/* ============================================================
   SCHEDULE
   ============================================================ */

function executeSchedule(op)
{
    var object =
        getObject(op.id);

    if (!object)
    {
        State.invalidOperations++;
        return;
    }

    object.asyncPending++;

    setTimeout(
        function()
        {
            object.asyncPending--;

            State.events++;

            try
            {
                log(
                    "ASYNC | " +
                    op.id +
                    " | connected=" +
                    !!object.element.parentNode
                );
            }
            catch (e)
            {
                log(
                    "ASYNC ERROR | " +
                    e.name
                );
            }

            updateObjectDisplay();
        },
        CONFIG.asyncDelay
    );
}


/* ============================================================
   ACCESS
   ============================================================ */

function executeAccess(op)
{
    var object =
        getObject(op.id);

    if (!object)
    {
        State.invalidOperations++;
        return;
    }

    var text =
        object.element.textContent;

    var connected =
        !!object.element.parentNode;

    log(
        "ACCESS | " +
        op.id +
        " | connected=" +
        connected +
        " | text=" +
        text
    );
}


/* ============================================================
   CASE RESET
   ============================================================ */

function resetCase()
{
    State.operationIndex = 0;

    State.errors = 0;

    State.events = 0;

    State.invalidOperations = 0;

    State.currentOperation = "";

    State.lastCompletedOperation = "";

    State.caseStarted = false;

    State.caseCompleted = false;

    cleanup();

    resetObjectPool();
}


/* ============================================================
   DISPLAY
   ============================================================ */

function updateCampaignDisplay()
{
    document
        .getElementById(
            "campaign"
        )
        .textContent =
        "RUN: " +
        State.runId +
        "\nCASE: " +
        State.caseId +
        "\nSEED: " +
        State.seed +
        "\nRUNNING: " +
        State.running;
}


function updateCaseDisplay()
{
    var lines = [];

    var i;

    for (
        i = 0;
        i < State.operations.length;
        i++
    )
    {
        var prefix =
            i === State.operationIndex ?
            ">> " :
            "   ";

        lines.push(
            prefix +
            "#" +
            ("00" + (i + 1)).slice(-2) +
            " " +
            describeOperation(
                State.operations[i]
            )
        );
    }

    document
        .getElementById(
            "currentCase"
        )
        .textContent =
        "CASE " +
        State.caseId +
        "\n\n" +
        lines.join("\n") +
        "\n\nCURRENT:\n" +
        State.currentOperation +
        "\n\nLAST COMPLETED:\n" +
        State.lastCompletedOperation +
        "\n\nERRORS: " +
        State.errors +
        "\nEVENTS: " +
        State.events +
        "\nINVALID: " +
        State.invalidOperations;
}


/* ============================================================
   CASE EXECUTOR
   ============================================================ */

function executeCase(done)
{
    resetCase();

    State.caseStarted =
        true;

    State.caseCompleted =
        false;

    saveCheckpoint();

    log("");
    log(
        "================================"
    );
    log(
        "CASE START | " +
        State.caseId
    );
    log(
        "SEED | " +
        State.seed
    );

    updateCaseDisplay();

    function next()
    {
        if (
            State.stopRequested
        )
        {
            done("STOPPED");
            return;
        }

        if (
            State.operationIndex >=
            State.operations.length
        )
        {
            State.caseCompleted =
                true;

            saveCheckpoint();

            log(
                "CASE COMPLETED"
            );

            log(
                "ERRORS | " +
                State.errors
            );

            log(
                "EVENTS | " +
                State.events
            );

            log(
                "INVALID | " +
                State.invalidOperations
            );

            done("COMPLETED");

            return;
        }

        var op =
            State.operations[
                State.operationIndex
            ];

        State.currentOperation =
            describeOperation(op);

        saveCheckpoint();

        updateCaseDisplay();

        executeOperation(op);

        State.operationIndex++;

        saveCheckpoint();

        updateCaseDisplay();

        delay(next);
    }

    next();
}


/* ============================================================
   CAMPAIGN
   ============================================================ */

function startCampaign()
{
    if (State.running)
        return;

    State.running = true;

    State.stopRequested = false;

    State.runId++;

    State.logStep = 0;

    saveCheckpoint();

    setStatus(
        "Campaign running"
    );

    log(
        "V9 STATEFUL CAMPAIGN START"
    );

    function nextCase()
    {
        if (
            State.stopRequested
        )
        {
            State.running =
                false;

            saveCheckpoint();

            setStatus(
                "Stopped"
            );

            log(
                "CAMPAIGN STOPPED"
            );

            return;
        }

        State.caseId++;

        State.seed =
            generateSeed();

        setSeed(
            State.seed
        );

        State.operations =
            generateSequence();

        saveCheckpoint();

        updateCampaignDisplay();

        executeCase(
            function(result)
            {
                if (
                    result === "STOPPED"
                )
                {
                    State.running =
                        false;

                    saveCheckpoint();

                    setStatus(
                        "Stopped"
                    );

                    return;
                }

                cleanup();

                updateObjectDisplay();

                delay(
                    nextCase,
                    CONFIG.caseDelay
                );
            }
        );
    }

    nextCase();
}


/* ============================================================
   STOP
   ============================================================ */

function stopCampaign()
{
    if (!State.running)
        return;

    State.stopRequested =
        true;

    setStatus(
        "Stopping..."
    );

    log(
        "STOP REQUESTED"
    );
}


/* ============================================================
   INITIALIZATION
   ============================================================ */

State.runId =
    parseInt(
        storageGet("runId") || "0",
        10
    );

State.caseId =
    parseInt(
        storageGet("caseId") || "0",
        10
    );

if (
    isNaN(State.runId)
)
{
    State.runId = 0;
}

if (
    isNaN(State.caseId)
)
{
    State.caseId = 0;
}


document
    .getElementById(
        "startButton"
    )
    .addEventListener(
        "click",
        function()
        {
            startCampaign();
        },
        false
    );


document
    .getElementById(
        "stopButton"
    )
    .addEventListener(
        "click",
        function()
        {
            stopCampaign();
        },
        false
    );


log(
    "V9 INITIALIZED"
);

recoverPreviousCase();

updateCampaignDisplay();

updateCaseDisplay();

updateObjectDisplay();

</script>
