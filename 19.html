

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 FontFace Reentrancy Diagnostic</title>
</head>
<body>
<pre id="log"></pre>
<script>
(function () {
    var out = document.getElementById('log');
    var insideMeasure = false;
    var getterCalls = 0;
    var face;

    function log(s) {
        out.appendChild(document.createTextNode(s + '\n'));
    }

    window.onerror = function (msg) {
        log('ERROR: ' + msg);
    };

    Object.defineProperty(FontFace.prototype, 'then', {
        configurable: true,
        get: function () {
            getterCalls++;

            log('THEN GETTER #' + getterCalls);
            log('During measureText: ' + insideMeasure);

            return undefined;
        }
    });

    face = new FontFace(
        'PS4TestFont',
        'local(Helvetica)'
    );

    log('Initial status: ' + face.status);

    face.loaded.then(function () {
        log('LOADED PROMISE RESOLVED');
    }, function (e) {
        log('PROMISE REJECTED: ' + e);
    });

    document.fonts.add(face);

    var canvas = document.createElement('canvas');
    var ctx = canvas.getContext('2d');

    ctx.font = '20px PS4TestFont, Helvetica';

    log('Starting measureText');

    insideMeasure = true;

    try {
        ctx.measureText('\uE005AB');
    } catch (e) {
        log('MEASURE ERROR: ' + e);
    } finally {
        insideMeasure = false;
    }

    log('Finished measureText');
    log('Status: ' + face.status);
    log('Getter calls so far: ' + getterCalls);

    setTimeout(function () {
        log('FINAL GETTER CALLS: ' + getterCalls);
        log('FINAL STATUS: ' + face.status);
    }, 1000);
})();
</script>
</body>
</html>
