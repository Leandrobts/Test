<!DOCTYPE html>
<html>
<head>
<style>

#target {
    width: 100px;
    height: 100px;
    background: red;
}

.scroller {
    overflow: scroll;
    width: 50px;
    height: 50px;
}

.scroller > div {
    height: 400px;
}

</style>
</head>

<body>

<div id="target">PASS if this does not crash.</div>

<script>

(async function() {

    let extraTimelines = [];

    for (let i = 0; i < 32; i++) {
        const source = document.createElement('div');
        source.className = 'scroller';
        source.appendChild(document.createElement('div'));
        document.body.appendChild(source);
        extraTimelines.push(new ScrollTimeline({ source }));
    }

    let pending = [];

    for (let i = 0; i < 200; i++) {
        const scroller = document.createElement('div');
        scroller.className = 'scroller';
        scroller.appendChild(document.createElement('div'));
        document.body.appendChild(scroller);
        pending.push(scroller);
    }

    let animation = target.animate(
        { transform: 'translateX(50%)' },
        1000000
    );

    await new Promise(requestAnimationFrame);
    await new Promise(requestAnimationFrame);

    animation.effect.setKeyframes({
        transform: 'translateX(100%)'
    });

    getComputedStyle(target).transform;
    target.offsetWidth;

    for (let i = 0; i < pending.length; i++)
        pending[i].style.scrollTimelineName = '--st' + i;

    if (window.internals && internals.suspendAnimations)
        internals.suspendAnimations();

    document.body.innerHTML += '<br>PASS if this does not crash.';

})();

</script>

</body>
</html>
