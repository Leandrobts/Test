<!DOCTYPE html>
<html>
<body>
<p>PoC 14 - sem Shadow DOM</p>
<div id="result"></div>
<script>
function gc() {
    function gcRec(n) {
        if (n < 1) return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable';
document.body.appendChild(victim);
victim.focus();

document.addEventListener('blur', () => {
    victim.remove();
    victim = null;
    gc();
}, true);

setTimeout(() => {
    // tenta vários métodos em sequência
    try { window.blur(); } catch(e) {}
    try { alert('x'); } catch(e) {}
    try {
        let w = window.open('about:blank', '_blank', 'width=40,height=40');
        if (w) { w.focus(); setTimeout(() => w.close(), 30); }
    } catch(e) {}

    setTimeout(() => {
        result.textContent = 'PASS (não crashou)';
    }, 300);
}, 50);
</script>
</body>
</html>
