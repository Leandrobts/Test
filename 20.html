<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Stateful Structured Harness V10</title>

<style>
body {
    font-family: sans-serif;
    margin: 10px;
}

button {
    padding: 8px 16px;
    margin-right: 6px;
}

.panel {
    border: 1px solid #777;
    padding: 8px;
    margin-top: 10px;
    white-space: pre-wrap;
    font-family: monospace;
}

#log {
    max-height: 350px;
    overflow: auto;
}

#testRoot {
    min-height: 150px;
    border: 1px solid #444;
    padding: 8px;
    margin-top: 10px;
}

.box {
    padding: 6px;
    margin: 3px;
    border: 1px solid #888;
}
</style>
</head>

<body>

<h2>Stateful Structured Harness V10</h2>

<button onclick="startCampaign()">START</button>
<button onclick="stopCampaign()">STOP</button>

<div id="status" class="panel">Idle</div>
<div id="campaign" class="panel"></div>
<div id="caseInfo" class="panel"></div>
<div id="corpusInfo" class="panel"></div>

<div id="testRoot"></div>

<div id="log" class="panel"></div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */

var CONFIG = {
    prefix: "StatefulV10.",
    minOps: 8,
    maxOps: 20,
    maxObjects: 5,
    operationDelay: 35,
    caseDelay: 200,
    asyncDelay: 60,
    maxCorpus: 50,
    mutationProbability: 0.75
};


/* ============================================================
   STATE
   ============================================================ */

var State = {
    running: false,
    stopRequested: false,

    runId: 0,
    caseId: 0,

    seed: 0,
    randomState: 0,

    operations: [],
    operationIndex: 0,

    objects: {},

    corpus: [],

    sourceType: "",
    sourceCorpusId: -1,
    mutation: "",

    errors: 0,
    events: 0,
    invalid: 0,

    currentOperation: "",
    lastCompletedOperation: ""
};


/* ============================================================
   STORAGE
   ============================================================ */

function key(name)
{
    return CONFIG.prefix + name;
}

function setStore(name, value)
{
    try {
        localStorage.setItem(
            key(name),
            value
        );
    } catch (e) {
    }
}

function getStore(name)
{
    try {
        return localStorage.getItem(
            key(name)
        );
    } catch (e) {
        return null;
    }
}


/* ============================================================
   LOG
   ============================================================ */

function log(text)
{
    var box =
        document.getElementById("log");

    box.textContent +=
        text + "\n";

    box.scrollTop =
        box.scrollHeight;

    console.log(text);
}

function status(text)
{
    document
        .getElementById("status")
        .textContent =
        text;
}


/* ============================================================
   RNG
   ============================================================ */

function setSeed(seed)
{
    State.seed =
        seed >>> 0;

    State.randomState =
        State.seed;
}

function rnd()
{
    State.randomState =
        (
            State.randomState * 1664525 +
            1013904223
        ) >>> 0;

    return (
        State.randomState /
        4294967296
    );
}

function pick(array)
{
    if (!array.length)
        return null;

    return array[
        Math.floor(
            rnd() * array.length
        )
    ];
}

function newSeed()
{
    return (
        Date.now() ^
        Math.floor(Math.random() * 0x7fffffff)
    ) >>> 0;
}


/* ============================================================
   CORPUS
   ============================================================ */

function loadCorpus()
{
    var raw =
        getStore("corpus");

    if (!raw) {
        State.corpus = [];
        return;
    }

    try {
        State.corpus =
            JSON.parse(raw);

        if (
            !Array.isArray(State.corpus)
        ) {
            State.corpus = [];
        }
    }
    catch (e) {
        State.corpus = [];
    }
}

function saveCorpus()
{
    try {
        setStore(
            "corpus",
            JSON.stringify(
                State.corpus
            )
        );
    }
    catch (e) {
    }
}

function cloneSequence(sequence)
{
    return JSON.parse(
        JSON.stringify(sequence)
    );
}

function addToCorpus(sequence, reason)
{
    var entry = {
        id: Date.now(),
        sequence:
            cloneSequence(sequence),
        reason: reason,
        seed: State.seed,
        length: sequence.length
    };

    State.corpus.push(entry);

    while (
        State.corpus.length >
        CONFIG.maxCorpus
    ) {
        State.corpus.shift();
    }

    saveCorpus();
}


/* ============================================================
   PRIMITIVES
   ============================================================ */

var OBJECT_NAMES = [
    "A", "B", "C", "D", "E"
];

var ELEMENT_TYPES = [
    "div",
    "span",
    "input",
    "button"
];

var TYPES = [
    "CREATE",
    "ATTACH",
    "DETACH",
    "REPLACE",
    "MUTATE",
    "LISTEN",
    "DISPATCH",
    "FOCUS",
    "BLUR",
    "LAYOUT",
    "SCHEDULE",
    "ACCESS"
];


function modelIds(model)
{
    return Object.keys(model);
}

function attachedIds(model)
{
    var result = [];

    var id;

    for (id in model) {
        if (
            model[id].state ===
            "ATTACHED"
        ) {
            result.push(id);
        }
    }

    return result;
}

function detachedIds(model)
{
    var result = [];

    var id;

    for (id in model) {
        if (
            model[id].state ===
            "DETACHED"
        ) {
            result.push(id);
        }
    }

    return result;
}


/* ============================================================
   VALID SEQUENCE GENERATOR
   ============================================================ */

function generateOperation(model)
{
    var ids =
        modelIds(model);

    var attached =
        attachedIds(model);

    var detached =
        detachedIds(model);

    var choices = [];

    if (
        ids.length <
        CONFIG.maxObjects
    ) {
        choices.push("CREATE");
    }

    if (detached.length)
        choices.push("ATTACH");

    if (attached.length) {
        choices.push(
            "DETACH",
            "MUTATE",
            "LISTEN",
            "DISPATCH",
            "FOCUS",
            "BLUR",
            "LAYOUT",
            "SCHEDULE"
        );
    }

    if (ids.length)
        choices.push("ACCESS");

    if (
        attached.length >= 2
    ) {
        choices.push("REPLACE");
    }

    if (!choices.length) {
        choices.push("CREATE");
    }

    var type =
        pick(choices);

    if (type === "CREATE") {

        var available =
            OBJECT_NAMES.filter(
                function(id) {
                    return !model[id];
                }
            );

        if (!available.length)
            type = "ACCESS";
        else {
            var newId =
                pick(available);

            model[newId] = {
                state: "DETACHED"
            };

            return {
                type: "CREATE",
                id: newId,
                elementType:
                    pick(ELEMENT_TYPES)
            };
        }
    }

    if (type === "ATTACH") {

        var attachId =
            pick(detached);

        model[attachId].state =
            "ATTACHED";

        return {
            type: "ATTACH",
            id: attachId
        };
    }

    if (type === "DETACH") {

        var detachId =
            pick(attached);

        model[detachId].state =
            "DETACHED";

        return {
            type: "DETACH",
            id: detachId
        };
    }

    if (type === "REPLACE") {

        var source =
            pick(attached);

        var targets =
            attached.filter(
                function(id) {
                    return id !== source;
                }
            );

        var target =
            pick(targets);

        model[source].state =
            "DETACHED";

        return {
            type: "REPLACE",
            id: source,
            target: target
        };
    }

    var availableIds =
        ids.length ?
        ids :
        OBJECT_NAMES;

    return {
        type: type,
        id: pick(
            type === "ACCESS"
                ? availableIds
                : attached
        )
    };
}

function generateSequence()
{
    var model = {};

    var count =
        CONFIG.minOps +
        Math.floor(
            rnd() *
            (
                CONFIG.maxOps -
                CONFIG.minOps +
                1
            )
        );

    var result = [];

    var i;

    for (
        i = 0;
        i < count;
        i++
    ) {
        result.push(
            generateOperation(model)
        );
    }

    return result;
}


/* ============================================================
   MUTATION ENGINE
   ============================================================ */

function mutateInsert(sequence)
{
    var result =
        cloneSequence(sequence);

    var index =
        Math.floor(
            rnd() *
            (result.length + 1)
        );

    var seedModel = {};

    result.forEach(
        function(op) {

            if (
                op.type === "CREATE"
            ) {
                seedModel[op.id] = {
                    state: "DETACHED"
                };
            }

            if (
                op.type === "ATTACH" &&
                seedModel[op.id]
            ) {
                seedModel[op.id].state =
                    "ATTACHED";
            }

            if (
                op.type === "DETACH" &&
                seedModel[op.id]
            ) {
                seedModel[op.id].state =
                    "DETACHED";
            }
        }
    );

    var op =
        generateOperation(seedModel);

    result.splice(
        index,
        0,
        op
    );

    return result;
}


function mutateDelete(sequence)
{
    if (
        sequence.length <=
        CONFIG.minOps
    ) {
        return cloneSequence(sequence);
    }

    var result =
        cloneSequence(sequence);

    result.splice(
        Math.floor(
            rnd() *
            result.length
        ),
        1
    );

    return result;
}


function mutateSwap(sequence)
{
    var result =
        cloneSequence(sequence);

    if (
        result.length < 2
    ) {
        return result;
    }

    var a =
        Math.floor(
            rnd() *
            result.length
        );

    var b =
        Math.floor(
            rnd() *
            result.length
        );

    var temp =
        result[a];

    result[a] =
        result[b];

    result[b] =
        temp;

    return result;
}


function mutateReplace(sequence)
{
    var result =
        cloneSequence(sequence);

    if (!result.length)
        return result;

    var index =
        Math.floor(
            rnd() *
            result.length
        );

    var original =
        result[index];

    var replacement =
        cloneSequence([original])[0];

    replacement.type =
        pick(TYPES);

    if (
        replacement.type ===
        "CREATE"
    ) {
        replacement.elementType =
            pick(ELEMENT_TYPES);
    }

    result[index] =
        replacement;

    return result;
}


function mutateDuplicate(sequence)
{
    var result =
        cloneSequence(sequence);

    if (!result.length)
        return result;

    var source =
        result[
            Math.floor(
                rnd() *
                result.length
            )
        ];

    var index =
        Math.floor(
            rnd() *
            (result.length + 1)
        );

    result.splice(
        index,
        0,
        cloneSequence([source])[0]
    );

    return result;
}


function mutateSequence(sequence)
{
    var mutations = [
        {
            name: "INSERT",
            fn: mutateInsert
        },
        {
            name: "DELETE",
            fn: mutateDelete
        },
        {
            name: "SWAP",
            fn: mutateSwap
        },
        {
            name: "REPLACE",
            fn: mutateReplace
        },
        {
            name: "DUPLICATE",
            fn: mutateDuplicate
        }
    ];

    var selected =
        pick(mutations);

    State.mutation =
        selected.name;

    return selected.fn(sequence);
}


/* ============================================================
   CASE SELECTION
   ============================================================ */

function buildNextCase()
{
    State.sourceCorpusId = -1;
    State.mutation = "";

    if (
        State.corpus.length &&
        rnd() <
        CONFIG.mutationProbability
    ) {

        var entry =
            pick(State.corpus);

        State.sourceType =
            "CORPUS";

        State.sourceCorpusId =
            entry.id;

        return mutateSequence(
            entry.sequence
        );
    }

    State.sourceType =
        "GENERATED";

    return generateSequence();
}


/* ============================================================
   OBJECT POOL
   ============================================================ */

function resetObjects()
{
    State.objects = {};

    var root =
        document.getElementById(
            "testRoot"
        );

    while (
        root.firstChild
    ) {
        root.removeChild(
            root.firstChild
        );
    }
}

function object(id)
{
    return State.objects[id] || null;
}


/* ============================================================
   EXECUTION
   ============================================================ */

function execute(op)
{
    State.currentOperation =
        JSON.stringify(op);

    saveCheckpoint();

    try {

        if (
            op.type === "CREATE"
        ) {
            if (
                State.objects[op.id]
            ) {
                State.invalid++;
                return;
            }

            var el =
                document.createElement(
                    op.elementType ||
                    "div"
                );

            el.className =
                "box";

            el.textContent =
                op.id;

            State.objects[op.id] = {
                element: el,
                listeners: 0,
                async: 0
            };
        }

        else {

            var obj =
                object(op.id);

            if (!obj) {
                State.invalid++;
                return;
            }

            var el =
                obj.element;

            if (
                op.type === "ATTACH"
            ) {
                document
                    .getElementById(
                        "testRoot"
                    )
                    .appendChild(el);
            }

            else if (
                op.type === "DETACH"
            ) {
                if (
                    el.parentNode
                ) {
                    el.parentNode.removeChild(el);
                }
            }

            else if (
                op.type === "REPLACE"
            ) {
                var target =
                    object(op.target);

                if (
                    target &&
                    el.parentNode
                ) {
                    el.parentNode.replaceChild(
                        target.element,
                        el
                    );
                }
                else {
                    State.invalid++;
                }
            }

            else if (
                op.type === "MUTATE"
            ) {
                el.className =
                    "box";

                el.setAttribute(
                    "data-case",
                    String(State.caseId)
                );

                el.textContent =
                    op.id +
                    ":" +
                    Math.floor(rnd() * 100000);
            }

            else if (
                op.type === "LISTEN"
            ) {
                el.addEventListener(
                    "v10-event",
                    function() {
                        State.events++;
                    },
                    false
                );

                obj.listeners++;
            }

            else if (
                op.type === "DISPATCH"
            ) {
                var event =
                    document.createEvent(
                        "Event"
                    );

                event.initEvent(
                    "v10-event",
                    true,
                    true
                );

                el.dispatchEvent(event);
            }

            else if (
                op.type === "FOCUS"
            ) {
                if (el.focus)
                    el.focus();
            }

            else if (
                op.type === "BLUR"
            ) {
                if (el.blur)
                    el.blur();
            }

            else if (
                op.type === "LAYOUT"
            ) {
                void el.offsetWidth;
                el.getBoundingClientRect();
            }

            else if (
                op.type === "SCHEDULE"
            ) {
                obj.async++;

                setTimeout(
                    function() {

                        obj.async--;

                        try {
                            void el.parentNode;
                            void el.textContent;
                        }
                        catch (e) {
                            State.errors++;
                        }

                    },
                    CONFIG.asyncDelay
                );
            }

            else if (
                op.type === "ACCESS"
            ) {
                void el.textContent;
                void el.parentNode;
            }
        }

        State.lastCompletedOperation =
            State.currentOperation;
    }
    catch (e) {

        State.errors++;

        log(
            "ERROR: " +
            e.name +
            " | " +
            State.currentOperation
        );
    }

    saveCheckpoint();
}


/* ============================================================
   CHECKPOINT
   ============================================================ */

function saveCheckpoint()
{
    setStore(
        "caseId",
        String(State.caseId)
    );

    setStore(
        "seed",
        String(State.seed)
    );

    setStore(
        "operationIndex",
        String(State.operationIndex)
    );

    setStore(
        "operations",
        JSON.stringify(
            State.operations
        )
    );

    setStore(
        "currentOperation",
        State.currentOperation
    );

    setStore(
        "lastCompleted",
        State.lastCompletedOperation
    );
}


/* ============================================================
   DISPLAY
   ============================================================ */

function updateDisplay()
{
    document
        .getElementById("campaign")
        .textContent =
        "RUN: " + State.runId +
        "\nCASE: " + State.caseId +
        "\nSEED: " + State.seed +
        "\nSOURCE: " + State.sourceType +
        "\nCORPUS SOURCE: " +
        State.sourceCorpusId +
        "\nMUTATION: " +
        State.mutation;

    document
        .getElementById("caseInfo")
        .textContent =
        State.operations
        .map(
            function(op, i) {
                return (
                    i === State.operationIndex
                        ? ">> "
                        : "   "
                ) +
                "#" +
                i +
                " " +
                JSON.stringify(op);
            }
        )
        .join("\n") +
        "\n\nErrors: " +
        State.errors +
        "\nEvents: " +
        State.events +
        "\nInvalid: " +
        State.invalid;

    document
        .getElementById("corpusInfo")
        .textContent =
        "CORPUS SIZE: " +
        State.corpus.length +
        " / " +
        CONFIG.maxCorpus;
}


/* ============================================================
   CASE
   ============================================================ */

function runCase(done)
{
    resetObjects();

    State.operationIndex = 0;
    State.errors = 0;
    State.events = 0;
    State.invalid = 0;

    function next()
    {
        if (
            State.stopRequested
        ) {
            done();
            return;
        }

        if (
            State.operationIndex >=
            State.operations.length
        ) {

            addToCorpus(
                State.operations,
                State.sourceType +
                ":" +
                State.mutation
            );

            updateDisplay();

            done();

            return;
        }

        var op =
            State.operations[
                State.operationIndex
            ];

        execute(op);

        State.operationIndex++;

        updateDisplay();

        setTimeout(
            next,
            CONFIG.operationDelay
        );
    }

    next();
}


/* ============================================================
   CAMPAIGN
   ============================================================ */

function startCampaign()
{
    if (State.running)
        return;

    State.running = true;
    State.stopRequested = false;

    State.runId++;

    status(
        "Campaign running"
    );

    function nextCase()
    {
        if (
            State.stopRequested
        ) {
            State.running = false;

            status("Stopped");

            log("CAMPAIGN STOPPED");

            return;
        }

        State.caseId++;

        setSeed(
            newSeed()
        );

        State.operations =
            buildNextCase();

        log(
            "CASE " +
            State.caseId +
            " | " +
            State.sourceType +
            " | " +
            State.mutation
        );

        updateDisplay();

        runCase(
            function() {

                setTimeout(
                    nextCase,
                    CONFIG.caseDelay
                );
            }
        );
    }

    nextCase();
}


function stopCampaign()
{
    State.stopRequested =
        true;

    status(
        "Stopping..."
    );
}


/* ============================================================
   INIT
   ============================================================ */

State.runId =
    parseInt(
        getStore("runId") || "0",
        10
    );

State.caseId =
    parseInt(
        getStore("caseId") || "0",
        10
    );

loadCorpus();

updateDisplay();

log(
    "V10 INITIALIZED"
);

</script>

</body>
</html>
