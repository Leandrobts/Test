<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Teste de Regressão: Descarte de Service Worker com FetchEvents ativos</title>
</head>
<body>
<div id="status">Executando teste...</div>

<script>
// Função utilitária de GC via alocação recursiva de memória
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 1000; i++)
        gcRec(10);
}

// Código do Service Worker que retém referências a FetchEvents
const swCode = `
    self.addEventListener('fetch', (event) => {
        // Mantém o FetchEvent ativo no conjunto m_extendedEvents
        event.respondWith(new Promise((resolve) => {
            // Promessa deixada deliberadamente pendente para que o evento
            // permaneça vivo durante a destruição do escopo
            setTimeout(() => {
                resolve(new Response("ok"));
            }, 5000);
        }));
    });
`;

async function runServiceWorkerUAFTest() {
    if (!navigator.serviceWorker) {
        document.getElementById("status").innerText = "PASS: Service Worker não suportado.";
        return;
    }

    const swBlobUrl = URL.createObjectURL(new Blob([swCode], { type: "application/javascript" }));
    const scope = "./sw-scope-" + Date.now() + "/";

    for (let cycle = 0; cycle < 20; cycle++) {
        try {
            // 1. Registra o Service Worker
            const reg = await navigator.serviceWorker.register(swBlobUrl, { scope: scope });
            await navigator.serviceWorker.ready;

            // 2. Dispara requisições fetch que caem no handler e geram instâncias de FetchEvent
            const fetchPromises = [];
            for (let f = 0; f < 5; f++) {
                fetchPromises.push(fetch(`${scope}test-request-${f}`).catch(() => {}));
            }

            // 3. Força o desregistro e terminação do Service Worker enquanto os FetchEvents ainda estão vivos
            await reg.unregister();

            // 4. Dispara pressão no GC para coletar a VM e forçar prepareForDestruction()
            gc();
        } catch (e) {
            // Trata falhas de registro transitórias
        }
    }

    document.getElementById("status").innerText = "PASS: Encerramento de Service Worker com eventos estendidos sem UAF na VM.";
}

runServiceWorkerUAFTest().catch((err) => {
    document.getElementById("status").innerText = "FAIL: " + err.message;
});
</script>
</body>
</html>
