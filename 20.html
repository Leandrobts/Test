<!DOCTYPE html>
<body>
This test passes if it does not crash.
<script>
function gc() {
    if (globalThis.GCController) GCController.collect();
    else if (globalThis.$vm) $vm.gc();
    else for (let i = 0; i < 10000; i++) new ArrayBuffer(0x1000);
}

const ac = new AbortController();

// Cria o CloseWatcher em um escopo de chamada aninhado para evitar 
// que o ponteiro de referência permaneça retido na pilha de forma conservadora.
(function () {
    new CloseWatcher({ signal: ac.signal });
})();

// Gera pressão na pilha e executa o GC para reduzir a contagem de referências do C++
for (let i = 0; i < 100; i++) new Uint8Array(0x100);
gc(); gc(); gc();

// Aciona o abortamento para testar o algoritmo e garantir que o watcher 
// seja protegido corretamente antes de invocar o destroy()
ac.abort();

console.log("PASS if no crash.");
</script>
</body>
</html>
