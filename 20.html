

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 WebKit FontFace Diagnostic</title>
<style>
body {
    background: #101820;
    color: #00ff90;
    font-family: monospace;
    font-size: 16px;
    margin: 15px;
}
pre {
    white-space: pre-wrap;
    word-wrap: break-word;
}
</style>
</head>
<body>
<h3>PS4 WebKit - FontFace Diagnostic</h3>
<pre id="log"></pre>

<script>
(function () {
    var out = document.getElementById('log');
    var getterCalls = 0;
    var insideMeasure = false;
    var currentStage = 'initialization';
    var face;
    var ctx;

    function log(message) {
        out.appendChild(
            document.createTextNode(message + '\n')
        );
    }

    function stage(name) {
        currentStage = name;
        log('>>> ' + name);
    }

    window.onerror = function (msg, url, line) {
        log('GLOBAL ERROR: ' + msg + ' line ' + line);
    };

    log('USER AGENT: ' + navigator.userAgent);
    log('FontFace: ' + typeof window.FontFace);
    log('document.fonts: ' + typeof document.fonts);
    log('Promise: ' + typeof window.Promise);

    if (typeof window.FontFace !== 'function') {
        log('ERROR: FontFace unavailable');
        return;
    }

    // Monitor access to FontFace.then.
    try {
        Object.defineProperty(
            FontFace.prototype,
            'then',
            {
                configurable: true,

                get: function () {
                    getterCalls++;

                    log('==========================');
                    log('THEN GETTER #' + getterCalls);
                    log('STAGE: ' + currentStage);
                    log('During measureText: ' + insideMeasure);

                    try {
                        var stack = new Error().stack;
                        log('STACK: ' + stack);
                    } catch (e) {
                        log('STACK unavailable: ' + e);
                    }

                    log('==========================');

                    return undefined;
                }
            }
        );

        log('Getter installed: OK');
    } catch (e) {
        log('Getter installation ERROR: ' + e);
        return;
    }

    // Create FontFace.
    stage('BEFORE new FontFace');

    try {
        face = new FontFace(
            'PS4TestFont',
            'local(Helvetica)'
        );

        log('FontFace created');
        log('Initial status: ' + face.status);
    } catch (e) {
        log('Constructor ERROR: ' + e);
        return;
    }

    stage('AFTER new FontFace');

    // Access loaded Promise.
    var loadedPromise;

    stage('BEFORE face.loaded');

    try {
        loadedPromise = face.loaded;
        log('face.loaded obtained');
    } catch (e) {
        log('face.loaded ERROR: ' + e);
    }

    stage('AFTER face.loaded');

    // Register Promise callbacks.
    stage('BEFORE loaded.then');

    try {
        if (loadedPromise &&
            typeof loadedPromise.then === 'function') {

            loadedPromise.then(
                function () {
                    log('LOADED PROMISE RESOLVED');
                    log('Callback stage: ' + currentStage);
                },
                function (e) {
                    log('LOADED PROMISE REJECTED: ' + e);
                }
            );
        }
    } catch (e) {
        log('loaded.then ERROR: ' + e);
    }

    stage('AFTER loaded.then');

    // Register FontFace.
    stage('BEFORE document.fonts.add');

    try {
        document.fonts.add(face);
        log('document.fonts.add: OK');
    } catch (e) {
        log('document.fonts.add ERROR: ' + e);
    }

    stage('AFTER document.fonts.add');

    // Create regular Canvas.
    stage('BEFORE Canvas creation');

    try {
        var canvas = document.createElement('canvas');

        canvas.width = 100;
        canvas.height = 100;

        ctx = canvas.getContext('2d');

        log('Canvas context: ' + !!ctx);

        if (!ctx)
            return;

        ctx.font = '20px PS4TestFont, Helvetica';

        log('ctx.font: ' + ctx.font);
    } catch (e) {
        log('Canvas ERROR: ' + e);
        return;
    }

    stage('AFTER Canvas creation');

    // Measure text and observe synchronous callbacks.
    stage('BEFORE measureText');

    insideMeasure = true;
    currentStage = 'INSIDE measureText';

    try {
        var result = ctx.measureText('\uE005AB');

        log('measureText width: ' + result.width);
    } catch (e) {
        log('measureText ERROR: ' + e);
    } finally {
        insideMeasure = false;
    }

    stage('AFTER measureText');

    log('FontFace status: ' + face.status);
    log('Getter calls: ' + getterCalls);

    // Explicit load test.
    stage('BEFORE face.load');

    try {
        var loadPromise = face.load();

        log('face.load returned: ' + typeof loadPromise);

        if (loadPromise &&
            typeof loadPromise.then === 'function') {

            loadPromise.then(
                function () {
                    log('face.load RESOLVED');
                },
                function (e) {
                    log('face.load REJECTED: ' + e);
                }
            );
        }
    } catch (e) {
        log('face.load ERROR: ' + e);
    }

    stage('AFTER face.load');

    // Final asynchronous state.
    setTimeout(function () {
        stage('FINAL REPORT');

        log('Final FontFace status: ' + face.status);
        log('Total getter calls: ' + getterCalls);
        log('Diagnostic completed');
    }, 1000);

})();
</script>
</body>
</html>
