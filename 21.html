<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste SVG Adaptado - PS4</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        #status {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div id="status">Carregando e processando filtro SVG...</div>

    <script>
        window.setTimeout(() => {
            try {
                const svgNamespace = "http://www.w3.org/2000/svg";
                
                // 1. Cria o container SVG principal
                const svg = document.createElementNS(svgNamespace, "svg");
                svg.setAttribute("width", "128");
                svg.setAttribute("height", "128");

                // 2. Cria a seção de definições (<defs>) e o filtro (<filter>)
                const defs = document.createElementNS(svgNamespace, "defs");
                const filter = document.createElementNS(svgNamespace, "filter");
                filter.setAttribute("id", "dynamic-filter");

                // 3. Adiciona o primitivo de filtro feBlend (equivalente ao teste original)
                const feBlend = document.createElementNS(svgNamespace, "feBlend");
                feBlend.setAttribute("mode", "multiply");
                feBlend.setAttribute("in", "SourceGraphic");
                feBlend.setAttribute("in2", "BackgroundImage");

                // Monta a estrutura do filtro
                filter.appendChild(feBlend);
                defs.appendChild(filter);
                svg.appendChild(defs);

                // 4. Cria um elemento gráfico (rect) aplicando o filtro criado
                const rect = document.createElementNS(svgNamespace, "rect");
                rect.setAttribute("width", "128");
                rect.setAttribute("height", "128");
                rect.setAttribute("fill", "#0070D1"); // Cor temática do PlayStation
                rect.setAttribute("filter", "url(#dynamic-filter)");
                
                svg.appendChild(rect);

                // 5. Insere o SVG no documento para forçar o motor do navegador a renderizá-lo
                document.body.appendChild(svg);

                document.getElementById("status").innerText = "Teste executado com sucesso! Se o navegador não travou, o renderizador suporta o filtro.";
            } catch (err) {
                document.getElementById("status").innerText = "Erro ao executar o teste: " + err.message;
                console.error(err);
            }
        }, 500);
    </script>

</body>
</html>
