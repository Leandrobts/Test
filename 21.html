<!DOCTYPE html>
<html>
<body>
<p>PoC 16 - Diagnóstico de eventos</p>
<div id="log" style="font-family:monospace;white-space:pre-wrap;"></div>
<script>
function log(msg) {
    logDiv = document.getElementById('log');
    logDiv.textContent += msg + '\n';
    console.log(msg);
}

['blur','focus','focusin','focusout','visibilitychange','pagehide','pageshow'].forEach(type => {
    window.addEventListener(type, e => log(`window.${type} target=${e.target}`), true);
    document.addEventListener(type, e => log(`document.${type} target=${e.target}`), true);
});

let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable - clique aqui e depois saia do browser (Home)';
document.body.appendChild(victim);
victim.focus();
log('victim focused. Agora tente: Home button, troca de app, etc.');
</script>
</body>
</html>
