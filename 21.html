<!DOCTYPE html>
<html>
<body>
<pre id="log"></pre>
<script>
var output = document.getElementById("log");

function log(s) {
    output.textContent += s + "\n";
}

var weak;
var finalized = false;

var registry = new FinalizationRegistry(function() {
    finalized = true;
    log("Finalization callback executado");
});

function createObject() {
    var obj = { data: "GC_TEST" };
    weak = new WeakRef(obj);
    registry.register(obj, "test");
}

function pressure() {
    var junk = [];

    for (var i = 0; i < 5000; i++)
        junk.push(new Array(100).join("TEST" + i));
}

createObject();

var attempts = 0;

function check() {
    attempts++;

    pressure();

    var alive = weak.deref() !== undefined;

    log("Tentativa " + attempts +
        ": alive=" + alive);

    if (!alive) {
        log("Objeto JS coletado!");
        log("Finalized: " + finalized);
        return;
    }

    if (attempts < 10)
        setTimeout(check, 500);
    else
        log("Coleta nao observada");
}

setTimeout(check, 500);
</script>
</body>
</html>
