<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PS4 FontFace - Matriz de Diagnostico</title>
<style>body{font:15px monospace;background:#101820;color:#d9ffe7;margin:15px}button{font:inherit;margin:4px;padding:9px;background:#214d45;color:white;border:1px solid #80c6ac}button:disabled{opacity:.4}pre{white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid #406758;padding:10px;max-height:65vh;overflow:auto}strong{color:#6df0b0}</style></head><body>
<h2>PS4 WebKit - Matriz FontFace</h2><p>Diagnostico controlado: 216 casos, sem recursao de measureText no getter. O ultimo caso exibido nao comprova a causa de eventual travamento.</p>
<button id="next">Executar proximo</button><button id="auto">Executar automaticamente</button><button id="stop">Parar</button><button id="clear">Limpar log</button>
<p id="status">Preparando...</p><pre id="log"></pre>
<script>
(function(){
var out=document.getElementById('log'),status=document.getElementById('status');
var cases=[],index=0,active=false,automatic=false,phase='idle',getterCount=0,insideMeasure=false;
var fonts=['Helvetica','Times','Arial','serif'];
var texts=[['ASCII','AB'],['Cherokee','\u13A0\u13A2\u13A4'],['U+E005','\uE005AB']];
var orders=['custom-first','fallback-first'];
var operations=['font','measureText','load'];
var states=['unloaded','loaded','after-load-request'];
function log(s){out.appendChild(document.createTextNode(s+'\n'));out.scrollTop=out.scrollHeight;}
function update(){status.textContent='Proximo caso: '+(index+1)+' / '+cases.length+' | '+(automatic?'Automatico':'Manual')+' | '+(active?'Executando':'Aguardando');}
for(var a=0;a<fonts.length;a++)for(var b=0;b<texts.length;b++)for(var c=0;c<orders.length;c++)for(var d=0;d<operations.length;d++)for(var e=0;e<states.length;e++)cases.push({font:fonts[a],text:texts[b],order:orders[c],operation:operations[d],state:states[e]});
if(typeof FontFace!=='function'||!document.fonts){log('FontFace ou document.fonts indisponivel.');return;}
try{Object.defineProperty(FontFace.prototype,'then',{configurable:true,get:function(){getterCount++;log('  GETTER #'+getterCount+' | fase='+phase+' | durante measureText='+insideMeasure);return undefined;}});}catch(err){log('Falha instalando getter: '+err);return;}
function runOne(done){if(active||index>=cases.length){automatic=false;update();return;}active=true;var n=index++,t=cases[n],id=n+1,face=null,ctx=null;getterCount=0;phase='inicio';insideMeasure=false;
log('\nCASO '+id+' INICIADO | '+t.font+' | '+t.text[0]+' | '+t.order+' | '+t.operation+' | '+t.state);
try{
var family='PS4Matrix'+id;
face=new FontFace(family,'local('+t.font+')');
document.fonts.add(face);
var loaded=face.loaded;
if(loaded&&typeof loaded.then==='function')loaded.then(function(){log('  Promise loaded resolvida | caso '+id);},function(err){log('  Promise loaded rejeitada | caso '+id+': '+err);});
if(t.state==='loaded'||t.state==='after-load-request'){
phase='pre-load';
var p=face.load();if(p&&typeof p.then==='function')p.then(function(){log('  load() resolvido | caso '+id);},function(err){log('  load() rejeitado | caso '+id+': '+err);});
}
var canvas=document.createElement('canvas');canvas.width=20;canvas.height=20;ctx=canvas.getContext('2d');if(!ctx)throw Error('Canvas 2D indisponivel');
var fontValue=t.order==='custom-first'?'20px '+family+', '+t.font:'20px '+t.font+', '+family;
phase='ctx.font';ctx.font=fontValue;
if(t.operation==='measureText'){
phase='measureText';insideMeasure=true;
try{var metrics=ctx.measureText(t.text[1]);log('  Largura='+metrics.width);}finally{insideMeasure=false;}
}else if(t.operation==='load'){
phase='face.load';var p2=face.load();if(p2&&typeof p2.then==='function')p2.then(function(){log('  load adicional resolvido | caso '+id);},function(err){log('  load adicional rejeitado | caso '+id+': '+err);});
}
phase='fim';log('CASO '+id+' CONCLUIDO | getter='+getterCount+' | status='+face.status);
}catch(err){log('CASO '+id+' ERRO: '+err);}
active=false;update();if(done)done();
}
function nextAuto(){if(!automatic)return;if(index>=cases.length){automatic=false;log('FIM DA MATRIZ');update();return;}runOne(function(){setTimeout(nextAuto,150);});}
document.getElementById('next').onclick=function(){if(!automatic)runOne();};
document.getElementById('auto').onclick=function(){if(automatic)return;automatic=true;update();nextAuto();};
document.getElementById('stop').onclick=function(){automatic=false;update();};
document.getElementById('clear').onclick=function(){out.textContent='';update();};
window.onerror=function(msg,url,line){log('ERRO GLOBAL: '+msg+' linha '+line);};
log('User Agent: '+navigator.userAgent);log('Matriz pronta: '+cases.length+' casos.');update();
})();
</script></body></html>
