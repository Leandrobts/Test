<!DOCTYPE html>
<html>
<body>
<p>This test passes if it does not crash.</p>

<div id="host" style="width:100px;height:100px;background:red"></div>

<div id="result"></div>

<script>
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }

    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

let host = document.getElementById('host');

let shadowRoot = host.attachShadow({ mode: 'open' });
shadowRoot.innerHTML = '<div id="victim" tabindex="0">Focusable</div>';

let victim = shadowRoot.getElementById('victim');
victim.focus();

async function runTest() {
    document.addEventListener('blur', () => {
        if (!victim) return;

      
        host.remove();
        gc();
    }, true);

// Força o documento a perder o foco ativo
if (document.activeElement) {
    document.activeElement.blur();
}

// Dispara eventos que emulam a perda de foco da janela de forma sintética
window.dispatchEvent(new Event('blur'));
document.dispatchEvent(new Event('visibilitychange'));


    await new Promise((resolve) => {
        requestAnimationFrame(() => setTimeout(resolve, 0));
    });

    document.getElementById('result').textContent = 'PASS';
}

runTest();
</script>
</body>
</html>
