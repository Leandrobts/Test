<style>
  div {
    overflow: hidden;
  }
  #dialog { /* <-- ALTERADO PARA IDENTIFICADOR */
    overflow: hidden;
    position: static;
    display: inline;
    float: left;
  }
  head {
    display: inline;
  }
</style>
<script>
  onload = () => {
    document.head.append(dialog);
    setTimeout(() => {
      dialog.showPopover(); /* <-- ALTERADO AQUI */
      document.styleSheets[0].disabled = true;
    }, 0);
  };
</script>
<body>
<div id="dialog" popover><div></div></div> <!-- <-- ALTERADO PARA POPOVER -->
Pass if no crash.
</body>
