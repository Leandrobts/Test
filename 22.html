<!DOCTYPE html>
<html>
<body>
<p>This test passes if it does not crash.</p>
<div id="host"></div>
<div id="result"></div>
<script>
// --- Função GC integrada ---
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);  
}

let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable';
shadowRoot.appendChild(victim);
victim.focus();

async function runTest() {   
    // Protegido contra execuções duplas do evento blur global
    document.addEventListener('blur', () => {
        if (victim) {
            victim.remove();
            victim = null;
            gc();
        }
    }, true);

    // Substituição do UIHelper: 
    // Criamos um input auxiliar invisível e o focamos. 
    // Isso força o FocusController a retirar o foco da victim de forma legítima,
    // disparando o 'blur' e executando a remoção/GC com segurança.
    let dummyInput = document.createElement('input');
    dummyInput.tabIndex = 0;
    dummyInput.style.position = 'absolute';
    dummyInput.style.opacity = '0';
    document.body.appendChild(dummyInput);
    
    dummyInput.focus();

    await new Promise((resolve) => {
        requestAnimationFrame(() => setTimeout(resolve, 0));
    });

    result.textContent = 'PASS';    
}    

runTest();
</script>
</body>
</html>
