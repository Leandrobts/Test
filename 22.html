<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>PS4 14.00 - FontFace regression check</title>
<style>body{background:#101820;color:#c9f7df;font:15px monospace}button{font-size:17px;margin:5px;padding:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head>
<body><h3>PS4 14.00 - FontFace / Canvas - reproducao controlada</h3>
<p>Uma tentativa por clique. A sequencia de operacoes do 15.html foi preservada; somente o texto final e selecionavel.</p>
<button onclick="run(0)">Original U+E005AB</button><button onclick="run(1)">Variante Cherokee</button><button onclick="clearLog()">Limpar</button>
<pre id="log"></pre>
<script>
var ctx=null, inGetter=false, getterCount=0, phase='idle', runId=0;
var out=document.getElementById('log');
function log(s){out.appendChild(document.createTextNode(s+'\n'));}
function clearLog(){out.textContent='';}
window.onerror=function(m,u,l){log('ERRO GLOBAL '+m+' linha '+l);};
Object.defineProperty(FontFace.prototype,'then',{
 configurable:true,
 get:function(){
   if(inGetter || !ctx)return undefined;
   inGetter=true;getterCount++;
   log('GETTER '+getterCount+' fase='+phase);
   try{
     for(var i=0;i<16;i++){
       try{ctx.measureText('q'+String.fromCharCode(65+i)+'z');}catch(e){log('getter medida A: '+e);}
       try{ctx.measureText('x');}catch(e){log('getter medida B: '+e);}
     }
   }finally{inGetter=false;}
   return undefined;
 }
});
function attempt(n,trigger){
 phase='dummy FontFace';
 for(var d=0;d<3;d++)new FontFace('Dummy'+n+'_'+d,'local(Helvetica)');
 phase='face.loaded';
 var family='VarFam'+n;
 var face=new FontFace(family,'local(Helvetica)');
 void face.loaded;
 phase='document.fonts.add';document.fonts.add(face);
 phase='canvas';var canvas=document.createElement('canvas');canvas.width=10;canvas.height=10;
 ctx=canvas.getContext('2d');
 if(!ctx)throw new Error('Canvas 2D indisponivel');
 phase='ctx.font';ctx.font='20px Helvetica, '+family;
 phase='50 pre-calls';for(var i=0;i<50;i++)ctx.measureText('x');
 phase='trigger measureText';ctx.measureText(trigger);
 phase='concluido';log('STATUS='+face.status+' getterCount='+getterCount);
}
function run(mode){
 runId++;getterCount=0;ctx=null;inGetter=false;
 var trigger=mode===0?'\uE005AB':'\u13A0\u13A2\u13A4';
 log('--- RUN '+runId+' modo='+(mode===0?'ORIGINAL':'CHEROKEE')+' ---');
 try{attempt(runId,trigger);log('CONCLUIDO sem excecao');}
 catch(e){log('EXCECAO fase='+phase+': '+e);}
 setTimeout(function(){log('CHECK ASSINCRONO run='+runId+' getter='+getterCount);},200);
}
log('Pronto. Escolha uma tentativa.');
</script></body></html>
