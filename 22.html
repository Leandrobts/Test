<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste de Foco Vetorial Adaptado - PS4</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        canvas {
            border: 2px solid #0070D1;
            background-color: #ffffff;
        }
        #status {
            margin-top: 15px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <canvas id="testCanvas" width="300" height="300"></canvas>
    <div id="status">Renderizando caminhos e anéis de foco...</div>

    <script>
        window.setTimeout(() => {
            try {
                const canvas = document.getElementById('testCanvas');
                const ctx = canvas.getContext('2d');

                if (!ctx) {
                    throw new Error("Contexto 2D do Canvas não suportado.");
                }

                // Limpa o canvas
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Configura o estilo equivalente ao anel de foco testado
                ctx.strokeStyle = "rgba(0, 112, 209, 0.8)";
                ctx.lineWidth = 4;
                ctx.fillStyle = "rgba(200, 220, 255, 0.5)";

                // Cria um caminho complexo simulando operações de path do teste original
                ctx.beginPath();
                ctx.moveTo(43, 22);
                
                // Simula curvas quadráticas e arcos inspirados nos dados do teste
                ctx.quadraticCurveTo(7, 12, 91, 109);
                ctx.bezierCurveTo(122, 46, 54, 69, 70, 150); // Ajustado para evitar estouro numérico do original
                ctx.arcTo(62, 18, 72, 88, 37);
                
                // Adiciona um retângulo arredondado/forma geométrica complexa
                ctx.rect(67, 60, 80, 80);
                
                ctx.closePath();

                // Aplica o preenchimento e o traço (foco)
                ctx.fill();
                ctx.stroke();

                document.getElementById("statusinnerText", "Teste executado com sucesso no Canvas! O renderizador processou os caminhos sem falhas.");
            } catch (err) {
                document.getElementById("status").innerText = "Erro ao executar o teste: " + err.message;
                console.error(err);
            }
        }, 500);
    </script>

</body>
</html>
