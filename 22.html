
<!DOCTYPE html>
<html>
<body>
<pre id="log"></pre>

<script>
var output = document.getElementById("log");

function log(s) {
    output.textContent += s + "\n";
}

function gcPressure() {
    var junk = [];

    for (var i = 0; i < 5000; i++) {
        junk.push({
            data: new Array(100).join("GC_" + i)
        });
    }
}

var weakParent;
var nested;
var finalized = false;

var registry = new FinalizationRegistry(function(value) {
    finalized = true;
    log("FINALIZED: " + value);
});

function setup() {
    var style = document.createElement("style");
    document.head.appendChild(style);

    var sheet = style.sheet;

    sheet.insertRule(
        ".outer { color: red; & .nested { color: blue; } }",
        0
    );

    var parent = sheet.cssRules[0];

    if (!parent.cssRules || !parent.cssRules.length) {
        log("CSS Nesting indisponivel");
        return false;
    }

    nested = parent.cssRules[0];

    weakParent = new WeakRef(parent);
    registry.register(parent, "CSSStyleRule parent");

    log("Parent: " + parent.constructor.name);
    log("Child: " + nested.constructor.name);

    sheet.deleteRule(0);

    log("Sheet length: " + sheet.cssRules.length);

    return true;
}

var attempt = 0;

function check() {
    attempt++;

    gcPressure();

    // Consultar WeakRef em tarefa separada.
    setTimeout(function() {
        var alive = weakParent.deref() !== undefined;

        log("GC attempt " + attempt +
            ": parent wrapper alive=" + alive);

        if (!alive) {
            log("Wrapper pai nao esta mais acessivel");
            log("Finalized: " + finalized);
            log("Teste encerrado");
            return;
        }

        if (attempt < 10) {
            setTimeout(check, 500);
        } else {
            log("Coleta do wrapper nao observada");
        }
    }, 100);
}

try {
    if (setup())
        setTimeout(check, 500);
} catch (e) {
    log("ERROR: " + e.name + ": " + e.message);
}
</script>
</body>
</html>
