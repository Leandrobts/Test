<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 WebKit Crash Research Harness V12</title>

<style>
body {
    font-family: sans-serif;
    margin: 10px;
    background: #f5f5f5;
}

button {
    padding: 8px 12px;
    margin: 3px;
}

.panel {
    margin-top: 10px;
    padding: 8px;
    border: 1px solid #777;
    background: white;
    white-space: pre-wrap;
    font-family: monospace;
}

#log {
    max-height: 280px;
    overflow: auto;
}

#testRoot {
    min-height: 120px;
    border: 1px solid #444;
    background: white;
    padding: 8px;
    margin-top: 10px;
}

.box {
    padding: 6px;
    margin: 3px;
    border: 1px solid #888;
}
</style>
</head>

<body>

<h2>PS4 WebKit Crash Research Harness V12</h2>

<button id="start">START FUZZER</button>
<button id="stop">STOP</button>
<button id="replay">REPLAY CANDIDATE</button>
<button id="clearCandidate">CLEAR CANDIDATE</button>
<button id="clearCorpus">CLEAR CORPUS</button>

<div id="status" class="panel">Idle</div>
<div id="recovery" class="panel"></div>
<div id="replayInfo" class="panel"></div>
<div id="campaign" class="panel"></div>
<div id="caseInfo" class="panel"></div>
<div id="corpusInfo" class="panel"></div>

<div id="testRoot"></div>

<div id="log" class="panel"></div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */

var CONFIG = {
    prefix: "CrashResearchV12.",

    minOps: 10,
    maxOps: 24,

    maxObjects: 5,

    operationDelay: 30,
    caseDelay: 180,
    asyncDelay: 60,

    maxCorpus: 80,

    generatedProbability: 0.20,

    interestingScoreThreshold: 3,

    autoReplayCount: 3
};


/* ============================================================
   STATE
   ============================================================ */

var State = {

    running: false,
    stopRequested: false,

    mode: "IDLE",

    runId: 0,
    caseId: 0,

    seed: 0,
    randomState: 0,

    operations: [],
    operationIndex: 0,

    objects: {},

    corpus: [],

    sourceType: "",
    sourceCorpusId: null,
    mutation: "",

    errors: 0,
    events: 0,
    invalid: 0,

    asyncCount: 0,

    currentOperation: "",
    lastCompletedOperation: "",

    caseStarted: false,
    caseCompleted: false,

    history: [],
    observations: {},

    score: 0,

    candidate: null,

    replay: {
        active: false,
        attempt: 0,
        requested: 0,
        completed: 0,
        interrupted: 0,
        results: []
    }
};


/* ============================================================
   STORAGE
   ============================================================ */

function storeKey(name)
{
    return CONFIG.prefix + name;
}

function storeSet(name, value)
{
    try {
        localStorage.setItem(
            storeKey(name),
            String(value)
        );
    }
    catch (e) {
    }
}

function storeGet(name)
{
    try {
        return localStorage.getItem(
            storeKey(name)
        );
    }
    catch (e) {
        return null;
    }
}

function storeRemove(name)
{
    try {
        localStorage.removeItem(
            storeKey(name)
        );
    }
    catch (e) {
    }
}


/* ============================================================
   LOG
   ============================================================ */

function log(text)
{
    var box =
        document.getElementById("log");

    box.textContent +=
        text + "\n";

    box.scrollTop =
        box.scrollHeight;

    console.log(text);
}

function setStatus(text)
{
    document
        .getElementById("status")
        .textContent = text;
}


/* ============================================================
   RNG
   ============================================================ */

function setSeed(seed)
{
    State.seed =
        seed >>> 0;

    State.randomState =
        State.seed;
}

function rnd()
{
    State.randomState =
        (
            State.randomState * 1664525 +
            1013904223
        ) >>> 0;

    return (
        State.randomState /
        4294967296
    );
}

function pick(array)
{
    if (!array.length)
        return null;

    return array[
        Math.floor(
            rnd() * array.length
        )
    ];
}

function newSeed()
{
    var previous =
        parseInt(
            storeGet("lastSeed") || "1",
            10
        );

    var value =
        (
            Date.now() ^
            previous ^
            Math.floor(
                Math.random() * 0x7fffffff
            )
        ) >>> 0;

    if (!value)
        value = 1;

    storeSet(
        "lastSeed",
        value
    );

    return value;
}


/* ============================================================
   UTILITY
   ============================================================ */

function clone(value)
{
    return JSON.parse(
        JSON.stringify(value)
    );
}

function describeOperation(op)
{
    var text =
        op.type;

    if (op.id)
        text += " " + op.id;

    if (op.target)
        text +=
            " -> " +
            op.target;

    if (op.elementType)
        text +=
            " [" +
            op.elementType +
            "]";

    return text;
}


/* ============================================================
   CHECKPOINT
   ============================================================ */

function saveCheckpoint()
{
    storeSet(
        "runId",
        State.runId
    );

    storeSet(
        "caseId",
        State.caseId
    );

    storeSet(
        "seed",
        State.seed
    );

    storeSet(
        "mode",
        State.mode
    );

    storeSet(
        "sourceType",
        State.sourceType
    );

    storeSet(
        "sourceCorpusId",
        State.sourceCorpusId
    );

    storeSet(
        "mutation",
        State.mutation
    );

    storeSet(
        "operationIndex",
        State.operationIndex
    );

    storeSet(
        "operations",
        JSON.stringify(
            State.operations
        )
    );

    storeSet(
        "currentOperation",
        State.currentOperation
    );

    storeSet(
        "lastCompletedOperation",
        State.lastCompletedOperation
    );

    storeSet(
        "caseStarted",
        State.caseStarted ? "1" : "0"
    );

    storeSet(
        "caseCompleted",
        State.caseCompleted ? "1" : "0"
    );

    storeSet(
        "timestamp",
        Date.now()
    );
}


/* ============================================================
   CANDIDATE
   ============================================================ */

function saveCandidate(reason)
{
    var candidate = {
        id:
            Date.now() +
            "-" +
            Math.floor(
                Math.random() * 100000
            ),

        reason: reason,

        caseId: State.caseId,

        seed: State.seed,

        sourceType:
            State.sourceType,

        sourceCorpusId:
            State.sourceCorpusId,

        mutation:
            State.mutation,

        operationIndex:
            State.operationIndex,

        currentOperation:
            State.currentOperation,

        lastCompletedOperation:
            State.lastCompletedOperation,

        operations:
            clone(State.operations),

        created:
            Date.now()
    };

    State.candidate =
        candidate;

    storeSet(
        "candidate",
        JSON.stringify(candidate)
    );
}

function loadCandidate()
{
    var raw =
        storeGet("candidate");

    if (!raw) {
        State.candidate = null;
        return;
    }

    try {
        State.candidate =
            JSON.parse(raw);
    }
    catch (e) {
        State.candidate = null;
    }
}

function clearCandidate()
{
    State.candidate = null;

    storeRemove("candidate");

    storeRemove(
        "replayInProgress"
    );

    storeRemove(
        "replayCompleted"
    );

    storeRemove(
        "replayAttempt"
    );

    storeRemove(
        "replayResults"
    );

    State.replay = {
        active: false,
        attempt: 0,
        requested: 0,
        completed: 0,
        interrupted: 0,
        results: []
    };

    updateDisplay();

    log(
        "CANDIDATE CLEARED"
    );
}


/* ============================================================
   RECOVERY DETECTION
   ============================================================ */

function detectInterruptedCase()
{
    var started =
        storeGet("caseStarted");

    var completed =
        storeGet("caseCompleted");

    if (
        started === "1" &&
        completed !== "1"
    ) {
        State.operations =
            JSON.parse(
                storeGet("operations") ||
                "[]"
            );

        State.caseId =
            parseInt(
                storeGet("caseId") || "0",
                10
            );

        State.seed =
            parseInt(
                storeGet("seed") || "0",
                10
            );

        State.operationIndex =
            parseInt(
                storeGet(
                    "operationIndex"
                ) || "0",
                10
            );

        State.currentOperation =
            storeGet(
                "currentOperation"
            ) || "";

        State.lastCompletedOperation =
            storeGet(
                "lastCompletedOperation"
            ) || "";

        State.sourceType =
            storeGet(
                "sourceType"
            ) || "";

        State.sourceCorpusId =
            storeGet(
                "sourceCorpusId"
            );

        State.mutation =
            storeGet(
                "mutation"
            ) || "";

        saveCandidate(
            "interrupted-case"
        );

        return true;
    }

    return false;
}


/* ============================================================
   REPLAY RECOVERY
   ============================================================ */

function recoverReplayState()
{
    var active =
        storeGet(
            "replayInProgress"
        );

    var completed =
        storeGet(
            "replayCompleted"
        );

    var raw =
        storeGet(
            "replayResults"
        );

    if (raw) {
        try {
            State.replay.results =
                JSON.parse(raw);
        }
        catch (e) {
            State.replay.results = [];
        }
    }

    if (
        active === "1" &&
        completed !== "1"
    ) {
        var attempt =
            parseInt(
                storeGet(
                    "replayAttempt"
                ) || "0",
                10
            );

        State.replay.interrupted++;

        State.replay.results.push({
            attempt: attempt,
            result: "INTERRUPTED"
        });

        storeSet(
            "replayResults",
            JSON.stringify(
                State.replay.results
            )
        );

        storeSet(
            "replayInProgress",
            "0"
        );

        log(
            "REPLAY INTERRUPTION DETECTED"
        );
    }
}


/* ============================================================
   CORPUS
   ============================================================ */

function loadCorpus()
{
    var raw =
        storeGet("corpus");

    if (!raw) {
        State.corpus = [];
        return;
    }

    try {
        State.corpus =
            JSON.parse(raw);

        if (
            !Array.isArray(
                State.corpus
            )
        ) {
            State.corpus = [];
        }
    }
    catch (e) {
        State.corpus = [];
    }
}

function saveCorpus()
{
    storeSet(
        "corpus",
        JSON.stringify(
            State.corpus
        )
    );
}

function addCorpus(
    sequence,
    score,
    reason
)
{
    var entry = {
        id:
            Date.now() +
            "-" +
            Math.floor(
                rnd() * 100000
            ),

        sequence:
            clone(sequence),

        score: score,

        reason: reason,

        seed: State.seed,

        uses: 0,

        created:
            Date.now()
    };

    State.corpus.push(entry);

    State.corpus.sort(
        function(a, b) {
            return b.score - a.score;
        }
    );

    while (
        State.corpus.length >
        CONFIG.maxCorpus
    ) {
        State.corpus.pop();
    }

    saveCorpus();
}

function selectCorpusEntry()
{
    if (
        !State.corpus.length
    ) {
        return null;
    }

    var total = 0;
    var i;

    for (
        i = 0;
        i < State.corpus.length;
        i++
    ) {
        total +=
            Math.max(
                1,
                State.corpus[i].score + 1
            );
    }

    var value =
        rnd() * total;

    for (
        i = 0;
        i < State.corpus.length;
        i++
    ) {
        value -=
            Math.max(
                1,
                State.corpus[i].score + 1
            );

        if (
            value <= 0
        ) {
            return State.corpus[i];
        }
    }

    return State.corpus[0];
}


/* ============================================================
   GENERATOR
   ============================================================ */

var OBJECT_NAMES = [
    "A",
    "B",
    "C",
    "D",
    "E"
];

var ELEMENT_TYPES = [
    "div",
    "span",
    "input",
    "button"
];

var OP_TYPES = [
    "CREATE",
    "ATTACH",
    "DETACH",
    "REPLACE",
    "MUTATE",
    "LISTEN",
    "DISPATCH",
    "FOCUS",
    "BLUR",
    "LAYOUT",
    "SCHEDULE",
    "ACCESS"
];

function modelIds(model)
{
    return Object.keys(model);
}

function attachedIds(model)
{
    var result = [];
    var id;

    for (id in model) {
        if (
            model[id].state ===
            "ATTACHED"
        ) {
            result.push(id);
        }
    }

    return result;
}

function detachedIds(model)
{
    var result = [];
    var id;

    for (id in model) {
        if (
            model[id].state ===
            "DETACHED"
        ) {
            result.push(id);
        }
    }

    return result;
}

function generateOperation(model)
{
    var ids =
        modelIds(model);

    var attached =
        attachedIds(model);

    var detached =
        detachedIds(model);

    var choices = [];

    if (
        ids.length <
        CONFIG.maxObjects
    ) {
        choices.push("CREATE");
    }

    if (detached.length)
        choices.push("ATTACH");

    if (attached.length) {
        choices.push(
            "DETACH",
            "MUTATE",
            "LISTEN",
            "DISPATCH",
            "FOCUS",
            "BLUR",
            "LAYOUT",
            "SCHEDULE"
        );
    }

    if (ids.length)
        choices.push("ACCESS");

    if (
        attached.length >= 2
    ) {
        choices.push("REPLACE");
    }

    var type =
        pick(
            choices.length ?
            choices :
            ["CREATE"]
        );

    if (
        type === "CREATE"
    ) {
        var free =
            OBJECT_NAMES.filter(
                function(id) {
                    return !model[id];
                }
            );

        if (free.length) {
            var newId =
                pick(free);

            model[newId] = {
                state: "DETACHED"
            };

            return {
                type: "CREATE",
                id: newId,
                elementType:
                    pick(ELEMENT_TYPES)
            };
        }
    }

    if (
        type === "ATTACH"
    ) {
        var attachId =
            pick(detached);

        model[attachId].state =
            "ATTACHED";

        return {
            type: "ATTACH",
            id: attachId
        };
    }

    if (
        type === "DETACH"
    ) {
        var detachId =
            pick(attached);

        model[detachId].state =
            "DETACHED";

        return {
            type: "DETACHED",
            id: detachId
        };
    }

    if (
        type === "REPLACE"
    ) {
        var source =
            pick(attached);

        var targets =
            attached.filter(
                function(id) {
                    return id !== source;
                }
            );

        var target =
            pick(targets);

        model[source].state =
            "DETACHED";

        return {
            type: "REPLACE",
            id: source,
            target: target
        };
    }

    return {
        type: type,
        id:
            pick(
                type === "ACCESS" ?
                ids :
                attached
            )
    };
}

function generateSequence()
{
    var model = {};

    var count =
        CONFIG.minOps +
        Math.floor(
            rnd() *
            (
                CONFIG.maxOps -
                CONFIG.minOps +
                1
            )
        );

    var result = [];

    var i;

    for (
        i = 0;
        i < count;
        i++
    ) {
        result.push(
            generateOperation(model)
        );
    }

    return result;
}


/* ============================================================
   MUTATION
   ============================================================ */

function mutationInsert(sequence)
{
    var result =
        clone(sequence);

    if (
        result.length >=
        CONFIG.maxOps
    ) {
        return result;
    }

    result.splice(
        Math.floor(
            rnd() *
            (result.length + 1)
        ),
        0,
        {
            type:
                pick([
                    "MUTATE",
                    "LISTEN",
                    "DISPATCH",
                    "LAYOUT",
                    "SCHEDULE",
                    "ACCESS"
                ]),

            id:
                pick(OBJECT_NAMES)
        }
    );

    return result;
}

function mutationDelete(sequence)
{
    var result =
        clone(sequence);

    if (
        result.length <=
        CONFIG.minOps
    ) {
        return result;
    }

    result.splice(
        Math.floor(
            rnd() *
            result.length
        ),
        1
    );

    return result;
}

function mutationSwap(sequence)
{
    var result =
        clone(sequence);

    if (
        result.length < 2
    ) {
        return result;
    }

    var a =
        Math.floor(
            rnd() *
            result.length
        );

    var b =
        Math.floor(
            rnd() *
            result.length
        );

    var temp =
        result[a];

    result[a] =
        result[b];

    result[b] =
        temp;

    return result;
}

function mutationDuplicate(sequence)
{
    var result =
        clone(sequence);

    if (!result.length)
        return result;

    var op =
        clone([
            pick(result)
        ])[0];

    result.splice(
        Math.floor(
            rnd() *
            (result.length + 1)
        ),
        0,
        op
    );

    return result;
}

function mutationReplace(sequence)
{
    var result =
        clone(sequence);

    if (!result.length)
        return result;

    var index =
        Math.floor(
            rnd() *
            result.length
        );

    result[index] = {
        type:
            pick(OP_TYPES),

        id:
            pick(OBJECT_NAMES)
    };

    return result;
}

function mutateSequence(sequence)
{
    var mutations = [
        {
            name: "INSERT",
            fn: mutationInsert
        },
        {
            name: "DELETE",
            fn: mutationDelete
        },
        {
            name: "SWAP",
            fn: mutationSwap
        },
        {
            name: "DUPLICATE",
            fn: mutationDuplicate
        },
        {
            name: "REPLACE",
            fn: mutationReplace
        }
    ];

    var selected =
        pick(mutations);

    State.mutation =
        selected.name;

    return selected.fn(sequence);
}


/* ============================================================
   BUILD CASE
   ============================================================ */

function buildCase()
{
    State.sourceCorpusId = null;
    State.mutation = "";

    if (
        !State.corpus.length ||
        rnd() <
        CONFIG.generatedProbability
    ) {
        State.sourceType =
            "GENERATED";

        return generateSequence();
    }

    var entry =
        selectCorpusEntry();

    entry.uses++;

    State.sourceType =
        "CORPUS";

    State.sourceCorpusId =
        entry.id;

    return mutateSequence(
        entry.sequence
    );
}


/* ============================================================
   OBSERVATION
   ============================================================ */

function resetObservations()
{
    State.observations = {
        operations: {},
        transitions: {},
        errors: {}
    };

    State.history = [];
}

function observeOperation(op)
{
    State.observations
        .operations[op.type] =
        true;

    if (
        State.history.length
    ) {
        var previous =
            State.history[
                State.history.length - 1
            ];

        State.observations
            .transitions[
                previous.type +
                "->" +
                op.type
            ] = true;
    }

    State.history.push(op);

    if (
        State.history.length > 10
    ) {
        State.history.shift();
    }
}

function calculateScore()
{
    var score = 0;

    score +=
        Math.min(
            Object.keys(
                State.observations
                    .transitions
            ).length,
            8
        );

    if (
        State.events > 0
    )
        score++;

    if (
        State.asyncCount > 0
    )
        score++;

    if (
        State.errors > 0
    )
        score += 3;

    var types =
        State.observations.operations;

    if (
        types.SCHEDULE &&
        types.DETACH
    ) {
        score += 2;
    }

    if (
        types.LISTEN &&
        types.DISPATCH
    ) {
        score += 2;
    }

    if (
        types.REPLACE &&
        types.LAYOUT
    ) {
        score += 2;
    }

    return score;
}


/* ============================================================
   OBJECT RESET
   ============================================================ */

function resetObjects()
{
    State.objects = {};

    var root =
        document.getElementById(
            "testRoot"
        );

    while (
        root.firstChild
    ) {
        root.removeChild(
            root.firstChild
        );
    }
}


/* ============================================================
   EXECUTE OPERATION
   ============================================================ */

function executeOperation(op)
{
    State.currentOperation =
        describeOperation(op);

    observeOperation(op);

    saveCheckpoint();

    try {

        if (
            op.type === "CREATE"
        ) {
            if (
                State.objects[op.id]
            ) {
                State.invalid++;
                return;
            }

            var element =
                document.createElement(
                    op.elementType ||
                    "div"
                );

            element.className =
                "box";

            element.textContent =
                op.id;

            State.objects[op.id] = {
                element: element
            };

            State.lastCompletedOperation =
                State.currentOperation;
        }

        else {

            var object =
                State.objects[op.id];

            if (!object) {
                State.invalid++;
                return;
            }

            var element =
                object.element;

            if (
                op.type === "ATTACH"
            ) {
                document
                    .getElementById(
                        "testRoot"
                    )
                    .appendChild(element);
            }

            else if (
                op.type === "DETACH"
            ) {
                if (
                    element.parentNode
                ) {
                    element.parentNode
                        .removeChild(element);
                }
            }

            else if (
                op.type === "REPLACE"
            ) {
                var target =
                    State.objects[
                        op.target
                    ];

                if (
                    target &&
                    element.parentNode
                ) {
                    element.parentNode
                        .replaceChild(
                            target.element,
                            element
                        );
                }
                else {
                    State.invalid++;
                }
            }

            else if (
                op.type === "MUTATE"
            ) {
                element.textContent =
                    op.id +
                    ":" +
                    Math.floor(
                        rnd() * 100000
                    );

                element.setAttribute(
                    "data-case",
                    State.caseId
                );
            }

            else if (
                op.type === "LISTEN"
            ) {
                element.addEventListener(
                    "v12-event",
                    function() {
                        State.events++;
                    },
                    false
                );
            }

            else if (
                op.type === "DISPATCH"
            ) {
                var event =
                    document.createEvent(
                        "Event"
                    );

                event.initEvent(
                    "v12-event",
                    true,
                    true
                );

                element.dispatchEvent(event);
            }

            else if (
                op.type === "FOCUS"
            ) {
                if (element.focus)
                    element.focus();
            }

            else if (
                op.type === "BLUR"
            ) {
                if (element.blur)
                    element.blur();
            }

            else if (
                op.type === "LAYOUT"
            ) {
                void element.offsetWidth;

                element.getBoundingClientRect();
            }

            else if (
                op.type === "SCHEDULE"
            ) {
                State.asyncCount++;

                setTimeout(
                    function() {
                        try {
                            void element.parentNode;
                            void element.textContent;
                            void element.offsetWidth;
                        }
                        catch (e) {
                            State.errors++;
                        }
                    },
                    CONFIG.asyncDelay
                );
            }

            else if (
                op.type === "ACCESS"
            ) {
                void element.textContent;
                void element.parentNode;
            }

            State.lastCompletedOperation =
                State.currentOperation;
        }
    }
    catch (e) {

        State.errors++;

        State.observations
            .errors[e.name] =
            true;

        log(
            "JS ERROR: " +
            e.name
        );
    }

    saveCheckpoint();
}


/* ============================================================
   RUN SEQUENCE
   ============================================================ */

function runSequence(
    sequence,
    callback
)
{
    resetObjects();

    State.operations =
        clone(sequence);

    State.operationIndex = 0;

    State.errors = 0;
    State.events = 0;
    State.invalid = 0;
    State.asyncCount = 0;

    State.currentOperation = "";
    State.lastCompletedOperation = "";

    State.caseStarted = true;
    State.caseCompleted = false;

    resetObservations();

    saveCheckpoint();

    function next()
    {
        if (
            State.stopRequested &&
            State.mode === "FUZZ"
        ) {
            callback(false);
            return;
        }

        if (
            State.operationIndex >=
            State.operations.length
        ) {
            setTimeout(
                function() {

                    State.caseCompleted =
                        true;

                    saveCheckpoint();

                    callback(true);

                },
                CONFIG.asyncDelay + 10
            );

            return;
        }

        var op =
            State.operations[
                State.operationIndex
            ];

        executeOperation(op);

        State.operationIndex++;

        saveCheckpoint();

        updateDisplay();

        setTimeout(
            next,
            CONFIG.operationDelay
        );
    }

    next();
}


/* ============================================================
   REPLAY ENGINE
   ============================================================ */

function startReplay()
{
    if (
        !State.candidate
    ) {
        log(
            "NO CANDIDATE AVAILABLE"
        );

        return;
    }

    if (
        State.running
    ) {
        return;
    }

    State.running = true;
    State.stopRequested = false;
    State.mode = "REPLAY";

    State.replay.active = true;
    State.replay.attempt = 0;
    State.replay.requested =
        CONFIG.autoReplayCount;
    State.replay.completed = 0;
    State.replay.interrupted = 0;
    State.replay.results = [];

    runNextReplay();
}

function runNextReplay()
{
    if (
        State.replay.attempt >=
        State.replay.requested
    ) {
        finishReplay();
        return;
    }

    State.replay.attempt++;

    var attempt =
        State.replay.attempt;

    storeSet(
        "replayInProgress",
        "1"
    );

    storeSet(
        "replayCompleted",
        "0"
    );

    storeSet(
        "replayAttempt",
        attempt
    );

    storeSet(
        "replayResults",
        JSON.stringify(
            State.replay.results
        )
    );

    setStatus(
        "Replay attempt " +
        attempt +
        " / " +
        State.replay.requested
    );

    log(
        "REPLAY ATTEMPT " +
        attempt
    );

    runSequence(
        State.candidate.operations,
        function(success) {

            if (success) {

                State.replay.completed++;

                State.replay.results.push({
                    attempt: attempt,
                    result: "COMPLETED"
                });

                storeSet(
                    "replayCompleted",
                    "1"
                );

                storeSet(
                    "replayInProgress",
                    "0"
                );

                storeSet(
                    "replayResults",
                    JSON.stringify(
                        State.replay.results
                    )
                );
            }

            updateDisplay();

            setTimeout(
                runNextReplay,
                250
            );
        }
    );
}

function finishReplay()
{
    State.running = false;
    State.mode = "IDLE";
    State.replay.active = false;

    storeSet(
        "replayInProgress",
        "0"
    );

    storeSet(
        "replayCompleted",
        "1"
    );

    storeSet(
        "replayResults",
        JSON.stringify(
            State.replay.results
        )
    );

    setStatus(
        classifyReplay()
    );

    updateDisplay();

    log(
        "REPLAY FINISHED: " +
        classifyReplay()
    );
}

function classifyReplay()
{
    var results =
        State.replay.results;

    var completed = 0;
    var interrupted = 0;

    var i;

    for (
        i = 0;
        i < results.length;
        i++
    ) {
        if (
            results[i].result ===
            "COMPLETED"
        ) {
            completed++;
        }

        if (
            results[i].result ===
            "INTERRUPTED"
        ) {
            interrupted++;
        }
    }

    if (
        interrupted > 0 &&
        completed === 0
    ) {
        return "HIGH REPRODUCTION SIGNAL";
    }

    if (
        interrupted > 0 &&
        completed > 0
    ) {
        return "INTERMITTENT";
    }

    if (
        completed > 0 &&
        interrupted === 0
    ) {
        return "NOT REPRODUCED";
    }

    return "UNKNOWN";
}


/* ============================================================
   FUZZ CAMPAIGN
   ============================================================ */

function startCampaign()
{
    if (
        State.running
    )
        return;

    State.running = true;
    State.stopRequested = false;

    State.mode = "FUZZ";

    State.runId++;

    setStatus(
        "Fuzzing"
    );

    function nextCase()
    {
        if (
            State.stopRequested
        ) {
            State.running = false;
            State.mode = "IDLE";

            setStatus(
                "Stopped"
            );

            return;
        }

        State.caseId++;

        setSeed(
            newSeed()
        );

        State.operations =
            buildCase();

        State.score = 0;

        runSequence(
            State.operations,
            function(success) {

                if (success) {

                    State.score =
                        calculateScore();

                    if (
                        State.score >=
                        CONFIG.interestingScoreThreshold
                    ) {
                        addCorpus(
                            State.operations,
                            State.score,
                            "score=" +
                            State.score
                        );
                    }
                }

                updateDisplay();

                setTimeout(
                    nextCase,
                    CONFIG.caseDelay
                );
            }
        );
    }

    nextCase();
}

function stopCampaign()
{
    State.stopRequested = true;

    setStatus(
        "Stopping..."
    );
}


/* ============================================================
   DISPLAY
   ============================================================ */

function updateDisplay()
{
    var recovery =
        document.getElementById(
            "recovery"
        );

    if (
        State.candidate
    ) {
        recovery.textContent =
            "CANDIDATE AVAILABLE\n\n" +
            "ID: " +
            State.candidate.id +
            "\nCASE: " +
            State.candidate.caseId +
            "\nSEED: " +
            State.candidate.seed +
            "\nOPERATION INDEX: " +
            State.candidate.operationIndex +
            "\nCURRENT: " +
            State.candidate.currentOperation +
            "\nLAST: " +
            State.candidate.lastCompletedOperation;
    }
    else {
        recovery.textContent =
            "No crash candidate stored.";
    }

    document
        .getElementById("replayInfo")
        .textContent =
        "REPLAY\n" +
        "Requested: " +
        State.replay.requested +
        "\nAttempt: " +
        State.replay.attempt +
        "\nCompleted: " +
        State.replay.completed +
        "\nInterrupted: " +
        State.replay.interrupted +
        "\nClassification: " +
        classifyReplay() +
        "\nResults: " +
        JSON.stringify(
            State.replay.results
        );

    document
        .getElementById("campaign")
        .textContent =
        "MODE: " +
        State.mode +
        "\nRUN: " +
        State.runId +
        "\nCASE: " +
        State.caseId +
        "\nSEED: " +
        State.seed +
        "\nSOURCE: " +
        State.sourceType +
        "\nMUTATION: " +
        State.mutation +
        "\nSCORE: " +
        State.score;

    var lines = [];

    var i;

    for (
        i = 0;
        i < State.operations.length;
        i++
    ) {
        lines.push(
            (
                i ===
                State.operationIndex ?
                ">> " :
                "   "
            ) +
            "#" +
            ("00" + i).slice(-2) +
            " " +
            describeOperation(
                State.operations[i]
            )
        );
    }

    document
        .getElementById("caseInfo")
        .textContent =
        lines.join("\n") +
        "\n\nCURRENT: " +
        State.currentOperation +
        "\nLAST: " +
        State.lastCompletedOperation +
        "\nERRORS: " +
        State.errors +
        "\nEVENTS: " +
        State.events +
        "\nINVALID: " +
        State.invalid;

    document
        .getElementById("corpusInfo")
        .textContent =
        "CORPUS SIZE: " +
        State.corpus.length +
        " / " +
        CONFIG.maxCorpus;
}


/* ============================================================
   CLEAR CORPUS
   ============================================================ */

function clearCorpus()
{
    State.corpus = [];

    saveCorpus();

    updateDisplay();

    log(
        "CORPUS CLEARED"
    );
}


/* ============================================================
   INIT
   ============================================================ */

State.runId =
    parseInt(
        storeGet("runId") || "0",
        10
    );

State.caseId =
    parseInt(
        storeGet("caseId") || "0",
        10
    );

if (
    isNaN(State.runId)
)
    State.runId = 0;

if (
    isNaN(State.caseId)
)
    State.caseId = 0;

loadCorpus();

loadCandidate();

recoverReplayState();

if (
    detectInterruptedCase()
) {
    log(
        "INTERRUPTED CASE RECOVERED"
    );
}

document
    .getElementById("start")
    .addEventListener(
        "click",
        startCampaign,
        false
    );

document
    .getElementById("stop")
    .addEventListener(
        "click",
        stopCampaign,
        false
    );

document
    .getElementById("replay")
    .addEventListener(
        "click",
        startReplay,
        false
    );

document
    .getElementById("clearCandidate")
    .addEventListener(
        "click",
        clearCandidate,
        false
    );

document
    .getElementById("clearCorpus")
    .addEventListener(
        "click",
        clearCorpus,
        false
    );

updateDisplay();

log(
    "V12 INITIALIZED"
);

</script>
