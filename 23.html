<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PS4 14.00 - Matriz FontFace / WidthCache</title>
<style>body{background:#101820;color:#9affc7;font:15px monospace;margin:14px}button{font:15px sans-serif;margin:3px;padding:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;border-top:1px solid #486;padding-top:10px}small{color:#cde}#summary{font-weight:bold}</style></head><body>
<h3>PS4 14.00 - Matriz FontFace / WidthCache</h3>
<p><small>216 casos de diagnostico; sem carga de memoria, sem recursao de measureText. O getter indica acesso JS, nao UAF.</small></p>
<button id="next">Proximo caso</button><button id="auto">Automatico</button><button id="stop">Parar</button><button id="reset">Reiniciar</button>
<p id="summary"></p><pre id="log"></pre>
<script>
(function(){
var fonts=['Helvetica','Times','Arial','serif'];
var texts=[['ASCII','AB'],['Cherokee','\u13A0\u13A2\u13A4'],['Longo16','ABCDEFGHIJKLMNOP']];
var orders=['custom-first','fallback-first'];
var operations=['font','measure','load'];
var states=['loaded-property','load-before','no-loaded-property'];
var cases=[],index=0,running=false,runToken=0,totalGetter=0,phase='idle',activeCase=-1,caseGetter=0;
var out=document.getElementById('log'),summary=document.getElementById('summary');
function log(s){out.appendChild(document.createTextNode(s+'\n'));if(out.childNodes.length>700)out.removeChild(out.firstChild);}
function update(){summary.textContent='Progresso: '+index+'/'+cases.length+' | getters: '+totalGetter+' | automatico: '+(running?'sim':'nao');}
for(var f=0;f<fonts.length;f++)for(var t=0;t<texts.length;t++)for(var o=0;o<orders.length;o++)for(var p=0;p<operations.length;p++)for(var s=0;s<states.length;s++)cases.push({font:fonts[f],text:texts[t],order:orders[o],op:operations[p],state:states[s]});
if(typeof FontFace!=='function'||!document.fonts){log('FontFace ou document.fonts indisponivel');return;}
try{Object.defineProperty(FontFace.prototype,'then',{configurable:true,get:function(){totalGetter++;caseGetter++;log('  GETTER | caso='+activeCase+' | fase='+phase+' | status='+(this.status||'?'));return undefined;}});}catch(e){log('Falha ao instalar getter: '+e);return;}
function runOne(){
if(index>=cases.length){running=false;log('FIM DOS 216 CASOS');update();return;}
var c=cases[index],id=index+1,face=null,ctx=null,localPhase='';activeCase=id;caseGetter=0;
log('CASO '+id+'/216 | '+c.font+' | '+c.text[0]+' | '+c.order+' | '+c.op+' | '+c.state);
function mark(x){phase=x;localPhase=x;}
try{
mark('construct');var family='PS4Diag'+id;face=new FontFace(family,'local('+c.font+')');
if(c.state==='loaded-property'){mark('face.loaded');void face.loaded;}
if(c.state==='load-before'){mark('face.load before');var lp=face.load();if(lp&&typeof lp.then==='function')lp.then(function(){},function(){});}
mark('document.fonts.add');document.fonts.add(face);
mark('canvas');var canvas=document.createElement('canvas');canvas.width=10;canvas.height=10;ctx=canvas.getContext('2d');if(!ctx)throw new Error('Canvas 2D indisponivel');
var spec=c.order==='custom-first'?('20px '+family+', '+c.font):('20px '+c.font+', '+family);
mark('ctx.font');ctx.font=spec;
if(c.op==='font'){mark('ctx.font read');var readback=ctx.font;log('  font='+readback);}
if(c.op==='measure'){mark('measureText');var m=ctx.measureText(c.text[1]);log('  width='+m.width);}
if(c.op==='load'){mark('face.load after');var promise=face.load();if(promise&&typeof promise.then==='function')promise.then(function(){},function(){});}
mark('done');log('  OK | getter='+caseGetter+' | status='+face.status);
}catch(e){log('  EXCECAO | fase='+localPhase+' | '+e);}
index++;activeCase=-1;phase='idle';update();
}
function next(){if(!running)runOne();}
function tick(token){if(!running||token!==runToken)return;runOne();if(running&&index<cases.length)setTimeout(function(){tick(token);},250);else{running=false;update();}}
document.getElementById('next').onclick=next;
document.getElementById('auto').onclick=function(){if(running)return;running=true;runToken++;update();tick(runToken);};
document.getElementById('stop').onclick=function(){running=false;runToken++;update();};
document.getElementById('reset').onclick=function(){running=false;runToken++;index=0;totalGetter=0;out.textContent='';log('Reiniciado');update();};
window.onerror=function(msg,url,line){log('GLOBAL ERROR: '+msg+' linha '+line);};
log('Pronto. Cada caso usa nova FontFace e novo Canvas.');update();
})();
</script></body></html>
