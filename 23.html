<!DOCTYPE html>
<html>
<body>
<p>This tests removing the value attribute of a button as it tries to close the dialog element.<br>
WebKit should not crash or hit any assertions under ASAN.</p>
<dialog id="dialog" open>
    <button command="close" commandfor="dialog">Close</button>
</dialog>
<script>
function gc() {
    function gcRec(n) {
          if (n < 1)
              return {};
          var temp = {i: "ab" + i + (i / 100000)};
          temp += "foo";
          gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
    gcRec(10);
}

gc();

const button = document.querySelector('button');
const dlg = document.getElementById('dialog');

button.setAttribute('value', 'PA' + 'SS');

dlg.addEventListener('beforetoggle', (event) => {
    button.removeAttribute('value');
});

// Fallback de compatibilidade para engines antigas que ignoram command/commandfor
button.addEventListener('click', (e) => {
    if (!dlg.hasAttribute(open) && dlg.open) {
        dlg.close(button.value);
    }
});

button.click();

if (dlg.returnValue) {
    document.write('<p>' + dlg.returnValue + '</p>');
}
document.write('<p>PASS</p>');
</script>
</body>
</html>
