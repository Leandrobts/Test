<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 AutoFillButton type change test</title>

<style>
body {
    font-family: sans-serif;
    font-size: 24px;
    padding: 30px;
}

input {
    font-size: 28px;
    width: 500px;
    padding: 10px;
}

#result {
    margin-top: 30px;
}
</style>
</head>

<body>

<div id="result">
    <p>Toque/clique no campo abaixo.</p>
    <input id="input" type="password">
</div>

<script>
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};

        var temp = {
            i: "ab" + i + (i / 100000)
        };

        temp += "foo";

        gcRec(n - 1);
    }

    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

window.onload = function() {
    var input = document.getElementById("input");
    var result = document.getElementById("result");

    input.addEventListener("click", function() {
        input.type = "button";

        gc();

        result.innerHTML =
            "<p>input.type alterado durante o click.</p>" +
            "<p>GC executado.</p>" +
            "<p>Teste concluído se o navegador não travar.</p>";
    }, { once: true });
};
</script>

</body>
</html>
