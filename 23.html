<!DOCTYPE html>
<html>
<body>
<pre id="log"></pre>
<script>
function log(s) {
    document.getElementById("log").textContent += s + "\n";
}

function test(remove) {
    var style = document.createElement("style");
    document.head.appendChild(style);

    var sheet = style.sheet;

    sheet.insertRule(
        ".outer { color:red; & .nested { color:blue; } }",
        0
    );

    var parent = sheet.cssRules[0];
    var nested = parent.cssRules[0];

    log("Remove: " + remove);
    log("Before: " + (nested.parentRule === parent));

    if (remove)
        sheet.deleteRule(0);

    log("Sheet length: " + sheet.cssRules.length);
    log("After: " + (nested.parentRule === parent));
    log("Selector: " + nested.parentRule.selectorText);
    log("---");
}

try {
    test(false);
    test(true);
} catch (e) {
    log("Error: " + e);
}
</script>
</body>
</html>
