<!DOCTYPE html>
<html>
<body>
<p>This test passes if it does not crash.</p>

<div id="host" style="width:100px;height:100px;background:red"></div>
<input tabindex="0" style="position: absolute; opacity: 0; pointer-events: none;">
<div id="result"></div>

<script>
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }

    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

let host = document.getElementById('host');

let shadowRoot = host.attachShadow({ mode: 'open' });
shadowRoot.innerHTML = '<div id="victim" tabindex="0">Focusable</div>';

let victim = shadowRoot.getElementById('victim');
victim.focus();

async function runTest() {
    document.addEventListener('blur', () => {
        host.remove();

        if (!victim) return;

        victim.remove();
        victim = null;
        gc();
    }, true);

    let iframe = document.createElement('iframe');
    document.body.appendChild(iframe);
    iframe.contentWindow.focus();

    iframe.remove();

      await new Promise((resolve) => {
        requestAnimationFrame(() => {
            let auxInput = document.querySelector('input');
            auxInput.focus();
            auxInput.dispatchEvent(new KeyboardEvent('keydown', { bubbles: true, cancelable: true, view: window, detail: 0,
            key: 'Tab', code: 'Tab', keyIdentifier: 'U+0009', location: 222, ctrlKey: false, altKey: true, shiftKey: false, metaKey: false }));
            setTimeout(resolve, 0);
        });
    });

    result.textContent = 'PASS';
}

runTest();
</script>
</body>
</html
