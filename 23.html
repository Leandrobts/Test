<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 WebKit Research Harness V13</title>

<style>
body {
    font-family: sans-serif;
    margin: 10px;
    background: #f5f5f5;
}

button {
    padding: 10px 24px;
    font-size: 18px;
}

.panel {
    margin-top: 10px;
    padding: 8px;
    border: 1px solid #777;
    background: white;
    font-family: monospace;
    white-space: pre-wrap;
}

#log {
    max-height: 280px;
    overflow: auto;
}

#testRoot {
    margin-top: 10px;
    min-height: 120px;
    padding: 8px;
    border: 1px solid #444;
    background: white;
}

.box {
    padding: 5px;
    margin: 2px;
    border: 1px solid #888;
}
</style>
</head>

<body>

<h2>PS4 WebKit Research Harness V13</h2>

<button id="start">START</button>

<div id="status" class="panel">READY</div>
<div id="automation" class="panel"></div>
<div id="candidateInfo" class="panel"></div>
<div id="minimizeInfo" class="panel"></div>
<div id="caseInfo" class="panel"></div>
<div id="log" class="panel"></div>

<div id="testRoot"></div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */

var CONFIG = {
    prefix: "PS4WebKitV13.",

    minOps: 10,
    maxOps: 24,

    maxObjects: 5,

    operationDelay: 35,
    caseDelay: 150,
    asyncDelay: 60,

    replayCount: 3,

    maxCorpus: 80,

    generatedProbability: 0.25,

    interestingThreshold: 3
};


/* ============================================================
   STATE
   ============================================================ */

var State = {

    running: false,

    mode: "READY",

    runId: 0,
    caseId: 0,

    seed: 0,
    randomState: 0,

    operations: [],
    operationIndex: 0,

    objects: {},

    currentOperation: "",
    lastCompletedOperation: "",

    caseStarted: false,
    caseCompleted: false,

    events: 0,
    errors: 0,
    asyncCount: 0,

    history: [],
    observations: {},

    score: 0,

    corpus: [],

    candidate: null,

    replay: {
        attempt: 0,
        requested: 0,
        results: []
    },

    minimization: null
};


/* ============================================================
   STORAGE
   ============================================================ */

function key(name)
{
    return CONFIG.prefix + name;
}

function setStore(name, value)
{
    try {
        localStorage.setItem(
            key(name),
            String(value)
        );
    }
    catch (e) {
    }
}

function getStore(name)
{
    try {
        return localStorage.getItem(
            key(name)
        );
    }
    catch (e) {
        return null;
    }
}

function removeStore(name)
{
    try {
        localStorage.removeItem(
            key(name)
        );
    }
    catch (e) {
    }
}


/* ============================================================
   LOG
   ============================================================ */

function log(text)
{
    var box =
        document.getElementById("log");

    box.textContent +=
        text + "\n";

    box.scrollTop =
        box.scrollHeight;

    console.log(text);
}

function setStatus(text)
{
    document
        .getElementById("status")
        .textContent = text;
}


/* ============================================================
   RNG
   ============================================================ */

function setSeed(seed)
{
    State.seed =
        seed >>> 0;

    State.randomState =
        State.seed;
}

function rnd()
{
    State.randomState =
        (
            State.randomState * 1664525 +
            1013904223
        ) >>> 0;

    return State.randomState / 4294967296;
}

function pick(array)
{
    if (!array.length)
        return null;

    return array[
        Math.floor(
            rnd() * array.length
        )
    ];
}

function newSeed()
{
    var previous =
        parseInt(
            getStore("lastSeed") || "1",
            10
        );

    var value =
        (
            Date.now() ^
            previous ^
            Math.floor(
                Math.random() * 0x7fffffff
            )
        ) >>> 0;

    if (!value)
        value = 1;

    setStore(
        "lastSeed",
        value
    );

    return value;
}


/* ============================================================
   UTILITY
   ============================================================ */

function clone(value)
{
    return JSON.parse(
        JSON.stringify(value)
    );
}

function describe(op)
{
    var text =
        op.type;

    if (op.id)
        text += " " + op.id;

    if (op.target)
        text += " -> " + op.target;

    if (op.elementType)
        text +=
            " [" +
            op.elementType +
            "]";

    return text;
}


/* ============================================================
   MAIN CHECKPOINT
   ============================================================ */

function saveCheckpoint()
{
    setStore(
        "mode",
        State.mode
    );

    setStore(
        "runId",
        State.runId
    );

    setStore(
        "caseId",
        State.caseId
    );

    setStore(
        "seed",
        State.seed
    );

    setStore(
        "operations",
        JSON.stringify(
            State.operations
        )
    );

    setStore(
        "operationIndex",
        State.operationIndex
    );

    setStore(
        "currentOperation",
        State.currentOperation
    );

    setStore(
        "lastCompletedOperation",
        State.lastCompletedOperation
    );

    setStore(
        "caseStarted",
        State.caseStarted ? "1" : "0"
    );

    setStore(
        "caseCompleted",
        State.caseCompleted ? "1" : "0"
    );

    setStore(
        "timestamp",
        Date.now()
    );
}


/* ============================================================
   CANDIDATE
   ============================================================ */

function saveCandidate(reason)
{
    State.candidate = {
        id:
            Date.now() +
            "-" +
            Math.floor(
                Math.random() * 100000
            ),

        reason: reason,

        runId:
            State.runId,

        caseId:
            State.caseId,

        seed:
            State.seed,

        operationIndex:
            State.operationIndex,

        currentOperation:
            State.currentOperation,

        lastCompletedOperation:
            State.lastCompletedOperation,

        operations:
            clone(
                State.operations
            ),

        created:
            Date.now()
    };

    setStore(
        "candidate",
        JSON.stringify(
            State.candidate
        )
    );
}

function loadCandidate()
{
    var raw =
        getStore("candidate");

    if (!raw)
        return;

    try {
        State.candidate =
            JSON.parse(raw);
    }
    catch (e) {
        State.candidate = null;
    }
}


/* ============================================================
   CORPUS
   ============================================================ */

function loadCorpus()
{
    var raw =
        getStore("corpus");

    if (!raw) {
        State.corpus = [];
        return;
    }

    try {
        State.corpus =
            JSON.parse(raw);

        if (
            !Array.isArray(
                State.corpus
            )
        ) {
            State.corpus = [];
        }
    }
    catch (e) {
        State.corpus = [];
    }
}

function saveCorpus()
{
    setStore(
        "corpus",
        JSON.stringify(
            State.corpus
        )
    );
}

function addCorpus(
    sequence,
    score
)
{
    State.corpus.push({
        id:
            Date.now() +
            "-" +
            Math.floor(
                rnd() * 100000
            ),

        sequence:
            clone(sequence),

        score: score,

        uses: 0
    });

    State.corpus.sort(
        function(a, b) {
            return b.score - a.score;
        }
    );

    while (
        State.corpus.length >
        CONFIG.maxCorpus
    ) {
        State.corpus.pop();
    }

    saveCorpus();
}

function selectCorpus()
{
    if (!State.corpus.length)
        return null;

    var total = 0;
    var i;

    for (
        i = 0;
        i < State.corpus.length;
        i++
    ) {
        total +=
            Math.max(
                1,
                State.corpus[i].score + 1
            );
    }

    var value =
        rnd() * total;

    for (
        i = 0;
        i < State.corpus.length;
        i++
    ) {
        value -=
            Math.max(
                1,
                State.corpus[i].score + 1
            );

        if (value <= 0)
            return State.corpus[i];
    }

    return State.corpus[0];
}


/* ============================================================
   GENERATOR
   ============================================================ */

var NAMES = [
    "A",
    "B",
    "C",
    "D",
    "E"
];

var ELEMENTS = [
    "div",
    "span",
    "input",
    "button"
];

var OPS = [
    "CREATE",
    "ATTACH",
    "DETACH",
    "REPLACE",
    "MUTATE",
    "LISTEN",
    "DISPATCH",
    "FOCUS",
    "BLUR",
    "LAYOUT",
    "SCHEDULE",
    "ACCESS"
];

function ids(model)
{
    return Object.keys(model);
}

function attached(model)
{
    var result = [];
    var id;

    for (id in model) {
        if (
            model[id].state ===
            "ATTACHED"
        ) {
            result.push(id);
        }
    }

    return result;
}

function detached(model)
{
    var result = [];
    var id;

    for (id in model) {
        if (
            model[id].state ===
            "DETACHED"
        ) {
            result.push(id);
        }
    }

    return result;
}

function generateOperation(model)
{
    var all = ids(model);
    var on = attached(model);
    var off = detached(model);

    var choices = [];

    if (
        all.length <
        CONFIG.maxObjects
    ) {
        choices.push("CREATE");
    }

    if (off.length)
        choices.push("ATTACH");

    if (on.length) {
        choices.push(
            "DETACH",
            "MUTATE",
            "LISTEN",
            "DISPATCH",
            "FOCUS",
            "BLUR",
            "LAYOUT",
            "SCHEDULE"
        );
    }

    if (all.length)
        choices.push("ACCESS");

    if (
        on.length >= 2
    ) {
        choices.push("REPLACE");
    }

    var type =
        pick(
            choices.length ?
            choices :
            ["CREATE"]
        );

    if (
        type === "CREATE"
    ) {
        var free =
            NAMES.filter(
                function(name) {
                    return !model[name];
                }
            );

        var id =
            pick(free);

        model[id] = {
            state: "DETACHED"
        };

        return {
            type: "CREATE",
            id: id,
            elementType:
                pick(ELEMENTS)
        };
    }

    if (
        type === "ATTACH"
    ) {
        var attachId =
            pick(off);

        model[attachId].state =
            "ATTACHED";

        return {
            type: "ATTACH",
            id: attachId
        };
    }

    if (
        type === "DETACH"
    ) {
        var detachId =
            pick(on);

        model[detachId].state =
            "DETACHED";

        return {
            type: "DETACH",
            id: detachId
        };
    }

    if (
        type === "REPLACE"
    ) {
        var source =
            pick(on);

        var targets =
            on.filter(
                function(id) {
                    return id !== source;
                }
            );

        var target =
            pick(targets);

        model[source].state =
            "DETACHED";

        return {
            type: "REPLACE",
            id: source,
            target: target
        };
    }

    return {
        type: type,

        id:
            pick(
                type === "ACCESS" ?
                all :
                on
            )
    };
}

function generateSequence()
{
    var model = {};

    var count =
        CONFIG.minOps +
        Math.floor(
            rnd() *
            (
                CONFIG.maxOps -
                CONFIG.minOps +
                1
            )
        );

    var sequence = [];
    var i;

    for (
        i = 0;
        i < count;
        i++
    ) {
        sequence.push(
            generateOperation(model)
        );
    }

    return sequence;
}


/* ============================================================
   MUTATION
   ============================================================ */

function mutate(sequence)
{
    var result =
        clone(sequence);

    var type =
        Math.floor(rnd() * 5);

    if (
        type === 0 &&
        result.length < CONFIG.maxOps
    ) {
        result.splice(
            Math.floor(
                rnd() *
                (result.length + 1)
            ),
            0,
            {
                type:
                    pick([
                        "MUTATE",
                        "LISTEN",
                        "DISPATCH",
                        "LAYOUT",
                        "SCHEDULE",
                        "ACCESS"
                    ]),

                id:
                    pick(NAMES)
            }
        );
    }

    else if (
        type === 1 &&
        result.length >
        CONFIG.minOps
    ) {
        result.splice(
            Math.floor(
                rnd() *
                result.length
            ),
            1
        );
    }

    else if (
        type === 2 &&
        result.length > 1
    ) {
        var a =
            Math.floor(
                rnd() *
                result.length
            );

        var b =
            Math.floor(
                rnd() *
                result.length
            );

        var temp =
            result[a];

        result[a] =
            result[b];

        result[b] =
            temp;
    }

    else if (
        type === 3 &&
        result.length
    ) {
        result.splice(
            Math.floor(
                rnd() *
                (result.length + 1)
            ),
            0,
            clone([
                pick(result)
            ])[0]
        );
    }

    else if (
        result.length
    ) {
        var index =
            Math.floor(
                rnd() *
                result.length
            );

        result[index] = {
            type:
                pick(OPS),

            id:
                pick(NAMES)
        };
    }

    return result;
}

function buildCase()
{
    if (
        !State.corpus.length ||
        rnd() <
        CONFIG.generatedProbability
    ) {
        return generateSequence();
    }

    var entry =
        selectCorpus();

    entry.uses++;

    return mutate(
        entry.sequence
    );
}


/* ============================================================
   OBSERVATION
   ============================================================ */

function resetObservations()
{
    State.history = [];

    State.observations = {
        operations: {},
        transitions: {}
    };
}

function observe(op)
{
    State.observations
        .operations[op.type] =
        true;

    if (
        State.history.length
    ) {
        var previous =
            State.history[
                State.history.length - 1
            ];

        State.observations
            .transitions[
                previous.type +
                "->" +
                op.type
            ] = true;
    }

    State.history.push(op);

    if (
        State.history.length > 10
    ) {
        State.history.shift();
    }
}

function calculateScore()
{
    var score =
        Math.min(
            Object.keys(
                State.observations.transitions
            ).length,
            8
        );

    if (
        State.events
    )
        score++;

    if (
        State.asyncCount
    )
        score++;

    if (
        State.errors
    )
        score += 3;

    var types =
        State.observations.operations;

    if (
        types.DETACH &&
        types.SCHEDULE
    )
        score += 2;

    if (
        types.LISTEN &&
        types.DISPATCH
    )
        score += 2;

    if (
        types.REPLACE &&
        types.LAYOUT
    )
        score += 2;

    return score;
}


/* ============================================================
   OBJECT RESET
   ============================================================ */

function resetObjects()
{
    State.objects = {};

    var root =
        document.getElementById(
            "testRoot"
        );

    while (
        root.firstChild
    ) {
        root.removeChild(
            root.firstChild
        );
    }
}


/* ============================================================
   EXECUTION
   ============================================================ */

function execute(op)
{
    State.currentOperation =
        describe(op);

    observe(op);

    saveCheckpoint();

    try {

        if (
            op.type === "CREATE"
        ) {
            if (
                State.objects[op.id]
            )
                return;

            var element =
                document.createElement(
                    op.elementType ||
                    "div"
                );

            element.className =
                "box";

            element.textContent =
                op.id;

            State.objects[op.id] = {
                element: element
            };
        }

        else {

            var object =
                State.objects[op.id];

            if (!object)
                return;

            var element =
                object.element;

            if (
                op.type === "ATTACH"
            ) {
                document
                    .getElementById(
                        "testRoot"
                    )
                    .appendChild(
                        element
                    );
            }

            else if (
                op.type === "DETACH"
            ) {
                if (
                    element.parentNode
                ) {
                    element.parentNode
                        .removeChild(
                            element
                        );
                }
            }

            else if (
                op.type === "REPLACE"
            ) {
                var target =
                    State.objects[
                        op.target
                    ];

                if (
                    target &&
                    element.parentNode
                ) {
                    element.parentNode
                        .replaceChild(
                            target.element,
                            element
                        );
                }
            }

            else if (
                op.type === "MUTATE"
            ) {
                element.textContent =
                    op.id +
                    ":" +
                    Math.floor(
                        rnd() * 100000
                    );

                element.setAttribute(
                    "data-case",
                    State.caseId
                );
            }

            else if (
                op.type === "LISTEN"
            ) {
                element.addEventListener(
                    "v13-event",
                    function() {
                        State.events++;
                    },
                    false
                );
            }

            else if (
                op.type === "DISPATCH"
            ) {
                var event =
                    document.createEvent(
                        "Event"
                    );

                event.initEvent(
                    "v13-event",
                    true,
                    true
                );

                element.dispatchEvent(
                    event
                );
            }

            else if (
                op.type === "FOCUS"
            ) {
                if (element.focus)
                    element.focus();
            }

            else if (
                op.type === "BLUR"
            ) {
                if (element.blur)
                    element.blur();
            }

            else if (
                op.type === "LAYOUT"
            ) {
                void element.offsetWidth;

                element.getBoundingClientRect();
            }

            else if (
                op.type === "SCHEDULE"
            ) {
                State.asyncCount++;

                setTimeout(
                    function() {
                        try {
                            void element.parentNode;
                            void element.textContent;
                            void element.offsetWidth;
                        }
                        catch (e) {
                            State.errors++;
                        }
                    },
                    CONFIG.asyncDelay
                );
            }

            else if (
                op.type === "ACCESS"
            ) {
                void element.parentNode;
                void element.textContent;
            }
        }

        State.lastCompletedOperation =
            State.currentOperation;
    }
    catch (e) {
        State.errors++;
    }

    saveCheckpoint();
}


/* ============================================================
   SEQUENCE RUNNER
   ============================================================ */

function runSequence(
    sequence,
    callback
)
{
    resetObjects();

    resetObservations();

    State.operations =
        clone(sequence);

    State.operationIndex = 0;

    State.currentOperation = "";
    State.lastCompletedOperation = "";

    State.events = 0;
    State.errors = 0;
    State.asyncCount = 0;

    State.caseStarted = true;
    State.caseCompleted = false;

    saveCheckpoint();

    function next()
    {
        if (
            State.operationIndex >=
            State.operations.length
        ) {
            setTimeout(
                function() {

                    State.caseCompleted =
                        true;

                    saveCheckpoint();

                    callback(true);

                },
                CONFIG.asyncDelay
            );

            return;
        }

        var op =
            State.operations[
                State.operationIndex
            ];

        execute(op);

        State.operationIndex++;

        saveCheckpoint();

        updateDisplay();

        setTimeout(
            next,
            CONFIG.operationDelay
        );
    }

    next();
}


/* ============================================================
   REPLAY MARKERS
   ============================================================ */

function startReplayMarker()
{
    setStore(
        "replayActive",
        "1"
    );

    setStore(
        "replayCompleted",
        "0"
    );

    setStore(
        "replayAttempt",
        State.replay.attempt
    );
}

function finishReplayMarker()
{
    setStore(
        "replayActive",
        "0"
    );

    setStore(
        "replayCompleted",
        "1"
    );
}


/* ============================================================
   AUTOMATIC REPLAY
   ============================================================ */

function startAutoReplay()
{
    if (!State.candidate)
        return startFuzzing();

    State.mode =
        "AUTO_REPLAY";

    State.replay = {
        attempt: 0,
        requested:
            CONFIG.replayCount,

        results: []
    };

    setStore(
        "replayResults",
        JSON.stringify([])
    );

    runReplay();
}

function runReplay()
{
    if (
        State.replay.attempt >=
        State.replay.requested
    ) {
        evaluateReplay();
        return;
    }

    State.replay.attempt++;

    startReplayMarker();

    setStatus(
        "AUTO REPLAY " +
        State.replay.attempt +
        "/" +
        State.replay.requested
    );

    runSequence(
        State.candidate.operations,
        function() {

            State.replay.results.push(
                "COMPLETED"
            );

            setStore(
                "replayResults",
                JSON.stringify(
                    State.replay.results
                )
            );

            finishReplayMarker();

            setTimeout(
                runReplay,
                200
            );
        }
    );
}

function evaluateReplay()
{
    var interrupted = 0;

    var i;

    for (
        i = 0;
        i < State.replay.results.length;
        i++
    ) {
        if (
            State.replay.results[i] ===
            "INTERRUPTED"
        ) {
            interrupted++;
        }
    }

    /*
     * Uma interrupção persistente entre
     * carregamentos é registrada no init.
     */

    if (
        interrupted > 0
    ) {
        startMinimization();
    }
    else {
        State.candidate = null;

        removeStore("candidate");

        startFuzzing();
    }
}


/* ============================================================
   MINIMIZATION STATE
   ============================================================ */

function createMinimization()
{
    return {
        original:
            clone(
                State.candidate.operations
            ),

        best:
            clone(
                State.candidate.operations
            ),

        chunkSize:
            Math.floor(
                State.candidate.operations.length /
                2
            ),

        chunkIndex: 0,

        phase: "TEST_REMOVE",

        completed: false,

        tests: 0
    };
}

function saveMinimization()
{
    setStore(
        "minimization",
        JSON.stringify(
            State.minimization
        )
    );
}

function loadMinimization()
{
    var raw =
        getStore(
            "minimization"
        );

    if (!raw)
        return;

    try {
        State.minimization =
            JSON.parse(raw);
    }
    catch (e) {
        State.minimization = null;
    }
}


/* ============================================================
   AUTOMATIC MINIMIZATION
   ============================================================ */

function startMinimization()
{
    State.mode =
        "AUTO_MINIMIZE";

    State.minimization =
        createMinimization();

    saveMinimization();

    runMinimizationStep();
}

function buildReducedCandidate()
{
    var m =
        State.minimization;

    var result =
        clone(m.best);

    var start =
        m.chunkIndex *
        m.chunkSize;

    result.splice(
        start,
        m.chunkSize
    );

    return result;
}

function runMinimizationStep()
{
    var m =
        State.minimization;

    if (
        !m ||
        m.completed
    ) {
        finishMinimization();
        return;
    }

    if (
        m.chunkSize < 1 ||
        m.best.length <= 1
    ) {
        m.completed = true;

        saveMinimization();

        finishMinimization();

        return;
    }

    var candidate =
        buildReducedCandidate();

    if (!candidate.length) {

        m.chunkIndex++;

        nextMinimizationChunk();

        return;
    }

    m.tests++;

    saveMinimization();

    State.candidate.operations =
        clone(candidate);

    setStore(
        "candidate",
        JSON.stringify(
            State.candidate
        )
    );

    setStore(
        "minimizeActive",
        "1"
    );

    setStore(
        "minimizeCompleted",
        "0"
    );

    setStatus(
        "MINIMIZE chunk=" +
        m.chunkIndex +
        " size=" +
        m.chunkSize
    );

    runSequence(
        candidate,
        function() {

            /*
             * Se chegou aqui, este teste completou.
             * Portanto o bloco removido não foi
             * confirmado por esta execução como
             * causador da interrupção.
             */

            State.candidate.operations =
                clone(m.best);

            setStore(
                "candidate",
                JSON.stringify(
                    State.candidate
                )
            );

            m.chunkIndex++;

            nextMinimizationChunk();
        }
    );
}

function nextMinimizationChunk()
{
    var m =
        State.minimization;

    var chunks =
        Math.ceil(
            m.best.length /
            m.chunkSize
        );

    if (
        m.chunkIndex >= chunks
    ) {
        m.chunkSize =
            Math.floor(
                m.chunkSize / 2
            );

        m.chunkIndex = 0;
    }

    saveMinimization();

    setTimeout(
        runMinimizationStep,
        200
    );
}

function finishMinimization()
{
    State.mode =
        "FUZZ";

    setStore(
        "minimizeActive",
        "0"
    );

    setStore(
        "minimizeCompleted",
        "1"
    );

    setStore(
        "bestCandidate",
        JSON.stringify(
            State.minimization ?
            State.minimization.best :
            []
        )
    );

    log(
        "MINIMIZATION FINISHED"
    );

    setTimeout(
        startFuzzing,
        500
    );
}


/* ============================================================
   FUZZING LOOP
   ============================================================ */

function startFuzzing()
{
    if (
        State.mode === "FUZZ" &&
        State.running
    ) {
        return;
    }

    State.running = true;

    State.mode =
        "FUZZ";

    State.runId++;

    setStatus(
        "FUZZING"
    );

    function nextCase()
    {
        if (
            State.mode !== "FUZZ"
        )
            return;

        State.caseId++;

        setSeed(
            newSeed()
        );

        var sequence =
            buildCase();

        runSequence(
            sequence,
            function() {

                State.score =
                    calculateScore();

                if (
                    State.score >=
                    CONFIG.interestingThreshold
                ) {
                    addCorpus(
                        sequence,
                        State.score
                    );
                }

                updateDisplay();

                setTimeout(
                    nextCase,
                    CONFIG.caseDelay
                );
            }
        );
    }

    nextCase();
}


/* ============================================================
   INTERRUPTION RECOVERY
   ============================================================ */

function detectInterruptedExecution()
{
    var started =
        getStore("caseStarted");

    var completed =
        getStore("caseCompleted");

    if (
        started === "1" &&
        completed !== "1"
    ) {
        try {
            State.operations =
                JSON.parse(
                    getStore(
                        "operations"
                    ) || "[]"
                );
        }
        catch (e) {
            State.operations = [];
        }

        State.caseId =
            parseInt(
                getStore(
                    "caseId"
                ) || "0",
                10
            );

        State.seed =
            parseInt(
                getStore(
                    "seed"
                ) || "0",
                10
            );

        State.operationIndex =
            parseInt(
                getStore(
                    "operationIndex"
                ) || "0",
                10
            );

        State.currentOperation =
            getStore(
                "currentOperation"
            ) || "";

        State.lastCompletedOperation =
            getStore(
                "lastCompletedOperation"
            ) || "";

        saveCandidate(
            "INTERRUPTED_EXECUTION"
        );

        log(
            "INTERRUPTED CASE RECOVERED"
        );

        return true;
    }

    return false;
}

function detectReplayInterruption()
{
    if (
        getStore(
            "replayActive"
        ) === "1" &&
        getStore(
            "replayCompleted"
        ) !== "1"
    ) {
        var raw =
            getStore(
                "replayResults"
            );

        var results = [];

        try {
            results =
                JSON.parse(raw || "[]");
        }
        catch (e) {
        }

        results.push(
            "INTERRUPTED"
        );

        State.replay.results =
            results;

        setStore(
            "replayResults",
            JSON.stringify(results)
        );

        setStore(
            "replayActive",
            "0"
        );

        return true;
    }

    return false;
}

function detectMinimizeInterruption()
{
    if (
        getStore(
            "minimizeActive"
        ) === "1" &&
        getStore(
            "minimizeCompleted"
        ) !== "1"
    ) {
        return true;
    }

    return false;
}


/* ============================================================
   DISPLAY
   ============================================================ */

function updateDisplay()
{
    document
        .getElementById("automation")
        .textContent =
        "MODE: " +
        State.mode +
        "\nRUN: " +
        State.runId +
        "\nCASE: " +
        State.caseId +
        "\nSEED: " +
        State.seed +
        "\nCORPUS: " +
        State.corpus.length +
        "\n\nPIPELINE:\n" +
        "FUZZ -> RECOVER -> REPLAY -> MINIMIZE -> SAVE";

    var candidateText =
        "NO ACTIVE CANDIDATE";

    if (
        State.candidate
    ) {
        candidateText =
            "CANDIDATE\n\n" +
            "ID: " +
            State.candidate.id +
            "\nCASE: " +
            State.candidate.caseId +
            "\nSEED: " +
            State.candidate.seed +
            "\nINDEX: " +
            State.candidate.operationIndex +
            "\nCURRENT: " +
            State.candidate.currentOperation +
            "\nLAST: " +
            State.candidate.lastCompletedOperation +
            "\nOPS: " +
            State.candidate.operations.length;
    }

    document
        .getElementById("candidateInfo")
        .textContent =
        candidateText;

    var minText =
        "MINIMIZATION: IDLE";

    if (
        State.minimization
    ) {
        minText =
            "MINIMIZATION\n\n" +
            "ORIGINAL: " +
            State.minimization.original.length +
            "\nBEST: " +
            State.minimization.best.length +
            "\nCHUNK SIZE: " +
            State.minimization.chunkSize +
            "\nCHUNK INDEX: " +
            State.minimization.chunkIndex +
            "\nTESTS: " +
            State.minimization.tests +
            "\nPHASE: " +
            State.minimization.phase;
    }

    document
        .getElementById("minimizeInfo")
        .textContent =
        minText;

    var lines = [];
    var i;

    for (
        i = 0;
        i < State.operations.length;
        i++
    ) {
        lines.push(
            (
                i ===
                State.operationIndex ?
                ">> " :
                "   "
            ) +
            "#" +
            ("00" + i).slice(-2) +
            " " +
            describe(
                State.operations[i]
            )
        );
    }

    document
        .getElementById("caseInfo")
        .textContent =
        lines.join("\n") +
        "\n\nCURRENT: " +
        State.currentOperation +
        "\nLAST: " +
        State.lastCompletedOperation +
        "\nERRORS: " +
        State.errors +
        "\nEVENTS: " +
        State.events +
        "\nASYNC: " +
        State.asyncCount;
}


/* ============================================================
   START AUTOMATION
   ============================================================ */

function startAutomation()
{
    if (State.running)
        return;

    State.running = true;

    setStatus(
        "AUTOMATION STARTING"
    );

    /*
     * Caso interrompido detectado na abertura:
     * candidato -> replay automático.
     */

    if (
        State.candidate
    ) {
        startAutoReplay();
        return;
    }

    startFuzzing();
}


/* ============================================================
   INITIALIZATION
   ============================================================ */

State.runId =
    parseInt(
        getStore("runId") || "0",
        10
    );

State.caseId =
    parseInt(
        getStore("caseId") || "0",
        10
    );

loadCorpus();
loadCandidate();
loadMinimization();

var replayInterrupted =
    detectReplayInterruption();

var minimizeInterrupted =
    detectMinimizeInterruption();

var executionInterrupted =
    detectInterruptedExecution();

if (
    replayInterrupted
)
{
    log(
        "REPLAY INTERRUPTION RECOVERED"
    );
}

if (
    minimizeInterrupted
)
{
    log(
        "MINIMIZATION INTERRUPTION RECOVERED"
    );
}

if (
    executionInterrupted
)
{
    log(
        "EXECUTION INTERRUPTION RECOVERED"
    );
}

document
    .getElementById("start")
    .addEventListener(
        "click",
        startAutomation,
        false
    );

updateDisplay();

log(
    "V13 INITIALIZED"
);

</script>
