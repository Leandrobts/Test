<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SVGAnimatedProperty UAF</title>
</head>

<body>

<script>

/*
 * ============================================================
 * Standalone adaptation
 * ============================================================
 *
 * Original internal APIs:
 *
 *     internals.observeGC(...)
 *     GCController.collect()
 *
 * These APIs are available in WebKit's LayoutTest environment,
 * not in a normal browser page.
 *
 * The actual SVG/DOM sequence below is intentionally preserved.
 */


/*
 * Best-effort GC pressure for environments without
 * GCController.collect().
 *
 * This does NOT force a garbage collection and therefore cannot
 * reproduce the determinism of the original LayoutTest.
 */
async function requestGCPressure()
{
    /*
     * First give the engine an asynchronous checkpoint.
     */
    await Promise.resolve();

    /*
     * Temporary allocations intended only to create normal
     * garbage and yield points.
     */
    var garbage = [];

    for (var i = 0; i < 32; ++i) {
        garbage.push(new Array(4096).fill(i));
    }

    garbage = null;

    await new Promise(function (resolve) {
        setTimeout(resolve, 0);
    });

    await Promise.resolve();
}


/*
 * ============================================================
 * Original test
 * ============================================================
 */

window.addEventListener("load", async function () {

    /*
     * Original:
     *
     * let svg0 = document.createElementNS(
     *     'http://www.w3.org/2000/svg',
     *     'svg'
     * );
     */
    let svg0 = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "svg"
    );


    /*
     * Original:
     *
     * let svgAnimatedLength = svg0.width;
     */
    let svgAnimatedLength = svg0.width;


    /*
     * Original:
     *
     * let observation = internals.observeGC(svgAnimatedLength)
     *
     * This is intentionally not replaced with a fake observer.
     *
     * The original observation controls the GC test condition.
     */
    let observation = null;

    if (window.internals &&
        typeof window.internals.observeGC === "function") {

        observation = internals.observeGC(svgAnimatedLength);
    }


    /*
     * Original:
     *
     * let baseVal = svgAnimatedLength.baseVal;
     */
    let baseVal = svgAnimatedLength.baseVal;


    /*
     * Original:
     *
     * let clipPath0 =
     *     document.createElementNS(
     *         'http://www.w3.org/2000/svg',
     *         'clipPath'
     *     );
     */
    let clipPath0 = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "clipPath"
    );


    /*
     * Original:
     *
     * svg0.append(clipPath0);
     */
    svg0.append(clipPath0);


    /*
     * Original:
     *
     * clipPath0.append('');
     */
    clipPath0.append("");


    /*
     * The original uses:
     *
     * await undefined;
     *
     * Preserve that exact asynchronous boundary.
     */
    await undefined;


    /*
     * Original:
     *
     * GCController.collect();
     *
     * Keep the real internal collector when available.
     */
    if (typeof GCController !== "undefined" &&
        typeof GCController.collect === "function") {

        GCController.collect();

    } else {

        /*
         * Standalone fallback.
         *
         * This cannot guarantee collection; it only creates
         * garbage and another scheduling boundary.
         */
        await requestGCPressure();
    }


    /*
     * Original critical operation:
     *
     * baseVal.value = 0;
     *
     * Do not replace this with setAttribute(), because this is
     * specifically the SVGAnimatedProperty path being tested.
     */
    baseVal.value = 0;


    /*
     * Preserve the final DOM operation.
     */
    document.body.innerHTML = "PASS if no crash";

});

</script>
