

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PS4 CSSStyleRule GC Test</title>
</head>
<body>
<pre id="log">Iniciando teste...</pre>

<script>
var output = document.getElementById("log");

function log(msg) {
    output.textContent += "\n" + msg;
}

function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};

        var temp = {
            i: "ab" + n + (n / 100000)
        };

        temp += "foo";
        gcRec(n - 1);
    }

    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

var weakParent = null;
var nested = null;
var registry = null;
var finalized = false;
var attempt = 0;

function setup() {
    var style = document.createElement("style");
    document.head.appendChild(style);

    var sheet = style.sheet;

    sheet.insertRule(
        ".outer { color:red; & .nested { color:blue; } }",
        0
    );

    var parent = sheet.cssRules[0];

    nested = parent.cssRules[0];

    weakParent = new WeakRef(parent);

    registry = new FinalizationRegistry(function(value) {
        finalized = true;
        log("FINALIZED: " + value);
    });

    registry.register(parent, "CSSStyleRule parent");

    log("Parent: " + parent.constructor.name);
    log("Child: " + nested.constructor.name);
    log("Before delete: " +
        (nested.parentRule === parent));

    sheet.deleteRule(0);

    log("Sheet length: " + sheet.cssRules.length);
    log("Parent reference released after setup");

    // parent e sheet sao variaveis locais.
    // Nao retornamos nenhuma referencia ao pai.
}

function checkGC() {
    attempt++;

    gc();

    setTimeout(function() {
        var alive = weakParent.deref() !== undefined;

        log("Attempt " + attempt +
            ": parent alive=" + alive);

        if (!alive) {
            log("PARENT WRAPPER COLLECTED");
            log("Finalized: " + finalized);
            log("TEST FINISHED");
            return;
        }

        if (attempt < 10) {
            setTimeout(checkGC, 500);
        } else {
            log("PARENT WRAPPER NOT COLLECTED");
            log("TEST FINISHED");
        }
    }, 100);
}

try {
    if (typeof WeakRef !== "function" ||
        typeof FinalizationRegistry !== "function") {
        log("WeakRef/FinalizationRegistry unavailable");
    } else {
        setup();
        setTimeout(checkGC, 500);
    }
} catch (e) {
    log("ERROR: " + e.name + ": " + e.message);
}
</script>
</body>
</html>
