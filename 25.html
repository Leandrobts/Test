<!DOCTYPE html>
<html>
<body>
<p>PoC 20 - contentEditable</p>
<div id="host"></div>
<div id="edit" contenteditable="true">texto editável</div>
<div id="result"></div>
<script>
function gc() {
    function gcRec(n) {
        if (n < 1) return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++) gcRec(10);
}

let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable';
shadowRoot.appendChild(victim);
victim.focus();

document.addEventListener('blur', () => {
    victim.remove();
    victim = null;
    gc();
}, true);

setTimeout(() => {
    edit.focus();
    let range = document.createRange();
    range.selectNodeContents(edit);
    let sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    setTimeout(() => {
        victim.focus();
        setTimeout(() => {
            edit.blur();
            result.textContent = 'PASS';
        }, 50);
    }, 50);
}, 100);
</script>
</body>
</html>
