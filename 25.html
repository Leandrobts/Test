<!DOCTYPE html>
<html>
<body>
<script>
let count = 0;

function churn() {
    let f = document.createElement("iframe");

    f.src = "https://leandrobts.github.io/Test/resources/frame-with-text.html";

    document.body.appendChild(f);

    Promise.resolve().then(() => f.remove());

    if (++count < 5)
        setTimeout(churn, 0);
    else
        setTimeout(() => {
            document.body.textContent = "PASS if no crash";
        }, 100);
}

onload = churn;
</script>
</body>
</html>
