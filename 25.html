<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Teste de Regressão: Mutação Concorrente em AXObjectCache</title>
</head>
<body>
<div id="container"></div>
<div id="status">Executando teste...</div>

<script>
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 1000; i++)
        gcRec(10);
}

function runAXStressTest() {
    const container = document.getElementById("container");

    for (let cycle = 0; cycle < 60; cycle++) {
        // 1. Cria nós com atributos monitorados pelas listas diferidas de acessibilidade
        const menu = document.createElement("div");
        menu.setAttribute("role", "menu");

        const liveRegion = document.createElement("div");
        liveRegion.setAttribute("aria-live", "polite");

        const label = document.createElement("label");
        label.textContent = "Label Inicial " + cycle;

        const input = document.createElement("input");
        label.appendChild(input);

        container.appendChild(menu);
        container.appendChild(liveRegion);
        container.appendChild(label);

        // 2. Modifica texto e atributos para preencher m_deferredTextChangedList
        liveRegion.textContent = "Atualização de texto " + cycle;
        label.textContent = "Label Atualizado " + cycle;

        // 3. Modifica a árvore repetidamente para causar reentrância durante o flush
        for (let j = 0; j < 5; j++) {
            const tempSpan = document.createElement("span");
            tempSpan.textContent = "temp " + j;
            menu.appendChild(tempSpan);
            menu.removeChild(tempSpan);
        }

        // 4. Dispara o recálculo diferido de acessibilidade / layout
        container.getBoundingClientRect();

        // 5. Limpa a árvore e força descarte
        container.innerHTML = "";

        if (cycle % 10 === 0) {
            gc();
        }
    }
}

try {
    runAXStressTest();
    document.getElementById("status").innerText = "PASS: Atualizações de acessibilidade tratadas sem Use-After-Free.";
} catch (e) {
    document.getElementById("status").innerText = "FAIL: " + e.message;
}
</script>
</body>
</html>
