<!DOCTYPE html>
<html>
<body>
<p>PoC 21 - window listener</p>
<div id="host"></div>
<div id="result"></div>
<script>
function gc() {
    function gcRec(n) {
        if (n < 1) return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++) gcRec(10);
}

let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable';
shadowRoot.appendChild(victim);
victim.focus();

// escuta no window também
window.addEventListener('blur', () => {
    if (victim) {
        victim.remove();
        victim = null;
        gc();
    }
}, true);

document.addEventListener('blur', () => {
    if (victim) {
        victim.remove();
        victim = null;
        gc();
    }
}, true);

setTimeout(() => {
    window.blur();
    setTimeout(() => {
        let w = null;
        try { w = window.open('about:blank','_blank','width=40,height=40'); if(w) w.focus(); } catch(e){}
        setTimeout(() => {
            try { if(w) w.close(); } catch(e){}
            window.focus();
            result.textContent = 'PASS';
        }, 100);
    }, 50);
}, 50);
</script>
</body>
</html>
