

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>PS4 WebKit DOM/XML Probe</title>
<style>
body {
  background:#101b30;
  color:#e4f2ff;
  font:15px Arial,sans-serif;
  margin:16px;
}
h2 { color:#57d8ff; }
button {
  padding:12px;
  margin:4px;
  background:#008eae;
  color:white;
  border:0;
  font-size:14px;
}
pre {
  background:#193451;
  padding:12px;
  white-space:pre-wrap;
  word-wrap:break-word;
  font:13px monospace;
}
</style>
</head>
<body>
<h2>PS4 WebKit DOM/XML Probe</h2>
<p>Commit: 10f4063</p>
<p>Diagnostico de APIs e alternativas.
Nao executa o gatilho de UAF.</p>

<button onclick="runAll()">Executar testes</button>
<button onclick="showJSON()">Mostrar JSON</button>
<button onclick="clearLog()">Limpar</button>

<pre id="log">Aguardando...</pre>

<script>
var results = {};
var logBox = document.getElementById("log");

function log(s) {
  logBox.textContent += s + "\n";
}

function clearLog() {
  logBox.textContent = "";
  results = {};
}

function record(name, value) {
  results[name] = value;
  log(name + ": " + value);
}

function check(name, fn) {
  try {
    record(name, fn() ? "SIM" : "NAO");
  } catch (e) {
    record(name, "ERRO: " + e.name);
  }
}

function testAPIs() {
  log("=== APIs DO COMMIT ===");

  check("Element.innerHTML", function() {
    return "innerHTML" in document.createElement("div");
  });

  check("Element.outerHTML", function() {
    return "outerHTML" in document.createElement("div");
  });

  check("DocumentFragment", function() {
    return typeof document.createDocumentFragment === "function";
  });

  check("DOMParser", function() {
    return typeof DOMParser !== "undefined";
  });

  check("XMLSerializer", function() {
    return typeof XMLSerializer !== "undefined";
  });

  check("customElements", function() {
    return !!window.customElements;
  });

  check("customElements.define", function() {
    return !!window.customElements &&
      typeof customElements.define === "function";
  });

  check("HTMLElement", function() {
    return typeof HTMLElement === "function";
  });

  check("customElements.get", function() {
    return !!window.customElements &&
      typeof customElements.get === "function";
  });

  check("document.adoptNode", function() {
    return typeof document.adoptNode === "function";
  });

  check("document.importNode", function() {
    return typeof document.importNode === "function";
  });

  check("document.createTreeWalker", function() {
    return typeof document.createTreeWalker === "function";
  });

  check("Node.getRootNode", function() {
    return typeof document.body.getRootNode === "function";
  });

  check("Element.after", function() {
    return typeof document.body.after === "function";
  });

  check("Element.remove", function() {
    return typeof document.body.remove === "function";
  });

  check("Blob", function() {
    return typeof Blob === "function";
  });

  check("URL.createObjectURL", function() {
    return !!window.URL &&
      typeof URL.createObjectURL === "function";
  });

  check("MutationObserver", function() {
    return typeof MutationObserver === "function";
  });

  check("gc()", function() {
    return typeof window.gc === "function";
  });
}

function testXML() {
  log("\n=== XML PARSER ===");

  if (typeof DOMParser === "undefined") {
    record("XML parser funcional", "INDISPONIVEL");
    return;
  }

  try {
    var parser = new DOMParser();

    var doc = parser.parseFromString(
      '<root><item id="a">OK</item></root>',
      "application/xml"
    );

    var item = doc.getElementsByTagName("item")[0];

    record("XML valido", item ? "OK" : "FALHOU");
    record("XML documentElement",
      doc.documentElement.nodeName);

    var bad = parser.parseFromString(
      "<root><item></root>",
      "application/xml"
    );

    var errors = bad.getElementsByTagName("parsererror");

    record("XML erro detectado",
      errors.length ? "SIM" : "NAO");

  } catch (e) {
    record("XML parser", "ERRO: " + e.message);
  }
}

function testFragment() {
  log("\n=== DOCUMENT FRAGMENT ===");

  try {
    var frag = document.createDocumentFragment();
    var node = document.createElement("span");
    node.textContent = "TESTE";
    frag.appendChild(node);

    record("Fragment appendChild",
      frag.firstChild === node ? "OK" : "FALHOU");

    var target = document.createElement("div");
    target.appendChild(frag);

    record("Fragment insercao",
      target.firstChild === node ? "OK" : "FALHOU");

    record("Fragment esvaziado",
      !frag.firstChild ? "SIM" : "NAO");

    record("No parentNode",
      node.parentNode === target ? "OK" : "FALHOU");

  } catch (e) {
    record("Fragment", "ERRO: " + e.message);
  }
}

function testRoots() {
  log("\n=== RAIZES DOM ===");

  try {
    var frag = document.createDocumentFragment();
    var div = document.createElement("div");
    frag.appendChild(div);

    if (typeof div.getRootNode === "function") {
      record("getRootNode fragment",
        div.getRootNode() === frag ? "OK" : "FALHOU");
    } else {
      record("getRootNode fragment", "INDISPONIVEL");
    }

    var root = div;
    while (root.parentNode) {
      root = root.parentNode;
    }

    record("Alternativa parentNode",
      root === frag ? "OK" : "FALHOU");

  } catch (e) {
    record("Raizes DOM", "ERRO: " + e.message);
  }
}

function testAdoption() {
  log("\n=== ADOPT / IMPORT ===");

  try {
    var other = document.implementation.createHTMLDocument("test");
    var node = other.createElement("div");
    node.textContent = "OK";

    var copy = document.importNode(node, true);

    record("importNode copia",
      copy !== node ? "OK" : "FALHOU");

    record("importNode ownerDocument",
      copy.ownerDocument === document ? "OK" : "FALHOU");

    var adopted = document.adoptNode(node);

    record("adoptNode identidade",
      adopted === node ? "OK" : "FALHOU");

    record("adoptNode ownerDocument",
      node.ownerDocument === document ? "OK" : "FALHOU");

  } catch (e) {
    record("Adocao DOM", "ERRO: " + e.message);
  }
}

function testWalker() {
  log("\n=== TREE WALKER ===");

  try {
    var div = document.createElement("div");
    div.innerHTML = "<span>A</span><span>B</span>";

    var walker = document.createTreeWalker(
      div,
      1,
      null,
      false
    );

    var count = 0;
    while (walker.nextNode()) {
      count++;
      if (count > 10) break;
    }

    record("TreeWalker elementos", count);
    record("TreeWalker esperado",
      count === 2 ? "OK" : "FALHOU");

  } catch (e) {
    record("TreeWalker", "ERRO: " + e.message);
  }
}

function testCustomElements() {
  log("\n=== CUSTOM ELEMENTS ===");

  if (!window.customElements ||
      typeof customElements.define !== "function") {
    record("Custom Elements", "INDISPONIVEL");
    return;
  }

  try {
    var name = "ps4-probe-element";

    if (!customElements.get(name)) {
      var TestElement = function() {
        return Reflect.construct(
          HTMLElement, [], TestElement
        );
      };

      if (typeof Reflect === "undefined" ||
          typeof Reflect.construct !== "function") {
        record("Custom Elements construtor",
          "Reflect.construct indisponivel");
        return;
      }

      TestElement.prototype =
        Object.create(HTMLElement.prototype);
      TestElement.prototype.constructor = TestElement;

      Object.setPrototypeOf(TestElement, HTMLElement);
      customElements.define(name, TestElement);
    }

    record("Custom Elements registro",
      customElements.get(name) ? "OK" : "FALHOU");

  } catch (e) {
    record("Custom Elements registro",
      "ERRO: " + e.name + " " + e.message);
  }
}

function testIframe() {
  log("\n=== IFRAME / XHTML ===");

  check("iframe.srcdoc", function() {
    return "srcdoc" in document.createElement("iframe");
  });

  check("document.implementation", function() {
    return !!document.implementation;
  });

  check("createDocument", function() {
    return typeof document.implementation.createDocument ===
      "function";
  });

  check("createHTMLDocument", function() {
    return typeof document.implementation.createHTMLDocument ===
      "function";
  });

  check("DOMImplementation XML", function() {
    var d = document.implementation.createDocument(
      null, "root", null
    );
    return d.documentElement.nodeName === "root";
  });

  check("XHTML MIME Blob", function() {
    var b = new Blob(["<html/>"], {
      type:"application/xhtml+xml"
    });
    return b.type === "application/xhtml+xml";
  });
}

function runAll() {
  clearLog();

  log("PS4 WEBKIT DOM/XML PROBE");
  log("========================");
  log(navigator.userAgent);
  log(new Date().toString());
  log("");

  testAPIs();
  testXML();
  testFragment();
  testRoots();
  testAdoption();
  testWalker();
  testCustomElements();
  testIframe();

  log("\n=== FIM ===");
  log("Diagnostico concluido.");
}

function showJSON() {
  logBox.textContent = JSON.stringify({
    userAgent: navigator.userAgent,
    commit: "10f4063",
    results: results
  }, null, 2);
}

window.onload = runAll;
</script>
</body>
</html>
