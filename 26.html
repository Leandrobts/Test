
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 WebKit Crash Hunter V16</title>

<style>
body {
    margin: 10px;
    font-family: sans-serif;
    background: #f3f3f3;
}

button {
    padding: 12px 32px;
    font-size: 18px;
}

.panel {
    margin-top: 8px;
    padding: 9px;
    background: white;
    border: 1px solid #777;
    font-family: monospace;
    white-space: pre-wrap;
}

#log {
    height: 240px;
    overflow-y: auto;
}

#testRoot {
    margin-top: 10px;
    min-height: 100px;
    padding: 5px;
    border: 1px solid #555;
    background: white;
}

.node {
    padding: 4px;
    margin: 2px;
    border: 1px solid #999;
}
</style>
</head>

<body>

<h2>PS4 WebKit Crash Hunter V16</h2>

<button id="start">START</button>

<div id="status" class="panel">READY</div>
<div id="state" class="panel"></div>
<div id="family" class="panel"></div>
<div id="candidate" class="panel"></div>
<div id="minimizer" class="panel"></div>
<div id="sequence" class="panel"></div>
<div id="log" class="panel"></div>

<div id="testRoot"></div>

<script>
(function () {

"use strict";


/* ============================================================
   CONFIG
   ============================================================ */

var CONFIG = {

    prefix:
        "PS4_WEBKIT_CRASH_V16_",

    minOps:
        8,

    maxOps:
        30,

    maxObjects:
        6,

    operationDelay:
        25,

    asyncDelay:
        60,

    caseDelay:
        70,

    replayAttempts:
        3,

    maxCorpus:
        150,

    maxLogLines:
        600

};


/* ============================================================
   STORAGE
   ============================================================ */

function save(name, value)
{
    try {
        localStorage.setItem(
            CONFIG.prefix + name,
            JSON.stringify(value)
        );
    }
    catch (e) {
    }
}

function load(name, fallback)
{
    try {

        var value =
            localStorage.getItem(
                CONFIG.prefix + name
            );

        if (value === null)
            return fallback;

        return JSON.parse(value);

    }
    catch (e) {

        return fallback;

    }
}

function remove(name)
{
    try {
        localStorage.removeItem(
            CONFIG.prefix + name
        );
    }
    catch (e) {
    }
}

function clone(value)
{
    return JSON.parse(
        JSON.stringify(value)
    );
}


/* ============================================================
   LOG
   ============================================================ */

function log(text)
{
    var box =
        document.getElementById("log");

    var lines =
        box.textContent
            .split("\n")
            .filter(function (x) {
                return x.length;
            });

    lines.push(text);

    while (
        lines.length >
        CONFIG.maxLogLines
    ) {
        lines.shift();
    }

    box.textContent =
        lines.join("\n");

    box.scrollTop =
        box.scrollHeight;

    console.log(text);
}

function status(text)
{
    document
        .getElementById("status")
        .textContent =
        text;
}


/* ============================================================
   RNG
   ============================================================ */

var RNG = {

    seed: 1,

    state: 1

};

function setSeed(seed)
{
    RNG.seed =
        seed >>> 0;

    RNG.state =
        RNG.seed;
}

function rnd()
{
    RNG.state =
        (
            RNG.state * 1664525 +
            1013904223
        ) >>> 0;

    return RNG.state /
        4294967296;
}

function randint(max)
{
    if (max <= 0)
        return 0;

    return Math.floor(
        rnd() * max
    );
}

function pick(array)
{
    if (!array.length)
        return null;

    return array[
        randint(array.length)
    ];
}

function newSeed()
{
    var previous =
        load(
            "lastSeed",
            1
        );

    var seed =
        (
            Date.now() ^
            previous ^
            Math.floor(
                Math.random() *
                0x7fffffff
            )
        ) >>> 0;

    if (!seed)
        seed = 1;

    save(
        "lastSeed",
        seed
    );

    return seed;
}


/* ============================================================
   STATE
   ============================================================ */

var State = {

    running:
        false,

    mode:
        "READY",

    run:
        0,

    caseId:
        0,

    family:
        "",

    sequence:
        [],

    index:
        0,

    objects:
        {},

    current:
        "",

    lastCompleted:
        "",

    started:
        false,

    completed:
        false,

    errors:
        0,

    events:
        0,

    asyncOps:
        0,

    score:
        0,

    history:
        [],

    transitions:
        {},

    operationTypes:
        {},

    corpus:
        [],

    candidate:
        null,

    replay:
        null,

    minimization:
        null,

    stats: {

        cases:
            0,

        completed:
            0,

        interrupted:
            0,

        candidates:
            0,

        minimized:
            0

    }

};


/* ============================================================
   MACHINE STATE
   ============================================================ */

function setMode(mode)
{
    State.mode =
        mode;

    save(
        "mode",
        mode
    );

    updateDisplay();
}


/* ============================================================
   CHECKPOINT
   ============================================================ */

function checkpoint()
{
    save(
        "execution",
        {

            run:
                State.run,

            caseId:
                State.caseId,

            family:
                State.family,

            seed:
                RNG.seed,

            sequence:
                clone(
                    State.sequence
                ),

            index:
                State.index,

            current:
                State.current,

            lastCompleted:
                State.lastCompleted,

            started:
                State.started,

            completed:
                State.completed,

            mode:
                State.mode,

            timestamp:
                Date.now()

        }
    );
}

function clearCheckpoint()
{
    remove("execution");
}


/* ============================================================
   TASK
   ============================================================ */

function saveTask(task)
{
    save(
        "task",
        task
    );
}

function getTask()
{
    return load(
        "task",
        null
    );
}

function clearTask()
{
    remove("task");
}


/* ============================================================
   CANDIDATE
   ============================================================ */

function saveCandidate(reason)
{
    State.candidate = {

        id:
            Date.now() +
            "-" +
            randint(100000),

        reason:
            reason,

        run:
            State.run,

        caseId:
            State.caseId,

        family:
            State.family,

        seed:
            RNG.seed,

        sequence:
            clone(
                State.sequence
            ),

        index:
            State.index,

        current:
            State.current,

        lastCompleted:
            State.lastCompleted,

        timestamp:
            Date.now()

    };

    save(
        "candidate",
        State.candidate
    );

    State.stats.candidates++;

    save(
        "stats",
        State.stats
    );
}

function loadCandidate()
{
    State.candidate =
        load(
            "candidate",
            null
        );
}


/* ============================================================
   CORPUS
   ============================================================ */

function loadCorpus()
{
    State.corpus =
        load(
            "corpus",
            []
        );

    if (
        !Array.isArray(
            State.corpus
        )
    ) {
        State.corpus = [];
    }
}

function saveCorpus()
{
    save(
        "corpus",
        State.corpus
    );
}

function addCorpus(
    sequence,
    score,
    family
)
{
    State.corpus.push({

        id:
            Date.now() +
            "-" +
            randint(100000),

        sequence:
            clone(sequence),

        score:
            score,

        family:
            family,

        uses:
            0,

        timestamp:
            Date.now()

    });

    State.corpus.sort(
        function (a, b) {
            return b.score -
                   a.score;
        }
    );

    while (
        State.corpus.length >
        CONFIG.maxCorpus
    ) {
        State.corpus.pop();
    }

    saveCorpus();
}

function chooseCorpus()
{
    if (!State.corpus.length)
        return null;

    var total =
        0;

    var i;

    for (
        i = 0;
        i < State.corpus.length;
        i++
    ) {

        total +=
            Math.max(
                1,
                State.corpus[i].score
            );
    }

    var value =
        rnd() * total;

    for (
        i = 0;
        i < State.corpus.length;
        i++
    ) {

        value -=
            Math.max(
                1,
                State.corpus[i].score
            );

        if (value <= 0)
            return State.corpus[i];
    }

    return State.corpus[0];
}


/* ============================================================
   MODEL
   ============================================================ */

var IDS = [
    "A",
    "B",
    "C",
    "D",
    "E",
    "F"
];

var ELEMENTS = [
    "div",
    "span",
    "button",
    "input"
];

function modelAttached(model)
{
    var result = [];
    var id;

    for (id in model) {

        if (
            model[id].attached
        ) {
            result.push(id);
        }
    }

    return result;
}

function modelDetached(model)
{
    var result = [];
    var id;

    for (id in model) {

        if (
            !model[id].attached
        ) {
            result.push(id);
        }
    }

    return result;
}


/* ============================================================
   OPERATION HELPERS
   ============================================================ */

function createOp(model)
{
    var available =
        IDS.filter(
            function (id) {
                return !model[id];
            }
        );

    if (!available.length)
        return null;

    var id =
        pick(available);

    model[id] = {
        attached: false
    };

    return {

        type:
            "CREATE",

        id:
            id,

        elementType:
            pick(ELEMENTS)

    };
}

function attachOp(model)
{
    var list =
        modelDetached(model);

    if (!list.length)
        return null;

    var id =
        pick(list);

    model[id].attached =
        true;

    return {

        type:
            "ATTACH",

        id:
            id

    };
}

function detachOp(model)
{
    var list =
        modelAttached(model);

    if (!list.length)
        return null;

    var id =
        pick(list);

    model[id].attached =
        false;

    return {

        type:
            "DETACH",

        id:
            id

    };
}

function replaceOp(model)
{
    var list =
        modelAttached(model);

    if (
        list.length < 2
    )
        return null;

    var source =
        pick(list);

    var targets =
        list.filter(
            function (id) {
                return id !== source;
            }
        );

    var target =
        pick(targets);

    model[source].attached =
        false;

    model[target].attached =
        true;

    return {

        type:
            "REPLACE",

        id:
            source,

        target:
            target

    };
}


/* ============================================================
   FAMILY: DOM LIFECYCLE
   ============================================================ */

function familyDOMLifecycle()
{
    var model = {};
    var result = [];

    var create =
        createOp(model);

    if (create)
        result.push(create);

    var attach =
        attachOp(model);

    if (attach)
        result.push(attach);

    var choices = [
        detachOp,
        attachOp,
        replaceOp,
        detachOp,
        replaceOp
    ];

    var i;

    for (
        i = 0;
        i < 7;
        i++
    ) {

        var operation =
            pick(choices)(model);

        if (operation)
            result.push(operation);

        var on =
            modelAttached(model);

        if (
            on.length
        ) {

            result.push({

                type:
                    pick([
                        "MUTATE",
                        "LAYOUT",
                        "ACCESS"
                    ]),

                id:
                    pick(on)

            });
        }
    }

    return result;
}


/* ============================================================
   FAMILY: EVENT LIFECYCLE
   ============================================================ */

function familyEventLifecycle()
{
    var model = {};
    var result = [];

    var create =
        createOp(model);

    if (create)
        result.push(create);

    var attach =
        attachOp(model);

    if (attach)
        result.push(attach);

    var on =
        modelAttached(model);

    if (!on.length)
        return result;

    var id =
        pick(on);

    result.push({
        type: "LISTEN",
        id: id
    });

    result.push({
        type: "DISPATCH",
        id: id
    });

    result.push({
        type: "DETACH",
        id: id
    });

    result.push({
        type: "DISPATCH",
        id: id
    });

    result.push({
        type: "MUTATE",
        id: id
    });

    result.push({
        type: "LAYOUT",
        id: id
    });

    result.push({
        type: "DISPATCH",
        id: id
    });

    return result;
}


/* ============================================================
   FAMILY: FOCUS / BLUR
   ============================================================ */

function familyFocusBlur()
{
    var model = {};
    var result = [];

    var create =
        createOp(model);

    if (create)
        result.push(create);

    var attach =
        attachOp(model);

    if (attach)
        result.push(attach);

    var on =
        modelAttached(model);

    if (!on.length)
        return result;

    var id =
        pick(on);

    result.push({
        type: "FOCUS",
        id: id
    });

    result.push({
        type: "MUTATE",
        id: id
    });

    result.push({
        type: "BLUR",
        id: id
    });

    result.push({
        type: "DETACH",
        id: id
    });

    result.push({
        type: "FOCUS",
        id: id
    });

    result.push({
        type: "BLUR",
        id: id
    });

    result.push({
        type: "ATTACH",
        id: id
    });

    result.push({
        type: "FOCUS",
        id: id
    });

    result.push({
        type: "BLUR",
        id: id
    });

    return result;
}


/* ============================================================
   FAMILY: MUTATION
   ============================================================ */

function familyMutation()
{
    var model = {};
    var result = [];

    var create =
        createOp(model);

    if (create)
        result.push(create);

    var attach =
        attachOp(model);

    if (attach)
        result.push(attach);

    var on =
        modelAttached(model);

    if (!on.length)
        return result;

    var id =
        pick(on);

    var i;

    for (
        i = 0;
        i < 8;
        i++
    ) {

        result.push({

            type:
                pick([
                    "MUTATE",
                    "LAYOUT",
                    "ACCESS"
                ]),

            id:
                id

        });

        if (
            rnd() < 0.25
        ) {

            result.push({
                type: "DETACH",
                id: id
            });

            result.push({
                type: "ATTACH",
                id: id
            });
        }
    }

    return result;
}


/* ============================================================
   FAMILY: LAYOUT
   ============================================================ */

function familyLayout()
{
    var model = {};
    var result = [];

    var i;

    for (
        i = 0;
        i < 3;
        i++
    ) {

        var create =
            createOp(model);

        if (create)
            result.push(create);

        var attach =
            attachOp(model);

        if (attach)
            result.push(attach);
    }

    var on =
        modelAttached(model);

    for (
        i = 0;
        i < on.length;
        i++
    ) {

        result.push({

            type:
                "LAYOUT",

            id:
                on[i]

        });

        result.push({

            type:
                "MUTATE",

            id:
                on[i]

        });

        result.push({

            type:
                "LAYOUT",

            id:
                on[i]

        });
    }

    return result;
}


/* ============================================================
   FAMILY: ASYNC LIFECYCLE
   ============================================================ */

function familyAsync()
{
    var model = {};
    var result = [];

    var create =
        createOp(model);

    if (create)
        result.push(create);

    var attach =
        attachOp(model);

    if (attach)
        result.push(attach);

    var on =
        modelAttached(model);

    if (!on.length)
        return result;

    var id =
        pick(on);

    result.push({
        type: "LISTEN",
        id: id
    });

    result.push({
        type: "ASYNC_ACCESS",
        id: id
    });

    result.push({
        type: "DETACH",
        id: id
    });

    result.push({
        type: "MUTATE",
        id: id
    });

    result.push({
        type: "LAYOUT",
        id: id
    });

    result.push({
        type: "ASYNC_ACCESS",
        id: id
    });

    result.push({
        type: "ATTACH",
        id: id
    });

    result.push({
        type: "ASYNC_ACCESS",
        id: id
    });

    return result;
}


/* ============================================================
   FAMILY: FRAME / DOCUMENT LIFECYCLE
   ============================================================ */

function familyFrameLifecycle()
{
    /*
     * Uses ordinary DOM iframe lifecycle.
     * No scripting of another origin.
     */

    return [

        {
            type:
                "FRAME_CREATE",

            id:
                "A"

        },

        {
            type:
                "FRAME_LOAD",

            id:
                "A"

        },

        {
            type:
                "FRAME_MUTATE",

            id:
                "A"

        },

        {
            type:
                "FRAME_REMOVE",

            id:
                "A"

        },

        {
            type:
                "FRAME_ACCESS",

            id:
                "A"

        },

        {
            type:
                "FRAME_CREATE",

            id:
                "B"

        },

        {
            type:
                "FRAME_REMOVE",

            id:
                "B"

        }

    ];
}


/* ============================================================
   FAMILY SELECTION
   ============================================================ */

var FAMILY_BUILDERS = [

    {
        name:
            "DOM_LIFECYCLE",

        weight:
            25,

        build:
            familyDOMLifecycle

    },

    {
        name:
            "EVENT_LIFECYCLE",

        weight:
            18,

        build:
            familyEventLifecycle

    },

    {
        name:
            "FOCUS_BLUR",

        weight:
            12,

        build:
            familyFocusBlur

    },

    {
        name:
            "MUTATION",

        weight:
            14,

        build:
            familyMutation

    },

    {
        name:
            "LAYOUT",

        weight:
            12,

        build:
            familyLayout

    },

    {
        name:
            "ASYNC_LIFECYCLE",

        weight:
            14,

        build:
            familyAsync

    },

    {
        name:
            "FRAME_LIFECYCLE",

        weight:
            5,

        build:
            familyFrameLifecycle

    }

];

function chooseFamily()
{
    var total = 0;
    var i;

    for (
        i = 0;
        i < FAMILY_BUILDERS.length;
        i++
    ) {
        total +=
            FAMILY_BUILDERS[i].weight;
    }

    var value =
        rnd() * total;

    for (
        i = 0;
        i < FAMILY_BUILDERS.length;
        i++
    ) {

        value -=
            FAMILY_BUILDERS[i].weight;

        if (
            value <= 0
        ) {
            return FAMILY_BUILDERS[i];
        }
    }

    return FAMILY_BUILDERS[0];
}


/* ============================================================
   BUILD CASE
   ============================================================ */

function buildCase()
{
    /*
     * Corpus mutation.
     */

    if (
        State.corpus.length &&
        rnd() < 0.25
    ) {

        var entry =
            chooseCorpus();

        if (entry) {

            entry.uses++;

            State.family =
                entry.family;

            return mutateSequence(
                entry.sequence
            );
        }
    }

    /*
     * Structured family.
     */

    var family =
        chooseFamily();

    State.family =
        family.name;

    return family.build();
}


/* ============================================================
   MUTATION
   ============================================================ */

function mutateSequence(sequence)
{
    var result =
        clone(sequence);

    if (!result.length)
        return result;

    var mode =
        randint(6);

    if (
        mode === 0 &&
        result.length <
        CONFIG.maxOps
    ) {

        var index =
            randint(
                result.length + 1
            );

        result.splice(
            index,
            0,
            clone(
                pick(result)
            )
        );
    }

    else if (
        mode === 1 &&
        result.length >
        CONFIG.minOps
    ) {

        result.splice(
            randint(
                result.length
            ),
            1
        );
    }

    else if (
        mode === 2 &&
        result.length > 1
    ) {

        var a =
            randint(
                result.length
            );

        var b =
            randint(
                result.length
            );

        var temp =
            result[a];

        result[a] =
            result[b];

        result[b] =
            temp;
    }

    else if (
        mode === 3
    ) {

        result.push(
            clone(
                pick(result)
            )
        );
    }

    else if (
        mode === 4
    ) {

        var index2 =
            randint(
                result.length
            );

        result[index2] = {

            type:
                pick([
                    "MUTATE",
                    "LAYOUT",
                    "ACCESS",
                    "LISTEN",
                    "DISPATCH",
                    "ASYNC_ACCESS"
                ]),

            id:
                pick(IDS)

        };
    }

    else {

        /*
         * Duplicate a lifecycle operation.
         */

        var candidates =
            result.filter(
                function (op) {

                    return (
                        op.type ===
                        "DETACH" ||

                        op.type ===
                        "ATTACH" ||

                        op.type ===
                        "REPLACE" ||

                        op.type ===
                        "LISTEN" ||

                        op.type ===
                        "DISPATCH"
                    );

                }
            );

        if (
            candidates.length
        ) {

            result.splice(
                randint(
                    result.length + 1
                ),
                0,
                clone(
                    pick(candidates)
                )
            );
        }
    }

    while (
        result.length >
        CONFIG.maxOps
    ) {
        result.pop();
    }

    return result;
}


/* ============================================================
   OBSERVATION
   ============================================================ */

function resetObservation()
{
    State.history = [];
    State.transitions = {};
    State.operationTypes = {};
}

function observe(op)
{
    State.operationTypes[
        op.type
    ] = true;

    if (
        State.history.length
    ) {

        var previous =
            State.history[
                State.history.length - 1
            ];

        var transition =
            previous.type +
            "->" +
            op.type;

        State.transitions[
            transition
        ] = true;
    }

    State.history.push(op);

    if (
        State.history.length > 12
    ) {
        State.history.shift();
    }
}

function calculateScore()
{
    var score =
        Math.min(
            10,
            Object.keys(
                State.transitions
            ).length
        );

    var t =
        State.operationTypes;

    if (
        t.DETACH &&
        t.ATTACH
    )
        score += 2;

    if (
        t.DETACH &&
        t.ASYNC_ACCESS
    )
        score += 3;

    if (
        t.LISTEN &&
        t.DISPATCH
    )
        score += 2;

    if (
        t.REPLACE &&
        t.LAYOUT
    )
        score += 2;

    if (
        t.FOCUS &&
        t.BLUR
    )
        score += 1;

    if (
        t.FRAME_REMOVE &&
        t.FRAME_ACCESS
    )
        score += 2;

    if (
        State.errors
    )
        score += 2;

    return score;
}


/* ============================================================
   DOM RESET
   ============================================================ */

function resetDOM()
{
    State.objects = {};

    var root =
        document.getElementById(
            "testRoot"
        );

    while (
        root.firstChild
    ) {
        root.removeChild(
            root.firstChild
        );
    }
}


/* ============================================================
   FRAME HELPERS
   ============================================================ */

function executeFrameOperation(op)
{
    var root =
        document.getElementById(
            "testRoot"
        );

    if (
        op.type ===
        "FRAME_CREATE"
    ) {

        var frame =
            document.createElement(
                "iframe"
            );

        frame.width =
            "1";

        frame.height =
            "1";

        frame.setAttribute(
            "data-v16-frame",
            op.id
        );

        State.objects[
            "FRAME_" + op.id
        ] = {

            element:
                frame

        };

        root.appendChild(
            frame
        );

        return;
    }

    var object =
        State.objects[
            "FRAME_" + op.id
        ];

    if (!object)
        return;

    var frame =
        object.element;

    if (
        op.type ===
        "FRAME_LOAD"
    ) {

        try {

            frame.src =
                "about:blank";

        }
        catch (e) {

            State.errors++;

        }

    }

    else if (
        op.type ===
        "FRAME_MUTATE"
    ) {

        try {

            frame.setAttribute(
                "data-mutated",
                String(
                    randint(100000)
                )
            );

        }
        catch (e) {

            State.errors++;

        }

    }

    else if (
        op.type ===
        "FRAME_REMOVE"
    ) {

        if (
            frame.parentNode
        ) {

            frame.parentNode
                .removeChild(
                    frame
                );
        }
    }

    else if (
        op.type ===
        "FRAME_ACCESS"
    ) {

        try {

            void frame.contentWindow;

            void frame.contentDocument;

        }
        catch (e) {

            State.errors++;

        }
    }
}


/* ============================================================
   EXECUTE
   ============================================================ */

function executeOperation(op)
{
    State.current =
        describe(op);

    observe(op);

    checkpoint();

    try {

        if (
            op.type.indexOf(
                "FRAME_"
            ) === 0
        ) {

            executeFrameOperation(
                op
            );

        }

        else if (
            op.type ===
            "CREATE"
        ) {

            if (
                State.objects[op.id]
            )
                return;

            var element =
                document.createElement(
                    op.elementType ||
                    "div"
                );

            element.className =
                "node";

            element.textContent =
                op.id;

            State.objects[
                op.id
            ] = {

                element:
                    element

            };

        }

        else {

            var object =
                State.objects[
                    op.id
                ];

            if (!object)
                return;

            var element =
                object.element;

            if (
                op.type ===
                "ATTACH"
            ) {

                document
                    .getElementById(
                        "testRoot"
                    )
                    .appendChild(
                        element
                    );
            }

            else if (
                op.type ===
                "DETACH"
            ) {

                if (
                    element.parentNode
                ) {

                    element.parentNode
                        .removeChild(
                            element
                        );
                }
            }

            else if (
                op.type ===
                "REPLACE"
            ) {

                var target =
                    State.objects[
                        op.target
                    ];

                if (
                    target &&
                    element.parentNode
                ) {

                    element.parentNode
                        .replaceChild(
                            target.element,
                            element
                        );
                }
            }

            else if (
                op.type ===
                "MUTATE"
            ) {

                element.textContent =
                    op.id +
                    ":" +
                    randint(
                        1000000
                    );

                element.setAttribute(
                    "data-v16",
                    String(
                        State.caseId
                    )
                );
            }

            else if (
                op.type ===
                "LISTEN"
            ) {

                element.addEventListener(
                    "v16-event",
                    function () {

                        State.events++;

                    },
                    false
                );
            }

            else if (
                op.type ===
                "DISPATCH"
            ) {

                var event =
                    document.createEvent(
                        "Event"
                    );

                event.initEvent(
                    "v16-event",
                    true,
                    true
                );

                element.dispatchEvent(
                    event
                );
            }

            else if (
                op.type ===
                "FOCUS"
            ) {

                if (
                    element.focus
                )
                    element.focus();
            }

            else if (
                op.type ===
                "BLUR"
            ) {

                if (
                    element.blur
                )
                    element.blur();
            }

            else if (
                op.type ===
                "LAYOUT"
            ) {

                void element.offsetWidth;

                element.getBoundingClientRect();

                void element.scrollTop;
            }

            else if (
                op.type ===
                "ASYNC_ACCESS"
            ) {

                State.asyncOps++;

                (function (
                    reference
                ) {

                    setTimeout(
                        function () {

                            try {

                                void reference.parentNode;

                                void reference.textContent;

                                void reference.offsetWidth;

                                reference.getBoundingClientRect();

                            }
                            catch (e) {

                                State.errors++;

                            }

                        },
                        CONFIG.asyncDelay
                    );

                })(element);
            }

            else if (
                op.type ===
                "ACCESS"
            ) {

                void element.parentNode;

                void element.textContent;

                void element.offsetWidth;

            }
        }

        State.lastCompleted =
            State.current;

    }
    catch (e) {

        State.errors++;

        log(
            "JS EXCEPTION: " +
            e.name
        );
    }

    checkpoint();
}


/* ============================================================
   DESCRIPTION
   ============================================================ */

function describe(op)
{
    var text =
        op.type;

    if (op.id)
        text +=
            " " +
            op.id;

    if (op.target)
        text +=
            " -> " +
            op.target;

    return text;
}


/* ============================================================
   RUN SEQUENCE
   ============================================================ */

function runSequence(
    sequence,
    callback
)
{
    resetDOM();

    resetObservation();

    State.sequence =
        clone(sequence);

    State.index =
        0;

    State.current =
        "";

    State.lastCompleted =
        "";

    State.errors =
        0;

    State.events =
        0;

    State.asyncOps =
        0;

    State.started =
        true;

    State.completed =
        false;

    checkpoint();

    function next()
    {
        if (
            State.index >=
            State.sequence.length
        ) {

            setTimeout(
                function () {

                    State.completed =
                        true;

                    State.stats.completed++;

                    save(
                        "stats",
                        State.stats
                    );

                    checkpoint();

                    callback();

                },
                CONFIG.asyncDelay
            );

            return;
        }

        var op =
            State.sequence[
                State.index
            ];

        executeOperation(op);

        State.index++;

        checkpoint();

        updateDisplay();

        setTimeout(
            next,
            CONFIG.operationDelay
        );
    }

    next();
}


/* ============================================================
   FUZZ LOOP
   ============================================================ */

function startFuzz()
{
    State.running =
        true;

    State.run++;

    setMode(
        "FUZZ"
    );

    function nextCase()
    {
        if (
            State.mode !==
            "FUZZ"
        )
            return;

        State.caseId++;

        State.stats.cases++;

        setSeed(
            newSeed()
        );

        var sequence =
            buildCase();

        runSequence(
            sequence,
            function () {

                State.score =
                    calculateScore();

                if (
                    State.score >= 5
                ) {

                    addCorpus(
                        sequence,
                        State.score,
                        State.family
                    );
                }

                clearCheckpoint();

                updateDisplay();

                setTimeout(
                    nextCase,
                    CONFIG.caseDelay
                );
            }
        );
    }

    nextCase();
}


/* ============================================================
   REPLAY
   ============================================================ */

function createReplay()
{
    return {

        attempt:
            0,

        required:
            CONFIG.replayAttempts,

        completed:
            0,

        interrupted:
            0

    };
}

function startReplay()
{
    if (
        !State.candidate
    ) {

        startFuzz();

        return;
    }

    State.replay =
        createReplay();

    save(
        "replay",
        State.replay
    );

    setMode(
        "REPLAY"
    );

    replayNext();
}

function replayNext()
{
    if (
        State.replay.attempt >=
        State.replay.required
    ) {

        finishReplay();

        return;
    }

    State.replay.attempt++;

    save(
        "replay",
        State.replay
    );

    saveTask({

        type:
            "REPLAY",

        attempt:
            State.replay.attempt,

        candidateId:
            State.candidate.id,

        awaiting:
            true

    });

    runSequence(
        State.candidate.sequence,
        function () {

            State.replay.completed++;

            save(
                "replay",
                State.replay
            );

            clearTask();

            clearCheckpoint();

            setTimeout(
                replayNext,
                120
            );
        }
    );
}

function finishReplay()
{
    if (
        State.replay.interrupted >
        0
    ) {

        startMinimization();

        return;
    }

    /*
     * Candidate not reproduced.
     */

    clearCandidate();

    remove("replay");

    State.replay =
        null;

    startFuzz();
}


/* ============================================================
   MINIMIZATION
   ============================================================ */

function createMinimizer()
{
    return {

        original:
            clone(
                State.candidate.sequence
            ),

        best:
            clone(
                State.candidate.sequence
            ),

        chunkSize:
            Math.max(
                1,
                Math.floor(
                    State.candidate.sequence.length /
                    2
                )
            ),

        chunk:
            0,

        tests:
            0,

        accepted:
            0,

        rejected:
            0,

        completed:
            false

    };
}

function startMinimization()
{
    State.minimization =
        load(
            "minimizer",
            null
        );

    if (
        !State.minimization
    ) {

        State.minimization =
            createMinimizer();

    }

    save(
        "minimizer",
        State.minimization
    );

    setMode(
        "MINIMIZE"
    );

    minimizationStep();
}

function reduction()
{
    var m =
        State.minimization;

    var start =
        m.chunk *
        m.chunkSize;

    var result =
        clone(
            m.best
        );

    result.splice(
        start,
        m.chunkSize
    );

    return result;
}

function minimizationStep()
{
    var m =
        State.minimization;

    if (
        !m ||
        m.completed
    ) {

        finishMinimization();

        return;
    }

    if (
        m.best.length <= 1 ||
        m.chunkSize < 1
    ) {

        m.completed =
            true;

        save(
            "minimizer",
            m
        );

        finishMinimization();

        return;
    }

    var proposed =
        reduction();

    if (
        !proposed.length
    ) {

        advanceMinimization();

        return;
    }

    m.tests++;

    save(
        "minimizer",
        m
    );

    /*
     * IMPORTANT:
     * task is persisted BEFORE
     * executing the proposed case.
     */

    saveTask({

        type:
            "MINIMIZE",

        candidateId:
            State.candidate.id,

        proposed:
            clone(proposed),

        bestBefore:
            clone(m.best),

        chunkSize:
            m.chunkSize,

        chunk:
            m.chunk,

        awaiting:
            true,

        timestamp:
            Date.now()

    });

    State.candidate.sequence =
        clone(proposed);

    save(
        "candidate",
        State.candidate
    );

    runSequence(
        proposed,
        function () {

            /*
             * Completed normally:
             * reduction is rejected.
             */

            m.rejected++;

            State.candidate.sequence =
                clone(m.best);

            save(
                "candidate",
                State.candidate
            );

            clearTask();

            clearCheckpoint();

            save(
                "minimizer",
                m
            );

            advanceMinimization();

        }
    );
}

function advanceMinimization()
{
    var m =
        State.minimization;

    var chunks =
        Math.ceil(
            m.best.length /
            m.chunkSize
        );

    m.chunk++;

    if (
        m.chunk >= chunks
    ) {

        m.chunk = 0;

        m.chunkSize =
            Math.floor(
                m.chunkSize /
                2
            );
    }

    save(
        "minimizer",
        m
    );

    if (
        m.chunkSize < 1 ||
        m.best.length <= 1
    ) {

        m.completed =
            true;

        save(
            "minimizer",
            m
        );

        finishMinimization();

        return;
    }

    setTimeout(
        minimizationStep,
        100
    );
}


/* ============================================================
   RECOVER MINIMIZATION
   ============================================================ */

function recoverMinimization(task)
{
    State.candidate =
        load(
            "candidate",
            null
        );

    State.minimization =
        load(
            "minimizer",
            null
        );

    if (
        !State.candidate ||
        !State.minimization
    )
        return false;

    /*
     * The proposed sequence was executing
     * when the page disappeared.
     *
     * It becomes the new best candidate
     * for crash-hunting purposes.
     */

    State.minimization.best =
        clone(
            task.proposed
        );

    State.minimization.accepted++;

    State.minimization.chunk =
        0;

    State.minimization.chunkSize =
        Math.max(
            1,
            Math.floor(
                State.minimization.best.length /
                2
            )
        );

    State.candidate.sequence =
        clone(
            State.minimization.best
        );

    save(
        "candidate",
        State.candidate
    );

    save(
        "minimizer",
        State.minimization
    );

    clearTask();

    State.stats.minimized++;

    save(
        "stats",
        State.stats
    );

    log(
        "MINIMIZATION REDUCTION ACCEPTED"
    );

    return true;
}


/* ============================================================
   FINISH MINIMIZATION
   ============================================================ */

function finishMinimization()
{
    if (
        !State.minimization
    ) {

        startFuzz();

        return;
    }

    var result = {

        id:
            Date.now(),

        candidateId:
            State.candidate ?
            State.candidate.id :
            null,

        family:
            State.candidate ?
            State.candidate.family :
            null,

        seed:
            State.candidate ?
            State.candidate.seed :
            null,

        original:
            clone(
                State.minimization.original
            ),

        minimized:
            clone(
                State.minimization.best
            ),

        originalOperations:
            State.minimization.original.length,

        minimizedOperations:
            State.minimization.best.length,

        tests:
            State.minimization.tests,

        accepted:
            State.minimization.accepted,

        rejected:
            State.minimization.rejected,

        timestamp:
            Date.now()

    };

    save(
        "bestCrash",
        result
    );

    log(
        "================================"
    );

    log(
        "MINIMIZED CRASH CANDIDATE"
    );

    log(
        "FAMILY: " +
        result.family
    );

    log(
        "SEED: " +
        result.seed
    );

    log(
        "ORIGINAL: " +
        result.originalOperations
    );

    log(
        "MINIMIZED: " +
        result.minimizedOperations
    );

    log(
        "TESTS: " +
        result.tests
    );

    log(
        "================================"
    );

    clearTask();

    clearCheckpoint();

    clearCandidate();

    remove("replay");

    remove("minimizer");

    State.replay =
        null;

    State.minimization =
        null;

    setTimeout(
        startFuzz,
        300
    );
}


/* ============================================================
   RECOVERY
   ============================================================ */

function recover()
{
    var task =
        getTask();

    var execution =
        load(
            "execution",
            null
        );

    /*
     * MINIMIZATION
     */

    if (
        task &&
        task.type ===
        "MINIMIZE" &&
        task.awaiting
    ) {

        if (
            recoverMinimization(
                task
            )
        ) {

            setMode(
                "MINIMIZE"
            );

            setTimeout(
                minimizationStep,
                250
            );

            return true;
        }
    }

    /*
     * REPLAY
     */

    if (
        task &&
        task.type ===
        "REPLAY" &&
        task.awaiting
    ) {

        State.candidate =
            load(
                "candidate",
                null
            );

        State.replay =
            load(
                "replay",
                createReplay()
            );

        if (
            State.candidate
        ) {

            State.replay.interrupted++;

            save(
                "replay",
                State.replay
            );

            clearTask();

            log(
                "REPLAY INTERRUPTION RECOVERED"
            );

            setMode(
                "REPLAY"
            );

            setTimeout(
                replayNext,
                250
            );

            return true;
        }
    }

    /*
     * FUZZ CASE
     */

    if (
        execution &&
        execution.started &&
        !execution.completed
    ) {

        State.run =
            execution.run;

        State.caseId =
            execution.caseId;

        State.family =
            execution.family;

        setSeed(
            execution.seed
        );

        State.sequence =
            execution.sequence;

        State.index =
            execution.index;

        State.current =
            execution.current;

        State.lastCompleted =
            execution.lastCompleted;

        State.stats.interrupted++;

        save(
            "stats",
            State.stats
        );

        saveCandidate(
            "INTERRUPTED_CASE"
        );

        log(
            "CRASH CANDIDATE RECOVERED"
        );

        return true;
    }

    return false;
}


/* ============================================================
   DISPLAY
   ============================================================ */

function updateDisplay()
{
    document
        .getElementById("state")
        .textContent =

        "MODE: " +
        State.mode +

        "\nRUN: " +
        State.run +

        "\nCASE: " +
        State.caseId +

        "\nSEED: " +
        RNG.seed +

        "\nFAMILY: " +
        State.family +

        "\nCORPUS: " +
        State.corpus.length +

        "\n\nCASES: " +
        State.stats.cases +

        "\nCOMPLETED: " +
        State.stats.completed +

        "\nINTERRUPTED: " +
        State.stats.interrupted +

        "\nCANDIDATES: " +
        State.stats.candidates +

        "\nMINIMIZED: " +
        State.stats.minimized;

    document
        .getElementById("family")
        .textContent =

        "STATEFUL FAMILIES\n\n" +

        "DOM_LIFECYCLE\n" +
        "EVENT_LIFECYCLE\n" +
        "FOCUS_BLUR\n" +
        "MUTATION\n" +
        "LAYOUT\n" +
        "ASYNC_LIFECYCLE\n" +
        "FRAME_LIFECYCLE\n\n" +

        "Current: " +
        State.family;

    if (
        State.candidate
    ) {

        document
            .getElementById("candidate")
            .textContent =

            "CRASH CANDIDATE\n\n" +

            "ID: " +
            State.candidate.id +

            "\nFamily: " +
            State.candidate.family +

            "\nSeed: " +
            State.candidate.seed +

            "\nCase: " +
            State.candidate.caseId +

            "\nIndex: " +
            State.candidate.index +

            "\nCurrent: " +
            State.candidate.current +

            "\nLast: " +
            State.candidate.lastCompleted +

            "\nOperations: " +
            State.candidate.sequence.length;

    }
    else {

        document
            .getElementById("candidate")
            .textContent =
            "CRASH CANDIDATE\nNONE";
    }

    if (
        State.minimization
    ) {

        var m =
            State.minimization;

        document
            .getElementById("minimizer")
            .textContent =

            "PERSISTENT MINIMIZATION\n\n" +

            "Original: " +
            m.original.length +

            "\nBest: " +
            m.best.length +

            "\nChunk size: " +
            m.chunkSize +

            "\nChunk: " +
            m.chunk +

            "\nTests: " +
            m.tests +

            "\nAccepted: " +
            m.accepted +

            "\nRejected: " +
            m.rejected;

    }
    else {

        document
            .getElementById("minimizer")
            .textContent =
            "MINIMIZATION\nIDLE";
    }

    var lines = [];

    var i;

    for (
        i = 0;
        i < State.sequence.length;
        i++
    ) {

        lines.push(

            (
                i === State.index ?
                ">> " :
                "   "
            ) +

            "#" +
            ("00" + i).slice(-2) +
            " " +

            describe(
                State.sequence[i]
            )
        );
    }

    document
        .getElementById("sequence")
        .textContent =

        lines.join("\n") +

        "\n\nCURRENT: " +
        State.current +

        "\nLAST: " +
        State.lastCompleted +

        "\nERRORS: " +
        State.errors +

        "\nEVENTS: " +
        State.events +

        "\nASYNC: " +
        State.asyncOps +

        "\nSCORE: " +
        State.score;
}


/* ============================================================
   START
   ============================================================ */

function start()
{
    if (
        State.running
    )
        return;

    State.running =
        true;

    /*
     * Existing candidate:
     * automatic replay.
     */

    if (
        State.candidate
    ) {

        startReplay();

        return;
    }

    startFuzz();
}


/* ============================================================
   INIT
   ============================================================ */

State.run =
    load(
        "run",
        0
    );

State.caseId =
    load(
        "caseId",
        0
    );

State.stats =
    load(
        "stats",
        State.stats
    );

loadCorpus();

loadCandidate();

var recovered =
    recover();

updateDisplay();

document
    .getElementById("start")
    .addEventListener(
        "click",
        start,
        false
    );

if (
    recovered
) {

    State.running =
        true;

    /*
     * RECOVER may have produced
     * a candidate, in which case
     * the next stage is automatic.
     */

    if (
        State.candidate &&
        State.mode ===
        "RECOVER"
    ) {

        setTimeout(
            startReplay,
            300
        );
    }

}

log(
    "V16 READY"
);

})();
</script>
