
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>PS4 WebKit UAF Lifecycle Fuzzer v1</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #07122b;
    color: #d7e6ff;
    font-family: monospace;
    font-size: 16px;
}

body {
    padding: 20px;
}

h1 {
    color: #ffffff;
    margin-top: 0;
}

button {
    background: #1b4f8c;
    color: white;
    border: 2px solid #7fb8ff;
    padding: 14px 20px;
    margin-right: 10px;
    margin-bottom: 10px;
    font-weight: bold;
    font-size: 16px;
}

#status {
    border: 1px solid #6ca8e8;
    padding: 12px;
    margin-top: 10px;
    margin-bottom: 15px;
    background: #0c2147;
}

#log {
    border: 1px solid #6ca8e8;
    padding: 12px;
    background: #030a1c;
    white-space: pre-wrap;
    word-wrap: break-word;
    min-height: 600px;
}

.pass {
    color: #72e6b1;
}

.fail {
    color: #ff7777;
}

.info {
    color: #a9c8ff;
}

.warn {
    color: #ffd37a;
}

.section {
    color: white;
    font-weight: bold;
}

#arena {
    position: absolute;
    left: -10000px;
    top: -10000px;
    width: 500px;
    height: 500px;
    overflow: hidden;
}
</style>
</head>

<body>

<h1>PS4 WebKit UAF Lifecycle Fuzzer v1</h1>

<button onclick="startFuzzer()">RUN UAF FUZZER</button>
<button onclick="stopFuzzer()">STOP</button>
<button onclick="clearLog()">CLEAR</button>

<div id="status">
Ready
</div>

<div id="log"></div>

<div id="arena"></div>

<script>

/*
 * ============================================================
 * PS4 WEBKIT UAF LIFECYCLE FUZZER
 * ============================================================
 *
 * Estratégia:
 *
 * Não tenta explorar memória.
 *
 * Procura instabilidades em transições:
 *
 *   create
 *      ↓
 *   observe/listen
 *      ↓
 *   mutate
 *      ↓
 *   schedule callback
 *      ↓
 *   detach/remove
 *      ↓
 *   callback pendente
 *      ↓
 *   recreate
 *
 * Alvos:
 *
 * - DOM Node lifetime
 * - MutationObserver
 * - ResizeObserver
 * - Range
 * - Selection
 * - TreeWalker / NodeIterator
 * - Shadow DOM
 * - iframe lifecycle
 * - SVG
 * - CSS/layout
 * - animation callbacks
 * - event dispatch
 * - media element teardown
 *
 * Fullscreen deliberadamente não usado.
 * Worker stress deliberadamente não usado.
 * Resource exhaustion deliberadamente não usado.
 *
 * ============================================================
 */

var running = false;

var totalRuns = 0;
var passCount = 0;
var failCount = 0;

var arena = document.getElementById("arena");
var logBox = document.getElementById("log");
var statusBox = document.getElementById("status");

var currentTest = 0;
var round = 0;

var MAX_ROUNDS = 30;


/* ============================================================
 * LOGGING
 * ============================================================
 */

function log(message, type) {

    var line = document.createElement("div");

    line.className = type || "info";

    line.textContent = message;

    logBox.appendChild(line);

    statusBox.textContent =
        "Round: " + round +
        " | Test: " + currentTest +
        " | PASS: " + passCount +
        " | FAIL: " + failCount +
        " | Running: " + running;

}


function section(name) {

    log("");
    log("============================================================", "section");
    log(name, "section");
    log("============================================================", "section");

}


function clearLog() {

    logBox.innerHTML = "";

}


function stopFuzzer() {

    running = false;

    log("[STOP] Fuzzer stopped by user", "warn");

}


/* ============================================================
 * CLEANUP
 * ============================================================
 */

function cleanupArena() {

    while (arena.firstChild)
        arena.removeChild(arena.firstChild);

}


/* ============================================================
 * SAFE ERROR WRAPPER
 * ============================================================
 */

function runTest(name, fn, done) {

    if (!running) {
        done();
        return;
    }

    currentTest++;

    try {

        fn();

        passCount++;

        log("[PASS] " + name, "pass");

    } catch (e) {

        failCount++;

        log(
            "[FAIL] " +
            name +
            " -> " +
            e.name +
            ": " +
            e.message,
            "fail"
        );

    }

    totalRuns++;

    setTimeout(done, 30);

}


/* ============================================================
 * TEST 1
 * DOM REMOVE + PENDING MICROTASK
 * ============================================================
 */

function testDOMRemoveMicrotask() {

    var parent = document.createElement("div");
    var child = document.createElement("div");

    parent.appendChild(child);
    arena.appendChild(parent);

    Promise.resolve().then(function() {

        var x = child.parentNode;

    });

    parent.removeChild(child);

    arena.removeChild(parent);

}


/* ============================================================
 * TEST 2
 * MUTATION OBSERVER + DETACH
 * ============================================================
 */

function testMutationObserverDetach() {

    var parent = document.createElement("div");

    var child = document.createElement("span");

    parent.appendChild(child);

    arena.appendChild(parent);

    var observer = new MutationObserver(function(records) {

        records.length;

    });

    observer.observe(parent, {
        childList: true,
        subtree: true,
        attributes: true
    });

    child.setAttribute("data-x", "1");

    parent.removeChild(child);

    observer.disconnect();

    arena.removeChild(parent);

}


/* ============================================================
 * TEST 3
 * MUTATION + REMOVE DURING CALLBACK
 * ============================================================
 */

function testMutationCallbackRemoval() {

    var parent = document.createElement("div");
    var child = document.createElement("div");

    parent.appendChild(child);

    arena.appendChild(parent);

    var observer = new MutationObserver(function() {

        if (parent.parentNode)
            parent.parentNode.removeChild(parent);

    });

    observer.observe(parent, {
        childList: true,
        attributes: true
    });

    child.setAttribute("x", "1");

    observer.disconnect();

}


/* ============================================================
 * TEST 4
 * RANGE + NODE REMOVAL
 * ============================================================
 */

function testRangeDetachedNode() {

    var div = document.createElement("div");

    div.textContent = "ABCDEFGHIJK";

    arena.appendChild(div);

    var range = document.createRange();

    range.selectNodeContents(div);

    div.parentNode.removeChild(div);

    range.toString();

}


/* ============================================================
 * TEST 5
 * RANGE + INNERHTML REPLACEMENT
 * ============================================================
 */

function testRangeReplaceContents() {

    var div = document.createElement("div");

    div.innerHTML = "<span>AAAA</span><span>BBBB</span>";

    arena.appendChild(div);

    var range = document.createRange();

    range.selectNode(div.firstChild);

    div.innerHTML = "<p>REPLACED</p>";

    range.toString();

    arena.removeChild(div);

}


/* ============================================================
 * TEST 6
 * TREEWALKER + MUTATION
 * ============================================================
 */

function testTreeWalkerMutation() {

    var root = document.createElement("div");

    for (var i = 0; i < 8; i++) {

        var node = document.createElement("span");

        node.textContent = "N" + i;

        root.appendChild(node);

    }

    arena.appendChild(root);

    var walker = document.createTreeWalker(
        root,
        NodeFilter.SHOW_ELEMENT,
        null,
        false
    );

    walker.nextNode();

    var victim = root.firstChild;

    root.removeChild(victim);

    walker.nextNode();

    arena.removeChild(root);

}


/* ============================================================
 * TEST 7
 * NODEITERATOR + DETACH
 * ============================================================
 */

function testNodeIteratorDetach() {

    var root = document.createElement("div");

    root.innerHTML =
        "<span>A</span>" +
        "<span>B</span>" +
        "<span>C</span>";

    arena.appendChild(root);

    var iterator = document.createNodeIterator(
        root,
        NodeFilter.SHOW_ELEMENT,
        null,
        false
    );

    iterator.nextNode();

    root.innerHTML = "";

    iterator.nextNode();

    arena.removeChild(root);

}


/* ============================================================
 * TEST 8
 * SHADOW DOM HOST REMOVAL
 * ============================================================
 */

function testShadowHostRemoval() {

    var host = document.createElement("div");

    arena.appendChild(host);

    if (!host.attachShadow)
        return;

    var shadow = host.attachShadow({
        mode: "open"
    });

    var child = document.createElement("span");

    child.textContent = "shadow";

    shadow.appendChild(child);

    host.parentNode.removeChild(host);

    shadow.innerHTML = "<div>after-detach</div>";

}


/* ============================================================
 * TEST 9
 * SLOT MUTATION
 * ============================================================
 */

function testShadowSlotMutation() {

    var host = document.createElement("div");

    arena.appendChild(host);

    if (!host.attachShadow)
        return;

    var shadow = host.attachShadow({
        mode: "open"
    });

    shadow.innerHTML =
        "<slot></slot>";

    var child = document.createElement("span");

    child.textContent = "light";

    host.appendChild(child);

    host.removeChild(child);

    child.textContent = "detached";

    host.parentNode.removeChild(host);

}


/* ============================================================
 * TEST 10
 * RAF + ELEMENT REMOVAL
 * ============================================================
 */

function testRAFRemoval() {

    var div = document.createElement("div");

    arena.appendChild(div);

    requestAnimationFrame(function() {

        div.getBoundingClientRect();

    });

    arena.removeChild(div);

}


/* ============================================================
 * TEST 11
 * LAYOUT READ AFTER DETACH
 * ============================================================
 */

function testLayoutDetachedElement() {

    var div = document.createElement("div");

    div.style.width = "100px";
    div.style.height = "100px";

    arena.appendChild(div);

    div.getBoundingClientRect();

    arena.removeChild(div);

    div.getBoundingClientRect();

}


/* ============================================================
 * TEST 12
 * CSS CLASS MUTATION + DETACH
 * ============================================================
 */

function testClassMutationDetach() {

    var div = document.createElement("div");

    arena.appendChild(div);

    div.classList.add("a");

    div.classList.add("b");

    arena.removeChild(div);

    div.classList.remove("a");

}


/* ============================================================
 * TEST 13
 * SVG CREATE + REMOVE + GEOMETRY
 * ============================================================
 */

function testSVGDetachGeometry() {

    var ns = "http://www.w3.org/2000/svg";

    var svg = document.createElementNS(ns, "svg");

    var rect = document.createElementNS(ns, "rect");

    rect.setAttribute("width", "20");
    rect.setAttribute("height", "20");

    svg.appendChild(rect);

    arena.appendChild(svg);

    rect.getBoundingClientRect();

    arena.removeChild(svg);

    rect.getBoundingClientRect();

}


/* ============================================================
 * TEST 14
 * SVG ATTRIBUTE MUTATION
 * ============================================================
 */

function testSVGAttributeMutation() {

    var ns = "http://www.w3.org/2000/svg";

    var svg = document.createElementNS(ns, "svg");

    var circle = document.createElementNS(ns, "circle");

    svg.appendChild(circle);

    arena.appendChild(svg);

    circle.setAttribute("cx", "10");

    circle.setAttribute("cy", "10");

    arena.removeChild(svg);

    circle.setAttribute("r", "20");

}


/* ============================================================
 * TEST 15
 * IFRAME CREATE / REMOVE
 * ============================================================
 */

function testIframeLifecycle() {

    var frame = document.createElement("iframe");

    frame.src = "about:blank";

    arena.appendChild(frame);

    var w = frame.contentWindow;

    arena.removeChild(frame);

    if (w)
        w.location;

}


/* ============================================================
 * TEST 16
 * IFRAME EVENT LISTENER + REMOVE
 * ============================================================
 */

function testIframeListenerDetach() {

    var frame = document.createElement("iframe");

    frame.src = "about:blank";

    frame.addEventListener("load", function() {

        if (frame.parentNode)
            frame.parentNode.removeChild(frame);

    });

    arena.appendChild(frame);

}


/* ============================================================
 * TEST 17
 * SELECTION + DOM REPLACEMENT
 * ============================================================
 */

function testSelectionReplacement() {

    var div = document.createElement("div");

    div.contentEditable = "true";

    div.textContent = "selection target";

    arena.appendChild(div);

    if (!window.getSelection)
        return;

    var selection = window.getSelection();

    var range = document.createRange();

    range.selectNodeContents(div);

    selection.removeAllRanges();

    selection.addRange(range);

    div.innerHTML = "<span>new node</span>";

    selection.removeAllRanges();

    arena.removeChild(div);

}


/* ============================================================
 * TEST 18
 * FOCUS + REMOVAL
 * ============================================================
 */

function testFocusRemoval() {

    var input = document.createElement("input");

    arena.appendChild(input);

    input.focus();

    arena.removeChild(input);

}


/* ============================================================
 * TEST 19
 * EVENT DISPATCH + SELF REMOVAL
 * ============================================================
 */

function testEventSelfRemoval() {

    var div = document.createElement("div");

    arena.appendChild(div);

    div.addEventListener("x-test", function() {

        if (div.parentNode)
            div.parentNode.removeChild(div);

    });

    var event = document.createEvent("Event");

    event.initEvent(
        "x-test",
        true,
        false
    );

    div.dispatchEvent(event);

}


/* ============================================================
 * TEST 20
 * EVENT BUBBLING + PARENT REMOVAL
 * ============================================================
 */

function testEventParentRemoval() {

    var parent = document.createElement("div");

    var child = document.createElement("div");

    parent.appendChild(child);

    arena.appendChild(parent);

    parent.addEventListener("x-test", function() {

        if (parent.parentNode)
            parent.parentNode.removeChild(parent);

    });

    var event = document.createEvent("Event");

    event.initEvent(
        "x-test",
        true,
        false
    );

    child.dispatchEvent(event);

}


/* ============================================================
 * TEST 21
 * CANVAS RESIZE LIFECYCLE
 * ============================================================
 */

function testCanvasLifecycle() {

    var canvas = document.createElement("canvas");

    canvas.width = 32;
    canvas.height = 32;

    arena.appendChild(canvas);

    var ctx = canvas.getContext("2d");

    if (ctx) {

        ctx.fillRect(0, 0, 10, 10);

        canvas.width = 64;

        ctx.fillRect(0, 0, 20, 20);

    }

    arena.removeChild(canvas);

}


/* ============================================================
 * TEST 22
 * IMAGE LOAD OBJECT LIFECYCLE
 * ============================================================
 */

function testImageLifecycle() {

    var image = new Image();

    image.src =
        "data:image/gif;base64," +
        "R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==";

    arena.appendChild(image);

    arena.removeChild(image);

    image.src = "";

}


/* ============================================================
 * TEST 23
 * VIDEO CREATE / DETACH
 * ============================================================
 */

function testVideoLifecycle() {

    var video = document.createElement("video");

    video.width = 16;
    video.height = 16;

    arena.appendChild(video);

    video.load();

    arena.removeChild(video);

    video.load();

}


/* ============================================================
 * TEST 24
 * AUDIO CREATE / DETACH
 * ============================================================
 */

function testAudioLifecycle() {

    var audio = document.createElement("audio");

    arena.appendChild(audio);

    audio.load();

    arena.removeChild(audio);

}


/* ============================================================
 * TEST 25
 * TRANSITION STYLE + REMOVE
 * ============================================================
 */

function testTransitionRemoval() {

    var div = document.createElement("div");

    div.style.width = "10px";
    div.style.transition = "width 0.01s linear";

    arena.appendChild(div);

    div.offsetWidth;

    div.style.width = "20px";

    arena.removeChild(div);

}


/* ============================================================
 * TEST 26
 * WEBKIT RAF + REMOVAL
 * ============================================================
 */

function testWebKitRAFRemoval() {

    if (!window.webkitRequestAnimationFrame)
        return;

    var div = document.createElement("div");

    arena.appendChild(div);

    window.webkitRequestAnimationFrame(function() {

        div.getBoundingClientRect();

    });

    arena.removeChild(div);

}


/* ============================================================
 * TEST 27
 * DOCUMENTFRAGMENT LIFETIME
 * ============================================================
 */

function testDocumentFragmentLifecycle() {

    var fragment = document.createDocumentFragment();

    var a = document.createElement("div");

    var b = document.createElement("div");

    fragment.appendChild(a);

    fragment.appendChild(b);

    arena.appendChild(fragment);

    a.parentNode.removeChild(a);

    b.textContent = "still alive";

    if (b.parentNode)
        b.parentNode.removeChild(b);

}


/* ============================================================
 * TEST 28
 * REPEATED CREATE / DETACH
 *
 * Pequeno ciclo controlado.
 * Não é resource exhaustion.
 * ============================================================
 */

function testControlledLifecycleLoop() {

    for (var i = 0; i < 10; i++) {

        var parent = document.createElement("div");

        var child = document.createElement("span");

        parent.appendChild(child);

        arena.appendChild(parent);

        child.setAttribute("data-i", i);

        parent.removeChild(child);

        arena.removeChild(parent);

    }

}


/* ============================================================
 * TEST 29
 * REPLACECHILD LIFETIME
 * ============================================================
 */

function testReplaceChildLifetime() {

    var parent = document.createElement("div");

    var oldNode = document.createElement("span");

    var newNode = document.createElement("span");

    parent.appendChild(oldNode);

    arena.appendChild(parent);

    parent.replaceChild(newNode, oldNode);

    oldNode.textContent = "detached";

    arena.removeChild(parent);

}


/* ============================================================
 * TEST 30
 * INNERHTML + OBSERVER
 * ============================================================
 */

function testInnerHTMLObserver() {

    var div = document.createElement("div");

    arena.appendChild(div);

    var observer = new MutationObserver(function(records) {

        records.length;

    });

    observer.observe(div, {
        childList: true,
        subtree: true
    });

    div.innerHTML =
        "<span>A</span>" +
        "<span>B</span>";

    div.innerHTML = "";

    observer.disconnect();

    arena.removeChild(div);

}


/* ============================================================
 * TEST MATRIX
 * ============================================================
 */

var tests = [

    {
        name: "DOM remove -> pending microtask",
        fn: testDOMRemoveMicrotask
    },

    {
        name: "MutationObserver -> detach",
        fn: testMutationObserverDetach
    },

    {
        name: "Mutation callback -> parent removal",
        fn: testMutationCallbackRemoval
    },

    {
        name: "Range -> detached node",
        fn: testRangeDetachedNode
    },

    {
        name: "Range -> contents replacement",
        fn: testRangeReplaceContents
    },

    {
        name: "TreeWalker -> mutation",
        fn: testTreeWalkerMutation
    },

    {
        name: "NodeIterator -> detach",
        fn: testNodeIteratorDetach
    },

    {
        name: "ShadowRoot -> host removal",
        fn: testShadowHostRemoval
    },

    {
        name: "Shadow slot -> mutation",
        fn: testShadowSlotMutation
    },

    {
        name: "requestAnimationFrame -> removal",
        fn: testRAFRemoval
    },

    {
        name: "Layout read -> detached element",
        fn: testLayoutDetachedElement
    },

    {
        name: "classList -> detached node",
        fn: testClassMutationDetach
    },

    {
        name: "SVG -> detach geometry",
        fn: testSVGDetachGeometry
    },

    {
        name: "SVG -> attribute mutation after detach",
        fn: testSVGAttributeMutation
    },

    {
        name: "iframe -> lifecycle",
        fn: testIframeLifecycle
    },

    {
        name: "iframe -> load listener removal",
        fn: testIframeListenerDetach
    },

    {
        name: "Selection -> DOM replacement",
        fn: testSelectionReplacement
    },

    {
        name: "Focus -> removal",
        fn: testFocusRemoval
    },

    {
        name: "Event -> self removal",
        fn: testEventSelfRemoval
    },

    {
        name: "Event bubbling -> parent removal",
        fn: testEventParentRemoval
    },

    {
        name: "Canvas -> resize lifecycle",
        fn: testCanvasLifecycle
    },

    {
        name: "Image -> detach lifecycle",
        fn: testImageLifecycle
    },

    {
        name: "Video -> detach lifecycle",
        fn: testVideoLifecycle
    },

    {
        name: "Audio -> detach lifecycle",
        fn: testAudioLifecycle
    },

    {
        name: "CSS transition -> removal",
        fn: testTransitionRemoval
    },

    {
        name: "webkitRequestAnimationFrame -> removal",
        fn: testWebKitRAFRemoval
    },

    {
        name: "DocumentFragment -> lifetime",
        fn: testDocumentFragmentLifecycle
    },

    {
        name: "Controlled create/detach loop",
        fn: testControlledLifecycleLoop
    },

    {
        name: "replaceChild -> old node lifetime",
        fn: testReplaceChildLifetime
    },

    {
        name: "innerHTML -> MutationObserver",
        fn: testInnerHTMLObserver
    }

];


/* ============================================================
 * EXECUTION ENGINE
 * ============================================================
 */

function startFuzzer() {

    if (running) {
        log("[INFO] Already running", "warn");
        return;
    }

    running = true;

    currentTest = 0;

    round = 0;

    passCount = 0;

    failCount = 0;

    totalRuns = 0;

    clearLog();

    section("PS4 WEBKIT UAF LIFECYCLE FUZZER v1");

    log("[INFO] Starting controlled lifecycle matrix", "info");

    log("[INFO] Fullscreen excluded", "warn");

    log("[INFO] Worker stress excluded", "warn");

    log("[INFO] Resource exhaustion excluded", "warn");

    log("[INFO] Focus: lifetime / detach / callbacks / mutation", "info");

    setTimeout(runRound, 100);

}


function runRound() {

    if (!running)
        return;

    round++;

    cleanupArena();

    log("");
    log(
        "######## ROUND " +
        round +
        " / " +
        MAX_ROUNDS +
        " ########",
        "section"
    );

    var index = 0;


    function next() {

        if (!running)
            return;

        cleanupArena();

        if (index >= tests.length) {

            if (round >= MAX_ROUNDS) {

                finish();

                return;

            }

            setTimeout(runRound, 100);

            return;

        }

        var test = tests[index++];

        runTest(
            test.name,
            test.fn,
            next
        );

    }

    next();

}


function finish() {

    running = false;

    cleanupArena();

    section("FUZZER COMPLETE");

    log(
        "Total executions: " +
        totalRuns,
        "info"
    );

    log(
        "PASS: " +
        passCount,
        "pass"
    );

    log(
        "FAIL / JS exceptions: " +
        failCount,
        failCount ? "fail" : "info"
    );

    log(
        "[DONE] Controlled lifecycle fuzzing completed",
        "section"
    );

}


/* ============================================================
 * GLOBAL ERROR LOGGING
 * ============================================================
 */

window.onerror = function(message, source, line, column, error) {

    log(
        "[UNCAUGHT] " +
        message +
        " @ line " +
        line,
        "fail"
    );

};


window.addEventListener(
    "unhandledrejection",
    function(event) {

        log(
            "[PROMISE REJECTION] " +
            event.reason,
            "fail"
        );

    }
);

</script>

</body>
</html>
