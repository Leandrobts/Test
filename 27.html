<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8">
</head>
<body>

<p>
This tests changing an input type during an input event.
</p>

<p>
Select the date field and enter a date.
The input type will change from date to text when the input event fires.
</p>

<input id="input" type="date">

<div id="result"></div>

<script>
const input = document.getElementById("input");
const result = document.getElementById("result");

input.addEventListener("input", () => {
    input.type = "text";
});

input.addEventListener("change", () => {
    result.textContent = 'input.type is "' + input.type + '"';
});
</script>

</body>
</html>
