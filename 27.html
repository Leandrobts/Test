<!DOCTYPE html>
<html>
<body>
<iframe id="ifrA" loading="lazy"></iframe>
<input id="inp" tabindex="0" autofocus
       onfocus="while(document.body.firstChild)
                    document.body.removeChild(document.body.firstChild)">

<script>
document.body.appendChild(
    Object.assign(document.createElement("iframe"), { src: "b" })
);

const ifrA = document.getElementById("ifrA");

window.addEventListener("load", () => {
    ifrA.srcdoc = "x";
    ifrA.contentWindow?.addEventListener("blur", () => {});
    ifrA.focus();
});
</script>
</body>
</html>
