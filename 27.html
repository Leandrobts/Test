<!DOCTYPE html>
<head>
    <script>
        function runTest() {
            document.getElementById('startBtn').style.display = 'none';
            
            const context = new AudioContext({ sampleRate: 44100 });

            if (context.state === 'suspended') {
                context.resume();
            }

            var frame = document.getElementById("iframe");
            
            // Tratamento de segurança para o carregamento do iframe
            frame.onload = async function() {
                try {
                    // Tenta obter o documento interno de forma segura
                    const doc = frame.contentDocument || frame.contentWindow.document;
                    if (!doc) {
                        console.error("Não foi possível acessar o contentDocument (possível restrição de CORS).");
                        return;
                    }

                    const audio = doc.querySelector("audio");
                    if (!audio) {
                        console.error("Elemento <audio> não encontrado dentro do iframe.");
                        return;
                    }

                    const source = context.createMediaElementSource(audio);
                    source.connect(context.destination);
                    audio.play().catch((err) => { console.log("Autoplay impedido:", err); });

                    // Aguarda 200ms para a thread de áudio processar
                    await new Promise(resolve => setTimeout(resolve, 200));

                    // Remove o iframe para disparar o clearMediaPlayer()
                    frame.remove();

                    setTimeout(function() {
                        document.body.insertAdjacentHTML('beforeend', '<p><strong>PASS: Did not crash after detaching iframe whose audio element is connected to a MediaElementAudioSourceNode.</strong></p>');
                    }, 100);
                } catch (e) {
                    console.log("Erro durante a execução do teste:", e);
                }
            };

            // Define o src após configurar o onload para garantir o disparo
            frame.src = "resources/mediaelementsource-clear-detached-frame-iframe.html";
        }
    </script>
</head>
<body>
    <h2>Teste de Regressão WebKit - MediaElementAudioSourceNode</h2>
    <p>Clique no botão para conceder permissão ao AudioContext e iniciar o teste:</p>
    <button id="startBtn" onclick="runTest()" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">Iniciar Teste</button>
    <br><br>
    <iframe id="iframe" width="100" height="100"></iframe>
</body>
</html>
