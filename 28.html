<!DOCTYPE html>
<body>
<div id="result"><input id="passwordInput" type="password"></div>
<script>
function gc() {
    function gcRec(n) {
          if (n < 1)
              return {};
          var temp = {i: "ab" + i + (i / 100000)};
          temp += "foo";
          gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
    gcRec(10);
}

onload = async () => {
    const input = document.getElementById('passwordInput');
    
    // Como internals e eventSender não estão disponíveis fora do WebKit de testes,
    // simulamos o gatilho alterando o tipo no evento de clique ou interação direta,
    // exercitando o mesmo fluxo de destruição de sombra e alteração de estado.
    input.addEventListener('click', () => {
        input.type = 'button';
        gc();       
    }, { once: true });

    // Simula o clique programático ou interação que acionaria o botão de autocompletar
    input.click();

    document.getElementById('result').innerHTML = '<p>This test passes if WebKit does not hit debug assertions or crash under ASAN.</p><br>PASS';
};
</script>
</body>
</html>
