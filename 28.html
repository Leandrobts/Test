<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Teste de Mutação do Input com Datalist</title>
<style>
  input {
    width: 300px;
    height: 50px;
    box-sizing: border-box;
  }
  #log {
    margin-top: 15px;
    font-family: monospace;
    white-space: pre-wrap;
  }
</style>
</head>
<body>

<input id="input" type="text" list="list">
<datalist id="list">
  <option value="a">
  <option value="b">
</datalist>

<div id="log"></div>

<script>
// Implementação adaptada do gc() sem dependência de harness externo
function gc() {
    function gcRec(n) {
          if (n < 1)
              return {};
          var temp = {i: "ab" + i + (i / 100000)};
          temp += "foo";
          gcRec(n-1);
    }
    for (var i = 0; i < 1000; i++)
    gcRec(10);
}

function log(msg) {
    const el = document.getElementById('log');
    el.textContent += msg + '\n';
    console.log(msg);
}

addEventListener("load", async () => {
    const input = document.getElementById('input');

    // 1. Mantém o listener original: ao receber o clique, altera o tipo e dispara o GC
    input.addEventListener('click', () => {
        log("[+] Evento 'click' disparado. Alterando tipo para 'button' e chamando gc()...");
        input.type = 'button';
        gc();
    }, { once: true });

    // 2. Simulação aproximada de clique no canto direito (onde fica o botão de seta do datalist)
    const rect = input.getBoundingClientRect();
    const targetX = rect.right - 15; // 15px antes da borda direita
    const targetY = rect.top + (rect.height / 2);

    const eventInit = {
        bubbles: true,
        cancelable: true,
        view: window,
        clientX: targetX,
        clientY: targetY
    };

    input.dispatchEvent(new MouseEvent('mousedown', eventInit));
    input.dispatchEvent(new MouseEvent('mouseup', eventInit));
    input.dispatchEvent(new MouseEvent('click', eventInit));

    log("PASS if no crash.");
});
</script>

</body>
</html>
