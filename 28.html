
<!DOCTYPE html>
<html>
<body>
<iframe id="fi" loading="lazy"></iframe>
<button id="btn" tabindex="0" autofocus></button>

<script>
const aux = document.createElement("iframe");
aux.src = "about:blank";
document.body.appendChild(aux);

const fi = document.getElementById("fi");

window.addEventListener("load", () => {
    fi.srcdoc = "<p>a</p>";
    fi.contentWindow?.addEventListener("blur", () => {});
    fi.focus();
});

btn.addEventListener("focus", () => {
    document.body.replaceChildren(); // mesmo efeito de teardown
});
</script>
</body>
</html>
