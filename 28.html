PS4 WEBKIT SURFACE MATRIX FUZZER

- Unsupported APIs are skipped.

var logElement = document.getElementById("log");
var summaryElement = document.getElementById("summary");
var runButton = document.getElementById("runBtn");

var stats = {
    total: 0,
    pass: 0,
    fail: 0,
    skip: 0
};


function log(message, type) {

    var line = document.createElement("div");

    line.className = type || "info";
    line.textContent = message;

    logElement.appendChild(line);

    logElement.scrollTop = logElement.scrollHeight;
}


function section(name) {
    log("");
    log("============================================================", "section");
    log(name, "section");
    log("============================================================", "section");
}


function updateSummary() {

    summaryElement.textContent =
        "PS4 WebKit Surface Matrix v27\n" +
        "Total: " + stats.total +
        " | PASS: " + stats.pass +
        " | FAIL: " + stats.fail +
        " | SKIP: " + stats.skip;
}


function resetStats() {

    stats.total = 0;
    stats.pass = 0;
    stats.fail = 0;
    stats.skip = 0;

    updateSummary();
}


function pass(name, detail) {

    stats.total++;
    stats.pass++;

    log("[PASS] " + name +
        (detail ? " -> " + detail : ""),
        "pass");

    updateSummary();
}


function fail(name, error) {

    stats.total++;
    stats.fail++;

    log("[FAIL] " + name +
        " -> " + String(error),
        "fail");

    updateSummary();
}


function skip(name, reason) {

    stats.total++;
    stats.skip++;

    log("[SKIP] " + name +
        (reason ? " -> " + reason : ""),
        "skip");

    updateSummary();
}


function has(name) {
    return typeof window[name] !== "undefined";
}


function delay(ms) {
    return new Promise(function(resolve) {
        setTimeout(resolve, ms);
    });
}

async function testRenderingObservers() {

    section("Rendering / Observers");

    try {

        await new Promise(function(resolve) {

            requestAnimationFrame(function() {
                pass("requestAnimationFrame", "callback executed");
                resolve();
            });

        });

    } catch (e) {
        fail("requestAnimationFrame", e);
    }


    try {

        if (has("MutationObserver")) {

            await new Promise(function(resolve, reject) {

                var target = document.createElement("div");

                var observer = new MutationObserver(function(records) {

                    observer.disconnect();

                    if (records.length > 0)
                        pass("MutationObserver", "mutation delivered");
                    else
                        fail("MutationObserver", "empty records");

                    resolve();
                });

                observer.observe(target, {
                    childList: true
                });

                target.appendChild(
                    document.createElement("span")
                );

                setTimeout(function() {
                    observer.disconnect();
                    resolve();
                }, 100);

            });

        } else {
            skip("MutationObserver", "not exposed");
        }

    } catch (e) {
        fail("MutationObserver", e);
    }


    try {

/*
============================================================
WORKERS / MESSAGING
============================================================
*/

async function testWorkers() {

    section("Workers / Messaging");

    try {

        if (has("Worker")) {

            var workerCode =
                "self.onmessage=function(e){" +
                "postMessage(e.data);" +
                "};";

            var workerBlob = new Blob(
                [workerCode],
                { type: "application/javascript" }
            );

            var workerURL =
                URL.createObjectURL(workerBlob);

            await new Promise(function(resolve) {

                var worker =
                    new Worker(workerURL);

                var done = false;

                worker.onmessage = function(event) {

                    if (!done) {

                        done = true;

                        if (event.data === "v27")
                            pass("Worker", "message roundtrip");
                        else
                            fail("Worker", "message mismatch");

                        worker.terminate();

                        URL.revokeObjectURL(workerURL);

                        resolve();
                    }
                };

                worker.onerror = function(error) {

                    if (!done) {

                        done = true;

                        fail("Worker", error.message);

                        worker.terminate();

                        URL.revokeObjectURL(workerURL);

                        resolve();
                    }
                };

                worker.postMessage("v27");

                setTimeout(function() {

                    if (!done) {

                        done = true;

                        worker.terminate();

                        URL.revokeObjectURL(workerURL);

                        fail("Worker", "timeout");

                        resolve();
                    }

                }, 2000);

            });

        } else {
            skip("Worker", "not exposed");
        }

    } catch (e) {
        fail("Worker", e);
    }


    try {

        if (has("SharedWorker"))
            pass("SharedWorker", "exposed only - no stress execution");
        else
            skip("SharedWorker", "not exposed");

    } catch (e) {
        fail("SharedWorker", e);
    }


    try {

        if (has("MessageChannel")) {

            var channel = new MessageChannel();

            await new Promise(function(resolve) {

                channel.port1.onmessage = function(event) {

                    if (event.data === "v27")
                        pass("MessageChannel", "port message");
                    else
                        fail("MessageChannel", "data mismatch");

                    resolve();
                };

                channel.port2.postMessage("v27");

            });

        } else {
            skip("MessageChannel", "not exposed");
        }

    } catch (e) {
        fail("MessageChannel", e);
    }


    try {

        if (has("BroadcastChannel")) {

            var name =
                "v27-" + Date.now();

            var bc1 =
                new BroadcastChannel(name);

            var bc2 =
                new BroadcastChannel(name);

            await new Promise(function(resolve) {

                var finished = false;

                bc2.onmessage = function(event) {

                    if (!finished) {

                        finished = true;

                        pass(
                            "BroadcastChannel",
                            String(event.data)
                        );

                        bc1.close();
                        bc2.close();

                        resolve();
                    }
                };

                bc1.postMessage("v27");

                setTimeout(function() {

                    if (!finished) {

                        finished = true;

                        bc1.close();
                        bc2.close();

                        fail(
                            "BroadcastChannel",
                            "timeout"
                        );

                        resolve();
                    }

                }, 1000);

            });

        } else {
            skip("BroadcastChannel", "not exposed");
        }

    } catch (e) {
        fail("BroadcastChannel", e);
    }

}
