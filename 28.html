<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Teste de Regressão: Descarte de Scrollbar durante animação NSScrollerImp</title>
<style>
    .scroller {
        width: 150px;
        height: 150px;
        overflow-y: scroll;
        border: 1px solid black;
    }
    .content {
        height: 1200px;
    }
</style>
</head>
<body>
<div id="container"></div>
<div id="status">Executando teste...</div>

<script>
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 1000; i++)
        gcRec(10);
}

function runScrollbarTest() {
    const container = document.getElementById("container");
    let cycle = 0;
    const maxCycles = 60;

    function step() {
        if (cycle >= maxCycles) {
            document.getElementById("status").innerText = "PASS: Animações de scrollbar e ciclos de vida de nós executados sem Use-After-Free.";
            return;
        }

        cycle++;

        // 1. Cria o contêiner com scroll para instanciar a Scrollbar do WebCore
        const scroller = document.createElement("div");
        scroller.className = "scroller";

        const content = document.createElement("div");
        content.className = "content";
        scroller.appendChild(content);
        container.appendChild(scroller);

        // 2. Aciona o scroll para iniciar o timer de animação de UI/fade da barra
        scroller.scrollTop = 250;

        // 3. Remove o elemento no tick seguinte durante a execução da animação
        requestAnimationFrame(() => {
            if (scroller.parentNode) {
                container.removeChild(scroller);
            }

            if (cycle % 6 === 0) {
                gc();
            }

            setTimeout(step, 10);
        });
    }

    step();
}

try {
    runScrollbarTest();
} catch (e) {
    document.getElementById("status").innerText = "FAIL: " + e.message;
}
</script>
</body>
</html>
