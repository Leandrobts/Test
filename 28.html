<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PS4 WebKit Compatibility Test (Commit c864982)</title>
    <style>
        body { font-family: monospace; background: #121212; color: #00ffcc; padding: 20px; }
        .pass { color: #00ff00; }
        .fail { color: #ff5555; }
        .box { background: #1e1e1e; padding: 15px; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>WebKit Commit c864982 - Compatibility Test</h2>
    <div class="box" id="results">Executando testes...</div>

    <script>
        const tests = [
            {
                name: 'document.createElement("canvas")',
                test: () => !!document.createElement("canvas")
            },
            {
                name: 'HTMLCanvasElement.prototype.captureStream',
                test: () => {
                    const canvas = document.createElement("canvas");
                    return typeof canvas.captureStream === "function";
                }
            },
            {
                name: 'window.MediaRecorder',
                test: () => typeof window.MediaRecorder !== "undefined"
            },
            {
                name: 'window.VideoFrame (WebCodecs)',
                test: () => typeof window.VideoFrame !== "undefined"
            },
            {
                name: 'window.ImageData',
                test: () => typeof window.ImageData !== "undefined"
            }
        ];

        let output = "<ul>";
        tests.forEach(t => {
            try {
                const supported = t.test();
                const cssClass = supported ? "pass" : "fail";
                const status = supported ? "SUPORTADO" : "NÃO SUPORTADO";
                output += `<li><strong>${t.name}</strong>: <span class="${cssClass}">${status}</span></li>`;
            } catch (e) {
                output += `<li><strong>${t.name}</strong>: <span class="fail">ERRO (${e.message})</span></li>`;
            }
        });
        output += "</ul>";

        document.getElementById("results").innerHTML = output;
    </script>
</body>
</html>
