<!DOCTYPE html>
<body>
<div id="result">
    <input id="input" type="password">
</div>
<script>
function gc() {
    function gcRec(n) {
          if (n < 1)
              return {};
          var temp = {i: "ab" + i + (i / 100000)};
          temp += "foo";
          gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
    gcRec(10);
}

onload = async () => {
    const input = document.getElementById('input');
    
    // Tenta acessar o ShadowRoot e encontrar o botão de autocompletar exatamente como no teste original,
    // com fallback caso o navegador antigo restrinja o acesso direto via JS.
    let autoFillButton = null;
    try {
        if (input.shadowRoot) {
            autoFillButton = Array.from(input.shadowRoot.querySelectorAll('div')).find((div) => {
                return window.getComputedStyle(div).getPropertyValue('-webkit-user-agent-button') || true;
            });
        }
    } catch (e) {
        console.log("ShadowRoot protegido ou indisponível:", e);
    }

    // Configura o listener de clique que simula a troca de tipo no momento da execução
    input.addEventListener('click', () => {
        input.type = 'button';
        gc();        
    }, { once: true });

    // Se encontrou o botão de autocompletar do shadow DOM, clica nele. 
    // Caso contrário, clica no input como fallback para disparar o fluxo.
    if (autoFillButton) {
        autoFillButton.click();
    } else {
        input.click();
    }

    document.getElementById('result').innerHTML = '<p>This test passes if WebKit does not hit debug assertions or crash under ASAN.</p><br>PASS';
};
</script>
</body>
</html>
