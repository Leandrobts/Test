<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>UAF        ent</title>  
</head>
<body>
<iframe id="target_frame" loading="lazy"></iframe>
<div id="container" tabindex="0" autofocus></div>
    
<script>
    const frameB = document.createElement("iframe");
frameB.id = "frame_b";
frameB.src = "b";
document.body.appendChild(frameB);
    
let frame = document.getElementById("target_frame");
addEventListener("load", () => {
    frame.srcdoc = "a";
    // This `blur` event listener is only necessary to trigger a release assertion, due to script
    // execution in the middle of disconnecting a node.
    frame.contentWindow?.addEventListener("blur", () => { });
    frame.focus();
});

container.onfocusin = () => {
    document.body.innerHTML = "";
};
</script>
  
</body>
</html>
