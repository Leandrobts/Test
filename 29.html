
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PS4 WebCore Capability Matrix V26</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #10131a;
    color: #e8edf5;
    font-family: Arial, sans-serif;
}

#ui {
    position: fixed;
    z-index: 999999;
    top: 0;
    left: 0;
    right: 0;
    padding: 16px;
    background: #181d27;
    border-bottom: 1px solid #394152;
}

h1 {
    margin: 0 0 10px 0;
    font-size: 20px;
}

#status {
    font-size: 15px;
    margin-bottom: 6px;
}

#info {
    font-size: 12px;
    color: #aab4c4;
}

button {
    margin-top: 12px;
    padding: 10px 28px;
    font-size: 16px;
}

#sandbox {
    position: absolute;
    top: 150px;
    left: -5000px;
    width: 1500px;
    min-height: 1500px;
}
</style>
</head>

<body>

<div id="ui">
    <h1>PS4 WebCore Capability Matrix V26</h1>

    <div id="status">STATUS: IDLE</div>

    <div id="info">
        Balanced capability coverage scheduler
    </div>

    <button id="start">INICIAR</button>
</div>

<div id="sandbox"></div>

<script>
(function () {
"use strict";

/* ============================================================
 * CONFIG
 * ============================================================ */

var CONFIG = {
    delay: 35,
    cleanupDelay: 0
};

/* ============================================================
 * STATE
 * ============================================================ */

var state = {
    running: false,
    sequence: 0,
    cycle: 0,
    modules: [],
    capabilities: {},
    current: null
};

var sandbox = document.getElementById("sandbox");
var status = document.getElementById("status");
var info = document.getElementById("info");
var startButton = document.getElementById("start");

/* ============================================================
 * UTIL
 * ============================================================ */

function rand(n) {
    return Math.floor(Math.random() * n);
}

function choose(a) {
    return a && a.length ? a[rand(a.length)] : null;
}

function safe(fn) {
    try {
        return fn();
    } catch (e) {
        return null;
    }
}

/* ============================================================
 * PERSISTENCE
 * ============================================================ */

function saveLast(record) {
    safe(function () {
        localStorage.setItem(
            "ps4_webcore_v26_last",
            JSON.stringify(record)
        );
    });
}

function loadLast() {
    return safe(function () {
        var x = localStorage.getItem("ps4_webcore_v26_last");
        return x ? JSON.parse(x) : null;
    });
}

/* ============================================================
 * CAPABILITY DETECTION
 * ============================================================ */

function detectCapabilities() {
    var c = {};

    /* DOM */
    c.Node = !!window.Node;
    c.Document = !!window.Document;
    c.DocumentFragment = !!window.DocumentFragment;
    c.TreeWalker = !!window.TreeWalker;
    c.NodeIterator = !!window.NodeIterator;
    c.Range = !!window.Range;
    c.Selection = !!window.getSelection;
    c.DOMTokenList = !!window.DOMTokenList;
    c.NamedNodeMap = !!window.NamedNodeMap;

    /* Observers */
    c.MutationObserver = !!window.MutationObserver;
    c.ResizeObserver = !!window.ResizeObserver;
    c.IntersectionObserver = !!window.IntersectionObserver;
    c.PerformanceObserver = !!window.PerformanceObserver;

    /* DOM extras */
    c.DOMParser = !!window.DOMParser;
    c.XMLSerializer = !!window.XMLSerializer;
    c.CustomElements = !!window.customElements;
    c.ShadowDOM = !!HTMLElement.prototype.attachShadow;

    /* Events */
    c.Event = !!window.Event;
    c.MouseEvent = !!window.MouseEvent;
    c.KeyboardEvent = !!window.KeyboardEvent;
    c.FocusEvent = !!window.FocusEvent;
    c.PointerEvent = !!window.PointerEvent;
    c.DragEvent = !!window.DragEvent;
    c.InputEvent = !!window.InputEvent;

    /* Editing */
    c.ContentEditable = "contentEditable" in document.createElement("div");
    c.ExecCommand = typeof document.execCommand === "function";

    /* Frame / document */
    c.Iframe = true;
    c.DocumentOpen = typeof document.open === "function";
    c.History = !!window.history;
    c.PushState = !!window.history && typeof history.pushState === "function";

    /* HTML */
    c.Template = "content" in document.createElement("template");
    c.Forms = !!window.HTMLFormElement;

    /* CSS */
    c.CSS = !!window.getComputedStyle;
    c.CSSStyleSheet = !!window.CSSStyleSheet;
    c.CSSRule = !!window.CSSRule;
    c.InsertRule = !!window.CSSStyleSheet &&
                   typeof CSSStyleSheet.prototype.insertRule === "function";

    /* SVG */
    c.SVG = !!window.SVGElement;

    /* Canvas */
    c.Canvas2D = !!document.createElement("canvas").getContext;

    /* Animation */
    c.Animation = typeof HTMLElement.prototype.animate === "function";

    /* Text/fonts */
    c.Text = !!window.Text;
    c.CharacterData = !!window.CharacterData;
    c.FontFace = !!window.FontFace;
    c.DocumentFonts = !!document.fonts;

    /* Resources */
    c.Fetch = typeof window.fetch === "function";
    c.Request = !!window.Request;
    c.Response = !!window.Response;
    c.Headers = !!window.Headers;
    c.URL = !!window.URL;
    c.URLSearchParams = !!window.URLSearchParams;
    c.Blob = !!window.Blob;
    c.File = !!window.File;
    c.FileReader = !!window.FileReader;

    /* Streams */
    c.ReadableStream = !!window.ReadableStream;
    c.WritableStream = !!window.WritableStream;
    c.TransformStream = !!window.TransformStream;
    c.CompressionStream = !!window.CompressionStream;
    c.DecompressionStream = !!window.DecompressionStream;

    /* Messaging */
    c.MessageChannel = !!window.MessageChannel;
    c.BroadcastChannel = !!window.BroadcastChannel;

    /* Workers */
    c.Worker = !!window.Worker;
    c.SharedWorker = !!window.SharedWorker;

    /* Storage */
    c.LocalStorage = !!window.localStorage;
    c.SessionStorage = !!window.sessionStorage;
    c.Cache = !!window.caches;

    /* Crypto */
    c.Crypto = !!window.crypto;
    c.SubtleCrypto = !!(window.crypto && crypto.subtle);

    /* Media */
    c.Media = !!window.HTMLMediaElement;
    c.Video = !!window.HTMLVideoElement;
    c.Audio = !!window.HTMLAudioElement;
    c.TextTrack = !!window.TextTrack;

    /* Misc */
    c.WebSocket = !!window.WebSocket;
    c.Image = !!window.Image;
    c.ImageBitmap = !!window.createImageBitmap;

    return c;
}

/* ============================================================
 * ROOT
 * ============================================================ */

function makeRoot() {
    var root = document.createElement("div");
    root.style.position = "relative";
    root.style.width = "320px";
    root.style.minHeight = "100px";
    sandbox.appendChild(root);
    return root;
}

function destroyRoot(root) {
    safe(function () {
        if (root && root.parentNode)
            root.parentNode.removeChild(root);
    });
}

/* ============================================================
 * MODULE REGISTRY
 * ============================================================ */

function addModule(name, capability, fn) {
    if (!capability)
        return;

    state.modules.push({
        name: name,
        run: fn,
        count: 0
    });
}

/* ============================================================
 * DOM MODULES
 * ============================================================ */

function testNode(root) {
    var a = document.createElement("div");
    var b = document.createElement("span");

    root.appendChild(a);
    a.appendChild(b);

    safe(function () {
        root.contains(b);
        a.removeChild(b);
        root.appendChild(b);
    });
}

function testDocumentFragment(root) {
    var f = document.createDocumentFragment();

    for (var i = 0; i < 4; i++)
        f.appendChild(document.createElement("div"));

    root.appendChild(f);
}

function testTreeWalker(root) {
    root.innerHTML = "<div><span>A</span><b>B</b></div>";

    safe(function () {
        var w = document.createTreeWalker(
            root,
            NodeFilter.SHOW_ELEMENT,
            null,
            false
        );

        while (w.nextNode()) {}
    });
}

function testNodeIterator(root) {
    root.innerHTML = "<p>A</p><p>B</p>";

    safe(function () {
        var it = document.createNodeIterator(
            root,
            NodeFilter.SHOW_ALL,
            null,
            false
        );

        while (it.nextNode()) {}
    });
}

function testRangeSelection(root) {
    var text = document.createTextNode("V26 selection text");
    root.appendChild(text);

    safe(function () {
        var range = document.createRange();
        range.selectNodeContents(text);

        var selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);

        selection.removeAllRanges();
    });
}

function testClassList(root) {
    var x = document.createElement("div");
    root.appendChild(x);

    x.classList.add("a");
    x.classList.toggle("b");
    x.classList.remove("a");
}

function testAttributes(root) {
    var x = document.createElement("div");
    root.appendChild(x);

    x.setAttribute("data-v26", "1");
    x.getAttribute("data-v26");
    x.removeAttribute("data-v26");
}

/* ============================================================
 * OBSERVERS
 * ============================================================ */

function testMutationObserver(root) {
    var o = new MutationObserver(function () {});

    safe(function () {
        o.observe(root, {
            childList: true,
            subtree: true,
            attributes: true
        });

        var x = document.createElement("div");
        root.appendChild(x);
        x.setAttribute("data-x", "1");

        o.disconnect();
    });
}

function testResizeObserver(root) {
    var x = document.createElement("div");
    root.appendChild(x);

    safe(function () {
        var o = new ResizeObserver(function () {});
        o.observe(x);

        x.style.width = "100px";
        x.style.height = "50px";

        o.disconnect();
    });
}

function testIntersectionObserver(root) {
    var x = document.createElement("div");
    root.appendChild(x);

    safe(function () {
        var o = new IntersectionObserver(function () {});
        o.observe(x);
        x.getBoundingClientRect();
        o.disconnect();
    });
}

function testPerformanceObserver(root) {
    safe(function () {
        var o = new PerformanceObserver(function () {});
        o.disconnect();
    });
}

/* ============================================================
 * SHADOW / CUSTOM ELEMENTS
 * ============================================================ */

function testShadowDOM(root) {
    var host = document.createElement("div");
    root.appendChild(host);

    safe(function () {
        var shadow = host.attachShadow({ mode: "open" });
        var child = document.createElement("span");

        child.textContent = "shadow";
        shadow.appendChild(child);
    });
}

function testCustomElements(root) {
    safe(function () {
        var name = "v26-x-" + Date.now() + "-" + rand(9999);

        function V26Element() {
            return Reflect.construct(
                HTMLElement,
                [],
                V26Element
            );
        }

        V26Element.prototype =
            Object.create(HTMLElement.prototype);

        V26Element.prototype.constructor =
            V26Element;

        customElements.define(name, V26Element);

        var el = document.createElement(name);
        root.appendChild(el);
    });
}

/* ============================================================
 * EVENTS
 * ============================================================ */

function testEvent(root) {
    var x = document.createElement("button");
    root.appendChild(x);

    var n = 0;

    function handler() {
        n++;
    }

    x.addEventListener("click", handler);
    x.dispatchEvent(new Event("click", { bubbles: true }));
    x.removeEventListener("click", handler);

    return n;
}

function testMouseEvent(root) {
    var x = document.createElement("div");
    root.appendChild(x);

    safe(function () {
        x.dispatchEvent(new MouseEvent("mousedown", {
            bubbles: true
        }));
    });
}

function testKeyboardEvent(root) {
    var x = document.createElement("input");
    root.appendChild(x);

    safe(function () {
        x.dispatchEvent(new KeyboardEvent("keydown", {
            bubbles: true,
            key: "A"
        }));
    });
}

function testFocus(root) {
    var x = document.createElement("input");
    root.appendChild(x);

    safe(function () {
        x.focus();
        x.blur();
    });
}

function testPointerEvent(root) {
    var x = document.createElement("div");
    root.appendChild(x);

    safe(function () {
        x.dispatchEvent(new PointerEvent("pointerdown", {
            bubbles: true
        }));
    });
}

function testInputEvent(root) {
    var x = document.createElement("input");
    root.appendChild(x);

    safe(function () {
        x.dispatchEvent(new InputEvent("input", {
            bubbles: true,
            data: "A"
        }));
    });
}

/* ============================================================
 * EDITING
 * ============================================================ */

function testContentEditable(root) {
    var x = document.createElement("div");
    x.contentEditable = "true";
    x.textContent = "editable";

    root.appendChild(x);

    safe(function () {
        x.focus();
        x.blur();
    });
}

function testExecCommand(root) {
    var x = document.createElement("div");

    x.contentEditable = "true";
    x.textContent = "V26";

    root.appendChild(x);

    safe(function () {
        x.focus();
        document.execCommand("selectAll", false, null);
    });
}

/* ============================================================
 * DOCUMENT / FRAME / HISTORY
 * ============================================================ */

function testIframe(root) {
    var frame = document.createElement("iframe");
    frame.src = "about:blank";

    root.appendChild(frame);

    safe(function () {
        var d = frame.contentDocument;

        if (d && d.body) {
            var x = d.createElement("div");
            x.textContent = "frame";
            d.body.appendChild(x);
            d.body.removeChild(x);
        }
    });
}

function testHistory(root) {
    safe(function () {
        history.pushState(
            { v26: state.sequence },
            "",
            "#v26-" + state.sequence
        );
    });
}

/* ============================================================
 * HTML / PARSER
 * ============================================================ */

function testInnerHTML(root) {
    var x = document.createElement("div");
    root.appendChild(x);

    x.innerHTML =
        "<section><span>A</span><b>B</b></section>";

    x.innerHTML =
        "<input><textarea></textarea><select><option>X</option></select>";
}

function testOuterHTML(root) {
    var x = document.createElement("div");
    x.textContent = "outer";

    root.appendChild(x);

    safe(function () {
        x.outerHTML = "<section><span>replacement</span></section>";
    });
}

function testAdjacentHTML(root) {
    var x = document.createElement("div");
    root.appendChild(x);

    safe(function () {
        x.insertAdjacentHTML(
            "beforeend",
            "<span>A</span><b>B</b>"
        );
    });
}

function testTemplate(root) {
    var t = document.createElement("template");

    t.innerHTML =
        "<div><span>A</span><i>B</i></div>";

    root.appendChild(
        document.importNode(t.content, true)
    );
}

function testDOMParser(root) {
    safe(function () {
        var parser = new DOMParser();

        var d = parser.parseFromString(
            "<div><span>V26</span></div>",
            "text/html"
        );

        if (d.body)
            root.appendChild(
                document.importNode(d.body, true)
            );
    });
}

function testXMLSerializer(root) {
    safe(function () {
        var x = document.createElement("div");
        x.setAttribute("data-v26", "xml");
        root.appendChild(x);

        var s = new XMLSerializer();
        s.serializeToString(root);
    });
}

/* ============================================================
 * FORMS
 * ============================================================ */

function testForms(root) {
    var form = document.createElement("form");
    var input = document.createElement("input");
    var textarea = document.createElement("textarea");
    var select = document.createElement("select");
    var option = document.createElement("option");

    option.textContent = "A";

    select.appendChild(option);

    form.appendChild(input);
    form.appendChild(textarea);
    form.appendChild(select);

    root.appendChild(form);

    safe(function () {
        input.value = "test";
        textarea.value = "text";
        select.selectedIndex = 0;
        form.checkValidity();
        form.reset();
    });
}

/* ============================================================
 * CSS / STYLE
 * ============================================================ */

function testInlineStyle(root) {
    var x = document.createElement("div");
    root.appendChild(x);

    x.style.display = "block";
    x.style.position = "relative";
    x.style.width = "120px";
    x.style.height = "50px";
    x.style.overflow = "hidden";

    safe(function () {
        getComputedStyle(x).display;
        void x.offsetWidth;
    });
}

function testStyleElement(root) {
    var style = document.createElement("style");

    style.textContent =
        ".v26-style { width: 50px; height: 30px; }";

    document.head.appendChild(style);

    var x = document.createElement("div");
    x.className = "v26-style";

    root.appendChild(x);

    safe(function () {
        getComputedStyle(x).width;
    });

    safe(function () {
        style.parentNode.removeChild(style);
    });
}

function testCSSStyleSheet(root) {
    safe(function () {
        var style = document.createElement("style");
        document.head.appendChild(style);

        var sheet = style.sheet;

        if (sheet && sheet.insertRule) {
            sheet.insertRule(
                ".v26-rule { display:block; }",
                sheet.cssRules.length
            );

            if (sheet.cssRules.length)
                sheet.deleteRule(sheet.cssRules.length - 1);
        }

        style.parentNode.removeChild(style);
    });
}

/* ============================================================
 * LAYOUT
 * ============================================================ */

function testLayoutFlex(root) {
    var x = document.createElement("div");

    x.style.display = "flex";

    for (var i = 0; i < 3; i++) {
        var c = document.createElement("div");
        c.style.width = "30px";
        c.style.height = "20px";
        x.appendChild(c);
    }

    root.appendChild(x);

    safe(function () {
        x.getBoundingClientRect();
    });
}

function testLayoutGrid(root) {
    var x = document.createElement("div");

    x.style.display = "grid";
    x.style.gridTemplateColumns = "30px 30px";

    root.appendChild(x);

    for (var i = 0; i < 4; i++)
        x.appendChild(document.createElement("div"));

    safe(function () {
        void x.offsetHeight;
    });
}

function testLayoutTable(root) {
    var table = document.createElement("table");
    var tr = document.createElement("tr");

    for (var i = 0; i < 2; i++) {
        var td = document.createElement("td");
        td.textContent = "cell";
        tr.appendChild(td);
    }

    table.appendChild(tr);
    root.appendChild(table);

    safe(function () {
        table.getBoundingClientRect();
    });
}

/* ============================================================
 * SVG
 * ============================================================ */

function testSVG(root) {
    var ns = "http://www.w3.org/2000/svg";

    var svg = document.createElementNS(ns, "svg");
    var rect = document.createElementNS(ns, "rect");

    svg.setAttribute("width", "100");
    svg.setAttribute("height", "60");

    rect.setAttribute("x", "5");
    rect.setAttribute("y", "5");
    rect.setAttribute("width", "50");
    rect.setAttribute("height", "30");

    svg.appendChild(rect);
    root.appendChild(svg);

    safe(function () {
        rect.getBoundingClientRect();
    });
}

/* ============================================================
 * CANVAS
 * ============================================================ */

function testCanvas(root) {
    var canvas = document.createElement("canvas");

    canvas.width = 64;
    canvas.height = 64;

    root.appendChild(canvas);

    safe(function () {
        var ctx = canvas.getContext("2d");

        if (ctx) {
            ctx.fillRect(0, 0, 10, 10);

            canvas.width = 32;

            ctx.fillRect(1, 1, 5, 5);
        }
    });
}

/* ============================================================
 * TEXT / FONTS
 * ============================================================ */

function testText(root) {
    var text = document.createTextNode("abcdefgh");

    root.appendChild(text);

    safe(function () {
        text.data = "12345678";
        text.splitText(4);
    });
}

function testFonts(root) {
    safe(function () {
        if (document.fonts)
            document.fonts.status;
    });
}

/* ============================================================
 * ANIMATION
 * ============================================================ */

function testAnimation(root) {
    var x = document.createElement("div");

    x.style.width = "20px";
    x.style.height = "20px";

    root.appendChild(x);

    safe(function () {
        var a = x.animate(
            [
                { transform: "translateX(0px)" },
                { transform: "translateX(5px)" }
            ],
            {
                duration: 20
            }
        );

        a.cancel();
    });
}

/* ============================================================
 * RESOURCES
 * ============================================================ */

function testURL(root) {
    safe(function () {
        var u = new URL(
            "https://example.com/path?a=1"
        );

        u.searchParams.set("v26", "1");
        u.href;
    });
}

function testBlob(root) {
    safe(function () {
        var blob = new Blob(
            ["V26"],
            { type: "text/plain" }
        );

        blob.size;
    });
}

function testFileReader(root) {
    safe(function () {
        var blob = new Blob(["V26"]);
        var reader = new FileReader();

        reader.onload = function () {};
        reader.readAsText(blob);
    });
}

function testRequestResponse(root) {
    safe(function () {
        var req = new Request("https://example.com/");
        req.method;

        var res = new Response("V26");
        res.status;
    });
}

function testHeaders(root) {
    safe(function () {
        var h = new Headers();
        h.set("X-V26", "1");
        h.get("X-V26");
    });
}

/* ============================================================
 * STREAMS
 * ============================================================ */

function testReadableStream(root) {
    safe(function () {
        var stream = new ReadableStream({
            start: function (controller) {
                controller.enqueue("V26");
                controller.close();
            }
        });

        var reader = stream.getReader();

        reader.read().then(function () {
            safe(function () {
                reader.releaseLock();
            });
        });
    });
}

function testWritableStream(root) {
    safe(function () {
        var stream = new WritableStream({
            write: function () {}
        });

        var writer = stream.getWriter();

        writer.write("V26").then(function () {
            return writer.close();
        });
    });
}

function testTransformStream(root) {
    safe(function () {
        var ts = new TransformStream({
            transform: function (chunk, controller) {
                controller.enqueue(chunk);
            }
        });

        ts.readable.getReader();
        ts.writable.getWriter();
    });
}

function testCompressionStream(root) {
    safe(function () {
        new CompressionStream("gzip");
    });
}

function testDecompressionStream(root) {
    safe(function () {
        new DecompressionStream("gzip");
    });
}

/* ============================================================
 * MESSAGING
 * ============================================================ */

function testMessageChannel(root) {
    safe(function () {
        var c = new MessageChannel();

        c.port1.onmessage = function () {};

        c.port2.postMessage("V26");

        c.port1.close();
        c.port2.close();
    });
}

function testBroadcastChannel(root) {
    safe(function () {
        var name = "v26-" + state.sequence;
        var c = new BroadcastChannel(name);

        c.postMessage("V26");
        c.close();
    });
}

/* ============================================================
 * STORAGE
 * ============================================================ */

function testLocalStorage(root) {
    safe(function () {
        var key = "v26-test";
        localStorage.setItem(key, "1");
        localStorage.getItem(key);
        localStorage.removeItem(key);
    });
}

function testSessionStorage(root) {
    safe(function () {
        var key = "v26-test";
        sessionStorage.setItem(key, "1");
        sessionStorage.getItem(key);
        sessionStorage.removeItem(key);
    });
}

function testCacheAPI(root) {
    safe(function () {
        caches.open("v26-capability").then(function (cache) {
            return cache.keys();
        });
    });
}

/* ============================================================
 * CRYPTO
 * ============================================================ */

function testCrypto(root) {
    safe(function () {
        var a = new Uint8Array(8);
        crypto.getRandomValues(a);
    });
}

function testSubtleCrypto(root) {
    safe(function () {
        crypto.subtle.digest(
            "SHA-256",
            new Uint8Array([1, 2, 3])
        );
    });
}

/* ============================================================
 * MEDIA
 * ============================================================ */

function testMedia(root) {
    var audio = document.createElement("audio");
    root.appendChild(audio);

    safe(function () {
        audio.volume = 0;
        audio.muted = true;
        audio.pause();
    });
}

function testVideo(root) {
    var video = document.createElement("video");
    root.appendChild(video);

    safe(function () {
        video.muted = true;
        video.pause();
    });
}

/* ============================================================
 * IMAGE
 * ============================================================ */

function testImage(root) {
    safe(function () {
        var img = new Image();
        img.alt = "V26";
        root.appendChild(img);
    });
}

/* ============================================================
 * MODULE BUILD
 * ============================================================ */

function buildModules() {
    state.modules = [];

    /* DOM */
    addModule("Node", state.capabilities.Node, testNode);
    addModule("DocumentFragment", state.capabilities.DocumentFragment, testDocumentFragment);
    addModule("TreeWalker", state.capabilities.TreeWalker, testTreeWalker);
    addModule("NodeIterator", state.capabilities.NodeIterator, testNodeIterator);
    addModule("RangeSelection", state.capabilities.Range && state.capabilities.Selection, testRangeSelection);
    addModule("DOMTokenList", state.capabilities.DOMTokenList, testClassList);
    addModule("NamedNodeMap", state.capabilities.NamedNodeMap, testAttributes);

    /* Observers */
    addModule("MutationObserver", state.capabilities.MutationObserver, testMutationObserver);
    addModule("ResizeObserver", state.capabilities.ResizeObserver, testResizeObserver);
    addModule("IntersectionObserver", state.capabilities.IntersectionObserver, testIntersectionObserver);
    addModule("PerformanceObserver", state.capabilities.PerformanceObserver, testPerformanceObserver);

    /* DOM extras */
    addModule("ShadowDOM", state.capabilities.ShadowDOM, testShadowDOM);
    addModule("CustomElements", state.capabilities.CustomElements, testCustomElements);

    /* Events */
    addModule("Event", state.capabilities.Event, testEvent);
    addModule("MouseEvent", state.capabilities.MouseEvent, testMouseEvent);
    addModule("KeyboardEvent", state.capabilities.KeyboardEvent, testKeyboardEvent);
    addModule("Focus", state.capabilities.FocusEvent, testFocus);
    addModule("PointerEvent", state.capabilities.PointerEvent, testPointerEvent);
    addModule("InputEvent", state.capabilities.InputEvent, testInputEvent);

    /* Editing */
    addModule("ContentEditable", state.capabilities.ContentEditable, testContentEditable);
    addModule("ExecCommand", state.capabilities.ExecCommand, testExecCommand);

    /* Frame/history */
    addModule("Iframe", state.capabilities.Iframe, testIframe);
    addModule("History", state.capabilities.PushState, testHistory);

    /* Parser */
    addModule("InnerHTML", true, testInnerHTML);
    addModule("OuterHTML", true, testOuterHTML);
    addModule("InsertAdjacentHTML", true, testAdjacentHTML);
    addModule("Template", state.capabilities.Template, testTemplate);
    addModule("DOMParser", state.capabilities.DOMParser, testDOMParser);
    addModule("XMLSerializer", state.capabilities.XMLSerializer, testXMLSerializer);

    /* Forms */
    addModule("Forms", state.capabilities.Forms, testForms);

    /* CSS */
    addModule("InlineStyle", state.capabilities.CSS, testInlineStyle);
    addModule("StyleElement", state.capabilities.CSS, testStyleElement);
    addModule("CSSStyleSheet", state.capabilities.InsertRule, testCSSStyleSheet);

    /* Layout */
    addModule("LayoutFlex", state.capabilities.CSS, testLayoutFlex);
    addModule("LayoutGrid", state.capabilities.CSS, testLayoutGrid);
    addModule("LayoutTable", state.capabilities.CSS, testLayoutTable);

    /* SVG/canvas */
    addModule("SVG", state.capabilities.SVG, testSVG);
    addModule("Canvas2D", state.capabilities.Canvas2D, testCanvas);

    /* Text/fonts */
    addModule("Text", state.capabilities.Text, testText);
    addModule("DocumentFonts", state.capabilities.DocumentFonts, testFonts);

    /* Animation */
    addModule("Animation", state.capabilities.Animation, testAnimation);

    /* Resources */
    addModule("URL", state.capabilities.URL, testURL);
    addModule("Blob", state.capabilities.Blob, testBlob);
    addModule("FileReader", state.capabilities.FileReader, testFileReader);
    addModule("RequestResponse", state.capabilities.Request && state.capabilities.Response, testRequestResponse);
    addModule("Headers", state.capabilities.Headers, testHeaders);

    /* Streams */
    addModule("ReadableStream", state.capabilities.ReadableStream, testReadableStream);
    addModule("WritableStream", state.capabilities.WritableStream, testWritableStream);
    addModule("TransformStream", state.capabilities.TransformStream, testTransformStream);
    addModule("CompressionStream", state.capabilities.CompressionStream, testCompressionStream);
    addModule("DecompressionStream", state.capabilities.DecompressionStream, testDecompressionStream);

    /* Messaging */
    addModule("MessageChannel", state.capabilities.MessageChannel, testMessageChannel);
    addModule("BroadcastChannel", state.capabilities.BroadcastChannel, testBroadcastChannel);

    /* Storage */
    addModule("localStorage", state.capabilities.LocalStorage, testLocalStorage);
    addModule("sessionStorage", state.capabilities.SessionStorage, testSessionStorage);
    addModule("CacheAPI", state.capabilities.Cache, testCacheAPI);

    /* Crypto */
    addModule("Crypto", state.capabilities.Crypto, testCrypto);
    addModule("SubtleCrypto", state.capabilities.SubtleCrypto, testSubtleCrypto);

    /* Media */
    addModule("Media", state.capabilities.Media, testMedia);
    addModule("Video", state.capabilities.Video, testVideo);

    /* Images */
    addModule("Image", state.capabilities.Image, testImage);
}

/* ============================================================
 * BALANCED SCHEDULER
 * ============================================================ */

function getLeastExecutedModule() {
    if (!state.modules.length)
        return null;

    var min = Infinity;
    var candidates = [];

    for (var i = 0; i < state.modules.length; i++) {
        var m = state.modules[i];

        if (m.count < min) {
            min = m.count;
            candidates = [m];
        } else if (m.count === min) {
            candidates.push(m);
        }
    }

    return choose(candidates);
}

function checkCycle() {
    if (!state.modules.length)
        return;

    var min = Infinity;

    for (var i = 0; i < state.modules.length; i++)
        min = Math.min(min, state.modules[i].count);

    if (min > state.cycle) {
        state.cycle = min;
    }
}

/* ============================================================
 * EXECUTION
 * ============================================================ */

function runNext() {
    if (!state.running)
        return;

    state.sequence++;

    var module = getLeastExecutedModule();

    if (!module) {
        status.textContent = "STATUS: NO MODULES";
        return;
    }

    var record = {
        version: "V26",
        sequence: state.sequence,
        cycle: state.cycle + 1,
        module: module.name,
        timestamp: Date.now()
    };

    /* Save BEFORE execution. */
    saveLast(record);

    state.current = record;

    status.textContent = "STATUS: RUNNING";

    info.textContent =
        "Cycle " + record.cycle +
        " | #" + record.sequence +
        " | " + record.module;

    var root = makeRoot();

    safe(function () {
        module.run(root);
    });

    module.count++;

    checkCycle();

    destroyRoot(root);

    setTimeout(runNext, CONFIG.delay);
}

/* ============================================================
 * START
 * ============================================================ */

function start() {
    if (state.running)
        return;

    state.capabilities = detectCapabilities();

    buildModules();

    state.running = true;

    startButton.style.display = "none";

    status.textContent = "STATUS: INITIALIZING";

    info.textContent =
        state.modules.length +
        " capability modules enabled";

    setTimeout(runNext, 400);
}

startButton.addEventListener("click", start);

/* ============================================================
 * LAST RECORD
 * ============================================================ */

var last = loadLast();

if (last) {
    info.textContent =
        "Last saved: #" +
        last.sequence +
        " | " +
        last.module;
}

})();
</script>
