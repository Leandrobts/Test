<!DOCTYPE html>
<html>
<body>
<iframe id="target_frame" loading="lazy"></iframe>
<div id="container" tabindex="0" autofocus></div>
    
<script>
const frameB = document.createElement("iframe");
frameB.id = "frame_b";
frameB.src = "b";
document.body.appendChild(frameB);
    
let frame = document.getElementById("target_frame");
addEventListener("load", () => {
    frame.srcdoc = "a";
    frame.contentWindow?.addEventListener("blur", () => { });
    frame.focus();
});

container.onfocusin = () => {
    document.body.innerHTML = "";
};
</script>
</body>
</html>
