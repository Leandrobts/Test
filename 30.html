<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 13.52 - WebCore Capability Matrix V23</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #111;
    color: #ddd;
    font-family: Arial, sans-serif;
}

body {
    padding: 14px;
}

button {
    padding: 13px 22px;
    font-size: 18px;
    margin-right: 8px;
}

#status {
    margin-top: 12px;
    padding: 10px;
    background: #181818;
    border: 1px solid #333;
    font-family: monospace;
}

#summary {
    margin-top: 10px;
    padding: 10px;
    background: #181818;
    border: 1px solid #333;
    font-family: monospace;
}

#matrix {
    margin-top: 12px;
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}

#matrix th,
#matrix td {
    border: 1px solid #333;
    padding: 7px;
    text-align: left;
}

#matrix th {
    background: #222;
}

.supported {
    font-weight: bold;
}

.partial {
    font-weight: bold;
}

.unsupported {
    opacity: 0.7;
}

.error {
    font-weight: bold;
}

.category {
    background: #202020;
    font-weight: bold;
}

#recovery {
    margin-top: 12px;
    padding: 10px;
    background: #181818;
    border: 1px solid #333;
    font-family: monospace;
    display: none;
}
</style>
</head>

<body>

<button id="run">RUN CAPABILITY MATRIX</button>
<button id="clear">CLEAR RESULTS</button>

<div id="status">READY</div>

<div id="summary">
    No test executed.
</div>

<div id="recovery"></div>

<table id="matrix">
<thead>
<tr>
    <th>Category</th>
    <th>Surface</th>
    <th>Status</th>
    <th>Probe</th>
</tr>
</thead>
<tbody>
</tbody>
</table>

<script>
(function () {

"use strict";

/*
================================================================
 V23 — PS4 13.52 WebCore Capability Matrix
================================================================

 PURPOSE
 -------
 Determine which browser/WebCore surfaces are exposed and
 minimally exercisable from JavaScript.

 THIS IS NOT A FUZZER.

 No resource exhaustion.
 No large allocations.
 No worker storms.
 No navigation loops.
 No crash-oriented stress.

 RESULT STATES
 -------------
 SUPPORTED
 PARTIAL
 UNSUPPORTED
 ERROR

 IMPORTANT
 ---------
 JavaScript presence checks cannot prove that an entire WebCore
 subsystem exists or does not exist.

 Each probe therefore tries, when practical, to perform a small
 representative operation.

 Results are persisted in localStorage.
================================================================
*/


var STORAGE_KEY =
    "PS4_1352_V23_CAPABILITY_MATRIX";


var running = false;

var results = [];

var tbody =
    document.querySelector(
        "#matrix tbody"
    );

var status =
    document.getElementById(
        "status"
    );

var summary =
    document.getElementById(
        "summary"
    );

var recovery =
    document.getElementById(
        "recovery"
    );


/*
================================================================
 UTILITIES
================================================================
*/

function setStatus(text)
{
    status.textContent = text;
}


function saveResults()
{
    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({
                version: "V23",
                target: "PS4 13.52",
                timestamp: Date.now(),
                results: results
            })
        );

    } catch (e) {}
}


function loadResults()
{
    try {

        var raw =
            localStorage.getItem(
                STORAGE_KEY
            );

        if (!raw)
            return null;

        return JSON.parse(raw);

    } catch (e) {

        return null;
    }
}


function clearResults()
{
    try {
        localStorage.removeItem(
            STORAGE_KEY
        );
    } catch (e) {}

    results = [];

    tbody.innerHTML = "";

    summary.textContent =
        "No test executed.";

    recovery.style.display =
        "none";

    setStatus("CLEARED");
}


function addResult(
    category,
    surface,
    state,
    probe
)
{
    var result = {

        category: category,

        surface: surface,

        status: state,

        probe: probe

    };

    results.push(result);

    renderResult(result);

    saveResults();
}


function renderResult(result)
{
    var row =
        document.createElement(
            "tr"
        );

    var category =
        document.createElement(
            "td"
        );

    var surface =
        document.createElement(
            "td"
        );

    var statusCell =
        document.createElement(
            "td"
        );

    var probe =
        document.createElement(
            "td"
        );

    category.textContent =
        result.category;

    surface.textContent =
        result.surface;

    statusCell.textContent =
        result.status;

    probe.textContent =
        result.probe;

    if (
        result.status ===
        "SUPPORTED"
    ) {

        statusCell.className =
            "supported";

    } else if (
        result.status ===
        "PARTIAL"
    ) {

        statusCell.className =
            "partial";

    } else if (
        result.status ===
        "UNSUPPORTED"
    ) {

        statusCell.className =
            "unsupported";

    } else {

        statusCell.className =
            "error";
    }

    row.appendChild(category);
    row.appendChild(surface);
    row.appendChild(statusCell);
    row.appendChild(probe);

    tbody.appendChild(row);
}


function updateSummary()
{
    var supported = 0;
    var partial = 0;
    var unsupported = 0;
    var errors = 0;

    for (
        var i = 0;
        i < results.length;
        i++
    ) {

        if (
            results[i].status ===
            "SUPPORTED"
        )
            supported++;

        else if (
            results[i].status ===
            "PARTIAL"
        )
            partial++;

        else if (
            results[i].status ===
            "UNSUPPORTED"
        )
            unsupported++;

        else
            errors++;
    }

    summary.textContent =
        "TOTAL: " + results.length +
        " | SUPPORTED: " + supported +
        " | PARTIAL: " + partial +
        " | UNSUPPORTED: " + unsupported +
        " | ERROR: " + errors;
}


/*
================================================================
 PROBE HELPERS
================================================================
*/

function probeGlobal(
    category,
    surface,
    name
)
{
    var exists =
        typeof window[name] !==
        "undefined";

    addResult(
        category,
        surface,
        exists ?
            "SUPPORTED" :
            "UNSUPPORTED",
        "window." + name
    );
}


function probeConstructor(
    category,
    surface,
    name,
    constructorTest
)
{
    if (
        typeof window[name] ===
        "undefined"
    ) {

        addResult(
            category,
            surface,
            "UNSUPPORTED",
            "constructor absent"
        );

        return;
    }

    try {

        var value =
            constructorTest();

        addResult(
            category,
            surface,
            value === false ?
                "PARTIAL" :
                "SUPPORTED",
            "construct/operation"
        );

    } catch (e) {

        addResult(
            category,
            surface,
            "PARTIAL",
            "constructor exists; operation threw"
        );
    }
}


function safeProbe(
    category,
    surface,
    description,
    fn
)
{
    try {

        var result =
            fn();

        if (result === false) {

            addResult(
                category,
                surface,
                "PARTIAL",
                description
            );

        } else {

            addResult(
                category,
                surface,
                "SUPPORTED",
                description
            );
        }

    } catch (e) {

        addResult(
            category,
            surface,
            "ERROR",
            description
        );
    }
}


/*
================================================================
 DOM
================================================================
*/

function testDOM()
{
    var category = "DOM";

    safeProbe(
        category,
        "Node / Element",
        "createElement + appendChild",
        function () {

            var d =
                document.createElement(
                    "div"
                );

            var s =
                document.createElement(
                    "span"
                );

            d.appendChild(s);

            return (
                d.firstChild === s
            );
        }
    );


    safeProbe(
        category,
        "DocumentFragment",
        "createDocumentFragment",
        function () {

            var f =
                document.createDocumentFragment();

            var d =
                document.createElement(
                    "div"
                );

            f.appendChild(d);

            return (
                f.firstChild === d
            );
        }
    );


    safeProbe(
        category,
        "HTMLCollection",
        "getElementsByTagName",
        function () {

            var d =
                document.createElement(
                    "div"
                );

            d.innerHTML =
                "<span></span><span></span>";

            return (
                d.getElementsByTagName(
                    "span"
                ).length === 2
            );
        }
    );


    safeProbe(
        category,
        "NodeList",
        "querySelectorAll",
        function () {

            var d =
                document.createElement(
                    "div"
                );

            d.innerHTML =
                "<span></span><span></span>";

            return (
                d.querySelectorAll(
                    "span"
                ).length === 2
            );
        }
    );


    probeConstructor(
        category,
        "MutationObserver",
        "MutationObserver",
        function () {

            var observer =
                new MutationObserver(
                    function () {}
                );

            observer.disconnect();

            return true;
        }
    );


    probeConstructor(
        category,
        "TreeWalker",
        "document.createTreeWalker",
        function () {

            var walker =
                document.createTreeWalker(
                    document.body,
                    1,
                    null,
                    false
                );

            return !!walker;
        }
    );


    probeConstructor(
        category,
        "NodeIterator",
        "document.createNodeIterator",
        function () {

            var iterator =
                document.createNodeIterator(
                    document.body,
                    1,
                    null,
                    false
                );

            return !!iterator;
        }
    );


    probeConstructor(
        category,
        "DOMParser",
        "DOMParser",
        function () {

            var parser =
                new DOMParser();

            var doc =
                parser.parseFromString(
                    "<div>v23</div>",
                    "text/html"
                );

            return !!doc;
        }
    );


    probeConstructor(
        category,
        "Range",
        "Range",
        function () {

            var range =
                document.createRange();

            range.selectNode(
                document.documentElement
            );

            return true;
        }
    );


    probeGlobal(
        category,
        "Selection",
        "getSelection"
    );


    probeGlobal(
        category,
        "Template",
        "HTMLTemplateElement"
    );


    probeGlobal(
        category,
        "CustomEvent",
        "CustomEvent"
    );


    probeGlobal(
        category,
        "EventTarget",
        "EventTarget"
    );


    safeProbe(
        category,
        "ShadowRoot",
        "attachShadow + shadow tree",
        function () {

            var host =
                document.createElement(
                    "div"
                );

            if (!host.attachShadow)
                return false;

            var shadow =
                host.attachShadow({
                    mode: "open"
                });

            var span =
                document.createElement(
                    "span"
                );

            shadow.appendChild(span);

            return (
                shadow.firstChild === span
            );
        }
    );
}


/*
================================================================
 EVENTS
================================================================
*/

function testEvents()
{
    var category = "Events";

    safeProbe(
        category,
        "Event",
        "createEvent + dispatchEvent",
        function () {

            var d =
                document.createElement(
                    "div"
                );

            var fired = false;

            d.addEventListener(
                "v23",
                function () {
                    fired = true;
                },
                false
            );

            var event =
                document.createEvent(
                    "Event"
                );

            event.initEvent(
                "v23",
                true,
                true
            );

            d.dispatchEvent(event);

            return fired;
        }
    );


    probeGlobal(
        category,
        "MouseEvent",
        "MouseEvent"
    );


    probeGlobal(
        category,
        "KeyboardEvent",
        "KeyboardEvent"
    );


    probeGlobal(
        category,
        "FocusEvent",
        "FocusEvent"
    );


    safeProbe(
        category,
        "Event bubbling",
        "capture/bubble dispatch",
        function () {

            var parent =
                document.createElement(
                    "div"
                );

            var child =
                document.createElement(
                    "button"
                );

            parent.appendChild(child);

            var count = 0;

            parent.addEventListener(
                "v23",
                function () {
                    count++;
                },
                false
            );

            var event =
                document.createEvent(
                    "Event"
                );

            event.initEvent(
                "v23",
                true,
                true
            );

            child.dispatchEvent(event);

            return count === 1;
        }
    );


    safeProbe(
        category,
        "Focus / blur",
        "focus/blur methods",
        function () {

            var input =
                document.createElement(
                    "input"
                );

            document.body.appendChild(input);

            input.focus();
            input.blur();

            input.parentNode.removeChild(
                input
            );

            return true;
        }
    );
}


/*
================================================================
 FRAMES / PAGE
================================================================
*/

function testFrames()
{
    var category = "Frame/Page";

    safeProbe(
        category,
        "iframe",
        "create iframe",
        function () {

            var frame =
                document.createElement(
                    "iframe"
                );

            frame.src =
                "about:blank";

            document.body.appendChild(
                frame
            );

            var ok =
                !!frame.contentDocument;

            frame.parentNode.removeChild(
                frame
            );

            return ok;
        }
    );


    safeProbe(
        category,
        "contentWindow",
        "iframe.contentWindow",
        function () {

            var frame =
                document.createElement(
                    "iframe"
                );

            frame.src =
                "about:blank";

            document.body.appendChild(frame);

            var ok =
                !!frame.contentWindow;

            frame.parentNode.removeChild(
                frame
            );

            return ok;
        }
    );


    safeProbe(
        category,
        "contentDocument",
        "iframe.contentDocument",
        function () {

            var frame =
                document.createElement(
                    "iframe"
                );

            frame.src =
                "about:blank";

            document.body.appendChild(frame);

            var ok =
                !!frame.contentDocument.body;

            frame.parentNode.removeChild(
                frame
            );

            return ok;
        }
    );


    probeGlobal(
        category,
        "window.open",
        "open"
    );


    safeProbe(
        category,
        "history",
        "history.pushState",
        function () {

            if (!history.pushState)
                return false;

            history.pushState(
                {
                    v23: true
                },
                "",
                location.href
            );

            return true;
        }
    );


    probeGlobal(
        category,
        "beforeunload",
        "onbeforeunload"
    );


    probeGlobal(
        category,
        "unload",
        "onunload"
    );


    probeGlobal(
        category,
        "pagehide",
        "onpagehide"
    );


    probeGlobal(
        category,
        "pageshow",
        "onpageshow"
    );
}


/*
================================================================
 CSS / STYLE
================================================================
*/

function testCSS()
{
    var category = "CSS/Style";

    safeProbe(
        category,
        "CSSStyleDeclaration",
        "element.style mutation",
        function () {

            var d =
                document.createElement(
                    "div"
                );

            d.style.width =
                "100px";

            d.style.display =
                "block";

            return (
                d.style.width ===
                "100px"
            );
        }
    );


    safeProbe(
        category,
        "getComputedStyle",
        "computed style",
        function () {

            var d =
                document.createElement(
                    "div"
                );

            document.body.appendChild(d);

            d.style.display =
                "block";

            var style =
                window.getComputedStyle(d);

            var ok =
                !!style &&
                typeof style.display !==
                "undefined";

            d.parentNode.removeChild(d);

            return ok;
        }
    );


    probeGlobal(
        category,
        "CSSRule",
        "CSSRule"
    );


    probeGlobal(
        category,
        "CSSStyleSheet",
        "CSSStyleSheet"
    );


    safeProbe(
        category,
        "style element",
        "dynamic stylesheet",
        function () {

            var style =
                document.createElement(
                    "style"
                );

            style.textContent =
                ".v23-test { display:block; }";

            document.head.appendChild(style);

            var ok =
                style.sheet !== null;

            style.parentNode.removeChild(style);

            return ok;
        }
    );


    probeGlobal(
        category,
        "CSS.supports",
        "CSS"
    );


    probeGlobal(
        category,
        "Animation",
        "Animation"
    );


    probeGlobal(
        category,
        "KeyframeEffect",
        "KeyframeEffect"
    );


    probeGlobal(
        category,
        "CSSKeyframesRule",
        "CSSKeyframesRule"
    );


    probeGlobal(
        category,
        "TransitionEvent",
        "TransitionEvent"
    );
}


/*
================================================================
 LAYOUT / RENDER
================================================================
*/

function testLayout()
{
    var category = "Layout/RenderTree";

    var d =
        document.createElement(
            "div"
        );

    d.style.cssText =
        "display:block;" +
        "position:relative;" +
        "width:100px;" +
        "height:50px;" +
        "overflow:auto;";

    d.innerHTML =
        "<span style='display:inline'>text</span>";

    document.body.appendChild(d);


    safeProbe(
        category,
        "block layout",
        "offsetWidth/offsetHeight",
        function () {

            return (
                d.offsetWidth >= 0 &&
                d.offsetHeight >= 0
            );
        }
    );


    safeProbe(
        category,
        "geometry",
        "getBoundingClientRect",
        function () {

            var rect =
                d.getBoundingClientRect();

            return (
                typeof rect.width !==
                "undefined"
            );
        }
    );


    safeProbe(
        category,
        "inline layout",
        "inline element",
        function () {

            var span =
                d.firstChild;

            return !!span &&
                span.nodeType === 1;
        }
    );


    d.style.display =
        "inline-block";


    safeProbe(
        category,
        "inline-block",
        "display transition",
        function () {

            void d.offsetWidth;

            return true;
        }
    );


    d.style.position =
        "absolute";


    safeProbe(
        category,
        "positioned layout",
        "absolute positioning",
        function () {

            void d.offsetWidth;

            return true;
        }
    );


    d.style.overflow =
        "hidden";


    safeProbe(
        category,
        "overflow",
        "overflow mutation + layout",
        function () {

            void d.offsetWidth;

            return true;
        }
    );


    d.parentNode.removeChild(d);


    safeProbe(
        category,
        "table layout",
        "table/table-cell fixture",
        function () {

            var table =
                document.createElement(
                    "div"
                );

            table.style.display =
                "table";

            var cell =
                document.createElement(
                    "div"
                );

            cell.style.display =
                "table-cell";

            table.appendChild(cell);

            document.body.appendChild(
                table
            );

            var ok =
                table.offsetWidth >= 0;

            table.parentNode.removeChild(
                table
            );

            return ok;
        }
    );


    safeProbe(
        category,
        "flex",
        "display:flex",
        function () {

            var flex =
                document.createElement(
                    "div"
                );

            flex.style.display =
                "flex";

            var child =
                document.createElement(
                    "div"
                );

            flex.appendChild(child);

            document.body.appendChild(
                flex
            );

            var ok =
                flex.offsetWidth >= 0;

            flex.parentNode.removeChild(
                flex
            );

            return ok;
        }
    );


    safeProbe(
        category,
        "list layout",
        "ul/li",
        function () {

            var ul =
                document.createElement(
                    "ul"
                );

            var li =
                document.createElement(
                    "li"
                );

            li.textContent =
                "v23";

            ul.appendChild(li);

            document.body.appendChild(
                ul
            );

            var ok =
                li.offsetWidth >= 0;

            ul.parentNode.removeChild(
                ul
            );

            return ok;
        }
    );
}


/*
================================================================
 FORMS / EDITING
================================================================
*/

function testForms()
{
    var category = "Forms/Editing";

    safeProbe(
        category,
        "input",
        "input creation",
        function () {

            var input =
                document.createElement(
                    "input"
                );

            input.type =
                "text";

            input.value =
                "v23";

            return input.value ===
                "v23";
        }
    );


    safeProbe(
        category,
        "input type replacement",
        "text -> search -> number",
        function () {

            var input =
                document.createElement(
                    "input"
                );

            input.type =
                "text";

            input.type =
                "search";

            input.type =
                "number";

            return (
                input.type ===
                "number"
            );
        }
    );


    safeProbe(
        category,
        "textarea",
        "textarea value",
        function () {

            var textarea =
                document.createElement(
                    "textarea"
                );

            textarea.value =
                "v23";

            return textarea.value ===
                "v23";
        }
    );


    safeProbe(
        category,
        "select",
        "select/option",
        function () {

            var select =
                document.createElement(
                    "select"
                );

            var option =
                document.createElement(
                    "option"
                );

            option.value =
                "a";

            select.appendChild(option);

            return (
                select.options.length ===
                1
            );
        }
    );


    safeProbe(
        category,
        "datalist",
        "input[list] + datalist",
        function () {

            var input =
                document.createElement(
                    "input"
                );

            var datalist =
                document.createElement(
                    "datalist"
                );

            datalist.id =
                "v23-datalist";

            input.setAttribute(
                "list",
                "v23-datalist"
            );

            var option =
                document.createElement(
                    "option"
                );

            option.value =
                "one";

            datalist.appendChild(option);

            return (
                datalist.options.length ===
                1
            );
        }
    );


    safeProbe(
        category,
        "form",
        "form controls",
        function () {

            var form =
                document.createElement(
                    "form"
                );

            var input =
                document.createElement(
                    "input"
                );

            form.appendChild(input);

            return (
                form.elements.length ===
                1
            );
        }
    );


    probeGlobal(
        category,
        "contenteditable",
        "HTMLElement"
    );


    safeProbe(
        category,
        "execCommand",
        "document.execCommand",
        function () {

            return typeof document.execCommand ===
                "function";
        }
    );
}


/*
================================================================
 SVG
================================================================
*/

function testSVG()
{
    var category = "SVG";

    safeProbe(
        category,
        "SVGElement",
        "create SVG tree",
        function () {

            var svg =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "svg"
                );

            var rect =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "rect"
                );

            rect.setAttribute(
                "width",
                "20"
            );

            rect.setAttribute(
                "height",
                "20"
            );

            svg.appendChild(rect);

            return (
                svg.firstChild ===
                rect
            );
        }
    );

            );

    );


    safeProbe(
        category,
        "selection API",
        "select text",
        function () {

            var d =
                document.createElement(
                    "div"
                );

            d.textContent =
                "editable text";

            document.body.appendChild(d);

            var range =
                document.createRange();

            range.selectNodeContents(d);

            var selection =
                window.getSelection();

            if (!selection) {

                d.parentNode.removeChild(d);

                return false;
            }

            selection.removeAllRanges();
            selection.addRange(range);

            var ok =
                selection.rangeCount >= 1;

            selection.removeAllRanges();

            d.parentNode.removeChild(d);

            return ok;
        }
    );
}

function runMatrix()
{
    if (running)
        return;

    running = true;

    results = [];

    tbody.innerHTML = "";

    summary.textContent =
        "Running...";

    setStatus(
        "V23 starting..."
    );


    var index = 0;


    function next()
    {
        if (index >= TESTS.length) {

            running = false;

            updateSummary();

            saveResults();

            setStatus(
                "V23 COMPLETE"
            );

            return;
        }


        setStatus(
            "V23: category " +
            (index + 1) +
            " / " +
            TESTS.length
        );


        try {

            TESTS[index]();

        } catch (e) {

            addResult(
                "Runner",
                "test #" + index,
                "ERROR",
                "category execution"
            );
        }


        index++;

        updateSummary();


        /*
         * Yield between categories.
         *
         * This keeps the capability mapper lightweight
         * on older browser implementations.
         */

        setTimeout(
            next,
            20
        );
    }


    next();
}


/*
================================================================
 RESTORE
================================================================
*/

function restore()
{
    var data =
        loadResults();

    if (!data ||
        !data.results)
        return;

    results =
        data.results;

    tbody.innerHTML = "";

    for (
        var i = 0;
        i < results.length;
        i++
    ) {

        renderResult(
            results[i]
        );
    }

    updateSummary();

    recovery.style.display =
        "block";

    recovery.textContent =
        "Saved V23 matrix restored. " +
        "Entries: " +
        results.length;
}

================================================================

*/

document.getElementById(
    "run"
).onclick =
    runMatrix;


document.getElementById(
    "clear"
).onclick =
    clearResults;


/*
================================================================
 INIT
================================================================
*/

restore();
