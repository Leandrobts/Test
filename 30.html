<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>V22 WebCore State Lifetime Crash Hunter</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #111;
    color: #ddd;
    font-family: Arial, sans-serif;
}

#ui {
    padding: 12px;
    border-bottom: 1px solid #333;
    background: #181818;
}

button {
    padding: 10px 18px;
    margin-right: 8px;
    font-size: 16px;
}

#status {
    margin-top: 8px;
    font-size: 13px;
}

#fixture {
    position: relative;
    width: 100%;
    min-height: 700px;
    overflow: hidden;
}

.v22-host {
    position: relative;
}

.block {
    display: block;
}

.inline {
    display: inline;
}

.inlineblock {
    display: inline-block;
}

.positioned {
    position: relative;
}

.absolute {
    position: absolute;
}

.overflow {
    overflow: auto;
}

.hidden {
    display: none;
}

.clipped {
    overflow: hidden;
}

.sized {
    width: 120px;
    height: 50px;
}

.transform {
    transform: translateZ(0);
}

.box {
    width: 100px;
    height: 40px;
    margin: 3px;
    border: 1px solid #777;
    padding: 3px;
}

.deep {
    position: relative;
}

#shadow-container {
    position: relative;
}

svg {
    display: block;
}

#image-zone {
    position: relative;
}

textarea {
    width: 180px;
    height: 50px;
}
</style>
</head>

<body>

<div id="ui">
    <button id="startButton">START V22</button>
    <button id="stopButton">STOP</button>

    <div id="status">
        V22 idle
    </div>
</div>

<div id="fixture"></div>

<script>

/*
 ================================================================
 V22 WebCore State / Lifetime Crash Hunter
 ================================================================

 Design:

   STATIC FIXTURE
        |
        v
   STATE CREATION
        |
        v
   REENTRANT OPERATION
        |
        v
   MUTATION / TEARDOWN
        |
        v
   CONTINUATION

 No exploit primitives.
 No memory disclosure.
 No arbitrary code execution.
 No JIT/WebGL/WebAudio/IndexedDB/TrustedTypes/Navigation API.

 The JavaScript side only observes whether execution continues.
 ================================================================
*/

(function () {

    "use strict";

    var VERSION = "V22";

    var STORAGE_KEY = "V22_LAST_CHECKPOINT";

    var running = false;
    var stopRequested = false;

    var globalCase = 0;

    var MAX_CASES = 250;

    /*
     * Keep individual mutations small.
     * The objective is lifetime/reentrancy coverage,
     * not resource exhaustion.
     */
    var MAX_MUTATIONS_PER_CASE = 12;

    var fixture;
    var shadowHost;
    var shadowRootRef;

    var statusElement;

    /*
     ================================================================
     * Deterministic PRNG
     * ================================================================
     */

    function PRNG(seed) {

        this.state = seed >>> 0;

        this.next = function () {

            var x = this.state;

            x ^= x << 13;
            x ^= x >>> 17;
            x ^= x << 5;

            this.state = x >>> 0;

            return this.state;
        };

        this.range = function (n) {

            if (n <= 0)
                return 0;

            return this.next() % n;
        };

        this.pick = function (array) {

            if (!array || !array.length)
                return null;

            return array[this.range(array.length)];
        };

        this.bool = function () {
            return (this.next() & 1) !== 0;
        };
    }


    /*
     ================================================================
     * UI
     ================================================================
     */

    function setStatus(text) {

        if (statusElement)
            statusElement.innerHTML = text;
    }


    /*
     ================================================================
     * Checkpoint
     *
     * Written BEFORE an operation.
     * This is intentional: if the browser disappears during the
     * operation, the last checkpoint identifies the candidate.
     * ================================================================
     */

    function checkpoint(data) {

        try {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(data)
            );

        } catch (e) {
            /*
             * localStorage is diagnostic only.
             * Never allow it to affect the test.
             */
        }
    }


    function loadCheckpoint() {

        try {

            var value =
                localStorage.getItem(STORAGE_KEY);

            if (!value)
                return null;

            return JSON.parse(value);

        } catch (e) {

            return null;
        }
    }


    /*
     ================================================================
     * DOM utilities
     * ================================================================
     */

    function safeRemove(node) {

        if (!node)
            return;

        if (node.parentNode)
            node.parentNode.removeChild(node);
    }


    function childrenOf(node) {

        var result = [];

        if (!node)
            return result;

        var children = node.childNodes;

        for (var i = 0; i < children.length; i++)
            result.push(children[i]);

        return result;
    }


    function allElements(root) {

        var result = [];

        if (!root)
            return result;

        if (root.nodeType === 1)
            result.push(root);

        var list = root.getElementsByTagName("*");

        for (var i = 0; i < list.length; i++)
            result.push(list[i]);

        return result;
    }


    function randomElement(prng, root) {

        var list = allElements(root);

        if (!list.length)
            return null;

        return prng.pick(list);
    }


    /*
     ================================================================
     * Fixture construction
     *
     * Important difference from V21:
     *
     * The DOM is NOT generated from scratch for each mutation.
     *
     * We establish WebCore state first.
     * ================================================================
     */

    function buildFixture(seed) {

        fixture.innerHTML = "";

        /*
         ------------------------------------------------------------
         * Main document tree
         * ------------------------------------------------------------
         */

        var root =
            document.createElement("div");

        root.id = "v22-root";
        root.className =
            "v22-host block positioned overflow";

        fixture.appendChild(root);


        /*
         ------------------------------------------------------------
         * Focus fixture
         * ------------------------------------------------------------
         */

        var focusZone =
            document.createElement("div");

        focusZone.id = "focus-zone";
        focusZone.className =
            "block positioned sized";

        var inputA =
            document.createElement("input");

        inputA.id = "focus-input-a";
        inputA.type = "text";

        var inputB =
            document.createElement("input");

        inputB.id = "focus-input-b";
        inputB.type = "search";

        var button =
            document.createElement("button");

        button.id = "focus-button";
        button.innerHTML = "focus";

        focusZone.appendChild(inputA);
        focusZone.appendChild(inputB);
        focusZone.appendChild(button);

        root.appendChild(focusZone);


        /*
         ------------------------------------------------------------
         * Forms fixture
         * ------------------------------------------------------------
         */

        var form =
            document.createElement("form");

        form.id = "form-zone";

        var text =
            document.createElement("input");

        text.id = "form-text";
        text.type = "text";

        var search =
            document.createElement("input");

        search.id = "form-search";
        search.type = "search";

        var email =
            document.createElement("input");

        email.id = "form-email";
        email.type = "email";

        var list =
            document.createElement("input");

        list.id = "form-list";
        list.setAttribute("list", "v22-list");

        var datalist =
            document.createElement("datalist");

        datalist.id = "v22-list";

        for (var d = 0; d < 4; d++) {

            var option =
                document.createElement("option");

            option.value = "value-" + d;

            datalist.appendChild(option);
        }

        form.appendChild(text);
        form.appendChild(search);
        form.appendChild(email);
        form.appendChild(list);
        form.appendChild(datalist);

        root.appendChild(form);


        /*
         ------------------------------------------------------------
         * Shadow DOM fixture
         * ------------------------------------------------------------
         */

        shadowHost =
            document.createElement("div");

        shadowHost.id =
            "shadow-container";

        root.appendChild(shadowHost);

        shadowRootRef = null;

        try {

            if (shadowHost.attachShadow) {

                shadowRootRef =
                    shadowHost.attachShadow({
                        mode: "open"
                    });

                var shadowWrapper =
                    document.createElement("div");

                shadowWrapper.className =
                    "block positioned";

                var slot =
                    document.createElement("slot");

                slot.name = "v22-slot";

                shadowWrapper.appendChild(slot);

                var shadowInner =
                    document.createElement("span");

                shadowInner.className =
                    "box inlineblock";

                shadowInner.innerHTML =
                    "shadow";

                shadowWrapper.appendChild(
                    shadowInner
                );

                shadowRootRef.appendChild(
                    shadowWrapper
                );

                var slotted =
                    document.createElement("span");

                slotted.slot =
                    "v22-slot";

                slotted.innerHTML =
                    "slotted";

                shadowHost.appendChild(
                    slotted
                );
            }

        } catch (e) {
        }


        /*
         ------------------------------------------------------------
         * Range / text fixture
         * ------------------------------------------------------------
         */

        var textZone =
            document.createElement("div");

        textZone.id = "range-zone";

        var textOne =
            document.createTextNode(
                "alpha "
            );

        var spanOne =
            document.createElement("span");

        spanOne.innerHTML =
            "beta";

        var spanTwo =
            document.createElement("span");

        spanTwo.innerHTML =
            "gamma";

        var textTwo =
            document.createTextNode(
                " delta"
            );

        textZone.appendChild(textOne);
        textZone.appendChild(spanOne);
        textZone.appendChild(spanTwo);
        textZone.appendChild(textTwo);

        root.appendChild(textZone);


        /*
         ------------------------------------------------------------
         * Render tree fixture
         * ------------------------------------------------------------
         */

        var renderZone =
            document.createElement("div");

        renderZone.id = "render-zone";

        renderZone.className =
            "block positioned overflow";

        for (var r = 0; r < 8; r++) {

            var box =
                document.createElement("div");

            box.className =
                "box " +
                (r % 2 ?
                    "inlineblock" :
                    "block");

            box.setAttribute(
                "data-index",
                String(r)
            );

            renderZone.appendChild(box);
        }

        root.appendChild(renderZone);


        /*
         ------------------------------------------------------------
         * Deep subtree
         * ------------------------------------------------------------
         */

        var deep =
            document.createElement("div");

        deep.id = "deep-zone";
        deep.className = "deep";

        var current = deep;

        for (var level = 0; level < 7; level++) {

            var child =
                document.createElement("div");

            child.className =
                "box positioned";

            child.setAttribute(
                "data-depth",
                String(level)
            );

            current.appendChild(child);

            current = child;
        }

        root.appendChild(deep);


        /*
         ------------------------------------------------------------
         * SVG fixture
         * ------------------------------------------------------------
         */

        var svg =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "svg"
            );

        svg.setAttribute(
            "width",
            "240"
        );

        svg.setAttribute(
            "height",
            "120"
        );

        svg.id = "svg-zone";

        var group =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "g"
            );

        var rect =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "rect"
            );

        rect.setAttribute("x", "5");
        rect.setAttribute("y", "5");
        rect.setAttribute("width", "80");
        rect.setAttribute("height", "40");

        var circle =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "circle"
            );

        circle.setAttribute("cx", "130");
        circle.setAttribute("cy", "30");
        circle.setAttribute("r", "20");

        group.appendChild(rect);
        group.appendChild(circle);
        svg.appendChild(group);

        root.appendChild(svg);


        /*
         ------------------------------------------------------------
         * Image / picture fixture
         * ------------------------------------------------------------
         */

        var imageZone =
            document.createElement("div");

        imageZone.id =
            "image-zone";

        var picture =
            document.createElement("picture");

        var source =
            document.createElement("source");

        source.setAttribute(
            "media",
            "(min-width: 1px)"
        );

        /*
         * Intentionally invalid/non-network-dependent source.
         * We are interested in lifecycle handling, not network
         * access.
         */

        source.setAttribute(
            "srcset",
            "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
        );

        var img =
            document.createElement("img");

        img.id = "v22-image";

        img.src =
            "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==";

        picture.appendChild(source);
        picture.appendChild(img);

        imageZone.appendChild(picture);

        root.appendChild(imageZone);


        /*
         ------------------------------------------------------------
         * Textarea
         * ------------------------------------------------------------
         */

        var textarea =
            document.createElement("textarea");

        textarea.id =
            "v22-textarea";

        textarea.value =
            "v22 text";

        root.appendChild(textarea);


        /*
         ------------------------------------------------------------
         * Event handlers
         *
         * These are deliberately lightweight.
         * The interesting mutation happens while dispatch is active.
         * ------------------------------------------------------------
         */

        inputA.onclick = function () {

            mutateInputType(
                inputA,
                seed
            );

        };

        inputB.onfocus = function () {

            mutateFocusZone(
                focusZone
            );

        };

        button.onclick = function () {

            mutateFocusZone(
                focusZone
            );

        };

        img.onload = function () {

            mutateImageZone(
                imageZone
            );

        };

        img.onerror = function () {

            mutateImageZone(
                imageZone
            );

        };


        return root;
    }


    /*
     ================================================================
     * Pattern: State Replacement During Active Event Dispatch
     * ================================================================
     */

    function mutateInputType(input, seed) {

        if (!input)
            return;

        try {

            var oldType =
                input.type;

            input.type =
                oldType === "text" ?
                    "search" :
                    "text";

            input.setAttribute(
                "data-v22-transition",
                String(seed)
            );

            /*
             * Force a modest read after state replacement.
             */
            void input.offsetWidth;

        } catch (e) {
        }
    }


    /*
     ================================================================
     * Pattern: Focus -> mutation
     * ================================================================
     */

    function mutateFocusZone(zone) {

        if (!zone)
            return;

        try {

            var list =
                zone.getElementsByTagName(
                    "input"
                );

            if (list.length) {

                var target =
                    list[0];

                target.className =
                    target.className ===
                    "hidden" ?
                    "sized" :
                    "hidden";

                /*
                 * Read immediately after state transition.
                 */
                void target.offsetWidth;
            }

        } catch (e) {
        }
    }


    /*
     ================================================================
     * Pattern: Shadow slot mutation
     * ================================================================
     */

    function mutateShadow(prng) {

        if (!shadowHost)
            return;

        try {

            var children =
                childrenOf(shadowHost);

            if (!children.length)
                return;

            var child =
                prng.pick(children);

            if (!child)
                return;

            /*
             * Change slot assignment.
             */
            if (child.nodeType === 1) {

                if (
                    child.getAttribute("slot")
                    === "v22-slot"
                ) {

                    child.removeAttribute(
                        "slot"
                    );

                } else {

                    child.setAttribute(
                        "slot",
                        "v22-slot"
                    );
                }
            }

        } catch (e) {
        }
    }


    /*
     ================================================================
     * Pattern: Style state transition
     * ================================================================
     */

    function mutateStyle(prng, root) {

        var element =
            randomElement(
                prng,
                root
            );

        if (!element)
            return;

        try {

            var operation =
                prng.range(8);

            if (operation === 0) {

                element.style.display =
                    element.style.display ===
                    "none" ?
                    "block" :
                    "none";

            } else if (operation === 1) {

                element.style.position =
                    element.style.position ===
                    "absolute" ?
                    "relative" :
                    "absolute";

            } else if (operation === 2) {

                element.style.overflow =
                    element.style.overflow ===
                    "hidden" ?
                    "auto" :
                    "hidden";

            } else if (operation === 3) {

                element.style.width =
                    prng.range(180) + 20 + "px";

            } else if (operation === 4) {

                element.style.height =
                    prng.range(100) + 20 + "px";

            } else if (operation === 5) {

                element.className =
                    "box inlineblock";

            } else if (operation === 6) {

                element.className =
                    "box positioned overflow";

            } else {

                element.className =
                    "block";
            }

            /*
             * Layout/style observation.
             */
            void element.offsetWidth;
            void element.offsetHeight;

        } catch (e) {
        }
    }


    /*
     ================================================================
     * Pattern: Renderer / iteration invalidation
     * ================================================================
     */

    function mutateRenderTree(prng, root) {

        var renderZone =
            document.getElementById(
                "render-zone"
            );

        if (!renderZone)
            return;

        try {

            var list =
                renderZone.children;

            if (!list.length)
                return;

            var target =
                list[
                    prng.range(list.length)
                ];

            /*
             * Mutation while style/layout information is active.
             */
            target.style.display =
                target.style.display ===
                "none" ?
                "inline-block" :
                "none";

            void renderZone.offsetWidth;

            /*
             * Reparent one element.
             */
            if (
                target.parentNode ===
                renderZone
            ) {

                renderZone.appendChild(
                    target
                );
            }

        } catch (e) {
        }
    }


    /*
     ================================================================
     * Pattern: Range + text mutation
     * ================================================================
     */

    function mutateRange(prng) {

        var zone =
            document.getElementById(
                "range-zone"
            );

        if (!zone)
            return;

        try {

            var range =
                document.createRange();

            var textNode =
                zone.firstChild;

            if (!textNode)
                return;

            range.setStart(
                textNode,
                0
            );

            range.setEnd(
                textNode,
                Math.min(
                    3,
                    textNode.length
                )
            );

            /*
             * Tree mutation while Range is alive.
             */
            if (prng.bool()) {

                var extra =
                    document.createTextNode(
                        "x"
                    );

                zone.insertBefore(
                    extra,
                    zone.firstChild
                );

            } else {

                var first =
                    zone.firstChild;

                if (first)
                    zone.removeChild(
                        first
                    );
            }

            /*
             * Continue using the Range.
             */
            try {
                range.cloneContents();
            } catch (e2) {
            }

        } catch (e) {
        }
    }


    /*
     ================================================================
     * Pattern: SVG mutation
     * ================================================================
     */

    function mutateSVG(prng) {

        var svg =
            document.getElementById(
                "svg-zone"
            );

        if (!svg)
            return;

        try {

            var elements =
                svg.getElementsByTagName("*");

            if (!elements.length)
                return;

            var target =
                elements[
                    prng.range(
                        elements.length
                    )
                ];

            target.setAttribute(
                "transform",
                "translate(" +
                prng.range(30) +
                "," +
                prng.range(30) +
                ")"
            );

            target.setAttribute(
                "opacity",
                String(
                    (prng.range(10) + 1) /
                    10
                )
            );

            void svg.getBoundingClientRect();

        } catch (e) {
        }
    }


    /*
     ================================================================
     * Pattern: Image lifecycle
     * ================================================================
     */

    function mutateImageZone(zone) {

        if (!zone)
            return;

        try {

            var image =
                document.getElementById(
                    "v22-image"
                );

            if (!image)
                return;

            /*
             * Modify attributes during image lifecycle.
             */
            image.width =
                image.width === 1 ?
                2 :
                1;

            image.height =
                image.height === 1 ?
                2 :
                1;

            image.setAttribute(
                "data-state",
                String(
                    Date.now()
                )
            );

        } catch (e) {
        }
    }


    /*
     ================================================================
     * Pattern: Reparent
     * ================================================================
     */

    function mutateReparent(prng, root) {

        var elements =
            allElements(root);

        if (elements.length < 4)
            return;

        try {

            var a =
                prng.pick(elements);

            var b =
                prng.pick(elements);

            if (!a || !b || a === b)
                return;

            if (
                a === root ||
                b === root
            )
                return;

            /*
             * Avoid obvious ancestor cycles.
             */
            if (
                a.contains &&
                a.contains(b)
            )
                return;

            b.appendChild(a);

        } catch (e) {
        }
    }


    /*
     ================================================================
     * Pattern: remove/reinsert subtree
     * ================================================================
     */

    function mutateDetachAttach(prng, root) {

        var elements =
            allElements(root);

        if (elements.length < 3)
            return;

        try {

            var target =
                prng.pick(elements);

            if (!target || target === root)
                return;

            var parent =
                target.parentNode;

            if (!parent)
                return;

            var next =
                target.nextSibling;

            parent.removeChild(
                target
            );

            /*
             * Immediate reinsertion gives us a
             * detach/reattach transition without
             * uncontrolled resource accumulation.
             */

            if (next && next.parentNode === parent)
                parent.insertBefore(
                    target,
                    next
                );
            else
                parent.appendChild(
                    target
                );

        } catch (e) {
        }
    }


    /*
     ================================================================
     * Pattern: subtree replacement
     * ================================================================
     */

    function mutateReplace(prng, root) {

        var elements =
            allElements(root);

        if (elements.length < 3)
            return;

        try {

            var target =
                prng.pick(elements);

            if (!target ||
                target === root ||
                !target.parentNode)
                return;

            var replacement =
                document.createElement(
                    target.tagName
                );

            replacement.className =
                target.className;

            replacement.setAttribute(
                "data-replacement",
                "v22"
            );

            target.parentNode.replaceChild(
                replacement,
                target
            );

        } catch (e) {
        }
    }


    /*
     ================================================================
     * Pattern: attribute state transition
     * ================================================================
     */

    function mutateAttributes(prng, root) {

        var element =
            randomElement(
                prng,
                root
            );

        if (!element)
            return;

        try {

            var operation =
                prng.range(6);

            if (operation === 0) {

                element.setAttribute(
                    "class",
                    "hidden"
                );

            } else if (operation === 1) {

                element.removeAttribute(
                    "class"
                );

            } else if (operation === 2) {

                element.setAttribute(
                    "data-v22",
                    String(prng.next())
                );

            } else if (operation === 3) {

                element.removeAttribute(
                    "data-v22"
                );

            } else if (operation === 4) {

                element.setAttribute(
                    "tabindex",
                    "0"
                );

            } else {

                element.removeAttribute(
                    "tabindex"
                );
            }

        } catch (e) {
        }
    }


    /*
     ================================================================
     * Pattern: DOM iteration + mutation
     * ================================================================
     */

    function mutateDuringIteration(prng, root) {

        try {

            var list =
                root.getElementsByTagName("*");

            for (
                var i = 0;
                i < list.length;
                i++
            ) {

                var element =
                    list[i];

                if (!element)
                    continue;

                /*
                 * Small mutation inside traversal.
                 */
                if (
                    i ===
                    prng.range(
                        Math.max(
                            1,
                            list.length
                        )
                    )
                ) {

                    element.setAttribute(
                        "data-iter",
                        String(i)
                    );

                    if (
                        element.parentNode &&
                        prng.bool()
                    ) {

                        element.parentNode
                            .appendChild(
                                element
                            );
                    }

                    break;
                }
            }

        } catch (e) {
        }
    }


    /*
     ================================================================
     * Pattern: focus / blur / DOM mutation
     * ================================================================
     */

    function mutateFocusBlur(prng) {

        try {

            var inputs =
                document.querySelectorAll(
                    "#focus-zone input"
                );

            if (!inputs.length)
                return;

            var target =
                inputs[
                    prng.range(
                        inputs.length
                    )
                ];

            target.focus();

            /*
             * Mutation occurs immediately after focus.
             */
            if (prng.bool()) {

                target.className =
                    "hidden";

            } else {

                target.className =
                    "sized";
            }

            target.blur();

        } catch (e) {
        }
    }


    /*
     ================================================================
     * Pattern: form state replacement
     * ================================================================
     */

    function mutateForm(prng) {

        try {

            var form =
                document.getElementById(
                    "form-zone"
                );

            if (!form)
                return;

            var inputs =
                form.getElementsByTagName(
                    "input"
                );

            if (!inputs.length)
                return;

            var target =
                inputs[
                    prng.range(
                        inputs.length
                    )
                ];

            /*
             * The important transition:
             *
             * active element state
             *       ->
             * input type replacement
             */
            var types = [
                "text",
                "search",
                "email",
                "number"
            ];

            target.type =
                types[
                    prng.range(
                        types.length
                    )
                ];

            target.setAttribute(
                "data-type-transition",
                "1"
            );

        } catch (e) {
        }
    }


    /*
     ================================================================
     * Pattern: Document/subtree teardown
     *
     * We do NOT navigate away.
     * Instead we exercise local subtree teardown.
     * ================================================================
     */

    function mutateSubtreeTeardown(prng, root) {

        var candidates = [
            "focus-zone",
            "form-zone",
            "range-zone",
            "render-zone",
            "deep-zone",
            "svg-zone",
            "image-zone"
        ];

        try {

            var id =
                prng.pick(candidates);

            var target =
                document.getElementById(
                    id
                );

            if (!target)
                return;

            var parent =
                target.parentNode;

            if (!parent)
                return;

            /*
             * Remove and immediately replace with
             * a fresh equivalent container.
             */
            parent.removeChild(
                target
            );

            var replacement =
                document.createElement(
                    "div"
                );

            replacement.id = id;

            replacement.className =
                "block positioned";

            parent.appendChild(
                replacement
            );

        } catch (e) {
        }
    }


    /*
     ================================================================
     * Compound patterns
     * ================================================================
     */

    function patternFocus(prng, root) {

        mutateFocusBlur(prng);
        mutateStyle(prng, root);
    }


    function patternForm(prng, root) {

        mutateForm(prng);
        mutateAttributes(prng, root);
    }


    function patternShadow(prng, root) {

        mutateShadow(prng);
        mutateStyle(prng, root);
    }


    function patternRender(prng, root) {

        mutateRenderTree(prng, root);
        mutateStyle(prng, root);
    }


    function patternRange(prng, root) {

        mutateRange(prng);
        mutateAttributes(prng, root);
    }


    function patternLifetime(prng, root) {

        mutateDetachAttach(prng, root);
        mutateReparent(prng, root);
    }


    function patternEventReplacement(prng, root) {

        var input =
            document.getElementById(
                "focus-input-a"
            );

        if (!input)
            return;

        try {

            input.onclick =
                function () {

                    mutateInputType(
                        input,
                        prng.next()
                    );

                    mutateStyle(
                        prng,
                        root
                    );
                };

            input.click();

        } catch (e) {
        }
    }


    /*
     ================================================================
     * Pattern table
     * ================================================================
     */

    var PATTERNS = [

        {
            name:
                "FOCUS_BLUR_MUTATION",

            run:
                patternFocus
        },

        {
            name:
                "FORM_STATE_REPLACEMENT",

            run:
                patternForm
        },

        {
            name:
                "SHADOW_SLOT_MUTATION",

            run:
                patternShadow
        },

        {
            name:
                "RENDER_STYLE_INVALIDATION",

            run:
                patternRender
        },

        {
            name:
                "RANGE_TEXT_MUTATION",

            run:
                patternRange
        },

        {
            name:
                "LIFETIME_REPARENT",

            run:
                patternLifetime
        },

        {
            name:
                "EVENT_STATE_REPLACEMENT",

            run:
                patternEventReplacement
        },

        {
            name:
                "SVG_RENDERER_MUTATION",

            run:
                function (
                    prng,
                    root
                ) {

                    mutateSVG(prng);
                    mutateStyle(
                        prng,
                        root
                    );
                }
        },

        {
            name:
                "IMAGE_LIFETIME",

            run:
                function (
                    prng,
                    root
                ) {

                    mutateImageZone(
                        document.getElementById(
                            "image-zone"
                        )
                    );

                    mutateAttributes(
                        prng,
                        root
                    );
                }
        },

        {
            name:
                "DOM_ITERATION_MUTATION",

            run:
                function (
                    prng,
                    root
                ) {

                    mutateDuringIteration(
                        prng,
                        root
                    );
                }
        },

        {
            name:
                "SUBTREE_TEARDOWN",

            run:
                function (
                    prng,
                    root
                ) {

                    mutateSubtreeTeardown(
                        prng,
                        root
                    );
                }
        },

        {
            name:
                "STYLE_ATTRIBUTE_TRANSITION",

            run:
                function (
                    prng,
                    root
                ) {

                    mutateStyle(
                        prng,
                        root
                    );

                    mutateAttributes(
                        prng,
                        root
                    );
                }
        }
    ];


    /*
     ================================================================
     * Case execution
     * ================================================================
     */

    function runCase(caseId, seed) {

        var prng =
            new PRNG(seed);

        /*
         * Rebuild the state before every case.
         *
         * This prevents one pathological case from contaminating
         * the next case.
         */
        var root =
            buildFixture(seed);

        var pattern =
            prng.pick(
                PATTERNS
            );

        var sequence = [];

        var mutationCount =
            2 +
            prng.range(
                MAX_MUTATIONS_PER_CASE - 1
            );

        for (
            var i = 0;
            i < mutationCount;
            i++
        ) {

            if (stopRequested)
                break;

            /*
             * Occasionally switch to another pattern.
             * This creates compound state transitions.
             */
            var selected =
                pattern;

            if (
                i > 0 &&
                prng.range(4) === 0
            ) {

                selected =
                    prng.pick(
                        PATTERNS
                    );
            }

            sequence.push(
                selected.name
            );

            /*
             * CHECKPOINT BEFORE OPERATION.
             */
            checkpoint({

                version:
                    VERSION,

                caseId:
                    caseId,

                seed:
                    seed,

                pattern:
                    pattern.name,

                activePattern:
                    selected.name,

                sequence:
                    sequence.slice(),

                index:
                    i,

                operation:
                    "BEFORE_" +
                    selected.name,

                timestamp:
                    Date.now()
            });

            /*
             * Execute pattern.
             */
            try {

                selected.run(
                    prng,
                    root
                );

            } catch (e) {
                /*
                 * JS exceptions are not the target.
                 */
            }

            /*
             * Lightweight continuation.
             *
             * If WebCore survived the mutation, we deliberately
             * continue touching the fixture.
             */
            try {

                if (root) {

                    void root.offsetWidth;

                    void root.offsetHeight;

                    root.getBoundingClientRect();

                }

            } catch (e2) {
            }
        }

        /*
         * Final checkpoint.
         */
        checkpoint({

            version:
                VERSION,

            caseId:
                caseId,

            seed:
                seed,

            pattern:
                pattern.name,

            sequence:
                sequence,

            index:
                mutationCount,

            operation:
                "CASE_COMPLETE",

            timestamp:
                Date.now()
        });
    }


    /*
     ================================================================
     * Main loop
     * ================================================================
     */

    function start() {

        if (running)
            return;

        running = true;
        stopRequested = false;

        globalCase = 0;

        setStatus(
            "V22 running..."
        );

        runNext();
    }


    function runNext() {

        if (!running)
            return;

        if (stopRequested) {

            running = false;

            setStatus(
                "V22 stopped"
            );

            return;
        }

        if (
            globalCase >=
            MAX_CASES
        ) {

            running = false;

            setStatus(
                "V22 completed"
            );

            return;
        }

        globalCase++;

        /*
         * Deterministic but changing seed.
         */
        var seed =
            (
                0x9E3779B9 ^
                (
                    globalCase *
                    0x45D9F3B
                )
            ) >>> 0;

        /*
         * Update UI only between cases.
         */
        setStatus(
            "V22 case " +
            globalCase +
            " / " +
            MAX_CASES
        );

        /*
         * Use a timer boundary to introduce a real event-loop
         * transition between cases.
         */
        setTimeout(
            function () {

                if (!running)
                    return;

                runCase(
                    globalCase,
                    seed
                );

                setTimeout(
                    runNext,
                    0
                );

            },
            0
        );
    }


    function stop() {

        stopRequested = true;

        running = false;

        setStatus(
            "V22 stopped"
        );
    }


    /*
     ================================================================
     * Recovery information
     * ================================================================
     */

    function showRecovery() {

        var previous =
            loadCheckpoint();

        if (!previous)
            return;

        /*
         * Do not automatically display the full checkpoint.
         * It remains available in localStorage for diagnosis.
         */
    }


    /*
     ================================================================
     * Initialization
     * ================================================================
     */

    function init() {

        fixture =
            document.getElementById(
                "fixture"
            );

        statusElement =
            document.getElementById(
                "status"
            );

        document.getElementById(
            "startButton"
        ).onclick =
            start;

        document.getElementById(
            "stopButton"
        ).onclick =
            stop;

        showRecovery();

        setStatus(
            "V22 ready"
        );
    }


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            init
        );

    } else {

        init();
    }

})();

</script>

</body>
