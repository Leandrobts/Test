
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 WebKit Silent State Transition Crash Hunter V28</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#arena {
    position: absolute;
    left: -10000px;
    top: -10000px;
    width: 1600px;
    min-height: 1600px;
}

#style-host {
    display: none;
}
</style>
</head>

<body>

<div id="style-host"></div>
<div id="arena"></div>

<script>
(function () {
"use strict";

/*
 * ============================================================
 * PS4 WEBKIT SILENT STATE-TRANSITION CRASH HUNTER
 * V28
 *
 * SILENT MODE
 *
 * Persistência:
 *   localStorage["ps4_uaf_last_candidate"]
 *
 * O registro é gravado ANTES de cada candidato.
 * Se o navegador/processo cair, o último candidato permanece.
 * ============================================================
 */

var arena = document.getElementById("arena");
var styleHost = document.getElementById("style-host");

var running = true;
var candidateCounter = 0;

/* ============================================================
 * CONFIGURAÇÃO
 * ============================================================
 */

var CONFIG = {
    delay: 20,
    maxNodes: 180,
    burstMin: 12,
    burstMax: 40,
    cleanupDelay: 10
};

/* ============================================================
 * PRNG
 * ============================================================
 */

var seed = (Date.now() ^ 0x5A17C0DE) >>> 0;

function rnd32() {
    seed = ((seed * 1664525) + 1013904223) >>> 0;
    return seed;
}

function rnd(min, max) {
    return min + (rnd32() % (max - min + 1));
}

function pick(array) {
    if (!array.length)
        return null;
    return array[rnd(0, array.length - 1)];
}

/* ============================================================
 * PERSISTÊNCIA
 * ============================================================
 */

function saveCandidate(family, variant, operations) {
    candidateCounter++;

    var data = {
        id: candidateCounter,
        seed: seed >>> 0,
        family: family,
        variant: variant,
        operations: operations,
        time: Date.now()
    };

    try {
        localStorage.setItem(
            "ps4_uaf_last_candidate",
            JSON.stringify(data)
        );
    } catch (e) {
    }
}

/* ============================================================
 * CLEANUP
 * ============================================================
 */

function cleanup() {
    while (arena.firstChild)
        arena.removeChild(arena.firstChild);

    while (styleHost.firstChild)
        styleHost.removeChild(styleHost.firstChild);
}

/* ============================================================
 * STYLE / LAYOUT FLUSH
 * ============================================================
 */

function flushStyle(node) {
    if (!node)
        return;

    try {
        getComputedStyle(node).display;
        getComputedStyle(node).position;
        getComputedStyle(node).fontSize;
        getComputedStyle(node).direction;
        getComputedStyle(node).width;
    } catch (e) {
    }
}

function flushLayout(node) {
    if (!node)
        return;

    try {
        node.offsetWidth;
        node.offsetHeight;
        node.clientWidth;
        node.clientHeight;
        node.scrollWidth;
        node.scrollHeight;
        node.getBoundingClientRect();
    } catch (e) {
    }
}

function flush(node) {
    flushStyle(node);
    flushLayout(node);
}

/* ============================================================
 * DYNAMIC STYLE
 * ============================================================
 */

function installStyle(id) {
    var style = document.createElement("style");

    style.textContent =
        "." + id + "_root{" +
            "display:block;" +
            "position:relative;" +
            "width:900px;" +
            "min-height:400px;" +
            "font-size:13px;" +
            "line-height:17px;" +
        "}" +

        "." + id + "_block{" +
            "display:block;" +
            "position:relative;" +
            "min-height:4px;" +
        "}" +

        "." + id + "_inline{" +
            "display:inline;" +
        "}" +

        "." + id + "_relative{" +
            "position:relative;" +
            "left:1px;" +
        "}" +

        "." + id + "_absolute{" +
            "position:absolute;" +
            "left:3px;" +
            "top:2px;" +
        "}" +

        "." + id + "_float{" +
            "float:left;" +
            "width:10px;" +
            "height:10px;" +
        "}" +

        "." + id + "_rtl{" +
            "direction:rtl;" +
        "}" +

        "." + id + "_big{" +
            "font-size:27px;" +
            "line-height:33px;" +
        "}" +

        "." + id + "_hidden{" +
            "display:none;" +
        "}" +

        "." + id + "_flex{" +
            "display:flex;" +
        "}";

    styleHost.appendChild(style);
}

/* ============================================================
 * COMPLEX TREE BUILDER
 * ============================================================
 */

function buildTree(id) {
    var root = document.createElement("div");

    root.className = id + "_root";

    var queue = [{
        node: root,
        depth: 0
    }];

    var created = 1;

    while (queue.length && created < CONFIG.maxNodes) {
        var entry = queue.shift();

        if (entry.depth > 4)
            continue;

        var width = rnd(2, 6);

        for (var i = 0; i < width; i++) {
            if (created >= CONFIG.maxNodes)
                break;

            var type = rnd(0, 9);
            var node;

            switch (type) {
            case 0:
                node = document.createElement("div");
                node.className = id + "_block";
                break;

            case 1:
                node = document.createElement("span");
                node.className = id + "_inline";
                break;

            case 2:
                node = document.createElement("b");
                node.className = id + "_relative";
                break;

            case 3:
                node = document.createElement("i");
                node.className = id + "_inline";
                break;

            case 4:
                node = document.createElement("em");
                node.className = id + "_rtl";
                break;

            case 5:
                node = document.createElement("strong");
                node.className = id + "_big";
                break;

            case 6:
                node = document.createElement("span");
                node.className = id + "_float";
                break;

            case 7:
                node = document.createElement("p");
                node.className = id + "_block";
                break;

            case 8:
                node = document.createElement("section");
                node.className = id + "_block";
                break;

            default:
                node = document.createElement("article");
                node.className = id + "_relative";
                break;
            }

            node.setAttribute("data-n", created);
            node.appendChild(
                document.createTextNode("n" + created + " ")
            );

            entry.node.appendChild(node);

            if (rnd(0, 100) < 70) {
                queue.push({
                    node: node,
                    depth: entry.depth + 1
                });
            }

            created++;
        }
    }

    return root;
}

function elements(root) {
    var result = [];

    try {
        var list = root.getElementsByTagName("*");

        for (var i = 0; i < list.length; i++)
            result.push(list[i]);
    } catch (e) {
    }

    return result;
}

/* ============================================================
 * MUTATION PRIMITIVES
 *
 * Cada burst escolhe operações diferentes.
 * ============================================================
 */

function opClass(root, id) {
    var n = pick(elements(root));
    if (!n)
        return;

    n.className = pick([
        id + "_block",
        id + "_inline",
        id + "_relative",
        id + "_absolute",
        id + "_float",
        id + "_rtl",
        id + "_big",
        id + "_hidden",
        id + "_flex"
    ]);
}

function opAttribute(root) {
    var n = pick(elements(root));
    if (!n)
        return;

    n.setAttribute(
        "data-m" + rnd(0, 8),
        String(rnd32())
    );
}

function opStyle(root) {
    var n = pick(elements(root));
    if (!n)
        return;

    switch (rnd(0, 8)) {
    case 0:
        n.style.display = "block";
        break;
    case 1:
        n.style.display = "inline";
        break;
    case 2:
        n.style.display = "none";
        break;
    case 3:
        n.style.position = "relative";
        break;
    case 4:
        n.style.position = "static";
        break;
    case 5:
        n.style.fontSize = rnd(8, 36) + "px";
        break;
    case 6:
        n.style.direction = rnd(0, 1) ? "rtl" : "ltr";
        break;
    case 7:
        n.style.left = rnd(-20, 20) + "px";
        break;
    default:
        n.style.lineHeight = rnd(10, 42) + "px";
        break;
    }
}

function opAppend(root, id) {
    var parent = pick(elements(root));
    if (!parent)
        parent = root;

    var child = document.createElement(
        rnd(0, 1) ? "span" : "div"
    );

    child.className = pick([
        id + "_block",
        id + "_inline",
        id + "_relative",
        id + "_big"
    ]);

    child.appendChild(
        document.createTextNode("x" + rnd32())
    );

    try {
        parent.appendChild(child);
    } catch (e) {
    }
}

function opRemove(root) {
    var all = elements(root);
    var n = pick(all);

    if (!n || n === root || !n.parentNode)
        return;

    try {
        n.parentNode.removeChild(n);
    } catch (e) {
    }
}

function opMove(root) {
    var all = elements(root);

    var node = pick(all);
    var parent = pick(all);

    if (!node || !parent)
        return;

    if (node === parent)
        return;

    try {
        parent.appendChild(node);
    } catch (e) {
    }
}

function opReplace(root, id) {
    var all = elements(root);
    var oldNode = pick(all);

    if (!oldNode || !oldNode.parentNode)
        return;

    var replacement = document.createElement("div");

    replacement.className = id + "_block";

    var amount = rnd(2, 7);

    for (var i = 0; i < amount; i++) {
        var s = document.createElement("span");

        s.className = id + "_inline";
        s.appendChild(
            document.createTextNode("r" + i)
        );

        replacement.appendChild(s);
    }

    try {
        oldNode.parentNode.replaceChild(
            replacement,
            oldNode
        );
    } catch (e) {
    }
}

function opInnerHTML(root, id) {
    var n = pick(elements(root));
    if (!n)
        return;

    try {
        n.innerHTML =
            "<div class='" + id + "_block'>" +
                "<span class='" + id + "_inline'>a</span>" +
                "<b class='" + id + "_relative'>b</b>" +
                "<i class='" + id + "_rtl'>c</i>" +
            "</div>";
    } catch (e) {
    }
}

function opText(root) {
    var all = elements(root);
    var n = pick(all);

    if (!n)
        return;

    try {
        n.appendChild(
            document.createTextNode(
                " t" + rnd32()
            )
        );
    } catch (e) {
    }
}

/* ============================================================
 * MUTATION BURST
 * ============================================================
 */

function mutationBurst(root, id, count) {
    var operations = [
        function () { opClass(root, id); },
        function () { opAttribute(root); },
        function () { opStyle(root); },
        function () { opAppend(root, id); },
        function () { opRemove(root); },
        function () { opMove(root); },
        function () { opReplace(root, id); },
        function () { opInnerHTML(root, id); },
        function () { opText(root); }
    ];

    count = count || rnd(
        CONFIG.burstMin,
        CONFIG.burstMax
    );

    for (var i = 0; i < count; i++) {
        pick(operations)();

        if ((i % rnd(3, 7)) === 0)
            flush(root);
    }

    flush(root);
}

/* ============================================================
 * FAMILY A
 * EVENT DISPATCH → REENTRANCY → MUTATION BURSTS
 * ============================================================
 */

function familyEvent(id, variant) {
    var root = buildTree(id);

    arena.appendChild(root);

    flush(root);
    mutationBurst(root, id, rnd(15, 35));

    var target = pick(elements(root)) || root;

    function nestedHandler() {
        mutationBurst(root, id, rnd(10, 30));

        if (variant % 2 === 0) {
            try {
                root.innerHTML =
                    "<div class='" + id + "_block'></div>";
            } catch (e) {
            }
        } else {
            opRemove(root);
            opReplace(root, id);
        }

        flush(root);
    }

    root.addEventListener(
        "nested-" + id,
        nestedHandler,
        false
    );

    target.addEventListener(
        "trigger-" + id,
        function () {
            mutationBurst(root, id, rnd(15, 40));

            var ev = document.createEvent("Event");
            ev.initEvent(
                "nested-" + id,
                true,
                false
            );

            root.dispatchEvent(ev);

            mutationBurst(root, id, rnd(8, 25));

            flush(root);
        },
        false
    );

    var event = document.createEvent("Event");

    event.initEvent(
        "trigger-" + id,
        true,
        false
    );

    target.dispatchEvent(event);
}

/* ============================================================
 * FAMILY B
 * MUTATION OBSERVER → SECONDARY TRANSITION
 * ============================================================
 */

function familyObserver(id, variant) {
    if (!window.MutationObserver)
        return;

    var root = buildTree(id);

    arena.appendChild(root);

    flush(root);

    var observer = new MutationObserver(function () {
        mutationBurst(root, id, rnd(12, 32));

        if (variant % 2 === 0) {
            while (root.firstChild)
                root.removeChild(root.firstChild);
        } else {
            opInnerHTML(root, id);
            mutationBurst(root, id, rnd(8, 22));
        }

        flush(root);
    });

    observer.observe(root, {
        childList: true,
        subtree: true,
        attributes: true,
        characterData: true
    });

    mutationBurst(root, id, rnd(20, 45));

    observer.disconnect();
}

/* ============================================================
 * FAMILY C
 * SHADOW TREE TRANSITIONS
 * ============================================================
 */

function familyShadow(id, variant) {
    if (!document.createElement("div").attachShadow)
        return;

    var host = document.createElement("div");

    host.className = id + "_root";

    arena.appendChild(host);

    var shadow = host.attachShadow({
        mode: "open"
    });

    var internal = buildTree(id);

    shadow.appendChild(internal);

    for (var i = 0; i < 12; i++) {
        var light = document.createElement("span");

        light.className = id + "_inline";
        light.textContent = "L" + i;

        host.appendChild(light);
    }

    flush(host);

    mutationBurst(internal, id, rnd(20, 45));

    if (variant % 2 === 0) {
        while (host.firstChild)
            host.removeChild(host.firstChild);

        mutationBurst(internal, id, rnd(8, 20));
    } else {
        host.innerHTML = "";
        mutationBurst(internal, id, rnd(8, 20));
    }

    flush(host);
}

/* ============================================================
 * FAMILY D
 * STYLE INVALIDATION / STRUCTURAL REPLACEMENT
 * ============================================================
 */

function familyStyleLayout(id, variant) {
    var root = buildTree(id);

    arena.appendChild(root);

    for (var phase = 0; phase < 5; phase++) {
        mutationBurst(root, id, rnd(15, 38));

        flush(root);

        if (variant % 3 === 0) {
            opReplace(root, id);
        } else if (variant % 3 === 1) {
            opMove(root);
            opRemove(root);
            opAppend(root, id);
        } else {
            opInnerHTML(root, id);
        }

        flush(root);
    }
}

/* ============================================================
 * FAMILY E
 * RANGE / SELECTION DURING STRUCTURAL TRANSITIONS
 * ============================================================
 */

function familyRange(id, variant) {
    var root = buildTree(id);

    arena.appendChild(root);

    flush(root);

    var all = elements(root);

    if (all.length < 3)
        return;

    var range = document.createRange();

    try {
        range.setStartBefore(all[0]);
        range.setEndAfter(all[all.length - 1]);
    } catch (e) {
        try {
            range.selectNodeContents(root);
        } catch (e2) {
        }
    }

    mutationBurst(root, id, rnd(20, 42));

    if (variant % 2 === 0) {
        root.innerHTML =
            "<div class='" + id + "_block'>" +
            "<span>a</span><span>b</span>" +
            "</div>";
    } else {
        for (var i = 0; i < 6; i++)
            opRemove(root);
    }

    mutationBurst(root, id, rnd(10, 30));

    try {
        range.toString();
    } catch (e3) {
    }

    flush(root);
}

/* ============================================================
 * FAMILY F
 * FORMS STRUCTURAL TRANSITIONS
 * ============================================================
 */

function familyForms(id, variant) {
    var root = buildTree(id);

    var form = document.createElement("form");
    var input = document.createElement("input");
    var datalist = document.createElement("datalist");

    var listId = "dl_" + id;

    datalist.id = listId;

    input.setAttribute("list", listId);
    input.type = "text";

    for (var i = 0; i < 16; i++) {
        var option = document.createElement("option");
        option.value = "v" + i;
        datalist.appendChild(option);
    }

    form.appendChild(input);
    form.appendChild(datalist);

    root.appendChild(form);

    arena.appendChild(root);

    flush(root);

    input.addEventListener("focus", function () {
        mutationBurst(root, id, rnd(15, 35));

        try {
            input.type = pick([
                "text",
                "search",
                "number",
                "button",
                "checkbox"
            ]);
        } catch (e) {
        }

        mutationBurst(root, id, rnd(10, 28));

        if (variant % 2 === 0) {
            try {
                form.innerHTML =
                    "<input type='text'>" +
                    "<input type='checkbox'>";
            } catch (e2) {
            }
        } else if (form.parentNode) {
            form.parentNode.removeChild(form);
        }

        flush(root);
    });

    try {
        input.focus();
    } catch (e3) {
    }

    mutationBurst(root, id, rnd(10, 30));

    flush(root);
}

/* ============================================================
 * FAMILY G
 * SVG TREE MUTATION
 * ============================================================
 */

function familySVG(id, variant) {
    var ns = "http://www.w3.org/2000/svg";

    var svg = document.createElementNS(ns, "svg");

    svg.setAttribute("width", "800");
    svg.setAttribute("height", "400");

    for (var i = 0; i < 60; i++) {
        var group = document.createElementNS(ns, "g");
        var rect = document.createElementNS(ns, "rect");

        rect.setAttribute("x", String(i * 3));
        rect.setAttribute("y", String(i));
        rect.setAttribute("width", String(10 + (i % 20)));
        rect.setAttribute("height", String(10 + (i % 15)));

        group.appendChild(rect);
        svg.appendChild(group);
    }

    arena.appendChild(svg);

    flush(svg);

    for (var phase = 0; phase < 4; phase++) {
        var rects = svg.getElementsByTagName("rect");

        for (var j = 0; j < rects.length; j++) {
            if ((j + phase) % 3 === 0) {
                rects[j].setAttribute(
                    "width",
                    String(rnd(1, 80))
                );
            }

            if ((j + phase) % 5 === 0) {
                rects[j].setAttribute(
                    "transform",
                    "translate(" +
                    rnd(-10, 10) + "," +
                    rnd(-10, 10) + ")"
                );
            }
        }

        flush(svg);

        if (variant % 2 === 0) {
            var child = svg.firstChild;

            if (child)
                svg.removeChild(child);
        } else {
            var g = document.createElementNS(ns, "g");
            svg.appendChild(g);
        }
    }

    flush(svg);
}

/* ============================================================
 * FAMILY H
 * ASYNC CALLBACK + TEARDOWN
 * ============================================================
 */

function familyAsync(id, variant) {
    var root = buildTree(id);

    arena.appendChild(root);

    flush(root);

    mutationBurst(root, id, rnd(20, 40));

    var callback = function () {
        mutationBurst(root, id, rnd(15, 40));

        if (variant % 2 === 0) {
            root.innerHTML =
                "<div class='" + id + "_block'>" +
                "<span>x</span>" +
                "<span>y</span>" +
                "</div>";

            mutationBurst(root, id, rnd(8, 22));
        } else {
            if (root.parentNode)
                root.parentNode.removeChild(root);
        }

        flush(root);
    };

    if (window.requestAnimationFrame) {
        requestAnimationFrame(callback);
    } else if (window.webkitRequestAnimationFrame) {
        window.webkitRequestAnimationFrame(callback);
    } else {
        setTimeout(callback, 0);
    }

    mutationBurst(root, id, rnd(12, 35));

    flush(root);
}

/* ============================================================
 * FAMILY I
 * CUSTOM ELEMENT CONSTRUCTION / REPARENTING
 *
 * Executado somente quando Custom Elements existe.
 * ============================================================
 */

function familyCustomElement(id, variant) {
    if (!window.customElements || !window.customElements.define)
        return;

    var tag = "x-ps4-" + id.toLowerCase();

    try {
        function XPS4() {
            return Reflect.construct(HTMLElement, [], XPS4);
        }

        Object.setPrototypeOf(
            XPS4.prototype,
            HTMLElement.prototype
        );

        Object.setPrototypeOf(
            XPS4,
            HTMLElement
        );

        XPS4.prototype.connectedCallback = function () {
            var parent = this.parentNode;

            if (parent && variant % 2 === 0) {
                try {
                    parent.removeChild(this);
                    arena.appendChild(this);
                } catch (e) {
                }
            }
        };

        customElements.define(tag, XPS4);
    } catch (e) {
        return;
    }

    var root = buildTree(id);

    arena.appendChild(root);

    flush(root);

    var element;

    try {
        element = document.createElement(tag);
        root.appendChild(element);
    } catch (e2) {
        return;
    }

    mutationBurst(root, id, rnd(20, 40));

    flush(root);
}

/* ============================================================
 * CANDIDATE MATRIX
 * ============================================================
 */

var families = [
    {
        name: "event-reentrancy",
        fn: familyEvent
    },
    {
        name: "mutation-observer",
        fn: familyObserver
    },
    {
        name: "shadow-transition",
        fn: familyShadow
    },
    {
        name: "style-layout-transition",
        fn: familyStyleLayout
    },
    {
        name: "range-structural-transition",
        fn: familyRange
    },
    {
        name: "forms-lifecycle",
        fn: familyForms
    },
    {
        name: "svg-tree-transition",
        fn: familySVG
    },
    {
        name: "async-teardown",
        fn: familyAsync
    },
    {
        name: "custom-element-transition",
        fn: familyCustomElement
    }
];

/* ============================================================
 * MAIN LOOP
 * ============================================================
 */

function runCandidate() {
    if (!running)
        return;

    cleanup();

    var family = pick(families);
    var variant = rnd(0, 11);

    /*
     * IMPORTANTE:
     * Persistir antes de executar.
     */
    saveCandidate(
        family.name,
        variant,
        "state-transition-burst"
    );

    var id =
        "c" +
        candidateCounter +
        "_" +
        (seed >>> 0).toString(16);

    try {
        installStyle(id);

        family.fn(id, variant);
    } catch (e) {
        /*
         * Intencionalmente silencioso.
         * JavaScript exceptions não são relevantes
         * para o objetivo do crash hunter.
         */
    }

    setTimeout(function () {
        cleanup();

        setTimeout(
            runCandidate,
            CONFIG.delay
        );
    }, CONFIG.cleanupDelay);
}

/* ============================================================
 * START
 * ============================================================
 */

setTimeout(runCandidate, 100);

})();
</script>
