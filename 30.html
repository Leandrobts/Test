/* ============================================================
 * DETERMINISTIC PRNG

var seed = 0x13572468;

function random32() {

    seed =

            1013904223

}


function randomRange(min, max) {

    return min +

/* ============================================================
 * COMPLEX DOM BUILDER
 *
 * Aqui a diferença principal para v1:
 * vários elementos reais são inseridos antes da mutação.
 * ============================================================
 */

function buildComplexTree(id, depth, width) {

    var root = document.createElement("div");

    root.className = id + "-root";

    root.setAttribute("data-root", id);

    var stack = [];

    stack.push({
        node: root,
        level: 0
    });

    var total = 0;

    while (stack.length) {

        var entry = stack.shift();

        if (entry.level >= depth)
            continue;

        for (var i = 0; i < width; i++) {

            var child;

            var selector =
                (i + entry.level + total) % 6;

            if (selector === 0) {

                child = document.createElement("div");
                child.className =
                    id + "-block";

            } else if (selector === 1) {

                child = document.createElement("span");
                child.className =
                    id + "-inline";

            } else if (selector === 2) {

                child = document.createElement("span");
                child.className =
                    id + "-float";

            } else if (selector === 3) {

                child = document.createElement("b");
                child.className =
                    id + "-inline";

            } else if (selector === 4) {

                child = document.createElement("i");
                child.className =
                    id + "-relative";

            } else {

                child = document.createElement("span");
                child.className =
                    id + "-inline";
            }

            child.setAttribute(
                "data-node",
                total
            );

            child.appendChild(
                document.createTextNode(
                    "N" + total + " "
                )
            );

            entry.node.appendChild(child);

            total++;

            if (
                entry.level + 1 < depth &&
                total < 120
            ) {

                stack.push({
                    node: child,
                    level: entry.level + 1
                });

            }

        }

    }

    return root;

}


/* ============================================================

    var iterations =
        Math.min(
            randomRange(8, 22),
            count

    for (var i = 0; i < iterations; i++) {

            nodes[
                randomRange(
                    0,
                    nodes.length - 1

        if (!node)
            continue;

        switch (i % 7) {

            case 0:

                break;

            case 1:
                node.className =
                    id + "-rtl";

            case 2:

            case 6:

}

 * → geometry/style
 * → subtree mutation
 * → detach
 * ============================================================
 */

function testSVGVariant(variant) {

    var ns =
        "http://www.w3.org/2000/svg";

    var svg =
        document.createElementNS(
            ns,
            "svg"
        );

    svg.setAttribute(
        "width",
        "300"
    );

    svg.setAttribute(
        "height",
        "200"
    );

    for (
        var i = 0;
        i < 30;
        i++
    ) {

        var group =
            document.createElementNS(
                ns,
                "g"
            );

        var rect =
            document.createElementNS(
                ns,
                "rect"
            );

        rect.setAttribute(
            "x",
            i * 2
        );

        rect.setAttribute(
            "y",
            i
        );

        rect.setAttribute(
            "width",
            10 + (i % 10)
        );

        rect.setAttribute(
            "height",
            8 + (i % 7)
        );

        group.appendChild(rect);

        svg.appendChild(group);

    }

    arena.appendChild(svg);

    forceStyleAndLayout(svg);

    var rects =
        svg.getElementsByTagName("rect");

    for (
        var r = 0;
        r < rects.length;
        r++
    ) {

        if (
            r % 4 === 0
        ) {

            rects[r].setAttribute(
                "width",
                20 + r
            );

        }

        if (
            r % 6 === 0
        ) {

            rects[r].setAttribute(
                "transform",
                "translate(" +
                r +
                ",1)"
            );

        }

    }

    forceStyleAndLayout(svg);

    if (
        variant % 2 === 0
    ) {

        while (
            svg.firstChild
        ) {

            svg.removeChild(
                svg.firstChild
            );

        }

    } else {

        if (
            svg.parentNode
        ) {

            svg.parentNode.removeChild(svg);

        }

    }

    forceStyleAndLayout(svg);

}


/* ============================================================
 * TEST FAMILY 10
 *
 * FORMS
 * → focus/event
 * → type mutation
 * → subtree mutation
 *
 * Não depende de internals.
 * ============================================================
 */

function testFormsVariant(variant) {

    var id = "form" + variant;

    installDynamicStyleSheet(id);

    var root =
        buildComplexTree(
            id,
            2,
            4
        );

    var form =
        document.createElement("form");

    var input =
        document.createElement("input");

    input.type =
        variant % 2 ?
        "text" :
        "search";

    input.value =
        "PS4";

    var list =
        document.createElement("datalist");

    var listId =
        "ps4-list-" + variant;

    list.id = listId;

    input.setAttribute(
        "list",
        listId
    );

    for (
        var i = 0;
        i < 12;
        i++
    ) {

        var option =
            document.createElement("option");

        option.value =
            "value-" + i;

        list.appendChild(option);

    }

    form.appendChild(input);
    form.appendChild(list);

    root.appendChild(form);

    arena.appendChild(root);

    forceStyleAndLayout(root);

    input.addEventListener(
        "focus",
        function() {

            mutateTree(root, id);

            forceStyleAndLayout(root);

        },
        false
    );

    try {
        input.focus();
    } catch (e) {
    }

    /*
     * Mudança estrutural de estado do form control.
     */

    if (
        variant % 3 === 0
    ) {

        input.type =
            "number";

    } else if (
        variant % 3 === 1
    ) {

        input.type =
            "button";

    } else {

        input.type =
            "text";

    }

    forceStyleAndLayout(root);

    if (
        variant % 2 === 0
    ) {

        form.innerHTML =
            "<input type='text'>" +
            "<input type='checkbox'>";

    } else {

        if (
            form.parentNode
        ) {

            form.parentNode.removeChild(form);

        }

    }

    forceStyleAndLayout(root);

}


/* ============================================================
 * TEST FAMILY 11
 *
 * HISTORY / DOCUMENT STATE
 *
 * Controlado:
 * pushState / replaceState
 * sem navigation storm.
 * ============================================================
 */

function testHistoryVariant(variant) {

    var id = "hist" + variant;

    installDynamicStyleSheet(id);

    var root =
        buildComplexTree(
            id,
            2,
            5
        );

    arena.appendChild(root);

    forceStyleAndLayout(root);

    if (
        !window.history ||
        !history.pushState
    ) {

        return "SKIP";

    }

    var state = {
        id: variant,
        nodes:
            root.getElementsByTagName("*").length,
        nested: {
            value:
                "PS4-" + variant
        }
    };

    history.replaceState(
        state,
        "",
        location.href
    );

    mutateTree(root, id);

    forceStyleAndLayout(root);

    history.replaceState(
        {
            id: variant,
            phase: "after-layout"
        },
        "",
        location.href
    );

    if (
        variant % 2 === 0
    ) {

        root.innerHTML =
            "<div>history mutation</div>";

    } else {

        while (
            root.firstChild
        ) {

            root.removeChild(
                root.firstChild
            );

        }

    }

    forceStyleAndLayout(root);

}


/* ============================================================
 * TEST FAMILY 12
 *
 * ASYNC CALLBACK
 * → layout
 * → DOM replacement
 * → teardown
 *
 * requestAnimationFrame quando disponível.
 * ============================================================
 */

function testAsyncLifecycleVariant(variant) {

    var id = "async" + variant;

    installDynamicStyleSheet(id);

    var root =
        buildComplexTree(
            id,
            3,
            4
        );

    arena.appendChild(root);

    forceStyleAndLayout(root);

    var callback =
        function() {

            try {

                mutateTree(root, id);

                forceStyleAndLayout(root);

                if (
                    variant % 2 === 0
                ) {

                    root.innerHTML =
                        "<div class='" +
                        id +
                        "-block'>" +
                        "<span>async replacement</span>" +
                        "</div>";

                } else {

                    if (
                        root.parentNode
                    ) {

                        root.parentNode.removeChild(root);

                    }

                }

                forceStyleAndLayout(root);

            } catch (e) {
            }

        };

    if (
        window.requestAnimationFrame
    ) {

        window.requestAnimationFrame(
            callback
        );

    } else if (
        window.webkitRequestAnimationFrame
    ) {

        window.webkitRequestAnimationFrame(
            callback
        );

    } else {

        setTimeout(
            callback,
            0
        );

    }

    /*
     * Mutação antes do callback.
     */

    mutateTree(root, id);

    forceStyleAndLayout(root);

}


/* ============================================================
 * TEST MATRIX
 *
 * 12 famílias
 * × 4 variantes
 *
 * 48 sequências por round.
 * ============================================================
 */

var tests = [];


function addVariants(
    prefix,
    callback,
    count
) {

    for (
        var i = 0;
        i < count;
        i++
    ) {

        (function(index) {

            tests.push({

                name:
                    prefix +
                    " v" +
                    index,

                fn:
                    function() {

                        return callback(
                            index
                        );

                    }

            });

        })(i);

    }

}


addVariants(
    "EVENT reentrancy/lifecycle",
    testEventReentrancyVariant,
    4
);

addVariants(
    "MUTATIONOBSERVER reentrancy",
    testMutationReentrancyVariant,
    4
);

addVariants(
    "RANGE / SELECTION replacement",
    testRangeVariant,
    4
);

addVariants(
    "TREE traversal + mutation",
    testTraversalVariant,
    4
);

addVariants(
    "SHADOW DOM lifecycle",
    testShadowVariant,
    4
);

addVariants(
    "STYLE / LAYOUT complex mutation",
    testStyleLayoutVariant,
    4
);

addVariants(
    "IMAGE event + teardown",
    testImageLifecycleVariant,
    4
);

addVariants(
    "FRAME / DOCUMENT lifecycle",
    testFrameLifecycleVariant,
    4
);

addVariants(
    "SVG geometry + teardown",
    testSVGVariant,
    4
);

addVariants(
    "FORMS lifecycle mutation",
    testFormsVariant,
    4
);

addVariants(
    "HISTORY + DOM lifecycle",
    testHistoryVariant,
    4
);

addVariants(
    "ASYNC callback lifecycle",
    testAsyncLifecycleVariant,
    4
);


/* ============================================================
 * ROUND EXECUTION
 * ============================================================
 */

function runRound() {

    if (!running)
        return;

    round++;

    currentTest = 0;

    cleanupArena();

    section(
        "ROUND " +
        round +
        " / " +
        MAX_ROUNDS
    );

    var index = 0;


    function next() {

        if (!running)
            return;

        cleanupArena();

        if (
            index >= tests.length
        ) {

            if (
                round >= MAX_ROUNDS
            ) {

                finishFuzzer();

                return;

            }

            setTimeout(
                runRound,
                150
            );

            return;

        }

        var test =
            tests[index++];

        runTest(
            test.name,
            test.fn,
            next
        );

    }

    next();

}


/* ============================================================
 * START
 * ============================================================
 */

function startFuzzer() {

    if (running) {

        log(
            "[INFO] Fuzzer already running",
            "warn"
        );

        return;

    }

    running = true;

    round = 0;
    currentTest = 0;

    passCount = 0;
    failCount = 0;
    skipCount = 0;
    totalExecutions = 0;

    seed = 0x13572468;

    clearLog();

    section(
        "PS4 WEBKIT UAF LIFECYCLE FUZZER v2"
    );

    log(
        "[INFO] Tests per round: " +
        tests.length,
        "info"
    );

    log(
        "[INFO] Max rounds: " +
        MAX_ROUNDS,
        "info"
    );

    log(
        "[INFO] Focus: reentrancy / callbacks / teardown / style / layout",
        "info"
    );

    log(
        "[INFO] Complex DOM trees enabled",
        "info"
    );

    log(
        "[INFO] Repeated style/layout flushes enabled",
        "info"
    );

    log(
        "[INFO] No Worker storm",
        "warn"
    );

    log(
        "[INFO] No deliberate resource exhaustion",
        "warn"
    );

    updateStatus();

    setTimeout(
        runRound,
        100
    );

}


/* ============================================================
 * FINISH
 * ============================================================
 */

function finishFuzzer() {

    running = false;

    cleanupArena();

    section(
        "V2 MATRIX COMPLETE"
    );

    log(
        "Total executions: " +
        totalExecutions,
        "info"
    );

    log(
        "PASS: " +
        passCount,
        "pass"
    );

    log(
        "FAIL: " +
        failCount,
        failCount ?
        "fail" :
        "info"
    );

    log(
        "SKIP: " +
        skipCount,
        "warn"
    );

    log(
        "Final seed: 0x" +
        seed.toString(16),
        "info"
    );

    log(
        "[DONE] Controlled lifecycle matrix completed",
        "section"
    );

    updateStatus();

}


/* ============================================================
 * GLOBAL ERRORS
 * ============================================================
 */

window.onerror =
    function(
        message,
        source,
        line,
        column,
        error
    ) {

        failCount++;

        log(
            "[UNCAUGHT] " +
            message +
            " | line " +
            line,
            "fail"
        );

        updateStatus();

    };


window.addEventListener(
    "unhandledrejection",
    function(event) {

        failCount++;

        log(
            "[PROMISE REJECTION] " +
            event.reason,
            "fail"
        );

        updateStatus();

    },
    false
);

</script>
