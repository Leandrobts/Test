<!DOCTYPE html>
<body>
<h2>Teste de Regressão - AutoFillButton Click Then Type Change</h2>
<div id="container" style="margin: 20px 0;">
    <label>Campo de Senha (Input): </label>
    <input id="input" type="password" style="padding: 5px; font-size: 16px;">
</div>
<div id="result"></div>

<script>
function gc() {
    function gcRec(n) {
          if (n < 1)
              return {};
          var temp = {i: "ab" + i + (i / 100000)};
          temp += "foo";
          gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
    gcRec(10);
}

window.onload = async () => {
    const input = document.getElementById('input');
    
    let autoFillButton = null;
    try {
        if (input.shadowRoot) {
            autoFillButton = Array.from(input.shadowRoot.querySelectorAll('div')).find((div) => {
                return window.getComputedStyle(div).getPropertyValue('-webkit-user-agent-button') || true;
            });
        }
    } catch (e) {
        console.log("ShadowRoot protegido ou indisponível:", e);
    }

    input.addEventListener('click', () => {
        // Altera o tipo para 'button' no momento do clique para forçar a destruição do TextFieldInputType antigo
        input.type = 'button';
      gc();
    }, { once: true });

    // Aguarda meio segundo para o navegador renderizar a caixa de texto na tela antes de executar o gatilho
    setTimeout(() => {
        if (autoFillButton) {
            autoFillButton.click();
        } else {
            input.click();
        }
        document.getElementById('result').innerHTML = '<p>This test passes if WebKit does not hit debug assertions or crash under ASAN.</p><br><strong>PASS</strong>';
    }, 500);
};
</script>
</body>
</html>
