<script>
(function () {

/*
 ============================================================
 V20
 PS4 13.52 WebCore Cross-Layer Crash Hunter

 OBJECTIVE
 ----------
 Find browser-level crashes through WebCore lifetime,
 reentrancy, invalidation and teardown sequences.

 NO:
 - memory disclosure
 - arbitrary read/write
 - exploitation
 - code execution
 - heap grooming

 DESIGN
 ------
 V20 is organized around WebCore layer transitions.

 Examples:

 DOM -> Events -> Document -> Frame

 CSS -> StyleResolver -> RenderTree -> Layout

 SVG -> RenderTree -> Layout

 Editing -> Forms -> Events

 Text -> Fonts -> Layout

 History -> Document -> Frame

 IMPORTANT:
 There is no adaptive feedback system.
 Previous results do not influence pattern selection.
 ============================================================
*/


/* ============================================================
 CONFIG
 ============================================================ */

var CONFIG = {

    operationDelay: 18,

    asyncDelay: 65,

    caseDelay: 60,

    maxOperations: 34,

    maxLogLines: 500,

    maxCorpus: 200

};


/* ============================================================
 STORAGE
 ============================================================ */

var PREFIX =
    "PS4_1352_WEBCORE_V20_";


function save(key, value)
{
    try {
        localStorage.setItem(
            PREFIX + key,
            JSON.stringify(value)
        );
    } catch (e) {}
}


function load(key, fallback)
{
    try {

        var value =
            localStorage.getItem(
                PREFIX + key
            );

        if (value === null)
            return fallback;

        return JSON.parse(value);

    } catch (e) {

        return fallback;
    }
}


function removeStorage(key)
{
    try {
        localStorage.removeItem(
            PREFIX + key
        );
    } catch (e) {}
}


function clone(value)
{
    return JSON.parse(
        JSON.stringify(value)
    );
}


/* ============================================================
 LOGGER
 ============================================================ */

function log(message)
{
    var box =
        document.getElementById(
            "log"
        );

    var lines =
        box.textContent
            .split("\n")
            .filter(function (x) {
                return x.length;
            });

    lines.push(
        message
    );

    while (
        lines.length >
        CONFIG.maxLogLines
    ) {
        lines.shift();
    }

    box.textContent =
        lines.join("\n");

    box.scrollTop =
        box.scrollHeight;

    try {
        console.log(message);
    } catch (e) {}
}


function setStatus(message)
{
    document
        .getElementById("status")
        .textContent =
        message;
}


/* ============================================================
 RNG
 ============================================================ */

var RNG = {

    seed: 1,
    state: 1

};


function setSeed(seed)
{
    seed =
        (seed >>> 0) || 1;

    RNG.seed =
        seed;

    RNG.state =
        seed;
}


function random()
{
    RNG.state =
        (
            RNG.state * 1664525 +
            1013904223
        ) >>> 0;

    return RNG.state /
        4294967296;
}


function integer(max)
{
    if (max <= 0)
        return 0;

    return Math.floor(
        random() * max
    );
}


function pick(array)
{
    if (!array.length)
        return null;

    return array[
        integer(array.length)
    ];
}


function generateSeed()
{
    var previous =
        load(
            "seed",
            0x13522026
        );

    var seed =
        (
            Date.now() ^
            previous ^
            integer(
                0x7fffffff
            )
        ) >>> 0;

    if (!seed)
        seed = 1;

    save(
        "seed",
        seed
    );

    return seed;
}


/* ============================================================
 STATE
 ============================================================ */

var S = {

    running: false,

    mode: "READY",

    run: load(
        "run",
        0
    ),

        "caseId",
        0
    ),

    pattern: "",

    layers: [],

    sequence: [],

    index: 0,

    current: "",

    previous: "",

    errors: 0,

    events: 0,

    asyncOperations: 0,

    nodes: {},

    frames: {},

    svgs: {},

    history: [],

    transitions: {},

    corpus: load(
        "corpus",
        []
    ),

    candidate: load(
        "candidate",
        null
    ),

    stats: load(
        "stats",
        {
            cases: 0,
            completed: 0,
            interrupted: 0,
            candidates: 0
        }
    )

};


/* ============================================================
 LAYER TRACKING
 ============================================================ */

function layer(name)
{
    if (
        S.layers.indexOf(name) === -1
    ) {

        S.layers.push(
            name
        );
    }
}


/* ============================================================
 RESET
 ============================================================ */

function resetDOM()
{
    S.nodes = {};
    S.frames = {};
    S.svgs = {};
    S.history = [];
    S.transitions = {};
    S.errors = 0;
    S.events = 0;
    S.asyncOperations = 0;

    var root =
        document.getElementById(
            "root"
        );

    while (
        root.firstChild
    ) {

        root.removeChild(
            root.firstChild
        );
    }
}


/* ============================================================
 DOM CREATION
 ============================================================ */

function createNode(
    id,
    tag
)
{
    var node =
        document.createElement(
            tag || "div"
        );

    node.className =
        "v20node";

    node.setAttribute(
        "data-v20-id",
        id
    );

    node.textContent =
        "V20-" +
        id;

    S.nodes[id] = node;

    return node;
}


function getNode(id)
{
    return S.nodes[id] ||
        null;
}


/* ============================================================
 PATTERN 1
 DOM -> EVENTS -> DOCUMENT -> FOCUS
 ============================================================ */

function patternDOMEvents()
{
    S.pattern =
        "DOM_EVENTS_DOCUMENT_FOCUS";

    layer("DOM");
    layer("Events");
    layer("Document");
    layer("FocusController");

    return [

        { t:"CREATE", id:"A", tag:"button" },

function patternFrameStyle()
{

/* ============================================================
 FIXED CORPUS
 ============================================================ */

var PATTERNS = [

    patternDOMEvents,
    patternFocusFrame,
    patternIterator,
    patternStyleLayout,
    patternSVG,
    patternEditing,
    patternFonts,
    patternHistory,
    patternParser,
    patternDocument,

];


/* ============================================================
 CROSS-LAYER INSERTION
 ============================================================ */

function insertTransition(sequence)
{
    /*
     * These are structural transitions.
     *
     * They do not depend on previous crash results.
     */

    var transitions = [

        [
            {t:"MUTATE", id:"A"},
            {t:"LAYOUT", id:"A"}
        ],

        [
            {t:"STYLE", id:"A"},
            {t:"LAYOUT", id:"A"}
        ],

        [
            {t:"DISPATCH", id:"A"},
            {t:"MUTATE", id:"A"}
        ],

        [
            {t:"REMOVE", id:"A"},
            {t:"LAYOUT", id:"A"}
        ],

        [
            {t:"ASYNC_SCHEDULE", id:"A"},
            {t:"REMOVE", id:"A"},
            {t:"ASYNC_LATE", id:"A"}
        ],

        [
            {t:"BLUR", id:"A"},
            {t:"MUTATE", id:"A"}
        ]

    ];

    if (
        random() < 0.72
    ) {

        var transition =
            clone(
                pick(
                    transitions
                )
            );

        var position =
            integer(
                sequence.length + 1
            );

        var args = [
            position
        ];

        var i;

        for (
            i = 0;
            i < transition.length;
            i++
        ) {

            args.push(
                transition[i]
            );
        }

        sequence.splice.apply(
            sequence,
            args
        );
    }

    return sequence;
}


/* ============================================================
 SIMPLE STRUCTURAL MUTATION
 ============================================================ */

function mutateSequence(sequence)
{
    var result =
        clone(sequence);

    if (!result.length)
        return result;

    var mode =
        integer(7);

    if (
        mode === 0
    ) {

        result =
            insertTransition(
                result
            );

    }

    else if (
        mode === 1 &&
        result.length > 9
    ) {

        result.splice(
            integer(
                result.length
            ),
            1
        );

    }

    else if (
        mode === 2 &&
        result.length < CONFIG.maxOperations
    ) {

        var item =
            clone(
                pick(result)
            );

        result.splice(
            integer(
                result.length + 1
            ),
            0,
            item
        );

    }

    else if (
        mode === 3
    ) {

        var lifecycle =
            pick([

                {
                    t:"REMOVE",
                    id:"A"
                },

                {
                    t:"LAYOUT",
                    id:"A"
                },

                {
                    t:"MUTATE",
                    id:"A"
                },

                {
                    t:"ASYNC_LATE",
                    id:"A"
                },

                {
                    t:"DISPATCH",
                    id:"A"
                }

            ]);

        result.splice(
            integer(
                result.length + 1
            ),
            0,
            lifecycle
        );

    }

    else if (
        mode === 4 &&
        result.length > 4
    ) {

        var start =
            integer(
                result.length - 2
            );

        var count =
            Math.min(
                2,
                result.length -
                start
            );

        result.splice(
            start,
            count
        );

    }

    else if (
        mode === 5
    ) {

        result.push(
            {
                t:"LAYOUT"
            }
        );

    }

    else {

        result =
            insertTransition(
                result
            );
    }

    while (
        result.length >
        CONFIG.maxOperations
    ) {

        result.pop();
    }

    return result;
}


/* ============================================================
 DOM EXECUTION
 ============================================================ */

function executeDOM(op)
{
    var root =
        document.getElementById(
            "root"
        );

    try {

        if (
            op.t === "CREATE"
        ) {

            createNode(
                op.id,
                op.tag
            );

            return;
        }

        if (
            op.t === "INPUT_CREATE"
        ) {

            createNode(
                op.id,
                "input"
            );

            return;
        }

        if (
            op.t === "TEXTAREA"
        ) {

            createNode(
                op.id,
                "textarea"
            );

            return;
        }

        if (
            op.t === "TEXT_CREATE"
        ) {

            var text =
                createNode(
                    op.id,
                    "div"
                );

            text.textContent =
                "V20 text";

            return;
        }

        var el =
            getNode(
                op.id
            );

        if (!el)
            return;

        if (
            op.t === "ATTACH"
        ) {

            root.appendChild(
                el
            );

            return;
        }

        if (
            op.t === "REMOVE"
        ) {

            if (
                el.parentNode
            ) {

                el.parentNode
                    .removeChild(
                        el
                    );
            }

            return;
        }

        if (
            op.t === "MUTATE"
        ) {

            el.textContent =
                "mutation-" +
                integer(
                    1000000
                );

            el.setAttribute(
                "data-state",
                String(
                    integer(1000000)
                )
            );

            return;
        }

        if (
            op.t === "STYLE"
        ) {

            el.style.cssText =
                "display:block;" +
                "position:relative;" +
                "width:" +
                (10 + integer(180)) +
                "px;" +
                "height:" +
                (10 + integer(90)) +
                "px;";

            return;
        }

        if (
            op.t === "STYLE_REENTER"
        ) {

            el.style.width =
                (20 + integer(120)) +
                "px";

            void el.offsetWidth;

            el.style.height =
                (20 + integer(100)) +
                "px";

            void el.getBoundingClientRect();

            return;
        }

        if (
            op.t === "LAYOUT"
        ) {

            void el.offsetWidth;

            void el.scrollTop;

            el.getBoundingClientRect();

            return;
        }

        if (
            op.t === "LAYOUT_NESTED"
        ) {

            void el.offsetWidth;

            el.style.width =
                (10 + integer(150)) +
                "px";

            void el.offsetWidth;

            el.style.height =
                (10 + integer(100)) +
                "px";

            void el.getBoundingClientRect();

            return;
        }

        if (
            op.t === "LISTENER"
        ) {

            el.addEventListener(
                "v20event",
                function () {

                    S.events++;

                    try {

                        el.setAttribute(
                            "data-event",
                            String(
                                integer(
                                    100000
                                )
                            )
                        );

                        if (
                            random() < 0.25 &&
                            el.parentNode
                        ) {

                            el.parentNode
                                .removeChild(
                                    el
                                );
                        }

                    } catch (e) {}

                },
                false
            );

            return;
        }

        if (
            op.t === "DISPATCH"
        ) {

            var event =
                document.createEvent(
                    "Event"
                );

            event.initEvent(
                "v20event",
                true,
                true
            );

            el.dispatchEvent(
                event
            );

            return;
        }

        if (
            op.t === "FOCUS"
        ) {

            if (
                el.focus
            ) {

                el.focus();
            }

            return;
        }

        if (
            op.t === "BLUR"
        ) {

            if (
                el.blur
            ) {

                el.blur();
            }

            return;
        }

        if (
            op.t === "CLICK"
        ) {

            var click =
                document.createEvent(
                    "MouseEvents"
                );

            click.initMouseEvent(
                "click",
                true,
                true,
                window,
                1,
                0,
                0,
                0,
                0,
                false,
                false,
                false,
                false,
                0,
                null
            );

            el.dispatchEvent(
                click
            );

            return;
        }

        if (
            op.t === "TYPE_CHANGE"
        ) {

            if (
                el.tagName &&
                el.tagName.toLowerCase() ===
                "input"
            ) {

                el.type =
                    pick([
                        "text",
                        "search",
                        "email",
                        "number"
                    ]);
            }

            return;
        }

        if (
            op.t === "EDIT"
        ) {

            if (
                typeof el.value ===
                "string"
            ) {

                el.value =
                    "edit-" +
                    integer(
                        1000000
                    );
            }

            return;
        }

        if (
            op.t === "SELECTION"
        ) {

            if (
                el.setSelectionRange
            ) {

                try {

                    el.setSelectionRange(
                        0,
                        0
                    );

                } catch (e) {}
            }

            return;
        }

        if (
            op.t === "INPUT_EVENT"
        ) {

            var inputEvent =
                document.createEvent(
                    "Event"
                );

            inputEvent.initEvent(
                "input",
                true,
                true
            );

            el.dispatchEvent(
                inputEvent
            );

            return;
        }

        if (
            op.t === "EDIT_ACCESS"
        ) {

            void el.value;
            void el.selectionStart;
            void el.selectionEnd;

            return;
        }

        if (
            op.t === "FONT_CHANGE"
        ) {

            el.style.fontFamily =
                pick([
                    "serif",
                    "sans-serif",
                    "monospace"
                ]);

            el.style.fontSize =
                (8 + integer(30)) +
                "px";

            return;
        }

        if (
            op.t === "TEXT_MUTATE"
        ) {

            el.textContent =
                "text-" +
                integer(
                    1000000
                );

            return;
        }

        if (
            op.t === "SHADOW"
        ) {

            if (
                el.attachShadow
            ) {

                try {

                    var shadow =
                        el.attachShadow({
                            mode:"open"
                        });

                    shadow.innerHTML =
                        "<span>V20 shadow</span>";

                } catch (e) {}
            }

            return;
        }

        if (
            op.t === "ASYNC_SCHEDULE"
        ) {

            S.asyncOperations++;

            (function (reference) {

                setTimeout(
                    function () {

                        try {

                            void reference.parentNode;
                            void reference.textContent;

                        } catch (e) {}

                    },
                    CONFIG.asyncDelay
                );

            })(el);

            return;
        }

        if (
            op.t === "ASYNC_LATE"
        ) {

            S.asyncOperations++;

            (function (reference) {

                setTimeout(
                    function () {

                        try {

                            void reference.parentNode;

                            void reference.firstChild;

                            void reference.textContent;

                            void reference.offsetWidth;

                            reference
                                .getBoundingClientRect();

                        } catch (e) {}

                    },
                    CONFIG.asyncDelay
                );

            })(el);

            return;
        }

        if (
            op.t === "CONTINUE"
        ) {

            void el.parentNode;

            void el.firstChild;

            void el.textContent;

            void el.offsetWidth;

            return;
        }

    } catch (e) {

        S.errors++;
    }
}


/* ============================================================
 FRAME EXECUTION
 ============================================================ */

function executeFrame(op)
{
    var root =
        document.getElementById(
            "root"
        );

    try {

        if (
            op.t === "FRAME_CREATE"
        ) {

            var frame =
                document.createElement(
                    "iframe"
                );

            frame.className =
                "v20frame";

            frame.src =
                "about:blank";

            root.appendChild(
                frame
            );

            S.frames[
                op.id
            ] =
                frame;

            return;
        }

        var frame =
            S.frames[
                op.id
            ];

        if (!frame)
            return;

        if (
            op.t === "FRAME_LOAD"
        ) {

            frame.src =
                "about:blank";

            return;
        }

        if (
            op.t === "FRAME_INPUT"
        ) {

            var doc =
                frame.contentDocument;

            if (
                !doc ||
                !doc.body
            )
                return;

            var input =
                doc.createElement(
                    "input"
                );

            input.type =
                "text";

            doc.body.appendChild(
                input
            );

            S.frames[
                op.id + "_input"
            ] =
                input;

            return;
        }

        if (
            op.t === "FRAME_LISTENER"
        ) {

            var target =
                S.frames[
                    op.id + "_input"
                ];

            if (!target)
                return;

            target.addEventListener(
                "blur",
                function () {

                    try {

                        target.setAttribute(
                            "data-blur",
                            "1"
                        );

                    } catch (e) {}

                },
                false
            );

            return;
        }

        if (
            op.t === "FRAME_FOCUS"
        ) {

            var target2 =
                S.frames[
                    op.id + "_input"
                ];

            if (
                target2 &&
                target2.focus
            ) {

                target2.focus();
            }

            return;
        }

        if (
            op.t === "FRAME_BLUR"
        ) {

            var target3 =
                S.frames[
                    op.id + "_input"
                ];

            if (
                target3 &&
                target3.blur
            ) {

                target3.blur();
            }

            return;
        }

        if (
            op.t === "FRAME_MUTATE"
        ) {

            frame.setAttribute(
                "data-v20",
                String(
                    integer(
                        100000
                    )
                )
            );

            return;
        }

        if (
            op.t === "FRAME_REMOVE"
        ) {

            if (
                frame.parentNode
            ) {

                frame.parentNode
                    .removeChild(
                        frame
                    );
            }

            return;
        }

        if (
            op.t === "FRAME_ACCESS"
        ) {

            void frame.contentWindow;

            void frame.contentDocument;

            return;
        }

    } catch (e) {

        S.errors++;
    }
}


/* ============================================================
 SVG EXECUTION
 ============================================================ */

function executeSVG(op)
{
    var root =
        document.getElementById(
            "root"
        );

        if (
            op.t === "SVG_CREATE"
        ) {

                );

            );

            );

            );

            );

            ] =

        }

        var svg =
            S.svgs[
                op.id
            ];

        if (!svg)
            return;

        if (
            op.t === "SVG_ATTACH"
        ) {

            root.appendChild(
                svg
            );

            return;
        }

        if (
            op.t === "SVG_STYLE"
        ) {

            svg.setAttribute(

                "px;" +

            );

            op.t === "SVG_MUTATE"

                (20 + integer(100)) +
                " " +
                (20 + integer(80))
            );

            return;
        }

        if (
            op.t === "SVG_LAYOUT"
        ) {

            void svg.offsetWidth;

            svg.getBoundingClientRect();

            return;
        }

        if (
            op.t === "SVG_NESTED_LAYOUT"
        ) {

            void svg.offsetWidth;

            svg.setAttribute(
                "viewBox",
                "0 0 " +
                (10 + integer(120)) +
                " " +
                (10 + integer(100))
            );

            void svg.offsetWidth;

            svg.getBoundingClientRect();

            return;
        }

        if (
            op.t === "SVG_ACCESS"
        ) {

            void svg.offsetWidth;

            svg.getBoundingClientRect();

            return;
        }

        if (
            op.t === "SVG_REMOVE"
        ) {

            if (
                svg.parentNode
            ) {

                svg.parentNode
                    .removeChild(
                        svg
                    );
            }

            return;
        }

    } catch (e) {

        S.errors++;
    }
}


/* ============================================================
 ITERATOR EXECUTION
 ============================================================ */

function executeIterator(op)
{
    var root =
        document.getElementById(
            "root"
        );

    try {

        if (
            op.t === "TRAVERSE_BEGIN"
        ) {

            S.traversalLength =
                root.childNodes.length;

            return;
        }

        if (
            op.t === "TRAVERSE_CALLBACK"
        ) {

            var ev =
                document.createEvent(
                    "Event"
                );

            ev.initEvent(
                "v20-traversal",
                true,
                true
            );

            root.dispatchEvent(
                ev
            );

            return;
        }

        if (
            op.t === "COLLECTION_ADD"
        ) {

            var node =
                document.createElement(
                    "div"
                );

            node.className =
                "v20node";

            root.appendChild(
                node
            );

            return;
        }

        if (
            op.t === "COLLECTION_REMOVE"
        ) {

            if (
                root.firstChild
            ) {

                root.removeChild(
                    root.firstChild
                );
            }

            return;
        }

        if (
            op.t === "TRAVERSE_CONTINUE"
        ) {

            var length =
                root.childNodes.length;

            var i;

            for (
                i = 0;
                i < length;
                i++
            ) {

                var child =
                    root.childNodes[i];

                if (child) {

                    void child.nodeName;

                    if (
                        i === 0
                    ) {

                        var nested =
                            document.createElement(
                                "span"
                            );

                        child.appendChild(
                            nested
                        );
                    }
                }
            }

            return;
        }

    } catch (e) {

        S.errors++;
    }
}


/* ============================================================
 HISTORY EXECUTION
 ============================================================ */

function executeHistory(op)
{
    try {

        if (
            op.t === "HISTORY_PUSH"
        ) {

            if (
                history &&
                history.pushState
            ) {

                history.pushState(
                    {
                        v:
                            integer(
                                100000
                            )
                    },
                    "",
                    location.href
                );
            }

            return;
        }

        if (
            op.t === "HISTORY_LISTENER"
        ) {

            window.addEventListener(
                "popstate",
                function () {

                    S.events++;

                    try {

                        var node =
                            document.createElement(
                                "div"
                            );

                        node.className =
                            "v20node";

                        document
                            .getElementById(
                                "root"
                            )
                            .appendChild(
                                node
                            );

                    } catch (e) {}

                },
                false
            );

            return;
        }

        if (
            op.t === "HISTORY_FRAME"
        ) {

            var frame =
                document.createElement(
                    "iframe"
                );

            frame.className =
                "v20frame";

            frame.src =
                "about:blank";

            document
                .getElementById(
                    "root"
                )
                .appendChild(
                    frame
                );

            S.frames.history =
                frame;

            return;
        }

        if (
            op.t === "HISTORY_MUTATE"
        ) {

            document
                .getElementById(
                    "root"
                )
                .appendChild(
                    document.createElement(
                        "div"
                    )
                );

            return;
        }

        if (
            op.t === "HISTORY_BACK"
        ) {

            if (
                history &&
                history.back
            ) {

                history.back();
            }

            return;
        }

        if (
            op.t === "HISTORY_REMOVE_FRAME"
        ) {

            var frame2 =
                S.frames.history;

            if (
                frame2 &&
                frame2.parentNode
            ) {

                frame2.parentNode
                    .removeChild(
                        frame2
                    );
            }

            return;
        }

        if (
            op.t === "HISTORY_CONTINUE"
        ) {

            void document
                .body
                .offsetWidth;

            return;
        }

    } catch (e) {

        S.errors++;
    }
}


/* ============================================================
 PARSER EXECUTION
 ============================================================ */

function executeParser(op)
{
    var root =
        document.getElementById(
            "root"
        );

    try {

        if (
            op.t === "PARSE"
        ) {

            root.innerHTML =
                "<div class='v20node'>" +
                "<span>V20</span>" +
                "<input type='text'>" +
                "</div>";

            return;
        }

        if (
            op.t === "PARSE_STYLE"
        ) {

            var divs =
                root.getElementsByTagName(
                    "div"
                );

            if (
                divs.length
            ) {

                divs[0].style.cssText =
                    "display:block;" +
                    "position:relative;" +
                    "width:80px;" +
                    "height:30px;";
            }

            return;
        }

        if (
            op.t === "PARSE_LAYOUT"
        ) {

            void root.offsetWidth;

            root.getBoundingClientRect();

            return;
        }

        if (
            op.t === "PARSE_MUTATE"
        ) {

            root.innerHTML +=
                "<span>" +
                integer(
                    100000
                ) +
                "</span>";

            return;
        }

        if (
            op.t === "PARSE_REMOVE"
        ) {

            if (
                root.lastChild
            ) {

                root.removeChild(
                    root.lastChild
                );
            }

            return;
        }

    } catch (e) {

        S.errors++;
    }
}


/* ============================================================
 DISPATCH
 ============================================================ */

function execute(op)
{
    S.current =
        op.t +
        (
            op.id ?
            " " + op.id :
            ""
        );

    if (
        S.history.length
    ) {

        var previous =
            S.history[
                S.history.length - 1
            ];

        S.transitions[
            previous.t +
            "->" +
            op.t
        ] = true;
    }

    S.history.push(
        op
    );

    if (
        S.history.length > 24
    ) {

        S.history.shift();
    }

    if (
        op.t.indexOf(
            "FRAME_"
        ) === 0
    ) {

        executeFrame(op);

    } else if (
        op.t.indexOf(
            "SVG_"
        ) === 0
    ) {

        executeSVG(op);

    } else if (
        op.t.indexOf(
            "HISTORY_"
        ) === 0
    ) {

        executeHistory(op);

    } else if (
        op.t.indexOf(
            "PARSE"
        ) === 0
    ) {

        executeParser(op);

    } else if (
        op.t === "TRAVERSE_BEGIN" ||
        op.t === "TRAVERSE_CALLBACK" ||
        op.t === "COLLECTION_ADD" ||
        op.t === "COLLECTION_REMOVE" ||
        op.t === "TRAVERSE_CONTINUE"
    ) {

        executeIterator(op);

    } else if (
        op.t === "DOCUMENT_LAYOUT"
    ) {

        try {

            void document
                .documentElement
                .offsetWidth;

            document
                .documentElement
                .getBoundingClientRect();

        } catch (e) {}

    } else {

        executeDOM(op);
    }

    S.previous =
        S.current;

    updateDisplay();
}


/* ============================================================
 SEQUENCE SCORE
 ============================================================ */

function sequenceScore()
{
    var t =
        {};

    var i;

    for (
        i = 0;
        i < S.sequence.length;
        i++
    ) {

        t[
            S.sequence[i].t
        ] = true;
    }

    var score =
        Object.keys(
            S.transitions
        ).length;

    if (
        t.LISTENER &&
        t.DISPATCH &&
        t.REMOVE
    )
        score += 4;

    if (
        t.ASYNC_SCHEDULE &&
        t.REMOVE &&
        t.ASYNC_LATE
    )
        score += 5;

    if (
        t.FRAME_FOCUS &&
        t.FRAME_REMOVE &&
        t.FRAME_ACCESS
    )
        score += 5;

    if (
        t.TRAVERSE_BEGIN &&
        t.COLLECTION_ADD &&
        t.TRAVERSE_CONTINUE
    )
        score += 5;

    if (
        t.STYLE &&
        t.LAYOUT &&
        t.REMOVE
    )
        score += 4;

    if (
        t.SVG_LAYOUT &&
        t.SVG_REMOVE &&
        t.SVG_ACCESS
    )
        score += 5;

    if (
        t.FOCUS &&
        t.BLUR &&
        t.MUTATE
    )
        score += 3;

    if (
        t.FONT_CHANGE &&
        t.LAYOUT_NESTED &&
        t.REMOVE
    )
        score += 4;

    return score;
}


/* ============================================================
 CORPUS STORAGE
 ============================================================ */

function storeCorpus()
{
    /*
     * Persistent history only.
     * Never used for adaptive feedback.
     */

    S.corpus.push({

        pattern:
            S.pattern,

        layers:
            clone(
                S.layers
            ),

        seed:
            RNG.seed,

        sequence:
            clone(
                S.sequence
            ),

        score:
            sequenceScore(),

        time:
            Date.now()

    });

    while (
        S.corpus.length >
        CONFIG.maxCorpus
    ) {

        S.corpus.shift();
    }

    save(
        "corpus",
        S.corpus
    );
}

 CHECKPOINT

{

{

    );
}


/* ============================================================
 CANDIDATE
 ============================================================ */

function saveCandidate(
    reason
)
{
    S.candidate = {

        id:
            Date.now() +
            "-" +
            integer(
                100000
            ),

        reason:
            reason,

        pattern:

                S.layers
            ),

            RNG.seed,

        run:
            S.run,

        caseId:
            S.caseId,

        sequence:
            clone(
                S.sequence
            ),

        index:

    };

    save(
        "candidate",
        S.candidate
    );

    save(
        "stats",
        S.stats
    );
}


/* ============================================================
 BUILD CASE
 ============================================================ */

function buildCase()
{
    S.layers =
        [];

    var builder =
        pick(
            PATTERNS
        );

    var sequence =
        builder();

    /*
     * Structural mutation only.
     * No result feedback.
     */

    if (
        random() <
        0.78
    ) {

        sequence =
            mutateSequence(
                sequence
            );
    }

    /*
     * Optional second structural transition.
     */

    if (
        random() <
        0.28 &&
        sequence.length <
        CONFIG.maxOperations - 3
    ) {

        sequence =
            insertTransition(
                sequence
            );
    }

    while (
        sequence.length >
        CONFIG.maxOperations
    ) {

        sequence.pop();
    }

    return sequence;
}


/* ============================================================
 RUN SEQUENCE
 ============================================================ */

function runSequence(
    sequence,
    finished
)
{
    resetDOM();

    S.sequence =
        clone(sequence);

    S.index =
        0;

    S.current =
        "";

    S.previous =
        "";

    checkpoint();

    function step()
    {
        if (
            S.index >=
            S.sequence.length
        ) {

            setTimeout(
                function () {

                    S.stats.completed++;

                    save(
                        "stats",
                        S.stats
                    );

                    clearCheckpoint();

                    finished();

                },
                CONFIG.asyncDelay
            );

            return;
        }

        execute(
            S.sequence[
                S.index
            ]
        );

        S.index++;

        checkpoint();

        setTimeout(
            step,
            CONFIG.operationDelay
        );
    }

    step();
}


/* ============================================================
 FUZZ LOOP
 ============================================================ */

function startFuzz()
{
    S.running =
        true;

    S.mode =
        "FUZZ";

    function next()
    {
        if (
            S.mode !==
            "FUZZ"
        )
            return;

        S.run++;

        S.caseId++;

        S.stats.cases++;

        setSeed(
            generateSeed()
        );

        var sequence =
            buildCase();

        setStatus(
            "RUNNING — PS4 13.52"
        );

        runSequence(
            sequence,
            function () {

                /*
                 * Corpus is descriptive/persistent only.
                 */

                if (
                    sequenceScore() >= 8
                ) {

                    storeCorpus();
                }

                save(
                    "run",
                    S.run
                );

                save(
                    "caseId",
                    S.caseId
                );

                setTimeout(
                    next,
                    CONFIG.caseDelay
                );
            }
        );
    }

    next();
}


/* ============================================================
 REPLAY
 ============================================================ */

function startReplay()
{
    if (
        !S.candidate
    ) {

        startFuzz();

        return;
    }

    S.mode =
        "REPLAY";

    S.replay = {

        attempt:
            0,

        completed:
            0,

        interrupted:
            0,

        total:
            3

    };

    save(
        "replay",
        S.replay
    );

    replayNext();
}


function replayNext()
{
    if (
        S.replay.attempt >=
        S.replay.total
    ) {

        finishReplay();

        return;
    }

    S.replay.attempt++;

    save(
        "replay",
        S.replay
    );

    save(
        "task",
        {

            type:
                "REPLAY",

            awaiting:
                true,

            attempt:
                S.replay.attempt

        }
    );

    runSequence(
        S.candidate.sequence,
        function () {

            S.replay.completed++;

            save(
                "replay",
                S.replay
            );

            removeStorage(
                "task"
            );

            clearCheckpoint();

            setTimeout(
                replayNext,
                100
            );
        }
    );
}


function finishReplay()
{
    if (
        S.replay.interrupted
    ) {

        log(
            "Replay interruption detected."
        );

        log(
            "Candidate preserved for manual isolation."
        );

        removeStorage(
            "task"
        );

        return;
    }

    log(
        "Candidate replay completed normally."
    );

    log(
        "No browser-level interruption observed."
    );

    removeStorage(
        "candidate"
    );

    removeStorage(
        "replay"
    );

    S.candidate =
        null;

    S.replay =
        null;

    startFuzz();
}


/* ============================================================
 DISPLAY
 ============================================================ */

function updateDisplay()
{
    document
        .getElementById(
            "stats"
        )
        .textContent =

        "MODE: " +
        S.mode +

        "\nTARGET: PS4 13.52" +

        "\nRUN: " +
        S.run +

        "\nCASE: " +
        S.caseId +

        "\nSEED: " +
        RNG.seed +

        "\nCASES: " +
        S.stats.cases +

        "\nCOMPLETED: " +
        S.stats.completed +

        "\nINTERRUPTED: " +
        S.stats.interrupted +

        "\nCANDIDATES: " +
        S.stats.candidates +

        "\nCORPUS: " +
        S.corpus.length +

        "\nJS EXCEPTIONS: " +
        S.errors +

        "\nEVENTS: " +
        S.events +

        "\nASYNC: " +
        S.asyncOperations;


    document
        .getElementById(
            "layer"
        )
        .textContent =

        "PATTERN\n" +
        S.pattern +

        "\n\nCROSS-LAYER PATH\n" +

        (
            S.layers.length ?
            S.layers.join(
                " -> "
            ) :
            "NONE"
        );


    var lines =
        [];

    var i;

    for (
        i = 0;
        i < S.sequence.length;
        i++
    ) {

        lines.push(

            (
                i === S.index ?
                ">> " :
                "   "
            ) +

            "#" +
            ("00" + i).slice(-2) +
            " " +

            S.sequence[i].t +

            (
                S.sequence[i].id ?
                " " +
                S.sequence[i].id :
                ""
            )

        );
    }

    document
        .getElementById(
            "sequence"
        )
        .textContent =

        lines.join("\n") +

        "\n\nCURRENT: " +
        S.current +

        "\nPREVIOUS: " +
        S.previous;


    if (
        S.candidate
    ) {

        document
            .getElementById(
                "candidate"
            )
            .textContent =

            "CANDIDATE\n" +

            "ID: " +
            S.candidate.id +

            "\nReason: " +
            S.candidate.reason +

            "\nPattern: " +
            S.candidate.pattern +

            "\nSeed: " +
            S.candidate.seed +

            "\nOperations: " +
            S.candidate.sequence.length +

            "\nIndex: " +
            S.candidate.index +

            "\nCurrent: " +
            S.candidate.current;

    } else {

        document
            .getElementById(
                "candidate"
            )
            .textContent =
            "CANDIDATE\nNONE";
    }
}


/* ============================================================
 RECOVERY
 ============================================================ */

function recover()
{
    var task =
        load(
            "task",
            null
        );

    var candidate =
        load(
            "candidate",
            null
        );

    var checkpointState =
        load(
            "checkpoint",
            null
        );

    if (
        task &&
        task.type ===
        "REPLAY" &&
        task.awaiting &&
        candidate
    ) {

        S.candidate =
            candidate;

        S.replay =
            load(
                "replay",
                {
                    attempt: 0,
                    completed: 0,
                    interrupted: 0,
                    total: 3
                }
            );

        S.replay.interrupted++;

        S.stats.interrupted++;

        save(
            "replay",
            S.replay
        );

        save(
            "stats",
            S.stats
        );

        removeStorage(
            "task"
        );

        return true;
    }

    if (
        checkpointState &&
        checkpointState.sequence &&
        checkpointState.complete === false
    ) {

        S.pattern =
            checkpointState.pattern;

        S.layers =
            clone(
                checkpointState.layers ||
                []
            );

        S.run =
            checkpointState.run;

        S.caseId =
            checkpointState.caseId;

        setSeed(
            checkpointState.seed
        );

        S.sequence =
            clone(
                checkpointState.sequence
            );

        S.index =
            checkpointState.index;

        S.current =
            checkpointState.current;

        S.previous =
            checkpointState.previous;

        saveCandidate(
            "BROWSER_INTERRUPTION"
        );

        S.stats.interrupted++;

        save(
            "stats",
            S.stats
        );

        log(
            "Interrupted sequence recovered."
        );

        return true;
    }

    return false;
}


/* ============================================================
 INIT
 ============================================================ */

var recovered =
    recover();

updateDisplay();

log(
    "========================================"
);

log(
    "PS4 13.52 WEBCORE CRASH HUNTER V20"
);

log(
    "Cross-layer lifetime/reentrancy corpus"
);

log(
    "Adaptive feedback: DISABLED"
);

log(
    "Exploit functionality: DISABLED"
);

log(
    "========================================"
);


document
    .getElementById(
        "start"
    )
    .addEventListener(
        "click",
        function () {

            if (
                S.running
            )
                return;

            S.running =
                true;

            if (
                S.candidate
            ) {

                startReplay();

            } else {

                startFuzz();
            }

        },
        false
    );


if (
    recovered &&
    S.candidate
) {

    S.running =
        true;

    setTimeout(
        startReplay,
        500
    );
}

})();
</script>
