<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  iframe {
    content: url();
    zoom: 0.01;
  }
</style>
</head>
<body>

<iframe id="i0"></iframe>

<script>
  // Tratamento seguro para ambientes que possuam o objeto internals (opcional)
  if (window.internals && window.internals.settings) {
    try {
      internals.settings.setAsyncFrameScrollingEnabled(true);
      internals.settings.setCaretBrowsingEnabled(true);
    } catch (e) {}
  }

  window.addEventListener('load', () => {
    // 1. Injeta um frameset na árvore do documento
    document.documentElement.append(document.createElement('frameset'));

    // 2. Registra o evento de foco do iframe mutando o hash da URL
    const i0 = document.getElementById('i0');
    i0.onfocus = () => {
      location.hash = 'y';
    };

    location.hash = 'x';

    // 3. Força a resolução assíncrona da promise de Cache Storage para disparar o foco
    if (window.caches) {
      caches.has('a').then(() => {
        i0.focus();
      });
    } else {
      // Fallback assíncrono caso Cache API não esteja disponível
      Promise.resolve().then(() => {
        i0.focus();
      });
    }
  });
</script>
</body>
</html>
