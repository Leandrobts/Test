<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PS4 13.52 - Silent Crash Hunter V21</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #111;
    color: #ddd;
    font-family: sans-serif;
}

body {
    padding: 12px;
}

#start {
    width: 100%;
    padding: 16px;
    font-size: 20px;
}

#status {
    margin-top: 10px;
    padding: 10px;
    border: 1px solid #444;
    background: #181818;
    font-family: monospace;
}

#recovery {
    margin-top: 10px;
    padding: 10px;
    border: 1px solid #444;
    background: #181818;
    font-family: monospace;
    display: none;
}
</style>
</head>

<body>

<button id="start">START</button>

<div id="status">READY</div>

<div id="recovery"></div>

<div id="root"></div>

<script>
(function () {

"use strict";

/*
============================================================
 V21 — SILENT CRASH HUNTER
 Target: PS4 13.52 WebKit

 PRINCIPLES
 ----------
 1. No live logging.
 2. No console logging.
 3. No score.
 4. No corpus.
 5. No adaptive feedback.
 6. Only the current test is persisted.
 7. The checkpoint is overwritten continuously.
 8. If execution stops unexpectedly, the last case
    remains available after reload.

 The JavaScript cannot prove that a crash was a UAF.
 It only preserves the last executing sequence so that
 the resulting browser crash can be investigated externally.
============================================================
*/


/* ============================================================
 CONFIG
============================================================ */

var CONFIG = {

    operationDelay: 16,

    asyncDelay: 60,

    caseDelay: 25,

    maxOperations: 34

};


/* ============================================================
 STORAGE
============================================================ */

var STORAGE_KEY =
    "PS4_1352_V21_LAST_CASE";


function saveCase(data)
{
    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(data)
        );

    } catch (e) {}
}


function loadCase()
{
    try {

        var raw =
            localStorage.getItem(
                STORAGE_KEY
            );

        if (!raw)
            return null;

        return JSON.parse(
            raw
        );

    } catch (e) {

        return null;
    }
}


/* ============================================================
 RNG
============================================================ */

var RNG = {

    seed: 1,
    state: 1

};


function setSeed(seed)
{
    seed =
        (seed >>> 0) || 1;

    RNG.seed =
        seed;

    RNG.state =
        seed;
}


function random()
{
    RNG.state =
        (
            RNG.state * 1664525 +
            1013904223
        ) >>> 0;

    return RNG.state /
        4294967296;
}


function integer(max)
{
    if (max <= 0)
        return 0;

    return Math.floor(
        random() * max
    );
}


function pick(array)
{
    return array[
        integer(
            array.length
        )
    ];
}


function newSeed()
{
    var seed =
        (
            Date.now() ^
            integer(
                0x7fffffff
            )
        ) >>> 0;

    if (!seed)
        seed = 1;

    return seed;
}


/* ============================================================
 STATE
============================================================ */

var state = {

    running: false,

    caseId: 0,

    seed: 0,

    pattern: "",

    layers: [],

    sequence: [],

    index: 0,

    nodes: {},

    frames: {},

    svgs: {}

};


/* ============================================================
 MINIMAL STATUS
============================================================ */

function setStatus(text)
{
    document.getElementById(
        "status"
    ).textContent =
        text;
}


/* ============================================================
 RESET
============================================================ */

function resetDOM()
{
    state.nodes = {};
    state.frames = {};
    state.svgs = {};

    var root =
        document.getElementById(
            "root"
        );

    while (
        root.firstChild
    ) {

        root.removeChild(
            root.firstChild
        );
    }
}


/* ============================================================
 CHECKPOINT
============================================================ */

function checkpoint()
{
    saveCase({

        version: "V21",

        target: "PS4 13.52",

        caseId:
            state.caseId,

        seed:
            state.seed,

        pattern:
            state.pattern,

        layers:
            state.layers.slice(),

        sequence:
            JSON.parse(
                JSON.stringify(
                    state.sequence
                )
            ),

        index:
            state.index,

        operation:
            state.sequence[
                state.index
            ] || null,

        timestamp:
            Date.now()

    });
}


/* ============================================================
 LAYER
============================================================ */

function layer(name)
{
    if (
        state.layers.indexOf(
            name
        ) === -1
    ) {

        state.layers.push(
            name
        );
    }
}


/* ============================================================
 DOM NODE
============================================================ */

function createNode(
    id,
    tag
)
{
    var node =
        document.createElement(
            tag || "div"
        );

    node.setAttribute(
        "data-v21",
        id
    );

    node.style.display =
        "block";

    node.style.position =
        "relative";

    node.textContent =
        "V21-" + id;

    state.nodes[id] =
        node;

    return node;
}


function getNode(id)
{
    return state.nodes[id] ||
        null;
}


/* ============================================================
 PATTERN 1
 DOM -> EVENTS -> DOCUMENT -> FOCUS
============================================================ */

function patternDOMEvents()
{
    state.pattern =
        "DOM_EVENTS_DOCUMENT_FOCUS";

    layer("DOM");
    layer("Events");
    layer("Document");
    layer("FocusController");

    return [

        {t:"CREATE", id:"A", tag:"button"},
        {t:"ATTACH", id:"A"},
        {t:"LISTENER", id:"A"},
        {t:"FOCUS", id:"A"},
        {t:"DISPATCH", id:"A"},
        {t:"MUTATE", id:"A"},
        {t:"REMOVE", id:"A"},
        {t:"DISPATCH", id:"A"},
        {t:"CONTINUE", id:"A"},
        {t:"LAYOUT", id:"A"}

    ];
}


/* ============================================================
 PATTERN 2
 FOCUS -> BLUR -> FRAME -> DOCUMENT
============================================================ */

function patternFocusFrame()
{
    state.pattern =
        "FOCUS_BLUR_FRAME_DOCUMENT";

    layer("FocusController");
    layer("Events");
    layer("Frame");
    layer("Document");
    layer("DOM");

    return [

        {t:"FRAME_CREATE", id:"A"},
        {t:"FRAME_LOAD", id:"A"},
        {t:"FRAME_INPUT", id:"A"},
        {t:"FRAME_LISTENER", id:"A"},
        {t:"FRAME_FOCUS", id:"A"},
        {t:"FRAME_BLUR", id:"A"},
        {t:"FRAME_MUTATE", id:"A"},
        {t:"FRAME_REMOVE", id:"A"},
        {t:"FRAME_ACCESS", id:"A"},
        {t:"DOCUMENT_LAYOUT"}

    ];
}


/* ============================================================
 PATTERN 3
 DOM -> TRAVERSAL -> MUTATION
============================================================ */

function patternIterator()
{
    state.pattern =
        "DOM_ITERATOR_MUTATION";

    layer("DOM");
    layer("Events");
    layer("Document");

    return [

        {t:"CREATE", id:"A"},
        {t:"CREATE", id:"B"},
        {t:"CREATE", id:"C"},
        {t:"CREATE", id:"D"},

        {t:"ATTACH", id:"A"},
        {t:"ATTACH", id:"B"},
        {t:"ATTACH", id:"C"},
        {t:"ATTACH", id:"D"},

        {t:"TRAVERSE_BEGIN"},
        {t:"TRAVERSE_CALLBACK"},
        {t:"COLLECTION_ADD"},
        {t:"COLLECTION_REMOVE"},
        {t:"TRAVERSE_CONTINUE"},
        {t:"LAYOUT"}

    ];
}

 PATTERN 4
 CSS -> STYLE -> RENDER TREE -> LAYOUT
============================================================ */

function patternStyleLayout()
{

    layer("CSS");

    layer("Layout");

        {t:"LAYOUT", id:"A"},
        {t:"STYLE_REENTER", id:"A"},
        {t:"LAYOUT_NESTED", id:"A"},
        {t:"MUTATE", id:"A"},
        {t:"STYLE", id:"A"},
        {t:"LAYOUT", id:"A"},
        {t:"REMOVE", id:"A"},
        {t:"LAYOUT", id:"A"}

    ];
}


/* ============================================================
 PATTERN 5
 SVG -> RENDER TREE -> LAYOUT -> TEARDOWN
============================================================ */

function patternSVG()
{
    state.pattern =
        "SVG_RENDER_LAYOUT_TEARDOWN";

    layer("SVG");
    layer("DOM");
    layer("CSS");
    layer("RenderTree");

        {t:"SVG_STYLE", id:"A"},

        {t:"SVG_NESTED_LAYOUT", id:"A"},
        {t:"SVG_MUTATE", id:"A"},
        {t:"SVG_LAYOUT", id:"A"},
        {t:"SVG_REMOVE", id:"A"},
        {t:"SVG_ACCESS", id:"A"},

}


/* ============================================================
 PATTERN 6
 EDITING -> FORMS -> EVENTS -> FOCUS

function patternEditing()
{

    layer("Editing");

        {t:"TEXTAREA", id:"A"},

        {t:"FOCUS", id:"A"},
        {t:"EDIT", id:"A"},
        {t:"SELECTION", id:"A"},
        {t:"INPUT_EVENT", id:"A"},
        {t:"TYPE_CHANGE", id:"A"},
        {t:"MUTATE", id:"A"},
        {t:"BLUR", id:"A"},
        {t:"REMOVE", id:"A"},
        {t:"EDIT_ACCESS", id:"A"}

    ];
}


/* ============================================================
 PATTERN 7
 TEXT -> FONTS -> CSS -> LAYOUT
============================================================ */

function patternFonts()
{
    state.pattern =
        "TEXT_FONTS_CSS_LAYOUT";

    layer("Text");
    layer("Fonts");
    layer("CSS");
    layer("StyleResolver");
    layer("RenderTree");

    return [

        {t:"TEXT_CREATE", id:"A"},
        {t:"ATTACH", id:"A"},
        {t:"FONT_CHANGE", id:"A"},
        {t:"LAYOUT", id:"A"},
        {t:"TEXT_MUTATE", id:"A"},
        {t:"FONT_CHANGE", id:"A"},
        {t:"LAYOUT_NESTED", id:"A"},
        {t:"REMOVE", id:"A"},
        {t:"LAYOUT", id:"A"}

    ];
}

 PATTERN 8
 HISTORY -> DOCUMENT -> FRAME
============================================================ */

function patternHistory()
{
    state.pattern =

    layer("History");
    layer("Document");
    layer("Frame");
    layer("DOM");

 PATTERN 9
 HTML PARSER -> STYLE -> LAYOUT

function patternParser()

    state.pattern =

}


/* ============================================================
 PATTERN 10
 DOCUMENT -> ASYNC -> TEARDOWN
============================================================ */

function patternAsync()
{
    state.pattern =
        "DOCUMENT_ASYNC_TEARDOWN";

    layer("Document");
    layer("DOM");
    layer("Events");
    layer("Frame");
    layer("Layout");

    return [

        {t:"CREATE", id:"A"},
        {t:"ATTACH", id:"A"},
        {t:"LISTENER", id:"A"},
        {t:"ASYNC_SCHEDULE", id:"A"},

        {t:"REMOVE", id:"A"},

    ];
}


/* ============================================================
 PATTERN 11
 CROSS-LAYER
============================================================ */

function patternCross()
{
    state.pattern =
        "CROSS_LAYER_LIFETIME_CHAIN";

    layer("DOM");
    layer("Events");
    layer("FocusController");
    layer("Document");
    layer("Frame");
    layer("Editing");
    layer("Forms");
    layer("CSS");
    layer("StyleResolver");
    layer("RenderTree");
    layer("Layout");
    layer("Text");
    layer("Fonts");
    layer("SVG");
    layer("History");

    return [

        {t:"TEXTAREA", id:"A"},
        {t:"ATTACH", id:"A"},
        {t:"LISTENER", id:"A"},
        {t:"FOCUS", id:"A"},
        {t:"EDIT", id:"A"},
        {t:"STYLE", id:"A"},
        {t:"LAYOUT", id:"A"},
        {t:"ASYNC_SCHEDULE", id:"A"},
        {t:"DISPATCH", id:"A"},
        {t:"MUTATE", id:"A"},
        {t:"FONT_CHANGE", id:"A"},
        {t:"LAYOUT_NESTED", id:"A"},
        {t:"BLUR", id:"A"},
        {t:"REMOVE", id:"A"},
        {t:"ASYNC_LATE", id:"A"},
        {t:"LAYOUT"}

    ];
}


/* ============================================================
 PATTERN 12
 FRAME -> STYLE -> EVENT
============================================================ */

function patternFrameStyle()
{
    state.pattern =
        "FRAME_STYLE_EVENT";

    layer("Frame");
    layer("Document");
    layer("Events");
    layer("CSS");
    layer("StyleResolver");
    layer("RenderTree");
    layer("Layout");

    return [

        {t:"FRAME_CREATE", id:"A"},
        {t:"FRAME_INPUT", id:"A"},
        {t:"FRAME_LISTENER", id:"A"},
        {t:"FRAME_FOCUS", id:"A"},
        {t:"FRAME_MUTATE", id:"A"},
        {t:"DOCUMENT_LAYOUT"},
        {t:"FRAME_BLUR", id:"A"},
        {t:"FRAME_REMOVE", id:"A"},
        {t:"FRAME_ACCESS", id:"A"},
        {t:"DOCUMENT_LAYOUT"}

    ];
}


/* ============================================================
 PATTERN TABLE
============================================================ */

var PATTERNS = [

    patternDOMEvents,
    patternFocusFrame,
    patternIterator,
    patternStyleLayout,
    patternSVG,
    patternEditing,
    patternFonts,
    patternHistory,
    patternParser,
    patternAsync,
    patternCross,
    patternFrameStyle

];


/* ============================================================
 STRUCTURAL MUTATION
============================================================ */

function mutateSequence(sequence)
{
    var result =
        JSON.parse(
            JSON.stringify(
                sequence
            )
        );

    if (!result.length)
        return result;

    var mode =
        integer(6);

    if (
        mode === 0 &&
        result.length < CONFIG.maxOperations
    ) {

        result.splice(
            integer(
                result.length + 1
            ),
            0,
            JSON.parse(
                JSON.stringify(
                    pick(result)
                )
            )
        );

    } else if (
        mode === 1 &&
        result.length > 8
    ) {

        result.splice(
            integer(
                result.length
            ),
            1
        );

    } else if (
        mode === 2
    ) {

        var ops = [

            {t:"MUTATE", id:"A"},
            {t:"LAYOUT", id:"A"},
            {t:"REMOVE", id:"A"},
            {t:"ASYNC_LATE", id:"A"},
            {t:"DISPATCH", id:"A"}

        ];

        result.splice(
            integer(
                result.length + 1
            ),
            0,
            pick(ops)
        );

    } else if (
        mode === 3 &&
        result.length > 10
    ) {

        var start =
            integer(
                result.length - 3
            );

        result.splice(
            start,
            2
        );

    } else if (
        mode === 4
    ) {

        var transition = [

            {t:"STYLE", id:"A"},
            {t:"LAYOUT", id:"A"},
            {t:"MUTATE", id:"A"}

        ];

        result.splice.apply(
            result,
            [
                integer(
                    result.length + 1
                ),
                0
            ].concat(
                transition
            )
        );

    } else {

        result.push({
            t:"LAYOUT"
        });
    }

    while (
        result.length >
        CONFIG.maxOperations
    ) {

        result.pop();
    }

    return result;
}


/* ============================================================
 DOM EXECUTION
============================================================ */

function executeDOM(op)
{
    var root =
        document.getElementById(
            "root"
        );

    try {

        if (
            op.t === "CREATE"
        ) {

            createNode(
                op.id,
                op.tag
            );

            return;
        }

        if (
            op.t === "TEXTAREA"
        ) {

            createNode(
                op.id,
                "textarea"
            );

            return;
        }

        if (
            op.t === "TEXT_CREATE"
        ) {

            var text =
                createNode(
                    op.id,
                    "div"
                );

            text.textContent =
                "V21 text";

            return;
        }

        var node =
            getNode(
                op.id
            );

        if (!node)
            return;

        if (
            op.t === "ATTACH"
        ) {

            root.appendChild(
                node
            );

            return;
        }

        if (
            op.t === "REMOVE"
        ) {

            if (
                node.parentNode
            ) {

                node.parentNode
                    .removeChild(
                        node
                    );
            }

            return;
        }

        if (
            op.t === "MUTATE"
        ) {

            node.textContent =
                "M-" +
                integer(
                    1000000
                );

            node.setAttribute(
                "data-state",
                String(
                    integer(
                        100000
                    )
                )
            );

            return;
        }

        if (
            op.t === "STYLE"
        ) {

            node.style.width =
                (10 + integer(180)) +
                "px";

            node.style.height =
                (10 + integer(100)) +
                "px";

            node.style.position =
                "relative";

            return;
        }

        if (
            op.t === "STYLE_REENTER"
        ) {

            node.style.width =
                (20 + integer(120)) +
                "px";

            void node.offsetWidth;

            node.style.height =
                (20 + integer(100)) +
                "px";

            void node.getBoundingClientRect();

            return;
        }

        if (
            op.t === "LAYOUT"
        ) {

            void node.offsetWidth;

            void node.scrollTop;

            node.getBoundingClientRect();

            return;
        }

        if (
            op.t === "LAYOUT_NESTED"
        ) {

            void node.offsetWidth;

            node.style.width =
                (10 + integer(150)) +
                "px";

            void node.offsetWidth;

            node.style.height =
                (10 + integer(100)) +
                "px";

            node.getBoundingClientRect();

            return;
        }

        if (
            op.t === "LISTENER"
        ) {

            node.addEventListener(
                "v21",
                function () {

                    try {

                        node.setAttribute(
                            "data-event",
                            "1"
                        );

                        if (
                            random() < 0.25 &&
                            node.parentNode
                        ) {

                            node.parentNode
                                .removeChild(
                                    node
                                );
                        }

                    } catch (e) {}

                },
                false
            );

            return;
        }

        if (
            op.t === "DISPATCH"
        ) {

            var event =
                document.createEvent(
                    "Event"
                );

            event.initEvent(
                "v21",
                true,
                true
            );

            node.dispatchEvent(
                event
            );

            return;
        }

        if (
            op.t === "FOCUS"
        ) {

            if (
                node.focus
            )
                node.focus();

            return;
        }

        if (
            op.t === "BLUR"
        ) {

            if (
                node.blur
            )
                node.blur();

            return;
        }

        if (
            op.t === "EDIT"
        ) {

            if (
                typeof node.value ===
                "string"
            ) {

                node.value =
                    "edit-" +
                    integer(
                        100000
                    );
            }

            return;
        }

        if (
            op.t === "SELECTION"
        ) {

            if (
                node.setSelectionRange
            ) {

                try {

                    node.setSelectionRange(
                        0,
                        0
                    );

                } catch (e) {}
            }

            return;
        }

        if (
            op.t === "INPUT_EVENT"
        ) {

            var inputEvent =
                document.createEvent(
                    "Event"
                );

            inputEvent.initEvent(
                "input",
                true,
                true
            );

            node.dispatchEvent(
                inputEvent
            );

            return;
        }

        if (
            op.t === "TYPE_CHANGE"
        ) {

            if (
                node.tagName &&
                node.tagName.toLowerCase() ===
                "input"
            ) {

                node.type =
                    pick([
                        "text",
                        "search",
                        "email",
                        "number"
                    ]);
            }

            return;
        }

        if (
            op.t === "EDIT_ACCESS"
        ) {

            void node.value;
            void node.selectionStart;
            void node.selectionEnd;

            return;
        }

        if (
            op.t === "FONT_CHANGE"
        ) {

            node.style.fontFamily =
                pick([
                    "serif",
                    "sans-serif",
                    "monospace"
                ]);

            node.style.fontSize =
                (8 + integer(30)) +
                "px";

            return;
        }

        if (
            op.t === "TEXT_MUTATE"
        ) {

            node.textContent =
                "text-" +
                integer(
                    1000000
                );

            return;
        }

        if (
            op.t === "SHADOW"
        ) {

            if (
                node.attachShadow
            ) {

                try {

                    var shadow =
                        node.attachShadow({
                            mode:"open"
                        });

                    shadow.innerHTML =
                        "<span>V21</span>";

                } catch (e) {}
            }

            return;
        }

        if (
            op.t === "ASYNC_SCHEDULE"
        ) {

            (function (reference) {

                setTimeout(
                    function () {

                        try {

                            void reference.parentNode;
                            void reference.textContent;

                        } catch (e) {}

                    },
                    CONFIG.asyncDelay
                );

            })(node);

            return;
        }

        if (
            op.t === "ASYNC_LATE"
        ) {

            (function (reference) {

                setTimeout(
                    function () {

                        try {

                            void reference.parentNode;
                            void reference.firstChild;
                            void reference.textContent;
                            void reference.offsetWidth;

                            reference
                                .getBoundingClientRect();

                        } catch (e) {}

                    },
                    CONFIG.asyncDelay
                );

            })(node);

            return;
        }

        if (
            op.t === "CONTINUE"
        ) {

            void node.parentNode;
            void node.firstChild;
            void node.textContent;
            void node.offsetWidth;

            return;
        }

    } catch (e) {}
}


/* ============================================================
 FRAME EXECUTION
============================================================ */

function executeFrame(op)
{
    var root =
        document.getElementById(
            "root"
        );

    try {

        if (
            op.t === "FRAME_CREATE"
        ) {

            var frame =
                document.createElement(
                    "iframe"
                );

            frame.src =
                "about:blank";

            frame.width =
                "4";

            frame.height =
                "4";

            root.appendChild(
                frame
            );

            state.frames[
                op.id
            ] =
                frame;

            return;
        }

        var frame =
            state.frames[
                op.id
            ];

        if (!frame)
            return;

        if (
            op.t === "FRAME_LOAD"
        ) {

            frame.src =
                "about:blank";

            return;
        }

        if (
            op.t === "FRAME_INPUT"
        ) {

            var doc =
                frame.contentDocument;

            if (
                !doc ||
                !doc.body
            )
                return;

            var input =
                doc.createElement(
                    "input"
                );

            input.type =
                "text";

            doc.body.appendChild(
                input
            );

            state.frames[
                op.id + "_input"
            ] =
                input;

            return;
        }

        if (
            op.t === "FRAME_LISTENER"
        ) {

            var target =
                state.frames[
                    op.id + "_input"
                ];

            if (!target)
                return;

            target.addEventListener(
                "blur",
                function () {

                    try {

                        target.setAttribute(
                            "data-blur",
                            "1"
                        );

                    } catch (e) {}

                },
                false
            );

            return;
        }

        if (
            op.t === "FRAME_FOCUS"
        ) {

            var target2 =
                state.frames[
                    op.id + "_input"
                ];

            if (
                target2 &&
                target2.focus
            )
                target2.focus();

            return;
        }

        if (
            op.t === "FRAME_BLUR"
        ) {

            var target3 =
                state.frames[
                    op.id + "_input"
                ];

            if (
                target3 &&
                target3.blur
            )
                target3.blur();

            return;
        }

        if (
            op.t === "FRAME_MUTATE"
        ) {

            frame.setAttribute(
                "data-v21",
                String(
                    integer(
                        100000
                    )
                )
            );

            return;
        }

        if (
            op.t === "FRAME_REMOVE"
        ) {

            if (
                frame.parentNode
            ) {

                frame.parentNode
                    .removeChild(
                        frame
                    );
            }

            return;
        }

        if (
            op.t === "FRAME_ACCESS"
        ) {

            void frame.contentWindow;
            void frame.contentDocument;

            return;
        }

    } catch (e) {}
}


/* ============================================================
 SVG EXECUTION
============================================================ */

function executeSVG(op)
{
    var root =
        document.getElementById(
            "root"
        );

    try {

        if (
            op.t === "SVG_CREATE"
        ) {

            var svg =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "svg"
                );

            svg.setAttribute(
                "width",
                "80"
            );

            svg.setAttribute(
                "height",
                "60"
            );

            var rect =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "rect"
                );

            rect.setAttribute(
                "width",
                "40"
            );

            rect.setAttribute(
                "height",
                "30"
            );

            svg.appendChild(
                rect
            );

            state.svgs[
                op.id
            ] =
                svg;

            return;
        }

        var svg =
            state.svgs[
                op.id
            ];

        if (!svg)
            return;

        if (
            op.t === "SVG_ATTACH"
        ) {

            root.appendChild(
                svg
            );

            return;
        }

        if (
            op.t === "SVG_STYLE"
        ) {

            svg.setAttribute(
                "style",
                "display:block;" +
                "width:" +
                (20 + integer(100)) +
                "px;" +
                "height:" +
                (20 + integer(80)) +
                "px;"
            );

            return;
        }

        if (
            op.t === "SVG_MUTATE"
        ) {

            svg.setAttribute(
                "viewBox",
                "0 0 " +
                (20 + integer(100)) +
                " " +
                (20 + integer(80))
            );

            return;
        }

        if (
            op.t === "SVG_LAYOUT"
        ) {

            void svg.offsetWidth;

            svg.getBoundingClientRect();

            return;
        }

        if (
            op.t === "SVG_NESTED_LAYOUT"
        ) {

            void svg.offsetWidth;

            svg.setAttribute(
                "viewBox",
                "0 0 " +
                (10 + integer(120)) +
                " " +
                (10 + integer(100))
            );

            void svg.offsetWidth;

            svg.getBoundingClientRect();

            return;
        }

        if (
            op.t === "SVG_ACCESS"
        ) {

            void svg.offsetWidth;

            svg.getBoundingClientRect();

            return;
        }

        if (
            op.t === "SVG_REMOVE"
        ) {

            if (
                svg.parentNode
            ) {

                svg.parentNode
                    .removeChild(
                        svg
                    );
            }

            return;
        }

    } catch (e) {}
}


/* ============================================================
 ITERATOR
============================================================ */

function executeIterator(op)
{
    var root =
        document.getElementById(
            "root"
        );

    try {

        if (
            op.t === "TRAVERSE_BEGIN"
        ) {

            state.traversalLength =
                root.childNodes.length;

            return;
        }

        if (
            op.t === "TRAVERSE_CALLBACK"
        ) {

            var event =
                document.createEvent(
                    "Event"
                );

            event.initEvent(
                "v21-traverse",
                true,
                true
            );

            root.dispatchEvent(
                event
            );

            return;
        }

        if (
            op.t === "COLLECTION_ADD"
        ) {

            root.appendChild(
                document.createElement(
                    "div"
                )
            );

            return;
        }

        if (
            op.t === "COLLECTION_REMOVE"
        ) {

            if (
                root.firstChild
            ) {

                root.removeChild(
                    root.firstChild
                );
            }

            return;
        }

        if (
            op.t === "TRAVERSE_CONTINUE"
        ) {

            var length =
                root.childNodes.length;

            var i;

            for (
                i = 0;
                i < length;
                i++
            ) {

                var child =
                    root.childNodes[i];

                if (child) {

                    void child.nodeName;

                    if (
                        i === 0
                    ) {

                        child.appendChild(
                            document.createElement(
                                "span"
                            )
                        );
                    }
                }
            }

            return;
        }

    } catch (e) {}
}


/* ============================================================
 HISTORY
============================================================ */

function executeHistory(op)
{
    try {

        if (
            op.t === "HISTORY_PUSH"
        ) {

            if (
                history.pushState
            ) {

                history.pushState(
                    {
                        v:
                            integer(
                                100000
                            )
                    },
                    "",
                    location.href
                );
            }

            return;
        }

        if (
            op.t === "HISTORY_LISTENER"
        ) {

            window.addEventListener(
                "popstate",
                function () {

                    try {

                        document
                            .getElementById(
                                "root"
                            )
                            .appendChild(
                                document
                                    .createElement(
                                        "div"
                                    )
                            );

                    } catch (e) {}

                },
                false
            );

            return;
        }

        if (
            op.t === "HISTORY_FRAME"
        ) {

            var frame =
                document.createElement(
                    "iframe"
                );

            frame.src =
                "about:blank";

            frame.width =
                "4";

            frame.height =
                "4";

            document
                .getElementById(
                    "root"
                )
                .appendChild(
                    frame
                );

            state.frames.history =
                frame;

            return;
        }

        if (
            op.t === "HISTORY_MUTATE"
        ) {

            document
                .getElementById(
                    "root"
                )
                .appendChild(
                    document.createElement(
                        "div"
                    )
                );

            return;
        }

        if (
            op.t === "HISTORY_BACK"
        ) {

            if (
                history.back
            )
                history.back();

            return;
        }

        if (
            op.t === "HISTORY_REMOVE_FRAME"
        ) {

            var frame2 =
                state.frames.history;

            if (
                frame2 &&
                frame2.parentNode
            ) {

                frame2.parentNode
                    .removeChild(
                        frame2
                    );
            }

            return;
        }

        if (
            op.t === "HISTORY_CONTINUE"
        ) {

            void document
                .documentElement
                .offsetWidth;

            return;
        }

    } catch (e) {}
}


/* ============================================================
 PARSER
============================================================ */

function executeParser(op)
{
    var root =
        document.getElementById(
            "root"
        );

    try {

        if (
            op.t === "PARSE"
        ) {

            root.innerHTML =
                "<div>" +
                "<span>V21</span>" +
                "<input type='text'>" +
                "</div>";

            return;
        }

        if (
            op.t === "PARSE_STYLE"
        ) {

            var divs =
                root.getElementsByTagName(
                    "div"
                );

            if (
                divs.length
            ) {

                divs[0].style.cssText =
                    "display:block;" +
                    "position:relative;" +
                    "width:80px;" +
                    "height:30px;";
            }

            return;
        }

        if (
            op.t === "PARSE_LAYOUT"
        ) {

            void root.offsetWidth;

            root.getBoundingClientRect();

            return;
        }

        if (
            op.t === "PARSE_MUTATE"
        ) {

            root.innerHTML +=
                "<span>" +
                integer(
                    100000
                ) +
                "</span>";

            return;
        }

        if (
            op.t === "PARSE_REMOVE"
        ) {

            if (
                root.lastChild
            ) {

                root.removeChild(
                    root.lastChild
                );
            }

            return;
        }

    } catch (e) {}
}


/* ============================================================
 GENERIC EXECUTION
============================================================ */

function execute(op)
{
    if (!op)
        return;

    if (
        op.t.indexOf(
            "FRAME_"
        ) === 0
    ) {

        executeFrame(op);
        return;
    }

    if (
        op.t.indexOf(
            "SVG_"
        ) === 0
    ) {

        executeSVG(op);
        return;
    }

    if (
        op.t.indexOf(
            "HISTORY_"
        ) === 0
    ) {

        executeHistory(op);
        return;
    }

    if (
        op.t.indexOf(
            "PARSE"
        ) === 0
    ) {

        executeParser(op);
        return;
    }

    if (
        op.t === "TRAVERSE_BEGIN" ||
        op.t === "TRAVERSE_CALLBACK" ||
        op.t === "COLLECTION_ADD" ||
        op.t === "COLLECTION_REMOVE" ||
        op.t === "TRAVERSE_CONTINUE"
    ) {

        executeIterator(op);
        return;
    }

    if (
        op.t === "DOCUMENT_LAYOUT"
    ) {

        try {

            void document
                .documentElement
                .offsetWidth;

            document
                .documentElement
                .getBoundingClientRect();

        } catch (e) {}

        return;
    }

    executeDOM(op);
}


/* ============================================================
 BUILD CASE
============================================================ */

function buildCase()
{
    state.layers =
        [];

    var builder =
        pick(
            PATTERNS
        );

    var sequence =
        builder();

    if (
        random() < 0.80
    ) {

        sequence =
            mutateSequence(
                sequence
            );
    }

    if (
        random() < 0.30 &&
        sequence.length <
        CONFIG.maxOperations - 3
    ) {

        sequence =
            mutateSequence(
                sequence
            );
    }

    while (
        sequence.length >
        CONFIG.maxOperations
    ) {

        sequence.pop();
    }

    return sequence;
}


/* ============================================================
 EXECUTE CASE
============================================================ */

function executeCase(
    sequence,
    finished
)
{
    resetDOM();

    state.sequence =
        sequence;

    state.index =
        0;

    /*
     * IMPORTANT:
     * Save BEFORE executing every operation.
     *
     * If the browser disappears during execute(),
     * the last checkpoint identifies the operation
     * that was about to execute.
     */

    function next()
    {
        if (
            state.index >=
            state.sequence.length
        ) {

            setTimeout(
                finished,
                CONFIG.asyncDelay
            );

            return;
        }

        checkpoint();

        var operation =
            state.sequence[
                state.index
            ];

        execute(
            operation
        );

        state.index++;

        setTimeout(
            next,
            CONFIG.operationDelay
        );
    }

    next();
}


/* ============================================================
 FUZZ LOOP
============================================================ */

function start()
{
    if (
        state.running
    )
        return;

    state.running =
        true;

    setStatus(
        "RUNNING"
    );

    function nextCase()
    {
        if (
            !state.running
        )
            return;

        state.caseId++;

        state.seed =
            newSeed();

        setSeed(
            state.seed
        );

        var sequence =
            buildCase();

        /*
         * Persist the complete case BEFORE execution.
         */

        state.sequence =
            sequence;

        state.index =
            0;

        checkpoint();

        executeCase(
            sequence,
            function () {

                setTimeout(
                    nextCase,
                    CONFIG.caseDelay
                );

            }
        );
    }

    nextCase();
}


/* ============================================================
 RECOVERY
============================================================ */

var previousCase =
    loadCase();

if (
    previousCase
) {

    var recovery =
        document.getElementById(
            "recovery"
        );

    recovery.style.display =
        "block";

    recovery.textContent =
        "LAST CASE: " +
        previousCase.caseId +
        " | " +
        previousCase.pattern +
        " | seed=" +
        previousCase.seed +
        " | operation=" +
        previousCase.index +
        "/" +
        previousCase.sequence.length;
}


/* ============================================================
 START BUTTON
============================================================ */

document
    .getElementById(
        "start"
    )
    .addEventListener(
        "click",
        function () {

            start();

        },
        false
    );


})();
</script>
