<script>
(function () {
"use strict";


/*
 * ============================================================
 * CONFIGURAÇÃO
 * ============================================================
 */

var CONFIG = {
    delay: 40,
    batchSize: 1,
    maxHistoryEntries: 20,
    maxNodesPerCase: 12,
    maxIterationsBeforeYield: 50
};


/*
 * ============================================================
 * ESTADO
 * ============================================================
 */

var state = {
    running: false,
    sequence: 0,
    currentSurface: "",
    currentCandidate: null,
    capabilities: {},
    observers: [],

};


var sandbox = document.getElementById("sandbox");
var statusElement = document.getElementById("status");
var infoElement = document.getElementById("info");
var startButton = document.getElementById("startButton");


/*
 * ============================================================
 * RANDOM
 * ============================================================
 */

function rand(max) {
    return Math.floor(Math.random() * max);
}

function choose(array) {
    if (!array || !array.length)
        return null;

    return array[rand(array.length)];
}


/*
 * ============================================================
 * PERSISTÊNCIA
 * ============================================================
 */

function saveCandidate(candidate) {
    try {
        localStorage.setItem(
            "ps4_webcore_v25_last_candidate",
            JSON.stringify(candidate)
        );
    } catch (e) {
    }
}


function loadLastCandidate() {
    try {
        var data = localStorage.getItem(
            "ps4_webcore_v25_last_candidate"
        );

        if (data)
            return JSON.parse(data);

    } catch (e) {
    }

    return null;
}


/*
 * ============================================================
 * CAPABILITY DETECTION
 * ============================================================
 */

function detectCapabilities() {

    var c = {};

    c.DOM =
        !!document.createElement &&
        !!document.createDocumentFragment;

    c.Events =
        !!window.Event &&
        !!document.addEventListener;

    c.Focus =
        !!HTMLElement.prototype.focus;

    c.Selection =
        !!window.getSelection;

    c.Range =
        !!window.Range;

    c.MutationObserver =
        !!window.MutationObserver;

    c.ResizeObserver =
        !!window.ResizeObserver;

    c.IntersectionObserver =
        !!window.IntersectionObserver;

    c.PerformanceObserver =
        !!window.PerformanceObserver;

    c.CSS =
        !!window.getComputedStyle;

    c.CSSStyleSheet =
        !!window.CSSStyleSheet;

    c.DOMParser =
        !!window.DOMParser;

    c.XMLSerializer =
        !!window.XMLSerializer;

    c.SVG =
        !!document.createElementNS;

    c.Canvas2D =
        !!document.createElement("canvas").getContext;

    c.History =
        !!window.history &&
        !!history.pushState;

    c.Animation =
        !!window.Animation ||
        !!HTMLElement.prototype.animate;

    c.Fonts =
        !!document.fonts;

    c.Image =
        !!window.Image;

    c.ImageBitmap =
        !!window.createImageBitmap;

    c.Fetch =
        !!window.fetch;

    c.Blob =
        !!window.Blob;

    c.FileReader =
        !!window.FileReader;

    c.URL =
        !!window.URL;

    c.ReadableStream =
        !!window.ReadableStream;

    c.TransformStream =
        !!window.TransformStream;

    c.WebSocket =
        !!window.WebSocket;

    c.Worker =
        !!window.Worker;

    c.SharedWorker =
        !!window.SharedWorker;

    c.MessageChannel =
        !!window.MessageChannel;

    c.BroadcastChannel =
        !!window.BroadcastChannel;

    c.DataTransfer =
        !!window.DataTransfer;

    c.HTMLForms =
        !!window.HTMLFormElement;

    c.Template =
        "content" in document.createElement("template");

    c.Text =
        !!window.Text;

    c.CharacterData =
        !!window.CharacterData;

    return c;
}


/*
 * ============================================================
 * SANDBOX
 * ============================================================
 */

function createRoot() {

    var root = document.createElement("div");

    root.style.position = "relative";
    root.style.width = (100 + rand(500)) + "px";
    root.style.height = (50 + rand(300)) + "px";
    root.style.overflow = choose([
        "visible",
        "hidden",
        "scroll",
        "auto"
    ]);

    sandbox.appendChild(root);

    return root;
}


function destroyRoot(root) {

    try {

        if (root && root.parentNode)
            root.parentNode.removeChild(root);

    } catch (e) {
    }
}


/*
 * ============================================================
 * ELEMENT FACTORY
 * ============================================================
 */

function createRandomElement() {

    var tags = [
        "div",
        "span",
        "p",
        "section",
        "article",
        "button",
        "input",
        "textarea",
        "select",
        "option",
        "table",
        "tbody",
        "tr",
        "td",
        "canvas",
        "iframe"
    ];

    var tag = choose(tags);

    var element = document.createElement(tag);

    element.className = "v25_" + rand(1000000);

    element.textContent =
        "node_" + rand(1000000);

    if (tag === "input") {
        element.type = choose([
            "text",
            "number",
            "checkbox",
            "range"
        ]);
    }

    if (tag === "iframe") {
        element.src = "about:blank";
        element.className = "hidden-frame";
    }

    return element;
}


/*
 * ============================================================
 * DOM
 * ============================================================
 */

function opDOM(root) {

    var parent = root;
    var nodes = [];

    var count = 2 + rand(CONFIG.maxNodesPerCase);

    for (var i = 0; i < count; i++) {

        var node = createRandomElement();

        nodes.push(node);

        if (rand(2)) {
            parent.appendChild(node);
            parent = node;
        } else {
            root.appendChild(node);
        }
    }

    if (nodes.length) {

        var victim = choose(nodes);

        try {
            if (victim.parentNode)
                victim.parentNode.removeChild(victim);
        } catch (e) {
        }

        try {
            root.appendChild(victim);
        } catch (e2) {
        }
    }
}


/*
 * ============================================================
 * DOCUMENT FRAGMENT
 * ============================================================
 */

function opFragment(root) {

    var fragment =
        document.createDocumentFragment();

    var nodes = [];

    for (var i = 0; i < 3 + rand(8); i++) {

        var node = createRandomElement();

        nodes.push(node);

        fragment.appendChild(node);
    }

    root.appendChild(fragment);

    if (nodes.length && rand(2)) {

        var victim = choose(nodes);

        try {
            root.removeChild(victim);
        } catch (e) {
        }
    }
}


/*
 * ============================================================
 * TEMPLATE / PARSER
 * ============================================================
 */

function opTemplate(root) {

    if (!state.capabilities.Template)
        return;

    var template =
        document.createElement("template");

    template.innerHTML =
        "<div><span>A</span><b>B</b><i>C</i></div>";

    var clone =
        document.importNode(template.content, true);

    root.appendChild(clone);

    if (rand(2)) {

        try {
            template.innerHTML =
                "<section><input><textarea></textarea></section>";
        } catch (e) {
        }
    }
}


/*
 * ============================================================
 * DOMPARSER / XML
 * ============================================================
 */

function opParser(root) {

    if (!state.capabilities.DOMParser)
        return;

    var parser = new DOMParser();

    var doc = parser.parseFromString(
        "<div><span>x</span><p>y</p></div>",
        "text/html"
    );

    if (doc && doc.body) {

        var imported =
            document.importNode(doc.body, true);

        root.appendChild(imported);
    }
}


function opXML(root) {

    if (!state.capabilities.XMLSerializer)
        return;

    var serializer = new XMLSerializer();

    try {
        var text = serializer.serializeToString(root);

        if (text.length > 0 && rand(2)) {
            root.setAttribute(
                "data-v25",
                String(text.length)
            );
        }
    } catch (e) {
    }
}


/*
 * ============================================================
 * EVENTS
 * ============================================================
 */

function opEvents(root) {

    var target =
        document.createElement("button");

    root.appendChild(target);

    function handler() {

        if (rand(2)) {
            try {
                target.parentNode.removeChild(target);
            } catch (e) {
            }
        }

        if (rand(2)) {
            try {
                root.appendChild(
                    document.createElement("span")
                );
            } catch (e2) {
            }
        }
    }

    target.addEventListener(
        "click",
        handler
    );

    try {
        target.dispatchEvent(
            new Event("click", {
                bubbles: true
            })
        );
    } catch (e) {
    }

    try {
        target.removeEventListener(
            "click",
            handler
        );
    } catch (e2) {
    }
}


/*
 * ============================================================
 * FOCUS / SELECTION / RANGE
 * ============================================================
 */

function opFocusSelection(root) {

    var input =
        document.createElement("input");

    input.type = "text";
    input.value = "PS4_V25_" + rand(999999);

    root.appendChild(input);

    try {
        input.focus();
    } catch (e) {
    }

    if (state.capabilities.Selection &&
        state.capabilities.Range) {

        try {

            var text =
                document.createTextNode(
                    "selection_" + rand(9999)
                );

            root.appendChild(text);

            var range =
                document.createRange();

            range.selectNodeContents(text);

            var selection =
                window.getSelection();

            selection.removeAllRanges();
            selection.addRange(range);

            if (rand(2)) {

                try {
                    text.parentNode.removeChild(text);
                } catch (e2) {
                }
            }

            selection.removeAllRanges();

        } catch (e3) {
        }
    }

    try {
        input.blur();
    } catch (e4) {
    }
}


/*
 * ============================================================
 * CSS / STYLE
 * ============================================================
 */

function opCSS(root) {

    var node =
        document.createElement("div");

    root.appendChild(node);

    var styles = [
        ["display", "block"],
        ["display", "inline-block"],
        ["position", "absolute"],
        ["position", "relative"],
        ["overflow", "hidden"],
        ["overflow", "scroll"],
        ["float", "left"],
        ["float", "right"],
        ["width", (1 + rand(500)) + "px"],
        ["height", (1 + rand(300)) + "px"]
    ];

    for (var i = 0; i < 4 + rand(6); i++) {

        var entry = choose(styles);

        try {
            node.style.setProperty(
                entry[0],
                entry[1]
            );
        } catch (e) {
        }
    }

    try {
        void node.offsetWidth;
        void node.offsetHeight;
        window.getComputedStyle(node).display;
    } catch (e2) {
    }

    if (rand(2)) {

        try {
            node.style.cssText = "";
        } catch (e3) {
        }
    }
}


/*
 * ============================================================
 * LAYOUT
 * ============================================================
 */

function opLayout(root) {

    var outer =
        document.createElement("div");

    var inner =
        document.createElement("div");

    outer.style.position =
        choose([
            "relative",
            "absolute"
        ]);

    inner.style.display =
        choose([
            "block",
            "inline-block",
            "table"
        ]);

    inner.style.width =
        (10 + rand(500)) + "px";

    inner.style.height =
        (10 + rand(500)) + "px";

    outer.appendChild(inner);
    root.appendChild(outer);

    try {
        void outer.offsetWidth;
        void outer.offsetHeight;

        inner.style.width =
            (10 + rand(500)) + "px";

        void inner.offsetWidth;

    } catch (e) {
    }
}


/*
 * ============================================================
 * SVG
 * ============================================================
 */

function opSVG(root) {

    if (!state.capabilities.SVG)
        return;

    var ns =
        "http://www.w3.org/2000/svg";

    var svg =
        document.createElementNS(ns, "svg");

    var rect =
        document.createElementNS(ns, "rect");

    svg.setAttribute("width", "200");
    svg.setAttribute("height", "100");

    rect.setAttribute("x", "10");
    rect.setAttribute("y", "10");
    rect.setAttribute("width", "80");
    rect.setAttribute("height", "50");

    svg.appendChild(rect);
    root.appendChild(svg);

    try {

        rect.setAttribute(
            "width",
            String(10 + rand(150))
        );

            rect.getBoundingClientRect();

    } catch (e) {
    }

    if (rand(2)) {

        try {
            svg.removeChild(rect);
        } catch (e2) {
        }
    }
}


/*
 * ============================================================
 * FORMS
 * ============================================================
 */

function opForms(root) {

    var form =
        document.createElement("form");

    var input =
        document.createElement("input");

    var select =
        document.createElement("select");

    var option =
        document.createElement("option");

    option.textContent = "A";

    select.appendChild(option);

    form.appendChild(input);
    form.appendChild(select);

    root.appendChild(form);

    try {
        input.value = "x" + rand(99999);
        input.focus();

    } catch (e) {
    }

    if (rand(2)) {

        } catch (e2) {

    try {

}


/*
 * ============================================================

 */

function opHistory(root) {

    if (!state.capabilities.History)
        return;

    try {

        history.pushState(
            {
                v25: state.sequence,
                value: rand(999999)
            },
            "",
            "#v25_" + state.sequence
        );

    } catch (e) {
    }
}


/*
 * ============================================================
 * ANIMATION
 * ============================================================
 */

function opAnimation(root) {

    var node =
        document.createElement("div");

    node.style.width = "20px";
    node.style.height = "20px";

    root.appendChild(node);

    if (node.animate) {

        try {

            var animation =
                node.animate(
                    [
                        {
                            transform:
                                "translateX(0px)"
                        },
                        {
                            transform:
                                "translateX(10px)"
                        }
                    ],
                    {
                        duration: 20
                    }
                );

            if (rand(2))
                animation.cancel();

        } catch (e) {
        }
    }
}


/*
 * ============================================================
 * MUTATION OBSERVER
 * ============================================================
 */

function opMutationObserver(root) {

    if (!state.capabilities.MutationObserver)
        return;

    var observer =
        new MutationObserver(function () {

            try {

                if (rand(3) === 0 &&
                    root.firstChild) {

                    root.removeChild(
                        root.firstChild
                    );
                }

            } catch (e) {
            }
        });

    try {

        observer.observe(root, {
            childList: true,
            subtree: true,
            attributes: true
        });

        var node =
            document.createElement("div");

        root.appendChild(node);

        node.setAttribute(
            "data-x",
            String(rand(999))
        );

        if (rand(2))
            root.removeChild(node);

    } catch (e2) {
    }

    try {
        observer.disconnect();
    } catch (e3) {
    }
}


/*
 * ============================================================
 * RESIZE OBSERVER
 * ============================================================

function opResizeObserver(root) {

    if (!state.capabilities.ResizeObserver)
        return;

    var node =
        document.createElement("div");

    root.appendChild(node);

    try {

        var observer =
            new ResizeObserver(function () {

                try {
                    void node.offsetWidth;
                } catch (e) {
                }
            });

        observer.observe(node);

        node.style.width =
            (20 + rand(200)) + "px";

        node.style.height =
            (20 + rand(200)) + "px";

        observer.disconnect();

    } catch (e2) {
    }
}


/*
 * ============================================================
 * INTERSECTION OBSERVER

function opIntersectionObserver(root) {

    if (!state.capabilities.IntersectionObserver)

    var node =

    node.style.width = "30px";
    node.style.height = "30px";

    root.appendChild(node);

    try {

        var observer =
            new IntersectionObserver(function () {

                try {
                    node.getBoundingClientRect();
                } catch (e) {
                }

        observer.disconnect();

}

    var canvas =

}

function opText(root) {

    var text =
        document.createTextNode(
            "AAAA_" + rand(999999)
        );

    root.appendChild(text);

    try {

function opBlob(root) {

function opStreams(root) {

    if (!state.capabilities.ReadableStream)

        reader.read().then(
            function () {
                try {

function opMessageChannel(root) {

    if (!state.capabilities.MessageChannel)

    try {

        channel.port2.postMessage(

    frame.src = "about:blank";

/*
 * ============================================================
 * OPERAÇÕES DISPONÍVEIS
 * ============================================================
 */

function buildOperations() {

    var operations = [];

    function add(name, capability, fn) {

        if (capability)
            operations.push({
                name: name,
                run: fn
            });
    }

    add(
        "DOM",
        state.capabilities.DOM,
        opDOM
    );

    add(
        "Fragment",
        state.capabilities.DOM,
        opFragment
    );

    add(

    );

    );

    );

    add(

        state.capabilities.SVG,

    );

    add(
        "Forms",
        state.capabilities.HTMLForms,

    );

    add(
        "History",
        state.capabilities.History,
        opHistory
    );

    add(
        "Animation",
        state.capabilities.Animation,
        opAnimation
    );

    add(
        "MutationObserver",
        state.capabilities.MutationObserver,
        opMutationObserver
    );

    add(
        "ResizeObserver",
        state.capabilities.ResizeObserver,
        opResizeObserver
    );

    add(
        "IntersectionObserver",
        state.capabilities.IntersectionObserver,
        opIntersectionObserver
    );

    add(
        "Canvas2D",
        state.capabilities.Canvas2D,
        opCanvas
    );

    add(
        "Text",
        state.capabilities.Text,
        opText
    );

    add(
        "Blob",
        state.capabilities.Blob,
        opBlob
    );

    add(
        "Streams",
        state.capabilities.ReadableStream,
        opStreams
    );

    add(
        "MessageChannel",
        state.capabilities.MessageChannel,
        opMessageChannel
    );

    add(
        "DataTransfer",
        state.capabilities.DataTransfer,
        opDataTransfer
    );

    add(
        "Frame",
        true,
        opFrame
    );

    return operations;
}


/*
 * ============================================================
 * CANDIDATE GENERATOR
 * ============================================================
 */

function generateCandidate(operations) {

    var length =
        2 + rand(5);

    var sequence = [];

    for (var i = 0; i < length; i++) {

        var operation =
            choose(operations);

        if (operation)
            sequence.push(operation);
    }

    return sequence;
}


/*
 * ============================================================
 * EXECUÇÃO
 * ============================================================
 */

function executeCandidate(candidate) {

    var root = createRoot();

    for (
        var i = 0;
        i < candidate.length;
        i++
    ) {

        try {
            candidate[i].run(root);
        } catch (e) {
        }
    }

    /*
     * Pequeno ponto de sincronização de layout.
     */

    try {
        void root.offsetWidth;
        void root.offsetHeight;
    } catch (e2) {
    }

    destroyRoot(root);
}


/*
 * ============================================================
 * LOOP PRINCIPAL
 * ============================================================
 */

function runNext() {

    if (!state.running)
        return;

    state.sequence++;

    var operations =
        buildOperations();

    var candidate =
        generateCandidate(operations);

    var names = [];

    for (var i = 0; i < candidate.length; i++)
        names.push(candidate[i].name);

    var record = {
        version: "V25",
        id: state.sequence,
        timestamp: Date.now(),
        operations: names
    };

    /*
     * CRÍTICO:
     * salva ANTES da execução.
     */

    saveCandidate(record);

    state.currentCandidate = record;

    state.currentSurface =
        names.join(" -> ");

    statusElement.textContent =
        "STATUS: RUNNING";

    infoElement.textContent =
        "Sequence #" +
        state.sequence +
        " | " +
        state.currentSurface;

    try {
        executeCandidate(candidate);
    } catch (e) {
    }

    setTimeout(
        runNext,
        CONFIG.delay
    );
}


/*
 * ============================================================
 * START
 * ============================================================
 */

function start() {

    if (state.running)
        return;

    state.capabilities =
        detectCapabilities();

    state.running = true;

    startButton.style.display =
        "none";

    var count = 0;

    for (var key in state.capabilities) {
        if (state.capabilities[key])
            count++;
    }

    statusElement.textContent =
        "STATUS: INITIALIZING";

    infoElement.textContent =
        "Capabilities enabled: " + count;

    setTimeout(
        runNext,
        500
    );
}


startButton.addEventListener(
    "click",
    start
);


/*
 * ============================================================
 * RECUPERAÇÃO VISUAL DO ÚLTIMO CANDIDATO
 * ============================================================
 */

var last =
    loadLastCandidate();

if (last) {

    infoElement.textContent =
        "Last saved candidate #" +
        last.id +
        " | " +
        last.operations.join(" -> ");
}

})();
</script>
