<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>PS4 13.52 - WebCore Capability Matrix V24</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #101010;
    color: #ddd;
    font-family: Arial, sans-serif;
}

}

}

#summary,

    background: #222;
}

    font-weight: bold;
}

.exposed {
    font-weight: bold;
}

.partial {

}

}

    font-weight: bold;

    background: #202020;
    font-weight: bold;
}

    margin-top: 10px;
    display: none;
}
</style>
</head>

<body>

<button id="run">RUN V24 MATRIX</button>
<button id="clear">CLEAR</button>
<button id="export">EXPORT JSON</button>

<div id="status">
READY
</div>

<div id="scope">
Target: PS4 13.52<br>
Mode: capability mapping only<br>
Excluded: JavaScriptCore / JavaScript / WebAssembly / Linux / tooling / deprecated
</div>

<div id="summary">
No tests executed.
</div>

<table id="matrix">
<thead>
<tr>
    <th>Component</th>
    <th>Surface</th>
    <th>Status</th>
    <th>Probe</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>
(function () {

"use strict";

/*
================================================================
 PS4 13.52 WebCore Capability Matrix V24
================================================================

 PURPOSE
 -------
 Empirically map WebCore/browser capabilities exposed by the
 target browser.

 This is NOT a fuzzer.

 No:
   - large allocations
   - worker storms
   - resource exhaustion
   - navigation loops
   - crash stress
   - exploit primitives

 STATUS
 ------
 FUNCTIONAL
     Interface exists and representative operation succeeded.

 EXPOSED
     Interface exists, but only exposure was verified.

 PARTIAL
     Interface exists, but the representative operation could
     not be completely validated.

 UNSUPPORTED
     Tested interface is not exposed.

 ERROR
     Probe generated an unexpected exception.

 IMPORTANT
 ---------
 Presence of a Web API does not prove that every internal
 WebCore component is compiled/enabled.

 Likewise, absence of a Web API does not prove that every
 related internal WebCore implementation is absent.
================================================================
*/


var STORAGE_KEY =
    "PS4_1352_WEBCORE_MATRIX_V24";


var results = [];

var running = false;

var tbody =
    document.querySelector(
        "#matrix tbody"
    );

var statusElement =
    document.getElementById(
        "status"
    );

var summaryElement =
    document.getElementById(
        "summary"
    );

var exportButton =
    document.getElementById(
        "export"
    );


/*
================================================================
 CORE
================================================================
*/

function statusText(text)
{
    statusElement.textContent = text;
}


function save()
{
    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({
                version: "V24",
                target: "PS4 13.52",
                timestamp: Date.now(),
                results: results
            })
        );

    } catch (e) {}
}


function add(
    component,
    surface,
    status,
    probe
)
{
    var item = {
        component: component,
        surface: surface,
        status: status,
        probe: probe
    };

    results.push(item);

    render(item);

    save();

    updateSummary();
}


function render(item)
{
    var tr =
        document.createElement("tr");

    var td1 =
        document.createElement("td");

    var td2 =
        document.createElement("td");

    var td3 =
        document.createElement("td");

    var td4 =
        document.createElement("td");

    td1.textContent =
        item.component;

    td2.textContent =
        item.surface;

    td3.textContent =
        item.status;

    td4.textContent =
        item.probe;

    if (item.status === "FUNCTIONAL")
        td3.className = "functional";

    else if (item.status === "EXPOSED")
        td3.className = "exposed";

    else if (item.status === "PARTIAL")
        td3.className = "partial";

    else if (item.status === "UNSUPPORTED")
        td3.className = "unsupported";

    else
        td3.className = "error";

    tr.appendChild(td1);
    tr.appendChild(td2);
    tr.appendChild(td3);
    tr.appendChild(td4);

    tbody.appendChild(tr);
}


function updateSummary()
{
    var functional = 0;
    var exposed = 0;
    var partial = 0;
    var unsupported = 0;
    var error = 0;

    for (var i = 0; i < results.length; i++) {

        switch (results[i].status) {

        case "FUNCTIONAL":
            functional++;
            break;

        case "EXPOSED":
            exposed++;
            break;

        case "PARTIAL":
            partial++;
            break;

        case "UNSUPPORTED":
            unsupported++;
            break;

        default:
            error++;
            break;
        }
    }

    summaryElement.textContent =
        "TOTAL " + results.length +
        " | FUNCTIONAL " + functional +
        " | EXPOSED " + exposed +
        " | PARTIAL " + partial +
        " | UNSUPPORTED " + unsupported +
        " | ERROR " + error;

    exportButton.style.display =
        results.length ?
        "inline-block" :
        "none";
}


function globalProbe(
    component,
    surface,
    name
)
{
    var exists =
        typeof window[name] !== "undefined";

    add(
        component,
        surface,
        exists ?
            "EXPOSED" :
            "UNSUPPORTED",
        "window." + name
    );
}


function functionProbe(
    component,
    surface,
    name
)
{
    var exists =
        typeof window[name] === "function";

    add(
        component,
        surface,
        exists ?
            "EXPOSED" :
            "UNSUPPORTED",
        name + " function"
    );
}


function runProbe(
    component,
    surface,
    description,
    fn
)
{
    try {

        var result = fn();

        add(
            component,
            surface,
            result === true ?
                "FUNCTIONAL" :
                result === false ?
                "PARTIAL" :
                "EXPOSED",
            description
        );

    } catch (e) {

        add(
            component,
            surface,
            "ERROR",
            description
        );
    }
}


/*
================================================================
 DOM
================================================================
*/

function testDOM()
{
    var c = "DOM";

    runProbe(
        c,
        "Node",
        "createElement + appendChild",
        function () {

            var a =
                document.createElement("div");

            var b =
                document.createElement("span");

            a.appendChild(b);

            return a.firstChild === b;
        }
    );


    runProbe(
        c,
        "DocumentFragment",
        "fragment append/remove",
        function () {

            var f =
                document.createDocumentFragment();

            var d =
                document.createElement("div");

            f.appendChild(d);

            return f.firstChild === d;
        }
    );


    runProbe(
        c,
        "TreeWalker",
        "createTreeWalker",
        function () {

            if (!document.createTreeWalker)
                return false;

            var w =
                document.createTreeWalker(
                    document.body,
                    1,
                    null,
                    false
                );

            return !!w;
        }
    );


    runProbe(
        c,
        "NodeIterator",
        "createNodeIterator",
        function () {

            if (!document.createNodeIterator)
                return false;

            var n =
                document.createNodeIterator(
                    document.body,
                    1,
                    null,
                    false
                );

            return !!n;
        }
    );


    runProbe(
        c,
        "HTMLCollection",
        "getElementsByTagName",
        function () {

            var d =
                document.createElement("div");

            d.innerHTML =
                "<span></span><span></span>";

            return
                d.getElementsByTagName(
                    "span"
                ).length === 2;
        }
    );


    runProbe(
        c,
        "NodeList",
        "querySelectorAll",
        function () {

            var d =
                document.createElement("div");

            d.innerHTML =
                "<span></span><span></span>";

            return
                d.querySelectorAll(
                    "span"
                ).length === 2;
        }
    );


    globalProbe(
        c,
        "DOMTokenList",
        "DOMTokenList"
    );


    globalProbe(
        c,
        "NamedNodeMap",
        "NamedNodeMap"
    );


    globalProbe(
        c,
        "MutationObserver",
        "MutationObserver"
    );


    globalProbe(
        c,
        "DOMParser",
        "DOMParser"
    );


    globalProbe(
        c,
        "XMLSerializer",
        "XMLSerializer"
    );


    globalProbe(
        c,
        "Range",
        "Range"
    );


    globalProbe(
        c,
        "Selection",
        "Selection"
    );


    globalProbe(
        c,
        "CustomEvent",
        "CustomEvent"
    );


    globalProbe(
        c,
        "EventTarget",
        "EventTarget"
    );
}


/*
================================================================
 SHADOW DOM / TREE SCOPE
================================================================
*/

function testShadow()
{
    var c = "DOM/Shadow";

    runProbe(
        c,
        "ShadowRoot",
        "attachShadow + append",
        function () {

            var host =
                document.createElement("div");

            if (!host.attachShadow)
                return false;

            var root =
                host.attachShadow({
                    mode: "open"
                });

            var span =
                document.createElement("span");

            root.appendChild(span);

            return root.firstChild === span;
        }
    );


    globalProbe(
        c,
        "ShadowRoot",
        "ShadowRoot"
    );


    runProbe(
        c,
        "slot",
        "slot assignment",
        function () {

            var host =
                document.createElement("div");

            if (!host.attachShadow)
                return false;

            var root =
                host.attachShadow({
                    mode: "open"
                });

            var slot =
                document.createElement("slot");

            root.appendChild(slot);

            var child =
                document.createElement("span");

            host.appendChild(child);

            return root.querySelector(
                "slot"
            ) !== null;
        }
    );


    globalProbe(
        c,
        "HTMLSlotElement",
        "HTMLSlotElement"
    );


    globalProbe(
        c,
        "HTMLTemplateElement",
        "HTMLTemplateElement"
    );
}


/*
================================================================
 EVENTS
================================================================
*/

function testEvents()
{
    var c = "Events";

    globalProbe(
        c,
        "Event",
        "Event"
    );

    globalProbe(
        c,
        "UIEvent",
        "UIEvent"
    );

    globalProbe(
        c,
        "MouseEvent",
        "MouseEvent"
    );

    globalProbe(
        c,
        "KeyboardEvent",
        "KeyboardEvent"
    );

    globalProbe(
        c,
        "FocusEvent",
        "FocusEvent"
    );

    globalProbe(
        c,
        "WheelEvent",
        "WheelEvent"
    );

    globalProbe(
        c,
        "DragEvent",
        "DragEvent"
    );

    globalProbe(
        c,
        "PointerEvent",
        "PointerEvent"
    );

    globalProbe(
        c,
        "TouchEvent",
        "TouchEvent"
    );


    runProbe(
        c,
        "dispatch",
        "capture + bubble",
        function () {

            var parent =
                document.createElement("div");

            var child =
                document.createElement("button");

            parent.appendChild(child);

            var capture = false;
            var bubble = false;

            parent.addEventListener(
                "v24",
                function () {
                    capture = true;
                },
                true
            );

            parent.addEventListener(
                "v24",
                function () {
                    bubble = true;
                },
                false
            );

            var e =
                document.createEvent("Event");

            e.initEvent(
                "v24",
                true,
                true
            );

            child.dispatchEvent(e);

            return capture && bubble;
        }
    );


    runProbe(
        c,
        "focus",
        "focus + blur",
        function () {

            var input =
                document.createElement("input");

            document.body.appendChild(input);

            input.focus();
            input.blur();

            input.parentNode.removeChild(input);

            return true;
        }
    );


    runProbe(
        c,
        "Pointer Capture",
        "setPointerCapture presence",
        function () {

            return
                typeof Element.prototype
                    .setPointerCapture ===
                "function";
        }
    );
}


/*
================================================================
 FOCUS / SELECTION / EDITING
================================================================
*/

function testEditing()
{
    var c = "Focus/Selection/Editing";

    globalProbe(
        c,
        "Selection",
        "getSelection"
    );

    globalProbe(
        c,
        "Range",
        "Range"
    );

    globalProbe(
        c,
        "InputEvent",
        "InputEvent"
    );

    globalProbe(
        c,
        "BeforeInputEvent",
        "InputEvent"
    );


    runProbe(
        c,
        "Range",
        "selectNodeContents",
        function () {

            var d =
                document.createElement("div");

            d.textContent = "v24";

            var range =
                document.createRange();

            range.selectNodeContents(d);

            var fragment =
                range.cloneContents();

            return
                fragment.textContent === "v24";
        }
    );


    runProbe(
        c,
        "contenteditable",
        "editing state",
        function () {

            var d =
                document.createElement("div");

            d.contentEditable = "true";

            return
                d.contentEditable === "true";
        }

    runProbe(
        c,
        "execCommand",
        "document.execCommand",
        function () {

            return
                typeof document.execCommand ===
                "function";
        }
    );
}


/*
================================================================
 PAGE / DOCUMENT / FRAME
================================================================
*/

function testPage()
{
    var c = "Page/Document/Frame";

    globalProbe(
        c,
        "Navigator",
        "Navigator"
    );

    globalProbe(
        c,
        "Location",
        "Location"
    );

    globalProbe(
        c,
        "History",
        "History"
    );


    runProbe(
        c,
        "iframe",
        "iframe contentDocument",
        function () {

            var frame =
                document.createElement("iframe");

            frame.src = "about:blank";

            document.body.appendChild(frame);

            var ok =
                !!frame.contentDocument &&
                !!frame.contentWindow;

            frame.parentNode.removeChild(frame);

            return ok;
        }
    );


    runProbe(
        c,
        "nested iframe",
        "frame inside frame",
        function () {

            var outer =
                document.createElement("iframe");

            outer.src = "about:blank";

            document.body.appendChild(outer);

            if (!outer.contentDocument)
                return false;

            var inner =
                outer.contentDocument
                    .createElement("iframe");

            inner.src = "about:blank";

            outer.contentDocument.body
                .appendChild(inner);

            var ok =
                !!inner.contentDocument;

            outer.parentNode.removeChild(outer);

            return ok;
        }
    );


    globalProbe(
        c,
        "Window",
        "Window"
    );

    globalProbe(
        c,
        "WindowProxy",
        "WindowProxy"
    );


    globalProbe(
        c,
        "Page Visibility",
        "onvisibilitychange"
    );


    globalProbe(
        c,
        "beforeunload",
        "onbeforeunload"
    );

    globalProbe(
        c,
        "pagehide",
        "onpagehide"
    );

    globalProbe(
        c,
        "pageshow",
        "onpageshow"
    );
}

/*

 LAYOUT
================================================================

        "display:block;" +
        "position:relative;" +
        "width:120px;" +
        "height:60px;" +
        "overflow:auto;";

    document.body.appendChild(d);


    runProbe(
        c,
        "block formatting",
        "block offset geometry",
        function () {

            return
                d.offsetWidth >= 0 &&
                d.offsetHeight >= 0;
        }
    );


    runProbe(
        c,
        "inline formatting",
        "inline child",
        function () {

            var span =
                document.createElement("span");

            span.textContent = "v24";

            d.appendChild(span);

                span.offsetWidth >= 0;

    runProbe(
        c,

    );

        c,
        "text layout",
        "text geometry",
        function () {

            var span =
                document.createElement("span");

            span.textContent =
                "WebCore V24";

            document.body.appendChild(span);

            var ok =
                span.offsetWidth >= 0;

            span.parentNode.removeChild(span);

            return ok;
        }
    );


    d.parentNode.removeChild(d);
}

/*
================================================================
 RENDERING
================================================================
*/

function testRendering()
{
    var c = "Rendering";

    runProbe(
        c,
        "Render geometry",
        "getBoundingClientRect",
        function () {

            var d =

/*
================================================================
 RUNNER
================================================================
*/

function runMatrix()
{
    if (running)
        return;

    running = true;

    results = [];

    tbody.innerHTML = "";

    var index = 0;


    function next()
    {
        if (index >= TESTS.length) {

            running = false;

            updateSummary();

            save();

            statusText(
                "V24 COMPLETE"
            );

            return;
        }


        statusText(
            "V24 category " +
            (index + 1) +
            " / " +
            TESTS.length
        );


        try {

            TESTS[index]();

        } catch (e) {

            add(
                "Runner",
                "category " + index,
                "ERROR",
                "category execution"
            );
        }


        index++;


        setTimeout(
            next,
            25
        );
    }


    next();
}


/*
================================================================
 RESTORE
================================================================
*/

function restore()
{
    try {

        var raw =
            localStorage.getItem(
                STORAGE_KEY
            );

        if (!raw)
            return;

        var data =
            JSON.parse(raw);

        if (!data.results)
            return;

        results =
            data.results;

        tbody.innerHTML = "";

        for (
            var i = 0;
            i < results.length;
            i++
        ) {

            render(results[i]);
        }

        updateSummary();

        statusText(
            "Previous V24 matrix restored"
        );

    } catch (e) {}
}


/*
================================================================
 CLEAR
================================================================
*/

document.getElementById(
    "clear"
).onclick = function ()
{
    results = [];

    tbody.innerHTML = "";

    try {
        localStorage.removeItem(
            STORAGE_KEY
        );
    } catch (e) {}

    updateSummary();

    statusText("CLEARED");
};


/*
================================================================
 EXPORT
================================================================
*/

exportButton.onclick = function ()
{
    try {

        var json =
            JSON.stringify(
                {
                    version: "V24",
                    target: "PS4 13.52",
                    timestamp: Date.now(),
                    results: results
                },
                null,
                2
            );

        var blob =
            new Blob(
                [json],
                {
                    type:
                        "application/json"
                }
            );

        var url =
            URL.createObjectURL(blob);

        var a =
            document.createElement("a");

        a.href = url;
        a.download =
            "PS4-13.52-WebCore-V24-Matrix.json";

        document.body.appendChild(a);

        a.click();

        document.body.removeChild(a);

        setTimeout(
            function () {
                URL.revokeObjectURL(url);
            },
            1000
        );

    } catch (e) {

        statusText(
            "Export unavailable"
        );
    }
};


/*
================================================================
 START
================================================================
*/

document.getElementById(
    "run"
).onclick =
    runMatrix;


restore();

})();
