<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Teste de Regressão: Use-After-Move em StyleGradientImage (CSS Gradients)</title>
<style>
    .gradient-target {
        width: 200px;
        height: 200px;
    }
</style>
</head>
<body>
<div id="container"></div>
<div id="status">Executando teste...</div>

<script>
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = { i: "ab" + i + (i / 100000) };
        temp += "foo";
        gcRec(n - 1);
    }
    for (var i = 0; i < 1000; i++)
        gcRec(10);
}

function runGradientTest() {
    const container = document.getElementById("container");

    // Tipos variados de gradientes com múltiplas paradas de cor e interpolação
    const gradients = [
        "linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet)",
        "radial-gradient(circle at center, rgba(255,0,0,0.8) 0%, rgba(0,255,0,0.5) 50%, rgba(0,0,255,0.2) 100%)",
        "conic-gradient(from 45deg, red 0deg, yellow 90deg, green 180deg, blue 270deg, red 360deg)",
        "linear-gradient(in oklab, red 0%, blue 100%)",
        "repeating-linear-gradient(45deg, #3f87a6, #ebf8e1 15%, #f69d3c 20%)"
    ];

    for (let cycle = 0; cycle < 100; cycle++) {
        // 1. Cria elementos dinâmicos aplicando gradientes CSS
        for (let i = 0; i < gradients.length; i++) {
            const div = document.createElement("div");
            div.className = "gradient-target";
            div.style.backgroundImage = gradients[i];
            container.appendChild(div);
        }

        // 2. Força o cálculo de estilo computado e layout para instanciar StyleGradientImage
        container.getBoundingClientRect();

        // 3. Modifica os gradientes inline para disparar novas criações de StyleGradientImage
        for (const child of container.children) {
            child.style.backgroundImage = `linear-gradient(to bottom, rgb(${cycle % 255}, 0, 0), blue)`;
        }
        container.getBoundingClientRect();

        // 4. Limpa e força GC
        container.innerHTML = "";

        if (cycle % 10 === 0) {
            gc();
        }
    }
}

try {
    runGradientTest();
    document.getElementById("status").innerText = "PASS: Instanciação de StyleGradientImage executada sem Use-After-Move.";
} catch (e) {
    document.getElementById("status").innerText = "FAIL: " + e.message;
}
</script>
</body>
</html>
