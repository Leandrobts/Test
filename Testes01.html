<!DOCTYPE html>
<html>
<body>
    <p>This test passes does not crash.</p>
<iframe id="frame_a" loading="lazy"></iframe>
<iframe id="frame_b" srcdoc="b"></iframe>
<div id="container" tabindex="0" autofocus></div>
<div id="log"></div>
<script>
const logEl = document.getElementById("log");
let visit = localStorage.getItem("visit") || "0";
localStorage.setItem("visit", String(parseInt(visit) + 1));

const op = () => {
    logEl.textContent += visit + "\n"; // SEM scrollHeight
};

let frame = document.getElementById("frame_a");
op(); op();

addEventListener("load", () => {
    op();
    frame.srcdoc = "a";
    
    op();
    frame.contentWindow?.addEventListener("blur", () => {});
    frame.focus();
    op();
});

container.onfocusin = () => {
    document.body.innerHTML = "";
};
</script>
</body>
</html>
