<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<title>Blur Window Shadow Tree Test</title>
</head>
<body><p>This test passes if it does not crash.</p><div id="host"></div>
<div id="result">Preparing...</div><script src="resources/gc.js"></script><script>
var host = document.getElementById("host");
var result = document.getElementById("result");

var shadowRoot = host.attachShadow({
    mode: "open"
});

var victim = document.createElement("div");

victim.tabIndex = 0;
victim.textContent = "Focusable";
victim.style.width = "200px";
victim.style.height = "100px";
victim.style.background = "red";

shadowRoot.appendChild(victim);

victim.focus();

document.addEventListener("blur", function() {

    result.textContent = "BLUR - removing victim";

    if (victim) {
        victim.remove();
        victim = null;
    }

    if (typeof gc == "function")
        gc();

    result.textContent = "BLUR - victim removed";

}, true);

window.addEventListener("focus", function() {
    result.textContent = "WINDOW FOCUS";
});

window.addEventListener("blur", function() {
    result.textContent = "WINDOW BLUR";
});

window.addEventListener("beforeunload", function() {
    if (typeof gc == "function")
        gc();
});

setTimeout(function() {

    if (victim)
        victim.focus();

    result.textContent =
        "Victim focused - waiting for popup blur";

}, 100);
</script></body>
</html>
