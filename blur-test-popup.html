<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<title>Blur Window Shadow Tree Test</title>
</head>
<body><p>This test passes if it does not crash.</p><div id="host"></div>
<div id="result"></div><script src="resources/gc.js"></script><script>
var shadowRoot = host.attachShadow({ mode: "open" });

var victim = document.createElement("div");
victim.tabIndex = 0;
victim.textContent = "Focusable";

shadowRoot.appendChild(victim);

victim.focus();

document.addEventListener("blur", function() {

    if (victim) {
        victim.remove();
        victim = null;
    }

    if (typeof gc == "function")
        gc();

}, true);

window.addEventListener("focus", function() {
    document.getElementById("result").textContent = "FOCUS";
});

window.addEventListener("blur", function() {
    document.getElementById("result").textContent = "BLUR";
});

setTimeout(function() {
    document.getElementById("result").textContent =
        "Victim focused - waiting for window blur";
}, 100);
</script></body>
</html>
