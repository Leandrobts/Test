<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>PS4 14.00 - Diagnostico CSSOM</title>
<style>body{font:16px monospace;background:#111;color:#ddd;padding:16px}pre{white-space:pre-wrap;word-break:break-word}button{font-size:18px;padding:10px;margin:8px 0}</style>
</head>
<body>
<h2>PS4 14.00 - Diagnostico CSSOM</h2>
<button id="run">Executar teste</button>
<pre id="log">Aguardando...</pre>
<script>
(function () {
    var out = document.getElementById('log');
    function log(message) { out.textContent += message + '\n'; }
    function safe(label, fn) {
        try { log(label + ': ' + String(fn())); }
        catch (e) { log(label + ': EXCECAO ' + e.name + ' - ' + e.message); }
    }
    function memoryPressure() {
        var chunks = [];
        for (var i = 0; i < 256; ++i) chunks.push(new Array(1025).join('x'));
        chunks = null;
    }
    document.getElementById('run').onclick = function () {
        out.textContent = '';
        log('Firmware informado: PS4 14.00');
        safe('User agent', function () { return navigator.userAgent; });
        var style = document.createElement('style');
        document.head.appendChild(style);
        var sheet = style.sheet;
        try {
            sheet.insertRule('.outer { color: red; & .nested { color: blue; } }', 0);
            log('Regras na folha antes: ' + sheet.cssRules.length);
            var outer = sheet.cssRules[0];
            safe('Tipo da regra pai', function () { return outer.type; });
            safe('CSS da regra pai', function () { return outer.cssText; });
            var list = outer.cssRules;
            if (!list || !list.length) { log('Sem regras aninhadas expostas; teste encerrado.'); return; }
            var child = list[0];
            var originalParent = child.parentRule;
            safe('Pai inicial igual ao objeto original', function () { return originalParent === outer; });
            safe('CSS da regra filha', function () { return child.cssText; });
            sheet.deleteRule(0);
            log('Regras na folha depois: ' + sheet.cssRules.length);
            safe('Pai apos delete ainda e o original', function () { return child.parentRule === originalParent; });
            safe('CSS do pai apos delete', function () { return child.parentRule && child.parentRule.cssText; });
            safe('Folha associada a filha apos delete', function () { return child.parentStyleSheet; });
            // Soltar as referencias JS diretas, sem tentar desreferenciar memoria invalida.
            outer = null;
            originalParent = null;
            list = null;
            memoryPressure();
            safe('Pai apos pressao de memoria e null', function () { return child.parentRule === null; });
            safe('Tipo do pai apos pressao', function () { return child.parentRule ? child.parentRule.type : 'null'; });
            safe('CSS do pai apos pressao', function () { return child.parentRule ? child.parentRule.cssText : 'null'; });
            log('Fim do diagnostico (nao comprova nem descarta UAF).');
        } catch (e) {
            log('ERRO: ' + e.name + ': ' + e.message);
        }
    };
})();
</script>
</body>
</html>
