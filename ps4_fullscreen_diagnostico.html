<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PS4 - Diagnóstico Fullscreen e Foco</title><style>body{font:16px Arial;background:#151923;color:#eee;padding:16px}button{padding:12px;margin:5px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#080b10;padding:12px}video{max-width:100%;max-height:180px}</style></head><body>
<h2>PS4 - Diagnóstico de foco e Fullscreen</h2><p>Teste seguro de observação: não remove o vídeo durante fullscreen nem tenta provocar travamento.</p><button id="prepare">Preparar vídeo</button><button id="enter">Entrar em fullscreen</button><button id="exit">Sair normalmente</button><button id="clear">Limpar log</button><div id="videoBox"></div><pre id="log"></pre>
<script>
(function(){var v=null,box=document.getElementById('videoBox'),out=document.getElementById('log');
function log(s){out.textContent+=new Date().toLocaleTimeString()+' | '+s+'\n';console.log(s)}
function state(s){log(s+' | focus='+document.hasFocus()+' | visibility='+document.visibilityState+' | displayingFS='+(v?!!v.webkitDisplayingFullscreen:'n/a')+' | connected='+(v?!!v.isConnected:'n/a')+' | documentFS='+!!(document.fullscreenElement||document.webkitFullscreenElement))}
function prepare(){if(v)v.remove();v=document.createElement('video');v.src='teste.mp4';v.controls=true;v.preload='metadata';box.appendChild(v);['webkitbeginfullscreen','webkitendfullscreen','play','pause','error'].forEach(function(t){v.addEventListener(t,function(e){log('VIDEO '+t+' trusted='+e.isTrusted);state('video state')})});state('prepared')}
window.addEventListener('blur',function(e){log('WINDOW blur trusted='+e.isTrusted);state('window blur')},true);
window.addEventListener('focus',function(e){log('WINDOW focus trusted='+e.isTrusted);state('window focus')},true);
document.addEventListener('blur',function(e){log('ELEMENT blur target='+e.target.nodeName+' trusted='+e.isTrusted)},true);
document.addEventListener('visibilitychange',function(){state('visibilitychange')});
['fullscreenchange','webkitfullscreenchange','fullscreenerror','webkitfullscreenerror'].forEach(function(t){document.addEventListener(t,function(e){log(t+' trusted='+e.isTrusted);state(t)})});
document.getElementById('prepare').onclick=prepare;
document.getElementById('enter').onclick=function(){if(!v)prepare();state('before enter');try{var p;if(v.webkitEnterFullscreen)p=v.webkitEnterFullscreen();else if(v.requestFullscreen)p=v.requestFullscreen();else if(v.webkitRequestFullscreen)p=v.webkitRequestFullscreen();else{log('Fullscreen API unavailable');return}log('enter requested');if(p&&p.then)p.then(function(){state('enter resolved')},function(e){log('enter error '+e.name)})}catch(e){log('enter exception '+e.name+': '+e.message)}setTimeout(function(){state('enter +1s')},1000)};
document.getElementById('exit').onclick=function(){state('before exit');try{var p;if(v&&v.webkitDisplayingFullscreen&&v.webkitExitFullscreen)p=v.webkitExitFullscreen();else if(document.exitFullscreen)p=document.exitFullscreen();else if(document.webkitExitFullscreen)p=document.webkitExitFullscreen();else{log('Exit API unavailable');return}log('exit requested');if(p&&p.then)p.then(function(){state('exit resolved')},function(e){log('exit error '+e.name)})}catch(e){log('exit exception '+e.name+': '+e.message)}setTimeout(function(){state('exit +1s')},1000)};
document.getElementById('clear').onclick=function(){out.textContent=''};prepare();log('Ready. Video source: teste.mp4');})();
</script></body></html>
