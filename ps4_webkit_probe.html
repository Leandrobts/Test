<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PS4 WebKit API Probe</title><style>body{font:14px Arial,sans-serif;background:#101827;color:#eef2ff;margin:16px}button{padding:10px;margin:4px;background:#295ba5;color:white;border:0}pre{white-space:pre-wrap;word-wrap:break-word;background:#1d2a3e;padding:12px}h1{font-size:22px}.ok{color:#8fe3ac}.no{color:#ffb4a8}</style></head><body><h1>PS4 WebKit - Diagnostico de APIs</h1><p>Testes conservadores. Nao tenta reproduzir falhas de memoria ou provocar travamentos.</p><button onclick="run()">Executar verificacoes</button><button onclick="audioTest()">Testar audio (clique)</button><button onclick="download()">Exportar JSON</button><pre id="out">Aguardando...</pre><script>
var results={}, lines=[];
function log(s){lines.push(s);document.getElementById('out').textContent=lines.join('\n');}
function record(k,v){results[k]=v;log(k+': '+v);}
function check(k,f){try{record(k,f()?'SIM':'NAO');}catch(e){record(k,'ERRO '+e.name+': '+e.message);}}
function run(){results={};lines=[];record('userAgent',navigator.userAgent);record('date',new Date().toString());
check('WebAssembly',function(){return typeof WebAssembly!=='undefined'});
check('WebAssembly.Memory',function(){return typeof WebAssembly!=='undefined'&&typeof WebAssembly.Memory==='function'});
check('WebAssembly.Memory.grow',function(){return typeof WebAssembly!=='undefined'&&WebAssembly.Memory&&WebAssembly.Memory.prototype&&typeof WebAssembly.Memory.prototype.grow==='function'});
check('AudioContext',function(){return typeof window.AudioContext==='function'});
check('webkitAudioContext',function(){return typeof window.webkitAudioContext==='function'});
check('OfflineAudioContext',function(){return typeof window.OfflineAudioContext==='function'});
check('webkitOfflineAudioContext',function(){return typeof window.webkitOfflineAudioContext==='function'});
check('HTMLAudioElement',function(){return typeof window.Audio==='function'});
check('ArrayBuffer',function(){return typeof ArrayBuffer==='function'});
check('ArrayBuffer.slice',function(){return typeof ArrayBuffer==='function'&&typeof ArrayBuffer.prototype.slice==='function'});
check('ArrayBuffer.transfer',function(){return typeof ArrayBuffer==='function'&&typeof ArrayBuffer.prototype.transfer==='function'});
check('ArrayBuffer.resize',function(){return typeof ArrayBuffer==='function'&&typeof ArrayBuffer.prototype.resize==='function'});
check('Uint8Array',function(){return typeof Uint8Array==='function'});
check('DataView',function(){return typeof DataView==='function'});
check('DataView.setBigUint64',function(){return typeof DataView!=='undefined'&&typeof DataView.prototype.setBigUint64==='function'});
check('BigInt',function(){return typeof BigInt==='function'});
check('Promise',function(){return typeof Promise==='function'});
check('Worker',function(){return typeof Worker==='function'});
check('Blob',function(){return typeof Blob==='function'});
check('URL.createObjectURL',function(){return !!(window.URL&&URL.createObjectURL)});
check('postMessage',function(){return typeof window.postMessage==='function'});
check('structuredClone',function(){return typeof window.structuredClone==='function'});
check('performance.now',function(){return !!(window.performance&&performance.now)});
check('JSON.stringify',function(){return !!(window.JSON&&JSON.stringify)});
try{var b=new ArrayBuffer(16);var d=new DataView(b);d.setUint32(0,0x12345678,false);record('DataView big-endian',new Uint8Array(b)[0]===0x12?'OK':'FALHA');}catch(e){record('DataView big-endian','ERRO '+e.message)}
try{var a=new ArrayBuffer(16);record('ArrayBuffer.maxByteLength','maxByteLength' in a?String(a.maxByteLength):'AUSENTE');record('ArrayBuffer.resizable','resizable' in a?String(a.resizable):'AUSENTE');}catch(e){record('ArrayBuffer properties','ERRO '+e.message)}
try{var C=window.AudioContext||window.webkitAudioContext;if(C){var c=new C();record('decodeAudioData',typeof c.decodeAudioData);record('createBuffer',typeof c.createBuffer);record('sampleRate',c.sampleRate);if(typeof c.close==='function'){var p=c.close();if(p&&typeof p.catch==='function')p.catch(function(){});}}}catch(e){record('AudioContext instantiation','ERRO '+e.name+': '+e.message)}
log('\nNota: presenca de API nao garante que a implementacao tenha o comportamento do commit.');}
function makeWav(){var rate=8000,samples=800,buf=new ArrayBuffer(44+samples*2),v=new DataView(buf);function str(o,s){for(var i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));}str(0,'RIFF');v.setUint32(4,36+samples*2,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,samples*2,true);for(var j=0;j<samples;j++)v.setInt16(44+j*2,Math.round(Math.sin(j*2*Math.PI*440/rate)*2000),true);return buf;}
function audioTest(){var C=window.AudioContext||window.webkitAudioContext;if(!C){record('audio test','SEM AUDIOCONTEXT');return;}try{var c=new C(),done=false;function finish(s){if(done)return;done=true;record('audio decode WAV',s);if(c.close)try{c.close()}catch(e){}}var p=c.decodeAudioData(makeWav(),function(b){finish('OK callbacks; '+b.duration+'s')},function(e){finish('FALHA callback '+(e&&e.message||e))});if(p&&typeof p.then==='function')p.then(function(b){finish('OK promise; '+b.duration+'s')},function(e){finish('FALHA promise '+(e&&e.message||e))});setTimeout(function(){finish('TIMEOUT 5s')},5000);}catch(e){record('audio decode WAV','ERRO '+e.name+': '+e.message)}}
function download(){var data=JSON.stringify(results,null,2);try{var blob=new Blob([data],{type:'application/json'}),url=(window.URL||window.webkitURL).createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ps4-webkit-report.json';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){(window.URL||window.webkitURL).revokeObjectURL(url)},1000);}catch(e){log('Exportacao indisponivel: '+e.message);log(data)}}
run();
</script></body></html>
