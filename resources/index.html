<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PS4 - Diagnostico MIME XML/XSLT</title><style>body{font-family:Arial,sans-serif;background:#f5f5f5;color:#111;padding:12px;font-size:17px}button{font-size:18px;padding:12px;margin:6px 0}pre{white-space:pre-wrap;word-wrap:break-word;background:white;border:1px solid #aaa;padding:12px;font-size:15px}input{font-size:16px;width:96%;padding:6px}</style></head><body><h2>PS4 - Diagnostico MIME XML/XSLT</h2><p>Esta pagina verifica os cabeçalhos HTTP e a declaracao xml-stylesheet. Execute no mesmo dominio do GitHub Pages.</p><button onclick="run()">Executar verificacao</button> <button onclick="copyReport()">Copiar relatorio</button><pre id="out">Aguardando...</pre><script>
var report='';function line(s){report+=s+'\n';document.getElementById('out').textContent=report;}function inspect(path,cb){var xhr=new XMLHttpRequest();try{xhr.open('GET',path+'?mimecheck='+new Date().getTime(),true);xhr.onreadystatechange=function(){if(xhr.readyState===4){line('ARQUIVO: '+path);line('HTTP: '+xhr.status);line('Content-Type: '+(xhr.getResponseHeader('Content-Type')||'(ausente/inacessivel)'));line('X-Content-Type-Options: '+(xhr.getResponseHeader('X-Content-Type-Options')||'(ausente)'));line('URL final: '+(xhr.responseURL||'(nao suportado)'));var body=xhr.responseText||'';line('Inicio do conteudo: '+body.substring(0,450).replace(/\s+/g,' '));if(/\.xml(?:\?|$)/.test(path)){var m=body.match(/<\?xml-stylesheet\s+([^?]*)\?>/i);line('xml-stylesheet: '+(m?m[1]:'NAO ENCONTRADA'));}line('---');cb();}};xhr.onerror=function(){line('ERRO de rede: '+path);cb();};xhr.send(null);}catch(e){line('EXCECAO: '+e.message);cb();}}function run(){report='';line('PS4 - Verificacao MIME');line('Pagina: '+location.href);line('User-Agent: '+navigator.userAgent);line('---');inspect('ps4_xslt_teste.xml',function(){inspect('ps4_xslt_estilo.xsl',function(){line('FIM. Envie uma foto ou copie este relatorio.');});});}function copyReport(){var el=document.createElement('textarea');el.value=report;document.body.appendChild(el);el.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(el);}
</script></body></html>
