<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>page-cache-helper-inspector-disables-caches - PS4 adaptation</title>
<script>
"use strict";

/*
 * Adaptation of WebKit Bug 277294's helper.
 *
 * The original LayoutTest uses:
 *   internals.setResourceCachingDisabledByWebInspector(true)
 *
 * That internal API is not available in a normal page. This variant uses
 * fetch(..., { cache: "no-store" }) to force a resource request to bypass
 * the HTTP/resource cache before exercising history navigation.
 *
 * IMPORTANT:
 * cache:"no-store" is NOT equivalent to WebKit's internal
 * Page::setResourceCachingEnabled(false). A non-crash is therefore
 * inconclusive.
 */

let completed = false;

function finish() {
    if (completed)
        return;
    completed = true;

    /*
     * Keep the page quiet. The original test's interesting operation is
     * the navigation back to the previous HistoryItem.
     */
    setTimeout(function() {
        history.back();
    }, 0);
}

function start() {
    /*
     * Unique URL prevents reuse of a previously fetched resource.
     * no-store requests are intentionally used here as the public API
     * approximation of the original "disable caches" setup.
     */
    const url = "cache-probe.txt?nocache=" + Date.now() + "_" +
        Math.random().toString(36).slice(2);

    fetch(url, {
        method: "GET",
        cache: "no-store",
        credentials: "same-origin"
    }).then(function() {
        finish();
    }).catch(function() {
        /*
         * The resource itself is not the target of the test. Continue to
         * the BFCache/history operation even when the probe cannot load.
         */
        finish();
    });
}

/*
 * Give this document a previous HistoryItem, matching the navigation
 * structure required by the original page-cache test.
 */
window.addEventListener("load", function() {
    history.pushState({ step: 1 }, "", "#step1");

    setTimeout(function() {
        history.pushState({ step: 2 }, "", "#step2");
        setTimeout(start, 0);
    }, 0);
});
</script>
</head>
<body>
</body>
</html>
