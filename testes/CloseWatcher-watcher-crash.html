<script>
    // 1. Cria o elemento <pre> dinamicamente via JavaScript
    const logElement = document.createElement('pre');
    logElement.id = 'log';
    logElement.style.background = '#ffffff';
    logElement.style.color = '#ff0000';
    logElement.style.padding = '10px';
    logElement.style.fontFamily = 'monospace';
    
    // 2. Insere o elemento criado no corpo da página (body)
    document.body.appendChild(logElement);

    // 3. Função de log
    function log(msg) { 
        if (logElement) logElement.textContent += msg + '\n';
        console.log(msg);
    }
    
    window.onerror = function(message, source, lineno, colno, error) { 
        log(`[Erro] ${message} (${source}:${lineno}:${colno})`);
    };
    
    window.addEventListener('unhandledrejection', function(event) {
        log(`[Promise Rejection] ${event.reason}`);
    });

    // Testando
    log("Tudo criado e configurado via script!");
</script>
