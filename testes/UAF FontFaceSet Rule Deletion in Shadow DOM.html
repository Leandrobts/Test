<!DOCTYPE html><!-- https://github.com/WebKit/WebKit/commit/86074ba15be93258febe787413fb81d0ab8902dc -->
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
window.addEventListener("load", function () {
  setTimeout(function () {
    var host = document.createElement("div");
    document.body.appendChild(host);
    var sr = host.attachShadow({ mode: "open" });

    var s1 = document.createElement("style");
    s1.textContent =
      "@font-face{font-family:'pf';src:url('nosource.otf')}" +
      ":host>span{font-family:'pf';font-size:20px;display:block}";
    sr.appendChild(s1);

    var span = document.createElement("span");
    span.textContent = "X";
    sr.appendChild(span);

    void host.getBoundingClientRect();
    var s1Sheet = s1.sheet;

    if (document.fonts.status !== "loading") return;
    void document.fonts.ready;

    Object.defineProperty(FontFaceSet.prototype, "then", {
      configurable: true,
      get: function () {
        if (s1Sheet && s1Sheet.cssRules.length > 0) s1Sheet.deleteRule(0);
        void document.body.offsetWidth;
        if (s1Sheet && s1Sheet.cssRules.length > 0) s1Sheet.deleteRule(0);
        delete FontFaceSet.prototype.then;
        return undefined;
      }
    });

    var s2 = document.createElement("style");
    s2.textContent =
      "@font-face{font-family:'pf';src:url('nosource.otf')}" +
      ":host>span{font-family:'pf';font-size:20px;display:block}";
    sr.prepend(s2);

    void document.body.offsetWidth;
  }, 0);
});
</script>
</body>
</html>
