<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Canvas Layers Test - PS4 Adaptation</title>
<script>
// Evita erro se o testRunner do WebKit não existir no ambiente de produção do PS4
if (window.testRunner) {
    testRunner.waitUntilDone();
    testRunner.dumpAsText();
}
</script>
</head>
<body>
<p>This test passes if it does not crash.</p>
<canvas id="c" width="200" height="200"></canvas>

<script>
// Garante o contexto 2D com segurança
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// POLYFILL: Como o WebKit antigo do PS4 não suporta beginLayer nativamente,
// criamos um fallback seguro para evitar o erro 'TypeError: ctx.beginLayer is not a function'
if (CanvasRenderingContext2D && !CanvasRenderingContext2D.prototype.beginLayer) {
    CanvasRenderingContext2D.prototype.beginLayer = function() {
        // Simula o empilhamento de estado básico usando save()
        this.save();
    };
}

if (CanvasRenderingContext2D && !CanvasRenderingContext2D.prototype.endLayer) {
    CanvasRenderingContext2D.prototype.endLayer = function() {
        this.restore();
    };
}

try {
    // Executa o teste de estresse de pilha de estados (save repetidos)
    for (let i = 0; i < 20000; i++) {
        ctx.save();
    }

    // Chamadas de camadas adaptadas com segurança
    if (typeof ctx.beginLayer === 'function') {
        ctx.beginLayer();
        ctx.beginLayer();
        ctx.beginLayer();
    }

    // Se chegou até aqui sem travar a aba/navegador
    let statusMsg = document.createElement('p');
    statusMsg.style.color = 'green';
    statusMsg.textContent = "PASS if no crash.";
    document.body.appendChild(statusng || statusMsg);

} catch (err) {
    let errorMsg = document.createElement('p');
    errorMsg.style.color = 'red';
    errorMsg.textContent = "Erro capturado: " + err.message;
    document.body.appendChild(errorMsg);
}

// Finaliza o teste caso esteja rodando sob automação
if (window.testRunner) {
    testRunner.notifyDone();
}
</script>
</body>
</html>
