<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Test Input Type Change on Input Event</title>
</head>
<body>

<input id="input" type="date">
<div id="console" style="font-family: monospace; white-space: pre-wrap; margin-top: 10px;">Executando teste...</div>

<script>
const input = document.getElementById("input");
const consoleDiv = document.getElementById("console");

function logResult(message, isPass) {
    consoleDiv.innerHTML = `<span style="font-weight: bold; color: ${isPass ? 'green' : 'red'};">${isPass ? 'PASS' : 'FAIL'}</span> ${message}`;
}

// O teste original altera o tipo para "text" durante o evento input
input.addEventListener("input", () => {
    input.type = "text";
});

window.addEventListener("load", async () => {
    try {
        input.focus();
        
        // Como o ambiente padrão de navegador não possui o 'UIHelper.keyDown' do WebKit,
        // simulamos a entrada de dados alterando o valor e disparando o evento 'input'.
        input.value = "2012-09-02";
        input.dispatchEvent(new Event('input', { bubbles: true }));

        // Valida se o tipo mudou para 'text' sem causar travamentos (crash)[cite: 1]
        if (input.type === "text") {
            logResult("Did not crash and input.type successfully changed to 'text'.", true);
        } else {
            logResult(`Expected input.type to be 'text', but got '${input.type}'.`, false);
        }
    } catch (error) {
        logResult(`Test threw an unexpected error: ${error.message}`, false);
    }
});
</script>

</body>
</html>
