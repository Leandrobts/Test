<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Full-Screen Test</title>
</head>
<body>
<p>This test passes if it does not crash.</p>
<button id="fullscreen-btn">Iniciar Teste (Clique aqui)</button>
<div id="console" style="margin-top: 10px; font-family: monospace;">Aguardando gesto do usuário...</div>

<script>
function gc() {
    function gcRec(n) {
        if (n < 1)
            return {};
        var temp = {i: "ab" + i + (i / 100000)};
        temp += "foo";
        gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
        gcRec(10);
}

function logResult(message) {
    document.getElementById("console").innerHTML = message;
}

// O botão fornece o gesto de usuário necessário para liberar o Fullscreen
document.getElementById('fullscreen-btn').addEventListener('click', () => {
    try {
        const iframe = document.body.appendChild(document.createElement('iframe'));
        const div = iframe.contentDocument.body.appendChild(document.createElement('div'));

        // Usa o método padrão (ou com prefixo se necessário, mas os browsers modernos usam requestFullscreen)
        const requestFS = div.requestFullscreen || div.webkitRequestFullscreen;
        
        requestFS.call(div).catch((error) => {
            logResult("Fullscreen rejeitado ou falhou: " + error.message);
        });

        const contentDocument = iframe.contentDocument;
        document.body.removeChild(iframe);

        setTimeout(() => {
            // Mantendo a lógica exata do teste original usando o documento do iframe
            const cancelFS = contentDocument.exitFullscreen || contentDocument.webkitCancelFullScreen;
            if (cancelFS) {
                cancelFS.call(contentDocument);
            }
            
            gc();
            logResult("Teste concluído: Não travou (<span style='color:green'>OK</span>).");
        }, 0);
    } catch (e) {
        logResult("Erro durante o teste: " + e.message);
    }
});
</script>
</body>
</html>
