<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Full-Screen Test</title>
</head>
<body>
<p>This test passes if it does not crash.</p>

<!-- Iframe e Div já criados estáticamente no DOM -->
<iframe id="test-iframe" style="width: 200px; height: 200px;"></iframe>
<br>
<button id="fullscreen-btn">Iniciar Teste (Fullscreen)</button>
<div id="console" style="margin-top: 10px; font-family: monospace;">Aguardando ação...</div>

<script>
function gc() {
    function gcRec(n) {
          if (n < 1)
              return {};
          var temp = {i: "ab" + i + (i / 100000)};
          temp += "foo";
          gcRec(n-1);
    }
    for (var i = 0; i < 10000; i++)
    gcRec(10);
}


document.getElementById('fullscreen-btn').addEventListener('click', async () => {
    try {
        const iframe = document.getElementById('test-iframe');
        
        // Se a div interna ainda não existir no documento do iframe, criamos ela lá dentro
        let contentDoc = iframe.contentDocument || iframe.contentWindow.document;
        let div = contentDoc.getElementById('target-div');
        if (!div) {
            div = contentDoc.createElement('div');
            div.id = 'target-div';
            div.style.width = "100px";
            div.style.height = "100px";
            div.style.background = "blue";
            contentDoc.body.appendChild(div);
        }

        // Como o iframe e a div já existem e a ação é direta no clique, o navegador permite
        const requestFS = div.requestFullscreen || div.webkitRequestFullscreen;
        await requestFS.call(div);

        // Remove o iframe do DOM principal logo após entrar em fullscreen (replicando o teste original)
        iframe.parentNode.removeChild(iframe);

        setTimeout(() => {
            const cancelFS = contentDoc.exitFullscreen || contentDoc.webkitCancelFullScreen;
            if (cancelFS) {
                cancelFS.call(contentDoc);
            }
            gc();
            document.getElementById("console").innerHTML = "Teste concluído sem travamentos (<span style='color:green'>OK</span>).";
        }, 0);

    } catch (error) {
        document.getElementById("console").innerHTML = "Erro: " + error.message;
    }
});
</script>
</body>
</html>
